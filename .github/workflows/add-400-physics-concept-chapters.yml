name: Add 400 Physics Concept Chapters
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/add-400-physics-concept-chapters.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 400 concept chapter path
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-home.html')
          s=p.read_text(encoding='utf-8')
          if 'PHYSICS 400 CONCEPT CHAPTERS V1' in s:
              print('400 chapter layer already present')
              raise SystemExit(0)
          js=r'''<script id="physics-400-concepts">
          /* PHYSICS 400 CONCEPT CHAPTERS V1 */
          (()=>{
            const units=[
            ['Physics & Measurement','📏',['Physical quantities','Units of measurement','SI base units','Derived units','Unit systems','SI prefixes','Unit conversion','Dimensions','Dimensional formulae','Dimensional analysis','Dimensional equations','Principle of homogeneity','Significant figures','Rounding off','Precision and accuracy','Least count','Absolute error','Relative error','Percentage error','Propagation of errors']],
            ['Kinematics','🏃',['Frame of reference','Position and displacement','Distance and displacement','Speed','Velocity','Average speed','Average velocity','Instantaneous velocity','Acceleration','Average acceleration','Instantaneous acceleration','Uniform motion','Non-uniform motion','Motion graphs','Position-time graph','Velocity-time graph','Acceleration-time graph','Equations of motion','Relative motion','Projectile motion']],
            ['Laws of Motion','⚖️',['Force','Inertia','Newton’s first law','Newton’s second law','Newton’s third law','Momentum','Impulse','Conservation of momentum','Free-body diagrams','Equilibrium of a particle','Normal reaction','Tension','Friction','Static friction','Kinetic friction','Limiting friction','Coefficient of friction','Inclined plane','Connected bodies','Circular motion dynamics']],
            ['Work, Energy & Power','💪',['Work','Positive and negative work','Work by variable force','Work-energy theorem','Kinetic energy','Potential energy','Gravitational potential energy','Elastic potential energy','Conservation of mechanical energy','Conservative forces','Non-conservative forces','Power','Average power','Instantaneous power','Spring work','Collision energy','Elastic collision','Inelastic collision','Coefficient of restitution','Energy conservation in collisions']],
            ['System of Particles & COM','🎯',['Centre of mass','Centre of mass of two particles','Centre of mass of a system','Centre of mass of a uniform rod','Motion of centre of mass','Momentum of a system','Conservation of system momentum','External force and COM','Two-body motion','Reduced mass','Linear momentum of a system','Impulse for a system','Centre of mass coordinates','Symmetry and centre of mass','Composite bodies','Mass distribution','Centre of mass and gravity','COM in collisions','Rocket propulsion basics','Variable mass systems']],
            ['Rotational Motion','🔄',['Angular displacement','Angular velocity','Angular acceleration','Rotational kinematics','Torque','Moment of force','Angular momentum','Conservation of angular momentum','Moment of inertia','Radius of gyration','Parallel-axis theorem','Perpendicular-axis theorem','Moments of inertia of standard bodies','Rotational kinetic energy','Rolling motion','Pure rolling','Rolling on an incline','Angular momentum of rigid body','Equilibrium of rigid body','Gyroscope basics']],
            ['Gravitation','🌍',['Universal law of gravitation','Gravitational field','Gravitational field intensity','Gravitational potential','Gravitational potential energy','Gravitational potential due to a mass','Acceleration due to gravity','Variation of g with altitude','Variation of g with depth','Gravitational mass','Inertial mass','Escape velocity','Orbital velocity','Satellites','Geostationary satellite','Geosynchronous satellite','Energy of an orbiting satellite','Kepler’s laws','Planetary motion','Weightlessness']],
            ['Properties of Solids','🧱',['Elasticity','Plasticity','Stress','Strain','Longitudinal stress','Shear stress','Volume stress','Longitudinal strain','Shear strain','Volume strain','Hooke’s law','Young’s modulus','Bulk modulus','Shear modulus','Elastic limit','Stress-strain curve','Elastic potential energy','Energy density in a stretched wire','Poisson’s ratio','Applications of elasticity']],
            ['Properties of Fluids','💧',['Pressure','Hydrostatic pressure','Pascal’s law','Hydraulic machines','Buoyant force','Archimedes’ principle','Relative density','Streamline flow','Turbulent flow','Equation of continuity','Bernoulli’s theorem','Applications of Bernoulli’s theorem','Torricelli’s theorem','Viscosity','Coefficient of viscosity','Stokes’ law','Terminal velocity','Surface tension','Capillarity','Excess pressure in drops and bubbles']],
            ['Thermal Properties of Matter','🌡️',['Temperature','Thermal equilibrium','Zeroth law','Heat','Specific heat capacity','Molar heat capacity','Calorimetry','Latent heat','Change of state','Thermal expansion','Linear expansion','Area expansion','Volume expansion','Anomalous expansion of water','Heat transfer','Conduction','Convection','Radiation','Newton’s law of cooling','Thermal conductivity']],
            ['Thermodynamics','🔥',['Thermodynamic system','Thermodynamic variables','State variables','Thermodynamic equilibrium','Thermodynamic process','Quasi-static process','Isothermal process','Adiabatic process','Isochoric process','Isobaric process','Work done by gas','Internal energy','First law of thermodynamics','Heat capacity','Specific heat at constant volume','Specific heat at constant pressure','Second law of thermodynamics','Heat engine','Refrigerator','Carnot cycle']],
            ['Kinetic Theory of Gases','💨',['Molecular nature of matter','Ideal gas','Gas laws','Equation of state','Molecular speed','Root mean square speed','Average speed','Most probable speed','Kinetic interpretation of temperature','Pressure of an ideal gas','Kinetic energy of gas molecules','Degrees of freedom','Law of equipartition','Specific heat of gases','Mean free path','Avogadro number','Boltzmann constant','Internal energy of ideal gas','Monatomic gas','Diatomic gas']],
            ['Oscillations','〰️',['Periodic motion','Oscillatory motion','Simple harmonic motion','Displacement in SHM','Amplitude','Phase','Angular frequency','Time period','Frequency','Velocity in SHM','Acceleration in SHM','Force in SHM','Energy in SHM','Potential energy in SHM','Kinetic energy in SHM','Simple pendulum','Spring-mass system','Combination of springs','Damped oscillations','Forced oscillations and resonance']],
            ['Waves','🌊',['Wave motion','Transverse waves','Longitudinal waves','Wave parameters','Wavelength','Frequency of a wave','Wave speed','Progressive wave','Wave equation','Phase difference','Superposition principle','Interference of waves','Standing waves','Nodes and antinodes','String waves','Speed of transverse wave on string','Sound waves','Speed of sound','Beats','Doppler effect']],
            ['Electrostatics','⚡',['Electric charge','Conservation of charge','Coulomb’s law','Superposition of charges','Electric field','Electric field intensity','Electric field lines','Electric dipole','Dipole moment','Electric field of a dipole','Torque on a dipole','Electric flux','Gauss’s law','Applications of Gauss’s law','Electric potential','Potential difference','Potential due to point charge','Potential due to dipole','Equipotential surfaces','Electrostatic shielding']],
            ['Capacitance & Current Electricity','🔌',['Capacitor','Capacitance','Parallel-plate capacitor','Dielectric','Effect of dielectric','Energy stored in capacitor','Energy density','Combination of capacitors','Charging capacitor','Discharging capacitor','Electric current','Drift velocity','Mobility','Ohm’s law','Resistance','Resistivity','Temperature dependence of resistance','Series and parallel resistors','Kirchhoff’s laws','Wheatstone bridge']],
            ['Magnetic Effects & Magnetism','🧲',['Magnetic field','Magnetic force on charge','Lorentz force','Motion of charge in magnetic field','Force on current-carrying conductor','Biot-Savart law','Magnetic field of straight wire','Magnetic field of circular loop','Ampere’s law','Solenoid','Toroid','Force between parallel currents','Torque on current loop','Moving coil galvanometer','Ammeter','Voltmeter','Magnetic dipole','Earth’s magnetism','Magnetic materials','Magnetic hysteresis']],
            ['Electromagnetic Induction & AC','〽️',['Magnetic flux','Faraday’s law','Lenz’s law','Motional emf','Induced current','Self-inductance','Mutual inductance','Inductor','Energy stored in inductor','AC voltage','AC current','RMS value','Average value of AC','Reactance','Inductive reactance','Capacitive reactance','Impedance','Series LCR circuit','Resonance in AC circuit','Transformer']],
            ['Electromagnetic Waves & Optics','📡',['Electromagnetic waves','Displacement current','Electromagnetic spectrum','Radio waves','Microwaves','Infrared radiation','Visible light','Ultraviolet radiation','X-rays','Gamma rays','Reflection of light','Refraction of light','Snell’s law','Total internal reflection','Spherical mirrors','Mirror formula','Lens','Lens formula','Power of lens','Optical instruments']],
            ['Modern Physics & Electronics','⚛️',['Photoelectric effect','Einstein photoelectric equation','Photon','Matter waves','de Broglie wavelength','Atomic spectra','Bohr model','Hydrogen atom','Energy levels','Nuclear structure','Mass defect','Binding energy','Radioactivity','Radioactive decay','Half-life','Nuclear fission','Nuclear fusion','Semiconductors','p-n junction diode','Digital logic gates']]
            ];
            const flat=units.flatMap((u,ui)=>u[2].map((name,ci)=>({name,ui,ci,unit:u[0],icon:u[1]})));
            const path=document.querySelector('.path');
            if(!path||flat.length!==400)return;
            const esc=x=>x.replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
            path.innerHTML=units.map((u,ui)=>`<section class="physics-400-unit"><div class="physics-400-unit-head"><span>${u[1]}</span><div><b>Unit ${ui+1}</b><strong>${esc(u[0])}</strong><small>${u[2].length} concepts</small></div></div>${u[2].map((name,ci)=>{const n=ui*20+ci+1;const href='physics-concept.html?concept='+encodeURIComponent(name);return `<div class="lesson physics-400-lesson"><div class="node"></div><a class="chapter-card physics-400-card" href="${href}"><div class="chapter-main"><h3><span class="duo-physics-icon"><span class="duo-symbol">${u[1]}</span></span><span>${n}. ${esc(name)}</span></h3><p>${esc(u[0])} • Concept ${ci+1} of 20</p><div class="meta"><span class="tag">CONCEPT</span><span class="tag">+10 XP</span></div></div><span class="go">›</span></a></div>`}).join('')}</section>`).join('');
            const count=document.querySelector('.progress-row'); if(count) count.innerHTML='<span>Physics Concept Path</span><b>0 / 400 CONCEPTS</b>';
            const bar=document.querySelector('.bar i'); if(bar) bar.style.width='0%';
            document.querySelectorAll('.stat b')[0]?.replaceChildren(document.createTextNode('400'));
            const old=document.getElementById('physics-400-style'); if(old)old.remove();
            const st=document.createElement('style');st.id='physics-400-style';st.textContent=`
            .physics-400-unit{margin:26px 0 16px}.physics-400-unit-head{display:flex;align-items:center;gap:12px;margin:0 0 10px;padding:12px 14px;border-radius:18px;background:#fff;border:2px solid #d9e5f2;box-shadow:0 7px 18px rgba(18,59,112,.08)}
            .physics-400-unit-head>span{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:25px;background:#e9f2ff;box-shadow:0 4px 0 #b5cfe9}.physics-400-unit-head b{display:block;font-size:8px;letter-spacing:1px;color:#6b7280}.physics-400-unit-head strong{display:block;color:#123b70;font-size:16px}.physics-400-unit-head small{display:block;margin-top:2px;color:#6b7280;font-size:9px}.physics-400-lesson{margin:9px 0 9px 48px}.physics-400-card{min-height:82px}.physics-400-card h3{display:flex!important;align-items:center!important;gap:10px!important}.physics-400-card .duo-physics-icon{width:48px;height:48px;flex-basis:48px;font-size:25px}.physics-400-card .meta .tag:first-child{background:#eaf4ff;color:#125fc9}.physics-400-card .meta .tag:last-child{background:#fff4cf;color:#8a6900}.physics-400-card:hover{transform:translateY(-4px) scale(1.005)}
            @media(max-width:700px){.physics-400-unit-head{padding:10px}.physics-400-unit-head strong{font-size:13px}.physics-400-lesson{margin-left:30px}.physics-400-card h3{font-size:11px!important}.physics-400-card .duo-physics-icon{width:40px;height:40px;flex-basis:40px;font-size:21px}.physics-400-card{min-height:70px}}
            `;document.head.appendChild(st);
            const search=document.querySelector('.search'); if(search){search.placeholder='Search 400 Physics concepts…';search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();document.querySelectorAll('.physics-400-lesson').forEach(x=>x.style.display=!q||x.innerText.toLowerCase().includes(q)?'':'none')})}
          })();
          </script>'''
          s=s.replace('</body>',js+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify 400 concepts
        run: |
          grep -q 'PHYSICS 400 CONCEPT CHAPTERS V1' physics-home.html
          test "$(grep -o "\['[^]]*','[^]]*',\[" physics-home.html | wc -l)" -ge 20
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-home.html
          git commit -m 'Add all 400 Physics concepts as chapters' || true
          git push
          rm -f .github/workflows/add-400-physics-concept-chapters.yml
          git add .github/workflows/add-400-physics-concept-chapters.yml
          git commit -m 'Remove one-time 400 Physics chapter workflow' || true
          git push
