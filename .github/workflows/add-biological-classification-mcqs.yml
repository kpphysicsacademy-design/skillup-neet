name: Add Biological Classification MCQs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add-mcqs:
    if: ${{ !contains(github.event.head_commit.message, 'Add 20 NEET MCQs to Biological Classification') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add 20 NEET MCQs
        shell: python
        run: |
          from pathlib import Path
          import json
          p=Path('zoology-chapter-test.html')
          s=p.read_text(encoding='utf-8')
          marker='/* SKILLUP-BC-EXTRA-20 */'
          if marker in s:
              print('Already added'); raise SystemExit(0)
          new=[
          {"q":"Which of the following is a major criterion used by Whittaker in five-kingdom classification?","o":["Mode of nutrition","Body colour only","Geographical range only","Body temperature only"],"a":"Mode of nutrition","e":"Whittaker considered cell structure, body organisation, mode of nutrition, reproduction and phylogenetic relationships."},
          {"q":"Which kingdom contains organisms with prokaryotic cellular organisation?","o":["Monera","Protista","Fungi","Animalia"],"a":"Monera","e":"Monerans are prokaryotes and lack a true membrane-bound nucleus."},
          {"q":"Archaebacteria differ from eubacteria mainly in their:","o":["Cell wall and membrane characteristics","Absence of genetic material","Lack of ribosomes","Multicellular organisation"],"a":"Cell wall and membrane characteristics","e":"Archaebacteria possess distinctive cell wall and membrane features that help many species survive extreme environments."},
          {"q":"Which archaebacteria are associated with marshes and the rumen of cattle?","o":["Methanogens","Halophiles","Thermoacidophiles","Cyanobacteria"],"a":"Methanogens","e":"Methanogens occur in anaerobic environments including cattle rumen and produce methane."},
          {"q":"Which organism is a cyanobacterium?","o":["Anabaena","Amoeba","Paramecium","Rhizopus"],"a":"Anabaena","e":"Anabaena is a photosynthetic cyanobacterium and can fix atmospheric nitrogen using specialised cells."},
          {"q":"Heterocysts in cyanobacteria are primarily associated with:","o":["Nitrogen fixation","Photosynthetic pigment storage only","Locomotion","Sexual reproduction"],"a":"Nitrogen fixation","e":"Heterocysts provide a suitable low-oxygen environment for nitrogen fixation."},
          {"q":"Which protist possesses a silica-rich cell wall?","o":["Diatom","Amoeba","Paramecium","Plasmodium"],"a":"Diatom","e":"Diatom cell walls are impregnated with silica and form durable deposits after death."},
          {"q":"The phenomenon of red tides is associated mainly with:","o":["Dinoflagellates","Diatoms","Slime moulds","Ciliates"],"a":"Dinoflagellates","e":"Blooms of certain dinoflagellates can colour marine water reddish and may release toxins."},
          {"q":"Which protist is known for forming plasmodium-like masses during its life cycle?","o":["Slime mould","Diatom","Dinoflagellate","Euglena"],"a":"Slime mould","e":"Slime moulds are saprophytic protists that can form multinucleate plasmodial stages."},
          {"q":"Which organism is commonly used as an example of a mixotrophic protist?","o":["Euglena","Amoeba","Paramecium","Plasmodium"],"a":"Euglena","e":"Euglena can photosynthesise and can also obtain organic nutrients heterotrophically under suitable conditions."},
          {"q":"Which feature is characteristic of fungi?","o":["Absorptive heterotrophic nutrition","Ingestion of food by mouth","Chlorophyll in all cells","Peptidoglycan cell wall"],"a":"Absorptive heterotrophic nutrition","e":"Fungi digest food extracellularly and absorb the soluble products through their hyphae."},
          {"q":"The fungal body is commonly composed of thread-like structures called:","o":["Hyphae","Cilia","Flagella","Heterocysts"],"a":"Hyphae","e":"Hyphae are filamentous structures that collectively form the mycelium of many fungi."},
          {"q":"Which fungal group traditionally includes Penicillium and Aspergillus?","o":["Ascomycetes","Basidiomycetes","Phycomycetes","Monera"],"a":"Ascomycetes","e":"Penicillium and Aspergillus are commonly cited as ascomycetous fungi in the NCERT classification."},
          {"q":"Which fungal group traditionally includes Agaricus?","o":["Basidiomycetes","Ascomycetes","Phycomycetes","Protista"],"a":"Basidiomycetes","e":"Agaricus, the common mushroom, is a basidiomycete producing basidiospores on basidia."},
          {"q":"Which fungal group traditionally includes Rhizopus?","o":["Phycomycetes","Basidiomycetes","Ascomycetes","Monera"],"a":"Phycomycetes","e":"Rhizopus is traditionally placed in Phycomycetes in the NCERT five-kingdom discussion."},
          {"q":"Which structure surrounds the genetic material of a typical virus?","o":["Protein coat","Cell wall","Cell membrane only","Chitin wall"],"a":"Protein coat","e":"The viral genome is enclosed by a protein coat called the capsid; some viruses also have an envelope."},
          {"q":"Viruses are called obligate parasites because they:","o":["Replicate only inside living host cells","Can reproduce freely in water","Have independent cellular metabolism","Are multicellular"],"a":"Replicate only inside living host cells","e":"Viruses depend on host-cell machinery for replication and cannot reproduce independently."},
          {"q":"Which statement correctly describes lichens?","o":["They are a symbiotic association of a photosynthetic partner and a fungus","They are viruses infecting algae","They are colonies of only fungi","They are bacterial spores"],"a":"They are a symbiotic association of a photosynthetic partner and a fungus","e":"The photosynthetic partner supplies organic food, while the fungal partner provides shelter and helps with water and minerals."},
          {"q":"Diatomaceous earth is commercially useful mainly because it is rich in:","o":["Silica","Chitin","Peptidoglycan","Cellulose"],"a":"Silica","e":"Diatomaceous earth consists largely of the silica-rich remains of diatoms and has several industrial uses."},
          {"q":"Which pairing is correctly matched?","o":["Methanogen — methane production","Diatom — chitin wall","Fungus — chlorophyll nutrition","Virus — independent metabolism"],"a":"Methanogen — methane production","e":"Methanogens produce methane under anaerobic conditions; the other pairings are incorrect."}
          ]
          start=s.index("'Biological Classification':[")
          end=s.index("],\n'Animal Kingdom'",start)
          addition='\n'+marker+'\n'+','.join(json.dumps(x,ensure_ascii=False,separators=(',',':')) for x in new)+','
          s=s[:end]+addition+s[end:]
          p.write_text(s,encoding='utf-8')
          print('Added',len(new),'MCQs')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zoology-chapter-test.html
          git diff --cached --quiet && exit 0
          git commit -m "Add 20 NEET MCQs to Biological Classification"
          git push
