name: Add Duolingo style Physics icons
on:
  push:
    paths:
      - '.github/workflows/add-duolingo-css-icons-physics.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add icon system
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('physics-home.html')
          s=p.read_text(encoding='utf-8')
          css=r'''
          /* DUOLINGO-STYLE PHYSICS ICONS */
          .duo-physics-icon{position:relative;width:58px;height:58px;flex:0 0 58px;border-radius:18px;display:grid;place-items:center;font-size:30px;line-height:1;background:linear-gradient(145deg,#fff,#eaf4ff);border:2px solid #cfe2f6;box-shadow:0 5px 0 #b5cfe9,0 10px 18px rgba(18,59,112,.10);overflow:hidden;transform:translateZ(0);transition:transform .18s ease,box-shadow .18s ease}
          .duo-physics-icon:before{content:"";position:absolute;left:7px;right:7px;top:5px;height:12px;border-radius:999px;background:rgba(255,255,255,.9);transform:rotate(-8deg);pointer-events:none}
          .duo-physics-icon:after{content:"";position:absolute;inset:auto 7px 5px 7px;height:4px;border-radius:99px;background:rgba(18,59,112,.10);pointer-events:none}
          .duo-physics-icon .duo-symbol{position:relative;z-index:2;filter:drop-shadow(0 2px 1px rgba(18,59,112,.16));animation:duo-icon-float 2.8s ease-in-out infinite}
          .chapter-card:hover .duo-physics-icon{transform:translateY(-3px) rotate(-3deg) scale(1.06);box-shadow:0 7px 0 #a7c6e7,0 14px 24px rgba(18,59,112,.15)}
          .chapter-card:active .duo-physics-icon{transform:translateY(1px) scale(.98);box-shadow:0 3px 0 #b5cfe9,0 6px 12px rgba(18,59,112,.10)}
          .duo-physics-icon[data-icon="measurement"]{background:linear-gradient(145deg,#fff8d9,#eaf5ff)}
          .duo-physics-icon[data-icon="kinematics"]{background:linear-gradient(145deg,#e8f8ff,#eef1ff)}
          .duo-physics-icon[data-icon="laws"]{background:linear-gradient(145deg,#fff0ee,#fff8df)}
          .duo-physics-icon[data-icon="energy"]{background:linear-gradient(145deg,#fff8d9,#fff0cf)}
          .duo-physics-icon[data-icon="rotation"]{background:linear-gradient(145deg,#f0edff,#e7f4ff)}
          .duo-physics-icon[data-icon="gravity"]{background:linear-gradient(145deg,#eaf8e8,#eaf3ff)}
          .duo-physics-icon[data-icon="matter"]{background:linear-gradient(145deg,#e8fbf6,#edf4ff)}
          .duo-physics-icon[data-icon="thermo"]{background:linear-gradient(145deg,#fff0e8,#fff8d9)}
          .duo-physics-icon[data-icon="kinetic"]{background:linear-gradient(145deg,#eaf5ff,#e8fbf6)}
          .duo-physics-icon[data-icon="waves"]{background:linear-gradient(145deg,#eeeaff,#eaf5ff)}
          .duo-physics-icon[data-icon="electrostatics"]{background:linear-gradient(145deg,#fff8d9,#fff0ee)}
          .duo-physics-icon[data-icon="current"]{background:linear-gradient(145deg,#e8f8ff,#fff8d9)}
          .duo-physics-icon[data-icon="magnetism"]{background:linear-gradient(145deg,#f0edff,#ffecef)}
          .duo-physics-icon[data-icon="emi"]{background:linear-gradient(145deg,#e9f5ff,#f0edff)}
          .duo-physics-icon[data-icon="emwaves"]{background:linear-gradient(145deg,#e9f8ff,#f1edff)}
          .duo-physics-icon[data-icon="optics"]{background:linear-gradient(145deg,#eef0ff,#fff8d9)}
          .duo-physics-icon[data-icon="dual"]{background:linear-gradient(145deg,#f1edff,#e9f8ff)}
          .duo-physics-icon[data-icon="atoms"]{background:linear-gradient(145deg,#eaf8e8,#f0edff)}
          .duo-physics-icon[data-icon="electronics"]{background:linear-gradient(145deg,#e8f8ff,#e8fbf6)}
          .duo-physics-icon[data-icon="experiment"]{background:linear-gradient(145deg,#fff8d9,#e8fbf6)}
          @keyframes duo-icon-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
          @media(max-width:700px){.duo-physics-icon{width:48px;height:48px;flex-basis:48px;border-radius:15px;font-size:25px;box-shadow:0 4px 0 #b5cfe9,0 7px 13px rgba(18,59,112,.09)}.duo-physics-icon:before{left:6px;right:6px}.chapter-card:hover .duo-physics-icon{box-shadow:0 5px 0 #a7c6e7,0 10px 18px rgba(18,59,112,.13)}}
          @media(prefers-reduced-motion:reduce){.duo-physics-icon .duo-symbol{animation:none}.chapter-card:hover .duo-physics-icon{transform:none}}
          '''
          js=r'''
          <script>
          (function(){
            const icons=[
              ['measurement','📏'],['kinematics','🏃'],['laws','⚖️'],['energy','⚡'],['rotation','🔄'],
              ['gravity','🌍'],['matter','💧'],['thermo','🔥'],['kinetic','💨'],['waves','〰️'],
              ['electrostatics','⚡'],['current','🔌'],['magnetism','🧲'],['emi','〽️'],['emwaves','📡'],
              ['optics','🔭'],['dual','☯️'],['atoms','⚛️'],['electronics','💻'],['experiment','🧪']
            ];
            function apply(){
              const cards=[...document.querySelectorAll('.chapter-card')];
              cards.forEach((card,i)=>{
                if(!icons[i]) return;
                let old=card.querySelector('.chapter-icon');
                if(old) old.remove();
                let icon=card.querySelector('.duo-physics-icon');
                if(!icon){
                  icon=document.createElement('div');
                  icon.className='duo-physics-icon';
                  const main=card.querySelector('.chapter-main');
                  if(main) card.insertBefore(icon,main); else card.prepend(icon);
                }
                icon.dataset.icon=icons[i][0];
                icon.setAttribute('aria-hidden','true');
                icon.innerHTML='<span class="duo-symbol">'+icons[i][1]+'</span>';
              });
            }
            apply();
            new MutationObserver(apply).observe(document.body,{childList:true,subtree:true});
          })();
          </script>
          '''
          marker='/* DUOLINGO-STYLE PHYSICS ICONS */'
          if marker not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          if '/* DUOLINGO-STYLE PHYSICS ICONS JS */' not in s:
              js=js.replace('<script>','<script>\n/* DUOLINGO-STYLE PHYSICS ICONS JS */',1)
              s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'DUOLINGO-STYLE PHYSICS ICONS' physics-home.html
          grep -q 'duo-physics-icon' physics-home.html
          grep -q 'duo-symbol' physics-home.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-home.html
          git diff --cached --quiet || git commit -m 'Add Duolingo style Physics icons with CSS'
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          git rm -f .github/workflows/add-duolingo-css-icons-physics.yml || true
          git diff --cached --quiet || git commit -m 'Remove one-time Physics icon workflow'
          git push || true
