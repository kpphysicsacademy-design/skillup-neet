name: Fix Physics concept routes
on: push
permissions:
  contents: write
jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add routes
        shell: python
        run: |
          from pathlib import Path
          p=Path('physics-concept.html')
          s=p.read_text(encoding='utf-8')
          routes=[
            ("'equations of motion':'physics-equations-of-motion.html'", "'motion graph':'physics-motion-graphs.html'", "'motion graph':'physics-motion-graphs.html','equations of motion':'physics-equations-of-motion.html','equation of motion':'physics-equations-of-motion.html','equations of motions':'physics-equations-of-motion.html'"),
            ("'uniform motion':'physics-uniform-motion.html'", "'projectile motion':'physics-projectile-motion.html'", "'projectile motion':'physics-projectile-motion.html','projectile':'physics-projectile-motion.html','uniform motion':'physics-uniform-motion.html','uniform':'physics-uniform-motion.html'"),
          ]
          for present,marker,replacement in routes:
              if present not in s:
                  if marker not in s:
                      raise SystemExit(f'Route marker not found: {marker}')
                  s=s.replace(marker,replacement,1)
          p.write_text(s,encoding='utf-8')
      - name: Verify routes
        run: |
          grep -q "uniform motion.*physics-uniform-motion.html" physics-concept.html
          grep -q "projectile motion.*physics-projectile-motion.html" physics-concept.html
          grep -q "equations of motion.*physics-equations-of-motion.html" physics-concept.html
      - name: Commit route changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-concept.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add Uniform Motion and Physics concept routes'
          git push
