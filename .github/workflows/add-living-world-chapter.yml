name: Add The Living World chapter to Zoology Unit 1
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/trigger-add-living-world.txt'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert chapter
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='zoology-full-path.html';
          let s=fs.readFileSync(p,'utf8');
          if(!s.includes("name:'The Living World'")){
            const anchor="name:'Animal Kingdom',icon:'🦁'";
            const i=s.indexOf(anchor);
            if(i<0) throw new Error('Animal Kingdom anchor not found');
            const lineStart=s.lastIndexOf('{',i);
            const lineEnd=s.indexOf('\n',i);
            const insert=" {unit:'UNIT 1',unitTitle:'Diversity in Living World',name:'The Living World',icon:'🌍',desc:'Characteristics of living organisms, biodiversity, taxonomy, nomenclature and species'},\n";
            s=s.slice(0,lineStart)+insert+s.slice(lineStart);
          }
          fs.writeFileSync(p,s);
          NODE
      - name: Validate
        run: |
          node - <<'NODE'
          const fs=require('fs'); const s=fs.readFileSync('zoology-full-path.html','utf8');
          if(!s.includes("name:'The Living World'")) throw new Error('chapter missing');
          const a=s.indexOf("name:'What is Living?'"), b=s.indexOf("name:'The Living World'"), c=s.indexOf("name:'Biological Classification'"), d=s.indexOf("name:'Animal Kingdom'");
          if(!(a<b && b<c && c<d)) throw new Error('Unit 1 order invalid');
          console.log('Validated: What is Living? → The Living World → Biological Classification → Animal Kingdom');
          NODE
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zoology-full-path.html
          git commit -m 'Add The Living World chapter to Zoology Unit 1' || echo 'No changes'
          git push
