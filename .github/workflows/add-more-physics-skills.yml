name: Add more Duolingo-style Physics skills
on:
  push:
    paths:
      - '.github/workflows/add-more-physics-skills.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add skill system
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('physics-home.html')
          s=p.read_text(encoding='utf-8')
          marker='/* SKILLUP PHYSICS MORE SKILLS V1 */'
          if marker in s:
              raise SystemExit('Already enhanced')
          css='''
          <style>
          /* SKILLUP PHYSICS MORE SKILLS V1 */
          .chapter-card{border-radius:22px!important;box-shadow:0 5px 0 #c9d9ea,0 12px 24px rgba(18,59,112,.10)!important;transition:transform .16s ease,box-shadow .16s ease!important}
          .chapter-card:hover{transform:translateY(-5px)!important;box-shadow:0 8px 0 #b7cde5,0 18px 32px rgba(18,59,112,.16)!important}
          .chapter-card:active{transform:translateY(2px)!important;box-shadow:0 2px 0 #b7cde5,0 7px 14px rgba(18,59,112,.10)!important}
          .chapter-icon,.concept-svg{position:relative;overflow:hidden;border-radius:16px!important;box-shadow:inset 0 -3px 0 rgba(18,59,112,.10),0 4px 8px rgba(18,59,112,.08)!important}
          .chapter-icon:after,.concept-svg:after{content:'';position:absolute;left:10%;right:10%;top:7%;height:28%;border-radius:999px;background:rgba(255,255,255,.42);pointer-events:none}
          .chapter-main h3:after{content:'★';font-size:11px;color:#f5b400;margin-left:auto;opacity:.9}
          .go{box-shadow:0 4px 0 #0e56b5!important}
          .go:hover{transform:scale(1.08) rotate(2deg)!important}
          .skill-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
          .skill-badge{display:inline-flex;align-items:center;gap:3px;padding:4px 7px;border-radius:999px;background:#f3f8ff;border:1px solid #d5e5f5;color:#48627d;font-size:8px;font-weight:950}
          .skill-badge.xp{background:#fff8df;border-color:#f2df9a;color:#8a6900}
          .skill-badge.master{background:#edf9f1;border-color:#c9e9d2;color:#23733c}
          .skill-progress{height:6px;background:#e6eef7;border-radius:999px;overflow:hidden;margin-top:8px}
          .skill-progress i{display:block;width:12%;height:100%;border-radius:999px;background:linear-gradient(90deg,#1677ff,#55a7ff);animation:skill-grow 1.1s ease-out both}
          @keyframes skill-grow{from{width:0}to{width:12%}}
          .chapter-card:hover .skill-progress i{width:28%}
          .skill-flair{position:absolute;right:10px;top:9px;font-size:15px;animation:skill-float 2s ease-in-out infinite}
          @keyframes skill-float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-3px) rotate(4deg)}}
          @media(max-width:700px){.skill-badge{font-size:7px;padding:3px 6px}.skill-flair{font-size:13px}.chapter-main h3:after{font-size:9px}}
          @media(prefers-reduced-motion:reduce){.skill-flair,.skill-progress i{animation:none!important}.chapter-card{transition:none!important}}
          </style>
          '''
          s=s.replace('</head>',css+'</head>',1)
          js='''
          <script>
          (()=>{
            const enhance=()=>document.querySelectorAll('.chapter-card').forEach((card,i)=>{
              if(card.querySelector('.skill-badges')) return;
              const n=i+1;
              const badges=document.createElement('div'); badges.className='skill-badges';
              badges.innerHTML=`<span class="skill-badge">🎯 SKILL ${n}</span><span class="skill-badge xp">⚡ +10 XP</span><span class="skill-badge master">🏆 MASTER</span>`;
              const prog=document.createElement('div'); prog.className='skill-progress'; prog.innerHTML='<i></i>';
              card.style.position='relative';
              const flair=document.createElement('span'); flair.className='skill-flair'; flair.textContent=['✨','🎯','🚀','💡','🏆'][i%5];
              card.append(flair);
              const main=card.querySelector('.chapter-main');
              if(main){main.append(badges,prog)}
            });
            new MutationObserver(enhance).observe(document.body,{childList:true,subtree:true});
            enhance();
          })();
          </script>
          '''
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'SKILLUP PHYSICS MORE SKILLS V1' physics-home.html
          grep -q 'skill-badges' physics-home.html
          grep -q 'skill-progress' physics-home.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-home.html
          git diff --cached --quiet || git commit -m 'Add XP mastery and skill badges to Physics path'
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          git rm -f .github/workflows/add-more-physics-skills.yml || true
          git diff --cached --quiet || git commit -m 'Remove one-time Physics skills workflow'
          git push || true
