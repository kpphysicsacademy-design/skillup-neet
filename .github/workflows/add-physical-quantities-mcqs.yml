name: Add Physical Quantities MCQs

on:
  push:
    paths:
      - '.github/workflows/add-physical-quantities-mcqs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add dedicated Physical Quantities quiz
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('physics-concept.html')
          s = p.read_text(encoding='utf-8')

          marker = "const exactUnits=meta.concept.toLowerCase()==='units of measurement';"
          if "const exactPhysical=meta.concept.toLowerCase()==='physical quantities';" not in s:
              bank = r'''const physicalQuantitiesQuiz=[
['What is meant by a physical quantity?',['A quantity that can be measured and expressed by a number and a unit','A quantity that has no measurable value','A quantity that always has direction','A quantity used only in mathematics'],0,'A physical quantity is measurable and is expressed using a numerical value and an appropriate unit.'],
['Which of the following is a physical quantity?',['Length','Beauty','Honesty','Intelligence'],0,'Length can be measured and assigned a numerical value with a unit.'],
['A measured physical quantity is normally written as:',['Numerical value × unit','Numerical value + direction only','Unit ÷ numerical value','Unit alone'],0,'A measurement combines a numerical value with a unit.'],
['Which of the following is an SI base quantity?',['Length','Velocity','Force','Density'],0,'Length is one of the seven SI base quantities.'],
['Which of the following is a derived physical quantity?',['Velocity','Mass','Time','Temperature'],0,'Velocity is obtained from length divided by time.'],
['Which of the following is a scalar physical quantity?',['Mass','Velocity','Displacement','Force'],0,'Mass has magnitude but no direction, so it is scalar.'],
['Which of the following is a vector physical quantity?',['Velocity','Mass','Time','Temperature'],0,'Velocity requires both magnitude and direction.'],
['How many SI base quantities are there?',['7','5','9','10'],0,'The SI system defines seven base quantities.'],
['Which pair contains two physical quantities?',['Time and temperature','Beauty and honesty','Luck and intelligence','Popularity and talent'],0,'Time and temperature are measurable physical quantities.'],
['What is the main purpose of a unit?',['To provide a standard reference for measuring a quantity','To give every quantity a direction','To remove all experimental error','To replace the numerical value'],0,'A unit is a standard reference used to express the magnitude of a physical quantity.'],
['Which of the following is NOT a physical quantity?',['Beauty','Length','Mass','Time'],0,'Beauty cannot be assigned a physical measurement with a standard unit.'],
['If the length of a rod is 5 m, what does the number 5 represent?',['Numerical value','Unit','Dimension','Direction'],0,'In 5 m, 5 is the numerical value and m is the unit.'],
['Which type of quantity can be completely specified by magnitude alone?',['Scalar quantity','Vector quantity','Tensor quantity','Directed quantity'],0,'A scalar is specified by magnitude alone.'],
['Which type of quantity requires both magnitude and direction for complete specification?',['Vector quantity','Scalar quantity','Dimensionless quantity','Numerical quantity'],0,'A vector needs magnitude and direction.'],
['Which statement about a physical quantity and its units is correct?',['The same physical quantity can be expressed using different units','A physical quantity can have only one possible unit','Changing the unit always changes the physical quantity','A unit has no relation to measurement'],0,'Changing the unit changes the numerical representation, not the physical quantity itself.']
];
'''
              s = s.replace(marker, marker + "\n" + bank + "const exactPhysical=meta.concept.toLowerCase()==='physical quantities';", 1)
          s = s.replace("const questions=exactUnits?unitsQuiz:(window.SKILLUP_PHYSICS_BANKS&&window.SKILLUP_PHYSICS_BANKS[meta.concept])||generic;", "const questions=exactUnits?unitsQuiz:(typeof exactPhysical!=='undefined'&&exactPhysical)?physicalQuantitiesQuiz:(window.SKILLUP_PHYSICS_BANKS&&window.SKILLUP_PHYSICS_BANKS[meta.concept])||generic;", 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        run: |
          grep -q "const exactPhysical=meta.concept.toLowerCase()==='physical quantities';" physics-concept.html
          grep -q "const physicalQuantitiesQuiz=" physics-concept.html
          test "$(grep -o "\['" physics-concept.html | wc -l)" -ge 15

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add physics-concept.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Implement Physical Quantities MCQs"
            git push
          fi
