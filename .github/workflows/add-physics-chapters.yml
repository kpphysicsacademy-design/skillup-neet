name: Add Physics Chapters
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  chapters:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add chapter navigator
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('physics-home.html'); s=p.read_text(encoding='utf-8')
          if 'id="physics-chapters"' in s: raise SystemExit(0)
          items=[('01','📏','Physics and Measurement'),('02','🏃','Kinematics'),('03','⚖️','Laws of Motion'),('04','⚡','Work, Energy and Power'),('05','🔄','Rotational Motion'),('06','🌍','Gravitation'),('07','💧','Properties of Solids and Liquids'),('08','🔥','Thermodynamics'),('09','💨','Kinetic Theory of Gases'),('10','〰️','Oscillations and Waves'),('11','⚡','Electrostatics'),('12','🔌','Current Electricity'),('13','🧲','Magnetic Effects of Current and Magnetism'),('14','〽️','Electromagnetic Induction and Alternating Currents'),('15','📡','Electromagnetic Waves'),('16','🔭','Optics'),('17','☯️','Dual Nature of Matter and Radiation'),('18','⚛️','Atoms and Nuclei'),('19','💻','Electronic Devices'),('20','🧪','Experimental Skills')]
          cards=''.join(f'<a class="physics-chapter" href="physics-concept.html?concept={t.replace(" ","%20")}"><span class="physics-chapter-num">{n}</span><span class="physics-chapter-icon">{i}</span><span><b>Chapter {n}</b><strong>{t}</strong><small>NEET Physics</small></span><em>›</em></a>' for n,i,t in items)
          css='''<style id="physics-chapters-style">#physics-chapters{margin:22px 0}.physics-chapters-title{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;margin-bottom:12px;background:#fff;border:1px solid #d9e5f2;border-radius:17px;box-shadow:0 7px 20px rgba(18,59,112,.08)}.physics-chapters-title b{color:#123b70;font-size:14px}.physics-chapters-title span{font-size:9px;color:#6b7280;font-weight:800}.physics-chapters-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.physics-chapter{position:relative;display:flex;align-items:center;gap:10px;min-height:74px;padding:10px 12px;background:#fff;border:2px solid #d9e5f2;border-radius:18px;box-shadow:0 4px 0 #d6e0ea;transition:.16s;text-decoration:none;color:#263238;overflow:hidden}.physics-chapter:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#1677ff}.physics-chapter:hover{transform:translateY(-3px);box-shadow:0 7px 0 #c8d4e0;border-color:#8ebced}.physics-chapter-num{width:23px;font-size:9px;font-weight:950;color:#1677ff}.physics-chapter-icon{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;border-radius:13px;background:#e9f2ff;font-size:25px}.physics-chapter b{display:block;font-size:8px;color:#6b7280;text-transform:uppercase;letter-spacing:.7px}.physics-chapter strong{display:block;font-size:12px;line-height:1.25;color:#123b70}.physics-chapter small{font-size:8px;color:#7a8da3}.physics-chapter em{margin-left:auto;font-size:25px;font-style:normal;color:#1677ff}@media(max-width:700px){.physics-chapters-grid{grid-template-columns:1fr}.physics-chapters-title{display:block}.physics-chapters-title span{display:block;margin-top:3px}} </style>'''
          block=css+f'<section id="physics-chapters" aria-label="Physics chapters"><div class="physics-chapters-title"><b>📚 Physics Chapters</b><span>20 chapters • Follow the path in order</span></div><div class="physics-chapters-grid">{cards}</div></section>'
          m=re.search(r'(<section[^>]*id=["\']path["\'][^>]*>)',s,re.I)
          if not m: raise SystemExit('Learning path container not found')
          s=s[:m.start()]+block+s[m.start():]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'id="physics-chapters"' physics-home.html
          test "$(grep -o 'class="physics-chapter"' physics-home.html | wc -l)" -eq 20
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-home.html
          git commit -m 'Add Duolingo style Physics Chapters'
          git push
