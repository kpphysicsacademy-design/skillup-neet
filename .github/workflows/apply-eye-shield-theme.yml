name: Apply SkillUp Eye Shield theme universally

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-eye-shield-theme.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apply-eye-shield-theme
  cancel-in-progress: true

jobs:
  theme-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Eye Shield theme and universal navigation
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=0

          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Universal Eye Shield update attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            python3 <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          nav_file = root / "shared-nav.js"
          nav_tag = '<script src="/shared-nav.js?v=20261013-eye-shield-v1"></script>'
          theme_tag = '<script src="/skillup-eye-shield.js?v=20261013-eye-shield-v1"></script>'
          newline = chr(10)

          if not nav_file.exists():
              raise SystemExit("shared-nav.js is missing; refusing to deploy without universal navigation.")

          # Harmonize the shared footer itself with the new low-glare palette.
          nav = nav_file.read_text(encoding="utf-8")
          for old, new in [
              ("background:rgba(255,255,255,.98)", "background:rgba(250,249,240,.98)"),
              ("border:1px solid #e5eaf2", "border:1px solid #d3dccb"),
              ("box-shadow:0 -8px 28px rgba(16,24,40,.10)", "box-shadow:0 -6px 22px rgba(57,75,53,.09)"),
              ("color:#667085", "color:#647061"),
              (".active {background:#eef3ff;color:#315efb}", ".active {background:#e3ebdd;color:#446349}"),
              ("outline:3px solid #315efb", "outline:3px solid #71916a"),
          ]:
              nav = nav.replace(old, new)
          labels = ["Home", "Learn", "Practice", "Community", "Profile"]
          if not all("label:'" + label + "'" in nav for label in labels):
              raise SystemExit("The expected five-item shared navigation was not found.")
          if "href:'/community.html'" not in nav:
              raise SystemExit("The Community navigation destination is missing.")
          nav_file.write_text(nav, encoding="utf-8", newline="")

          nav_pattern = re.compile(
              r"""<script\b[^>]*\bsrc\s*=\s*["'](?:/)?shared-nav\.js(?:\?[^"']*)?["'][^>]*>\s*</script>""",
              re.I | re.S,
          )
          theme_pattern = re.compile(
              r"""<script\b[^>]*\bsrc\s*=\s*["'](?:/)?skillup-eye-shield\.js(?:\?[^"']*)?["'][^>]*>\s*</script>""",
              re.I | re.S,
          )

          # Login and admin/maintenance pages get the theme but deliberately do not get the footer.
          nav_skip = {
              "central-login.html",
              "central-register.html",
              "central-reset-password.html",
              "chemistry-asset-manager.html",
              "deployment-check-20260909.html",
              "progress.html",
          }
          updated_pages = []
          theme_pages = []
          nav_pages = []

          for page in sorted(root.rglob("*.html")):
              rel = page.as_posix()
              if any(part in {".git", "node_modules", "vendor"} for part in page.parts):
                  continue
              if rel.startswith(".github/"):
                  continue

              original = page.read_text(encoding="utf-8")
              cleaned = nav_pattern.sub("", original)
              cleaned = theme_pattern.sub("", cleaned)

              tags = []
              if page.name not in nav_skip:
                  tags.append(nav_tag)
                  nav_pages.append(rel)
              if page.name != "progress.html":
                  tags.append(theme_tag)
                  theme_pages.append(rel)

              body_end = re.search(r"</body\s*>", cleaned, re.I)
              if body_end:
                  insert = newline + newline.join(tags) + newline
                  updated = cleaned[:body_end.start()].rstrip() + insert + cleaned[body_end.start():]
              else:
                  updated = cleaned.rstrip() + newline + newline.join(tags) + newline

              if updated != original:
                  page.write_text(updated, encoding="utf-8", newline="")
                  updated_pages.append(rel)

          print("Student pages using universal footer: " + str(len(nav_pages)))
          print("HTML pages using Eye Shield theme: " + str(len(theme_pages)))
          print("HTML pages updated or cache-busted: " + str(len(updated_pages)))
          PY

            git add -A
            git rm -f .github/workflows/apply-eye-shield-theme.yml
            git add -A

            git commit -m "Apply universal Eye Shield theme across SkillUp"
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "main changed during this attempt; retrying against its latest state."
          done

          if [ "$pushed" -ne 1 ]; then
            echo "Could not push theme update after 8 attempts."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload themed website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy SkillUp Eye Shield theme
        id: deployment
        uses: actions/deploy-pages@v4
