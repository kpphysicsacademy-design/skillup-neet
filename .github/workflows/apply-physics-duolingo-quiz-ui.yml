
name: Apply compact Duolingo UI to Physics quizzes

on:
  push:
    branches: [main]

jobs:
  enhance:
    if: github.event.head_commit.message != 'Apply SkillUp simple Duolingo quiz UI'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Add shared quiz stylesheet to Physics quiz pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css = Path("physics-duolingo-quiz.css")
          if not css.is_file():
              raise SystemExit("Missing physics-duolingo-quiz.css")

          changed = []
          candidates = []

          markers = re.compile(
              r"""(?i)(id=["'](?:question|q|opts|options)["']|"""
              r"""class=["'][^"']*(?:quiz-card|question-card|options|answers|option)|"""
              r"""check answer|next question|question-bank|const\s+questions?\s*=)"""
          )

          for page in sorted(Path(".").glob("physics-*.html")):
              source = page.read_text(encoding="utf-8")

              if not markers.search(source):
                  continue

              candidates.append(str(page))

              if "physics-duolingo-quiz.css" in source:
                  continue

              link = '<link rel="stylesheet" href="physics-duolingo-quiz.css?v=1">'

              if re.search(r"</head\s*>", source, re.I):
                  source = re.sub(
                      r"</head\s*>",
                      lambda _: link + "\n</head>",
                      source,
                      count=1,
                      flags=re.I
                  )
              else:
                  print(f"Skipped {page}: no closing head tag")
                  continue

              page.write_text(source, encoding="utf-8")
              changed.append(str(page))

          print("Matching Physics quiz pages:", len(candidates))
          print("New stylesheet links added:", len(changed))
          print("Already linked or otherwise skipped:", len(candidates) - len(changed))

          if not candidates:
              raise SystemExit("No matching Physics quiz pages found; refusing to commit")

          if len(changed) == 0:
              print("No changes needed; all matching pages may already be linked.")
          PY

      - name: Verify and commit
        run: |
          test -f physics-duolingo-quiz.css
          grep -q '58cc02' physics-duolingo-quiz.css
          git add physics-*.html physics-duolingo-quiz.css
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply SkillUp simple Duolingo quiz UI'
          git push
