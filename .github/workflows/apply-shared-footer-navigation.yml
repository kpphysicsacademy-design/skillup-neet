name: Apply shared footer navigation across existing pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-shared-footer-navigation.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shared-footer-navigation-update
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add the shared five-item footer to student pages
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          skip_names = {
              "central-login.html",
              "central-register.html",
              "central-reset-password.html",
              "chemistry-asset-manager.html",
              "deployment-check-20260909.html",
          }
          current_script = '<script src="/shared-nav.js?v=20261013-footer-labels-only"></script>'
          script_pattern = re.compile(
              r"""<script\b[^>]*\bsrc\s*=\s*["'](?:/)?shared-nav\.js(?:\?[^"']*)?["'][^>]*>\s*</script>""",
              re.I | re.S,
          )
          changed = []
          for page in sorted(root.rglob("*.html")):
              relative = page.as_posix()
              if any(part in {".git", "node_modules", "vendor"} for part in page.parts):
                  continue
              if page.name in skip_names or relative.startswith(".github/"):
                  continue

              original = page.read_text(encoding="utf-8")
              # Replace stale or duplicate references with one current shared script.
              cleaned = script_pattern.sub("", original)
              body_end = re.search(r"</body\s*>", cleaned, re.I)
              if body_end:
                  updated = cleaned[:body_end.start()].rstrip() + "\n" + current_script + "\n" + cleaned[body_end.start():]
              else:
                  updated = cleaned.rstrip() + "\n" + current_script + "\n"

              if updated != original:
                  page.write_text(updated, encoding="utf-8", newline="")
                  changed.append(relative)

          print(f"Updated {len(changed)} student-facing HTML pages.")
          print("\n".join(changed))
          PY

      - name: Commit page updates and remove the one-time updater
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-shared-footer-navigation.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No HTML changes were needed."
          else
            git commit -m "Apply shared five-item footer navigation across existing pages"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload updated website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy updated website
        id: deployment
        uses: actions/deploy-pages@v4
