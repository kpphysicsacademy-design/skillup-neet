name: Apply Zoology Test Architecture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-zoology-test-architecture.yml'
      - 'zoology-chapter-test.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Separate lesson and chapter test routing
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('zoology-chapter-test.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Explicitly classify the request. Lesson tests and chapter tests use
          # separate routes, while preserving compatibility with old chapter URLs.
          old = "const params=new URLSearchParams(location.search);\nconst raw=params.get('chapter')||'What is Living';\nconst chapter=raw==='What is Living?'?'What is Living?':raw;\nconst data=tests[chapter]||tests['What is Living?'];\ndocument.getElementById('title').textContent=chapter+' — Chapter Test';\ndocument.getElementById('content').innerHTML=data.map((x,i)=>`<section class=\\\"q\\\"><h2>${i+1}. ${x.q}</h2>${x.o.map((z,j)=>`<div class=\\\"opt\\\">${String.fromCharCode(65+j)}. ${z}</div>`).join('')}<div class=\\\"answer\\\">Answer: ${x.a}</div><div class=\\\"explain\\\">${x.e}</div></section>`).join('');"

          # The deployed file has historically been minified and may contain
          # whitespace variations. Replace the routing block by its stable
          # surrounding markers rather than depending on the entire minified line.
          pattern = re.compile(r"const params=new URLSearchParams\(location\.search\);.*?document\.getElementById\('content'\)\.innerHTML=data\.map\(.*?\.join\(''\);", re.S)
          replacement = r'''const params=new URLSearchParams(location.search);
const raw=params.get('chapter')||'';
const type=params.get('type')||'chapter';
const chapter=raw;
const data=tests[chapter];
const title=document.getElementById('title');
const content=document.getElementById('content');
if(!chapter||!data){
  title.textContent='Test not available';
  content.innerHTML='<section class="q"><h2>No test is available for this lesson or chapter yet.</h2><div class="explain">Please return to the Zoology learning path and select an available test.</div></section>';
}else{
  title.textContent=chapter+' — '+(type==='lesson'?'Lesson Test':'Chapter Test');
  content.innerHTML=data.map((x,i)=>`<section class="q"><h2>${i+1}. ${x.q}</h2>${x.o.map((z,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${z}</div>`).join('')}<div class="answer">Answer: ${x.a}</div><div class="explain">${x.e}</div></section>`).join('');
}'''

          m = pattern.search(s)
          if m:
              s = s[:m.start()] + replacement + s[m.end():]
          elif 'const data=tests[chapter]||tests[' in s:
              s = s.replace("const data=tests[chapter]||tests['What is Living?'];", "const data=tests[chapter];")

          if s != original:
              p.write_text(s, encoding='utf-8')
              print('Applied explicit lesson/chapter routing and removed fallback.')
          else:
              print('No routing change was necessary.')

      - name: Commit architecture changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zoology-chapter-test.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Separate Zoology lesson and chapter test routing'
          git push
