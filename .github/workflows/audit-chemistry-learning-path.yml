name: Audit Chemistry learning path
on:
  pull_request:
    paths:
      - 'chemistry-home.html'
      - 'chemistry-mcq.html'
      - 'chemistry-quicklearn.html'
      - 'chemistry-1062-concepts-base.js'
      - 'question-banks/**'
      - 'scripts/audit-chemistry-learning-path.cjs'
      - '.github/workflows/audit-chemistry-learning-path.yml'
  workflow_dispatch:
jobs:
  learning-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/audit-chemistry-learning-path.cjs
