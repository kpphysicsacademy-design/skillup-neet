name: Audit Zoology Chapter Test Links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-zoology-test-links.yml'
      - 'zoology-full-path.html'
      - 'zoology-chapter-test.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove obsolete What is Living test and repair routing
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import quote, unquote
          import re

          path = Path('zoology-full-path.html')
          test_path = Path('zoology-chapter-test.html')
          html = path.read_text(encoding='utf-8')
          test_html = test_path.read_text(encoding='utf-8')

          # Remove the entire obsolete What is Living dataset, whether followed by
          # another dataset or by the closing tests object.
          test_html, removed = re.subn(
              r"\n?'What is Living\?':\[.*?\](?:,)?(?=\s*(?:'[^']+':\[|\};))",
              '', test_html, count=1, flags=re.S
          )
          if not removed:
              # Also remove a possible final entry immediately before };.
              test_html, removed = re.subn(
                  r"\n?'What is Living\?':\[.*?\](?:,)?\s*(?=\};)",
                  '', test_html, count=1, flags=re.S
              )

          # Remove obsolete concept aliases that reused chapter MCQs.
          test_html = re.sub(
              r"\nconst conceptAliases=\{.*?\};\s*Object\.assign\(tests,conceptAliases\);",
              '', test_html, flags=re.S
          )

          if re.search(r"['\"]What is Living\?['\"]\s*:", test_html):
              raise SystemExit('What is Living dataset still exists after removal.')

          # No fallback to What is Living; missing tests must be explicit.
          test_html = re.sub(
              r"const params=new URLSearchParams\(location\.search\);.*?document\.getElementById\('content'\)",
              "const params=new URLSearchParams(location.search);\nconst raw=params.get('chapter')||'';\nconst type=params.get('type')||'chapter';\nconst chapter=raw;\nconst data=tests[chapter];\ndocument.getElementById('title').textContent=chapter ? chapter+' — '+(type==='lesson'?'Lesson Test':'Chapter Test') : 'Zoology Test';\ndocument.getElementById('content')",
              test_html, count=1, flags=re.S
          )

          test_keys = set(re.findall(r"(?m)^'([^']+)':\[", test_html))
          if not test_keys:
              raise SystemExit('No Zoology test datasets remain.')

          card_re = re.compile(
              r'(<a class="chapter" href=")([^"]+)("[^>]*>\s*<div class="chapter-head">.*?'
              r'<div class="title">([^<]+)</div>)', re.I | re.S)

          state = {'checked': 0, 'changed': 0}
          def fix(match):
              prefix, href, suffix, title = match.groups()
              title = re.sub(r'\s+', ' ', title).strip()
              state['checked'] += 1
              kind = 'chapter' if title in test_keys else 'lesson'
              new_href = 'zoology-chapter-test.html?chapter=' + quote(title, safe='') + '&type=' + kind
              if new_href != href:
                  state['changed'] += 1
                  return prefix + new_href + suffix
              return match.group(0)

          html = card_re.sub(fix, html)

          # Remove the What is Living card itself from the learning path.
          html, card_removed = re.subn(
              r'<a class="chapter" href="[^"]*What(?:%20|\s)iv?e?[^\"]*"[^>]*>.*?</a>',
              '', html, count=0, flags=re.I | re.S
          )
          # Exact title-based removal is safer for the current generated card format.
          html = re.sub(
              r'<a class="chapter" href="[^"]*"[^>]*>\s*<div class="chapter-head">\s*<div>\s*<div class="title">What is Living\?</div>.*?</a>',
              '', html, count=1, flags=re.I | re.S
          )

          links = re.findall(
              r'zoology-chapter-test\.html\?chapter=([^&"]+)&type=(chapter|lesson)',
              html, re.I
          )
          if not links:
              raise SystemExit('No typed Zoology test links found.')

          bad = [unquote(k) for k, kind in links if kind.lower() == 'chapter' and unquote(k) not in test_keys]
          if bad:
              raise SystemExit('Invalid chapter datasets: ' + ', '.join(sorted(set(bad))))

          if re.search(r'chapter=What(?:%20|\s)??is(?:%20|\s)Living', html, re.I):
              raise SystemExit('What is Living link still exists in Zoology path.')

          path.write_text(html, encoding='utf-8')
          test_path.write_text(test_html, encoding='utf-8')
          print(f"Checked cards: {state['checked']}")
          print(f"Rewritten links: {state['changed']}")
          print(f"What is Living dataset removed: {'yes' if removed else 'already absent'}")
          print(f'Chapter datasets: {len(test_keys)}')
          print(f'Typed links: {len(links)}')

      - name: Commit repaired files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zoology-full-path.html zoology-chapter-test.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Remove What is Living Zoology test and repair links'
            git push
          fi
