name: Audit Zoology Chapter Test Links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-zoology-test-links.yml'
      - 'zoology-full-path.html'
      - 'zoology-chapter-test.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Fix Zoology lesson routing
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import urlparse, parse_qs, quote, unquote
          import re

          path = Path('zoology-full-path.html')
          test_path = Path('zoology-chapter-test.html')
          html = path.read_text(encoding='utf-8')
          test_html = test_path.read_text(encoding='utf-8')

          # Remove the obsolete What is Living? dataset completely.
          test_html, removed = re.subn(
              r"'What is Living\?':\[.*?\],(?='[^']+':\[)",
              '', test_html, count=1, flags=re.S
          )
          if removed:
              print('Removed What is Living? MCQ dataset.')

          # Remove every old shared concept-alias block. Lessons must never
          # inherit a chapter's MCQs.
          test_html = re.sub(
              r"\nconst conceptAliases=\{.*?\};\nObject\.assign\(tests,conceptAliases\);",
              '', test_html, flags=re.S
          )

          # Extract real chapter datasets that remain in the test engine.
          test_keys = set(re.findall(r"(?m)^'([^']+)':\[", test_html))
          if not test_keys:
              raise SystemExit('No Zoology chapter test datasets were found.')

          card_re = re.compile(
              r'(<a class="chapter" href=")([^"]+)("[^>]*>\s*<div class="chapter-head">.*?'
              r'<div class="title">([^<]+)</div>)', re.I | re.S
          )

          checked = 0
          changed = 0
          unresolved = []

          def replace_card(match):
              nonlocal checked, changed
              prefix, href, suffix, title = match.groups()
              title = re.sub(r'\s+', ' ', title).strip()
              checked += 1

              # A title matching an actual dataset is a chapter test.
              # Everything else is a lesson test and gets a unique key.
              test_type = 'chapter' if title in test_keys else 'lesson'
              new_href = (
                  'zoology-chapter-test.html?chapter=' + quote(title, safe='') +
                  '&type=' + test_type
              )

              if new_href != href:
                  changed += 1
                  return prefix + new_href + suffix
              return match.group(0)

          html = card_re.sub(replace_card, html)

          # Validate that every card has an explicit type and chapter key.
          links = re.findall(
              r'zoology-chapter-test\.html\?chapter=([^&"]+)&type=(chapter|lesson)',
              html,
              flags=re.I
          )
          if not links:
              raise SystemExit('No typed Zoology test links found.')

          # No lesson is allowed to masquerade as an existing chapter dataset.
          # Lessons without dedicated MCQs will correctly show "Test not available"
          # until their lesson-specific datasets are added.
          for encoded, kind in links:
              title = unquote(encoded)
              if kind.lower() == 'chapter' and title not in test_keys:
                  unresolved.append(title)

          if unresolved:
              raise SystemExit('Chapter links without datasets: ' + ', '.join(sorted(set(unresolved))))

          path.write_text(html, encoding='utf-8')
          test_path.write_text(test_html, encoding='utf-8')

          print(f'Checked Zoology cards: {checked}')
          print(f'Rewritten typed links: {changed}')
          print(f'Chapter datasets retained: {len(test_keys)}')
          print(f'Typed test links: {len(links)}')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zoology-full-path.html zoology-chapter-test.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Separate Zoology lesson tests from chapter tests'
          git push
