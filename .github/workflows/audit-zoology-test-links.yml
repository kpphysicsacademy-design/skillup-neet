name: Audit Zoology Chapter Test Links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-zoology-test-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Audit and fix all Zoology test links
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import urlparse, parse_qs, quote, unquote
          import json
          import re

          path = Path('zoology-full-path.html')
          test_path = Path('zoology-chapter-test.html')
          html = path.read_text(encoding='utf-8')
          test_html = test_path.read_text(encoding='utf-8')

          # Existing real test datasets. Keys are top-level entries in const tests={...}.
          test_keys = set(re.findall(r"(?m)^'([^']+)':\[", test_html))

          # Every chapter card is audited. Existing chapter keys keep their current
          # destination; converted concept cards receive a unique URL and an alias
          # to the appropriate parent chapter's existing MCQ set.
          card_re = re.compile(
              r'(<a class="chapter" href=")([^"]+)("[^>]*>\s*<div class="chapter-head">.*?'
              r'<div class="title">([^<]+)</div>)', re.I | re.S
          )

          aliases = {}
          changed = 0
          checked = 0
          unresolved = []

          def replace_card(match):
              nonlocal changed, checked
              prefix, href, suffix, title = match.groups()
              title = re.sub(r'\s+', ' ', title).strip()
              checked += 1

              parsed = urlparse(href)
              qs = parse_qs(parsed.query)
              parent = unquote(qs.get('chapter', [''])[0])

              # A real test already exists for this card.
              if title in test_keys:
                  return match.group(0)

              # Converted concept cards inherit the first/parent chapter's MCQs.
              if parent not in test_keys:
                  unresolved.append((title, parent))
                  return match.group(0)

              aliases[title] = parent
              new_href = 'zoology-chapter-test.html?chapter=' + quote(title, safe='')
              if new_href != href:
                  changed += 1
                  return prefix + new_href + suffix
              return match.group(0)

          html = card_re.sub(replace_card, html)

          # Add/refresh concept aliases immediately after const tests={...};.
          # Remove a previous generated alias block first so the workflow is idempotent.
          html_marker = None
          alias_block_re = re.compile(r'\nconst conceptAliases=\{.*?\};\nObject\.assign\(tests,conceptAliases\);', re.S)
          test_marker_re = re.compile(r'\nconst conceptAliases=\{')

          # The alias code belongs in the test page, not the path page.
          alias_block_re_test = re.compile(r'\nconst conceptAliases=\{.*?\};\nObject\.assign\(tests,conceptAliases\);', re.S)
          test_html = alias_block_re_test.sub('', test_html)

          lines = ['\nconst conceptAliases={};']
          for concept, parent in sorted(aliases.items()):
              lines.append(
                  f'conceptAliases[{json.dumps(concept, ensure_ascii=False)}]=tests[{json.dumps(parent, ensure_ascii=False)}];'
              )
          lines.append('Object.assign(tests,conceptAliases);')
          alias_block = '\n'.join(lines)

          # Insert before the runtime code after the tests object closes.
          marker = '\n};\n'
          if marker not in test_html:
              raise SystemExit('Could not locate tests object terminator.')
          test_html = test_html.replace(marker, marker + alias_block + '\n', 1)

          path.write_text(html, encoding='utf-8')
          test_path.write_text(test_html, encoding='utf-8')

          print(f'Checked chapter cards: {checked}')
          print(f'Unique concept aliases: {len(aliases)}')
          print(f'Rewritten card links: {changed}')
          if unresolved:
              print('Unresolved parent mappings:')
              for title, parent in unresolved:
                  print(f'  - {title} -> {parent}')
              raise SystemExit('Some Zoology cards do not map to an existing test dataset.')

          # Final validation: every chapter URL must resolve to a test key after aliases.
          all_keys = set(test_keys) | set(aliases)
          final_links = re.findall(r'<a class="chapter" href="zoology-chapter-test\.html\?chapter=([^"]+)"', html, re.I)
          broken = []
          for encoded in final_links:
              key = unquote(encoded)
              if key not in all_keys:
                  broken.append(key)
          if broken:
              raise SystemExit('Broken test links remain: ' + ', '.join(sorted(set(broken))))

          print(f'Final valid chapter-test links: {len(final_links)}')

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zoology-full-path.html zoology-chapter-test.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Audit Zoology test links across all units'
          git push
