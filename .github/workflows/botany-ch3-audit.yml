name: Botany Chapter 3 Content Audit
on:
  pull_request:
    paths:
      - 'botany-cell-cheat-sheet.html'
      - 'botany-home.html'
      - 'botany-mcq.html'
      - 'question-banks/**'
      - 'assets/botany-*.svg'
      - 'scripts/audit-botany-ch3.cjs'
      - '.github/workflows/botany-ch3-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-botany-ch3.cjs
