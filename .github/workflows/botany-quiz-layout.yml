name: Botany quiz layout qualification
on:
  pull_request:
    paths:
      - 'botany-mcq.html'
      - 'tests/botany-quiz-layout.cjs'
      - '.github/workflows/botany-quiz-layout.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node --check tests/botany-quiz-layout.cjs
      - name: Install Chromium and dependencies
        run: |
          # Use only Ubuntu repositories for browser system dependencies.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -name '*.list' -o -name '*.sources' \) -exec grep -l 'packages.microsoft.com/ubuntu/24.04/prod' {} + | while IFS= read -r source; do
            sudo mv "$source" "$source.disabled"
          done
          npx playwright install --with-deps chromium
      - run: node tests/botany-quiz-layout.cjs
