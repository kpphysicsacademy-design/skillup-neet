name: Central auth isolation regression
on:
  pull_request:
    paths:
      - central-auth.js
      - tests/central-auth-isolation.test.cjs
      - .github/workflows/central-auth-regression.yml
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/central-auth-isolation.test.cjs
