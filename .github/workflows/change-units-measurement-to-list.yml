name: Change Units of Measurement to concept list
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all-concept list
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('physics-concept.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<!-- TERMINATE UNITS OF MEASUREMENT URL -->\s*<script>.*?</script>\s*', '', s, flags=re.S)
          marker='<!-- UNITS OF MEASUREMENT ALL CONCEPTS -->'
          script='''<script>\n(function(){\n  const c=new URLSearchParams(location.search).get('concept')||'';\n  if(c.trim().toLowerCase()!=='units of measurement') return;\n  document.title='SkillUp | Units of Measurement';\n  const intro=document.getElementById('intro');\n  if(intro) intro.textContent='All items below are concepts. Choose any concept to learn it for NEET Physics.';\n  const content=document.getElementById('content');\n  if(!content) return;\n  const items=[\n    ['01','Units of Measurement','📏','Measurement standards and physical quantities.'],\n    ['02','System of Units and SI Units','🌐','SI system, base units and standard symbols.'],\n    ['03','Fundamental and Derived Units','🧩','Fundamental quantities and derived units.'],\n    ['04','Least Count','🎯','Smallest reliable measurement of an instrument.'],\n    ['05','Significant Figures','🔢','Meaningful digits and measurement precision.'],\n    ['06','Errors in Measurements','⚠️','Absolute, relative, percentage, systematic and random errors.'],\n    ['07','Dimensions of Physical Quantities','📐','Dimensions using fundamental quantities.'],\n    ['08','Dimensional Analysis and Applications','🧮','Equation checking, derivation and unit conversion.']\n  ];\n  content.innerHTML='<section class="topic" style="padding:16px"><div style="font-weight:950;color:#123b70;font-size:16px;margin-bottom:10px">📚 Units & Measurement — All Concepts</div>'+items.map(x=>'<a href="physics-concept.html?concept='+encodeURIComponent(x[1])+'" style="display:flex;align-items:center;gap:11px;padding:12px 10px;margin:7px 0;background:#f8fbff;border:2px solid #d9e5f2;border-radius:15px;color:#123b70;text-decoration:none"><span style="font-size:22px;width:30px">'+x[2]+'</span><span style="flex:1"><b style="display:block;font-size:12px">Concept '+x[0]+' • '+x[1]+'</b><small style="display:block;margin-top:3px;color:#667085;font-size:9px;line-height:1.4">'+x[3]+'</small></span><span style="width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#1677ff;color:#fff;font-weight:950">→</span></a>').join('')+'</section>';\n  const practice=document.getElementById('practice');\n  if(practice) practice.style.display='none';\n})();\n</script>\n';
          if marker not in s:
              s=s.replace('</body>', marker+'\n'+script+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Propose Physics concept-list changes for review
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/units-measurement-concept-list
          delete-branch: true
          commit-message: 'Propose Units of Measurement concept list'
          title: 'Review Units of Measurement concept-list update'
          body: |
            This PR contains the generated Units of Measurement concept-list update.

            Review the concept labels, descriptions, and navigation behavior before merging.
            This workflow is now manual-only and no longer deletes itself or pushes directly to main.
          add-paths: |
            physics-concept.html
