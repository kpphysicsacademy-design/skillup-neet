name: Convert Unit 1 concepts to chapters

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert Unit 1 concept list
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('zoology-full-path.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('<section class="section"><div class="section-head"><div><div class="unit">UNIT 1</div>')
          end=s.index('</section>', s.index('<div class="concepts">', start))+10
          items=[
          ('What is Living?','Living characteristics, metabolism, consciousness and reproduction','🌱','What%20is%20Living%3F'),
          ('Characteristics of living organisms','Core features that distinguish living systems','🌱','What%20is%20Living%3F'),
          ('Growth and reproduction','Growth patterns and reproduction in organisms','🌿','What%20is%20Living%3F'),
          ('Metabolism','Anabolism, catabolism and energy flow','⚡','What%20is%20Living%3F'),
          ('Cellular organisation','Cell as the structural and functional unit','🔬','What%20is%20Living%3F'),
          ('Consciousness and response to stimuli','Sensitivity, movement and response','🧠','What%20is%20Living%3F'),
          ('Biodiversity and classification','Diversity of organisms and need for classification','🌍','Biological%20Classification'),
          ('Taxonomy and systematics','Principles, scope and relationships','📚','Biological%20Classification'),
          ('Taxonomic hierarchy','Kingdom to species hierarchy','🔺','Biological%20Classification'),
          ('Species concept','Definition, types and significance','👥','Biological%20Classification'),
          ('Binomial nomenclature','Rules and examples of scientific naming','✍️','Biological%20Classification'),
          ('Taxonomic aids','Herbarium, botanical garden, museum and keys','🔎','Biological%20Classification'),
          ('Biological Classification','Five-kingdom classification and criteria','🧫','Biological%20Classification'),
          ('Five-kingdom classification','Overview and major criteria','🗂️','Biological%20Classification'),
          ('Monera and Archaebacteria','General characters and importance','🦠','Biological%20Classification'),
          ('Eubacteria and cyanobacteria','Features and examples','🧫','Biological%20Classification'),
          ('Protista','General characters, types and examples','🧬','Biological%20Classification'),
          ('Fungi and lichens','Characteristics, reproduction and significance','🍄','Biological%20Classification'),
          ('Viruses and viroids','Structure, reproduction and importance','🦠','Biological%20Classification'),
          ('Animal Kingdom','Non-chordates up to phyla and chordates up to classes','🦋','Animal%20Kingdom'),
          ('Animal classification','Basis and broad groups','🐾','Animal%20Kingdom'),
          ('Symmetry and germ layers','Types of symmetry and germ layers','⭐','Animal%20Kingdom'),
          ('Coelom and segmentation','Types of coelom and segmentation','🪱','Animal%20Kingdom'),
          ('Notochord','Structure, function and significance','🦴','Animal%20Kingdom'),
          ('Major non-chordate phyla','Porifera to Echinodermata: key features','🪼','Animal%20Kingdom'),
          ('Chordata','Chordate characters and classification','🐟','Animal%20Kingdom'),
          ('Vertebrate classes','Pisces, Amphibia, Reptilia, Aves and Mammalia','🦅','Animal%20Kingdom')]
          cards=[]
          for n,(title,scope,icon,href) in enumerate(items,1):
              cards.append(f'<a class="chapter" href="zoology-chapter-test.html?chapter={href}"><div class="chapter-head"><div style="display:flex;gap:8px;min-width:0"><div class="num">{n}</div><div><div class="title">{title}</div><div class="scope">{scope}</div></div></div><div class="icon">{icon}</div></div><div class="test"><span>Start chapter test</span><span>→</span></div></a>')
          new='<section class="section"><div class="section-head"><div><div class="unit">UNIT 1</div><h2>Diversity in Living World</h2></div><span class="goal">Build the basics</span></div><div class="chapters-head"><b>📚 Chapters under Unit 1</b><span>27 chapters</span></div><div class="grid">'+''.join(cards)+'</div></section>'
          css='.chapters-head{margin-top:12px;padding:12px 14px;border:1px solid #d8e4f1;border-radius:14px;background:#fff;display:flex;justify-content:space-between;align-items:center;color:#0b3b78;font-size:12px}.chapters-head span{font-size:9px;color:#667085}.num{width:27px;height:27px;flex:0 0 27px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:10px;font-weight:950}@media(max-width:700px){.chapters-head{font-size:11px}}'
          s=s.replace('</style>',css+'</style>',1)
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')
          PY
      - name: Commit page update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zoology-full-path.html
          git commit -m 'Convert Unit 1 concepts to chapters' || exit 0
          git push
          git rm .github/workflows/convert-unit1-concepts.yml
          git commit -m 'Remove one-time Unit 1 conversion workflow'
          git push
