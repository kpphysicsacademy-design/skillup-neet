name: Validate Accuracy and Precision Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'physics-concept.html'
      - 'physics-accuracy-and-precision*.html'
      - '.github/workflows/deploy-accuracy-precision.yml'

permissions:
  contents: read

concurrency:
  group: validate-accuracy-precision
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Accuracy and Precision page architecture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          learn = Path('physics-accuracy-and-precision.html')
          simulator = Path('physics-accuracy-and-precision-simulator.html')
          practice = Path('physics-accuracy-and-precision-practice.html')
          concept = Path('physics-concept.html')

          for page in (learn, simulator, practice, concept):
              if not page.is_file():
                  raise SystemExit(f'Required page is missing: {page}')

          html = learn.read_text(encoding='utf-8')
          required_links = (
              'physics-accuracy-and-precision-simulator.html',
              'physics-accuracy-and-precision-practice.html',
          )
          for link in required_links:
              if link not in html:
                  raise SystemExit(f'Learn page is missing its navigation link: {link}')

          print('PASS: Learn, Simulator, Practice and Physics concept pages exist.')
          print('PASS: Learn page links to Simulator and Practice.')
          PY
