name: Validate Scalars and Vectors Quiz Wiring

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'question-bank.html'
      - 'scalars-and-vectors-question-bank.js'
      - '.github/workflows/deploy-scalars-vectors.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate existing Scalars and Vectors wiring
        shell: bash
        run: |
          test -f scalars-and-vectors-question-bank.js
          grep -q 'scalars-and-vectors-question-bank.js' question-bank.html
          grep -q "scalars-and-vectors" question-bank.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('scalars-and-vectors-question-bank.js').read_text(encoding='utf-8')
          count = len(re.findall(r"\{\s*(?:q|['\"]q['\"])\s*:\s*['\"]", source))
          print(f'Scalars and Vectors MCQs: {count}')
          if count != 30:
              raise SystemExit(f'Expected 30 MCQs, found {count}')
          print('Scalars and Vectors validation passed.')
          PY
