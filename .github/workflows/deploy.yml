name: Deploy SkillUp NEET to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Accuracy and Precision dedicated quiz route
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-concept.html')
          s=p.read_text(encoding='utf-8')
          marker='/* SKILLUP ACCURACY PRECISION ROUTE V1 */'
          if marker not in s:
              code='''<script>/* SKILLUP ACCURACY PRECISION ROUTE V1 */\n(function(){var c=(new URLSearchParams(location.search).get('concept')||'').trim().toLowerCase();if(c==='accuracy and precision'||c==='accuracy & precision'||c==='accuracy and precisions'){location.replace('physics-accuracy-and-precision.html');}})();</script>\n'''
              s=s.replace('<body>', '<body>'+code, 1)
              p.write_text(s,encoding='utf-8')
          assert marker in p.read_text(encoding='utf-8')
          d=Path('physics-accuracy-and-precision.html')
          if not d.exists(): raise SystemExit('Accuracy and Precision page missing')
          h=d.read_text(encoding='utf-8')
          assert 'Accuracy and precision' in h
          assert h.count("['") == 15, 'Accuracy and Precision must contain exactly 15 MCQs'
          print('Accuracy and Precision route validated: 15 MCQs')
          PY

      - name: Verify Physics concept quizzes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('physics-concept.html').read_text(encoding='utf-8')
          assert '<title>SkillUp | Physics Concept Quiz</title>' in s
          assert "key==='rounding off'||key==='rounding'" in s
          assert "var round=[" in s
          assert s.count("['Round ") >= 4
          assert "key==='significant figures'||key==='significant figure'" in s
          assert "key==='least count'||key==='least-count'" in s
          assert 'SKILLUP ACCURACY PRECISION ROUTE V1' in s
          print('Physics concept router verified: Significant Figures, Rounding Off, Least Count and Accuracy and Precision')
          for f in ['physics-dimensional-analysis.html','physics-dimensions.html','physics-dimensional-equations.html','physics-accuracy-and-precision.html']:
              assert Path(f).exists(), f'Missing {f}'
          print('Dedicated physics quiz pages verified')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
