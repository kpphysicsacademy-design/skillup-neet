name: Deploy SkillUp NEET to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Physics concept quizzes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('physics-concept.html').read_text(encoding='utf-8')
          assert '<title>SkillUp | Physics Concept Quiz</title>' in s
          assert "key==='rounding off'||key==='rounding'" in s
          assert "var round=[" in s
          assert s.count("['Round ") >= 4
          assert "key==='significant figures'||key==='significant figure'" in s
          assert "key==='least count'||key==='least-count'" in s
          print('Physics concept router verified: Significant Figures, Rounding Off and Least Count')
          for f in ['physics-dimensional-analysis.html','physics-dimensions.html','physics-dimensional-equations.html']:
              assert Path(f).exists(), f'Missing {f}'
          print('Dedicated physics quiz pages verified')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
