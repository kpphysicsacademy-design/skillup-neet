name: Deploy SkillUp NEET to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Unit Conversion dedicated quiz
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-concept.html')
          s=p.read_text(encoding='utf-8')
          marker='/* SKILLUP UNIT CONVERSION EARLY ROUTE V3 */'
          if marker not in s:
              code='''<script>/* SKILLUP UNIT CONVERSION EARLY ROUTE V3 */\n(function(){var c=(new URLSearchParams(location.search).get('concept')||'').trim().toLowerCase();if(c==='unit conversion'){location.replace('physics-unit-conversion.html?concept=Unit%20conversion');}})();</script>\n'''
              s=s.replace('<body>', '<body>'+code, 1)
              p.write_text(s,encoding='utf-8')
          assert 'SKILLUP UNIT CONVERSION EARLY ROUTE V3' in p.read_text(encoding='utf-8')
          u=Path('physics-unit-conversion.html')
          if not u.exists():
              u.write_text('''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Unit Conversion</title><style>body{margin:0;font-family:system-ui;background:#eef7ff;color:#173b62}.wrap{max-width:1050px;margin:auto;padding:20px}.hero,.mastery,.quiz,.panel{background:#fff;border-radius:20px;padding:22px;margin:12px 0;box-shadow:0 6px 18px #123b7015}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #dbe7f1;border-radius:15px;background:#fff;text-align:left;font-weight:700;cursor:pointer}.selected{border-color:#1677ff;background:#eef6ff}.correct{border-color:#2db84d;background:#eaffef}.wrong{border-color:#e5484d;background:#fff0f0}.btn{padding:12px 18px;border:0;border-radius:13px;font-weight:900;cursor:pointer;margin:8px 6px 0 0}.check{background:#2db84d;color:#fff}.next{background:#dcecff;color:#145b9e}.next:disabled{opacity:.45}.bar{height:13px;background:#dce8f2;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#42c95a}.feedback{margin-top:14px;padding:13px;border-radius:14px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}@media(max-width:750px){.layout{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="physics-home.html">← Back to Physics Path</a><section class="hero"><div>PHYSICS • NEET 2026</div><h1>Unit Conversion</h1><p>LEARN → PRACTICE → MASTER • 15 focused NEET-style MCQs</p></section><section class="mastery"><b>🎯 Skill Mastery</b> <span id="masteryText">0 / 15</span><div class="bar"><div id="fill" class="fill"></div></div></section><div class="layout"><aside class="panel"><h3 id="count">Question 1 of 15</h3><div id="pct">7%</div><div>⚡ +10 XP each</div></aside><section class="quiz"><b id="qbadge">Q1</b><h2 id="question"></h2><div id="options" class="options"></div><button id="check" class="btn check">Check Answer</button><button id="next" class="btn next" disabled>Next Question →</button><div id="feedback"></div><p id="hint"></p><div id="result" style="display:none"><h2>🏆 Skill Complete!</h2><p id="score"></p><button id="retry" class="btn check">Retry Skill</button></div></section></div></main><script>\n(function(){var quiz=[['What happens to a physical quantity when its unit is converted?',['The physical quantity remains the same while its numerical value may change','The physical quantity changes','Its dimensions disappear','It becomes dimensionless'],0,'A valid unit conversion changes the numerical representation, not the physical quantity.'],['1 kilometre is equal to:',['10 m','100 m','1000 m','10,000 m'],2,'1 km = 1000 m.'],['1 metre is equal to:',['10 cm','100 cm','1000 cm','0.01 cm'],1,'1 m = 100 cm.'],['1 centimetre is equal to:',['10^-1 m','10^-2 m','10^-3 m','10^2 m'],1,'1 cm = 10^-2 m.'],['1 millimetre is equal to:',['10^-2 m','10^-3 m','10^-6 m','10^3 m'],1,'1 mm = 10^-3 m.'],['2.5 km is equal to:',['25 m','250 m','2500 m','25,000 m'],2,'2.5 × 1000 = 2500 m.'],['500 cm is equal to:',['0.5 m','5 m','50 m','5000 m'],1,'500 cm ÷ 100 = 5 m.'],['3.2 m is equal to:',['32 cm','320 cm','3200 cm','0.32 cm'],1,'3.2 × 100 = 320 cm.'],['1 hour is equal to:',['60 s','600 s','3600 s','36,000 s'],2,'1 h = 3600 s.'],['1 minute is equal to:',['30 s','60 s','100 s','600 s'],1,'1 min = 60 s.'],['72 km/h is equal to:',['10 m/s','20 m/s','36 m/s','72 m/s'],1,'72 km/h × 5/18 = 20 m/s.'],['1 gram is equal to:',['10^-1 kg','10^-2 kg','10^-3 kg','10^3 kg'],2,'1 g = 10^-3 kg.'],['1 litre is equal to:',['10^-1 m^3','10^-2 m^3','10^-3 m^3','10^3 m^3'],2,'1 L = 10^-3 m^3.'],['To convert 2500 mm to metres, you should:',['Multiply by 1000','Divide by 1000','Multiply by 100','Divide by 100'],1,'1000 mm = 1 m, so 2500 mm = 2.5 m.'],['Which statement about unit conversion is correct?',['The numerical value may change, but the physical quantity and dimensions are preserved','The dimensions always change','The physical quantity changes','The unit must always be an SI base unit'],0,'Correct conversion preserves the physical quantity and its dimensions.']];var i=0,sel=-1,done=0,points=0,q=document.getElementById('question'),o=document.getElementById('options'),c=document.getElementById('check'),n=document.getElementById('next'),f=document.getElementById('feedback'),ct=document.getElementById('count'),pct=document.getElementById('pct'),b=document.getElementById('qbadge'),mt=document.getElementById('masteryText'),fill=document.getElementById('fill'),res=document.getElementById('result'),score=document.getElementById('score');function render(){var a=quiz[i];sel=-1;q.textContent=a[0];b.textContent='Q'+(i+1);ct.textContent='Question '+(i+1)+' of '+quiz.length;pct.textContent=Math.round((i+1)/quiz.length*100)+'%';mt.textContent=done+' / '+quiz.length;fill.style.width=(done/quiz.length*100)+'%';f.className='feedback';f.textContent='';n.disabled=true;c.disabled=false;o.innerHTML='';a[1].forEach(function(v,j){var x=document.createElement('button');x.className='option';x.textContent=String.fromCharCode(65+j)+'. '+v;x.onclick=function(){sel=j;Array.from(o.children).forEach(function(y){y.classList.remove('selected')});x.classList.add('selected')};o.appendChild(x)})}function grade(){if(sel<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}var a=quiz[i];Array.from(o.children).forEach(function(x,j){if(j===a[2])x.classList.add('correct');else if(j===sel)x.classList.add('wrong')});if(sel===a[2]){done++;points+=10;f.className='feedback good';f.textContent='🎯 Correct! +10 XP — '+a[3]}else{f.className='feedback bad';f.textContent='Not quite. Correct answer: '+a[1][a[2]]+' — '+a[3]}c.disabled=true;n.disabled=false;mt.textContent=done+' / '+quiz.length;if(i===quiz.length-1)n.textContent='Finish Skill →'}function advance(){if(i<quiz.length-1){i++;render()}else{q.textContent='🏆 Unit Conversion Complete!';o.innerHTML='';c.style.display='none';n.style.display='none';f.className='feedback good';f.textContent='Skill complete. '+done+' / '+quiz.length+' correct • '+points+' XP';res.style.display='block';score.textContent=done+' / '+quiz.length+' correct • '+points+' XP'}}c.onclick=grade;n.onclick=advance;document.getElementById('retry').onclick=function(){i=0;done=0;points=0;render()};render()})();</script></body></html>''',encoding='utf-8')
          assert u.read_text(encoding='utf-8').count("['") == 16
          print('Unit Conversion route validated: 15 MCQs')
          PY

      - name: Prepare Dimensions dedicated quiz
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-concept.html')
          s=p.read_text(encoding='utf-8')
          marker='/* SKILLUP DIMENSIONS EARLY ROUTE V1 */'
          if marker not in s:
              code='''<script>/* SKILLUP DIMENSIONS EARLY ROUTE V1 */\n(function(){var c=(new URLSearchParams(location.search).get('concept')||'').trim().toLowerCase();if(c==='dimensions'){location.replace('physics-dimensions.html');}})();</script>\n'''
              s=s.replace('<body>', '<body>'+code, 1)
              p.write_text(s,encoding='utf-8')
          assert 'SKILLUP DIMENSIONS EARLY ROUTE V1' in p.read_text(encoding='utf-8')
          d=Path('physics-dimensions.html').read_text(encoding='utf-8')
          assert d.count("['") == 16, 'Dimensions quiz must contain exactly 15 MCQs'
          assert 'The dimensions of velocity are:' in d
          assert 'The dimensions of force are:' in d
          assert 'The dimensions of the gravitational constant G are:' in d
          print('Dimensions route validated: 15 MCQs')
          PY

      - name: Verify Physics quiz page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('physics-concept.html').read_text(encoding='utf-8')
          assert '<title>SkillUp | Physics Concept Quiz</title>' in s
          assert 'SKILLUP UNIT CONVERSION EARLY ROUTE V3' in s
          assert 'SKILLUP DIMENSIONS EARLY ROUTE V1' in s
          print('Physics quiz page verified')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4