name: Deploy SkillUp NEET to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - 'assets/**'
      - 'icons/**'
      - 'question-banks/**'
      - 'data/**'
      - '.github/scripts/**'
      - 'tests/test_test_centre_mobile_css.py'
      - '.github/workflows/deploy.yml'
      - 'CNAME'
      - 'robots.txt'
      - 'manifest.webmanifest'
      - 'service-worker.js'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate Maths learning path before deployment
        run: python3 .github/scripts/smoke-test-maths-path.py
      - name: Validate centralized SkillUp design foundation
        run: python3 tests/test_skillup_design_system.py

      - name: Validate Zoology IDs, resume routing and question-bank resolution
        run: node --test tests/zoology-phase1.test.cjs

      - name: Validate Test Centre mobile layout
        run: python3 tests/test_test_centre_mobile_css.py

      - name: Rewrite question-bank paths for static hosting
        run: python3 .github/scripts/rewrite-question-bank-paths.py

      - name: Validate daily practice bank and exam engine
        run: node .github/scripts/test-daily-test.cjs

      - name: Test SEO build enrichment
        run: python3 tests/test_seo_enrich.py

      - name: Enrich public HTML metadata and generate searchable HTML sitemap
        run: python3 .github/scripts/seo-enrich.py

      - name: Generate and validate XML sitemap
        run: python3 .github/scripts/generate-sitemap.py

      - name: Run static SEO and internal-link audit
        run: python3 .github/scripts/seo-audit.py /tmp/skillup-seo-audit

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Upload SEO audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillup-seo-audit-report
          path: /tmp/skillup-seo-audit/
          if-no-files-found: warn
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
