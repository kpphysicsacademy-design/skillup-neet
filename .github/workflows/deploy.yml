name: Deploy SkillUp NEET to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Physics pages
        shell: bash
        run: |
          set -e
          test -f physics-concept.html
          test -f physics-units-of-measurement.html
          test -f physics-si-base-units.html
          grep -q "units of measurement.*physics-units-of-measurement.html" physics-concept.html
          grep -q "si base units.*physics-si-base-units.html" physics-concept.html
          grep -q "uniform motion.*physics-uniform-motion.html" physics-concept.html
          grep -q "projectile motion.*physics-projectile-motion.html" physics-concept.html
          grep -q "kinematic problem solving.*physics-kinematic-problem-solving.html" physics-concept.html
          echo "Physics routes validated"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
