name: Deploy SkillUp NEET to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply Least Count Physics quiz
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-concept.html')
          s=p.read_text(encoding='utf-8')
          marker='/* SKILLUP LEAST COUNT QUIZ V1 */'
          if marker not in s:
              code=r'''\n<script>/* SKILLUP LEAST COUNT QUIZ V1 */
(function(){
const quiz=[
['What is the least count of a measuring instrument?',['The largest quantity the instrument can measure','The smallest measurement that can be measured reliably by the instrument','The average of all readings','The total range of the instrument'],1,'Least count is the smallest value that an instrument can measure reliably.'],
['The least count of a metre scale commonly marked in millimetres is:',['1 cm','1 mm','0.1 mm','10 mm'],1,'The smallest division is 1 mm, so the least count is 1 mm.'],
['For a standard metre scale, 1 cm is divided into:',['2 equal parts','5 equal parts','10 equal parts','100 equal parts'],2,'Each centimetre is normally divided into 10 millimetres.'],
['A smaller least count generally means:',['Lower measurement resolution','Greater measurement resolution','Larger zero error','No uncertainty'],1,'A smaller least count allows finer measurements.'],
['The least count of a Vernier calipers is commonly calculated as:',['1 MSD + 1 VSD','1 MSD − 1 VSD','1 MSD × 1 VSD','1 MSD ÷ 1 VSD'],1,'For the usual direct Vernier, least count = 1 MSD − 1 VSD.'],
['If 10 Vernier scale divisions equal 9 main scale divisions and 1 MSD = 1 mm, the least count is:',['0.01 mm','0.1 mm','1.0 mm','1.9 mm'],1,'1 VSD = 9/10 mm = 0.9 mm, so LC = 1.0 − 0.9 = 0.1 mm.'],
['The least count of a screw gauge is calculated using:',['Pitch × number of divisions','Pitch ÷ number of circular scale divisions','Pitch + circular scale divisions','Pitch − circular scale divisions'],1,'Screw gauge least count = pitch divided by the number of circular scale divisions.'],
['A screw gauge has pitch 1 mm and 100 circular scale divisions. Its least count is:',['0.1 mm','0.01 mm','1 mm','100 mm'],1,'LC = 1/100 mm = 0.01 mm.'],
['If an instrument has a least count of 0.01 cm, the smallest reliable reading is:',['1 cm','0.1 cm','0.01 cm','0.001 cm'],2,'The least count itself represents the smallest readable increment.'],
['Which instrument normally provides finer length measurement?',['Metre scale with 1 mm divisions','Vernier calipers with 0.1 mm least count','A ruler with 1 cm divisions','A scale with 10 mm divisions'],1,'A smaller least count gives finer resolution.'],
['The least count is mainly related to an instrument’s:',['Resolution','Mass','Colour','Temperature'],0,'Least count describes the instrument resolution.'],
['If the smallest division on a scale is 2 mm, its least count is:',['0.2 mm','1 mm','2 mm','20 mm'],2,'The smallest marked division determines the least count for a simple scale.'],
['Two instruments have least counts 0.1 mm and 0.01 mm. Which has better resolution?',['0.1 mm instrument','0.01 mm instrument','Both are identical','Cannot be compared'],1,'0.01 mm is the smaller least count, so it gives better resolution.'],
['Can an instrument normally measure a value much smaller than its least count reliably?',['Yes, always','No, not reliably','Only if the unit is changed','Only for temperature'],1,'A value below the instrument’s resolution cannot normally be read reliably.'],
['Which statement about least count is correct?',['It is always equal to zero error','It determines the smallest reliable increment an instrument can resolve','It is the same as percentage error','It changes the physical quantity being measured'],1,'Least count characterizes measurement resolution and does not itself change the physical quantity.']
];
function run(){
const key=(new URLSearchParams(location.search).get('concept')||'').trim().toLowerCase();
if(key!=='least count')return;
const q=document.getElementById('question'),o=document.getElementById('options'),c=document.getElementById('check'),n=document.getElementById('next'),f=document.getElementById('feedback'),h=document.getElementById('hint'),ct=document.getElementById('count'),pct=document.getElementById('pct'),qt=document.getElementById('qbadge'),mt=document.getElementById('masteryText'),fill=document.getElementById('fill'),xp=document.getElementById('xp'),m=document.getElementById('mastery'),topic=document.getElementById('topic'),res=document.getElementById('result'),score=document.getElementById('score'),retry=document.getElementById('retry');
if(!q||!o||!c||!n)return;
let i=0,sel=-1,done=0,points=0;topic.textContent='Least Count';
function render(){const a=quiz[i];sel=-1;q.textContent=a[0];qt.textContent='Q'+(i+1);ct.textContent='Question '+(i+1)+' of '+quiz.length;pct.textContent=Math.round((i+1)/quiz.length*100)+'%';mt.textContent=done+' / '+quiz.length;fill.style.width=(done/quiz.length*100)+'%';h.textContent='Read the smallest reliable division carefully.';f.className='feedback';f.innerHTML='';n.disabled=true;c.disabled=false;o.innerHTML='';a[1].forEach((v,j)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+v;b.onclick=()=>{if(c.disabled)return;sel=j;Array.from(o.children).forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)});}
function check(){if(sel<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}const a=quiz[i],bs=Array.from(o.children);bs.forEach((b,j)=>{b.classList.remove('correct','wrong');if(j===a[2])b.classList.add('correct');else if(j===sel)b.classList.add('wrong')});const ok=sel===a[2];if(ok){done++;points+=10;xp.textContent=points;m.textContent=Math.round(done/quiz.length*100)+'%';f.className='feedback good';f.textContent='✓ Correct — '+a[3]}else{f.className='feedback bad';f.textContent='✗ Review — '+a[3]}c.disabled=true;n.disabled=false;mt.textContent=done+' / '+quiz.length;if(i===quiz.length-1)n.textContent='Finish Skill →';}
function next(){if(!c.disabled)return;if(i<quiz.length-1){i++;n.textContent='Next Question →';render()}else{q.textContent='🏆 Least Count Complete!';o.innerHTML='';c.style.display='none';n.style.display='none';h.textContent='';f.className='feedback good';f.textContent='Skill complete. '+points+' XP earned.';res.style.display='block';score.textContent=done+' / '+quiz.length+' correct • '+points+' XP'}}
c.onclick=check;n.onclick=next;if(retry)retry.onclick=()=>{i=0;sel=-1;done=0;points=0;xp.textContent='0';m.textContent='0%';res.style.display='none';c.style.display='';n.style.display='';render()};render();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(run,60));else setTimeout(run,60);
})();
</script>'''
              s=s+code
          p.write_text(s,encoding='utf-8')
          print('Verified Least Count quiz: 15 MCQs')
          PY

      - name: Verify Physics Errors in Measurement quiz
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('physics-concept.html').read_text(encoding='utf-8')
          required=[
            'What is an error in measurement?',
            'Which statement about errors is correct?',
            'What is absolute error?',
            'Relative error is defined as:',
            'Percentage error is:',
            "key!=='errors in measurement'"
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Errors in Measurement quiz verification failed: '+', '.join(missing))
          print('Verified Errors in Measurement dedicated quiz in source.')
          PY

      - name: Verify Physics quiz page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('physics-concept.html').read_text(encoding='utf-8')
          if '<title>SkillUp | Physics Concept Quiz</title>' not in s:
              raise SystemExit('Physics quiz page missing')
          print('Physics quiz page verified.')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
