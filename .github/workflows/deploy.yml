name: Deploy SkillUp NEET to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - 'assets/**'
      - 'icons/**'
      - 'question-banks/**'
      - 'data/**'
      - '.github/scripts/**'
      - '.github/workflows/deploy.yml'
      - 'CNAME'
      - 'manifest.webmanifest'
      - 'service-worker.js'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate Maths learning path before deployment
        run: python3 .github/scripts/smoke-test-maths-path.py

      - name: Rewrite question-bank paths for static hosting
        run: python3 .github/scripts/rewrite-question-bank-paths.py

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
