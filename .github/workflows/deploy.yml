name: Deploy SkillUp NEET to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Unit Conversion dedicated quiz
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-concept.html')
          s=p.read_text(encoding='utf-8')
          marker='/* SKILLUP UNIT CONVERSION EARLY ROUTE V3 */'
          if marker not in s:
              code='''<script>/* SKILLUP UNIT CONVERSION EARLY ROUTE V3 */\n(function(){var c=(new URLSearchParams(location.search).get('concept')||'').trim().toLowerCase();if(c==='unit conversion'){location.replace('physics-unit-conversion.html?concept=Unit%20conversion');}})();</script>\n'''
              s=s.replace('<body>', '<body>'+code, 1)
              p.write_text(s,encoding='utf-8')
          assert 'SKILLUP UNIT CONVERSION EARLY ROUTE V3' in p.read_text(encoding='utf-8')
          u=Path('physics-unit-conversion.html')
          if not u.exists():
              u.write_text('''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Unit Conversion</title></head><body><p>Unit Conversion quiz</p></body></html>''',encoding='utf-8')
          assert u.read_text(encoding='utf-8').count("['") >= 15
          print('Unit Conversion route validated')
          PY

      - name: Prepare Dimensions dedicated quiz
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-concept.html')
          s=p.read_text(encoding='utf-8')
          marker='/* SKILLUP DIMENSIONS EARLY ROUTE V1 */'
          if marker not in s:
              code='''<script>/* SKILLUP DIMENSIONS EARLY ROUTE V1 */\n(function(){var c=(new URLSearchParams(location.search).get('concept')||'').trim().toLowerCase();if(c==='dimensions'){location.replace('physics-dimensions.html');}})();</script>\n'''
              s=s.replace('<body>', '<body>'+code, 1)
              p.write_text(s,encoding='utf-8')
          assert 'SKILLUP DIMENSIONS EARLY ROUTE V1' in p.read_text(encoding='utf-8')
          d=Path('physics-dimensions.html')
          if not d.exists(): raise SystemExit('Dimensions page missing')
          print('Dimensions route validated')
          PY

      - name: Prepare Dimensional Analysis dedicated quiz
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-concept.html')
          s=p.read_text(encoding='utf-8')
          marker='/* SKILLUP DIMENSIONAL ANALYSIS EARLY ROUTE V1 */'
          if marker not in s:
              code='''<script>/* SKILLUP DIMENSIONAL ANALYSIS EARLY ROUTE V1 */\n(function(){var c=(new URLSearchParams(location.search).get('concept')||'').trim().toLowerCase();if(c==='dimensional analysis'){location.replace('physics-dimensional-analysis.html?concept=Dimensional%20analysis');}})();</script>\n'''
              s=s.replace('<body>', '<body>'+code, 1)
              p.write_text(s,encoding='utf-8')
          assert marker in p.read_text(encoding='utf-8')
          u=Path('physics-dimensional-analysis.html')
          if not u.exists(): raise SystemExit('Dimensional Analysis page missing')
          h=u.read_text(encoding='utf-8')
          assert h.count("['") == 15, 'Dimensional Analysis must contain exactly 15 MCQs'
          print('Dimensional Analysis route validated: 15 MCQs')
          PY

      - name: Verify Physics quiz page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('physics-concept.html').read_text(encoding='utf-8')
          assert '<title>SkillUp | Physics Concept Quiz</title>' in s
          assert 'SKILLUP UNIT CONVERSION EARLY ROUTE V3' in s
          assert 'SKILLUP DIMENSIONS EARLY ROUTE V1' in s
          assert 'SKILLUP DIMENSIONAL ANALYSIS EARLY ROUTE V1' in s
          print('Physics quiz page verified')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
