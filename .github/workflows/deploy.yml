name: Deploy SkillUp NEET to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Force Unit Conversion to dedicated quiz
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-concept.html')
          s=p.read_text(encoding='utf-8')
          marker='/* SKILLUP UNIT CONVERSION EARLY ROUTE V2 */'
          if marker not in s:
              script='''<script>/* SKILLUP UNIT CONVERSION EARLY ROUTE V2 */\n(function(){var c=(new URLSearchParams(location.search).get('concept')||'').trim().toLowerCase();if(c==='unit conversion'){location.replace('physics-unit-conversion.html?concept=Unit%20conversion');}})();</script>\n'''
              s=s.replace('<body>', '<body>'+script, 1)
              p.write_text(s,encoding='utf-8')
              print('Injected Unit Conversion early route')
          else:
              print('Unit Conversion early route already present')
          PY

      - name: Create dedicated Unit Conversion quiz page
        shell: bash
        run: |
          if [ ! -f physics-unit-conversion.html ]; then
          cat > physics-unit-conversion.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Unit Conversion Quiz</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eef7ff;color:#173b62}.wrap{max-width:1050px;margin:auto;padding:20px}.topbar{display:flex;justify-content:space-between;align-items:center}.back{color:#6b35a8;font-weight:800}.skills{display:flex;gap:8px;flex-wrap:wrap}.skill,.hero,.mastery,.panel,.quiz{background:#fff;border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #123b7015}.skill{padding:8px 12px}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff}.hero h1{margin:10px 0}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #dbe7f1;border-radius:15px;background:#fff;text-align:left;font-weight:700;cursor:pointer}.option.selected{border-color:#1677ff;background:#eef6ff}.option.correct{border-color:#2db84d;background:#eaffef}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{padding:12px 18px;border:0;border-radius:13px;font-weight:900;cursor:pointer;margin:8px 6px 0 0}.check{background:#2db84d;color:#fff}.next{background:#dcecff;color:#145b9e}.next:disabled{opacity:.45}.bar{height:13px;background:#dce8f2;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#42c95a}.feedback{margin-top:14px;padding:13px;border-radius:14px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}@media(max-width:750px){.layout{grid-template-columns:1fr}.topbar{flex-direction:column;align-items:flex-start}.wrap{padding:12px}}</style></head><body><main class="wrap"><div class="topbar"><a class="back" href="physics-home.html">← Back to Physics Path</a><div class="skills"><span class="skill">🔥 1 day</span><span class="skill">❤️ 5 lives</span><span class="skill">⚡ <span id="xp">0</span> XP</span><span class="skill">🏆 <span id="mastery">0%</span></span></div></div><section class="hero"><div>PHYSICS • NEET 2026</div><h1>Unit Conversion</h1><p>LEARN → PRACTICE → MASTER • 15 focused NEET-style MCQs</p></section><section class="mastery"><b>🎯 Skill Mastery</b><span id="masteryText">0 / 15</span><div class="bar"><div id="fill" class="fill"></div></div></section><div class="layout"><aside class="panel"><h3 id="count">Question 1 of 15</h3><div id="pct">7%</div><div>Unit Conversion</div><div>⚡ +10 XP each</div></aside><section class="quiz"><b id="qbadge">Q1</b><h2 id="question"></h2><div id="options" class="options"></div><button id="check" class="btn check">Check Answer</button><button id="next" class="btn next" disabled>Next Question →</button><div id="feedback"></div><p>💡 <span id="hint"></span></p><div id="result" style="display:none"><h2>🏆 Skill Complete!</h2><p id="score"></p><button id="retry" class="btn check">Retry Skill</button></div></section></div></main><script>
(function(){
var quiz=[
['What happens to a physical quantity when its unit is converted?',['The physical quantity remains the same while its numerical value may change','The physical quantity changes','Its dimensions disappear','It becomes dimensionless'],0,'A valid unit conversion changes the numerical representation, not the physical quantity.'],
['1 kilometre is equal to:',['10 m','100 m','1000 m','10,000 m'],2,'1 km = 1000 m.'],
['1 metre is equal to:',['10 cm','100 cm','1000 cm','0.01 cm'],1,'1 m = 100 cm.'],
['1 centimetre is equal to:',['10^-1 m','10^-2 m','10^-3 m','10^2 m'],1,'1 cm = 10^-2 m.'],
['1 millimetre is equal to:',['10^-2 m','10^-3 m','10^-6 m','10^3 m'],1,'1 mm = 10^-3 m.'],
['2.5 km is equal to:',['25 m','250 m','2500 m','25,000 m'],2,'2.5 × 1000 = 2500 m.'],
['500 cm is equal to:',['0.5 m','5 m','50 m','5000 m'],1,'500 cm ÷ 100 = 5 m.'],
['3.2 m is equal to:',['32 cm','320 cm','3200 cm','0.32 cm'],1,'3.2 × 100 = 320 cm.'],
['1 hour is equal to:',['60 s','600 s','3600 s','36,000 s'],2,'1 h = 3600 s.'],
['1 minute is equal to:',['30 s','60 s','100 s','600 s'],1,'1 min = 60 s.'],
['72 km/h is equal to:',['10 m/s','20 m/s','36 m/s','72 m/s'],1,'72 km/h × 5/18 = 20 m/s.'],
['1 gram is equal to:',['10^-1 kg','10^-2 kg','10^-3 kg','10^3 kg'],2,'1 g = 10^-3 kg.'],
['1 litre is equal to:',['10^-1 m^3','10^-2 m^3','10^-3 m^3','10^3 m^3'],2,'1 L = 10^-3 m^3.'],
['To convert 2500 mm to metres, you should:',['Multiply by 1000','Divide by 1000','Multiply by 100','Divide by 100'],1,'1000 mm = 1 m, so 2500 mm = 2.5 m.'],
['Which statement about unit conversion is correct?',['The numerical value may change, but the physical quantity and dimensions are preserved','The dimensions always change','The physical quantity changes','The unit must always be an SI base unit'],0,'Correct conversion preserves the physical quantity and its dimensions.']
];
var i=0,sel=-1,done=0,points=0,q=document.getElementById('question'),o=document.getElementById('options'),check=document.getElementById('check'),next=document.getElementById('next'),feedback=document.getElementById('feedback'),hint=document.getElementById('hint'),count=document.getElementById('count'),pct=document.getElementById('pct'),badge=document.getElementById('qbadge'),mt=document.getElementById('masteryText'),fill=document.getElementById('fill'),xp=document.getElementById('xp'),mastery=document.getElementById('mastery'),result=document.getElementById('result'),score=document.getElementById('score'),retry=document.getElementById('retry');
function render(){var a=quiz[i];sel=-1;q.textContent=a[0];badge.textContent='Q'+(i+1);count.textContent='Question '+(i+1)+' of '+quiz.length;pct.textContent=Math.round((i+1)/quiz.length*100)+'%';mt.textContent=done+' / '+quiz.length;fill.style.width=(done/quiz.length*100)+'%';hint.textContent='';feedback.className='feedback';feedback.textContent='';next.disabled=true;check.disabled=false;next.textContent='Next Question →';o.innerHTML='';a[1].forEach(function(v,j){var b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+v;b.onclick=function(){sel=j;Array.from(o.children).forEach(function(x){x.classList.remove('selected')});b.classList.add('selected')};o.appendChild(b)})}
function grade(){if(sel<0){feedback.className='feedback bad';feedback.textContent='Choose an answer first 👆';return}var a=quiz[i];Array.from(o.children).forEach(function(b,j){if(j===a[2])b.classList.add('correct');else if(j===sel)b.classList.add('wrong')});if(sel===a[2]){done++;points+=10;feedback.className='feedback good';feedback.textContent='🎯 Correct! +10 XP — '+a[3]}else{feedback.className='feedback bad';feedback.textContent='Not quite. Correct answer: '+a[1][a[2]]+' — '+a[3]}check.disabled=true;next.disabled=false;xp.textContent=points;mastery.textContent=Math.round(done/quiz.length*100)+'%';mt.textContent=done+' / '+quiz.length;if(i===quiz.length-1)next.textContent='Finish Skill →'}
function advance(){if(next.disabled)return;if(i<quiz.length-1){i++;render()}else{q.textContent='🏆 Unit Conversion Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';feedback.className='feedback good';feedback.textContent='Skill complete. '+done+' / '+quiz.length+' correct • '+points+' XP';result.style.display='block';score.textContent=done+' / '+quiz.length+' correct • '+points+' XP'}}
check.onclick=grade;next.onclick=advance;retry.onclick=function(){i=0;sel=-1;done=0;points=0;xp.textContent='0';mastery.textContent='0%';result.style.display='none';check.style.display='';next.style.display='';render()};render();})();</script></body></html>
HTML
          fi

      - name: Apply Least Count Physics quiz
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-concept.html')
          s=p.read_text(encoding='utf-8')
          marker='/* SKILLUP LEAST COUNT QUIZ V1 */'
          if marker not in s:
              code=r'''\n<script>/* SKILLUP LEAST COUNT QUIZ V1 */
(function(){
const quiz=[
['What is the least count of a measuring instrument?',['The largest quantity the instrument can measure','The smallest measurement that can be measured reliably by the instrument','The average of all readings','The total range of the instrument'],1,'Least count is the smallest value that an instrument can measure reliably.'],
['The least count of a metre scale commonly marked in millimetres is:',['1 cm','1 mm','0.1 mm','10 mm'],1,'The smallest division is 1 mm, so the least count is 1 mm.'],
['For a standard metre scale, 1 cm is divided into:',['2 equal parts','5 equal parts','10 equal parts','100 equal parts'],2,'Each centimetre is normally divided into 10 millimetres.'],
['A smaller least count generally means:',['Lower measurement resolution','Greater measurement resolution','Larger zero error','No uncertainty'],1,'A smaller least count allows finer measurements.'],
['The least count of a Vernier calipers is commonly calculated as:',['1 MSD + 1 VSD','1 MSD − 1 VSD','1 MSD × 1 VSD','1 MSD ÷ 1 VSD'],1,'For the usual direct Vernier, least count = 1 MSD − 1 VSD.'],
['If 10 Vernier scale divisions equal 9 main scale divisions and 1 MSD = 1 mm, the least count is:',['0.01 mm','0.1 mm','1.0 mm','1.9 mm'],1,'1 VSD = 9/10 mm = 0.9 mm, so LC = 1.0 − 0.9 = 0.1 mm.'],
['The least count of a screw gauge is calculated using:',['Pitch × number of divisions','Pitch ÷ number of circular scale divisions','Pitch + circular scale divisions','Pitch − circular scale divisions'],1,'Screw gauge least count = pitch divided by the number of circular scale divisions.'],
['A screw gauge has pitch 1 mm and 100 circular scale divisions. Its least count is:',['0.1 mm','0.01 mm','1 mm','100 mm'],1,'LC = 1/100 mm = 0.01 mm.'],
['If an instrument has a least count of 0.01 cm, the smallest reliable reading is:',['1 cm','0.1 cm','0.01 cm','0.001 cm'],2,'The least count itself represents the smallest readable increment.'],
['Which instrument normally provides finer length measurement?',['Metre scale with 1 mm divisions','Vernier calipers with 0.1 mm least count','A ruler with 1 cm divisions','A scale with 10 mm divisions'],1,'A smaller least count gives finer resolution.'],
['The least count is mainly related to an instrument’s:',['Resolution','Mass','Colour','Temperature'],0,'Least count describes the instrument resolution.'],
['If the smallest division on a scale is 2 mm, its least count is:',['0.2 mm','1 mm','2 mm','20 mm'],2,'The smallest marked division determines the least count for a simple scale.'],
['Two instruments have least counts 0.1 mm and 0.01 mm. Which has better resolution?',['0.1 mm instrument','0.01 mm instrument','Both are identical','Cannot be compared'],1,'0.01 mm is the smaller least count, so it gives better resolution.'],
['Can an instrument normally measure a value much smaller than its least count reliably?',['Yes, always','No, not reliably','Only if the unit is changed','Only for temperature'],1,'A value below the instrument’s resolution cannot normally be read reliably.'],
['Which statement about least count is correct?',['It is always equal to zero error','It determines the smallest reliable increment an instrument can resolve','It is the same as percentage error','It changes the physical quantity being measured'],1,'Least count characterizes measurement resolution and does not itself change the physical quantity.']
];
function run(){
const key=(new URLSearchParams(location.search).get('concept')||'').trim().toLowerCase();
if(key!=='least count')return;
const q=document.getElementById('question'),o=document.getElementById('options'),c=document.getElementById('check'),n=document.getElementById('next'),f=document.getElementById('feedback'),h=document.getElementById('hint'),ct=document.getElementById('count'),pct=document.getElementById('pct'),qt=document.getElementById('qbadge'),mt=document.getElementById('masteryText'),fill=document.getElementById('fill'),xp=document.getElementById('xp'),m=document.getElementById('mastery'),topic=document.getElementById('topic'),res=document.getElementById('result'),score=document.getElementById('score'),retry=document.getElementById('retry');
if(!q||!o||!c||!n)return;
let i=0,sel=-1,done=0,points=0;topic.textContent='Least Count';
function render(){const a=quiz[i];sel=-1;q.textContent=a[0];qt.textContent='Q'+(i+1);ct.textContent='Question '+(i+1)+' of '+quiz.length;pct.textContent=Math.round((i+1)/quiz.length*100)+'%';mt.textContent=done+' / '+quiz.length;fill.style.width=(done/quiz.length*100)+'%';h.textContent='Read the smallest reliable division carefully.';f.className='feedback';f.innerHTML='';n.disabled=true;c.disabled=false;o.innerHTML='';a[1].forEach((v,j)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+v;b.onclick=()=>{if(c.disabled)return;sel=j;Array.from(o.children).forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)});}
function check(){if(sel<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}const a=quiz[i],bs=Array.from(o.children);bs.forEach((b,j)=>{b.classList.remove('correct','wrong');if(j===a[2])b.classList.add('correct');else if(j===sel)b.classList.add('wrong')});const ok=sel===a[2];if(ok){done++;points+=10;xp.textContent=points;m.textContent=Math.round(done/quiz.length*100)+'%';f.className='feedback good';f.textContent='✓ Correct — '+a[3]}else{f.className='feedback bad';f.textContent='✗ Review — '+a[3]}c.disabled=true;n.disabled=false;mt.textContent=done+' / '+quiz.length;if(i===quiz.length-1)n.textContent='Finish Skill →';}
function next(){if(!c.disabled)return;if(i<quiz.length-1){i++;n.textContent='Next Question →';render()}else{q.textContent='🏆 Least Count Complete!';o.innerHTML='';c.style.display='none';n.style.display='none';h.textContent='';f.className='feedback good';f.textContent='Skill complete. '+points+' XP earned.';res.style.display='block';score.textContent=done+' / '+quiz.length+' correct • '+points+' XP'}}
c.onclick=check;n.onclick=next;if(retry)retry.onclick=()=>{i=0;done=0;points=0;xp.textContent='0';m.textContent='0%';res.style.display='none';c.style.display='';n.style.display='';render()};render();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(run,60));else setTimeout(run,60);
})();
</script>'''
              s=s+code
          p.write_text(s,encoding='utf-8')
          print('Verified Least Count quiz: 15 MCQs')
          PY

      - name: Verify Physics Errors in Measurement quiz
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('physics-concept.html').read_text(encoding='utf-8')
          required=[
            'What is an error in measurement?',
            'Which statement about errors is correct?',
            'What is absolute error?',
            'Relative error is defined as:',
            'Percentage error is:',
            "key!=='errors in measurement'"
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Errors in Measurement quiz verification failed: '+', '.join(missing))
          print('Verified Errors in Measurement dedicated quiz in source.')
          PY

      - name: Verify Unit Conversion route
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('physics-concept.html').read_text(encoding='utf-8')
          assert 'SKILLUP UNIT CONVERSION EARLY ROUTE V2' in s
          u=Path('physics-unit-conversion.html').read_text(encoding='utf-8')
          assert u.count("['") == 15, 'Unit Conversion must contain exactly 15 MCQs'
          print('Verified Unit Conversion dedicated page: 15 MCQs')
          PY

      - name: Verify Physics quiz page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('physics-concept.html').read_text(encoding='utf-8')
          if '<title>SkillUp | Physics Concept Quiz</title>' not in s:
              raise SystemExit('Physics quiz page missing')
          print('Physics quiz page verified.')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
