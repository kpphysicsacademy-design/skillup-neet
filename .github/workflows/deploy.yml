name: Deploy SkillUp NEET to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - 'assets/**'
      - 'icons/**'
      - 'question-banks/**'
      - 'data/**'
      - '.github/scripts/**'
      - '.github/workflows/deploy.yml'
      - 'CNAME'
      - 'robots.txt'
      - 'manifest.webmanifest'
      - 'service-worker.js'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate Maths learning path before deployment
        run: python3 .github/scripts/smoke-test-maths-path.py

      - name: Rewrite question-bank paths for static hosting
        run: python3 .github/scripts/rewrite-question-bank-paths.py

      - name: Generate and validate XML sitemap
        run: python3 .github/scripts/generate-sitemap.py

      - name: Run static SEO and internal-link audit
        run: python3 .github/scripts/seo-audit.py /tmp/skillup-seo-audit

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Wait for Pages artifact availability
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          for attempt in $(seq 1 12); do
            if gh api "repos/$GH_REPO/actions/runs/$GH_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -q '[0-9]'; then
              echo "Pages artifact is visible to GitHub API."
              exit 0
            fi
            echo "Pages artifact not yet indexed (attempt $attempt/12); waiting 10 seconds..."
            sleep 10
          done
          echo "::error::Uploaded Pages artifact never became visible to the GitHub API."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload SEO audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillup-seo-audit-report
          path: /tmp/skillup-seo-audit/
          if-no-files-found: warn
          retention-days: 30
