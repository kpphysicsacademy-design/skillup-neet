name: Deploy SkillUp NEET to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Physics Errors in Measurement quiz
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('physics-concept.html').read_text(encoding='utf-8')
          required=[
            'What is an error in measurement?',
            'Which statement about errors is correct?',
            'What is absolute error?',
            'Relative error is defined as:',
            'Percentage error is:',
            "key!=='errors in measurement'"
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Errors in Measurement quiz verification failed: '+', '.join(missing))
          print('Verified Errors in Measurement dedicated quiz in source.')
          PY

      - name: Verify Physics quiz page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('physics-concept.html').read_text(encoding='utf-8')
          if '<title>SkillUp | Physics Concept Quiz</title>' not in s:
              raise SystemExit('Physics quiz page missing')
          print('Physics quiz page verified.')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
