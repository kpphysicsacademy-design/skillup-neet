name: SkillUp design system contract
on:
  pull_request:
    paths:
      - 'assets/skillup-design-tokens.css'
      - 'assets/skillup-platform.css'
      - 'tests/test_skillup_design_system.py'
      - 'docs/architecture/centralized-design-system.md'
      - 'botany-home.html'
      - 'botany-quick-learn.html'
      - 'botany-mcq.html'
      - 'botany-cell-cheat-sheet.html'
      - 'physics-home-fast.html'
      - 'physics-physical-quantities.html'
      - 'physics-physical-quantities-practice.html'
      - 'physics-physical-quantities-simulator.html'
      - '.github/workflows/design-system-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate centralized design tokens and shared primitives
        run: python3 tests/test_skillup_design_system.py
