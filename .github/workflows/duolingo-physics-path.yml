name: Apply Duolingo Physics Path UI
on:
  push:
    branches: [main]
jobs:
  enhance:
    if: github.event.head_commit.message != 'Apply Duolingo SVG effects to Physics path'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply Duolingo style and SVG effects
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-home.html')
          s=p.read_text(encoding='utf-8')
          marker='/* DUOLINGO PHYSICS PATH EFFECTS */'
          if marker not in s:
              css='''\n/* DUOLINGO PHYSICS PATH EFFECTS */\n.chapter-card{position:relative;overflow:hidden;transform:translateZ(0);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}\n.chapter-card:before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:linear-gradient(180deg,#58b7ff,#1677ff);border-radius:20px 0 0 20px;opacity:.8}\n.chapter-card:hover{transform:translateY(-4px) scale(1.005);box-shadow:0 14px 30px rgba(18,59,112,.14);border-color:#8ebced}\n.chapter-card:active{transform:translateY(-1px) scale(.995)}\n.concept-svg{transition:transform .2s ease;filter:drop-shadow(0 3px 4px rgba(18,59,112,.12))}\n.chapter-card:hover .concept-svg{transform:rotate(-4deg) scale(1.08)}\n.go{transition:transform .18s ease,box-shadow .18s ease}\n.chapter-card:hover .go{transform:translateX(3px);box-shadow:0 5px 12px rgba(22,119,255,.28)}\n.path:before{background:repeating-linear-gradient(to bottom,#dbe8f5 0 12px,transparent 12px 22px)}\n.node{transition:transform .18s ease,background .18s ease,border-color .18s ease;box-shadow:0 0 0 0 rgba(22,119,255,0)}\n.chapter:hover .node{transform:scale(1.18);border-color:#6eaff0;box-shadow:0 0 0 5px rgba(22,119,255,.08)}\n.chapter.done .node{box-shadow:0 0 0 5px rgba(22,119,255,.08)}\n.chapter-card .meta .tag{transition:transform .15s ease}.chapter-card:hover .meta .tag{transform:translateY(-1px)}\n@keyframes skillup-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}\n.hero-mascot{animation:skillup-bob 2.4s ease-in-out infinite}\n@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}\n'''
              s=s.replace('</style>',css+'</style>',1)
              js='''\n<script>\n/* Duolingo-style micro-interactions: progress feedback + animated SVGs */\n(function(){\n  document.querySelectorAll('.chapter-card').forEach(function(card){\n    card.addEventListener('click',function(){\n      var svg=this.querySelector('.concept-svg');\n      if(svg && svg.animate) svg.animate([{transform:'scale(1) rotate(0deg)'},{transform:'scale(1.16) rotate(-5deg)'},{transform:'scale(1) rotate(0deg)'}],{duration:320,easing:'ease-out'});\n    });\n  });\n})();\n</script>\n'''
              s=s.replace('</body>',js+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'DUOLINGO PHYSICS PATH EFFECTS' physics-home.html
          grep -q 'skillup-bob' physics-home.html
          grep -q 'Duolingo-style micro-interactions' physics-home.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-home.html
          git commit -m 'Apply Duolingo SVG effects to Physics path'
          git push
