name: Enhance Physics Skill Cards
on:
  push:
    paths:
      - '.github/workflows/enhance-physics-skill-cards.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Duolingo-style skill mechanics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('physics-home.html')
          s=p.read_text(encoding='utf-8')
          marker='/* DUOLINGO PHYSICS SKILL BOOST V1 */'
          if marker in s:
              raise SystemExit('Already enhanced')
          css='''
          <style>
          /* DUOLINGO PHYSICS SKILL BOOST V1 */
          .chapter-card{isolation:isolate}
          .chapter-card:after{content:"";position:absolute;right:-28px;top:-28px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9) 0 10%,rgba(255,255,255,0) 62%);pointer-events:none;opacity:.7}
          .skill-badge{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:3px 7px;border-radius:999px;background:#fff3c4;color:#8a6500;border:1px solid #f1d77c;font-size:8px;font-weight:950;vertical-align:middle;box-shadow:0 2px 0 #e6cc7a}
          .skill-badge .spark{display:inline-block;animation:skill-spark 1.8s ease-in-out infinite}
          .skill-meter{position:relative;margin-top:9px;height:7px;background:#e9f1f8;border-radius:99px;overflow:hidden}
          .skill-meter i{display:block;width:0;height:100%;border-radius:99px;background:linear-gradient(90deg,#1677ff,#5cb4ff);transition:width 1s cubic-bezier(.2,.8,.2,1)}
          .skill-meter span{position:absolute;right:0;top:-15px;font-size:7px;font-weight:950;color:#6b7f96}
          .chapter-card .chapter-icon{position:relative;transition:transform .22s cubic-bezier(.2,.8,.2,1)}
          .chapter-card:hover .chapter-icon{transform:translateY(-4px) rotate(-5deg) scale(1.08)}
          .chapter-card .go{position:relative;z-index:2}
          .chapter-card .go:before{content:"";position:absolute;inset:-5px;border:2px solid rgba(22,119,255,.18);border-radius:50%;transform:scale(.8);opacity:0;transition:.2s}
          .chapter-card:hover .go:before{transform:scale(1);opacity:1}
          .skill-tip{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px;font-size:8px;font-weight:850;color:#60758c}
          .skill-tip b{color:#1677ff}
          @keyframes skill-spark{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.2) rotate(8deg)}}
          @keyframes skill-pop{0%{transform:scale(.94);opacity:.4}70%{transform:scale(1.03);opacity:1}100%{transform:scale(1);opacity:1}}
          .chapter-card{animation:skill-pop .45s ease both}
          .chapter:nth-child(2) .chapter-card{animation-delay:.03s}.chapter:nth-child(3) .chapter-card{animation-delay:.06s}.chapter:nth-child(4) .chapter-card{animation-delay:.09s}.chapter:nth-child(5) .chapter-card{animation-delay:.12s}
          @media(max-width:700px){.skill-badge{font-size:7px;padding:3px 6px}.skill-meter{height:6px}.skill-tip{font-size:7px}}
          @media(prefers-reduced-motion:reduce){.chapter-card,.skill-badge .spark{animation:none!important}.skill-meter i{transition:none!important}}
          </style>
          '''
          js='''
          <script>
          /* Duolingo-style visual skill layer: presentation only; existing navigation is preserved. */
          document.addEventListener('DOMContentLoaded',()=>{
            const cards=[...document.querySelectorAll('.chapter-card')];
            cards.forEach((card,index)=>{
              if(card.querySelector('.skill-badge')) return;
              const main=card.querySelector('.chapter-main');
              if(!main) return;
              const level=document.createElement('span');
              level.className='skill-badge';
              level.innerHTML='<span class="spark">✦</span> SKILL '+(index+1);
              const title=main.querySelector('h3');
              if(title) title.appendChild(level);
              const meter=document.createElement('div');
              meter.className='skill-meter';
              meter.innerHTML='<i></i><span>READY TO LEARN</span>';
              main.appendChild(meter);
              const tip=document.createElement('div');
              tip.className='skill-tip';
              tip.innerHTML='<span>🎯 Master this skill</span><b>+10 XP</b>';
              main.appendChild(tip);
              requestAnimationFrame(()=>setTimeout(()=>{meter.querySelector('i').style.width='8%';},80+index*25));
            });
          });
          </script>
          '''
          s=s.replace('</head>',css+js+'</head>',1)
          s=s.replace('</body>','<script>document.documentElement.classList.add("skillup-physics-enhanced");</script></body>',1)
          s=s.replace(marker,marker,1)
          s=s.replace('<style>','<style>/* '+marker+' */',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'DUOLINGO PHYSICS SKILL BOOST V1' physics-home.html
          grep -q 'skill-badge' physics-home.html
          grep -q 'skill-meter' physics-home.html
          grep -q '+10 XP' physics-home.html
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-home.html
          git diff --cached --quiet || git commit -m 'Enhance Physics cards with Duolingo-style skill mechanics'
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          git rm -f .github/workflows/enhance-physics-skill-cards.yml || true
          git diff --cached --quiet || git commit -m 'Remove one-time Physics skill enhancement workflow'
          git push || true
