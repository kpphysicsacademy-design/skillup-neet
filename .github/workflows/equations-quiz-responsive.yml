name: Equations quiz responsive regression
on:
  pull_request:
    paths:
      - 'maths-solutions-of-equations*'
      - '.github/workflows/equations-quiz-responsive.yml'
  workflow_dispatch:
jobs:
  responsive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: |
          python -m http.server 8765 > /tmp/equations-server.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for width in [320,360,390,768,1440]:
                  page = browser.new_page(viewport={"width":width,"height":900})
                  page.goto("http://localhost:8765/maths-solutions-of-equations-class9-quiz.html")
                  assert page.locator(".option").count() == 4
                  assert page.locator("#percent").inner_text() == "1 / 30"
                  assert page.evaluate("document.documentElement.scrollWidth <= innerWidth")
                  assert page.locator(".topic-tools a").count() == 2
                  for link in page.locator(".topic-tools a").all():
                      href = link.get_attribute("href")
                      assert page.request.get("http://localhost:8765/"+href).ok
                  page.locator(".option").nth(1).click()
                  page.locator("#check").click()
                  page.locator("#continue").click()
                  assert page.locator("#percent").inner_text() == "2 / 30"
                  print(f"PASS {width}px")
                  page.close()
              browser.close()
          PY
