name: Validate Firestore profile and progress rules
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/firestore/**'
      - '.github/workflows/firestore-rules-test.yml'
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'tests/firestore/**'
      - '.github/workflows/firestore-rules-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test dependencies
        run: npm install --no-save --no-package-lock firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Check test syntax
        run: |
          node --check tests/firestore/profile-rules.test.cjs
          node --check tests/firestore/progress-rules.test.cjs
      - name: Run Firestore emulator security tests
        run: npx firebase emulators:exec --only firestore --project demo-skillup-validation "node --test --test-concurrency=1 tests/firestore/profile-rules.test.cjs tests/firestore/progress-rules.test.cjs"
