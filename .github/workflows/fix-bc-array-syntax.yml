name: Fix Biological Classification array syntax

on:
  push:
    paths:
      - '.github/trigger-bc-array-fix.txt'
      - '.github/workflows/fix-bc-array-syntax.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair BC question array
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('zoology-chapter-test.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* SKILLUP-BC-EXTRA-20 */'
          bad = '],\\n' + marker
          good = ',\\n' + marker
          if bad in s:
              s = s.replace(bad, good, 1)
          elif '],\n' + marker in s:
              s = s.replace('],\n' + marker, ',\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git diff -- zoology-chapter-test.html
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zoology-chapter-test.html
          git diff --cached --quiet && echo 'No change needed' && exit 0
          git commit -m 'Fix Biological Classification question array'
          git push