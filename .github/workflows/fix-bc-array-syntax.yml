name: Fix Biological Classification array syntax

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair BC question array
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('zoology-chapter-test.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* SKILLUP-BC-EXTRA-20 */'
          bad = '],\\n' + marker
          good = ',\\n' + marker
          if bad in s:
              s = s.replace(bad, good, 1)
          elif '],\n' + marker in s:
              s = s.replace('],\n' + marker, ',\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git diff -- zoology-chapter-test.html
      - name: Propose Biological Classification syntax fix for review
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/bc-array-syntax-fix
          delete-branch: true
          commit-message: 'Propose Biological Classification array syntax fix'
          title: 'Review Biological Classification question-array syntax fix'
          body: |
            This PR contains the output of the Biological Classification array repair.

            Review the exact array boundary and verify the question bank parses and loads correctly before merging.
            The workflow no longer pushes directly to main.
          add-paths: |
            zoology-chapter-test.html
