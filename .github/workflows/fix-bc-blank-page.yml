name: Fix Biological Classification Blank Page

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Zoology quiz JavaScript syntax') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair known Zoology data-string syntax
        shell: python
        run: |
          from pathlib import Path
          p=Path('zoology-chapter-test.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            "NCERT's five-kingdom discussion":"NCERT’s five-kingdom discussion",
            "Whittaker's five-kingdom classification":"Whittaker’s five-kingdom classification",
          }
          changed=False
          for old,new in replacements.items():
              if old in s:
                  s=s.replace(old,new)
                  changed=True
                  print('Repaired:',old)
          p.write_text(s,encoding='utf-8')
          print('changed=',changed)

      - name: Validate embedded JavaScript
        shell: python
        run: |
          import re, subprocess
          from pathlib import Path
          s=Path('zoology-chapter-test.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script><script id="duo-js">',s)
          if not m: raise SystemExit('Main quiz script missing')
          Path('/tmp/main-quiz.js').write_text(m.group(1),encoding='utf-8')
          d=re.search(r'<script id="duo-js">([\s\S]*?)</script>',s)
          if not d: raise SystemExit('Duolingo script missing')
          Path('/tmp/duo.js').write_text(d.group(1),encoding='utf-8')
          for f in ['/tmp/main-quiz.js','/tmp/duo.js']:
              r=subprocess.run(['node','--check',f],capture_output=True,text=True)
              if r.returncode:
                  print(r.stdout);print(r.stderr);raise SystemExit(f+' has invalid JavaScript')
              print(f,'PASS')

      - name: Commit repaired Zoology page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zoology-chapter-test.html
          if git diff --cached --quiet; then
            echo "No Zoology syntax changes needed."
          else
            git commit -m "Fix Zoology quiz JavaScript syntax"
            git push
          fi
