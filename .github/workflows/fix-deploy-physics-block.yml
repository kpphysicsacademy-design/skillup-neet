name: Fix deploy blocker for Physics
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix stale Zoology verification parser
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/deploy.yml')
          s=p.read_text(encoding='utf-8')
          old='''          m=re.search(r"[\\'\\\"]What is Living\\?['\\\"]\\s*:\\s*\\[(.*?)\\],\\s*['\\\"]",s,re.S)\n          if not m: raise SystemExit('What is Living dataset missing')\n          block=m.group(1)'''
          new='''          start=s.find('"What is Living?":')\n          end=s.find('"Biological Classification":', start+1)\n          if start < 0 or end < 0: raise SystemExit('What is Living dataset missing')\n          block=s[start:end]'''
          if old not in s:
              raise SystemExit('Expected stale Zoology verification parser not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
      - name: Commit and remove
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy.yml
          git diff --cached --quiet || git commit -m 'Fix deploy verification parser'
          git push
          git rm -f .github/workflows/fix-deploy-physics-block.yml || true
          git diff --cached --quiet || git commit -m 'Remove one-time deploy blocker fix'
          git push || true
