name: Fix Dimensions Quiz Route
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route Dimensions to dedicated 15-MCQ page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-concept.html')
          s=p.read_text(encoding='utf-8')
          marker='SKILLUP DIMENSIONS EARLY ROUTE V2'
          if marker not in s:
              code="""<script>/* SKILLUP DIMENSIONS EARLY ROUTE V2 */
          (function(){var c=(new URLSearchParams(location.search).get('concept')||'').trim().toLowerCase();if(c==='dimensions'){location.replace('physics-dimensions.html?concept=Dimensions');}})();</script>
          """
              s=s.replace('<body>', '<body>'+code, 1)
              p.write_text(s, encoding='utf-8')
          assert marker in p.read_text(encoding='utf-8')
          assert Path('physics-dimensions.html').exists()
          print('Dimensions route verified')
          PY
      - name: Commit route
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-concept.html
          git diff --cached --quiet || git commit -m 'Fix Dimensions quiz routing'
          git push
      - name: Remove one-time fixer
        if: success()
        run: |
          git rm .github/workflows/fix-dimensions-route.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Remove Dimensions route fixer'
          git push
