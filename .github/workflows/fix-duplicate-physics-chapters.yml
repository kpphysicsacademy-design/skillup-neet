name: Fix Duplicate Physics Chapters
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate chapter navigator
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('physics-home.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'<style id="physics-chapters-style">.*?</style>\s*<section id="physics-chapters".*?</section>'
          s2,n=re.subn(pattern,'',s,count=1,flags=re.S|re.I)
          if n==0:
              pattern=r'<section id="physics-chapters".*?</section>'
              s2,n=re.subn(pattern,'',s,count=1,flags=re.S|re.I)
          if n==0:
              raise SystemExit('Duplicate Physics chapter section not found')
          p.write_text(s2,encoding='utf-8')
          PY
      - name: Verify
        run: |
          if grep -q 'id="physics-chapters"' physics-home.html; then exit 1; fi
          test "$(grep -o 'class="physics-chapter"' physics-home.html | wc -l)" -eq 0
          grep -q 'Physics Learning Path' physics-home.html
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-home.html
          git commit -m 'Remove duplicate Physics chapter navigator'
          git push
          git rm .github/workflows/fix-duplicate-physics-chapters.yml
          git commit -m 'Remove one-time Physics duplicate fix workflow'
          git push
