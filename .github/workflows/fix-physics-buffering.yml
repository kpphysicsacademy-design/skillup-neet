name: Fix Physics page buffering
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove blocking JavaScript defects
        shell: python
        run: |
          from pathlib import Path
          p=Path('physics-home.html')
          s=p.read_text(encoding='utf-8')
          s='\n'.join(line for line in s.splitlines() if not line.strip().startswith('const quizOverride='))
          s=s.replace("new MutationObserver(apply).observe(document.body,{childList:true,subtree:true});", "/* observer disabled: apply once to avoid recursive DOM mutation */")
          p.write_text(s,encoding='utf-8')
      - name: Verify fix markers
        run: |
          ! grep -q "const quizOverride=" physics-home.html
          ! grep -q "new MutationObserver(apply).observe" physics-home.html
          grep -q "PHYSICS 400 CONCEPT PATH INSTALL V2" physics-home.html
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-home.html
          git diff --cached --quiet || git commit -m 'Fix Physics page buffering and recursive DOM observer'
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-physics-buffering.yml || true
          git diff --cached --quiet || git commit -m 'Remove one-time Physics buffering fix workflow'
          git push || true
