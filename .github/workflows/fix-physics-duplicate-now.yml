name: Fix Physics duplicate chapter list
on:
  push:
    paths:
      - '.github/workflows/fix-physics-duplicate-now.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate Physics Chapters block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('physics-home.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- SKILLUP PHYSICS DUPLICATE-CHAPTER FIX -->'
          if marker not in s:
              css='''\n<style id="skillup-physics-duplicate-fix">\n/* Keep one Physics Learning Path; remove the legacy duplicate chapter navigator. */\n#physics-chapters,.physics-chapters{display:none!important}\n</style>\n'''
              js='''\n<!-- SKILLUP PHYSICS DUPLICATE-CHAPTER FIX -->\n<script>\n(function(){\n  function removeDuplicate(){\n    var nodes=document.querySelectorAll('h1,h2,h3,h4,h5,h6,div,section');\n    for(var i=0;i<nodes.length;i++){\n      var el=nodes[i];\n      var text=(el.textContent||'').replace(/\\s+/g,' ').trim();\n      if(text==='Physics Chapters'){\n        var target=el.closest('section')||el.closest('.section')||el.parentElement;\n        if(target && target.id!=='physics-learning-path' && target.id!=='path'){\n          target.remove();\n        }\n      }\n    }\n    var legacy=document.querySelector('#physics-chapters,.physics-chapters');\n    if(legacy) legacy.remove();\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',removeDuplicate);\n  else removeDuplicate();\n})();\n</script>\n'''
              s=s.replace('</head>',css+'</head>',1)
              s=s.replace('</body>',js+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Verify duplicate fix
        run: |
          grep -q 'SKILLUP PHYSICS DUPLICATE-CHAPTER FIX' physics-home.html
          grep -q '#physics-chapters,.physics-chapters' physics-home.html
      - name: Commit page fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-home.html
          git diff --cached --quiet || git commit -m 'Remove duplicate Physics Chapters navigator'
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-physics-duplicate-now.yml || true
          git diff --cached --quiet || git commit -m 'Remove one-time Physics duplicate fix workflow'
          git push || true
