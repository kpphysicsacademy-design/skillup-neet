name: Fix Physics Home Heading

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'Fix Physics duplicate heading' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove duplicate chapter heading and unit tagline
        shell: python
        run: |
          from pathlib import Path
          p = Path('physics-home.html')
          s = p.read_text(encoding='utf-8')
          marker = '</style>'
          css = '''\n/* SkillUp UI fix: keep one Physics and Measurement heading and remove the unit tagline. */\n.unit small{display:none!important}\n.chapter-main h3{display:none!important}\n'''
          if 'SkillUp UI fix: keep one Physics and Measurement heading' not in s:
              if marker not in s:
                  raise SystemExit('Could not find style closing tag')
              s = s.replace(marker, css + marker, 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit live-page fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-home.html
          git commit -m 'Fix Physics duplicate heading' || true
          git push
          git rm .github/workflows/fix-physics-heading.yml
          git commit -m 'Remove temporary Physics fix workflow'
          git push
