name: Fix Physics Learning Path

on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix Physics home
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('physics-home.html')
          s=p.read_text(encoding='utf-8')

          # Remove the obsolete 20-unit heading wherever it occurs.
          s=re.sub(r'<div class="path-heading"><b>\s*🧭\s*Your 20-Unit Physics Path</b>.*?</div>', '', s, flags=re.S)
          s=s.replace('🧭 Your 20-Unit Physics Path','')
          s=s.replace('Follow each unit from concept learning to NEET practice.','')

          # Remove the duplicate/obsolete CSS rule that hides every unit.
          s=s.replace('/* FINAL ALL UNIT HEADINGS REMOVED */\n.unit{display:none!important}\n.unit h2{display:none!important}\n','')

          # The old chapter bubbles used dead #chapter-N anchors. Make them real links.
          names=['Physics and Measurement','Kinematics','Laws of Motion','Work, Energy and Power','Rotational Motion','Gravitation','Properties of Solids and Liquids','Thermodynamics','Kinetic Theory of Gases','Oscillations and Waves','Electrostatics','Current Electricity','Magnetic Effects of Current and Magnetism','Electromagnetic Induction and Alternating Currents','Electromagnetic Waves','Optics','Dual Nature of Matter and Radiation','Atoms and Nuclei','Electronic Devices','Experimental Skills']
          for i,name in enumerate(names,1):
              enc=__import__('urllib.parse').parse.quote(name,safe='')
              s=s.replace(f'href="#chapter-{i:02d}"', f'href="physics-concept.html?concept={enc}"')

          # Remove chapter numbers from the decorative chapter bubbles.
          s=re.sub(r'<span class="badge">\d+</span>\s*','',s)

          # Remove the stale tracking parameter from the Units quiz.
          s=s.replace('physics-units-quiz.html?utm_source=chatgpt.com','physics-units-quiz.html')
          s=s.replace("const quizOverride='physics-units-quiz.html?utm_source=chatgpt.com';","const quizOverride='physics-units-quiz.html';")

          # Make chapter index buttons navigate to the real unit anchors generated by the page.
          s=s.replace("document.getElementById('physics-chapter-'+(i+1))?.scrollIntoView({behavior:'smooth',block:'start'})", "document.getElementById('physics-chapter-'+(i+1))?.scrollIntoView({behavior:'smooth',block:'start'})")

          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify
        run: |
          ! grep -q '🧭 Your 20-Unit Physics Path' physics-home.html
          ! grep -q 'utm_source=chatgpt.com' physics-home.html
          ! grep -q '<span class="badge">' physics-home.html
          test "$(grep -o 'href="#chapter-[0-9][0-9]"' physics-home.html | wc -l)" -eq 0
          grep -q 'Physics Learning Path' physics-home.html
          grep -q 'physics-concept.html?concept=' physics-home.html
          grep -q 'physics-units-quiz.html' physics-home.html

      - name: Commit and remove fixer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-home.html
          git rm .github/workflows/fix-physics-learning-path.yml
          git commit -m 'Fix Physics learning path links and structure'
          git push
