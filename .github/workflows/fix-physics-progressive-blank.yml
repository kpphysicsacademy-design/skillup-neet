name: Fix Physics progressive blank
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Install resilient renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-home-fast.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="physics-progressive-render-fix.js?v=1"></script>'
          if tag not in s:
              s=s.replace('</head>',tag+'</head>',1)
              p.write_text(s,encoding='utf-8')
          # Make the page visibly resilient even if the canonical dataset script is delayed.
          marker='<!-- PHYSICS PROGRESSIVE BLANK FIX V1 -->'
          if marker not in s:
              s=s.replace('<body>', '<body>'+marker, 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'physics-progressive-render-fix.js?v=1' physics-home-fast.html
          test -s physics-progressive-render-fix.js
      - name: Propose Physics progressive renderer fix for review
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/physics-progressive-blank-fix
          delete-branch: true
          commit-message: 'Propose Physics progressive renderer fix'
          title: 'Review Physics progressive blank-page resilience fix'
          body: |
            This PR proposes adding the existing progressive renderer to the Physics home page.

            Review script loading order, dataset compatibility, rendering and search behavior on mobile and desktop before merging.
            The workflow no longer pushes generated HTML directly to main and remains available for controlled manual execution.
          add-paths: |
            physics-home-fast.html
