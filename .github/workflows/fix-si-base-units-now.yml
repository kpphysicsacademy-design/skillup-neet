name: Fix SI Base Units NEET MCQs
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch quiz
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-concept.html')
          s=p.read_text(encoding='utf-8')
          bank='''const siBaseUnitsQuiz=[
['Which of the following is an SI base unit?',['newton','joule','metre','watt'],2,'Metre (m) is the SI base unit of length.'],
['The SI base unit of mass is:',['gram','kilogram','tonne','milligram'],1,'Kilogram (kg) is the SI base unit of mass.'],
['Which is the SI base unit of time?',['minute','hour','second','day'],2,'The SI base unit of time is the second (s).'],
['The SI base unit of electric current is:',['coulomb','volt','ampere','ohm'],2,'Ampere (A) is the SI base unit of electric current.'],
['Which is the SI base unit of thermodynamic temperature?',['degree Celsius','kelvin','joule','degree Fahrenheit'],1,'Kelvin (K) is the SI base unit of thermodynamic temperature.'],
['The SI base unit of amount of substance is:',['gram','mole','litre','candela'],1,'Mole (mol) is the SI base unit of amount of substance.'],
['Which is the SI base unit of luminous intensity?',['lumen','lux','candela','watt'],2,'Candela (cd) is the SI base unit of luminous intensity.'],
['How many SI base units are there in the SI system?',['5','6','7','8'],2,'There are seven SI base units.'],
['Which pair contains only SI base units?',['metre and second','newton and joule','volt and watt','pascal and coulomb'],0,'Metre and second are SI base units.'],
['Which SI base unit is represented by kg?',['length','mass','time','temperature'],1,'kg represents kilogram, the SI base unit of mass.'],
['Which statement about SI base units is correct?',['They correspond to the seven SI base quantities','Every SI unit is a base unit','Newton is a base unit','Base units cannot form derived units'],0,'Derived SI units are formed from combinations of base units.'],
['Which is NOT an SI base unit?',['ampere','kelvin','newton','candela'],2,'Newton (N) is a derived SI unit.'],
['The SI symbol for amount of substance is:',['M','mol','mole','am'],1,'The standardized SI symbol is mol.'],
['Which SI base unit is used for length?',['m','cm','km','mm'],0,'Metre (m) is the SI base unit of length.'],
['Which statement correctly distinguishes a base unit from a derived SI unit?',['Metre is a base unit, while newton is derived','Newton is base and metre is derived','Both are base units','Neither is an SI unit'],0,'Newton is kg·m·s⁻², while metre is a base unit.']
];'''
          if 'const siBaseUnitsQuiz=' not in s:
              s=s.replace('const generic=[];',bank+'\nconst generic=[];',1)
          old="const questions=key==='units of measurement'?unitsQuiz:key==='physical quantities'?physicalQuantitiesQuiz:generic;"
          new="const questions=key==='units of measurement'?unitsQuiz:key==='physical quantities'?physicalQuantitiesQuiz:key==='si base units'?siBaseUnitsQuiz:generic;"
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('physics-concept.html').read_text()
          assert 'const siBaseUnitsQuiz=' in s
          assert "key==='si base units'?siBaseUnitsQuiz" in s
          assert s.split('const siBaseUnitsQuiz=')[1].split('];',1)[0].count("['") == 15
          print('PASS: SI Base Units has 15 dedicated MCQs')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add physics-concept.html
          git commit -m 'Implement SI Base Units NEET MCQs'
          git push
          git rm .github/workflows/fix-si-base-units-now.yml
          git commit -m 'Remove one-time SI Base Units fixer'
          git push
