name: Fix Unit Conversion Quiz Routing
# Trigger follow-up
on:
  push:
    paths:
      - '.github/workflows/fix-unit-conversion-routing.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Unit Conversion quiz routing override
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-concept.html')
          s=p.read_text(encoding='utf-8')
          marker='/* SKILLUP UNIT CONVERSION ROUTING V1 */'
          if marker in s:
              print('Routing override already present')
              raise SystemExit(0)
          script=r'''<script>/* SKILLUP UNIT CONVERSION ROUTING V1 */
          (function(){
          var key=(new URLSearchParams(location.search).get('concept')||'').trim().toLowerCase();
          if(key!=='unit conversion')return;
          var quiz=[
          ['What happens to a physical quantity when its unit is converted?',['The physical quantity remains the same while its numerical value may change','The physical quantity changes','Its dimensions disappear','It becomes dimensionless'],0,'A valid unit conversion changes the numerical representation, not the physical quantity.'],
          ['1 kilometre is equal to:',['10 m','100 m','1000 m','10,000 m'],2,'1 km = 1000 m.'],
          ['1 metre is equal to:',['10 cm','100 cm','1000 cm','0.01 cm'],1,'1 m = 100 cm.'],
          ['1 centimetre is equal to:',['10^-1 m','10^-2 m','10^-3 m','10^2 m'],1,'1 cm = 10^-2 m.'],
          ['1 millimetre is equal to:',['10^-2 m','10^-3 m','10^-6 m','10^3 m'],1,'1 mm = 10^-3 m.'],
          ['2.5 km is equal to:',['25 m','250 m','2500 m','25,000 m'],2,'2.5 × 1000 = 2500 m.'],
          ['500 cm is equal to:',['0.5 m','5 m','50 m','5000 m'],1,'500 cm ÷ 100 = 5 m.'],
          ['3.2 m is equal to:',['32 cm','320 cm','3200 cm','0.32 cm'],1,'3.2 × 100 = 320 cm.'],
          ['1 hour is equal to:',['60 s','600 s','3600 s','36,000 s'],2,'1 h = 3600 s.'],
          ['1 minute is equal to:',['30 s','60 s','100 s','600 s'],1,'1 min = 60 s.'],
          ['72 km/h is equal to:',['10 m/s','20 m/s','36 m/s','72 m/s'],1,'72 km/h × 5/18 = 20 m/s.'],
          ['1 gram is equal to:',['10^-1 kg','10^-2 kg','10^-3 kg','10^3 kg'],2,'1 g = 10^-3 kg.'],
          ['1 litre is equal to:',['10^-1 m^3','10^-2 m^3','10^-3 m^3','10^3 m^3'],2,'1 L = 10^-3 m^3.'],
          ['To convert 2500 mm to metres, you should:',['Multiply by 1000','Divide by 1000','Multiply by 100','Divide by 100'],1,'1000 mm = 1 m, so 2500 mm = 2.5 m.'],
          ['Which statement about unit conversion is correct?',['The numerical value may change, but the physical quantity and dimensions are preserved','The dimensions always change','The physical quantity changes','The unit must always be an SI base unit'],0,'Correct conversion preserves the physical quantity and its dimensions.']
          ];
          function start(){
          var q=document.getElementById('question'),o=document.getElementById('options'),check=document.getElementById('check'),next=document.getElementById('next'),feedback=document.getElementById('feedback'),hint=document.getElementById('hint'),count=document.getElementById('count'),pct=document.getElementById('pct'),badge=document.getElementById('qbadge'),mt=document.getElementById('masteryText'),fill=document.getElementById('fill'),xp=document.getElementById('xp'),mastery=document.getElementById('mastery'),result=document.getElementById('result'),score=document.getElementById('score'),retry=document.getElementById('retry'),title=document.getElementById('title'),topic=document.getElementById('topic');
          if(!q||!o||!check||!next)return;
          title.textContent='Unit Conversion'; topic.textContent='Unit Conversion';
          var i=0,sel=-1,done=0,points=0;
          function render(){var a=quiz[i];sel=-1;q.textContent=a[0];badge.textContent='Q'+(i+1);count.textContent='Question '+(i+1)+' of '+quiz.length;pct.textContent=Math.round((i+1)/quiz.length*100)+'%';mt.textContent=done+' / '+quiz.length;fill.style.width=(done/quiz.length*100)+'%';hint.textContent='';feedback.className='feedback';feedback.textContent='';next.disabled=true;check.disabled=false;next.textContent='Next Question →';o.innerHTML='';a[1].forEach(function(v,j){var b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+v;b.onclick=function(){sel=j;Array.from(o.children).forEach(function(x){x.classList.remove('selected')});b.classList.add('selected')};o.appendChild(b)})}
          function grade(){if(sel<0){feedback.className='feedback bad';feedback.textContent='Choose an answer first 👆';return}var a=quiz[i];Array.from(o.children).forEach(function(b,j){if(j===a[2])b.classList.add('correct');else if(j===sel)b.classList.add('wrong')});if(sel===a[2]){done++;points+=10;feedback.className='feedback good';feedback.textContent='🎯 Correct! +10 XP — '+a[3]}else{feedback.className='feedback bad';feedback.textContent='Not quite. Correct answer: '+a[1][a[2]]+' — '+a[3]}check.disabled=true;next.disabled=false;xp.textContent=points;mastery.textContent=Math.round(done/quiz.length*100)+'%';mt.textContent=done+' / '+quiz.length;if(i===quiz.length-1)next.textContent='Finish Skill →'}
          function advance(){if(next.disabled)return;if(i<quiz.length-1){i++;render()}else{q.textContent='🏆 Unit Conversion Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';feedback.className='feedback good';feedback.textContent='Skill complete. '+done+' / '+quiz.length+' correct • '+points+' XP';result.style.display='block';score.textContent=done+' / '+quiz.length+' correct • '+points+' XP'}}
          check.onclick=grade;next.onclick=advance;retry.onclick=function(){i=0;sel=-1;done=0;points=0;xp.textContent='0';mastery.textContent='0%';result.style.display='none';check.style.display='';next.style.display='';render()};render();
          }
          setTimeout(start,100);
          })();</script>'''
          s=s.replace('</body>',script+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('physics-concept.html').read_text(encoding='utf-8')
          assert 'SKILLUP UNIT CONVERSION ROUTING V1' in s
          assert "key!=='unit conversion'" in s
          assert s.count("'What happens to a physical quantity when its unit is converted?'") == 1
          print('Unit Conversion routing override validated')
          PY
      - name: Commit and remove updater
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-concept.html
          git commit -m 'Fix Unit Conversion quiz routing [skip ci]'
          git rm .github/workflows/fix-unit-conversion-routing.yml
          git commit -m 'Remove one-time Unit Conversion routing fixer [skip ci]'
          git push origin HEAD:main
