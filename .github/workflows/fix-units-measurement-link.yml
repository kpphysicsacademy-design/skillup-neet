name: Fix Units of Measurement quiz link
on:
  push:
    branches: [main]
jobs:
  fix-link:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace link
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-home.html')
          s=p.read_text()
          old='physics-concept.html?concept=Units%20of%20Measurement'
          new='physics-units-quiz.html?utm_source=chatgpt.com'
          if old in s:
              s=s.replace(old,new)
          else:
              # Handle dynamically generated concept links by adding a specific route override.
              marker='const topics=['
              if marker not in s:
                  raise SystemExit('Physics topics array not found')
              s=s.replace(marker, "const quizOverride='physics-units-quiz.html?utm_source=chatgpt.com';\n"+marker, 1)
              # Replace the generated concept URL only for this exact sub-concept.
              needle="encodeURIComponent(c)"
              if needle in s:
                  s=s.replace(needle, "(c==='Units of Measurement' ? quizOverride : encodeURIComponent(c))", 1)
              else:
                  raise SystemExit('Concept URL builder not found')
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'physics-units-quiz.html?utm_source=chatgpt.com' physics-home.html
          ! grep -q 'physics-concept.html?concept=Units%20of%20Measurement' physics-home.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-home.html
          git diff --cached --quiet || git commit -m 'Link Units of Measurement to quiz'
          git push
