name: Fix What is Living Lesson MCQs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-what-is-living.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove duplicate MCQs and keep 30 unique questions
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('zoology-chapter-test.html')
          s = p.read_text(encoding='utf-8')
          start_marker = "'What is Living?':["
          boundary = "],'Biological Classification'"
          start = s.find(start_marker)
          if start < 0:
              raise SystemExit('What is Living dataset not found')
          body_start = start + len(start_marker)
          end = s.find(boundary, body_start)
          if end < 0:
              raise SystemExit('Biological Classification boundary not found')
          body = s[body_start:end]

          # Each MCQ is a flat object. This safely handles quoted strings while
          # preserving the original object text and explanations.
          objects = re.findall(r'\{(?:(?:[^{}"\\]|\\.)|"(?:\\.|[^"\\])*"|\'(?:\\.|[^\'\\])*\')*\}', body, re.S)
          if not objects:
              raise SystemExit('No MCQ objects found')

          unique = []
          seen = set()
          for obj in objects:
              m = re.search(r"(?:['\"]q['\"]|q)\s*:\s*(['\"])(.*?)\1", obj, re.S)
              if not m:
                  raise SystemExit('Could not read MCQ question text')
              q = re.sub(r'\s+', ' ', m.group(2)).strip().lower()
              if q in seen:
                  continue
              seen.add(q)
              unique.append(obj)

          if len(unique) < 30:
              raise SystemExit(f'Only {len(unique)} unique MCQs found; refusing to reduce the lesson')

          selected = unique[:30]
          replacement = ','.join(selected)
          s = s[:body_start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

          print(f'Original MCQ objects: {len(objects)}')
          print(f'Unique MCQs found: {len(unique)}')
          print('Final What is Living? MCQs: 30')

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zoology-chapter-test.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Fix What is Living lesson MCQs'
          git push
