name: Fix Zoology Quiz JavaScript Syntax

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Escape apostrophes inside existing JavaScript strings
        shell: python
        run: |
          from pathlib import Path
          p=Path('zoology-chapter-test.html')
          s=p.read_text(encoding='utf-8')
          fixes={
            "NCERT's five-kingdom discussion":"NCERT\\'s five-kingdom discussion",
            "Whittaker's five-kingdom classification":"Whittaker\\'s five-kingdom classification",
          }
          changed=False
          for old,new in fixes.items():
            if old in s:
              s=s.replace(old,new)
              changed=True
              print('Fixed:',old)
          p.write_text(s,encoding='utf-8')
          if not changed:
            print('No apostrophe replacements were necessary.')

      - name: Validate the page JavaScript syntax
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const s=fs.readFileSync('zoology-chapter-test.html','utf8');
          const m=s.match(/<script>([\s\S]*?)<\/script><script id="duo-js">/);
          if(!m) throw new Error('Main quiz script not found');
          new vm.Script(m[1]);
          console.log('Main quiz JavaScript syntax: PASS');
          const d=s.match(/<script id="duo-js">([\s\S]*?)<\/script>/);
          if(!d) throw new Error('Duolingo script not found');
          new vm.Script(d[1]);
          console.log('Duolingo JavaScript syntax: PASS');
          NODE

      - name: Propose Zoology apostrophe repair for review
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/zoology-apostrophe-syntax-fix
          delete-branch: true
          commit-message: 'Propose Zoology quiz apostrophe syntax repair'
          title: 'Review Zoology quiz apostrophe syntax repair'
          body: |
            This PR proposes the output of the targeted apostrophe repair.

            Review exact string-literal changes and validate both embedded JavaScript blocks and quiz runtime before merging.
            The workflow no longer pushes generated HTML directly to main.
          add-paths: |
            zoology-chapter-test.html
