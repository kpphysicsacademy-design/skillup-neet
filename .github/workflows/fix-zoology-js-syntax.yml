name: Fix Zoology test JavaScript syntax

on:
  push:
    paths:
      - '.github/workflows/fix-zoology-js-syntax.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove malformed JavaScript line-continuation backslashes
        shell: python
        run: |
          from pathlib import Path
          p = Path('zoology-chapter-test.html')
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace(']\\', '],')
          if s == old:
              print('No malformed ]\\ sequences found')
          else:
              p.write_text(s, encoding='utf-8')
              print('Fixed malformed ]\\ sequences:', old.count(']\\'))
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- zoology-chapter-test.html; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zoology-chapter-test.html
          git commit -m 'Fix Zoology test JavaScript syntax'
          git push
