name: Fix Zoology Test JavaScript Syntax

on:
  push:
    branches: [main]
    paths:
      - 'zoology-chapter-test.html'
      - '.github/workflows/fix-zoology-test-syntax.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair single-quoted JavaScript strings
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('zoology-chapter-test.html')
          html = p.read_text(encoding='utf-8')
          m = re.search(r'<script>(.*?)</script>', html, re.S)
          if not m:
              raise SystemExit('Test script not found')

          js = m.group(1)
          out = []
          i = 0
          quote = None
          changed = False

          while i < len(js):
              c = js[i]
              if quote is None:
                  out.append(c)
                  if c in "'\"`":
                      quote = c
                  i += 1
                  continue

              if c == '\\':
                  out.append(c)
                  if i + 1 < len(js):
                      out.append(js[i + 1])
                      i += 2
                  else:
                      i += 1
                  continue

              if quote == "'" and c == "'":
                  j = i + 1
                  while j < len(js) and js[j].isspace():
                      j += 1
                  nxt = js[j] if j < len(js) else ''
                  # A quote followed by a JS delimiter closes the string.
                  if nxt in ',]}:;)' or nxt == '':
                      out.append(c)
                      quote = None
                  else:
                      # Otherwise it is an apostrophe inside the string.
                      out.append("\\'")
                      changed = True
                  i += 1
                  continue

              if c == quote:
                  out.append(c)
                  quote = None
                  i += 1
                  continue

              out.append(c)
              i += 1

          fixed_js = ''.join(out)
          fixed_html = html[:m.start(1)] + fixed_js + html[m.end(1):]
          p.write_text(fixed_html, encoding='utf-8')
          print('Syntax repair changed file:', changed)

      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('zoology-chapter-test.html').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*?)</script>', s, re.S)
          if not m:
              raise SystemExit('Test script not found')
          Path('/tmp/zoology-test.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/zoology-test.js

      - name: Verify 30 Lesson 1 MCQs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('zoology-chapter-test.html').read_text(encoding='utf-8')
          m = re.search(r"'What is Living\?':\[(.*?)\],\s*'", s, re.S)
          if not m:
              raise SystemExit('What is Living dataset missing')
          count = len(re.findall(r"\{q:'", m.group(1)))
          print('What is Living MCQs:', count)
          if count != 30:
              raise SystemExit(f'Expected 30 MCQs, found {count}')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zoology-chapter-test.html
          if git diff --cached --quiet; then
            echo 'No syntax changes needed'
          else
            git commit -m 'Fix Zoology test JavaScript syntax'
            git push
          fi
