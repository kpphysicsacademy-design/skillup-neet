name: Fix Zoology Test JavaScript Syntax

on:
  push:
    branches: [main]
    paths:
      - 'zoology-chapter-test.html'
      - '.github/workflows/fix-zoology-test-syntax.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair single-quoted JavaScript strings
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('zoology-chapter-test.html')
          s = p.read_text(encoding='utf-8')

          # Repair apostrophes inside single-quoted JS strings, e.g. NCERT's.
          # Structural closing quotes are followed by JS delimiters such as
          # comma, ], }, or colon; apostrophes inside words are escaped.
          out = []
          i = 0
          in_single = False
          changed = False
          while i < len(s):
              c = s[i]
              if not in_single:
                  out.append(c)
                  if c == "'" and (i == 0 or s[i-1] != '\\'):
                      in_single = True
                  i += 1
                  continue

              if c == "\\":
                  out.append(c)
                  if i + 1 < len(s):
                      out.append(s[i+1])
                      i += 2
                  else:
                      i += 1
                  continue

              if c == "'":
                  j = i + 1
                  while j < len(s) and s[j].isspace():
                      j += 1
                  nxt = s[j] if j < len(s) else ''
                  if nxt in ',]}:;)' or nxt == '':
                      out.append(c)
                      in_single = False
                  else:
                      out.append("\\'")
                      changed = True
                  i += 1
                  continue

              out.append(c)
              i += 1

          fixed = ''.join(out)
          p.write_text(fixed, encoding='utf-8')
          print('Syntax repair changed file:', changed)

      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('zoology-chapter-test.html').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*?)</script>', s, re.S)
          if not m:
              raise SystemExit('Test script not found')
          Path('/tmp/zoology-test.js').write_text(m.group(1), encoding='utf-8')
          print('Extracted JavaScript for syntax validation')
          PY
          node --check /tmp/zoology-test.js

      - name: Verify 30 Lesson 1 MCQs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('zoology-chapter-test.html').read_text(encoding='utf-8')
          m = re.search(r"'What is Living\?':\[(.*?)\],\s*'", s, re.S)
          if not m:
              raise SystemExit('What is Living dataset missing')
          count = len(re.findall(r"\{q:'", m.group(1)))
          print('What is Living MCQs:', count)
          if count != 30:
              raise SystemExit(f'Expected 30 MCQs, found {count}')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zoology-chapter-test.html
          if git diff --cached --quiet; then
            echo 'No syntax changes needed'
          else
            git commit -m 'Fix Zoology test JavaScript syntax'
            git push
          fi
