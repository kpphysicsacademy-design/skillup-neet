name: Fix Zoology Unit 1 live layout

on:
  push:
    paths:
      - '.github/workflows/fix-zoology-unit1-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-unit1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace Unit 1 section
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('zoology-full-path.html')
          html = path.read_text(encoding='utf-8')

          replacement = '''<section class="section"><div class="section-head"><div><div class="unit">UNIT 1</div><h2>Diversity in Living World</h2></div><span class="goal">Build the basics</span></div><div class="chapters-head"><b>📚 Chapters under Unit 1</b><span>27 chapters</span></div><div class="grid"><a class="chapter" href="zoology-chapter-test.html?chapter=What%20is%20Living%3F"><div class="chapter-head"><div><div class="title">What is Living?</div><div class="scope">Living characteristics, metabolism, consciousness and reproduction</div></div><div class="icon">🌱</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=What%20is%20Living%3F"><div class="chapter-head"><div><div class="title">Characteristics of living organisms</div><div class="scope">Core features that distinguish living systems</div></div><div class="icon">🌱</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=What%20is%20Living%3F"><div class="chapter-head"><div><div class="title">Growth and reproduction</div><div class="scope">Growth patterns and reproduction in organisms</div></div><div class="icon">🌿</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=What%20is%20Living%3F"><div class="chapter-head"><div><div class="title">Metabolism</div><div class="scope">Anabolism, catabolism and energy flow</div></div><div class="icon">⚡</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=What%20is%20Living%3F"><div class="chapter-head"><div><div class="title">Cellular organisation</div><div class="scope">Cell as the structural and functional unit</div></div><div class="icon">🔬</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=What%20is%20Living%3F"><div class="chapter-head"><div><div class="title">Consciousness and response to stimuli</div><div class="scope">Sensitivity, movement and response</div></div><div class="icon">🧠</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=Biological%20Classification"><div class="chapter-head"><div><div class="title">Biodiversity and classification</div><div class="scope">Diversity of organisms and need for classification</div></div><div class="icon">🌍</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=Biological%20Classification"><div class="chapter-head"><div><div class="title">Taxonomy and systematics</div><div class="scope">Principles, scope and relationships</div></div><div class="icon">📚</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=Biological%20Classification"><div class="chapter-head"><div><div class="title">Taxonomic hierarchy</div><div class="scope">Kingdom to species hierarchy</div></div><div class="icon">🔺</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=Biological%20Classification"><div class="chapter-head"><div><div class="title">Species concept</div><div class="scope">Definition, types and significance</div></div><div class="icon">👥</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=Biological%20Classification"><div class="chapter-head"><div><div class="title">Binomial nomenclature</div><div class="scope">Rules and examples of scientific naming</div></div><div class="icon">✍️</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=Biological%20Classification"><div class="chapter-head"><div><div class="title">Taxonomic aids</div><div class="scope">Herbarium, botanical garden, museum and keys</div></div><div class="icon">🔎</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=Biological%20Classification"><div class="chapter-head"><div><div class="title">Biological Classification</div><div class="scope">Five-kingdom classification and criteria</div></div><div class="icon">🧫</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=Biological%20Classification"><div class="chapter-head"><div><div class="title">Five-kingdom classification</div><div class="scope">Overview and major criteria</div></div><div class="icon">🗂️</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=Biological%20Classification"><div class="chapter-head"><div><div class="title">Monera and Archaebacteria</div><div class="scope">General characters and importance</div></div><div class="icon">🦠</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=Biological%20Classification"><div class="chapter-head"><div><div class="title">Eubacteria and cyanobacteria</div><div class="scope">Features and examples</div></div><div class="icon">🧫</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=Biological%20Classification"><div class="chapter-head"><div><div class="title">Protista</div><div class="scope">General characters, types and examples</div></div><div class="icon">🧬</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=Biological%20Classification"><div class="chapter-head"><div><div class="title">Fungi and lichens</div><div class="scope">Characteristics, reproduction and significance</div></div><div class="icon">🍄</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=Biological%20Classification"><div class="chapter-head"><div><div class="title">Viruses and viroids</div><div class="scope">Structure, reproduction and importance</div></div><div class="icon">🦠</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=Animal%20Kingdom"><div class="chapter-head"><div><div class="title">Animal Kingdom</div><div class="scope">Non-chordates up to phyla and chordates up to classes</div></div><div class="icon">🦋</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=Animal%20Kingdom"><div class="chapter-head"><div><div class="title">Animal classification</div><div class="scope">Basis and broad groups</div></div><div class="icon">🐾</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=Animal%20Kingdom"><div class="chapter-head"><div><div class="title">Symmetry and germ layers</div><div class="scope">Types of symmetry and germ layers</div></div><div class="icon">⭐</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=Animal%20Kingdom"><div class="chapter-head"><div><div class="title">Coelom and segmentation</div><div class="scope">Types of coelom and segmentation</div></div><div class="icon">🪱</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=Animal%20Kingdom"><div class="chapter-head"><div><div class="title">Notochord</div><div class="scope">Structure, function and significance</div></div><div class="icon">🦴</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=Animal%20Kingdom"><div class="chapter-head"><div><div class="title">Major non-chordate phyla</div><div class="scope">Porifera to Echinodermata: key features</div></div><div class="icon">🪼</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=Animal%20Kingdom"><div class="chapter-head"><div><div class="title">Chordata</div><div class="scope">Chordate characters and classification</div></div><div class="icon">🐟</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a><a class="chapter" href="zoology-chapter-test.html?chapter=Animal%20Kingdom"><div class="chapter-head"><div><div class="title">Vertebrate classes</div><div class="scope">Pisces, Amphibia, Reptilia, Aves and Mammalia</div></div><div class="icon">🦅</div></div><div class="test"><span>Start lesson test</span><span>→</span></div></a></div></section>'''

          pattern = r'<section class="section"><div class="section-head"><div><div class="unit">UNIT 1</div>.*?</section>(?=<section class="section">)'
          new_html, count = re.subn(pattern, replacement, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Unit 1 section not found; replacements={count}')

          path.write_text(new_html, encoding='utf-8')

      - name: Commit corrected page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zoology-full-path.html
          git diff --cached --quiet && echo 'No changes needed' && exit 0
          git commit -m 'Fix Unit 1 chapter layout on Zoology path'
          git push
