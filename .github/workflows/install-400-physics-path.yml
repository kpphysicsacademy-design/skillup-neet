name: Install 400 Physics Concept Path
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/install-400-physics-path.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install path
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-home.html'); s=p.read_text(encoding='utf-8')
          marker='PHYSICS 400 CONCEPT PATH INSTALL V2'
          if marker in s: print('already installed'); raise SystemExit
          payload='''<script id="physics-400-path-v2">/* PHYSICS 400 CONCEPT PATH INSTALL V2 */
          (()=>{
          const groups=[
          ['Measurement',['Units and dimensions','SI units','Significant figures','Errors in measurement','Dimensional analysis','Unit conversion','Least count','Vernier calipers','Screw gauge','Accuracy and precision','Scientific notation','Order of magnitude','Absolute uncertainty','Relative uncertainty','Percentage uncertainty','Propagation of errors','Rounding rules','Physical quantities','Fundamental units','Derived units']],
          ['Kinematics',['Frame of reference','Position and displacement','Distance','Speed','Velocity','Acceleration','Average velocity','Instantaneous velocity','Motion graphs','Equations of motion','Relative motion','Projectile motion','Uniform motion','Non-uniform motion','One-dimensional motion','Two-dimensional motion','Free-fall motion','Relative velocity','Graphical analysis','Kinematic problem solving']],
          ['Laws of Motion',['Force','Inertia','Newton first law','Newton second law','Newton third law','Momentum','Impulse','Conservation of momentum','Free-body diagrams','Equilibrium','Normal reaction','Tension','Friction','Static friction','Kinetic friction','Limiting friction','Coefficient of friction','Inclined plane','Connected bodies','Circular motion dynamics']],
          ['Work Energy Power',['Work','Positive work','Negative work','Variable force work','Work-energy theorem','Kinetic energy','Potential energy','Gravitational potential energy','Elastic potential energy','Conservation of energy','Conservative force','Non-conservative force','Power','Average power','Instantaneous power','Spring energy','Collision energy','Elastic collision','Inelastic collision','Coefficient of restitution']],
          ['Centre of Mass',['Centre of mass','Two-particle COM','System COM','Uniform rod COM','COM motion','System momentum','Momentum conservation','External force and COM','Two-body motion','Reduced mass','COM coordinates','Symmetry and COM','Composite bodies','Mass distribution','COM and gravity','COM in collisions','Rocket propulsion','Variable mass','System impulse','Problem solving']],
          ['Rotational Motion',['Angular displacement','Angular velocity','Angular acceleration','Rotational kinematics','Torque','Moment of force','Angular momentum','Angular momentum conservation','Moment of inertia','Radius of gyration','Parallel-axis theorem','Perpendicular-axis theorem','Standard moments of inertia','Rotational kinetic energy','Rolling motion','Pure rolling','Rolling on incline','Rigid-body equilibrium','Angular momentum of rigid body','Gyroscope basics']],
          ['Gravitation',['Universal gravitation','Gravitational field','Field intensity','Gravitational potential','Potential energy','Potential due to mass','Acceleration due to gravity','g with altitude','g with depth','Gravitational mass','Inertial mass','Escape velocity','Orbital velocity','Satellites','Geostationary satellite','Geosynchronous satellite','Satellite energy','Kepler first law','Kepler second law','Kepler third law']],
          ['Solids and Fluids',['Elasticity','Plasticity','Stress','Strain','Young modulus','Bulk modulus','Shear modulus','Poisson ratio','Hooke law','Elastic limit','Stress-strain curve','Elastic energy','Pressure','Pascal law','Buoyancy','Archimedes principle','Streamline flow','Continuity equation','Bernoulli theorem','Viscosity']],
          ['Thermal Physics',['Temperature','Thermal equilibrium','Zeroth law','Heat','Specific heat','Molar heat capacity','Calorimetry','Latent heat','Change of state','Thermal expansion','Linear expansion','Area expansion','Volume expansion','Anomalous expansion','Conduction','Convection','Radiation','Thermal conductivity','Newton cooling','Heat transfer']],
          ['Thermodynamics',['Thermodynamic system','State variables','Thermodynamic equilibrium','Thermodynamic process','Quasi-static process','Isothermal process','Adiabatic process','Isochoric process','Isobaric process','Work by gas','Internal energy','First law','Heat capacity','Cv','Cp','Second law','Heat engine','Refrigerator','Carnot engine','Thermodynamic cycles']],
          ['Kinetic Theory',['Molecular matter','Ideal gas','Gas laws','Equation of state','Molecular speed','RMS speed','Average speed','Most probable speed','Temperature interpretation','Gas pressure','Molecular kinetic energy','Degrees of freedom','Equipartition theorem','Specific heat gases','Mean free path','Avogadro number','Boltzmann constant','Ideal gas energy','Monatomic gas','Diatomic gas']],
          ['Oscillations',['Periodic motion','Oscillatory motion','Simple harmonic motion','SHM displacement','Amplitude','Phase','Angular frequency','Time period','Frequency','SHM velocity','SHM acceleration','SHM force','SHM energy','SHM potential energy','SHM kinetic energy','Simple pendulum','Spring-mass system','Combination of springs','Damped oscillations','Resonance']],
          ['Waves',['Wave motion','Transverse waves','Longitudinal waves','Wave parameters','Wavelength','Wave frequency','Wave speed','Progressive wave','Wave equation','Phase difference','Superposition','Interference','Standing waves','Nodes','Antinodes','String waves','String wave speed','Sound waves','Beats','Doppler effect']],
          ['Electrostatics',['Electric charge','Charge conservation','Coulomb law','Charge superposition','Electric field','Field intensity','Field lines','Electric dipole','Dipole moment','Dipole field','Dipole torque','Electric flux','Gauss law','Gauss applications','Electric potential','Potential difference','Point charge potential','Dipole potential','Equipotential surface','Electrostatic shielding']],
          ['Capacitance Current',['Capacitor','Capacitance','Parallel plate capacitor','Dielectric','Dielectric effect','Capacitor energy','Energy density','Capacitor combinations','Charging','Discharging','Electric current','Drift velocity','Mobility','Ohm law','Resistance','Resistivity','Temperature resistance','Series resistance','Parallel resistance','Kirchhoff laws']],
          ['Magnetism',['Magnetic field','Magnetic force','Lorentz force','Charge in magnetic field','Force on conductor','Biot-Savart law','Straight wire field','Circular loop field','Ampere law','Solenoid','Toroid','Parallel current force','Current-loop torque','Galvanometer','Ammeter','Voltmeter','Magnetic dipole','Earth magnetism','Magnetic materials','Hysteresis']],
          ['EMI and AC',['Magnetic flux','Faraday law','Lenz law','Motional emf','Induced current','Self inductance','Mutual inductance','Inductor','Inductor energy','AC voltage','AC current','RMS value','Average AC','Reactance','Inductive reactance','Capacitive reactance','Impedance','LCR circuit','AC resonance','Transformer']],
          ['EM Waves Optics',['Electromagnetic waves','Displacement current','EM spectrum','Radio waves','Microwaves','Infrared','Visible light','Ultraviolet','X-rays','Gamma rays','Reflection','Refraction','Snell law','Total internal reflection','Mirrors','Mirror formula','Lenses','Lens formula','Lens power','Optical instruments']],
          ['Modern Physics',['Photoelectric effect','Einstein equation','Photon','Matter waves','de Broglie wavelength','Atomic spectra','Bohr model','Hydrogen atom','Energy levels','Nuclear structure','Mass defect','Binding energy','Radioactivity','Radioactive decay','Half-life','Fission','Fusion','Semiconductors','p-n junction','Logic gates']],
          ['Experimental Skills',['Units in experiments','Measurement practice','Instrument selection','Least count practice','Vernier reading','Screw gauge reading','Meter scale reading','Zero correction','Parallax correction','Significant figures practice','Error calculation','Graph plotting','Slope calculation','Intercept calculation','Data tables','Experimental uncertainty','Dimensional checking','Circuit measurement','Optics measurement','Practical problem solving']]
          ];
          const path=document.querySelector('.path'); if(!path||groups.length!==20||groups.some(g=>g[1].length!==20)) throw new Error('Expected exactly 20x20 concepts');
          let n=0; path.innerHTML=groups.map((g,i)=>`<section class="p400u"><header><span>${['📏','🏃','⚖️','💪','🎯','🔄','🌍','💧','🌡️','🔥','💨','〰️','🌊','⚡','🔌','🧲','〽️','📡','⚛️','🧪'][i]}</span><div><small>UNIT ${i+1}</small><b>${g[0]}</b><em>20 chapters</em></div></header>${g[1].map((c,j)=>{n++;return `<div class="lesson p400l"><div class="node"></div><a class="chapter-card" href="physics-concept.html?concept=${encodeURIComponent(c)}"><div class="chapter-main"><h3><span class="duo-physics-icon"><span class="duo-symbol">${['📏','🏃','⚖️','💪','🎯','🔄','🌍','💧','🌡️','🔥','💨','〰️','🌊','⚡','🔌','🧲','〽️','📡','⚛️','🧪'][i]}</span></span><span>${n}. ${c}</span></h3><p>${g[0]} • Chapter ${j+1}/20</p><div class="meta"><span class="tag">CONCEPT</span><span class="tag">+10 XP</span></div></div><span class="go">›</span></a></div>`}).join('')}</section>`).join('');
          const st=document.createElement('style');st.textContent='.p400u{margin:26px 0}.p400u header{display:flex;gap:12px;align-items:center;padding:12px 14px;background:#fff;border:2px solid #d9e5f2;border-radius:18px;box-shadow:0 7px 18px rgba(18,59,112,.08)}.p400u header>span{font-size:28px;width:46px;height:46px;display:grid;place-items:center;background:#eaf4ff;border-radius:14px}.p400u header small{display:block;font-size:8px;color:#6b7280;font-weight:900}.p400u header b{display:block;font-size:16px;color:#123b70}.p400u header em{display:block;font-size:9px;color:#6b7280;font-style:normal}.p400l{margin:9px 0 9px 48px}.p400l .chapter-card{min-height:78px}.p400l h3{display:flex!important;align-items:center!important;gap:10px!important}.p400l .duo-physics-icon{width:48px;height:48px;flex-basis:48px;font-size:24px}@media(max-width:700px){.p400l{margin-left:30px}.p400u header b{font-size:13px}.p400l h3{font-size:11px!important}.p400l .duo-physics-icon{width:40px;height:40px;flex-basis:40px;font-size:20px}}';document.head.appendChild(st);
          document.querySelectorAll('.stat b')[0]?.replaceChildren(document.createTextNode('400')); const pr=document.querySelector('.progress-row'); if(pr)pr.innerHTML='<span>Physics Concept Path</span><b>0 / 400 CONCEPTS</b>'; const bar=document.querySelector('.bar i');if(bar)bar.style.width='0%';
          const search=document.querySelector('.search');if(search)search.placeholder='Search 400 Physics chapters…';
          })();</script>'''
          s=s.replace('</body>',payload+'</body>'); p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'PHYSICS 400 CONCEPT PATH INSTALL V2' physics-home.html
          grep -q 'groups.length!==20' physics-home.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-home.html; git commit -m 'Install 400 Physics concept chapters directly' || true; git push
          rm .github/workflows/install-400-physics-path.yml; git add .github/workflows/install-400-physics-path.yml; git commit -m 'Remove one-time 400 Physics installer' || true; git push
