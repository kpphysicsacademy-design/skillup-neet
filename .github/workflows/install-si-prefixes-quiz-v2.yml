name: Install SI Prefixes Quiz v2
on:
  push:
    paths:
      - 'physics-si-prefixes-quiz.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach dedicated SI Prefixes quiz
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-concept.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="physics-si-prefixes-quiz.js"></script>'
          if tag not in s:
              if '</body>' not in s: raise SystemExit('missing body')
              p.write_text(s.replace('</body>',tag+'</body>',1),encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('physics-concept.html').read_text(encoding='utf-8')
          q=Path('physics-si-prefixes-quiz.js').read_text(encoding='utf-8')
          assert h.count('physics-si-prefixes-quiz.js')==1
          assert q.count("['")>=15
          print('validated')
          PY
      - name: Commit with retry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-concept.html
          git commit -m 'Install SI Prefixes quiz on Physics concept page [skip ci]' || true
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            git rm -f .github/workflows/install-si-prefixes-quiz-v2.yml
            git commit -m 'Remove one-time SI Prefixes installer [skip ci]' || true
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          p=Path('physics-concept.html'); s=p.read_text(encoding='utf-8'); tag='<script src="physics-si-prefixes-quiz.js"></script>'
          if tag not in s: p.write_text(s.replace('</body>',tag+'</body>',1),encoding='utf-8')
          PY
            git add physics-concept.html
            git commit -m 'Install SI Prefixes quiz on Physics concept page [skip ci]' || true
          done
          exit 1
