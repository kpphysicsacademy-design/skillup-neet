name: Install SI Prefixes Quiz
on:
  push:
    paths:
      - 'physics-si-prefixes-quiz.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach quiz to Physics concept page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-concept.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="physics-si-prefixes-quiz.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('physics-concept.html has no closing body tag')
              s=s.replace(marker, tag+marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Verify SI Prefixes quiz
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('physics-si-prefixes-quiz.js').read_text(encoding='utf-8')
          assert "key!=='si prefixes'" in s
          assert s.count("['") >= 15
          assert '10⁻³' in s and '10⁻⁶' in s and '10⁻⁹' in s
          h=Path('physics-concept.html').read_text(encoding='utf-8')
          assert 'physics-si-prefixes-quiz.js' in h
          print('SI Prefixes quiz installation verified')
          PY
      - name: Commit and remove installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-concept.html .github/workflows/install-si-prefixes-quiz.yml
          git commit -m 'Install SI Prefixes quiz on Physics concept page' || exit 0
          git rm .github/workflows/install-si-prefixes-quiz.yml
          git commit -m 'Remove one-time SI Prefixes quiz installer'
          git push
