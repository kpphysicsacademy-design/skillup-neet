name: Mathematics first-save emulator
on:
  pull_request:
    paths:
      - 'tests/maths-first-save-emulator.cjs'
      - '.github/workflows/maths-first-save-emulator.yml'
      - 'maths-progress.js'
      - 'maths-quiz-progress-ui.js'
      - 'tests/maths-browser-emulator.cjs'
      - 'maths-*-quiz.html'
      - 'tests/maths-auth-emulator.cjs'
  push:
    branches: [fix/maths-graph-quiz-menu]
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --package-lock=false firebase@11.10.0 @firebase/rules-unit-testing@4.0.1 firebase-tools@14.12.0 playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          echo '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"port":8080},"auth":{"port":9099}}}' > firebase.maths-test.json
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/maths-server.log 2>&1 &
          npx firebase emulators:exec --only firestore,auth --project demo-skillup-maths --config firebase.maths-test.json 'node tests/maths-first-save-emulator.cjs && node tests/maths-auth-emulator.cjs && node tests/maths-browser-emulator.cjs'
