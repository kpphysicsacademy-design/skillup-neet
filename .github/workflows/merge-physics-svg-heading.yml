name: Merge Physics SVG With Concept Heading
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/merge-physics-svg-heading.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge SVG icon into concept heading
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-home.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.chapter-card{display:grid;grid-template-columns:auto 1fr auto;gap:12px;', '.chapter-card{display:grid;grid-template-columns:1fr auto;gap:12px;')
          s=s.replace('.chapter-main h3{margin:0;font-size:14px;font-weight:950}', '.chapter-main h3{margin:0;font-size:14px;font-weight:950;display:flex!important;align-items:center;gap:10px;line-height:1.2}.concept-svg{width:44px;height:44px;flex:0 0 44px;border-radius:13px;background:#e9f2ff;padding:5px}.concept-svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}')
          s=s.replace('.chapter-main h3{display:none!important}', '.chapter-main h3{display:flex!important}')
          old='<span class="chapter-icon">\'+c.icon+\'</span><span class="chapter-main"><h3>\'+c.name+\'</h3>'
          new='<span class="chapter-main"><h3><svg class="concept-svg" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19" fill="#fff" stroke="#b8d3ef" stroke-width="2"/><text x="22" y="29" text-anchor="middle" font-size="22">\'+c.icon+\'</text></svg>\'+c.name+\'</h3>'
          s=s.replace(old,new)
          s=s.replace('.chapter-icon{width:44px;height:44px;font-size:23px}', '.concept-svg{width:38px;height:38px;flex-basis:38px;padding:4px}')
          if '/* SVG + concept merged into heading */' not in s:
              s=s.replace('</style>', '/* SVG + concept merged into heading */\n</style>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit page update and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/merge-physics-svg-heading.yml
          git add physics-home.html .github/workflows/merge-physics-svg-heading.yml
          git commit -m 'Merge Physics SVG icons with concept headings' || exit 0
          git push
