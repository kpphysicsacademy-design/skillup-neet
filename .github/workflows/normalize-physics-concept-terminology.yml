name: Normalize Physics concept terminology
on:
  push:
    paths:
      - '.github/workflows/normalize-physics-concept-terminology.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize terminology
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('physics-home.html')
          s=p.read_text(encoding='utf-8')
          replacements = {
              'sub-concepts': 'concepts',
              'sub-concept': 'concept',
              'SUB-CONCEPTS': 'CONCEPTS',
              'Sub-Concepts': 'Concepts',
              'Sub-concepts': 'Concepts',
              'subconcepts': 'concepts',
              'subconcept': 'concept',
          }
          for old,new in replacements.items():
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          ! grep -qi 'sub-concept' physics-home.html
          ! grep -q 'subconcept' physics-home.html
          grep -qi 'concepts' physics-home.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-home.html
          git diff --cached --quiet || git commit -m 'Use concept terminology throughout Physics home'
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          git rm -f .github/workflows/normalize-physics-concept-terminology.yml || true
          git diff --cached --quiet || git commit -m 'Remove one-time terminology workflow'
          git push || true
