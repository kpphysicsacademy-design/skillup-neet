name: Normalize universal navigation markup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/normalize-universal-navigation-markup.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: normalize-universal-navigation-markup
  cancel-in-progress: true

jobs:
  normalize-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize, commit, and retry if main moved
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=0

          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Universal navigation normalization attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            python3 <<'PY'
          from pathlib import Path
          root = Path(".")
          script = '<script src="/shared-nav.js?v=20261013-universal-nav-v1"></script>'
          newline = chr(10)
          broken_prefix = r'\n' + script
          broken_suffix = script + r'\n'
          changed = []

          for page in sorted(root.rglob("*.html")):
              rel = page.as_posix()
              if any(part in {".git", "node_modules", "vendor"} for part in page.parts):
                  continue
              if rel.startswith(".github/") or page.name in {
                  "central-login.html", "central-register.html",
                  "central-reset-password.html", "chemistry-asset-manager.html",
                  "deployment-check-20260909.html", "progress.html"
              }:
                  continue
              original = page.read_text(encoding="utf-8")
              if script not in original:
                  continue
              updated = original.replace(broken_prefix, newline + script)
              updated = updated.replace(broken_suffix, script + newline)
              if updated != original:
                  page.write_text(updated, encoding="utf-8", newline="")
                  changed.append(rel)

          print(f"Normalized real line breaks on {len(changed)} pages.")
          PY

            git rm -f .github/workflows/normalize-universal-navigation-markup.yml
            git add -A
            if git diff --cached --quiet; then
              echo "No markup normalization changes were needed."
              pushed=1
              break
            fi

            git commit -m "Normalize universal navigation markup across pages"
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "main moved during this attempt; retrying on the latest main."
          done

          if [ "$pushed" -ne 1 ]; then
            echo "Could not update main after 8 attempts."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload updated website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy universal navigation correction
        id: deployment
        uses: actions/deploy-pages@v4
