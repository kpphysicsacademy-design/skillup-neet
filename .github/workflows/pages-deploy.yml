name: SkillUp NEET Pages Deployment (validated)

on:
  workflow_dispatch:

# Compatibility entry point retained for existing manual operators.
# It delegates to the canonical workflow; it does not build or deploy independently.
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  validated-deployment:
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
