name: Fix Duolingo Physics Chapters

on:
  push:
    branches: [main]

jobs:
  chapters:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build chapter path
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          p=Path('physics-home.html')
          s=p.read_text(encoding='utf-8')
          marker='/* REMOVE CHAPTER NUMBERS V1 */'
          if marker not in s:
              css='''\n<style>\n/* REMOVE CHAPTER NUMBERS V1 */\n.chapter-bubble .badge{display:none!important}\n.chapter-bubble{padding-top:18px}\n</style>\n'''
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'REMOVE CHAPTER NUMBERS V1' physics-home.html
          grep -q 'chapter-bubble .badge{display:none!important}' physics-home.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-home.html
          git commit -m 'Remove numbers from Physics chapter cards'
          git push
