name: Optimize Physics Path Progressive Loading
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/physics-progressive-path.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild Physics home as lightweight progressive path
        shell: python
        run: |
          from pathlib import Path
          p = Path('physics-home.html')
          html = '''<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="SkillUp NEET Physics — 400 concept chapter learning path.">
<title>SkillUp | Physics NEET 2026</title>
<style>
:root{--blue:#1677ff;--blue2:#125fc9;--navy:#123b70;--ink:#263238;--muted:#6b7280;--bg:#f5f9ff;--line:#d9e5f2;--shadow:0 7px 20px rgba(18,59,112,.08)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#f7fbff,#edf4fa);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(18,59,112,.06)}.nav{height:62px;max-width:1050px;margin:auto;padding:0 14px;display:flex;align-items:center;gap:9px}.brand{display:flex;align-items:center;gap:8px;color:var(--navy);font-weight:950}.mascot{width:36px;height:36px;border-radius:12px;background:#e7f1ff;display:grid;place-items:center;font-size:20px}.brand small{display:block;font-size:8px;letter-spacing:1.3px;color:#6480a0}.navstats{margin-left:auto;display:flex;gap:6px}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 9px;font-size:10px;font-weight:900}.wrap{max-width:1050px;margin:auto;padding:16px 13px 80px}.hero{background:linear-gradient(135deg,#123b70,#1769c2 55%,#1683d8);border-radius:24px;padding:23px 18px;color:#fff;box-shadow:0 12px 28px rgba(18,59,112,.15)}.hero-grid{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}.eyebrow{font-size:9px;font-weight:950;letter-spacing:1.5px;opacity:.85}.hero h1{margin:5px 0 7px;font-size:clamp(27px,5vw,42px);line-height:1;font-weight:950}.hero p{margin:0;max-width:700px;font-size:12px;color:rgba(255,255,255,.9);line-height:1.5}.hero-mascot{font-size:62px}.progress-card{margin-top:15px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:var(--shadow)}.progress-row{display:flex;justify-content:space-between;font-size:11px;font-weight:950}.bar{height:10px;background:#e6eef7;border-radius:99px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),#55a7ff);border-radius:99px;transition:width .25s ease}.toolbar{display:flex;gap:8px;align-items:center;margin:18px 0 11px}.search{flex:1;border:2px solid var(--line);background:#fff;border-radius:13px;padding:11px 12px;font-size:12px;outline:none}.filter{border:2px solid var(--line);background:#fff;border-radius:13px;padding:10px 11px;font-size:10px;font-weight:900;color:var(--navy)}.path{position:relative;padding-left:10px}.path:before{content:"";position:absolute;left:28px;top:12px;bottom:20px;width:4px;background:repeating-linear-gradient(to bottom,#dbe8f5 0 12px,transparent 12px 22px);border-radius:99px}.unit{position:relative;margin:22px 0 10px;display:flex;align-items:center;gap:9px}.unit-num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-size:11px;font-weight:950;border:4px solid #e7f1ff;box-shadow:0 2px 0 #a9c9ed;flex:0 0 38px}.unit h2{margin:0;font-size:15px;color:var(--navy)}.unit small{display:block;color:var(--muted);font-size:8px;margin-top:2px}.chapter{position:relative;margin:8px 0 8px 44px}.node{position:absolute;left:-28px;top:24px;width:18px;height:18px;border-radius:50%;background:#fff;border:5px solid #b8d3ef;z-index:2}.chapter-card{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:18px;padding:11px;box-shadow:var(--shadow);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}.chapter-card:hover{transform:translateY(-3px);box-shadow:0 12px 25px rgba(18,59,112,.13);border-color:#8ebced}.chapter-main{min-width:0}.chapter-main h3{margin:0;font-size:13px;font-weight:950;line-height:1.25;display:flex;align-items:center;gap:8px}.icon{width:43px;height:43px;flex:0 0 43px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#eaf4ff);border:2px solid #cfe2f6;box-shadow:0 4px 0 #b5cfe9;font-size:22px}.chapter-main p{margin:4px 0 0;font-size:9px;color:var(--muted)}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.tag{font-size:7px;font-weight:900;padding:3px 6px;border-radius:999px;background:#eef4fb;color:#526b86}.go{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-size:16px;font-weight:950;box-shadow:0 3px 0 #0e5fcf}.sentinel{height:1px}.empty{display:none;text-align:center;background:#fff;border:1px dashed #b8cfe6;border-radius:16px;padding:22px;color:var(--muted);font-size:11px}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);border-top:1px solid var(--line)}.bottom-inner{max-width:620px;margin:auto;height:58px;display:grid;grid-template-columns:repeat(3,1fr)}.bottom a{display:grid;place-items:center;font-size:9px;font-weight:900;color:#70829a}.bottom a span{font-size:19px;line-height:19px}.bottom a.active{color:var(--blue2)}@media(max-width:700px){.nav{height:58px;padding:0 9px}.brand small{display:none}.navstats .pill:nth-child(2){display:none}.wrap{padding:12px 9px 76px}.hero{border-radius:20px;padding:20px 14px}.hero-grid{grid-template-columns:1fr}.hero-mascot{display:none}.toolbar{position:sticky;top:58px;z-index:20;padding:4px 0;background:rgba(245,249,255,.94);backdrop-filter:blur(7px)}.filter{width:82px}.path{padding-left:2px}.path:before{left:19px}.unit-num{width:34px;height:34px;flex-basis:34px}.unit h2{font-size:13px}.chapter{margin-left:28px}.node{left:-18px}.chapter-card{padding:9px;gap:8px}.icon{width:38px;height:38px;flex-basis:38px;font-size:20px}.chapter-main h3{font-size:11px}.chapter-main p{font-size:8px}.go{width:32px;height:32px;font-size:14px}.tag{font-size:6.5px}}
</style>
<script src="physics-400-concepts.js"></script>
</head>
<body>
<header class="top"><div class="nav"><div class="brand"><div class="mascot">⚛️</div><div>SkillUp<small>PHYSICS • NEET 2026</small></div></div><div class="navstats"><span class="pill">⚡ <b id="xp">0</b> XP</span><span class="pill">🔥 <b id="streak">0</b></span></div></div></header>
<main class="wrap">
<section class="hero"><div class="hero-grid"><div><div class="eyebrow">NEET PHYSICS • 400 CHAPTERS</div><h1>Physics Learning Path</h1><p>Master Physics one concept at a time. Every concept is a chapter — learn, practice and master.</p></div><div class="hero-mascot">🚀</div></div></section>
<section class="progress-card"><div class="progress-row"><span id="progressText">0 / 400 CHAPTERS</span><span id="loadedText">Showing 40</span></div><div class="bar"><i id="progressBar"></i></div></section>
<div class="toolbar"><input id="search" class="search" placeholder="Search 400 Physics chapters…" autocomplete="off"><button id="clear" class="filter" type="button">CLEAR</button></div>
<section id="path" class="path" aria-live="polite"></section><div id="empty" class="empty">No matching Physics chapters found.</div><div id="sentinel" class="sentinel"></div>
<div class="progress-card"><b>🚀 Progressive loading</b><div style="font-size:10px;color:#6b7280;margin-top:4px">The first 40 chapters load immediately. More chapters are added in small batches as you scroll.</div></div>
</main>
<nav class="bottom"><div class="bottom-inner"><a class="active" href="physics-home.html"><span>🏠</span>PATH</a><a href="physics-concept.html?concept=Units%20of%20Measurement"><span>📘</span>LEARN</a><a href="neet-home.html"><span>🎯</span>NEET</a></div></nav>
<script>
(function(){
  'use strict';
  const data=window.SKILLUP_PHYSICS_400||[];
  const flat=[];
  data.forEach((u,ui)=>u[2].forEach((name,ci)=>flat.push({unit:ui+1,unitName:u[1],unitIcon:u[0],concept:name,number:flat.length+1,conceptIndex:ci})));
  if(flat.length!==400){console.error('Physics path expected 400 chapters, found',flat.length);return;}
  const path=document.getElementById('path'), sentinel=document.getElementById('sentinel'), empty=document.getElementById('empty'), search=document.getElementById('search');
  const progressText=document.getElementById('progressText'),loadedText=document.getElementById('loadedText'),progressBar=document.getElementById('progressBar');
  const BATCH=20, INITIAL=40; let shown=0, filter=''; let observer;
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function iconFor(n){return ['⚛️','📐','⚡','🎯','🔬','🚀','🌍','💧','🌡️','🔥','💨','〰️','🌊','⚡','🔌','🧲','〽️','📡','⚛️','🧪'][n-1]||'📘';}
  function card(x){const href='physics-concept.html?concept='+encodeURIComponent(x.concept);return '<article class="chapter" data-number="'+x.number+'" data-concept="'+esc(x.concept.toLowerCase())+'" data-unit="'+x.unit+'"><span class="node"></span><a class="chapter-card" href="'+href+'"><div class="chapter-main"><h3><span class="icon">'+iconFor(x.unit)+'</span><span>'+esc(x.concept)+'</span></h3><p>Chapter '+x.number+' • '+esc(x.unitName)+'</p><div class="meta"><span class="tag">🎯 CHAPTER '+x.number+'</span><span class="tag">⚡ +10 XP</span><span class="tag">📘 CONCEPT</span></div></div><span class="go">›</span></a></article>';}
  function renderMore(count){const end=Math.min(shown+count,flat.length);let html='';let lastUnit=0;for(let i=shown;i<end;i++){const x=flat[i];if(x.unit!==lastUnit){html+='<div class="unit" data-unit="'+x.unit+'"><span class="unit-num">'+x.unit+'</span><div><h2>'+esc(x.unitIcon)+' '+esc(x.unitName)+'</h2><small>20 equal-level Physics chapters</small></div></div>';lastUnit=x.unit;}html+=card(x);}path.insertAdjacentHTML('beforeend',html);shown=end;loadedText.textContent='Showing '+shown+' / 400';}
  function filtered(){return filter?flat.filter(x=>(x.concept+' '+x.unitName).toLowerCase().includes(filter)):flat;}
  function renderFiltered(){path.innerHTML='';shown=0;const list=filtered();if(!list.length){empty.style.display='block';loadedText.textContent='0 matches';return;}empty.style.display='none';let end=Math.min(INITIAL,list.length);let html='';let lastUnit=0;for(let i=0;i<end;i++){const x=list[i];if(x.unit!==lastUnit){html+='<div class="unit"><span class="unit-num">'+x.unit+'</span><div><h2>'+esc(x.unitIcon)+' '+esc(x.unitName)+'</h2><small>20 equal-level Physics chapters</small></div></div>';lastUnit=x.unit;}html+=card(x);}path.innerHTML=html;shown=end;loadedText.textContent=filter?'Showing '+shown+' / '+list.length+' matches':'Showing '+shown+' / 400';}
  renderMore(INITIAL);
  observer=new IntersectionObserver(entries=>{if(!entries[0].isIntersecting||filter)return; if(shown<flat.length)renderMore(BATCH);},{rootMargin:'700px'});observer.observe(sentinel);
  search.addEventListener('input',()=>{filter=search.value.trim().toLowerCase();renderFiltered();});
  document.getElementById('clear').addEventListener('click',()=>{search.value='';filter='';renderFiltered();});
  progressText.textContent='0 / 400 CHAPTERS'; progressBar.style.width='0%';
})();
</script>
</body></html>'''
          p.write_text(html,encoding='utf-8')
      - name: Validate progressive path
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('physics-home.html').read_text(encoding='utf-8')
          required=['physics-400-concepts.js','BATCH=20','INITIAL=40','IntersectionObserver','Showing 40','400 CHAPTERS']
          for x in required:
              if x not in s: raise SystemExit('Missing progressive loading marker: '+x)
          print('Physics progressive path validation passed')
          PY
      - name: Commit optimized page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-home.html
          git commit -m 'Optimize Physics path with progressive chapter loading'
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          git rm .github/workflows/physics-progressive-path.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove one-time Physics progressive path workflow' || true
          git push || true
