name: Remove all Physics unit headings
on:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove all Unit headings and deploy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-home.html')
          s=p.read_text(encoding='utf-8')
          marker='/* Final: hide every generated unit heading; keep SVG concept headings */'
          if marker not in s:
              s=s.replace('</style>', marker+'\n.unit{display:none!important}\n.unit h2,.unit small{display:none!important}\n</style>',1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-home.html
          git diff --cached --quiet || git commit -m 'Remove all Physics unit headings and keep concept SVG headings'
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/remove-all-physics-unit-headings.yml
          git add .github/workflows/remove-all-physics-unit-headings.yml
          git commit -m 'Remove temporary unit heading workflow' || true
          git push || true
