name: Keep Only Major Physics Units

on:
  push:
    branches: [main]

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Simplify Physics path
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('physics-home.html')
          s=p.read_text(encoding='utf-8')

          # Remove duplicate chapter navigators/headings; keep the real dynamic 20-unit path.
          s=re.sub(r'<section class="chapter-index".*?</section>\s*', '', s, count=1, flags=re.S)
          s=re.sub(r'<div class="path-heading"><b>📚 Chapters</b>.*?</div>\s*<nav class="chapter-path".*?</nav>\s*', '', s, count=1, flags=re.S)
          s=re.sub(r'<div class="path-heading">\s*<b>🧭 Your 20-Unit Physics Path</b>.*?</div>\s*', '', s, flags=re.S)

          # Remove obsolete navigator styles/scripts.
          s=re.sub(r'<style>\s*/\* PHYSICS CHAPTER NAVIGATOR V1 \*/.*?</style>\s*', '', s, count=1, flags=re.S)
          s=re.sub(r'<style>\s*/\* DUOLINGO CHAPTER PATH V1 \*/.*?</style>\s*', '', s, count=1, flags=re.S)
          s=re.sub(r'<script>\s*\(\)=>\{const names=\[.*?\}\)\(\);\s*</script>\s*', '', s, count=1, flags=re.S)

          # The requested path should contain only the 20 major units, not their sub-concept lists.
          s=re.sub(r'<div class="subconcepts">.*?</div>\s*', '', s, flags=re.S)
          s=re.sub(r'<div class="tip">.*?</div>\s*', '', s, flags=re.S)

          # Remove decorative path-level headings if any remain.
          s=re.sub(r'<div class="path-heading">.*?</div>\s*', '', s, flags=re.S)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify exactly 20 major units are defined
        run: |
          test "$(grep -o "name:'[^']*'" physics-home.html | wc -l)" -ge 20
          ! grep -q 'Your 20-Unit Physics Path' physics-home.html
          ! grep -q 'chapter-index' physics-home.html
          ! grep -q 'chapter-path' physics-home.html
          ! grep -q 'class="subconcepts"' physics-home.html
          grep -q 'Physics and Measurement' physics-home.html
          grep -q 'Experimental Skills' physics-home.html
      - name: Commit page cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'Physics path is already simplified.'
            exit 0
          fi
          git add physics-home.html
          git commit -m 'Keep only major Physics units in learning path'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/remove-duplicate-physics-chapters.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove temporary Physics path cleanup workflow'
          git push
