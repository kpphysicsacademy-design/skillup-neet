name: Remove duplicate Physics unit headings
on:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove heading above SVG concept title
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('physics-home.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* Remove duplicate unit heading; keep SVG + concept heading */'
          if marker not in s:
              s = s.replace('</style>', marker + '\n.unit{display:none!important}\n</style>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit page update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-home.html
          git diff --cached --quiet || git commit -m 'Keep SVG concept heading and remove duplicate unit title'
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/remove-duplicate-physics-unit-heading.yml
          git add .github/workflows/remove-duplicate-physics-unit-heading.yml
          git commit -m 'Remove temporary Physics heading workflow' || true
          git push || true
