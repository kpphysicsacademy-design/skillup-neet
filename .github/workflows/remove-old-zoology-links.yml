name: Validate Zoology Chapter Quizzes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate existing chapter banks without rewriting questions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('zoology-chapter-test.html', 'utf8');
          const chapters = [
            'What is Living?', 'Biological Classification', 'Animal Kingdom',
            'Structural Organisation in Animals', 'Cell: The Unit of Life',
            'Biomolecules', 'Cell Cycle and Cell Division',
            'Digestion and Absorption', 'Animal Morphology & Anatomy'
          ];

          function findArray(chapter) {
            const marker = "'" + chapter.replace(/'/g, "\\'") + "':[";
            const start = source.indexOf(marker);
            if (start < 0) throw new Error('Missing chapter bank: ' + chapter);
            const contentStart = start + marker.length;
            let depth = 1, quote = null, escaped = false;
            for (let i = contentStart; i < source.length; i++) {
              const ch = source[i];
              if (quote) {
                if (escaped) escaped = false;
                else if (ch === '\\') escaped = true;
                else if (ch === quote) quote = null;
              } else {
                if (ch === "'" || ch === '"' || ch === '`') quote = ch;
                else if (ch === '[') depth++;
                else if (ch === ']' && --depth === 0) return source.slice(contentStart, i);
              }
            }
            throw new Error('Unclosed chapter bank: ' + chapter);
          }

          for (const chapter of chapters) {
            const bank = findArray(chapter);
            const count = (bank.match(/\{\s*["']?q["']?\s*:/g) || []).length;
            if (count !== 30) {
              throw new Error(chapter + ': expected 30 question objects, found ' + count);
            }
            console.log('PASS ' + chapter + ': ' + count + ' MCQs');
          }

          if (!source.includes('new URLSearchParams(location.search)')) {
            throw new Error('Quiz URL parameter runtime is missing');
          }
          console.log('Zoology chapter quiz validation passed.');
          NODE
