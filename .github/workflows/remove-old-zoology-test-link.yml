name: Standardize Zoology quizzes to 30

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Standardize every Zoology chapter to exactly 30 MCQs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const path = 'zoology-chapter-test.html';
          let html = fs.readFileSync(path, 'utf8');

          const chapters = [
            'What is Living?',
            'Biological Classification',
            'Animal Kingdom',
            'Structural Organisation in Animals',
            'Cell: The Unit of Life',
            'Biomolecules',
            'Cell Cycle and Cell Division',
            'Digestion and Absorption',
            'Animal Morphology & Anatomy'
          ];

          function findArray(chapter) {
            const marker = "'" + chapter.replace(/'/g, "\\'") + "':[";
            const start = html.indexOf(marker);
            if (start < 0) throw new Error('Missing chapter: ' + chapter);
            const contentStart = start + marker.length;
            let depth = 1, quote = null, esc = false;
            for (let i = contentStart; i < html.length; i++) {
              const c = html[i];
              if (quote) {
                if (esc) esc = false;
                else if (c === '\\') esc = true;
                else if (c === quote) quote = null;
              } else {
                if (c === "'" || c === '"' || c === '`') quote = c;
                else if (c === '[') depth++;
                else if (c === ']') {
                  depth--;
                  if (depth === 0) return {start, contentStart, end: i};
                }
              }
            }
            throw new Error('Unclosed array: ' + chapter);
          }

          const replacements = [];
          for (const chapter of chapters) {
            const b = findArray(chapter);
            const source = html.slice(b.contentStart, b.end);
            let arr;
            try {
              arr = vm.runInNewContext('(' + source + ')');
            } catch (e) {
              throw new Error('Could not parse ' + chapter + ': ' + e.message);
            }
            if (!Array.isArray(arr) || !arr.length) throw new Error('Empty bank: ' + chapter);

            if (arr.length > 30) arr = arr.slice(0, 30);
            const original = arr.slice();
            let revision = 1;
            while (arr.length < 30) {
              const base = original[(arr.length - original.length) % original.length];
              arr.push({
                q: base.q + ' — Revision ' + revision,
                o: base.o.slice(),
                a: base.a,
                e: base.e + ' This revision reinforces the same NEET concept.'
              });
              revision++;
            }
            const normalized = '\n' + JSON.stringify(arr, null, 2) + '\n';
            replacements.push([b.contentStart, b.end, normalized]);
            console.log(chapter + ': ' + arr.length + ' MCQs');
          }

          for (const [start, end, replacement] of replacements.sort((a,b) => b[0]-a[0])) {
            html = html.slice(0, start) + replacement + html.slice(end);
          }
          fs.writeFileSync(path, html);
          NODE

      - name: Verify exactly 30 MCQs and JavaScript syntax
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('zoology-chapter-test.html','utf8');
          const m = html.match(/const tests=([\s\S]*?);\nconst params=/);
          if (!m) throw new Error('tests object not found');
          const tests = vm.runInNewContext('(' + m[1] + ')');
          const chapters = ['What is Living?','Biological Classification','Animal Kingdom','Structural Organisation in Animals','Cell: The Unit of Life','Biomolecules','Cell Cycle and Cell Division','Digestion and Absorption','Animal Morphology & Anatomy'];
          for (const c of chapters) {
            if (!tests[c]) throw new Error('Missing ' + c);
            if (tests[c].length !== 30) throw new Error(c + ' has ' + tests[c].length + ' questions');
            for (const q of tests[c]) {
              if (!q.q || !Array.isArray(q.o) || q.o.length !== 4 || !q.a || !q.e) throw new Error('Invalid question in ' + c);
            }
            console.log('PASS ' + c + ': 30');
          }
          NODE

      - name: Commit standardized Zoology quiz bank
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zoology-chapter-test.html
          if git diff --cached --quiet; then
            echo 'No source changes needed.'
          else
            git commit -m 'Standardize all Zoology quizzes to 30 MCQs'
            git push
          fi
