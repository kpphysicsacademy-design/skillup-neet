name: Remove old Zoology test link

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove old back link
        shell: python
        run: |
          from pathlib import Path
          p = Path('zoology-chapter-test.html')
          s = p.read_text(encoding='utf-8')
          old = '<a class="back" href="zoology-full-path.html">← Back to Zoology path</a>'
          if old in s:
              s = s.replace(old, '')
              p.write_text(s, encoding='utf-8')
              print('Removed old Zoology path link.')
          else:
              print('Old Zoology path link already absent.')

      - name: Add 20 What is Living MCQs
        shell: python
        run: |
          from pathlib import Path
          import json
          p=Path('zoology-chapter-test.html')
          s=p.read_text(encoding='utf-8')
          marker='/* SKILLUP-LIVING-50-EXTRA */'
          if marker in s:
              print('Extra questions already present.')
          else:
              extra=[
                {"q":"Which statement best explains why metabolism is considered a defining property of living organisms?","o":["It is a coordinated network of biochemical reactions in living cells","It occurs only after reproduction","It occurs only in multicellular organisms","It is identical to movement"],"a":"It is a coordinated network of biochemical reactions in living cells","e":"Living organisms maintain themselves through coordinated biochemical reactions collectively called metabolism."},
                {"q":"Which of the following is an anabolic process?","o":["Synthesis of proteins from amino acids","Breakdown of glucose during respiration","Hydrolysis of fats","Digestion of starch"],"a":"Synthesis of proteins from amino acids","e":"Anabolism builds complex molecules from simpler molecules and generally requires energy."},
                {"q":"Which of the following is a catabolic process?","o":["Breakdown of glucose to release energy","Formation of glycogen from glucose","Synthesis of proteins","Formation of DNA from nucleotides"],"a":"Breakdown of glucose to release energy","e":"Catabolism involves breakdown of complex substances and commonly releases usable energy."},
                {"q":"Which feature is present even in a unicellular living organism?","o":["Cellular organisation","Organ system organisation","Tissue organisation","Organ differentiation"],"a":"Cellular organisation","e":"Every cellular organism has cellular organisation; tissues and organs occur only in more complex multicellular organisms."},
                {"q":"A dormant seed is considered living mainly because it:","o":["Can resume metabolic activity under suitable conditions","Has no metabolism at all","Grows by external deposition","Cannot respond to environmental conditions"],"a":"Can resume metabolic activity under suitable conditions","e":"Dormancy greatly reduces activity but does not eliminate the living organisation and capacity to resume metabolism and development."},
                {"q":"Which example illustrates growth through internal cellular activity?","o":["A plant developing new cells in its shoot","A crystal accumulating ions on its surface","Salt crystals increasing in size","A mineral deposit forming layers"],"a":"A plant developing new cells in its shoot","e":"Biological growth is associated with internal cellular processes such as cell division and enlargement."},
                {"q":"Why is reproduction not regarded as an absolute defining property of every individual living organism?","o":["Some living individuals are sterile","All living organisms reproduce asexually","Only plants reproduce","Reproduction occurs only outside cells"],"a":"Some living individuals are sterile","e":"Sterile individuals such as mules are living, showing that reproduction is not universal at the individual level."},
                {"q":"Which of the following is an example of asexual reproduction?","o":["Budding in yeast","Fusion of sperm and egg","Fertilisation in flowering plants","Fusion of gametes in animals"],"a":"Budding in yeast","e":"Budding is an asexual method in which a new individual develops from an outgrowth of the parent."},
                {"q":"Which event is essential for sexual reproduction?","o":["Fusion of gametes","External deposition of minerals","Binary fission","Crystal formation"],"a":"Fusion of gametes","e":"Sexual reproduction involves the formation and fusion of male and female gametes."},
                {"q":"Which statement correctly compares sexual and asexual reproduction?","o":["Sexual reproduction generally involves gamete fusion, while asexual reproduction does not","Both always require gamete fusion","Asexual reproduction occurs only in animals","Sexual reproduction never produces variation"],"a":"Sexual reproduction generally involves gamete fusion, while asexual reproduction does not","e":"The key distinction is the involvement of gametes and their fusion in sexual reproduction."},
                {"q":"Which observation is evidence of sensitivity in a living organism?","o":["A plant shoot bends toward light","A crystal grows in a saturated solution","Iron rusts in moist air","Salt dissolves in water"],"a":"A plant shoot bends toward light","e":"Phototropic bending is a coordinated response of a living plant to a light stimulus."},
                {"q":"Which term describes the ability of living organisms to perceive and respond to environmental stimuli?","o":["Consciousness","Crystallisation","Sedimentation","Deposition"],"a":"Consciousness","e":"NCERT describes consciousness as a defining property associated with the ability to sense and respond to stimuli."},
                {"q":"Which statement about locomotion is correct for living organisms?","o":["Locomotion is not universal, but internal movement occurs in many organisms","All living organisms must move from place to place","Only animals show any movement","Plants have no movement at all"],"a":"Locomotion is not universal, but internal movement occurs in many organisms","e":"Plants may show movements without locomotion, so movement from place to place is not a universal property of life."},
                {"q":"Which level of organisation is the minimum requirement for a cellular living organism?","o":["Cell","Tissue","Organ","Organ system"],"a":"Cell","e":"The cell is the basic structural and functional unit of life and is the minimum cellular level of organisation."},
                {"q":"Which statement about living systems is most appropriate?","o":["They maintain organised interactions among molecules and cellular components","They are completely isolated from the environment","They contain no chemical reactions","They never exchange energy with the surroundings"],"a":"They maintain organised interactions among molecules and cellular components","e":"Life depends on highly organised, coordinated interactions among cellular components and with the environment."},
                {"q":"Which process directly demonstrates energy transformation in a living cell?","o":["Cellular respiration","Crystal formation","Rusting of an external metal object","Sedimentation"],"a":"Cellular respiration","e":"Cellular respiration is a metabolic process in which chemical energy in nutrients is converted into usable cellular energy."},
                {"q":"Which statement about metabolism outside a living cell is most accurate?","o":["Individual reactions can occur in vitro, but isolated reactions alone do not constitute a complete living system","No biochemical reaction can ever occur outside a cell","Any isolated reaction is automatically a complete organism","Metabolism occurs only in crystals"],"a":"Individual reactions can occur in vitro, but isolated reactions alone do not constitute a complete living system","e":"Biochemical reactions can be demonstrated outside cells, but life involves an integrated and organised cellular system."},
                {"q":"Which combination contains only characteristics associated with living organisms?","o":["Metabolism, cellular organisation and response to stimuli","Rusting, crystallisation and deposition","Sedimentation, melting and boiling","Surface accumulation, corrosion and crystallisation"],"a":"Metabolism, cellular organisation and response to stimuli","e":"Metabolism, cellular organisation and response to stimuli are core characteristics of living systems."},
                {"q":"Which statement about growth and reproduction is correct?","o":["Growth increases body material or cell number, whereas reproduction produces new individuals","Growth and reproduction are exactly the same process","Only reproduction involves cells","Growth occurs only in non-living objects"],"a":"Growth increases body material or cell number, whereas reproduction produces new individuals","e":"Growth concerns increase in size or cellular material; reproduction generates new organisms or individuals."},
                {"q":"Which example most clearly shows that life involves continuous interaction with the environment?","o":["A plant absorbs water and responds to light","A crystal remains unchanged in a sealed container","A stone remains on the ground","A metal object is polished"],"a":"A plant absorbs water and responds to light","e":"Living organisms continuously exchange matter and information with their surroundings and respond to environmental conditions."}
              ]
              block=marker+'\n'+','.join(json.dumps(q,ensure_ascii=False,separators=(',',':')) for q in extra)+',\n'
              needle="}],\n'Biological Classification'"
              if needle not in s:
                  raise SystemExit('Could not locate What is Living array boundary')
              s=s.replace(needle, '},'+block+']\n\'Biological Classification\'', 1)
              p.write_text(s, encoding='utf-8')
              print('Added 20 questions.')

      - name: Verify removal and questions
        run: |
          ! grep -F 'Back to Zoology path' zoology-chapter-test.html
          ! grep -F 'href="zoology-full-path.html"' zoology-chapter-test.html
          grep -F 'SKILLUP-LIVING-50-EXTRA' zoology-chapter-test.html
          echo 'Verified: old link absent and extra questions present.'

      - name: Commit changes
        run: |
          if git diff --quiet -- zoology-chapter-test.html; then
            echo 'No source change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zoology-chapter-test.html
          git commit -m 'Add 20 NEET MCQs to What is Living chapter test'
          git push
