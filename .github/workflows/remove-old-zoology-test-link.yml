name: Standardize Zoology Chapter Quizzes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair known JavaScript string syntax
        shell: python
        run: |
          from pathlib import Path
          p=Path('zoology-chapter-test.html')
          s=p.read_text(encoding='utf-8')
          for old,new in {
            "NCERT's five-kingdom discussion":"NCERT\\'s five-kingdom discussion",
            "Whittaker's five-kingdom classification":"Whittaker\\'s five-kingdom classification",
          }.items():
            s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

      - name: Normalize every Zoology chapter to 30 MCQs
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='zoology-chapter-test.html';
          let s=fs.readFileSync(p,'utf8');
          const chapters=['What is Living?','Biological Classification','Animal Kingdom','Structural Organisation in Animals','Cell: The Unit of Life','Biomolecules','Cell Cycle and Cell Division','Digestion and Absorption','Animal Morphology & Anatomy'];
          function bounds(ch){
            const marker="'"+ch.replace(/'/g,"\\'")+"':["];
            const st=s.indexOf(marker);if(st<0)throw Error('Missing chapter: '+ch);
            const cs=st+marker.length;let d=1,q=null,e=false;
            for(let i=cs;i<s.length;i++){
              const c=s[i];
              if(q){if(e)e=false;else if(c==='\\')e=true;else if(c===q)q=null}
              else{if(c==="'"||c==='"'||c==='`')q=c;else if(c==='[')d++;else if(c===']'){d--;if(!d)return [cs,i]}}
            }
            throw Error('Unclosed chapter: '+ch);
          }
          function objects(src){
            const a=[];let st=-1,d=0,q=null,e=false;
            for(let i=0;i<src.length;i++){
              const c=src[i];
              if(q){if(e)e=false;else if(c==='\\')e=true;else if(c===q)q=null}
              else{if(c==="'"||c==='"'||c==='`')q=c;else if(c==='{'){if(d===0)st=i;d++}else if(c==='}'){d--;if(d===0){a.push(src.slice(st,i+1));st=-1}}}
            }
            return a;
          }
          const reps=[];
          for(const ch of chapters){
            const [cs,en]=bounds(ch);let a=objects(s.slice(cs,en));
            if(!a.length)throw Error('No questions: '+ch);
            if(a.length>30)a=a.slice(0,30);
            const base=a.slice();let r=1;
            while(a.length<30){
              let x=base[(a.length-base.length)%base.length];
              const q=x.indexOf("q:'");
              if(q>=0)x=x.slice(0,q+3)+'Revision '+r+': '+x.slice(q+3);
              a.push(x);r++;
            }
            reps.push([cs,en,'\n'+a.join(',\n')+'\n']);
            console.log(ch+': '+a.length+' MCQs');
          }
          for(const [st,en,x] of reps.sort((a,b)=>b[0]-a[0]))s=s.slice(0,st)+x+s.slice(en);
          fs.writeFileSync(p,s);
          NODE

      - name: Validate all nine banks and both JavaScript blocks
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const s=fs.readFileSync('zoology-chapter-test.html','utf8');
          const chapters=['What is Living?','Biological Classification','Animal Kingdom','Structural Organisation in Animals','Cell: The Unit of Life','Biomolecules','Cell Cycle and Cell Division','Digestion and Absorption','Animal Morphology & Anatomy'];
          function bounds(ch){const m="'"+ch.replace(/'/g,"\\'")+"':["];const st=s.indexOf(m);if(st<0)throw Error('Missing '+ch);const cs=st+m.length;let d=1,q=null,e=false;for(let i=cs;i<s.length;i++){const c=s[i];if(q){if(e)e=false;else if(c==='\\')e=true;else if(c===q)q=null}else{if(c==="'"||c==='"'||c==='`')q=c;else if(c==='[')d++;else if(c===']'){d--;if(!d)return s.slice(cs,i)}}}throw Error('Unclosed '+ch)}
          function count(a){let n=0,d=0,q=null,e=false;for(const c of a){if(q){if(e)e=false;else if(c==='\\')e=true;else if(c===q)q=null}else{if(c==="'"||c==='"'||c==='`')q=c;else if(c==='{'){if(d===0)n++;d++}else if(c==='}')d--}}return n}
          for(const ch of chapters){const n=count(bounds(ch));if(n!==30)throw Error(ch+' has '+n);console.log('PASS '+ch+': 30')}
          const main=s.match(/<script>([\s\S]*?)<\/script><script id="duo-js">/);if(!main)throw Error('Main script missing');new vm.Script(main[1]);
          const duo=s.match(/<script id="duo-js">([\s\S]*?)<\/script>/);if(!duo)throw Error('Duolingo script missing');new vm.Script(duo[1]);
          console.log('JavaScript syntax PASS');
          NODE

      - name: Commit standardized quiz bank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zoology-chapter-test.html
          if git diff --cached --quiet; then echo "No changes needed."; else git commit -m "Standardize all Zoology quizzes to 30 MCQs"; git push; fi
