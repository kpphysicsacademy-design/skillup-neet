name: Remove external links from Physics home
on:
  push:
    branches: [main]
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Clean Physics home links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('physics-home.html')
          s = p.read_text(encoding='utf-8')
          # Remove tracking parameters from internal SkillUp quiz navigation.
          s = s.replace('physics-units-quiz.html?utm_source=chatgpt.com', 'physics-units-quiz.html')
          # Remove absolute HTTP(S) URLs from anchor hrefs while preserving internal navigation.
          s = re.sub(r'<a([^>]*?)href=[\"\']https?://[^\"\']+[\"\']([^>]*)>', r'<a\1href="#"\2>', s, flags=re.I)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        run: |
          ! grep -Eqi '<a[^>]+href=["'"']https?://' physics-home.html
          ! grep -q 'utm_source=chatgpt.com' physics-home.html
          grep -q 'physics-units-quiz.html' physics-home.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-home.html
          git diff --cached --quiet || git commit -m 'Remove external links from Physics home'
          git push
