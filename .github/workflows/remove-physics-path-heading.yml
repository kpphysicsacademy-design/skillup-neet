name: Remove Physics 20-Unit Path Heading

on:
  push:
    branches: [main]

jobs:
  remove-heading:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove heading
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('physics-home.html')
          s=p.read_text(encoding='utf-8')
          old=s
          s=re.sub(r'<div class="path-heading">\s*<b>🧭\s*Your 20-Unit Physics Path</b>.*?</div>\s*', '', s, count=1, flags=re.S)
          s=re.sub(r'<b>🧭\s*Your 20-Unit Physics Path</b>', '', s)
          p.write_text(s,encoding='utf-8')
          print('changed:', s != old)
          PY
      - name: Verify
        run: |
          ! grep -q 'Your 20-Unit Physics Path' physics-home.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-home.html
          if ! git diff --cached --quiet; then
            git commit -m 'Remove old Physics 20-unit path heading'
            git push
          fi
