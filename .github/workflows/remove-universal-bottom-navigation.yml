name: Remove universal bottom navigation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-universal-bottom-navigation.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: remove-universal-bottom-navigation
  cancel-in-progress: true

jobs:
  remove-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove shared bottom navigation and cache-bust student pages
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=0

          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Bottom navigation removal attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            cat > shared-nav.js <<'SKILLUP_JS'
          (() => {
            // Keep the PWA and same-site WebView link support, but do not render a navigation bar.
            if (!document.querySelector('link[rel="manifest"]')) {
              const pwaManifest = document.createElement('link');
              pwaManifest.rel = 'manifest';
              pwaManifest.href = '/manifest.webmanifest';
              document.head.appendChild(pwaManifest);
            }

            if ('serviceWorker' in navigator && location.protocol === 'https:') {
              navigator.serviceWorker.register('/service-worker.js', { scope: '/' }).catch(error => {
                console.warn('SkillUp offline support could not be registered', error);
              });
            }

            const legacyBars = [
              '.skillup-bottom-nav',
              '.skillup-universal-nav',
              '.neet-nav',
              '.bottom-nav',
              '.bottom-navigation',
              '.mobile-bottom-nav',
              '.fixed-bottom-nav',
              '.app-bottom-nav',
              '[data-skillup-bottom-nav]',
              '#bottomNav',
              '#bottom-nav',
              '#bottom-navigation',
              'nav[aria-label="SkillUp main navigation"]'
            ].join(',');

            document.querySelectorAll(legacyBars).forEach(element => element.remove());

            const oldStyle = document.getElementById('skillup-bottom-nav-style');
            if (oldStyle) oldStyle.remove();

            // Also remove fixed bottom navigation elements that used a custom class or inline style.
            document.querySelectorAll('nav, [role="navigation"]').forEach(element => {
              const style = window.getComputedStyle(element);
              const rect = element.getBoundingClientRect();
              if (style.position === 'fixed' && (style.bottom === '0px' || style.bottom === '0') && rect.height >= 40) {
                element.remove();
              }
            });

            // Android WebView compatibility: preserve same-site target=_blank navigation.
            document.addEventListener('click', event => {
              const link = event.target && event.target.closest ? event.target.closest('a[target="_blank"]') : null;
              if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
              if (link.hasAttribute('download')) return;
              try {
                const destination = new URL(link.href, location.href);
                if (destination.origin !== location.origin) return;
                event.preventDefault();
                location.href = destination.href;
              } catch (error) {
                // Leave malformed or unsupported URLs to the browser's default handling.
              }
            }, false);
          })();
          SKILLUP_JS

            python3 <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          version = "20261013-no-bottom-nav-v1"
          script_tag = f'<script src="/shared-nav.js?v={version}"></script>'
          script_pattern = re.compile(
              r"""<script\b[^>]*\bsrc\s*=\s*["'](?:/)?shared-nav\.js(?:\?[^"']*)?["'][^>]*>\s*</script>""",
              re.I | re.S,
          )
          # Remove only the extra bottom-safe-area reservation that was added for the old fixed footer.
          body_pad_pattern = re.compile(
              r"""body\s*\{\s*padding-bottom\s*:\s*(?:calc\(\s*(?:84px|112px)\s*\+\s*env\(safe-area-inset-bottom(?:\s*,\s*0px)?\)\s*\)|112px)\s*!important\s*;?\s*\}\s*""",
              re.I,
          )
          skip_nav = {
              "central-login.html",
              "central-register.html",
              "central-reset-password.html",
              "chemistry-asset-manager.html",
              "deployment-check-20260909.html",
              "progress.html",
          }
          changed = []
          nav_pages = []
          body_pad_count = 0

          for page in sorted(root.rglob("*.html")):
              rel = page.as_posix()
              if any(part in {".git", "node_modules", "vendor"} for part in page.parts):
                  continue
              if rel.startswith(".github/"):
                  continue

              original = page.read_text(encoding="utf-8")
              cleaned = script_pattern.sub("", original)
              cleaned, removed_pads = body_pad_pattern.subn("", cleaned)
              body_pad_count += removed_pads

              if page.name not in skip_nav:
                  end = re.search(r"</body\s*>", cleaned, re.I)
                  if end:
                      updated = cleaned[:end.start()].rstrip() + "\n" + script_tag + "\n" + cleaned[end.start():]
                  else:
                      updated = cleaned.rstrip() + "\n" + script_tag + "\n"
                  nav_pages.append(rel)
              else:
                  updated = cleaned

              if updated != original:
                  page.write_text(updated, encoding="utf-8", newline="")
                  changed.append(rel)

          # New SW cache forces previously cached versions of the HTML and JS to be replaced.
          sw = root / "service-worker.js"
          if sw.exists():
              sw_text = sw.read_text(encoding="utf-8").replace(
                  "const CACHE_NAME = 'skillup-offline-v2';",
                  "const CACHE_NAME = 'skillup-offline-v3-no-bottom-nav';"
              )
              if sw_text != sw.read_text(encoding="utf-8"):
                  sw.write_text(sw_text, encoding="utf-8", newline="")
                  changed.append("service-worker.js")

          print(f"Student pages now using navigation cleanup script: {len(nav_pages)}")
          print(f"Pages and assets changed/cache-busted: {len(set(changed))}")
          print(f"Old footer-safe-area rules removed: {body_pad_count}")
          print("The shared script now removes old bottom bars and does not create a replacement bar.")
          PY

            git rm -f .github/workflows/remove-universal-bottom-navigation.yml
            git add -A
            if git diff --cached --quiet; then
              echo "No changes needed."
              pushed=1
              break
            fi
            git commit -m "Remove universal bottom navigation across SkillUp"
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "main changed during this attempt; retrying on its latest version."
          done

          if [ "$pushed" -ne 1 ]; then
            echo "Could not update main after 8 attempts."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website without bottom navigation
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy SkillUp without bottom navigation
        id: deployment
        uses: actions/deploy-pages@v4
