name: Remove What is Living MCQs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-what-is-living-mcqs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove What is Living dataset
        shell: python
        run: |
          from pathlib import Path

          path = Path('zoology-chapter-test.html')
          html = path.read_text(encoding='utf-8')

          start_marker = "'What is Living?':"
          next_marker = "'Biological Classification':"

          start = html.find(start_marker)
          if start < 0:
              raise SystemExit('What is Living dataset not found.')

          end = html.find(next_marker, start)
          if end < 0:
              raise SystemExit('Biological Classification dataset marker not found.')

          # Remove the complete What is Living array and its separating comma.
          new_html = html[:start] + html[end:]
          path.write_text(new_html, encoding='utf-8')
          print('Removed What is Living MCQ dataset.')

      - name: Verify removal
        shell: python
        run: |
          from pathlib import Path
          html = Path('zoology-chapter-test.html').read_text(encoding='utf-8')
          if "'What is Living?'" in html:
              raise SystemExit('Verification failed: What is Living dataset still exists.')
          print('Verified: What is Living MCQs are absent from zoology-chapter-test.html.')

      - name: Commit removal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zoology-chapter-test.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Remove What is Living MCQs from Zoology tests'
            git push
          fi
