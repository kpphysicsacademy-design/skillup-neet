name: Reward Firestore emulator
on:
  pull_request:
    paths:
      - 'central-auth.js'
      - 'firestore.rules'
      - 'tests/firestore-reward-emulator.test.cjs'
      - '.github/workflows/reward-emulator.yml'
jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - run: |
          node -e 'require("fs").writeFileSync("firebase.emulator-ci.json",JSON.stringify({firestore:{rules:"firestore.rules"},emulators:{auth:{port:9099},firestore:{port:8080},ui:{enabled:false}}}))'
          npx firebase emulators:exec --config firebase.emulator-ci.json --only auth,firestore --project demo-skillup-rewards 'node --test tests/firestore-reward-emulator.test.cjs'
