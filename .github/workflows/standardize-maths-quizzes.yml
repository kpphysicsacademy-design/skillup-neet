name: Standardize Maths Quiz Architecture

on:
  push:
    branches: [main]
    paths:
      - "RUN_MATHS_QUIZ_ARCHITECTURE_STANDARDIZER"

permissions:
  contents: write

concurrency:
  group: skillup-main-writer
  cancel-in-progress: false

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Large Numbers quiz architecture to all remaining Maths quizzes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css = r"""
          <style id="skillup-large-numbers-quiz-architecture-v1">
          /* Shared Maths quiz architecture aligned with Large Numbers in Daily Life */
          :root{--blue:#248ac0;--green:#48b516;--ink:#263746;--muted:#71808d;--line:#e3e9ed;--bg:#f7f9fa}
          html{background:var(--bg)}
          body{margin:0!important;background:var(--bg)!important;color:var(--ink)!important;font-family:system-ui,-apple-system,"Segoe UI",sans-serif!important}
          header{position:sticky!important;top:0!important;z-index:20!important;background:#fff!important;border-bottom:1px solid var(--line)!important;box-shadow:none!important}
          header .nav,header.top{width:min(100% - 24px,740px)!important;max-width:740px!important;min-height:48px!important;margin:0 auto!important;padding:6px 12px!important;display:flex!important;align-items:center!important;gap:9px!important}
          header .back,.back{display:grid;place-items:center;flex:0 0 32px;width:32px;height:32px;border:1px solid var(--line);border-radius:9px;color:var(--blue);text-decoration:none;font-size:17px}
          header .brand,.brand{min-width:0;flex:1;font-size:15px;font-weight:850;white-space:nowrap;color:var(--ink)}
          header .pill,.pill{padding:5px 8px;border:0;border-radius:8px;font-size:11px;font-weight:800;white-space:nowrap;background:#f4f7f8;color:#52616c}
          main{width:min(100% - 24px,740px)!important;max-width:740px!important;margin:0 auto!important;padding:12px 8px 32px!important}
          .hero{padding:4px 2px 12px!important;margin:0 0 10px!important;background:transparent!important;border:0!important;box-shadow:none!important;border-radius:0!important}
          .hero h1,h1{font-size:clamp(20px,3vw,25px);line-height:1.25;font-weight:850;color:var(--ink)}
          .hero p,.muted{color:var(--muted)}
          .topic-actions{display:grid!important;grid-template-columns:1fr!important;gap:8px!important;margin:10px 0 12px!important}
          .topic-actions a,.hero a[href*="simulator"],.hero a[href*="simulate"]{display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;min-height:44px!important;padding:9px 12px!important;border:1px solid #b8deed!important;border-radius:10px!important;background:#eaf7ff!important;color:#116b96!important;text-decoration:none!important;font-size:13px!important;font-weight:850!important}
          .progress-row{display:flex!important;justify-content:space-between!important;gap:8px!important;margin:11px 0 5px!important;font-size:11px!important;font-weight:750!important;color:var(--muted)!important}
          .track{height:5px!important;border-radius:8px!important;background:#e8edf0!important;overflow:hidden!important}
          .fill,.bar{height:100%;background:var(--green);border-radius:8px;transition:width .2s}
          .quiz,.finish{width:100%!important;background:#fff!important;border:1px solid var(--line)!important;border-radius:16px!important;padding:17px!important;margin:14px 0!important;box-shadow:none!important}
          .qmeta{margin:0 0 10px!important;color:var(--muted)!important;font-size:11px!important;font-weight:850!important;letter-spacing:.25px}
          .question{margin:0 0 14px!important;color:var(--ink)!important;font-size:clamp(19px,3vw,25px)!important;line-height:1.45!important;font-weight:800!important}
          .options{display:grid!important;grid-template-columns:1fr!important;gap:8px!important}
          .option{display:flex!important;align-items:center!important;gap:10px!important;width:100%!important;min-height:48px!important;padding:10px 12px!important;border:1px solid var(--line)!important;border-radius:12px!important;background:#fff!important;color:var(--ink)!important;text-align:left!important;font:700 14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif!important;box-shadow:none!important}
          .option.selected,.option:focus-visible{border-color:#8bc8e7!important;background:#f0f9ff!important;outline:none!important}
          .option .letter{display:grid;place-items:center;flex:0 0 26px;width:26px;height:26px;border:1px solid var(--line);border-radius:8px;color:#71808d;font-size:11px;font-weight:850}
          .actions{display:grid!important;grid-template-columns:1fr!important;gap:8px!important;margin-top:14px!important}
          .btn{width:100%!important;min-height:46px!important;border:0!important;border-radius:11px!important;font-size:14px!important;font-weight:850!important}
          .btn.check{background:#b8e2a8!important;color:#fff!important}
          .btn.check:disabled{opacity:1!important;cursor:not-allowed!important}
          .btn.continue{background:#248ac0!important;color:#fff!important}
          .feedback{margin:10px 0!important}
          @media(max-width:520px){header .nav,header.top{width:100%!important;padding:6px 10px!important;gap:6px!important}.pill{font-size:10px!important;padding:5px 6px!important}main{width:100%!important;padding:10px 10px 28px!important}.quiz,.finish{padding:14px!important}.question{font-size:19px!important}}
          </style>
          """

          changed = []
          for path in sorted(Path(".").glob("maths-*-quiz.html")):
              if path.name == "maths-large-numbers-quiz.html":
                  continue
              source = path.read_text(encoding="utf-8")
              if "skillup-large-numbers-quiz-architecture-v1" in source:
                  continue
              if "</head>" not in source.lower():
                  print(f"SKIP (no head): {path}")
                  continue
              import re
              updated, count = re.subn(r"</head>", css + "\\n</head>", source, count=1, flags=re.I)
              if count:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print(f"Standardized {len(changed)} Maths quiz pages.")
          if not changed:
              raise SystemExit("No quiz pages were changed; refusing an empty commit.")
          PY
      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'maths-*-quiz.html'
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Standardize remaining Maths quiz pages"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
