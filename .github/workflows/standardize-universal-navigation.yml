name: Standardize universal SkillUp navigation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/standardize-universal-navigation.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: universal-navigation-update
  cancel-in-progress: true

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Standardize shared navigation and all student pages
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          nav_file = root / "shared-nav.js"
          version = "20261013-universal-nav-v1"
          current_script = f'<script src="/shared-nav.js?v={version}"></script>'

          nav = nav_file.read_text(encoding="utf-8")
          nav = nav.replace("href:'profile.html',icon:'♙',label:'Profile'", "href:'/profile.html',icon:'♙',label:'Profile'")
          nav = nav.replace(
              "isActive:()=>current==='index.html' && location.hash!=='#subjects'",
              "isActive:()=>current==='index.html' && (location.pathname==='/' || location.pathname==='/index.html') && location.hash!=='#subjects'"
          )
          nav = nav.replace(
              "isActive:()=>current==='index.html' && location.hash==='#subjects'",
              "isActive:()=>current==='index.html' && (location.pathname==='/' || location.pathname==='/index.html') && location.hash==='#subjects'"
          )
          required_labels = ["Home", "Learn", "Practice", "Community", "Profile"]
          if not all("label:'" + label + "'" in nav for label in required_labels):
              raise SystemExit("Shared nav does not contain the exact required universal navigation labels.")
          if "href:'/community.html'" not in nav:
              raise SystemExit("Community is not the universal navigation destination.")
          if "href:'/profile.html'" not in nav:
              raise SystemExit("Profile destination is not root-relative.")
          nav_file.write_text(nav, encoding="utf-8", newline="")

          skip_names = {
              "central-login.html",
              "central-register.html",
              "central-reset-password.html",
              "chemistry-asset-manager.html",
              "deployment-check-20260909.html",
              "progress.html",
          }
          script_pattern = re.compile(
              r"""<script\b[^>]*\bsrc\s*=\s*["'](?:/)?shared-nav\.js(?:\?[^"']*)?["'][^>]*>\s*</script>""",
              re.I | re.S,
          )
          changed = []
          nav_class_hits = []
          for page in sorted(root.rglob("*.html")):
              relative = page.as_posix()
              if any(part in {".git", "node_modules", "vendor"} for part in page.parts):
                  continue
              if page.name in skip_names or relative.startswith(".github/"):
                  continue

              original = page.read_text(encoding="utf-8")
              cleaned = script_pattern.sub("", original)
              body_end = re.search(r"</body\s*>", cleaned, re.I)
              if body_end:
                  updated = cleaned[:body_end.start()].rstrip() + "\\n" + current_script + "\\n" + cleaned[body_end.start():]
              else:
                  updated = cleaned.rstrip() + "\\n" + current_script + "\\n"

              if updated != original:
                  page.write_text(updated, encoding="utf-8", newline="")
                  changed.append(relative)
              if any(token in updated for token in ("class=\"neet-nav\"", "class=\"skillup-universal-nav\"")):
                  nav_class_hits.append(relative)

          print(f"Standardized the universal footer source and cache-busted {len(changed)} student-facing HTML pages.")
          print(f"Legacy nav-class pages to receive cleanup from shared-nav.js: {len(nav_class_hits)}")
          print("Navigation labels: " + " | ".join(required_labels))
          PY

      - name: Commit universal navigation changes and remove updater
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/standardize-universal-navigation.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No page changes were necessary."
          else
            git commit -m "Use updated shared footer as universal navigation"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload updated website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy universal navigation update
        id: deployment
        uses: actions/deploy-pages@v4
