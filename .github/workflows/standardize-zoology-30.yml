                  else:
                      if c in "'\"`": quote=c
                      elif c=='{':
                          if depth==0: start=i
                          depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0 and start is not None:
                              out.append(s[start:i+1]); start=None
                  i+=1
              return out

          def qobj(q):
              question, opts, ans, exp = q
              return json.dumps({'q':question,'o':opts,'a':ans,'e':exp}, ensure_ascii=False, separators=(',',':'))

          # Process from the end of the file backwards so offsets remain valid.
          replacements=[]
          for chapter in chapters:
              _, content_start, end = find_array_bounds(text, chapter)
              old = text[content_start:end]
              objects = split_objects(old)
              if len(objects) > 30:
                  objects = objects[:30]
              elif len(objects) < 30:
                  need = 30-len(objects)
                  add = extras.get(chapter, [])[:need]
                  if len(add) != need:
                      raise RuntimeError(f'{chapter}: need {need} extras, have {len(add)}')
                  objects.extend(qobj(x) for x in add)
              if len(objects) != 30:
                  raise RuntimeError(f'{chapter}: final count {len(objects)}')
              replacements.append((content_start,end,'\n'+','.join(objects)+'\n'))

          for a,b,r in sorted(replacements, reverse=True):
              text = text[:a] + r + text[b:]

          path.write_text(text, encoding='utf-8')
          print('Standardized all Zoology chapter banks to exactly 30 MCQs.')
          PY
