          def find_array_bounds(s, chapter):
              marker = "'" + chapter.replace("'", "\\'") + "':["
              start = s.find(marker)
              if start < 0:
                  raise RuntimeError('Missing chapter: ' + chapter)
              content_start = start + len(marker)
              depth = 1
              quote = None
              esc = False
              i = content_start
              while i < len(s):
                  c = s[i]
                  if quote:
                      if esc:
                          esc = False
                      elif c == '\\':
                          esc = True
                      elif c == quote:
                          quote = None
                  else:
                      if c in "'\"`":
                          quote = c
                      elif c == '[':
                          depth += 1
                      elif c == ']':
                          depth -= 1
                          if depth == 0:
                              return start, content_start, i
                  i += 1
              raise RuntimeError('Unclosed array: ' + chapter)

          def split_objects(s):
              out=[]; start=None; depth=0; quote=None; esc=False; i=0
              while i < len(s):
                  c=s[i]
                  if quote:
