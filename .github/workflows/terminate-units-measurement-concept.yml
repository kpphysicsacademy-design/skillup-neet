name: Terminate Units of Measurement concept URL
on:
  push:
    paths:
      - '.github/workflows/terminate-units-measurement-concept.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  terminate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable Units of Measurement URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('physics-concept.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- TERMINATE UNITS OF MEASUREMENT URL -->'
          script='''<script>\n(function(){\n  const c=new URLSearchParams(location.search).get('concept')||'';\n  if(c.trim().toLowerCase()==='units of measurement'){\n    location.replace('physics-home.html');\n  }\n})();\n</script>\n'''
          if marker not in s:
              s=s.replace('</body>', marker+'\n'+script+'</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit termination
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-concept.html
          git diff --cached --quiet || git commit -m 'Terminate Units of Measurement concept URL'
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          git rm -f .github/workflows/terminate-units-measurement-concept.yml || true
          git diff --cached --quiet || git commit -m 'Remove one-time termination workflow'
          git push || true
