name: Test Chemistry quiz persistence
on:
  pull_request:
    paths:
      - chemistry-mcq.html
      - scripts/test-chemistry-quiz-persistence.cjs
      - .github/workflows/test-chemistry-quiz-persistence.yml
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Chemistry quiz save and restore
        run: node scripts/test-chemistry-quiz-persistence.cjs
