name: Preview SkillUp shared design-system route updates

on:
  push:
    branches: [main]
    paths:
      - '.github/trigger-unify-quiz-theme.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skillup-shared-theme-preview
  cancel-in-progress: false

jobs:
  preview-shared-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate a review-only patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import difflib
          import re
          import sys

          root = Path('.')
          output = Path('preview')
          output.mkdir(exist_ok=True)
          version = '20261125-central-design-system-v2'
          shared_pattern = re.compile(
              r"""(<script\b[^>]*\bsrc\s*=\s*)(["'])([^"']*shared-nav\.js)(?:\?[^"']*)?\2""",
              re.I,
          )
          patches = []
          changed = []
          for path in sorted(root.rglob('*.html')):
              rel = path.as_posix()
              if rel.startswith(('.git/', '.github/')):
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if not re.search(r'shared-nav\.js', original, re.I):
                  continue
              updated, count = shared_pattern.subn(
                  lambda m: m.group(1) + m.group(2) + m.group(3).split('?')[0] + '?v=' + version + m.group(2),
                  original,
              )
              if updated != original:
                  changed.append(rel)
                  patches.extend(difflib.unified_diff(
                      original.splitlines(keepends=True),
                      updated.splitlines(keepends=True),
                      fromfile='a/' + rel,
                      tofile='b/' + rel,
                  ))
          limit = 100
          print(f'Preview only: {len(changed)} HTML files would change.')
          for name in changed:
              print('CANDIDATE', name)
          if len(changed) > limit:
              print(f'REFUSING: candidate count exceeds safety limit ({limit}). No repository files were changed.')
              sys.exit(1)
          (output / 'skillup-shared-theme.patch').write_text(''.join(patches), encoding='utf-8')
          (output / 'summary.txt').write_text(
              f'Preview only. Candidate files: {len(changed)}\n' +
              '\n'.join(changed) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: skillup-shared-theme-preview
          path: preview/
          if-no-files-found: error
          retention-days: 7
