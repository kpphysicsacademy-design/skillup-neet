name: Update Dimensional Analysis Physics Quiz

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-dimensional-analysis.yml'
      - 'dimensional-analysis-update-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Dimensional Analysis quiz
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('physics-concept.html')
          s=p.read_text(encoding='utf-8')
          bank="""const dimensionalAnalysisQuiz=[
          ['What is dimensional analysis used for?',['Changing units only','Checking relationships between physical quantities using dimensions','Measuring temperature directly','Finding only numerical values'],1,'Dimensional analysis uses fundamental dimensions to examine physical relationships.'],
          ['Which set contains the fundamental dimensions commonly used in mechanics?',['M, L, T','F, W, P','N, J, W','m, kg, s'],0,'Mass, length and time are represented by M, L and T.'],
          ['The dimensional formula of velocity is:',['[L T⁻¹]','[L T⁻²]','[M L T⁻¹]','[M L T⁻²]'],0,'Velocity = displacement/time, so [L T⁻¹].'],
          ['The dimensional formula of force is:',['[M L T⁻¹]','[M L T⁻²]','[M L² T⁻²]','[M⁻¹ L T⁻²]'],1,'From F=ma, force has dimensions [M L T⁻²].'],
          ['Dimensional analysis can be used to check whether an equation is:',['dimensionally homogeneous','numerically exact in every case','free from experimental error','independent of units'],0,'Both sides of a physically valid equation must have the same dimensions.'],
          ['Which quantity is dimensionless?',['Velocity','Force','Strain','Pressure'],2,'Strain is a ratio of two lengths and is dimensionless.'],
          ['If x = at², the dimensions of a are:',['[L]','[L T⁻¹]','[L T⁻²]','[L² T⁻²]'],2,'Since a=x/t², its dimensions are [L T⁻²].'],
          ['If F = kx, the dimensions of spring constant k are:',['[M T⁻²]','[M L T⁻²]','[M L⁻¹ T⁻²]','[M L T⁻¹]'],0,'k=F/x gives [M L T⁻²]/[L]=[M T⁻²].'],
          ['Which pair has the same dimensions?',['Force and pressure','Work and torque','Power and energy','Velocity and acceleration'],1,'Both work and torque have dimensions [M L² T⁻²].'],
          ['The dimensional formula of G can be obtained from:',['F=ma','F=Gm₁m₂/r²','P=W/t','V=IR'],1,'Using F=Gm₁m₂/r² gives G=[M⁻¹ L³ T⁻²].'],
          ['A quantity with dimensions [M L² T⁻²] can represent:',['energy','power','momentum','pressure'],0,'Energy and work have dimensions [M L² T⁻²].'],
          ['Dimensional analysis cannot determine:',['whether an equation is dimensionally consistent','dimensions of a derived quantity','the numerical dimensionless constant in a formula','relations among dimensions'],2,'Pure dimensional analysis cannot determine numerical dimensionless constants such as 2 or π.'],
          ['Which expression is dimensionally valid for displacement?',['vt','at','v/t','a/t'],0,'Velocity × time has dimensions [L].'],
          ['If E = hν, the dimensions of h are:',['[M L² T⁻¹]','[M L² T⁻²]','[M L T⁻¹]','[M⁻¹ L² T⁻¹]'],0,'h=E/ν, giving [M L² T⁻¹].'],
          ['Which statement about dimensional analysis is correct?',['It replaces all experimental measurements','It can test dimensional consistency but has limitations','It changes the physical dimensions of a quantity','It applies only to SI units'],1,'Dimensional analysis is a powerful consistency check, but it cannot determine everything in a physical equation.']
          ];"""
          if 'const dimensionalAnalysisQuiz=' not in s:
              s=s.replace('const generic=',bank+'\nconst generic=',1)
          selector="const questions=key==='unit conversion'?unitConversionQuiz:key==='si prefixes'?siPrefixesQuiz:key==='unit systems'?unitSystemsQuiz:key==='derived units'?derivedUnitsQuiz:key==='dimensions'?dimensionsQuiz:key==='dimensional analysis'?dimensionalAnalysisQuiz:generic;"
          s=re.sub(r"const questions=.*?;let qi=0",selector+'let qi=0',s,count=1,flags=re.S)
          block=re.search(r"const dimensionalAnalysisQuiz=\[(.*?)\];\nconst generic=",s,re.S)
          if not block or len(re.findall(r"^\s*\['",block.group(1),re.M))!=15:
              raise SystemExit('Dimensional Analysis bank verification failed')
          if "key==='dimensional analysis'?dimensionalAnalysisQuiz" not in s:
              raise SystemExit('Dimensional Analysis selector verification failed')
          p.write_text(s,encoding='utf-8')
          print('Verified Dimensional Analysis quiz: 15 MCQs')
          PY

      - name: Commit quiz source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-concept.html
          if git diff --cached --quiet; then
            echo 'Quiz already installed.'
          else
            git commit -m 'Update Dimensional Analysis Physics quiz with 15 MCQs'
            git push
          fi
