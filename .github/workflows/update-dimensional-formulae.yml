name: Update Dimensional Formulae Physics Quiz
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Dimensional Formulae quiz
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('physics-concept.html')
          s=p.read_text(encoding='utf-8')
          bank="""const dimensionalFormulaeQuiz=[
          ['The dimensional formula of velocity is:',['[L T⁻¹]','[L T⁻²]','[M L T⁻¹]','[M L T⁻²]'],0,'Velocity is displacement divided by time, so its dimensions are [L T⁻¹].'],
          ['The dimensional formula of acceleration is:',['[L T⁻¹]','[L T⁻²]','[M L T⁻²]','[M L² T⁻²]'],1,'Acceleration is change of velocity per unit time, giving [L T⁻²].'],
          ['The dimensional formula of force is:',['[M L T⁻¹]','[M L T⁻²]','[M L² T⁻²]','[M⁻¹ L T⁻²]'],1,'From F=ma, force has dimensions [M L T⁻²].'],
          ['The dimensional formula of work is:',['[M L T⁻²]','[M L² T⁻²]','[M L² T⁻³]','[M² L T⁻²]'],1,'Work equals force multiplied by displacement, giving [M L² T⁻²].'],
          ['The dimensional formula of power is:',['[M L² T⁻²]','[M L² T⁻³]','[M L T⁻²]','[M⁻¹ L² T⁻³]'],1,'Power is work divided by time, so its dimensions are [M L² T⁻³].'],
          ['The dimensional formula of pressure is:',['[M L⁻¹ T⁻²]','[M L T⁻²]','[M L² T⁻²]','[M⁻¹ L T⁻²]'],0,'Pressure is force per unit area, giving [M L⁻¹ T⁻²].'],
          ['The dimensional formula of density is:',['[M L⁻¹]','[M L⁻²]','[M L⁻³]','[M⁻¹ L³]'],2,'Density is mass divided by volume, so [M L⁻³].'],
          ['The dimensional formula of momentum is:',['[M L T⁻¹]','[M L T⁻²]','[M L² T⁻¹]','[M⁻¹ L T⁻¹]'],0,'Momentum equals mass multiplied by velocity, giving [M L T⁻¹].'],
          ['The dimensional formula of impulse is:',['[M L T⁻¹]','[M L T⁻²]','[M L² T⁻¹]','[M L² T⁻²]'],0,'Impulse equals force multiplied by time, giving [M L T⁻¹].'],
          ['The dimensional formula of frequency is:',['[T]','[T⁻¹]','[L T⁻¹]','[M T⁻¹]'],1,'Frequency is the reciprocal of time period, so [T⁻¹].'],
          ['The dimensional formula of gravitational constant G is:',['[M⁻¹ L³ T⁻²]','[M L³ T⁻²]','[M⁻¹ L² T⁻²]','[M L⁻³ T²]'],0,'From F=Gm₁m₂/r², G has dimensions [M⁻¹ L³ T⁻²].'],
          ['The dimensional formula of Planck constant h is:',['[M L² T⁻¹]','[M L T⁻¹]','[M L² T⁻²]','[M⁻¹ L² T⁻¹]'],0,'Since energy equals h times frequency, h has dimensions [M L² T⁻¹].'],
          ['The dimensional formula of surface tension is:',['[M T⁻²]','[M L T⁻²]','[M L² T⁻²]','[M L⁻¹ T⁻²]'],0,'Surface tension is force per unit length, giving [M T⁻²].'],
          ['The dimensional formula of viscosity coefficient is:',['[M L⁻¹ T⁻¹]','[M L T⁻¹]','[M L⁻¹ T⁻²]','[M L² T⁻¹]'],0,'Dynamic viscosity has dimensions [M L⁻¹ T⁻¹].'],
          ['Which statement about dimensional formulae is correct?',['They depend on the chosen unit names','They express a quantity in terms of fundamental dimensions','They are identical to SI units','They apply only to scalar quantities'],1,'A dimensional formula expresses a physical quantity using fundamental dimensions such as M, L and T.']
          ];"""
          old=r"const dimensionsQuiz=\[.*?\];\nconst generic="
          if re.search(old,s,re.S):
              s=re.sub(old,bank+'\nconst generic=',s,count=1,flags=re.S)
          elif 'const dimensionalFormulaeQuiz=' not in s:
              s=s.replace('const generic=',bank+'\nconst generic=',1)
          selector="const questions=key==='unit conversion'?unitConversionQuiz:key==='si prefixes'?siPrefixesQuiz:key==='unit systems'?unitSystemsQuiz:key==='derived units'?derivedUnitsQuiz:key==='dimensions'?dimensionsQuiz:key==='dimensional formulae'?dimensionalFormulaeQuiz:generic;"
          s=re.sub(r"const questions=.*?;let qi=0",selector+'let qi=0',s,count=1,flags=re.S)
          block=re.search(r"const dimensionalFormulaeQuiz=\[(.*?)\];\nconst generic=",s,re.S)
          if not block or len(re.findall(r"^\s*\['",block.group(1),re.M))!=15: raise SystemExit('Dimensional Formulae quiz must contain exactly 15 MCQs')
          if "key==='dimensional formulae'?dimensionalFormulaeQuiz" not in s: raise SystemExit('Dimensional Formulae selector missing')
          p.write_text(s,encoding='utf-8')
          print('Verified Dimensional Formulae quiz: 15 MCQs')
          PY
      - name: Commit quiz update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-concept.html
          git diff --cached --quiet && exit 0
          git commit -m 'Update Dimensional Formulae Physics quiz with 15 MCQs [skip ci]'
          git push
      - name: Remove one-time updater
        if: success()
        run: |
          git rm .github/workflows/update-dimensional-formulae.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove one-time Dimensional Formulae updater [skip ci]'
          git push
