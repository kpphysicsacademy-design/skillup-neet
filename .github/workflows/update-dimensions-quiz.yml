name: Update Dimensions Physics Quiz
on:
  push:
    paths:
      - '.github/workflows/update-dimensions-quiz.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Dimensions quiz and hide tips until answer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-concept.html')
          s=p.read_text(encoding='utf-8')
          if 'const dimensionsQuiz=' not in s:
              bank="""const dimensionsQuiz=[
          ['The dimensions of a physical quantity represent:',['its numerical value only','its dependence on fundamental quantities','its unit name only','its measuring instrument'],1,'Dimensions show how a quantity depends on fundamental quantities such as mass, length and time.'],
          ['The dimensions of velocity are:',['[LT⁻¹]','[LT⁻²]','[MLT⁻¹]','[L⁻¹T]'],0,'Velocity = displacement/time, so [L T⁻¹].'],
          ['The dimensions of acceleration are:',['[LT⁻¹]','[LT⁻²]','[MLT⁻²]','[L²T⁻¹]'],1,'Acceleration = velocity/time, so [L T⁻²].'],
          ['The dimensions of force are:',['[MLT⁻¹]','[MLT⁻²]','[ML²T⁻²]','[M⁻¹LT⁻²]'],1,'Force = mass × acceleration = [M L T⁻²].'],
          ['The dimensions of work are:',['[MLT⁻²]','[ML²T⁻²]','[ML²T⁻¹]','[M²LT⁻²]'],1,'Work = force × displacement = [M L² T⁻²].'],
          ['The dimensions of power are:',['[ML²T⁻²]','[ML²T⁻³]','[MLT⁻²]','[ML³T⁻³]'],1,'Power = work/time = [M L² T⁻³].'],
          ['The dimensions of pressure are:',['[ML⁻¹T⁻²]','[MLT⁻²]','[ML²T⁻²]','[M⁻¹LT⁻²]'],0,'Pressure = force/area = [M L⁻¹ T⁻²].'],
          ['The dimensions of density are:',['[ML⁻²]','[ML⁻³]','[M⁻¹L³]','[ML³]'],1,'Density = mass/volume = [M L⁻³].'],
          ['The dimensions of momentum are:',['[MLT⁻¹]','[MLT⁻²]','[ML²T⁻¹]','[M²LT⁻¹]'],0,'Momentum = mass × velocity = [M L T⁻¹].'],
          ['Which quantity is dimensionless?',['Force','Velocity','Strain','Pressure'],2,'Strain is a ratio of two lengths, so it is dimensionless.'],
          ['The dimensions of gravitational constant G are:',['[M⁻¹L³T⁻²]','[ML³T⁻²]','[M⁻¹L²T⁻²]','[ML⁻²T⁻²]'],0,'From F=Gm₁m₂/r², G=[M⁻¹L³T⁻²].'],
          ['The dimensions of Planck constant h are:',['[ML²T⁻¹]','[MLT⁻¹]','[ML²T⁻²]','[M⁻¹L²T⁻¹]'],0,'h has dimensions of energy × time = [M L² T⁻¹].'],
          ['The dimensions of frequency are:',['[T]','[T⁻¹]','[LT⁻¹]','[L⁻¹T]'],1,'Frequency is inverse time, so [T⁻¹].'],
          ['The dimensions of energy and work are:',['different','the same','reciprocal','dimensionless'],1,'Energy and work both have [M L² T⁻²].'],
          ['Which statement about dimensions is correct?',['Dimensions depend on the choice of unit system','Dimensions can help test dimensional consistency','Every dimensionless quantity has no numerical value','Dimensions and units are exactly the same'],1,'Dimensional analysis can test whether an equation is dimensionally consistent.']
          ];
          """
              marker='const generic=Array.from({length:15},()=>'
              if marker not in s:
                  raise SystemExit('generic marker not found')
              s=s.replace(marker,bank+marker,1)
              old="const questions=key==='unit conversion'?unitConversionQuiz:key==='si prefixes'?siPrefixesQuiz:key==='unit systems'?unitSystemsQuiz:key==='derived units'?derivedUnitsQuiz:generic;"
              new="const questions=key==='unit conversion'?unitConversionQuiz:key==='si prefixes'?siPrefixesQuiz:key==='unit systems'?unitSystemsQuiz:key==='derived units'?derivedUnitsQuiz:key==='dimensions'?dimensionsQuiz:generic;"
              if old not in s:
                  raise SystemExit('selector not found')
              s=s.replace(old,new,1)
          s=s.replace("$('hint').textContent=q[3];", "$('hint').textContent='';", 1)
          target="answered=true;const q=questions[qi],os=document.querySelectorAll('.option');"
          replacement="answered=true;const q=questions[qi],os=document.querySelectorAll('.option');$('hint').textContent=q[3];"
          if target not in s:
              raise SystemExit('answer handler marker not found')
          s=s.replace(target,replacement,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('physics-concept.html').read_text(encoding='utf-8')
          assert 'const dimensionsQuiz=' in s
          assert "key==='dimensions'?dimensionsQuiz:generic" in s
          assert "$('hint').textContent='';" in s
          assert "$('hint').textContent=q[3];" in s
          print('Dimensions quiz and delayed tip verified')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-concept.html
          git diff --cached --quiet || git commit -m 'Add dedicated Dimensions physics quiz and delay tips'
          git push
      - name: Remove updater workflow
        if: success()
        run: |
          git rm .github/workflows/update-dimensions-quiz.yml
          git commit -m 'Remove one-time Dimensions quiz updater'
          git push
