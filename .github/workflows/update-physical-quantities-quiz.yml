name: Update Physical Quantities Quiz
on:
  push:
    paths:
      - '.github/workflows/update-physical-quantities-quiz.yml'
      - 'PHYSICAL_QUANTITIES_UPDATE_TRIGGER'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch quiz bank
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('physics-400-concepts.js')
          s = p.read_text(encoding='utf-8')
          if "install('physical quantities'" in s:
              print('Physical Quantities quiz already installed')
          else:
              block = r'''install('physical quantities','Physical Quantities',[
          ['What is a physical quantity?',['A quantity that can be measured and expressed by a number and a unit','A unit symbol alone','A physical object only','A mathematical constant only'],0,'A physical quantity is measurable and is expressed with a numerical value and an appropriate unit.'],
          ['Which pair is a physical quantity and its SI unit?',['Length and metre','Metre and kilogram','Second and time symbol only','Newton and metre as base unit'],0,'Length is a physical quantity and metre is its SI unit.'],
          ['Which statement best describes measurement of a physical quantity?',['It compares the quantity with a chosen standard unit','It removes the need for units','It always gives a dimensionless number','It depends only on the name of the quantity'],0,'Measurement is comparison of a physical quantity with a standard unit.'],
          ['Which of the following is an SI base quantity?',['Length','Velocity','Force','Density'],0,'Length is one of the seven SI base quantities; the others listed are derived quantities.'],
          ['Which is a derived physical quantity?',['Mass','Time','Electric current','Speed'],3,'Speed is derived from length and time, so it is a derived quantity.'],
          ['A physical quantity written as 2.50 m contains:',['Only a number','Only a unit','A numerical value and a unit','A dimension only'],2,'The measurement contains the numerical value 2.50 and the unit metre.'],
          ['Which pair contains two scalar physical quantities?',['Mass and time','Displacement and velocity','Force and acceleration','Momentum and displacement'],0,'Mass and time are scalar quantities and do not require direction for their specification.'],
          ['How many SI base quantities are there?',['5','6','7','9'],2,'The SI system has seven base quantities.'],
          ['In the measurement 2.50 m, the numerical value is:',['0.025','2.50','250','2500'],1,'The numerical value is 2.50 when the quantity is expressed as 2.50 m.'],
          ['The statement 12 kg represents:',['A numerical value of 12 with unit kilogram','A unit without a number','A dimension without a unit','A dimensionless quantity'],0,'The measurement has numerical value 12 and unit kilogram.'],
          ['If a length is expressed as 2 m or 200 cm, which statement is correct?',['The physical quantity is different','The physical quantity is the same, but the numerical values differ','Both numerical values must be equal','Only centimetres can measure length'],1,'Changing units changes the numerical value but not the physical length.'],
          ['Which representation is a derived physical quantity?',['5 kg','10 s','20 A','15 m s⁻¹'],3,'Metre per second is a derived unit for speed or velocity magnitude.'],
          ['Which pair contains one scalar and one vector quantity?',['Mass and displacement','Time and temperature','Length and mass','Speed and distance'],0,'Mass is scalar, while displacement is a vector.'],
          ['Which statement correctly distinguishes a physical quantity from a unit?',['A physical quantity is measured; a unit is a standard used for comparison','A unit is always larger than the quantity','A physical quantity is only a symbol','They are exactly the same thing'],0,'The quantity is what is measured, while the unit provides the standard for measurement.'],
          ['A student writes 5 m and 500 cm for the same straight length. Which conclusion is correct?',['The lengths are unequal','The lengths are equal because 500 cm = 5 m','Only 500 cm is a physical quantity','The unit conversion changes the actual length'],1,'Since 100 cm = 1 m, 500 cm equals 5 m, so both represent the same length.']
          ],'Identify the measurable quantity first, then distinguish its numerical value, unit, and physical nature.');
          '''
              marker = '\n})();'
              pos = s.rfind(marker)
              if pos < 0:
                  raise SystemExit('Could not find quiz override terminator')
              s = s[:pos] + '\n' + block + s[pos:]
              p.write_text(s, encoding='utf-8')
          PY
      - name: Patch concept quiz page to 15 MCQs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('physics-concept.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('3 focused NEET-style MCQs','15 focused NEET-style MCQs',1)
          s = s.replace('Skill Mastery <span id="mt">0 / 3</span>','Skill Mastery <span id="mt">0 / 15</span>',1)
          s = s.replace('Question 1 of 3','Question 1 of 15',1)
          s = s.replace('<div id="pct">33%</div>','<div id="pct">7%</div>',1)
          quiz = r'''const quiz=[
          ['What is a physical quantity?',['A measurable property expressed by a numerical value and a unit','A unit symbol alone','A measuring instrument only','A mathematical constant only'],0],
          ['Which of the following is a physical quantity?',['Length','Metre','Kilogram','Second'],0],
          ['Which pair contains only physical quantities?',['Length and time','Metre and second','Kilogram and ampere','Newton and joule'],0],
          ['Which is an SI base quantity?',['Mass','Velocity','Force','Density'],0],
          ['Which is a derived physical quantity?',['Velocity','Length','Mass','Time'],0],
          ['Which of the following is a scalar quantity?',['Mass','Displacement','Velocity','Force'],0],
          ['Which of the following is a vector quantity?',['Speed','Mass','Velocity','Temperature'],2],
          ['How many SI base quantities are there?',['5','6','7','8'],2],
          ['In the measurement 2.50 m, the numerical value is:',['2.50','m','250','2'],0],
          ['In 12 kg, the unit is:',['12','kg','mass','12 kg'],1],
          ['The same physical quantity can be expressed using:',['Only one possible unit','Different compatible units','No units','Only base units'],1],
          ['The SI unit of speed is:',['m','m s⁻¹','m s⁻²','kg'],1],
          ['Which pair contains one scalar and one vector quantity?',['Mass and velocity','Speed and mass','Temperature and mass','Length and time'],0],
          ['Which statement correctly distinguishes a physical quantity from a unit?',['A quantity is measured; a unit is the standard used to express it','A quantity and unit are identical','A unit is always a number','A quantity has no numerical value'],0],
          ['5 m and 500 cm represent:',['Different lengths','The same length','Different dimensions','Incompatible quantities'],1]
          ];'''
          pattern = r"const quiz=\[.*?\];let i=0,sel=-1,score=0"
          ns, n = re.subn(pattern, quiz + 'let i=0,sel=-1,score=0', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not locate the generic quiz block')
          p.write_text(ns, encoding='utf-8')
          PY
      - name: Commit update and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f PHYSICAL_QUANTITIES_UPDATE_TRIGGER .github/workflows/update-physical-quantities-quiz.yml
          git add physics-400-concepts.js physics-concept.html PHYSICAL_QUANTITIES_UPDATE_TRIGGER .github/workflows/update-physical-quantities-quiz.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Enable 15 MCQs on Physical Quantities concept quiz'
          git push
