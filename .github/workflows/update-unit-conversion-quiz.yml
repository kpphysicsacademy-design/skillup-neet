name: Update Unit Conversion Quiz
# Triggered by a follow-up commit so the updater runs on GitHub Actions.
on:
  push:
    paths:
      - '.github/workflows/update-unit-conversion-quiz.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Unit Conversion bank only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-400-concepts.js')
          s=p.read_text(encoding='utf-8')
          if "'unit conversion':{title:'Unit Conversion'" in s:
              print('Unit Conversion bank already exists; no quiz-bank change needed')
              raise SystemExit(0)
          bank=r'''\'unit conversion\':{title:\'Unit Conversion\',hint:\'Convert the numerical representation correctly while preserving the physical quantity and its dimensions.\',quiz:[
[\'What happens to a physical quantity when its unit is converted?\',[\'The physical quantity remains the same while its numerical value may change\',\'The physical quantity changes\',\'Its dimensions disappear\',\'It becomes dimensionless\'],0,\'A valid unit conversion changes the numerical representation, not the physical quantity.\'],
[\'1 kilometre is equal to:\',[\'10 m\',\'100 m\',\'1000 m\',\'10,000 m\'],2,\'The SI prefix kilo represents 10^3, so 1 km = 1000 m.\'],
[\'1 metre is equal to:\',[\'10 cm\',\'100 cm\',\'1000 cm\',\'0.01 cm\'],1,\'One metre contains 100 centimetres.\'],
[\'1 centimetre is equal to:\',[\'10^-1 m\',\'10^-2 m\',\'10^-3 m\',\'10^2 m\'],1,\'Centi represents 10^-2, so 1 cm = 10^-2 m.\'],
[\'1 millimetre is equal to:\',[\'10^-2 m\',\'10^-3 m\',\'10^-6 m\',\'10^3 m\'],1,\'Milli represents 10^-3, so 1 mm = 10^-3 m.\'],
[\'2.5 km is equal to:\',[\'25 m\',\'250 m\',\'2500 m\',\'25,000 m\'],2,\'2.5 × 1000 = 2500 m.\'],
[\'500 cm is equal to:\',[\'0.5 m\',\'5 m\',\'50 m\',\'5000 m\'],1,\'500 cm ÷ 100 = 5 m.\'],
[\'3.2 m is equal to:\',[\'32 cm\',\'320 cm\',\'3200 cm\',\'0.32 cm\'],1,\'3.2 × 100 = 320 cm.\'],
[\'1 hour is equal to:\',[\'60 s\',\'600 s\',\'3600 s\',\'36,000 s\'],2,\'1 hour = 60 minutes and 1 minute = 60 seconds, giving 3600 s.\'],
[\'1 minute is equal to:\',[\'30 s\',\'60 s\',\'100 s\',\'600 s\'],1,\'One minute contains 60 seconds.\'],
[\'72 km/h is equal to:\',[\'10 m/s\',\'20 m/s\',\'36 m/s\',\'72 m/s\'],1,\'72 km/h × 5/18 = 20 m/s.\'],
[\'1 gram is equal to:\',[\'10^-1 kg\',\'10^-2 kg\',\'10^-3 kg\',\'10^3 kg\'],2,\'The gram is 10^-3 of a kilogram.\'],
[\'1 litre is equal to:\',[\'10^-1 m^3\',\'10^-2 m^3\',\'10^-3 m^3\',\'10^3 m^3\'],2,\'1 L = 1 dm^3 = 10^-3 m^3.\'],
[\'To convert 2500 mm to metres, you should:\',[\'Multiply by 1000\',\'Divide by 1000\',\'Multiply by 100\',\'Divide by 100\'],1,\'Since 1000 mm = 1 m, divide 2500 by 1000 to obtain 2.5 m.\'],
[\'Which statement about unit conversion is correct?\',[\'The numerical value may change, but the physical quantity and dimensions are preserved\',\'The dimensions always change\',\'The physical quantity changes\',\'The unit must always be an SI base unit\'],0,\'A correct conversion preserves the physical quantity and its dimensions while changing its numerical representation.\']
]},
'''
          marker="'si prefixes':{"
          if marker not in s:
              raise SystemExit('SI Prefixes bank not found; refusing to modify file')
          s=s.replace(marker,bank+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('physics-400-concepts.js').read_text(encoding='utf-8')
          start=s.index("'unit conversion':{title:'Unit Conversion'")
          end=s.index("'si prefixes':{",start)
          section=s[start:end]
          assert section.count("['") == 15
          assert "'si prefixes':" in s and "'unit systems':" in s
          print('Unit Conversion bank validated: 15 MCQs; existing banks retained')
          PY
      - name: Commit and remove updater
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- physics-400-concepts.js; then
            echo 'No quiz-bank change required.'
          else
            git add physics-400-concepts.js
            git commit -m 'Update Unit Conversion physics quiz [skip ci]'
          fi
          git rm .github/workflows/update-unit-conversion-quiz.yml
          git commit -m 'Remove one-time Unit Conversion quiz updater [skip ci]'
          git push origin HEAD:main
