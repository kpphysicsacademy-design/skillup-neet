name: Update Unit 2 Lesson 2 Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-unit2-lesson2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update Animal Morphology & Anatomy lesson test
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('zoology-chapter-test.html')
          html = path.read_text(encoding='utf-8')

          key = 'Animal Morphology & Anatomy'
          dataset = r'''\n'Animal Morphology & Anatomy':[{q:'The body of a cockroach is divided into:',o:['Head, thorax and abdomen','Head and abdomen only','Cephalothorax and abdomen','Thorax and tail'],a:'Head, thorax and abdomen',e:'Cockroach shows distinct head, thorax and abdomen. The thorax bears the legs and wings, while the abdomen contains most visceral organs.'},{q:'How many pairs of walking legs are present in a cockroach?',o:['Two','Three','Four','Five'],a:'Three',e:'Each of the three thoracic segments bears one pair of walking legs, giving the cockroach three pairs of legs.'},{q:'The head of a cockroach is formed by the fusion of:',o:['Six segments','Three segments','Two segments','Ten segments'],a:'Six segments',e:'The cockroach head is formed by fusion of six segments and bears antennae, compound eyes and mouthparts.'},{q:'The compound eyes of a cockroach are located on the:',o:['Thorax','Abdomen','Head','Legs'],a:'Head',e:'A pair of large sessile compound eyes is present on the head. Each eye contains numerous ommatidia.'},{q:'The thorax of a cockroach consists of:',o:['Prothorax, mesothorax and metathorax','Head, prothorax and abdomen','Mesothorax and abdomen only','Three abdominal segments'],a:'Prothorax, mesothorax and metathorax',e:'The thorax has three segments. Each bears a pair of legs; mesothorax and metathorax also bear wings.'},{q:'Which thoracic segment bears the first pair of wings in a cockroach?',o:['Prothorax','Mesothorax','Metathorax','Abdomen'],a:'Mesothorax',e:'The leathery forewings or tegmina arise from the mesothorax. The membranous hindwings arise from the metathorax.'},{q:'The second pair of wings in cockroach is mainly used for:',o:['Protection of the abdomen','Flight','Digestion','Sensing chemicals'],a:'Flight',e:'The hindwings are membranous and are the principal wings used during flight. The forewings mainly protect them.'},{q:'The respiratory organs of a cockroach are:',o:['Gills','Lungs','Tracheae','Nephridia'],a:'Tracheae',e:'Cockroaches respire through a tracheal system. Air enters and leaves through paired spiracles on the thorax and abdomen.'},{q:'The excretory structures of cockroach are:',o:['Nephridia','Malpighian tubules','Flame cells','Green glands'],a:'Malpighian tubules',e:'Malpighian tubules remove nitrogenous wastes from haemolymph and open into the alimentary canal at the junction of midgut and hindgut.'},{q:'The circulatory system of cockroach is:',o:['Closed and double','Open','Closed and single','Absent'],a:'Open',e:'Cockroach has an open circulatory system. Haemolymph flows through the haemocoel and is not confined to blood vessels throughout its circulation.'},{q:'Which type of blood pigment is present in cockroach haemolymph?',o:['Haemoglobin','Haemocyanin','No respiratory pigment','Chlorocruorin'],a:'No respiratory pigment',e:'Cockroach haemolymph generally lacks a respiratory pigment because oxygen is delivered directly to tissues through the tracheal system.'},{q:'The alimentary canal of cockroach is divided into:',o:['Foregut, midgut and hindgut','Mouth, stomach and intestine only','Crop and rectum only','Pharynx, gizzard and cloaca only'],a:'Foregut, midgut and hindgut',e:'The cockroach alimentary canal has foregut, midgut and hindgut regions with specialised parts for ingestion, digestion, absorption and faecal elimination.'},{q:'The crop in cockroach primarily functions in:',o:['Storage of food','Absorption of oxygen','Formation of urine','Blood circulation'],a:'Storage of food',e:'The crop is a dilated part of the foregut that temporarily stores food.'},{q:'The gizzard of cockroach mainly helps in:',o:['Mechanical grinding of food','Gas exchange','Urine storage','Blood pumping'],a:'Mechanical grinding of food',e:'The gizzard or proventriculus has a thick muscular wall and chitinous teeth that help grind food.'},{q:'Which part of the cockroach gut is mainly responsible for enzymatic digestion and absorption?',o:['Foregut','Midgut','Rectum','Anal styles'],a:'Midgut',e:'The midgut is the major site of enzymatic digestion and absorption. Gastric caeca contribute digestive secretions and increase absorptive surface.'},{q:'Cockroach has how many pairs of spiracles?',o:['Five','Eight','Ten','Twelve'],a:'Ten',e:'Cockroach has ten pairs of spiracles: two pairs are thoracic and eight pairs are abdominal.'},{q:'The nervous system of cockroach includes:',o:['A brain and a ventral nerve cord with ganglia','Only a dorsal brain','Only a spinal cord','A diffuse nerve net only'],a:'A brain and a ventral nerve cord with ganglia',e:'The nervous system consists of a supra-oesophageal ganglion or brain, sub-oesophageal ganglion and a double ventral nerve cord with segmental ganglia.'},{q:'The antennae of cockroach primarily function as:',o:['Sensory organs','Digestive organs','Excretory organs','Respiratory organs'],a:'Sensory organs',e:'Cockroach antennae are highly sensitive and detect touch, odour and other environmental cues.'},{q:'Cockroach is described as dioecious because:',o:['Male and female sexes occur in separate individuals','It reproduces only asexually','It changes sex during life','Both sexes occur in one individual'],a:'Male and female sexes occur in separate individuals',e:'Cockroach is dioecious, meaning male and female reproductive organs occur in separate individuals.'},{q:'The male reproductive system of cockroach includes a pair of:',o:['Testes','Ovaries','Spermathecae','Uterine glands'],a:'Testes',e:'The male cockroach has a pair of testes located in the fourth to sixth abdominal segments, along with ducts and accessory structures.'},{q:'The female cockroach possesses how many ovaries?',o:['One','Two','Three','Four'],a:'Two',e:'A female cockroach has a pair of ovaries. Each ovary consists of a group of ovarioles.'},{q:'The female reproductive structure that stores sperm after mating is the:',o:['Spermatheca','Seminal vesicle','Testis','Malpighian tubule'],a:'Spermatheca',e:'Spermathecae store sperm received during copulation and allow fertilisation of eggs later.'},{q:'The egg case of cockroach is called:',o:['Ootheca','Cocoon','Pupa','Spermatophore'],a:'Ootheca',e:'Eggs are enclosed in a capsule called an ootheca. It protects the eggs during development.'},{q:'Which appendages are attached to the thorax of cockroach?',o:['Three pairs of legs and two pairs of wings','Two pairs of legs only','One pair of wings only','Four pairs of legs'],a:'Three pairs of legs and two pairs of wings',e:'The thorax bears three pairs of walking legs and two pairs of wings, with wings attached to the mesothorax and metathorax.'},{q:'The body cavity of cockroach is a:',o:['True coelom','Haemocoel','Pseudocoel','Gastrovascular cavity'],a:'Haemocoel',e:'Cockroach has an open circulatory system and a haemocoel in which the internal organs are bathed by haemolymph.'},{q:'Which statement best describes cockroach development?',o:['It is direct with no nymphal stage','It is paurometabolous with egg, nymph and adult stages','It includes a larva and pupa','It occurs only by budding'],a:'It is paurometabolous with egg, nymph and adult stages',e:'Cockroach shows incomplete metamorphosis. The nymph resembles the adult but lacks fully developed wings and reproductive organs.'}]\n'''

          # Remove any previous copy of the dedicated dataset, then insert one fresh dataset.
          html = re.sub(r"\n'Animal Morphology & Anatomy':\[.*?\],(?='[^']+':\[)", '', html, count=1, flags=re.S)
          marker = "\n};\nconst params=new URLSearchParams(location.search);"
          if marker not in html:
              raise SystemExit('Could not locate tests object terminator.')
          html = html.replace(marker, dataset + marker, 1)

          old = "const params=new URLSearchParams(location.search);const raw=params.get('chapter')||'What is Living';const chapter=raw==='What is Living?'?'What is Living?':raw;const data=tests[chapter]||tests['What is Living?'];document.getElementById('title').textContent=chapter+' — Chapter Test';document.getElementById('content').innerHTML=data.map((x,i)=>`<section class=\"q\"><h2>Q${i+1}. ${x.q}</h2>${x.o.map((v,j)=>`<div class=\"opt\"><strong>${String.fromCharCode(65+j)}.</strong> ${v}</div>`).join('')}<div class=\"answer\">Correct Answer: ${x.a}</div><div class=\"explain\">${x.e}</div></section>`).join('');"
          new = "const params=new URLSearchParams(location.search);const raw=params.get('chapter')||'';const chapter=raw;const type=params.get('type')||'chapter';const data=tests[chapter];const titleSuffix=type==='lesson'?' — Lesson Test':' — Chapter Test';document.getElementById('title').textContent=chapter?chapter+titleSuffix:'Zoology Test';if(!data){document.getElementById('content').innerHTML='<section class=\"q\"><h2>Test not available</h2><div class=\"explain\">No test has been published for this lesson yet.</div></section>';}else{document.getElementById('content').innerHTML=data.map((x,i)=>`<section class=\"q\"><h2>Q${i+1}. ${x.q}</h2>${x.o.map((v,j)=>`<div class=\"opt\"><strong>${String.fromCharCode(65+j)}.</strong> ${v}</div>`).join('')}<div class=\"answer\">Correct Answer: ${x.a}</div><div class=\"explain\">${x.e}</div></section>`).join('');}"
          if old not in html:
              raise SystemExit('Could not locate test rendering code.')
          html = html.replace(old, new, 1)

          path.write_text(html, encoding='utf-8')
          print('Updated Unit 2 Lesson 2: Animal Morphology & Anatomy')

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zoology-chapter-test.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Add dedicated Unit 2 Lesson 2 MCQs'
            git push
          fi
