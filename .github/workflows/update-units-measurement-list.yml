name: Update Units Measurement List
on:
  push:
    paths:
      - '.github/workflows/update-units-measurement-list.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update list link
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('physics-home.html')
          s=p.read_text(encoding='utf-8')
          old='physics-units-quiz.html?utm_source=chatgpt.com'
          old2='physics-units-quiz.html'
          new='physics-concept.html?concept=Units%20of%20Measurement'
          s=s.replace(old,new).replace(old2,new)
          s=s.replace("const quizOverride='physics-units-quiz.html';", "const quizOverride='';")
          s=s.replace("const quizOverride='physics-units-quiz.html?utm_source=chatgpt.com';", "const quizOverride='';")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          ! grep -F 'physics-units-quiz.html' physics-home.html
          grep -F 'physics-concept.html?concept=Units%20of%20Measurement' physics-home.html
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-home.html
          git diff --cached --quiet || git commit -m 'Route Units & Measurement to concept page'
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          git rm .github/workflows/update-units-measurement-list.yml || true
          git commit -m 'Remove one-time Units Measurement workflow' || true
          git push || true
