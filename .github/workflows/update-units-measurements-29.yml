name: Update Units and Measurements
on:
  push:
    paths:
      - '.github/workflows/update-units-measurements-29.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Units and Measurements chapter list
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('physics-concept.html')
          s=p.read_text(encoding='utf-8')
          concepts=[
          ('01','Units of Measurement','📏','Standard quantities and agreed measurement units used in Physics.'),
          ('02','System of Units and SI Units','🌐','SI base units, symbols and the internationally accepted system.'),
          ('03','Fundamental and Derived Units','🧩','Independent base quantities and units obtained from them.'),
          ('04','Least Count','🎯','Smallest value that a measuring instrument can reliably resolve.'),
          ('05','Significant Figures','🔢','Meaningful digits that communicate the precision of a measurement.'),
          ('06','Errors in Measurements','⚠️','Systematic, random and gross errors in physical measurements.'),
          ('07','Absolute Error','📌','Magnitude of the difference between measured and accepted values.'),
          ('08','Relative Error','📊','Absolute error expressed relative to the measured or accepted value.'),
          ('09','Percentage Error','💯','Relative error expressed as a percentage.'),
          ('10','Combination of Errors','➕','Rules for propagating errors in sums, differences, products and quotients.'),
          ('11','Accuracy and Precision','🎯','Accuracy indicates closeness to the accepted value; precision indicates repeatability.'),
          ('12','Rounding Off','✂️','Correctly retaining significant digits when reporting measured values.'),
          ('13','SI Prefixes','🔟','Prefixes such as kilo, milli, micro and nano for powers of ten.'),
          ('14','Unit Conversion','🔄','Changing units without changing the physical quantity.'),
          ('15','Dimensions of Physical Quantities','📐','Representation of quantities using fundamental dimensions M, L, T and others.'),
          ('16','Dimensional Formulae','🧮','Dimensional expressions of physical quantities such as force and energy.'),
          ('17','Dimensional Analysis','🧠','Using dimensions to test equations, derive relations and convert units.'),
          ('18','Principle of Homogeneity','⚖️','Every term added or equated in a valid physical equation has the same dimensions.'),
          ('19','Dimensional Equations','📘','Equations expressing equality between quantities through their dimensions.'),
          ('20','Limitations of Dimensional Analysis','🚧','Cases where dimensions cannot determine numerical constants or distinguish dimensionless forms.'),
          ('21','Measurement of Physical Quantities','📏','Numerical measurement requires a magnitude, unit and appropriate instrument.'),
          ('22','Vernier Calipers','🛠️','Precision instrument for measuring length, diameter and depth using a vernier scale.'),
          ('23','Screw Gauge','🔩','Instrument for measuring very small dimensions using pitch and circular scales.'),
          ('24','Zero Error','0️⃣','Instrument reading when the true input is zero and its correction.'),
          ('25','Parallax Error','👁️','Reading error caused by viewing a scale from an incorrect angle.'),
          ('26','Backlash Error','↩️','Mechanical play that can affect screw-based instrument readings.'),
          ('27','Order of Magnitude','📈','Nearest power of ten used to compare scales of physical quantities.'),
          ('28','Scientific Notation','🔬','Compact representation of very large or very small measured values.'),
          ('29','Conversion of Units Using Dimensions','🚀','Systematic conversion between unit systems using dimensional relations.')]
          esc=lambda x:x.replace('&','&amp;').replace('<','&lt;').replace('>','&gt;').replace('"','&quot;')
          items=''.join(f'<a class="um29" href="physics-concept.html?concept={__import__("urllib.parse").parse.quote(name)}"><span class="um29-icon">{icon}</span><span class="um29-body"><b>Concept {num} • {esc(name)}</b><small>{esc(desc)}</small></span><span class="um29-go">›</span></a>' for num,name,icon,desc in concepts)
          css='''<style id="units-measurements-29-css">.um29-wrap{margin-top:14px}.um29-head{background:linear-gradient(135deg,#123b70,#1677ff);color:#fff;border-radius:22px;padding:20px;box-shadow:0 6px 0 #0d4e94,0 14px 25px rgba(18,59,112,.15)}.um29-head h2{margin:0;font-size:24px}.um29-head p{margin:6px 0 0;font-size:12px;line-height:1.5}.um29-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.um29{display:grid;grid-template-columns:48px 1fr 34px;gap:10px;align-items:center;background:#fff;border:2px solid #d7e5f2;border-radius:17px;padding:10px;text-decoration:none;box-shadow:0 5px 0 #c2d7ea,0 9px 18px rgba(18,59,112,.07);transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}.um29:hover{transform:translateY(-3px);border-color:#8ebced;box-shadow:0 8px 0 #aecbe4,0 14px 22px rgba(18,59,112,.13)}.um29:active{transform:translateY(3px);box-shadow:0 2px 0 #aecbe4}.um29-icon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#e8f3ff);border:2px solid #c5ddf3;box-shadow:0 4px 0 #a8c7e2;font-size:26px}.um29-body{min-width:0}.um29-body b{display:block;color:#123b70;font-size:12px;line-height:1.25}.um29-body small{display:block;color:#667085;font-size:9px;line-height:1.4;margin-top:4px}.um29-go{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#1677ff;color:#fff;font-size:24px;font-weight:950;box-shadow:0 3px 0 #0d5bbf}@media(max-width:700px){.um29-grid{grid-template-columns:1fr}.um29-head{padding:17px}.um29-head h2{font-size:20px}.um29{grid-template-columns:42px 1fr 30px}.um29-icon{width:42px;height:42px;font-size:23px}.um29-body b{font-size:11px}.um29-body small{font-size:8px}.um29-go{width:30px;height:30px;font-size:21px}}</style>'''
          script='''<script id="units-measurements-29-script">(function(){const c=new URLSearchParams(location.search).get('concept')||'';if(c.trim().toLowerCase()!=='units of measurement')return;const content=document.getElementById('content');if(!content)return;document.title='SkillUp | Units and Measurements — SkillUp Physics';const intro=document.getElementById('intro');if(intro)intro.textContent='Master Units and Measurements through 29 equal-level concepts. Every item is a concept—learn, practise and progress.';const old=content.querySelector('.um-expanded');if(old)old.remove();content.innerHTML=''' + repr('<section class="um29-wrap"><div class="um29-head"><h2>📚 Units and Measurements</h2><p>29 important NEET Physics concepts • All are equal-level concepts</p></div><div class="um29-grid">'+items+'</div></section>') + ''';const p=document.getElementById('practice');if(p)p.style.display='none';})();</script>'''
          s=re.sub(r'<style id="units-measurements-29-css">.*?</style>','',s,flags=re.S)
          s=re.sub(r'<script id="units-measurements-29-script">.*?</script>','',s,flags=re.S)
          marker='<!-- UNITS MEASUREMENTS 29 -->'
          block=marker+css+script
          s=s.replace('</body>',block+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics-concept.html
          git diff --cached --quiet || git commit -m 'Update Units and Measurements to 29 concepts'
          git push
          git rm -f .github/workflows/update-units-measurements-29.yml || true
          git diff --cached --quiet || git commit -m 'Remove one-time Units and Measurements workflow'
          git push || true
