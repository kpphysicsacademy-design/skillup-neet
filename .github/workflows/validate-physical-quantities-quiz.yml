name: Validate Physical Quantities quiz persistence
on:
  pull_request:
    paths:
      - 'physics-physical-quantities-practice.html'
      - '.github/workflows/validate-physical-quantities-quiz.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate inline JavaScript and persistence wiring
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const assert=require('node:assert/strict');
          const html=fs.readFileSync('physics-physical-quantities-practice.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m=>m[1]).filter(Boolean);
          assert(scripts.length>=2,'Expected quiz and progress scripts');
          for(const script of scripts)new vm.Script(script);
          assert.match(html,/storageKey='skillup-physical-quantities-quiz-v1:'\+uid/);
          assert.match(html,/function persist\(\)/);
          assert.match(html,/if\(completed\)finish\(false\);else render\(\);/);
          assert.match(html,/const uid=session\.user&&session\.user\.uid/);
          assert.match(html,/completed=true;if\(save\)persist\(\)/);
          assert.match(html,/id="syncStatus"/);
          assert.match(html,/Saved to cloud/);
          assert.match(html,/Saved offline/);
          assert.match(html,/user_id:quizUid/);
          assert.match(html,/cloudRef=db\.collection\('skillup_progress'\)/);
          console.log('Quiz JavaScript syntax and persistence wiring checks passed');
          NODE
