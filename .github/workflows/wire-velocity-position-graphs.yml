name: Wire Velocity-Time and Position-Time Graphs Quiz

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skillup-main-writer
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire combined graph question bank
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('question-bank.html')
          s = p.read_text(encoding='utf-8')
          script = '<script src="velocity-time-and-position-time-graphs-question-bank.js"></script>'
          anchor = '<script src="position-time-graph-question-bank.js"></script>'
          if script not in s:
              if anchor not in s:
                  raise SystemExit('position-time graph script anchor not found; no file changed')
              s = s.replace(anchor, anchor + script, 1)
          route = "if(subject==='physics'&&n==='velocity-time-and-position-time-graphs'&&directBank('velocity time and position time graphs','Velocity-Time and Position-Time Graphs — Physics','Velocity-Time and Position-Time Graphs'))return;"
          route_anchor = "if(subject==='physics'&&n==='position-time-graph'&&directBank('position time graph','Position-Time Graph — Physics','Position-Time Graph'))return;"
          if route not in s:
              if route_anchor not in s:
                  raise SystemExit('position-time graph route anchor not found; no file changed')
              s = s.replace(route_anchor, route_anchor + route, 1)
          s = s.replace('20260911-uam-route-fix', '20261110-velocity-position-graphs-fix', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify wiring and MCQ bank
        shell: bash
        run: |
          test -f velocity-time-and-position-time-graphs-question-bank.js
          grep -q 'velocity-time-and-position-time-graphs-question-bank.js' question-bank.html
          grep -q "velocity-time-and-position-time-graphs" question-bank.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('velocity-time-and-position-time-graphs-question-bank.js').read_text(encoding='utf-8')
          count = len(re.findall(r"\{\s*(?:q|['\"]q['\"])\s*:\s*['\"]", source))
          print('Graph MCQ count:', count)
          if count != 30:
              raise SystemExit(f'Expected 30 MCQs, found {count}')
          PY

      - name: Commit and safely push wiring change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add question-bank.html
          if git diff --cached --quiet; then
            echo 'question-bank.html is already wired; nothing to commit.'
            exit 0
          fi
          git commit -m 'Wire Velocity-Time and Position-Time Graphs quiz'
          git pull --rebase origin main
          git push origin HEAD:main
