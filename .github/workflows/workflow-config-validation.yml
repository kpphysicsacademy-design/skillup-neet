name: Validate Changed GitHub Actions Workflows

on:
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate-workflow-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history for PR diff
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse changed workflow files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml
          import os

          base = 'origin/' + os.environ['BASE_REF']
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', base + '...HEAD'], text=True
          ).splitlines()
          legacy_scripts = {
              'fix-si-base-units-now.yml',
              'update-dimensions-quiz.yml',
              'fix-units-measurement-quiz.yml',
              'update-unit-conversion-quiz.yml',
              'update-si-base-units-neet.yml',
          }
          files = [Path(p) for p in changed
                   if p.startswith('.github/workflows/') and p.endswith('.yml')
                   and Path(p).name not in legacy_scripts]
          if not files:
              raise SystemExit('No non-legacy workflow YAML files were found')

          for path in files:
              with path.open(encoding='utf-8') as handle:
                  data = yaml.safe_load(handle)
              if not isinstance(data, dict) or 'jobs' not in data:
                  raise SystemExit(f'{path}: expected a workflow mapping with jobs')
              if 'on' not in data and True not in data:
                  raise SystemExit(f'{path}: missing workflow trigger declaration')
              print(f'PASS {path}')

          print(f'Validated {len(files)} changed workflow files.')
          print('Legacy one-off scripts are intentionally excluded pending separate script repair.')
          PY

      - name: Enforce one canonical Pages artifact upload
        run: |
          test "$(grep -c 'upload-pages-artifact' .github/workflows/deploy.yml)" -eq 1
          ! grep -q 'upload-pages-artifact' .github/workflows/deploy-accuracy-precision.yml
          ! grep -q 'upload-pages-artifact' .github/workflows/deploy-scalars-vectors.yml
