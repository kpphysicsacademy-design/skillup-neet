name: Zoology live loader qualification
on:
  pull_request:
    paths:
      - 'zoology-home.html'
      - 'zoology-mcq.html'
      - 'shared-nav.js'
      - 'zoology-topic-cheat-sheet.html'
      - 'question-banks/**'
      - 'docs/zoology-cheat-sheet-coverage.json'
      - 'tests/zoology-live-loader.cjs'
      - '.github/workflows/zoology-live-loader.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node --check tests/zoology-live-loader.cjs
      - name: Install Chromium and dependencies
        run: |
          # Use only Ubuntu repositories for browser system dependencies.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -name '*.list' -o -name '*.sources' \) -exec grep -l 'packages.microsoft.com/ubuntu/24.04/prod' {} + | while IFS= read -r source; do
            sudo mv "$source" "$source.disabled"
          done
          npx playwright install --with-deps chromium
      - run: node tests/zoology-live-loader.cjs
