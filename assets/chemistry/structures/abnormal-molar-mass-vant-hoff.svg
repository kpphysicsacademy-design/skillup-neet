<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340"><rect width="100%" height="100%" fill="white"/><text x="360" y="30" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Abnormal Molar Mass and van't Hoff Factor</text><text x="360" y="100" text-anchor="middle" font-family="Arial" font-size="24">i = observed colligative effect / ideal effect</text><text x="360" y="155" text-anchor="middle" font-family="Arial" font-size="22">Mₐₚₚ = M / i</text><text x="360" y="220" text-anchor="middle" font-family="Arial" font-size="18">dissociation: i &gt; 1 → apparent M decreases</text><text x="360" y="260" text-anchor="middle" font-family="Arial" font-size="18">association: i &lt; 1 → apparent M increases</text></svg>