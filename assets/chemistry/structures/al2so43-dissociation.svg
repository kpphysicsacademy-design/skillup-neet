<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320"><rect width="100%" height="100%" fill="white"/><text x="360" y="30" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Al₂(SO₄)₃ Complete Dissociation</text><text x="360" y="100" text-anchor="middle" font-family="Arial" font-size="23">Al₂(SO₄)₃ → 2Al³⁺ + 3SO₄²⁻</text><text x="360" y="170" text-anchor="middle" font-family="Arial" font-size="20">2 + 3 = 5 ions</text><text x="360" y="225" text-anchor="middle" font-family="Arial" font-size="18">ideal van't Hoff factor: i = 5</text></svg>