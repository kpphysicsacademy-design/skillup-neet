<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330"><rect width="100%" height="100%" fill="white"/><text x="360" y="30" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Atomization vs Ionization</text><rect x="70" y="80" width="270" height="170" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><rect x="380" y="80" width="270" height="170" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="205" y="125" text-anchor="middle" font-family="Arial" font-size="20">Atomization</text><text x="205" y="165" text-anchor="middle" font-family="Arial" font-size="17">neutral gaseous atoms</text><text x="205" y="205" text-anchor="middle" font-family="Arial" font-size="17">X → X(g)</text><text x="515" y="125" text-anchor="middle" font-family="Arial" font-size="20">Ionization</text><text x="515" y="165" text-anchor="middle" font-family="Arial" font-size="17">electron removed</text><text x="515" y="205" text-anchor="middle" font-family="Arial" font-size="17">X(g) → X⁺(g) + e⁻</text></svg>