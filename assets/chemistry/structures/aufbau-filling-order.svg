<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360"><rect width="100%" height="100%" fill="white"/><text x="410" y="32" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Aufbau Filling Order</text><text x="410" y="95" text-anchor="middle" font-family="Arial" font-size="22">1s → 2s → 2p → 3s → 3p → 4s</text><text x="410" y="145" text-anchor="middle" font-family="Arial" font-size="22">→ 3d → 4p → 5s → 4d → 5p → 6s</text><text x="410" y="215" text-anchor="middle" font-family="Arial" font-size="19">Lower-energy orbitals fill before higher-energy orbitals</text><text x="410" y="265" text-anchor="middle" font-family="Arial" font-size="19">4s fills before 3d in the usual Aufbau sequence</text></svg>