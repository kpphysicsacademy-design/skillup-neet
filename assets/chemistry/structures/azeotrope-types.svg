<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360"><rect width="100%" height="100%" fill="white"/><text x="400" y="32" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Azeotrope Types</text><text x="400" y="100" text-anchor="middle" font-family="Arial" font-size="23">Minimum boiling → positive deviation</text><text x="400" y="150" text-anchor="middle" font-family="Arial" font-size="23">Maximum boiling → negative deviation</text><text x="400" y="215" text-anchor="middle" font-family="Arial" font-size="20">Minimum: higher vapour pressure, lower boiling point</text><text x="400" y="260" text-anchor="middle" font-family="Arial" font-size="20">Maximum: lower vapour pressure, higher boiling point</text></svg>