<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420"><rect width="700" height="420" fill="white"/><text x="350" y="35" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700">Hydrogen-like species: Bohr scaling</text><g font-family="Arial" font-size="24"><text x="350" y="105" text-anchor="middle">rₙ = a₀ n² / Z</text><text x="350" y="170" text-anchor="middle">Eₙ = −13.6 Z² / n² eV</text></g><g stroke="#333" stroke-width="3" fill="none"><circle cx="190" cy="300" r="55"/><circle cx="190" cy="300" r="95"/><circle cx="510" cy="300" r="55"/><circle cx="510" cy="300" r="150"/></g><text x="190" y="390" text-anchor="middle" font-family="Arial" font-size="20">higher Z → smaller r</text><text x="510" y="390" text-anchor="middle" font-family="Arial" font-size="20">higher n → larger r</text></svg>