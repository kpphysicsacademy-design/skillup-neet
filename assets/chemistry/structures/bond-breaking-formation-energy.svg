<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340"><rect width="100%" height="100%" fill="white"/><text x="360" y="30" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Bond Breaking vs Bond Formation</text><rect x="80" y="80" width="250" height="150" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><rect x="390" y="80" width="250" height="150" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="205" y="145" text-anchor="middle" font-family="Arial" font-size="20">BREAK BONDS</text><text x="205" y="180" text-anchor="middle" font-family="Arial" font-size="18">Energy absorbed ↑</text><text x="515" y="145" text-anchor="middle" font-family="Arial" font-size="20">FORM BONDS</text><text x="515" y="180" text-anchor="middle" font-family="Arial" font-size="18">Energy released ↓</text><text x="360" y="285" text-anchor="middle" font-family="Arial" font-size="17">ΔH ≈ ΣE(bonds broken) − ΣE(bonds formed)</text></svg>