<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340"><rect width="100%" height="100%" fill="white"/><text x="360" y="30" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Successive Bond Dissociation</text><text x="130" y="100" font-family="Arial" font-size="20">A–B–C</text><text x="270" y="100" font-family="Arial" font-size="20">→</text><text x="390" y="100" font-family="Arial" font-size="20">A + B–C</text><text x="530" y="100" font-family="Arial" font-size="20">→</text><text x="640" y="100" font-family="Arial" font-size="20">A + B + C</text><g font-family="Arial" font-size="17"><text x="360" y="180" text-anchor="middle">first cleavage changes the electronic environment</text><text x="360" y="225" text-anchor="middle">later bond dissociation enthalpies can therefore differ</text><text x="360" y="275" text-anchor="middle">same molecule ≠ identical successive bond energies</text></g></svg>