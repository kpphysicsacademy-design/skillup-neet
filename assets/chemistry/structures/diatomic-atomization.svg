<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320"><rect width="100%" height="100%" fill="white"/><text x="360" y="30" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Diatomic Element Atomization</text><text x="360" y="105" text-anchor="middle" font-family="Arial" font-size="23">½ X₂(g) → X(g)</text><text x="360" y="165" text-anchor="middle" font-family="Arial" font-size="18">one mole of X atoms requires half a mole of X–X bonds to dissociate</text><text x="360" y="225" text-anchor="middle" font-family="Arial" font-size="18">ΔH°atomization = ½ D(X–X)</text></svg>