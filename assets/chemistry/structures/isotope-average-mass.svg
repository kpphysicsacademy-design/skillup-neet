<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300"><rect width="100%" height="100%" fill="white"/><text x="380" y="32" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Average Atomic Mass</text><text x="380" y="105" text-anchor="middle" font-family="Arial" font-size="23">Average mass = Σ(isotope mass × fractional abundance)</text><text x="380" y="175" text-anchor="middle" font-family="Arial" font-size="20">Example: natural chlorine ≈ 35.5 u</text></svg>