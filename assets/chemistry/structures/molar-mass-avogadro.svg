<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330"><rect width="100%" height="100%" fill="white"/><text x="380" y="32" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Molar Mass and Avogadro Number</text><text x="380" y="105" text-anchor="middle" font-family="Arial" font-size="23">1 mol = 6.022 × 10²³ entities</text><text x="380" y="165" text-anchor="middle" font-family="Arial" font-size="22">molar mass = mass of 1 mol</text><text x="380" y="225" text-anchor="middle" font-family="Arial" font-size="20">mass of one entity = molar mass / Nₐ</text></svg>