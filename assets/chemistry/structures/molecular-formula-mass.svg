<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340"><rect width="100%" height="100%" fill="white"/><text x="380" y="32" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Molecular and Formula Mass</text><text x="380" y="100" text-anchor="middle" font-family="Arial" font-size="24">H₂O = 2(1) + 16 = 18 u</text><text x="380" y="155" text-anchor="middle" font-family="Arial" font-size="24">NaCl = 23 + 35.5 = 58.5 u</text><text x="380" y="225" text-anchor="middle" font-family="Arial" font-size="19">Molecular mass → discrete molecules</text><text x="380" y="265" text-anchor="middle" font-family="Arial" font-size="19">Formula mass → ionic compounds</text></svg>