<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330"><rect width="100%" height="100%" fill="white"/><text x="410" y="32" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">(n + l) Rule</text><text x="410" y="105" text-anchor="middle" font-family="Arial" font-size="22">Lower (n + l) → lower energy → fills first</text><text x="410" y="165" text-anchor="middle" font-family="Arial" font-size="21">If (n + l) is equal, lower n fills first</text><text x="410" y="235" text-anchor="middle" font-family="Arial" font-size="20">4s: 4 + 0 = 4   |   3d: 3 + 2 = 5</text></svg>