<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320"><rect width="100%" height="100%" fill="white"/><text x="410" y="32" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Subshell Electron Capacity</text><text x="410" y="105" text-anchor="middle" font-family="Arial" font-size="24">s → 1 orbital → 2 e⁻</text><text x="410" y="160" text-anchor="middle" font-family="Arial" font-size="24">p → 3 orbitals → 6 e⁻</text><text x="410" y="215" text-anchor="middle" font-family="Arial" font-size="24">d → 5 orbitals → 10 e⁻</text><text x="410" y="270" text-anchor="middle" font-family="Arial" font-size="24">f → 7 orbitals → 14 e⁻</text></svg>