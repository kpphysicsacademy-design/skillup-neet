<style>*{box-sizing:border-box}body{margin:0;background:#f5faf3;color:#173b2a;font-family:system-ui,Arial,sans-serif}.wrap{max-width:620px;margin:10vh auto;padding:20px}.card{background:#fff;border:1px solid #dce8d8;border-radius:18px;padding:22px;box-shadow:0 8px 24px #17452a10}a{display:inline-block;margin:6px 8px 0 0;padding:11px 14px;border-radius:10px;background:#58cc02;color:#fff;font-weight:800;text-decoration:none}.muted{color:#667085;font-size:13px;line-height:1.5}</style>

<body><main class="wrap"><section class="card"><h1>Opening your Biology quiz…</h1><p class="muted" id="status">Finding the best matching SkillUp question path.</p><p><a href="botany-mcq.html">Open Botany Quiz</a><a href="zoology-chapter-test.html">Open Zoology Quiz</a><a href="biology-home.html">Back to Biology Path</a></p></section></main>
<script>
(function(){
'use strict';
var p=new URLSearchParams(location.search);
var concept=(p.get('concept')||p.get('topic')||'').trim();
var explicit=(p.get('subject')||'').toLowerCase();
var animal=/(human|animal|zoolog|frog|respirat|circulat|excret|kidney|neuron|nervous|endocrine|hormone|locomotion|muscle|blood|heart|reproduction in humans|spermat|oogenesis|menstrual|pregnan|immun|disease|pathogen|malaria|pneumonia|typhoid|ascar|amoeb|hiv|aids|animal tissue|chordate|non-chordate|arthropod|annelid|mammal|amphib|reptile|aves|fish|digestive system|breathing|urine|sensory)/i.test(concept);
var plant=/(plant|botany|root|stem|leaf|flower|fruit|seed|photosynth|transpiration|xylem|phloem|bryophy|pteridophy|gymnosperm|angiosperm|algae|fungi|monera|protista|plant tissue|pollination|pollen|calvin|c3 pathway|c4 pathway|plant growth|auxin|gibberellin|cytokinin|ethylene|abscisic|malvaceae|leguminosae|gramineae|cruciferae|compositae)/i.test(concept);
var dest;
if(explicit==='zoology'||animal)dest='zoology-chapter-test.html?chapter='+encodeURIComponent(concept||'Biology');
else dest='botany-mcq.html?concept='+encodeURIComponent(concept||'What Is Living?');
document.getElementById('status').textContent=concept?'Loading quiz for “'+concept+'”…':'No concept was specified. Opening the Biology practice path.';
location.replace(dest);
})();
</script></body></html>
