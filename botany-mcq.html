<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Botany Concept Quiz</title>
<style>:root{--g:#58cc02;--dark:#17452a;--bg:#f5faf3;--muted:#667085}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#263238}.top{background:#fff;border-bottom:1px solid #dce8d8;position:sticky;top:0;z-index:5}.nav{max-width:850px;margin:auto;height:58px;padding:0 14px;display:flex;align-items:center;gap:10px}.back{font-size:22px;text-decoration:none}.brand{font-weight:950;color:var(--dark)}.brand small{display:block;font-size:8px;color:#64806b;letter-spacing:1px}.wrap{max-width:850px;margin:auto;padding:18px 12px 50px}.hero,.quiz,.result,.notice{background:#fff;border:1px solid #dce8d8;border-radius:20px;padding:18px;box-shadow:0 7px 22px rgba(23,69,42,.07)}.hero h1{margin:4px 0;color:var(--dark);font-size:clamp(25px,6vw,38px)}.hero p{margin:5px 0;color:var(--muted);font-size:12px}.pill{display:inline-block;background:#eaf8e6;color:#318600;border-radius:99px;padding:5px 9px;font-size:9px;font-weight:900}.progress{height:9px;background:#e7efe5;border-radius:99px;margin:14px 0;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--g);transition:.2s}.meta{display:flex;justify-content:space-between;font-size:10px;font-weight:900;color:var(--muted)}.q{font-size:19px;font-weight:900;line-height:1.4;color:var(--dark);margin:16px 0}.options{display:grid;gap:9px}.opt{border:2px solid #dce8d8;background:#fff;border-radius:14px;padding:13px;text-align:left;font-weight:800;cursor:pointer;font-size:13px}.opt:hover{border-color:#9ed98a}.opt.correct{border-color:#2e9e00;background:#eaf8e6}.opt.wrong{border-color:#d64545;background:#fff0f0}.explain{margin-top:13px;padding:12px;border-radius:12px;background:#f7fbf5;color:#526b57;font-size:11px;line-height:1.5;display:none}.next,.back-btn{width:100%;margin-top:14px;border:0;border-radius:14px;background:var(--g);color:#fff;padding:13px;font-weight:950;cursor:pointer;box-shadow:0 4px 0 #46a302}.next:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center;display:none}.score{font-size:44px;font-weight:950;color:var(--g)}.restart{border:0;border-radius:13px;background:var(--g);color:#fff;padding:12px 20px;font-weight:950}.notice{text-align:center;color:var(--muted);line-height:1.6}.notice h2{color:var(--dark);margin-top:0}</style></head>
<body><header class="top"><nav class="nav"><a class="back" href="botany-home.html">‹</a><div class="brand">SkillUp<small>BOTANY • ORIGINAL PRACTICE</small></div></nav></header>
<main class="wrap"><section class="hero"><span class="pill">🌿 BOTANY • CONCEPT QUIZ</span><h1 id="title">Botany Concept Quiz</h1><p id="subtitle">15 original practice questions with explanations.</p></section>
<section id="quiz" class="quiz" style="margin-top:14px"><div class="meta"><span id="counter">Question 1 of 15</span><span id="score">Score: 0</span></div><div class="progress"><i id="bar"></i></div><div id="question" class="q"></div><div id="options" class="options"></div><div id="explain" class="explain"></div><button id="next" class="next" disabled>Check answer</button></section>
<section id="notice" class="notice" style="margin-top:14px;display:none"><h2>Quiz not available yet</h2><p id="noticeText"></p><a class="back-btn" href="botany-home.html" style="display:block;text-decoration:none">Back to Botany Path</a></section>
<section id="result" class="result" style="margin-top:14px"><div>QUIZ COMPLETE 🎉</div><div id="final" class="score"></div><p id="message"></p><button class="restart" onclick="location.reload()">Try Again</button></section></main>
<script src="what-is-living-question-bank.js"></script><script src="biodiversity-question-bank.js"></script><script src="need-for-classification-question-bank.js"></script><script src="taxonomy-systematics-question-bank.js"></script><script src="species-concept-question-bank.js"></script><script src="taxonomic-hierarchy-question-bank.js"></script><script src="binomial-nomenclature-question-bank.js"></script><script src="taxonomical-aids-question-bank.js"></script><script src="herbarium-question-bank.js"></script><script src="botanical-gardens-question-bank.js"></script><script src="keys-for-identification-question-bank.js"></script>
<script>
(function(){'use strict';const params=new URLSearchParams(location.search),requested=(params.get('concept')||'What Is Living?').trim(),key=requested.toLowerCase();const banks={'what is living?':window.skillUpWhatIsLivingQuestions,'biodiversity':window.skillUpBiodiversityQuestions,'need for classification':window.skillUpNeedForClassificationQuestions,'taxonomy and systematics':window.skillUpTaxonomySystematicsQuestions,'species concept':window.skillUpSpeciesConceptQuestions,'taxonomic hierarchy':window.skillUpTaxonomicHierarchyQuestions,'binomial nomenclature':window.skillUpBinomialNomenclatureQuestions,'taxonomical aids':window.skillUpTaxonomicalAidsQuestions,'herbarium':window.skillUpHerbariumQuestions,'botanical gardens':window.skillUpBotanicalGardensQuestions,'keys for identification':window.skillUpKeysForIdentificationQuestions};const questionsSource=banks[key],title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),quiz=document.getElementById('quiz'),notice=document.getElementById('notice'),noticeText=document.getElementById('noticeText');title.textContent=requested;document.title='SkillUp | '+requested+' Quiz';if(!questionsSource||!questionsSource.length){quiz.style.display='none';notice.style.display='block';subtitle.textContent='Original concept quiz not added yet.';noticeText.textContent='There is currently no original quiz for “'+requested+'”. The Chapter 1 quiz is not reused for other concepts.';return;}const N=Math.min(15,questionsSource.length);let questions=questionsSource.slice(0,N),i=0,score=0,answered=false;subtitle.textContent=N+' original practice questions with explanations.';const qEl=document.getElementById('question'),oEl=document.getElementById('options'),eEl=document.getElementById('explain'),next=document.getElementById('next'),counter=document.getElementById('counter'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar');function render(){answered=false;next.disabled=true;next.textContent='Check answer';eEl.style.display='none';counter.textContent='Question '+(i+1)+' of '+N;scoreEl.textContent='Score: '+score;bar.style.width=(i/N*100)+'%';const x=questions[i];qEl.textContent=x.q;oEl.innerHTML='';x.o.forEach((v,k)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+k)+'. '+v;b.onclick=()=>choose(k,b);oEl.appendChild(b);});}function choose(k,b){if(answered)return;answered=true;const x=questions[i];[...oEl.children].forEach((el,j)=>{el.disabled=true;if(j===x.a)el.classList.add('correct')});if(k===x.a){score++;b.classList.add('correct')}else b.classList.add('wrong');eEl.textContent='💡 '+x.e;eEl.style.display='block';scoreEl.textContent='Score: '+score;next.disabled=false;next.textContent=i===N-1?'Finish':'Next question';}next.onclick=()=>{if(!answered)return;if(i<N-1){i++;render()}else finish()};function finish(){quiz.style.display='none';document.getElementById('result').style.display='block';document.getElementById('final').textContent=score+' / '+N;document.getElementById('message').textContent=score>=13?'Excellent work!':score>=10?'Strong performance. Review the missed concepts.':'Review the concept and retry the quiz.';}render();})();
</script></body></html>
