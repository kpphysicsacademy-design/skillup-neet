{q:"Imbibition is the process in which:",o:["Water is adsorbed by hydrophilic colloids causing them to swell","Solutes are pumped using ATP","Water moves only through a selectively permeable membrane","Starch is converted directly into protein"],a:0,e:"Imbibition is the adsorption of water by hydrophilic substances, often accompanied by swelling."},

{q:"Which material is a common example of an imbibant?",o:["Dry seed","Pure oil droplet","Wax-coated glass","Dry nitrogen gas"],a:0,e:"Dry seeds contain hydrophilic colloidal materials that can adsorb water and swell."},

{q:"A major physical consequence of imbibition is:",o:["Swelling of the imbibant","Immediate cell division","Permanent loss of water","Breakdown of all cell walls"],a:0,e:"Water adsorption commonly increases the volume of the hydrophilic material."},
{q:"Which pair is most directly associated with imbibition?",o:["Dry seed and water","Chloroplast and carbon dioxide only","Ribosome and mRNA only","Xylem and mineral salts only"],a:0,e:"Dry seeds are classic biological examples of materials that absorb water by imbibition."},

{q:"Imbibition pressure can become large enough to:",o:["Split or move surrounding rigid structures in suitable experiments","Stop all molecular motion","Destroy DNA specifically","Convert cellulose into protein"],a:0,e:"The swelling force generated during imbibition can be considerable and can exert mechanical pressure."},

{q:"The liquid being taken up during imbibition is called the:",o:["Imbibate","Imbibant","Solute potential","Protoplast"],a:0,e:"The absorbed liquid is referred to as the imbibate, while the absorbing material is the imbibant."},
{q:"Which property is essential for a material to imbibe water effectively?",o:["Hydrophilicity","Complete hydrophobicity","Absence of polar groups","Inability to interact with water"],a:0,e:"Hydrophilic surfaces have chemical groups that interact strongly with water and support adsorption."},
{q:"Why can imbibition occur in dead plant material?",o:["It depends on physical adsorption rather than cellular metabolism","It requires living mitochondria","It requires cell division","It depends on photosynthetic ATP"],a:0,e:"Imbibition is fundamentally a physical process and does not require a living cell or ATP."},
{q:"Which observation most directly demonstrates imbibition?",o:["A dry seed increases in size after absorbing water","A leaf closes its stomata","A chromosome duplicates","A ribosome synthesizes protein"],a:0,e:"Swelling of a dry hydrophilic material after water adsorption is a direct indication of imbibition."},

};const questionsSource=banks[key],title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),quiz=document.getElementById('quiz'),notice=document.getElementById('notice'),noticeText=document.getElementById('noticeText');title.textContent=requested;document.title='SkillUp | '+requested+' Quiz';if(!questionsSource||!questionsSource.length){quiz.style.display='none';notice.style.display='block';subtitle.textContent='Original concept quiz not added yet.';noticeText.textContent='There is currently no original quiz for “'+requested+'”. The Chapter 1 quiz is not reused for other concepts.';return;}const N=Math.min(30,questionsSource.length);let questions=questionsSource.slice(0,N),i=0,score=0,answered=false;subtitle.textContent=N+' original practice questions with explanations.';const qEl=document.getElementById('question'),oEl=document.getElementById('options'),eEl=document.getElementById('explain'),next=document.getElementById('next'),counter=document.getElementById('counter'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar');function render(){answered=false;next.disabled=true;next.textContent='Check answer';eEl.style.display='none';counter.textContent='Question '+(i+1)+' of '+N;scoreEl.textContent='Score: '+score;bar.style.width=(i/N*100)+'%';const x=questions[i];qEl.textContent=x.q;oEl.innerHTML='';const optionOrder=x.o.map((v,k)=>({v,k}));for(let j=optionOrder.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[optionOrder[j],optionOrder[r]]=[optionOrder[r],optionOrder[j]];}optionOrder.forEach((item,k)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+k)+'. '+item.v;b.dataset.originalIndex=String(item.k);b.onclick=()=>choose(item.k,b);oEl.appendChild(b);});}function choose(k,b){if(answered)return;answered=true;const x=questions[i];[...oEl.children].forEach((el,j)=>{el.disabled=true;if(Number(el.dataset.originalIndex)===x.a)el.classList.add('correct')});if(k===x.a
