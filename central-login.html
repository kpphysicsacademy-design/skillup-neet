<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Central Login</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#182033}.wrap{max-width:460px;margin:auto;padding:40px 18px}.brand{text-align:center;margin-bottom:22px}.brand b{font-size:30px}.brand small{display:block;color:#6d43ff;font-weight:800;letter-spacing:2px}.card{background:#fff;border:1px solid #e1e7f0;border-radius:22px;padding:28px;box-shadow:0 12px 35px #17203312}h1{margin:0 0 8px}p{color:#667085}.field{margin-top:16px}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}input{width:100%;padding:13px;border:1px solid #d5dce7;border-radius:11px;font:inherit;box-sizing:border-box}.btn{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:#315efb;color:white;font-weight:800;font-size:16px;cursor:pointer}.btn:disabled{opacity:.6}.msg{display:none;margin-top:15px;padding:13px;border-radius:11px;font-weight:700}.ok{display:block;background:#ecfdf3;color:#067647}.bad{display:block;background:#fff1f2;color:#b42318}.forgot{text-align:right;margin-top:9px}.forgot a{color:#315efb;font-size:13px;font-weight:700;text-decoration:none}</style></head><body><main class="wrap"><header class="brand"><b>SkillUp</b><small>NEET PRACTICE</small></header><section class="card"><h1>Sign in</h1><p>Sign in to continue to your SkillUp NEET home page.</p><form id="login"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><div class="forgot"><a href="#" id="forgot">Forgot password?</a></div><button class="btn" id="submit">Sign in to SkillUp</button><div id="msg" class="msg" role="status"></div></form></section></main><script src="central-config.js?v=20260909fb3"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="central-auth.js?v=20260910authfix2"></script><script>(async()=>{const q=new URLSearchParams(location.search),next=q.get('next')||'index.html',form=document.getElementById('login'),msg=document.getElementById('msg'),btn=document.getElementById('submit'),emailInput=document.getElementById('email'),passwordInput=document.getElementById('password');function show(t,ok){msg.textContent=t;msg.className='msg '+(ok?'ok':'bad')}if(!window.SkillUpAuth.configured){show('Firebase authentication is not configured correctly yet.',false);btn.disabled=true;return}const existing=await window.SkillUpAuth.getSession();if(existing){location.replace(next);return}form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;btn.disabled=true;try{await window.SkillUpAuth.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);await window.SkillUpAuth.auth.signInWithEmailAndPassword(emailInput.value.trim().toLowerCase(),passwordInput.value);const session=await window.SkillUpAuth.getSession();if(!session)throw new Error('Authentication session was not restored. Please try again.');show('✓ Signed in. Opening SkillUp NEET…',true);setTimeout(()=>location.replace(next),500)}catch(err){const code=err&&err.code||'';if(code==='auth/invalid-credential'||code==='auth/wrong-password'||code==='auth/user-not-found'){show('Incorrect email or password. Use “Forgot password?” below to reset your password.',false)}else{show(err.message||'Unable to sign in.',false)}btn.disabled=false}});document.getElementById('forgot').addEventListener('click',async e=>{e.preventDefault();const email=emailInput.value.trim().toLowerCase();if(!email){emailInput.focus();show('Enter your email address first, then click “Forgot password?”.',false);return}try{const actionCodeSettings={url:'https://skillupedu.in/central-login.html',handleCodeInApp:false};await window.SkillUpAuth.auth.sendPasswordResetEmail(email,actionCodeSettings);show('✓ Password reset email sent. Check your inbox and spam folder.',true)}catch(err){const code=err&&err.code||'';if(code==='auth/user-not-found'){show('No SkillUp account was found for this email address.',false)}else{show(err.message||'Unable to send password reset email.',false)}}})})();</script></body></html>
