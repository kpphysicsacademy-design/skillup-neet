<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Central Login</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#182033}.wrap{max-width:460px;margin:auto;padding:40px 18px}.brand{text-align:center;margin-bottom:22px}.brand b{font-size:30px}.brand small{display:block;color:#6d43ff;font-weight:800;letter-spacing:2px}.card{background:#fff;border:1px solid #e1e7f0;border-radius:22px;padding:28px;box-shadow:0 12px 35px #17203312}h1{margin:0 0 8px}p{color:#667085}.field{margin-top:16px}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}input{width:100%;padding:13px;border:1px solid #d5dce7;border-radius:11px;font:inherit;box-sizing:border-box}.btn{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:#315efb;color:white;font-weight:800;font-size:16px;cursor:pointer}.btn:disabled{opacity:.6}.msg{display:none;margin-top:15px;padding:13px;border-radius:11px;font-weight:700}.ok{display:block;background:#ecfdf3;color:#067647}.bad{display:block;background:#fff1f2;color:#b42318}.links{text-align:center;margin-top:18px}.links a{color:#315efb;font-weight:800;text-decoration:none}</style></head><body><main class="wrap"><header class="brand"><b>SkillUp</b><small>NEET PRACTICE</small></header><section class="card"><h1>Sign in</h1><p>Use your central SkillUp account to continue your practice.</p><form id="login"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" id="submit">Sign in to SkillUp</button><div id="msg" class="msg" role="status"></div></form><div class="links">New student? <a id="register" href="central-registration.html">Create your account</a></div></section></main><script src="central-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="central-auth.js"></script><script>(async()=>{const q=new URLSearchParams(location.search),next=q.get('next')||'question-bank.html',form=document.getElementById('login'),msg=document.getElementById('msg'),btn=document.getElementById('submit');document.getElementById('register').href='central-registration.html?next='+encodeURIComponent(next);function show(t,ok){msg.textContent=t;msg.className='msg '+(ok?'ok':'bad')}if(window.SkillUpAuth.configured){form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;btn.disabled=true;try{const {error}=await window.SkillUpAuth.client.auth.signInWithPassword({email:email.value.trim().toLowerCase(),password:password.value});if(error)throw error;show('✓ Signed in. Redirecting…',true);setTimeout(()=>location.href=next,500)}catch(err){show(err.message||'Unable to sign in.',false);btn.disabled=false}})}else{show('Central server authentication is not configured yet. The site is ready for the Supabase project URL and public anon key.',false);btn.disabled=true}})();</script></body></html>
