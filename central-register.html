<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<link rel="preload" as="image" href="skillup-logo-exact.webp?v=20260930logo1">
<link rel="icon" type="image/webp" href="skillup-logo-exact.webp?v=20260930logo1">
<title>SkillUp | Create account</title>
<style>
:root{--brand:#2563eb;--brand-dark:#1d4ed8;--accent:#2563eb;--text:#182033;--muted:#667085;--border:#d8dfeb;--page:#f6f9ff;--danger:#b42318;--success:#067647;--focus:0 0 0 4px rgba(37,99,235,.14)}
*{box-sizing:border-box}html{min-height:100%;background:var(--page)}
body{min-height:100vh;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 50% -10%,#e8f1ff 0,#f6f9ff 42%,#f6f9ff 100%);color:var(--text)}
button,input{font:inherit}button{cursor:pointer}.wrap{width:min(100%,520px);margin:0 auto;padding:34px 20px 28px}
.brand{text-align:center;margin:0 0 20px}.brand-logo{display:block;width:76px;height:76px;margin:0 auto 10px;border-radius:18px;object-fit:cover;box-shadow:0 10px 24px rgba(37,99,235,.2)}
.brand b{display:block;font-size:30px;line-height:1.05;letter-spacing:-.6px}.brand small{display:block;margin-top:6px;color:var(--accent);font-size:12px;font-weight:900;letter-spacing:2.2px}
.card{background:rgba(255,255,255,.98);border:1px solid #dfe7f3;border-radius:22px;padding:30px;box-shadow:0 14px 36px rgba(24,32,51,.09)}
h1{margin:0 0 8px;font-size:27px;letter-spacing:-.4px}.intro{margin:0 0 22px;color:var(--muted);line-height:1.55}
.field{margin-top:16px}label{display:block;margin:0 0 8px;font-size:13px;font-weight:800}
input{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;outline:0;background:#fff;color:var(--text);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--brand);box-shadow:var(--focus)}input[aria-invalid="true"]{border-color:#d92d20}input::placeholder{color:#98a2b3}select{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;outline:0;background:#fff;color:var(--text)}
.btn{width:100%;min-height:50px;margin-top:24px;padding:13px 18px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:850;font-size:16px;box-shadow:0 7px 16px rgba(37,99,235,.2)}
.btn:hover:not(:disabled){background:var(--brand-dark)}.btn:disabled{opacity:.68;cursor:not-allowed;box-shadow:none}
.msg{display:none;margin-top:15px;padding:12px 13px;border-radius:11px;font-size:14px;line-height:1.45;font-weight:650}.msg.ok{display:block;background:#ecfdf3;color:var(--success);border:1px solid #abefc6}.msg.bad{display:block;background:#fff1f2;color:var(--danger);border:1px solid #fecdca}
.login-link{margin:16px 0 0;text-align:center;color:var(--muted);font-size:13px}.login-link a{color:var(--brand);font-weight:800;text-decoration:none}.login-link a:hover{text-decoration:underline}
.security{margin-top:20px;padding-top:18px;border-top:1px solid #edf0f5;color:#667085;font-size:12px;line-height:1.5;text-align:center}
.footer{margin-top:18px;text-align:center;color:#98a2b3;font-size:12px}@media(max-width:520px){.wrap{padding:28px 14px 24px}.card{padding:24px 20px;border-radius:18px}h1{font-size:25px}}
</style></head>
<body><main class="wrap">
<header class="brand" aria-label="SkillUp"><img class="brand-logo" src="skillup-logo-exact.webp" alt="SkillUp logo" width="76" height="76"><b>SkillUp</b><small>MAKE EVERY CONCEPT COUNT</small></header>
<section class="card" aria-labelledby="register-title"><h1 id="register-title">Create your SkillUp account</h1>
<p class="intro">Start learning, practicing, and tracking your progress in one place.</p>
<form id="register" novalidate>
<div class="field"><label for="name">Name</label><input id="name" type="text" autocomplete="name" placeholder="Your name" required></div>
<div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
<div class="field"><label for="classLevel">Class / Level</label><select id="classLevel"><option value="">Select class / level</option><option>Class 9</option><option>Class 10</option><option>Class 11</option><option>Class 12</option><option>Dropper</option><option>College / Graduate</option><option>Other</option></select></div>
<div class="field"><label for="college">College / School</label><input id="college" type="text" autocomplete="organization" maxlength="120" placeholder="School or college name"></div>
<div class="field"><label for="target">Target</label><select id="target"><option value="">Select target</option><option>JEE</option><option>NEET</option><option>CUET</option><option>GPAT</option><option>NIPER JEE</option><option>Other competitive exam</option><option>Not decided yet</option></select></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" minlength="6" required></div>
<div class="field"><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" placeholder="Re-enter your password" required></div>
<button class="btn" id="submit" type="submit">Create account</button><div id="msg" class="msg" role="status" aria-live="polite"></div>
</form>
<p class="login-link">Already have an account? <a href="central-login.html">Sign in</a></p>
<div class="security">🔒 <strong>Secure authentication</strong><br>Your password is handled by Firebase Authentication and is not stored by SkillUp.</div>
</section><footer class="footer">© 2026 SkillUp</footer></main>
<script src="central-config.js?v=20260909fb3"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="central-auth.js?v=20260910authfix4"></script>
<script>
(async()=>{
const A=window.SkillUpAuth,form=document.getElementById('register'),msg=document.getElementById('msg'),btn=document.getElementById('submit');
const nameEl=document.getElementById('name'),emailEl=document.getElementById('email'),classEl=document.getElementById('classLevel'),collegeEl=document.getElementById('college'),targetEl=document.getElementById('target'),passEl=document.getElementById('password'),confirmEl=document.getElementById('confirm');
function show(t,ok){msg.textContent=t;msg.className='msg '+(ok?'ok':'bad')}
if(!A||!A.configured){show('Sign-up service is temporarily unavailable. Please try again later.',false);btn.disabled=true;return}
try{const s=await A.getSession();if(s){location.replace('index.html');return}}catch{}
form.addEventListener('submit',async e=>{
e.preventDefault();msg.className='msg';
const name=nameEl.value.trim(),email=emailEl.value.trim().toLowerCase(),classLevel=classEl.value,college=collegeEl.value.trim(),target=targetEl.value,password=passEl.value,confirm=confirmEl.value;
if(!name){nameEl.focus();show('Enter your name.',false);return}
if(!email||!emailEl.checkValidity()){emailEl.focus();show('Enter a valid email address.',false);return}
if(password.length<6){passEl.focus();show('Password must be at least 6 characters.',false);return}
if(password!==confirm){confirmEl.focus();show('Passwords do not match.',false);return}
btn.disabled=true;btn.textContent='Creating account…';
try{
await A.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
const cred=await A.auth.createUserWithEmailAndPassword(email,password);
try{
  await cred.user.updateProfile({displayName:name});
}catch(profileErr){}
try{
  await A.saveProfile({name:name,email:email,class_level:classLevel,college:college,target:target});
}catch(profileErr){
  // Profile creation can be completed later from the signed-in Profile page.
}
show('✓ Account created. Opening SkillUp…',true);
setTimeout(()=>location.replace('index.html'),500);
}catch(err){
const code=err&&err.code||'';
if(code==='auth/email-already-in-use')show('An account already exists for this email. Please sign in.',false);
else if(code==='auth/invalid-email')show('Enter a valid email address.',false);
else if(code==='auth/weak-password')show('Choose a stronger password.',false);
else if(code==='auth/network-request-failed')show('Network connection failed. Try again.',false);
else if(code==='auth/operation-not-allowed')show('Email/password sign-up is not enabled in Firebase Authentication.',false);
else if(code==='auth/configuration-not-found')show('Firebase Authentication is not configured for this app.',false);
else show('Unable to create your account right now. Please try again.',false);
btn.disabled=false;btn.textContent='Create account';
}
});
})();
</script></body></html>
