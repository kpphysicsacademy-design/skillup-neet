<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Central SkillUp NEET student registration"><title>SkillUp | Central Registration</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#182033}.wrap{max-width:760px;margin:auto;padding:28px 18px}.brand{text-align:center;margin:14px 0 22px}.brand b{font-size:30px}.brand small{display:block;color:#6d43ff;font-weight:800;letter-spacing:2px}.card{background:#fff;border:1px solid #e1e7f0;border-radius:22px;padding:28px;box-shadow:0 12px 35px #17203312}h1{margin:0 0 8px;font-size:28px}p{color:#667085}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{margin-top:15px}.field.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}input,select{width:100%;padding:13px;border:1px solid #d5dce7;border-radius:11px;font:inherit;background:#fff}.btn{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:#315efb;color:white;font-weight:800;font-size:16px;cursor:pointer}.btn:disabled{opacity:.6}.msg{display:none;margin-top:15px;padding:13px;border-radius:11px;font-weight:700}.ok{display:block;background:#ecfdf3;color:#067647}.bad{display:block;background:#fff1f2;color:#b42318}.note{font-size:12px;margin-top:16px}.login{margin-top:18px;text-align:center}.login a{color:#315efb;font-weight:800;text-decoration:none}@media(max-width:620px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.card{padding:21px}}</style></head><body><main class="wrap"><header class="brand"><b>SkillUp</b><small>NEET PRACTICE</small></header><section class="card"><h1>Create your SkillUp account</h1><p>One central registration for your SkillUp NEET learning experience.</p><form id="reg" novalidate><div class="grid"><div class="field"><label for="name">Full name</label><input id="name" autocomplete="name" required></div><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="mobile">Mobile number</label><input id="mobile" inputmode="tel" autocomplete="tel" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit number" required></div><div class="field"><label for="class">Class</label><select id="class" required><option value="">Select class</option><option>Class 11</option><option>Class 12</option><option>Dropper</option></select></div><div class="field"><label for="target">Target</label><select id="target" required><option value="">Select target</option><option>NEET UG</option></select></div><div class="field"><label for="year">Target year</label><select id="year" required><option value="">Select year</option><option>2027</option><option>2028</option><option>2029</option><option>2030</option></select></div><div class="field full"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></div><div class="field full"><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required></div></div><button class="btn" id="submit">Create SkillUp Account</button><div id="msg" class="msg" role="status"></div></form><p class="note" id="note">Central server authentication is ready to connect. Until a Supabase project is configured, this static release uses a browser-local profile only.</p><div class="login">Already registered? <a id="login" href="central-login.html">Sign in</a></div></section></main><script src="central-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="central-auth.js"></script><script>(async()=>{const q=new URLSearchParams(location.search),next=q.get('next')||'question-bank.html',form=document.getElementById('reg'),msg=document.getElementById('msg'),btn=document.getElementById('submit'),KEY='skillup.central.profile.v1';document.getElementById('login').href='central-login.html?next='+encodeURIComponent(next);function show(t,ok){msg.textContent=t;msg.className='msg '+(ok?'ok':'bad')}form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p!==c){show('Passwords do not match.',false);return}const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim().toLowerCase(),mobile=document.getElementById('mobile').value.trim(),studentClass=document.getElementById('class').value,target=document.getElementById('target').value,targetYear=document.getElementById('year').value;btn.disabled=true;try{if(window.SkillUpAuth.configured){const {data,error}=await window.SkillUpAuth.client.auth.signUp({email,password:p,options:{data:{full_name:name}}});if(error)throw error;if(!data.user)throw new Error('Account creation did not return a user.');if(data.session){const {error:pe}=await window.SkillUpAuth.client.from('skillup_profiles').upsert({id:data.user.id,full_name:name,mobile,student_class:studentClass,target,target_year:Number(targetYear)},{onConflict:'id'});if(pe)throw pe;show('✓ Account created. Redirecting…',true);setTimeout(()=>location.href=next,500)}else{show('✓ Account created. Check your email to verify it, then sign in.',true);btn.disabled=false}}else{const existing=JSON.parse(localStorage.getItem(KEY)||'null');if(existing&&existing.email===email)throw new Error('An account with this email already exists on this browser.');const profile={id:'SU-'+Date.now().toString(36).toUpperCase(),name,email,mobile,studentClass,target,targetYear,passwordHash:'local-only',createdAt:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(profile));sessionStorage.setItem('skillup.central.session',profile.id);show('✓ Local SkillUp profile created. Redirecting…',true);setTimeout(()=>location.href=next,700)}}catch(err){show(err.message||'Registration failed.',false);btn.disabled=false}})})();</script></body></html>
