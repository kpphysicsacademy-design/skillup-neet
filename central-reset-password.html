<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Reset Password</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#182033}.wrap{max-width:460px;margin:auto;padding:40px 18px}.brand{text-align:center;margin-bottom:22px}.brand b{font-size:30px}.brand small{display:block;color:#6d43ff;font-weight:800;letter-spacing:2px}.card{background:#fff;border:1px solid #e1e7f0;border-radius:22px;padding:28px;box-shadow:0 12px 35px #17203312}h1{margin:0 0 8px}p{color:#667085}.field{margin-top:16px}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}input{width:100%;padding:13px;border:1px solid #d5dce7;border-radius:11px;font:inherit;box-sizing:border-box}.btn{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:#315efb;color:white;font-weight:800;font-size:16px;cursor:pointer}.btn:disabled{opacity:.6}.msg{display:none;margin-top:15px;padding:13px;border-radius:11px;font-weight:700}.ok{display:block;background:#ecfdf3;color:#067647}.bad{display:block;background:#fff1f2;color:#b42318}.links{text-align:center;margin-top:18px}.links a{color:#315efb;font-weight:800;text-decoration:none}</style></head><body><main class="wrap"><header class="brand"><b>SkillUp</b><small>NEET PRACTICE</small></header><section class="card"><h1>Reset your password</h1><p id="hint">Create a new password for your SkillUp account.</p><form id="reset"><div class="field"><label for="password">New password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters"></div><div class="field"><label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn" id="submit">Set new password</button><div id="msg" class="msg" role="status"></div></form><div class="links"><a href="central-login.html">Back to SkillUp Login</a></div></section></main><script src="central-config.js?v=20260909fb3"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="central-auth.js?v=20260910pwd2"></script><script>(async()=>{const params=new URLSearchParams(location.search),mode=params.get('mode'),code=params.get('oobCode'),form=document.getElementById('reset'),msg=document.getElementById('msg'),btn=document.getElementById('submit'),password=document.getElementById('password'),confirm=document.getElementById('confirm'),hint=document.getElementById('hint');function show(t,ok){msg.textContent=t;msg.className='msg '+(ok?'ok':'bad')}if(mode!=='resetPassword'||!code){show('This password-reset link is invalid. Please request a new one from SkillUp Login.',false);btn.disabled=true;return}try{const info=await window.SkillUpAuth.auth.verifyPasswordResetCode(code);hint.textContent='Reset the password for '+info+' .';}catch(err){show('This password-reset link has expired or has already been used. Request a new reset email.',false);btn.disabled=true;return}form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;if(password.value!==confirm.value){show('Passwords do not match.',false);confirm.focus();return}btn.disabled=true;try{await window.SkillUpAuth.auth.confirmPasswordReset(code,password.value);show('✓ Password changed successfully. You can now sign in.',true);form.reset();setTimeout(()=>location.href='central-login.html',1200)}catch(err){const c=err&&err.code||'';if(c==='auth/expired-action-code'||c==='auth/invalid-action-code')show('This reset link has expired or has already been used. Request a new one.',false);else if(c==='auth/weak-password')show('Choose a stronger password with at least 8 characters.',false);else show(err.message||'Unable to reset password.',false);btn.disabled=false}})})();</script></body></html>
