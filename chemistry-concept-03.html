<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#f4f9ff;font-family:system-ui;color:#17324d}.wrap{max-width:650px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dce8f4;border-radius:22px;padding:20px;margin-bottom:12px}.n{font-size:11px;font-weight:900;color:#1677ff}.h{font-size:27px;font-weight:950}.p{font-size:15px;line-height:1.5}.q{background:#f4fbeF;padding:14px;border-radius:15px;font-weight:800}.o{display:block;width:100%;padding:13px;margin:8px 0;border:2px solid #dce8f4;border-radius:13px;background:#fff;text-align:left;font-weight:800}.ok{background:#eaffdf;border-color:#58cc02}.no{background:#fff0f0;border-color:#ff6b6b}.next{display:block;text-align:center;padding:14px;background:#58cc02;color:#fff;text-decoration:none;border-radius:14px;font-weight:900}</style></head><body><main class="wrap"><section class="card"><div class="n">DALTON ATOMIC THEORY • 3/5</div><h1 class="h">🔢 Simple whole-number ratios</h1><p class="p">Atoms combine in <b>simple whole-number ratios</b>.</p><div class="p">H₂O → H : O = 2 : 1</div></section><section class="card"><div class="q">❓ In H₂O, what is H : O?</div><button class="o" onclick="a(0)">A. 1 : 1</button><button class="o" onclick="a(1)">B. 2 : 1</button><button class="o" onclick="a(2)">C. 1 : 2</button><div id="r"></div></section></main><script>function a(i){document.querySelectorAll('.o').forEach((b,j)=>{b.disabled=true;if(j===1)b.classList.add('ok');if(j===i&&i!==1)b.classList.add('no')});document.getElementById('r').innerHTML='<p>'+(i===1?'✅ Correct!':'❌ Correct answer: 2 : 1')+'</p><a class="next" href="chemistry-concept-04.html">NEXT →</a>}</script></body></html>
