<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Chemistry | Micro Concept</title><style>:root{--b:#1677ff;--g:#58cc02;--i:#17324d;--m:#6b7b8e;--bg:#f4f9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:var(--i)}.wrap{max-width:680px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dce8f4;border-radius:22px;padding:19px;margin:10px 0;box-shadow:0 5px 16px #17324d10}.ey{font-size:10px;font-weight:950;color:var(--g)}h1{font-size:26px;margin:5px 0}.parent{font-size:12px;color:var(--m)}.pill{display:inline-block;background:#eef7ff;color:var(--b);padding:6px 9px;border-radius:10px;font-size:11px;font-weight:900;margin-top:8px}.idea{font-size:16px;line-height:1.55}.steps{display:grid;gap:8px}.step{padding:12px;border-radius:14px;background:#f7fbff}.btn{display:block;text-align:center;text-decoration:none;padding:14px;border-radius:14px;margin-top:9px;font-weight:900;background:var(--b);color:#fff}.green{background:var(--g)}.err{text-align:center}</style></head><body><main class="wrap" id="app"></main><script src="chemistry-1062-concepts-base.js"></script><script>
const p=new URLSearchParams(location.search),id=p.get("id")||"",all=window.SKILLUP_CHEMISTRY_MICROCONCEPTS||[],x=all.find(v=>v.id===id);
const labels={meaning:"What it means", "key-parts":"Key parts", "representation":"Symbols & representation","formation-process":"Formation / process",factors:"Factors & conditions",relationships:"Relations & trends",example:"Example",comparison:"Compare & contrast","common-trap":"Common trap","exam-check":"Exam check"};
if(!x){document.getElementById("app").innerHTML='<section class="card err"><h1>Concept not found</h1><p>Please return to the Chemistry path.</p><a class="btn" href="chemistry-home.html">CHEMISTRY PATH</a></section>'}
else{
const label=labels[x.microType]||x.microType;
document.title="SkillUp Chemistry | "+x.microTitle;
document.getElementById("app").innerHTML='<section class="card"><div class="ey">🧪 CHEMISTRY • MICRO CONCEPT '+x.microIndex+'/10</div><h1>'+esc(x.microTitle)+'</h1><div class="parent">Parent concept: <b>'+esc(x.parent)+'</b></div><span class="pill">'+esc(label)+'</span></section><section class="card"><div class="idea">🎯 This lesson isolates one small part of <b>'+esc(x.parent)+'</b>.</div><div class="steps"><div class="step">1️⃣ Learn the '+esc(label.toLowerCase())+'.</div><div class="step">2️⃣ See a simple example.</div><div class="step">3️⃣ Check the idea before moving on.</div></div></section><section class="card"><b>🧠 Micro-learning rule</b><p>One idea at a time. No long chapter text. No repeated concepts.</p><a class="btn green" href="chemistry-home.html">✓ BACK TO CHEMISTRY PATH</a></section>';}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
</script></body></html>
