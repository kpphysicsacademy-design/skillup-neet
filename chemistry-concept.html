<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#58cc02">
<title>SkillUp Chemistry | Micro Learning</title>
<style>
:root{--green:#58cc02;--green2:#46a900;--blue:#1677ff;--navy:#123b70;--ink:#263238;--muted:#718096;--line:#dce8f4;--bg:#f6fbff;--soft:#eef8e8;--wrong:#fff0f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
.nav{max-width:720px;height:58px;margin:auto;padding:0 14px;display:flex;align-items:center;gap:10px}
.back{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--navy);font-size:20px;cursor:pointer}
.logo{font-weight:950;color:var(--navy)}.logo small{display:block;font-size:8px;letter-spacing:1px;color:var(--muted)}
.streak{margin-left:auto;border-radius:999px;background:#fff5dc;color:#a66b00;padding:7px 10px;font-size:10px;font-weight:950}
.wrap{max-width:680px;margin:auto;padding:14px 14px 70px}
.progress{display:flex;gap:5px;margin:4px 0 16px}.dot{height:7px;flex:1;border-radius:99px;background:#dfeaf4}.dot.active{background:var(--green)}
.crumb{font-size:10px;color:var(--muted);font-weight:850;margin-bottom:8px}
.lesson{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 6px 20px rgba(18,59,112,.06)}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--soft);color:#318600;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:950}
h1{font-size:30px;line-height:1.12;color:var(--navy);margin:12px 0 7px}.parent{font-size:11px;color:var(--muted)}
.hero{margin:18px 0;padding:18px;border-radius:20px;background:#f7fbff;border:1px solid #e3edf7;text-align:center}
.atom{width:120px;height:120px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:#eaf8e6;border:10px solid #d8f1cc;font-size:55px}
.hero strong{font-size:19px;color:var(--navy)}.hero p{font-size:13px;line-height:1.5;color:var(--muted);margin:7px 0 0}
.lesson-title{font-size:17px;font-weight:950;color:var(--navy);margin:18px 0 8px}
.fact{display:flex;gap:10px;align-items:flex-start;padding:12px;margin:8px 0;background:#fff;border:1px solid var(--line);border-radius:15px}
.num{width:27px;height:27px;flex:0 0 27px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-size:11px;font-weight:950}
.fact b{font-size:13px}.fact span{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.quiz{margin-top:16px;background:#fff;border:2px solid #cfe2f6;border-radius:22px;padding:17px}
.quiz-label{font-size:10px;color:var(--blue);font-weight:950;letter-spacing:.5px}.question{font-size:15px;font-weight:900;line-height:1.4;margin:8px 0 12px}
.option{width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px;margin:5px 0;font-size:12px;font-weight:800;cursor:pointer;color:var(--ink)}
.option:hover{border-color:#8ebced}.option.correct{border-color:var(--green);background:var(--soft)}.option.wrong{border-color:#ef9b9b;background:var(--wrong)}
.feedback{display:none;margin-top:10px;padding:11px;border-radius:13px;font-size:11px;font-weight:800}.feedback.show{display:block}.feedback.good{background:var(--soft);color:#318600}.feedback.bad{background:var(--wrong);color:#a33}
.xp{display:none;text-align:center;margin-top:12px;color:#318600;font-weight:950;font-size:12px}
.bottom{margin-top:15px}.path-btn{display:block;text-align:center;text-decoration:none;padding:14px;border-radius:15px;background:var(--green);color:#fff;font-size:13px;font-weight:950;box-shadow:0 4px 0 var(--green2)}
.note{text-align:center;color:var(--muted);font-size:9px;margin-top:10px}
@media(max-width:500px){h1{font-size:26px}.lesson{padding:16px}.atom{width:100px;height:100px;font-size:46px}}
</style>
</head>
<body>
<header class="top"><div class="nav">
<button class="back" type="button" onclick="history.back()" aria-label="Go back">‹</button>
<div class="logo">SkillUp<small>CHEMISTRY • MICRO LEARNING</small></div>
<div class="streak">🔥 LEARN</div>
</div></header>

<main class="wrap" id="app"></main>

<script src="chemistry-1062-concepts-base.js?v=20260921-micro5150"></script>
<script>
(function(){
'use strict';
var params=new URLSearchParams(location.search),id=params.get('id')||'';
var all=window.SKILLUP_CHEMISTRY_MICROCONCEPTS||[];
var x=all.find(function(v){return v.id===id;});
var app=document.getElementById('app');

function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

if(!x){
app.innerHTML='<section class="lesson"><div class="badge">⚠️ MICROCONCEPT</div><h1>Concept not found</h1><p class="parent">This learning card is not available.</p><a class="path-btn" href="chemistry-home.html">BACK TO CHEMISTRY PATH</a></section>';
return;
}

var isMatterMeaning=id==='matter-and-its-nature--01-meaning';
var title=isMatterMeaning?'What Is Matter?':(x.microTitle||x.title||x.base);
var parent=x.parent||x.base;

var dots='';
for(var i=1;i<=10;i++)dots+='<span class="dot '+(i===Number(x.microIndex)?'active':'')+'"></span>';

if(isMatterMeaning){
app.innerHTML=
'<div class="progress" aria-label="Microconcept progress">'+dots+'</div>'+
'<div class="crumb">CHEMISTRY › '+esc(parent)+'</div>'+
'<section class="lesson">'+
'<span class="badge">🧪 MICRO LESSON 1 OF 10</span>'+
'<h1>'+esc(title)+'</h1>'+
'<div class="parent">One small idea from <b>'+esc(parent)+'</b></div>'+
'<div class="hero"><div class="atom">⚛️</div><strong>Matter has mass and occupies space.</strong><p>Everything around you that has mass and takes up space is called matter.</p></div>'+
'<div class="lesson-title">Learn it in 3 simple steps</div>'+
'<div class="fact"><div class="num">1</div><div><b>Mass</b><span>Matter has mass — it contains a measurable amount of material.</span></div></div>'+
'<div class="fact"><div class="num">2</div><div><b>Occupies space</b><span>Matter takes up space. This is also called having volume.</span></div></div>'+
'<div class="fact"><div class="num">3</div><div><b>Examples</b><span>Water, air, a book and your body are all matter.</span></div></div>'+
'<div class="quiz">'+
'<div class="quiz-label">⚡ QUICK CHECK</div>'+
'<div class="question">Which statement best describes matter?</div>'+
'<button class="option" data-answer="wrong">Anything that can only be seen</button>'+
'<button class="option" data-answer="correct">Anything that has mass and occupies space</button>'+
'<button class="option" data-answer="wrong">Only solids and liquids</button>'+
'<div id="feedback" class="feedback"></div><div id="xp" class="xp">🎉 +10 XP • Lesson complete!</div>'+
'</div>'+
'<div class="bottom"><a class="path-btn" href="chemistry-home.html">✓ RETURN TO CHEMISTRY PATH</a><div class="note">Each microconcept is independent. No repeated chapter text.</div></div>'+
'</section>';
}else{
app.innerHTML=
'<div class="progress">'+dots+'</div>'+
'<div class="crumb">CHEMISTRY › '+esc(parent)+'</div>'+
'<section class="lesson">'+
'<span class="badge">🧪 MICRO LESSON '+esc(x.microIndex)+'/10</span>'+
'<h1>'+esc(title)+'</h1>'+
'<div class="parent">Parent concept: <b>'+esc(parent)+'</b></div>'+
'<div class="hero"><div class="atom">🧪</div><strong>One small idea at a time.</strong><p>This lesson focuses only on the selected microconcept.</p></div>'+
'<div class="fact"><div class="num">1</div><div><b>Focus</b><span>'+esc(x.microTitle||title)+'</span></div></div>'+
'<div class="fact"><div class="num">2</div><div><b>Simple learning</b><span>Understand the idea, then check it with one quick question.</span></div></div>'+
'<div class="quiz"><div class="quiz-label">⚡ QUICK CHECK</div><div class="question">Are you ready to check this microconcept?</div>'+
'<button class="option" data-answer="correct">Yes — check my understanding</button>'+
'<button class="option" data-answer="wrong">I need to review</button>'+
'<div id="feedback" class="feedback"></div><div id="xp" class="xp">🎉 +10 XP • Micro lesson complete!</div></div>'+
'<div class="bottom"><a class="path-btn" href="chemistry-home.html">✓ RETURN TO CHEMISTRY PATH</a></div>'+
'</section>';
}

var opts=document.querySelectorAll('.option'),fb=document.getElementById('feedback'),xp=document.getElementById('xp');
opts.forEach(function(btn){
btn.addEventListener('click',function(){
opts.forEach(function(b){b.disabled=true;});
if(btn.dataset.answer==='correct'){
btn.classList.add('correct');fb.className='feedback show good';fb.textContent='🎉 Correct! Great job — you understood the idea.';xp.style.display='block';
}else{
btn.classList.add('wrong');fb.className='feedback show bad';fb.textContent='💡 Review the lesson once, then try the check again.';
}
});
});
})();
</script>
</body>
</html>
