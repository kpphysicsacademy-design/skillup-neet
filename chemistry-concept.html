<style>
:root{--g:#58cc02;--gd:#46a900;--n:#17324d;--m:#65798c;--line:#dbe8f5;--bg:#f7fbff;--blue:#1677ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#263238}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:5}.nav,.wrap{max-width:760px;margin:auto}.nav{height:60px;padding:0 14px;display:flex;align-items:center;gap:10px}.back{border:1px solid var(--line);border-radius:12px;padding:8px 11px;text-decoration:none;color:var(--n);font-weight:900}.brand{font-weight:950;color:var(--n)}.brand small{display:block;font-size:8px;letter-spacing:1px;color:#6b8297}.wrap{padding:16px 14px 60px}.steps{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:900;color:var(--m)}.bar{height:8px;background:#e7eef4;border-radius:99px;margin:8px 0 18px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);width:10%}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 8px 22px rgba(25,70,105,.07)}.tag{font-size:10px;letter-spacing:.9px;font-weight:950;color:#3d8d12;text-transform:uppercase}.num{display:inline-flex;width:38px;height:38px;border-radius:50%;align-items:center;justify-content:center;background:#eaffdf;color:#358d0c;font-weight:950;margin-bottom:10px}h1{margin:4px 0 9px;color:var(--n);font-size:31px;line-height:1.15}.lead{font-size:17px;line-height:1.65;color:#43586b}.block{margin-top:13px;padding:15px;border:1px solid #e4edf5;border-radius:16px;background:#fbfdff}.block h2{font-size:17px;color:var(--n);margin:0 0 6px}.block p,.block li{font-size:14px;line-height:1.65;color:#465a6c}.block ul{margin:5px 0 0;padding-left:21px}.memory{background:#fff8e7;border-color:#f1dfae}.memory h2{color:#956600}.cta{display:block;text-align:center;text-decoration:none;margin-top:18px;padding:15px;border-radius:15px;background:var(--g);color:#fff;font-weight:950;box-shadow:0 4px 0 var(--gd)}@media(max-width:600px){h1{font-size:27px}.card{padding:18px}}
</style></head><body>
<header class="top"><div class="nav"><a class="back" href="chemistry-home.html">← Path</a><span>⚗️</span><div class="brand">SkillUp<small>CHEMISTRY • LEARN</small></div></div></header>
<main class="wrap"><div class="steps"><span id="step">LESSON 1 OF 10</span><span>LEARN</span></div><div class="bar"><i id="bar"></i></div><section class="card" id="card"></section></main>
<script>
(async()=>{const p=new URLSearchParams(location.search),start=(p.get('concept')||'matter and its nature').replace(/\+/g,' '),requested=Math.max(1,Number(p.get('step')||1));let map=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function content(c){if((c.title||'').toLowerCase()==='matter and its nature')return {lead:'Matter is anything that has mass and occupies space. Chemistry begins with the particle view of matter.',blocks:[
['What is matter?','Matter has mass and occupies space. Solids, liquids, gases and the substances around us are examples of matter.'],
['Matter is particulate','Matter is made of very small particles such as atoms, molecules and ions. These particles are not visible to the naked eye.'],
['Particles have spaces','Particles are separated by spaces. The relative amount of empty space helps explain why gases are much more compressible than solids and liquids.'],
['Particles are always moving','Particles are in continuous motion. Increasing temperature generally increases their average kinetic energy.'],
['Particles attract each other','Particles experience attractive interactions. Their strength helps explain differences between solids, liquids and gases.'],
['States of matter','Solid: fixed shape and volume. Liquid: fixed volume but takes the shape of its container. Gas: neither fixed shape nor fixed volume.'],
['Physical and chemical nature','Physical properties can be observed without changing chemical identity. Chemical properties describe the ability to undergo chemical change.'],
['Daily-life connection','Melting ice changes solid water into liquid water without changing H₂O. Burning a substance can produce new substances and is a chemical change.'],
['NEET / JEE recall','Matter → particles → spaces + motion + attraction. Use this particle model to explain the behaviour of different states.','memory']]};
return {lead:'Learn '+(c.title||'this Chemistry concept')+' in one focused lesson before testing yourself.',blocks:[['Core idea','Understand the exact definition and central relationship of this concept.'],['Exam focus','Identify the rule, equation, property or classification most likely to be tested.'],['Quick recall','Explain the concept in your own words before starting the MCQ.','memory']]};}
try{const d=await (await fetch('data/chemistry-content-map.json?v=5')).json();(d.chapters||[]).forEach(ch=>(ch.learn_concepts||[]).forEach(c=>map.push({...c,chapter_name:ch.name})));let idx=map.findIndex(c=>(c.title||'').toLowerCase()===start.toLowerCase());if(idx<0)idx=0;const c=map[(idx+requested-1)%map.length],actual=(idx+requested-1)%map.length+1;document.getElementById('step').textContent='LESSON '+requested+' OF 10';document.getElementById('bar').style.width=(requested*10)+'%';const l=content(c);document.getElementById('card').innerHTML='<div class="num">'+requested+'</div><div class="tag">'+esc(c.chapter_name||'Chemistry')+' • Learn</div><h1>'+esc(c.title)+'</h1><p class="lead">'+esc(l.lead)+'</p>'+l.blocks.map(b=>'<div class="block '+(b[2]||'')+'"><h2>'+esc(b[0])+'</h2><p>'+esc(b[1])+'</p></div>').join('')+'<a class="cta" href="chemistry-mcq.html?concept='+encodeURIComponent(c.title)+'&step='+requested+'&start='+encodeURIComponent(start)+'">I UNDERSTAND → START MCQ</a>'}catch(e){document.getElementById('card').innerHTML='<p>Unable to load this lesson. Please refresh.</p>'}})();
</script></body></html>
