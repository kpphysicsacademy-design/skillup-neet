x}.num{width:27px;height:27px;flex:0 0 27px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-size:11px;font-weight:950}.fact b{font-size:13px}.fact span{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}.formula{display:inline-block;margin:4px 5px;padding:8px 12px;border-radius:12px;background:#fff;border:2px solid #cfe2f6;color:var(--navy);font-size:20px;font-weight:950}.quiz{margin-top:16px;background:#fff;border:2px solid #cfe2f6;border-radius:22px;padding:17px}.quiz-label{font-size:10px;color:var(--blue);font-weight:950;letter-spacing:.5px}.question{font-size:15px;font-weight:900;line-height:1.4;margin:8px 0 12px}.option{width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px;margin:5px 0;font-size:12px;font-weight:800;cursor:pointer;color:var(--ink)}.option:hover{border-color:#8ebced}.option.correct{border-color:var(--green);background:var(--soft)}.option.wrong{border-color:#ef9b9b;background:var(--wrong)}.feedback{display:none;margin-top:10px;padding:11px;border-radius:13px;font-size:11px;font-weight:800}.feedback.show{display:block}.feedback.good{background:var(--soft);color:#318600}.feedback.bad{background:var(--wrong);color:#a33}.xp{display:none;text-align:center;margin-top:12px;color:#318600;font-weight:950;font-size:12px}.bottom{margin-top:15px}.path-btn{display:block;text-align:center;text-decoration:none;padding:14px;border-radius:15px;background:var(--green);color:#fff;font-size:13px;font-weight:950;box-shadow:0 4px 0 var(--green2)}.note{text-align:center;color:var(--muted);font-size:9px;margin-top:10px}@media(max-width:500px){h1{font-size:26px}.lesson{padding:16px}.atom{width:100px;height:100px;font-size:46px}}

<body><header class="top"><div class="nav"><button class="back" type="button" onclick="history.back()" aria-label="Go back">‹</button><div class="logo">SkillUp<small>CHEMISTRY • MICRO LEARNING</small></div><div class="streak">🔥 LEARN</div></div></header><main class="wrap" id="app"></main>

<script>
(function(){
'use strict';
var p=new URLSearchParams(location.search),id=p.get('id')||'',all=window.SKILLUP_CHEMISTRY_MICROCONCEPTS||[],x=all.find(function(v){return v.id===id;}),app=document.getElementById('app');
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
if(!x){app.innerHTML='<section class="lesson"><div class="badge">⚠️ MICROCONCEPT</div><h1>Concept not found</h1><p class="parent">This learning card is not available.</p><a class="path-btn" href="chemistry-home.html">BACK TO CHEMISTRY PATH</a></section>';return;}

var meaning=id==='matter-and-its-nature--01-meaning',parts=id==='matter-and-its-nature--02-key-parts',representation=id==='matter-and-its-nature--03-representation',formation=id==='matter-and-its-nature--04-formation-process';

if(meaning){shell('<span class="badge">🧪 MICRO LESSON 1 OF 10</span><h1>What Is Matter?</h1><div class="parent">One small idea from <b>'+esc(parent)+'</b></div><div class="hero"><div class="atom">⚛️</div><strong>Matter has mass and occupies space.</strong><p>Everything around you that has mass and takes up space is called matter.</p></div><div class="lesson-title">Learn it in 3 simple steps</div><div class="fact"><div class="num">1</div><div><b>Mass</b><span>Matter has mass — it contains a measurable amount of material.</span></div></div><div class="fact"><div class="num">2</div><div><b>Occupies space</b><span>Matter takes up space. This is also called having volume.</span></div></div><div class="fact"><div class="num">3</div><div><b>Examples</b><span>Water, air, a book and your body are all matter.</span></div></div><div class="quiz"><div class="quiz-label">⚡ QUICK CHECK</div><div class="question">Which statement best describes matter?</div><button class="option" data-answer="wrong">Anything that can only be seen</button><button class="option" data-answer="correct">Anything that has mass and occupies space</button><button class="option" data-answer="wrong">Only solids and liquids</button><div id="feedback" class="feedback"></div><div id="xp" class="xp">🎉 +10 XP • Lesson complete!</div></div><div class="bottom"><a class="path-btn" href="chemistry-home.html">✓ RETURN TO CHEMISTRY PATH</a></div>');
}else if(parts){shell('<span class="badge">🧪 MICRO LESSON 2 OF 10</span><h1>What Makes Up Matter?</h1><div class="parent">Key parts of <b>'+esc(parent)+'</b></div><div class="hero"><div class="atom">⚛️</div><strong>Matter is made of tiny particles.</strong><p>These particles include atoms, molecules and ions.</p></div><div class="lesson-title">Build the idea</div><div class="fact"><div class="num">1</div><div><b>Atoms</b><span>Atoms are basic particles of elements, such as a hydrogen atom or oxygen atom.</span></div></div><div class="fact"><div class="num">2</div><div><b>Molecules</b><span>Molecules form when atoms are joined together, such as H₂O.</span></div></div><div class="fact"><div class="num">3</div><div><b>Ions</b><span>Ions are charged particles formed when atoms or groups of atoms gain or lose electrons.</span></div></div><div class="quiz"><div class="quiz-label">⚡ QUICK CHECK</div><div class="question">Which group contains particles that can make up matter?</div><button class="option" data-answer="correct">Atoms, molecules and ions</button><button class="option" data-answer="wrong">Only molecules</button><button class="option" data-answer="wrong">Only atoms</button><div id="feedback" class="feedback"></div><div id="xp" class="xp">🎉 +10 XP • Lesson complete!</div></div><div class="bottom"><a class="path-btn" href="chemistry-home.html">✓ RETURN TO CHEMISTRY PATH</a></div>');
}else if(representation){shell('<span class="badge">🧪 MICRO LESSON 3 OF 10</span><h1>How Do We Represent Matter?</h1><div class="parent">Symbols & representation in <b>'+esc(parent)+'</b></div><div class="hero"><div class="atom">🧪</div><strong>Chemists use symbols and formulas.</strong><p>Short symbols help us describe elements, particles and substances clearly.</p><div style="margin-top:12px"><span class="formula">H</span><span class="formula">O</span><span class="formula">Na</span><span class="formula">Cl</span></div></div><div class="lesson-title">Decode the symbols</div><div class="fact"><div class="num">1</div><div><b>Element symbol</b><span>H represents hydrogen and O represents oxygen. The first letter is capitalized.</span></div></div><div class="fact"><div class="num">2</div><div><b>More than one letter</b><span>Na represents sodium and Cl represents chlorine. Only the first letter is capitalized.</span></div></div><div class="fact"><div class="num">3</div><div><b>Chemical formula</b><span>H₂O tells us that water contains 2 hydrogen atoms and 1 oxygen atom.</span></div></div><div class="quiz"><div class="quiz-label">⚡ QUICK CHECK</div><div class="question">What does H₂O represent?</div><button class="option" data-answer="wrong">One hydrogen atom only</button><button class="option" data-answer="correct">A water molecule with 2 H atoms and 1 O atom</button><button class="option" data-answer="wrong">Two oxygen atoms</button><div id="feedback" class="feedback"></div><div id="xp" class="xp">🎉 +10 XP • Lesson complete!</div></div><div class="bottom"><a class="path-btn" href="chemistry-home.html">✓ RETURN TO CHEMISTRY PATH</a></div>');
}else if(formation){shell('<span class="badge">🧪 MICRO LESSON 4 OF 10</span><h1>How Are Particles Formed?</h1><div class="parent">Formation / process in <b>'+esc(parent)+'</b></div><div class="hero"><div class="atom">🧩</div><strong>Atoms can join to form molecules.</strong><p>When atoms combine in fixed numbers, they form particles such as molecules and compounds.</p><div style="margin-top:12px"><span class="formula">H</span><b style="font-size:20px"> + </b><span class="formula">H</span><b style="font-size:20px"> → </b><span class="formula">H₂</span></div></div><div class="lesson-title">Build it step by step</div><div class="fact"><div class="num">1</div><div><b>Atoms start separately</b><span>Hydrogen atoms are individual particles before they join.</span></div></div><div class="fact"><div class="num">2</div><div><b>Atoms combine</b><span>Two hydrogen atoms can join to form one H₂ molecule.</span></div></div><div class="fact"><div class="num">3</div><div><b>New particle</b><span>The joined atoms behave as one molecule of hydrogen, H₂.</span></div></div><div class="quiz"><div class="quiz-label">⚡ QUICK CHECK</div><div class="question">What is formed when two hydrogen atoms join together?</div><button class="option" data-answer="wrong">H</button><button class="option" data-answer="correct">H₂ molecule</button><button class="option" data-answer="wrong">O₂ molecule</button><div id="feedback" class="feedback"></div><div id="xp" class="xp">🎉 +10 XP • Lesson complete!</div></div><div class="bottom"><a class="path-btn" href="chemistry-home.html">✓ RETURN TO CHEMISTRY PATH</a><div class="note">Next microconcept: factors & conditions.</div></div>');
}else{shell('<span class="badge">🧪 MICRO LESSON '+idx+' OF 10</span><h1>'+esc(title)+'</h1><div class="parent">One focused part of <b>'+esc(parent)+'</b></div><div class="hero"><div class="atom">🧪</div><strong>One small idea at a time.</strong><p>This lesson focuses only on the selected microconcept.</p></div><div class="fact"><div class="num">1</div><div><b>Focus</b><span>'+esc(title)+'</span></div></div><div class="fact"><div class="num">2</div><div><b>Learn</b><span>Understand the idea in a short lesson, then check your understanding.</span></div></div><div class="quiz"><div class="quiz-label">⚡ QUICK CHECK</div><div class="question">Ready to check this microconcept?</div><button class="option" data-answer="correct">Yes — check my understanding</button><button class="option" data-answer="wrong">I need to review</button><div id="feedback" class="feedback"></div><div id="xp" class="xp">🎉 +10 XP • Micro lesson complete!</div></div><div class="bottom"><a class="path-btn" href="chemistry-home.html">✓ RETURN TO CHEMISTRY PATH</a></div>');}
var opts=document.querySelectorAll('.option'),fb=document.getElementById('feedback'),xp=document.getElementById('xp');opts.forEach(function(btn){btn.addEventListener('click',function(){opts.forEach(function(b){b.disabled=true;});if(btn.dataset.answer==='correct'){btn.classList.add('correct');fb.className='feedback show good';fb.textContent='🎉 Correct! Great job — you understood the idea.';xp.style.display='block';}else{btn.classList.add('wrong');fb.className='feedback show bad';fb.textContent='💡 Review the lesson once, then try the check again.';}});});
})();
</script></body></html>
