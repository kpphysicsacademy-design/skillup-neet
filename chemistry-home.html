<style>
:root{--b:#1677ff;--n:#123b70;--m:#6b7280;--l:#d9e5f2;--g:#58cc02}
*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#263238;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--l)}.nav,.wrap{max-width:1050px;margin:auto}.nav{height:60px;padding:0 14px;display:flex;align-items:center;gap:9px;position:relative}.menu-wrap{position:relative}.menu-btn{width:38px;height:38px;border:1px solid var(--l);border-radius:12px;background:#fff;font-size:21px;cursor:pointer;display:grid;place-items:center}.menu{position:absolute;left:0;top:46px;width:230px;background:#fff;border:1px solid var(--l);border-radius:16px;box-shadow:0 12px 28px rgba(18,59,112,.16);padding:8px;display:none;z-index:50}.menu.open{display:block}.menu a{display:block;padding:11px 12px;border-radius:10px;font-size:12px;font-weight:800;color:var(--n);text-decoration:none}.menu a:hover{background:#eef5ff}.menu-title{padding:8px 12px 6px;font-size:10px;font-weight:950;color:var(--m);letter-spacing:.7px}.brand{font-weight:950;color:var(--n)}.brand small{display:block;font-size:8px;letter-spacing:1px;color:#6480a0}.flask{font-size:24px}.nav-status{margin-left:auto;padding:7px 10px;border-radius:999px;background:#eaf8e6;color:#318600;font-size:10px;font-weight:950}.wrap{padding:16px 13px 70px}.tools{display:flex;gap:8px;margin:17px 0 10px}.search{flex:1;padding:11px;border:2px solid var(--l);border-radius:13px;font-size:12px}.search-btn{border:0;border-radius:13px;background:var(--b);color:#fff;font-weight:950;padding:0 16px;cursor:pointer;box-shadow:0 3px 0 #0d5bbf}.path{padding-left:9px}.unit{display:flex;align-items:center;gap:8px;margin:20px 0 9px}.unit-main{display:flex;align-items:center;gap:8px;min-width:0}.unum{width:36px;height:36px;flex:0 0 36px;border-radius:50%;display:grid;place-items:center;background:var(--b);color:#fff;font-size:11px;font-weight:950;border:4px solid #e7f1ff}.unit h2{margin:0;color:var(--n);font-size:15px}.unit small{color:var(--m);font-size:8px}.unit-tools{margin-left:auto}.unit-link{background:var(--b);color:#fff;border-radius:999px;padding:7px 12px;font-size:9px;font-weight:950;box-shadow:0 3px 0 #0d5bbf;white-space:nowrap;text-decoration:none}.chapter{position:relative;margin:7px 0 7px 43px}.node{position:absolute;left:-27px;top:23px;width:17px;height:17px;border-radius:50%;background:#fff;border:5px solid #b8d3ef}.chapter a{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#fff;border:2px solid var(--l);border-radius:17px;padding:10px;box-shadow:0 6px 16px rgba(18,59,112,.07);transition:.16s;text-decoration:none;color:inherit}.chapter a:hover{transform:translateY(-2px);border-color:#8ebced}.title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:950}.icon{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,#fff,#e5f1ff);border:2px solid #cfe2f6;box-shadow:0 4px 0 #b5cfe9,0 7px 14px rgba(22,119,255,.12);font-size:21px}.sub{margin:3px 0 0;font-size:8px;color:var(--m)}.tag{display:inline-block;margin-top:5px;margin-right:4px;padding:3px 6px;border-radius:99px;background:#eef4fb;color:#526b86;font-size:7px;font-weight:900}.go{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:var(--b);color:#fff;font-weight:950;box-shadow:0 4px 0 #0d5bbf}.empty{text-align:center;padding:20px;color:var(--m);display:none}.card{margin-top:14px;background:#fff;border:1px solid var(--l);border-radius:16px;padding:13px}@media(max-width:700px){.wrap{padding:12px 9px 70px}.chapter{margin-left:28px}.node{left:-18px}.chapter a{padding:9px}.title{font-size:11px}.icon{width:37px;height:37px;flex-basis:37px;font-size:19px}.go{width:30px;height:30px}.unit-link{font-size:7px;padding:6px 7px}}
</style>
</head>
<body><header class="top"><div class="nav"><div class="menu-wrap"><button class="menu-btn" id="menuBtn" type="button" aria-label="Open SkillUp menu" aria-expanded="false">☰</button><div class="menu" id="menu"><div class="menu-title">SKILLUP</div><a href="index.html">🏠 SkillUp Home</a><a href="physics-home-fast.html">🚀 Physics</a><a href="chemistry-home.html">⚗️ Chemistry</a><a href="biology-home.html">🧬 Biology</a><a href="maths-home.html">📐 Maths</a></div></div><span class="flask">⚗️</span><div class="brand">SkillUp<small>CHEMISTRY • JEE MAIN 2026</small></div><span class="nav-status">CHEMISTRY</span></div></header>

<main class="wrap">
<div class="tools"><input id="q" class="search" placeholder="Search Chemistry concepts…" aria-label="Search Chemistry concepts"><button id="searchBtn" class="search-btn" type="button">SEARCH</button></div>
<section id="path" class="path"></section><div id="empty" class="empty">No matching Chemistry concepts found.</div>
<section class="card"><b>⚗️ Progressive loading</b><div style="font-size:10px;color:#718096;margin-top:4px">20 Chemistry units load progressively. Only official JEE Main / NEET concepts are shown.</div></section>
</main></main>


<script>
(function(){
'use strict';
var path=document.getElementById('path'),empty=document.getElementById('empty'),q=document.getElementById('q'),searchBtn=document.getElementById('searchBtn'),menuBtn=document.getElementById('menuBtn'),menu=document.getElementById('menu');
var data={chapters:[]},all=[],shown=0,BATCH=20,term='';
var icons=['🧪','⚛️','🔗','🔥','💧','⚖️','🔋','⏱️','📊','🧩','🧲','🔷','🧫','🧬','🧪','🧯','🍷','🧪','🧬','🔬'];
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function build(){
 all=[];
 (data.chapters||[]).forEach(function(ch,i){
  (ch.learn_concepts||[]).forEach(function(c){all.push({u:i+1,n:ch.name,ic:icons[i]||'🧪',c:c.title,parent:c.title,ix:all.length+1});});
 });
}
function unit(x){return '<div class="unit"><div class="unit-main"><span class="unum">'+x.u+'</span><div><h2>'+esc(x.ic)+' '+esc(x.n)+'</h2><small>'+((data.chapters[x.u-1]||{}).microconcept_count||0)+' official microconcepts • UNIT '+x.u+' of 20</small></div></div></div>';}
function card(x){return '<article class="chapter"><span class="node"></span><a href="chemistry-learn.html?concept='+encodeURIComponent(x.c)+'"><div><div class="title"><span class="icon">'+x.ic+'</span><span>'+esc(x.c)+'</span></div><div class="sub">Official concept '+x.ix+' • '+esc(x.n)+'</div><span class="tag">🎯 LEARN</span><span class="tag">🔗 RELEVANT</span><span class="tag">🧠 QUIZ</span></div><span class="go">›</span></a></article>';}
function filtered(){return term?all.filter(function(x){return (x.c+' '+x.n).toLowerCase().indexOf(term)>-1;}):all;}
function render(list,count){path.innerHTML='';shown=Math.min(count,list.length);var html='',last=0;for(var i=0;i<shown;i++){if(list[i].u!==last){html+=unit(list[i]);last=list[i].u;}html+=card(list[i]);}path.innerHTML=html;empty.style.display=list.length?'none':'block';}
function more(list){if(term||shown>=list.length)return;var end=Math.min(shown+BATCH,list.length),html='',last=shown?list[shown-1].u:0;for(var i=shown;i<end;i++){if(list[i].u!==last){html+=unit(list[i]);last=list[i].u;}html+=card(list[i]);}path.insertAdjacentHTML('beforeend',html);shown=end;}
function refresh(){var list=filtered();render(list,term?list.length:BATCH);}
async function load(){
 try{var r=await fetch('data/chemistry-content-map.json?v=5');if(!r.ok)throw new Error('HTTP '+r.status);data=await r.json();build();refresh();
 var sentinel=document.createElement('div');sentinel.style.height='1px';path.after(sentinel);
 if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){if(es[0]&&es[0].isIntersecting)more(filtered());},{rootMargin:'700px'});io.observe(sentinel);}
 else window.addEventListener('scroll',function(){if(innerHeight+scrollY>=document.body.offsetHeight-1200)more(filtered());});
 }catch(e){path.innerHTML='<section class="card"><b>Content map could not load.</b><div style="font-size:10px;color:#718096;margin-top:4px">Please refresh after deployment.</div></section>';}}
searchBtn.onclick=function(){term=q.value.trim().toLowerCase();refresh();};
q.addEventListener('keydown',function(e){if(e.key==='Enter'){term=q.value.trim().toLowerCase();refresh();}});
menuBtn.onclick=function(){menu.classList.toggle('open');};
document.addEventListener('click',function(e){if(!e.target.closest('.menu-wrap'))menu.classList.remove('open');});
load();
})();
</script></body>
</html>
