<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="SkillUp Chemistry Learn — bite-sized concept explanations followed by MCQs.">
<title>SkillUp | Chemistry Learn</title>
<style>
:root{--green:#58cc02;--green-dark:#46a900;--blue:#1677ff;--navy:#17324d;--muted:#64788b;--line:#dbe8f5;--bg:#f6fbff;--soft:#eef8ff;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#263238;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.nav{max-width:820px;height:60px;margin:auto;padding:0 14px;display:flex;align-items:center;gap:10px}
.back{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 11px;text-decoration:none;color:var(--navy);font-weight:900}
.brand{font-weight:950;color:var(--navy)}.brand small{display:block;font-size:8px;letter-spacing:1px;color:#64809a}
.wrap{max-width:820px;margin:auto;padding:16px 13px 70px}
.topline{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:900;color:var(--muted)}
.progress{height:9px;background:#e6eef5;border-radius:99px;overflow:hidden;margin:8px 0 16px}.progress i{display:block;height:100%;width:10%;background:var(--green);border-radius:99px;transition:.3s}
.card{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:21px;box-shadow:0 7px 20px rgba(31,72,110,.07);margin-top:12px}
.eyebrow{font-size:10px;font-weight:950;letter-spacing:.8px;color:#328700;text-transform:uppercase}
h1{font-size:30px;line-height:1.18;color:var(--navy);margin:7px 0 8px}
.lead{font-size:16px;line-height:1.65;color:#405568;margin:0 0 18px}
.lesson{display:grid;gap:12px}
.lesson-block{padding:15px;border-radius:16px;background:#f8fbfe;border:1px solid #e3edf5}
.lesson-block h3{margin:0 0 7px;color:var(--navy);font-size:17px}
.lesson-block p{margin:0;color:#435568;line-height:1.65;font-size:14px}
.lesson-block ul{margin:7px 0 0;padding-left:21px;color:#435568;line-height:1.7;font-size:14px}
.example{background:#f2fff0;border-color:#cdebbf}.example h3{color:#368c10}
.key{background:#fff8e9;border-color:#f1dfad}.key h3{color:#9a6a00}
.check{background:#eef8ff;border-color:#d5eafa}.check h3{color:#1769aa}
.btn{width:100%;border:0;border-radius:15px;padding:15px;margin-top:17px;background:var(--green);color:#fff;font-size:16px;font-weight:950;box-shadow:0 4px 0 var(--green-dark);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-dark)}
.mcq{display:none}.mcq h2{margin:6px 0 14px;color:var(--navy);font-size:22px}
.question{font-size:18px;line-height:1.5;font-weight:850;color:var(--navy);margin-bottom:14px}
.options{display:grid;gap:10px}.option{border:2px solid #cbdbea;border-bottom:4px solid #c5d7e8;border-radius:15px;padding:13px;text-align:left;background:#fff;color:var(--navy);font-size:15px;font-weight:750;cursor:pointer}
.option.correct{background:#efffe5;border-color:var(--green)}.option.wrong{background:#fff0f0;border-color:#ff6b6b}
.feedback{margin-top:12px;padding:13px;border-radius:14px;background:#f4f8fc;border:1px solid #dfeaf4;font-size:13px;line-height:1.55}
.next{display:none;width:100%;margin-top:14px;border:0;border-radius:15px;padding:15px;background:var(--green);color:#fff;font-size:16px;font-weight:950;box-shadow:0 4px 0 var(--green-dark);cursor:pointer}
.finish{display:none;text-align:center}.finish h2{font-size:27px;color:var(--navy)}.finish p{color:var(--muted);line-height:1.6}
.home{display:block;margin-top:12px;text-decoration:none;text-align:center;padding:13px;border-radius:14px;background:#eef5ff;color:#2458a8;font-weight:900}
.error{padding:14px;border-radius:14px;background:#fff1f1;border:1px solid #ffc7c7;color:#a52b2b;font-size:13px}
@media(max-width:650px){h1{font-size:26px}.card{padding:17px}.question{font-size:17px}}
</style>
</head>
<body>
<header class="top"><div class="nav">
<a class="back" href="chemistry-home.html">← Path</a>
<span style="font-size:23px">⚗️</span>
<div class="brand">SkillUp<small>CHEMISTRY • LEARN → MCQ</small></div>
</div></header>

<main class="wrap">
<div class="topline"><span id="stepLabel">CONCEPT 1 OF 10</span><span id="score">0 / 10</span></div>
<div class="progress"><i id="bar"></i></div>
<section id="conceptCard" class="card"></section>
<section id="mcqCard" class="card mcq"></section>
<section id="finish" class="card finish"></section>
</main>

<script>
(function(){
'use strict';
const params=new URLSearchParams(location.search);
const start=(params.get('concept')||'matter and its nature').replace(/\+/g,' ').trim();
let map=[],steps=[],step=0,score=0,currentQuestions=[],answered=false;

const conceptCard=document.getElementById('conceptCard');
const mcqCard=document.getElementById('mcqCard');
const finish=document.getElementById('finish');
const bar=document.getElementById('bar');
const stepLabel=document.getElementById('stepLabel');
const scoreEl=document.getElementById('score');

function esc(s){
 return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function slug(s){
 return String(s||'').toLowerCase().replace(/&/g,'and').replace(/[’']/g,'').replace(/[^a-z0-9]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
}
function updateProgress(){
 stepLabel.textContent='CONCEPT '+(step+1)+' OF 10';
 scoreEl.textContent=score+' / '+step;
 bar.style.width=(step/10*100)+'%';
}
function lessonFor(c){
 const key=(c.title||'').toLowerCase().trim();
 if(key==='matter and its nature'){
  return {
   lead:'Matter is anything that has mass and occupies space. Chemistry begins by understanding what matter is, how its particles are arranged, and how those particles behave.',
   blocks:[
    ['What is matter?','Matter is the physical substance around us. A book, water, air, oxygen, a metal spoon and the human body are all examples of matter. Matter has two basic features: it has mass and it occupies space.'],
    ['Matter is made of particles','Matter is not a continuous block. It is made of extremely small particles such as atoms, molecules or ions. These particles are too small to see directly with the naked eye.','list'],
    ['Particles are separated by spaces','There are spaces between particles. The size of these spaces depends on the state of matter. Particles are generally packed most closely in solids, less closely in liquids and much farther apart in gases.','list'],
    ['Particles are in continuous motion','Particles of matter are continuously moving. Heating generally increases their kinetic energy, so particles move more rapidly. This helps explain phenomena such as diffusion and expansion.'],
    ['Particles attract one another','Particles exert attractive forces on one another. The strength of these interactions differs between substances and states. Stronger attractions generally help keep particles closer together.'],
    ['Three familiar states','Solid: fixed shape and fixed volume, with particles closely packed. Liquid: fixed volume but no fixed shape, because particles can move past one another. Gas: neither fixed shape nor fixed volume, with particles widely separated and highly mobile.','list'],
    ['Physical and chemical nature','A physical property can be observed or measured without changing the chemical identity of a substance, such as colour, density or melting point. A chemical property describes how a substance can undergo a chemical change, such as reacting with oxygen.'],
    ['Everyday example','When ice melts, water changes from solid to liquid but remains H₂O. This is a physical change. When hydrogen burns in oxygen to form water, new substances are involved, so it is a chemical change.'],
    ['NEET / JEE quick recall','Remember the three particle ideas: matter is particulate, particles have spaces, particles are in motion and particles interact. These ideas help explain the behaviour of solids, liquids and gases.','key']
   ]
  };
 }
 return {
  lead:'Build a clear mental model of '+(c.title||'this concept')+'. Focus on the definition, the key relationship and how the idea is tested in NEET and JEE Main.',
  blocks:[
   ['Core meaning','Identify the exact definition and the central idea of this concept.'],
   ['Key points','Learn the important terms, relationships, rules and formulas that belong to this concept.'],
   ['Exam connection','Look for direct conceptual questions, application questions and common traps related to this topic.'],
   ['Quick recall','Before moving to the MCQ, explain the concept in your own words and recall its key relationship.','check']
  ]
 };
}
function renderLesson(c){
 const l=lessonFor(c);
 let html='<div class="eyebrow">'+esc(c.chapter_name||'CHEMISTRY')+' • LEARN</div><h1>'+esc(c.title)+'</h1><p class="lead">'+esc(l.lead)+'</p><div class="lesson">';
 l.blocks.forEach(b=>{
   const cls=b[2]==='key'?'lesson-block key':b[2]==='check'?'lesson-block check':b[2]==='list'?'lesson-block':'lesson-block';
   html+='<div class="'+cls+'"><h3>'+esc(b[0])+'</h3>';
   if(b[2]==='list') html+='<p>'+esc(b[1])+'</p>';
   else html+='<p>'+esc(b[1])+'</p>';
   html+='</div>';
 });
 html+='</div><button class="btn" id="toMcq">I UNDERSTAND → START MCQ</button>';
 conceptCard.innerHTML=html;
 conceptCard.style.display='block';mcqCard.style.display='none';
 document.getElementById('toMcq').onclick=showMcq;
}
function findArrays(before){
 const out=[];
 Object.keys(window).forEach(k=>{
   if(!before.includes(k)){
    const v=window[k];
    if(Array.isArray(v)&&v.length&&typeof v[0]==='object')out.push(v);
   }
 });
 return out;
}
function normalize(q){
 if(!q)return null;
 const text=q.question||q.q||q.text||q.questionText||q.prompt;
 let opts=q.options||q.choices||q.answers;
 let ans=q.answer;
 if(opts&&!Array.isArray(opts)&&typeof opts==='object')opts=Object.values(opts);
 if(typeof ans==='string'&&Array.isArray(opts)){
   const letter=ans.trim().match(/^[A-D]$/i);
   if(letter) ans=letter[0].toUpperCase().charCodeAt(0)-65;
   else {
    const i=opts.findIndex(x=>String(x).trim().toLowerCase()===ans.trim().toLowerCase());
    if(i>=0)ans=i;
   }
 }
 if(typeof ans!=='number')ans=q.correctIndex??q.correct??q.correctAnswer;
 if(!text||!Array.isArray(opts)||opts.length<2||typeof ans!=='number')return null;
 if(ans<0||ans>=opts.length)return null;
 return {question:String(text),options:opts.map(String),answer:ans,explanation:q.explanation||q.explain||q.solution||'Review the concept and the relationship tested.'};
}
function loadBank(c){
 return new Promise(resolve=>{
  const before=Object.keys(window);
  const candidates=[
   slug(c.title)+'-question-bank.js',
   slug(c.parent_concept)+'-question-bank.js'
  ].filter(Boolean);
  let done=false;
  function tryOne(i){
   if(done)return;
   if(i>=candidates.length){done=true;resolve([]);return;}
   const sc=document.createElement('script');
   sc.src=candidates[i]+'?v=20260921-learn';
   sc.onload=()=>{
    const arrays=findArrays(before),qs=[];
    arrays.forEach(a=>a.forEach(q=>{const n=normalize(q);if(n)qs.push(n);}));
    done=true;resolve(qs);
   };
   sc.onerror=()=>tryOne(i+1);
   document.head.appendChild(sc);
  }
  tryOne(0);
 });
}
async function showMcq(){
 conceptCard.style.display='none';mcqCard.style.display='block';
 mcqCard.innerHTML='<div class="eyebrow">MCQ • CONCEPT '+(step+1)+'</div><p>Loading your question…</p>';
 currentQuestions=await loadBank(steps[step]);
 answered=false;
 if(!currentQuestions.length){
   mcqCard.innerHTML='<div class="error"><b>MCQ bank connection is being prepared for this concept.</b><br>You can continue through the learning path.</div><button class="next" style="display:block" id="continue">CONTINUE TO NEXT CONCEPT →</button>';
   document.getElementById('continue').onclick=nextStep;
   return;
 }
 renderQuestion(currentQuestions[0]);
}
function renderQuestion(q){
 mcqCard.innerHTML='<div class="eyebrow">MCQ • '+esc(steps[step].title)+'</div><h2>Check your understanding</h2><div class="question">'+esc(q.question)+'</div><div class="options">'+q.options.map((o,i)=>'<button class="option" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('')+'</div><div id="feedback" class="feedback" style="display:none"></div><button id="mcqNext" class="next">NEXT CONCEPT →</button>';
 mcqCard.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i),q));
 document.getElementById('mcqNext').onclick=nextStep;
}
function answer(i,q){
 if(answered)return;
 answered=true;
 const opts=mcqCard.querySelectorAll('.option');
 opts.forEach(b=>b.disabled=true);
 if(opts[q.answer])opts[q.answer].classList.add('correct');
 const ok=i===q.answer;
 if(!ok&&opts[i])opts[i].classList.add('wrong');
 if(ok)score++;
 const fb=document.getElementById('feedback');
 fb.style.display='block';
 fb.innerHTML=(ok?'✅ Correct. ':'❌ Not quite. ')+'<b>'+esc(q.explanation)+'</b>';
 scoreEl.textContent=score+' / '+(step+1);
 document.getElementById('mcqNext').style.display='block';
}
function nextStep(){
 step++;
 if(step>=10){
  bar.style.width='100%';stepLabel.textContent='10 CONCEPTS COMPLETED';
  finish.style.display='block';conceptCard.style.display='none';mcqCard.style.display='none';
  finish.innerHTML='<div style="font-size:42px">🏆</div><h2>10 Concepts Completed</h2><p>You completed the Learn → MCQ sequence.</p><p><b>Score: '+score+' / 10</b></p><a class="home" href="chemistry-home.html">CONTINUE CHEMISTRY PATH</a>';
  return;
 }
 updateProgress();renderLesson(steps[step]);window.scrollTo({top:0,behavior:'smooth'});
}
async function init(){
 try{
  const r=await fetch('data/chemistry-content-map.json?v=5');
  const data=await r.json();
  (data.chapters||[]).forEach(ch=>(ch.learn_concepts||[]).forEach(c=>map.push({...c,chapter_name:ch.name,chapter_id:ch.chapter_id})));
  let idx=map.findIndex(c=>(c.title||'').toLowerCase()===start.toLowerCase());
  if(idx<0)idx=map.findIndex(c=>(c.title||'').toLowerCase().includes(start.toLowerCase()));
  if(idx<0)idx=0;
  steps=map.slice(idx,idx+10);
  if(steps.length<10)steps=steps.concat(map.slice(0,10-steps.length));
  updateProgress();renderLesson(steps[0]);
 }catch(e){
  conceptCard.innerHTML='<div class="error">Chemistry content could not load. Please refresh the page.</div>';
 }
}
init();
})();
</script>
</body>
</html>
