<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Chemistry | Atom, Molecule, Element & Compound</title><style>:root{--g:#58cc02;--gd:#46a900;--n:#17324d;--m:#65798c;--line:#dbe8f5;--bg:#f7fbff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#263238}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:5}.nav,.wrap{max-width:760px;margin:auto}.nav{height:60px;padding:0 14px;display:flex;align-items:center;gap:10px}.back{border:1px solid var(--line);border-radius:12px;padding:8px 11px;text-decoration:none;color:var(--n);font-weight:900}.brand{font-weight:950;color:var(--n)}.brand small{display:block;font-size:8px;letter-spacing:1px;color:#6b8297}.wrap{padding:16px 14px 60px}.progress{font-size:11px;font-weight:900;color:var(--m);display:flex;justify-content:space-between}.bar{height:8px;background:#e7eef4;border-radius:99px;margin:8px 0 18px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);transition:.2s}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 8px 22px rgba(25,70,105,.07)}.emoji{font-size:44px}.tag{font-size:10px;letter-spacing:.9px;font-weight:950;color:#3d8d12;text-transform:uppercase;margin-top:8px}h1{margin:5px 0 12px;color:var(--n);font-size:31px;line-height:1.15}.body{font-size:16px;line-height:1.7;color:#43586b}.body strong{color:var(--n)}.example{margin-top:16px;padding:15px;border-radius:16px;background:#f4fbff;border:1px solid var(--line);font-size:15px;line-height:1.6}.cta{display:block;text-align:center;text-decoration:none;margin-top:20px;padding:15px;border-radius:15px;background:var(--g);color:#fff;font-weight:950;box-shadow:0 4px 0 var(--gd);border:0;width:100%;font-size:15px}.backstep{display:block;text-align:center;margin-top:15px;color:var(--m);font-weight:800;text-decoration:none}@media(max-width:600px){h1{font-size:27px}.card{padding:18px}}</style></head><body><header class="top"><div class="nav"><a class="back" href="chemistry-home.html">← Path</a><span>🧪</span><div class="brand">SkillUp<small>CHEMISTRY • ATOMS & MOLECULES</small></div></div></header><main class="wrap"><div class="progress"><span id="count"></span><span>LEARN</span></div><div class="bar"><i id="bar"></i></div><section class="card" id="card"></section></main><script>
const lessons=[
{e:'⚛️',tag:'Atom • Learn',title:'What is an atom?',body:'An atom is the smallest particle of an element that retains the chemical identity of that element. Atoms contain subatomic particles: electrons, protons and neutrons.',ex:'🧠 Examples: He, Ne, Na and C represent atoms of elements.'},
{e:'🔗',tag:'Molecule • Learn',title:'What is a molecule?',body:'A molecule is an electrically neutral group of two or more atoms held together by chemical bonds and capable of independent existence.',ex:'🧪 Examples: H₂ and O₂ are molecules of elements; H₂O and CO₂ are molecules of compounds.'},
{e:'🧩',tag:'Element • Learn',title:'What is an element?',body:'An element is a pure substance made up of only one kind of atom. Each element has its own atomic number and chemical identity.',ex:'🔬 Examples: hydrogen, oxygen, carbon, sodium and iron are elements.'},
{e:'⚗️',tag:'Compound • Learn',title:'What is a compound?',body:'A compound is a pure substance formed when two or more different elements combine chemically in a fixed proportion. Its properties differ from those of its constituent elements.',ex:'💧 H₂O contains hydrogen and oxygen chemically combined in a fixed ratio; NaCl contains sodium and chlorine.'}
];
const p=new URLSearchParams(location.search),raw=(p.get('concept')||'').toLowerCase().trim();
let step=raw.includes('atom')||raw.includes('molecule')||raw.includes('element')||raw.includes('compound')?Number(p.get('step')||1):1;
step=Math.max(1,Math.min(4,step));
const l=lessons[step-1];
document.title='SkillUp Chemistry | '+l.title;
document.getElementById('count').textContent='LESSON '+step+' OF 4';
document.getElementById('bar').style.width=(step*25)+'%';
document.getElementById('card').innerHTML='<div class="emoji">'+l.e+'</div><div class="tag">'+l.tag+'</div><h1>'+l.title+'</h1><div class="body"><p>'+l.body+'</p></div><div class="example">'+l.ex+'</div><a class="cta" href="chemistry-mcq.html?concept=atom%20molecule%20element%20compound&step='+step+'">🧠 I UNDERSTAND → START MCQ</a>'+(step>1?'<a class="backstep" href="chemistry-learn.html?concept=atom%20molecule%20element%20compound&step='+(step-1)+'">← Previous concept</a>':'')+'</section>';
</script></body></html>
