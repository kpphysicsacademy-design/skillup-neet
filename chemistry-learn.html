<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="SkillUp Chemistry — Learn a concept, answer an MCQ, then continue to the next concept.">
<title>SkillUp | Chemistry Learn</title>
<style>
:root{--g:#58cc02;--gd:#46a900;--b:#1677ff;--n:#17324d;--m:#718096;--l:#dbe8f5;--bg:#f5faff;--red:#ff4b4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#263238;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--l)}.nav,.wrap{max-width:820px;margin:auto}.nav{height:60px;padding:0 14px;display:flex;align-items:center;gap:10px}.back{border:1px solid var(--l);background:#fff;border-radius:12px;padding:8px 11px;text-decoration:none;color:var(--n);font-weight:900}.brand{font-weight:950;color:var(--n)}.brand small{display:block;font-size:8px;letter-spacing:1px;color:#64809a}.wrap{padding:16px 13px 70px}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:11px;font-weight:900;color:var(--m)}.progress{height:10px;background:#e7eef5;border-radius:99px;overflow:hidden;margin:8px 0 15px}.progress i{display:block;height:100%;width:10%;background:var(--g);border-radius:99px;transition:.25s}.card{background:#fff;border:1px solid var(--l);border-radius:20px;padding:20px;box-shadow:0 6px 18px rgba(31,72,110,.07);margin-top:12px}.eyebrow{font-size:9px;font-weight:950;letter-spacing:.8px;color:#318600}.concept h1{font-size:28px;line-height:1.2;margin:7px 0;color:var(--n)}.concept p{font-size:14px;line-height:1.65;color:#435568;margin:8px 0}.focus{margin-top:15px;padding:14px;border-radius:15px;background:#eef8ff;border:1px solid #d9ecfb}.focus b{color:#1769aa}.focus ul{margin:7px 0 0;padding-left:20px;color:#435568;line-height:1.6}.next{width:100%;margin-top:16px;border:0;border-radius:15px;padding:15px;background:var(--g);color:#fff;font-size:16px;font-weight:950;box-shadow:0 4px 0 var(--gd);cursor:pointer}.mcq{display:none}.mcq h2{margin:6px 0 14px;color:var(--n);font-size:22px;line-height:1.35}.question{font-size:18px;line-height:1.5;font-weight:850;color:var(--n);margin-bottom:14px}.options{display:grid;gap:10px}.option{border:2px solid #cbdbea;border-bottom:4px solid #c5d7e8;border-radius:15px;padding:13px;text-align:left;background:#fff;color:var(--n);font-size:15px;font-weight:750;cursor:pointer}.option.correct{background:#efffe5;border-color:var(--g)}.option.wrong{background:#fff0f0;border-color:var(--red)}.feedback{margin-top:12px;padding:12px;border-radius:13px;background:#f3f8fd;border:1px solid #dfeaf4;font-size:13px;line-height:1.5}.mcqNext{display:none;width:100%;margin-top:14px;border:0;border-radius:15px;padding:15px;background:var(--g);color:#fff;font-size:16px;font-weight:950;box-shadow:0 4px 0 var(--gd);cursor:pointer}.finish{display:none;text-align:center}.finish h2{font-size:26px;color:var(--n)}.finish p{color:var(--m);line-height:1.6}.home{display:block;margin-top:12px;text-decoration:none;text-align:center;padding:13px;border-radius:14px;background:#eef5ff;color:#2458a8;font-weight:900}.error{padding:14px;border-radius:14px;background:#fff1f1;border:1px solid #ffc7c7;color:#a52b2b;font-size:13px}@media(max-width:650px){.concept h1{font-size:25px}.card{padding:17px}.question{font-size:17px}}
</style>
</head>
<body>
<header class="top"><div class="nav"><a class="back" href="chemistry-home.html">← Path</a><span style="font-size:23px">⚗️</span><div class="brand">SkillUp<small>CHEMISTRY • LEARN → MCQ</small></div></div></header>
<main class="wrap">
<div class="topline"><span id="stepLabel">CONCEPT 1 OF 10</span><span id="score">0 / 10</span></div>
<div class="progress"><i id="bar"></i></div>
<section id="conceptCard" class="card concept"></section>
<section id="mcqCard" class="card mcq"></section>
<section id="finish" class="card finish"></section>
</main>
<script>
(function(){
'use strict';
var params=new URLSearchParams(location.search),start=params.get('concept')||'matter and its nature';
var map=[],steps=[],step=0,score=0,currentQuestions=[],currentIndex=0,answered=false;
var conceptCard=document.getElementById('conceptCard'),mcqCard=document.getElementById('mcqCard'),finish=document.getElementById('finish'),bar=document.getElementById('bar'),stepLabel=document.getElementById('stepLabel'),scoreEl=document.getElementById('score');

function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function slug(s){return String(s||'').toLowerCase().replace(/&/g,'and').replace(/[’']/g,'').replace(/[^a-z0-9]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');}
function updateProgress(){stepLabel.textContent='CONCEPT '+(step+1)+' OF 10';scoreEl.textContent=score+' / '+step;bar.style.width=((step)/10*100)+'%';}
function makeLesson(c){
 var name=c.title||c.name;
 conceptCard.innerHTML='<div class="eyebrow">'+esc(c.chapter_name)+' • LEARN</div><h1>'+esc(name)+'</h1><p><b>Focus:</b> Build a clear mental model of '+esc(name)+', identify the key definition or relationship, and connect it to the next Chemistry concept.</p><div class="focus"><b>What to learn</b><ul><li>Core meaning and terminology</li><li>Key relationship, rule or formula when applicable</li><li>How the idea appears in JEE Main / NEET questions</li></ul></div><button class="next" id="toMcq">I LEARNED IT → MCQ</button>';
 document.getElementById('toMcq').onclick=showMcq;
 mcqCard.style.display='none';
}
function findArrays(before){
 var out=[];
 Object.keys(window).forEach(function(k){if(before.indexOf(k)<0){var v=window[k];if(Array.isArray(v)&&v.length&&typeof v[0]==='object')out.push(v);}});
 return out;
}
function normalize(q){
 if(!q)return null;
 var text=q.question||q.q||q.text||q.questionText||q.prompt;
 var opts=q.options||q.choices||q.answers;
 var ans=q.answer;
 if(typeof ans==='string'&&opts){var ai=opts.findIndex(function(x){return String(x).toLowerCase()===ans.toLowerCase();});if(ai>=0)ans=ai;}
 if(typeof ans==='string'&&/^[ABCD]$/i.test(ans))ans=ans.toUpperCase().charCodeAt(0)-65;
 if(typeof ans!=='number')ans=q.correctIndex??q.correct??q.correctAnswer;
 if(typeof opts==='object'&&opts&&!Array.isArray(opts)){opts=Object.values(opts);}
 if(!text||!Array.isArray(opts)||opts.length<2||typeof ans!=='number')return null;
 return {question:String(text),options:opts.map(String),answer:ans,explanation:q.explanation||q.explain||q.solution||'Review the concept and the relationship tested in this question.'};
}
function loadBank(c){
 return new Promise(function(resolve){
  var before=Object.keys(window),file=slug(c.parent_concept||c.title)+'-question-bank.js',sc=document.createElement('script');
  sc.src=file+'?v=20260921-flow10';sc.onload=function(){var arr=findArrays(before),qs=[];arr.forEach(function(a){a.forEach(function(q){var n=normalize(q);if(n)qs.push(n);});});resolve(qs);};
  sc.onerror=function(){resolve([]);};document.head.appendChild(sc);
 });
}
async function showMcq(){
 conceptCard.style.display='none';mcqCard.style.display='block';mcqCard.innerHTML='<div class="eyebrow">MCQ • CONCEPT '+(step+1)+'</div><p>Loading a question from the existing question bank…</p>';
 currentQuestions=await loadBank(steps[step]);currentIndex=0;answered=false;
 if(!currentQuestions.length){mcqCard.innerHTML='<div class="error"><b>No dedicated MCQ bank found for this concept yet.</b><br>Use the existing question bank for this topic, then continue to the next concept.</div><a class="home" href="question-bank.html?subject=chemistry&topic='+encodeURIComponent(steps[step].parent_concept)+'">OPEN TOPIC MCQ BANK</a><button class="mcqNext" style="display:block" id="continueFallback">CONTINUE TO NEXT CONCEPT →</button>';document.getElementById('continueFallback').onclick=nextStep;return;}
 renderQuestion();
}
function renderQuestion(){
 var q=currentQuestions[currentIndex];
 mcqCard.innerHTML='<div class="eyebrow">MCQ • '+esc(steps[step].parent_concept)+'</div><h2>Question '+(currentIndex+1)+'</h2><div class="question">'+esc(q.question)+'</div><div class="options">'+q.options.map(function(o,i){return '<button class="option" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>';}).join('')+'</div><div id="feedback" class="feedback" style="display:none"></div><button id="mcqNext" class="mcqNext">NEXT CONCEPT →</button>';
 mcqCard.querySelectorAll('.option').forEach(function(btn){btn.onclick=function(){answer(Number(btn.dataset.i),q);};});
}
function answer(i,q){
 if(answered)return;answered=true;
 var opts=mcqCard.querySelectorAll('.option');opts.forEach(function(b){b.disabled=true;});
 opts[q.answer]?.classList.add('correct');var ok=i===q.answer;if(!ok)opts[i]?.classList.add('wrong');if(ok)score++;
 var fb=document.getElementById('feedback');fb.style.display='block';fb.innerHTML=(ok?'✅ Correct. ':'❌ Not quite. ')+'<b>'+esc(q.explanation)+'</b>';
 var nb=document.getElementById('mcqNext');nb.style.display='block';nb.onclick=nextStep;scoreEl.textContent=score+' / '+(step+1);
}
function nextStep(){
 step++;
 if(step>=10){bar.style.width='100%';stepLabel.textContent='10 CONCEPTS COMPLETED';finish.style.display='block';conceptCard.style.display='none';mcqCard.style.display='none';finish.innerHTML='<div style="font-size:42px">🏆</div><h2>10 Concepts Completed</h2><p>You completed the Learn → MCQ sequence for 10 Chemistry concepts.</p><p><b>Score: '+score+' / 10</b></p><a class="home" href="chemistry-home.html">CONTINUE CHEMISTRY PATH</a>';return;}
 updateProgress();makeLesson(steps[step]);window.scrollTo({top:0,behavior:'smooth'});
}
async function init(){
 try{
  var r=await fetch('data/chemistry-content-map.json?v=5');var data=await r.json();
  data.chapters.forEach(function(ch){(ch.learn_concepts||[]).forEach(function(c){map.push({...c,chapter_name:ch.name,chapter_id:ch.chapter_id});});});
  var idx=map.findIndex(function(c){return c.title===start||c.title.toLowerCase()===start.toLowerCase();});
  if(idx<0)idx=map.findIndex(function(c){return c.title.toLowerCase().indexOf(start.toLowerCase())===0;});
  if(idx<0)idx=0;
  steps=map.slice(idx,idx+10);if(steps.length<10)steps=steps.concat(map.slice(0,10-steps.length));
  updateProgress();makeLesson(steps[0]);
 }catch(e){conceptCard.innerHTML='<div class="error">Chemistry content could not load. Please refresh the page.</div>';}
}
init();
})();
</script>
</body>
</html>
