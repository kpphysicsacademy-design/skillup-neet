function slugify(s){return s.toLowerCase().trim().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function normalizeBank(v){
 if(!Array.isArray(v))return null;
 const out=[];
 for(const x of v){
   if(Array.isArray(x)&&typeof x[0]==='string'&&Array.isArray(x[1])){
     const a=Number(x[2]); if(Number.isInteger(a)&&a>=0&&a<x[1].length)out.push([x[0],x[1].slice(),a,typeof x[3]==='string'?x[3]:'']);
   }else if(x&&typeof x.q==='string'&&Array.isArray(x.o)){
     let a=typeof x.a==='number'?x.a:(typeof x.a==='string'?x.a.charCodeAt(0)-65:-1);
     if(a>=0&&a<x.o.length)out.push([x.q,x.o.slice(),a,typeof x.e==='string'?x.e:'']);
   }else if(x&&typeof x.question==='string'&&Array.isArray(x.options)){
     const opts=x.options.map(o=>typeof o==='string'?o:(o&&typeof o.value==='string'?o.value:null)).filter(o=>o!==null);
     if(opts.length===x.options.length){
       let a=-1;
       if(typeof x.answer==='number') a=x.answer;
       else if(typeof x.answer==='string'){
         const ans=x.answer.trim().toUpperCase();
         if(/^[A-Z]$/.test(ans)) a=ans.charCodeAt(0)-65;
         else { const n=Number(ans); if(Number.isInteger(n)) a=n; }
       }
       if(Number.isInteger(a)&&a>=0&&a<opts.length)out.push([x.question,opts,a,typeof x.explanation==='string'?x.explanation:'']);
     }
   }
 }
 return out.length?out:null;
}

 });
}
async function loadExistingBank(){

 if(preferred)names.push(preferred);
 if(micro)names.push(slugify(micro));
 if(bankAliases[key])names.push(bankAliases[key]);
 const unique=[...new Set(names)];
 for(const name of unique){
   try{

       if(before.has(k))continue;

 }
 return null;
}
