<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Chemistry | Practice</title>
<style>
:root{--g:#58cc02;--gd:#46a900;--n:#17324d;--m:#65798c;--line:#dbe8f5;--bg:#f7fbff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#263238}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line)}.nav,.wrap{max-width:760px;margin:auto}.nav{height:60px;padding:0 14px;display:flex;align-items:center;gap:10px}.back{border:1px solid var(--line);border-radius:12px;padding:8px 11px;text-decoration:none;color:var(--n);font-weight:900}.brand{font-weight:950;color:var(--n)}.brand small{display:block;font-size:8px;letter-spacing:1px;color:#6b8297}.wrap{padding:16px 14px 60px}.steps{display:flex;justify-content:space-between;font-size:11px;font-weight:900;color:var(--m)}.bar{height:8px;background:#e7eef4;border-radius:99px;margin:8px 0 18px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 8px 22px rgba(25,70,105,.07)}.tag{font-size:10px;letter-spacing:.9px;font-weight:950;color:#3d8d12;text-transform:uppercase}.q{font-size:21px;line-height:1.5;font-weight:850;color:var(--n);margin:12px 0 17px}.opts{display:grid;gap:11px}.opt{border:2px solid #cbdbea;border-bottom:4px solid #c5d7e8;border-radius:15px;background:#fff;padding:14px;text-align:left;font-size:15px;font-weight:750;color:var(--n);cursor:pointer}.opt.correct{background:#efffe5;border-color:var(--g)}.opt.wrong{background:#fff0f0;border-color:#ff6b6b}.feedback{display:none;margin-top:14px;padding:14px;border-radius:15px;background:#f4f8fc;border:1px solid #dfeaf4;line-height:1.55;font-size:14px}.next{display:none;width:100%;margin-top:15px;border:0;border-radius:15px;padding:15px;background:var(--g);color:#fff;font-size:16px;font-weight:950;box-shadow:0 4px 0 var(--gd);cursor:pointer}.done{text-align:center}.done h1{color:var(--n)}.home{display:block;text-decoration:none;text-align:center;background:#eef5ff;color:#2458a8;border-radius:14px;padding:14px;font-weight:900;margin-top:12px}
</style></head><body>
<header class="top"><div class="nav"><a class="back" id="back">← Learn</a><span>🎯</span><div class="brand">SkillUp<small>CHEMISTRY • PRACTICE</small></div></div></header>
<main class="wrap"><div class="steps"><span id="label">MCQ 1 OF 10</span><span id="score">0 / 1</span></div><div class="bar"><i id="bar"></i></div><section class="card" id="card"></section></main>
<script>
(async()=>{const p=new URLSearchParams(location.search),concept=(p.get('concept')||'Matter and Its Nature').replace(/\+/g,' '),step=Number(p.get('step')||1),start=p.get('start')||'matter and its nature';let qs=[
{q:'Which statement correctly describes matter?',o:['It has mass and occupies space','It has no mass but occupies space','It has mass but never occupies space','Only solids are matter'],a:0,e:'Matter is defined as anything that has mass and occupies space.'},
{q:'Which particle idea helps explain why gases are easily compressed?',o:['Particles are very large','Particles have relatively large spaces between them','Particles do not move','Particles have no attraction'],a:1,e:'Gas particles are relatively far apart, leaving substantial empty space.'},
{q:'When ice melts to water, which statement is correct?',o:['A new chemical substance is necessarily formed','The chemical identity of H₂O remains the same','Matter disappears','Atoms are destroyed'],a:1,e:'Melting is a physical change; H₂O remains H₂O.'}
];
let idx=0,answered=false;
document.getElementById('back').href='chemistry-concept.html?concept='+encodeURIComponent(concept)+'&step='+step+'&start='+encodeURIComponent(start);
document.getElementById('label').textContent='MCQ '+step+' OF 10';document.getElementById('bar').style.width=(step*10)+'%';
function render(){const q=qs[idx];document.getElementById('card').innerHTML='<div class="tag">Concept '+step+' • Check</div><div class="q">'+q.q+'</div><div class="opts">'+q.o.map((x,i)=>'<button class="opt" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+x+'</button>').join('')+'</div><div class="feedback" id="fb"></div><button class="next" id="next">NEXT CONCEPT →</button>';document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i,q));document.getElementById('next').onclick=next}
function answer(i,q){if(answered)return;answered=true;document.querySelectorAll('.opt').forEach(b=>b.disabled=true);document.querySelectorAll('.opt')[q.a].classList.add('correct');if(i!==q.a)document.querySelectorAll('.opt')[i].classList.add('wrong');const fb=document.getElementById('fb');fb.style.display='block';fb.innerHTML=(i===q.a?'✅ Correct. ':'❌ Review this. ')+q.e;document.getElementById('next').style.display='block'}
function next(){if(step>=10){document.getElementById('card').innerHTML='<div class="done"><div style="font-size:48px">🏆</div><h1>10 Lessons Complete</h1><p>You completed the Learn → MCQ journey.</p><a class="home" href="chemistry-home.html">CONTINUE CHEMISTRY PATH</a></div>';return}location.href='chemistry-concept.html?concept='+encodeURIComponent(nextConcept())+'&step='+(step+1)+'&start='+encodeURIComponent(start)}
async function nextConcept(){return concept}
render();
})();
</script></body></html>
