<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Chemistry Concept MCQ</title><style>body{margin:0;background:#f7fbff;font-family:system-ui;color:#17324d}.wrap{max-width:700px;margin:auto;padding:25px 15px}.card{background:#fff;border:1px solid #dbe8f5;border-radius:22px;padding:22px}.q{font-size:20px;font-weight:800;line-height:1.5}.o{display:block;width:100%;margin:10px 0;padding:14px;text-align:left;border:2px solid #cbdbea;border-radius:14px;background:#fff;font-weight:700}.ok{background:#efffe5;border-color:#58cc02}.bad{background:#fff0f0;border-color:#ff6b6b}.btn{display:block;width:100%;margin-top:15px;padding:15px;border:0;border-radius:14px;background:#58cc02;color:#fff;font-weight:900;text-decoration:none;text-align:center}</style></head><body><main class="wrap"><section class="card" id="app"></section></main><script>
const p=new URLSearchParams(location.search),concept=(p.get('concept')||'').trim();
const bank={
"What is matter?":[["What is matter?",["Anything that has mass and occupies space","Only solids","Anything visible","Only living things"],0]],
"Matter is particulate":[["Matter is made of extremely small particles such as:",["Atoms, molecules and ions","Only cells","Only liquids","Only gases"],0]],
"Particles have spaces":[["Why can gases be compressed much more easily than solids?",["Gases have larger spaces between particles","Gas particles have no mass","Solid particles do not exist","Gas particles never move"],0]],
"Particles are always moving":[["What generally happens to the average kinetic energy of particles when temperature increases?",["It generally increases","It becomes zero","It always decreases","It disappears"],0]],
"Particles attract each other":[["What type of interaction exists between particles of matter?",["Attractive interactions","No interactions","Only magnetic interactions","Only gravitational interactions"],0]],
"States of matter":[["Which state has fixed volume but takes the shape of its container?",["Solid","Liquid","Gas","None"],1]],
"Physical and chemical nature":[["Which is a physical property?",["Ability to react with oxygen","Density","Flammability","Ability to rust"],1]],
"Daily-life connection":[["Melting ice is best classified as:",["A physical change","A chemical change","A nuclear change","No change"],0]],
"atom molecule element compound":[["What is the smallest particle of an element that retains its chemical identity?",["Atom","Molecule","Compound","Mixture"],0],["Which is a molecule of an element?",["H₂","H₂O","NaCl","CO₂"],0],["Which statement defines an element?",["A pure substance made of one kind of atom","Two different elements chemically combined","Any group of atoms","A mixture of substances"],0],["Which is a compound?",["O₂","Na","H₂O","He"],2]]
};
const qs=bank[concept]||bank[concept.toLowerCase()]||null;
if(!qs){document.getElementById('app').innerHTML='<h2>Concept not found</h2><p>Please return to the Chemistry path and select a concept.</p><a class="btn" href="chemistry-home.html">← CHEMISTRY PATH</a>';}
else{
 let s=Math.max(1,Math.min(qs.length,Number(p.get('step')||1))),q=qs[s-1];
 document.getElementById('app').innerHTML='<p><b>CONCEPT MCQ • '+s+' OF '+qs.length+'</b></p><h1>'+concept+'</h1><div class="q">'+q[0]+'</div><div id="opts">'+q[1].map((x,i)=>'<button class="o" onclick="ans('+i+')">'+String.fromCharCode(65+i)+'. '+x+'</button>').join('')+'</div><div id="fb"></div>';
 window.ans=i=>{document.querySelectorAll('.o').forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('ok');if(j===i&&i!==q[2])b.classList.add('bad')});document.getElementById('fb').innerHTML='<p>'+(i===q[2]?'✅ Correct!':'❌ Review this concept and try again.')+'</p><a class="btn" href="'+(s<qs.length?'chemistry-mcq.html?concept='+encodeURIComponent(concept)+'&step='+(s+1):'chemistry-home.html')+'">'+(s<qs.length?'NEXT MCQ →':'FINISH CONCEPT →')+'</a>';};
}
</script></body></html>
