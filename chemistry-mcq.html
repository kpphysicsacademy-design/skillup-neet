<style>
:root{--b:#1677ff;--n:#17324d;--m:#6b7280;--l:#dbe8f5;--bg:#f5f9ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#263238;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--l)}
.nav,.wrap{max-width:900px;margin:auto}
.nav{height:60px;padding:0 14px;display:flex;align-items:center;gap:9px}
.back{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--l);border-radius:12px;background:#eef6ff;text-decoration:none;color:var(--n);font-size:23px;box-shadow:0 3px 0 #c5d9ee}
.brand{font-weight:950;color:var(--n)}
.brand small{display:block;font-size:8px;letter-spacing:1px;color:#6480a0}
.wrap{padding:18px 13px 60px}
.hero,.q,.result,.status{background:#fff;border:1px solid var(--l);border-radius:18px;padding:18px;margin-bottom:14px}
h1{margin:0 0 5px;color:var(--n);font-size:clamp(23px,5vw,32px)}
.muted{color:var(--m);font-size:11px;line-height:1.5}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.pill{background:#eef6ff;color:#315b86;border-radius:99px;padding:6px 9px;font-size:9px;font-weight:900}
.progress{height:9px;background:#e6eef7;border-radius:99px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;width:0;background:var(--b)}
.qnum{font-size:10px;color:var(--m);font-weight:900;text-transform:uppercase}
.q h2{font-size:19px;line-height:1.55;margin:8px 0 14px;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.options{display:grid;gap:9px}
.opt{width:100%;min-width:0;text-align:left;white-space:normal;overflow-wrap:anywhere;word-break:break-word;border:2px solid #d8e4f0;border-bottom:4px solid #c4d5e6;border-radius:13px;padding:12px;background:#fff;cursor:pointer;font-weight:750;font-size:14px}
.opt.correct{border-color:#58cc02;background:#efffe5}
.opt.wrong{border-color:#ff4b4b;background:#ffe5e5}
.opt:disabled{cursor:default}
.feedback{display:none;margin-top:12px;padding:12px;border-radius:12px;font-size:12px;line-height:1.5}
.feedback.show{display:block}
.ok{background:#efffe5;border:1px solid #b7e892}
.no{background:#ffe5e5;border:1px solid #ffb3b3}
.next{display:none;width:100%;border:0;border-radius:13px;padding:13px;margin-top:12px;background:var(--b);color:#fff;font-weight:900;cursor:pointer}
.next.show{display:block}
.score{text-align:center;font-size:44px;font-weight:950;color:var(--n)}
.warn{color:#8a5b00;background:#fff7df;border:1px solid #efdca3;border-radius:12px;padding:11px;font-size:11px;margin-top:10px}

.concept-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:13px}.concept-actions a{display:flex;align-items:center;justify-content:center;min-height:44px;padding:10px 12px;border:1px solid #b9dced;border-radius:13px;background:linear-gradient(135deg,#eaf7ff,#f0edff);color:#116b96;text-decoration:none;font-size:12px;font-weight:900}.hero{background:linear-gradient(135deg,#fff 0%,#edf7ff 58%,#f2efff 100%)}.q{box-shadow:0 8px 24px #17324d0c}.qnum{display:inline-flex;background:#eaf3ff;color:#2365a4;border-radius:99px;padding:6px 10px}.opt{display:flex;align-items:flex-start;gap:10px;line-height:1.45;transition:border-color .15s,background .15s}.opt:before{content:attr(data-letter);flex:0 0 25px;height:25px;display:grid;place-items:center;border-radius:8px;background:#edf4fc;color:#315b86;font-size:11px;font-weight:950}.opt.correct:before{background:#d9f7c5;color:#286900}.opt.wrong:before{background:#ffd9d9;color:#a11}.feedback{font-size:13px}.result{background:linear-gradient(145deg,#fff,#eff7ff)}.score{font-variant-numeric:tabular-nums}.review-item{padding:12px;border:1px solid var(--l);border-radius:12px;margin-top:9px;font-size:12px;line-height:1.5}.review-item b{color:var(--n)}@media(max-width:520px){.wrap{padding:12px 10px 36px}.hero,.q,.result,.status{padding:14px;border-radius:15px}.q h2{font-size:17px;line-height:1.45}.opt{padding:10px;font-size:13px}}
</style>
<style>.skillup-reaction{display:block;max-width:100%;overflow-x:auto;overflow-y:hidden;padding:8px 4px;text-align:center;line-height:1.9}.skillup-equation{display:block;max-width:100%;overflow-x:auto;overflow-y:hidden;padding:8px 4px;text-align:center;line-height:1.9;font-size:1.08em}.skillup-inline-equation{display:inline-block;max-width:100%;overflow-x:auto;vertical-align:middle}.skillup-chem-inline{display:inline-block;max-width:100%;overflow-x:auto;vertical-align:middle}.skillup-chem-image{display:block;max-width:100%;height:auto;max-height:150px;margin:6px auto;object-fit:contain}mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}</style><script>window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]],displayMath:[["\\[","\\]"],["$$","$$"]],packages:{"[+]":["mhchem"]}},loader:{load:["[tex]/mhchem"]},options:{skipHtmlTags:["script","noscript","style","textarea","pre","code"]}};</script><script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" defer></script></head><body>
<header class="top"><div class="nav">
<a class="back" href="chemistry-home.html" aria-label="Back to Chemistry Path" title="Back to Chemistry Path">⚗️</a>
<div class="brand">SkillUp<small>CHEMISTRY • CONCEPT QUIZ</small></div>
</div></header>
<main class="wrap">
<section class="hero">
<h1 id="title">Chemistry Quiz</h1>
<div class="muted" id="subtitle">Loading concept question bank…</div>
<div class="concept-actions"><a id="learnLink" href="chemistry-matter-and-its-nature-learn.html">📘 Learn / Cheat Sheet</a><a href="chemistry-home.html">🧪 Chemistry Path</a></div>
<div class="meta"><span class="pill" id="bankCount">Loading…</span><span class="pill">🧠 Concept Quiz</span><span class="pill">📘 Practice</span></div>
<div class="progress"><i id="bar"></i></div>
</section>
<div id="content"></div>
</main>
<script>
(function(){
'use strict';
var params=new URLSearchParams(location.search);
var concept=params.get('concept')||'';
var micro=params.get('micro')||'';
var learnLink=document.getElementById('learnLink');
if(learnLink){var learnSlug=String(concept||'').toLowerCase().trim().replace(/&/g,' and ').replace(/['’]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');learnLink.href='chemistry-'+learnSlug+'-learn.html';}
var title=document.getElementById('title');
var subtitle=document.getElementById('subtitle');
var bankCount=document.getElementById('bankCount');
var content=document.getElementById('content');
var bar=document.getElementById('bar');
var items=[],i=0,score=0,wrongAnswers=[];
window.SKILLUP_CHEMISTRY_BANK=window.SKILLUP_CHEMISTRY_BANK||{};
var BANK_VERSION='20261120-matter-nature-quiz-smart-v1';

function esc(v){return String(v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function richText(v){
 var s=esc(v);
 s=s.replace(/\[\[image:([^|\]]+)(?:\|([^\]]+))?\]\]/g,function(_,src,alt){
 var imageSrc=String(src||'').trim();
 if(/^assets\//i.test(imageSrc)) imageSrc='https://raw.githubusercontent.com/kpphysicsacademy-design/skillup-neet/main/'+imageSrc;
 return '<img class="skillup-chem-image" src="'+esc(imageSrc)+'" alt="'+esc(alt||'Chemical structure')+'" loading="lazy">';
});
 s=s.replace(/\[\[reaction:([\s\S]+?)\]\]/g,'<div class="skillup-reaction">\\(\\ce{$1}\\)</div>');
 s=s.replace(/\[\[chem:([\s\S]+?)\]\]/g,'<span class="skillup-chem-inline">\\(\\ce{$1}\\)</span>');
 s=s.replace(/\[\[formula:([\s\S]+?)\]\]/g,'<div class="skillup-equation">\\[$1\\]</div>');
 s=s.replace(/\$\$([\s\S]+?)\$\$/g,'<div class="skillup-equation">\\[$1\\]</div>');
 s=s.replace(/\\\(([\s\S]+?)\\\)/g,'<span class="skillup-inline-equation">\\($1\\)</span>');
 s=s.replace(/\$([^$\n]+)\$/g,'<span class="skillup-inline-equation">\\($1\\)</span>');
 return s;
}function slug(v){return String(v).toLowerCase().trim().replace(/&/g,' and ').replace(/['’]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
function candidates(v){
 var s=slug(v),out=[];
 if(s==='matter-and-its-nature')out.push('matter-and-its-nature-question-bank.js');
 else if(s)out.push(s+'-question-bank.js');
 if(micro){
   var m=slug(micro);
   if(m)out.push(m+'-question-bank.js');
 }
 return [...new Set(out)];
}
function isBank(v){
 return Array.isArray(v)&&v.length&&v.every(function(x){
  return x&&typeof x==='object'&&(
   (('q' in x)&&('o' in x)&&('a' in x)) ||
   (('question' in x)&&Array.isArray(x.options)&&('answer' in x))
  );
 });
}
function loadScript(src,requestedSlug){
 return new Promise(function(resolve,reject){
  var rawBase='https://raw.githubusercontent.com/kpphysicsacademy-design/skillup-neet/main/';
  var cdnBase='https://cdn.jsdelivr.net/gh/kpphysicsacademy-design/skillup-neet@main/';
  var bankPath='question-banks/'+src;
  var urls=['/'+bankPath,rawBase+bankPath,cdnBase+bankPath,src,rawBase+src,cdnBase+src],attempt=0,timer=null;
  function inspect(){
   var registry=window.SKILLUP_CHEMISTRY_BANK||{};
   var keys=[requestedSlug,slug(concept),slug(micro)].filter(Boolean);
   for(var ri=0;ri<keys.length;ri++){
    var direct=registry[keys[ri]];
    if(isBank(direct)){if(timer)clearTimeout(timer);resolve(direct);return true;}
   }
   return false;
  }
  function attemptLoad(){
   if(attempt>=urls.length){reject(new Error('bank unavailable'));return;}
   var url=urls[attempt++];
   var registry=window.SKILLUP_CHEMISTRY_BANK||{};
   var before={};
   Object.keys(window).forEach(function(k){before[k]=window[k];});
   var sc=document.createElement('script');
   sc.async=false;
   sc.src=url+(url.indexOf('?')>-1?'&':'?')+'v='+BANK_VERSION+'&cb=11&t='+Date.now();
   sc.crossOrigin='anonymous';
   var settled=false;
   function next(){
    if(settled)return;
    settled=true;
    if(timer)clearTimeout(timer);
    sc.remove();
    if(!inspect()){
     var found=[];
     Object.keys(window).forEach(function(k){
      if(before[k]===window[k])return;
      var v=window[k];
      if(isBank(v))found.push(v);
     });
     if(found.length){resolve(found[0]);return;}
     attemptLoad();
    }
   }
   sc.onload=next;
   sc.onerror=next;
   timer=setTimeout(next,7000);
   document.head.appendChild(sc);
  }
  attemptLoad();
 });
}
async function load(){
 title.textContent=concept||'Chemistry Quiz';
 if(!concept){showStatus('No concept was supplied. Return to the Chemistry path and select a concept.');return;}
 var files=candidates(micro||concept),bank=null;
 var bankKeys=[slug(micro||concept),slug(concept),slug(micro)].filter(Boolean);
 for(var n=0;n<files.length&&!bank;n++){
  for(var bk=0;bk<bankKeys.length&&!bank;bk++){
   try{bank=await loadScript(files[n],bankKeys[bk]);}catch(e){}
  }
 }
 if(!bank){
  showStatus('A dedicated Chemistry question bank is not connected for this concept yet.');
  return;
 }
 items=bank.slice(0,30).map(function(item){
  var modern=Array.isArray(item.options);
  var x=Object.assign({},item);
  if(modern){
   x.q=item.question||'';
   x.o=item.options.map(function(opt){return typeof opt==='object'?opt.value:opt;});
   var answerId=typeof item.answer==='string'?item.answer:'';
   var answerIndex=item.options.findIndex(function(opt){return (typeof opt==='object'?opt.id:opt)===answerId;});
   x.a=answerIndex;
   x.e=item.explanation||'';
  }else{
   x.o=Array.isArray(item.o)?item.o.slice():[];
   var correct=typeof item.a==='number'?item.a:x.o.indexOf(item.a);
  }
  var order=x.o.map(function(_,idx){return idx;});
  for(var j=order.length-1;j>0;j--){
   var k=Math.floor(Math.random()*(j+1)),tmp=order[j];order[j]=order[k];order[k]=tmp;
  }
  x.o=order.map(function(idx){return x.o[idx];});
  x.a=order.indexOf(modern?answerIndex:correct);
  return x;
 });
 bankCount.textContent=items.length+' questions';
 subtitle.textContent=items.length===30?'30-question concept bank':'Dedicated bank currently contains '+items.length+' questions';
 if(items.length<30){
  subtitle.insertAdjacentHTML('afterend','<div class="warn">This is the source bank count currently present in GitHub. No duplicate filler questions are added automatically.</div>');
 }
 render();
}
function showStatus(msg){
 content.innerHTML='<section class="status"><b>Quiz unavailable</b><p class="muted">'+esc(msg)+'</p></section>';
 bankCount.textContent='Not connected';
}
function typeset(){if(window.MathJax&&window.MathJax.typesetPromise)window.MathJax.typesetPromise([content]).catch(function(){});}
function render(){
 if(i>=items.length){
  bar.style.width='100%';var pct=Math.round(score/items.length*100);
  content.innerHTML='<section class="result"><div style="font-size:48px;text-align:center">🏆</div><div class="score">'+score+' / '+items.length+'</div><p class="muted" style="text-align:center"><b>'+pct+'% accuracy</b><br>'+(pct>=85?'Excellent work!':pct>=60?'Good effort — revise the missed concepts.':'Keep practising — review the explanations and try again.')+'</p><div class="meta" style="justify-content:center"><span class="pill">✅ '+score+' correct</span><span class="pill">↻ '+wrongAnswers.length+' to revise</span></div><div id="review"></div><button class="next show" id="retry">🔄 Try Again</button></section>';
  document.getElementById('review').innerHTML=wrongAnswers.length?'<h3 style="color:var(--n);font-size:15px;margin:18px 0 8px">Quick revision</h3>'+wrongAnswers.map(function(w){return '<div class="review-item"><b>'+esc(w.q)+'</b><div>Correct answer: '+esc(w.answer)+'</div><div class="muted">'+esc(w.explanation)+'</div></div>';}).join(''):'<p class="muted" style="text-align:center">Perfect run — all answers correct!</p>';
  document.getElementById('retry').onclick=function(){i=0;score=0;wrongAnswers=[];render();scrollTo({top:0,behavior:'smooth'});};return;
 }
 var x=items[i],opts=x.o||[],ans=typeof x.a==='number'?x.a:opts.indexOf(x.a);
 bar.style.width=(i/items.length*100)+'%';
 content.innerHTML='<section class="q"><div class="qnum">QUESTION '+(i+1)+' / '+items.length+'</div><h2>'+richText(x.q)+'</h2><div class="options">'+opts.map(function(v,j){return '<button class="opt" data-j="'+j+'" data-letter="'+String.fromCharCode(65+j)+'">'+richText(v)+'</button>';}).join('')+'</div><div id="feedback" class="feedback"></div><button id="next" class="next">Next question →</button></section>';
 document.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){answer(+b.dataset.j,ans,x);};});
 typeset();
 document.getElementById('next').onclick=function(){i++;render();scrollTo({top:0,behavior:'smooth'});};
}
function answer(choice,ans,x){
 var bs=[...document.querySelectorAll('.opt')],f=document.getElementById('feedback');
 bs.forEach(function(b){b.disabled=true;});
 if(ans>=0&&bs[ans])bs[ans].classList.add('correct');
 var explanation=x.e||x.explanation||'';
 if(choice===ans){
  score++;
  f.className='feedback show ok';
  f.innerHTML='<b>✅ Correct</b><div>'+esc(explanation||'Your answer matches the correct option.')+'</div>';
 }else{
  if(bs[choice])bs[choice].classList.add('wrong');
  f.className='feedback show no';
  wrongAnswers.push({q:x.q,answer:(x.o||[])[ans]||x.a,explanation:explanation});f.innerHTML='<b>💡 Review this one</b><div>Correct answer: <strong>'+esc((x.o||[])[ans]||x.a)+'</strong></div><div>'+esc(explanation)+'</div>';
 }
 document.getElementById('next').classList.add('show');
 bar.style.width=((i+1)/items.length*100)+'%';
}
load();
})();
</script>

<script src="/skillup-eye-shield.js?v=20261013-eye-shield-v1"></script>
