.hero{padding:4px 2px 12px;margin:0 0 10px}
.hero h1{margin:0 0 4px;font-size:clamp(20px,3vw,25px);line-height:1.25;font-weight:850;color:var(--ink)}
.muted{color:var(--muted);font-size:12px;line-height:1.45;margin:0}
.topic-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 12px}
.topic-actions a{display:flex;align-items:center;justify-content:center;min-height:42px;padding:9px 12px;border:1px solid #b8deed;border-radius:10px;background:#eaf7ff;color:#116b96;text-decoration:none;font-size:12px;font-weight:850}

.track{height:5px;border-radius:8px;background:#e8edf0;overflow:hidden}

.option{display:flex;align-items:center;gap:10px;width:100%;min-width:0;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);text-align:left;font:700 14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;overflow-wrap:anywhere}
.option .letter{display:grid;place-items:center;flex:0 0 26px;width:26px;height:26px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:11px;font-weight:850}

.option.correct{border-color:#a9d994;background:#f0f9ec;color:#286b19}
.option.wrong{border-color:#efb6b6;background:#fff4f4;color:#9b3030}
.option:disabled{cursor:default;opacity:1}
.actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
.btn{width:100%;min-height:46px;border:0;border-radius:11px;padding:9px 12px;font-size:14px;font-weight:850;cursor:pointer}
.btn.check{background:#b8e2a8;color:#fff}
.btn.check:disabled{opacity:.55;cursor:not-allowed}
.btn.continue{display:none;background:var(--blue);color:#fff}
.btn.continue.show{display:block}
.feedback{display:none;margin:10px 0;padding:12px;border-radius:12px;font-size:13px;line-height:1.55}
.feedback.show{display:block}.feedback.good{background:#f0f9ec;color:#286b19}.feedback.bad{background:#fff4f4;color:#9b3030}
.finish{text-align:center;padding:20px 14px;background:linear-gradient(145deg,#fff,#f4fbff)}
.trophy{font-size:42px}.score{font-size:34px;font-weight:850;color:var(--ink)}.finish h2{margin:5px 0 8px}
.finish .btn{margin-top:12px;max-width:360px;background:var(--green);color:#fff}
.review{text-align:left;margin:14px 0 5px}.review-item{padding:11px;margin:8px 0;border:1px solid var(--line);border-radius:10px;background:#fff}.review-item p{margin:4px 0}
.your-answer{color:#9b3030}.correct-answer{color:#286b19}
.status{font-size:14px;line-height:1.5}
.skillup-reaction,.skillup-equation{display:block;max-width:100%;overflow-x:auto;overflow-y:hidden;padding:8px 4px;text-align:center;line-height:1.9}
.skillup-equation{font-size:1.08em}.skillup-inline-equation,.skillup-chem-inline{display:inline-block;max-width:100%;overflow-x:auto;vertical-align:middle}
.skillup-chem-image{display:block;max-width:100%;height:auto;max-height:150px;margin:6px auto;object-fit:contain}
mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media(max-width:520px){.nav{width:100%;padding:6px 10px;gap:6px}.brand{font-size:14px}.pill{font-size:10px;padding:5px 6px}main{width:100%;padding:10px 10px 28px}.quiz,.finish,.status{padding:14px}.question{font-size:19px}.option{min-height:46px;padding:9px 10px;font-size:13px}.topic-actions{gap:7px}.topic-actions a{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}

<script>
(function(){
'use strict';
const params=new URLSearchParams(location.search);
const concept=params.get('concept')||'Matter and Its Nature';
const micro=params.get('micro')||'matter-and-its-nature';
const slug=v=>String(v).toLowerCase().trim().replace(/&/g,' and ').replace(/['’]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const $=id=>document.getElementById(id);
$('title').textContent=concept;
$('learnLink').href='chemistry-'+slug(concept)+'-learn.html';
window.SKILLUP_CHEMISTRY_BANK=window.SKILLUP_CHEMISTRY_BANK||{};
const BANK_VERSION='20261120-matter-nature-maths-quiz-architecture-v1';
let questions=[],originalQuestions=[],index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function richText(v){
 let s=esc(v);
 s=s.replace(/\\[\\[image:([^|\\]]+)(?:\\|([^\\]]+))?\\]\\]/g,(_,src,alt)=>{let p=String(src||'').trim();if(/^assets\\//i.test(p))p='https://raw.githubusercontent.com/kpphysicsacademy-design/skillup-neet/main/'+p;return '<img class="skillup-chem-image" src="'+esc(p)+'" alt="'+esc(alt||'Chemical structure')+'" loading="lazy">';});
 s=s.replace(/\\[\\[reaction:([\\s\\S]+?)\\]\\]/g,'<div class="skillup-reaction">\\\\(\\\\ce{$1}\\\\)</div>');
 s=s.replace(/\\[\\[chem:([\\s\\S]+?)\\]\\]/g,'<span class="skillup-chem-inline">\\\\(\\\\ce{$1}\\\\)</span>');
 s=s.replace(/\\[\\[formula:([\\s\\S]+?)\\]\\]/g,'<div class="skillup-equation">\\\\[$1\\\\]</div>');
 s=s.replace(/\\$\\$([\\s\\S]+?)\\$\\$/g,'<div class="skillup-equation">\\\\[$1\\\\]</div>');
 s=s.replace(/\\\\\\(([\\s\\S]+?)\\\\\\)/g,'<span class="skillup-inline-equation">\\\\($1\\\\)</span>');
 s=s.replace(/\\$([^$\\n]+)\\$/g,'<span class="skillup-inline-equation">\\\\($1\\\\)</span>');
 return s;
}
function isBank(v){return Array.isArray(v)&&v.length&&v.every(x=>x&&typeof x==='object'&&((('q'in x)&&('o'in x)&&('a'in x))||(('question'in x)&&Array.isArray(x.options)&&('answer'in x))));}
function loadScript(src,key){
 return new Promise((resolve,reject)=>{
  const raw='https://raw.githubusercontent.com/kpphysicsacademy-design/skillup-neet/main/';
  const cdn='https://cdn.jsdelivr.net/gh/kpphysicsacademy-design/skillup-neet@main/';
  const path='question-banks/'+src,urls=['/'+path,raw+path,cdn+path,src,raw+src,cdn+src];let at=0,timer=null;
  function inspect(){const reg=window.SKILLUP_CHEMISTRY_BANK||{};for(const k of [key,slug(concept),slug(micro)]){if(isBank(reg[k])){if(timer)clearTimeout(timer);resolve(reg[k]);return true;}}return false;}
  function next(){if(at>=urls.length){reject(new Error('Question bank unavailable'));return;}const before={};Object.keys(window).forEach(k=>before[k]=window[k]);const sc=document.createElement('script');sc.async=false;sc.src=urls[at++]+(urls[at-1].includes('?')?'&':'?')+'v='+BANK_VERSION+'&t='+Date.now();sc.crossOrigin='anonymous';let done=false;
   function finish(){if(done)return;done=true;if(timer)clearTimeout(timer);sc.remove();if(!inspect()){const found=Object.keys(window).filter(k=>before[k]!==window[k]&&isBank(window[k])).map(k=>window[k]);if(found.length)resolve(found[0]);else next();}}
   sc.onload=finish;sc.onerror=finish;timer=setTimeout(finish,7000);document.head.appendChild(sc);
  }next();
 });
}
function normalize(item){
 if(Array.isArray(item.options)){
  const opts=item.options.map(o=>typeof o==='object'?(o.text||o.label||o.value):o);
  const id=typeof item.answer==='string'?item.answer:'';
  const a=item.options.findIndex(o=>(typeof o==='object'?(o.id||o.value):o)===id);
  return {q:item.question||'',o:opts,a,why:item.explanation||item.why||''};
 }
 return {q:item.q||'',o:Array.isArray(item.o)?item.o.slice():[],a:typeof item.a==='number'?item.a:(item.o||[]).indexOf(item.a),why:item.e||item.why||item.explanation||''};
}
function shuffle(item){const order=item.o.map((_,n)=>n);for(let j=order.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[order[j],order[k]]=[order[k],order[j]];}return {...item,o:order.map(n=>item.o[n]),a:order.indexOf(item.a)};}
async function load(){
 const keys=[slug(micro),slug(concept)];
 const files=[...new Set(keys.map(k=>k+'-question-bank.js'))];
 let bank=null;
 for(let i=0;i<files.length&&!bank;i++)for(let j=0;j<keys.length&&!bank;j++){try{bank=await loadScript(files[i],keys[j]);}catch(e){}}
 if(!bank){$('question').textContent='Question bank unavailable';$('options').innerHTML='<p class="muted">This concept question bank could not be loaded. Please return to the Chemistry Path and try again.</p>';$('check').style.display='none';$('progressText').textContent='Not connected';return;}
 originalQuestions=bank.slice(0,30).map(normalize).filter(q=>q.q&&q.o.length>=2&&q.a>=0&&q.a<q.o.length);
 questions=originalQuestions.slice();
 if(!questions.length){$('question').textContent='No valid questions found';$('check').style.display='none';return;}
 $('subtitle').textContent=questions.length+' questions • Select an answer, check it, then continue.';
 render();
}
function render(){
 chosen=null;locked=false;const item=questions[index],pct=Math.round(index/questions.length*100);
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;$('percent').textContent=pct+'%';$('fill').style.width=pct+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(pct));
 $('qmeta').textContent='QUESTION '+(index+1)+' • MATTER AND ITS NATURE';
 $('question').innerHTML=richText(item.q);$('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;$('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((value,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.innerHTML=richText(value);b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
 if(window.MathJax&&window.MathJax.typesetPromise)window.MathJax.typesetPromise([$('question'),$('options')]).catch(()=>{});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.innerHTML='✨ Correct! '+richText(item.why||'Your answer matches the correct option.');}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.innerHTML='Not quite. '+richText(item.why||'Review the correct option above.')+' Correct answer: '+richText(item.o[item.a])+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
 if(window.MathJax&&window.MathJax.typesetPromise)window.MathJax.typesetPromise([feedback]).catch(()=>{});
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100),card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Matter and Its Nature Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="chemistry-home.html" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Chemistry Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const el=document.createElement('article');el.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;el.append(q,yours,correct,why);review.appendChild(el);});}
 else review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){if(onlyWrong&&wrongAttempts.length){const wrong=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrong);}else questions.splice(0,questions.length,...originalQuestions);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});}
 $('retry').addEventListener('click',()=>reset(false));$('retryWrong').addEventListener('click',()=>reset(true));
});
load();
})();
</script>
