<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dimensional Analysis and Applications — SkillUp NEET</title><style>body{font-family:system-ui;margin:0;background:#f6f8fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:20px}.hero,.card{background:#fff;border:1px solid #e2e7ef;border-radius:16px;padding:18px;margin:12px 0}.q{font-weight:700;line-height:1.5}.options{display:grid;gap:9px;margin-top:14px}.option{border:1px solid #d8dee8;border-radius:10px;padding:11px;cursor:pointer;background:#fff;text-align:left;width:100%}.option:disabled{cursor:default}.explanation{margin-top:8px;color:#475467;line-height:1.55}.tag{display:inline-block;padding:5px 9px;background:#eef2f7;border-radius:999px;font-size:12px;margin-right:5px}.count{color:#667085;margin-top:12px}.error{background:#fff1f1;border:1px solid #f3b3b3;border-radius:16px;padding:18px;margin:12px 0}.progress{height:8px;background:#e9edf3;border-radius:99px;overflow:hidden;margin-top:12px}.progress>i{display:block;height:100%;background:#315efb;width:0;transition:.2s}.feedback{margin-top:10px;padding:10px;border-radius:10px;font-weight:700}.correct{background:#ecfdf3;color:#067647}.wrong{background:#fff1f2;color:#b42318}.account{float:right;border:0;background:#eef2ff;color:#315efb;padding:7px 10px;border-radius:9px;font-weight:800;cursor:pointer}</style><script src="dimensional-analysis-and-applications-question-bank.js?v=20260909d"></script><script src="central-config.js?v=20260909d"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="central-auth.js?v=20260909d"></script></head><body><main class="wrap"><section class="hero"><button class="account" id="account" type="button">Account</button><h1>Dimensional Analysis and Applications</h1><p>NEET Physics • Dimensional reasoning • Duolingo-style practice</p><span class="tag">Physics</span><span class="tag">30 MCQs</span><div class="count" id="count"></div><div class="progress"><i id="progressBar"></i></div></section><section id="questions"></section></main><script>(async()=>{const next=location.href;const session=await window.SkillUpAuth.requireAuth(next);if(!session)return;document.getElementById('account').onclick=async()=>{if(confirm('Sign out of SkillUp?')){await window.SkillUpAuth.signOut();location.href='central-login.html?next='+encodeURIComponent(next)}};const questions=window.SkillUpMCQBanks&&window.SkillUpMCQBanks['dimensional analysis and applications']||[];const root=document.getElementById('questions');document.getElementById('count').textContent=questions.length+' MCQs loaded';if(!Array.isArray(questions)||questions.length!==30){root.innerHTML='<div class="error"><h3>Bank validation failed.</h3><p>Expected exactly 30 MCQs. Loaded: '+(Array.isArray(questions)?questions.length:0)+'</p></div>';return}let answered=0,correctCount=0;questions.forEach((x,i)=>{const card=document.createElement('article');card.className='card';const q=document.createElement('div');q.className='q';q.textContent=(i+1)+'. '+x.q;card.appendChild(q);const opts=document.createElement('div');opts.className='options';const feedback=document.createElement('div');x.o.forEach((o,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=String.fromCharCode(65+j)+'. '+o;b.onclick=async()=>{if(b.disabled)return;const isCorrect=j===x.a;opts.querySelectorAll('button').forEach(v=>v.disabled=true);feedback.className='feedback '+(isCorrect?'correct':'wrong');feedback.textContent=isCorrect?'✓ Correct! +1 XP':'✗ Not quite — review the explanation';const e=document.createElement('div');e.className='explanation';e.innerHTML='<b>Explanation:</b> '+x.e;card.appendChild(feedback);card.appendChild(e);answered++;if(isCorrect)correctCount++;document.getElementById('progressBar').style.width=Math.round(answered/questions.length*100)+'%';try{await window.SkillUpAuth.saveProgress({subject:'Physics',topic:'Dimensional Analysis and Applications',answered,correct:correctCount,xp:correctCount})}catch(err){console.warn('Progress sync pending:',err.message||err)}};opts.appendChild(b)});card.appendChild(opts);root.appendChild(card)})})()</script></body></html>
