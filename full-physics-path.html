<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="SkillUp NEET Physics — complete Class 11 and Class 12 chapter path with chapter tests.">
<title>SkillUp NEET Physics — Full Physics Path</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#172033;--muted:#667085;--brand:#315efb;--border:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.5}
header{padding:32px 18px;text-align:center;background:linear-gradient(135deg,#eef3ff,#fff)}h1{margin:0 0 8px;font-size:clamp(28px,6vw,46px)}header p{margin:0;color:var(--muted)}
main{max-width:1050px;margin:auto;padding:22px 16px 48px}.section{margin:24px 0}.section h2{font-size:24px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.chapter{display:block;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;text-decoration:none;color:inherit;transition:.15s}.chapter:hover{transform:translateY(-2px);border-color:var(--brand);box-shadow:0 6px 20px #0000000d}.num{font-size:12px;color:var(--brand);font-weight:700;text-transform:uppercase}.title{font-weight:750;margin-top:4px}.test{display:inline-block;margin-top:10px;color:var(--brand);font-size:14px;font-weight:650}.note{padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--muted)}
</style>
</head>
<body>
<header><h1>NEET Physics</h1><p>Complete chapter path • Class 11 + Class 12 • Chapter-wise tests</p></header>
<main>
<div class="note">Choose a chapter to open its dedicated test page. Each test is designed for SkillUp's Question → Options → Correct Answer → Specific Explanation format.</div>
<section class="section"><h2>Class 11 Physics</h2><div class="grid" id="class11"></div></section>
<section class="section"><h2>Class 12 Physics</h2><div class="grid" id="class12"></div></section>
</main>
<script>
const class11=[
['01','Physical World & Measurement'],['02','Kinematics'],['03','Laws of Motion'],['04','Work, Energy & Power'],['05','Motion of System of Particles & Rigid Body'],['06','Gravitation'],['07','Properties of Bulk Matter'],['08','Thermodynamics'],['09','Kinetic Theory'],['10','Oscillations'],['11','Waves']
];
const class12=[
['01','Electrostatics'],['02','Current Electricity'],['03','Magnetic Effects of Current & Magnetism'],['04','Electromagnetic Induction & Alternating Currents'],['05','Electromagnetic Waves'],['06','Optics'],['07','Dual Nature of Matter & Radiation'],['08','Atoms & Nuclei'],['09','Electronic Devices'],['10','Experimental Skills']
];
function render(id,items){document.getElementById(id).innerHTML=items.map(([n,t])=>`<a class="chapter" href="physics-chapter-test.html?chapter=${encodeURIComponent(t)}"><div class="num">Chapter ${n}</div><div class="title">${t}</div><span class="test">Open chapter test →</span></a>`).join('')}
render('class11',class11);render('class12',class12);
</script>
</body>
</html>
