<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp | IIT Mathematics Path</title>
<style>
:root{--b:#1677ff;--n:#123b70;--m:#667085;--l:#d9e5f2;--bg:#f5f9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#263238;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.top{background:#fff;border-bottom:1px solid var(--l);position:sticky;top:0;z-index:5}.nav{max-width:1050px;margin:auto;height:60px;padding:0 14px;display:flex;align-items:center;gap:10px}.brand{font-weight:950;color:var(--n)}.pill{margin-left:auto;background:#eaf8e6;color:#318600;padding:7px 10px;border-radius:999px;font-size:10px;font-weight:900}.wrap{max-width:1050px;margin:auto;padding:14px 10px 70px}.hero,.level,.chapter{background:#fff;border:1px solid var(--l);border-radius:18px}.hero{padding:20px;margin-bottom:14px}.hero h1{margin:0;color:var(--n);font-size:clamp(25px,6vw,36px)}.hero p{color:var(--m);line-height:1.55;font-size:12px}.search{width:100%;padding:12px;border:2px solid var(--l);border-radius:13px;font-size:13px}.level{margin:14px 0;padding:14px}.levelhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}.badge{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--b);color:#fff;font-weight:950;font-size:11px}.level h2{margin:0;color:var(--n);font-size:18px}.level small{color:var(--m);font-size:9px}.chapter{margin:9px 0;overflow:hidden}.chapterhead{padding:13px;cursor:pointer;display:flex;align-items:center;gap:10px}.chapterhead b{flex:1;color:#243b53;font-size:13px}.arrow{width:28px;height:28px;border-radius:50%;background:#eef6ff;color:var(--b);display:grid;place-items:center;font-weight:950}.concepts{display:none;padding:0 13px 13px;border-top:1px solid #edf2f7}.chapter.open .concepts{display:block}.concept{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #f0f3f6;font-size:11px}.num{min-width:25px;height:25px;border-radius:7px;background:#eef6ff;color:#32618f;display:grid;place-items:center;font-size:9px;font-weight:900}.conceptname{flex:1}.notation{margin-top:3px;font-size:9px;color:#7a8795}.empty{display:none;text-align:center;padding:20px;color:var(--m)}
</style>
<script src="iit-maths-path-curriculum.js?v=20261005"></script>
</head><body>
<header class="top"><div class="nav"><span>📐</span><span class="brand">SkillUp Mathematics</span><span class="pill">IIT-JEE</span></div></header>
<main class="wrap">
<section class="hero"><h1>IIT Mathematics Path</h1><p>Absolute foundation → core mathematics → JEE Main → JEE Advanced. Every chapter is broken into individual concepts so nothing is skipped.</p><input id="search" class="search" placeholder="Search chapters or concepts…"></section>
<div id="path"></div><div id="empty" class="empty">No matching concepts found.</div>
</main>
<script>
(function(){
var data=window.SKILLUP_IIT_MATHS_PATH||[],root=document.getElementById('path'),empty=document.getElementById('empty'),search=document.getElementById('search');
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function render(filter){
root.innerHTML='';var shown=0;
data.forEach(function(level){
var matches=[];
level[2].forEach(function(ch){var cs=ch[1].filter(function(x){return !filter||((ch[0]+' '+x).toLowerCase().indexOf(filter)>-1);});if(cs.length)matches.push([ch[0],cs]);});
if(!matches.length)return;shown++;
var sec=document.createElement('section');sec.className='level';
var h='<div class="levelhead"><span class="badge">'+esc(level[0].replace('LEVEL ',''))+'</span><div><h2>'+esc(level[1])+'</h2><small>'+matches.length+' chapters</small></div></div>';
matches.forEach(function(ch){
h+='<article class="chapter"><div class="chapterhead"><b>'+esc(ch[0])+'</b><span class="arrow">+</span></div><div class="concepts">'+ch[1].map(function(x,i){return '<div class="concept"><span class="num">'+(i+1)+'</span><div class="conceptname">'+esc(x)+'<div class="notation">Notation • pronunciation • meaning • usage will be taught with this concept.</div></div></div>';}).join('')+'</div></article>';
});
sec.innerHTML=h;root.appendChild(sec);
});
empty.style.display=shown?'none':'block';
root.querySelectorAll('.chapterhead').forEach(function(h){h.onclick=function(){var c=h.parentElement;c.classList.toggle('open');h.querySelector('.arrow').textContent=c.classList.contains('open')?'−':'+';};});
}
render('');
search.oninput=function(){render(search.value.trim().toLowerCase());};
})();
</script></body></html>
