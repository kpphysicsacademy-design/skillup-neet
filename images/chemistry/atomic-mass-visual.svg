<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Atomic mass and carbon-12 reference</title><desc id="d">A carbon-12 atom is shown as twelve mass units, with one-twelfth highlighted as one unified atomic mass unit. Isotopes contribute to a weighted average.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e8f7ff"/><stop offset="1" stop-color="#f2edff"/></linearGradient><linearGradient id="n" x2="1" y2="1"><stop stop-color="#ff9b72"/><stop offset="1" stop-color="#ed5a7b"/></linearGradient></defs><rect width="900" height="500" rx="34" fill="url(#bg)"/><text x="55" y="65" font-family="Arial" font-size="30" font-weight="700" fill="#203c58">THE ATOMIC MASS SCALE</text><text x="55" y="101" font-family="Arial" font-size="18" fill="#52718a">Carbon-12 is the common reference</text><circle cx="245" cy="260" r="122" fill="#fff" opacity=".75"/><circle cx="245" cy="260" r="92" fill="none" stroke="#6e9fc3" stroke-width="5" stroke-dasharray="9 8"/><g fill="url(#n)" stroke="#fff" stroke-width="4"><circle cx="245" cy="260" r="23"/><circle cx="202" cy="223" r="19"/><circle cx="284" cy="218" r="19"/><circle cx="199" cy="282" r="19"/><circle cx="287" cy="286" r="19"/><circle cx="241" cy="210" r="18"/><circle cx="246" cy="310" r="18"/></g><g fill="#5d91c0" stroke="#fff" stroke-width="3"><circle cx="226" cy="251" r="15"/><circle cx="265" cy="250" r="15"/><circle cx="225" cy="294" r="15"/><circle cx="268" cy="300" r="15"/><circle cx="245" cy="276" r="15"/></g><text x="245" y="420" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#203c58">¹²C = 12 u</text><path d="M390 260 H480" stroke="#6a91b4" stroke-width="5" stroke-linecap="round"/><path d="M465 245 L482 260 L465 275" fill="none" stroke="#6a91b4" stroke-width="5" stroke-linecap="round"/><rect x="505" y="155" width="330" height="105" rx="22" fill="#fff" stroke="#c6e4f2" stroke-width="3"/><text x="535" y="195" font-family="Arial" font-size="20" fill="#52718a">ONE ATOMIC MASS UNIT</text><text x="535" y="238" font-family="Arial" font-size="34" font-weight="700" fill="#1379a6">1 u = ¹⁄₁₂ × mass of ¹²C</text><rect x="505" y="285" width="330" height="115" rx="22" fill="#fff" stroke="#ddd2fb" stroke-width="3"/><text x="535" y="326" font-family="Arial" font-size="20" fill="#6a5c99">ISOTOPES → AVERAGE</text><text x="535" y="366" font-family="Arial" font-size="22" font-weight="700" fill="#5945a5">Σ (isotopic mass × fraction)</text><text x="535" y="390" font-family="Arial" font-size="14" fill="#6d6a83">Weighted by natural abundance</text></svg>