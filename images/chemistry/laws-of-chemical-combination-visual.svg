<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250"><rect width="720" height="250" rx="22" fill="#eef6ff"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="28" y="34" width="195" height="142" rx="16" fill="#fff" stroke="#c8dff0" stroke-width="3"/><text x="125" y="70" font-size="19" font-weight="700" fill="#24577e">Conservation</text><text x="125" y="105" font-size="27" font-weight="700" fill="#397db0">12 g + 32 g</text><text x="125" y="139" font-size="22" fill="#397db0">= 44 g</text><rect x="263" y="34" width="195" height="142" rx="16" fill="#fff" stroke="#c8dff0" stroke-width="3"/><text x="360" y="70" font-size="19" font-weight="700" fill="#24577e">Definite ratio</text><text x="360" y="111" font-size="28" font-weight="700" fill="#397db0">H₂O</text><text x="360" y="143" font-size="20" fill="#397db0">H : O = 1 : 8</text><rect x="498" y="34" width="195" height="142" rx="16" fill="#fff" stroke="#c8dff0" stroke-width="3"/><text x="595" y="70" font-size="19" font-weight="700" fill="#24577e">Multiple ratio</text><text x="595" y="111" font-size="25" font-weight="700" fill="#397db0">CO / CO₂</text><text x="595" y="143" font-size="20" fill="#397db0">O mass = 1 : 2</text><text x="360" y="218" font-size="17" fill="#536b82">Chemical laws describe fixed and simple quantitative relationships</text></g></svg>