<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Least Count — Physics Question Bank</title><style>body{font-family:system-ui;margin:0;background:#f6f8fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:20px}.hero,.card{background:#fff;border:1px solid #e2e7ef;border-radius:16px;padding:18px;margin:12px 0}.q{font-weight:700;line-height:1.5}.options{display:grid;gap:9px;margin-top:14px}.option{border:1px solid #d8dee8;border-radius:10px;padding:11px;cursor:pointer;background:#fff;text-align:left;width:100%}.option:disabled{cursor:default}.explanation{margin-top:8px;color:#475467;line-height:1.55}.count{color:#667085;margin-top:12px}.progress{height:8px;background:#e9edf3;border-radius:99px;overflow:hidden;margin-top:12px}.progress>i{display:block;height:100%;background:#315efb;width:0;transition:.2s}.feedback{margin-top:10px;padding:10px;border-radius:10px;font-weight:700}.correct{background:#ecfdf3;color:#067647}.wrong{background:#fff1f2;color:#b42318}</style><script src="least-count-neet-question-bank.js?v=20260909lc"></script></head><body><main class="wrap"><section class="hero"><h1>Least Count — Physics Question Bank</h1><p>NEET Physics • Measurement and experimental skills • Replacement bank</p><div class="count" id="count"></div><div class="progress"><i id="progressBar"></i></div></section><section id="questions"></section></main><script>(function(){const questions=window.SkillUpMCQBanks&&window.SkillUpMCQBanks['least count']||[];const root=document.getElementById('questions');document.getElementById('count').textContent=questions.length+' verified MCQs • Duolingo-style practice';if(!Array.isArray(questions)||questions.length!==30){root.innerHTML='<div class="card"><h3>Question bank unavailable</h3><p>The replacement bank must contain exactly 30 MCQs.</p></div>';return}let answered=0,correct=0;questions.forEach((x,i)=>{const card=document.createElement('article');card.className='card';const q=document.createElement('div');q.className='q';q.textContent=(i+1)+'. '+x.q;card.appendChild(q);const opts=document.createElement('div');opts.className='options';x.o.forEach((o,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=String.fromCharCode(65+j)+'. '+o;b.onclick=()=>{opts.querySelectorAll('button').forEach(v=>v.disabled=true);const ok=j===x.a;b.classList.add(ok?'correct':'wrong');if(ok)correct++;answered++;const fb=document.createElement('div');fb.className='feedback '+(ok?'correct':'wrong');fb.textContent=ok?'✓ Correct! +1 XP':'✗ Not quite — review the explanation';const e=document.createElement('div');e.className='explanation';e.innerHTML='<b>Explanation:</b> '+x.e;card.appendChild(fb);card.appendChild(e);document.getElementById('progressBar').style.width=Math.round(answered/questions.length*100)+'%'};opts.appendChild(b)});card.appendChild(opts);root.appendChild(card)})})();</script></body></html>
