</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>30 questions · 3 levels</span></div><main><section class="hero"><h1>3D Shapes &amp; Nets</h1><p class="muted">Explore solid shapes, count faces, edges and vertices, and understand how flat nets fold into 3D objects.</p><div class="topic-actions"><a href="maths-3d-shapes-nets-simulator.html?v=20261111-3d-shapes-nets-simulator-v1">▧ Open 3D Shapes &amp; Nets Simulator</a></div></section><div class="progress-row"><span>YOUR PROGRESS</span><span id="progressPercent">0%</span></div><div class="track"><div class="fill" id="designProgress" style="width:0%"></div></div><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">3D shapes and nets</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div><script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Which object is shaped most like a cube?","o":["A dice","A football","A drinking straw","An ice-cream cone"],"a":0,"e":"A standard dice has six square faces, like a cube.","v":"cube"},{"d":"BASIC","q":"How many faces does a cube have?","o":["4","6","8","12"],"a":1,"e":"A cube has six equal square faces.","v":"cube"},{"d":"BASIC","q":"How many vertices does a cuboid have?","o":["6","8","10","12"],"a":1,"e":"A cuboid has eight corner points, called vertices.","v":"cuboid"},{"d":"BASIC","q":"Which solid has no flat face, edge or vertex?","o":["Cone","Cylinder","Sphere","Cube"],"a":2,"e":"A sphere has one continuous curved surface and no edges or vertices.","v":"sphere"},{"d":"BASIC","q":"Which solid has one circular flat face and one vertex?","o":["Cylinder","Cone","Sphere","Cuboid"],"a":1,"e":"A cone has one circular base and one pointed vertex.","v":"cone"},{"d":"BASIC","q":"Which solid has two circular flat faces and one curved surface?","o":["Cone","Sphere","Cylinder","Square pyramid"],"a":2,"e":"A cylinder has two circular bases joined by a curved surface.","v":"cylinder"},{"d":"BASIC","q":"A cube's faces are shaped like…","o":["Circles","Triangles","Squares","Rectangles of different sizes"],"a":2,"e":"All six faces of a cube are squares.","v":"cube"},{"d":"BASIC","q":"What is a net of a solid?","o":["A flat pattern that folds into the solid","A drawing of only its shadow","A list of its vertices","A curved surface only"],"a":0,"e":"A net is a 2D arrangement of faces that can fold to make a 3D solid.","v":"net"},{"d":"BASIC","q":"How many faces does a cuboid have?","o":["4","5","6","8"],"a":2,"e":"A cuboid has six rectangular faces.","v":"cuboid"},{"d":"BASIC","q":"Which solid has a circular base and comes to a point?","o":["Cone","Cylinder","Sphere","Cube"],"a":0,"e":"A cone narrows from its circular base to one vertex.","v":"cone"},{"d":"MEDIUM","q":"How many edges does a cube have?","o":["6","8","12","14"],"a":2,"e":"A cube has four edges on the top, four on the bottom and four joining them: 12 in total.","v":"cube"},{"d":"MEDIUM","q":"How many vertices does a square-based pyramid have?","o":["4","5","6","8"],"a":1,"e":"It has four vertices on the square base and one apex: 5.","v":"pyramid"},{"d":"MEDIUM","q":"How many faces does a square-based pyramid have?","o":["4","5","6","8"],"a":1,"e":"Its faces are one square base and four triangular sides, totalling 5.","v":"pyramid"},{"d":"MEDIUM","q":"How many edges does a triangular prism have?","o":["6","8","9","12"],"a":2,"e":"It has 3 edges on each triangular end and 3 joining corresponding corners: 9.","v":"prism"},{"d":"MEDIUM","q":"Which 2D shapes make up the faces of a triangular prism?","o":["Two triangles and three rectangles","One triangle and four squares","Six triangles","Two circles and one rectangle"],"a":0,"e":"A triangular prism has two triangular ends and three rectangular side faces.","v":"prism"},{"d":"MEDIUM","q":"How many square faces are in a cube net that folds correctly into a cube?","o":["4","5","6","8"],"a":2,"e":"A cube has six faces, so its net must contain six squares.","v":"net"},{"d":"MEDIUM","q":"Which statement about a cuboid is always true?","o":["All faces must be squares","It has 6 faces, 12 edges and 8 vertices","It has one curved surface","It has only 6 vertices"],"a":1,"e":"Every cuboid has six faces, twelve edges and eight vertices.","v":"cuboid"},{"d":"MEDIUM","q":"A cylinder is placed upright on a table. Which part touches the table?","o":["Its curved side only","One circular flat face","A vertex","All of its surface at once"],"a":1,"e":"When upright, the cylinder rests on one of its circular bases.","v":"cylinder"},{"d":"MEDIUM","q":"Which solid can roll in any direction because its surface is curved all around?","o":["Cube","Cuboid","Sphere","Square pyramid"],"a":2,"e":"A sphere's entire outer surface is curved, so it can roll in any direction.","v":"sphere"},{"d":"MEDIUM","q":"A cube net contains five squares. What is the problem?","o":["A cube needs six square faces","A cube has no square faces","A cube needs eight squares","The squares must all be different sizes"],"a":0,"e":"A cube has six faces, so a complete net must represent all six squares.","v":"net"},{"d":"HARD","q":"A solid has 5 faces, 8 edges and 5 vertices. Which solid matches these counts?","o":["Cube","Square-based pyramid","Triangular prism","Cylinder"],"a":1,"e":"A square-based pyramid has one square base, four triangular faces, eight edges and five vertices.","v":"pyramid"},{"d":"HARD","q":"A solid has 2 triangular faces and 3 rectangular faces. What is it?","o":["Triangular prism","Square pyramid","Cuboid","Cone"],"a":0,"e":"Those five faces describe a triangular prism.","v":"prism"},{"d":"HARD","q":"A cube has 6 faces. If each face is painted a different colour, how many face colours are used?","o":["4","5","6","12"],"a":2,"e":"There is one colour per face, and the cube has six faces.","v":"cube"},{"d":"HARD","q":"A cuboid is made from 6 rectangles. How many edges does it have altogether?","o":["8","10","12","14"],"a":2,"e":"A cuboid has four edges on each of two opposite faces and four connecting edges: 12.","v":"cuboid"},{"d":"HARD","q":"Which description correctly compares a cone and a cylinder?","o":["Both have two vertices","A cone has one vertex; a cylinder has none","A cylinder has one vertex; a cone has none","Neither has a flat face"],"a":1,"e":"The cone has one apex; the cylinder has no vertices and has two flat circular faces.","v":"cone"},{"d":"HARD","q":"A triangular prism has 2 triangular faces and 3 rectangular faces. How many faces does it have in total?","o":["3","5","6","9"],"a":1,"e":"2 + 3 = 5 faces.","v":"prism"},{"d":"HARD","q":"Which net can make a cube?","o":["Six equal squares arranged in a valid foldable pattern","Six circles joined in a row","Four squares and two triangles","One square with four circles around it"],"a":0,"e":"A cube net uses six equal squares arranged so they fold to form all six faces without overlap.","v":"net"},{"d":"HARD","q":"A solid has 6 faces, 12 edges and 8 vertices. Which conclusion is safest?","o":["It must be a sphere","It could be a cube or a cuboid","It must be a cone","It must have a circular base"],"a":1,"e":"Both cubes and cuboids have six faces, twelve edges and eight vertices.","v":"cuboid"},{"d":"HARD","q":"A square-based pyramid has 4 triangular side faces. How many edges join the apex to the base vertices?","o":["2","3","4","8"],"a":2,"e":"Each of the four base vertices connects to the apex, giving four sloping edges.","v":"pyramid"},{"d":"HARD","q":"Which solid has exactly one curved surface and no vertices, but also has two flat circular faces?","o":["Sphere","Cylinder","Cone","Triangular prism"],"a":1,"e":"A cylinder has one curved surface, two circular flat faces and no vertices.","v":"cylinder"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');const visuals={
cube:'',
cuboid:'',
sphere:'',
cone:'',
cylinder:'',
pyramid:'',
prism:'',
net:''
};function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));const f=document.getElementById('designProgress');if(f)f.style.width=p+'%';const l=document.getElementById('progressPercent');if(l)l.textContent=Math.round(p)+'%';}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-letter="'+String.fromCharCode(65+i)+'" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');const fp=document.getElementById('designProgress');if(fp)fp.style.width='100%';const fpc=document.getElementById('progressPercent');if(fpc)fpc.textContent='100%';$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const skills=[['Identify common 3D solids and their properties',8],['Count faces, edges and vertices',18],['Recognise and reason about foldable nets',24]];$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">📏</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+skills.map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script>
