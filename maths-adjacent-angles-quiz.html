<div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div>

<script>
(function(){
'use strict';
const questions=[{"q":"Two angles share a vertex and one common arm, and their interiors do not overlap. What is the pair called?","o":["Adjacent angles","Vertically opposite angles","Complementary angles","Alternate interior angles"],"a":0,"why":"Adjacent angles share a vertex and a common arm without overlapping interiors."},{"q":"Which feature is required for two angles to be adjacent?","o":["Their measures must total 90°","They must share a vertex and a common arm","Their arms must be opposite rays","Their measures must be equal"],"a":1,"why":"Adjacent angles share a vertex and one common arm; equal measures are not required."},{"q":"∠AOB and ∠BOC share vertex O and arm OB. Their interiors lie on opposite sides of OB without overlap. Which arm is common?","o":["No common arm","OA","OB","OC"],"a":2,"why":"OB is named in both angles, so it is their common arm."},{"q":"Two angles have a common vertex but no common arm. Are they adjacent?","o":["Always","Only if equal","Only if their sum is 180°","No"],"a":3,"why":"A common arm is part of the definition of adjacent angles."},{"q":"Which pair is most clearly adjacent in the stated arrangement?","o":["Two angles sharing a vertex and one arm, with non-overlapping interiors","Two overlapping angles with the same interior","Two angles whose measures add to 90° but have separate vertices","Two angles at different vertices"],"a":0,"why":"The stated shared vertex, shared arm, and non-overlapping interiors meet the definition."},{"q":"If ∠AOB = 30° and ∠BOC = 45° are adjacent with OB between OA and OC, what is ∠AOC?","o":["90°","75°","15°","45°"],"a":1,"why":"The combined angle is 30° + 45° = 75°."},{"q":"Adjacent angles measure 62° and 28°. What is their combined angle?","o":["34°","62°","90°","118°"],"a":2,"why":"With non-overlapping adjacent interiors, the whole angle is 62° + 28° = 90°."},{"q":"Which statement about adjacent angles is true?","o":["They always have equal measures","They cannot be acute","They always add to 180°","They share a common arm"],"a":3,"why":"Sharing a common arm is required; their sum and measures can vary."},{"q":"Angles ∠PQR and ∠RQS share vertex Q and arm QR. Which point is their common vertex?","o":["Q","S","P","R"],"a":0,"why":"Both angle names have Q as the middle letter, so Q is the vertex."},{"q":"Two adjacent angles are 40° and 50°. What is the measure of the larger angle individually?","o":["40°","50°","45°","90°"],"a":1,"why":"The two individual measures are 40° and 50°; the larger is 50°."},{"q":"∠AOB = (2x + 10)° and ∠BOC = 30° are adjacent. If ∠AOC = 80°, find x.","o":["15","25","20","10"],"a":2,"why":"2x + 10 + 30 = 80, so 2x = 40 and x = 20."},{"q":"Adjacent angles form a right angle. One is 37°. Find the other.","o":["143°","43°","63°","53°"],"a":3,"why":"Their total is 90°, so the other angle is 90° − 37° = 53°."},{"q":"Two adjacent angles form a straight angle. One is 118°. Find the other.","o":["62°","52°","72°","118°"],"a":0,"why":"A straight angle is 180°; 180° − 118° = 62°."},{"q":"Three non-overlapping adjacent angles make a 90° angle. Two measure 20° and 35°. Find the third.","o":["45°","35°","55°","25°"],"a":1,"why":"90° − 20° − 35° = 35°."},{"q":"∠AOB = 3x° and ∠BOC = (x + 20)° are adjacent and together form 100°. Find x.","o":["25","10","20","15"],"a":2,"why":"3x + x + 20 = 100, so 4x = 80 and x = 20."},{"q":"Which additional condition makes adjacent angles a linear pair?","o":["Their measures are equal","Their measures total 90°","Their common arm is vertical","Their non-common arms are opposite rays"],"a":3,"why":"A linear pair has non-common arms that form a straight line, meaning they are opposite rays."},{"q":"Two adjacent angles measure (x + 15)° and (2x)°. Their combined angle is 105°. Find the smaller angle.","o":["45°","60°","75°","35°"],"a":0,"why":"x + 15 + 2x = 105 gives x = 30; the angles are 45° and 60°."},{"q":"Adjacent angles are in the ratio 2:3 and their combined angle is 100°. Find the smaller angle.","o":["60°","40°","20°","50°"],"a":1,"why":"Five parts total 100°, so one part is 20° and the smaller is 2 × 20° = 40°."},{"q":"∠AOB = 47° and ∠BOC = 63° are adjacent. What is ∠AOC if OB lies inside ∠AOC?","o":["16°","63°","110°","180°"],"a":2,"why":"The whole angle equals the sum of the two non-overlapping parts: 47° + 63° = 110°."},{"q":"Two adjacent angles form a straight angle. They are (3x − 10)° and (x + 30)°. Find x.","o":["35","45","30","40"],"a":3,"why":"3x − 10 + x + 30 = 180 gives 4x = 160, so x = 40."},{"q":"Three adjacent angles on a straight line are x°, 2x° and 3x°. Find the largest angle.","o":["90°","120°","30°","60°"],"a":0,"why":"x + 2x + 3x = 180°, so x = 30° and the largest is 3x = 90°."},{"q":"Two adjacent angles form a straight angle. The larger is 4 times the smaller. Find the smaller angle.","o":["30°","36°","45°","60°"],"a":1,"why":"Let the smaller be x; x + 4x = 180°, so x = 36°."},{"q":"Two adjacent angles have measures (5x − 10)° and (2x + 15)°. Their combined angle is 145°. Find the larger angle.","o":["65°","100°","90°","55°"],"a":2,"why":"5x − 10 + 2x + 15 = 145 gives x = 20; the angles are 90° and 55°, so larger is 90°."},{"q":"Three adjacent angles make a 180° angle and are in the ratio 2:3:4. Find the middle-sized angle.","o":["80°","20°","40°","60°"],"a":3,"why":"Nine parts total 180°, each part is 20°; the middle-sized angle is 3 × 20° = 60°."},{"q":"Adjacent angles form a right angle. Their measures are (4x − 5)° and (x + 10)°. Find the larger angle.","o":["63°","27°","37°","73°"],"a":0,"why":"4x − 5 + x + 10 = 90 gives x = 17; the angles are 63° and 27°, so the larger is 63°."},{"q":"Two adjacent angles on a straight line differ by 34°. Find the smaller angle.","o":["83°","73°","97°","63°"],"a":1,"why":"Let larger L and smaller S: L + S = 180 and L − S = 34, so S = 73°."},{"q":"Four adjacent angles around a point measure 70°, 85°, 95° and x°. Find x.","o":["120°","90°","110°","100°"],"a":2,"why":"Angles around a point total 360°; x = 360° − (70° + 85° + 95°) = 110°."},{"q":"Adjacent angles form a straight angle. One angle is 20° more than twice the other. Find the smaller angle.","o":["46⅔°","60°","66⅔°","53⅓°"],"a":3,"why":"Let smaller x; the larger is 2x + 20. Then 3x + 20 = 180, so x = 53⅓°."},{"q":"∠AOB and ∠BOC are adjacent, and ∠AOC = 3 × ∠AOB. If ∠BOC = 40°, find ∠AOB.","o":["20°","30°","40°","10°"],"a":0,"why":"Let ∠AOB = x; x + 40 = 3x, so x = 20°."},{"q":"Three adjacent angles form a straight angle. The second is twice the first and the third is 30° more than the first. Find the third angle.","o":["87.5°","67.5°","57.5°","77.5°"],"a":1,"why":"Let the first be x; x + 2x + (x + 30) = 180 gives x = 37.5°, so the third is 67.5°."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Large Numbers Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261104-physics-path-layout-v2" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
