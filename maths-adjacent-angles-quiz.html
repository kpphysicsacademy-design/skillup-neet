<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Two angles share a vertex and one common arm, and their interiors do not overlap. What is the pair called?","o":["Adjacent angles","Vertically opposite angles","Complementary angles","Alternate interior angles"],"a":0,"e":"Adjacent angles share a vertex and a common arm without overlapping interiors.","v":"adjacent-angles"},{"d":"BASIC","q":"Which feature is required for two angles to be adjacent?","o":["Their measures must total 90°","They must share a vertex and a common arm","Their arms must be opposite rays","Their measures must be equal"],"a":1,"e":"Adjacent angles share a vertex and one common arm; equal measures are not required.","v":"adjacent-angles"},{"d":"BASIC","q":"∠AOB and ∠BOC share vertex O and arm OB. Their interiors lie on opposite sides of OB without overlap. Which arm is common?","o":["No common arm","OA","OB","OC"],"a":2,"e":"OB is named in both angles, so it is their common arm.","v":"adjacent-angles"},{"d":"BASIC","q":"Two angles have a common vertex but no common arm. Are they adjacent?","o":["Always","Only if equal","Only if their sum is 180°","No"],"a":3,"e":"A common arm is part of the definition of adjacent angles.","v":"adjacent-angles"},{"d":"BASIC","q":"Which pair is most clearly adjacent in the stated arrangement?","o":["Two angles sharing a vertex and one arm, with non-overlapping interiors","Two overlapping angles with the same interior","Two angles whose measures add to 90° but have separate vertices","Two angles at different vertices"],"a":0,"e":"The stated shared vertex, shared arm, and non-overlapping interiors meet the definition.","v":"adjacent-angles"},{"d":"BASIC","q":"If ∠AOB = 30° and ∠BOC = 45° are adjacent with OB between OA and OC, what is ∠AOC?","o":["90°","75°","15°","45°"],"a":1,"e":"The combined angle is 30° + 45° = 75°.","v":"adjacent-angles"},{"d":"BASIC","q":"Adjacent angles measure 62° and 28°. What is their combined angle?","o":["34°","62°","90°","118°"],"a":2,"e":"With non-overlapping adjacent interiors, the whole angle is 62° + 28° = 90°.","v":"adjacent-angles"},{"d":"BASIC","q":"Which statement about adjacent angles is true?","o":["They always have equal measures","They cannot be acute","They always add to 180°","They share a common arm"],"a":3,"e":"Sharing a common arm is required; their sum and measures can vary.","v":"adjacent-angles"},{"d":"BASIC","q":"Angles ∠PQR and ∠RQS share vertex Q and arm QR. Which point is their common vertex?","o":["Q","S","P","R"],"a":0,"e":"Both angle names have Q as the middle letter, so Q is the vertex.","v":"adjacent-angles"},{"d":"BASIC","q":"Two adjacent angles are 40° and 50°. What is the measure of the larger angle individually?","o":["40°","50°","45°","90°"],"a":1,"e":"The two individual measures are 40° and 50°; the larger is 50°.","v":"adjacent-angles"},{"d":"MEDIUM","q":"∠AOB = (2x + 10)° and ∠BOC = 30° are adjacent. If ∠AOC = 80°, find x.","o":["15","25","20","10"],"a":2,"e":"2x + 10 + 30 = 80, so 2x = 40 and x = 20.","v":"adjacent-angles"},{"d":"MEDIUM","q":"Adjacent angles form a right angle. One is 37°. Find the other.","o":["143°","43°","63°","53°"],"a":3,"e":"Their total is 90°, so the other angle is 90° − 37° = 53°.","v":"adjacent-angles"},{"d":"MEDIUM","q":"Two adjacent angles form a straight angle. One is 118°. Find the other.","o":["62°","52°","72°","118°"],"a":0,"e":"A straight angle is 180°; 180° − 118° = 62°.","v":"adjacent-angles"},{"d":"MEDIUM","q":"Three non-overlapping adjacent angles make a 90° angle. Two measure 20° and 35°. Find the third.","o":["45°","35°","55°","25°"],"a":1,"e":"90° − 20° − 35° = 35°.","v":"adjacent-angles"},{"d":"MEDIUM","q":"∠AOB = 3x° and ∠BOC = (x + 20)° are adjacent and together form 100°. Find x.","o":["25","10","20","15"],"a":2,"e":"3x + x + 20 = 100, so 4x = 80 and x = 20.","v":"adjacent-angles"},{"d":"MEDIUM","q":"Which additional condition makes adjacent angles a linear pair?","o":["Their measures are equal","Their measures total 90°","Their common arm is vertical","Their non-common arms are opposite rays"],"a":3,"e":"A linear pair has non-common arms that form a straight line, meaning they are opposite rays.","v":"adjacent-angles"},{"d":"MEDIUM","q":"Two adjacent angles measure (x + 15)° and (2x)°. Their combined angle is 105°. Find the smaller angle.","o":["45°","60°","75°","35°"],"a":0,"e":"x + 15 + 2x = 105 gives x = 30; the angles are 45° and 60°.","v":"adjacent-angles"},{"d":"MEDIUM","q":"Adjacent angles are in the ratio 2:3 and their combined angle is 100°. Find the smaller angle.","o":["60°","40°","20°","50°"],"a":1,"e":"Five parts total 100°, so one part is 20° and the smaller is 2 × 20° = 40°.","v":"adjacent-angles"},{"d":"MEDIUM","q":"∠AOB = 47° and ∠BOC = 63° are adjacent. What is ∠AOC if OB lies inside ∠AOC?","o":["16°","63°","110°","180°"],"a":2,"e":"The whole angle equals the sum of the two non-overlapping parts: 47° + 63° = 110°.","v":"adjacent-angles"},{"d":"MEDIUM","q":"Two adjacent angles form a straight angle. They are (3x − 10)° and (x + 30)°. Find x.","o":["35","45","30","40"],"a":3,"e":"3x − 10 + x + 30 = 180 gives 4x = 160, so x = 40.","v":"adjacent-angles"},{"d":"HARD","q":"Three adjacent angles on a straight line are x°, 2x° and 3x°. Find the largest angle.","o":["90°","120°","30°","60°"],"a":0,"e":"x + 2x + 3x = 180°, so x = 30° and the largest is 3x = 90°.","v":"adjacent-angles"},{"d":"HARD","q":"Two adjacent angles form a straight angle. The larger is 4 times the smaller. Find the smaller angle.","o":["30°","36°","45°","60°"],"a":1,"e":"Let the smaller be x; x + 4x = 180°, so x = 36°.","v":"adjacent-angles"},{"d":"HARD","q":"Two adjacent angles have measures (5x − 10)° and (2x + 15)°. Their combined angle is 145°. Find the larger angle.","o":["65°","100°","90°","55°"],"a":2,"e":"5x − 10 + 2x + 15 = 145 gives x = 20; the angles are 90° and 55°, so larger is 90°.","v":"adjacent-angles"},{"d":"HARD","q":"Three adjacent angles make a 180° angle and are in the ratio 2:3:4. Find the middle-sized angle.","o":["80°","20°","40°","60°"],"a":3,"e":"Nine parts total 180°, each part is 20°; the middle-sized angle is 3 × 20° = 60°.","v":"adjacent-angles"},{"d":"HARD","q":"Adjacent angles form a right angle. Their measures are (4x − 5)° and (x + 10)°. Find the larger angle.","o":["63°","27°","37°","73°"],"a":0,"e":"4x − 5 + x + 10 = 90 gives x = 17; the angles are 63° and 27°, so the larger is 63°.","v":"adjacent-angles"},{"d":"HARD","q":"Two adjacent angles on a straight line differ by 34°. Find the smaller angle.","o":["83°","73°","97°","63°"],"a":1,"e":"Let larger L and smaller S: L + S = 180 and L − S = 34, so S = 73°.","v":"adjacent-angles"},{"d":"HARD","q":"Four adjacent angles around a point measure 70°, 85°, 95° and x°. Find x.","o":["120°","90°","110°","100°"],"a":2,"e":"Angles around a point total 360°; x = 360° − (70° + 85° + 95°) = 110°.","v":"adjacent-angles"},{"d":"HARD","q":"Adjacent angles form a straight angle. One angle is 20° more than twice the other. Find the smaller angle.","o":["46⅔°","60°","66⅔°","53⅓°"],"a":3,"e":"Let smaller x; the larger is 2x + 20. Then 3x + 20 = 180, so x = 53⅓°.","v":"adjacent-angles"},{"d":"HARD","q":"∠AOB and ∠BOC are adjacent, and ∠AOC = 3 × ∠AOB. If ∠BOC = 40°, find ∠AOB.","o":["20°","30°","40°","10°"],"a":0,"e":"Let ∠AOB = x; x + 40 = 3x, so x = 20°.","v":"adjacent-angles"},{"d":"HARD","q":"Three adjacent angles form a straight angle. The second is twice the first and the third is 30° more than the first. Find the third angle.","o":["87.5°","67.5°","57.5°","77.5°"],"a":1,"e":"Let the first be x; x + 2x + (x + 30) = 180 gives x = 37.5°, so the third is 67.5°.","v":"adjacent-angles"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}const visuals={
balance:'',
blocks:'',
bars:'',
picture:''
};function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🔢</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+'<div class="skill-item '+(correct>=8?'unlocked':'')+'">'+(correct>=8?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Identify complementary and supplementary angles</div>'+'<div class="skill-item '+(correct>=18?'unlocked':'')+'">'+(correct>=18?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Calculate missing angle measures</div>'+'<div class="skill-item '+(correct>=24?'unlocked':'')+'">'+(correct>=24?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Solve angle relationship problems</div>'+'</div></div>' ;$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script>
