<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"The angle subtended by a chord at the centre is:","o":["Always 90°","The angle formed by radii to the chord's endpoints","Equal to the radius","Always twice 180°"],"a":1,"e":"Join the chord's endpoints to the centre; the two radii form the central angle."},{"d":"BASIC","q":"Angles subtended by the same chord at points on the same segment of a circle are:","o":["Equal","Supplementary always","Always 90°","Unequal"],"a":0,"e":"Angles in the same segment subtended by the same chord are equal."},{"d":"BASIC","q":"The angle subtended by a diameter at the circumference is:","o":["45°","60°","90°","180°"],"a":2,"e":"A diameter subtends a right angle at any point on the circle."},{"d":"BASIC","q":"If ∠ACB and ∠ADB stand on the same chord AB in the same segment, then:","o":["∠ACB=∠ADB","∠ACB+∠ADB=180° always","∠ACB=2∠ADB","They are always complementary"],"a":0,"e":"Angles in the same segment are equal."},{"d":"BASIC","q":"If an angle at the centre is 100°, the angle subtended by the same chord at the circumference in the opposite arc is:","o":["25°","50°","100°","200°"],"a":1,"e":"The angle at the centre is twice the angle at the circumference on the same arc."},{"d":"BASIC","q":"A chord AB subtends 35° at a point C on the circumference in one segment. The angle subtended in the same segment at D is:","o":["35°","55°","70°","145°"],"a":0,"e":"Angles subtended by the same chord in the same segment are equal."},{"d":"BASIC","q":"A quadrilateral whose four vertices lie on one circle is called:","o":["Parallelogram only","Cyclic quadrilateral","Rhombus only","Trapezium only"],"a":1,"e":"A cyclic quadrilateral has all vertices on a common circle."},{"d":"BASIC","q":"In a cyclic quadrilateral, opposite angles add up to:","o":["90°","180°","270°","360°"],"a":1,"e":"Opposite angles of a cyclic quadrilateral are supplementary."},{"d":"BASIC","q":"If an angle at the circumference is 42°, the angle at the centre subtended by the same chord on the corresponding arc is:","o":["21°","42°","84°","138°"],"a":2,"e":"The central angle is twice the angle at the circumference: 2×42°=84°."},{"d":"BASIC","q":"A chord subtends equal angles at two points on the same segment. This illustrates:","o":["Angles in the same segment theorem","Pythagoras theorem","Exterior angle theorem","Midpoint theorem"],"a":0,"e":"This is the angles-in-the-same-segment theorem."},{"d":"MEDIUM","q":"A chord AB subtends 64° at the centre O. What angle does it subtend at the circumference on the same arc?","o":["32°","64°","128°","116°"],"a":0,"e":"The angle at the centre is twice the angle at the circumference, so 64°/2=32°."},{"d":"MEDIUM","q":"If ∠ACB=48° and ∠ADB stand on chord AB in the same segment, find ∠ADB.","o":["24°","42°","48°","96°"],"a":2,"e":"Angles in the same segment are equal."},{"d":"MEDIUM","q":"In cyclic quadrilateral ABCD, ∠A=73°. Find ∠C.","o":["73°","90°","107°","117°"],"a":2,"e":"Opposite angles sum to 180°; ∠C=180°−73°=107°."},{"d":"MEDIUM","q":"An angle subtended by chord AB at the circumference is 37°. The central angle subtended by the same chord on the corresponding arc is:","o":["37°","53°","74°","106°"],"a":2,"e":"Central angle=2×37°=74°."},{"d":"MEDIUM","q":"In cyclic quadrilateral PQRS, ∠P=2x and ∠R=3x. Find x.","o":["30°","36°","45°","60°"],"a":1,"e":"Opposite angles sum to 180°: 2x+3x=180°, so x=36°."},{"d":"MEDIUM","q":"A diameter AB subtends angle ACB at point C on the circle. ∠ACB equals:","o":["45°","60°","90°","180°"],"a":2,"e":"The angle in a semicircle is a right angle."},{"d":"MEDIUM","q":"In cyclic quadrilateral ABCD, ∠A=2x+10° and ∠C=3x°. Find x.","o":["30°","34°","36°","40°"],"a":1,"e":"(2x+10)+3x=180, so 5x=170 and x=34°."},{"d":"MEDIUM","q":"Two points P and Q lie on the same segment of a circle and chord AB subtends 55° at P. At Q it subtends:","o":["35°","55°","110°","125°"],"a":1,"e":"The angles are equal because they stand on the same chord in the same segment."},{"d":"MEDIUM","q":"In cyclic quadrilateral ABCD, ∠B=118°. Find ∠D.","o":["52°","62°","72°","118°"],"a":1,"e":"Opposite angles are supplementary: 180°−118°=62°."},{"d":"MEDIUM","q":"A chord subtends 28° at the circumference. The angle at the centre standing on the same arc is:","o":["14°","28°","56°","152°"],"a":2,"e":"The angle at the centre is twice the angle at the circumference."},{"d":"HARD","q":"In cyclic quadrilateral ABCD, ∠A=(x+20)° and ∠C=(2x+10)°. Find x.","o":["40°","45°","50°","60°"],"a":2,"e":"x+20+2x+10=180, so 3x=150 and x=50°."},{"d":"HARD","q":"A chord subtends 3x° at the centre and (x+20)° at the circumference on the same arc. Find x.","o":["10°","20°","30°","40°"],"a":3,"e":"3x=2(x+20), so x=40°."},{"d":"HARD","q":"In a cyclic quadrilateral, one angle is 4x° and its opposite angle is (2x+30)°. Find x.","o":["20°","25°","30°","35°"],"a":1,"e":"4x+2x+30=180, so x=25°."},{"d":"HARD","q":"An angle subtended by a chord at the circumference is 31°. Find the reflex central angle subtended by the same chord.","o":["62°","118°","298°","329°"],"a":2,"e":"The minor central angle is 62°, so the reflex angle is 360°−62°=298°."},{"d":"HARD","q":"In cyclic quadrilateral ABCD, ∠A=75°, ∠B=2x°, and ∠D=(x+15)°. Find x.","o":["25°","35°","45°","55°"],"a":3,"e":"2x+x+15=180, so 3x=165 and x=55°."},{"d":"HARD","q":"A chord subtends 40° at point P on one arc. At a point Q on the opposite arc, the angle subtended by the chord is:","o":["40°","50°","80°","140°"],"a":3,"e":"Angles subtended by a chord in opposite segments are supplementary when the points lie on opposite arcs: 180°−40°=140°."},{"d":"HARD","q":"In cyclic quadrilateral ABCD, ∠A=88° and ∠B=67°. Find ∠D.","o":["67°","88°","92°","113°"],"a":3,"e":"Opposite angles B and D sum to 180°, so D=180°−67°=113°."},{"d":"HARD","q":"A chord subtends 46° at the circumference. The minor central angle is:","o":["23°","46°","92°","134°"],"a":2,"e":"The central angle is twice the circumference angle: 92°."},{"d":"HARD","q":"In a cyclic quadrilateral, opposite angles are (x+35)° and (2x+10)°. Find x.","o":["35°","40°","45°","50°"],"a":2,"e":"x+35+2x+10=180 gives 3x=135, so x=45°."},{"d":"HARD","q":"In cyclic quadrilateral ABCD, ∠A=3x°, ∠C=(2x+30)°, and ∠B=70°. Find ∠D.","o":["70°","100°","110°","120°"],"a":2,"e":"3x+2x+30=180 gives x=30°, so ∠A=90°. Then ∠D=180°−70°=110°."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Explore angles subtended by chords</strong><small>Apply the central-angle theorem</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Use angles in the same segment</strong><small>Solve cyclic quadrilateral problems</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Find unknown angles</strong><small>Practise circle angle theorems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
