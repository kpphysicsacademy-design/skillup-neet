<script>
(function(){
'use strict';
const questions=[{"q":"The three interior angles of a triangle add up to…","o":["90°","180°","270°","360°"],"a":1,"why":"The angle sum property states that a triangle’s interior angles total 180°."},{"q":"A triangle has angles 50° and 60°. Find the third angle.","o":["60°","70°","80°","90°"],"a":1,"why":"180° − 50° − 60° = 70°."},{"q":"Two angles of a triangle are 90° and 35°. Find the third angle.","o":["45°","55°","65°","75°"],"a":1,"why":"The remaining angle is 180° − 90° − 35° = 55°."},{"q":"A triangle has angles 40°, 40°, and x°. Find x.","o":["80°","90°","100°","110°"],"a":2,"why":"x = 180° − 40° − 40° = 100°."},{"q":"Can a triangle have two right angles?","o":["Yes, every triangle can","No, their sum would already be 180°","Only an isosceles triangle can","Only an equilateral triangle can"],"a":1,"why":"Two right angles total 180°, leaving no angle for a triangle’s third vertex."},{"q":"In a triangle, two angles are 75° and 45°. What is the third angle?","o":["50°","60°","70°","80°"],"a":1,"why":"180° − 75° − 45° = 60°."},{"q":"An equilateral triangle has three equal interior angles. Each angle is…","o":["30°","45°","60°","90°"],"a":2,"why":"Each angle is 180° ÷ 3 = 60°."},{"q":"A triangle has angles 30°, 90°, and…","o":["30°","45°","60°","90°"],"a":2,"why":"The third angle is 180° − 30° − 90° = 60°."},{"q":"Which set can be the interior angles of a triangle?","o":["60°, 60°, 60°","90°, 90°, 10°","100°, 50°, 40°","30°, 40°, 100°"],"a":0,"why":"Only 60° + 60° + 60° = 180°."},{"q":"Two angles of a triangle are equal and the third is 40°. Each equal angle is…","o":["60°","70°","80°","90°"],"a":1,"why":"The equal angles total 140°, so each is 70°."},{"q":"Triangle angles are x°, 2x°, and 3x°. Find x.","o":["20°","30°","40°","60°"],"a":1,"why":"x + 2x + 3x = 180°, so 6x = 180° and x = 30°."},{"q":"A triangle has angles (x + 20)°, (x + 40)°, and 60°. Find x.","o":["20°","25°","30°","40°"],"a":2,"why":"2x + 120° = 180°, so x = 30°."},{"q":"The angles of a triangle are x°, (x + 20)°, and (x + 40)°. Find the largest angle.","o":["60°","70°","80°","90°"],"a":2,"why":"3x + 60 = 180 gives x = 40°, so the largest angle x + 40° is 80°."},{"q":"Two angles of a triangle are in the ratio 2:3, and the third angle is 80°. Find the smaller angle.","o":["30°","40°","50°","60°"],"a":1,"why":"The first two total 100°; five ratio parts equal 100°, so one part is 20° and the smaller is 40°."},{"q":"An isosceles triangle has a vertex angle of 40°. Find each base angle.","o":["40°","60°","70°","80°"],"a":2,"why":"The base angles total 140° and are equal, so each is 70°."},{"q":"The angles are (2x)°, (3x)°, and 30°. Find the largest angle.","o":["60°","75°","90°","105°"],"a":2,"why":"5x + 30 = 180 gives x = 30°; the largest angle is 90°."},{"q":"A triangle has angles (x + 10)°, (2x + 20)°, and (3x − 30)°. Find x.","o":["20°","25°","30°","35°"],"a":2,"why":"Their sum gives 6x = 180°, so x = 30°."},{"q":"The smallest angle of a triangle is 35° and another is 65°. Find the third angle.","o":["70°","80°","90°","100°"],"a":1,"why":"180° − 35° − 65° = 80°."},{"q":"The angles of a triangle are x°, x°, and (x + 30)°. Find the largest angle.","o":["70°","75°","80°","90°"],"a":2,"why":"3x + 30° = 180°, so x = 50°; the largest angle is 80°."},{"q":"A triangle has angles 2x°, 2x°, and 4x°. Find the smallest angle.","o":["22.5°","30°","45°","60°"],"a":2,"why":"8x = 180°, so x = 22.5°; the smallest angle is 2x = 45°."},{"q":"Triangle angles are (2x + 10)°, (3x − 5)°, and (x + 25)°. Find the largest angle.","o":["60°","65°","70°","75°"],"a":2,"why":"6x + 30° = 180°, so x = 25°; angles are 60°, 70°, 50°, so the largest is 70°."},{"q":"The angles of a triangle are in ratio 3:4:5. Find the largest angle.","o":["45°","60°","75°","90°"],"a":2,"why":"Twelve parts equal 180°, each part is 15°; largest is 5 × 15° = 75°."},{"q":"An isosceles triangle has equal base angles of (2x + 5)° and vertex angle (x + 10)°. Find x.","o":["25°","30°","32°","35°"],"a":2,"why":"2(2x + 5) + (x + 10) = 180 gives 5x = 160, so x = 32°."},{"q":"Triangle angles are (x + 15)°, (2x − 5)°, and (3x + 20)°. Find the largest angle.","o":["85°","90°","95°","100°"],"a":2,"why":"6x + 30 = 180 gives x = 25; the angles are 40°, 45°, and 95°."},{"q":"A triangle has angles in ratio 1:2:3. What is the largest angle?","o":["30°","60°","90°","120°"],"a":2,"why":"Six parts total 180°, so each part is 30° and the largest is 90°."},{"q":"Two angles are (3x + 5)° and (2x + 10)°; the third is 50°. Find x.","o":["20","22","23","25"],"a":2,"why":"5x + 65 = 180, so 5x = 115 and x = 23."},{"q":"The angles of a triangle are (4x − 10)°, (2x + 10)°, and (x + 30)°. Find x.","o":["15","20","150/7","30"],"a":2,"why":"7x + 30 = 180, so x = 150/7."},{"q":"An isosceles triangle has vertex angle 30°. Find each base angle.","o":["60°","70°","75°","80°"],"a":2,"why":"The base angles share 150°, so each is 75°."},{"q":"A triangle has angles x°, (x + 15)°, and (2x + 5)°. Find the largest angle.","o":["75°","80°","85°","90°"],"a":2,"why":"4x + 20 = 180 gives x = 40°; the largest angle is 2x + 5 = 85°."},{"q":"A triangle has angles 2x°, (3x + 10)°, and (x + 20)°. Find the largest angle.","o":["75°","80°","85°","90°"],"a":2,"why":"6x + 30 = 180 gives x = 25°; angles are 50°, 85°, 45°, so largest is 85°."}]
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Angle Sum Property Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261104-physics-path-layout-v2" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
