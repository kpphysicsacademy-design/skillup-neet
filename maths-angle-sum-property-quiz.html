 .skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}.skills-result{margin-top:14px;text-align:left}.skills-result h3{margin:0 0 8px;font-size:1rem}.skills-result .skill-item{margin-top:7px}.skill-item.unlocked{border-color:var(--green);color:var(--green2);background:#174b42} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}.diagram .accent{stroke:#58d6a3}.diagram .blue{stroke:#91b7ff}.diagram .gold{stroke:#ffd27a} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-maths-angle-sum-property-v63" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Equations</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Angle Sum Property Skills"><div class="skill-title">🎯 Angle Skills</div><div class="skill-list"><div class="skill-item">Recognise angle sum property of a triangle</div><div class="skill-item">Calculate a missing triangle angle</div><div class="skill-item">Apply the angle sum property to different triangles</div></div></section></div>
<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"The three interior angles of a triangle add up to…","o":["90°","180°","270°","360°"],"a":1,"e":"The angle sum property states that a triangle’s interior angles total 180°.","v":"angle-sum-property"},{"d":"BASIC","q":"A triangle has angles 50° and 60°. Find the third angle.","o":["60°","70°","80°","90°"],"a":1,"e":"180° − 50° − 60° = 70°.","v":"angle-sum-property"},{"d":"BASIC","q":"Two angles of a triangle are 90° and 35°. Find the third angle.","o":["45°","55°","65°","75°"],"a":1,"e":"The remaining angle is 180° − 90° − 35° = 55°.","v":"angle-sum-property"},{"d":"BASIC","q":"A triangle has angles 40°, 40°, and x°. Find x.","o":["80°","90°","100°","110°"],"a":2,"e":"x = 180° − 40° − 40° = 100°.","v":"angle-sum-property"},{"d":"BASIC","q":"Can a triangle have two right angles?","o":["Yes, every triangle can","No, their sum would already be 180°","Only an isosceles triangle can","Only an equilateral triangle can"],"a":1,"e":"Two right angles total 180°, leaving no angle for a triangle’s third vertex.","v":"angle-sum-property"},{"d":"BASIC","q":"In a triangle, two angles are 75° and 45°. What is the third angle?","o":["50°","60°","70°","80°"],"a":1,"e":"180° − 75° − 45° = 60°.","v":"angle-sum-property"},{"d":"BASIC","q":"An equilateral triangle has three equal interior angles. Each angle is…","o":["30°","45°","60°","90°"],"a":2,"e":"Each angle is 180° ÷ 3 = 60°.","v":"angle-sum-property"},{"d":"BASIC","q":"A triangle has angles 30°, 90°, and…","o":["30°","45°","60°","90°"],"a":2,"e":"The third angle is 180° − 30° − 90° = 60°.","v":"angle-sum-property"},{"d":"BASIC","q":"Which set can be the interior angles of a triangle?","o":["60°, 60°, 60°","90°, 90°, 10°","100°, 50°, 40°","30°, 40°, 100°"],"a":0,"e":"Only 60° + 60° + 60° = 180°.","v":"angle-sum-property"},{"d":"BASIC","q":"Two angles of a triangle are equal and the third is 40°. Each equal angle is…","o":["60°","70°","80°","90°"],"a":1,"e":"The equal angles total 140°, so each is 70°.","v":"angle-sum-property"},{"d":"MEDIUM","q":"Triangle angles are x°, 2x°, and 3x°. Find x.","o":["20°","30°","40°","60°"],"a":1,"e":"x + 2x + 3x = 180°, so 6x = 180° and x = 30°.","v":"angle-sum-property"},{"d":"MEDIUM","q":"A triangle has angles (x + 20)°, (x + 40)°, and 60°. Find x.","o":["20°","25°","30°","40°"],"a":2,"e":"2x + 120° = 180°, so x = 30°.","v":"angle-sum-property"},{"d":"MEDIUM","q":"The angles of a triangle are x°, (x + 20)°, and (x + 40)°. Find the largest angle.","o":["60°","70°","80°","90°"],"a":2,"e":"3x + 60 = 180 gives x = 40°, so the largest angle x + 40° is 80°.","v":"angle-sum-property"},{"d":"MEDIUM","q":"Two angles of a triangle are in the ratio 2:3, and the third angle is 80°. Find the smaller angle.","o":["30°","40°","50°","60°"],"a":1,"e":"The first two total 100°; five ratio parts equal 100°, so one part is 20° and the smaller is 40°.","v":"angle-sum-property"},{"d":"MEDIUM","q":"An isosceles triangle has a vertex angle of 40°. Find each base angle.","o":["40°","60°","70°","80°"],"a":2,"e":"The base angles total 140° and are equal, so each is 70°.","v":"angle-sum-property"},{"d":"MEDIUM","q":"The angles are (2x)°, (3x)°, and 30°. Find the largest angle.","o":["60°","75°","90°","105°"],"a":2,"e":"5x + 30 = 180 gives x = 30°; the largest angle is 90°.","v":"angle-sum-property"},{"d":"MEDIUM","q":"A triangle has angles (x + 10)°, (2x + 20)°, and (3x − 30)°. Find x.","o":["20°","25°","30°","35°"],"a":2,"e":"Their sum gives 6x = 180°, so x = 30°.","v":"angle-sum-property"},{"d":"MEDIUM","q":"The smallest angle of a triangle is 35° and another is 65°. Find the third angle.","o":["70°","80°","90°","100°"],"a":1,"e":"180° − 35° − 65° = 80°.","v":"angle-sum-property"},{"d":"MEDIUM","q":"The angles of a triangle are x°, x°, and (x + 30)°. Find the largest angle.","o":["70°","75°","80°","90°"],"a":2,"e":"3x + 30° = 180°, so x = 50°; the largest angle is 80°.","v":"angle-sum-property"},{"d":"MEDIUM","q":"A triangle has angles 2x°, 2x°, and 4x°. Find the smallest angle.","o":["22.5°","30°","45°","60°"],"a":2,"e":"8x = 180°, so x = 22.5°; the smallest angle is 2x = 45°.","v":"angle-sum-property"},{"d":"HARD","q":"Triangle angles are (2x + 10)°, (3x − 5)°, and (x + 25)°. Find the largest angle.","o":["60°","65°","70°","75°"],"a":2,"e":"6x + 30° = 180°, so x = 25°; angles are 60°, 70°, 50°, so the largest is 70°.","v":"angle-sum-property"},{"d":"HARD","q":"The angles of a triangle are in ratio 3:4:5. Find the largest angle.","o":["45°","60°","75°","90°"],"a":2,"e":"Twelve parts equal 180°, each part is 15°; largest is 5 × 15° = 75°.","v":"angle-sum-property"},{"d":"HARD","q":"An isosceles triangle has equal base angles of (2x + 5)° and vertex angle (x + 10)°. Find x.","o":["25°","30°","32°","35°"],"a":2,"e":"2(2x + 5) + (x + 10) = 180 gives 5x = 160, so x = 32°.","v":"angle-sum-property"},{"d":"HARD","q":"Triangle angles are (x + 15)°, (2x − 5)°, and (3x + 20)°. Find the largest angle.","o":["85°","90°","95°","100°"],"a":2,"e":"6x + 30 = 180 gives x = 25; the angles are 40°, 45°, and 95°.","v":"angle-sum-property"},{"d":"HARD","q":"A triangle has angles in ratio 1:2:3. What is the largest angle?","o":["30°","60°","90°","120°"],"a":2,"e":"Six parts total 180°, so each part is 30° and the largest is 90°.","v":"angle-sum-property"},{"d":"HARD","q":"Two angles are (3x + 5)° and (2x + 10)°; the third is 50°. Find x.","o":["20","22","23","25"],"a":2,"e":"5x + 65 = 180, so 5x = 115 and x = 23.","v":"angle-sum-property"},{"d":"HARD","q":"The angles of a triangle are (4x − 10)°, (2x + 10)°, and (x + 30)°. Find x.","o":["15","20","150/7","30"],"a":2,"e":"7x + 30 = 180, so x = 150/7.","v":"angle-sum-property"},{"d":"HARD","q":"An isosceles triangle has vertex angle 30°. Find each base angle.","o":["60°","70°","75°","80°"],"a":2,"e":"The base angles share 150°, so each is 75°.","v":"angle-sum-property"},{"d":"HARD","q":"A triangle has angles x°, (x + 15)°, and (2x + 5)°. Find the largest angle.","o":["75°","80°","85°","90°"],"a":2,"e":"4x + 20 = 180 gives x = 40°; the largest angle is 2x + 5 = 85°.","v":"angle-sum-property"},{"d":"HARD","q":"A triangle has angles 2x°, (3x + 10)°, and (x + 20)°. Find the largest angle.","o":["75°","80°","85°","90°"],"a":2,"e":"6x + 30 = 180 gives x = 25°; angles are 50°, 85°, 45°, so largest is 85°.","v":"angle-sum-property"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}const visuals={
balance:'',
blocks:'',
bars:'',
picture:''
};function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🔢</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+'<div class="skill-item '+(correct>=8?'unlocked':'')+'">'+(correct>=8?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Recognise the 180° interior-angle total</div>'+'<div class="skill-item '+(correct>=18?'unlocked':'')+'">'+(correct>=18?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Calculate missing interior angles</div>'+'<div class="skill-item '+(correct>=24?'unlocked':'')+'">'+(correct>=24?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Solve angle-sum equations and ratios</div>'+'</div></div>' ;$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script></body></html>
