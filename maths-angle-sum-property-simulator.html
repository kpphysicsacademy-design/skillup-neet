<style>

<main><h1>Triangle Angle Sum Simulator</h1><p class="sub">Change two interior angles and watch the third adjust to keep the total at 180°.</p>
<section class="card"><div class="stage"><svg id="triangle" viewBox="0 0 360 250" role="img" aria-label="Interactive triangle showing its three interior angles"><path id="shape" class="side" d="M48 205 L312 205 L180 35 Z"/><path id="arcA" class="arc" d="M78 205 Q82 180 98 174"/><path id="arcB" class="arc" d="M282 205 Q278 180 262 174"/><path id="arcC" class="arc" d="M180 70 Q158 72 164 91"/><text id="labelA" class="vertex" x="35" y="226">A</text><text id="labelB" class="vertex" x="316" y="226">B</text><text id="labelC" class="vertex" x="180" y="25" text-anchor="middle">C</text><text id="angleA" class="angle-label" x="92" y="196">60°</text><text id="angleB" class="angle-label" x="260" y="196">60°</text><text id="angleC" class="angle-label" x="180" y="82" text-anchor="middle">60°</text></svg></div>
<div class="controls"><div class="control"><label for="a">Angle A</label><input id="a" type="range" min="10" max="160" value="60"><output class="value" id="av">60°</output></div><div class="control"><label for="b">Angle B</label><input id="b" type="range" min="10" max="160" value="60"><output class="value" id="bv">60°</output></div></div>
<div class="total"><span>Interior angle total</span><strong id="sum">180°</strong></div>
<div class="presets"><button type="button" data-a="60" data-b="60">Equilateral</button><button type="button" data-a="90" data-b="45">Right triangle</button><button type="button" data-a="100" data-b="40">Obtuse triangle</button><button type="button" data-a="35" data-b="85">Acute triangle</button></div>
<p class="hint" id="explain" aria-live="polite">All three angles are equal in this equilateral triangle.</p></section>
<div class="actions"><a class="secondary" href="maths-angle-sum-property-learn.html?v=20261107-angle-sum-brief-learn-v1">📘 Brief Learn</a><a href="maths-angle-sum-property-quiz.html?v=20261106-angle-sum-property-clean-v1">Start quiz →</a></div>
</main>
<script>
(function(){
const A=document.getElementById('a'),B=document.getElementById('b');
const $=id=>document.getElementById(id);
function point(x,y){return [x,y]}
function update(changed){
 let a=Number(A.value),b=Number(B.value);
 if(a+b>=170){if(changed==='a'){b=169-a;B.value=b;}else{a=169-b;A.value=a;}}
 const c=180-a-b;
 $('av').textContent=a+'°';$('bv').textContent=b+'°';$('sum').textContent=(a+b+c)+'°';
 const rad=Math.PI/180, side=190;
 const sideA=side, sideB=side*Math.sin(a*rad)/Math.sin(c*rad);
 const bx=45,by=205,cx=bx+sideA,cy=by;
 const ax=bx+sideB*Math.cos(c*rad),ay=by-sideB*Math.sin(c*rad);
 $('shape').setAttribute('d',`M ${bx} ${by} L ${cx} ${cy} L ${ax} ${ay} Z`);
 $('labelA').setAttribute('x',bx-14);$('labelA').setAttribute('y',by+20);
 $('labelB').setAttribute('x',cx+5);$('labelB').setAttribute('y',by+20);
 $('labelC').setAttribute('x',ax);$('labelC').setAttribute('y',Math.max(18,ay-10));
 $('angleA').textContent=a+'°';$('angleB').textContent=b+'°';$('angleC').textContent=c+'°';
 $('angleA').setAttribute('x',bx+Math.min(45,sideB*.25));$('angleA').setAttribute('y',by-12);
 $('angleB').setAttribute('x',cx-Math.min(52,sideA*.25));$('angleB').setAttribute('y',by-12);
 $('angleC').setAttribute('x',ax);$('angleC').setAttribute('y',ay+28);
 $('angleC').setAttribute('text-anchor','middle');
 let kind=(a===60&&b===60)?'All three angles are equal: this is an equilateral triangle.':(a===90||b===90||c===90)?'One angle is 90°, so this is a right triangle.':(a>90||b>90||c>90)?'One angle is greater than 90°, so this is an obtuse triangle.':'All three angles are less than 90°, so this is an acute triangle.';
 $('explain').textContent=kind+' The third angle is 180° − '+a+'° − '+b+'° = '+c+'°.';
}
A.addEventListener('input',()=>update('a'));B.addEventListener('input',()=>update('b'));
document.querySelectorAll('[data-a]').forEach(btn=>btn.addEventListener('click',()=>{A.value=btn.dataset.a;B.value=btn.dataset.b;update('preset');}));
update('init');
})();
</script><script src="/shared-nav.js?v=20261104-maths-header-v5"></script></body></html>
