(function(){'use strict';const questions=[{"d":"BASIC","q":"Find the area of a parallelogram with base 8 cm and height 5 cm.","o":["13 cm²","20 cm²","40 cm²","26 cm²"],"a":2,"e":"Area = base × perpendicular height = 8 × 5 = 40 cm²."},{"d":"BASIC","q":"The area of a parallelogram is:","o":["½ × base × height","base × perpendicular height","2 × base × height","base + height"],"a":1,"e":"Multiply the base by the perpendicular height."},{"d":"BASIC","q":"Base = 12 m and height = 4 m. Find the area.","o":["16 m²","24 m²","48 m²","96 m²"],"a":2,"e":"Area = 12 × 4 = 48 m²."},{"d":"BASIC","q":"A parallelogram has area 36 cm² and base 9 cm. Its height is:","o":["3 cm","4 cm","6 cm","9 cm"],"a":1,"e":"Height = area ÷ base = 36 ÷ 9 = 4 cm."},{"d":"BASIC","q":"The height of a parallelogram is the perpendicular distance between:","o":["Two adjacent vertices","Its parallel sides","The two diagonals","Any two sides"],"a":1,"e":"Height is the perpendicular distance between the chosen pair of parallel sides."},{"d":"BASIC","q":"If the base doubles and height stays constant, the area:","o":["Halves","Doubles","Triples","Does not change"],"a":1,"e":"Area = base × height, so doubling the base doubles the area."},{"d":"BASIC","q":"Base = 7 cm and height = 6 cm. Area?","o":["13 cm²","21 cm²","42 cm²","84 cm²"],"a":2,"e":"Area = 7 × 6 = 42 cm²."},{"d":"BASIC","q":"Which unit is appropriate for the area of a floor?","o":["m","m²","m³","cm"],"a":1,"e":"Area is expressed in square units."},{"d":"BASIC","q":"A parallelogram and rectangle have the same base and perpendicular height. Their areas are:","o":["Always equal","Parallelogram twice as large","Rectangle half as large","Not comparable"],"a":0,"e":"Both areas equal base multiplied by the same perpendicular height."},{"d":"BASIC","q":"Area = 72 cm² and height = 8 cm. Find base.","o":["8 cm","9 cm","10 cm","12 cm"],"a":1,"e":"Base = 72 ÷ 8 = 9 cm."},{"d":"MEDIUM","q":"A parallelogram has base 15 cm and area 120 cm². Find its height.","o":[ 5 cm","40 cm"],"a":1,"e":"Let base=5k and height=2k. 10k²=160, so k=4 and base=20 cm."},{"d":"HARD","q":"A floor shaped like a parallelogram has base 12 m and height 7 m. Tiles cost ₹85 per m². Total cost?","o":["₹5,950","₹7,140","₹8,500","₹10,200"],"a":1,"e":"Area = 12 × 7 = 84 m²; cost = 84 × ₹85 = ₹7,140."},{"d":"HARD","q":"The base increases by 25% and height decreases by 20%. The area:","o":["Decreases by 5%","Increases by 5%","Stays unchanged","Increases by 10%"],"a":2,"e":"Area factor = 1.25 × 0.8 = 1, so area is unchanged."},{"d":"HARD","q":"A parallelogram has area 216 cm² and base 18 cm. If both base and height are halved, new area?","o":["27 cm²","54 cm²","108 cm²","216 cm²"],"a":1,"e":"Halving both dimensions makes area one-quarter: 216 ÷ 4 = 54 cm²."},{"d":"HARD","q":"Two parallelograms have equal areas. Their bases are 16 cm and 24 cm. First height is 9 cm. Second height?","o":["4 cm","6 cm","8 cm","12 cm"],"a":1,"e":"16 × 9 = 24 × h, so h = 6 cm."},{"d":"HARD","q":"A parallelogram has base 15 cm and height 8 cm. A triangle with the same base and height has area:","o":["30 cm²","60 cm²","120 cm²","240 cm²"],"a":1,"e":"Triangle area is half the parallelogram area: ½ × 15 × 8 = 60 cm²."},{"d":"HARD","q":"Area = 180 cm². Base is 3 times the height. Find height.","o":["√20 cm","√30 cm","√60 cm","10 cm"],"a":2,"e":"3h²=180, so h²=60 and h=√60 cm."},{"d":"HARD","q":"A parallelogram-shaped field has base 35 m and height 18 m. A path covers 15% of it. Area not covered?","o":["535.5 m²","567 m²","630 m²","724.5 m²"],"a":0,"e":"Total area=630 m²; 85% remains, 0.85×630=535.5 m²."},{"d":"HARD","q":"The area of a parallelogram is 144 cm². If base is 12 cm, and both base and height increase by 50%, new area?","o":["216 cm²","288 cm²","324 cm²","432 cm²"],"a":2,"e":"Both dimensions multiply by 1.5, so area factor is 2.25; new area=144×2.25=324 cm²."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Calculate parallelogram area</strong><small>Use base and perpendicular height</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Find missing base or height</strong><small>Solve triangle-area problems</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve practical area problems</strong><small>Apply area to real-world situations</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
