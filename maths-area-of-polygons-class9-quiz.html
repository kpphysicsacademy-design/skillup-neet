<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"A polygon can be divided into simple shapes to find its area. Which is a useful first step?","o":["Measure its colour","Draw diagonals from a vertex","Count its corners only","Find its perimeter only"],"a":1,"e":"Drawing diagonals can split a polygon into triangles whose areas can be added."},{"d":"BASIC","q":"A rectangle is 8 cm long and 3 cm wide. What is its area?","o":["11 cm²","22 cm²","24 cm²","48 cm²"],"a":2,"e":"Area = length × width = 8 × 3 = 24 cm²."},{"d":"BASIC","q":"A triangle has base 10 cm and perpendicular height 6 cm. Find its area.","o":["16 cm²","30 cm²","60 cm²","32 cm²"],"a":1,"e":"Area of triangle = ½ × base × height = ½ × 10 × 6 = 30 cm²."},{"d":"BASIC","q":"A parallelogram has base 9 cm and perpendicular height 4 cm. Its area is:","o":["13 cm²","18 cm²","36 cm²","72 cm²"],"a":2,"e":"Area of a parallelogram = base × perpendicular height = 9 × 4 = 36 cm²."},{"d":"BASIC","q":"A trapezium has parallel sides 5 cm and 9 cm, with height 4 cm. Find its area.","o":["14 cm²","28 cm²","36 cm²","56 cm²"],"a":1,"e":"Area = ½(5 + 9) × 4 = 28 cm²."},{"d":"BASIC","q":"A polygon is split into two non-overlapping triangles with areas 12 cm² and 15 cm². Total area?","o":["3 cm²","13.5 cm²","27 cm²","180 cm²"],"a":2,"e":"Add the parts: 12 + 15 = 27 cm²."},{"d":"BASIC","q":"What unit is appropriate for the area of a floor?","o":["metres","square metres","cubic metres","kilograms"],"a":1,"e":"Area measures a two-dimensional surface, so square units such as m² are used."},{"d":"BASIC","q":"A square has side 7 cm. Find its area.","o":["14 cm²","28 cm²","49 cm²","56 cm²"],"a":2,"e":"Area of a square = side² = 7² = 49 cm²."},{"d":"BASIC","q":"A rectangle of area 40 cm² is split into two equal-area parts. Each part has area:","o":["10 cm²","20 cm²","40 cm²","80 cm²"],"a":1,"e":"Each equal part is 40 ÷ 2 = 20 cm²."},{"d":"BASIC","q":"When finding polygon area by splitting it into shapes, what should you do with the areas of non-overlapping pieces?","o":["Add them","Multiply them","Subtract all of them","Divide by the number of sides"],"a":0,"e":"The total area is the sum of the areas of all non-overlapping pieces."},{"d":"MEDIUM","q":"A polygon is divided into a rectangle 10 cm × 4 cm and a triangle with base 10 cm and height 3 cm. Find total area.","o":["40 cm²","45 cm²","55 cm²","70 cm²"],"a":2,"e":"Rectangle area = 40 cm²; triangle area = ½ × 10 × 3 = 15 cm²; total = 55 cm²."},{"d":"MEDIUM","q":"A trapezium has parallel sides 12 cm and 20 cm and height 7 cm. Find its area.","o":["112 cm²","224 cm²","98 cm²","140 cm²"],"a":0,"e":"Area = ½(12 + 20) × 7 = 112 cm²."},{"d":"MEDIUM","q":"A polygon is split into three triangles with areas 8 cm², 11 cm² and 14 cm². What is the polygon's area?","o":["25 cm²","30 cm²","33 cm²","1232 cm²"],"a":2,"e":"Sum the triangle areas: 8 + 11 + 14 = 33 cm²."},{"d":"MEDIUM","q":"A shape consists of a 12 cm × 5 cm rectangle with a 4 cm × 3 cm rectangle removed. Find its area.","o":["48 cm²","60 cm²","72 cm²","36 cm²"],"a":0,"e":"Remaining area = 12 × 5 − 4 × 3 = 60 − 12 = 48 cm²."},{"d":"MEDIUM","q":"A parallelogram has area 72 cm² and base 12 cm. Find its perpendicular height.","o":["4 cm","5 cm","6 cm","8 cm"],"a":2,"e":"Height = area ÷ base = 72 ÷ 12 = 6 cm."},{"d":"MEDIUM","q":"A triangle has area 42 cm² and base 12 cm. Find its perpendicular height.","o":["3.5 cm","7 cm","14 cm","6 cm"],"a":1,"e":"42 = ½ × 12 × h, so h = 84 ÷ 12 = 7 cm."},{"d":"MEDIUM","q":"A polygon's area is found from a rectangle of 9 × 6 cm and a triangle of base 9 cm, height 4 cm. Total area?","o":["54 cm²","18 cm²","72 cm²","36 cm²"],"a":2,"e":"Rectangle = 54 cm²; triangle = 18 cm²; total = 72 cm²."},{"d":"MEDIUM","q":"A field is shaped as a trapezium with parallel sides 18 m and 26 m and height 10 m. Its area is:","o":["220 m²","440 m²","260 m²","180 m²"],"a":0,"e":"Area = ½(18 + 26) × 10 = 220 m²."},{"d":"MEDIUM","q":"A polygon has area 96 cm². One triangular part has area 28 cm². The remaining part's area is:","o":["68 cm²","124 cm²","34 cm²","28 cm²"],"a":0,"e":"Remaining area = 96 − 28 = 68 cm²."},{"d":"MEDIUM","q":"A rectangle 14 cm by 8 cm is cut diagonally into two equal triangles. Area of each triangle?","o":["22 cm²","56 cm²","112 cm²","44 cm²"],"a":1,"e":"Rectangle area = 14 × 8 = 112 cm²; each half is 56 cm²."},{"d":"HARD","q":"A polygon is split into a rectangle 12 cm × 6 cm, a triangle with base 12 cm and height 5 cm, and a triangle with base 6 cm and height 4 cm. Total area?","o":["114 cm²","96 cm²","84 cm²","132 cm²"],"a":0,"e":"Areas are 72, 30 and 12 cm². Total = 72 + 30 + 12 = 114 cm²."},{"d":"HARD","q":"An L-shaped floor is made from a 10 m × 8 m rectangle with a 4 m × 3 m corner removed. Find the remaining area.","o":["68 m²","80 m²","92 m²","56 m²"],"a":0,"e":"Full rectangle = 80 m²; removed corner = 12 m²; remaining = 68 m²."},{"d":"HARD","q":"A trapezium has area 135 cm², parallel sides 10 cm and 20 cm. Find its height.","o":["6 cm","9 cm","12 cm","15 cm"],"a":1,"e":"135 = ½(10 + 20)h = 15h, so h = 9 cm."},{"d":"HARD","q":"A polygon is triangulated into 5 triangles. Their areas are 7, 9, 12, 15 and 17 cm². Find total area.","o":["50 cm²","55 cm²","60 cm²","63 cm²"],"a":2,"e":"7 + 9 + 12 + 15 + 17 = 60 cm²."},{"d":"HARD","q":"A rectangular plot is 25 m by 16 m. A triangular pond with base 8 m and height 5 m occupies part of it. Area left for grass?","o":["360 m²","380 m²","400 m²","420 m²"],"a":1,"e":"Plot area = 400 m²; pond area = ½ × 8 × 5 = 20 m²; grass = 380 m²."},{"d":"HARD","q":"A polygon has area 210 cm². It is partitioned into a rectangle of 120 cm² and two equal triangles. Each triangle has area:","o":["35 cm²","40 cm²","45 cm²","90 cm²"],"a":2,"e":"The triangles share 210 − 120 = 90 cm² equally, so each is 45 cm²."},{"d":"HARD","q":"A trapezium's parallel sides are (x + 4) cm and (2x − 2) cm, and its height is 6 cm. If area is 60 cm², find x.","o":["4","5","6","7"],"a":2,"e":"60 = ½[(x+4)+(2x−2)]×6 = 9(3x+2)? Compute sum = 3x+2; area = 3(3x+2) = 9x+6. Thus 9x+6=60, x=6."},{"d":"HARD","q":"A polygon is formed by a 16 cm × 8 cm rectangle and a triangle of base 16 cm and height 6 cm attached along one side. Find the total area.","o":["29/3 cm","8 cm","10 cm","12 cm"],"a":0,"e":"Rectangle area = 96 cm²; triangle area = 154−96 = 58 cm². Since ½×12×h=58, h=116/12=29/3 cm."},{"d":"HARD","q":"A shape has area 154 cm² and is made from a rectangle 12 cm × 8 cm plus a triangle with base 12 cm. Find the triangle's height.","o":["87 cm²","73 cm²","75 cm²","85 cm²"],"a":0,"e":"First area = ½(6+10)×4 = 32 cm²; second = ½(8+14)×5 = 55 cm²; total = 87 cm²."},{"d":"HARD","q":"A polygon consists of two trapezia. Their parallel sides and heights are (6, 10, 4) cm and (8, 14, 5) cm. Find total area.","o":["70 cm²","85 cm²","100 cm²","115 cm²"],"a":2,"e":"First area = ½(6+10)×4 = 32 cm²; second = ½(8+14)×5 = 55 cm²; total = 87 cm²."},{"d":"HARD","q":"A polygon is split into a 10 cm × 7 cm rectangle and two triangles, each with base 10 cm and height 3 cm. Find its total area.","o":["70 cm²","85 cm²","100 cm²","115 cm²"],"a":1,"e":"Rectangle = 70 cm²; each triangle = 15 cm²; total = 100 cm²."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Calculate trapezium area</strong><small>Use base and perpendicular height</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Find missing base or height</strong><small>Solve triangle-area problems</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve practical area problems</strong><small>Apply area to real-world situations</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
