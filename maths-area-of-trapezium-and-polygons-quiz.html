<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"A trapezium has parallel sides 8 cm and 12 cm and height 5 cm. Find its area.","o":["40 cm²","50 cm²","60 cm²","100 cm²"],"a":1,"e":"Area = ½ × (8 + 12) × 5 = 50 cm².","v":"area-of-trapezium-and-polygons"},{"d":"BASIC","q":"Find the area of a trapezium with parallel sides 7 m and 13 m and height 4 m.","o":["26 m²","40 m²","52 m²","80 m²"],"a":1,"e":"Area = ½ × (7 + 13) × 4 = 40 m².","v":"area-of-trapezium-and-polygons"},{"d":"BASIC","q":"The parallel sides of a trapezium are 10 cm and 16 cm. Its height is 6 cm. What is its area?","o":["48 cm²","72 cm²","78 cm²","96 cm²"],"a":2,"e":"Area = ½ × 26 × 6 = 78 cm².","v":"area-of-trapezium-and-polygons"},{"d":"BASIC","q":"A trapezium has area 60 cm², parallel sides 8 cm and 12 cm. Find its height.","o":["3 cm","4 cm","5 cm","6 cm"],"a":3,"e":"60 = ½ × 20 × h = 10h, so h = 6 cm.","v":"area-of-trapezium-and-polygons"},{"d":"BASIC","q":"A trapezium has area 84 m², height 7 m and one parallel side 10 m. Find the other parallel side.","o":["12 m","14 m","16 m","18 m"],"a":1,"e":"84 = ½ × (10 + b) × 7, so 24 = 10 + b and b = 14 m.","v":"area-of-trapezium-and-polygons"},{"d":"BASIC","q":"Find the area of a triangle with base 12 cm and height 9 cm.","o":["54 cm²","108 cm²","21 cm²","42 cm²"],"a":0,"e":"Triangle area = ½ × base × height = ½ × 12 × 9 = 54 cm².","v":"area-of-trapezium-and-polygons"},{"d":"BASIC","q":"Find the area of a parallelogram with base 15 cm and perpendicular height 8 cm.","o":["60 cm²","100 cm²","120 cm²","240 cm²"],"a":2,"e":"Area of parallelogram = base × perpendicular height = 15 × 8 = 120 cm².","v":"area-of-trapezium-and-polygons"},{"d":"BASIC","q":"A rectangle is 12 m long and 7 m wide. Find its area.","o":["19 m²","38 m²","84 m²","168 m²"],"a":2,"e":"Area = length × width = 12 × 7 = 84 m².","v":"area-of-trapezium-and-polygons"},{"d":"BASIC","q":"A square has side 9 cm. Find its area.","o":["18 cm²","36 cm²","72 cm²","81 cm²"],"a":3,"e":"Area of a square = side² = 9² = 81 cm².","v":"area-of-trapezium-and-polygons"},{"d":"BASIC","q":"A polygon is divided into a rectangle of 8 cm by 5 cm and a triangle with base 8 cm and height 3 cm. Find the total area.","o":["40 cm²","12 cm²","52 cm²","64 cm²"],"a":2,"e":"Rectangle area = 40 cm²; triangle area = ½ × 8 × 3 = 12 cm²; total = 52 cm².","v":"area-of-trapezium-and-polygons"},{"d":"MEDIUM","q":"A field is shaped like a trapezium with parallel sides 25 m and 15 m and height 12 m. Find its area.","o":["120 m²","240 m²","300 m²","480 m²"],"a":1,"e":"Area = ½ × (25 + 15) × 12 = 240 m².","v":"area-of-trapezium-and-polygons"},{"d":"MEDIUM","q":"The parallel sides of a trapezium are 9 cm and 15 cm, and its area is 72 cm². Find the height.","o":["4 cm","6 cm","8 cm","12 cm"],"a":1,"e":"72 = ½ × 24 × h = 12h, hence h = 6 cm.","v":"area-of-trapezium-and-polygons"},{"d":"MEDIUM","q":"A trapezium has height 10 cm and area 95 cm². If one parallel side is 8 cm, find the other.","o":["9 cm","10 cm","11 cm","12 cm"],"a":2,"e":"95 = ½ × (8 + b) × 10, so 19 = 8 + b and b = 11 cm.","v":"area-of-trapezium-and-polygons"},{"d":"MEDIUM","q":"Find the area of a rhombus whose diagonals are 10 cm and 16 cm.","o":["80 cm²","160 cm²","26 cm²","40 cm²"],"a":0,"e":"Area of a rhombus = ½ × product of diagonals = ½ × 10 × 16 = 80 cm².","v":"area-of-trapezium-and-polygons"},{"d":"MEDIUM","q":"A kite has diagonals 14 cm and 9 cm. What is its area?","o":["23 cm²","63 cm²","126 cm²","46 cm²"],"a":1,"e":"Area = ½ × 14 × 9 = 63 cm².","v":"area-of-trapezium-and-polygons"},{"d":"MEDIUM","q":"Find the area of a parallelogram with base 11 cm and height 6 cm.","o":["17 cm²","34 cm²","66 cm²","121 cm²"],"a":2,"e":"Area = 11 × 6 = 66 cm².","v":"area-of-trapezium-and-polygons"},{"d":"MEDIUM","q":"A triangle has area 48 cm² and base 12 cm. Find its perpendicular height.","o":["4 cm","6 cm","8 cm","12 cm"],"a":2,"e":"48 = ½ × 12 × h = 6h, so h = 8 cm.","v":"area-of-trapezium-and-polygons"},{"d":"MEDIUM","q":"A rectangle of dimensions 10 cm × 6 cm has a square of side 2 cm cut out. Find the remaining area.","o":["56 cm²","60 cm²","64 cm²","68 cm²"],"a":0,"e":"Rectangle area = 60 cm²; removed square area = 4 cm²; remaining area = 56 cm².","v":"area-of-trapezium-and-polygons"},{"d":"MEDIUM","q":"A trapezium has parallel sides 4.5 cm and 7.5 cm and height 6 cm. Find its area.","o":["24 cm²","30 cm²","36 cm²","72 cm²"],"a":2,"e":"Area = ½ × (4.5 + 7.5) × 6 = 36 cm².","v":"area-of-trapezium-and-polygons"},{"d":"MEDIUM","q":"The area of a trapezium is 150 cm². Its parallel sides are 12 cm and 18 cm. Find its height.","o":["5 cm","8 cm","10 cm","12 cm"],"a":2,"e":"150 = ½ × 30 × h = 15h, so h = 10 cm.","v":"area-of-trapezium-and-polygons"},{"d":"HARD","q":"A polygon consists of two non-overlapping rectangles of areas 24 cm² and 35 cm². Find the polygon's area.","o":["11 cm²","59 cm²","840 cm²","35 cm²"],"a":1,"e":"For non-overlapping parts, add the areas: 24 + 35 = 59 cm².","v":"area-of-trapezium-and-polygons"},{"d":"HARD","q":"Find the area of a trapezium with parallel sides 3 m and 9 m and height 5 m.","o":["15 m²","30 m²","45 m²","60 m²"],"a":1,"e":"Area = ½ × (3 + 9) × 5 = 30 m².","v":"area-of-trapezium-and-polygons"},{"d":"HARD","q":"A square and a rectangle each have area 64 cm². What is the side of the square?","o":["4 cm","8 cm","16 cm","32 cm"],"a":1,"e":"Square side = √64 = 8 cm.","v":"area-of-trapezium-and-polygons"},{"d":"HARD","q":"A parallelogram has area 90 cm² and base 15 cm. Find its perpendicular height.","o":["5 cm","6 cm","7.5 cm","15 cm"],"a":1,"e":"Height = area ÷ base = 90 ÷ 15 = 6 cm.","v":"area-of-trapezium-and-polygons"},{"d":"HARD","q":"A triangle and a parallelogram have the same base and height. The parallelogram area is 70 cm². What is the triangle area?","o":["35 cm²","70 cm²","105 cm²","140 cm²"],"a":0,"e":"A triangle's area is half the area of a parallelogram with the same base and height.","v":"area-of-trapezium-and-polygons"},{"d":"HARD","q":"The parallel sides of a trapezium are 2x cm and 4x cm, and its height is 3 cm. Express its area.","o":["9x cm²","18x cm²","6x cm²","3x cm²"],"a":0,"e":"Area = ½ × (2x + 4x) × 3 = 9x cm².","v":"area-of-trapezium-and-polygons"},{"d":"HARD","q":"A trapezium has parallel sides 14 cm and 20 cm and height 9 cm. Find its area.","o":["126 cm²","153 cm²","306 cm²","171 cm²"],"a":1,"e":"Area = ½ × (14 + 20) × 9 = 153 cm².","v":"area-of-trapezium-and-polygons"},{"d":"HARD","q":"A polygon is made from a 6 cm × 4 cm rectangle and a triangle of base 6 cm and height 5 cm. Find the total area.","o":["24 cm²","15 cm²","39 cm²","54 cm²"],"a":2,"e":"Rectangle area = 24 cm²; triangle area = 15 cm²; total = 39 cm².","v":"area-of-trapezium-and-polygons"},{"d":"HARD","q":"A trapezium has area 108 cm², height 9 cm and parallel sides in the ratio 1:2. Find the shorter parallel side.","o":["6 cm","8 cm","12 cm","16 cm"],"a":1,"e":"Let the sides be x and 2x: 108 = ½ × 3x × 9 = 13.5x, so x = 8 cm.","v":"area-of-trapezium-and-polygons"},{"d":"HARD","q":"A rectangular garden is 18 m long and 12 m wide. A path covers 2 m² of its area. What is the remaining area?","o":["212 m²","214 m²","216 m²","220 m²"],"a":1,"e":"Garden area = 18 × 12 = 216 m²; subtract 2 m² to get 214 m².","v":"area-of-trapezium-and-polygons"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Apply standard algebraic identities</strong><small>Expand squares of sums and differences</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Use the difference-of-squares identity</strong><small>Recognise and simplify equivalent algebraic forms</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply identities accurately to expressions</strong><small>Reason about perfect squares and nearest squares</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
