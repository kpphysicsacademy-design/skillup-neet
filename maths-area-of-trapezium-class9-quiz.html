d x=5."},{"d":"HARD","q":"A field is trapezium-shaped with parallel sides 45 m and 65 m, and height 30 m. Find area.","o":["1,500 m²","1,650 m²","1,800 m²","3,300 m²"],"a":1,"e":"Area = ½ × (45+65) × 30 = 1,650 m²."},{"d":"HARD","q":"A trapezium has area 210 cm² and height 12 cm. Its parallel sides differ by 5 cm. Their sum is:","o":["25 cm","30 cm","35 cm","40 cm"],"a":2,"e":"Sum = 2A/h = 420/12 = 35 cm."},{"d":"HARD","q":"A trapezium has parallel sides 14 cm and 26 cm. Its area is 240 cm². Find height.","o":["8 cm","10 cm","12 cm","15 cm"],"a":2,"e":"240 = ½ × 40 × h, so h = 12 cm."},{"d":"HARD","q":"A trapezium's parallel sides increase by 20% and 30% respectively from 10 cm and 20 cm; height remains 5 cm. New area?","o":["85 cm²","90 cm²","95 cm²","100 cm²"],"a":2,"e":"New sides are 12 cm and 26 cm; area = ½ × 38 × 5 = 95 cm²."},{"d":"HARD","q":"A trapezium has area 180 cm² and height 9 cm. One parallel side is twice the other. Find the shorter side.","o":["10 cm","12 cm","13⅓ cm","15 cm"],"a":2,"e":"Sum of sides = 2A/h = 40 cm. If sides are x and 2x, 3x=40, so x=13⅓ cm."},{"d":"HARD","q":"A trapezium has parallel sides 16 cm and 24 cm and height 15 cm. A triangle with the same height and base equal to the shorter parallel side has what area?","o":["120 cm²","180 cm²","240 cm²","300 cm²"],"a":0,"e":"Triangle area = ½ × 16 × 15 = 120 cm²."},{"d":"HARD","q":"A trapezium-shaped plot has parallel sides 28 m and 42 m and height 20 m. If 15% is used for a pond, what area remains?","o":["595 m²","630 m²","700 m²","1,190 m²"],"a":0,"e":"Total area = ½ × 70 × 20 = 700 m²; 85% remains = 595 m²."},{"d":"HARD","q":"A trapezium has parallel sides in ratio 3:5 and height 12 cm. Its area is 192 cm². Find the longer parallel side.","o":["12 cm","16 cm","20 cm","24 cm"],"a":2,"e":"Sum of sides = 2×192/12 = 32 cm. 8k=32, k=4; longer side=5k=20 cm."},{"d":"HARD","q":"The area of a trapezium is 300 cm². Its height is 12 cm and its longer parallel side is 30 cm. Find the shorter side.","o":["15 cm","20 cm","25 cm","30 cm"],"a":1,"e":"Sum of parallel sides = 2×300/12 = 50 cm, so shorter side = 50−30 = 20 cm."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See result
