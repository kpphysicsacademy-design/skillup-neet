<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Find the area of a triangle with base 8 cm and height 5 cm.","o":["13 cm²","20 cm²","40 cm²","26 cm²"],"a":1,"e":"Area = ½ × 8 × 5 = 20 cm²."},{"d":"BASIC","q":"The area of a triangle is:","o":["base × height","½ × base × height","2 × base × height","base + height"],"a":1,"e":"A triangle's area is half the product of its base and perpendicular height."},{"d":"BASIC","q":"Base = 10 m and perpendicular height = 6 m. Area?","o":["16 m²","30 m²","60 m²","120 m²"],"a":1,"e":"Area = ½ × 10 × 6 = 30 m²."},{"d":"BASIC","q":"Base = 12 cm and height = 4 cm. Area?","o":["24 cm²","48 cm²","16 cm²","32 cm²"],"a":0,"e":"Area = ½ × 12 × 4 = 24 cm²."},{"d":"BASIC","q":"The height of a triangle is measured:","o":["Along the base","Perpendicular to the base","Along a sloping side always","Between any two vertices"],"a":1,"e":"Height is the perpendicular distance from the opposite vertex to the base line."},{"d":"BASIC","q":"Area = 24 cm² and base = 8 cm. Find height.","o":["3 cm","6 cm","8 cm","12 cm"],"a":1,"e":"24 = ½ × 8 × h, so h = 6 cm."},{"d":"BASIC","q":"If the base doubles and height stays fixed, area:","o":["Halves","Doubles","Triples","Stays the same"],"a":1,"e":"Area is directly proportional to base when height is fixed."},{"d":"BASIC","q":"Base = 6 cm and height = 7 cm. Area?","o":["13 cm²","21 cm²","42 cm²","18 cm²"],"a":1,"e":"Area = ½ × 6 × 7 = 21 cm²."},{"d":"BASIC","q":"Which unit is suitable for the area of a triangular garden?","o":["cm","m","m²","m³"],"a":2,"e":"Area is measured in square units, such as square metres."},{"d":"BASIC","q":"A triangle and parallelogram share the same base and height. Triangle area is:","o":["Equal","Half","Double","Four times"],"a":1,"e":"The triangle's area is half the parallelogram's area."},{"d":"MEDIUM","q":"Area = 54 cm² and base = 12 cm. Find height.","o":["4.5 cm","6 cm","9 cm","12 cm"],"a":2,"e":"54 = ½ × 12 × h, so h = 9 cm."},{"d":"MEDIUM","q":"Base = 15 cm, height = 8 cm. If base changes to 10 cm, new area?","o":["40 cm²","60 cm²","80 cm²","120 cm²"],"a":0,"e":"New area = ½ × 10 × 8 = 40 cm²."},{"d":"MEDIUM","q":"Area = 72 cm² and height = 9 cm. Find base.","o":["8 cm","12 cm","16 cm","18 cm"],"a":2,"e":"72 = ½ × b × 9, so b = 16 cm."},{"d":"MEDIUM","q":"A right triangle has perpendicular sides 9 cm and 12 cm. Area?","o":["21 cm²","54 cm²","108 cm²","36 cm²"],"a":1,"e":"Area = ½ × 9 × 12 = 54 cm²."},{"d":"MEDIUM","q":"Base = 14 cm and area = 63 cm². Find height.","o":["4.5 cm","7 cm","9 cm","14 cm"],"a":2,"e":"63 = ½ × 14 × h, so h = 9 cm."},{"d":"MEDIUM","q":"Both base and height are tripled. Area becomes:","o":["3 times","6 times","9 times","12 times"],"a":2,"e":"Area scales by 3 × 3 = 9."},{"d":"MEDIUM","q":"Base = 20 cm, height = 7 cm. Area in mm²?","o":["700 mm²","7,000 mm²","70,000 mm²","1,400 mm²"],"a":1,"e":"Area = 70 cm² = 7,000 mm²."},{"d":"MEDIUM","q":"Area = 0.6 m² and base = 1.5 m. Find height.","o":["0.4 m","0.8 m","1.2 m","1.8 m"],"a":1,"e":"0.6 = ½ × 1.5 × h, so h = 0.8 m."},{"d":"MEDIUM","q":"Two triangles have equal bases and heights 5 cm and 8 cm. Area ratio?","o":["5:8","8:5","25:64","1:1"],"a":0,"e":"For equal bases, areas are in the ratio of their heights: 5:8."},{"d":"MEDIUM","q":"Base = 18 cm. Height increases by 2 cm. By how much does area increase?","o":["9 cm²","18 cm²","36 cm²","90 cm²"],"a":1,"e":"Area increase = ½ × 18 × 2 = 18 cm²."},{"d":"HARD","q":"Base = (x+2) cm, height = 6 cm, area = 30 cm². Find x.","o":["6","8","10","12"],"a":1,"e":"30 = ½ × (x+2) × 6, so x+2=10 and x=8."},{"d":"HARD","q":"Area = 96 cm²; base:height = 3:4. Find base.","o":["8 cm","12 cm","16 cm","24 cm"],"a":1,"e":"Let base=3k, height=4k. 6k²=96, so k=4 and base=12 cm."},{"d":"HARD","q":"A triangular field has base 40 m and height 25 m. Grass costs ₹12/m². Total cost?","o":["₹4,000","₹5,000","₹6,000","₹12,000"],"a":2,"e":"Area = 500 m²; cost = 500 × ₹12 = ₹6,000."},{"d":"HARD","q":"Base increases 20% and height decreases 20%. New area is:","o":["96% of original","100% of original","104% of original","80% of original"],"a":0,"e":"Area factor = 1.2 × 0.8 = 0.96, or 96%."},{"d":"HARD","q":"Area = 150 cm² and base = 25 cm. Base becomes 15 cm, height unchanged. New area?","o":["60 cm²","90 cm²","100 cm²","125 cm²"],"a":1,"e":"Original height = 2×150/25 = 12 cm. New area = ½×15×12 = 90 cm²."},{"d":"HARD","q":"Two triangles have equal area. Bases are 12 cm and 18 cm. First height is 9 cm. Second height?","o":["4 cm","6 cm","8 cm","12 cm"],"a":1,"e":"Equal areas give 12×9=18×h, so h=6 cm."},{"d":"HARD","q":"A triangle has base 16 cm. Its area equals the perimeter of a square of side 8 cm. Find its height.","o":["2 cm","4 cm","8 cm","16 cm"],"a":1,"e":"Square perimeter = 32. Then ½×16×h=32, so h=4 cm."},{"d":"HARD","q":"A triangular plot has base 32 m and height 18 m. A path occupies 10% of the plot. Remaining area?","o":["259.2 m²","288 m²","300 m²","518.4 m²"],"a":0,"e":"Plot area = 288 m²; 90% remaining = 259.2 m²."},{"d":"HARD","q":"Base and height are both halved. Original area = 180 cm². New area?","o":["45 cm²","90 cm²","135 cm²","180 cm²"],"a":0,"e":"Halving both dimensions multiplies area by ¼; 180÷4=45 cm²."},{"d":"HARD","q":"A triangle has base 10 cm and height 12 cm. Another triangle has twice the area and the same height. Its base?","o":["5 cm","10 cm","20 cm","24 cm"],"a":2,"e":"With height fixed, doubling the area requires doubling the base to 20 cm."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Calculate triangle area</strong><small>Use base and perpendicular height</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Find missing base or height</strong><small>Solve triangle-area problems</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve practical area problems</strong><small>Apply area to real-world situations</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
