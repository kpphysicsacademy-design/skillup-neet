 and height decreases 20%. New area is:","o":["96% of original","100% of original","104% of original","80% of original"],"a":0,"why":"Area factor = 1.2 × 0.8 = 0.96, or 96%."},{"d":"HARD","q":"Area = 150 cm² and base = 25 cm. Base becomes 15 cm, height unchanged. New area?","o":["60 cm²","90 cm²","100 cm²","125 cm²"],"a":1,"why":"Original height = 2×150/25 = 12 cm. New area = ½×15×12 = 90 cm²."},{"d":"HARD","q":"Two triangles have equal area. Bases are 12 cm and 18 cm. First height is 9 cm. Second height?","o":["4 cm","6 cm","8 cm","12 cm"],"a":1,"why":"Equal areas give 12×9=18×h, so h=6 cm."},{"d":"HARD","q":"A triangle has base 16 cm and area 64 cm². Find its perpendicular height.","o":["2 cm","4 cm","8 cm","16 cm"],"a":2,"why":"64 = ½ × 16 × h, so 64 = 8h and h = 8 cm."},{"d":"HARD","q":"A triangular plot has base 32 m and height 18 m. A path occupies 10% of the plot. Remaining area?","o":["259.2 m²","288 m²","300 m²","518.4 m²"],"a":0,"why":"Plot area = 288 m²; 90% remaining = 259.2 m²."},{"d":"HARD","q":"Base and height are both halved. Original area = 180 cm². New area?","o":["45 cm²","90 cm²","135 cm²","180 cm²"],"a":0,"why":"Halving both dimensions multiplies area by ¼; 180÷4=45 cm²."},{"d":"HARD","q":"A triangle has base 10 cm and height 12 cm. Another triangle has twice the area and the same height. Its base?","o":["5 cm","10 cm","20 cm","24 cm"],"a":2,"why":"With height fixed, doubling the area requires doubling the base to 20 cm."}];
