<script>
(function(){
'use strict';
const questions=[{"q":"The area of a parallelogram is calculated using:","o":["Base × perpendicular height","Base + height","2 × (base + height)","½ × base × height"],"a":0,"why":"Area of a parallelogram equals base multiplied by perpendicular height."},{"q":"The area of a triangle is:","o":["Base × height","½ × base × perpendicular height","2 × base × height","Base + height"],"a":1,"why":"A triangle's area is half the product of its base and perpendicular height."},{"q":"A parallelogram has base 8 cm and height 5 cm. Its area is:","o":["13 cm²","20 cm²","40 cm²","80 cm²"],"a":2,"why":"Area = 8 × 5 = 40 cm²."},{"q":"A triangle has base 10 cm and height 6 cm. Its area is:","o":["16 cm²","30 cm²","60 cm²","120 cm²"],"a":1,"why":"Area = ½ × 10 × 6 = 30 cm²."},{"q":"The perpendicular height of a parallelogram is measured:","o":["Along a sloping side only","At 90° to the base","Along the diagonal","Around the boundary"],"a":1,"why":"Height is the perpendicular distance between the base and its opposite parallel side."},{"q":"What is the area of a triangle with base 12 m and height 4 m?","o":["16 m²","24 m²","48 m²","96 m²"],"a":1,"why":"Area = ½ × 12 × 4 = 24 m²."},{"q":"Area is measured in:","o":["Units","Square units","Cubic units","Degrees"],"a":1,"why":"Area measures a two-dimensional surface, so it uses square units."},{"q":"A triangle and a parallelogram have the same base and height. The triangle's area is:","o":["Twice the parallelogram's area","Equal to the parallelogram's area","Half the parallelogram's area","Four times the parallelogram's area"],"a":2,"why":"The triangle area is ½bh while the parallelogram area is bh."},{"q":"A parallelogram has base 9 cm and height 7 cm. Its area is:","o":["16 cm²","31.5 cm²","63 cm²","126 cm²"],"a":2,"why":"Area = 9 × 7 = 63 cm²."},{"q":"A triangle has area 24 cm² and base 8 cm. Its height is:","o":["3 cm","6 cm","8 cm","12 cm"],"a":1,"why":"24 = ½ × 8 × height, so height = 6 cm."},{"q":"A parallelogram's area is 72 cm² and its base is 12 cm. Find its perpendicular height.","o":["4 cm","6 cm","8 cm","12 cm"],"a":1,"why":"Height = area ÷ base = 72 ÷ 12 = 6 cm."},{"q":"A triangle has area 45 cm² and height 9 cm. Its base is:","o":["5 cm","10 cm","15 cm","20 cm"],"a":1,"why":"Base = 2 × area ÷ height = 90 ÷ 9 = 10 cm."},{"q":"A parallelogram has base 15 cm and area 120 cm². Its height is:","o":["6 cm","8 cm","10 cm","18 cm"],"a":1,"why":"Height = 120 ÷ 15 = 8 cm."},{"q":"A triangle's base is doubled while its height stays the same. Its area:","o":["Halves","Doubles","Triples","Stays unchanged"],"a":1,"why":"Area is directly proportional to the base when height is fixed."},{"q":"A parallelogram's height is halved and its base is doubled. Its area:","o":["Doubles","Halves","Stays the same","Becomes four times"],"a":2,"why":"New area = (2b) × (h/2) = bh, so the area is unchanged."},{"q":"A triangle has base 14 cm and height 11 cm. Its area is:","o":["25 cm²","77 cm²","154 cm²","308 cm²"],"a":1,"why":"Area = ½ × 14 × 11 = 77 cm²."},{"q":"A parallelogram and triangle have equal bases of 10 cm and heights of 6 cm. What is the difference in their areas?","o":["15 cm²","20 cm²","30 cm²","60 cm²"],"a":2,"why":"Parallelogram area=60 cm²; triangle area=30 cm²; difference=30 cm²."},{"q":"A triangle has area 54 cm² and base 12 cm. What is its height?","o":["4.5 cm","6 cm","9 cm","12 cm"],"a":2,"why":"Height = 2 × 54 ÷ 12 = 9 cm."},{"q":"A parallelogram's base is 2.5 m and perpendicular height is 4 m. Area is:","o":["6.5 m²","10 m²","13 m²","20 m²"],"a":1,"why":"Area = 2.5 × 4 = 10 m²."},{"q":"A triangle's base and height are both tripled. Its area becomes:","o":["3 times","6 times","9 times","27 times"],"a":2,"why":"Area scales by 3×3=9 when both base and height triple."},{"q":"A parallelogram has area 168 cm² and height 12 cm. Its base is:","o":["12 cm","14 cm","16 cm","20 cm"],"a":1,"why":"Base = 168 ÷ 12 = 14 cm."},{"q":"The area of a triangle is 96 m². If its base is 16 m, its perpendicular height is:","o":["6 m","8 m","12 m","16 m"],"a":2,"why":"Height = 2 × 96 ÷ 16 = 12 m."},{"q":"A parallelogram has base (x+3) cm and height 5 cm. Its area is 40 cm². Find x.","o":["3","5","8","11"],"a":1,"why":"5(x+3)=40, so x+3=8 and x=5."},{"q":"A triangle has base (2x) cm and height 7 cm. Its area is 42 cm². Find x.","o":["3","6","7","12"],"a":1,"why":"½ × 2x × 7 = 42, so 7x=42 and x=6. Correct option is 6."},{"q":"A triangle and a parallelogram have equal areas and the same height. If the triangle's base is 18 cm, the parallelogram's base is:","o":["9 cm","18 cm","36 cm","54 cm"],"a":0,"why":"½ × 18 × h = b × h, so the parallelogram base b=9 cm."},{"q":"A parallelogram has base 20 cm. Its height increases from 6 cm to 9 cm. By how much does its area increase?","o":["30 cm²","40 cm²","60 cm²","180 cm²"],"a":2,"why":"Increase = base × change in height = 20 × (9−6) = 60 cm²."},{"q":"A triangle's height is 8 cm and its area is 60 cm². If its base increases by 50% while height remains fixed, new area is:","o":["60 cm²","75 cm²","90 cm²","120 cm²"],"a":2,"why":"Area increases by 50% too: 60 × 1.5 = 90 cm²."},{"q":"A parallelogram has base 18 cm and area 198 cm². Its perpendicular height is:","o":["9 cm","10 cm","11 cm","12 cm"],"a":2,"why":"Height = 198 ÷ 18 = 11 cm."},{"q":"A triangle's base is 3 cm more than its height. Its area is 54 cm². If height is 9 cm, what is the base?","o":["6 cm","9 cm","12 cm","15 cm"],"a":2,"why":"The base is 9+3=12 cm; area = ½ × 12 × 9 = 54 cm²."},{"q":"A parallelogram has area 150 cm² and base 15 cm. A triangle has the same height and base 10 cm. Its area is:","o":["25 cm²","50 cm²","75 cm²","100 cm²"],"a":1,"why":"Parallelogram height = 150÷15=10 cm. Triangle area=½×10×10=50 cm²."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function clearChildren(node){while(node.firstChild)node.removeChild(node.firstChild);}
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 clearChildren($('options'));
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Area of Parallelograms and Triangles Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261104-physics-path-layout-v2" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.appendChild(q);item.appendChild(yours);item.appendChild(correct);item.appendChild(why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 clearChildren($('finishSlot'));$('finishSlot').appendChild(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';clearChildren($('finishSlot'));render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
