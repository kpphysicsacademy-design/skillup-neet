(function(){'use strict';const questions=[{"d":"BASIC","q":"The area of a parallelogram is calculated using:","o":["Base × perpendicular height","Base + height","2 × (base + height)","½ × base × height"],"a":0,"e":"Area of a parallelogram equals base multiplied by perpendicular height."},{"d":"BASIC","q":"The area of a triangle is:","o":["Base × height","½ × base × perpendicular height","2 × base × height","Base + height"],"a":1,"e":"A triangle's area is half the product of its base and perpendicular height."},{"d":"BASIC","q":"A parallelogram has base 8 cm and height 5 cm. Its area is:","o":["13 cm²","20 cm²","40 cm²","80 cm²"],"a":2,"e":"Area = 8 × 5 = 40 cm²."},{"d":"BASIC","q":"A triangle has base 10 cm and height 6 cm. Its area is:","o":["16 cm²","30 cm²","60 cm²","120 cm²"],"a":1,"e":"Area = ½ × 10 × 6 = 30 cm²."},{"d":"BASIC","q":"The perpendicular height of a parallelogram is measured:","o":["Along a sloping side only","At 90° to the base","Along the diagonal","Around the boundary"],"a":1,"e":"Height is the perpendicular distance between the base and its opposite parallel side."},{"d":"BASIC","q":"What is the area of a triangle with base 12 m and height 4 m?","o":["16 m²","24 m²","48 m²","96 m²"],"a":1,"e":"Area = ½ × 12 × 4 = 24 m²."},{"d":"BASIC","q":"Area is measured in:","o":["Units","Square units","Cubic units","Degrees"],"a":1,"e":"Area measures a two-dimensional surface, so it uses square units."},{"d":"BASIC","q":"A triangle and a parallelogram have the same base and height. The triangle's area is:","o":["Twice the parallelogram's area","Equal to the parallelogram's area","Half the parallelogram's area","Four times the parallelogram's area"],"a":2,"e":"The triangle area is ½bh while the parallelogram area is bh."},{"d":"BASIC","q":"A parallelogram has base 9 cm and height 7 cm. Its area is:","o":["16 cm²","31.5 cm²","63 cm²","126 cm²"],"a":2,"e":"Area = 9 × 7 = 63 cm²."},{"d":"BASIC","q":"A triangle has area 24 cm² and base 8 cm. Its height is:","o":["3 cm","6 cm","8 cm","12 cm"],"a":1,"e":"24 = ½ × 8 × height, so height = 6 cm."},{"d":"MEDIUM","q":"A parallelogram's area is 72 cm² and its base is 12 cm. Find its perpendicular height.","o":["4 cm","6 cm","8 cm","12 cm"],"a":1,"e":"Height = area ÷ base = 72 ÷ 12 = 6 cm."},{"d":"MEDIUM","q":"A triangle has area 45 cm² and height 9 cm. Its base is:","o":["5 cm","10 cm","15 cm","20 cm"],"a":1,"e":"Base = 2 × area ÷ height = 90 ÷ 9 = 10 cm."},{"d":"MEDIUM","q":"A parallelogram has base 15 cm and area 120 cm². Its height is:","o":["6 cm","8 cm","10 cm","18 cm"],"a":1,"e":"Height = 120 ÷ 15 = 8 cm."},{"d":"MEDIUM","q":"A triangle's base is doubled while its height stays the same. Its area:","o":["Halves","Doubles","Triples","Stays unchanged"],"a":1,"e":"Area is directly proportional to the base when height is fixed."},{"d":"MEDIUM","q":"A parallelogram's height is halved and its base is doubled. Its area:","o":["Doubles","Halves","Stays the same","Becomes four times"],"a":2,"e":"New area = (2b) × (h/2) = bh, so the area is unchanged."},{"d":"MEDIUM","q":"A triangle has base 14 cm and height 11 cm. Its area is:","o":["25 cm²","77 cm²","154 cm²","308 cm²"],"a":1,"e":"Area = ½ × 14 × 11 = 77 cm²."},{"d":"MEDIUM","q":"A parallelogram and triangle have equal bases of 10 cm and heights of 6 cm. What is the difference in their areas?","o":["15 cm²","20 cm²","30 cm²","60 cm²"],"a":2,"e":"Parallelogram area=60 cm²; triangle area=30 cm²; difference=30 cm²."},{"d":"MEDIUM","q":"A triangle has area 54 cm² and base 12 cm. What is its height?","o":["4.5 cm","6 cm","9 cm","12 cm"],"a":2,"e":"Height = 2 × 54 ÷ 12 = 9 cm."},{"d":"MEDIUM","q":"A parallelogram's base is 2.5 m and perpendicular height is 4 m. Area is:","o":["6.5 m²","10 m²","13 m²","20 m²"],"a":1,"e":"Area = 2.5 × 4 = 10 m²."},{"d":"MEDIUM","q":"A triangle's base and height are both tripled. Its area becomes:","o":["3 times","6 times","9 times","27 times"],"a":2,"e":"Area scales by 3×3=9 when both base and height triple."},{"d":"HARD","q":"A parallelogram has area 168 cm² and height 12 cm. Its base is:","o":["12 cm","14 cm","16 cm","20 cm"],"a":1,"e":"Base = 168 ÷ 12 = 14 cm."},{"d":"HARD","q":"The area of a triangle is 96 m². If its base is 16 m, its perpendicular height is:","o":["6 m","8 m","12 m","16 m"],"a":2,"e":"Height = 2 × 96 ÷ 16 = 12 m."},{"d":"HARD","q":"A parallelogram has base (x+3) cm and height 5 cm. Its area is 40 cm². Find x.","o":["3","5","8","11"],"a":1,"e":"5(x+3)=40, so x+3=8 and x=5."},{"d":"HARD","q":"A triangle has base (2x) cm and height 7 cm. Its area is 42 cm². Find x.","o":["3","6","7","12"],"a":1,"e":"½ × 2x × 7 = 42, so 7x=42 and x=6. Correct option is 6."},{"d":"HARD","q":"A triangle and a parallelogram have equal areas and the same height. If the triangle's base is 18 cm, the parallelogram's base is:","o":["9 cm","18 cm","36 cm","54 cm"],"a":0,"e":"½ × 18 × h = b × h, so the parallelogram base b=9 cm."},{"d":"HARD","q":"A parallelogram has base 20 cm. Its height increases from 6 cm to 9 cm. By how much does its area increase?","o":["30 cm²","40 cm²","60 cm²","180 cm²"],"a":2,"e":"Increase = base × change in height = 20 × (9−6) = 60 cm²."},{"d":"HARD","q":"A triangle's height is 8 cm and its area is 60 cm². If its base increases by 50% while height remains fixed, new area is:","o":["60 cm²","75 cm²","90 cm²","120 cm²"],"a":2,"e":"Area increases by 50% too: 60 × 1.5 = 90 cm²."},{"d":"HARD","q":"A parallelogram has base 18 cm and area 198 cm². Its perpendicular height is:","o":["9 cm","10 cm","11 cm","12 cm"],"a":2,"e":"Height = 198 ÷ 18 = 11 cm."},{"d":"HARD","q":"A triangle's base is 3 cm more than its height. Its area is 54 cm². If height is 9 cm, what is the base?","o":["6 cm","9 cm","12 cm","15 cm"],"a":2,"e":"The base is 9+3=12 cm; area = ½ × 12 × 9 = 54 cm²."},{"d":"HARD","q":"A parallelogram has area 150 cm² and base 15 cm. A triangle has the same height and base 10 cm. Its area is:","o":["25 cm²","50 cm²","75 cm²","100 cm²"],"a":1,"e":"Parallelogram height = 150÷15=10 cm. Triangle area=½×10×10=50 cm²."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Master area formulas</strong><small>Calculate parallelogram and triangle areas</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Connect base and perpendicular height</strong><small>Solve area word problems</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Use formulas and reverse calculations</strong><small>Apply area relationships</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
