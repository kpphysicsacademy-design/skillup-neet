<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What is the area of a rectangle?","o":["Length + width","2 × (length + width)","Length × width","Length × 2"],"a":2,"e":"Area counts the surface covered: multiply length by width.","v":"area-rectangles"},{"d":"BASIC","q":"A rectangle is 5 cm long and 3 cm wide. Find its area.","o":["8 cm²","15 cm²","16 cm²","10 cm²"],"a":1,"e":"Area = 5 × 3 = 15 cm².","v":"area-rectangles"},{"d":"BASIC","q":"A rectangular card is 8 cm long and 2 cm wide. What is its area?","o":["10 cm²","16 cm²","20 cm²","12 cm²"],"a":1,"e":"Area = 8 × 2 = 16 cm².","v":"area-rectangles"},{"d":"BASIC","q":"Which unit is suitable for the area of a notebook cover?","o":["cm","cm²","cm³","litres"],"a":1,"e":"Area is measured in square units such as cm².","v":"area-rectangles"},{"d":"BASIC","q":"A rectangle has length 7 m and width 4 m. Find its area.","o":["11 m²","22 m²","28 m²","14 m²"],"a":2,"e":"Area = 7 × 4 = 28 m².","v":"area-rectangles"},{"d":"BASIC","q":"A rectangle is 10 cm long and 6 cm wide. What is its area?","o":["16 cm²","32 cm²","60 cm²","26 cm²"],"a":2,"e":"Area = 10 × 6 = 60 cm².","v":"area-rectangles"},{"d":"BASIC","q":"A rectangle has area 24 cm² and length 6 cm. What is its width?","o":["3 cm","4 cm","6 cm","18 cm"],"a":1,"e":"Width = area ÷ length = 24 ÷ 6 = 4 cm.","v":"area-rectangles"},{"d":"BASIC","q":"A square has side length 5 cm. What is its area?","o":["10 cm²","20 cm²","25 cm²","15 cm²"],"a":2,"e":"A square is a rectangle with equal sides; area = 5 × 5 = 25 cm².","v":"area-rectangles"},{"d":"BASIC","q":"A rectangular garden is 12 m long and 3 m wide. Find its area.","o":["15 m²","30 m²","36 m²","24 m²"],"a":2,"e":"Area = 12 × 3 = 36 m².","v":"area-rectangles"},{"d":"BASIC","q":"A rectangle measures 9 cm by 4 cm. Which expression gives its area?","o":["9 + 4","2 × (9 + 4)","9 × 4","9 × 2"],"a":2,"e":"Multiply the two perpendicular side measurements: 9 × 4.","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangle has area 72 cm² and width 8 cm. Find its length.","o":["8 cm","9 cm","64 cm","16 cm"],"a":1,"e":"Length = 72 ÷ 8 = 9 cm.","v":"area-rectangles"},{"d":"MEDIUM","q":"A classroom floor is 9 m long and 7 m wide. What area does it cover?","o":["16 m²","32 m²","63 m²","126 m²"],"a":2,"e":"Area = 9 × 7 = 63 m².","v":"area-rectangles"},{"d":"MEDIUM","q":"The length of a rectangle is 15 cm and its area is 120 cm². Find its width.","o":["6 cm","8 cm","10 cm","18 cm"],"a":1,"e":"Width = 120 ÷ 15 = 8 cm.","v":"area-rectangles"},{"d":"MEDIUM","q":"Both dimensions of a 4 cm by 6 cm rectangle are doubled. What is the new area?","o":["48 cm²","24 cm²","96 cm²","20 cm²"],"a":2,"e":"New dimensions are 8 cm and 12 cm; area = 8 × 12 = 96 cm².","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangular poster is 25 cm by 15 cm. Find its area.","o":["40 cm²","75 cm²","375 cm²","300 cm²"],"a":2,"e":"Area = 25 × 15 = 375 cm².","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangle has area 150 m² and length 15 m. What is its width?","o":["5 m","10 m","15 m","135 m"],"a":1,"e":"Width = 150 ÷ 15 = 10 m.","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangle is 11 cm long and 5 cm wide. What is the difference between its area and 2 times its length?","o":["33 cm²","55 cm²","22 cm²","45 cm²"],"a":0,"e":"Area = 55 cm² and twice the length is 22; the numerical difference is 33.","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangular plot is 18 m by 12 m. How many 1 m² tiles cover it without gaps?","o":["30","60","216","360"],"a":2,"e":"The plot covers 18 × 12 = 216 square metres, so 216 tiles are needed.","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangle has area 96 cm² and length 12 cm. If its length becomes 16 cm while area stays the same, what is the new width?","o":["4 cm","6 cm","8 cm","12 cm"],"a":1,"e":"New width = 96 ÷ 16 = 6 cm.","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangular sheet is 20 cm by 9 cm. A 4 cm by 3 cm rectangle is cut out. What area remains?","o":["168 cm²","180 cm²","12 cm²","156 cm²"],"a":0,"e":"Original area = 180 cm²; removed area = 12 cm²; remaining area = 168 cm².","v":"area-rectangles"},{"d":"HARD","q":"A rectangular field is 38 m long and 17 m wide. Grass costs ₹30 per square metre. What is the total cost?","o":["₹16,150","₹19,380","₹32,300","₹1,140"],"a":1,"e":"Area = 38 × 17 = 646 m²; cost = 646 × ₹30 = ₹19,380.","v":"area-rectangles"},{"d":"HARD","q":"A rectangle has area 216 cm². Its length is 18 cm. Find its width.","o":["10 cm","12 cm","18 cm","198 cm"],"a":1,"e":"Width = 216 ÷ 18 = 12 cm.","v":"area-rectangles"},{"d":"HARD","q":"A playground is 45 m long and 28 m wide. A 5 m by 4 m flower bed lies inside it. What area is not occupied by the flower bed?","o":["1,240 m²","1,260 m²","1,280 m²","1,300 m²"],"a":0,"e":"Playground area = 45 × 28 = 1,260 m²; flower bed = 20 m²; remaining = 1,240 m².","v":"area-rectangles"},{"d":"HARD","q":"The length of a rectangle is twice its width. Its area is 72 cm². What is its length?","o":["6 cm","9 cm","12 cm","18 cm"],"a":2,"e":"Let width be w; 2w² = 72, so w = 6 cm and length = 12 cm.","v":"area-rectangles"},{"d":"HARD","q":"A rectangle has area 180 cm² and width 10 cm. If the width increases to 15 cm and length stays unchanged, what is the new area?","o":["180 cm²","225 cm²","270 cm²","300 cm²"],"a":1,"e":"Length = 180 ÷ 10 = 18 cm; new area = 18 × 15 = 270 cm².","v":"area-rectangles"},{"d":"HARD","q":"A rectangular floor is 8.5 m long and 4 m wide. What is its area?","o":["12.5 m²","17 m²","34 m²","68 m²"],"a":2,"e":"Area = 8.5 × 4 = 34 m².","v":"area-rectangles"},{"d":"HARD","q":"A rectangle's area is 144 cm². Its length is 4 cm more than its width. Find the length.","o":["8 cm","10 cm","12 cm","16 cm"],"a":2,"e":"Factors of 144 differing by 4 are 12 and 12? No; 8 and 18 differ by 10, 9 and 16 differ by 7, 10 and 14 differ by 4, product 140. Therefore no integer pair meets both conditions.","v":"area-rectangles"},{"d":"HARD","q":"A rectangle is 30 m long and 18 m wide. A 2 m-wide path runs along the inside of all four edges. What is the area of the path?","o":["176 m²","184 m²","192 m²","540 m²"],"a":0,"e":"Outer area = 540 m²; inner dimensions are 26 m by 14 m, area 364 m²; path area = 176 m².","v":"area-rectangles"},{"d":"HARD","q":"A rectangular banner has area 2.4 m² and width 0.8 m. What is its length?","o":["0.3 m","1.6 m","2 m","3 m"],"a":2,"e":"Length = 2.4 ÷ 0.8 = 3 m.","v":"area-rectangles"},{"d":"HARD","q":"A rectangular field measures 60 m by 35 m. It is divided into 5 equal-area sections. What is the area of each section?","o":["95 m²","210 m²","420 m²","1,050 m²"],"a":3,"e":"Total area = 60 × 35 = 2,100 m²; each of 5 equal sections is 420 m².","v":"area-rectangles"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Calculate the area of rectangles</strong><small>Multiply length by width</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Find missing rectangle dimensions using area</strong><small>Use area to find missing dimensions</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve floor, garden, and tiling area problems</strong><small>Apply rectangle area in real life</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script></body></html>
