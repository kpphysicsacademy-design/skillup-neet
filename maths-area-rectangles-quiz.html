(function(){'use strict';const questions=[{"d":"BASIC","q":"What is the area of a rectangle?","o":["Length + width","2 × (length + width)","Length × width","Length × 2"],"a":2,"e":"Area counts the surface covered: multiply length by width.","v":"area-rectangles"},{"d":"BASIC","q":"A rectangle is 5 cm long and 3 cm wide. What is its area?","o":["8 cm²","15 cm²","16 cm²","30 cm²"],"a":1,"e":"5 × 3 = 15 cm².","v":"area-rectangles"},{"d":"BASIC","q":"A rectangle measures 9 m by 4 m. Find its area.","o":["13 m²","26 m²","36 m²","18 m²"],"a":2,"e":"9 × 4 = 36 m².","v":"area-rectangles"},{"d":"BASIC","q":"Which unit is suitable for the area of a rectangular classroom floor?","o":["Metres","Square metres","Cubic metres","Kilograms"],"a":1,"e":"Floor area is measured in square units, commonly square metres.","v":"area-rectangles"},{"d":"BASIC","q":"A rectangle has length 7 cm and width 2 cm. What is its area?","o":["9 cm²","14 cm²","18 cm²","28 cm²"],"a":1,"e":"7 × 2 = 14 cm².","v":"area-rectangles"},{"d":"BASIC","q":"A rectangular card has area 24 cm² and width 4 cm. What is its length?","o":["6 cm","20 cm","28 cm","8 cm"],"a":0,"e":"Length = area ÷ width = 24 ÷ 4 = 6 cm.","v":"area-rectangles"},{"d":"BASIC","q":"A rectangle is 10 units long and 6 units wide. What is its area?","o":["16 square units","32 square units","60 square units","120 square units"],"a":2,"e":"10 × 6 = 60 square units.","v":"area-rectangles"},{"d":"BASIC","q":"A rectangular garden is 8 m long and 8 m wide. What is its area?","o":["16 m²","32 m²","64 m²","80 m²"],"a":2,"e":"8 × 8 = 64 m².","v":"area-rectangles"},{"d":"BASIC","q":"A rectangle covers 42 square centimetres and is 6 cm wide. What is its length?","o":["7 cm","8 cm","36 cm","48 cm"],"a":0,"e":"42 ÷ 6 = 7 cm.","v":"area-rectangles"},{"d":"BASIC","q":"If a rectangle's length doubles while its width stays the same, what happens to its area?","o":["It halves","It doubles","It stays the same","It becomes four times as large"],"a":1,"e":"Doubling one factor doubles the product, so the area doubles.","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangle is 12 cm long and 7 cm wide. What is its area?","o":["19 cm²","38 cm²","84 cm²","72 cm²"],"a":2,"e":"12 × 7 = 84 cm².","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangular field has area 96 m² and length 12 m. Find its width.","o":["6 m","8 m","10 m","12 m"],"a":1,"e":"Width = 96 ÷ 12 = 8 m.","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangular poster measures 15 cm by 8 cm. How much surface does it cover?","o":["23 cm²","46 cm²","120 cm²","240 cm²"],"a":2,"e":"15 × 8 = 120 cm².","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangle has area 72 cm² and width 9 cm. Find its length.","o":["6 cm","8 cm","9 cm","63 cm"],"a":1,"e":"72 ÷ 9 = 8 cm.","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangular room is 6 m long and 4 m wide. Each square metre requires one floor tile. How many tiles cover the floor?","o":["10","20","24","30"],"a":2,"e":"The floor area is 6 × 4 = 24 m², so 24 one-square-metre tiles are needed.","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangle is 11 cm long and 5 cm wide. If its width increases to 7 cm, what is the new area?","o":["55 cm²","66 cm²","77 cm²","121 cm²"],"a":2,"e":"The new area is 11 × 7 = 77 cm².","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangular garden is 14 m long and 9 m wide. A flower bed covers 20 m². What area remains uncovered?","o":["106 m²","126 m²","146 m²","20 m²"],"a":0,"e":"Garden area = 14 × 9 = 126 m²; uncovered area = 126 − 20 = 106 m².","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangle has area 108 cm². Its length is 12 cm. What is its width?","o":["8 cm","9 cm","10 cm","12 cm"],"a":1,"e":"108 ÷ 12 = 9 cm.","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangular sheet is 18 cm long and 5 cm wide. How much larger is its area than a 10 cm by 4 cm sheet?","o":["10 cm²","40 cm²","50 cm²","90 cm²"],"a":2,"e":"The areas are 18 × 5 = 90 cm² and 10 × 4 = 40 cm²; the difference is 50 cm².","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangular playground has length 25 m and width 16 m. What is its area?","o":["41 m²","82 m²","400 m²","450 m²"],"a":2,"e":"25 × 16 = 400 m².","v":"area-rectangles"},{"d":"HARD","q":"A rectangle has area 144 cm² and width 9 cm. What is its length?","o":["12 cm","16 cm","18 cm","135 cm"],"a":1,"e":"144 ÷ 9 = 16 cm.","v":"area-rectangles"},{"d":"HARD","q":"A rectangle is 20 m long and 12 m wide. Its length is reduced by 5 m and width stays the same. What is the new area?","o":["240 m²","180 m²","204 m²","300 m²"],"a":1,"e":"New length = 15 m; area = 15 × 12 = 180 m².","v":"area-rectangles"},{"d":"HARD","q":"A rectangle has length 3 times its width and area 75 cm². What is its width?","o":["3 cm","5 cm","15 cm","25 cm"],"a":1,"e":"Let width be w; 3w² = 75, so w² = 25 and w = 5 cm.","v":"area-rectangles"},{"d":"HARD","q":"A rectangular wall is 8 m long and 3 m high. A window of 2 m by 1 m is not painted. What area of wall is painted?","o":["24 m²","22 m²","20 m²","18 m²"],"a":1,"e":"Wall area = 8 × 3 = 24 m²; window area = 2 m²; painted area = 22 m².","v":"area-rectangles"},{"d":"HARD","q":"A rectangle has area 180 m² and length 15 m. If the length becomes 18 m and the area is to remain 180 m², what must the new width be?","o":["10 m","12 m","15 m","18 m"],"a":0,"e":"Width = 180 ÷ 18 = 10 m.","v":"area-rectangles"},{"d":"HARD","q":"A rectangular lawn is 30 m by 18 m. A rectangular pond measuring 6 m by 4 m is inside it. What is the lawn area excluding the pond?","o":["516 m²","540 m²","504 m²","492 m²"],"a":0,"e":"Lawn = 30 × 18 = 540 m²; pond = 6 × 4 = 24 m²; remaining = 516 m².","v":"area-rectangles"},{"d":"HARD","q":"A rectangle's length is 4 cm more than its width. Its width is 6 cm. What is its area?","o":["36 cm²","60 cm²","24 cm²","40 cm²"],"a":1,"e":"Length = 6 + 4 = 10 cm; area = 10 × 6 = 60 cm².","v":"area-rectangles"},{"d":"HARD","q":"A rectangular banner has area 210 cm² and width 10 cm. If its length increases by 4 cm, what is the new area?","o":["214 cm²","250 cm²","252 cm²","294 cm²"],"a":1,"e":"Original length = 210 ÷ 10 = 21 cm; new length = 25 cm; new area = 25 × 10 = 250 cm².","v":"area-rectangles"},{"d":"HARD","q":"A rectangular floor is 9 m by 7 m. It is covered with square tiles each having area 1 m². How many tiles are needed?","o":["16","32","63","81"],"a":2,"e":"Floor area = 9 × 7 = 63 m², requiring 63 tiles of 1 m² each.","v":"area-rectangles"},{"d":"HARD","q":"A rectangle has area 168 cm² and length 14 cm. If both its length and width are doubled, what is the new area?","o":["336 cm²","504 cm²","672 cm²","1,344 cm²"],"a":2,"e":"Original width = 168 ÷ 14 = 12 cm; doubled dimensions are 28 cm and 24 cm, so area = 672 cm².","v":"area-rectangles"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Calculate the area of rectangles</strong><small>Multiply length by width</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Find missing rectangle dimensions using area</strong><small>Use area to find missing dimensions</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve floor, garden, and tiling area problems</strong><small>Apply rectangle area in real life</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
