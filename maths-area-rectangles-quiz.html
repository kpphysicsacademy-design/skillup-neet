<script>
(()=>{'use strict';const questions=[{"d":"BASIC","q":"What is the area of a rectangle?","o":["Length + width","2 × (length + width)","Length × width","Length × 2"],"a":2,"e":"Area counts the surface covered: multiply length by width.","v":"area-rectangles"},{"d":"BASIC","q":"A rectangle is 5 cm long and 3 cm wide. What is its area?","o":["8 cm²","15 cm²","16 cm²","30 cm²"],"a":1,"e":"5 × 3 = 15 cm².","v":"area-rectangles"},{"d":"BASIC","q":"A rectangle measures 9 m by 4 m. Find its area.","o":["13 m²","26 m²","36 m²","18 m²"],"a":2,"e":"9 × 4 = 36 m².","v":"area-rectangles"},{"d":"BASIC","q":"Which unit is suitable for the area of a rectangular classroom floor?","o":["Metres","Square metres","Cubic metres","Kilograms"],"a":1,"e":"Floor area is measured in square units, commonly square metres.","v":"area-rectangles"},{"d":"BASIC","q":"A rectangle has length 7 cm and width 2 cm. What is its area?","o":["9 cm²","14 cm²","18 cm²","28 cm²"],"a":1,"e":"7 × 2 = 14 cm².","v":"area-rectangles"},{"d":"BASIC","q":"A rectangular card has area 24 cm² and width 4 cm. What is its length?","o":["6 cm","20 cm","28 cm","8 cm"],"a":0,"e":"Length = area ÷ width = 24 ÷ 4 = 6 cm.","v":"area-rectangles"},{"d":"BASIC","q":"A rectangle is 10 units long and 6 units wide. What is its area?","o":["16 square units","32 square units","60 square units","120 square units"],"a":2,"e":"10 × 6 = 60 square units.","v":"area-rectangles"},{"d":"BASIC","q":"A rectangular garden is 8 m long and 8 m wide. What is its area?","o":["16 m²","32 m²","64 m²","80 m²"],"a":2,"e":"8 × 8 = 64 m².","v":"area-rectangles"},{"d":"BASIC","q":"A rectangle covers 42 square centimetres and is 6 cm wide. What is its length?","o":["7 cm","8 cm","36 cm","48 cm"],"a":0,"e":"42 ÷ 6 = 7 cm.","v":"area-rectangles"},{"d":"BASIC","q":"If a rectangle's length doubles while its width stays the same, what happens to its area?","o":["It halves","It doubles","It stays the same","It becomes four times as large"],"a":1,"e":"Doubling one factor doubles the product, so the area doubles.","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangle is 12 cm long and 7 cm wide. What is its area?","o":["19 cm²","38 cm²","84 cm²","72 cm²"],"a":2,"e":"12 × 7 = 84 cm².","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangular field has area 96 m² and length 12 m. Find its width.","o":["6 m","8 m","10 m","12 m"],"a":1,"e":"Width = 96 ÷ 12 = 8 m.","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangular poster measures 15 cm by 8 cm. How much surface does it cover?","o":["23 cm²","46 cm²","120 cm²","240 cm²"],"a":2,"e":"15 × 8 = 120 cm².","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangle has area 72 cm² and width 9 cm. Find its length.","o":["6 cm","8 cm","9 cm","63 cm"],"a":1,"e":"72 ÷ 9 = 8 cm.","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangular room is 6 m long and 4 m wide. Each square metre requires one floor tile. How many tiles cover the floor?","o":["10","20","24","30"],"a":2,"e":"The floor area is 6 × 4 = 24 m², so 24 one-square-metre tiles are needed.","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangle is 11 cm long and 5 cm wide. If its width increases to 7 cm, what is the new area?","o":["55 cm²","66 cm²","77 cm²","121 cm²"],"a":2,"e":"The new area is 11 × 7 = 77 cm².","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangular garden is 14 m long and 9 m wide. A flower bed covers 20 m². What area remains uncovered?","o":["106 m²","126 m²","146 m²","20 m²"],"a":0,"e":"Garden area = 14 × 9 = 126 m²; uncovered area = 126 − 20 = 106 m².","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangle has area 108 cm². Its length is 12 cm. What is its width?","o":["8 cm","9 cm","10 cm","12 cm"],"a":1,"e":"108 ÷ 12 = 9 cm.","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangular sheet is 18 cm long and 5 cm wide. How much larger is its area than a 10 cm by 4 cm sheet?","o":["10 cm²","40 cm²","50 cm²","90 cm²"],"a":2,"e":"The areas are 18 × 5 = 90 cm² and 10 × 4 = 40 cm²; the difference is 50 cm².","v":"area-rectangles"},{"d":"MEDIUM","q":"A rectangular playground has length 25 m and width 16 m. What is its area?","o":["41 m²","82 m²","400 m²","450 m²"],"a":2,"e":"25 × 16 = 400 m².","v":"area-rectangles"},{"d":"HARD","q":"A rectangle has area 144 cm² and width 9 cm. What is its length?","o":["12 cm","16 cm","18 cm","135 cm"],"a":1,"e":"144 ÷ 9 = 16 cm.","v":"area-rectangles"},{"d":"HARD","q":"A rectangle is 20 m long and 12 m wide. Its length is reduced by 5 m and width stays the same. What is the new area?","o":["240 m²","180 m²","204 m²","300 m²"],"a":1,"e":"New length = 15 m; area = 15 × 12 = 180 m².","v":"area-rectangles"},{"d":"HARD","q":"A rectangle has length 3 times its width and area 75 cm². What is its width?","o":["3 cm","5 cm","15 cm","25 cm"],"a":1,"e":"Let width be w; 3w² = 75, so w² = 25 and w = 5 cm.","v":"area-rectangles"},{"d":"HARD","q":"A rectangular wall is 8 m long and 3 m high. A window of 2 m by 1 m is not painted. What area of wall is painted?","o":["24 m²","22 m²","20 m²","18 m²"],"a":1,"e":"Wall area = 8 × 3 = 24 m²; window area = 2 m²; painted area = 22 m².","v":"area-rectangles"},{"d":"HARD","q":"A rectangle has area 180 m² and length 15 m. If the length becomes 18 m and the area is to remain 180 m², what must the new width be?","o":["10 m","12 m","15 m","18 m"],"a":0,"e":"Width = 180 ÷ 18 = 10 m.","v":"area-rectangles"},{"d":"HARD","q":"A rectangular lawn is 30 m by 18 m. A rectangular pond measuring 6 m by 4 m is inside it. What is the lawn area excluding the pond?","o":["516 m²","540 m²","504 m²","492 m²"],"a":0,"e":"Lawn = 30 × 18 = 540 m²; pond = 6 × 4 = 24 m²; remaining = 516 m².","v":"area-rectangles"},{"d":"HARD","q":"A rectangle's length is 4 cm more than its width. Its width is 6 cm. What is its area?","o":["36 cm²","60 cm²","24 cm²","40 cm²"],"a":1,"e":"Length = 6 + 4 = 10 cm; area = 10 × 6 = 60 cm².","v":"area-rectangles"},{"d":"HARD","q":"A rectangular banner has area 210 cm² and width 10 cm. If its length increases by 4 cm, what is the new area?","o":["214 cm²","250 cm²","252 cm²","294 cm²"],"a":1,"e":"Original length = 210 ÷ 10 = 21 cm; new length = 25 cm; new area = 25 × 10 = 250 cm².","v":"area-rectangles"},{"d":"HARD","q":"A rectangular floor is 9 m by 7 m. It is covered with square tiles each having area 1 m². How many tiles are needed?","o":["16","32","63","81"],"a":2,"e":"Floor area = 9 × 7 = 63 m², requiring 63 tiles of 1 m² each.","v":"area-rectangles"},{"d":"HARD","q":"A rectangle has area 168 cm² and length 14 cm. If both its length and width are doubled, what is the new area?","o":["336 cm²","504 cm²","672 cm²","1,344 cm²"],"a":2,"e":"Original width = 168 ÷ 14 = 12 cm; doubled dimensions are 28 cm and 24 cm, so area = 672 cm².","v":"area-rectangles"}];;const questions=[{"d":"BASIC","q":"Which is greater: 0.8 or 0.75?","o":["0.8","0.75","They are equal","Cannot be compared"],"a":0,"e":"Write 0.8 as 0.80; 0.80 is greater than 0.75.","v":"comparing-decimals"},{"d":"BASIC","q":"Which is the smallest decimal?","o":["0.6","0.06","0.66","0.606"],"a":1,"e":"Compare place values: 0.06 is six hundredths, smaller than the other values.","v":"comparing-decimals"},{"d":"BASIC","q":"Compare 3.45 and 3.5.","o":["3.45 > 3.5","3.45 < 3.5","3.45 = 3.5","Cannot be compared"],"a":1,"e":"Write 3.5 as 3.50; 3.45 is smaller than 3.50.","v":"comparing-decimals"},{"d":"BASIC","q":"Which number is greatest?","o":["2.09","2.9","2.19","2.099"],"a":1,"e":"Write 2.9 as 2.900; it is greater than the other options.","v":"comparing-decimals"},{"d":"BASIC","q":"Arrange 0.3 and 0.27 in ascending order.","o":["0.3, 0.27","0.27, 0.3","They are equal","Cannot be ordered"],"a":1,"e":"0.3 = 0.30, and 0.27 is smaller than 0.30.","v":"comparing-decimals"},{"d":"BASIC","q":"Which is greater: 5.04 or 5.4?","o":["5.04","5.4","They are equal","Cannot be compared"],"a":1,"e":"5.4 = 5.40, which is greater than 5.04.","v":"comparing-decimals"},{"d":"BASIC","q":"Which decimal lies between 1.2 and 1.3?","o":["1.19","1.25","1.31","1.03"],"a":1,"e":"1.25 is greater than 1.20 and less than 1.30.","v":"comparing-decimals"},{"d":"BASIC","q":"Which is the greatest?","o":["0.99","0.909","0.9","0.099"],"a":0,"e":"Write as thousandths: 0.990, 0.909, 0.900, and 0.099.","v":"comparing-decimals"},{"d":"BASIC","q":"Compare 7.08 and 7.080.","o":["7.08 > 7.080","7.08 < 7.080","They are equal","Their difference is 0.08"],"a":2,"e":"A zero added at the end of a decimal does not change its value.","v":"comparing-decimals"},{"d":"BASIC","q":"Which is the smallest?","o":["4.101","4.11","4.01","4.1"],"a":2,"e":"4.01 is less than 4.100, 4.101, and 4.110.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Arrange 2.45, 2.405, 2.5 in ascending order.","o":["2.405, 2.45, 2.5","2.45, 2.405, 2.5","2.5, 2.45, 2.405","2.405, 2.5, 2.45"],"a":0,"e":"Write to thousandths: 2.405, 2.450, and 2.500.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Which comparison is correct?","o":["0.704 < 0.74","0.704 > 0.74","0.704 = 0.74","0.704 > 0.8"],"a":0,"e":"0.74 = 0.740, which is greater than 0.704.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Which is closest to 6?","o":["5.89","6.08","5.95","6.12"],"a":2,"e":"Distances from 6 are 0.11, 0.08, 0.05, and 0.12; 5.95 is closest.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Which decimal is between 0.405 and 0.41?","o":["0.4","0.407","0.415","0.401"],"a":1,"e":"0.407 is greater than 0.405 and less than 0.410.","v":"comparing-decimals"},{"d":"MEDIUM","q":"A ribbon is 3.75 m and another is 3.705 m. Which is longer?","o":["3.75 m","3.705 m","They are equal","Not enough information"],"a":0,"e":"3.75 = 3.750, which is greater than 3.705.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Arrange 0.8, 0.808, 0.88 in descending order.","o":["0.8, 0.808, 0.88","0.88, 0.808, 0.8","0.808, 0.88, 0.8","0.88, 0.8, 0.808"],"a":1,"e":"Write to thousandths: 0.880 > 0.808 > 0.800.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Which is greater: 12.099 or 12.1?","o":["12.099","12.1","They are equal","Cannot be compared"],"a":1,"e":"12.1 = 12.100, greater than 12.099.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Which number is nearest to 0.5?","o":["0.48","0.53","0.46","0.57"],"a":0,"e":"Distances from 0.5 are 0.02, 0.03, 0.04, and 0.07; 0.48 is closest.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Which is the smallest among 9.09, 9.009, 9.9, and 9.099?","o":["9.09","9.009","9.9","9.099"],"a":1,"e":"9.009 is less than 9.090, 9.099, and 9.900.","v":"comparing-decimals"},{"d":"MEDIUM","q":"A runner's times are 12.45 s, 12.5 s, and 12.405 s. Which is the fastest?","o":["12.45 s","12.5 s","12.405 s","All are equal"],"a":2,"e":"The smallest time is fastest; 12.405 < 12.450 < 12.500.","v":"comparing-decimals"},{"d":"HARD","q":"Which is greater: 0.999 or 1.001?","o":["0.999","1.001","They are equal","Cannot be compared"],"a":1,"e":"1.001 is above 1, while 0.999 is below 1.","v":"comparing-decimals"},{"d":"HARD","q":"Arrange 4.06, 4.006, 4.6, 4.0601 in ascending order.","o":["4.006, 4.06, 4.0601, 4.6","4.06, 4.006, 4.0601, 4.6","4.6, 4.0601, 4.06, 4.006","4.006, 4.0601, 4.06, 4.6"],"a":0,"e":"To four decimal places: 4.0060 < 4.0600 < 4.0601 < 4.6000.","v":"comparing-decimals"},{"d":"HARD","q":"Which decimal is exactly halfway between 2.38 and 2.44?","o":["2.40","2.41","2.42","2.43"],"a":1,"e":"The midpoint is (2.38 + 2.44) ÷ 2 = 2.41.","v":"comparing-decimals"},{"d":"HARD","q":"Which number is closest to 10?","o":["9.87","10.08","9.94","10.11"],"a":2,"e":"Distances from 10 are 0.13, 0.08, 0.06, and 0.11; 9.94 is closest.","v":"comparing-decimals"},{"d":"HARD","q":"A package weighs 2.507 kg and another weighs 2.57 kg. What is their difference?","o":["0.063 kg","0.63 kg","0.037 kg","0.603 kg"],"a":0,"e":"2.570 − 2.507 = 0.063 kg.","v":"comparing-decimals"},{"d":"HARD","q":"Which statement is true?","o":["0.120 < 0.12","0.120 = 0.12","0.120 > 0.12","0.120 = 0.012"],"a":1,"e":"0.120 and 0.12 both represent twelve hundredths.","v":"comparing-decimals"},{"d":"HARD","q":"Which is the greatest positive decimal?","o":["0.505","0.55","0.5005","0.506"],"a":1,"e":"0.55 = 0.5500, greater than 0.5060, 0.5050, and 0.5005.","v":"comparing-decimals"},{"d":"HARD","q":"A student records 5.608, 5.68, 5.6081. Which is the greatest?","o":["5.608","5.68","5.6081","They are equal"],"a":1,"e":"5.68 = 5.6800, which exceeds 5.6081 and 5.6080.","v":"comparing-decimals"},{"d":"HARD","q":"Which number is strictly between 0.099 and 0.1?","o":["0.098","0.0995","0.101","0.09"],"a":1,"e":"0.0995 is greater than 0.099 and less than 0.100.","v":"comparing-decimals"},{"d":"HARD","q":"Four lengths are 1.205 m, 1.25 m, 1.2055 m, and 1.2 m. Which is the second-longest?","o":["1.205 m","1.25 m","1.2055 m","1.2 m"],"a":2,"e":"In descending order: 1.2500, 1.2055, 1.2050, 1.2000.","v":"comparing-decimals"}];const $=id=>document.getElementById(id);let i=0,sel=-1,locked=false,done=false,xp=0,correct=0,streak=0;const letters=['A','B','C','D'];
function progress(){const p=Math.round(i/questions.length*100);$('bar').style.width=p+'%';$('progress').setAttribute('aria-valuenow',p);$('pct').textContent=p+'% complete';}
function render(){const q=questions[i];sel=-1;locked=false;$('quiz').hidden=false;$('finish').hidden=true;$('counter').textContent='QUESTION '+(i+1)+' OF '+questions.length;$('meta').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(i+1);$('question').textContent=q.q;$('options').innerHTML='';q.o.forEach((v,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.innerHTML='<span class="letter">'+letters[j]+'</span><span></span>';b.querySelector('span:last-child').textContent=v;b.onclick=()=>{if(locked)return;sel=j;[...$('options').children].forEach((x,k)=>x.classList.toggle('selected',k===j));$('action').disabled=false;};$('options').appendChild(b);});$('feedback').className='feedback';$('feedback').textContent='';$('hint').textContent='30 questions · Select one answer';$('action').textContent='Check answer';$('action').disabled=true;progress();}
function act(){if(done){restart();return;}const q=questions[i];if(!locked){if(sel<0)return;locked=true;const ok=sel===q.a;if(ok){correct++;xp+=10;streak++;}else streak=0;$('xp').textContent='⭐ '+xp+' XP';$('streak').textContent='🔥 '+streak;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===sel)b.classList.add('wrong');});$('feedback').textContent=(ok?'✨ Correct! ':'💡 Review: ')+q.e;$('feedback').className='feedback show '+(ok?'good':'bad');$('hint').textContent=ok?'+10 XP':'Keep practising';$('action').textContent=i===questions.length-1?'View results →':'Continue →';return;}if(i<questions.length-1){i++;render();}else results();}
function results(){done=true;$('quiz').hidden=true;$('finish').hidden=false;$('counter').textContent='QUIZ COMPLETE';$('bar').style.width='100%';$('progress').setAttribute('aria-valuenow','100');$('pct').textContent='100% complete';$('finish').innerHTML='<div style="font-size:46px">🏆</div><h2>'+(correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!')+'</h2><div class="score">'+correct+' / '+questions.length+'</div><p>'+Math.round(correct/questions.length*100)+'% accuracy · '+xp+' XP earned</p><div class="skill"><strong>🔢 Compare decimal values</strong><small>Use place value to compare decimals accurately.</small></div><div class="skill"><strong>↔️ Order decimal numbers</strong><small>Compare decimals with different numbers of digits.</small></div><div class="skill"><strong>🧠 Apply comparison strategies</strong><small>Use equivalent trailing zeros and aligned place values.</small></div><button class="btn" id="retry">Try again ↻</button>';$('retry').onclick=restart;}
function restart(){i=0;sel=-1;locked=false;done=false;xp=0;correct=0;streak=0;$('xp').textContent='⭐ 0 XP';$('streak').textContent='🔥 0';render();}
$('action').onclick=act;render();})();
