<style>

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What is the area of a square with side 4 cm?","o":["8 cm²","12 cm²","16 cm²","20 cm²"],"a":2,"e":"Area of a square = side × side = 4 × 4 = 16 cm².","v":"area-squares"},{"d":"BASIC","q":"A square has side 7 m. What is its area?","o":["14 m²","28 m²","49 m²","56 m²"],"a":2,"e":"7 × 7 = 49 m².","v":"area-squares"},{"d":"BASIC","q":"A square floor tile has side 5 cm. Find its area.","o":["10 cm²","20 cm²","25 cm²","30 cm²"],"a":2,"e":"5 × 5 = 25 cm².","v":"area-squares"},{"d":"BASIC","q":"Which calculation gives the area of a square with side s?","o":["4 × s","s + s","s × s","2 × s"],"a":2,"e":"Multiply the side length by itself: s × s.","v":"area-squares"},{"d":"BASIC","q":"A square has side 9 cm. What is its area?","o":["18 cm²","36 cm²","81 cm²","90 cm²"],"a":2,"e":"9 × 9 = 81 cm².","v":"area-squares"},{"d":"BASIC","q":"A square has area 36 cm². How long is one side?","o":["6 cm","9 cm","12 cm","18 cm"],"a":0,"e":"6 × 6 = 36, so the side length is 6 cm.","v":"area-squares"},{"d":"BASIC","q":"A square garden is 8 m on each side. What area does it cover?","o":["16 m²","32 m²","64 m²","80 m²"],"a":2,"e":"8 × 8 = 64 m².","v":"area-squares"},{"d":"BASIC","q":"What unit is suitable for the area of a square notebook cover?","o":["Centimetres","Square centimetres","Cubic centimetres","Litres"],"a":1,"e":"Area is measured in square units, such as cm².","v":"area-squares"},{"d":"BASIC","q":"A square has side 3 cm. What is its area?","o":["6 cm²","9 cm²","12 cm²","18 cm²"],"a":1,"e":"3 × 3 = 9 cm².","v":"area-squares"},{"d":"BASIC","q":"If the side of a square is 6 units, how many 1-square-unit tiles cover it?","o":["12","24","36","48"],"a":2,"e":"A 6-by-6 square contains 6 × 6 = 36 unit squares.","v":"area-squares"},{"d":"MEDIUM","q":"A square has side length 12 cm. Find its area.","o":["24 cm²","48 cm²","144 cm²","124 cm²"],"a":2,"e":"12 × 12 = 144 cm².","v":"area-squares"},{"d":"MEDIUM","q":"A square has area 121 m². What is its side length?","o":["11 m","22 m","60.5 m","121 m"],"a":0,"e":"11 × 11 = 121, so each side is 11 m.","v":"area-squares"},{"d":"MEDIUM","q":"The side of a square increases from 4 cm to 6 cm. By how much does its area increase?","o":["8 cm²","12 cm²","20 cm²","36 cm²"],"a":2,"e":"Areas are 16 cm² and 36 cm²; increase = 36 − 16 = 20 cm².","v":"area-squares"},{"d":"MEDIUM","q":"A square courtyard has side 15 m. What is its area?","o":["30 m²","60 m²","225 m²","150 m²"],"a":2,"e":"15 × 15 = 225 m².","v":"area-squares"},{"d":"MEDIUM","q":"A square sheet covers 64 cm². If divided into 1 cm² squares, how many small squares are there?","o":["8","16","32","64"],"a":3,"e":"Each small square covers 1 cm², so 64 are needed.","v":"area-squares"},{"d":"MEDIUM","q":"A square has side 10 cm. A smaller square of side 4 cm is cut out. What area remains?","o":["84 cm²","60 cm²","16 cm²","116 cm²"],"a":0,"e":"Large area = 100 cm²; removed area = 16 cm²; remaining = 84 cm².","v":"area-squares"},{"d":"MEDIUM","q":"A square has area 196 cm². What is its side length?","o":["12 cm","14 cm","16 cm","18 cm"],"a":1,"e":"14 × 14 = 196, so its side is 14 cm.","v":"area-squares"},{"d":"MEDIUM","q":"A square mat has side 2 m. What is its area in square centimetres?","o":["400 cm²","4,000 cm²","20,000 cm²","40,000 cm²"],"a":3,"e":"2 m = 200 cm; area = 200 × 200 = 40,000 cm².","v":"area-squares"},{"d":"MEDIUM","q":"A square garden has side 13 m. How much larger is its area than a square with side 10 m?","o":["39 m²","69 m²","90 m²","169 m²"],"a":1,"e":"13² − 10² = 169 − 100 = 69 m².","v":"area-squares"},{"d":"MEDIUM","q":"A square's side is doubled from 5 cm to 10 cm. How many times as large is the new area?","o":["2 times","3 times","4 times","10 times"],"a":2,"e":"The areas are 25 cm² and 100 cm²; 100 ÷ 25 = 4.","v":"area-squares"},{"d":"HARD","q":"A square has area 225 cm². If its side length is increased by 3 cm, what is the new area?","o":["256 cm²","324 cm²","289 cm²","240 cm²"],"a":1,"e":"Original side is 15 cm; new side is 18 cm; area = 18 × 18 = 324 cm².","v":"area-squares"},{"d":"HARD","q":"The side of a square is 8 cm. A border 1 cm wide is added outside all sides, making a larger square. What is the area of the border alone?","o":["16 cm²","36 cm²","100 cm²","64 cm²"],"a":1,"e":"The outer side is 8 + 2 = 10 cm; border area = 10² − 8² = 36 cm².","v":"area-squares"},{"d":"HARD","q":"A square has area 400 m². What is the perimeter of the square?","o":["20 m","40 m","80 m","100 m"],"a":2,"e":"The side is √400 = 20 m; perimeter = 4 × 20 = 80 m.","v":"area-squares"},{"d":"HARD","q":"A square field has side 25 m. One square flower bed has side 5 m. What area of the field is not occupied by the flower bed?","o":["600 m²","625 m²","25 m²","500 m²"],"a":0,"e":"Field area = 625 m²; bed area = 25 m²; remaining area = 600 m².","v":"area-squares"},{"d":"HARD","q":"A square has side 14 cm. If its side is reduced by 2 cm, by how much does its area decrease?","o":["28 cm²","48 cm²","52 cm²","144 cm²"],"a":2,"e":"Original area 196 cm²; new area 12² = 144 cm²; decrease = 52 cm².","v":"area-squares"},{"d":"HARD","q":"A square patio is tiled with 1 m² tiles and has area 289 m². How many metres long is one side?","o":["13 m","15 m","17 m","19 m"],"a":2,"e":"17 × 17 = 289, so the side length is 17 m.","v":"area-squares"},{"d":"HARD","q":"Two identical square panels each have side 6 cm. What is their combined area if they do not overlap?","o":["24 cm²","36 cm²","72 cm²","144 cm²"],"a":2,"e":"Each panel covers 36 cm²; together they cover 2 × 36 = 72 cm².","v":"area-squares"},{"d":"HARD","q":"A square has area 81 cm². A square has the same area and width 9 cm. What is the square's length?","o":["8 cm","9 cm","18 cm","72 cm"],"a":1,"e":"Length = area ÷ width = 81 ÷ 9 = 9 cm.","v":"area-squares"},{"d":"HARD","q":"A square plot has side 18 m. A 6 m by 4 m shed is built inside it. What area remains outside the shed?","o":["300 m²","324 m²","24 m²","288 m²"],"a":0,"e":"Plot area = 18² = 324 m²; shed area = 24 m²; remaining = 300 m².","v":"area-squares"},{"d":"HARD","q":"A square's side is increased from 7 cm to 9 cm. What is the increase in area?","o":["14 cm²","30 cm²","32 cm²","81 cm²"],"a":2,"e":"New area 81 cm² minus old area 49 cm² equals 32 cm².","v":"area-squares"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Calculate the area of squares</strong><small>Multiply length by width</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Find missing square dimensions using area</strong><small>Use area to find missing dimensions</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve floor, garden, and tiling area problems</strong><small>Apply square area in real life</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
