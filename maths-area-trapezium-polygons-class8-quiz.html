<script>
(function(){
'use strict';
const questions=[{"q":"The area of a trapezium with parallel sides a and b and height h is:","o":["(a+b)h","½(a+b)h","ab+h","2(a+b)h"],"a":1,"why":"Area of a trapezium = half the sum of parallel sides multiplied by perpendicular height."},{"q":"A trapezium has parallel sides 6 cm and 10 cm, and height 4 cm. Its area is:","o":["16 cm²","24 cm²","32 cm²","40 cm²"],"a":2,"why":"Area=½(6+10)×4=32 cm²."},{"q":"A trapezium's parallel sides are 8 m and 12 m. Its height is 5 m. Area:","o":["20 m²","40 m²","50 m²","100 m²"],"a":2,"why":"Area=½(8+12)×5=50 m²."},{"q":"The height of a trapezium is the perpendicular distance between its:","o":["Non-parallel sides","Parallel sides","Vertices only","Diagonals"],"a":1,"why":"The height is the perpendicular separation between the parallel sides."},{"q":"A polygon with five sides is called a:","o":["Triangle","Quadrilateral","Pentagon","Hexagon"],"a":2,"why":"A pentagon has five sides."},{"q":"A regular hexagon has how many sides?","o":["5","6","7","8"],"a":1,"why":"A hexagon has six sides."},{"q":"The sum of interior angles of a quadrilateral is:","o":["180°","270°","360°","540°"],"a":2,"why":"The interior angles of a quadrilateral add up to 360°."},{"q":"A regular polygon has:","o":["Only equal sides","Only equal angles","All sides and all interior angles equal","No symmetry"],"a":2,"why":"A regular polygon is both equilateral and equiangular."},{"q":"A trapezium has parallel sides 5 cm and 9 cm and height 3 cm. Area:","o":["14 cm²","21 cm²","27 cm²","42 cm²"],"a":1,"why":"Area=½(5+9)×3=21 cm²."},{"q":"Which is a unit for area?","o":["cm","cm²","cm³","kg"],"a":1,"why":"Area is measured in square units."},{"q":"A trapezium has area 72 cm², parallel sides 10 cm and 14 cm. Its height is:","o":["3 cm","6 cm","8 cm","12 cm"],"a":1,"why":"72=½(10+14)h=12h, so h=6 cm."},{"q":"The area of a trapezium is 90 m². Its height is 6 m and one parallel side is 12 m. The other parallel side is:","o":["8 m","12 m","18 m","24 m"],"a":2,"why":"90=½(12+b)×6, so 12+b=30 and b=18 m."},{"q":"A trapezium has parallel sides 15 cm and 25 cm, height 8 cm. Its area is:","o":["80 cm²","120 cm²","160 cm²","320 cm²"],"a":2,"why":"Area=½(15+25)×8=160 cm²."},{"q":"The sum of interior angles of a pentagon is:","o":["360°","450°","540°","720°"],"a":2,"why":"Sum=(n−2)×180°=(5−2)×180°=540°."},{"q":"The sum of interior angles of a hexagon is:","o":["360°","540°","720°","900°"],"a":2,"why":"Sum=(6−2)×180°=720°."},{"q":"Each interior angle of a regular hexagon is:","o":["60°","90°","120°","135°"],"a":2,"why":"Each angle=720°÷6=120°."},{"q":"Each exterior angle of a regular octagon is:","o":["30°","45°","60°","135°"],"a":1,"why":"Exterior angles of a regular polygon total 360°; 360°÷8=45°."},{"q":"A regular pentagon has side length 7 cm. Its perimeter is:","o":["12 cm","28 cm","35 cm","49 cm"],"a":2,"why":"Perimeter=5×7=35 cm."},{"q":"A trapezium has parallel sides 2x cm and (x+6) cm, height 4 cm, and area 48 cm². Find x.","o":["2","4","6","8"],"a":2,"why":"48=½(3x+6)×4=6x+12, so x=6. Correct option is 6."},{"q":"A regular polygon has each exterior angle 40°. How many sides does it have?","o":["6","8","9","10"],"a":2,"why":"Number of sides=360°÷40°=9."},{"q":"A trapezium has area 180 cm² and height 12 cm. Its parallel sides are in ratio 2:3. The shorter parallel side is:","o":["10 cm","12 cm","15 cm","18 cm"],"a":3,"why":"Let sides be 2k and 3k. 180=½(5k)×12=30k, so k=6 and shorter side=12 cm."},{"q":"A trapezium's parallel sides are 3x and (x+8) cm. Its height is 5 cm and area is 100 cm². Find x.","o":["2","4","6","8"],"a":1,"why":"100=½(4x+8)×5=10x+20, so x=8. Correct option is 8."},{"q":"The sum of interior angles of a polygon is 1,260°. How many sides does it have?","o":["7","8","9","10"],"a":2,"why":"(n−2)×180=1260 gives n−2=7 and n=9."},{"q":"Each interior angle of a regular polygon is 150°. How many sides does it have?","o":["8","10","12","15"],"a":2,"why":"Exterior angle=180−150=30°. Number of sides=360÷30=12. Correct option is 12."},{"q":"A trapezium has parallel sides 18 cm and 32 cm. Its area is 250 cm². Find the height.","o":["5 cm","8 cm","10 cm","12 cm"],"a":2,"why":"250=½(18+32)h=25h, so h=10 cm."},{"q":"A regular decagon has each exterior angle:","o":["18°","30°","36°","45°"],"a":2,"why":"Exterior angle=360°÷10=36°."},{"q":"A polygon has 12 sides. The sum of its interior angles is:","o":["1,440°","1,620°","1,800°","2,160°"],"a":2,"why":"Sum=(12−2)×180°=1,800°."},{"q":"A trapezium's parallel sides are 14 cm and 26 cm. If its area is 240 cm², its height is:","o":["6 cm","8 cm","10 cm","12 cm"],"a":3,"why":"240=½(14+26)h=20h, so h=12 cm. Correct option is 12 cm."},{"q":"Each interior angle of a regular polygon is 135°. Number of sides:","o":["6","8","10","12"],"a":1,"why":"Exterior angle=45°, so number of sides=360÷45=8."},{"q":"A trapezium has parallel sides 7 cm and 17 cm and height 9 cm. If height is doubled, the new area is:","o":["108 cm²","144 cm²","216 cm²","432 cm²"],"a":2,"why":"Original area=½(24)×9=108 cm²; doubling height doubles area to 216 cm²."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Area of Trapezium and Polygons Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
