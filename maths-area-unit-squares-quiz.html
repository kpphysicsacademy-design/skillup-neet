(function(){'use strict';const questions=[{"d":"BASIC","q":"What does area measure?","o":["The space covered inside a flat shape","The distance around a shape","The number of corners","The weight of a shape"],"a":0,"e":"Area measures the surface covered inside a shape.","v":"area-unit-squares"},{"d":"BASIC","q":"One unit square covers 1 square centimetre. What is the area of a shape covered by 6 such squares with no gaps or overlaps?","o":["6 cm","6 cm²","12 cm²","1 cm²"],"a":1,"e":"Six unit squares cover 6 square centimetres.","v":"area-unit-squares"},{"d":"BASIC","q":"A rectangle is covered by 4 rows of unit squares with 3 squares in each row. What is its area in square units?","o":["7","12","14","24"],"a":1,"e":"There are 4 × 3 = 12 unit squares.","v":"area-unit-squares"},{"d":"BASIC","q":"A shape covers 5 full unit squares. What is its area?","o":["5 square units","5 units of length","10 square units","25 square units"],"a":0,"e":"Each full unit square contributes one square unit of area.","v":"area-unit-squares"},{"d":"BASIC","q":"Which unit is appropriate for the area of a notebook cover?","o":["Centimetres","Square centimetres","Cubic centimetres","Kilograms"],"a":1,"e":"Area is measured in square units, such as square centimetres.","v":"area-unit-squares"},{"d":"BASIC","q":"A square is made from 3 rows of 3 unit squares. What is its area?","o":["6 square units","9 square units","12 square units","3 square units"],"a":1,"e":"Three rows of three squares give 3 × 3 = 9.","v":"area-unit-squares"},{"d":"BASIC","q":"A rectangle contains 2 rows of 7 unit squares. Find its area.","o":["9 square units","14 square units","21 square units","7 square units"],"a":1,"e":"Two rows with seven squares each give 2 × 7 = 14.","v":"area-unit-squares"},{"d":"BASIC","q":"Two shapes cover 4 and 6 unit squares respectively. What is their combined area if they do not overlap?","o":["10 square units","2 square units","24 square units","6 square units"],"a":0,"e":"For separate non-overlapping shapes, add the areas: 4 + 6 = 10.","v":"area-unit-squares"},{"d":"BASIC","q":"A shape is covered by 8 full unit squares and no partial squares. What is its area?","o":["4 square units","8 square units","16 square units","1 square unit"],"a":1,"e":"Eight full unit squares cover 8 square units.","v":"area-unit-squares"},{"d":"BASIC","q":"Why should unit squares be placed without gaps or overlaps when measuring area?","o":["To count the covered surface accurately","To increase the shape's perimeter","To change the unit size","To make the shape taller"],"a":0,"e":"Gaps leave parts unmeasured and overlaps count some parts twice.","v":"area-unit-squares"},{"d":"MEDIUM","q":"A rectangular card is 8 unit squares long and 3 unit squares wide. What is its area?","o":["11 square units","24 square units","22 square units","16 square units"],"a":1,"e":"Area = 8 × 3 = 24 square units.","v":"area-unit-squares"},{"d":"MEDIUM","q":"A floor patch contains 5 rows of 6 square tiles. How many tiles cover the patch?","o":["11","25","30","36"],"a":2,"e":"Five rows of six tiles contain 5 × 6 = 30 tiles.","v":"area-unit-squares"},{"d":"MEDIUM","q":"A shape covers 18 full unit squares and 2 half-squares. What is its area?","o":["18 square units","19 square units","20 square units","21 square units"],"a":1,"e":"Two half-squares combine to one full square: 18 + 1 = 19.","v":"area-unit-squares"},{"d":"MEDIUM","q":"A rectangle covers 35 unit squares arranged in 5 equal rows. How many squares are in each row?","o":["5","6","7","8"],"a":2,"e":"35 ÷ 5 = 7 squares per row.","v":"area-unit-squares"},{"d":"MEDIUM","q":"A shape is made from 12 full unit squares and 4 quarter-squares. What is its total area?","o":["12 square units","13 square units","14 square units","16 square units"],"a":1,"e":"Four quarter-squares combine to one full square: 12 + 1 = 13.","v":"area-unit-squares"},{"d":"MEDIUM","q":"A rectangle is 9 cm long and 4 cm wide. Using unit squares of 1 cm², how many unit squares cover it?","o":["13","26","36","45"],"a":2,"e":"The area is 9 × 4 = 36 cm², so 36 unit squares are needed.","v":"area-unit-squares"},{"d":"MEDIUM","q":"A tabletop has area 24 square units. One part covers 9 square units. What is the area of the uncovered part?","o":["15 square units","33 square units","9 square units","3 square units"],"a":0,"e":"Subtract the covered part: 24 − 9 = 15.","v":"area-unit-squares"},{"d":"MEDIUM","q":"A shape covers 3 rows of 8 unit squares, then an attached part of 4 more unit squares. What is the total area?","o":["24 square units","28 square units","32 square units","12 square units"],"a":1,"e":"The main rectangle covers 3 × 8 = 24; adding 4 gives 28.","v":"area-unit-squares"},{"d":"MEDIUM","q":"A rectangle covers 42 unit squares in 6 equal rows. How many squares are in each row?","o":["6","7","8","9"],"a":1,"e":"42 ÷ 6 = 7 squares per row.","v":"area-unit-squares"},{"d":"MEDIUM","q":"A shape contains 10 full unit squares and 6 half-squares. What is its area?","o":["13 square units","16 square units","10 square units","12 square units"],"a":0,"e":"Six half-squares equal 3 full squares; 10 + 3 = 13.","v":"area-unit-squares"},{"d":"HARD","q":"A rectangle is 12 unit squares long and 5 unit squares wide. A 2-by-3 block of unit squares is cut out. What area remains?","o":["54 square units","60 square units","48 square units","42 square units"],"a":0,"e":"Original area 12 × 5 = 60; removed area 2 × 3 = 6; remaining area 54.","v":"area-unit-squares"},{"d":"HARD","q":"A floor section covers 7 rows of 8 tiles. If 9 tiles are removed, how many tiles remain?","o":["47","56","49","63"],"a":0,"e":"There are 7 × 8 = 56 tiles; 56 − 9 = 47 remain.","v":"area-unit-squares"},{"d":"HARD","q":"A shape is formed from two non-overlapping rectangles with areas 24 cm² and 17 cm². What is the total area?","o":["7 cm²","41 cm²","408 cm²","34 cm²"],"a":1,"e":"Add the non-overlapping areas: 24 + 17 = 41 cm².","v":"area-unit-squares"},{"d":"HARD","q":"A rectangle has area 48 square units and 6 rows of equal squares. How many squares are in each row?","o":["6","7","8","9"],"a":2,"e":"48 ÷ 6 = 8 squares in each row.","v":"area-unit-squares"},{"d":"HARD","q":"A mosaic uses 4 full unit squares and 8 half-squares. What is its total area?","o":["8 square units","12 square units","4 square units","10 square units"],"a":0,"e":"Eight half-squares make 4 full squares; 4 + 4 = 8.","v":"area-unit-squares"},{"d":"HARD","q":"A rectangular region is 10 squares wide and 6 squares high. A 2-by-2 square region is left uncovered. How many unit squares cover the rest?","o":["56","60","52","48"],"a":0,"e":"The full region has 10 × 6 = 60 squares; the uncovered region has 2 × 2 = 4, leaving 56.","v":"area-unit-squares"},{"d":"HARD","q":"A rectangle contains 72 unit squares arranged in 8 equal rows. How many squares are in each row?","o":["8","9","10","12"],"a":1,"e":"72 ÷ 8 = 9 squares per row.","v":"area-unit-squares"},{"d":"HARD","q":"A shape is tiled with 15 full squares and 10 half-squares. What is its area?","o":["20 square units","25 square units","15 square units","10 square units"],"a":0,"e":"Ten half-squares equal 5 full squares; 15 + 5 = 20.","v":"area-unit-squares"},{"d":"HARD","q":"A rectangle has area 63 cm² and width 7 cm. How many 1 cm² unit squares would cover it?","o":["9","56","63","70"],"a":2,"e":"An area of 63 cm² is covered by 63 squares of 1 cm² each.","v":"area-unit-squares"},{"d":"HARD","q":"A square patio is tiled with 11 rows of 11 unit squares. If 21 tiles are cracked but still cover their full spaces, what area does the patio cover?","o":["100 square units","121 square units","110 square units","142 square units"],"a":1,"e":"The patio still covers 11 × 11 = 121 square units; cracked tiles do not change the covered area.","v":"area-unit-squares"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand area by counting unit squares</strong><small>Count full and partial unit squares</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Calculate area from rows and columns</strong><small>Calculate totals and differences</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Compare and find missing area counts</strong><small>Solve real-life unit-square area problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
