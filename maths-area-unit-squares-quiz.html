<style>

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What does area measure?","o":["The space covered inside a flat shape","The distance around a shape","The number of corners","The weight of a shape"],"a":0,"e":"Area measures the surface covered inside a shape.","v":"area-unit-squares"},{"d":"BASIC","q":"A shape covers 6 unit squares. What is its area?","o":["3 square units","6 square units","12 square units","6 units"],"a":1,"e":"Count the six unit squares: area = 6 square units.","v":"area-unit-squares"},{"d":"BASIC","q":"One small square represents 1 cm². Four such squares cover a shape. What is its area?","o":["4 cm","4 cm²","1 cm²","8 cm²"],"a":1,"e":"Four unit squares cover 4 cm².","v":"area-unit-squares"},{"d":"BASIC","q":"What unit is suitable for the area of a book cover?","o":["cm","cm²","cm³","kg"],"a":1,"e":"Area is measured in square units such as cm².","v":"area-unit-squares"},{"d":"BASIC","q":"A rectangle is made of 3 rows of 4 unit squares. How many unit squares cover it?","o":["7","12","14","24"],"a":1,"e":"3 rows × 4 squares per row = 12 unit squares.","v":"area-unit-squares"},{"d":"BASIC","q":"A shape is covered by 5 full unit squares with no gaps or overlaps. Its area is:","o":["5 square units","5 units","10 square units","1 square unit"],"a":0,"e":"Each unit square contributes one square unit.","v":"area-unit-squares"},{"d":"BASIC","q":"Why should unit squares cover a shape without gaps?","o":["To count its area accurately","To make its perimeter zero","To change its shape","To count its corners"],"a":0,"e":"Gaps or overlaps would make the area count inaccurate.","v":"area-unit-squares"},{"d":"BASIC","q":"A rectangle covers 2 rows of 6 unit squares. Find its area.","o":["8 square units","12 square units","14 square units","6 square units"],"a":1,"e":"2 × 6 = 12 unit squares.","v":"area-unit-squares"},{"d":"BASIC","q":"A shape covers 9 unit squares. If each square is 1 cm², the area is:","o":["9 cm","9 cm²","3 cm²","18 cm²"],"a":1,"e":"Nine 1 cm² squares cover 9 cm².","v":"area-unit-squares"},{"d":"BASIC","q":"Which statement is correct?","o":["Area is measured in square units","Area is measured only in metres","Area is the distance around a shape","Area counts only vertices"],"a":0,"e":"Area uses square units; perimeter uses linear units.","v":"area-unit-squares"},{"d":"MEDIUM","q":"A rectangle covers 4 rows of 5 unit squares. What is its area?","o":["9 square units","20 square units","18 square units","25 square units"],"a":1,"e":"4 × 5 = 20 unit squares.","v":"area-unit-squares"},{"d":"MEDIUM","q":"A shape has 13 full unit squares. What is its area in square units?","o":["13","26","12","13 units"],"a":0,"e":"Count each full unit square once: area = 13 square units.","v":"area-unit-squares"},{"d":"MEDIUM","q":"A rectangle is 7 unit squares long and 3 unit squares wide. Find its area.","o":["10 square units","21 square units","20 square units","14 square units"],"a":1,"e":"Area = 7 × 3 = 21 square units.","v":"area-unit-squares"},{"d":"MEDIUM","q":"A shape is covered by 8 full squares and two half-squares. What is its area?","o":["8 square units","9 square units","10 square units","11 square units"],"a":1,"e":"Two half-squares make one full square: 8 + 1 = 9.","v":"area-unit-squares"},{"d":"MEDIUM","q":"A shape covers 15 unit squares. Another covers 11. How much greater is the first area?","o":["4 square units","26 square units","3 square units","5 square units"],"a":0,"e":"15 − 11 = 4 square units.","v":"area-unit-squares"},{"d":"MEDIUM","q":"A rectangle has area 24 square units and 4 rows of equal squares. How many squares are in each row?","o":["4","6","8","20"],"a":1,"e":"24 ÷ 4 = 6 squares per row.","v":"area-unit-squares"},{"d":"MEDIUM","q":"A tiled floor section has 6 rows of 8 equal tiles. If each tile covers 1 dm², what area is covered?","o":["14 dm²","48 dm²","42 dm²","56 dm²"],"a":1,"e":"6 × 8 = 48 tiles, each 1 dm².","v":"area-unit-squares"},{"d":"MEDIUM","q":"A shape has 10 full squares and 4 half-squares. Find its area.","o":["10 square units","12 square units","14 square units","8 square units"],"a":1,"e":"Four half-squares equal two full squares; 10 + 2 = 12.","v":"area-unit-squares"},{"d":"MEDIUM","q":"A rectangle made from unit squares has 9 columns and 2 rows. Find its area.","o":["11 square units","18 square units","22 square units","9 square units"],"a":1,"e":"9 × 2 = 18 square units.","v":"area-unit-squares"},{"d":"MEDIUM","q":"A shape covers 30 unit squares. If 7 unit squares are removed, what area remains?","o":["23 square units","37 square units","21 square units","7 square units"],"a":0,"e":"30 − 7 = 23 square units.","v":"area-unit-squares"},{"d":"HARD","q":"A rectangular grid has 8 rows and 7 columns of unit squares. How many squares cover it?","o":["15","48","56","64"],"a":2,"e":"8 × 7 = 56 unit squares.","v":"area-unit-squares"},{"d":"HARD","q":"A shape covers 24 full unit squares and 6 half-squares. What is its area?","o":["24 square units","27 square units","30 square units","26 square units"],"a":1,"e":"Six half-squares make three full squares; 24 + 3 = 27.","v":"area-unit-squares"},{"d":"HARD","q":"A rectangle's area is 42 square units. It has 6 equal rows. How many unit squares are in each row?","o":["6","7","8","36"],"a":1,"e":"42 ÷ 6 = 7 squares per row.","v":"area-unit-squares"},{"d":"HARD","q":"A floor section has 9 rows of 12 tiles. Each tile covers 1 square metre. Find the total area.","o":["21 m²","96 m²","108 m²","118 m²"],"a":2,"e":"9 × 12 = 108 tiles, each 1 m².","v":"area-unit-squares"},{"d":"HARD","q":"A shape is covered by 17 full squares and 8 half-squares. Find its area.","o":["21 square units","25 square units","17 square units","29 square units"],"a":0,"e":"Eight half-squares make four full squares; 17 + 4 = 21.","v":"area-unit-squares"},{"d":"HARD","q":"A rectangular region has area 63 square units. One side is 9 unit lengths. How many unit squares fit along the other side?","o":["6","7","8","9"],"a":1,"e":"63 ÷ 9 = 7 unit squares along the other side.","v":"area-unit-squares"},{"d":"HARD","q":"A mosaic contains 5 rows of 8 blue squares and 4 rows of 6 white squares. How many unit squares are used altogether?","o":["64","40","24","56"],"a":0,"e":"Blue: 5 × 8 = 40; white: 4 × 6 = 24; total = 64.","v":"area-unit-squares"},{"d":"HARD","q":"A shape has area 36 square units. A new shape is made by adding 4 rows of 3 unit squares. What is the new area?","o":["39 square units","48 square units","40 square units","24 square units"],"a":1,"e":"Added area = 4 × 3 = 12; new area = 36 + 12 = 48.","v":"area-unit-squares"},{"d":"HARD","q":"A shape has 50 unit squares. One fifth of them are shaded. How many unit squares are shaded?","o":["5","10","25","40"],"a":1,"e":"50 ÷ 5 = 10 squares.","v":"area-unit-squares"},{"d":"HARD","q":"A rectangle covers 72 unit squares and has 8 rows. How many columns does it have?","o":["8","9","10","64"],"a":1,"e":"72 ÷ 8 = 9 columns.","v":"area-unit-squares"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand area by counting unit squares</strong><small>Count full and partial unit squares</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Calculate area from rows and columns</strong><small>Calculate totals and differences</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Compare and find missing area counts</strong><small>Solve real-life unit-square area problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script></body></html>
