<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"In the sequence 2, 5, 8, 11, …, what is the common difference?","o":["2","3","5","8"],"a":1,"e":"Subtract consecutive terms: 5−2=3."},{"d":"BASIC","q":"Which sequence is an arithmetic progression (AP)?","o":["2, 4, 8, 16","7, 10, 13, 16","1, 4, 9, 16","3, 6, 12, 24"],"a":1,"e":"The differences in 7, 10, 13, 16 are all 3."},{"d":"BASIC","q":"The nth term of an AP with first term a and common difference d is:","o":["a+nd","a+(n−1)d","a−(n−1)d","nd−a"],"a":1,"e":"The first term is a; each next term adds d, so aₙ=a+(n−1)d."},{"d":"BASIC","q":"Find the 10th term of 3, 7, 11, 15, …","o":["35","39","40","43"],"a":1,"e":"a₁₀=3+9×4=39."},{"d":"BASIC","q":"If an AP has first term 12 and common difference −2, its third term is:","o":["6","8","10","14"],"a":1,"e":"a₃=12+2(−2)=8."},{"d":"BASIC","q":"What is the common difference of 15, 11, 7, 3, …?","o":["−2","−3","−4","4"],"a":2,"e":"11−15=−4."},{"d":"BASIC","q":"If a=5 and d=0, the AP is:","o":["Always increasing","Always decreasing","Constant","Alternating"],"a":2,"e":"A zero common difference means every term equals 5."},{"d":"BASIC","q":"The first term of an AP is 4 and its common difference is 6. The second term is:","o":["2","6","10","24"],"a":2,"e":"The second term is 4+6=10."},{"d":"BASIC","q":"Which formula gives the sum of the first n terms of an AP when first term a and last term l are known?","o":["n(a+l)/2","a+l/2n","n(a−l)/2","2n/(a+l)"],"a":0,"e":"The sum equals the number of terms times the average of the first and last terms."},{"d":"BASIC","q":"In an AP, each term after the first is obtained by:","o":["Multiplying by a fixed number","Adding the same constant","Squaring the previous term","Adding the term number"],"a":1,"e":"An AP has a constant difference between consecutive terms."},{"d":"MEDIUM","q":"Find the 20th term of the AP 7, 10, 13, …","o":["61","64","67","70"],"a":1,"e":"a₂₀=7+19×3=64."},{"d":"MEDIUM","q":"The 5th term of an AP is 18 and the common difference is 3. Find the first term.","o":["3","6","9","12"],"a":1,"e":"a₅=a+4d, so 18=a+12 and a=6."},{"d":"MEDIUM","q":"Which term of the AP 4, 9, 14, 19, … is 49?","o":["8th","9th","10th","11th"],"a":2,"e":"49=4+(n−1)5 gives n−1=9, so n=10."},{"d":"MEDIUM","q":"The 7th term of an AP is 32 and its first term is 8. Find d.","o":["3","4","5","6"],"a":1,"e":"32=8+6d, so d=4."},{"d":"MEDIUM","q":"Find the sum of the first 10 positive integers.","o":["45","50","55","60"],"a":2,"e":"S₁₀=10(1+10)/2=55."},{"d":"MEDIUM","q":"Find the sum of the first 8 terms of 2, 5, 8, 11, …","o":["88","92","96","100"],"a":3,"e":"S₈=8/2[2×2+7×3]=4×25=100."},{"d":"MEDIUM","q":"If a=3, d=4, and n=12, find the nth term.","o":["43","47","51","55"],"a":1,"e":"a₁₂=3+11×4=47."},{"d":"MEDIUM","q":"An AP has first term 20 and common difference −3. Find its 6th term.","o":["2","5","8","35"],"a":1,"e":"a₆=20+5(−3)=5."},{"d":"MEDIUM","q":"If the 3rd term is 11 and the 8th term is 31, the common difference is:","o":["3","4","5","6"],"a":1,"e":"a₈−a₃=5d=31−11=20, so d=4."},{"d":"MEDIUM","q":"The sum of the first n terms of an AP is n²+2n. Its first term is:","o":["1","2","3","4"],"a":2,"e":"a₁=S₁=1²+2(1)=3."},{"d":"HARD","q":"The 4th term of an AP is 14 and the 9th term is 34. Find the 1st term.","o":["2","−2","6","10"],"a":0,"e":"a+3d=14 and a+8d=34; d=4 and a=2."},{"d":"HARD","q":"How many terms are in the AP 5, 9, 13, …, 81?","o":["18","19","20","21"],"a":2,"e":"81=5+(n−1)4 gives n−1=19, so n=20."},{"d":"HARD","q":"Find the sum of the first 20 terms of the AP 3, 7, 11, …","o":["780","800","820","840"],"a":2,"e":"S₂₀=20/2[2×3+19×4]=10×82=820."},{"d":"HARD","q":"If the sum of the first n terms is Sₙ=3n²+2n, find the nth term aₙ.","o":["6n−1","6n+1","3n+2","6n+2"],"a":0,"e":"aₙ=Sₙ−Sₙ₋₁=6n−1."},{"d":"HARD","q":"Three numbers in AP have sum 27 and product 585. If the numbers are positive integers, what are they?","o":["3, 9, 15","5, 9, 13","6, 9, 12","7, 9, 11"],"a":1,"e":"5+9+13=27 and 5×9×13=585; the numbers are in AP with common difference 4."},{"d":"HARD","q":"The 12th term of an AP is 37 and the 5th term is 16. Find the 20th term.","o":["55","58","61","64"],"a":2,"e":"7d=21 so d=3; a=16−12=4; a₂₀=4+19×3=61."},{"d":"HARD","q":"An AP has first term 8 and last term 62. If the common difference is 6, how many terms are there?","o":["8","9","10","11"],"a":2,"e":"62=8+(n−1)6 gives 54=6(n−1), so n=10."},{"d":"HARD","q":"If the 6th term of an AP is 17 and the 13th term is 38, find the 20th term.","o":["53","56","59","62"],"a":2,"e":"7d=38−17=21, so d=3; a=17−5×3=2, hence a₂₀=2+19×3=59."},{"d":"HARD","q":"The sum of the first 15 terms of an AP is 300. If the first term is 6, find the common difference.","o":["1","2","3","4"],"a":1,"e":"300=15/2[12+14d], so 40=12+14d, d=2."},{"d":"HARD","q":"A person saves ₹100 in the first week and increases the saving by ₹20 each week. How much is saved in 10 weeks?","o":["₹1,700","₹1,800","₹1,900","₹2,000"],"a":2,"e":"S₁₀=10/2[2×100+9×20]=5×380=₹1,900."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Explore arithmetic progressions</strong><small>Find common differences and nth terms</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Calculate terms and sums</strong><small>Recognise arithmetic sequences</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve AP word problems</strong><small>Practise arithmetic progression applications</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
