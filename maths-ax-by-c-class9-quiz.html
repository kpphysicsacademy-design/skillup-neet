(function(){'use strict';const questions=[{"d":"BASIC","q":"Which equation is in the form ax+by+c=0?","o":["x²+y=1","2x+3y−6=0","xy+2=0","x/y=4"],"a":1,"e":"A linear equation in two variables has x and y only to the first power and can be written ax+by+c=0."},{"d":"BASIC","q":"In 3x+2y−7=0, what is the coefficient of x?","o":["2","−7","3","7"],"a":2,"e":"The coefficient multiplying x is 3."},{"d":"BASIC","q":"In 4x−5y+9=0, what is the coefficient of y?","o":["5","−5","4","9"],"a":1,"e":"The y-term is −5y, so its coefficient is −5."},{"d":"BASIC","q":"Which pair satisfies x+y−5=0?","o":["(1,1)","(2,3)","(5,1)","(0,4)"],"a":1,"e":"For (2,3), 2+3−5=0."},{"d":"BASIC","q":"Which equation is equivalent to x+y=8 in standard form?","o":["x+y−8=0","x+y+8=0","x−y−8=0","xy−8=0"],"a":0,"e":"Subtracting 8 from both sides gives x+y−8=0."},{"d":"BASIC","q":"In 2x+7y+4=0, what is the constant term c?","o":["2","7","4","−4"],"a":2,"e":"The constant term is 4."},{"d":"BASIC","q":"Which of these is NOT a linear equation in two variables?","o":["2x+3y=6","x−y+1=0","x²+y=4","4x=2y"],"a":2,"e":"The x² term makes the equation nonlinear."},{"d":"BASIC","q":"If x=0 in 3x+y−6=0, what is y?","o":["0","2","6","−6"],"a":2,"e":"Substitute x=0: y−6=0, so y=6."},{"d":"BASIC","q":"If y=0 in 2x−8=0, what is x?","o":["−4","0","2","4"],"a":3,"e":"2x−8=0 gives x=4."},{"d":"BASIC","q":"What is the graph of a linear equation ax+by+c=0, when a and b are not both zero?","o":["A straight line","A circle","A parabola","A single fixed point always"],"a":0,"e":"A first-degree equation in two variables represents a straight line."},{"d":"MEDIUM","q":"Which point satisfies 2x−y+1=0?","o":["(1,3)","(2,5)","(0,1)","(−1,−1)"],"a":1,"e":"For (2,5), 2(2)−5+1=0."},{"d":"MEDIUM","q":"Rearrange 3x+2y−12=0 to make y the subject.","o":["y=6−(3/2)x","y=12−3x","y=6+(3/2)x","y=3x−6"],"a":0,"e":"2y=12−3x, so y=6−(3/2)x."},{"d":"MEDIUM","q":"Which is the x-intercept of 5x+2y−10=0?","o":["(0,5)","(2,0)","(0,−5)","(5,0)"],"a":1,"e":"Set y=0: 5x−10=0, so x=2."},{"d":"MEDIUM","q":"Which is the y-intercept of 3x−4y+8=0?","o":["(0,2)","(−8/3,0)","(0,−2)","(4,0)"],"a":0,"e":"Set x=0: −4y+8=0, so y=2."},{"d":"MEDIUM","q":"For 2x+ky−6=0, the point (1,2) lies on the line. Find k.","o":["1","2","3","4"],"a":1,"e":"2+2k−6=0 gives 2k=4, so k=2."},{"d":"MEDIUM","q":"Which equation has the same line as 2x+4y−6=0?","o":["x+2y−3=0","x+2y+3=0","2x+4y+6=0","x−2y−3=0"],"a":0,"e":"Dividing every term by 2 gives x+2y−3=0."},{"d":"MEDIUM","q":"If (−2,y) satisfies x−3y+4=0, what is y?","o":["(−2, 2/3)","(−2, −1)","(−2, 2)","(−2, −2/3)"],"a":0,"e":"−2−3y+4=0 gives 2−3y=0, so y=2/3."},{"d":"MEDIUM","q":"Which point lies on 4x+y=0?","o":["(1,4)","(−1,4)","(2,−8)","(0,4)"],"a":2,"e":"For (2,−8), 4(2)+(−8)=0."},{"d":"MEDIUM","q":"Which equation represents a horizontal line?","o":["x=3","y=−2","x+y=0","2x−y=1"],"a":1,"e":"The equation y=−2 fixes y and allows x to vary, making a horizontal line."},{"d":"MEDIUM","q":"Which equation represents a vertical line?","o":["y=4","x=−3","x+y=4","y=2x"],"a":1,"e":"The equation x=−3 fixes x and allows y to vary, making a vertical line."},{"d":"HARD","q":"The line 2x+3y−12=0 crosses the axes at which points?","o":["(6,0) and (0,4)","(4,0) and (0,6)","(12,0) and (0,12)","(3,0) and (0,2)"],"a":0,"e":"Set y=0 to get x=6; set x=0 to get y=4."},{"d":"HARD","q":"For ax+by+c=0, if a=0 and b≠0, what kind of line results?","o":["Vertical line","Horizontal line","Circle","Cannot be graphed"],"a":1,"e":"Then by+c=0, so y is constant and the line is horizontal."},{"d":"HARD","q":"For ax+by+c=0, if b=0 and a≠0, what kind of line results?","o":["Horizontal line","Vertical line","Line through origin always","Parabola"],"a":1,"e":"Then ax+c=0, so x is constant and the line is vertical."},{"d":"HARD","q":"Find k if (2,−1) lies on 3x+ky+4=0.","o":["10","−10","6","−6"],"a":0,"e":"6−k+4=0 gives k=10."},{"d":"HARD","q":"Which equation is equivalent to 6x−9y+12=0 in simplest integer coefficients?","o": ed));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Master linear equations in standard form</strong><small>Identify coefficients and constants</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Find intercepts and solutions</strong><small>Rewrite equivalent equations</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Understand linear graphs</strong><small>Solve standard-form problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
