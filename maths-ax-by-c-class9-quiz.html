ger coefficients?","o":["2x−3y+4=0","2x−3y−4=0","3x−2y+4=0","6x−9y−12=0"],"a":0,"why":"Divide every term by 3 to get 2x−3y+4=0."},{"d":"HARD","q":"A line has x-intercept 4 and y-intercept 2. Which equation describes it?","o":["x+2y−4=0","x+2y−8=0","x+y−6=0","2x+y−8=0"],"a":0,"why":"The intercept form is x/4+y/2=1, which simplifies to x+2y−4=0."},{"d":"HARD","q":"Which ordered pair satisfies 7x−2y+1=0?","o":["(1,4)","(1,3)","(−1,−3)","(0,1)"],"a":0,"why":"For (1,4), 7−2(4)+1=0."},{"d":"HARD","q":"If 2x+5y+c=0 passes through (3,−2), find c.","o":["−4","−6","4","6"],"a":2,"why":"2(3)+5(−2)+c=0 gives 6−10+c=0, so c=4."},{"d":"HARD","q":"For x−2y+6=0, what is y when x=−2?","o":["−2","2","4","−4"],"a":1,"why":"−2−2y+6=0 gives 4−2y=0, so y=2."},{"d":"HARD","q":"Which statement about 3x+2y−5=0 is true?","o":["(1,1) is a solution","(0,0) is a solution","(2,−1) is a solution","(1,2) is a solution"],"a":0,"why":"For (1,1), 3+2−5=0."}];
