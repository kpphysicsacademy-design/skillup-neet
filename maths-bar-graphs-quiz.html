<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"A bar graph shows 6 students chose cricket and 4 chose tennis. How many chose cricket?","o":["6","4","10","2"],"a":0,"e":"Read the height of the cricket bar: 6 students.","v":"bar-graphs"},{"d":"BASIC","q":"In a bar graph, what does the horizontal axis often show?","o":["Categories","Only the total","The graph's title","The page number"],"a":0,"e":"The horizontal axis often lists categories being compared.","v":"bar-graphs"},{"d":"BASIC","q":"A bar reaches 8 on a scale marked in ones. What value does it represent?","o":["8","4","10","1"],"a":0,"e":"A bar reaching 8 represents a value of 8.","v":"bar-graphs"},{"d":"BASIC","q":"Books borrowed are 3 on Monday and 7 on Tuesday. Which day had more books borrowed?","o":["Tuesday","Monday","Both equal","Cannot tell"],"a":0,"e":"7 is greater than 3, so Tuesday had more.","v":"bar-graphs"},{"d":"BASIC","q":"A graph shows 5 votes for red, 9 for blue and 4 for green. Which colour has the fewest votes?","o":["Green","Red","Blue","All equal"],"a":0,"e":"Green has 4 votes, fewer than 5 and 9.","v":"bar-graphs"},{"d":"BASIC","q":"What does the height or length of a bar show?","o":["The value for that category","The graph maker's age","The date only","The number of categories only"],"a":0,"e":"Each bar's size represents the value for its category.","v":"bar-graphs"},{"d":"BASIC","q":"A bar graph uses a scale where one grid line equals 2 books. A bar reaches 4 grid lines. How many books is that?","o":["8","6","4","2"],"a":0,"e":"4 grid lines × 2 books = 8 books.","v":"bar-graphs"},{"d":"BASIC","q":"Which title best fits a bar graph comparing the number of pets owned by students?","o":["Students' Pets","Weather Forecast","Fractions Practice","A Story About Space"],"a":0,"e":"The title should describe the categories and values shown.","v":"bar-graphs"},{"d":"BASIC","q":"A graph shows 12 visitors on Saturday and 10 on Sunday. How many visitors came across both days?","o":["22","2","120","21"],"a":0,"e":"12 + 10 = 22 visitors.","v":"bar-graphs"},{"d":"BASIC","q":"If two bars have equal heights on the same scale, what does that mean?","o":["Their values are equal","One value is double","Both values are zero","The graph is always wrong"],"a":0,"e":"Equal bar heights on the same scale represent equal values.","v":"bar-graphs"},{"d":"MEDIUM","q":"A bar graph shows 18 students prefer football and 12 prefer basketball. How many more prefer football?","o":["6","30","5","8"],"a":0,"e":"18 − 12 = 6 students.","v":"bar-graphs"},{"d":"MEDIUM","q":"Books read by three students are 4, 7 and 9. What is the total number of books?","o":["20","16","18","21"],"a":0,"e":"4 + 7 + 9 = 20 books.","v":"bar-graphs"},{"d":"MEDIUM","q":"A graph scale increases by 5 per grid line. A bar reaches 6 grid lines. What is its value?","o":["30","11","25","35"],"a":0,"e":"6 × 5 = 30.","v":"bar-graphs"},{"d":"MEDIUM","q":"A bar graph shows Monday 14, Tuesday 17 and Wednesday 11 visitors. Which day had the second-highest count?","o":["Monday","Tuesday","Wednesday","All equal"],"a":0,"e":"17 is highest, 14 is second, and 11 is lowest.","v":"bar-graphs"},{"d":"MEDIUM","q":"A class survey shows 8 chose apples, 13 chose bananas and 9 chose grapes. How many students answered?","o":["30","21","22","29"],"a":0,"e":"8 + 13 + 9 = 30 students.","v":"bar-graphs"},{"d":"MEDIUM","q":"A bar graph shows 25 books in one category and 5 in another. How many times as many books are in the first category?","o":["5 times","20 times","4 times","30 times"],"a":0,"e":"25 ÷ 5 = 5.","v":"bar-graphs"},{"d":"MEDIUM","q":"The scale on a bar graph is 0, 10, 20, 30, 40. A bar reaches halfway between 20 and 30. What value does it show?","o":["25","20","30","15"],"a":0,"e":"Halfway between 20 and 30 is 25.","v":"bar-graphs"},{"d":"MEDIUM","q":"A graph records 16 bikes, 9 scooters and 7 cars. How many more bikes than scooters and cars combined?","o":["0","7","2","9"],"a":0,"e":"Scooters and cars total 9 + 7 = 16, equal to bikes, so the difference is 0.","v":"bar-graphs"},{"d":"MEDIUM","q":"A bar graph shows 32 people at a show in the morning and 45 in the evening. How many more came in the evening?","o":["13","77","12","15"],"a":0,"e":"45 − 32 = 13 people.","v":"bar-graphs"},{"d":"MEDIUM","q":"A graph shows 6, 10, 10 and 14 for four categories. What is the range?","o":["8","14","6","10"],"a":0,"e":"Range = highest − lowest = 14 − 6 = 8.","v":"bar-graphs"},{"d":"HARD","q":"A bar graph shows 24 books on Monday, 18 Tuesday and 30 Wednesday. What is the average per day?","o":["24","72","18","30"],"a":0,"e":"(24 + 18 + 30) ÷ 3 = 72 ÷ 3 = 24.","v":"bar-graphs"},{"d":"HARD","q":"A graph scale labels each major interval as 4 units. A bar reaches 7 intervals. What value does it represent?","o":["28","11","24","32"],"a":0,"e":"7 × 4 = 28 units.","v":"bar-graphs"},{"d":"HARD","q":"A bar graph shows 36 students chose science and 24 chose art. What fraction of these students chose art?","o":["2/5","1/2","3/5","2/3"],"a":0,"e":"Total = 60; art is 24/60 = 2/5.","v":"bar-graphs"},{"d":"HARD","q":"A shop's daily sales are ₹125, ₹150, ₹100 and ₹175. What is the difference between its highest and lowest sales?","o":["₹75","₹50","₹100","₹25"],"a":0,"e":"₹175 − ₹100 = ₹75.","v":"bar-graphs"},{"d":"HARD","q":"A bar graph shows 42 visitors on Friday, 56 on Saturday and 49 on Sunday. How many visitors came over the weekend (Saturday and Sunday)?","o":["105","147","98","91"],"a":0,"e":"56 + 49 = 105 visitors.","v":"bar-graphs"},{"d":"HARD","q":"A graph shows 15, 21, 18 and 30 for four classes. If the total is reduced by 4 from the largest category, what is the new total?","o":["80","84","76","78"],"a":0,"e":"Original total = 84; 84 − 4 = 80.","v":"bar-graphs"},{"d":"HARD","q":"A bar graph shows 28 votes for option A, 35 for B and 21 for C. What percentage of all votes went to B?","o":["41⅔%","35%","50%","25%"],"a":0,"e":"Total = 84; 35 ÷ 84 × 100 = 41⅔%.","v":"bar-graphs"},{"d":"HARD","q":"The values shown are 17, 23, 19 and 25. How much greater is the combined total of the two largest values than the combined total of the two smallest?","o":["18","8","10","6"],"a":0,"e":"Largest two total 25 + 23 = 48; smallest two total 17 + 19 = 36; difference 18.","v":"bar-graphs"},{"d":"HARD","q":"A bar graph shows water use of 48 L, 36 L and 42 L over three days. If the next day uses 30 L, what is the four-day total?","o":["156 L","126 L","150 L","162 L"],"a":0,"e":"48 + 36 + 42 + 30 = 156 L.","v":"bar-graphs"},{"d":"HARD","q":"Four categories have values 12, 18, 24 and 30. What is the difference between the total of the first two and the total of the last two?","o":["24","12","18","30"],"a":0,"e":"First two total 30; last two total 54; difference = 24.","v":"bar-graphs"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Read and interpret bar graphs</strong><small>Read graph scales and labels</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Compare bar heights and values</strong><small>Calculate totals and differences</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Compare values in bar graphs</strong><small>Solve real-life graph questions</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
