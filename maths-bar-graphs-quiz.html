<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261012-bar-graphs-no-images-duolingo-v1"><title>Bar Graphs | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Whole numbers</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What does a bar graph use to compare categories?","o":["Bars of different lengths or heights","Roman numerals only","Angles only","Fractions without labels"],"a":0,"e":"Bar lengths or heights represent the values in each category.","v":"bar-graphs"},{"d":"BASIC","q":"What should the title of a bar graph tell you?","o":["What the data are about","The answer to every question","Only the page number","The name of the printer"],"a":0,"e":"A title describes the subject of the data.","v":"bar-graphs"},{"d":"BASIC","q":"Why are axis labels useful?","o":["They explain what the axes represent","They make values disappear","They replace the bars","They change the scale"],"a":0,"e":"Axis labels tell readers what is measured.","v":"bar-graphs"},{"d":"BASIC","q":"A bar reaches 6 on a scale marked by ones. What value does it show?","o":["3","6","12","1"],"a":1,"e":"The bar ends at 6, so its value is 6.","v":"bar-graphs"},{"d":"BASIC","q":"Which bar represents the greatest value?","o":["The shortest bar","The tallest bar on a vertical graph","A bar without a label","Every bar always has the same value"],"a":1,"e":"The tallest bar represents the largest value on a standard vertical bar graph.","v":"bar-graphs"},{"d":"BASIC","q":"A graph shows apples 4, bananas 7 and pears 3. Which has the fewest?","o":["Apples","Bananas","Pears","All equal"],"a":2,"e":"Pears has value 3, the smallest count.","v":"bar-graphs"},{"d":"BASIC","q":"If one grid interval represents 2 items, a bar spanning 4 intervals represents:","o":["4 items","6 items","8 items","10 items"],"a":2,"e":"4 intervals × 2 items = 8 items.","v":"bar-graphs"},{"d":"BASIC","q":"What should bars in a simple bar graph generally have?","o":["Clear category labels","No spaces or labels ever","Random heights","Different scales for each category"],"a":0,"e":"Clear labels help readers identify each category.","v":"bar-graphs"},{"d":"BASIC","q":"A bar graph records 5, 8 and 6 books. What is the total?","o":["13","19","18","20"],"a":1,"e":"5 + 8 + 6 = 19 books.","v":"bar-graphs"},{"d":"BASIC","q":"Which is a suitable use for a bar graph?","o":["Comparing votes for different choices","Showing a single letter's spelling","Measuring a line with no data","Writing a paragraph"],"a":0,"e":"Bar graphs are useful for comparing category values.","v":"bar-graphs"},{"d":"MEDIUM","q":"A graph shows red 12, blue 9 and green 15 votes. Which colour has the most votes?","o":["Red","Blue","Green","All equal"],"a":2,"e":"Green has 15 votes, the highest value.","v":"bar-graphs"},{"d":"MEDIUM","q":"Using red 12, blue 9 and green 15 votes, how many votes are there altogether?","o":["36","27","24","39"],"a":0,"e":"12 + 9 + 15 = 36 votes.","v":"bar-graphs"},{"d":"MEDIUM","q":"A bar graph shows 18 visitors on Monday and 25 on Tuesday. How many more on Tuesday?","o":["7","43","6","8"],"a":0,"e":"25 − 18 = 7 visitors.","v":"bar-graphs"},{"d":"MEDIUM","q":"A scale increases by 5 per grid interval. A bar reaches 6 intervals. What value is shown?","o":["11","25","30","35"],"a":2,"e":"6 × 5 = 30.","v":"bar-graphs"},{"d":"MEDIUM","q":"A graph shows books read: Asha 7, Bala 11, Chiru 8. How many books did they read altogether?","o":["26","19","27","24"],"a":0,"e":"7 + 11 + 8 = 26 books.","v":"bar-graphs"},{"d":"MEDIUM","q":"In the same graph, how many more books did Bala read than Asha?","o":["3","4","18","2"],"a":1,"e":"11 − 7 = 4 books.","v":"bar-graphs"},{"d":"MEDIUM","q":"A bar graph has values 14, 10, 17 and 9. What is the difference between the greatest and smallest values?","o":["8","7","26","6"],"a":0,"e":"17 − 9 = 8.","v":"bar-graphs"},{"d":"MEDIUM","q":"A graph uses a scale of 10 per interval. A bar spans 3 intervals. What value does it show?","o":["13","20","30","40"],"a":2,"e":"3 × 10 = 30.","v":"bar-graphs"},{"d":"MEDIUM","q":"Four teams score 8, 12, 6 and 10 points. Which two teams' scores total 18?","o":["8 and 10","12 and 10","6 and 8","12 and 8"],"a":0,"e":"8 + 10 = 18.","v":"bar-graphs"},{"d":"MEDIUM","q":"A graph shows 20, 16 and 13 students in three clubs. How many students are in the clubs altogether?","o":["49","39","36","46"],"a":0,"e":"20 + 16 + 13 = 49.","v":"bar-graphs"},{"d":"HARD","q":"A graph shows sales of 24, 31, 18 and 27 items over four days. What is the total sold?","o":["100","90","96","110"],"a":0,"e":"24 + 31 + 18 + 27 = 100.","v":"bar-graphs"},{"d":"HARD","q":"Using values 24, 31, 18 and 27, how many more items were sold on the best day than the lowest day?","o":["13","9","49","12"],"a":0,"e":"31 − 18 = 13.","v":"bar-graphs"},{"d":"HARD","q":"A graph's scale is 4 units per grid interval. A bar spans 7 intervals. What is its value?","o":["11","24","28","32"],"a":2,"e":"7 × 4 = 28.","v":"bar-graphs"},{"d":"HARD","q":"A bar represents 45 students. The scale is 5 students per interval. How many intervals high is the bar?","o":["8","9","10","40"],"a":1,"e":"45 ÷ 5 = 9 intervals.","v":"bar-graphs"},{"d":"HARD","q":"Four categories total 86 responses. Three bars show 21, 18 and 24. What is the fourth value?","o":["23","25","27","20"],"a":0,"e":"86 − (21 + 18 + 24) = 23.","v":"bar-graphs"},{"d":"HARD","q":"A graph shows 36 books for class A and 28 for class B. If class B gets 7 more books, what is its new value?","o":["35","21","43","36"],"a":0,"e":"28 + 7 = 35 books.","v":"bar-graphs"},{"d":"HARD","q":"A scale marks 0, 6, 12, 18, 24. A bar ends at the fourth marked value after zero. What is the value?","o":["18","24","12","6"],"a":1,"e":"The values after zero are 6, 12, 18, 24; the fourth is 24.","v":"bar-graphs"},{"d":"HARD","q":"A bar graph shows 42, 37 and 29 visitors. How many visitors must be added to the smallest category to equal the largest?","o":["13","12","71","9"],"a":0,"e":"42 − 29 = 13 visitors.","v":"bar-graphs"},{"d":"HARD","q":"A class records 16 votes for A, 19 for B and 15 for C. How many additional votes would C need to tie B?","o":["4","3","5","34"],"a":0,"e":"19 − 15 = 4 votes.","v":"bar-graphs"},{"d":"HARD","q":"A graph shows 32, 26, 18 and 24 units. What is the difference between the sum of the two largest values and the sum of the two smallest?","o":["16","14","8","12"],"a":0,"e":"Largest two: 32 + 26 = 58. Smallest two: 18 + 24 = 42. Difference = 16.","v":"bar-graphs"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Read and interpret bar graphs</strong><small>Read graph scales and labels</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Compare bar heights and values</strong><small>Calculate totals and differences</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Compare values in bar graphs</strong><small>Solve real-life graph questions</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script></body></html>
