<main><div class="eyebrow">Maths · Data Handling</div><h1>Bar Graphs</h1><p class="intro">Read bar heights, compare categories, and use graph data to calculate totals and differences.</p>
<a class="sim" href="maths-bar-graphs-simulator.html?v=20261112-bar-graphs-simulator-v1">🧮 Explore the Bar Graphs Simulator</a>
<div class="pr"><span id="counter">QUESTION 1 OF 30</span><span id="pct">0% complete</span></div><div class="track" id="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="bar"></div></div>
<section class="quiz" id="quiz" aria-live="polite"><div class="meta" id="meta"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><div class="hint" id="hint">30 questions · Select one answer</div><button class="btn" id="action" disabled>Check answer</button></div></section><section class="finish" id="finish" hidden></section></main>
<script>
(()=>{'use strict';const questions=[{"d":"BASIC","q":"A bar graph shows 6 students chose cricket and 4 chose tennis. How many chose cricket?","o":["6","4","10","2"],"a":0,"e":"Read the height of the cricket bar: 6 students.","v":"bar-graphs"},{"d":"BASIC","q":"In a bar graph, what does the horizontal axis often show?","o":["Categories","Only the total","The graph's title","The page number"],"a":0,"e":"The horizontal axis often lists categories being compared.","v":"bar-graphs"},{"d":"BASIC","q":"A bar reaches 8 on a scale marked in ones. What value does it represent?","o":["8","4","10","1"],"a":0,"e":"A bar reaching 8 represents a value of 8.","v":"bar-graphs"},{"d":"BASIC","q":"Books borrowed are 3 on Monday and 7 on Tuesday. Which day had more books borrowed?","o":["Tuesday","Monday","Both equal","Cannot tell"],"a":0,"e":"7 is greater than 3, so Tuesday had more.","v":"bar-graphs"},{"d":"BASIC","q":"A graph shows 5 votes for red, 9 for blue and 4 for green. Which colour has the fewest votes?","o":["Green","Red","Blue","All equal"],"a":0,"e":"Green has 4 votes, fewer than 5 and 9.","v":"bar-graphs"},{"d":"BASIC","q":"What does the height or length of a bar show?","o":["The value for that category","The graph maker's age","The date only","The number of categories only"],"a":0,"e":"Each bar's size represents the value for its category.","v":"bar-graphs"},{"d":"BASIC","q":"A bar graph uses a scale where one grid line equals 2 books. A bar reaches 4 grid lines. How many books is that?","o":["8","6","4","2"],"a":0,"e":"4 grid lines × 2 books = 8 books.","v":"bar-graphs"},{"d":"BASIC","q":"Which title best fits a bar graph comparing the number of pets owned by students?","o":["Students' Pets","Weather Forecast","Fractions Practice","A Story About Space"],"a":0,"e":"The title should describe the categories and values shown.","v":"bar-graphs"},{"d":"BASIC","q":"A graph shows 12 visitors on Saturday and 10 on Sunday. How many visitors came across both days?","o":["22","2","120","21"],"a":0,"e":"12 + 10 = 22 visitors.","v":"bar-graphs"},{"d":"BASIC","q":"If two bars have equal heights on the same scale, what does that mean?","o":["Their values are equal","One value is double","Both values are zero","The graph is always wrong"],"a":0,"e":"Equal bar heights on the same scale represent equal values.","v":"bar-graphs"},{"d":"MEDIUM","q":"A bar graph shows 18 students prefer football and 12 prefer basketball. How many more prefer football?","o":["6","30","5","8"],"a":0,"e":"18 − 12 = 6 students.","v":"bar-graphs"},{"d":"MEDIUM","q":"Books read by three students are 4, 7 and 9. What is the total number of books?","o":["20","16","18","21"],"a":0,"e":"4 + 7 + 9 = 20 books.","v":"bar-graphs"},{"d":"MEDIUM","q":"A graph scale increases by 5 per grid line. A bar reaches 6 grid lines. What is its value?","o":["30","11","25","35"],"a":0,"e":"6 × 5 = 30.","v":"bar-graphs"},{"d":"MEDIUM","q":"A bar graph shows Monday 14, Tuesday 17 and Wednesday 11 visitors. Which day had the second-highest count?","o":["Monday","Tuesday","Wednesday","All equal"],"a":0,"e":"17 is highest, 14 is second, and 11 is lowest.","v":"bar-graphs"},{"d":"MEDIUM","q":"A class survey shows 8 chose apples, 13 chose bananas and 9 chose grapes. How many students answered?","o":["30","21","22","29"],"a":0,"e":"8 + 13 + 9 = 30 students.","v":"bar-graphs"},{"d":"MEDIUM","q":"A bar graph shows 25 books in one category and 5 in another. How many times as many books are in the first category?","o":["5 times","20 times","4 times","30 times"],"a":0,"e":"25 ÷ 5 = 5.","v":"bar-graphs"},{"d":"MEDIUM","q":"The scale on a bar graph is 0, 10, 20, 30, 40. A bar reaches halfway between 20 and 30. What value does it show?","o":["25","20","30","15"],"a":0,"e":"Halfway between 20 and 30 is 25.","v":"bar-graphs"},{"d":"MEDIUM","q":"A graph records 16 bikes, 9 scooters and 7 cars. How many more bikes than scooters and cars combined?","o":["0","7","2","9"],"a":0,"e":"Scooters and cars total 9 + 7 = 16, equal to bikes, so the difference is 0.","v":"bar-graphs"},{"d":"MEDIUM","q":"A bar graph shows 32 people at a show in the morning and 45 in the evening. How many more came in the evening?","o":["13","77","12","15"],"a":0,"e":"45 − 32 = 13 people.","v":"bar-graphs"},{"d":"MEDIUM","q":"A graph shows 6, 10, 10 and 14 for four categories. What is the range?","o":["8","14","6","10"],"a":0,"e":"Range = highest − lowest = 14 − 6 = 8.","v":"bar-graphs"},{"d":"HARD","q":"A bar graph shows 24 books on Monday, 18 Tuesday and 30 Wednesday. What is the average per day?","o":["24","72","18","30"],"a":0,"e":"(24 + 18 + 30) ÷ 3 = 72 ÷ 3 = 24.","v":"bar-graphs"},{"d":"HARD","q":"A graph scale labels each major interval as 4 units. A bar reaches 7 intervals. What value does it represent?","o":["28","11","24","32"],"a":0,"e":"7 × 4 = 28 units.","v":"bar-graphs"},{"d":"HARD","q":"A bar graph shows 36 students chose science and 24 chose art. What fraction of these students chose art?","o":["2/5","1/2","3/5","2/3"],"a":0,"e":"Total = 60; art is 24/60 = 2/5.","v":"bar-graphs"},{"d":"HARD","q":"A shop's daily sales are ₹125, ₹150, ₹100 and ₹175. What is the difference between its highest and lowest sales?","o":["₹75","₹50","₹100","₹25"],"a":0,"e":"₹175 − ₹100 = ₹75.","v":"bar-graphs"},{"d":"HARD","q":"A bar graph shows 42 visitors on Friday, 56 on Saturday and 49 on Sunday. How many visitors came over the weekend (Saturday and Sunday)?","o":["105","147","98","91"],"a":0,"e":"56 + 49 = 105 visitors.","v":"bar-graphs"},{"d":"HARD","q":"A graph shows 15, 21, 18 and 30 for four classes. If the total is reduced by 4 from the largest category, what is the new total?","o":["80","84","76","78"],"a":0,"e":"Original total = 84; 84 − 4 = 80.","v":"bar-graphs"},{"d":"HARD","q":"A bar graph shows 28 votes for option A, 35 for B and 21 for C. What percentage of all votes went to B?","o":["41⅔%","35%","50%","25%"],"a":0,"e":"Total = 84; 35 ÷ 84 × 100 = 41⅔%.","v":"bar-graphs"},{"d":"HARD","q":"The values shown are 17, 23, 19 and 25. How much greater is the combined total of the two largest values than the combined total of the two smallest?","o":["12","8","10","6"],"a":0,"e":"Largest two total 25 + 23 = 48; smallest two total 17 + 19 = 36; difference 12.","v":"bar-graphs"},{"d":"HARD","q":"A bar graph shows water use of 48 L, 36 L and 42 L over three days. If the next day uses 30 L, what is the four-day total?","o":["156 L","126 L","150 L","162 L"],"a":0,"e":"48 + 36 + 42 + 30 = 156 L.","v":"bar-graphs"},{"d":"HARD","q":"Four categories have values 12, 18, 24 and 30. What is the difference between the total of the first two and the total of the last two?","o":["24","12","18","30"],"a":0,"e":"First two total 30; last two total 54; difference = 24.","v":"bar-graphs"}];const $=id=>document.getElementById(id);let i=0,sel=-1,locked=false,done=false,xp=0,correct=0,streak=0;const letters=['A','B','C','D'];
function progress(){const p=Math.round(i/questions.length*100);$('bar').style.width=p+'%';$('progress').setAttribute('aria-valuenow',p);$('pct').textContent=p+'% complete';}
function render(){const q=questions[i];sel=-1;locked=false;$('quiz').hidden=false;$('finish').hidden=true;$('counter').textContent='QUESTION '+(i+1)+' OF '+questions.length;$('meta').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(i+1);$('question').textContent=q.q;$('options').innerHTML='';q.o.forEach((v,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.innerHTML='<span class="letter">'+letters[j]+'</span><span></span>';b.querySelector('span:last-child').textContent=v;b.onclick=()=>{if(locked)return;sel=j;[...$('options').children].forEach((x,k)=>x.classList.toggle('selected',k===j));$('action').disabled=false;};$('options').appendChild(b);});$('feedback').className='feedback';$('feedback').textContent='';$('hint').textContent='30 questions · Select one answer';$('action').textContent='Check answer';$('action').disabled=true;progress();}
function act(){if(done){restart();return;}const q=questions[i];if(!locked){if(sel<0)return;locked=true;const ok=sel===q.a;if(ok){correct++;xp+=10;streak++;}else streak=0;$('xp').textContent='⭐ '+xp+' XP';$('streak').textContent='🔥 '+streak;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===sel)b.classList.add('wrong');});$('feedback').textContent=(ok?'✨ Correct! ':'💡 Review: ')+q.e;$('feedback').className='feedback show '+(ok?'good':'bad');$('hint').textContent=ok?'+10 XP':'Keep practising';$('action').textContent=i===questions.length-1?'View results →':'Continue →';return;}if(i<questions.length-1){i++;render();}else results();}
function results(){done=true;$('quiz').hidden=true;$('finish').hidden=false;$('counter').textContent='QUIZ COMPLETE';$('bar').style.width='100%';$('progress').setAttribute('aria-valuenow','100');$('pct').textContent='100% complete';$('finish').innerHTML='<div style="font-size:46px">🏆</div><h2>'+(correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!')+'</h2><div class="score">'+correct+' / '+questions.length+'</div><p>'+Math.round(correct/questions.length*100)+'% accuracy · '+xp+' XP earned</p><div class="skill"><strong>🔢 Compare decimal values</strong><small>Use place value to compare decimals accurately.</small></div><div class="skill"><strong>↔️ Order decimal numbers</strong><small>Compare decimals with different numbers of digits.</small></div><div class="skill"><strong>🧠 Apply comparison strategies</strong><small>Use equivalent trailing zeros and aligned place values.</small></div><button class="btn" id="retry">Try again ↻</button>';$('retry').onclick=restart;}
function restart(){i=0;sel=-1;locked=false;done=false;xp=0;correct=0;streak=0;$('xp').textContent='⭐ 0 XP';$('streak').textContent='🔥 0';render();}
$('action').onclick=act;render();})();
</script><script src="/shared-nav.js?v=20261017-duolingo-standard-v1"></script></body></html>
