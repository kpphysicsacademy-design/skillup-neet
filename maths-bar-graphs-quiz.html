 values shown are 17, 23, 19 and 25. How much greater is the combined total of the two largest values than the combined total of the two smallest?","o":["12","8","10","6"],"a":0,"e":"Largest two total 25 + 23 = 48; smallest two total 17 + 19 = 36; difference 12.","v":"bar-graphs"},{"d":"HARD","q":"A bar graph shows water use of 48 L, 36 L and 42 L over three days. If the next day uses 30 L, what is the four-day total?","o":["156 L","126 L","150 L","162 L"],"a":0,"e":"48 + 36 + 42 + 30 = 156 L.","v":"bar-graphs"},{"d":"HARD","q":"Four categories have values 12, 18, 24 and 30. What is the difference between the total of the first two and the total of the last two?","o":["24","12","18","30"],"a":0,"e":"First two total 30; last two total 54; difference = 24.","v":"bar-graphs"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;q.order=[0,1,2,3];for(let i=q.order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q.order[i],q.order[j]]=[q.order[j],q.order[i]];}q.correctPosition=q.order.indexOf(q.a);$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.order.map((original,i)=>'<button type="button" class="choice" data-i="'+i+'">'+q.o[original]+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.correctPosition;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.correctPosition)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Read and interpret bar graphs</strong><small>Read graph scales and labels</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Compare bar heights and values</strong><small>Calculate totals and differences</small></div></div><div class="skill"><span
