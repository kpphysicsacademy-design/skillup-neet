<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261012-basic-constructions-quiz-v1"><title>Basic Constructions | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Basic constructions</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Which tool draws a straight segment between two marked points?","o":["Compass","Ruler","Protractor","Divider"],"a":1,"e":"A ruler guides a straight line between points.","v":"basic-constructions"},{"d":"BASIC","q":"Which tool draws a circle of chosen radius?","o":["Compass","Ruler","Protractor","Set square"],"a":0,"e":"A compass maintains a fixed radius as it turns.","v":"basic-constructions"},{"d":"BASIC","q":"Which instrument measures angles in degrees?","o":["Compass","Ruler","Protractor","Divider"],"a":2,"e":"A protractor is graduated in degrees.","v":"basic-constructions"},{"d":"BASIC","q":"To draw a 6 cm segment, what should you do?","o":["Estimate by eye","Mark endpoints 6 cm apart with a ruler","Draw a circle","Measure 6 degrees"],"a":1,"e":"Use the ruler scale to mark the required length.","v":"basic-constructions"},{"d":"BASIC","q":"For a circle of radius 3 cm, set the compass opening to...","o":["1.5 cm","3 cm","6 cm","9 cm"],"a":1,"e":"The compass opening equals the radius.","v":"basic-constructions"},{"d":"BASIC","q":"The fixed point at the centre of a circle is its...","o":["Vertex","Centre","Endpoint","Midpoint"],"a":1,"e":"The compass needle stays at the centre.","v":"basic-constructions"},{"d":"BASIC","q":"Which tool draws equal-radius arcs from different points?","o":["Compass","Protractor","Ruler alone","Calculator"],"a":0,"e":"Keep the compass opening unchanged to repeat a radius.","v":"basic-constructions"},{"d":"BASIC","q":"When measuring a segment with a ruler, align its start with...","o":["The 1 cm mark always","The zero mark","The ruler's midpoint","Any number"],"a":1,"e":"Starting at zero makes the reading direct.","v":"basic-constructions"},{"d":"BASIC","q":"To copy a length with a compass, keep unchanged the...","o":["Compass opening","Paper colour","Ruler scale","Pencil angle"],"a":0,"e":"An unchanged opening transfers the same distance.","v":"basic-constructions"},{"d":"BASIC","q":"Which pair is most useful for basic constructions?","o":["Ruler and compass","Clock and calculator","Protractor and calculator","Only a ruler"],"a":0,"e":"A ruler draws straight lines and a compass draws circles and arcs.","v":"basic-constructions"},{"d":"MEDIUM","q":"For a perpendicular bisector, equal-radius arcs are drawn from...","o":["The segment's endpoints","Only its midpoint","Two unrelated points","The ruler's ends"],"a":0,"e":"Arcs from both endpoints locate points equidistant from them.","v":"basic-constructions"},{"d":"MEDIUM","q":"The perpendicular bisector meets a segment at its...","o":["Endpoint","Midpoint at 90°","One-third point","Parallel point"],"a":1,"e":"It halves the segment and meets it at a right angle.","v":"basic-constructions"},{"d":"MEDIUM","q":"To start bisecting an angle, draw an arc centred at...","o":["One arm's endpoint","The angle's vertex","The paper corner","The ruler's end"],"a":1,"e":"The first arc marks points on both arms at equal distance from the vertex.","v":"basic-constructions"},{"d":"MEDIUM","q":"An angle bisector divides an angle into...","o":["Two equal angles","Two right angles always","Three equal angles","Two unequal angles"],"a":0,"e":"The two resulting angles have equal measures.","v":"basic-constructions"},{"d":"MEDIUM","q":"To construct a perpendicular through a point on a line, first locate...","o":["Two points equally spaced on the line","A circle's circumference","A random endpoint","A parallel segment"],"a":0,"e":"Equal distances on either side help construct the perpendicular.","v":"basic-constructions"},{"d":"MEDIUM","q":"Why use equal compass radii from the endpoints of a segment?","o":["To locate equidistant arc intersections","To make the line longer","To measure degrees","To draw parallel lines"],"a":0,"e":"Equal radii make intersections equidistant from both endpoints.","v":"basic-constructions"},{"d":"MEDIUM","q":"A segment is 8 cm long. Its midpoint is how far from either endpoint?","o":["2 cm","4 cm","6 cm","8 cm"],"a":1,"e":"Half of 8 cm is 4 cm.","v":"basic-constructions"},{"d":"MEDIUM","q":"Every point on a segment's perpendicular bisector is...","o":["Equidistant from both endpoints","On an endpoint","Parallel to the segment","Exactly 1 cm away"],"a":0,"e":"The perpendicular bisector is the locus of points equally distant from endpoints.","v":"basic-constructions"},{"d":"MEDIUM","q":"When copying an angle, matching arcs help preserve...","o":["The angle's geometry","The paper size","The ruler length","A right angle only"],"a":0,"e":"The arcs let you transfer the distance between the angle arms.","v":"basic-constructions"},{"d":"MEDIUM","q":"Which habit improves construction accuracy?","o":["Keep the compass point steady","Change radius mid-arc","Estimate lengths by eye","Erase all marks first"],"a":0,"e":"A steady compass point prevents the centre from shifting.","v":"basic-constructions"},{"d":"HARD","q":"A 10 cm segment is bisected. What is each half?","o":["2 cm","4 cm","5 cm","10 cm"],"a":2,"e":"The midpoint divides 10 cm into two equal 5 cm parts.","v":"basic-constructions"},{"d":"HARD","q":"For a 12 cm segment, which radius definitely lets equal arcs intersect on both sides?","o":["4 cm","5 cm","7 cm","6 cm exactly"],"a":2,"e":"The common radius must be greater than half the 12 cm distance.","v":"basic-constructions"},{"d":"HARD","q":"An angle is 74°. Each half after bisecting is...","o":["27°","37°","42°","74°"],"a":1,"e":"74° divided by 2 is 37°.","v":"basic-constructions"},{"d":"HARD","q":"Unequal radii from segment endpoints can disrupt a perpendicular-bisector construction because...","o":["The arcs do not ensure equal distance from both endpoints","A ruler cannot draw a line","The segment becomes curved","The angle becomes 90° automatically"],"a":0,"e":"The construction depends on equal-radius arcs.","v":"basic-constructions"},{"d":"HARD","q":"Two equal circles centred at segment endpoints intersect twice when their radius is...","o":["Greater than half the centre distance","Zero","Less than half the centre distance","Always unrelated to the distance"],"a":0,"e":"A common radius greater than half the centre distance produces two intersections.","v":"basic-constructions"},{"d":"HARD","q":"To copy a 5 cm length with a compass, set its opening using...","o":["A ruler's 5 cm distance","A 5° angle","A circle's diameter only","The page width"],"a":0,"e":"Measure the required distance first, then transfer it.","v":"basic-constructions"},{"d":"HARD","q":"Why leave construction arcs visible while checking work?","o":["They show the construction points and intersections","They increase the segment length","They replace all measurements","They make angles equal automatically"],"a":0,"e":"The arcs show how the constructed points were located.","v":"basic-constructions"},{"d":"HARD","q":"If M bisects XY and XM is 3.5 cm, XY equals...","o":["3.5 cm","7 cm","10.5 cm","14 cm"],"a":1,"e":"Both halves are 3.5 cm, so the whole is 7 cm.","v":"basic-constructions"},{"d":"HARD","q":"Which statement defines a perpendicular line pair?","o":["They meet at 90°","They never meet","They meet at 45°","They have equal lengths"],"a":0,"e":"Perpendicular lines form a right angle.","v":"basic-constructions"},{"d":"HARD","q":"A compass radius is 4 cm. If the opening is unchanged, a second arc has radius...","o":["2 cm","4 cm","8 cm","It cannot be known"],"a":1,"e":"The fixed opening keeps the radius at 4 cm.","v":"basic-constructions"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Use ruler and compass accurately</strong><small>Construct and bisect line segments</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Construct angle bisectors and perpendiculars</strong><small>Understand compass arcs and equal distances</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply construction methods to geometric problems</strong><small>Use accurate ruler-and-compass methods</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>\n<script src="/shared-nav.js?v=20261013-universal-nav-v1"></script>\n</body></html>
