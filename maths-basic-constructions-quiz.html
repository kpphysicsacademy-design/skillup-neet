.btn:disabled{opacity:.4;cursor:not-allowed}
.finish{text-align:center;padding:20px 14px}.trophy{font-size:42px}.score{font-size:34px;font-weight:850;color:var(--ink)}.finish h2{margin:5px 0 8px}
.finish .btn{margin-top:12px;max-width:250px;background:var(--green);color:#fff}

:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

 .nav{min-height:44px;padding:5px 9px;gap:7px}.brand{font-size:14px}.pill{font-size:10px;padding:5px 7px}
 main{width:100%;padding:10px 9px 22px}.hero{padding:2px 2px 10px}.hero h1{font-size:19px}
 .quiz,.finish{padding:12px;border-radius:11px}.question{font-size:18px;margin:7px 0 11px}
 .option{min-height:39px;padding:7px 9px;font-size:13px}.options{gap:6px}
 .btn{min-height:37px;font-size:12px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}

<main>
<section class="hero">
<h1>📐 Basic Constructions</h1>
<p class="muted">Ruler and compass · Angles · Geometric constructions</p>

<div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div>
<div class="track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
</section>
<section class="quiz" id="quiz">
<div class="qmeta" id="qmeta">QUESTION 1</div>
<h2 class="question" id="question"></h2>
<div class="options" id="options"></div>
<div class="feedback" id="feedback" aria-live="polite"></div>

</section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[{"q":"Which tool draws a straight segment between two marked points?","o":["Compass","Ruler","Protractor","Divider"],"a":1,"why":"A ruler guides a straight line between points."},{"q":"Which tool draws a circle of chosen radius?","o":["Compass","Ruler","Protractor","Set square"],"a":0,"why":"A compass maintains a fixed radius as it turns."},{"q":"Which instrument measures angles in degrees?","o":["Compass","Ruler","Protractor","Divider"],"a":2,"why":"A protractor is graduated in degrees."},{"q":"To draw a 6 cm segment, what should you do?","o":["Estimate by eye","Mark endpoints 6 cm apart with a ruler","Draw a circle","Measure 6 degrees"],"a":1,"why":"Use the ruler scale to mark the required length."},{"q":"For a circle of radius 3 cm, set the compass opening to...","o":["1.5 cm","3 cm","6 cm","9 cm"],"a":1,"why":"The compass opening equals the radius."},{"q":"The fixed point at the centre of a circle is its...","o":["Vertex","Centre","Endpoint","Midpoint"],"a":1,"why":"The compass needle stays at the centre."},{"q":"Which tool draws equal-radius arcs from different points?","o":["Compass","Protractor","Ruler alone","Calculator"],"a":0,"why":"Keep the compass opening unchanged to repeat a radius."},{"q":"When measuring a segment with a ruler, align its start with...","o":["The 1 cm mark always","The zero mark","The ruler's midpoint","Any number"],"a":1,"why":"Starting at zero makes the reading direct."},{"q":"To copy a length with a compass, keep unchanged the...","o":["Compass opening","Paper colour","Ruler scale","Pencil angle"],"a":0,"why":"An unchanged opening transfers the same distance."},{"q":"Which pair is most useful for basic constructions?","o":["Ruler and compass","Clock and calculator","Protractor and calculator","Only a ruler"],"a":0,"why":"A ruler draws straight lines and a compass draws circles and arcs."},{"q":"For a perpendicular bisector, equal-radius arcs are drawn from...","o":["The segment's endpoints","Only its midpoint","Two unrelated points","The ruler's ends"],"a":0,"why":"Arcs from both endpoints locate points equidistant from them."},{"q":"The perpendicular bisector meets a segment at its...","o":["Endpoint","Midpoint at 90°","One-third point","Parallel point"],"a":1,"why":"It halves the segment and meets it at a right angle."},{"q":"To start bisecting an angle, draw an arc centred at...","o":["One arm's endpoint","The angle's vertex","The paper corner","The ruler's end"],"a":1,"why":"The first arc marks points on both arms at equal distance from the vertex."},{"q":"An angle bisector divides an angle into...","o":["Two equal angles","Two right angles always","Three equal angles","Two unequal angles"],"a":0,"why":"The two resulting angles have equal measures."},{"q":"To construct a perpendicular through a point on a line, first locate...","o":["Two points equally spaced on the line","A circle's circumference","A random endpoint","A parallel segment"],"a":0,"why":"Equal distances on either side help construct the perpendicular."},{"q":"Why use equal compass radii from the endpoints of a segment?","o":["To locate equidistant arc intersections","To make the line longer","To measure degrees","To draw parallel lines"],"a":0,"why":"Equal radii make intersections equidistant from both endpoints."},{"q":"A segment is 8 cm long. Its midpoint is how far from either endpoint?","o":["2 cm","4 cm","6 cm","8 cm"],"a":1,"why":"Half of 8 cm is 4 cm."},{"q":"Every point on a segment's perpendicular bisector is...","o":["Equidistant from both endpoints","On an endpoint","Parallel to the segment","Exactly 1 cm away"],"a":0,"why":"The perpendicular bisector is the locus of points equally distant from endpoints."},{"q":"When copying an angle, matching arcs help preserve...","o":["The angle's geometry","The paper size","The ruler length","A right angle only"],"a":0,"why":"The arcs let you transfer the distance between the angle arms."},{"q":"Which habit improves construction accuracy?","o":["Keep the compass point steady","Change radius mid-arc","Estimate lengths by eye","Erase all marks first"],"a":0,"why":"A steady compass point prevents the centre from shifting."},{"q":"A 10 cm segment is bisected. What is each half?","o":["2 cm","4 cm","5 cm","10 cm"],"a":2,"why":"The midpoint divides 10 cm into two equal 5 cm parts."},{"q":"For a 12 cm segment, which radius definitely lets equal arcs intersect on both sides?","o":["4 cm","5 cm","7 cm","6 cm exactly"],"a":2,"why":"The common radius must be greater than half the 12 cm distance."},{"q":"An angle is 74°. Each half after bisecting is...","o":["27°","37°","42°","74°"],"a":1,"why":"74° divided by 2 is 37°."},{"q":"Unequal radii from segment endpoints can disrupt a perpendicular-bisector construction because...","o":["The arcs do not ensure equal distance from both endpoints","A ruler cannot draw a line","The segment becomes curved","The angle becomes 90° automatically"],"a":0,"why":"The construction depends on equal-radius arcs."},{"q":"Two equal circles centred at segment endpoints intersect twice when their radius is...","o":["Greater than half the centre distance","Zero","Less than half the centre distance","Always unrelated to the distance"],"a":0,"why":"A common radius greater than half the centre distance produces two intersections."},{"q":"To copy a 5 cm length with a compass, set its opening using...","o":["A ruler's 5 cm distance","A 5° angle","A circle's diameter only","The page width"],"a":0,"why":"Measure the required distance first, then transfer it."},{"q":"Why leave construction arcs visible while checking work?","o":["They show the construction points and intersections","They increase the segment length","They replace all measurements","They make angles equal automatically"],"a":0,"why":"The arcs show how the constructed points were located."},{"q":"If M bisects XY and XM is 3.5 cm, XY equals...","o":["3.5 cm","7 cm","10.5 cm","14 cm"],"a":1,"why":"Both halves are 3.5 cm, so the whole is 7 cm."},{"q":"Which statement defines a perpendicular line pair?","o":["They meet at 90°","They never meet","They meet at 45°","They have equal lengths"],"a":0,"why":"Perpendicular lines form a right angle."},{"q":"A compass radius is 4 cm. If the opening is unchanged, a second arc has radius...","o":["2 cm","4 cm","8 cm","It cannot be known"],"a":1,"why":"The fixed opening keeps the radius at 4 cm."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Basic Constructions Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261104-physics-path-layout-v2" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
