<style>

 .quiz,.finish{padding:12px;border-radius:11px}.question{font-size:18px;margin:7px 0 11px}

}

<main>
<section class="hero">
<h1>Cartesian Plane</h1>
<p class="muted">Understand the Cartesian plane, identify quadrants and axes, and work with ordered pairs and coordinates.</p>
<div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div>
<div class="track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
</section>
<section class="quiz" id="quiz">
<div class="qmeta" id="qmeta">QUESTION 1</div>
<h2 class="question" id="question">Cartesian plane mastered!</h2>
<div class="options" id="options"></div>
<div class="feedback" id="feedback" aria-live="polite"></div>
<div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div>
</section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"What is the horizontal axis in the Cartesian plane called?","o":["y-axis","x-axis","origin","quadrant"],"a":1,"why":"The horizontal axis is the x-axis."},{"d":"BASIC","q":"What is the vertical axis called?","o":["x-axis","y-axis","origin","coordinate"],"a":1,"why":"The vertical axis is the y-axis."},{"d":"BASIC","q":"What are the coordinates of the origin?","o":["(1,1)","(0,1)","(0,0)","(1,0)"],"a":2,"why":"The two axes meet at the origin (0,0)."},{"d":"BASIC","q":"Which coordinate is written first in an ordered pair (x,y)?","o":["y-coordinate","x-coordinate","Either one","The origin"],"a":1,"why":"The x-coordinate is written first, followed by the y-coordinate."},{"d":"BASIC","q":"In the point (4,−2), what is the x-coordinate?","o":["−2","2","4","−4"],"a":2,"why":"The first number in (4,−2) is the x-coordinate, 4."},{"d":"BASIC","q":"In the point (−3,5), what is the y-coordinate?","o":["−3","3","5","−5"],"a":2,"why":"The second number is the y-coordinate, 5."},{"d":"BASIC","q":"A point on the x-axis has which y-coordinate?","o":["0","1","−1","Any number"],"a":0,"why":"Every point on the x-axis has y=0."},{"d":"BASIC","q":"A point on the y-axis has which x-coordinate?","o":["0","1","−1","Any number"],"a":0,"why":"Every point on the y-axis has x=0."},{"d":"BASIC","q":"Which point lies on the x-axis?","o":["(0,4)","(−2,0)","(3,1)","(2,−1)"],"a":1,"why":"The y-coordinate is zero for (−2,0), so it lies on the x-axis."},{"d":"BASIC","q":"Which point lies on the y-axis?","o":["(3,0)","(2,4)","(0,−5)","(−1,−1)"],"a":2,"why":"The x-coordinate is zero for (0,−5), so it lies on the y-axis."},{"d":"MEDIUM","q":"Which point is 3 units right and 2 units up from the origin?","o":["(−3,2)","(3,−2)","(3,2)","(2,3)"],"a":2,"why":"Right means positive x and up means positive y, giving (3,2)."},{"d":"MEDIUM","q":"Which point is 4 units left and 1 unit down from the origin?","o":["(4,1)","(−4,−1)","(−1,−4)","(4,−1)"],"a":1,"why":"Left gives negative x and down gives negative y: (−4,−1)."},{"d":"MEDIUM","q":"Which point has the same x-coordinate as (5,−2)?","o":["(−2,5)","(5,3)","(3,5)","(−5,−2)"],"a":1,"why":"Both (5,−2) and (5,3) have x-coordinate 5."},{"d":"MEDIUM","q":"Which point has the same y-coordinate as (−1,4)?","o":["(4,−1)","(2,4)","(−1,2)","(4,2)"],"a":1,"why":"Both points have y-coordinate 4."},{"d":"MEDIUM","q":"What is the x-coordinate of any point on the y-axis?","o":["−1","1","0","It varies"],"a":2,"why":"The x-coordinate is always zero on the y-axis."},{"d":"MEDIUM","q":"Which ordered pair represents a point 2 units left of the origin on the x-axis?","o":["(0,−2)","(−2,0)","(2,0)","(0,2)"],"a":1,"why":"Moving left gives x=−2, and the x-axis means y=0."},{"d":"MEDIUM","q":"If a point is (0,7), where does it lie?","o":["x-axis","y-axis","Neither axis","Origin"],"a":1,"why":"Its x-coordinate is zero, so it lies on the y-axis."},{"d":"MEDIUM","q":"Which point is closest to the origin by horizontal and vertical grid steps?","o":["(5,0)","(1,1)","(0,4)","(3,0)"],"a":1,"why":"The point (1,1) is only one step horizontally and one vertically from the origin."},{"d":"MEDIUM","q":"What is the distance in horizontal grid steps from (−4,2) to the y-axis?","o":["2","4","−4","6"],"a":1,"why":"The horizontal distance to the y-axis is the absolute value of x, |−4|=4."},{"d":"MEDIUM","q":"Which point is 3 units below (2,4) with the same x-coordinate?","o":["(−1,4)","(2,1)","(5,4)","(2,7)"],"a":1,"why":"Keep x=2 and subtract 3 from y: (2,1)."},{"d":"HARD","q":"A point has x-coordinate −3 and lies on the x-axis. What is the point?","o":["(0,−3)","(−3,0)","(−3,1)","(3,0)"],"a":1,"why":"On the x-axis y=0, so the point is (−3,0)."},{"d":"HARD","q":"A point lies on the y-axis and is 6 units below the origin. What are its coordinates?","o":["(−6,0)","(0,6)","(0,−6)","(6,0)"],"a":2,"why":"On the y-axis x=0; below the origin means y=−6."},{"d":"HARD","q":"Point A is (−2,3). If it moves 4 units right and 5 units down, where does it end?","o":["(2,−2)","(−6,8)","(2,8)","(−6,−2)"],"a":0,"why":"Add 4 to x: −2+4=2; subtract 5 from y: 3−5=−2."},{"d":"HARD","q":"Which point is 2 units from the y-axis and 3 units above the x-axis in the first quadrant?","o":["(−2,3)","(2,−3)","(2,3)","(3,2)"],"a":2,"why":"First quadrant means both coordinates are positive, giving (2,3)."},{"d":"HARD","q":"If P=(a,0) lies on the x-axis, which statement is always true?","o":["a=0","Its y-coordinate is zero","Its x-coordinate is zero","P is always the origin"],"a":1,"why":"Points on the x-axis have y-coordinate zero; a may be any real number."},{"d":"HARD","q":"The point (−5,b) lies on the y-axis. What must b be?","o":["−5","0","5","No such point exists"],"a":3,"why":"A point on the y-axis must have x=0, but this point has x=−5, so it cannot lie on the y-axis."},{"d":"HARD","q":"Which point is 3 units left of (1,−2) and 4 units up?","o":["(−2,2)","(4,2)","(−2,−6)","(−3,2)"],"a":0,"why":"x=1−3=−2 and y=−2+4=2."},{"d":"HARD","q":"A point (x,y) has x=0 and y<0. Where is it located?","o":["Negative x-axis","Positive y-axis","Negative y-axis","Fourth quadrant"],"a":2,"why":"x=0 places it on the y-axis, and y<0 places it below the origin."},{"d":"HARD","q":"Which statement about (0,0) is correct?","o":["It lies only on the x-axis","It lies only on the y-axis","It is the origin and lies on both axes","It lies in quadrant I"],"a":2,"why":"The origin is where the x- and y-axes intersect."},{"d":"HARD","q":"Point Q=(−4,−3) moves 4 units right and 3 units up. Where does it finish?","o":["(0,0)","(−8,−6)","(0,−6)","(4,3)"],"a":0,"why":"The new coordinates are (−4+4,−3+3)=(0,0)."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Cartesian Plane Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>

</body>
