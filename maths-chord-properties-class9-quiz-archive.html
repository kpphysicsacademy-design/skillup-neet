<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"In △ABC, D and E are the midpoints of AB and AC. The segment DE is called the: ","o":["Median","Mid-segment","Altitude","Angle bisector"],"a":1,"e":"The segment joining the midpoints of two sides of a triangle is its mid-segment."},{"d":"BASIC","q":"The midpoint theorem states that the segment joining the midpoints of two sides of a triangle is:","o":["Parallel to the third side and half its length","Perpendicular to the third side","Equal to the third side","Twice the third side"],"a":0,"e":"The midpoint segment is parallel to the third side and has half its length."},{"d":"BASIC","q":"If BC = 12 cm and D, E are the midpoints of AB and AC, then DE is:","o":["24 cm","12 cm","6 cm","3 cm"],"a":2,"e":"DE = ½ BC = 6 cm."},{"d":"BASIC","q":"If D is the midpoint of AB and AB = 14 cm, then AD equals:","o":["14 cm","7 cm","28 cm","3.5 cm"],"a":1,"e":"A midpoint divides a segment into two equal parts."},{"d":"BASIC","q":"If D and E are midpoints of AB and AC, then DE is parallel to:","o":["AB","AC","BC","None of these"],"a":2,"e":"The midpoint theorem gives DE ∥ BC."},{"d":"BASIC","q":"A line through the midpoint of one side of a triangle, parallel to another side, meets the third side at its:","o":["Vertex","Midpoint","Centroid","Orthocentre"],"a":1,"e":"This is the converse of the midpoint theorem."},{"d":"BASIC","q":"If DE ∥ BC in △ABC and D is the midpoint of AB, then E is the midpoint of:","o":["AB","AC","BC","DE"],"a":1,"e":"By the converse theorem, E bisects AC."},{"d":"BASIC","q":"If DE = 5 cm for the segment joining two side midpoints, BC is:","o":["2.5 cm","5 cm","10 cm","15 cm"],"a":2,"e":"The third side is twice the midpoint segment: BC = 2 × 5 = 10 cm."},{"d":"BASIC","q":"The midpoint theorem is applied to which shape?","o":["Circle","Triangle","Trapezium only","Pentagon"],"a":1,"e":"The theorem concerns the segment joining the midpoints of two sides of a triangle."},{"d":"BASIC","q":"If AD = DB, point D is the:","o":["Centroid","Midpoint of AB","Vertex","Foot of altitude"],"a":1,"e":"Equal parts AD and DB show that D is the midpoint of AB."},{"d":"MEDIUM","q":"In △PQR, X and Y are midpoints of PQ and PR. If QR = 18 cm, XY is:","o":["9 cm","18 cm","36 cm","6 cm"],"a":0,"e":"XY = ½ QR = 9 cm."},{"d":"MEDIUM","q":"In △ABC, D and E are midpoints of AB and AC. If DE = 7.5 cm, then BC is:","o":["7.5 cm","15 cm","22.5 cm","3.75 cm"],"a":1,"e":"BC = 2DE = 15 cm."},{"d":"MEDIUM","q":"In △ABC, D is the midpoint of AB. A line through D parallel to BC meets AC at E. If AC = 16 cm, AE is:","o":["4 cm","8 cm","16 cm","32 cm"],"a":1,"e":"By the converse midpoint theorem, E is the midpoint of AC; AE = 8 cm."},{"d":"MEDIUM","q":"D and E are midpoints of AB and AC. If AB = 20 cm and AC = 14 cm, then AD + AE is:","o":["10 cm","17 cm","34 cm","7 cm"],"a":1,"e":"AD = 10 cm and AE = 7 cm, so their sum is 17 cm."},{"d":"MEDIUM","q":"In △ABC, D and E are midpoints of AB and AC. If BC = 3x + 2 and DE = x + 1, find x.","o":["0","1","2","3"],"a":0,"e":"By the theorem, 3x + 2 = 2(x + 1), giving x = 0."},{"d":"MEDIUM","q":"In △ABC, D and E are midpoints of AB and AC. If ∠A = 50° and ∠B = 65°, the angle between DE and AC is:","o":["50°","65°","115°","75°"],"a":1,"e":"Since DE ∥ BC, the angle between DE and AC equals the corresponding angle between BC and AC, which is ∠C = 65°."},{"d":"MEDIUM","q":"In △ABC, D and E are midpoints of AB and AC. If BC = 2x + 6 and DE = 9, x equals:","o":["3","6","9","12"],"a":1,"e":"2DE = BC, so 18 = 2x + 6 and x = 6."},{"d":"MEDIUM","q":"If a line through the midpoint of AB is parallel to BC and meets AC at E, which statement is true?","o":["AE = AC","AE = EC","AB = AC","BE = EC"],"a":1,"e":"The converse midpoint theorem establishes that E is the midpoint of AC."},{"d":"MEDIUM","q":"In △XYZ, M and N are midpoints of XY and XZ. If MN = 4.2 cm, perimeter relation gives YZ as:","o":["2.1 cm","4.2 cm","8.4 cm","12.6 cm"],"a":2,"e":"MN = ½YZ, so YZ = 8.4 cm."},{"d":"MEDIUM","q":"In △ABC, D and E are midpoints of AB and AC. If DE ∥ BC and BC = 24 cm, the ratio DE:BC is:","o":["1:2","2:1","1:3","3:2"],"a":0,"e":"The midpoint segment is half the third side, so the ratio is 1:2."},{"d":"HARD","q":"In △ABC, D and E are midpoints of AB and AC. If DE = 2x + 1 and BC = 5x − 2, find x.","o":["2","3","4","5"],"a":2,"e":"2(2x + 1) = 5x − 2, so 4x + 2 = 5x − 2 and x = 4."},{"d":"HARD","q":"In △ABC, D and E are midpoints of AB and AC. If the perimeter of △ADE is 18 cm and DE = 6 cm, while AD = 5 cm, then AE is:","o":["5 cm","6 cm","7 cm","8 cm"],"a":2,"e":"Perimeter ADE = AD + AE + DE, so 18 = 5 + AE + 6 and AE = 7 cm."},{"d":"HARD","q":"In △ABC, D and E are midpoints of AB and AC. If AB = 3x + 2, AD = 10 cm, then x equals:","o":["4","5","6","8"],"a":2,"e":"AD = AB/2, so AB = 20; 3x + 2 = 20 gives x = 6."},{"d":"HARD","q":"In △ABC, D and E are midpoints of AB and AC. If ∠B = 40° and ∠C = 70°, what is the angle between DE and AC?","o":["40°","70°","110°","30°"],"a":1,"e":"DE ∥ BC, so the angle between DE and AC equals the angle between BC and AC, which is ∠C = 70°."},{"d":"HARD","q":"In △ABC, D and E are midpoints of AB and AC. If BC = 4x − 2 and DE = x + 4, find x.","o":["4","5","6","7"],"a":1,"e":"4x − 2 = 2(x + 4), so 2x = 10 and x = 5."},{"d":"HARD","q":"In △PQR, M is the midpoint of PQ. Through M, MN is drawn parallel to QR meeting PR at N. If PN = 6 cm, PR is:","o":["6 cm","9 cm","12 cm","18 cm"],"a":2,"e":"By the converse midpoint theorem, N is the midpoint of PR; PR = 2 × 6 = 12 cm."},{"d":"HARD","q":"In △ABC, D and E are midpoints of AB and AC. F is the midpoint of DE. If BC = 26 cm, DF is:","o":["6.5 cm","13 cm","26 cm","52 cm"],"a":0,"e":"DE = ½BC = 13 cm, and F bisects DE, so DF = 6.5 cm."},{"d":"HARD","q":"In △ABC, D and E are midpoints of AB and AC. If BC = 26 cm, then DE is:","o":["6.5 cm","13 cm","26 cm","52 cm"],"a":1,"e":"DE = ½BC = 13 cm."},{"d":"HARD","q":"In △ABC, D is midpoint of AB and E lies on AC. If DE ∥ BC and AE = 4x − 1, EC = 2x + 5, find x.","o":["2","3","4","5"],"a":1,"e":"The converse gives AE = EC; 4x − 1 = 2x + 5, so x = 3."},{"d":"HARD","q":"In △ABC, D and E are midpoints of AB and AC. If BC = 26 cm and DE is extended to F such that EF = DE, then DF is:","o":["6.5 cm","13 cm","26 cm","39 cm"],"a":2,"e":"DE = 13 cm and EF = 13 cm, so DF = 26 cm."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand the midpoint theorem</strong><small>Join the midpoints of two sides of a triangle</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Use the converse theorem</strong><small>Identify a midpoint using a parallel line</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve midpoint-segment problems</strong><small>Calculate half-lengths and prove parallel relationships</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
