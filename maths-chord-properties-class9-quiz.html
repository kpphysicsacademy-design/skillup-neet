(function(){'use strict';const questions=[{"d":"BASIC","q":"A perpendicular from the centre to a chord:","o":["Bisects the chord","Doubles the chord","Is parallel to it","Is a tangent"],"a":0,"e":"The perpendicular from the centre of a circle bisects the chord."},{"d":"BASIC","q":"The longest chord of a circle is the:","o":["Radius","Diameter","Arc","Tangent"],"a":1,"e":"The diameter passes through the centre and is the longest chord."},{"d":"BASIC","q":"Equal chords in the same circle are:","o":["Unequally distant from centre","Equidistant from centre","Always diameters","Always parallel"],"a":1,"e":"Equal chords of the same circle are equidistant from the centre."},{"d":"BASIC","q":"A chord of length 8 cm is perpendicular to OM at M from centre O. AM equals:","o":["2 cm","4 cm","8 cm","16 cm"],"a":1,"e":"The perpendicular bisects the chord: AM=8/2=4 cm."},{"d":"BASIC","q":"A radius perpendicular to a chord meets it at:","o":["An endpoint","Its midpoint","A point outside the circle","A point on the circumference only"],"a":1,"e":"The perpendicular from the centre to a chord bisects it."},{"d":"BASIC","q":"A chord passing through the centre is a:","o":["Tangent","Diameter","Secant outside circle","Minor arc"],"a":1,"e":"A diameter is a chord that passes through the centre."},{"d":"BASIC","q":"Chords equally distant from the centre of the same circle are:","o":["Equal","Perpendicular","Diameters","Unequal"],"a":0,"e":"Equal distances from the centre imply equal chord lengths."},{"d":"BASIC","q":"A line perpendicular to a chord at its midpoint and joining the centre is:","o":["A radius line through the chord midpoint","A tangent","A chord itself","An arc"],"a":0,"e":"The centre-to-midpoint line is perpendicular to the chord."},{"d":"BASIC","q":"The angle between a chord and a perpendicular from the centre to it is:","o":["30°","45°","60°","90°"],"a":3,"e":"Perpendicular lines form a right angle."},{"d":"BASIC","q":"Which chord is longer in the same circle?","o":["One e nearer chord AB is longer."},{"d":"MEDIUM","q":"A chord is 14 cm long and 24 cm from the centre. Find the radius.","o":["20 cm","24 cm","25 cm","26 cm"],"a":2,"e":"Half-chord=7; radius=√(24²+7²)=25 cm."},{"d":"HARD","q":"A circle has radius 10 cm. Parallel chords lie on opposite sides of centre at distances 6 cm and 8 cm. Distance between chords:","o":["2 cm","7 cm","14 cm","16 cm"],"a":2,"e":"Opposite sides means add the distances: 6+8=14 cm."},{"d":"HARD","q":"A circle of radius 10 cm has a chord 12 cm long. Its distance from centre is:","o":["4 cm","6 cm","8 cm","Cannot exist"],"a":2,"e":"Half-chord=6; distance=√(100−36)=8 cm."},{"d":"HARD","q":"A chord is 5 cm from centre of a circle of radius 13 cm. Its length is:","o":["10 cm","12 cm","24 cm","26 cm"],"a":2,"e":"Half-chord=√(169−25)=12 cm, so chord=24 cm."},{"d":"HARD","q":"Equal chords in a circle have distances x+2 and 3x−6 from the centre. Find x.","o":["2","3","4","5"],"a":2,"e":"Equal chords are equidistant: x+2=3x−6, so x=4."},{"d":"HARD","q":"A circle has radius 17 cm. Chords are 16 cm and 30 cm long. Their distances from centre respectively are:","o":["15 cm and 8 cm","8 cm and 15 cm","9 cm and 7 cm","12 cm and 4 cm"],"a":0,"e":"For 16 cm chord: √(289−64)=15; for 30 cm chord: √(289−225)=8."},{"d":"HARD","q":"A chord of a circle of radius 10 cm is 8 cm from the centre. The chord is what fraction of the diameter?","o":["3/5","4/5","1/2","2/5"],"a":0,"e":"Half-chord=√(100−64)=6, chord=12; diameter=20, fraction=3/5."},{"d":"HARD","q":"A circle has radius 13 cm. Chord AB is 5 cm from centre and CD is 12 cm from centre. Find AB−CD.","o":["10 cm","12 cm","14 cm","16 cm"],"a":2,"e":"AB=24 cm; CD=10 cm; difference=14 cm."},{"d":"HARD","q":"Two chords of the same circle have lengths 10 cm and 24 cm. The longer chord is 5 cm from centre. Find radius.","o":["12 cm","13 cm","15 cm","17 cm"],"a":1,"e":"Half of the 24 cm chord is 12; radius=√(12²+5²)=13 cm."},{"d":"HARD","q":"A circle has radius 15 cm and a chord 18 cm long. Its perpendicular distance from centre is:","o":["9 cm","12 cm","13 cm","14 cm"],"a":1,"e":"Half-chord=9; distance=√(15²−9²)=12 cm."},{"d":"HARD","q":"A chord of length 16 cm is 6 cm from centre. What is the circle's radius?","o":["8 cm","10 cm","12 cm","14 cm"],"a":1,"e":"Half-chord=8; radius=√(8²+6²)=10 cm."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand chord theorems</strong><small>Use perpendicular distances and chord lengths</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Compare chords in a circle</strong><small>Apply radius–chord relationships</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve chord geometry problems</strong><small>Practise circle chord applications</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
