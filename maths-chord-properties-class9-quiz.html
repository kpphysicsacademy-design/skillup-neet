<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"In △ABC, D and E are the midpoints of AB and AC. The segment DE is called the: ","o":["Median","Mid-segment","Altitude","Angle bisector"],"a":1,"why":"The segment joining the midpoints of two sides of a triangle is its mid-segment."},{"d":"BASIC","q":"The midpoint theorem states that the segment joining the midpoints of two sides of a triangle is:","o":["Parallel to the third side and half its length","Perpendicular to the third side","Equal to the third side","Twice the third side"],"a":0,"why":"The midpoint segment is parallel to the third side and has half its length."},{"d":"BASIC","q":"If BC = 12 cm and D, E are the midpoints of AB and AC, then DE is:","o":["24 cm","12 cm","6 cm","3 cm"],"a":2,"why":"DE = ½ BC = 6 cm."},{"d":"BASIC","q":"If D is the midpoint of AB and AB = 14 cm, then AD equals:","o":["14 cm","7 cm","28 cm","3.5 cm"],"a":1,"why":"A midpoint divides a segment into two equal parts."},{"d":"BASIC","q":"If D and E are midpoints of AB and AC, then DE is parallel to:","o":["AB","AC","BC","None of these"],"a":2,"why":"The midpoint theorem gives DE ∥ BC."},{"d":"BASIC","q":"A line through the midpoint of one side of a triangle, parallel to another side, meets the third side at its:","o":["Vertex","Midpoint","Centroid","Orthocentre"],"a":1,"why":"This is the converse of the midpoint theorem."},{"d":"BASIC","q":"If DE ∥ BC in △ABC and D is the midpoint of AB, then E is the midpoint of:","o":["AB","AC","BC","DE"],"a":1,"why":"By the converse theorem, E bisects AC."},{"d":"BASIC","q":"If DE = 5 cm for the segment joining two side midpoints, BC is:","o":["2.5 cm","5 cm","10 cm","15 cm"],"a":2,"why":"The third side is twice the midpoint segment: BC = 2 × 5 = 10 cm."},{"d":"BASIC","q":"The midpoint theorem is applied to which shape?","o":["Circle","Triangle","Trapezium only","Pentagon"],"a":1,"why":"The theorem concerns the segment joining the midpoints of two sides of a triangle."},{"d":"BASIC","q":"If AD = DB, point D is the:","o":["Centroid","Midpoint of AB","Vertex","Foot of altitude"],"a":1,"why":"Equal parts AD and DB show that D is the midpoint of AB."},{"d":"MEDIUM","q":"In △PQR, X and Y are midpoints of PQ and PR. If QR = 18 cm, XY is:","o":["9 cm","18 cm","36 cm","6 cm"],"a":0,"why":"XY = ½ QR = 9 cm."},{"d":"MEDIUM","q":"In △ABC, D and E are midpoints of AB and AC. If DE = 7.5 cm, then BC is:","o":["7.5 cm","15 cm","22.5 cm","3.75 cm"],"a":1,"why":"BC = 2DE = 15 cm."},{"d":"MEDIUM","q":"In △ABC, D is the midpoint of AB. A line through D parallel to BC meets AC at E. If AC = 16 cm, AE is:","o":["4 cm","8 cm","16 cm","32 cm"],"a":1,"why":"By the converse midpoint theorem, E is the midpoint of AC; AE = 8 cm."},{"d":"MEDIUM","q":"D and E are midpoints of AB and AC. If AB = 20 cm and AC = 14 cm, then AD + AE is:","o":["10 cm","17 cm","34 cm","7 cm"],"a":1,"why":"AD = 10 cm and AE = 7 cm, so their sum is 17 cm."},{"d":"MEDIUM","q":"In △ABC, D and E are midpoints of AB and AC. If BC = 3x + 2 and DE = x + 1, find x.","o":["0","1","2","3"],"a":0,"why":"By the theorem, 3x + 2 = 2(x + 1), giving x = 0."},{"d":"MEDIUM","q":"In △ABC, D and E are midpoints of AB and AC. If ∠A = 50° and ∠B = 65°, the angle between DE and AC is:","o":["50°","65°","115°","75°"],"a":1,"why":"Since DE ∥ BC, the angle between DE and AC equals the corresponding angle between BC and AC, which is ∠C = 65°."},{"d":"MEDIUM","q":"In △ABC, D and E are midpoints of AB and AC. If BC = 2x + 6 and DE = 9, x equals:","o":["3","6","9","12"],"a":1,"why":"2DE = BC, so 18 = 2x + 6 and x = 6."},{"d":"MEDIUM","q":"If a line through the midpoint of AB is parallel to BC and meets AC at E, which statement is true?","o":["AE = AC","AE = EC","AB = AC","BE = EC"],"a":1,"why":"The converse midpoint theorem establishes that E is the midpoint of AC."},{"d":"MEDIUM","q":"In △XYZ, M and N are midpoints of XY and XZ. If MN = 4.2 cm, perimeter relation gives YZ as:","o":["2.1 cm","4.2 cm","8.4 cm","12.6 cm"],"a":2,"why":"MN = ½YZ, so YZ = 8.4 cm."},{"d":"MEDIUM","q":"In △ABC, D and E are midpoints of AB and AC. If DE ∥ BC and BC = 24 cm, the ratio DE:BC is:","o":["1:2","2:1","1:3","3:2"],"a":0,"why":"The midpoint segment is half the third side, so the ratio is 1:2."},{"d":"HARD","q":"In △ABC, D and E are midpoints of AB and AC. If DE = 2x + 1 and BC = 5x − 2, find x.","o":["2","3","4","5"],"a":2,"why":"2(2x + 1) = 5x − 2, so 4x + 2 = 5x − 2 and x = 4."},{"d":"HARD","q":"In △ABC, D and E are midpoints of AB and AC. If the perimeter of △ADE is 18 cm and DE = 6 cm, while AD = 5 cm, then AE is:","o":["5 cm","6 cm","7 cm","8 cm"],"a":2,"why":"Perimeter ADE = AD + AE + DE, so 18 = 5 + AE + 6 and AE = 7 cm."},{"d":"HARD","q":"In △ABC, D and E are midpoints of AB and AC. If AB = 3x + 2, AD = 10 cm, then x equals:","o":["4","5","6","8"],"a":2,"why":"AD = AB/2, so AB = 20; 3x + 2 = 20 gives x = 6."},{"d":"HARD","q":"In △ABC, D and E are midpoints of AB and AC. If ∠B = 40° and ∠C = 70°, what is the angle between DE and AC?","o":["40°","70°","110°","30°"],"a":1,"why":"DE ∥ BC, so the angle between DE and AC equals the angle between BC and AC, which is ∠C = 70°."},{"d":"HARD","q":"In △ABC, D and E are midpoints of AB and AC. If BC = 4x − 2 and DE = x + 4, find x.","o":["4","5","6","7"],"a":1,"why":"4x − 2 = 2(x + 4), so 2x = 10 and x = 5."},{"d":"HARD","q":"In △PQR, M is the midpoint of PQ. Through M, MN is drawn parallel to QR meeting PR at N. If PN = 6 cm, PR is:","o":["6 cm","9 cm","12 cm","18 cm"],"a":2,"why":"By the converse midpoint theorem, N is the midpoint of PR; PR = 2 × 6 = 12 cm."},{"d":"HARD","q":"In △ABC, D and E are midpoints of AB and AC. F is the midpoint of DE. If BC = 26 cm, DF is:","o":["6.5 cm","13 cm","26 cm","52 cm"],"a":0,"why":"DE = ½BC = 13 cm, and F bisects DE, so DF = 6.5 cm."},{"d":"HARD","q":"In △ABC, D and E are midpoints of AB and AC. If BC = 26 cm, then DE is:","o":["6.5 cm","13 cm","26 cm","52 cm"],"a":1,"why":"DE = ½BC = 13 cm."},{"d":"HARD","q":"In △ABC, D is midpoint of AB and E lies on AC. If DE ∥ BC and AE = 4x − 1, EC = 2x + 5, find x.","o":["2","3","4","5"],"a":1,"why":"The converse gives AE = EC; 4x − 1 = 2x + 5, so x = 3."},{"d":"HARD","q":"In △ABC, D and E are midpoints of AB and AC. If BC = 26 cm and DE is extended to F such that EF = DE, then DF is:","o":["6.5 cm","13 cm","26 cm","39 cm"],"a":2,"why":"DE = 13 cm and EF = 13 cm, so DF = 26 cm."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Midpoint Theorem Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
