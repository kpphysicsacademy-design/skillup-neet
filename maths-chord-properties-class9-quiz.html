<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"A perpendicular drawn from the centre of a circle to a chord:","o":["Bisects the chord","Is twice the chord","Is parallel to the chord","Touches the circle"],"a":0,"e":"The perpendicular from the centre to a chord divides that chord into two equal parts."},{"d":"BASIC","q":"The longest chord of a circle is its:","o":["Radius","Diameter","Minor arc","Tangent"],"a":1,"e":"The diameter passes through the centre and has the greatest possible chord length."},{"d":"BASIC","q":"Equal chords of the same circle are:","o":["At different distances from the centre","Equidistant from the centre","Always diameters","Always parallel"],"a":1,"e":"Equal chords in the same circle have equal perpendicular distances from the centre."},{"d":"BASIC","q":"A chord is 12 cm long. The perpendicular from the centre meets it at M. If A is an endpoint, AM is:","o":["3 cm","6 cm","12 cm","24 cm"],"a":1,"e":"The perpendicular from the centre bisects the chord, so AM = 12 ÷ 2 = 6 cm."},{"d":"BASIC","q":"A chord that passes through the centre is called a:","o":["Tangent","Diameter","Secant segment outside the circle","Minor arc"],"a":1,"e":"A diameter is a chord whose line passes through the centre."},{"d":"BASIC","q":"Which chord is longer in a given circle?","o":["A chord 3 cm from the centre","A chord 5 cm from the centre","Both must be equal","The farther chord"],"a":0,"e":"The chord nearer to the centre is longer."},{"d":"BASIC","q":"If two chords of the same circle are equal, their perpendicular distances from the centre are:","o":["Equal","In the ratio 1:2","Always zero","Unequal"],"a":0,"e":"Equal chords in the same circle are equidistant from the centre."},{"d":"BASIC","q":"The perpendicular from the centre O meets chord AB at M. Which angle is 90°?","o":["∠OMA","∠OAB","∠ABO","∠MAB"],"a":0,"e":"OM is perpendicular to AB, so the angle between OM and MA is 90°."},{"d":"BASIC","q":"A radius drawn to the midpoint of a chord is:","o":["Parallel to the chord","Perpendicular to the chord","Equal to the chord","A tangent"],"a":1,"e":"The line joining the centre to the midpoint of a chord is perpendicular to the chord."},{"d":"BASIC","q":"A chord is 8 cm long. If OM is perpendicular to it at its midpoint M, each half of the chord is:","o":["2 cm","4 cm","8 cm","16 cm"],"a":1,"e":"The perpendicular from the centre bisects the chord, giving two halves of 4 cm."},{"d":"MEDIUM","q":"A circle has radius 13 cm. A chord is 5 cm from the centre. Find its length.","o":["10 cm","12 cm","24 cm","26 cm"],"a":2,"e":"Half the chord is √(13² − 5²) = √144 = 12 cm, so the full chord is 24 cm."},{"d":"MEDIUM","q":"A circle has radius 10 cm. A chord is 6 cm from the centre. Its length is:","o":["8 cm","12 cm","16 cm","20 cm"],"a":2,"e":"Half the chord is √(10² − 6²) = 8 cm, so the chord is 16 cm long."},{"d":"MEDIUM","q":"A chord is 30 cm long in a circle of radius 17 cm. Its distance from the centre is:","o":["4 cm","8 cm","12 cm","15 cm"],"a":1,"e":"Half the chord is 15 cm. The distance is √(17² − 15²) = 8 cm."},{"d":"MEDIUM","q":"A chord is 24 cm long in a circle of radius 13 cm. Its perpendicular distance from the centre is:","o":["5 cm","7 cm","9 cm","12 cm"],"a":0,"e":"Half the chord is 12 cm. The distance is √(13² − 12²) = 5 cm."},{"d":"MEDIUM","q":"Two chords of the same circle are 4 cm and 7 cm from the centre. Which is longer?","o":["The chord 4 cm away","The chord 7 cm away","They are equal","Their lengths cannot be compared"],"a":0,"e":"The chord closer to the centre is longer, so the chord 4 cm away is longer."},{"d":"MEDIUM","q":"OM is perpendicular to chord AB at M. If AM = 7 cm, then AB is:","o":["7 cm","14 cm","21 cm","28 cm"],"a":1,"e":"M is the midpoint of AB, so AB = 2 × 7 = 14 cm."},{"d":"MEDIUM","q":"A circle has radius 25 cm and a chord 40 cm long. The distance from the centre to the chord is:","o":["5 cm","10 cm","15 cm","20 cm"],"a":2,"e":"Half the chord is 20 cm. The distance is √(25² − 20²) = 15 cm."},{"d":"MEDIUM","q":"A chord is 16 cm long. Can its distance from the centre be found without knowing the circle's radius?","o":["Yes, it is 8 cm","Yes, it is 16 cm","No, the radius is also needed","It must be zero"],"a":2,"e":"The chord length gives its half-length, but the perpendicular distance also depends on the radius."},{"d":"MEDIUM","q":"In the same circle, chord AB is 3 cm from the centre and chord CD is 5 cm away. Which statement is true?","o":["AB is longer than CD","CD is longer than AB","AB and CD are equal","Both are diameters"],"a":0,"e":"The chord nearer to the centre is longer; AB is nearer than CD."},{"d":"MEDIUM","q":"A chord is 14 cm long and 24 cm from the centre. The radius of the circle is:","o":["20 cm","24 cm","25 cm","26 cm"],"a":2,"e":"Half the chord is 7 cm. The radius is √(24² + 7²) = 25 cm."},{"d":"HARD","q":"A circle has radius 10 cm. Two parallel chords lie on opposite sides of the centre, at distances 6 cm and 8 cm. The distance between the chords is:","o":["2 cm","7 cm","14 cm","16 cm"],"a":2,"e":"Because the chords are on opposite sides of the centre, their separation is 6 + 8 = 14 cm."},{"d":"HARD","q":"A circle of radius 10 cm has a chord 12 cm long. The perpendicular distance from the centre to the chord is:","o":["4 cm","6 cm","8 cm","Cannot exist"],"a":2,"e":"Half the chord is 6 cm. The distance is √(10² − 6²) = 8 cm."},{"d":"HARD","q":"A chord is 5 cm from the centre of a circle of radius 13 cm. Its length is:","o":["10 cm","12 cm","24 cm","26 cm"],"a":2,"e":"Half the chord is √(13² − 5²) = 12 cm, so its full length is 24 cm."},{"d":"HARD","q":"Equal chords of a circle are at distances x + 2 cm and 3x − 6 cm from the centre. Find x.","o":["2","3","4","5"],"a":2,"e":"Equal chords are equidistant from the centre: x + 2 = 3x − 6, giving x = 4."},{"d":"HARD","q":"A circle has radius 17 cm. Two chords are 16 cm and 30 cm long. Their distances from the centre, respectively, are:","o":["15 cm and 8 cm","8 cm and 15 cm","9 cm and 7 cm","12 cm and 4 cm"],"a":0,"e":"For the 16 cm chord, distance = √(17² − 8²) = 15 cm. For the 30 cm chord, distance = √(17² − 15²) = 8 cm."},{"d":"HARD","q":"A chord of a circle of radius 10 cm is 8 cm from the centre. The chord is what fraction of the diameter?","o":["3/5","4/5","1/2","2/5"],"a":0,"e":"Half the chord is √(10² − 8²) = 6 cm, so the chord is 12 cm. The diameter is 20 cm; 12/20 = 3/5."},{"d":"HARD","q":"A circle has radius 13 cm. Chord AB is 5 cm from the centre and chord CD is 12 cm from the centre. Find AB − CD.","o":["10 cm","12 cm","14 cm","16 cm"],"a":2,"e":"AB = 2√(13² − 5²) = 24 cm and CD = 2√(13² − 12²) = 10 cm. Their difference is 14 cm."},{"d":"HARD","q":"Two chords of the same circle are 10 cm and 24 cm long. The longer chord is 5 cm from the centre. Find the radius.","o":["12 cm","13 cm","15 cm","17 cm"],"a":1,"e":"Half the longer chord is 12 cm. The radius is √(12² + 5²) = 13 cm."},{"d":"HARD","q":"A circle has radius 15 cm and a chord 18 cm long. Its perpendicular distance from the centre is:","o":["9 cm","12 cm","13 cm","14 cm"],"a":1,"e":"Half the chord is 9 cm. The distance is √(15² − 9²) = 12 cm."},{"d":"HARD","q":"A chord is 16 cm long and 6 cm from the centre. The radius of the circle is:","o":["8 cm","10 cm","12 cm","14 cm"],"a":1,"e":"Half the chord is 8 cm. The radius is √(8² + 6²) = 10 cm."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand chord properties</strong><small>Apply the perpendicular-to-chord theorem</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Compare equal and unequal chords</strong><small>Use distances from the centre</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve chord-length problems</strong><small>Apply radius and perpendicular-distance relationships</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
