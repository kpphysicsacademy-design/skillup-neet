<script>(function(){'use strict';const originalQuestions=[{"id":"b01","d":"BASIC","q":"What is the fixed point inside a circle called?","o":["Centre","Vertex","Endpoint","Corner"],"a":0,"e":"The centre is the fixed point from which all points on the circle are equally distant."},{"id":"b02","d":"BASIC","q":"A line segment from the centre of a circle to its boundary is a:","o":["Chord","Radius","Diameter","Tangent"],"a":1,"e":"A radius joins the centre to a point on the circle."},{"id":"b03","d":"BASIC","q":"A chord that passes through the centre is called the:","o":["Radius","Arc","Diameter","Sector"],"a":2,"e":"A diameter is a chord passing through the centre."},{"id":"b04","d":"BASIC","q":"How many radii make up the length of a diameter?","o":["One","Two","Three","Four"],"a":1,"e":"A diameter is twice the radius, so its length is two radii."},{"id":"b05","d":"BASIC","q":"Which part of a circle joins two points on its boundary with a straight segment?","o":["Chord","Radius","Centre","Arc"],"a":0,"e":"A chord is a straight line segment whose endpoints lie on the circle."},{"id":"b06","d":"BASIC","q":"Which chord is the longest in a circle?","o":["Any short chord","Radius","Diameter","All chords have equal length"],"a":2,"e":"The diameter passes through the centre and is the longest chord."},{"id":"b07","d":"BASIC","q":"What is the boundary of a circle called?","o":["Diagonal","Circumference","Side","Vertex"],"a":1,"e":"The circumference is the distance around the circle."},{"id":"b08","d":"BASIC","q":"If the radius is 4 cm, what is the diameter?","o":["2 cm","4 cm","8 cm","16 cm"],"a":2,"e":"Diameter = 2 × radius = 2 × 4 = 8 cm."},{"id":"b09","d":"BASIC","q":"If the diameter is 12 cm, what is the radius?","o":["3 cm","6 cm","12 cm","24 cm"],"a":1,"e":"Radius = diameter ÷ 2 = 12 ÷ 2 = 6 cm."},{"id":"b10","d":"BASIC","q":"Which object has a circular outline when viewed from above?","o":["Square tile","Round plate","Triangular sign","Rectangular book"],"a":1,"e":"A round plate has a circular outline when viewed from above."},{"id":"m11","d":"MEDIUM","q":"A circle has radius 7 cm. What is its diameter?","o":["3.5 cm","7 cm","14 cm","49 cm"],"a":2,"e":"The diameter is twice the radius: 2 × 7 = 14 cm."},{"id":"m12","d":"MEDIUM","q":"A circle's diameter is 18 cm. What is its radius?","o":["6 cm","9 cm","18 cm","36 cm"],"a":1,"e":"Half of 18 cm is 9 cm."},{"id":"m13","d":"MEDIUM","q":"Which statement about all radii of the same circle is true?","o":["They have different lengths","They have equal lengths","Each is longer than the diameter","They do not begin at the centre"],"a":1,"e":"Every radius of a given circle has the same length."},{"id":"m14","d":"MEDIUM","q":"A chord has endpoints P and Q on a circle. Where must P and Q lie?","o":["Both at the centre","Both on the circle","One outside the circle","Both inside but not on the boundary"],"a":1,"e":"The endpoints of a chord lie on the circle's boundary."},{"id":"m15","d":"MEDIUM","q":"If a chord passes through the centre, what special chord is it?","o":["Radius","Diameter","Arc","Semicircle"],"a":1,"e":"A diameter is specifically a chord through the centre."},{"id":"m16","d":"MEDIUM","q":"Two circles have radii 3 cm and 5 cm. What are their diameters?","o":["3 cm and 5 cm","6 cm and 10 cm","9 cm and 25 cm","5 cm and 3 cm"],"a":1,"e":"Double each radius: 6 cm and 10 cm."},{"id":"m17","d":"MEDIUM","q":"A circle has diameter 20 cm. A radius of the same circle measures:","o":["5 cm","10 cm","20 cm","40 cm"],"a":1,"e":"The radius is half the diameter: 20 ÷ 2 = 10 cm."},{"id":"m18","d":"MEDIUM","q":"Which segment is not necessarily a radius?","o":["Centre to boundary","Centre to a point on the circumference","A segment joining two boundary points away from the centre","Half of a diameter"],"a":2,"e":"A chord that does not pass through the centre is not a radius."},{"id":"m19","d":"MEDIUM","q":"If the radius increases from 4 cm to 6 cm, by how much does the diameter increase?","o":["1 cm" ment is a radius of 9 cm; diameter = 2 × 9 = 18 cm."},{"id":"h28","d":"HARD","q":"A circle has diameter 30 cm. A chord of length 30 cm must be:","o":["A radius","A diameter","A shorter chord away from the centre","An arc"],"a":1,"e":"A chord equal in length to the diameter is the diameter itself, the longest chord."},{"id":"h29","d":"HARD","q":"The radius of a circle is doubled. What happens to its diameter?","o":["It stays the same","It becomes half as large","It doubles","It becomes four times as large"],"a":2,"e":"Since diameter = 2 × radius, doubling the radius also doubles the diameter."},{"id":"h30","d":"HARD","q":"A circle has diameter 42 cm. What is the distance from its centre to its circumference?","o":["14 cm","21 cm","42 cm","84 cm"],"a":1,"e":"The centre-to-circumference distance is the radius: 42 ÷ 2 = 21 cm."}];let questions=originalQuestions.slice(),index=0,selected=-1,locked=false,xp=0,correct=0,streak=0,bestStreak=0,mistakes=[];const $=id=>document.getElementById(id);function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}function progress(){const p=Math.round(index/questions.length*100);$('fill').style.width=p+'%';$('percent').textContent=p+'%';$('progressText').textContent='Question '+Math.min(index+1,questions.length)+' of '+questions.length;document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',String(p))}function render(){const q=questions[index];selected=-1;locked=false;$('qmeta').textContent='QUESTION '+(index+1)+' · '+q.d;$('question').textContent=q.q;$('options').replaceChildren();q.o.forEach((v,i)=>{const b=el('button','option');b.type='button';b.append(el('span','letter',String.fromCharCode(65+i)),el('span','',v));b.addEventListener('click',()=>{if(locked)return;selected=i;$('options').querySelectorAll('.option').forEach((x,j)=>x.classList.toggle('selected',j===i));$('check').disabled=false});$('options').append(b)});$('feedback').className='feed es.length+')':'Perfect round!'));mistakes.forEach((m,i)=>{const item=el('div','review-item');item.append(el('b','',(i+1)+'. '+m.question),el('p','your-answer','Your answer: '+m.chosen),el('p','correct-answer','Correct answer: '+m.answer),el('p','',m.explanation));review.append(item)});card.append(review);const actions=el('div','review-actions'),wrong=el('button','btn secondary','Retry mistakes'),all=el('button','btn primary','Retry all');wrong.type=all.type='button';wrong.disabled=!mistakes.length;wrong.addEventListener('click',()=>restart(true));all.addEventListener('click',()=>restart(false));actions.append(wrong,all);card.append(actions);$('finishSlot').replaceChildren(card)}$('check').addEventListener('click',check);$('continue').addEventListener('click',()=>{index++;if(index<questions.length)render();else finish()});render()})();</script>
