</style></head><body><header><div class="nav"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="pill">⭐ <span id="xp">0</span> XP</div><div class="pill">🔥 <span id="streak">0</span> streak</div></div></header><main><section class="hero"><h1>⭕ Circle Basics</h1><p class="muted">Geometry basics · Centre · Radius · Diameter · Chord · Circumference</p><div class="simulator-link"><a href="maths-circle-basics-simulator.html?v=20261111-circle-basics-simulator-v1">🧪 Simulate Circle Basics</a></div><div class="progress-row"><span id="counter">Question 1 of 30</span><span id="percent">0%</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div></section><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Circle basics</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><script>(()=>{'use strict';const questions=[{"d":"BASIC","q":"What is the fixed point inside a circle called?","o":["Centre","Vertex","Endpoint","Corner"],"a":0,"e":"The centre is the fixed point from which all points on the circle are equally distant."},{"d":"BASIC","q":"A line segment from the centre of a circle to its boundary is a…","o":["Chord","Radius","Diameter","Tangent"],"a":1,"e":"A radius joins the centre to a point on the circle."},{"d":"BASIC","q":"A chord that passes through the centre is called the…","o":["Radius","Arc","Diameter","Sector"],"a":2,"e":"A diameter is a chord passing through the centre."},{"d":"BASIC","q":"How many radii make up the length of a diameter?","o":["One","Two","Three","Four"],"a":1,"e":"A diameter is twice the radius, so it contains two radii in length."},{"d":"BASIC","q":"Which part of a circle joins two points on its boundary with a straight segment?","o":["Chord","Radius","Centre","Arc"],"a":0,"e":"A chord is a straight line segment whose endpoints lie on the circle."},{"d":"BASIC","q":"Which chord is the longest in a circle?","o":["Any short chord","Radius","Diameter","All chords have equal length"],"a":2,"e":"The diameter passes through the centre and is the longest chord."},{"d":"BASIC","q":"What is the boundary of a circle called in elementary geometry?","o":["Perimeter line","Circumference","Diagonal","Side"],"a":1,"e":"The circumference is the distance around the circle."},{"d":"BASIC","q":"If the radius is 4 cm, what is the diameter?","o":["2 cm","4 cm","8 cm","16 cm"],"a":2,"e":"Diameter = 2 × radius = 2 × 4 = 8 cm."},{"d":"BASIC","q":"If the diameter is 12 cm, what is the radius?","o":["3 cm","6 cm","12 cm","24 cm"],"a":1,"e":"Radius = diameter ÷ 2 = 12 ÷ 2 = 6 cm."},{"d":"BASIC","q":"Which object is closest to the shape of a circle when viewed from above?","o":["A square tile","A round plate","A triangular sign","A rectangular book"],"a":1,"e":"A round plate has a circular outline when viewed from above."},{"d":"MEDIUM","q":"A circle has radius 7 cm. What is its diameter?","o":["3.5 cm","7 cm","14 cm","49 cm"],"a":2,"e":"The diameter is twice the radius: 2 × 7 = 14 cm."},{"d":"MEDIUM","q":"A circle's diameter is 18 cm. What is its radius?","o":["6 cm","9 cm","18 cm","36 cm"],"a":1,"e":"Half of 18 cm is 9 cm."},{"d":"MEDIUM","q":"Which statement about all radii of the same circle is true?","o":["They have different lengths","They have equal lengths","Each is longer than the diameter","They do not begin at the centre"],"a":1,"e":"Every radius of a given circle has the same length."},{"d":"MEDIUM","q":"A chord has endpoints P and Q on a circle. Where must P and Q lie?","o":["Both at the centre","Both on the circle","One outside the circle","Both inside but not on the boundary"],"a":1,"e":"The endpoints of a chord lie on the circle's boundary."},{"d":"MEDIUM","q":"If a chord passes through the centre, what special chord is it?","o":["Radius","Diameter","Arc","Semicircle"],"a":1,"e":"A diameter is specifically a chord through the centre."},{"d":"MEDIUM","q":"Two circles have radii 3 cm and 5 cm. What are their diameters?","o":["3 cm and 5 cm","6 cm and 10 cm","9 cm and 25 cm","5 cm and 3 cm"],"a":1,"e":"Double each radius: 6 cm and 10 cm."},{"d":"MEDIUM","q":"A circle has diameter 20 cm. A radius of the same circle measures…","o":["5 cm","10 cm","20 cm","40 cm"],"a":1,"e":"The radius is half the diameter: 20 ÷ 2 = 10 cm."},{"d":"MEDIUM","q":"Which segment is not necessarily a radius?","o":["Centre to boundary","Centre to a point on the circumference","A segment from one boundary point to another not through the centre","Half of a diameter"],"a":2,"e":"A chord that does not pass through the centre is not a radius."},{"d":"MEDIUM","q":"If the radius increases from 4 cm to 6 cm, by how much does the diameter increase?","o":["1 cm","2 cm","4 cm","6 cm"],"a":2,"e":"The diameter changes from 8 cm to 12 cm, an increase of 4 cm."},{"d":"MEDIUM","q":"A diameter divides a circle into two equal parts called…","o":["Triangles","Semicircles","Chords","Radii"],"a":1,"e":"A diameter splits the circular region into two semicircles."},{"d":"HARD","q":"A circle has diameter 26 cm. What is the length of a radius plus the diameter?","o":["13 cm","26 cm","39 cm","52 cm"],"a":2,"e":"The radius is 13 cm, so 13 + 26 = 39 cm."},{"d":"HARD","q":"The radius of circle A is 2 cm more than the radius of circle B. If B's radius is 5 cm, what is A's diameter?","o":["7 cm","10 cm","12 cm","14 cm"],"a":3,"e":"A's radius is 5 + 2 = 7 cm, so its diameter is 14 cm."},{"d":"HARD","q":"A circular hoop has diameter 84 cm. What is the distance from its centre to its boundary?","o":["21 cm","42 cm","84 cm","168 cm"],"a":1,"e":"The centre-to-boundary distance is the radius: 84 ÷ 2 = 42 cm."},{"d":"HARD","q":"A chord is 10 cm long and does not pass through the centre. Which conclusion is certain?","o":["It is the diameter","It is a radius","Its endpoints lie on the circle","It must be the longest chord"],"a":2,"e":"Every chord has both endpoints on the circle, whether or not it passes through the centre."},{"d":"HARD","q":"Circle X has radius 8 cm and circle Y has diameter 14 cm. Which has the larger diameter, and by how much?","o":["X, by 2 cm","Y, by 2 cm","X, by 1 cm","They are equal"],"a":0,"e":"X's diameter is 16 cm; Y's is 14 cm, so X is larger by 2 cm."},{"d":"HARD","q":"A circle's diameter is 3 times the radius of another circle. If the second circle's radius is 4 cm, what is the first circle's diameter?","o":["4 cm","8 cm","12 cm","24 cm"],"a":2,"e":"The first diameter is 3 × 4 = 12 cm."},{"d":"HARD","q":"A circle has radius r. Which expression gives its diameter?","o":["r + 1","r ÷ 2","2r","r²"],"a":2,"e":"The diameter is twice the radius, so it is 2r."},{"d":"HARD","q":"A line segment from the centre ends at a point 9 cm from the centre on the circle. What is the circle's diameter?","o":["4.5 cm","9 cm","18 cm","81 cm"],"a":2,"e":"The given segment is a radius of 9 cm; diameter = 2 × 9 = 18 cm."},{"d":"HARD","q":"A circle has diameter 30 cm. A chord of length 30 cm must be…","o":["A radius","A diameter","A shorter chord away from the centre","An arc"],"a":1,"e":"A chord equal in length to the diameter is the diameter itself, the longest chord."},{"d":"HARD","q":"The radius of a circle is doubled. What happens to its diameter?","o":["It stays the same","It becomes half as large","It doubles","It becomes four times as large"],"a":2,"e":"Since diameter = 2 × radius, doubling the radius also doubles the diameter."}];let index=0,selected=-1,locked=false,finished=false,xp=0,streak=0,bestStreak=0,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function diagram(kind){const labels={center:'Centre O',radius:'Radius',radius4:'Radius = 4 cm',diameter:'Diameter',diameter12:'Diameter = 12 cm',chord:'Chord AB',halves:'Two radii'};const extra=kind==='chord'?'<path d="M91 85 L249 85" stroke="#e0a000" stroke-width="4"/><text x="82" y="77">A</text><text x="253" y="77">B</text>':kind==='radius'||kind==='radius4'?'<path d="M170 115 L170 28" stroke="#48b516" stroke-width="4"/><text x="178" y="30">r</text>':kind==='diameter'||kind==='diameter12'?'<path d="M70 115 H270" stroke="#248ac0" stroke-width="4"/><text x="155" y="105">d</text>':kind==='halves'?'<path d="M170 115 L170 28 M170 115 L270 115" stroke="#48b516" stroke-width="3"/>':'<circle cx="170" cy="115" r="4" fill="#e0a000"/><text x="180" y="108">O</text>';return '<div class="diagram"><svg viewBox="0 0 340 230" role="img" aria-label="Circle diagram showing '+labels[kind]+'"><circle cx="170" cy="115" r="87" fill="#f5faff" stroke="#248ac0" stroke-width="3"/>'+extra+'<circle cx="170" cy="115" r="4" fill="#263746"/><text x="180" y="133" fill="#263746">O</text></svg><div class="small">'+labels[kind]+'</div></div>'}function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';$('percent').textContent=Math.round(p)+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)))}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='Question '+(index+1)+' of '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML=(q.v?diagram(q.v):'')+'<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-letter="'+String.fromCharCode(65+i)+'" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress()}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;streak++;bestStreak=Math.max(bestStreak,streak);xp+=10;$('xp').textContent=xp;$('streak').textContent=streak}else{streak=0;$('streak').textContent=0}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong')});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return}if(index<questions.length-1){index++;render();return}results()}function results(){finished=true;$('bar').style.width='100%';$('percent').textContent='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">⭕</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>🔥 Best streak: '+bestStreak+'</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+[['Identify centre, radius, diameter and chord',8],['Read labelled circle diagrams',18],['Calculate radius and diameter',24]].map(x=>'<div class="skill-item '+(correct>=x[1]?'unlocked':'')+'">'+(correct>=x[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+x[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;streak=0;bestStreak=0;correct=0;$('xp').textContent=0;$('streak').textContent=0;render()}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return}act()});render()})();</script><script src="/shared-nav.js?v=20261017-duolingo-standard-v1"></script></body></html>
