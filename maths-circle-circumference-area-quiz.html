<script>
(function(){
'use strict';
const questions=[{"q":"The distance around a circle is called its:","o":["Radius","Diameter","Circumference","Area"],"a":2,"why":"Circumference is the perimeter or boundary length of a circle."},{"q":"The distance from the centre of a circle to its boundary is the:","o":["Radius","Diameter","Chord","Circumference"],"a":0,"why":"A radius joins the centre to a point on the circle."},{"q":"The diameter of a circle is equal to:","o":["Half the radius","Twice the radius","Three times the radius","The circumference"],"a":1,"why":"Diameter d=2r."},{"q":"The formula for the circumference of a circle is:","o":["πr²","2πr","πd²","r²"],"a":1,"why":"Circumference C=2πr or equivalently πd."},{"q":"The area of a circle is:","o":["2πr","πr²","πd","2r²"],"a":1,"why":"Area A=πr²."},{"q":"If the radius is 7 cm, the diameter is:","o":["3.5 cm","7 cm","14 cm","49 cm"],"a":2,"why":"Diameter=2×7=14 cm."},{"q":"Using π=22/7, the circumference of a circle with radius 7 cm is:","o":["22 cm","44 cm","154 cm","308 cm"],"a":1,"why":"C=2×22/7×7=44 cm."},{"q":"Using π=22/7, the area of a circle with radius 7 cm is:","o":["44 cm²","77 cm²","154 cm²","308 cm²"],"a":2,"why":"A=22/7×7²=154 cm²."},{"q":"Which unit is appropriate for the area of a circular garden?","o":["Metres","Square metres","Cubic metres","Degrees"],"a":1,"why":"Area is measured in square units, such as m²."},{"q":"If a circle's radius doubles, its diameter:","o":["Halves","Doubles","Triples","Becomes four times"],"a":1,"why":"Since d=2r, doubling r doubles d."},{"q":"A circle has diameter 14 cm. Using π=22/7, its circumference is:","o":["22 cm","44 cm","154 cm","308 cm"],"a":1,"why":"C=πd=22/7×14=44 cm."},{"q":"A circle has radius 10 cm. Its area is:","o":["20π cm²","50π cm²","100π cm²","200π cm²"],"a":2,"why":"A=π×10²=100π cm²."},{"q":"A circle's circumference is 31.4 cm. Using π=3.14, its diameter is:","o":["5 cm","10 cm","15.7 cm","31.4 cm"],"a":1,"why":"d=C/π=31.4/3.14=10 cm."},{"q":"Using π=22/7, find the area of a circle with diameter 14 m.","o":["44 m²","77 m²","154 m²","616 m²"],"a":2,"why":"Radius=7 m, so area=22/7×49=154 m²."},{"q":"A circular track has radius 14 m. Using π=22/7, one lap is:","o":["44 m","88 m","176 m","616 m"],"a":1,"why":"One lap=C=2×22/7×14=88 m."},{"q":"If a circle's radius triples, its area becomes:","o":["3 times","6 times","9 times","12 times"],"a":2,"why":"Area depends on r², so tripling r multiplies area by 3²=9."},{"q":"A circle has area 616 cm². Using π=22/7, its radius is:","o":["7 cm","14 cm","21 cm","28 cm"],"a":1,"why":"r²=616×7/22=196, so r=14 cm."},{"q":"A semicircle has radius 7 cm. Its curved arc length, using π=22/7, is:","o":["11 cm","22 cm","44 cm","154 cm"],"a":1,"why":"The curved arc is half the full circumference: πr=22 cm."},{"q":"A circular plate has radius 3 cm. Its area is:","o":["6π cm²","9π cm²","12π cm²","18π cm²"],"a":1,"why":"Area=πr²=9π cm²."},{"q":"A wheel of diameter 70 cm rolls one full revolution. Using π=22/7, it travels:","o":["110 cm","220 cm","440 cm","1,540 cm"],"a":1,"why":"Distance per revolution equals circumference=22/7×70=220 cm."},{"q":"A circular field has radius 21 m. Using π=22/7, its area is:","o":["132 m²","462 m²","1,386 m²","2,772 m²"],"a":2,"why":"Area=22/7×21²=1,386 m²."},{"q":"The circumference of a circle is 88 cm. Using π=22/7, its radius is:","o":["7 cm","14 cm","21 cm","28 cm"],"a":1,"why":"2πr=88 gives r=88÷(44/7)=14 cm."},{"q":"A circle's radius increases from 4 cm to 8 cm. How does its area change?","o":["Doubles","Triples","Becomes four times","Becomes eight times"],"a":2,"why":"Area ratio=8²/4²=64/16=4."},{"q":"A circular garden has radius 7 m. A path one metre wide is added outside it. Using π=22/7, what is the area of the path?","o":["22 m²","44 m²","330/7 m²","176 m²"],"a":2,"why":"Outer radius=8 m. Path area=π(8²−7²)=15π=330/7 m²."},{"q":"A circle's area is 154 cm². Using π=22/7, its circumference is:","o":["22 cm","44 cm","77 cm","154 cm"],"a":1,"why":"Area 154 gives r=7 cm, so circumference=44 cm."},{"q":"A circular lawn has diameter 28 m. Using π=22/7, how far is one round of its boundary?","o":["44 m","88 m","176 m","616 m"],"a":1,"why":"Circumference=πd=22/7×28=88 m."},{"q":"A circle has circumference 132 cm. Using π=22/7, its diameter is:","o":["21 cm","42 cm","66 cm","84 cm"],"a":1,"why":"d=C/π=132×7/22=42 cm."},{"q":"A circular table has radius 0.7 m. Using π = 22/7, what is its area?","o":["0.44 m²","1.54 m²","3.08 m²","4.4 m²"],"a":1,"why":"Area = πr² = (22/7) × 0.7 × 0.7 = 1.54 m²."},{"q":"A quarter-circle has radius 14 cm. Using π = 22/7, what is its area?","o":["44 cm²","77 cm²","154 cm²","308 cm²"],"a":2,"why":"Quarter-circle area = ¼ × π × 14² = ¼ × 616 = 154 cm²."},{"q":"The circumference of circle A is twice the circumference of circle B. The radius of A is:","o":["Half of B's radius","Equal to B's radius","Twice B's radius","Four times B's radius"],"a":2,"why":"Circumference is directly proportional to radius, so the radius also doubles."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function clearChildren(node){while(node.firstChild)node.removeChild(node.firstChild);}
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 clearChildren($('options'));
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Circle Circumference and Area Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261104-physics-path-layout-v2" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.appendChild(q);item.appendChild(yours);item.appendChild(correct);item.appendChild(why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 clearChildren($('finishSlot'));$('finishSlot').appendChild(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';clearChildren($('finishSlot'));render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
