(function(){'use strict';const questions=[{"d":"BASIC","q":"The distance around a circle is called its:","o":["Radius","Diameter","Circumference","Area"],"a":2,"e":"Circumference is the perimeter or boundary length of a circle."},{"d":"BASIC","q":"The distance from the centre of a circle to its boundary is the:","o":["Radius","Diameter","Chord","Circumference"],"a":0,"e":"A radius joins the centre to a point on the circle."},{"d":"BASIC","q":"The diameter of a circle is equal to:","o":["Half the radius","Twice the radius","Three times the radius","The circumference"],"a":1,"e":"Diameter d=2r."},{"d":"BASIC","q":"The formula for the circumference of a circle is:","o":["πr²","2πr","πd²","r²"],"a":1,"e":"Circumference C=2πr or equivalently πd."},{"d":"BASIC","q":"The area of a circle is:","o":["2πr","πr²","πd","2r²"],"a":1,"e":"Area A=πr²."},{"d":"BASIC","q":"If the radius is 7 cm, the diameter is:","o":["3.5 cm","7 cm","14 cm","49 cm"],"a":2,"e":"Diameter=2×7=14 cm."},{"d":"BASIC","q":"Using π=22/7, the circumference of a circle with radius 7 cm is:","o":["22 cm","44 cm","154 cm","308 cm"],"a":1,"e":"C=2×22/7×7=44 cm."},{"d":"BASIC","q":"Using π=22/7, the area of a circle with radius 7 cm is:","o":["44 cm²","77 cm²","154 cm²","308 cm²"],"a":2,"e":"A=22/7×7²=154 cm²."},{"d":"BASIC","q":"Which unit is appropriate for the area of a circular garden?","o":["Metres","Square metres","Cubic metres","Degrees"],"a":1,"e":"Area is measured in square units, such as m²."},{"d":"BASIC","q":"If a circle's radius doubles, its diameter:","o":["Halves","Doubles","Triples","Becomes four times"],"a":1,"e":"Since d=2r, doubling r doubles d."},{"d":"MEDIUM","q":"A circle has diameter 14 cm. Using π=22/7, its circumference is:","o":["22 cm","44 cm","154 cm","308 cm"],"a":1,"e":"C=πd=22/7×14=44 cm."},{"d":"MEDIUM","q":"A circle has radius 10 cm. Its area is:","o":["20π cm²","50π cm²","100π cm²","200π cm²"],"a":2,"e":"A=π×10²=100π cm²."},{"d":"MEDIUM","q":"A circle's circumference is 31.4 cm. Using π=3.14, its diameter is:","o":["5 cm","10 cm","15.7 cm","31.4 cm"],"a":1,"e":"d=C/π=31.4/3.14=10 cm."},{"d":"MEDIUM","q":"Using π=22/7, find the area of a circle with diameter 14 m.","o":["44 m²","77 m²","154 m²","616 m²"],"a":2,"e":"Radius=7 m, so area=22/7×49=154 m²."},{"d":"MEDIUM","q":"A circular track has radius 14 m. Using π=22/7, one lap is:","o":["44 m","88 m","176 m","616 m"],"a":1,"e":"One lap=C=2×22/7×14=88 m."},{"d":"MEDIUM","q":"If a circle's radius triples, its area becomes:","o":["3 times","6 times","9 times","12 times"],"a":2,"e":"Area depends on r², so tripling r multiplies area by 3²=9."},{"d":"MEDIUM","q":"A circle has area 616 cm². Using π=22/7, its radius is:","o":["7 cm","14 cm","21 cm","28 cm"],"a":1,"e":"r²=616×7/22=196, so r=14 cm."},{"d":"MEDIUM","q":"A semicircle has radius 7 cm. Its curved arc length, using π=22/7, is:","o":["11 cm","22 cm","44 cm","154 cm"],"a":1,"e":"The curved arc is half the full circumference: πr=22 cm."},{"d":"MEDIUM","q":"A circular plate has radius 3 cm. Its area is:","o":["6π cm²","9π cm²","12π cm²","18π cm²"],"a":1,"e":"Area=πr²=9π cm²."},{"d":"MEDIUM","q":"A wheel of diameter 70 cm rolls one full revolution. Using π=22/7, it travels:","o":["110 cm","220 cm","440 cm","1,540 cm"],"a":1,"e":"Distance per revolution equals circumference=22/7×70=220 cm."},{"d":"HARD","q":"A circular field has radius 21 m. Using π=22/7, its area is:","o":["132 m²","462 m²","1,386 m²","2,772 m²"],"a":2,"e":"Area=22/7×21²=1,386 m²."},{"d":"HARD","q":"The circumference of a circle is 88 cm. Using π=22/7, its radius is:","o":["7 cm","14 cm","21 cm","28 cm"],"a":1,"e":"2πr=88 gives r=88÷(44/7)=14 cm."},{"d":"HARD","q":"A circle's radius increases from 4 cm to 8 cm. How does its area change?","o":["Doubles","Triples","Becomes four times","Becomes eight times"],"a":2,"e":"Area ratio=8²/4²=64/16=4."},{"d":"HARD","q":"A circular garden has radius 7 m. A path one metre wide is added outside it. Using π=22/7, what is the area of the path?","o":["22 m²","44 m²","330/7 m²","176 m²"],"a":2,"e":"Outer radius=8 m. Path area=π(8²−7²)=15π=330/7 m²."},{"d":"HARD","q":"A circle's area is 154 cm². Using π=22/7, its circumference is:","o":["22 cm","44 cm","77 cm","154 cm"],"a":1,"e":"Area 154 gives r=7 cm, so circumference=44 cm."},{"d":"HARD","q":"A circular lawn has diameter 28 m. Using π=22/7, how far is one round of its boundary?","o":["44 m","88 m","176 m","616 m"],"a":1,"e":"Circumference=πd=22/7×28=88 m."},{"d":"HARD","q":"A circle has circumference 132 cm. Using π=22/7, its diameter is:","o":["21 cm","42 cm","66 cm","84 cm"],"a":1,"e":"d=C/π=132×7/22=42 cm."},{"d":"HARD","q":"A circular table has radius 0.7 m. Using π=22/7, its area is:","o":["0.44 m²","1.54 m²","3.08 m²","4.4 m²"],"a":0,"e":"Area=22/7×0.7²=1.54 m². Correct option is 1.54 m²."},{"d":"HARD","q":"A circular table has radius 0.7 m. Using π=22/7, its area is:","o":["0.44 m²","1.54 m²","3.08 m²","4.4 m²"],"a":1,"e":"Area=22/7×0.7²=1.54 m²."},{"d":"HARD","q":"The circumference of circle A is twice the circumference of circle B. The radius of A is:","o":["Half of B's radius","Equal to B's radius","Twice B's radius","Four times B's radius"],"a":2,"e":"Circumference is directly proportional to radius, so the radius also doubles."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Master circle formulas</strong><small>Calculate circumference and area</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Work with radius and diameter</strong><small>Solve circle word problems</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Find missing radii and diameters</strong><small>Apply circle formula relationships</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
