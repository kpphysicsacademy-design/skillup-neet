<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:spa </style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Algebraic Expressions</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button" disabled>Check answer</button></div></section></main><section class="skill-panel"><div class="skill-title">🎯 Skills you will practise</div><div class="skill-list"><div class="skill-item">Combine like terms</div><div class="skill-item">Add and subtract expressions using brackets</div><div class="skill-item">Apply signs and simplify expressions</div></div></section></div>
<script>(function(){'use strict';const questions=[
{d:"BASIC",q:"Simplify: 3x + 2x",o:["5","5x","6x","x"],a:1,e:"Both terms are like terms. Add the coefficients: 3x + 2x = 5x."},
{d:"BASIC",q:"Simplify: 7a − 4a",o:["3","3a","11a","−3a"],a:1,e:"Subtract the coefficients: (7 − 4)a = 3a."},
{d:"BASIC",q:"Simplify: 2x + 3 + 4x",o:["6x + 3","9x","6x + 7","2x + 7"],a:0,e:"Combine 2x and 4x. The constant 3 stays separate: 6x + 3."},
{d:"BASIC",q:"Simplify: (5p + 2) + (3p + 4)",o:["8p + 6","2p + 2","8p + 8","15p + 6"],a:0,e:"Add like terms: 5p + 3p = 8p and 2 + 4 = 6."},
{d:"BASIC",q:"Simplify: (6y + 9) − (2y + 3)",o:["4y + 12","4y + 6","8y + 6","4y − 6"],a:1,e:"Remove the second bracket: 6y + 9 − 2y − 3 = 4y + 6."},
{d:"BASIC",q:"Which pair contains like terms?",o:["4x and 4y","3a and 8a","2m and 2m²","5 and 5b"],a:1,e:"3a and 8a have the same variable raised to the same power."},
{d:"BASIC",q:"Simplify: 9m + 2m − m",o:["10m","12m","8m","10m²"],a:0,e:"9m + 2m − 1m = 10m."},
{d:"BASIC",q:"Simplify: (x + 5) + (2x + 1)",o:["3x + 6","3x + 4","2x + 6","x + 6"],a:0,e:"Combine x + 2x = 3x and 5 + 1 = 6."},
{d:"BASIC",q:"Simplify: 8b − (3b + 2)",o:["5b + 2","5b − 2","11b + 2","5b"],a:1,e:"Subtract each term in the bracket: 8b − 3b − 2 = 5b − 2."},
{d:"BASIC",q:"Add x + 2 and 3x + 7.",o:["4x + 9","3x + 9","4x + 5","2x + 9"],a:0,e:"(x + 2) + (3x + 7) = 4x + 9."},
{d:"MEDIUM",q:"Simplify: (4x + 7) + (3x − 5)",o:["7x + 2","x + 12","7x + 12","x + 2"],a:0,e:"Combine 4x + 3x = 7x and 7 − 5 = 2."},
{d:"MEDIUM",q:"Simplify: (9a − 4) − (2a + 6)",o:["7a + 2","7a − 10","11a − 10","7a + 10"],a:1,e:"9a − 4 − 2a − 6 = 7a − 10."},
{d:"MEDIUM",q:"Subtract 3x − 2 from 8x + 5.",o:["5x + 3","5x + 7","11x + 3","5x − 7"],a:1,e:"(8x + 5) − (3x − 2) = 8x + 5 − 3x + 2 = 5x + 7."},
{d:"MEDIUM",q:"Simplify: 2(3x + 4) + x",o:["7x + 8","6x + 8","7x + 4","6x + 5"],a:0,e:"Distribute 2: 6x + 8 + x = 7x + 8."},
{d:"MEDIUM",q:"Simplify: 5(2a − 1) − 3a",o:["7a − 5","10a − 5","13a − 1","7a + 5"],a:0,e:"10a − 5 − 3a = 7a − 5."},
{d:"MEDIUM",q:"Simplify: (2x + 3y) + (5x − y)",o:["7x + 2y","7x + 4y","3x + 2y","7xy + 2"],a:0,e:"Combine x terms and y terms separately: 2x + 5x = 7x; 3y − y = 2y."},
{d:"MEDIUM",q:"Simplify: (7p + 2q) − (3p + 5q)",o:["4p − 3q","4p + 7q","10p − 3q","4p + 3q"],a:0,e:"7p + 2q − 3p − 5q = 4p − 3q."},
{d:"MEDIUM",q:"If A = 3x + 2 and B = x − 5, find A + B.",o:["4x − 3","2x + 7","4x + 7","3x − 3"],a:0,e:"A + B = 3x + 2 + x − 5 = 4x − 3."},
{d:"MEDIUM",q:"If P = 6m − 4 and Q = 2m + 7, find P − Q.",o:["4m + 3","4m − 11","8m + 3","8m − 11"],a:1,e:"P − Q = 6m − 4 − (2m + 7) = 4m − 11."},
{d:"MEDIUM",q:"Simplify: 4(x + 2) − 2(x − 3)",o:["2x + 14","2x + 2","6x + 2","2x − 14"],a:0,e:"4x + 8 − 2x + 6 = 2x + 14."},
{d:"HARD",q:"Simplify: 3(2x − 5) + 2(x + 4)",o:["8x − 7","8x − 23","4x − 7","8x + 7"],a:0,e:"6x − 15 + 2x + 8 = 8x − 7."},
{d:"HARD",q:"Simplify: 5a − 2(3a − 4) + 7",o:["−a + 15","−a − 1","11a + 15","−a + 1"],a:0,e:"5a − 6a + 8 + 7 = −a + 15."},
{d:"HARD",q:"Simplify: (4x² + 3x − 2) + (x² − 5x + 6)",o:["5x² − 2x + 4","5x² + 8x + 4","3x² − 2x + 8","5x² − 2x − 8"],a:0,e:"Combine like powers: 4x² + x² = 5x²; 3x − 5x = −2x; −2 + 6 = 4."},
{d:"HARD",q:"Simplify: (6y² − 2y + 1) − (2y² + 5y − 4)",o:["4y² − 7y + 5","4y² + 3y − 3","8y² − 7y − 3","4y² − 3y + 5"],a:0,e:"6y² − 2y + 1 − 2y² − 5y + 4 = 4y² − 7y + 5."},
{d:"HARD",q:"Find the sum of 2x − 3y + 4 and −5x + y − 6.",o:["−3x − 2y − 2","7x − 4y + 10","−3x − 4y + 2","3x − 2y − 2"],a:0,e:"Combine terms: 2x − 5x = −3x; −3y + y = −2y; 4 − 6 = −2."},
{d:"HARD",q:"Subtract (2a² − 3a + 5) from (7a² + a − 1).",o:["5a² + 4a − 6","9a² − 2a + 4","5a² − 4a + 6","5a² + 4a + 4"],a:0,e:"7a² + a − 1 − (2a² − 3a + 5) = 5a² + 4a − 6."},
{d:"HARD",q:"Simplify: 2(3x + 2) − 3(x − 4) + x",o:["4x + 16","10x − 8","4x − 8","7x + 16"],a:0,e:"6x + 4 − 3x + 12 + x = 4x + 16."},
{d:"HARD",q:"A rectangle has length (3x + 2) cm and width (x − 1) cm. Write its perimeter.",o:["8x + 2 cm","4x + 1 cm","8x + 4 cm","6x + 1 cm"],a:0,e:"Perimeter = 2(length + width) = 2[(3x + 2) + (x − 1)] = 8x + 2 cm."},
{d:"HARD",q:"Simplify: (3p² + 4p − 8) + (−p² − 6p + 2) − (p² − p − 3)",o:["p² − p − 3","p² − 3p − 9","3p² − 3p − 3","p² + p − 3"],a:0,e:"First sum is 2p² − 2p − 6. Subtract the last bracket: 2p² − 2p − 6 − p² + p + 3 = p² − p − 3."},
{d:"HARD",q:"If E = 4x − 3 and F = 2 − 7x, find 2E − F.",o:["15x − 8","x − 4","x + 8","15x − 4"],a:0,e:"2E − F = 2(4x − 3) − (2 − 7x) = 8x − 6 − 2 + 7x = 15x − 8."}
];let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0,finished=false;const $=id=>document.getElementById(id);function progress(){let p=index/questions.length*100;$('bar').style.width=p+'%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · ALGEBRAIC EXPRESSIONS';$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;progress();}function results(){finished=true;$('bar').style.width='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='Retry to improve your score';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3rem">🧮</div><h1>'+(correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><p>Remember to remove brackets carefully and combine only like terms.</p></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Explanation: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();</script><script src="/skillup-eye-shield.js?v=20261013-eye-shield-v1"></script><script src="/shared-nav.js?v=20261013-no-bottom-nav-v1"></script></body></html>
