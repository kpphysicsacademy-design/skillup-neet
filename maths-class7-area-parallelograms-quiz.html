<section class="skill-panel"><div class="skill-title">🎯 Skills you will practise</div><div class="skill-list"><div class="skill-item">Use area = base × perpendicular height</div><div class="skill-item">Find missing base or height</div><div class="skill-item">Solve real-life area problems with units</div></div></section></div>
<script>(function(){'use strict';const questions=[
{d:"BASIC",q:"What is the formula for the area of a parallelogram?",o:["2 × (base + side)","base × perpendicular height","1/2 × base × height","base + height"],a:1,e:"Area of a parallelogram = base × perpendicular height."},
{d:"BASIC",q:"A parallelogram has base 8 cm and perpendicular height 4 cm. Find its area.",o:["12 cm²","24 cm²","32 cm²","64 cm²"],a:2,e:"Area = 8 × 4 = 32 cm²."},
{d:"BASIC",q:"The base is 5 m and the perpendicular height is 3 m. What is the area?",o:["8 m²","15 m²","16 m²","30 m²"],a:1,e:"Area = 5 × 3 = 15 m²."},
{d:"BASIC",q:"A parallelogram has area 42 cm² and base 7 cm. Find its perpendicular height.",o:["5 cm","6 cm","7 cm","8 cm"],a:1,e:"Height = area ÷ base = 42 ÷ 7 = 6 cm."},
{d:"BASIC",q:"Which measurement is used for area of a parallelogram?",o:["Base × slant side","Base × perpendicular height","Base + height","2 × base"],a:1,e:"Use the perpendicular height, not the slant side."},
{d:"BASIC",q:"Base = 10 cm and height = 2 cm. What is the area?",o:["12 cm²","20 cm²","24 cm²","40 cm²"],a:1,e:"10 × 2 = 20 cm²."},
{d:"BASIC",q:"If base and perpendicular height are both measured in metres, area is expressed in:",o:["m","m²","m³","cm²"],a:1,e:"Area uses square units, so the answer is in m²."},
{d:"BASIC",q:"A parallelogram has base 9 cm and height 6 cm. Find its area.",o:["15 cm²","27 cm²","54 cm²","108 cm²"],a:2,e:"Area = 9 × 6 = 54 cm²."},
{d:"BASIC",q:"A parallelogram has area 36 m² and height 4 m. Its base is:",o:["9 m","8 m","12 m","32 m"],a:0,e:"Base = 36 ÷ 4 = 9 m."},
{d:"BASIC",q:"If the base stays the same and the perpendicular height doubles, the area:",o:["Halves","Doubles","Stays the same","Becomes zero"],a:1,e:"Area is base × height, so doubling height doubles area."},
{d:"MEDIUM",q:"A parallelogram has base 12 cm and height 7 cm. Find its area.",o:["19 cm²","38 cm²","84 cm²","168 cm²"],a:2,e:"Area = 12 × 7 = 84 cm²."},
{d:"MEDIUM",q:"The area is 96 cm² and the base is 12 cm. What is the perpendicular height?",o:["6 cm","8 cm","10 cm","12 cm"],a:1,e:"Height = 96 ÷ 12 = 8 cm."},
{d:"MEDIUM",q:"A parallelogram-shaped field has base 25 m and perpendicular height 16 m. Find its area.",o:["41 m²","200 m²","400 m²","800 m²"],a:2,e:"Area = 25 × 16 = 400 m²."},
{d:"MEDIUM",q:"The base of a parallelogram is 15 cm. Its area is 180 cm². Find its height.",o:["10 cm","12 cm","15 cm","18 cm"],a:1,e:"Height = 180 ÷ 15 = 12 cm."},
{d:"MEDIUM",q:"A parallelogram has base 8.5 cm and height 4 cm. Its area is:",o:["12.5 cm²","17 cm²","34 cm²","40 cm²"],a:2,e:"8.5 × 4 = 34 cm²."},
{d:"MEDIUM",q:"A tile is shaped like a parallelogram with base 20 cm and height 12 cm. What is its area?",o:["32 cm²","120 cm²","240 cm²","480 cm²"],a:2,e:"Area = 20 × 12 = 240 cm²."},
{d:"MEDIUM",q:"The area is 150 m² and the perpendicular height is 10 m. Find the base.",o:["5 m","10 m","15 m","25 m"],a:2,e:"Base = 150 ÷ 10 = 15 m."},
{d:"MEDIUM",q:"A parallelogram has base 14 cm and height 9 cm. If the height changes to 6 cm, what is the new area?",o:["54 cm²","84 cm²","126 cm²","140 cm²"],a:1,e:"New area = 14 × 6 = 84 cm²."},
{d:"MEDIUM",q:"A garden has a parallelogram shape, base 18 m and height 11 m. How much area does it cover?",o:["29 m²","99 m²","198 m²","396 m²"],a:2,e:"Area = 18 × 11 = 198 m²."},
{d:"MEDIUM",q:"Which parallelogram has the greatest area?",o:["Base 10 cm, height 5 cm","Base 8 cm, height 7 cm","Base 12 cm, height 4 cm","Base 6 cm, height 8 cm"],a:1,e:"Areas are 50, 56, 48 and 48 cm². The greatest is 56 cm²."},
{d:"HARD",q:"A parallelogram has area 252 cm² and base 21 cm. Find its perpendicular height.",o:["10 cm","11 cm","12 cm","14 cm"],a:2,e:"Height = 252 ÷ 21 = 12 cm."},
{d:"HARD",q:"A parallelogram-shaped plot has base 32 m and height 18 m. If grass costs ₹25 per m², what is the total cost?",o:["₹14,400","₹9,000","₹16,000","₹28,800"],a:0,e:"Area = 32 × 18 = 576 m². Cost = 576 × ₹25 = ₹14,400."},
{d:"HARD",q:"The area of a parallelogram is 315 cm². If its height is 15 cm, what is its base?",o:["18 cm","20 cm","21 cm","25 cm"],a:2,e:"Base = 315 ÷ 15 = 21 cm."},
{d:"HARD",q:"A parallelogram has base 2.4 m and perpendicular height 1.5 m. Find its area in cm².",o:["3.6 cm²","360 cm²","3,600 cm²","36,000 cm²"],a:2,e:"Area = 2.4 × 1.5 = 3.6 m². Since 1 m² = 10,000 cm², area = 36,000 cm²."},
{d:"HARD",q:"The base of a parallelogram is increased from 10 cm to 15 cm while height stays 8 cm. By how much does its area increase?",o:["20 cm²","40 cm²","80 cm²","120 cm²"],a:1,e:"Original area = 80 cm²; new area = 120 cm²; increase = 40 cm²."},
{d:"HARD",q:"A parallelogram has area 540 m² and base 30 m. If the base is reduced to 20 m and height remains the same, what is the new area?",o:["180 m²","300 m²","360 m²","450 m²"],a:2,e:"Original height = 540 ÷ 30 = 18 m. New area = 20 × 18 = 360 m²."},
{d:"HARD",q:"A parallelogram and a rectangle have the same base of 16 cm and the same perpendicular height of 9 cm. How do their areas compare?",o:["Parallelogram area is twice as large","Rectangle area is twice as large","Their areas are equal","Cannot be determined"],a:2,e:"Both areas equal base × height = 16 × 9 = 144 cm²."},
{d:"HARD",q:"The area of a parallelogram is 4.2 m² and its base is 2.8 m. Find its height.",o:["0.67 m","1.2 m","1.5 m","2.0 m"],a:2,e:"Height = 4.2 ÷ 2.8 = 1.5 m."},
{d:"HARD",q:"A parallelogram has base 24 cm and height 13 cm. A second parallelogram has twice the base and half the height. What is the second area?",o:["156 cm²","312 cm²","624 cm²","1,248 cm²"],a:1,e:"Second base = 48 cm and height = 6.5 cm. Area = 48 × 6.5 = 312 cm²."},
{d:"HARD",q:"A parallelogram floor has base 7.5 m and height 4.8 m. Each square metre requires 0.25 L of coating. How many litres are needed?",o:["6 L","8 L","9 L","12 L"],a:2,e:"Area = 7.5 × 4.8 = 36 m². Coating = 36 × 0.25 = 9 L."}
];
let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0,finished=false;const $=id=>document.getElementById(id);
function updateProgress(){const p=index/questions.length*100;$('bar').style.width=p+'%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(p)));}
function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · AREA OF PARALLELOGRAMS';$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}
function results(){finished=true;$('bar').style.width='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='Retry to improve your score';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3rem">📐</div><h1>'+(correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><p>Remember: area = base × perpendicular height. Review explanations and try again.</p></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}
function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Explanation: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}
function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}
$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();</script><script src="/skillup-eye-shield.js?v=20261013-eye-shield-v1"></script><script src="/shared-nav.js?v=20261013-no-bottom-nav-v1"></script></body></html>
