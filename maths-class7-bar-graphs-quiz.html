<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261012-class7-bar-graphs-v1"><title>Class 7 Bar Graphs Quiz | SkillUp Maths</title><style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills-result{display:grid;gap:9px;text-align:left;margin-top:15px}.skill-item{background:#182942;border:1px solid var(--line);border-radius:13px;padding:11px;color:var(--muted)}.skill-item.unlocked{border-color:var(--green);color:var(--green2)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
 .skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}.skills-result{margin-top:14px;text-align:left}.skills-result h3{margin:0 0 8px;font-size:1rem}.skills-result .skill-item{margin-top:7px}.skill-item.unlocked{border-color:var(--green);color:var(--green2);background:#174b42} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}.diagram .accent{stroke:#58d6a3}.diagram .blue{stroke:#91b7ff}.diagram .gold{stroke:#ffd27a}.skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}.skills-result{margin-top:14px;text-align:left}.skills-result h3{margin:0 0 8px;font-size:1rem}.skills-result .skill-item{margin-top:7px}.skill-item.unlocked{border-color:var(--green);color:var(--green2);background:#174b42}</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Bar Graphs</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Bar Graphs skills"><div class="skill-title">🎯 Bar Graphs Skills</div><div class="skill-list"><div class="skill-item">Read graph scales and category values</div><div class="skill-item">Compare totals, differences and trends</div><div class="skill-item">Read, compare and interpret bar graphs</div></div></section></div><script>(function(){'use strict';const questions=[{"d":"BASIC","q":"A bar graph shows 6 students chose cricket and 4 chose tennis. How many chose cricket?","o":["4","10","6","2"],"a":2,"e":"Read the height of the cricket bar: 6 students."},{"d":"BASIC","q":"In a bar graph, what does the horizontal axis often show?","o":["Only the total","Categories","The graph's title","The page number"],"a":1,"e":"The horizontal axis often lists categories being compared."},{"d":"BASIC","q":"A bar reaches 8 on a scale marked in ones. What value does it represent?","o":["4","10","1","8"],"a":3,"e":"A bar reaching 8 represents a value of 8."},{"d":"BASIC","q":"Books borrowed are 3 on Monday and 7 on Tuesday. Which day had more books borrowed?","o":["Tuesday","Monday","Both equal","Cannot tell"],"a":0,"e":"7 is greater than 3, so Tuesday had more."},{"d":"BASIC","q":"A graph shows 5 votes for red, 9 for blue and 4 for green. Which colour has the fewest votes?","o":["Red","Blue","Green","All equal"],"a":2,"e":"Green has 4 votes, fewer than 5 and 9."},{"d":"BASIC","q":"What does the height or length of a bar show?","o":["The graph maker's age","The value for that category","The date only","The number of categories only"],"a":1,"e":"Each bar's size represents the value for its category."},{"d":"BASIC","q":"A bar graph uses a scale where one grid line equals 2 books. A bar reaches 4 grid lines. How many books is that?","o":["6","4","2","8"],"a":3,"e":"4 grid lines × 2 books = 8 books."},{"d":"BASIC","q":"Which title best fits a bar graph comparing the number of pets owned by students?","o":["Students' Pets","Weather Forecast","Fractions Practice","A Story About Space"],"a":0,"e":"The title should describe the categories and values shown."},{"d":"BASIC","q":"A graph shows 12 visitors on Saturday and 10 on Sunday. How many visitors came across both days?","o":["2","120","22","21"],"a":2,"e":"12 + 10 = 22 visitors."},{"d":"BASIC","q":"If two bars have equal heights on the same scale, what does that mean?","o":["One value is double","Their values are equal","Both values are zero","The graph is always wrong"],"a":1,"e":"Equal bar heights on the same scale represent equal values."},{"d":"MEDIUM","q":"A bar graph shows 18 students prefer football and 12 prefer basketball. How many more prefer football?","o":["30","5","8","6"],"a":3,"e":"18 − 12 = 6 students."},{"d":"MEDIUM","q":"Books read by three students are 4, 7 and 9. What is the total number of books?","o":["20","16","18","21"],"a":0,"e":"4 + 7 + 9 = 20 books."},{"d":"MEDIUM","q":"A graph scale increases by 5 per grid line. A bar reaches 6 grid lines. What is its value?","o":["11","25","30","35"],"a":2,"e":"6 × 5 = 30."},{"d":"MEDIUM","q":"A bar graph shows Monday 14, Tuesday 17 and Wednesday 11 visitors. Which day had the second-highest count?","o":["Tuesday","Monday","Wednesday","All equal"],"a":1,"e":"17 is highest, 14 is second, and 11 is lowest."},{"d":"MEDIUM","q":"A class survey shows 8 chose apples, 13 chose bananas and 9 chose grapes. How many students answered?","o":["21","22","29","30"],"a":3,"e":"8 + 13 + 9 = 30 students."},{"d":"MEDIUM","q":"A bar graph shows 25 books in one category and 5 in another. How many times as many books are in the first category?","o":["5 times","20 times","4 times","30 times"],"a":0,"e":"25 ÷ 5 = 5."},{"d":"MEDIUM","q":"The scale on a bar graph is 0, 10, 20, 30, 40. A bar reaches halfway between 20 and 30. What value does it show?","o":["20","30","25","15"],"a":2,"e":"Halfway between 20 and 30 is 25."},{"d":"MEDIUM","q":"A graph records 16 bikes, 9 scooters and 7 cars. How many more bikes than scooters and cars combined?","o":["7","0","2","9"],"a":1,"e":"Scooters and cars total 9 + 7 = 16, equal to bikes, so the difference is 0."},{"d":"MEDIUM","q":"A bar graph shows 32 people at a show in the morning and 45 in the evening. How many more came in the evening?","o":["77","12","15","13"],"a":3,"e":"45 − 32 = 13 people."},{"d":"MEDIUM","q":"A graph shows 6, 10, 10 and 14 for four categories. What is the range?","o":["8","14","6","10"],"a":0,"e":"Range = highest − lowest = 14 − 6 = 8."},{"d":"HARD","q":"A bar graph shows 24 books on Monday, 18 Tuesday and 30 Wednesday. What is the average per day?","o":["72","18","24","30"],"a":2,"e":"(24 + 18 + 30) ÷ 3 = 72 ÷ 3 = 24."},{"d":"HARD","q":"A graph scale labels each major interval as 4 units. A bar reaches 7 intervals. What value does it represent?","o":["11","28","24","32"],"a":1,"e":"7 × 4 = 28 units."},{"d":"HARD","q":"A bar graph shows 36 students chose science and 24 chose art. What fraction of these students chose art?","o":["1/2","3/5","2/3","2/5"],"a":3,"e":"Total = 60; art is 24/60 = 2/5."},{"d":"HARD","q":"A shop's daily sales are ₹125, ₹150, ₹100 and ₹175. What is the difference between its highest and lowest sales?","o":["₹75","₹50","₹100","₹25"],"a":0,"e":"₹175 − ₹100 = ₹75."},{"d":"HARD","q":"A bar graph shows 42 visitors on Friday, 56 on Saturday and 49 on Sunday. How many visitors came over the weekend (Saturday and Sunday)?","o":["147","98","105","91"],"a":2,"e":"56 + 49 = 105 visitors."},{"d":"HARD","q":"A graph shows 15, 21, 18 and 30 for four classes. If the total is reduced by 4 from the largest category, what is the new total?","o":["84","80","76","78"],"a":1,"e":"Original total = 84; 84 − 4 = 80."},{"d":"HARD","q":"A bar graph shows 28 votes for option A, 35 for B and 21 for C. What percentage of all votes went to B?","o":["35%","50%","25%","41⅔%"],"a":3,"e":"Total = 84; 35 ÷ 84 × 100 = 41⅔%."},{"d":"HARD","q":"The values shown are 17, 23, 19 and 25. How much greater is the combined total of the two largest values than the combined total of the two smallest?","o":["18","8","10","6"],"a":0,"e":"Largest two total 25 + 23 = 48; smallest two total 17 + 19 = 36; difference 18."},{"d":"HARD","q":"A bar graph shows water use of 48 L, 36 L and 42 L over three days. If the next day uses 30 L, what is the four-day total?","o":["126 L","150 L","156 L","162 L"],"a":2,"e":"48 + 36 + 42 + 30 = 156 L."},{"d":"HARD","q":"Four categories have values 12, 18, 24 and 30. What is the difference between the total of the first two and the total of the last two?","o":["12","24","18","30"],"a":1,"e":"First two total 30; last two total 54; difference = 24."}];;let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0,finished=false;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$ ('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const skills=[['Identify the operations needed in a word problem',8],['Solve data questions from real-life bar graphs',18],['Interpret averages and missing values',24]];$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">📏</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+skills.map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();</script>
