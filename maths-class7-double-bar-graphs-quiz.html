s="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Double Bar Graphs</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Double Bar Graphs skills"><div class="skill-title">🎯 Double Bar Graphs Skills</div><div class="skill-list"><div class="skill-item">Interpret paired bars, legends and scales</div><div class="skill-item">Compare groups across categories and time periods</div><div class="skill-item">Compare two data sets using double bar graphs</div></div></section></div><script>(function(){'use strict';const questions=[{"d":"BASIC","q":"A double bar graph compares Class A (12) and Class B (15) for book loans. Which class borrowed more?","o":["Class A","Both equal","Class B","Cannot tell"],"a":2,"e":"15 is greater than 12, so Class B borrowed more."},{"d":"BASIC","q":"In a double bar graph, two bars for each category usually represent:","o":["Two graph titles","Two groups being compared","Only one total","The same group twice by mistake"],"a":1,"e":"Each bar series represents a different group or time period."},{"d":"BASIC","q":"For Monday, Group X has 8 and Group Y has 5. What is the difference?","o":["13","2","5","3"],"a":3,"e":"Difference = 8 − 5 = 3."},{"d":"BASIC","q":"A graph shows red votes 9 and blue votes 9 for the same category. What can you conclude?","o":["Both groups have equal values","Red is higher","Blue is higher","Both are zero"],"a":0,"e":"Equal bar heights on the same scale indicate equal values."},{"d":"BASIC","q":"Which graph feature tells you which bar belongs to each group?","o":["Page number","Border","Legend/key","Footnote only"],"a":2,"e":"The legend identifies the data series."},{"d":"BASIC","q":"In April, Shop A sold 20 pencils and Shop B sold 14. How many did they sell altogether?","o":["6","34","280","30"],"a":1,"e":"20 + 14 = 34 pencils."},{"d":"BASIC","q":"A double bar graph compares boys and girls in three clubs. The horizontal axis most likely shows:","o":["Only student names","The graph scale","The legend colours","Club names"],"a":3,"e":"The categories being compared—here, club names—are placed on the horizontal axis."},{"d":"BASIC","q":"A scale increases by 5 each grid line. A bar reaches 4 grid lines. What value does it show?","o":["20","9","15","25"],"a":0,"e":"4 × 5 = 20."},{"d":"BASIC","q":"Class A scored 18 points and Class B scored 11. How many more points did Class A score?","o":["29","6","7","9"],"a":2,"e":"18 − 11 = 7 points."},{"d":"BASIC","q":"What is a useful reason to use a double bar graph?","o":["Show only one number with no categories","Compare two related data sets across the same categories","Replace every table with a picture","Display unrelated scales without labels"],"a":1,"e":"Double bar graphs make comparisons between two related groups easier."},{"d":"MEDIUM","q":"A library loan graph shows Monday: adults 16, children 22; Tuesday: adults 20, children 18. What is the total for children over both days?","o":["38","36","42","40"],"a":3,"e":"Children's total = 22 + 18 = 40."},{"d":"MEDIUM","q":"Team Red scored 24 in round 1 and 31 in round 2. Team Blue scored 28 and 26. Which team has the higher total?","o":["Team Red","Team Blue","Equal totals","Cannot determine"],"a":0,"e":"Red totals 55; Blue totals 54, so Team Red is higher."},{"d":"MEDIUM","q":"A graph shows plant heights: Week 1, Plant A 8 cm and Plant B 6 cm; Week 2, A 11 cm and B 10 cm. Which plant grew more?","o":["Plant A","They grew equally","Plant B","Neither grew"],"a":2,"e":"Plant A grew 3 cm; Plant B grew 4 cm."},{"d":"MEDIUM","q":"At a fair, tickets sold were morning 35 and evening 48 last Saturday, and morning 42 and evening 45 Sunday. What was the Sunday total?","o":["83","87","90","93"],"a":1,"e":"Sunday total = 42 + 45 = 87 tickets."},{"d":"MEDIUM","q":"A graph shows apples sold: Shop A 36, Shop B 29. If Shop B sells 8 more apples, which shop sells more?","o":["Shop A by 1","They are equal","Shop A by 7","Shop B by 1"],"a":3,"e":"Shop B becomes 29 + 8 = 37, one more than 36."},{"d":"MEDIUM","q":"For four houses, recycling totals are House A 12 and House B 9, then 14 and 14, then 8 and 11, then 16 and 10. Which category has equal values?","o":["The second category","The first category","The third category","The fourth category"],"a":0,"e":"The second category has 14 for each house."},{"d":"MEDIUM","q":"A double bar graph shows Year 1 sales A=50, B=40 and Year 2 sales A=45, B=55. Which group increased from Year 1 to Year 2?","o":["Group A","Both groups","Group B","Neither group"],"a":2,"e":"Group B increased from 40 to 55; Group A decreased from 50 to 45."},{"d":"MEDIUM","q":"Two classes read books. Class P: 7, 9, 11; Class Q: 8, 6, 12. What is the combined total for the second category?","o":["17","15","13","18"],"a":1,"e":"Second category total = 9 + 6 = 15."},{"d":"MEDIUM","q":"A graph compares weekday and weekend visitors: museum 120 and 180; zoo 150 and 140. Which location had more weekend visitors?","o":["Zoo","Both equal","Cannot tell","Museum"],"a":3,"e":"Weekend visitors: museum 180, zoo 140."},{"d":"MEDIUM","q":"A double bar graph uses one grid line for 10 units. Group A has 5 grid lines and Group B has 3. What is their combined value?","o":["80","50","30","2"],"a":0,"e":"A = 50 and B = 30; combined value = 80."},{"d":"HARD","q":"Two shops sold notebooks over three days. Shop A: 24, 30, 36; Shop B: 28, 25, 39. What is the difference between their three-day totals?","o":["4","6","2","8"],"a":2,"e":"A totals 90; B totals 92. Difference = 2."},{"d":"HARD","q":"Monthly visitors for two galleries were January A=140, B=120; February A=130, B=150; March A=160, B=145. Which gallery had the greater three-month total and by how much?","o":["Gallery B by 15","Gallery A by 15","Gallery A by 5","Gallery B by 5"],"a":1,"e":"A totals 430; B totals 415. Gallery A leads by 15."},{"d":"HARD","q":"A double bar graph compares test scores. Group A: 68, 74, 82; Group B: 72, 70, 84. Which group has the higher mean score?","o":["Group A","Same mean","Cannot calculate","Group B"],"a":3,"e":"A total is 224 (mean 74⅔); B total is 226 (mean 75⅓), so Group B has the higher mean."},{"d":"HARD","q":"Two buses carried passengers on three trips. Bus A: 32, 28, 35; Bus B: 29, 34, 30. How many more passengers did Bus A carry in total?","o":["2","1","3","5"],"a":0,"e":"A total = 95; B total = 93; difference = 2."},{"d":"HARD","q":"A graph shows school garden harvests (kg). Year 1: beans 18, tomatoes 25. Year 2: beans 24, tomatoes 29. By how much did the combined harvest increase?","o":["6 kg","8 kg","10 kg","12 kg"],"a":2,"e":"Year 1 total 43 kg; Year 2 total 53 kg; increase = 10 kg."},{"d":"HARD","q":"Two classes collected cans. Class A totals by week: 12, 18, 20, 14. Class B: 15, 16, 18, 17. Which class collected more overall?","o":["Class A by 2","Class B by 2","Class B by 4","Equal totals"],"a":1,"e":"A totals 64; B totals 66; Class B collected 2 more."},{"d":"HARD","q":"A double bar graph compares sales for two days. Product X: 45 and 60; Product Y: 55 and 50. Which product has the greater total and by how much?","o":["Product Y by 10","Product X by 10","Product Y by 5","Product X and Product Y have equal totals"],"a":3,"e":"X totals 45 + 60 = 105 and Y totals 55 + 50 = 105."},{"d":"HARD","q":"Group A has values 25, 32 and 43; Group B has 30, 28 and 40. What is the difference between the groups' totals?","o":["2","4","6","8"],"a":0,"e":"A totals 100; B totals 98; difference = 2."},{"d":"HARD","q":"A double bar graph shows rainfall (mm) in two towns: Town P 42, 35, 50; Town Q 38, 41, 44. Which town's total is higher?","o":["Town Q by 4 mm","Town P by 2 mm","Town P by 4 mm","Equal totals"],"a":2,"e":"P totals 127 mm; Q totals 123 mm; Town P leads by 4 mm."},{"d":"HARD","q":"A school compares library visits. Group A: 48, 52, 60; Group B: 50, 55, 55. What is the combined total of all visits shown?","o":["315","320","270","165"],"a":1,"e":"A totals 160 and B totals 160; combined total = 320."}];;let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0,finished=false;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$ ('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const skills=[['Identify the operations needed in a word problem',8],['Analyse totals, changes and differences between two groups',18],['Interpret averages and missing values',24]];$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">📏</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+skills.map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();</script></body></html>
