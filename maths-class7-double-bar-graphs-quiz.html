<script>
(function(){
'use strict';
const questions=[{"q":"A double bar graph compares Class A (12) and Class B (15) for book loans. Which class borrowed more?","o":["Class A","Both equal","Class B","Cannot tell"],"a":2,"why":"15 is greater than 12, so Class B borrowed more."},{"q":"In a double bar graph, two bars for each category usually represent:","o":["Two graph titles","Two groups being compared","Only one total","The same group twice by mistake"],"a":1,"why":"Each bar series represents a different group or time period."},{"q":"For Monday, Group X has 8 and Group Y has 5. What is the difference?","o":["13","2","5","3"],"a":3,"why":"Difference = 8 − 5 = 3."},{"q":"A graph shows red votes 9 and blue votes 9 for the same category. What can you conclude?","o":["Both groups have equal values","Red is higher","Blue is higher","Both are zero"],"a":0,"why":"Equal bar heights on the same scale indicate equal values."},{"q":"Which graph feature tells you which bar belongs to each group?","o":["Page number","Border","Legend/key","Footnote only"],"a":2,"why":"The legend identifies the data series."},{"q":"In April, Shop A sold 20 pencils and Shop B sold 14. How many did they sell altogether?","o":["6","34","280","30"],"a":1,"why":"20 + 14 = 34 pencils."},{"q":"A double bar graph compares boys and girls in three clubs. The horizontal axis most likely shows:","o":["Only student names","The graph scale","The legend colours","Club names"],"a":3,"why":"The categories being compared—here, club names—are placed on the horizontal axis."},{"q":"A scale increases by 5 each grid line. A bar reaches 4 grid lines. What value does it show?","o":["20","9","15","25"],"a":0,"why":"4 × 5 = 20."},{"q":"Class A scored 18 points and Class B scored 11. How many more points did Class A score?","o":["29","6","7","9"],"a":2,"why":"18 − 11 = 7 points."},{"q":"What is a useful reason to use a double bar graph?","o":["Show only one number with no categories","Compare two related data sets across the same categories","Replace every table with a picture","Display unrelated scales without labels"],"a":1,"why":"Double bar graphs make comparisons between two related groups easier."},{"q":"A library loan graph shows Monday: adults 16, children 22; Tuesday: adults 20, children 18. What is the total for children over both days?","o":["38","36","42","40"],"a":3,"why":"Children's total = 22 + 18 = 40."},{"q":"Team Red scored 24 in round 1 and 31 in round 2. Team Blue scored 28 and 26. Which team has the higher total?","o":["Team Red","Team Blue","Equal totals","Cannot determine"],"a":0,"why":"Red totals 55; Blue totals 54, so Team Red is higher."},{"q":"A graph shows plant heights: Week 1, Plant A 8 cm and Plant B 6 cm; Week 2, A 11 cm and B 10 cm. Which plant grew more?","o":["Plant A","They grew equally","Plant B","Neither grew"],"a":2,"why":"Plant A grew 3 cm; Plant B grew 4 cm."},{"q":"At a fair, tickets sold were morning 35 and evening 48 last Saturday, and morning 42 and evening 45 Sunday. What was the Sunday total?","o":["83","87","90","93"],"a":1,"why":"Sunday total = 42 + 45 = 87 tickets."},{"q":"A graph shows apples sold: Shop A 36, Shop B 29. If Shop B sells 8 more apples, which shop sells more?","o":["Shop A by 1","They are equal","Shop A by 7","Shop B by 1"],"a":3,"why":"Shop B becomes 29 + 8 = 37, one more than 36."},{"q":"For four houses, recycling totals are House A 12 and House B 9, then 14 and 14, then 8 and 11, then 16 and 10. Which category has equal values?","o":["The second category","The first category","The third category","The fourth category"],"a":0,"why":"The second category has 14 for each house."},{"q":"A double bar graph shows Year 1 sales A=50, B=40 and Year 2 sales A=45, B=55. Which group increased from Year 1 to Year 2?","o":["Group A","Both groups","Group B","Neither group"],"a":2,"why":"Group B increased from 40 to 55; Group A decreased from 50 to 45."},{"q":"Two classes read books. Class P: 7, 9, 11; Class Q: 8, 6, 12. What is the combined total for the second category?","o":["17","15","13","18"],"a":1,"why":"Second category total = 9 + 6 = 15."},{"q":"A graph compares weekday and weekend visitors: museum 120 and 180; zoo 150 and 140. Which location had more weekend visitors?","o":["Zoo","Both equal","Cannot tell","Museum"],"a":3,"why":"Weekend visitors: museum 180, zoo 140."},{"q":"A double bar graph uses one grid line for 10 units. Group A has 5 grid lines and Group B has 3. What is their combined value?","o":["80","50","30","2"],"a":0,"why":"A = 50 and B = 30; combined value = 80."},{"q":"Two shops sold notebooks over three days. Shop A: 24, 30, 36; Shop B: 28, 25, 39. What is the difference between their three-day totals?","o":["4","6","2","8"],"a":2,"why":"A totals 90; B totals 92. Difference = 2."},{"q":"Monthly visitors for two galleries were January A=140, B=120; February A=130, B=150; March A=160, B=145. Which gallery had the greater three-month total and by how much?","o":["Gallery B by 15","Gallery A by 15","Gallery A by 5","Gallery B by 5"],"a":1,"why":"A totals 430; B totals 415. Gallery A leads by 15."},{"q":"A double bar graph compares test scores. Group A: 68, 74, 82; Group B: 72, 70, 84. Which group has the higher mean score?","o":["Group A","Same mean","Cannot calculate","Group B"],"a":3,"why":"A total is 224 (mean 74⅔); B total is 226 (mean 75⅓), so Group B has the higher mean."},{"q":"Two buses carried passengers on three trips. Bus A: 32, 28, 35; Bus B: 29, 34, 30. How many more passengers did Bus A carry in total?","o":["2","1","3","5"],"a":0,"why":"A total = 95; B total = 93; difference = 2."},{"q":"A graph shows school garden harvests (kg). Year 1: beans 18, tomatoes 25. Year 2: beans 24, tomatoes 29. By how much did the combined harvest increase?","o":["6 kg","8 kg","10 kg","12 kg"],"a":2,"why":"Year 1 total 43 kg; Year 2 total 53 kg; increase = 10 kg."},{"q":"Two classes collected cans. Class A totals by week: 12, 18, 20, 14. Class B: 15, 16, 18, 17. Which class collected more overall?","o":["Class A by 2","Class B by 2","Class B by 4","Equal totals"],"a":1,"why":"A totals 64; B totals 66; Class B collected 2 more."},{"q":"A double bar graph compares sales for two days. Product X: 45 and 60; Product Y: 55 and 50. Which product has the greater total and by how much?","o":["Product Y by 10","Product X by 10","Product Y by 5","Product X and Product Y have equal totals"],"a":3,"why":"X totals 45 + 60 = 105 and Y totals 55 + 50 = 105."},{"q":"Group A has values 25, 32 and 43; Group B has 30, 28 and 40. What is the difference between the groups' totals?","o":["2","4","6","8"],"a":0,"why":"A totals 100; B totals 98; difference = 2."},{"q":"A double bar graph shows rainfall (mm) in two towns: Town P 42, 35, 50; Town Q 38, 41, 44. Which town's total is higher?","o":["Town Q by 4 mm","Town P by 2 mm","Town P by 4 mm","Equal totals"],"a":2,"why":"P totals 127 mm; Q totals 123 mm; Town P leads by 4 mm."},{"q":"A school compares library visits. Group A: 48, 52, 60; Group B: 50, 55, 55. What is the combined total of all visits shown?","o":["315","320","270","165"],"a":1,"why":"A totals 160 and B totals 160; combined total = 320."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Double Bar Graphs Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261104-physics-path-layout-v2" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
