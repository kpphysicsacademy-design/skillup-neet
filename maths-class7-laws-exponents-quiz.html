<script>(function(){'use strict';const questions=[
{d:"BASIC",q:"Simplify: 2³",o:["6","8","9","23"],a:1,e:"2³ = 2 × 2 × 2 = 8."},
{d:"BASIC",q:"Write 5 × 5 × 5 × 5 using exponents.",o:["5 × 4","4⁵","5⁴","20"],a:2,e:"The base 5 is repeated four times, so the expression is 5⁴."},
{d:"BASIC",q:"Simplify: 3² × 3³",o:["3⁵","9⁶","3⁶","6⁵"],a:0,e:"For the same base, add exponents: 3² × 3³ = 3²⁺³ = 3⁵."},
{d:"BASIC",q:"Simplify: 7⁴ ÷ 7²",o:["7²","7⁶","1²","7⁸"],a:0,e:"For the same non-zero base, subtract exponents: 7⁴ ÷ 7² = 7²."},
{d:"BASIC",q:"What is the value of 10⁰?",o:["0","1","10","100"],a:1,e:"Any non-zero number raised to the power zero equals 1."},
{d:"BASIC",q:"Simplify: (2³)²",o:["2⁵","2⁶","4⁶","2⁹"],a:1,e:"Power of a power: multiply exponents, so (2³)² = 2⁶."},
{d:"BASIC",q:"Which is equal to 4²?",o:["4 + 4","4 × 2","4 × 4","2 × 2 × 2 × 2 × 2"],a:2,e:"4² means 4 multiplied by itself: 4 × 4 = 16."},
{d:"BASIC",q:"Simplify: 6¹",o:["1","0","6","61"],a:2,e:"Any number raised to the power one is the number itself."},
{d:"BASIC",q:"Simplify: 2⁴ × 2",o:["2⁴","2⁵","4⁵","2⁸"],a:1,e:"Write 2 as 2¹. Add exponents: 2⁴ × 2¹ = 2⁵."},
{d:"BASIC",q:"Evaluate: 3² + 2²",o:["13","25","36","10"],a:0,e:"3² + 2² = 9 + 4 = 13. Exponents are evaluated before addition."},
{d:"MEDIUM",q:"Simplify: a⁵ × a³",o:["a¹⁵","a⁸","a²","2a⁸"],a:1,e:"For the same base, add exponents: a⁵ × a³ = a⁸."},
{d:"MEDIUM",q:"Simplify: x⁹ ÷ x⁴ (x ≠ 0).",o:["x¹³","x⁵","x³⁶","x⁴"],a:1,e:"Subtract exponents: x⁹ ÷ x⁴ = x⁹⁻⁴ = x⁵."},
{d:"MEDIUM",q:"Simplify: (m²)⁴",o:["m⁶","m⁸","m¹⁶","m²"],a:1,e:"Multiply the exponents: (m²)⁴ = m²ˣ⁴ = m⁸."},
{d:"MEDIUM",q:"Simplify: (ab)³",o:["a³ + b³","a³b³","ab³","3ab"],a:1,e:"A power of a product applies to each factor: (ab)³ = a³b³."},
{d:"MEDIUM",q:"Simplify: 5⁶ ÷ 5⁶",o:["5","0","1","5¹²"],a:2,e:"5⁶ ÷ 5⁶ = 5⁰ = 1."},
{d:"MEDIUM",q:"Which expression is equal to 1/2³?",o:["2³","2⁻³","−2³","(−2)³"],a:1,e:"A negative exponent means reciprocal: 2⁻³ = 1/2³."},
{d:"MEDIUM",q:"Simplify: 3⁴ × 3⁻²",o:["3⁶","3⁻⁸","3²","9⁴"],a:2,e:"Add exponents: 3⁴ × 3⁻² = 3⁴⁻² = 3²."},
{d:"MEDIUM",q:"Simplify: (x³y²)(x²y⁴)",o:["x⁵y⁶","x⁶y⁸","x⁵y⁸","x⁶y⁶"],a:0,e:"Add exponents of matching bases: x³⁺² y²⁺⁴ = x⁵y⁶."},
{d:"MEDIUM",q:"Evaluate: 2³ × 4²",o:["128","64","32","256"],a:0,e:"2³ = 8 and 4² = 16; 8 × 16 = 128."},
{d:"MEDIUM",q:"Simplify: (p⁴q²)²",o:["p⁶q⁴","p⁸q⁴","p⁸q²","p⁴q⁴"],a:1,e:"Multiply each exponent by 2: (p⁴q²)² = p⁸q⁴."},
{d:"HARD",q:"Simplify: (2³ × 2⁵) ÷ 2⁴",o:["2²","2⁴","2⁸","2¹²"],a:1,e:"Combine exponents: 2³⁺⁵⁻⁴ = 2⁴."},
{d:"HARD",q:"Simplify: (a³)² × a⁴ ÷ a⁵ (a ≠ 0).",o:["a⁵","a⁶","a⁷","a¹¹"],a:0,e:"(a³)² = a⁶; then a⁶ × a⁴ ÷ a⁵ = a⁶⁺⁴⁻⁵ = a⁵."},
{d:"HARD",q:"Simplify: (3²)³ ÷ 3⁴",o:["3²","3⁵","3⁶","3¹³"],a:0,e:"(3²)³ = 3⁶; 3⁶ ÷ 3⁴ = 3²."},
{d:"HARD",q:"If 2ˣ = 32, what is x?",o:["4","5","6","16"],a:1,e:"32 = 2 × 2 × 2 × 2 × 2 = 2⁵, so x = 5."},
{d:"HARD",q:"Simplify: (x²y³)³ ÷ (xy)².",o:["x⁴y⁷","x⁵y⁷","x⁶y⁹","x³y⁵"],a:0,e:"Numerator is x⁶y⁹; divide by x²y² to get x⁴y⁷."},
{d:"HARD",q:"Which expression equals 1/(a⁴) when a ≠ 0?",o:["a⁴","a⁻⁴","−a⁴","a⁰"],a:1,e:"The reciprocal rule gives 1/a⁴ = a⁻⁴."},
{d:"HARD",q:"Simplify: 10³ × 10⁻⁵",o:["10⁸","10⁻²","10²","10⁻¹⁵"],a:1,e:"Add exponents: 10³ × 10⁻⁵ = 10³⁻⁵ = 10⁻²."},
{d:"HARD",q:"Simplify: (2a²)³",o:["6a⁶","8a⁶","8a⁵","2a⁶"],a:1,e:"Raise each factor to the third power: 2³(a²)³ = 8a⁶."},
{d:"HARD",q:"Evaluate: (2⁵ × 2²) ÷ (2³ × 2)",o:["2²","2³","2⁴","2⁵"],a:1,e:"Numerator exponent is 5 + 2 = 7; denominator exponent is 3 + 1 = 4; result is 2³."},
{d:"HARD",q:"Simplify: (x⁵ ÷ x²)² × x⁻³ (x ≠ 0).",o:["1","x³","x⁶","x⁻¹"],a:0,e:"Inside brackets x⁵ ÷ x² = x³; square to get x⁶; multiply x⁻³ to get x³, not 1."}

same base by adding exponents; divide by subtracting them.</p></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Explanation: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();</script><script src="/skillup-eye-shield.js?v=20261013-eye-shield-v1"></script><script src="/shared-nav.js?v=20261013-no-bottom-nav-v1"></script></body></html>
