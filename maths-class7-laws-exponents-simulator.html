:root{--ink:#233047;--muted:#68758b;--line:#e2e8f0;--blue:#3478c8;--teal:#159b83;--bg:#f5f7fb;--soft:#edf4ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#fff;border-bottom:1px solid var(--line)}.top{max-width:760px;margin:auto;min-height:52px;padding:8px 14px;display:flex;align-items:center;gap:10px}.back{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--blue)}main{width:min(100% - 26px,700px);margin:auto;padding:18px 0 36px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:11px}.hero{background:linear-gradient(120deg,#fff,#eaf5ff)}h1{font-size:clamp(23px,5vw,31px);margin:4px 0 6px}h2{font-size:17px;margin:0 0 10px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-weight:750;background:#fff;color:var(--ink)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.field{padding:10px;border:1px solid var(--line);border-radius:11px}.field label{display:flex;justify-content:space-between;font-size:13px;font-weight:750}.field output{color:var(--blue);font-weight:900}.field input{width:100%;accent-color:var(--blue);margin:9px 0 0}.display{padding:20px 10px;text-align:center;background:#f7faff;border:1px solid var(--line);border-radius:13px;font-size:clamp(24px,6vw,36px);font-weight:900;overflow-wrap:anywhere}.result{padding:13px;border-radius:11px;background:var(--soft);margin-top:10px}.answer{font-size:24px;font-weight:900;color:#087d68}.links{display:flex;gap:10px;flex-wrap:wrap}.links a{font-size:13px;color:#116b96;font-weight:800;text-decoration:none}@media(max-width:480px){.controls{grid-template-columns:1fr}}
</style></head><body><header><div class="top"><a class="back" href="maths-class7-laws-exponents-quiz.html?v=20261117-laws-exponents-quiz-v2">←</a><strong>SkillUp <span style="color:#159b83">Maths</span></strong></div></header><main>
<section class="hero"><h1>Laws of Exponents Simulator</h1><p class="muted">Choose an exponent law, change the base and powers, and watch the result update.</p></section>
<section class="card"><h2>Choose a law</h2><select class="select" id="law"><option value="product">Product: aᵐ × aⁿ</option><option value="quotient">Quotient: aᵐ ÷ aⁿ</option><option value="power">Power of a power: (aᵐ)ⁿ</option><option value="zero">Zero exponent: a⁰</option><option value="negative">Negative exponent: a⁻ⁿ</option></select>
<div class="controls"><div class="field"><label for="base">Base a <output id="basev">2</output></label><input id="base" type="range" min="2" max="9" value="2"></div><div class="field"><label for="m">Exponent m <output id="mv">3</output></label><input id="m" type="range" min="1" max="6" value="3"></div><div class="field" id="nfield"><label for="n">Exponent n <output id="nv">2</output></label><input id="n" type="range" min="1" max="6" value="2"></div></div></section>
<section class="card"><h2>See the law in action</h2><div class="display" id="expression">2³ × 2²</div><div class="result"><div class="muted">Simplified using the selected law</div><div class="answer" id="answer">2⁵ = 32</div><p class="muted" id="steps">Add exponents: 3 + 2 = 5. Then calculate 2⁵ = 32.</p></div></section>
<section class="card"><div class="links"><a href="maths-class7-laws-exponents-learn.html?v=20261117-laws-exponents-learn-v1">📘 Simple lesson</a><a href="maths-class7-laws-exponents-quiz.html?v=20261117-laws-exponents-quiz-v2">📝 30-question quiz</a></div></section>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const sup=n=>String(n).replace(/-/g,'⁻').replace(/0/g,'⁰').replace(/1/g,'¹').replace(/2/g,'²').replace(/3/g,'³').replace(/4/g,'⁴').replace(/5/g,'⁵').replace(/6/g,'⁶');function render(){const a=Number($('base').value),m=Number($('m').value),n=Number($('n').value),law=$('law').value;['base','m','n'].forEach(k=>$(k+'v').textContent=$(k).value);$('nfield').style.display=law==='zero'?'none':'block';let exp='',ans='',steps='';if(law==='product'){exp=''+a+sup(m)+' × '+a+sup(n);let p=m+n;ans=a+sup(p)+' = '+(a**p);steps='Same base: add exponents, '+m+' + '+n+' = '+p+'.'}else if(law==='quotient'){exp=a+sup(m)+' ÷ '+a+sup(n);let p=m-n;ans=a+sup(p)+' = '+(a**p);steps='Same base: subtract exponents, '+m+' − '+n+' = '+p+'.'}else if(law==='power'){exp='('+a+sup(m)+')'+sup(n);let p=m*n;ans=a+sup(p)+' = '+(a**p);steps='Power of a power: multiply exponents, '+m+' × '+n+' = '+p+'.'}else if(law==='zero'){exp=a+sup(0);ans='1';steps='Any non-zero base raised to zero equals 1.'}else{exp=a+sup(-n);ans='1 / '+a+sup(n)+' = '+(1/(a**n));steps='A negative exponent means take the reciprocal: 1 / '+a+'ⁿ.'}$('expression').textContent=exp;$('answer').textContent=ans;$('steps').textContent=steps;}['base','m','n','law'].forEach(k=>$(k).addEventListener('input',render));render()})();
</script><script src="/shared-nav.js?v=20261125-unified-botany-theme-v1"></script>
