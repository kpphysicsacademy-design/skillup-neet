<script>(function(){'use strict';const questions=[{d:"BASIC",q:"What is a line of symmetry?",o:["A line dividing a shape into matching mirror halves","Any line across a shape","The longest side","A line showing height"],a:0,e:"The two halves match exactly when folded."},{d:"BASIC",q:"How many lines of symmetry does a square have?",o:["1","2","4","8"],a:2,e:"A square has horizontal, vertical, and two diagonal symmetry lines."},{d:"BASIC",q:"How many lines of symmetry does a non-square rectangle have?",o:["0","1","2","4"],a:2,e:"Its two centre lines through opposite side midpoints are symmetry lines."},{d:"BASIC",q:"How many lines of symmetry does an equilateral triangle have?",o:["1","2","3","6"],a:2,e:"Each vertex and the opposite side midpoint define one of three lines."},{d:"BASIC",q:"Which shape typically has exactly one line of symmetry?",o:["Scalene triangle","Isosceles triangle","Non-square rectangle","General parallelogram"],a:1,e:"An isosceles triangle has one line through its apex and base midpoint."},{d:"BASIC",q:"How many lines of symmetry does a circle have?",o:["1","2","4","Infinitely many"],a:3,e:"Every diameter is a line of symmetry."},{d:"BASIC",q:"Which block capital usually has vertical symmetry?",o:["A","F","G","R"],a:0,e:"A standard block A mirrors across a vertical line."},{d:"BASIC",q:"Which block capital usually has horizontal symmetry?",o:["L","C","P","F"],a:1,e:"A standard block C mirrors across a horizontal line."},{d:"BASIC",q:"Fold a shape along a symmetry line. Its halves should:",o:["Match exactly","Be different sizes","Meet at one point only","Form a circle"],a:0,e:"A symmetry line creates matching mirror halves."},{d:"BASIC",q:"How many lines of symmetry does a scalene triangle have?",o:["0","1","2","3"],a:0,e:"A scalene triangle has no equal sides or angles to create a mirror fold."},{d:"MEDIUM",q:"How many lines of symmetry does a regular pentagon have?",o:["2","3","5","10"],a:2,e:"A regular pentagon has five symmetry lines."},{d:"M es."},{d:"HARD",q:"Which quadrilateral typically has exactly one symmetry line?",o:["General parallelogram","Kite","Non-square rectangle","Square"],a:1,e:"A typical kite is symmetric along the diagonal through the vertices where equal sides meet."},{d:"HARD",q:"A regular 12-sided polygon has how many symmetry lines?",o:["6","10","12","24"],a:2,e:"A regular 12-gon has 12 symmetry lines."},{d:"HARD",q:"Which regular polygon has exactly four symmetry lines?",o:["Triangle","Square","Pentagon","Hexagon"],a:1,e:"A square has four lines of symmetry."},{d:"HARD",q:"How many lines of symmetry does a semicircle have?",o:["0","1","2","Infinitely many"],a:1,e:"One line perpendicular to the diameter through its midpoint reflects it onto itself."},{d:"HARD",q:"Which statement about a circle is true?",o:["Only horizontal and vertical lines are symmetry lines","Every diameter is a symmetry line","Every radius is a symmetry line","It has exactly four symmetry lines"],a:1,e:"Any diameter divides a circle into matching halves."},{d:"HARD",q:"A shape has no reflection symmetry. Which is possible?",o:["It cannot have rotational symmetry","It may still have rotational symmetry","It must be a triangle","It must have one side"],a:1,e:"A general parallelogram has 180-degree rotational symmetry but no reflection symmetry."},{d:"HARD",q:"Which shape has exactly three symmetry lines?",o:["Equilateral triangle","Square","Regular pentagon","Non-square rectangle"],a:0,e:"An equilateral triangle has three symmetry lines."}];;let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0,finished=false;const $=id=>document.getElementById(id);function progress(){let p=index/questions.length*100;$('bar').style.width=p+'%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · LINE SYMMETRY';$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;progress();}function results(){finished=true;$('bar').style.width='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='Retry to improve your score';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3rem">⚡</div><h1>'+(correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><p>Remember: multiply powers with the same base by adding exponents; divide by subtracting them.</p></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ C
