s="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Mean, Median and Mode</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Mean, Median and Mode skills"><div class="skill-title">🎯 Mean, Median and Mode Skills</div><div class="skill-list"><div class="skill-item">Find the mean, median and mode of data</div><div class="skill-item">Order data and handle even or odd data sets</div><div class="skill-item">Calculate and interpret mean, median and mode</div></div></section></div><script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Find the mean of 4, 6 and 8.","o":["5","7","6","18"],"a":2,"e":"Mean = (4 + 6 + 8) ÷ 3 = 18 ÷ 3 = 6."},{"d":"BASIC","q":"Find the median of 3, 7, 5.","o":["3","5","7","15"],"a":1,"e":"Order the data: 3, 5, 7. The middle value is 5."},{"d":"BASIC","q":"Find the mode of 2, 4, 4, 5, 6.","o":["2","5","6","4"],"a":3,"e":"4 occurs most often, so the mode is 4."},{"d":"BASIC","q":"The marks are 6, 8, 10, 12. Find the mean.","o":["9","8","10","36"],"a":0,"e":"Mean = (6 + 8 + 10 + 12) ÷ 4 = 36 ÷ 4 = 9."},{"d":"BASIC","q":"Find the median of 2, 9, 4, 7, 5.","o":["4","7","5","9"],"a":2,"e":"Ordered data: 2, 4, 5, 7, 9. The middle value is 5."},{"d":"BASIC","q":"Which measure is the value that occurs most frequently?","o":["Mean","Mode","Median","Range"],"a":1,"e":"The mode is the value that appears most often."},{"d":"BASIC","q":"Find the mean of 10 and 14.","o":["10","14","24","12"],"a":3,"e":"Mean = (10 + 14) ÷ 2 = 12."},{"d":"BASIC","q":"Find the median of 3, 8, 1, 6.","o":["4.5","3","6","5"],"a":0,"e":"Order: 1, 3, 6, 8. Median = (3 + 6) ÷ 2 = 4.5."},{"d":"BASIC","q":"Find the mode of 7, 9, 7, 5, 9, 7.","o":["9","5","7","No mode"],"a":2,"e":"7 occurs three times, more than any other value."},{"d":"BASIC","q":"What is the mean of 5, 5, 5, 5?","o":["4","5","10","20"],"a":1,"e":"Mean = 20 ÷ 4 = 5."},{"d":"MEDIUM","q":"The scores are 12, 15, 10, 13, 20. Find the mean.","o":["13","15","70","14"],"a":3,"e":"Sum = 70; mean = 70 ÷ 5 = 14."},{"d":"MEDIUM","q":"Find the median of 14, 8, 11, 5, 20, 17.","o":["12.5","11","14","13"],"a":0,"e":"Ordered data: 5, 8, 11, 14, 17, 20. Median = (11 + 14) ÷ 2 = 12.5."},{"d":"MEDIUM","q":"The data are 3, 4, 4, 5, 6, 6, 6, 8. What is the mode?","o":["4","5","6","8"],"a":2,"e":"6 appears three times, the most frequent value."},{"d":"MEDIUM","q":"The mean of 5 numbers is 8. What is their total?","o":["13","40","8","35"],"a":1,"e":"Total = mean × number of values = 8 × 5 = 40."},{"d":"MEDIUM","q":"Four days of temperatures are 24°C, 26°C, 25°C and 29°C. Find the mean.","o":["25°C","27°C","104°C","26°C"],"a":3,"e":"Mean = (24 + 26 + 25 + 29) ÷ 4 = 104 ÷ 4 = 26°C."},{"d":"MEDIUM","q":"Find the median of 12, 15, 10, 18, 11, 14, 16.","o":["14","12","15","13"],"a":0,"e":"Ordered: 10, 11, 12, 14, 15, 16, 18. The middle value is 14."},{"d":"MEDIUM","q":"In a survey, 2, 5, 5, 5, 7, 8 are the number of books read. Find the mode.","o":["2","7","5","8"],"a":2,"e":"5 occurs three times, more than the other values."},{"d":"MEDIUM","q":"The mean of 4 numbers is 10. Three numbers are 8, 9 and 12. Find the fourth.","o":["10","11","9","12"],"a":1,"e":"Total = 4 × 10 = 40. Fourth number = 40 − (8 + 9 + 12) = 11."},{"d":"MEDIUM","q":"A student scores 7, 9, 8, 10 and 6. What is the median score?","o":["7","9","10","8"],"a":3,"e":"Ordered scores: 6, 7, 8, 9, 10. Median = 8."},{"d":"MEDIUM","q":"Which measure is usually most affected by one extremely large value?","o":["Mean","Median","Mode","All are always affected equally"],"a":0,"e":"The mean uses every value, so an extreme value can pull it strongly."},{"d":"HARD","q":"The mean of 6 numbers is 12. Five numbers sum to 55. Find the sixth number.","o":["12","15","17","72"],"a":2,"e":"Total = 6 × 12 = 72; sixth number = 72 − 55 = 17."},{"d":"HARD","q":"Find the median of 21, 13, 18, 9, 16, 25, 11, 20.","o":["16","17","18","16.5"],"a":1,"e":"Ordered: 9, 11, 13, 16, 18, 20, 21, 25. Median = (16 + 18) ÷ 2 = 17."},{"d":"HARD","q":"A team scored 8, 12, 10, 12, 15 and 3 points. Find the mean score.","o":["11","12","60","10"],"a":3,"e":"Sum = 60; mean = 60 ÷ 6 = 10."},{"d":"HARD","q":"The mean of 5 values is 16. If one value 20 is removed, what is the mean of the remaining four?","o":["15","16","14","20"],"a":0,"e":"Original total = 5 × 16 = 80. Remaining total = 80 − 20 = 60; mean = 60 ÷ 4 = 15."},{"d":"HARD","q":"The data are 4, 6, 6, 8, 10, 10, 10, 12. Which statement is correct?","o":["Median is 10","Mean is 10","Mode is 10","Mode is 6"],"a":2,"e":"10 occurs three times, so the mode is 10."},{"d":"HARD","q":"Five students read 2, 4, 6, 8 and 10 books. One more student reads 12 books. What is the new mean?","o":["6","7","8","42"],"a":1,"e":"New total = 2 + 4 + 6 + 8 + 10 + 12 = 42; mean = 42 ÷ 6 = 7."},{"d":"HARD","q":"A data set has mean 9 for 4 values. Three values are 7, 8 and 12. What is the missing value?","o":["8","10","36","9"],"a":3,"e":"Total = 4 × 9 = 36; missing value = 36 − (7 + 8 + 12) = 9."},{"d":"HARD","q":"The median of 5, 9, x, 14, 18 is 11, and the values are already in order. What is x?","o":["11","9","14","10"],"a":0,"e":"With five ordered values, the median is the third value, so x = 11."},{"d":"HARD","q":"A shop sold 3, 5, 5, 7, 10 and 12 items over six days. Find the mean number sold per day.","o":["6","8","7","42"],"a":2,"e":"Total = 42; mean = 42 ÷ 6 = 7."},{"d":"HARD","q":"A set of 5 numbers has mean 14. If each number increases by 3, what is the new mean?","o":["14","17","15","29"],"a":1,"e":"Adding 3 to every value increases the mean by 3: 14 + 3 = 17."}];;let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0,finished=false;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$ ('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const skills=[['Identify the operations needed in a word problem',8],['Use averages in practical situations',18],['Interpret averages and missing values',24]];$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">📏</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+skills.map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();</script>\n<script src="/shared-nav.js?v=20261013-universal-nav-v1"></script>\n</body></html>
