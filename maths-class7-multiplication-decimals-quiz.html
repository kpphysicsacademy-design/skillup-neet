s="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Multiplication of Decimals</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Multiplication of Decimals skills"><div class="skill-title">🎯 Multiplication of Decimals Skills</div><div class="skill-list"><div class="skill-item">Multiply decimals accurately</div><div class="skill-item">Understand decimal places in products</div><div class="skill-item">Apply decimal multiplication to practical problems</div></div></section></div><script>(function(){'use strict';const questions=[{"d":"BASIC","q":"What is 0.4 × 0.3?","o":["0.12","1.2","0.012","12"],"a":0,"e":"4 × 3 = 12; there are two decimal places in total, so the product is 0.12."},{"d":"BASIC","q":"Calculate 1.2 × 5.","o":["0.6","60","2.4","6"],"a":3,"e":"12 × 5 = 60, then place one decimal digit: 6.0 = 6."},{"d":"BASIC","q":"What is 2.5 × 4?","o":["100","6.5","10","1"],"a":2,"e":"25 × 4 = 100; placing one decimal digit gives 10.0 = 10."},{"d":"BASIC","q":"Find 0.6 × 0.2.","o":["12","0.12","1.2","0.012"],"a":1,"e":"6 × 2 = 12 with two decimal places, so the answer is 0.12."},{"d":"BASIC","q":"Calculate 3.4 × 2.","o":["6.8","68","0.68","5.4"],"a":0,"e":"34 × 2 = 68; put one decimal place back to get 6.8."},{"d":"BASIC","q":"What is 0.7 × 10?","o":["0.07","70","0.7","7"],"a":3,"e":"Multiplying by 10 moves the decimal point one place to the right."},{"d":"BASIC","q":"Calculate 1.5 × 0.1.","o":["15","0.015","0.15","1.5"],"a":2,"e":"Multiplying by 0.1 moves the decimal point one place to the left."},{"d":"BASIC","q":"Find 0.25 × 2.","o":["0.25","0.5","0.05","5"],"a":1,"e":"Two quarters make one half: 0.25 × 2 = 0.50."},{"d":"BASIC","q":"What is 4.2 × 0.1?","o":["0.42","4.2","42","0.042"],"a":0,"e":"Multiplying by 0.1 shifts the decimal point one place left."},{"d":"BASIC","q":"Calculate 0.8 × 0.5.","o":["4","0.04","1.3","0.4"],"a":3,"e":"8 × 5 = 40 with two decimal places, so 0.40 = 0.4."},{"d":"MEDIUM","q":"Find 1.25 × 4.","o":["50","4.25","5","0.5"],"a":2,"e":"125 × 4 = 500; with two decimal places the product is 5.00."},{"d":"MEDIUM","q":"Calculate 2.4 × 1.5.","o":["3.9","3.6","36","0.36"],"a":1,"e":"24 × 15 = 360. There are two decimal places in the factors, so the product is 3.60."},{"d":"MEDIUM","q":"What is 0.36 × 0.2?","o":["0.072","0.72","7.2","0.0072"],"a":0,"e":"36 × 2 = 72; three decimal places in total give 0.072."},{"d":"MEDIUM","q":"Calculate 3.25 × 0.4.","o":["13","0.13","1.625","1.3"],"a":3,"e":"325 × 4 = 1300; three decimal places give 1.300 = 1.3."},{"d":"MEDIUM","q":"Find 0.75 × 0.8.","o":["0.06","1.55","0.6","6"],"a":2,"e":"75 × 8 = 600; three decimal places give 0.600 = 0.6."},{"d":"MEDIUM","q":"A notebook costs ₹12.50. What do 3 notebooks cost?","o":["₹375","₹37.50","₹36.50","₹15.50"],"a":1,"e":"12.50 × 3 = ₹37.50."},{"d":"MEDIUM","q":"Calculate 4.08 × 2.","o":["8.16","81.6","0.816","6.08"],"a":0,"e":"408 × 2 = 816; two decimal places give 8.16."},{"d":"MEDIUM","q":"What is 0.125 × 8?","o":["0.1","10","0.01","1"],"a":3,"e":"125 × 8 = 1000; three decimal places give 1.000 = 1."},{"d":"MEDIUM","q":"Find 2.6 × 0.3.","o":["0.078","78","0.78","7.8"],"a":2,"e":"26 × 3 = 78; two decimal places give 0.78."},{"d":"MEDIUM","q":"Calculate 1.04 × 1.2.","o":["2.24","1.248","12.48","0.1248"],"a":1,"e":"104 × 12 = 1248; three decimal places in total give 1.248."},{"d":"HARD","q":"Calculate 2.35 × 1.6.","o":["3.76","37.6","0.376","3.95"],"a":0,"e":"235 × 16 = 3760; three decimal places give 3.760 = 3.76."},{"d":"HARD","q":"A 1.25-metre ribbon costs ₹8 per metre. What is its cost?","o":["₹9","₹12.50","₹1","₹10"],"a":3,"e":"1.25 × 8 = ₹10."},{"d":"HARD","q":"Find 0.48 × 0.25.","o":["0.012","12","0.12","1.2"],"a":2,"e":"0.25 is one quarter; one quarter of 0.48 is 0.12."},{"d":"HARD","q":"Calculate 3.6 × 2.25.","o":["6.85","8.1","81","0.81"],"a":1,"e":"36 × 225 = 8100; three decimal places give 8.100 = 8.1."},{"d":"HARD","q":"A rectangular card is 2.4 cm long and 1.5 cm wide. What is its area?","o":["3.6 cm²","3.9 cm²","36 cm²","0.36 cm²"],"a":0,"e":"Area = length × width = 2.4 × 1.5 = 3.6 cm²."},{"d":"HARD","q":"Calculate 0.064 × 0.5.","o":["0.32","0.0032","3.2","0.032"],"a":3,"e":"Multiplying by 0.5 is taking half; half of 0.064 is 0.032."},{"d":"HARD","q":"A machine produces 2.75 metres of wire each minute. How much wire does it produce in 12 minutes?","o":["30 m","27.5 m","33 m","3.3 m"],"a":2,"e":"2.75 × 12 = 2.75 × (10 + 2) = 27.5 + 5.5 = 33 m."},{"d":"HARD","q":"Find 1.08 × 2.5.","o":["3.58","2.7","27","0.27"],"a":1,"e":"2.5 is half of 5; 1.08 × 5 = 5.4, and half is 2.7."},{"d":"HARD","q":"A bottle contains 0.375 L. How much liquid is in 6 such bottles?","o":["2.25 L","22.5 L","0.225 L","1.875 L"],"a":0,"e":"0.375 × 6 = 2.250 = 2.25 L."},{"d":"HARD","q":"Calculate 4.125 × 0.8.","o":["33","0.33","3.8","3.3"],"a":3,"e":"4.125 × 8 = 33, then divide by 10 because 0.8 = 8/10; result 3.3."}];;let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0,finished=false;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').tex >📏</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+skills.map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();</script>
