{d:"MEDIUM",q:"Simplify: 2⁻² × 2⁵.",o:["2⁻¹⁰","2³","2⁷","1/2³"],a:1,e:"Add exponents with the same base: 2⁻² × 2⁵ = 2³."},
{d:"MEDIUM",q:"Simplify: 5³ ÷ 5⁵.",o:["5²","5⁸","5⁻²","1"],a:2,e:"Subtract exponents: 5³ ÷ 5⁵ = 5⁻² = 1/25."},
{d:"MEDIUM",q:"Evaluate: (1/2)⁻³.",o:["1/8","−8","8","−1/8"],a:2,e:"A negative exponent takes the reciprocal: (1/2)⁻³ = 2³ = 8."},

{d:"HARD",q:"Simplify: (−2)⁵ ÷ (−2)³.",o:["−4","4","−8","8"],a:1,e:"Subtract exponents: (−2)² = 4."},

again ↻';$('action').disabled=false;index=questions.length;}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Explanation: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();</script><script src="/shared-nav.js?v=20261017-duolingo-standard-v1"></script></body></html>
