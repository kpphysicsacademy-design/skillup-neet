<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Ratios and Percentages</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button" disabled>Check answer</button></div></section></main><section class="skill-panel"><div class="skill-title">🎯 Skills you will practise</div><div class="skill-list"><div class="skill-item">Understand ratios and equivalent comparisons</div><div class="skill-item">Convert fractions and decimals to percentages</div><div class="skill-item">Calculate percentage changes and values</div></div></section></div>
<script>(function(){'use strict';const questions=[{d:"BASIC",q:"What is the ratio of 2 red counters to 3 blue counters, in that order?",o:["2:3","3:2","2:5","5:2"],a:0,e:"Keep the order given: red to blue is 2:3."},{d:"BASIC",q:"Simplify the ratio 6:9.",o:["2:3","3:2","6:3","1:3"],a:0,e:"Divide both terms by their greatest common factor, 3."},{d:"BASIC",q:"What percentage means 25 out of 100?",o:["2.5%","25%","75%","250%"],a:1,e:"Percent means per hundred, so 25 out of 100 is 25%."},{d:"BASIC",q:"Convert 1/2 to a percentage.",o:["2%","5%","50%","100%"],a:2,e:"1/2 × 100% = 50%."},{d:"BASIC",q:"Convert 0.35 to a percentage.",o:["3.5%","35%","350%","0.35%"],a:1,e:"Multiply the decimal by 100: 0.35 × 100 = 35%."},{d:"BASIC",q:"Find 10% of 80.",o:["4","8","10","18"],a:1,e:"10% is one tenth; 80 ÷ 10 = 8."},{d:"BASIC",q:"A class has 12 boys and 18 girls. What is the ratio boys:girls in simplest form?",o:["2:3","3:2","12:30","1:2"],a:0,e:"12:18 simplifies by dividing both terms by 6."},{d:"BASIC",q:"Which fraction is equal to 20%?",o:["1/2","1/4","1/5","2/5"],a:2,e:"20/100 simplifies to 1/5."},{d:"BASIC",q:"Find 25% of 40.",o:["5","10","15","20"],a:1,e:"25% is one quarter; 40 ÷ 4 = 10."},{d:"BASIC",q:"If 3 pencils cost ₹15, what is the cost per pencil?",o:["₹3","₹5","₹12","₹45"],a:1,e:"₹15 ÷ 3 = ₹5 per pencil."},{d:"MEDIUM",q:"Simplify the ratio 24:36.",o:["2:3","3:2","4:9","12:18"],a:0,e:"Divide both terms by 12 to get 2:3."},{d:"MEDIUM",q:"Write 3:5 as a fraction in the same order.",o:["5/3","3/5","3/8","5/8"],a:1,e:"The ratio a:b corresponds to the fraction a/b."},{d:"MEDIUM",q:"A student scores 36 out of 45. What percentage is this?",o:["60%","75%","80%","90%"],a:2,e:"36/45 × 100% = 80%."},{d:"MEDIUM",q:"Increase 200 by 15%.",o:["215","220","230","250"],a:2,e:"15% of 200 is 30; 200 + 30 = 230."},{d:"MEDIUM",q:"Decrease 160 by 25%.",o:["100","120","130","140"],a:1,e:"25% of 160 is 40; 160 − 40 = 120."},{d:"MEDIUM",q:"A ₹500 item is discounted by 10%. What is its sale price?",o:["₹450","₹490","₹400","₹550"],a:0,e:"10% of ₹500 is ₹50; ₹500 − ₹50 = ₹450."},{d:"MEDIUM",q:"The ratio of apples to oranges is 4:7. If there are 28 oranges, how many apples are there?",o:["12","16","21","49"],a:1,e:"Seven ratio parts equal 28, so one part is 4; apples = 4 × 4 = 16."},{d:"MEDIUM",q:"Convert 3/8 to a percentage.",o:["27.5%","37.5%","38%","62.5%"],a:1,e:"3/8 = 0.375, which is 37.5%."},{d:"MEDIUM",q:"A value changes from 40 to 50. What is the percentage increase?",o:["10%","20%","25%","50%"],a:2,e:"Increase = 10; 10/40 × 100% = 25%."},{d:"MEDIUM",q:"What is 12.5% of 240?",o:["12","24","30","36"],a:2,e:"12.5% = 1/8; 240 ÷ 8 = 30."},{d:"HARD",q:["12","15","18","24"],o:["12","15","18","24"],a:1,e:"Total parts = 13; each part is 39 ÷ 13 = 3; smaller quantity = 5 × 3 = 15."},{d:"HARD",q:["20%","25%","30%","125%"],o:["20%","25%"," stored  30%"," calculated  125%"],a:1,e:"Increase = 20; 20/80 × 100% = 25%."},{d:"HARD",q:"After a 20% discount, a shirt costs ₹640. What was its original price?",o:["₹768","₹800","₹820","₹960"],a:1,e:"₹640 is 80% of the original; original = 640 ÷ 0.8 = ₹800."},{d:"HARD",q:"A quantity is reduced by 10% and then increased by 10%. Compared with the original, the final value is:",o:["Unchanged","1% lower","1% higher","10% lower"],a:1,e:"For 100: reduce to 90, then increase by 9 to 99, which is 1% lower."},{d:"HARD",q:"Two numbers are in ratio 7:9 and their difference is 10. Find their sum.",o:["70","75","80","90"],a:2,e:"Two parts differ by 2, so one part is 5; numbers are 35 and 45, sum 80."},{d:"HARD",q:"A test has 60 questions. A learner answers 45 correctly. What percentage are correct?",o:["65%","70%","75%","80%"],a:2,e:"45/60 × 100% = 75%."},{d:"HARD",q:"A price of ₹1,200 is increased by 5%. What is the new price?",o:["₹1,205","₹1,250","₹1,260","₹1,300"],a:2,e:"5% of ₹1,200 is ₹60; new price is ₹1,260."},{d:"HARD",q:"A recipe uses flour and sugar in ratio 5:2. If flour is 750 g, how much sugar is needed?",o:["150 g","250 g","300 g","375 g"],a:2,e:"Five parts = 750 g, so one part = 150 g; sugar = 2 × 150 = 300 g."},{d:"HARD",q:"A town's population grows from 8,000 to 8,600. What is the percentage increase?",o:["6%","7.5%","8%","12.5%"],a:1,e:"Increase = 600; 600/8000 × 100% = 7.5%."},{d:"HARD",q:"A student gets 72% of 250 marks. How many marks is that?",o:["160","170","180","190"],a:2,e:"72/100 × 250 = 180."}];;let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0,finished=false;const $=id=>document.getElementById(id);function progress(){let p=index/questions.length*100;$('bar').style.width=p+'%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · RATIOS AND PERCENTAGES';$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;progress();}function results(){finished=true;$('bar').style.width='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='Retry to improve your score';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3rem">⚡</div><h1>'+(correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><p>Remember: percent means per hundred; compare ratios by simplifying both terms.</p></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Explanation: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();</script><script src="/skillup-eye-shield.js?v=20261013-eye-shield-v1"></script><script src="/shared-nav.js?v=20261013-no-bottom-nav-v1"></script></body></html>
