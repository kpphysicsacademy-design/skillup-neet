<script>
(function(){
'use strict';
const questions=[{"q":"What does rotational symmetry mean?","o":["A shape matches itself after a turn less than 360°","A shape has a straight side","A shape has a right angle","A shape is always regular"],"a":0,"why":"A non-full turn can bring a rotationally symmetric shape exactly onto itself."},{"q":"How many times does a square match itself during one full 360° turn?","o":["1","2","4","8"],"a":2,"why":"A square matches at 90°, 180°, 270° and 360°; its order is 4."},{"q":"What is the smallest angle of rotation for a square?","o":["45°","60°","90°","180°"],"a":2,"why":"360° ÷ 4 = 90°."},{"q":"What is the order of rotational symmetry of an equilateral triangle?","o":["1","2","3","6"],"a":2,"why":"It matches three times during a full turn."},{"q":"What is the smallest angle of rotation for an equilateral triangle?","o":["60°","90°","120°","180°"],"a":2,"why":"360° ÷ 3 = 120°."},{"q":"What is the order of rotational symmetry of a non-square rectangle?","o":["1","2","3","4"],"a":1,"why":"It matches at 180° and again at 360°."},{"q":"A half-turn is equal to:","o":["45°","90°","120°","180°"],"a":3,"why":"Half of 360° is 180°."},{"q":"A quarter-turn is equal to:","o":["45°","90°","180°","270°"],"a":1,"why":"One quarter of 360° is 90°."},{"q":"What is the order of rotational symmetry of a circle?","o":["1","2","4","Infinitely many"],"a":3,"why":"A circle matches itself after rotation through any angle."},{"q":"Which shape usually has rotational symmetry of order 1 only?","o":["Square","Equilateral triangle","A non-square isosceles triangle","Regular hexagon"],"a":2,"why":"It does not match itself at any turn smaller than 360°."},{"q":"What is the smallest angle of rotation of a regular pentagon?","o":["36°","60°","72°","90°"],"a":2,"why":"360° ÷ 5 = 72°."},{"q":"What is the order of rotational symmetry of a regular hexagon?","o":["3","4","6","8"],"a":2,"why":"A regular hexagon matches six times during a full turn."},{"q":"Find the smallest angle of rotation of a regular hexagon.","o":["30°","45°","60°","120°"],"a":2,"why":"360° ÷ 6 = 60°."},{"q":"What is the order of rotational symmetry of a general parallelogram?","o":["1","2","3","4"],"a":1,"why":"A parallelogram maps onto itself after a half-turn."},{"q":"A regular octagon has smallest angle of rotation:","o":["30°","40°","45°","60°"],"a":2,"why":"360° ÷ 8 = 45°."},{"q":"If the order of rotational symmetry is 5, the smallest angle is:","o":["50°","60°","72°","90°"],"a":2,"why":"Smallest angle = 360° divided by the order."},{"q":"A shape matches itself at 120°, 240° and 360°. What is its order?","o":["2","3","4","6"],"a":1,"why":"There are three matching positions in a complete turn."},{"q":"Which statement about a square is correct?","o":["Order 2, smallest angle 180°","Order 3, smallest angle 120°","Order 4, smallest angle 90°","Order 6, smallest angle 60°"],"a":2,"why":"A square has four rotational matches and a 90° smallest angle."},{"q":"Which shape has rotational symmetry of order 2 but no reflection symmetry in its general form?","o":["General parallelogram","Square","Equilateral triangle","Regular hexagon"],"a":0,"why":"A general parallelogram has half-turn symmetry but usually no mirror line."},{"q":"What is the smallest angle of rotation of a regular decagon?","o":["18°","30°","36°","72°"],"a":2,"why":"360° ÷ 10 = 36°."},{"q":"A regular polygon has a smallest angle of rotation of 40°. How many sides does it have?","o":["6","8","9","10"],"a":2,"why":"360° ÷ 40° = 9, so it has 9 sides."},{"q":"A shape has rotational symmetry of order 8. Its smallest angle is:","o":["30°","40°","45°","60°"],"a":2,"why":"360° ÷ 8 = 45°."},{"q":"A shape's smallest rotational angle is 60°. What is its order?","o":["4","5","6","12"],"a":2,"why":"360° ÷ 60° = 6."},{"q":"After a 180° rotation, a design looks unchanged. Which must be true?","o":["Its order is at least 2","It has four reflection lines","It is a square","Its smallest angle is 90°"],"a":0,"why":"A half-turn gives at least one non-full-turn match, so order is at least 2."},{"q":"Which shape has order 4 and smallest rotational angle 90°?","o":["Rectangle that is not a square","Square","Regular triangle","Regular pentagon"],"a":1,"why":"A square has order 4 and 360° ÷ 4 = 90°."},{"q":"A regular polygon has order 12. Find its smallest angle of rotation.","o":["12°","15°","24°","30°"],"a":3,"why":"360° ÷ 12 = 30°."},{"q":"Which comparison is correct?","o":["Square: order 2; hexagon: order 4","Square: order 4; regular hexagon: order 6","Triangle: order 4; square: order 3","Pentagon: order 6; hexagon: order 5"],"a":1,"why":"For a regular n-sided polygon, rotational order equals n."},{"q":"A design matches at 90°, 180°, 270° and 360°. What is the order?","o":["2","3","4","5"],"a":2,"why":"There are four matching positions in one full rotation."},{"q":"A regular polygon has 9 sides. What is its smallest angle of rotation?","o":["30°","36°","40°","45°"],"a":2,"why":"360° ÷ 9 = 40°."},{"q":"Which statement distinguishes rotational symmetry from line symmetry?","o":["They always have the same order","Rotational symmetry tests turns; line symmetry tests reflection","A shape needs a line of symmetry to rotate","Only circles have rotational symmetry"],"a":1,"why":"Rotational symmetry concerns turning; line symmetry concerns mirror reflection."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Class 7 Rotational Symmetry Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-class7-rotational-symmetry-large-numbers-layout-v1" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 card.querySelector('.muted').insertAdjacentHTML('afterend','<p class="muted">Key idea: smallest angle of rotation = 360° ÷ order of rotational symmetry.</p>');
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
