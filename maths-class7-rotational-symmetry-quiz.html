<script>(function(){'use strict';const questions=[{d:"BASIC",q:"What does rotational symmetry mean?",o:["A shape matches itself after a turn less than 360°","A shape has a straight side","A shape has a right angle","A shape is always regular"],a:0,e:"A non-full turn can bring a rotationally symmetric shape exactly onto itself."},{d:"BASIC",q:"How many times does a square match itself during one full 360° turn?",o:["1","2","4","8"],a:2,e:"A square matches at 90°, 180°, 270° and 360°; its order is 4."},{d:"BASIC",q:"What is the smallest angle of rotation for a square?",o:["45°","60°","90°","180°"],a:2,e:"360° ÷ 4 = 90°."},{d:"BASIC",q:"What is the order of rotational symmetry of an equilateral triangle?",o:["1","2","3","6"],a:2,e:"It matches three times during a full turn."},{d:"BASIC",q:"What is the smallest angle of rotation for an equilateral triangle?",o:["60°","90°","120°","180°"],a:2,e:"360° ÷ 3 = 120°."},{d:"BASIC",q:"What is the order of rotational symmetry of a non-square rectangle?",o:["1","2","3","4"],a:1,e:"It matches at 180° and again at 360°."},{d:"BASIC",q:"A half-turn is equal to:",o:["45°","90°","120°","180°"],a:3,e:"Half of 360° is 180°."},{d:"BASIC",q:"A quarter-turn is equal to:",o:["45°","90°","180°","270°"],a:1,e:"One quarter of 360° is 90°."},{d:"BASIC",q:"What is the order of rotational symmetry of a circle?",o:["1","2","4","Infinitely many"],a:3,e:"A circle matches itself after rotation through any angle."},{d:"BASIC",q:"Which shape usually has rotational symmetry of order 1 only?",o:["Square","Equilateral triangle","A non-square isosceles triangle","Regular hexagon"],a:2,e:"It does not match itself at any turn smaller than 360°."},{d:"MEDIUM",q:"What is the smallest angle of rotation of a regular pentagon?",o:["36°","60°","72°","90°"],a:2,e:"360° ÷ 5 = 72°."},{d:"MEDIUM",q:"What is the order of rotational symmetry of a regular hexagon?",o:["3","4","6","8"],a:2,e:"A regular hexagon matches six times during a full turn."},{d:"MEDIUM",q:"Find the smallest angle of rotation of a regular hexagon.",o:["30°","45°","60°","120°"],a:2,e:"360° ÷ 6 = 60°."},{d:"MEDIUM",q:"What is the order of rotational symmetry of a general parallelogram?",o:["1","2","3","4"],a:1,e:"A parallelogram maps onto itself after a half-turn."},{d:"MEDIUM",q:"A regular octagon has smallest angle of rotation:",o:["30°","40°","45°","60°"],a:2,e:"360° ÷ 8 = 45°."},{d:"MEDIUM",q:"If the order of rotational symmetry is 5, the smallest angle is:",o:["50°","60°","72°","90°"],a:2,e:"Smallest angle = 360° divided by the order."},{d:"MEDIUM",q:"A shape matches itself at 120°, 240° and 360°. What is its order?",o:["2","3","4","6"],a:1,e:"There are three matching positions in a complete turn."},{d:"MEDIUM",q:"Which statement about a square is correct?",o:["Order 2, smallest angle 180°","Order 3, smallest angle 120°","Order 4, smallest angle 90°","Order 6, smallest angle 60°"],a:2,e:"A square has four rotational matches and a 90° smallest angle."},{d:"MEDIUM",q:"Which shape has rotational symmetry of order 2 but no reflection symmetry in its general form?",o:["General parallelogram","Square","Equilateral triangle","Regular hexagon"],a:0,e:"A general parallelogram has half-turn symmetry but usually no mirror line."},{d:"MEDIUM",q:"What is the smallest angle of rotation of a regular decagon?",o:["18°","30°","36°","72°"],a:2,e:"360° ÷ 10 = 36°."},{d:"HARD",q:"A regular polygon has a smallest angle of rotation of 40°. How many sides does it have?",o:["6","8","9","10"],a:2,e:"360° ÷ 40° = 9, so it has 9 sides."},{d:"HARD",q:"A shape has rotational symmetry of order 8. Its smallest angle is:",o:["30°","40°","45°","60°"],a:2,e:"360° ÷ 8 = 45°."},{d:"HARD",q:"A shape's smallest rotational angle is 60°. What is its order?",o:["4","5","6","12"],a:2,e:"360° ÷ 60° = 6."},{d:"HARD",q:"After a 180° rotation, a design looks unchanged. Which must be true?",o:["Its order is at least 2","It has four reflection lines","It is a square","Its smallest angle is 90°"],a:0,e:"A half-turn gives at least one non-full-turn match, so order is at least 2."},{d:"HARD",q:"Which shape has order 4 and smallest rotational angle 90°?",o:["Rectangle that is not a square","Square","Regular triangle","Regular pentagon"],a:1,e:"A square has order 4 and 360° ÷ 4 = 90°."},{d:"HARD",q:"A regular polygon has order 12. Find its smallest angle of rotation.",o:["12°","15°","24°","30°"],a:3,e:"360° ÷ 12 = 30°."},{d:"HARD",q:"Which comparison is correct?",o:["Square: order 2; hexagon: order 4","Square: order 4; regular hexagon: order 6","Triangle: order 4; square: order 3","Pentagon: order 6; hexagon: order 5"],a:1,e:"For a regular n-sided polygon, rotational order equals n."},{d:"HARD",q:"A design matches at 90°, 180°, 270° and 360°. What is the order?",o:["2","3","4","5"],a:2,e:"There are four matching positions in one full rotation."},{d:"HARD",q:"A regular polygon has 9 sides. What is its smallest angle of rotation?",o:["30°","36°","40°","45°"],a:2,e:"360° ÷ 9 = 40°."},{d:"HARD",q:"Which statement distinguishes rotational symmetry from line symmetry?",o:["They always have the same order","Rotational symmetry tests turns; line symmetry tests reflection","A shape needs a line of symmetry to rotate","Only circles have rotational symmetry"],a:1,e:"Rotational symmetry concerns turning; line symmetry concerns mirror reflection."}];;let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0,finished=false;const $=id=>document.getElementById(id);function progress(){let p=index/questions.length*100;$('bar').style.width=p+'%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · ROTATIONAL SYMMETRY';$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;progress();}function results(){finished=true;$('bar').style.width='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='Retry to improve your score';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3rem">⚡</div><h1>'+(correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><p>Remember: the smallest angle of rotation equals 360° divided by the order.</p></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Explanation: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();</script><script src="/skillup-eye-shield.js?v=20261013-eye-shield-v1"></script><script src="/shared-nav.js?v=20261013-no-bottom-nav-v1"></script></body></html>
