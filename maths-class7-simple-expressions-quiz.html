<script>
(function(){
'use strict';
const questions=[
{d:"BASIC",q:"Which expression represents 5 more than x?",o:["5x","x − 5","x + 5","5 − x"],a:2,e:"'5 more than x' means add 5 to x: x + 5."},
{d:"BASIC",q:"Which expression means 3 times n?",o:["n + 3","3n","n − 3","n ÷ 3"],a:1,e:"Multiplication is written without the × sign: 3 × n = 3n."},
{d:"BASIC",q:"Write 'a number y decreased by 7' as an expression.",o:["7 − y","y + 7","7y","y − 7"],a:3,e:"Decreased by 7 means subtract 7 from y: y − 7."},
{d:"BASIC",q:"Which expression represents half of p?",o:["p − 2","2p","p/2","p + 2"],a:2,e:"Half of p is p divided by 2, written p/2."},
{d:"BASIC",q:"If x = 4, find x + 6.",o:["2","10","24","46"],a:1,e:"Substitute x = 4: x + 6 = 4 + 6 = 10."},
{d:"BASIC",q:"If a = 3, find 4a.",o:["7","12","43","64"],a:1,e:"4a = 4 × a = 4 × 3 = 12."},
{d:"BASIC",q:"Which expression represents the perimeter of a square with side s?",o:["s + 4","2s","4s","s²"],a:2,e:"A square has four equal sides, so its perimeter is s + s + s + s = 4s."},
{d:"BASIC",q:"If m = 5, evaluate 2m + 1.",o:["11","12","15","21"],a:0,e:"2m + 1 = 2 × 5 + 1 = 11."},
{d:"BASIC",q:"Which expression means the sum of x and twice y?",o:["2(x + y)","x + 2y","2x + y","xy + 2"],a:1,e:"Twice y is 2y; adding x gives x + 2y."},
{d:"BASIC",q:"If t = 6, evaluate t − 2.",o:["3","4","8","12"],a:1,e:"Substitute t = 6: 6 − 2 = 4."},
{d:"MEDIUM",q:"A pen costs ₹p. Write the cost of 7 pens.",o:["p + 7","7 + p","7p","p/7"],a:2,e:"Seven pens cost 7 × p = 7p rupees."},
{d:"MEDIUM",q:"A number x is multiplied by 4, then 3 is added. Which expression represents this?",o:["4(x + 3)","4x + 3","x + 12","3x + 4"],a:1,e:"First multiply x by 4 to get 4x, then add 3: 4x + 3."},
{d:"MEDIUM",q:"If x = 2 and y = 5, evaluate 3x + 2y.",o:["16","21","13","17"],a:0,e:"3(2) + 2(5) = 6 + 10 = 16."},
{d:"MEDIUM",q:"Which expression represents 8 less than twice n?",o:["2(n − 8)","8 − 2n","2n − 8","8n − 2"],a:2,e:"Twice n is 2n; 8 less than that is 2n − 8."},
{d:"MEDIUM",q:"If a = 4, evaluate 2(a + 3).",o:["14","11","20","8"],a:0,e:"2(a + 3) = 2(4 + 3) = 2 × 7 = 14."},
{d:"MEDIUM",q:"A rectangle has length l and width w. Which expression gives its perimeter?",o:["lw","l + w","2l + w","2(l + w)"],a:3,e:"Perimeter = l + w + l + w = 2l + 2w = 2(l + w)."},
{d:"MEDIUM",q:"If x = 3, evaluate x² + 2.",o:["8","11","15","25"],a:1,e:"x² + 2 = 3² + 2 = 9 + 2 = 11."},
{d:"MEDIUM",q:"Which expression represents the total of ₹x and ₹y shared equally by 2 people?",o:["2(x + y)","(x + y)/2","x + y/2","xy/2"],a:1,e:"First find the total x + y, then divide the total by 2."},
{d:"MEDIUM",q:"If p = 7, evaluate 5p − 9.",o:["26","35","44","16"],a:0,e:"5 × 7 − 9 = 35 − 9 = 26."},
{d:"MEDIUM",q:"The age of Riya is x years. Her brother is 3 years older. What is their combined age?",o:["2x + 3","x + 3","3x","2x − 3"],a:0,e:"Brother's age is x + 3. Together: x + (x + 3) = 2x + 3."},
{d:"HARD",q:"If x = 3, evaluate 2x² − 4x + 5.",o:["11","5","17","23"],a:0,e:"2(3²) − 4(3) + 5 = 18 − 12 + 5 = 11."},
{d:"HARD",q:"A taxi charges ₹50 fixed plus ₹12 per kilometre. What is the cost for k kilometres?",o:["50k + 12","12(k + 50)","50 + 12k","62k"],a:2,e:"The total is the fixed charge plus the distance charge: 50 + 12k."},
{d:"HARD",q:"Simplify the expression for the sum of three consecutive integers starting at n.",o:["3n + 3","n + 3","3n + 6","3n + 2"],a:0,e:"The integers are n, n + 1, n + 2. Their sum is 3n + 3."},
{d:"HARD",q:"If a = 2 and b = 4, evaluate 3(a + b) − ab.",o:["6","10","18","14"],a:1,e:"3(2 + 4) − (2 × 4) = 18 − 8 = 10."},
{d:"HARD",q:"A rectangle's length is (x + 4) cm and width is x cm. Write its area.",o:["2x + 4","x² + 4","x(x + 4)","2(x + 4)"],a:2,e:"Area = length × width = (x + 4) × x = x(x + 4) cm²."},
{d:"HARD",q:"If m = −2, evaluate 3m² + 2m.",o:["8","16","−16","−8"],a:0,e:"3(−2)² + 2(−2) = 3(4) − 4 = 8."},
{d:"HARD",q:"Which expression is equivalent to 5(x − 2) + 3?",o:["5x − 7","5x − 10","5x − 13","8x − 2"],a:0,e:"Expand: 5x − 10 + 3 = 5x − 7."},
{d:"HARD",q:"A number is first increased by 6, then the result is doubled. Which expression represents the result?",o:["2x + 6","x + 12","2(x + 6)","x/2 + 6"],a:2,e:"Increase x by 6 to get x + 6, then double the whole result: 2(x + 6)."},
{d:"HARD",q:"If x = 4, evaluate (x + 2)(x − 1).",o:["18","24","14","12"],a:0,e:"(4 + 2)(4 − 1) = 6 × 3 = 18."},
{d:"HARD",q:"A student has x stickers and gets 3 packs of 8 more stickers. Which expression gives the total?",o:["x + 3 + 8","3x + 8","x + 24","8x + 3"],a:2,e:"Three packs contain 3 × 8 = 24 stickers, so the total is x + 24."}
];
let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;
const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');
function updateProgress(){const p=index>=questions.length?100:index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}
function render(){
 if(index>=questions.length){results();return;}
 const q=questions[index];selected=-1;locked=false;
 $('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;
 $('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · CLASS 7 SIMPLE EXPRESSIONS';
 $('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';
 const content=$('content');content.replaceChildren();
 const question=document.createElement('div');question.className='question';question.textContent=q.q;content.appendChild(question);
 const choices=document.createElement('div');choices.className='choices';content.appendChild(choices);
 q.o.forEach((answer,i)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.dataset.i=String(i);b.textContent=answer;b.addEventListener('click',()=>{if(locked)return;selected=i;choices.querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===i));$('action').disabled=false;});choices.appendChild(b);});
 $('action').textContent='Check answer';$('action').disabled=true;updateProgress();
}
function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;if(window.skillupCelebrate)window.skillupCelebrate();xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===selected&&!good)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Explanation: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();}else results();}
function results(){finished=true;updateProgress();$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='🏆 Class 7 Simple Expressions complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const content=$('content');content.replaceChildren();const end=document.createElement('div');end.className='end';const trophy=document.createElement('div');trophy.style.fontSize='3.2rem';trophy.textContent='🏆';end.appendChild(trophy);const title=document.createElement('h1');title.textContent=correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!';end.appendChild(title);const score=document.createElement('div');score.className='score';score.textContent=correct+' / '+questions.length;end.appendChild(score);const p=document.createElement('p');p.textContent='You answered '+correct+' questions correctly.';end.appendChild(p);const summary=document.createElement('div');summary.className='summary';summary.innerHTML='⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining';end.appendChild(summary);const skills=document.createElement('div');skills.className='skills';[['🔤','Translate words into algebra','Represent statements with expressions'],['🧮','Substitute and evaluate','Follow order of operations'],['📐','Model real-world quantities','Use expressions in practical problems']].forEach(item=>{const row=document.createElement('div');row.className='skill';const icon=document.createElement('span');icon.className='skill-icon';icon.textContent=item[0];const info=document.createElement('div');const strong=document.createElement('strong');strong.textContent=item[1];const small=document.createElement('small');small.textContent=item[2];info.append(strong,small);row.append(icon,info);skills.appendChild(row);});end.appendChild(skills);content.appendChild(end);$('action').textContent='Try again ↻';$('action').disabled=false;}
function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}
$('action').addEventListener('click',()=>{if(finished)restart();else act();});
