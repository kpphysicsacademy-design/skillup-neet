<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261014-class7-simple-expressions-v1"><title>Class 7 Simple Algebraic Expressions | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Simple Expressions</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button" disabled>Check answer</button></div></section></main><section class="skill-panel"><div class="skill-title">🎯 Skills you will practise</div><div class="skill-list"><div class="skill-item">Translate words into algebra</div><div class="skill-item">Evaluate expressions by substitution</div><div class="skill-item">Use brackets and operations correctly</div></div></section></div>
<script>(function(){'use strict';const questions=[
{d:"BASIC",q:"Which expression represents 5 more than x?",o:["5x","x − 5","x + 5","5 − x"],a:2,e:"'5 more than x' means add 5 to x: x + 5."},
{d:"BASIC",q:"Which expression means 3 times n?",o:["n + 3","3n","n − 3","n ÷ 3"],a:1,e:"Multiplication is written without the × sign: 3 × n = 3n."},
{d:"BASIC",q:"Write 'a number y decreased by 7' as an expression.",o:["7 − y","y + 7","7y","y − 7"],a:3,e:"Decreased by 7 means subtract 7 from y: y − 7."},
{d:"BASIC",q:"Which expression represents half of p?",o:["p − 2","2p","p/2","p + 2"],a:2,e:"Half of p is p divided by 2, written p/2."},
{d:"BASIC",q:"If x = 4, find x + 6.",o:["2","10","24","46"],a:1,e:"Substitute x = 4: x + 6 = 4 + 6 = 10."},
{d:"BASIC",q:"If a = 3, find 4a.",o:["7","12","43","64"],a:1,e:"4a = 4 × a = 4 × 3 = 12."},
{d:"BASIC",q:"Which expression represents the perimeter of a square with side s?",o:["s + 4","2s","4s","s²"],a:2,e:"A square has four equal sides, so its perimeter is s + s + s + s = 4s."},
{d:"BASIC",q:"If m = 5, evaluate 2m + 1.",o:["11","12","15","21"],a:0,e:"2m + 1 = 2 × 5 + 1 = 11."},
{d:"BASIC",q:"Which expression means the sum of x and twice y?",o:["2(x + y)","x + 2y","2x + y","xy + 2"],a:1,e:"Twice y is 2y; adding x gives x + 2y."},
{d:"BASIC",q:"If t = 6, evaluate t − 2.",o:["3","4","8","12"],a:1,e:"Substitute t = 6: 6 − 2 = 4."},
{d:"MEDIUM",q:"A pen costs ₹p. Write the cost of 7 pens.",o:["p + 7","7 + p","7p","p/7"],a:2,e:"Seven pens cost 7 × p = 7p rupees."},
{d:"MEDIUM",q:"A number x is multiplied by 4, then 3 is added. Which expression represents this?",o:["4(x + 3)","4x + 3","x + 12","3x + 4"],a:1,e:"First multiply x by 4 to get 4x, then add 3: 4x + 3."},
{d:"MEDIUM",q:"If x = 2 and y = 5, evaluate 3x + 2y.",o:["16","21","13","17"],a:0,e:"3(2) + 2(5) = 6 + 10 = 16."},
{d:"MEDIUM",q:"Which expression represents 8 less than twice n?",o:["2(n − 8)","8 − 2n","2n − 8","8n − 2"],a:2,e:"Twice n is 2n; 8 less than that is 2n − 8."},
{d:"MEDIUM",q:"If a = 4, evaluate 2(a + 3).",o:["14","11","20","8"],a:0,e:"2(a + 3) = 2(4 + 3) = 2 × 7 = 14."},
{d:"MEDIUM",q:"A rectangle has length l and width w. Which expression gives its perimeter?",o:["lw","l + w","2l + w","2(l + w)"],a:3,e:"Perimeter = l + w + l + w = 2l + 2w = 2(l + w)."},
{d:"MEDIUM",q:"If x = 3, evaluate x² + 2.",o:["8","11","15","25"],a:1,e:"x² + 2 = 3² + 2 = 9 + 2 = 11."},
{d:"MEDIUM",q:"Which expression represents the total of ₹x and ₹y shared equally by 2 people?",o:["2(x + y)","(x + y)/2","x + y/2","xy/2"],a:1,e:"First find the total x + y, then divide the total by 2."},
{d:"MEDIUM",q:"If p = 7, evaluate 5p − 9.",o:["26","35","44","16"],a:0,e:"5 × 7 − 9 = 35 − 9 = 26."},
{d:"MEDIUM",q:"The age of Riya is x years. Her brother is 3 years older. What is their combined age?",o:["2x + 3","x + 3","3x","2x − 3"],a:0,e:"Brother's age is x + 3. Together: x + (x + 3) = 2x + 3."},
{d:"HARD",q:"If x = 3, evaluate 2x² − 4x + 5.",o:["11","5","17","23"],a:0,e:"2(3²) − 4(3) + 5 = 18 − 12 + 5 = 11."},
{d:"HARD",q:"A taxi charges ₹50 fixed plus ₹12 per kilometre. What is the cost for k kilometres?",o:["50k + 12","12(k + 50)","50 + 12k","62k"],a:2,e:"The total is the fixed charge plus the distance charge: 50 + 12k."},
{d:"HARD",q:"Simplify the expression for the sum of three consecutive integers starting at n.",o:["3n + 3","n + 3","3n + 6","3n + 2"],a:0,e:"The integers are n, n + 1, n + 2. Their sum is 3n + 3."},
{d:"HARD",q:"If a = 2 and b = 4, evaluate 3(a + b) − ab.",o:["6","10","18","14"],a:1,e:"3(2 + 4) − (2 × 4) = 18 − 8 = 10."},
{d:"HARD",q:"A rectangle's length is (x + 4) cm and width is x cm. Write its area.",o:["2x + 4","x² + 4","x(x + 4)","2(x + 4)"],a:2,e:"Area = length × width = (x + 4) × x = x(x + 4) cm²."},
{d:"HARD",q:"If m = −2, evaluate 3m² + 2m.",o:["8","16","−16","−8"],a:0,e:"3(−2)² + 2(−2) = 3(4) − 4 = 8."},
{d:"HARD",q:"Which expression is equivalent to 5(x − 2) + 3?",o:["5x − 7","5x − 10","5x − 13","8x − 2"],a:0,e:"Expand: 5x − 10 + 3 = 5x − 7."},
{d:"HARD",q:"A number is first increased by 6, then the result is doubled. Which expression represents the result?",o:["2x + 6","x + 12","2(x + 6)","x/2 + 6"],a:2,e:"Increase x by 6 to get x + 6, then double the whole result: 2(x + 6)."},
{d:"HARD",q:"If x = 4, evaluate (x + 2)(x − 1).",o:["18","24","14","12"],a:0,e:"(4 + 2)(4 − 1) = 6 × 3 = 18."},
{d:"HARD",q:"A student has x stickers and gets 3 packs of 8 more stickers. Which expression gives the total?",o:["x + 3 + 8","3x + 8","x + 24","8x + 3"],a:2,e:"Three packs contain 3 × 8 = 24 stickers, so the total is x + 24."}
];let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0,finished=false;const $=id=>document.getElementById(id);function progress(){let p=index/questions.length*100;$('bar').style.width=p+'%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · SIMPLE EXPRESSIONS';$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;progress();}function results(){finished=true;$('bar').style.width='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='Retry to improve your score';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3rem">🧮</div><h1>'+(correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><p>Translate carefully, substitute values, and follow the order of operations.</p></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Explanation: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();</script><script src="/skillup-eye-shield.js?v=20261013-eye-shield-v1"></script><script src="/shared-nav.js?v=20261013-no-bottom-nav-v1"></script></body></html>
