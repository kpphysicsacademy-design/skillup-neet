<style>
:root{--ink:#233047;--muted:#68758b;--line:#e2e8f0;--blue:#3478c8;--teal:#159b83;--bg:#f5f7fb;--soft:#edf4ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#fff;border-bottom:1px solid var(--line)}.top{max-width:760px;margin:auto;min-height:52px;padding:8px 14px;display:flex;align-items:center;gap:10px}.back{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--blue)}main{width:min(100% - 26px,700px);margin:auto;padding:18px 0 36px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:11px}.hero{background:linear-gradient(120deg,#fff,#eaf5ff)}h1{font-size:clamp(23px,5vw,31px);margin:4px 0 6px}h2{font-size:17px;margin:0 0 10px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{padding:10px;border:1px solid var(--line);border-radius:11px}.field label{display:flex;justify-content:space-between;gap:6px;font-size:13px;font-weight:750}.field output{color:var(--blue);font-weight:900}.field input{width:100%;accent-color:var(--blue);margin:9px 0 0}.select{padding:10px;border:1px solid var(--line);border-radius:10px;font-weight:750;max-width:100%}.display{padding:20px 10px;text-align:center;background:#f7faff;border:1px solid var(--line);border-radius:13px;font-size:clamp(26px,6vw,38px);font-weight:900;overflow-wrap:anywhere}.result{padding:13px;border-radius:11px;background:var(--soft);margin-top:10px}.answer{font-size:25px;font-weight:900;color:#087d68}.btn{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:10px 13px;font-weight:850;cursor:pointer}.btn.alt{background:#eaf7ff;color:#116b96;border:1px solid #b8deed}.links{display:flex;gap:10px;flex-wrap:wrap}.links a{font-size:13px;color:#116b96;font-weight:800;text-decoration:none}@media(max-width:480 </style></head><body><header><div class="top"><a class="back" href="maths-class7-simple-expressions-quiz.html?v=20261117-simple-expressions-quiz-v2">←</a><strong>SkillUp <span style="color:#159b83">Maths</span></strong></div></header><main>
<section class="hero"><h1>Simple Expressions Simulator</h1><p class="muted">Change the numbers and variable value. Watch the expression and its value update instantly.</p></section>
<section class="card"><h2>Build an expression</h2><div class="controls">
<div class="field"><label for="a">Coefficient a <output id="av">3</output></label><input id="a" type="range" min="-9" max="9" value="3"></div>
<div class="field"><label for="b">Constant b <output id="bv">5</output></label><input id="b" type="range" min="-9" max="9" value="5"></div>
<div class="field"><label for="x">Value of x <output id="xv">2</output></label><input id="x" type="range" min="-10" max="10" value="2"></div>
<div class="field"><label for="op">Operation</label><select id="op" class="select"><option value="+">Add constant (+)</option><option value="-">Subtract constant (−)</option><option value="*">Multiply by constant (×)</option></select></div>
</div></section>
<section class="card"><h2>Your expression</h2><div class="display" id="expr">3x + 5</div><div class="result"><div class="muted">Substitute x = <strong id="sub">2</strong></div><div class="answer" id="value">11</div><p class="muted" id="steps">3 × 2 + 5 = 11</p></div></section>
<section class="card"><h2>Try an example</h2><button class="btn" id="plus" type="button">x + 5</button> <button class="btn alt" id="minus" type="button">3x − 2</button> <button class="btn alt" id="times" type="button">4x × 2</button></section>
<section class="card"><div class="links"><a href="maths-class7-simple-expressions-learn.html?v=20261117-simple-expressions-learn-v1">📘 Simple lesson</a><a href="maths-class7-simple-expressions-quiz.html?v=20261117-simple-expressions-quiz-v2">📝 30-question quiz</a></div></section>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);function fmt(n){return n<0?'−'+Math.abs(n):String(n)}function render(){const a=Number($('a').value),b=Number($('b').value),x=Number($('x').value),op=$('op').value;['a','b','x'].forEach(k=>$(k+'v').textContent=$(k).value);$('sub').textContent=x;let expr=fmt(a)+'x '+(op==='-'?'−':op==='+'?'+':'×')+' '+fmt(b);if(op==='*')expr=fmt(a)+'x × '+fmt(b);$('expr').textContent=expr;let val=op==='+'?a*x+b:op==='-'?a*x-b:a*x*b;$('value').textContent=fmt(val);$('steps').textContent=op==='+'?a+' × ('+x+') + ('+b+') = '+val:op==='-'?a+' × ('+x+') − ('+b+') = '+val:a+' × ('+x+') × '+b+' = '+val;}['a','b','x','op'].forEach(k=>$(k).addEventListener('input',render));function preset(a,b,op){$('a').value=a;$('b').value=b;$('op').value=op;render()}$('plus').addEventListener('click',()=>preset(1,5,'+'));$('minus').addEventListener('click',()=>preset(3,2,'-'));$('times').addEventListener('click',()=>preset(4,2,'*'));render()})();
</script></body></html>
