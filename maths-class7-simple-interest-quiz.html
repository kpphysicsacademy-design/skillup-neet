<section class="skill-panel"><div class="skill-title">🎯 Simple Interest Skills</div><div class="skill-list"><div class="skill-item">Identify principal, rate and time</div><div class="skill-item">Calculate simple interest and amount</div><div class="skill-item">Solve everyday money problems</div></div></section></div>
<script>
(function(){'use strict';
const questions=[
{d:"BASIC",q:"What is the formula for simple interest (SI)?",o:["P + R + T","P × R × T ÷ 100","P × 100 ÷ R × T","P × R + T"],a:1,e:"Simple interest = (Principal × Rate × Time) ÷ 100 when rate is annual and time is in years."},
{d:"BASIC",q:"Find the simple interest on ₹1,000 at 5% per year for 1 year.",o:["₹5","₹50","₹100","₹500"],a:1,e:"SI = 1000 × 5 × 1 ÷ 100 = ₹50."},
{d:"BASIC",q:"In the formula SI = PRT/100, what does P represent?",o:["Profit","Percentage","Principal","Period only"],a:2,e:"P is the principal: the original amount borrowed or invested."},
{d:"BASIC",q:"₹2,000 is invested at 10% per year for 1 year. What is the SI?",o:["₹20","₹200","₹2,100","₹1,000"],a:1,e:"SI = 2000 × 10 × 1 ÷ 100 = ₹200."},
{d:"BASIC",q:"If the principal is ₹500, rate is 4% per year and time is 1 year, the SI is:",o:["₹20","₹50","₹4","₹100"],a:0,e:"SI = 500 × 4 × 1 ÷ 100 = ₹20."},
{d:"BASIC",q:"What is the amount after simple interest?",o:["Principal − SI","Principal × SI","Principal + SI","SI − Principal"],a:2,e:"Amount = Principal + Simple Interest."},
{d:"BASIC",q:"Find the amount on ₹1,000 after earning ₹80 simple interest.",o:["₹920","₹1,008","₹1,080","₹1,800"],a:2,e:"Amount = ₹1,000 + ₹80 = ₹1,080."},
{d:"BASIC",q:"A rate of 6% per annum means interest of how much per year on ₹100?",o:["₹6","₹60","₹0.60","₹106"],a:0,e:"6% of ₹100 is ₹6 per year."},
{d:"BASIC",q:"For a fixed principal and rate, if time doubles, simple interest will:",o:["Become half","Double","Stay the same","Become zero"],a:1,e:"SI is directly proportional to time when principal and rate are fixed."},
{d:"BASIC",q:"How many months are in 2 years?",o:["12","18","24","36"],a:2,e:"2 years × 12 months per year = 24 months."},
{d:"MEDIUM",q:"Find SI on ₹3,000 at 5% per year for 2 years.",o:["₹150","₹300","₹600","₹3,300"],a:1,e:"SI = 3000 × 5 × 2 ÷ 100 = ₹300."},
{d:"MEDIUM",q:"Find the amount on ₹2,500 at 4% per year for 2 years under simple interest.",o:["₹200","₹2,600","₹2,700","₹2,900"],a:2,e:"SI = 2500 × 4 × 2 ÷ 100 = ₹200; amount = ₹2,700."},
{d:"MEDIUM",q:"₹1,200 earns ₹180 simple interest in 3 years. What is the annual rate?",o:["3%","4%","5%","6%"],a:2,e:"R = SI × 100 ÷ (P × T) = 180 × 100 ÷ (1200 × 3) = 5%."},
{d:"MEDIUM",q:"At 8% simple interest per year, how much interest does ₹750 earn in 2 years?",o:["₹60","₹120","₹150","₹870"],a:1,e:"SI = 750 × 8 × 2 ÷ 100 = ₹120."},
{d:"MEDIUM",q:"Find the simple interest on ₹4,000 at 6% per year for 6 months.",o:["₹120","₹240","₹480","₹1,440"],a:0,e:"6 months = 1/2 year. SI = 4000 × 6 × 0.5 ÷ 100 = ₹120."},
{d:"MEDIUM",q:"A sum of ₹2,000 earns ₹400 SI at 10% per year. For how many years was it invested?",o:["1 year","2 years","3 years","4 years"],a:1,e:"T = SI × 100 ÷ (P × R) = 400 × 100 ÷ (2000 × 10) = 2 years."},
{d:"MEDIUM",q:"What is the total amount on ₹5,000 at 3% per year for 2 years?",o:["₹300","₹5,150","₹5,300","₹5,600"],a:2,e:"SI = 5000 × 3 × 2 ÷ 100 = ₹300; amount = ₹5,300."},
{d:"MEDIUM",q:"₹800 is borrowed at 5% simple interest for 9 months. Find the interest.",o:["₹30","₹40","₹45","₹60"],a:2,e:"9 months = 0.75 year. SI = 800 × 5 × 0.75 ÷ 100 = ₹30."},
{d:"MEDIUM",q:"A principal of ₹1,500 earns ₹225 SI in 3 years. Find the rate per year.",o:["4%","5%","6%","7.5%"],a:1,e:"R = 225 × 100 ÷ (1500 × 3) = 5% per year."},
{d:"MEDIUM",q:"At 10% simple interest, how long will ₹600 take to earn ₹120 interest?",o:["1 year","2 years","3 years","4 years"],a:1,e:"T = 120 × 100 ÷ (600 × 10) = 2 years."},
{d:"HARD",q:"The SI on a sum at 7% per year for 4 years is ₹560. Find the principal.",o:["₹1,000","₹1,500","₹2,000","₹2,500"],a:2,e:"P = SI × 100 ÷ (R × T) = 560 × 100 ÷ (7 × 4) = ₹2,000."},
{d:"HARD",q:"A sum amounts to ₹2,400 after 2 years at 10% simple interest. What was the principal?",o:["₹2,000","₹2,100","₹2,200","₹2,400"],a:0,e:"Amount = P(1 + RT/100) = 1.2P, so P = 2400 ÷ 1.2 = ₹2,000."},
{d:"HARD",q:"₹3,600 earns ₹648 simple interest in 3 years. Find the annual rate.",o:["4%","5%","6%","8%"],a:2,e:"R = 648 × 100 ÷ (3600 × 3) = 6%."},
{d:"HARD",q:"A loan of ₹8,000 is taken at 7.5% per year for 2 years. What amount must be repaid under simple interest?",o:["₹1,200","₹8,600","₹9,200","₹9,500"],a:2,e:"SI = 8000 × 7.5 × 2 ÷ 100 = ₹1,200; amount = ₹9,200."},
{d:"HARD",q:"The simple interest for 5 years at 4% per year is ₹600. Find the principal.",o:["₹2,000","₹2,500","₹3,000","₹3,500"],a:2,e:"P = 600 × 100 ÷ (4 × 5) = ₹3,000."},
{d:"HARD",q:"At what annual rate will ₹2,400 earn ₹576 simple interest in 4 years?",o:["4%","5%","6%","8%"],a:2,e:"R = 576 × 100 ÷ (2400 × 4) = 6%."},
{d:"HARD",q:"A person borrows ₹12,000 at 8% per year. How much SI is due after 15 months?",o:["₹960","₹1,000","₹1,200","₹1,440"],a:2,e:"15 months = 1.25 years. SI = 12000 × 8 × 1.25 ÷ 100 = ₹1,200."},
{d:"HARD",q:"The amount on a principal is ₹4,800 after 2 years and ₹5,400 after 5 years at simple interest. Find the annual interest.",o:["₹100","₹150","₹200","₹300"],a:3,e:"The amount increases by ₹600 over 3 years, so interest per year = ₹600 ÷ 3 = ₹200."},
{d:"HARD",q:"A sum earns ₹900 SI in 5 years at 6% per year. What is the total amount at the end?",o:["₹3,000","₹3,600","₹3,900","₹4,500"],a:1,e:"P = 900 × 100 ÷ (6 × 5) = ₹3,000; amount = ₹3,900."},
{d:"HARD",q:"₹5,000 is split into two parts. One part earns 5% SI and the other 8% SI for one year. If total interest is ₹340, how much was invested at 8%?",o:["₹1,000","₹2,000","₹3,000","₹4,000"],a:2,e:"Let x be at 8%; 0.08x + 0.05(5000 − x) = 340, so 0.03x = 90 and x = ₹3,000."}
];
let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0,finished=false;
const $=id=>document.getElementById(id);
function updateProgress(){const p=index/questions.length*100;$('bar').style.width=p+'%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(p)));}
function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · SIMPLE INTEREST';$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}
function results(){finished=true;$('bar').style.width='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='Retry to improve your score';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3rem">💰</div><h1>'+(correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><p>Review the formula and explanations, then try again.</p></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}
function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Explanation: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}
function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}
$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();
})();
</script><script src="/shared-nav.js?v=20261017-duolingo-standard-v1"></script></body></html>
