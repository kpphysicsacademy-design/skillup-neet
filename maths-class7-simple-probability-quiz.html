s="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Simple Probability</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Simple Probability skills"><div class="skill-title">🎯 Simple Probability Skills</div><div class="skill-list"><div class="skill-item">Count favourable and total equally likely outcomes</div><div class="skill-item">Explore coins, dice, spinners and counters</div><div class="skill-item">Calculate the chance of simple events</div></div></section></div><script>(function(){'use strict';const questions=[{"d":"BASIC","q":"A fair coin is tossed once. What is the probability of getting heads?","o":["1/4","1","1/2","0"],"a":2,"e":"One of two equally likely outcomes is heads, so P(heads) = 1/2."},{"d":"BASIC","q":"A fair six-sided die is rolled. What is the probability of rolling a 3?","o":["1/3","1/6","1/2","3/6"],"a":1,"e":"There is one favourable outcome among six equally likely outcomes."},{"d":"BASIC","q":"A bag contains 3 red balls and 2 blue balls. What is the probability of picking a blue ball?","o":["3/5","1/2","2/3","2/5"],"a":3,"e":"There are 2 blue balls out of 5 balls in total."},{"d":"BASIC","q":"Which probability value describes an impossible event?","o":["0","1/2","1","2"],"a":0,"e":"An impossible event has probability 0."},{"d":"BASIC","q":"Which probability value describes a certain event?","o":["0","1/2","1","2"],"a":2,"e":"A certain event is guaranteed, so its probability is 1."},{"d":"BASIC","q":"A spinner has 4 equal sections numbered 1, 2, 3 and 4. What is the probability of landing on 2?","o":["1/2","1/4","1","3/4"],"a":1,"e":"One of four equal sections is numbered 2."},{"d":"BASIC","q":"A box contains 5 green counters and 5 yellow counters. Probability of green is:","o":["1/5","1/10","5/4","1/2"],"a":3,"e":"5 out of 10 counters are green, so 5/10 = 1/2."},{"d":"BASIC","q":"A die is rolled. What is the probability of getting a number greater than 4?","o":["1/3","1/2","2/3","1/6"],"a":0,"e":"The favourable outcomes are 5 and 6: 2/6 = 1/3."},{"d":"BASIC","q":"A card is selected from cards numbered 1 to 10. What is the probability of choosing 7?","o":["1/7","7/10","1/10","1/2"],"a":2,"e":"Only one of the ten cards is numbered 7."},{"d":"BASIC","q":"A bag contains only red balls. What is the probability of picking a red ball?","o":["0","1","1/2","1/4"],"a":1,"e":"Every ball is red, so the event is certain."},{"d":"MEDIUM","q":"A die is rolled. What is the probability of getting an even number?","o":["1/3","2/3","1/6","1/2"],"a":3,"e":"Even outcomes are 2, 4 and 6: 3/6 = 1/2."},{"d":"MEDIUM","q":"A bag has 4 red, 3 blue and 5 green balls. What is the probability of selecting red?","o":["1/3","1/4","4/5","4/12"],"a":0,"e":"There are 4 red out of 12 total balls, so 4/12 = 1/3."},{"d":"MEDIUM","q":"Cards numbered 1 to 12 are mixed. What is the probability of choosing a multiple of 3?","o":["1/4","1/2","1/3","1/6"],"a":2,"e":"Multiples of 3 are 3, 6, 9 and 12: 4/12 = 1/3."},{"d":"MEDIUM","q":"A fair coin is tossed twice. What is the probability of getting heads both times?","o":["1/2","1/4","3/4","1"],"a":1,"e":"The equally likely outcomes are HH, HT, TH and TT; only HH works."},{"d":"MEDIUM","q":"A spinner has 8 equal sections, 3 yellow and 5 purple. What is the probability of not landing on yellow?","o":["3/8","1/8","1/2","5/8"],"a":3,"e":"The five purple sections are not yellow, giving 5/8."},{"d":"MEDIUM","q":"A number is selected at random from 1 to 20. What is the probability it is a factor of 20?","o":["3/10","1/4","1/2","1/10"],"a":0,"e":"Factors of 20 are 1, 2, 4, 5, 10 and 20: 6/20 = 3/10."},{"d":"MEDIUM","q":"A bag has 2 white and 6 black marbles. Probability of picking a white marble is:","o":["1/3","1/2","1/4","3/4"],"a":2,"e":"2 out of 8 = 1/4."},{"d":"MEDIUM","q":"A fair die is rolled. Probability of getting a number less than 5 is:","o":["1/2","2/3","1/3","5/6"],"a":1,"e":"Outcomes 1, 2, 3, 4: 4/6 = 2/3."},{"d":"MEDIUM","q":"A box contains 10 cards, 4 marked A and 6 marked B. One card is drawn. Probability of B is:","o":["2/5","1/5","1/2","3/5"],"a":3,"e":"6/10 = 3/5."},{"d":"MEDIUM","q":"A coin is tossed once. Probability of not getting tails is:","o":["1/2","0","1","1/4"],"a":0,"e":"Not tails means heads, with probability 1/2."},{"d":"HARD","q":"A bag contains 5 red, 4 blue and 3 yellow balls. Probability of choosing neither red nor yellow is:","o":["1/4","5/12","1/3","2/3"],"a":2,"e":"Only blue is neither red nor yellow: 4/12 = 1/3."},{"d":"HARD","q":"Cards numbered 1 to 15 are mixed. Probability of drawing a number divisible by 2 or 5 is:","o":["1/2","3/5","2/5","2/3"],"a":1,"e":"Even numbers: 7; multiples of 5: 3; overlap 10 counted twice, so 7 + 3 − 1 = 9. Probability = 9/15 = 3/5."},{"d":"HARD","q":"A fair die is rolled. Probability of getting a prime number is:","o":["1/3","2/3","5/6","1/2"],"a":3,"e":"Prime outcomes are 2, 3 and 5: 3/6 = 1/2."},{"d":"HARD","q":"A coin is tossed twice. Probability of getting exactly one head is:","o":["1/2","1/4","3/4","1"],"a":0,"e":"HT and TH are favourable out of four equally likely outcomes: 2/4 = 1/2."},{"d":"HARD","q":"A bag has 3 red and 7 blue balls. One ball is picked, replaced, then another is picked. Probability both are red is:","o":["3/10","6/100","9/100","49/100"],"a":2,"e":"With replacement, P(red twice) = 3/10 × 3/10 = 9/100."},{"d":"HARD","q":"A card is chosen from 1 to 30. Probability of selecting a multiple of 4 is:","o":["1/4","7/30","3/10","1/5"],"a":1,"e":"Multiples are 4, 8, 12, 16, 20, 24, 28: 7 of 30."},{"d":"HARD","q":"A spinner has 10 equal sections, 4 numbered 1, 3 numbered 2 and 3 numbered 3. Probability of landing on a number greater than 1 is:","o":["2/5","1/2","7/10","3/5"],"a":3,"e":"Numbers greater than 1 occupy 3 + 3 = 6 sections, so 6/10 = 3/5."},{"d":"HARD","q":"A bag contains 6 red, 5 green and 4 blue tokens. Probability of selecting a token that is not green is:","o":["2/3","1/3","5/15","3/5"],"a":0,"e":"Not green means red or blue: (6 + 4)/15 = 2/3."},{"d":"HARD","q":"A fair die is rolled. Probability of not rolling a 1 or 6 is:","o":["1/3","1/2","2/3","5/6"],"a":2,"e":"Favourable outcomes are 2, 3, 4, 5: 4/6 = 2/3."},{"d":"HARD","q":"A box has 12 tickets numbered 1 to 12. Probability of drawing a number that is a factor of 12 is:","o":["1/3","1/2","1/4","2/3"],"a":1,"e":"Factors are 1, 2, 3, 4, 6, 12: 6 of 12, so 1/2."}];;let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0,finished=false;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$ ('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const skills=[['Identify the operations needed in a word problem',8],['Express probabilities as fractions and compare likelihoods',18],['Interpret averages and missing values',24]];$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">📏</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+skills.map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();</script>
