<p class="muted">Chance and likelihood · Outcomes · Probability in simple events</p>

<script>
(function(){
'use strict';
const questions=[{"q":"A fair coin is tossed once. What is the probability of getting heads?","o":["1/4","1","1/2","0"],"a":2,"why":"One of two equally likely outcomes is heads, so P(heads) = 1/2."},{"q":"A fair six-sided die is rolled. What is the probability of rolling a 3?","o":["1/3","1/6","1/2","3/6"],"a":1,"why":"There is one favourable outcome among six equally likely outcomes."},{"q":"A bag contains 3 red balls and 2 blue balls. What is the probability of picking a blue ball?","o":["3/5","1/2","2/3","2/5"],"a":3,"why":"There are 2 blue balls out of 5 balls in total."},{"q":"Which probability value describes an impossible event?","o":["0","1/2","1","2"],"a":0,"why":"An impossible event has probability 0."},{"q":"Which probability value describes a certain event?","o":["0","1/2","1","2"],"a":2,"why":"A certain event is guaranteed, so its probability is 1."},{"q":"A spinner has 4 equal sections numbered 1, 2, 3 and 4. What is the probability of landing on 2?","o":["1/2","1/4","1","3/4"],"a":1,"why":"One of four equal sections is numbered 2."},{"q":"A box contains 5 green counters and 5 yellow counters. Probability of green is:","o":["1/5","1/10","5/4","1/2"],"a":3,"why":"5 out of 10 counters are green, so 5/10 = 1/2."},{"q":"A die is rolled. What is the probability of getting a number greater than 4?","o":["1/3","1/2","2/3","1/6"],"a":0,"why":"The favourable outcomes are 5 and 6: 2/6 = 1/3."},{"q":"A card is selected from cards numbered 1 to 10. What is the probability of choosing 7?","o":["1/7","7/10","1/10","1/2"],"a":2,"why":"Only one of the ten cards is numbered 7."},{"q":"A bag contains only red balls. What is the probability of picking a red ball?","o":["0","1","1/2","1/4"],"a":1,"why":"Every ball is red, so the event is certain."},{"q":"A die is rolled. What is the probability of getting an even number?","o":["1/3","2/3","1/6","1/2"],"a":3,"why":"Even outcomes are 2, 4 and 6: 3/6 = 1/2."},{"q":"A bag has 4 red, 3 blue and 5 green balls. What is the probability of selecting red?","o":["1/3","1/4","4/5","4/12"],"a":0,"why":"There are 4 red out of 12 total balls, so 4/12 = 1/3."},{"q":"Cards numbered 1 to 12 are mixed. What is the probability of choosing a multiple of 3?","o":["1/4","1/2","1/3","1/6"],"a":2,"why":"Multiples of 3 are 3, 6, 9 and 12: 4/12 = 1/3."},{"q":"A fair coin is tossed twice. What is the probability of getting heads both times?","o":["1/2","1/4","3/4","1"],"a":1,"why":"The equally likely outcomes are HH, HT, TH and TT; only HH works."},{"q":"A spinner has 8 equal sections, 3 yellow and 5 purple. What is the probability of not landing on yellow?","o":["3/8","1/8","1/2","5/8"],"a":3,"why":"The five purple sections are not yellow, giving 5/8."},{"q":"A number is selected at random from 1 to 20. What is the probability it is a factor of 20?","o":["3/10","1/4","1/2","1/10"],"a":0,"why":"Factors of 20 are 1, 2, 4, 5, 10 and 20: 6/20 = 3/10."},{"q":"A bag has 2 white and 6 black marbles. Probability of picking a white marble is:","o":["1/3","1/2","1/4","3/4"],"a":2,"why":"2 out of 8 = 1/4."},{"q":"A fair die is rolled. Probability of getting a number less than 5 is:","o":["1/2","2/3","1/3","5/6"],"a":1,"why":"Outcomes 1, 2, 3, 4: 4/6 = 2/3."},{"q":"A box contains 10 cards, 4 marked A and 6 marked B. One card is drawn. Probability of B is:","o":["2/5","1/5","1/2","3/5"],"a":3,"why":"6/10 = 3/5."},{"q":"A coin is tossed once. Probability of not getting tails is:","o":["1/2","0","1","1/4"],"a":0,"why":"Not tails means heads, with probability 1/2."},{"q":"A bag contains 5 red, 4 blue and 3 yellow balls. Probability of choosing neither red nor yellow is:","o":["1/4","5/12","1/3","2/3"],"a":2,"why":"Only blue is neither red nor yellow: 4/12 = 1/3."},{"q":"Cards numbered 1 to 15 are mixed. Probability of drawing a number divisible by 2 or 5 is:","o":["1/2","3/5","2/5","2/3"],"a":1,"why":"Even numbers: 7; multiples of 5: 3; overlap 10 counted twice, so 7 + 3 − 1 = 9. Probability = 9/15 = 3/5."},{"q":"A fair die is rolled. Probability of getting a prime number is:","o":["1/3","2/3","5/6","1/2"],"a":3,"why":"Prime outcomes are 2, 3 and 5: 3/6 = 1/2."},{"q":"A coin is tossed twice. Probability of getting exactly one head is:","o":["1/2","1/4","3/4","1"],"a":0,"why":"HT and TH are favourable out of four equally likely outcomes: 2/4 = 1/2."},{"q":"A bag has 3 red and 7 blue balls. One ball is picked, replaced, then another is picked. Probability both are red is:","o":["3/10","6/100","9/100","49/100"],"a":2,"why":"With replacement, P(red twice) = 3/10 × 3/10 = 9/100."},{"q":"A card is chosen from 1 to 30. Probability of selecting a multiple of 4 is:","o":["1/4","7/30","3/10","1/5"],"a":1,"why":"Multiples are 4, 8, 12, 16, 20, 24, 28: 7 of 30."},{"q":"A spinner has 10 equal sections, 4 numbered 1, 3 numbered 2 and 3 numbered 3. Probability of landing on a number greater than 1 is:","o":["2/5","1/2","7/10","3/5"],"a":3,"why":"Numbers greater than 1 occupy 3 + 3 = 6 sections, so 6/10 = 3/5."},{"q":"A bag contains 6 red, 5 green and 4 blue tokens. Probability of selecting a token that is not green is:","o":["2/3","1/3","5/15","3/5"],"a":0,"why":"Not green means red or blue: (6 + 4)/15 = 2/3."},{"q":"A fair die is rolled. Probability of not rolling a 1 or 6 is:","o":["1/3","1/2","2/3","5/6"],"a":2,"why":"Favourable outcomes are 2, 3, 4, 5: 4/6 = 2/3."},{"q":"A box has 12 tickets numbered 1 to 12. Probability of drawing a number that is a factor of 12 is:","o":["1/3","1/2","1/4","2/3"],"a":1,"why":"Factors are 1, 2, 3, 4, 6, 12: 6 of 12, so 1/2."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Simple Probability Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261104-physics-path-layout-v2" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
