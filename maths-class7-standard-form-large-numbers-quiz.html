<script>(function(){'use strict';const questions=[
{d:"BASIC",q:"Write 5,000 in standard form.",o:["5 × 10³","5 × 10²","50 × 10³","5 × 10⁴"],a:0,e:"5,000 = 5 × 1,000 = 5 × 10³."},
{d:"BASIC",q:"Write 72,000 in standard form.",o:["7.2 × 10³","72 × 10³","7.2 × 10⁴","0.72 × 10⁵"],a:2,e:"72,000 = 7.2 × 10⁴; the first factor is between 1 and 10."},
{d:"BASIC",q:"Write 3.6 × 10² as an ordinary number.",o:["36","360","3,600","0.036"],a:1,e:"10² = 100, so 3.6 × 100 = 360."},
{d:"BASIC",q:"What is 10⁴?",o:["100","1,000","10,000","100,000"],a:2,e:"10⁴ = 10 × 10 × 10 × 10 = 10,000."},
{d:"BASIC",q:"Write 0.004 in standard form.",o:["4 × 10⁻²","4 × 10⁻³","4 × 10³","0.4 × 10⁻²"],a:1,e:"Move the decimal 3 places right to get 4, so the exponent is −3."},
{d:"BASIC",q:"Write 6.2 × 10³ as an ordinary number.",o:["620","6,200","62,000","0.0062"],a:1,e:"Multiplying by 1,000 moves the decimal three places right: 6,200."},
{d:"BASIC",q:"Which is the standard form of 900,000?",o:["9 × 10⁴","9 × 10⁵","90 × 10⁵","0.9 × 10⁶"],a:1,e:"900,000 = 9 × 100,000 = 9 × 10⁵."},
{d:"BASIC",q:"Write 0.07 in standard form.",o:["7 × 10⁻¹","7 × 10⁻²","7 × 10²","0.7 × 10⁻²"],a:1,e:"Move the decimal two places right to obtain 7; exponent is −2."},
{d:"BASIC",q:"In 4.5 × 10⁶, what is the power of 10?",o:["4.5","6","10","45"],a:1,e:"The exponent of 10 is 6."},
{d:"BASIC",q:"Which number equals 8 × 10¹?",o:["8","18","80","800"],a:2,e:"8 × 10 = 80."},
{d:"MEDIUM",q:"Write 3,450,000 in standard form.",o:["3.45 × 10⁵","34.5 × 10⁵","3.45 × 10⁶","0.345 × 10⁷"],a:2,e:"Move the decimal six places left: 3,450,000 = 3.45 × 10⁶."},
{d:"MEDIUM",q:"Write 0.00082 in standard form.",o:["8.2 × 10⁻⁴","8.2 × 10⁻⁵","82 × 10⁻⁴","8.2 × 10⁴"],a:0,e:"Moving the decimal four places right gives 8.2, so the exponent is −4."},
{d:"MEDIUM",q:"Evaluate 2.4 × 10⁵.",o:["24,000","240,000","2,400,000","0.000024"],a:1,e:"10⁵ = 100,000; 2.4 × 100,000 = 240,000."},
{d:"MEDIUM",q:"Write 56,700 in standard form.",o:["5.67 × 10⁴","56.7 × 10³","5.67 × 10³","0.567 × 10⁵"],a:0,e:"56,700 = 5.67 × 10⁴."},
{d:"MEDIUM",q:"Write 9.03 × 10⁻² as a decimal.",o:["0.903","0.0903","0.00903","903"],a:1,e:"A power of 10 with exponent −2 moves the decimal two places left: 0.0903."},
{d:"MEDIUM",q:"Which is greater: 4.2 × 10⁴ or 3.9 × 10⁵?",o:["4.2 × 10⁴","3.9 × 10⁵","They are equal","Cannot compare"],a:1,e:"3.9 × 10⁵ = 390,000, while 4.2 × 10⁴ = 42,000."},
{d:"MEDIUM",q:"Write 0.000006 in standard form.",o:["6 × 10⁻⁵","6 × 10⁻⁶","6 × 10⁶","0.6 × 10⁻⁵"],a:1,e:"Move the decimal six places right to obtain 6: 6 × 10⁻⁶."},
{d:"MEDIUM",q:"Write 7.08 × 10⁴ as an ordinary number.",o:["708","7,080","70,800","708,000"],a:2,e:"Move the decimal four places right: 70,800."},
{d:"MEDIUM",q:"Which is correctly written in standard form?",o:["12 × 10⁴","0.8 × 10⁵","8 × 10⁴","0.08 × 10⁶"],a:2,e:"In standard form the first factor must be at least 1 and less than 10; 8 × 10⁴ fits."},
{d:"MEDIUM",q:"Express 640,000 as a number × power of 10.",o:["64 × 10⁴","6.4 × 10⁵","0.64 × 10⁶","640 × 10³"],a:1,e:"640,000 = 6.4 × 100,000 = 6.4 × 10⁵."},
{d:"HARD",q:"Calculate (3 × 10⁴) × (2 × 10³).",o:["6 × 10⁷","5 × 10⁷","6 × 10¹²","6 × 10¹"],a:0,e:"Multiply coefficients and add exponents: 3 × 2 = 6 and 10⁴ × 10³ = 10⁷."},
{d:"HARD",q:"Calculate (8 × 10⁶) ÷ (2 × 10²).",o:["4 × 10³","4 × 10⁴","6 × 10⁴","4 × 10⁸"],a:1,e:"Divide coefficients and subtract exponents: 8/2 = 4 and 10⁶⁻² = 10⁴."},
{d:"HARD",q:"Write 0.0000475 in standard form.",o:["4.75 × 10⁻⁴","4.75 × 10⁻⁵","47.5 × 10⁻⁶","4.75 × 10⁵"],a:1,e:"The decimal moves five places right to become 4.75, so use 10⁻⁵."},
{d:"HARD",q:"A distance is 1.5 × 10⁸ km. Write it as an ordinary number.",o:["15,000,000 km","150,000,000 km","1,500,000,000 km","150,000 km"],a:1,e:"1.5 × 100,000,000 = 150,000,000 km."},
{d:"HARD",q:"Simplify (4.8 × 10⁷) ÷ (1.2 × 10³).",o:["4 × 10⁴","4 × 10¹⁰","5.76 × 10⁴","4 × 10³"],a:0,e:"4.8 ÷ 1.2 = 4 and 10⁷ ÷ 10³ = 10⁴."},
{d:"HARD",q:"Write 0.00000091 in standard form.",o:["9.1 × 10⁻⁶","9.1 × 10⁻⁷","9.1 × 10⁷","0.91 × 10⁻⁶"],a:1,e:"Move the decimal seven places right to get 9.1, so exponent −7."},
{d:"HARD",q:"Which is the smallest number?",o:["2.5 × 10⁻³","7 × 10⁻⁴","9 × 10⁻²","1.2 × 10⁻³"],a:1,e:"7 × 10⁻⁴ = 0.0007, smaller than the other values."},
{d:"HARD",q:"Calculate (6 × 10⁵) × (3 × 10⁻²).",o:["18 × 10³ = 1.8 × 10⁴","18 × 10⁻¹⁰","9 × 10³","2 × 10⁷"],a:0,e:"Multiply coefficients and add exponents: 18 × 10³ = 1.8 × 10⁴ in standard form."},
{d:"HARD",q:"Write 5,040,000,000 in standard form.",o:["5.04 × 10⁸","5.04 × 10⁹","50.4 × 10⁸","0.504 × 10¹⁰"],a:1,e:"5,040,000,000 = 5.04 × 10⁹."},
{d:"HARD",q:"A tiny object is 0.0000032 m long. How is this written in standard form?",o:["3.2 × 10⁻⁵ m","3.2 × 10⁻⁶ m","32 × 10⁻⁷ m","3.2 × 10⁶ m"],a:1,e:"Move the decimal six places right to obtain 3.2, giving 3.2 × 10⁻⁶ m."}
];;let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0,finished=false;const $=id=>document.getElementById(id);function progress(){let p=index/questions.length*100;$('bar').style.width=p+'%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · STANDARD FORM OF LARGE NUMBERS';$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;progress();}function results(){finished=true;$('bar').style.width='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='Retry to improve your score';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3rem">⚡</div><h1>'+(correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><p>Remember: multiply powers with the same base by adding exponents; divide by subtracting them.</p></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Explanation: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();</script><script src="/shared-nav.js?v=20261017-duolingo-standard-v1"></script></body></html>
