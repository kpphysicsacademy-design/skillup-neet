<script>
(function(){
'use strict';
const questions=[{"q":"Ravi buys 3 notebooks at ₹12.50 each. How much does he pay?","o":["₹35.50","₹15.50","₹37.50","₹375"],"a":2,"why":"Total cost = 3 × ₹12.50 = ₹37.50."},{"q":"A bottle holds 1.5 L of water. How much water is in 4 bottles?","o":["5.5 L","6 L","0.6 L","60 L"],"a":1,"why":"1.5 × 4 = 6 litres."},{"q":"Meena has 3/4 of a pizza and eats 1/4 of a pizza. How much is left?","o":["2/4 pizza","3/8 pizza","1 pizza","1/2 pizza"],"a":3,"why":"3/4 − 1/4 = 2/4 = 1/2 pizza."},{"q":"A ribbon is 2.4 m long. If 0.8 m is used, how much remains?","o":["1.6 m","1.8 m","3.2 m","0.16 m"],"a":0,"why":"2.4 − 0.8 = 1.6 m."},{"q":"A recipe uses 1/2 cup of milk per batch. How much milk is needed for 3 batches?","o":["1 cup","2 cups","1 1/2 cups","3/2 cups only"],"a":2,"why":"3 × 1/2 = 3/2 = 1 1/2 cups."},{"q":"A 5.6 kg bag of rice is shared equally among 4 families. How much does each get?","o":["14 kg","1.4 kg","0.14 kg","2.4 kg"],"a":1,"why":"5.6 ÷ 4 = 1.4 kg."},{"q":"A book costs ₹85. How much do 2 books and a ₹15 pen cost altogether?","o":["₹170","₹100","₹200","₹185"],"a":3,"why":"2 × ₹85 + ₹15 = ₹170 + ₹15 = ₹185."},{"q":"A tank is 2/3 full. Then 1/6 of the tank's capacity is used. What fraction remains?","o":["1/2","1/3","5/6","1/6"],"a":0,"why":"2/3 − 1/6 = 4/6 − 1/6 = 3/6 = 1/2."},{"q":"A cyclist rides 2.5 km in the morning and 3.75 km in the evening. What is the total distance?","o":["5.25 km","6.15 km","6.25 km","62.5 km"],"a":2,"why":"2.5 + 3.75 = 6.25 km."},{"q":"Each packet weighs 0.25 kg. What is the total weight of 8 packets?","o":["0.2 kg","2 kg","20 kg","2.5 kg"],"a":1,"why":"8 × 0.25 = 2 kg."},{"q":"A shopkeeper has 12.5 kg of sugar and packs it into 0.5 kg bags. How many bags can be filled?","o":["2.5","250","20","25"],"a":3,"why":"12.5 ÷ 0.5 = 125 ÷ 5 = 25 bags."},{"q":"A recipe needs 3/4 cup of flour per cake. How much flour is needed for 6 cakes?","o":["4 1/2 cups","3 1/2 cups","4 cups","6 3/4 cups"],"a":0,"why":"6 × 3/4 = 18/4 = 4 1/2 cups."},{"q":"A 9.6 m rope is cut into pieces of 1.2 m. How many pieces are obtained?","o":["7","80","8","9"],"a":2,"why":"9.6 ÷ 1.2 = 96 ÷ 12 = 8 pieces."},{"q":"Anita spends ₹125.50 on food and ₹78.25 on travel. If she had ₹300, how much remains?","o":["₹103.75","₹96.25","₹203.75","₹221.25"],"a":1,"why":"₹125.50 + ₹78.25 = ₹203.75; ₹300 − ₹203.75 = ₹96.25."},{"q":"A garden is 4.5 m long and 2 m wide. What is its area?","o":["6.5 m²","13 m²","9 m","9 m²"],"a":3,"why":"Area = 4.5 × 2 = 9 m²."},{"q":"A water jug contains 2.4 L. Each glass holds 0.3 L. How many full glasses can be filled?","o":["8","0.8","80","7"],"a":0,"why":"2.4 ÷ 0.3 = 24 ÷ 3 = 8 glasses."},{"q":"A student reads 2/5 of a book on Monday and 1/4 on Tuesday. What fraction has been read altogether?","o":["3/9","3/20","13/20","1/2"],"a":2,"why":"2/5 + 1/4 = 8/20 + 5/20 = 13/20."},{"q":"A 5 kg box of apples costs ₹450. What is the cost per kilogram?","o":["₹45","₹90","₹100","₹225"],"a":1,"why":"₹450 ÷ 5 = ₹90 per kg."},{"q":"A car travels 48.6 km in 0.9 hours. What is its average speed?","o":["5.4 km/h","43.74 km/h","45 km/h","54 km/h"],"a":3,"why":"48.6 ÷ 0.9 = 486 ÷ 9 = 54 km/h."},{"q":"A baker has 4 1/2 kg of dough. Each loaf needs 3/4 kg. How many loaves can be made?","o":["6","5","8","3"],"a":0,"why":"4 1/2 ÷ 3/4 = 9/2 × 4/3 = 6 loaves."},{"q":"A school buys 24 notebooks at ₹18.75 each and receives a ₹50 discount. What is the final bill?","o":["₹450","₹500","₹400","₹350"],"a":2,"why":"24 × ₹18.75 = ₹450; ₹450 − ₹50 = ₹400."},{"q":"A farmer uses 2/3 of a field for rice and 1/4 for vegetables. What fraction of the field is left unused?","o":["11/12","1/12","5/7","1/6"],"a":1,"why":"Used = 2/3 + 1/4 = 8/12 + 3/12 = 11/12; left = 1/12."},{"q":"A 15.75 m wire is cut into pieces of 0.45 m. How many complete pieces are made?","o":["3.5","45","30","35"],"a":3,"why":"15.75 ÷ 0.45 = 1575 ÷ 45 = 35 pieces."},{"q":"A water tank contains 18.5 L. A family uses 2.75 L each day for 4 days. How much water remains?","o":["7.5 L","11 L","8.5 L","6.5 L"],"a":0,"why":"Used = 2.75 × 4 = 11 L; remaining = 18.5 − 11 = 7.5 L."},{"q":"A tailor has 8 1/2 m of cloth. Each shirt needs 1 1/4 m. How many complete shirts can be made?","o":["7","8","6","5"],"a":2,"why":"8 1/2 ÷ 1 1/4 = 17/2 × 4/5 = 6.8, so 6 complete shirts."},{"q":"A family buys 2.4 kg of apples at ₹120/kg and 1.5 kg of oranges at ₹80/kg. What is the total cost?","o":["₹368","₹408","₹4080","₹288"],"a":1,"why":"Apples: 2.4 × 120 = ₹288; oranges: 1.5 × 80 = ₹120; total ₹408."},{"q":"A runner completes 3/5 of a 10 km route, then runs another 1.5 km. How far has the runner travelled?","o":["6.5 km","7 km","8.5 km","7.5 km"],"a":3,"why":"3/5 × 10 = 6 km; 6 + 1.5 = 7.5 km."},{"q":"A tank is 3/4 full and holds 80 L when full. After 18 L is used, how much water remains?","o":["42 L","60 L","62 L","38 L"],"a":0,"why":"Initial water = 3/4 × 80 = 60 L; remaining = 60 − 18 = 42 L."},{"q":"A shop packs 7.2 kg of nuts into bags of 0.18 kg. If 5 bags are sold, how many bags remain?","o":["40","45","35","30"],"a":2,"why":"Total bags = 7.2 ÷ 0.18 = 40; remaining = 40 − 5 = 35 bags."},{"q":"A school trip costs ₹1,250 for a bus plus ₹85.50 per student. If 20 students share the cost equally, what is the cost per student?","o":["₹135.50","₹148","₹170","₹62.50"],"a":1,"why":"Total = ₹1,250 + 20 × ₹85.50 = ₹2,960; per student = ₹2,960 ÷ 20 = ₹148."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Large Numbers Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261104-physics-path-layout-v2" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
