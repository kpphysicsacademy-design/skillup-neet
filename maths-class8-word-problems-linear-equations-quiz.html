<style>

ce-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"A number increased by 7 is 19. What is the number?","o":["10","12","26","9"],"a":1,"e":"Let the number be x. Then x + 7 = 19, so x = 19 − 7 = 12.","v":"class8-word-problems-linear-equations"},{"d":"BASIC","q":"Five times a number is 45. Find the number.","o":["8","9","40","10"],"a":1,"e":"Let the number be x. Then 5x = 45, so x = 9.","v":"class8-word-problems-linear-equations"},{"d":"BASIC","q":"The sum of a number and its double is 24. Find the number.","o":["6","8","12","10"],"a":1,"e":"Let the number be x. Then x + 2x = 24, so 3x = 24 and x = 8.","v":"class8-word-problems-linear-equations"},{"d":"BASIC","q":"A pen costs ₹x. Three pens cost ₹54. What is x?","o":["₹15","₹16","₹18","₹21"],"a":2,"e":"3x = 54, so each pen costs ₹18.","v":"class8-word-problems-linear-equations"},{"d":"BASIC","q":"Ravi is x years old. His age after 5 years will be 17. How old is Ravi now?","o":["10 years","11 years","12 years","22 years"],"a":2,"e":"x + 5 = 17, so x = 12 years.","v":"class8-word-problems-linear-equations"},{"d":"BASIC","q":"The perimeter of a square is 36 cm. Find its side length.","o":["6 cm","8 cm","9 cm","12 cm"],"a":2,"e":"A square has perimeter 4x. Thus 4x = 36 and x = 9 cm.","v":"class8-word-problems-linear-equations"},{"d":"BASIC","q":"Two consecutive integers add up to 31. What is the smaller integer?","o":["14","15","16","17"],"a":1,"e":"Let the smaller integer be x. x + (x + 1) = 31, so 2x = 30 and x = 15.","v":"class8-word-problems-linear-equations"},{"d":"BASIC","q":"A ribbon is cut into 4 equal pieces, each 7 cm long. What was its length?","o":["11 cm","21 cm","28 cm","32 cm"],"a":2,"e":"If the total length is x, then x/4 = 7, so x = 28 cm.","v":"class8-word-problems-linear-equations"},{"d":"BASIC","q":"A number decreased by 9 equals 16. Find the number.","o":["7","23","25","144"],"a":2,"e":"x − 9 = 16, so x = 25. Check: 25 − 9 = 16.","v":"class8-word-problems-linear-equations"},{"d":"BASIC","q":"A taxi charges a fixed ₹40 plus ₹12 per kilometre. The fare is ₹100. How many kilometres were travelled?","o":["4 km","5 km","6 km","7 km"],"a":1,"e":"Let distance be x km. 40 + 12x = 100, so 12x = 60 and x = 5 km.","v":"class8-word-problems-linear-equations"},{"d":"MEDIUM","q":"Three times a number minus 8 is 31. Find the number.","o":["11","13","15","17"],"a":1,"e":"3x − 8 = 31, so 3x = 39 and x = 13.","v":"class8-word-problems-linear-equations"},{"d":"MEDIUM","q":"The length of a rectangle is 3 cm more than its width. Its perimeter is 30 cm. Find the width.","o":["5 cm","6 cm","7 cm","9 cm"],"a":1,"e":"Let width be x and length x + 3. Then 2[x + (x + 3)] = 30, giving 4x + 6 = 30 and x = 6 cm.","v":"class8-word-problems-linear-equations"},{"d":"MEDIUM","q":"A mother is 3 times her child's age. Their ages add to 48 years. How old is the child?","o":["10 years","12 years","14 years","16 years"],"a":1,"e":"Let the child's age be x. Then x + 3x = 48, so x = 12 years.","v":"class8-word-problems-linear-equations"},{"d":"MEDIUM","q":"Four identical notebooks and a ₹20 ruler cost ₹100. What is the cost of one notebook?","o":["₹15","₹18","₹20","₹25"],"a":2,"e":"Let one notebook cost x. Then 4x + 20 = 100, so x = ₹20.","v":"class8-word-problems-linear-equations"},{"d":"MEDIUM","q":"The sum of three consecutive integers is 72. Find the middle integer.","o":["22","23","24","25"],"a":2,"e":"Let the integers be x − 1, x, x + 1. Their sum is 3x = 72, so the middle integer is 24.","v":"class8-word-problems-linear-equations"},{"d":"MEDIUM","q":"A number is divided by 3, then 4 is added; the result is 10. Find the number.","o":["12","15","18","21"],"a":2,"e":"x/3 + 4 = 10, so x/3 = 6 and x = 18.","v":"class8-word-problems-linear-equations"},{"d":"MEDIUM","q":"A student buys 2 identical files and a ₹35 notebook for ₹95. What is the price of each file?","o":["₹25","₹30","₹35","₹40"],"a":1,"e":"Let each file cost x. Then 2x + 35 = 95, so 2x = 60 and x = ₹30.","v":"class8-word-problems-linear-equations"},{"d":"MEDIUM","q":"The denominator of a fraction is 2 more than its numerator. If the fraction is 3/5, what is the numerator?","o":["2","3","4","5"],"a":1,"e":"Let the numerator be x and denominator x + 2. Since x/(x + 2) = 3/5, 5x = 3x + 6, so x = 3.","v":"class8-word-problems-linear-equations"},{"d":"MEDIUM","q":"A number and one-third of it add up to 28. Find the number.","o":["18","21","24","27"],"a":1,"e":"x + x/3 = 28. Thus 4x/3 = 28, so x = 21.","v":"class8-word-problems-linear-equations"},{"d":"MEDIUM","q":"A cyclist has travelled 18 km and then rides at 6 km per hour for x more hours. The total distance is 42 km. Find x.","o":["3 hours","4 hours","5 hours","6 hours"],"a":1,"e":"18 + 6x = 42, so 6x = 24 and x = 4 hours.","v":"class8-word-problems-linear-equations"},{"d":"HARD","q":"A father's age is 4 times his son's age. In 6 years, the father will be twice as old as his son. Find the son's present age.","o":["2 years","3 years","4 years","6 years"],"a":1,"e":"Let the son's age be x and father's age 4x. Then 4x + 6 = 2(x + 6), so 2x = 6 and x = 3 years.","v":"class8-word-problems-linear-equations"},{"d":"HARD","q":"A rectangle's length is twice its width minus 3 cm. Its perimeter is 42 cm. Find the width.","o":["6 cm","7 cm","8 cm","9 cm"],"a":2,"e":"Let width be x and length 2x − 3. Then 2[x + (2x − 3)] = 42, so 6x − 6 = 42 and x = 8 cm.","v":"class8-word-problems-linear-equations"},{"d":"HARD","q":"A shop gives a ₹30 discount on a bag, then adds ₹20 delivery. The final bill is ₹190. What was the marked price?","o":["₹180","₹190","₹200","₹220"],"a":2,"e":"Let marked price be x. Then x − 30 + 20 = 190, so x = ₹200.","v":"class8-word-problems-linear-equations"},{"d":"HARD","q":"The sum of two consecutive even integers is 54. Find the smaller integer.","o":["24","26","28","30"],"a":1,"e":"Let the smaller even integer be x; the next is x + 2. Then 2x + 2 = 54, so x = 26.","v":"class8-word-problems-linear-equations"},{"d":"HARD","q":"A class has 5 more girls than boys and 35 students in total. How many boys are there?","o":["10","12","15","20"],"a":2,"e":"Let boys be x and girls x + 5. Then 2x + 5 = 35, so x = 15 boys.","v":"class8-word-problems-linear-equations"},{"d":"HARD","q":"A number is multiplied by 4, then 7 is subtracted. This equals the number plus 20. Find the number.","o":["7","8","9","10"],"a":2,"e":"4x − 7 = x + 20, so 3x = 27 and x = 9.","v":"class8-word-problems-linear-equations"},{"d":"HARD","q":"Two-fifths of a number is 8 less than the number. Find the number.","o":["40/3","12","15","20"],"a":0,"e":"(2/5)x = x − 8. Multiply by 5: 2x = 5x − 40, so 3x = 40 and x = 40/3.","v":"class8-word-problems-linear-equations"},{"d":"HARD","q":"A train ticket for an adult costs twice a child's ticket. Two adult tickets and three child tickets cost ₹700. What is the child's ticket price?","o":["₹100","₹120","₹140","₹175"],"a":0,"e":"Let the child ticket cost x and adult ticket 2x. Then 2(2x) + 3x = 700, so 7x = 700 and x = ₹100.","v":"class8-word-problems-linear-equations"},{"d":"HARD","q":"A number is increased by 20% and becomes 72. What was the original number?","o":["50","55","60","62"],"a":2,"e":"Let the original number be x. Then 1.2x = 72, so x = 60.","v":"class8-word-problems-linear-equations"},{"d":"HARD","q":"A water tank is one-third full. After adding 24 litres, it becomes two-thirds full. What is the tank's capacity?","o":["48 L","60 L","72 L","96 L"],"a":2,"e":"The added 24 L represents one-third of capacity. Capacity = 24 × 3 = 72 L.","v":"class8-word-problems-linear-equations"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Model word problems with equations</strong><small>Translate ages, costs, distances and shapes into equations</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Solve multi-step real-life problems</strong><small>Check answers in word problems</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Check simplified equations by substitution</strong><small>Check answers in word problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
