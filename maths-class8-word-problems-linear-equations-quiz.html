<div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div>

<script>
(function(){
'use strict';
const questions=[{"q":"A number increased by 7 is 19. What is the number?","o":["10","12","26","9"],"a":1,"why":"Let the number be x. Then x + 7 = 19, so x = 19 − 7 = 12."},{"q":"Five times a number is 45. Find the number.","o":["8","9","40","10"],"a":1,"why":"Let the number be x. Then 5x = 45, so x = 9."},{"q":"The sum of a number and its double is 24. Find the number.","o":["6","8","12","10"],"a":1,"why":"Let the number be x. Then x + 2x = 24, so 3x = 24 and x = 8."},{"q":"A pen costs ₹x. Three pens cost ₹54. What is x?","o":["₹15","₹16","₹18","₹21"],"a":2,"why":"3x = 54, so each pen costs ₹18."},{"q":"Ravi is x years old. His age after 5 years will be 17. How old is Ravi now?","o":["10 years","11 years","12 years","22 years"],"a":2,"why":"x + 5 = 17, so x = 12 years."},{"q":"The perimeter of a square is 36 cm. Find its side length.","o":["6 cm","8 cm","9 cm","12 cm"],"a":2,"why":"A square has perimeter 4x. Thus 4x = 36 and x = 9 cm."},{"q":"Two consecutive integers add up to 31. What is the smaller integer?","o":["14","15","16","17"],"a":1,"why":"Let the smaller integer be x. x + (x + 1) = 31, so 2x = 30 and x = 15."},{"q":"A ribbon is cut into 4 equal pieces, each 7 cm long. What was its length?","o":["11 cm","21 cm","28 cm","32 cm"],"a":2,"why":"If the total length is x, then x/4 = 7, so x = 28 cm."},{"q":"A number decreased by 9 equals 16. Find the number.","o":["7","23","25","144"],"a":2,"why":"x − 9 = 16, so x = 25. Check: 25 − 9 = 16."},{"q":"A taxi charges a fixed ₹40 plus ₹12 per kilometre. The fare is ₹100. How many kilometres were travelled?","o":["4 km","5 km","6 km","7 km"],"a":1,"why":"Let distance be x km. 40 + 12x = 100, so 12x = 60 and x = 5 km."},{"q":"Three times a number minus 8 is 31. Find the number.","o":["11","13","15","17"],"a":1,"why":"3x − 8 = 31, so 3x = 39 and x = 13."},{"q":"The length of a rectangle is 3 cm more than its width. Its perimeter is 30 cm. Find the width.","o":["5 cm","6 cm","7 cm","9 cm"],"a":1,"why":"Let width be x and length x + 3. Then 2[x + (x + 3)] = 30, giving 4x + 6 = 30 and x = 6 cm."},{"q":"A mother is 3 times her child's age. Their ages add to 48 years. How old is the child?","o":["10 years","12 years","14 years","16 years"],"a":1,"why":"Let the child's age be x. Then x + 3x = 48, so x = 12 years."},{"q":"Four identical notebooks and a ₹20 ruler cost ₹100. What is the cost of one notebook?","o":["₹15","₹18","₹20","₹25"],"a":2,"why":"Let one notebook cost x. Then 4x + 20 = 100, so x = ₹20."},{"q":"The sum of three consecutive integers is 72. Find the middle integer.","o":["22","23","24","25"],"a":2,"why":"Let the integers be x − 1, x, x + 1. Their sum is 3x = 72, so the middle integer is 24."},{"q":"A number is divided by 3, then 4 is added; the result is 10. Find the number.","o":["12","15","18","21"],"a":2,"why":"x/3 + 4 = 10, so x/3 = 6 and x = 18."},{"q":"A student buys 2 identical files and a ₹35 notebook for ₹95. What is the price of each file?","o":["₹25","₹30","₹35","₹40"],"a":1,"why":"Let each file cost x. Then 2x + 35 = 95, so 2x = 60 and x = ₹30."},{"q":"The denominator of a fraction is 2 more than its numerator. If the fraction is 3/5, what is the numerator?","o":["2","3","4","5"],"a":1,"why":"Let the numerator be x and denominator x + 2. Since x/(x + 2) = 3/5, 5x = 3x + 6, so x = 3."},{"q":"A number and one-third of it add up to 28. Find the number.","o":["18","21","24","27"],"a":1,"why":"x + x/3 = 28. Thus 4x/3 = 28, so x = 21."},{"q":"A cyclist has travelled 18 km and then rides at 6 km per hour for x more hours. The total distance is 42 km. Find x.","o":["3 hours","4 hours","5 hours","6 hours"],"a":1,"why":"18 + 6x = 42, so 6x = 24 and x = 4 hours."},{"q":"A father's age is 4 times his son's age. In 6 years, the father will be twice as old as his son. Find the son's present age.","o":["2 years","3 years","4 years","6 years"],"a":1,"why":"Let the son's age be x and father's age 4x. Then 4x + 6 = 2(x + 6), so 2x = 6 and x = 3 years."},{"q":"A rectangle's length is twice its width minus 3 cm. Its perimeter is 42 cm. Find the width.","o":["6 cm","7 cm","8 cm","9 cm"],"a":2,"why":"Let width be x and length 2x − 3. Then 2[x + (2x − 3)] = 42, so 6x − 6 = 42 and x = 8 cm."},{"q":"A shop gives a ₹30 discount on a bag, then adds ₹20 delivery. The final bill is ₹190. What was the marked price?","o":["₹180","₹190","₹200","₹220"],"a":2,"why":"Let marked price be x. Then x − 30 + 20 = 190, so x = ₹200."},{"q":"The sum of two consecutive even integers is 54. Find the smaller integer.","o":["24","26","28","30"],"a":1,"why":"Let the smaller even integer be x; the next is x + 2. Then 2x + 2 = 54, so x = 26."},{"q":"A class has 5 more girls than boys and 35 students in total. How many boys are there?","o":["10","12","15","20"],"a":2,"why":"Let boys be x and girls x + 5. Then 2x + 5 = 35, so x = 15 boys."},{"q":"A number is multiplied by 4, then 7 is subtracted. This equals the number plus 20. Find the number.","o":["7","8","9","10"],"a":2,"why":"4x − 7 = x + 20, so 3x = 27 and x = 9."},{"q":"Two-fifths of a number is 8 less than the number. Find the number.","o":["40/3","12","15","20"],"a":0,"why":"(2/5)x = x − 8. Multiply by 5: 2x = 5x − 40, so 3x = 40 and x = 40/3."},{"q":"A train ticket for an adult costs twice a child's ticket. Two adult tickets and three child tickets cost ₹700. What is the child's ticket price?","o":["₹100","₹120","₹140","₹175"],"a":0,"why":"Let the child ticket cost x and adult ticket 2x. Then 2(2x) + 3x = 700, so 7x = 700 and x = ₹100."},{"q":"A number is increased by 20% and becomes 72. What was the original number?","o":["50","55","60","62"],"a":2,"why":"Let the original number be x. Then 1.2x = 72, so x = 60."},{"q":"A water tank is one-third full. After adding 24 litres, it becomes two-thirds full. What is the tank's capacity?","o":["48 L","60 L","72 L","96 L"],"a":2,"why":"The added 24 L represents one-third of capacity. Capacity = 24 × 3 = 72 L."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Word Problems Using Linear Equations Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-class8-word-problems-linear-equations-large-numbers-layout-v1" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
