<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261012-collecting-organising-data-quiz-v2"><title>Collecting and Organising Data | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Whole numbers</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What is data?","o":["Information collected for a purpose","A type of angle","A decimal point","A multiplication sign"],"a":0,"e":"Data are facts or information collected for a purpose.","v":"data-collection"},{"d":"BASIC","q":"A class records students' favourite fruits. What is being collected?","o":["Data","An equation","A line segment","A fraction only"],"a":0,"e":"Students' fruit choices are data.","v":"data-collection"},{"d":"BASIC","q":"Which method helps count votes accurately?","o":["Tally marks","Guessing","Erasing answers","Changing responses"],"a":0,"e":"Tally marks keep a clear count of responses.","v":"data-collection"},{"d":"BASIC","q":"A tally record has four marks and a group of five. How many votes are recorded?","o":["9","8","10","5"],"a":0,"e":"Four marks plus five marks equals nine.","v":"data-collection"},{"d":"BASIC","q":"Five students choose mango and three choose apple. How many students answered?","o":["8","2","15","5"],"a":0,"e":"5 + 3 = 8 students.","v":"data-collection"},{"d":"BASIC","q":"Why organise collected data?","o":["To read and compare results more easily","To hide the results","To make all results equal","To remove every difference"],"a":0,"e":"Organising data makes patterns and comparisons easier to see.","v":"data-collection"},{"d":"BASIC","q":"Which question collects categorical data?","o":["Which fruit do you prefer?","How tall are you in centimetres?","How long is your pencil in cm?","What is 8 × 7?"],"a":0,"e":"Fruit preference is a category rather than a numerical measurement.","v":"data-collection"},{"d":"BASIC","q":"A tally table shows 7 votes for blue and 4 for red. How many votes are there altogether?","o":["11","3","28","7"],"a":0,"e":"7 + 4 = 11 votes.","v":"data-collection"},{"d":"BASIC","q":"Which heading is most useful for a table of students' favourite games?","o":["Favourite game","Weather tomorrow","Length of a desk","Times table"],"a":0,"e":"The heading should describe the information recorded in the table.","v":"data-collection"},{"d":"BASIC","q":"A survey asks 12 students a question and every student gives one answer. How many responses should be recorded?","o":["12","11","13","24"],"a":0,"e":"One response from each of 12 students gives 12 responses.","v":"data-collection"},{"d":"MEDIUM","q":"Tally counts for pets are: cats 8, dogs 11, fish 5. How many responses were collected?","o":["24","19","16","25"],"a":0,"e":"8 + 11 + 5 = 24 responses.","v":"data-collection"},{"d":"MEDIUM","q":"In a survey, 18 students choose cricket and 13 choose football. How many more choose cricket?","o":["5","31","4","6"],"a":0,"e":"18 − 13 = 5 students.","v":"data-collection"},{"d":"MEDIUM","q":"A table records 6, 9, 7 and 8 votes across four choices. What is the total number of votes?","o":["30","29","31","28"],"a":0,"e":"6 + 9 + 7 + 8 = 30.","v":"data-collection"},{"d":"MEDIUM","q":"A class has 25 students. If 9 choose bus and 8 choose bicycle, how many choose other transport?","o":["8","17","9","7"],"a":0,"e":"25 − (9 + 8) = 8 students.","v":"data-collection"},{"d":"MEDIUM","q":"Which is the fairest way to survey favourite sports in a class?","o":["Ask each student the same neutral question","Ask only your friends","Suggest one sport is best before asking","Record only the first five answers"],"a":0,"e":"Asking everyone the same neutral question reduces bias.","v":"data-collection"},{"d":"MEDIUM","q":"A tally table shows Monday 14 books borrowed and Tuesday 19. What is the increase?","o":["5 books","33 books","4 books","6 books"],"a":0,"e":"19 − 14 = 5 books.","v":"data-collection"},{"d":"MEDIUM","q":"Four groups have 12, 15, 9 and 14 objects counted. Which group has the largest count?","o":["15","12","9","14"],"a":0,"e":"15 is greater than 12, 9 and 14.","v":"data-collection"},{"d":"MEDIUM","q":"A survey has 40 responses. If 16 chose tea, what fraction of responses chose tea?","o":["16/40","24/40","40/16","16/24"],"a":0,"e":"There are 16 tea responses out of 40 total, so the fraction is 16/40.","v":"data-collection"},{"d":"MEDIUM","q":"A class records shoe colours. What is one important rule for reliable data?","o":["Use clear categories and count each response once","Count some students twice","Leave unclear categories undefined","Change results to match expectations"],"a":0,"e":"Clear categories and one count per response make the record consistent.","v":"data-collection"},{"d":"MEDIUM","q":"A record shows 22 people visited in the morning and 17 in the afternoon. How many visitors were counted?","o":["39","5","35","40"],"a":0,"e":"22 + 17 = 39 visitors.","v":"data-collection"},{"d":"HARD","q":"A survey records 14 votes for A, 9 for B, and 12 for C. If 40 people responded, how many responses are missing from the table?","o":["5","4","6","3"],"a":0,"e":"14 + 9 + 12 = 35; 40 − 35 = 5.","v":"data-collection"},{"d":"HARD","q":"A class survey records 8 votes for red, 12 for blue and 10 for green. What percentage chose blue?","o":["40%","12%","30%","50%"],"a":0,"e":"There are 30 votes; 12 ÷ 30 × 100 = 40%.","v":"data-collection"},{"d":"HARD","q":"A tally sheet accidentally counts one student twice. What is the most likely effect?","o":["The recorded total is one too high","The recorded total is one too low","Every category becomes equal","No count can change"],"a":0,"e":"Counting one extra response adds one to the recorded total.","v":"data-collection"},{"d":"HARD","q":"A group records 7, 10, 13 and 10 responses across four categories. What is the difference between the highest and lowest counts?","o":["6","3","23","5"],"a":0,"e":"The highest count is 13 and the lowest is 7; 13 − 7 = 6.","v":"data-collection"},{"d":"HARD","q":"In a survey of 50 students, 18 choose walking, 17 choose bus and the rest choose car. How many choose car?","o":["15","33","17","18"],"a":0,"e":"50 − 18 − 17 = 15 students.","v":"data-collection"},{"d":"HARD","q":"A table has counts 5, 7, 7 and 11. What is the total?","o":["30","29","31","28"],"a":0,"e":"5 + 7 + 7 + 11 = 30.","v":"data-collection"},{"d":"HARD","q":"A survey of favourite colours asks 20 students, but only 18 answers are recorded. What should be done first?","o":["Check whether two responses were missed","Assume the missing answers are blue","Double every recorded count","Delete the whole survey"],"a":0,"e":"Compare the expected 20 responses with the 18 recorded and check for omissions.","v":"data-collection"},{"d":"HARD","q":"A shop sold 24 notebooks on Monday and 18 on Tuesday. If 60 notebooks were sold over three days, how many were sold on Wednesday?","o":["18","42","12","24"],"a":0,"e":"60 − 24 − 18 = 18 notebooks.","v":"data-collection"},{"d":"HARD","q":"A survey has 32 responses. One quarter chose swimming. How many students chose swimming?","o":["8","4","16","12"],"a":0,"e":"One quarter of 32 is 32 ÷ 4 = 8.","v":"data-collection"},{"d":"HARD","q":"Four categories have counts 6, 11, 8 and 15. If 3 responses are removed from the category with 15, what is the new total?","o":["37","40","34","35"],"a":0,"e":"Original total is 40; removing 3 gives 37.","v":"data-collection"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Collect and organise data</strong><small>Use categories and tally marks</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Read frequency tables</strong><small>Count and compare survey results</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Find totals and differences in data</strong><small>Solve real-life data questions</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
