<main><div class="eyebrow">Maths · Data Handling</div><h1>Collecting &amp; Organising Data</h1><p class="intro">Collect survey responses, use tally marks, organise frequency tables and interpret data.</p>
<a class="sim" href="maths-collecting-organising-data-simulator.html?v=20261112-collecting-organising-data-simulator-v2">📊 Explore the Data Collection &amp; Tally Simulator</a>
<div class="pr"><span id="counter">QUESTION 1 OF 30</span><span id="pct">0% complete</span></div><div class="track" id="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="bar"></div></div>
<section class="quiz" id="quiz" aria-live="polite"><div class="meta" id="meta"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><div class="hint" id="hint">30 questions · Select one answer</div><button class="btn" id="action" disabled>Check answer</button></div></section><section class="finish" id="finish" hidden></section></main>
<script>
(()=>{'use strict';const questions=[{"d":"BASIC","q":"What is data?","o":["Information collected for a purpose","A type of angle","A decimal point","A multiplication sign"],"a":0,"e":"Data are facts or information collected for a purpose.","v":"data-collection"},{"d":"BASIC","q":"A class records students' favourite fruits. What is being collected?","o":["Data","An equation","A line segment","A fraction only"],"a":0,"e":"Students' fruit choices are data.","v":"data-collection"},{"d":"BASIC","q":"Which method helps count votes accurately?","o":["Tally marks","Guessing","Erasing answers","Changing responses"],"a":0,"e":"Tally marks keep a clear count of responses.","v":"data-collection"},{"d":"BASIC","q":"A tally record has four marks and a group of five. How many votes are recorded?","o":["9","8","10","5"],"a":0,"e":"Four marks plus five marks equals nine.","v":"data-collection"},{"d":"BASIC","q":"Five students choose mango and three choose apple. How many students answered?","o":["8","2","15","5"],"a":0,"e":"5 + 3 = 8 students.","v":"data-collection"},{"d":"BASIC","q":"Why organise collected data?","o":["To read and compare results more easily","To hide the results","To make all results equal","To remove every difference"],"a":0,"e":"Organising data makes patterns and comparisons easier to see.","v":"data-collection"},{"d":"BASIC","q":"Which question collects categorical data?","o":["Which fruit do you prefer?","How tall are you in centimetres?","How long is your pencil in cm?","What is 8 × 7?"],"a":0,"e":"Fruit preference is a category rather than a numerical measurement.","v":"data-collection"},{"d":"BASIC","q":"A tally table shows 7 votes for blue and 4 for red. How many votes are there altogether?","o":["11","3","28","7"],"a":0,"e":"7 + 4 = 11 votes.","v":"data-collection"},{"d":"BASIC","q":"Which heading is most useful for a table of students' favourite games?","o":["Favourite game","Weather tomorrow","Length of a desk","Times table"],"a":0,"e":"The heading should describe the information recorded in the table.","v":"data-collection"},{"d":"BASIC","q":"A survey asks 12 students a question and every student gives one answer. How many responses should be recorded?","o":["12","11","13","24"],"a":0,"e":"One response from each of 12 students gives 12 responses.","v":"data-collection"},{"d":"MEDIUM","q":"Tally counts for pets are: cats 8, dogs 11, fish 5. How many responses were collected?","o":["24","19","16","25"],"a":0,"e":"8 + 11 + 5 = 24 responses.","v":"data-collection"},{"d":"MEDIUM","q":"In a survey, 18 students choose cricket and 13 choose football. How many more choose cricket?","o":["5","31","4","6"],"a":0,"e":"18 − 13 = 5 students.","v":"data-collection"},{"d":"MEDIUM","q":"A table records 6, 9, 7 and 8 votes across four choices. What is the total number of votes?","o":["30","29","31","28"],"a":0,"e":"6 + 9 + 7 + 8 = 30.","v":"data-collection"},{"d":"MEDIUM","q":"A class has 25 students. If 9 choose bus and 8 choose bicycle, how many choose other transport?","o":["8","17","9","7"],"a":0,"e":"25 − (9 + 8) = 8 students.","v":"data-collection"},{"d":"MEDIUM","q":"Which is the fairest way to survey favourite sports in a class?","o":["Ask each student the same neutral question","Ask only your friends","Suggest one sport is best before asking","Record only the first five answers"],"a":0,"e":"Asking everyone the same neutral question reduces bias.","v":"data-collection"},{"d":"MEDIUM","q":"A tally table shows Monday 14 books borrowed and Tuesday 19. What is the increase?","o":["5 books","33 books","4 books","6 books"],"a":0,"e":"19 − 14 = 5 books.","v":"data-collection"},{"d":"MEDIUM","q":"Four groups have 12, 15, 9 and 14 objects counted. Which group has the largest count?","o":["15","12","9","14"],"a":0,"e":"15 is greater than 12, 9 and 14.","v":"data-collection"},{"d":"MEDIUM","q":"A survey has 40 responses. If 16 chose tea, what fraction of responses chose tea?","o":["16/40","24/40","40/16","16/24"],"a":0,"e":"There are 16 tea responses out of 40 total, so the fraction is 16/40.","v":"data-collection"},{"d":"MEDIUM","q":"A class records shoe colours. What is one important rule for reliable data?","o":["Use clear categories and count each response once","Count some students twice","Leave unclear categories undefined","Change results to match expectations"],"a":0,"e":"Clear categories and one count per response make the record consistent.","v":"data-collection"},{"d":"MEDIUM","q":"A record shows 22 people visited in the morning and 17 in the afternoon. How many visitors were counted?","o":["39","5","35","40"],"a":0,"e":"22 + 17 = 39 visitors.","v":"data-collection"},{"d":"HARD","q":"A survey records 14 votes for A, 9 for B, and 12 for C. If 40 people responded, how many responses are missing from the table?","o":["5","4","6","3"],"a":0,"e":"14 + 9 + 12 = 35; 40 − 35 = 5.","v":"data-collection"},{"d":"HARD","q":"A class survey records 8 votes for red, 12 for blue and 10 for green. What percentage chose blue?","o":["40%","12%","30%","50%"],"a":0,"e":"There are 30 votes; 12 ÷ 30 × 100 = 40%.","v":"data-collection"},{"d":"HARD","q":"A tally sheet accidentally counts one student twice. What is the most likely effect?","o":["The recorded total is one too high","The recorded total is one too low","Every category becomes equal","No count can change"],"a":0,"e":"Counting one extra response adds one to the recorded total.","v":"data-collection"},{"d":"HARD","q":"A group records 7, 10, 13 and 10 responses across four categories. What is the difference between the highest and lowest counts?","o":["6","3","23","5"],"a":0,"e":"The highest count is 13 and the lowest is 7; 13 − 7 = 6.","v":"data-collection"},{"d":"HARD","q":"In a survey of 50 students, 18 choose walking, 17 choose bus and the rest choose car. How many choose car?","o":["15","33","17","18"],"a":0,"e":"50 − 18 − 17 = 15 students.","v":"data-collection"},{"d":"HARD","q":"A table has counts 5, 7, 7 and 11. What is the total?","o":["30","29","31","28"],"a":0,"e":"5 + 7 + 7 + 11 = 30.","v":"data-collection"},{"d":"HARD","q":"A survey of favourite colours asks 20 students, but only 18 answers are recorded. What should be done first?","o":["Check whether two responses were missed","Assume the missing answers are blue","Double every recorded count","Delete the whole survey"],"a":0,"e":"Compare the expected 20 responses with the 18 recorded and check for omissions.","v":"data-collection"},{"d":"HARD","q":"A shop sold 24 notebooks on Monday and 18 on Tuesday. If 60 notebooks were sold over three days, how many were sold on Wednesday?","o":["18","42","12","24"],"a":0,"e":"60 − 24 − 18 = 18 notebooks.","v":"data-collection"},{"d":"HARD","q":"A survey has 32 responses. One quarter chose swimming. How many students chose swimming?","o":["8","4","16","12"],"a":0,"e":"One quarter of 32 is 32 ÷ 4 = 8.","v":"data-collection"},{"d":"HARD","q":"Four categories have counts 6, 11, 8 and 15. If 3 responses are removed from the category with 15, what is the new total?","o":["37","40","34","35"],"a":0,"e":"Original total is 40; removing 3 gives 37.","v":"data-collection"}];const $=id=>document.getElementById(id);let i=0,sel=-1,locked=false,done=false,xp=0,correct=0,streak=0;const letters=['A','B','C','D'];
function progress(){const p=Math.round(i/questions.length*100);$('bar').style.width=p+'%';$('progress').setAttribute('aria-valuenow',p);$('pct').textContent=p+'% complete';}
function render(){const q=questions[i];sel=-1;locked=false;$('quiz').hidden=false;$('finish').hidden=true;$('counter').textContent='QUESTION '+(i+1)+' OF '+questions.length;$('meta').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(i+1);$('question').textContent=q.q;$('options').innerHTML='';q.o.forEach((v,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.innerHTML='<span class="letter">'+letters[j]+'</span><span></span>';b.querySelector('span:last-child').textContent=v;b.onclick=()=>{if(locked)return;sel=j;[...$('options').children].forEach((x,k)=>x.classList.toggle('selected',k===j));$('action').disabled=false;};$('options').appendChild(b);});$('feedback').className='feedback';$('feedback').textContent='';$('hint').textContent='30 questions · Select one answer';$('action').textContent='Check answer';$('action').disabled=true;progress();}
function act(){if(done){restart();return;}const q=questions[i];if(!locked){if(sel<0)return;locked=true;const ok=sel===q.a;if(ok){correct++;xp+=10;streak++;}else streak=0;$('xp').textContent='⭐ '+xp+' XP';$('streak').textContent='🔥 '+streak;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===sel)b.classList.add('wrong');});$('feedback').textContent=(ok?'✨ Correct! ':'💡 Review: ')+q.e;$('feedback').className='feedback show '+(ok?'good':'bad');$('hint').textContent=ok?'+10 XP':'Keep practising';$('action').textContent=i===questions.length-1?'View results →':'Continue →';return;}if(i<questions.length-1){i++;render();}else results();}
function results(){done=true;$('quiz').hidden=true;$('finish').hidden=false;$('counter').textContent='QUIZ COMPLETE';$('bar').style.width='100%';$('progress').setAttribute('aria-valuenow','100');$('pct').textContent='100% complete';$('finish').innerHTML='<div style="font-size:46px">🏆</div><h2>'+(correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!')+'</h2><div class="score">'+correct+' / '+questions.length+'</div><p>'+Math.round(correct/questions.length*100)+'% accuracy · '+xp+' XP earned</p><div class="skill"><strong>📋 Collect and record responses</strong><small>Use clear categories and tally marks.</small></div><div class="skill"><strong>📊 Organise frequency tables</strong><small>Read and compare category counts.</small></div><div class="skill"><strong>🧠 Interpret survey data</strong><small>Find totals, differences and missing responses.</small></div><button class="btn" id="retry">Try again ↻</button>';$('retry').onclick=restart;}
function restart(){i=0;sel=-1;locked=false;done=false;xp=0;correct=0;streak=0;$('xp').textContent='⭐ 0 XP';$('streak').textContent='🔥 0';render();}
$('action').onclick=act;render();})();
</script><script src="/shared-nav.js?v=20261017-duolingo-standard-v1"></script></body></html>
