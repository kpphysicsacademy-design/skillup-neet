<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261012-collecting-organising-data-no-images-duolingo-v1"><title>Collecting and Organising Data | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Whole numbers</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What is data?","o":["Information collected about something","A type of angle","A decimal point","A multiplication sign"],"a":0,"e":"Data are facts or information collected for a purpose.","v":"data-collection"},{"d":"BASIC","q":"A class records students' favourite fruits. What is being collected?","o":["Data","An equation","A line segment","A fraction only"],"a":0,"e":"The students' choices are data.","v":"data-collection"},{"d":"BASIC","q":"Which is a sensible way to record each student's vote?","o":["Use a tally mark","Guess the total","Erase each answer","Change the answers"],"a":0,"e":"Tally marks help count responses reliably.","v":"data-collection"},{"d":"BASIC","q":"Tally marks show |||| and one crossed group of five. How many votes is that?","o":["4","5","9","10"],"a":2,"e":"Four marks plus a group of five makes 9.","v":"data-collection"},{"d":"BASIC","q":"Five students choose mango and three choose apple. How many students answered?","o":["2","8","15","5"],"a":1,"e":"5 + 3 = 8 students.","v":"data-collection"},{"d":"BASIC","q":"Why organise collected data?","o":["To make it easier to read and compare","To hide the results","To make every result equal","To remove all numbers"],"a":0,"e":"Organising data makes patterns and comparisons easier to see.","v":"data-collection"},{"d":"BASIC","q":"Which table heading best fits counts of pets owned?","o":["Number of students","Favourite colour of paper","Length of a ruler only","Weather tomorrow"],"a":0,"e":"A count table needs a category and a frequency/count.","v":"data-collection"},{"d":"BASIC","q":"A survey records 6 yes votes and 4 no votes. How many responses were recorded?","o":["2","10","24","6"],"a":1,"e":"6 + 4 = 10 responses.","v":"data-collection"},{"d":"BASIC","q":"Which is a category in a survey about transport to school?","o":["Bus","17","Monday's date only","The total"],"a":0,"e":"Bus is one possible transport category.","v":"data-collection"},{"d":"BASIC","q":"What should you do before counting tally marks?","o":["Check which category each mark belongs to","Add random marks","Ignore the headings","Count the page number"],"a":0,"e":"Read the category labels so every tally is counted correctly.","v":"data-collection"},{"d":"MEDIUM","q":"A survey shows cats 7, dogs 9, fish 4. Which pet is most popular?","o":["Cats","Dogs","Fish","All are equal"],"a":1,"e":"Dogs has the largest count: 9.","v":"data-collection"},{"d":"MEDIUM","q":"Using cats 7, dogs 9, fish 4, how many responses were recorded?","o":["16","20","13","9"],"a":1,"e":"7 + 9 + 4 = 20.","v":"data-collection"},{"d":"MEDIUM","q":"A class has 12 votes for cricket and 8 for football. How many more chose cricket?","o":["4","20","5","3"],"a":0,"e":"12 − 8 = 4 more votes.","v":"data-collection"},{"d":"MEDIUM","q":"A tally table records 5, 11, and 6 votes in three categories. What is the total?","o":["22","21","17","16"],"a":0,"e":"5 + 11 + 6 = 22.","v":"data-collection"},{"d":"MEDIUM","q":"In a survey of 30 children, 12 choose red, 9 blue, and the rest green. How many choose green?","o":["9","21","12","3"],"a":0,"e":"30 − 12 − 9 = 9 children.","v":"data-collection"},{"d":"MEDIUM","q":"Which is the best way to organise favourite subjects and their counts?","o":["A frequency table","A list with no labels","A random paragraph of numbers","An unlabelled drawing"],"a":0,"e":"A frequency table lists categories and how often each occurs.","v":"data-collection"},{"d":"MEDIUM","q":"A library loans 14 storybooks, 8 science books and 11 comics. Which category has the fewest loans?","o":["Storybooks","Science books","Comics","All equal"],"a":1,"e":"Science books have 8 loans, the smallest count.","v":"data-collection"},{"d":"MEDIUM","q":"How many more comics (11) than science books (8) were borrowed?","o":["3","19","2","4"],"a":0,"e":"11 − 8 = 3.","v":"data-collection"},{"d":"MEDIUM","q":"A tally count is 4 + 5 + 5 + 3. What is the total?","o":["17","16","12","15"],"a":0,"e":"4 + 5 + 5 + 3 = 17.","v":"data-collection"},{"d":"MEDIUM","q":"A survey has 25 responses. The table lists 6, 7, and 5 in the first three groups. How many are in the final group?","o":["7","8","6","5"],"a":0,"e":"25 − (6 + 7 + 5) = 7.","v":"data-collection"},{"d":"HARD","q":"A class survey has 8 votes for tea, 13 for juice, 6 for milk, and 3 for water. How many votes were cast?","o":["30","27","29","31"],"a":0,"e":"8 + 13 + 6 + 3 = 30.","v":"data-collection"},{"d":"HARD","q":"In that survey, how many more chose juice than milk?","o":["7","19","6","8"],"a":0,"e":"13 − 6 = 7.","v":"data-collection"},{"d":"HARD","q":"A tally table has total 48 responses. Three categories contain 15, 12, and 9. Find the fourth count.","o":["12","10","11","13"],"a":0,"e":"48 − (15 + 12 + 9) = 12.","v":"data-collection"},{"d":"HARD","q":"A club records attendance: Monday 18, Tuesday 23, Wednesday 19. What is the difference between the highest and lowest?","o":["5","4","42","6"],"a":0,"e":"23 − 18 = 5.","v":"data-collection"},{"d":"HARD","q":"A survey's categories total 42. Counts are 9, 11, 8, and x. Find x.","o":["14","12","13","15"],"a":0,"e":"x = 42 − 9 − 11 − 8 = 14.","v":"data-collection"},{"d":"HARD","q":"A class of 36 students selects sports: 14 football, 10 cricket, 7 badminton, and the rest tennis. How many choose tennis?","o":["5","9","6","7"],"a":0,"e":"36 − 14 − 10 − 7 = 5.","v":"data-collection"},{"d":"HARD","q":"A table shows 17 votes for A and 19 for B. If 4 votes are added to A, what is the new total for A?","o":["21","17","23","40"],"a":0,"e":"17 + 4 = 21.","v":"data-collection"},{"d":"HARD","q":"A tally count is 3 groups of five plus 4 extra marks. What is the total?","o":["19","15","20","17"],"a":0,"e":"Three groups of five make 15; plus 4 is 19.","v":"data-collection"},{"d":"HARD","q":"A survey has 50 responses. 18 prefer buses, 16 walking, 9 bicycles, and the rest cars. How many prefer cars?","o":["7","9","11","6"],"a":0,"e":"50 − 18 − 16 − 9 = 7.","v":"data-collection"},{"d":"HARD","q":"Why should a data table include clear headings?","o":["To show what each number represents","To make the data harder to understand","To change the total","To replace the observations"],"a":0,"e":"Headings identify categories and what the counts measure.","v":"data-collection"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Collect and organise data</strong><small>Use categories and tally marks</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Read frequency tables</strong><small>Count and compare survey results</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Find totals and differences in data</strong><small>Solve real-life data questions</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script></body></html>
