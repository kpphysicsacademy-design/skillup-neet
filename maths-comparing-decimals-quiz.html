(function(){'use strict';const questions=[{"d":"BASIC","q":"Which is greater: 0.8 or 0.75?","o":["0.8","0.75","They are equal","Cannot be compared"],"a":0,"e":"Write 0.8 as 0.80; 0.80 is greater than 0.75.","v":"comparing-decimals"},{"d":"BASIC","q":"Which is the smallest decimal?","o":["0.6","0.06","0.66","0.606"],"a":1,"e":"Compare place values: 0.06 is six hundredths, smaller than the other values.","v":"comparing-decimals"},{"d":"BASIC","q":"Compare 3.45 and 3.5.","o":["3.45 > 3.5","3.45 < 3.5","3.45 = 3.5","Cannot be compared"],"a":1,"e":"Write 3.5 as 3.50; 3.45 is smaller than 3.50.","v":"comparing-decimals"},{"d":"BASIC","q":"Which number is greatest?","o":["2.09","2.9","2.19","2.099"],"a":1,"e":"Write 2.9 as 2.900; it is greater than the other options.","v":"comparing-decimals"},{"d":"BASIC","q":"Arrange 0.3 and 0.27 in ascending order.","o":["0.3, 0.27","0.27, 0.3","They are equal","Cannot be ordered"],"a":1,"e":"0.3 = 0.30, and 0.27 is smaller than 0.30.","v":"comparing-decimals"},{"d":"BASIC","q":"Which is greater: 5.04 or 5.4?","o":["5.04","5.4","They are equal","Cannot be compared"],"a":1,"e":"5.4 = 5.40, which is greater than 5.04.","v":"comparing-decimals"},{"d":"BASIC","q":"Which decimal lies between 1.2 and 1.3?","o":["1.19","1.25","1.31","1.03"],"a":1,"e":"1.25 is greater than 1.20 and less than 1.30.","v":"comparing-decimals"},{"d":"BASIC","q":"Which is the greatest?","o":["0.99","0.909","0.9","0.099"],"a":0,"e":"Write as thousandths: 0.990, 0.909, 0.900, and 0.099.","v":"comparing-decimals"},{"d":"BASIC","q":"Compare 7.08 and 7.080.","o":["7.08 > 7.080","7.08 < 7.080","They are equal","Their difference is 0.08"],"a":2,"e":"A zero added at the end of a decimal does not change its value.","v":"comparing-decimals"},{"d":"BASIC","q":"Which is the smallest?","o":["4.101","4.11","4.01","4.1"],"a":2,"e":"4.01 is less than 4.100, 4.101, and 4.110.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Arrange 2.45, 2.405, 2.5 in ascending order.","o":["2.405, 2.45, 2.5","2.45, 2.405, 2.5","2.5, 2.45, 2.405","2.405, 2.5, 2.45"],"a":0,"e":"Write to thousandths: 2.405, 2.450, and 2.500.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Which comparison is correct?","o":["0.704 < 0.74","0.704 > 0.74","0.704 = 0.74","0.704 > 0.8"],"a":0,"e":"0.74 = 0.740, which is greater than 0.704.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Which is closest to 6?","o":["5.89","6.08","5.95","6.12"],"a":2,"e":"Distances from 6 are 0.11, 0.08, 0.05, and 0.12; 5.95 is closest.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Which decimal is between 0.405 and 0.41?","o":["0.4","0.407","0.415","0.401"],"a":1,"e":"0.407 is greater than 0.405 and less than 0.410.","v":"comparing-decimals"},{"d":"MEDIUM","q":"A ribbon is 3.75 m and another is 3.705 m. Which is longer?","o":["3.75 m","3.705 m","They are equal","Not enough information"],"a":0,"e":"3.75 = 3.750, which is greater than 3.705.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Arrange 0.8, 0.808, 0.88 in descending order.","o":["0.8, 0.808, 0.88","0.88, 0.808, 0.8","0.808, 0.88, 0.8","0.88, 0.8, 0.808"],"a":1,"e":"Write to thousandths: 0.880 > 0.808 > 0.800.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Which is greater: 12.099 or 12.1?","o":["12.099","12.1","They are equal","Cannot be compared"],"a":1,"e":"12.1 = 12.100, greater than 12.099.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Which number is nearest to 0.5?","o":["0.48","0.53","0.46","0.57"],"a":0,"e":"Distances from 0.5 are 0.02, 0.03, 0.04, and 0.07; 0.48 is closest.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Which is the smallest among 9.09, 9.009, 9.9, and 9.099?","o":["9.09","9.009","9.9","9.099"],"a":1,"e":"9.009 is less than 9.090, 9.099, and 9.900.","v":"comparing-decimals"},{"d":"MEDIUM","q":"A runner's times are 12.45 s, 12.5 s, and 12.405 s. Which is the fastest?","o":["12.45 s","12.5 s","12.405 s","All are equal"],"a":2,"e":"The smallest time is fastest; 12.405 < 12.450 < 12.500.","v":"comparing-decimals"},{"d":"HARD","q":"Which is greater: 0.999 or 1.001?","o":["0.999","1.001","They are equal","Cannot be compared"],"a":1,"e":"1.001 is above 1, while 0.999 is below 1.","v":"comparing-decimals"},{"d":"HARD","q":"Arrange 4.06, 4.006, 4.6, 4.0601 in ascending order.","o":["4.006, 4.06, 4.0601, 4.6","4.06, 4.006, 4.0601, 4.6","4.6, 4.0601, 4.06, 4.006","4.006, 4.0601, 4.06, 4.6"],"a":0,"e":"To four decimal places: 4.0060 < 4.0600 < 4.0601 < 4.6000.","v":"comparing-decimals"},{"d":"HARD","q":"Which decimal is exactly halfway between 2.38 and 2.44?","o":["2.40","2.41","2.42","2.43"],"a":1,"e":"The midpoint is (2.38 + 2.44) ÷ 2 = 2.41.","v":"comparing-decimals"},{"d":"HARD","q":"Which number is closest to 10?","o":["9.87","10.08","9.94","10.11"],"a":2,"e":"Distances from 10 are 0.13, 0.08, 0.06, and 0.11; 9.94 is closest.","v":"comparing-decimals"},{"d":"HARD","q":"A package weighs 2.507 kg and another weighs 2.57 kg. What is their difference?","o":["0.063 kg","0.63 kg","0.037 kg","0.603 kg"],"a":0,"e":"2.570 − 2.507 = 0.063 kg.","v":"comparing-decimals"},{"d":"HARD","q":"Which statement is true?","o":["0.120 < 0.12","0.120 = 0.12","0.120 > 0.12","0.120 = 0.012"],"a":1,"e":"0.120 and 0.12 both represent twelve hundredths.","v":"comparing-decimals"},{"d":"HARD","q":"Which is the greatest positive decimal?","o":["0.505","0.55","0.5005","0.506"],"a":1,"e":"0.55 = 0.5500, greater than 0.5060, 0.5050, and 0.5005.","v":"comparing-decimals"},{"d":"HARD","q":"A student records 5.608, 5.68, 5.6081. Which is the greatest?","o":["5.608","5.68","5.6081","They are equal"],"a":1,"e":"5.68 = 5.6800, which exceeds 5.6081 and 5.6080.","v":"comparing-decimals"},{"d":"HARD","q":"Which number is strictly between 0.099 and 0.1?","o":["0.098","0.0995","0.101","0.09"],"a":1,"e":"0.0995 is greater than 0.099 and less than 0.100.","v":"comparing-decimals"},{"d":"HARD","q":"Four lengths are 1.205 m, 1.25 m, 1.2055 m, and 1.2 m. Which is the second-longest?","o":["1.205 m","1.25 m","1.2055 m","1.2 m"],"a":2,"e":"In descending order: 1.2500, 1.2055, 1.2050, 1.2000.","v":"comparing-decimals"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Compare decimal values</strong><small>Use place value to compare decimals</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Order decimals</strong><small>Compare decimals with different lengths</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply decimal comparisons</strong><small>Compare decimals in practical situations</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
