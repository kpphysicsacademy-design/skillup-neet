<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Which decimal is greater: 0.7 or 0.5?","o":["0.5","0.7","They are equal","Cannot compare"],"a":1,"e":"Seven tenths is greater than five tenths.","v":"compare-decimals"},{"d":"BASIC","q":"Choose the correct symbol: 0.36 ___ 0.63","o":["<",">","=","+"],"a":0,"e":"Compare tenths first: 3 tenths is less than 6 tenths.","v":"compare-decimals"},{"d":"BASIC","q":"Which is the smallest decimal?","o":["0.8","0.08","0.88","0.808"],"a":1,"e":"0.08 is eight hundredths, smaller than the others.","v":"compare-decimals"},{"d":"BASIC","q":"Arrange in ascending order: 0.4, 0.14, 0.41","o":["0.14, 0.4, 0.41","0.41, 0.4, 0.14","0.4, 0.14, 0.41","0.14, 0.41, 0.4"],"a":0,"e":"Write 0.4 as 0.40: 0.14 < 0.40 < 0.41.","v":"compare-decimals"},{"d":"BASIC","q":"Which comparison is correct?","o":["0.9 < 0.89","0.89 < 0.9","0.90 < 0.9","0.89 = 0.9"],"a":1,"e":"0.9 = 0.90, which is greater than 0.89.","v":"compare-decimals"},{"d":"BASIC","q":"Which is the greatest?","o":["2.09","2.9","2.19","2.90"],"a":1,"e":"2.9 and 2.90 are equal; they are both greater than 2.19 and 2.09.","v":"compare-decimals"},{"d":"BASIC","q":"Which decimal is equal to 0.6?","o":["0.06","0.60","0.006","6.0"],"a":1,"e":"Adding a zero at the end does not change a decimal's value.","v":"compare-decimals"},{"d":"BASIC","q":"Which is smaller: 3.05 or 3.5?","o":["3.05","3.5","They are equal","Cannot tell"],"a":0,"e":"3.5 is 3.50; 3.05 is smaller.","v":"compare-decimals"},{"d":"BASIC","q":"Which number lies between 1.2 and 1.3?","o":["1.15","1.25","1.35","1.03"],"a":1,"e":"1.25 is greater than 1.20 and less than 1.30.","v":"compare-decimals"},{"d":"BASIC","q":"Choose the correct order from greatest to smallest.","o":["0.12, 0.21, 0.3","0.3, 0.21, 0.12","0.21, 0.3, 0.12","0.12, 0.3, 0.21"],"a":1,"e":"Descending order is 0.30, 0.21, 0.12.","v":"compare-decimals"},{"d":"MEDIUM","q":"Which is greater: 4.078 or 4.087?","o":["4.078","4.087","They are equal","Cannot tell"],"a":1,"e":"Tenths and hundredths match; thousandths 7 < 8.","v":"compare-decimals"},{"d":"MEDIUM","q":"Arrange in ascending order: 5.6, 5.06, 5.66","o":["5.06, 5.6, 5.66","5.66, 5.6, 5.06","5.6, 5.06, 5.66","5.06, 5.66, 5.6"],"a":0,"e":"5.06 < 5.60 < 5.66.","v":"compare-decimals"},{"d":"MEDIUM","q":"Which decimal is closest to 2?","o":["1.89","2.07","2.15","1.72"],"a":1,"e":"2.07 is 0.07 away from 2; 1.89 is 0.11 away.","v":"compare-decimals"},{"d":"MEDIUM","q":"A pencil is 12.4 cm and a pen is 12.38 cm long. Which is longer?","o":["Pencil","Pen","Same length","Cannot tell"],"a":0,"e":"12.4 = 12.40, which is greater than 12.38.","v":"compare-decimals"},{"d":"MEDIUM","q":"Which statement is true?","o":["0.305 > 0.35","0.35 < 0.305","0.305 < 0.35","0.305 = 0.35"],"a":2,"e":"0.305 is less than 0.350.","v":"compare-decimals"},{"d":"MEDIUM","q":"Which is the greatest decimal?","o":["7.099","7.9","7.909","7.89"],"a":2,"e":"7.909 is the greatest because 7.909 > 7.900 > 7.890 > 7.099.","v":"compare-decimals"},{"d":"MEDIUM","q":"Which decimal is the least?","o":["0.501","0.51","0.105","0.15"],"a":2,"e":"0.105 is the smallest.","v":"compare-decimals"},{"d":"MEDIUM","q":"Three runners take 9.8 s, 9.78 s, and 9.807 s. Who is fastest?","o":["9.8 s runner","9.78 s runner","9.807 s runner","All equal"],"a":1,"e":"The least time is 9.780 seconds.","v":"compare-decimals"},{"d":"MEDIUM","q":"Which number is between 0.409 and 0.42?","o":["0.405","0.419","0.421","0.400"],"a":1,"e":"0.419 is greater than 0.409 and less than 0.420.","v":"compare-decimals"},{"d":"MEDIUM","q":"Which is the correct increasing order?","o":["3.008, 3.08, 3.8","3.8, 3.08, 3.008","3.08, 3.008, 3.8","3.008, 3.8, 3.08"],"a":0,"e":"3.008 < 3.080 < 3.800.","v":"compare-decimals"},{"d":"HARD","q":"Which is greatest?","o":["0.405","0.45","0.4050","0.4501"],"a":3,"e":"0.4501 is greater than 0.4500.","v":"compare-decimals"},{"d":"HARD","q":"Arrange in ascending order: 2.09, 2.009, 2.9","o":["2.009, 2.09, 2.9","2.9, 2.09, 2.009","2.09, 2.009, 2.9","2.009, 2.9, 2.09"],"a":0,"e":"Write equal decimal places: 2.009 < 2.090 < 2.900.","v":"compare-decimals"},{"d":"HARD","q":"A bottle holds 1.25 L and another holds 1.205 L. Which holds more?","o":["1.205 L","1.25 L","Same amount","Cannot tell"],"a":1,"e":"1.250 is greater than 1.205.","v":"compare-decimals"},{"d":"HARD","q":"Which decimal is exactly halfway between 4.2 and 4.4?","o":["4.25","4.3","4.35","4.6"],"a":1,"e":"The midpoint is (4.2 + 4.4) ÷ 2 = 4.3.","v":"compare-decimals"},{"d":"HARD","q":"Which is the smallest?","o":["−0.2","0.02","−0.12","0"],"a":0,"e":"Among these, −0.2 is the least.","v":"compare-decimals"},{"d":"HARD","q":"Which number rounds to 6.5 to the nearest tenth?","o":["6.44","6.46","6.54","6.56"],"a":1,"e":"6.46 rounds to 6.5 to the nearest tenth.","v":"compare-decimals"},{"d":"HARD","q":"A ribbon is 0.8 m. Another is 0.785 m. What is their length difference?","o":["0.015 m","0.15 m","0.025 m","0.185 m"],"a":0,"e":"0.800 − 0.785 = 0.015 m.","v":"compare-decimals"},{"d":"HARD","q":"Which is the correct descending order?","o":["1.09, 1.9, 1.099","1.9, 1.099, 1.09","1.099, 1.09, 1.9","1.9, 1.09, 1.099"],"a":1,"e":"1.900 > 1.099 > 1.090.","v":"compare-decimals"},{"d":"HARD","q":"A value is greater than 0.699 and less than 0.701. Which can it be?","o":["0.698","0.700","0.701","0.710"],"a":1,"e":"0.700 lies strictly between 0.699 and 0.701.","v":"compare-decimals"},{"d":"HARD","q":"Which statement is always true?","o":["0.5 < 0.50","0.50 = 0.5","0.500 < 0.5","0.05 = 0.5"],"a":1,"e":"Trailing zeros after a decimal do not change its value.","v":"compare-decimals"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Compare decimal values</strong><small>Use place value to compare decimals</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Order decimals</strong><small>Compare decimals with different lengths</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply decimal comparisons</strong><small>Compare decimals in practical situations</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
