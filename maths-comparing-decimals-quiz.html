","2.45, 2.405, 2.5","2.5, 2.45, 2.405","2.405, 2.5, 2.45"],"a":0,"e":"Write to thousandths: 2.405, 2.450, and 2.500.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Which comparison is correct?","o":["0.704 < 0.74","0.704 > 0.74","0.704 = 0.74","0.704 > 0.8"],"a":0,"e":"0.74 = 0.740, which is greater than 0.704.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Which is closest to 6?","o":["5.89","6.08","5.95","6.12"],"a":2,"e":"Distances from 6 are 0.11, 0.08, 0.05, and 0.12; 5.95 is closest.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Which decimal is between 0.405 and 0.41?","o":["0.4","0.407","0.415","0.401"],"a":1,"e":"0.407 is greater than 0.405 and less than 0.410.","v":"comparing-decimals"},{"d":"MEDIUM","q":"A ribbon is 3.75 m and another is 3.705 m. Which is longer?","o":["3.75 m","3.705 m","They are equal","Not enough information"],"a":0,"e":"3.75 = 3.750, which is greater than 3.705.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Arrange 0.8, 0.808, 0.88 in descending order.","o":["0.8, 0.808, 0.88","0.88, 0.808, 0.8","0.808, 0.88, 0.8","0.88, 0.8, 0.808"],"a":1,"e":"Write to thousandths: 0.880 > 0.808 > 0.800.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Which is greater: 12.099 or 12.1?","o":["12.099","12.1","They are equal","Cannot be compared"],"a":1,"e":"12.1 = 12.100, greater than 12.099.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Which number is nearest to 0.5?","o":["0.48","0.53","0.46","0.57"],"a":0,"e":"Distances from 0.5 are 0.02, 0.03, 0.04, and 0.07; 0.48 is closest.","v":"comparing-decimals"},{"d":"MEDIUM","q":"Which is the smallest among 9.09, 9.009, 9.9, and 9.099?","o":["9.09","9.009","9.9","9.099"],"a":1,"e":"9.009 is less than 9.090, 9.099, and 9.900.","v":"comparing-decimals"},{"d":"MEDIUM","q":"A runner's times are 12.45 s, 12.5 s, and 12.405 s. Which is the fastest?","o":["12.45 s","12.5 s","12.405 s","All are equal"],"a":2,"e":"The smallest time is fastest; 12.405 < 12.450 < 12.500.","v":"comparing-decimals"},{"d":"HARD","q":"Which is greater: 0.999 or 1.001?","o":["0.999","1.001","They are equal","Cannot be compared"],"a":1,"e":"1.001 is above 1, while 0.999 is below 1.","v":"comparing-decimals"},{"d":"HARD","q":"Arrange 4.06, 4.006, 4.6, 4.0601 in ascending order.","o":["4.006, 4.06, 4.0601, 4.6","4.06, 4.006, 4.0601, 4.6","4.6, 4.0601, 4.06, 4.006","4.006, 4.0601, 4.06, 4.6"],"a":0,"e":"To four decimal places: 4.0060 < 4.0600 < 4.0601 < 4.6000.","v":"comparing-decimals"},{"d":"HARD","q":"Which decimal is exactly halfway between 2.38 and 2.44?","o":["2.40","2.41","2.42","2.43"],"a":1,"e":"The midpoint is (2.38 + 2.44) ÷ 2 = 2.41.","v":"comparing-decimals"},{"d":"HARD","q":"Which number is closest to 10?","o":["9.87","10.08","9.94","10.11"],"a":2,"e":"Distances from 10 are 0.13, 0.08, 0.06, and 0.11; 9.94 is closest.","v":"comparing-decimals"},{"d":"HARD","q":"A package weighs 2.507 kg and another weighs 2.57 kg. What is their difference?","o":["0.063 kg","0.63 kg","0.037 kg","0.603 kg"],"a":0,"e":"2.570 − 2.507 = 0.063 kg.","v":"comparing-decimals"},{"d":"HARD","q":"Which statement is true?","o":["0.120 < 0.12","0.120 = 0.12","0.120 > 0.12","0.120 = 0.012"],"a":1,"e":"0.120 and 0.12 both represent twelve hundredths.","v":"comparing-decimals"},{"d":"HARD","q":"Which is the greatest positive decimal?","o":["0.505","0.55","0.5005","0.506"],"a":1,"e":"0.55 = 0.5500, greater than 0.5060, 0.5050, and 0.5005.","v":"comparing-decimals"},{"d":"HARD","q":"A student records 5.608, 5.68, 5.6081. Which is the greatest?","o":["5.608","5.68","5.6081","They are equal"],"a":1,"e":"5.68 = 5.6800, which exceeds 5.6081 and 5.6080.","v":"comparing-decimals"},{"d":"HARD","q":"Which number is strictly between 0.099 and 0.1?","o":["0.098","0.0995","0.101","0.09"],"a":1,"e":"0.0995 is greater than 0.099 and less than 0.100.","v":"comparing-decimals"},{"d":"HARD","q":"Four lengths are 1.205 m, 1.25 m, 1.2055 m, and 1.2 m. Which is the second-longest?","o":["1.205 m","1.25 m","1.2055 m","1.2 m"],"a":2,"e":"In descending order: 1.2500, 1.2055, 1.2050, 1.2000.","v":"comparing-decimals"}];const $=id=>document.getElementById(id);let i=0,sel=-1,locked=false,done=false,xp=0,correct=0,streak=0,active=questions.map((_,j)=>j),mistakes=[],reviewMode=false;const shuffled=questions.map(q=>{const choices=q.o.map((value,j)=>({value,correct:j===q.a}));for(let j=choices.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[choices[j],choices[k]]=[choices[k],choices[j]];}return {...q,o:choices.map(x=>x.value),a:choices.findIndex(x=>x.correct)};});const letters=['A','B','C','D'];
