dentical tank is 7/12 full. Which has more water?","o":["The first tank","The second tank","They have equal amounts","Impossible to compare"],"a":0,"e":"Using denominator 24 gives 15/24, which is greater than 14/24."},{"d":"HARD","q":"Which statement is true?","o":["5/9 > 4/7","5/9 < 4/7","5/9 = 4/7","Both are greater than 1"],"a":1,"e":"Cross-products are 5 × 7 = 35 and 4 × 9 = 36, so 5/9 is smaller."},{"d":"HARD","q":"Which fraction is between 5/8 and 3/4?","o":["1/2","2/3","4/5","5/6"],"a":1,"e":"Two thirds is about 0.667, between 0.625 and 0.75."},{"d":"HARD","q":"Three students complete 4/5, 7/10, and 3/4 of a task. Who completed the greatest fraction?","o":["Student with 4/5","Student with 7/10","Student with 3/4","The first and second tie"],"a":0,"e":"In tenths, 4/5 is 8/10, greater than 7/10 and 3/4."},{"d":"HARD","q":"Compare 13/18 and 5/7.","o":["13/18 < 5/7","13/18 > 5/7","They are equal","Both equal 1/2"],"a":1,"e":"Cross-products are 13 × 7 = 91 and 5 × 18 = 90."},{"d":"HARD","q":"Which fraction is the smallest?","o":["7/10","5/7","2/3","9/14"],"a":3,"e":"9/14 is about 0.643, smaller than 2/3, 7/10, and 5/7."},{"d":"HARD","q":"A ribbon is cut into 12 equal parts. Maya uses 5 parts; Ravi uses 3/4 of an equal ribbon. Who uses more?","o":["Maya","Ravi","They use the same amount","Not enough information"],"a":1,"e":"Maya uses 5/12, while Ravi uses 3/4; 3/4 is greater than 5/12."}];
