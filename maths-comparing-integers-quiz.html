s="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Comparing Integers</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Comparing Integers skills"><div class="skill-title">🎯 Comparing Integer Skills</div><div class="skill-list"><div class="skill-item">Compare positive and negative integers</div><div class="skill-item">Arrange integers in increasing and decreasing order</div><div class="skill-item">Use inequalities to reason about integers</div></div></section></div><script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Which integer is greater: −3 or −7?","o":["−7","−3","They are equal","0"],"a":1,"e":"−3 lies to the right of −7, so −3 is greater.","v":"compare"},{"d":"BASIC","q":"Choose the correct symbol: −5 □ 2.","o":[" >"," <"," ="," ≥ "],"a":1,"e":"Every negative integer is less than every positive integer, so −5 < 2.","v":"compare"},{"d":"BASIC","q":"Which is the smallest integer?","o":["−1","−9","0","−4"],"a":1,"e":"−9 is farthest left among these integers, so it is the smallest.","v":"numberline"},{"d":"BASIC","q":"Which integer is closest to zero?","o":["−8","−3","5","7"],"a":1,"e":"The distance from −3 to zero is 3, less than 8, 5 or 7.","v":"absolute"},{"d":"BASIC","q":"Which list is in increasing order?","o":["−3, −1, 2, 5","2, −1, −3, 5","−1, −3, 2, 5","5, 2, −1, −3"],"a":0,"e":"Increasing order follows left to right: −3 < −1 < 2 < 5.","v":"sequence"},{"d":"BASIC","q":"Which statement is true?","o":["−2 < −6","−8 < −3","4 < −1","0 < −5"],"a":1,"e":"−8 is farther left than −3, so −8 < −3.","v":"compare"},{"d":"BASIC","q":"Which integer is greater than −1 but less than 2?","o":["−2","−1","0","3"],"a":2,"e":"Zero is greater than −1 and less than 2.","v":"numberline"},{"d":"BASIC","q":"Arrange −4 and 1 from smaller to greater.","o":["1, −4","−4, 1","−4, −1","1, 4"],"a":1,"e":"A negative integer is less than a positive integer, so −4 comes first.","v":"sequence"},{"d":"BASIC","q":"On a number line, which point lies farther right?","o":["−6","−2","Both same","Cannot tell"],"a":1,"e":"−2 is greater than −6, so it lies farther right.","v":"steps"},{"d":"BASIC","q":"Which integer is the greatest?","o":["−1","−10","−3","−6"],"a":0,"e":"Among negative integers, −1 is closest to zero and therefore greatest.","v":"compare"},{"d":"MEDIUM","q":"Arrange 3, −5, 0, −2 in decreasing order.","o":["−5, −2, 0, 3","3, 0, −2, −5","3, −2, 0, −5","0, 3, −2, −5"],"a":1,"e":"Decreasing order goes from greatest to least: 3 > 0 > −2 > −5.","v":"sequence"},{"d":"MEDIUM","q":"Which inequality is correct?","o":["−12 > −8","−4 < −9","−10 < −2","6 < −6"],"a":2,"e":"−10 lies to the left of −2, so −10 < −2.","v":"compare"},{"d":"MEDIUM","q":"Which integer lies between −6 and −2?","o":["−8","−5","−1","2"],"a":1,"e":"−5 is greater than −6 and less than −2.","v":"numberline"},{"d":"MEDIUM","q":"The temperatures are −4°C, 2°C, −1°C and 0°C. Which is the coldest?","o":["2°C","−1°C","0°C","−4°C"],"a":3,"e":"−4°C is the lowest temperature and smallest integer in the list.","v":"thermometer"},{"d":"MEDIUM","q":"If a < −2 and a is one of the integers −1, −3, −5, which values can a be?","o":["−1 only","−3 and −5","−1 and −3","All three"],"a":1,"e":"Both −3 and −5 are less than −2; −1 is greater than −2.","v":"compare"},{"d":"MEDIUM","q":"Which pair is correctly ordered from least to greatest?","o":["−7, −9","−2, −5","−6, −4","3, −1"],"a":2,"e":"−6 < −4, while each other pair is listed in decreasing order.","v":"sequence"},{"d":"MEDIUM","q":"Which number is 2 units greater than −5?","o":["−7","−3","3","7"],"a":1,"e":"Moving two units right from −5 gives −3.","v":"steps"},{"d":"MEDIUM","q":"Which is the correct comparison of −15 and −9?","o":["−15 > −9","−15 < −9","−15 = −9","−9 < −15"],"a":1,"e":"−15 is farther left than −9, so −15 < −9.","v":"compare"},{"d":"MEDIUM","q":"Which integer has the greatest distance from zero?","o":["−4","6","−9","8"],"a":2,"e":"The distance of −9 from zero is 9 units, the greatest among 4, 6, 9 and 8.","v":"absolute"},{"d":"MEDIUM","q":"A student says −3 < −2 because 3 is less than 2. What is the correct reason −3 < −2?","o":["−3 lies left of −2","−3 lies right of −2","−3 is positive","Both are zero"],"a":0,"e":"Negative numbers reverse the intuition from their positive magnitudes: −3 lies to the left of −2.","v":"compare"},{"d":"HARD","q":"Arrange −11, 4, −2, 0, −7 in increasing order.","o":["−11, −7, −2, 0, 4","4, 0, −2, −7, −11","−7, −11, −2, 0, 4","−11, −2, −7, 0, 4"],"a":0,"e":"Reading left to right gives −11 < −7 < −2 < 0 < 4.","v":"sequence"},{"d":"HARD","q":"Which integer n satisfies both −4 < n and n < 1?","o":["−5","−4","0","2"],"a":2,"e":"Zero is greater than −4 and less than 1; −4 itself is not greater than −4.","v":"numberline"},{"d":"HARD","q":"Four integers are ordered from least to greatest: −8, x, −2, 3. Which could x be?","o":["−9","−6","0","4"],"a":1,"e":"x must be greater than −8 and less than −2; −6 fits both conditions.","v":"sequence"},{"d":"HARD","q":"Which statement is always true for integers a and b if a is to the left of b on a number line?","o":["a > b","a = b","a < b","a + b = 0"],"a":2,"e":"Points farther left represent smaller values, so a < b.","v":"numberline"},{"d":"HARD","q":"Which is the greatest value among −|−6|, −4, |−3| and −1?","o":["−6","−4","3","−1"],"a":2,"e":"The values are −6, −4, 3 and −1; 3 is the greatest.","v":"absolute"},{"d":"HARD","q":"The integer −2 is compared with −2 + 1 and −2 − 3. Which is the correct order from least to greatest?","o":["−2, −1, −5","−5, −2, −1","−1, −2, −5","−5, −1, −2"],"a":1,"e":"The values are −2, −1 and −5; in increasing order they are −5, −2, −1.","v":"compare"},{"d":"HARD","q":"Which integer is greater than every number in the set {−7, −2, 0, 4}?","o":["−8","3","4","5"],"a":3,"e":"The greatest value in the set is 4, so an integer greater than every member must be above 4; 5 works.","v":"compare"},{"d":"HARD","q":"A is 3 units left of zero and B is 5 units right of zero. Which statement is correct?","o":["A > B","A < B","A = B","Both are negative"],"a":1,"e":"A = −3 and B = 5; therefore −3 < 5.","v":"opposite"},{"d":"HARD","q":"Which pair has the same order relationship as −9 < −4?","o":["2 < 7","−1 < −5","8 < 3","0 < −2"],"a":0,"e":"Both −9 < −4 and 2 < 7 place the smaller value first.","v":"sequence"},{"d":"HARD","q":"Integers p, q and r satisfy p < q < r. If q = −1, which could be (p, r)?","o":["(0, 2)","(−3, 0)","(−1, 1)","(−2, −4)"],"a":1,"e":"With q = −1, p must be less than −1 and r greater than −1; (−3, 0) satisfies both.","v":"compare"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');const visuals={

'hint').textContent='You can retry anytime';$('feedback').className='feedback';const skills=[['Compare positive and negative integers',8],['Order integers and interpret inequalities',18],['Solve multi-step integer comparisons',24]];$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">📏</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+skills.map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script>\n<script src="/shared-nav.js?v=20261013-universal-nav-v1"></script>\n</body></html>
