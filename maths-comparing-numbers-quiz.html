<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f9ff">
<meta name="description" content="Practise comparing and ordering whole numbers, decimals, fractions and integers with an interactive simulator, instant explanations and 30 questions.">
<meta name="skillup-release" content="20261110-comparing-numbers-architecture-v3">
<title>SkillUp Maths | Comparing Numbers — Practice</title>
<style>
:root{--green:#58cc02;--green-dark:#46a302;--blue:#1cb0f6;--ink:#243447;--navy:#174a78;--muted:#64748b;--line:#dce6ef;--bg:#f3f9ff;--red:#ff4b4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.nav{max-width:720px;margin:auto;min-height:64px;padding:9px 14px;display:flex;align-items:center;gap:10px}
.back{display:grid;place-items:center;flex:0 0 40px;width:40px;height:40px;border:2px solid var(--line);border-radius:13px;background:#f2f9ff;color:var(--navy);text-decoration:none;font-size:20px}
.brand{font-weight:950;color:var(--navy);line-height:1.1}.brand small{display:block;font-size:9px;letter-spacing:.8px;color:var(--muted);margin-top:4px}
.xp,.streak{display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;line-height:1.15;border-radius:99px;padding:8px 10px;font-size:12px;font-weight:900}
.xp{margin-left:auto;background:#fff4cf;border:1px solid #f4df9a}.streak{background:#fff0e8;border:1px solid #ffd4bd;color:#b94a17}
main{max-width:720px;margin:auto;padding:16px 13px 44px}
.hero,.quiz,.finish{background:#fff;border:2px solid #e2edf7;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 #dce8f3}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:var(--navy)}
.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.progress-row{display:flex;justify-content:space-between;gap:10px;margin:16px 0 7px;font-size:12px;font-weight:900;color:var(--muted)}
.track{height:11px;border-radius:99px;background:#e2edf7;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}
.qmeta{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.4px}
.question{font-size:clamp(20px,4.5vw,26px);line-height:1.35;margin:12px 0 18px;font-weight:850}
.options{display:grid;gap:10px}.option{display:flex;gap:11px;align-items:center;width:100%;min-height:54px;padding:12px;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}
.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5;font-weight:650}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:var(--navy)}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:280px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
.review-item{text-align:left;padding:12px;margin:10px 0;border:2px solid var(--line);border-radius:14px;background:#fff}.review-item p{margin:5px 0}
button:focus-visible,.option:focus-visible,.back:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
@media(max-width:480px){.xp,.streak{padding:8px 10px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<section class="hero"><div style="display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-bottom:12px"><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak">🔥 <span id="streak">0</span> streak</div></div><h1>Comparing Numbers</h1><p class="muted">Compare and order whole numbers, decimals, fractions and integers. Practise place-value reasoning, number size and numerical order.</p><div style="display:grid;grid-template-columns:1fr;gap:8px;margin-top:13px"><a href="maths-comparing-numbers-simulator.html?v=20261110-comparing-numbers-simulator-v1" style="display:block;text-align:center;text-decoration:none;background:#eaf7ff;color:#116b96;padding:11px 9px;border-radius:10px;font-weight:850;font-size:13px;border:1px solid #b8deed">🔢 Explore Comparing Numbers Simulator — compare, order and reason</a></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"Which number is greater: 4,508 or 4,580?","o":["4,508","4,580","They are equal","Cannot tell"],"a":1,"e":"Compare place values from left to right. Hundreds are equal; tens 8 > 0, so 4,580 is greater.","v":"balance"},{"d":"BASIC","q":"Choose the correct symbol: 3,421 ___ 3,412","o":["<",">","=","+"],"a":1,"e":"Thousands and hundreds match; tens 2 > 1, so 3,421 > 3,412.","v":"balance"},{"d":"BASIC","q":"Which is the smallest number?","o":["7,090","7,900","7,009","7,099"],"a":2,"e":"7,009 has 0 hundreds and 0 tens, making it the smallest.","v":"balance"},{"d":"BASIC","q":"Arrange in ascending order: 45, 54, 40","o":["40, 45, 54","54, 45, 40","45, 40, 54","40, 54, 45"],"a":0,"e":"Ascending order means smallest to largest: 40, 45, 54.","v":"balance"},{"d":"BASIC","q":"Which comparison is correct?","o":["809 < 798","1,020 < 1,002","6,500 = 6,050","999 < 1,000"],"a":3,"e":"999 is one less than 1,000.","v":"balance"},{"d":"BASIC","q":"Which number is closest to 500?","o":["462","519","548","431"],"a":1,"e":"519 is 19 away from 500, the smallest distance among the choices.","v":"balance"},{"d":"BASIC","q":"Fill in the blank: 8,300 ___ 8,030","o":["<",">","=","≤"],"a":1,"e":"8,300 is greater than 8,030 because 3 hundreds > 0 hundreds.","v":"balance"},{"d":"BASIC","q":"Which is the greatest?","o":["12,099","12,909","12,990","12,900"],"a":2,"e":"12,990 is greatest because its tens digit is 9.","v":"balance"},{"d":"BASIC","q":"How many whole numbers are between 28 and 32?","o":["2","3","4","5"],"a":1,"e":"The numbers strictly between are 29, 30, and 31: three numbers.","v":"balance"},{"d":"BASIC","q":"Which number comes immediately before 10,000?","o":["9,000","9,999","10,001","9,990"],"a":1,"e":"The predecessor of 10,000 is 9,999.","v":"balance"},{"d":"MEDIUM","q":"Choose the correct symbol: 56,078 ___ 56,708","o":["<",">","=","≥"],"a":0,"e":"The hundreds digit 0 is less than 7, so 56,078 < 56,708.","v":"balance"},{"d":"MEDIUM","q":"Arrange from greatest to smallest: 6.4, 6.04, 6.44","o":["6.04, 6.4, 6.44","6.44, 6.4, 6.04","6.4, 6.44, 6.04","6.44, 6.04, 6.4"],"a":1,"e":"Write equal decimal places: 6.44 > 6.40 > 6.04.","v":"balance"},{"d":"MEDIUM","q":"Which fraction is largest?","o":["3/8","1/2","5/12","2/5"],"a":1,"e":"1/2 = 0.5, greater than 3/8, 5/12, and 2/5.","v":"balance"},{"d":"MEDIUM","q":"Which is the smallest decimal?","o":["0.7","0.07","0.77","0.707"],"a":1,"e":"0.07 is seven hundredths, smaller than the others.","v":"balance"},{"d":"MEDIUM","q":"A library has 4,785 books and another has 4,758. Which has more, and by how many?","o":["First, by 27","Second, by 27","First, by 37","Equal"],"a":0,"e":"4,785 − 4,758 = 27; the first library has 27 more.","v":"balance"},{"d":"MEDIUM","q":"Choose the correct ascending order.","o":["2.5, 2.05, 2.55","2.05, 2.5, 2.55","2.55, 2.5, 2.05","2.5, 2.55, 2.05"],"a":1,"e":"2.05 < 2.50 < 2.55.","v":"balance"},{"d":"MEDIUM","q":"Which number is between 3,499 and 3,510?","o":["3,498","3,500","3,511","3,520"],"a":1,"e":"3,500 is greater than 3,499 and less than 3,510.","v":"balance"},{"d":"MEDIUM","q":"Which statement is true?","o":["0.9 < 0.89","0.89 < 0.9","0.90 < 0.9","0.89 = 0.9"],"a":1,"e":"0.9 = 0.90, which is greater than 0.89.","v":"balance"},{"d":"MEDIUM","q":"Which is the greatest fraction?","o":["2/3","3/5","5/8","7/12"],"a":0,"e":"2/3 is about 0.667, greater than the other fractions.","v":"balance"},{"d":"MEDIUM","q":"Four students scored 78, 87, 81, and 79. Who scored highest?","o":["78","87","81","79"],"a":1,"e":"87 is the largest score.","v":"balance"},{"d":"HARD","q":"Which is greatest?","o":["0.405","0.45","0.4050","0.4501"],"a":3,"e":"0.4501 is greater than 0.4500 (0.45).","v":"balance"},{"d":"HARD","q":"Arrange in ascending order: 5/6, 0.82, 4/5","o":["4/5, 0.82, 5/6","0.82, 4/5, 5/6","5/6, 0.82, 4/5","4/5, 5/6, 0.82"],"a":0,"e":"4/5 = 0.8, then 0.82, then 5/6 ≈ 0.833.","v":"balance"},{"d":"HARD","q":"Which is the smallest?","o":["−2","0","−5","3"],"a":2,"e":"Among these integers, −5 is the smallest.","v":"balance"},{"d":"HARD","q":"A number is greater than 9,998 and less than 10,002. Which could it be?","o":["9,997","9,998","10,001","10,002"],"a":2,"e":"10,001 lies strictly between 9,998 and 10,002.","v":"balance"},{"d":"HARD","q":"Which statement is correct?","o":["3/4 < 0.7","3/4 = 0.75","0.8 < 4/5","5/8 > 0.7"],"a":1,"e":"3/4 equals 0.75.","v":"balance"},{"d":"HARD","q":"The temperatures are −3°C, 2°C, −1°C, and 0°C. Which is coldest?","o":["−3°C","2°C","−1°C","0°C"],"a":0,"e":"−3 is the least temperature.","v":"balance"},{"d":"HARD","q":"Which number rounds to 4,000 to the nearest thousand?","o":["3,499","3,500","4,501","5,100"],"a":1,"e":"3,500 rounds up to 4,000 to the nearest thousand.","v":"balance"},{"d":"HARD","q":"Which is greater: 7/10 or 0.69?","o":["7/10","0.69","Equal","Cannot compare"],"a":0,"e":"7/10 = 0.70, greater than 0.69.","v":"balance"},{"d":"HARD","q":"A runner finishes in 12.08 seconds and another in 12.8 seconds. Who is faster?","o":["12.08-second runner","12.8-second runner","Same time","Cannot tell"],"a":0,"e":"12.08 < 12.80, so the first runner takes less time.","v":"balance"},{"d":"HARD","q":"Which list is in descending order?","o":["−4, −1, 0, 2","5, 2, 0, −3","1, 3, 2, 0","0, −2, 1, −4"],"a":1,"e":"Descending order is greatest to least: 5 > 2 > 0 > −3.","v":"balance"}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;$('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100),card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Comparing Numbers Complete!</h2><p><a href="maths-comparing-numbers-simulator.html?v=20261110-comparing-numbers-simulator-v1" style="color:#116b96;font-weight:850;text-decoration:none">🔢 Explore Large Numbers Simulator →</a></p><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}
 else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}else{questions.splice(0,questions.length,...originalQuestions);}index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});}
 $('retry').addEventListener('click',()=>resetQuiz(false));$('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
