<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Which number is greater: 4,508 or 4,580?","o":["4,508","4,580","They are equal","Cannot tell"],"a":1,"e":"Compare place values from left to right. Hundreds are equal; tens 8 > 0, so 4,580 is greater.","v":"balance"},{"d":"BASIC","q":"Choose the correct symbol: 3,421 ___ 3,412","o":["<",">","=","+"],"a":1,"e":"Thousands and hundreds match; tens 2 > 1, so 3,421 > 3,412.","v":"balance"},{"d":"BASIC","q":"Which is the smallest number?","o":["7,090","7,900","7,009","7,099"],"a":2,"e":"7,009 has 0 hundreds and 0 tens, making it the smallest.","v":"balance"},{"d":"BASIC","q":"Arrange in ascending order: 45, 54, 40","o":["40, 45, 54","54, 45, 40","45, 40, 54","40, 54, 45"],"a":0,"e":"Ascending order means smallest to largest: 40, 45, 54.","v":"balance"},{"d":"BASIC","q":"Which comparison is correct?","o":["809 < 798","1,020 < 1,002","6,500 = 6,050","999 < 1,000"],"a":3,"e":"999 is one less than 1,000.","v":"balance"},{"d":"BASIC","q":"Which number is closest to 500?","o":["462","519","548","431"],"a":1,"e":"519 is 19 away from 500, the smallest distance among the choices.","v":"balance"},{"d":"BASIC","q":"Fill in the blank: 8,300 ___ 8,030","o":["<",">","=","≤"],"a":1,"e":"8,300 is greater than 8,030 because 3 hundreds > 0 hundreds.","v":"balance"},{"d":"BASIC","q":"Which is the greatest?","o":["12,099","12,909","12,990","12,900"],"a":2,"e":"12,990 is greatest because its tens digit is 9.","v":"balance"},{"d":"BASIC","q":"How many whole numbers are between 28 and 32?","o":["2","3","4","5"],"a":1,"e":"The numbers strictly between are 29, 30, and 31: three numbers.","v":"balance"},{"d":"BASIC","q":"Which number comes immediately before 10,000?","o":["9,000","9,999","10,001","9,990"],"a":1,"e":"The predecessor of 10,000 is 9,999.","v":"balance"},{"d":"MEDIUM","q":"Choose the correct symbol: 56,078 ___ 56,708","o":["<",">","=","≥"],"a":0,"e":"The hundreds digit 0 is less than 7, so 56,078 < 56,708.","v":"balance"},{"d":"MEDIUM","q":"Arrange from greatest to smallest: 6.4, 6.04, 6.44","o":["6.04, 6.4, 6.44","6.44, 6.4, 6.04","6.4, 6.44, 6.04","6.44, 6.04, 6.4"],"a":1,"e":"Write equal decimal places: 6.44 > 6.40 > 6.04.","v":"balance"},{"d":"MEDIUM","q":"Which fraction is largest?","o":["3/8","1/2","5/12","2/5"],"a":1,"e":"1/2 = 0.5, greater than 3/8, 5/12, and 2/5.","v":"balance"},{"d":"MEDIUM","q":"Which is the smallest decimal?","o":["0.7","0.07","0.77","0.707"],"a":1,"e":"0.07 is seven hundredths, smaller than the others.","v":"balance"},{"d":"MEDIUM","q":"A library has 4,785 books and another has 4,758. Which has more, and by how many?","o":["First, by 27","Second, by 27","First, by 37","Equal"],"a":0,"e":"4,785 − 4,758 = 27; the first library has 27 more.","v":"balance"},{"d":"MEDIUM","q":"Choose the correct ascending order.","o":["2.5, 2.05, 2.55","2.05, 2.5, 2.55","2.55, 2.5, 2.05","2.5, 2.55, 2.05"],"a":1,"e":"2.05 < 2.50 < 2.55.","v":"balance"},{"d":"MEDIUM","q":"Which number is between 3,499 and 3,510?","o":["3,498","3,500","3,511","3,520"],"a":1,"e":"3,500 is greater than 3,499 and less than 3,510.","v":"balance"},{"d":"MEDIUM","q":"Which statement is true?","o":["0.9 < 0.89","0.89 < 0.9","0.90 < 0.9","0.89 = 0.9"],"a":1,"e":"0.9 = 0.90, which is greater than 0.89.","v":"balance"},{"d":"MEDIUM","q":"Which is the greatest fraction?","o":["2/3","3/5","5/8","7/12"],"a":0,"e":"2/3 is about 0.667, greater than the other fractions.","v":"balance"},{"d":"MEDIUM","q":"Four students scored 78, 87, 81, and 79. Who scored highest?","o":["78","87","81","79"],"a":1,"e":"87 is the largest score.","v":"balance"},{"d":"HARD","q":"Which is greatest?","o":["0.405","0.45","0.4050","0.4501"],"a":3,"e":"0.4501 is greater than 0.4500 (0.45).","v":"balance"},{"d":"HARD","q":"Arrange in ascending order: 5/6, 0.82, 4/5","o":["4/5, 0.82, 5/6","0.82, 4/5, 5/6","5/6, 0.82, 4/5","4/5, 5/6, 0.82"],"a":0,"e":"4/5 = 0.8, then 0.82, then 5/6 ≈ 0.833.","v":"balance"},{"d":"HARD","q":"Which is the smallest?","o":["−2","0","−5","3"],"a":2,"e":"Among these integers, −5 is the smallest.","v":"balance"},{"d":"HARD","q":"A number is greater than 9,998 and less than 10,002. Which could it be?","o":["9,997","9,998","10,001","10,002"],"a":2,"e":"10,001 lies strictly between 9,998 and 10,002.","v":"balance"},{"d":"HARD","q":"Which statement is correct?","o":["3/4 < 0.7","3/4 = 0.75","0.8 < 4/5","5/8 > 0.7"],"a":1,"e":"3/4 equals 0.75.","v":"balance"},{"d":"HARD","q":"The temperatures are −3°C, 2°C, −1°C, and 0°C. Which is coldest?","o":["−3°C","2°C","−1°C","0°C"],"a":0,"e":"−3 is the least temperature.","v":"balance"},{"d":"HARD","q":"Which number rounds to 4,000 to the nearest thousand?","o":["3,499","3,500","4,501","5,100"],"a":1,"e":"3,500 rounds up to 4,000 to the nearest thousand.","v":"balance"},{"d":"HARD","q":"Which is greater: 7/10 or 0.69?","o":["7/10","0.69","Equal","Cannot compare"],"a":0,"e":"7/10 = 0.70, greater than 0.69.","v":"balance"},{"d":"HARD","q":"A runner finishes in 12.08 seconds and another in 12.8 seconds. Who is faster?","o":["12.08-second runner","12.8-second runner","Same time","Cannot tell"],"a":0,"e":"12.08 < 12.80, so the first runner takes less time.","v":"balance"},{"d":"HARD","q":"Which list is in descending order?","o":["−4, −1, 0, 2","5, 2, 0, −3","1, 3, 2, 0","0, −2, 1, −4"],"a":1,"e":"Descending order is greatest to least: 5 > 2 > 0 > −3.","v":"balance"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Compare by place value</strong><small>Compare multi-digit numbers accurately</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Order decimals and fractions</strong><small>Use place value and equivalent forms</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply comparisons</strong><small>Compare numbers in real situations</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
