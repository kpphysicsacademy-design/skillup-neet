const questions=[{"q":"Which number is greater: 2/5 or 3/5?","o":["3/5","2/5","They are equal","Cannot be compared"],"a":0,"why":"The denominators are equal, so compare the numerators."},{"q":"Which is greater: −1/4 or −3/4?","o":["−1/4","−3/4","They are equal","Cannot be compared"],"a":0,"why":"Among negative numbers, the value closer to zero is greater."},{"q":"Which symbol makes this true: 2/7 □ 5/7?","o":["<"," >","=","≤"],"a":0,"why":"With equal positive denominators, compare the numerators."},{"q":"Which fraction is the smallest?","o":["1/6","1/3","1/2","2/3"],"a":0,"why":"For positive unit fractions, a larger denominator gives a smaller value."},{"q":"Which is greater: 0 or −5/8?","o":["0","−5/8","They are equal","Cannot be compared"],"a":0,"why":"Every negative rational number is less than zero."},{"q":"Which fraction is greater than 1?","o":["7/5","3/8","4/9","5/6"],"a":0,"why":"A positive fraction exceeds 1 when its numerator is greater than its denominator."},{"q":"Which is greater: −2/3 or −2/5?","o":["−2/5","−2/3","They are equal","Cannot be compared"],"a":0,"why":"For these negative fractions, compare their magnitudes: the smaller magnitude is closer to zero."},{"q":"Which fraction is equal to 1/2 and easiest to compare with 3/4?","o":["2/4","1/4","3/2","2/3"],"a":0,"why":"An equivalent fraction can be made by multiplying numerator and denominator by the same non-zero number."},{"q":"Which is the greatest number?","o":["3/4","5/6","2/3","1/2"],"a":1,"why":"Use a common denominator or decimal values to compare the positive fractions."},{"q":"Which ordering is from least to greatest?","o":["1/3, 0, −1/2","−1/2, 0, 1/3","0, −1/2, 1/3","−1/2, 1/3, 0"],"a":1,"why":"Negative numbers come before zero, and positive numbers come after zero."},{"q":"Compare 5/8 and 7/12.","o":["5/8 < 7/12","5/8 > 7/12","5/8 = 7/12","Cannot be determined"],"a":1,"why":"Use denominator 24: compare the equivalent numerators."},{"q":"Which is greater: −5/6 or −7/9?","o":["−5/6","−7/9","They are equal","Cannot be determined"],"a":1,"why":"Convert to a common denominator and remember the sign when comparing negatives."},{"q":"Arrange 2/3, 5/8, 3/4 from greatest to least.","o":["2/3, 3/4, 5/8","3/4, 2/3, 5/8","5/8, 2/3, 3/4","3/4, 5/8, 2/3"],"a":1,"why":"A common denominator of 24 makes all three comparisons straightforward."},{"q":"Which number lies between 1/3 and 1/2?","o":["1/4","5/12","2/3","3/5"],"a":1,"why":"Write the endpoints with denominator 12 and compare the candidate."},{"q":"Compare −3/5 and −4/7.","o":["−3/5 > −4/7","−3/5 < −4/7","−3/5 = −4/7","Cannot be determined"],"a":1,"why":"Convert both to denominator 35, then compare the negative values."},{"q":"Which is the least among −2/3, −3/5, and −5/6?","o":["−2/3","−5/6","−3/5","They are equal"],"a":1,"why":"The most negative value is the least; use common denominators to confirm."},{"q":"Which inequality is true?","o":["7/10 < 2/3","7/10 = 2/3","7/10 > 2/3","7/10 ≤ 1/2"],"a":2,"why":"Compare 7/10 and 2/3 by cross multiplication or a common denominator."},{"q":"What is the correct ascending order of −3/4, −1/2, and −2/3?","o":["−1/2, −2/3, −3/4","−2/3, −3/4, −1/2","−3/4, −2/3, −1/2","−3/4, −1/2, −2/3"],"a":2,"why":"For negative fractions, the one with greatest absolute value is the smallest."},{"q":"Which fraction is closest to zero but negative?","o":["−4/9","−5/9","−1/9","−7/9"],"a":2,"why":"Among negative fractions with denominator 9, the smallest magnitude is closest to zero."},{"q":"Which fraction is greater than 3/5 but less than 2/3?","o":["1/2","3/4","5/8","7/10"],"a":2,"why":"Use denominator 120 or compare each candidate against both endpoints."},{"q":"Which is greater: 11/15 or 7/10?","o":["7/10","They are equal","11/15","Cannot be compared"],"a":2,"why":"Convert to denominator 30 to compare exactly."},{"q":"Arrange −5/8, −2/3, −3/4 from least to greatest.","o":["−5/8, −2/3, −3/4","−2/3, −5/8, −3/4","−3/4, −2/3, −5/8","−3/4, −5/8, −2/3"],"a":2,"why":"Compare their magnitudes using denominator 24, then apply the negative signs."},{"q":"Which rational number is exactly halfway between 1/6 and 5/6?","o":["1/3","2/3","1/2","5/6"],"a":2,"why":"The midpoint is the average of the two endpoints."},{"q":"If x = −4/9 and y = −5/11, which statement is true?","o":["x > y","x = y","Both are positive","x < y"],"a":3,"why":"Compare the negative values by using a common denominator or decimal approximations."},{"q":"Which is the greatest of −7/12, −4/9, and −5/8?","o":["−7/12","−5/8","They are equal","−4/9"],"a":3,"why":"The greatest negative fraction is the one closest to zero."},{"q":"A student says 5/7 < 2/3 because 5 < 2 is false. Which comparison is correct?","o":["5/7 < 2/3","5/7 = 2/3","Cannot compare fractions","5/7 > 2/3"],"a":3,"why":"Cross multiply positive fractions: compare 5×3 with 2×7."},{"q":"Which value lies between −2/5 and −1/3?","o":["−1/2","−1/4","−3/10","−11/30"],"a":3,"why":"Express the bounds with denominator 30 and locate the candidate between them."},{"q":"Order 4/9, 7/15, and 1/2 from least to greatest.","o":["4/9, 7/15, 1/2","1/2, 4/9, 7/15","7/15, 1/2, 4/9","7/15, 4/9, 1/2"],"a":3,"why":"A common denominator of 90 lets you compare all three values."},{"q":"Which is greater: 13/18 or 5/7?","o":["13/18","They are equal","Cannot be determined","5/7"],"a":3,"why":"Cross multiply using positive denominators: compare 13×7 with 5×18."},{"q":"A point represents −3/8 on a number line. Which listed point is to its left?","o":["−1/4","0","1/8","−1/2"],"a":3,"why":"Points to the left represent smaller numbers; compare the negative fractions."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);\nfunction mathify(value){
 return String(value)
  .replace(/(^|[^\\w])(-?\\d+)\\s*\\/\\s*(\\d+)(?![\\w])/g,(m,prefix,n,d)=>prefix+'\\\\(\\\\frac{'+n+'}{'+d+'}\\\\)')

function typesetMath(node){

function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=mathify(item.q);
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=mathify(text);b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+mathify(item.why);}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+mathify(item.why)+' Correct answer: '+mathify(item.o[item.a])+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';typesetMath(feedback);
});
$('continue').addEventListener('click',()=>{

 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);typesetMath(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
