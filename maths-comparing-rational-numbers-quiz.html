<style>

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Which number is greater: 2/5 or 3/5?","o":["3/5","2/5","They are equal","Cannot be compared"],"a":0,"e":"The denominators are equal, so compare the numerators.","v":"comparing-rational-numbers"},{"d":"BASIC","q":"Which is greater: −1/4 or −3/4?","o":["−1/4","−3/4","They are equal","Cannot be compared"],"a":0,"e":"Among negative numbers, the value closer to zero is greater.","v":"comparing-rational-numbers"},{"d":"BASIC","q":"Which symbol makes this true: 2/7 □ 5/7?","o":["<"," >","=","≤"],"a":0,"e":"With equal positive denominators, compare the numerators.","v":"comparing-rational-numbers"},{"d":"BASIC","q":"Which fraction is the smallest?","o":["1/6","1/3","1/2","2/3"],"a":0,"e":"For positive unit fractions, a larger denominator gives a smaller value.","v":"comparing-rational-numbers"},{"d":"BASIC","q":"Which is greater: 0 or −5/8?","o":["0","−5/8","They are equal","Cannot be compared"],"a":0,"e":"Every negative rational number is less than zero.","v":"comparing-rational-numbers"},{"d":"BASIC","q":"Which fraction is greater than 1?","o":["7/5","3/8","4/9","5/6"],"a":0,"e":"A positive fraction exceeds 1 when its numerator is greater than its denominator.","v":"comparing-rational-numbers"},{"d":"BASIC","q":"Which is greater: −2/3 or −2/5?","o":["−2/5","−2/3","They are equal","Cannot be compared"],"a":0,"e":"For these negative fractions, compare their magnitudes: the smaller magnitude is closer to zero.","v":"comparing-rational-numbers"},{"d":"BASIC","q":"Which fraction is equal to 1/2 and easiest to compare with 3/4?","o":["2/4","1/4","3/2","2/3"],"a":0,"e":"An equivalent fraction can be made by multiplying numerator and denominator by the same non-zero number.","v":"comparing-rational-numbers"},{"d":"BASIC","q":"Which is the greatest number?","o":["3/4","5/6","2/3","1/2"],"a":1,"e":"Use a common denominator or decimal values to compare the positive fractions.","v":"comparing-rational-numbers"},{"d":"BASIC","q":"Which ordering is from least to greatest?","o":["1/3, 0, −1/2","−1/2, 0, 1/3","0, −1/2, 1/3","−1/2, 1/3, 0"],"a":1,"e":"Negative numbers come before zero, and positive numbers come after zero.","v":"comparing-rational-numbers"},{"d":"MEDIUM","q":"Compare 5/8 and 7/12.","o":["5/8 < 7/12","5/8 > 7/12","5/8 = 7/12","Cannot be determined"],"a":1,"e":"Use denominator 24: compare the equivalent numerators.","v":"comparing-rational-numbers"},{"d":"MEDIUM","q":"Which is greater: −5/6 or −7/9?","o":["−5/6","−7/9","They are equal","Cannot be determined"],"a":1,"e":"Convert to a common denominator and remember the sign when comparing negatives.","v":"comparing-rational-numbers"},{"d":"MEDIUM","q":"Arrange 2/3, 5/8, 3/4 from greatest to least.","o":["2/3, 3/4, 5/8","3/4, 2/3, 5/8","5/8, 2/3, 3/4","3/4, 5/8, 2/3"],"a":1,"e":"A common denominator of 24 makes all three comparisons straightforward.","v":"comparing-rational-numbers"},{"d":"MEDIUM","q":"Which number lies between 1/3 and 1/2?","o":["1/4","5/12","2/3","3/5"],"a":1,"e":"Write the endpoints with denominator 12 and compare the candidate.","v":"comparing-rational-numbers"},{"d":"MEDIUM","q":"Compare −3/5 and −4/7.","o":["−3/5 > −4/7","−3/5 < −4/7","−3/5 = −4/7","Cannot be determined"],"a":1,"e":"Convert both to denominator 35, then compare the negative values.","v":"comparing-rational-numbers"},{"d":"MEDIUM","q":"Which is the least among −2/3, −3/5, and −5/6?","o":["−2/3","−5/6","−3/5","They are equal"],"a":1,"e":"The most negative value is the least; use common denominators to confirm.","v":"comparing-rational-numbers"},{"d":"MEDIUM","q":"Which inequality is true?","o":["7/10 < 2/3","7/10 = 2/3","7/10 > 2/3","7/10 ≤ 1/2"],"a":2,"e":"Compare 7/10 and 2/3 by cross multiplication or a common denominator.","v":"comparing-rational-numbers"},{"d":"MEDIUM","q":"What is the correct ascending order of −3/4, −1/2, and −2/3?","o":["−1/2, −2/3, −3/4","−2/3, −3/4, −1/2","−3/4, −2/3, −1/2","−3/4, −1/2, −2/3"],"a":2,"e":"For negative fractions, the one with greatest absolute value is the smallest.","v":"comparing-rational-numbers"},{"d":"MEDIUM","q":"Which fraction is closest to zero but negative?","o":["−4/9","−5/9","−1/9","−7/9"],"a":2,"e":"Among negative fractions with denominator 9, the smallest magnitude is closest to zero.","v":"comparing-rational-numbers"},{"d":"MEDIUM","q":"Which fraction is greater than 3/5 but less than 2/3?","o":["1/2","3/4","5/8","7/10"],"a":2,"e":"Use denominator 120 or compare each candidate against both endpoints.","v":"comparing-rational-numbers"},{"d":"HARD","q":"Which is greater: 11/15 or 7/10?","o":["7/10","They are equal","11/15","Cannot be compared"],"a":2,"e":"Convert to denominator 30 to compare exactly.","v":"comparing-rational-numbers"},{"d":"HARD","q":"Arrange −5/8, −2/3, −3/4 from least to greatest.","o":["−5/8, −2/3, −3/4","−2/3, −5/8, −3/4","−3/4, −2/3, −5/8","−3/4, −5/8, −2/3"],"a":2,"e":"Compare their magnitudes using denominator 24, then apply the negative signs.","v":"comparing-rational-numbers"},{"d":"HARD","q":"Which rational number is exactly halfway between 1/6 and 5/6?","o":["1/3","2/3","1/2","5/6"],"a":2,"e":"The midpoint is the average of the two endpoints.","v":"comparing-rational-numbers"},{"d":"HARD","q":"If x = −4/9 and y = −5/11, which statement is true?","o":["x > y","x = y","Both are positive","x < y"],"a":3,"e":"Compare the negative values by using a common denominator or decimal approximations.","v":"comparing-rational-numbers"},{"d":"HARD","q":"Which is the greatest of −7/12, −4/9, and −5/8?","o":["−7/12","−5/8","They are equal","−4/9"],"a":3,"e":"The greatest negative fraction is the one closest to zero.","v":"comparing-rational-numbers"},{"d":"HARD","q":"A student says 5/7 < 2/3 because 5 < 2 is false. Which comparison is correct?","o":["5/7 < 2/3","5/7 = 2/3","Cannot compare fractions","5/7 > 2/3"],"a":3,"e":"Cross multiply positive fractions: compare 5×3 with 2×7.","v":"comparing-rational-numbers"},{"d":"HARD","q":"Which value lies between −2/5 and −1/3?","o":["−1/2","−1/4","−3/10","−11/30"],"a":3,"e":"Express the bounds with denominator 30 and locate the candidate between them.","v":"comparing-rational-numbers"},{"d":"HARD","q":"Order 4/9, 7/15, and 1/2 from least to greatest.","o":["4/9, 7/15, 1/2","1/2, 4/9, 7/15","7/15, 1/2, 4/9","7/15, 4/9, 1/2"],"a":3,"e":"A common denominator of 90 lets you compare all three values.","v":"comparing-rational-numbers"},{"d":"HARD","q":"Which is greater: 13/18 or 5/7?","o":["13/18","They are equal","Cannot be determined","5/7"],"a":3,"e":"Cross multiply using positive denominators: compare 13×7 with 5×18.","v":"comparing-rational-numbers"},{"d":"HARD","q":"A point represents −3/8 on a number line. Which listed point is to its left?","o":["−1/4","0","1/8","−1/2"],"a":3,"e":"Points to the left represent smaller numbers; compare the negative fractions.","v":"comparing-rational-numbers"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Compare rational numbers accurately</strong><small>Use equivalent fractions and number-line positions</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Order positive and negative fractions</strong><small>Compare fractions with common denominators</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Reason about rational-number size</strong><small>Solve ordering and inequality problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>\n<script src="/shared-nav.js?v=20261013-universal-nav-v1"></script>\n</body></html>
