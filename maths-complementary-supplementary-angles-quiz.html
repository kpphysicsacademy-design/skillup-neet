<style>
:root{--blue:#248ac0;--green:#48b516;--ink:#263746;--muted:#71808d;--line:#e3e9ed;--bg:#f7f9fa;--red:#d94b4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.nav{max-width:620px;margin:auto;min-height:48px;padding:6px 12px;display:flex;align-items:center;gap:9px}
.back{display:grid;place-items:center;flex:0 0 32px;width:32px;height:32px;border:1px solid var(--line);border-radius:9px;color:var(--blue);text-decoration:none;font-size:17px}
.brand{min-width:0;flex:1;font-size:15px;font-weight:850;white-space:nowrap}.brand small{display:none}
.pill{padding:5px 8px;border-radius:8px;font-size:11px;font-weight:800;white-space:nowrap;background:#f4f7f8;color:#52616c}
main{width:min(100% - 24px,620px);margin:auto;padding:12px 8px 28px}
.hero{padding:4px 2px 12px;margin-bottom:10px}
.hero h1{margin:0 0 3px;font-size:21px;line-height:1.25;font-weight:800;color:var(--ink)}
.muted{color:var(--muted);font-size:12px;line-height:1.4;margin:0}
.tags{display:none}
.progress-row{display:flex;justify-content:space-between;margin:11px 0 5px;font-size:11px;font-weight:750;color:var(--muted)}
.track{height:5px;border-radius:8px;background:#e8edf0;overflow:hidden}
.fill{height:100%;width:0;background:var(--green);border-radius:8px;transition:width .2s}
.quiz,.finish{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px;margin:0 0 12px}
.qmeta{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.4px}
.question{font-size:clamp(18px,3.8vw,22px);line-height:1.4;margin:8px 0 13px;font-weight:750}
.options{display:grid;gap:7px}
.option{display:flex;gap:9px;align-items:center;width:100%;min-height:42px;padding:8px 10px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:9px;color:var(--ink);font-size:14px;font-weight:650;line-height:1.35;cursor:pointer}
.letter{flex:0 0 22px;height:22px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:10px;color:var(--muted);font-weight:800}
.option.selected{border-color:var(--blue);background:#f0f8fc}
.option.correct{border-color:#a9d994;background:#f0f9ec;color:#286b19}
.option.wrong{border-color:#efb6b6;background:#fff4f4;color:#9b3030}
.option:disabled{cursor:default;opacity:1}
.feedback{display:none;margin-top:10px;padding:10px;border-radius:9px;font-size:12px;line-height:1.5}
.feedback.show{display:block}.feedback.good{background:#f0f9ec;color:#286b19}.feedback.bad{background:#fff4f4;color:#9b3030}
.actions{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;min-height:39px;border:0;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:800;cursor:pointer}
.check{background:var(--green);color:#fff}.continue{display:none;background:var(--blue);color:#fff}.continue.show{display:block}
.btn:disabled{opacity:.4;cursor:not-allowed}
.finish{text-align:center;padding:20px 14px}.trophy{font-size:42px}.score{font-size:34px;font-weight:850;color:var(--ink)}.finish h2{margin:5px 0 8px}
.finish .btn{margin-top:12px;max-width:250px;background:var(--green);color:#fff}
.review{text-align:left;margin:14px 0 5px}.review-item{padding:10px;margin:8px 0;border:1px solid var(--line);border-radius:9px;background:#fff}.review-item p{margin:4px 0}
.your-answer{color:#9b3030}.correct-answer{color:#286b19}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media(max-width:480px){
 .nav{min-height:44px;padding:5px 9px;gap:7px}.brand{font-size:14px}.pill{font-size:10px;padding:5px 7px}
 main{width:100%;padding:10px 9px 22px}.hero{padding:2px 2px 10px}.hero h1{font-size:19px}
 .quiz,.finish{padding:12px;border-radius:11px}.question{font-size:18px;margin:7px 0 11px}
 .option{min-height:39px;padding:7px 9px;font-size:13px}.options{gap:6px}
 .btn{min-height:37px;font-size:12px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>

<body>
<header><div class="nav">

<div class="brand">SkillUp <span style="color:#58a900">Maths</span></div>
<div class="pill xp">⭐ <span id="xp">0</span> XP</div>
<div class="pill streak">🔥 <span id="streak">0</span> streak</div>
</div></header>
<main>
<section class="hero">
<h1>Complementary and Supplementary Angles</h1>
<p class="muted">Angle pairs · Complements · Supplements · Equation-based problems</p>

<div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div>
<div class="track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
</section>
<section class="quiz" id="quiz">
<div class="qmeta" id="qmeta">QUESTION 1</div>
<h2 class="question" id="question"></h2>
<div class="options" id="options"></div>
<div class="feedback" id="feedback" aria-live="polite"></div>
<div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div>
</section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[{"q":"An angle measures 35°. What is its complement?","o":["55°","45°","65°","145°"],"a":0,"why":"Complementary angles total 90°; 90° − 35° = 55°."},{"q":"An angle measures 120°. What is its supplement?","o":["70°","60°","240°","30°"],"a":1,"why":"Supplementary angles total 180°; 180° − 120° = 60°."},{"q":"Which pair of angles is complementary?","o":["110° and 70°","40° and 60°","25° and 65°","90° and 90°"],"a":2,"why":"25° + 65° = 90°."},{"q":"Which pair of angles is supplementary?","o":["35° and 45°","80° and 90°","20° and 70°","115° and 65°"],"a":3,"why":"115° + 65° = 180°."},{"q":"The complement of 18° is…","o":["72°","98°","162°","82°"],"a":0,"why":"90° − 18° = 72°."},{"q":"The supplement of 47° is…","o":["227°","133°","43°","143°"],"a":1,"why":"180° − 47° = 133°."},{"q":"Two angles add up to 90°. They are called…","o":["Vertical angles","Adjacent angles","Complementary angles","Supplementary angles"],"a":2,"why":"A pair whose measures total 90° is complementary."},{"q":"Two angles add up to 180°. They are called…","o":["Acute angles","Reflex angles","Complementary angles","Supplementary angles"],"a":3,"why":"A pair whose measures total 180° is supplementary."},{"q":"A right angle is 90°. What is the complement of 90°?","o":["0°","180°","45°","90°"],"a":0,"why":"90° − 90° = 0°."},{"q":"An angle is 150°. Is its supplement acute, right, or obtuse?","o":["Right","Acute","Obtuse","Straight"],"a":1,"why":"Its supplement is 180° − 150° = 30°, which is acute."},{"q":"Two complementary angles are x° and 3x°. Find x.","o":["30°","45°","22.5°","15°"],"a":2,"why":"x + 3x = 90°, so 4x = 90° and x = 22.5°."},{"q":"Two supplementary angles are x° and (x + 20)°. Find x.","o":["100°","70°","90°","80°"],"a":3,"why":"x + x + 20 = 180°, so 2x = 160° and x = 80°."},{"q":"An angle is 12° less than its complement. Find the larger angle.","o":["51°","39°","45°","57°"],"a":0,"why":"Let the larger be L; the smaller is L − 12 and their sum is 90°, giving L = 51°."},{"q":"An angle and its supplement differ by 40°. Find the larger angle.","o":["90°","110°","140°","70°"],"a":1,"why":"Let larger L and smaller S: L + S = 180° and L − S = 40°, so L = 110°."},{"q":"One of two complementary angles is twice the other. Find the smaller angle.","o":["60°","20°","30°","45°"],"a":2,"why":"Let the smaller be x; x + 2x = 90°, so x = 30°."},{"q":"One of two supplementary angles is three times the other. Find the smaller angle.","o":["30°","60°","90°","45°"],"a":3,"why":"Let the smaller be x; x + 3x = 180°, so x = 45°."},{"q":"The complement of an angle is 24°. Find the angle.","o":["66°","76°","156°","24°"],"a":0,"why":"The angle plus 24° equals 90°, so the angle is 66°."},{"q":"The supplement of an angle is 103°. Find the angle.","o":["103°","77°","67°","87°"],"a":1,"why":"The angle plus 103° equals 180°, so it is 77°."},{"q":"Two complementary angles are (2x + 5)° and (x + 10)°. Find x.","o":["20","30","25","35"],"a":2,"why":"2x + 5 + x + 10 = 90, so 3x = 75 and x = 25."},{"q":"Two supplementary angles are (4x)° and (2x)°. Find the larger angle.","o":["60°","90°","30°","120°"],"a":3,"why":"4x + 2x = 180°, so x = 30° and the larger angle is 120°."},{"q":"Two complementary angles are in the ratio 2:3. Find the larger angle.","o":["54°","60°","36°","45°"],"a":0,"why":"Five equal parts make 90°, so each part is 18° and the larger angle is 3 × 18° = 54°."},{"q":"Two supplementary angles are in the ratio 4:5. Find the smaller angle.","o":["40°","80°","90°","100°"],"a":1,"why":"Nine equal parts make 180°, so each part is 20° and the smaller angle is 4 × 20° = 80°."},{"q":"An angle is 18° more than its complement. Find the angle.","o":["45°","72°","54°","36°"],"a":2,"why":"Let the angle be x; x = (90° − x) + 18°, so 2x = 108° and x = 54°."},{"q":"An angle is 26° less than its supplement. Find the smaller angle.","o":["103°","67°","87°","77°"],"a":3,"why":"Let smaller x; its supplement is x + 26°, so 2x + 26° = 180° and x = 77°."},{"q":"Three angles on a straight line are 2x°, 3x° and 4x°. Find the largest angle.","o":["80°","40°","60°","100°"],"a":0,"why":"2x + 3x + 4x = 180°, so x = 20°; largest is 4x = 80°."},{"q":"Two complementary angles are (x + 8)° and (2x − 5)°. Find the smaller angle.","o":["34°","37°","53°","29°"],"a":1,"why":"x + 8 + 2x − 5 = 90°, so x = 29°; the angles are 37° and 53°."},{"q":"Two supplementary angles are (3x − 10)° and (x + 30)°. Find the larger angle.","o":["100°","70°","110°","80°"],"a":2,"why":"3x − 10 + x + 30 = 180°, so x = 40°; angles are 110° and 70°."},{"q":"An angle is 4 times its complement. Find the supplement of the angle.","o":["18°","36°","144°","108°"],"a":3,"why":"Let the angle be 4x and its complement x: 5x = 90°, so the angle is 72°; its supplement is 180° − 72° = 108°."},{"q":"The sum of an angle and twice its supplement is 300°. Find the angle.","o":["60°","100°","120°","80°"],"a":0,"why":"Let angle be x: x + 2(180° − x) = 300°, so x = 60°."},{"q":"Two supplementary angles differ by 86°. Find the smaller angle.","o":["67°","47°","37°","57°"],"a":1,"why":"Let larger L and smaller S; L + S = 180° and L − S = 86°, so S = 47°."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Large Numbers Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261104-physics-path-layout-v2" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
<script src="/shared-nav.js?v=20261104-maths-header-v5"></script>
</body>
