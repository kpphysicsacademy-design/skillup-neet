<style>

 .skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}.skills-result{margin-top:14px;text-align:left}.skills-result h3{margin:0 0 8px;font-size:1rem}.skills-result .skill-item{margin-top:7px}.skill-item.unlocked{border-color:var(--green);color:var(--green2);background:#174b42} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}.diagram .accent{stroke:#58d6a3}.diagram .blue{stroke:#91b7ff}.diagram .gold{stroke:#ffd27a} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Equations</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Equation Skills"><div class="skill-title">🎯 Angle Skills</div><div class="skill-list"><div class="skill-item">Identify complementary and supplementary angles</div><div class="skill-item">Calculate missing angle measures</div><div class="skill-item">Solve angle relationship problems</div></div></section></div>
<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"An angle measures 35°. What is its complement?","o":["55°","45°","65°","145°"],"a":0,"e":"Complementary angles total 90°; 90° − 35° = 55°.","v":"complementary-supplementary-angles"},{"d":"BASIC","q":"An angle measures 120°. What is its supplement?","o":["70°","60°","240°","30°"],"a":1,"e":"Supplementary angles total 180°; 180° − 120° = 60°.","v":"complementary-supplementary-angles"},{"d":"BASIC","q":"Which pair of angles is complementary?","o":["110° and 70°","40° and 60°","25° and 65°","90° and 90°"],"a":2,"e":"25° + 65° = 90°.","v":"complementary-supplementary-angles"},{"d":"BASIC","q":"Which pair of angles is supplementary?","o":["35° and 45°","80° and 90°","20° and 70°","115° and 65°"],"a":3,"e":"115° + 65° = 180°.","v":"complementary-supplementary-angles"},{"d":"BASIC","q":"The complement of 18° is…","o":["72°","98°","162°","82°"],"a":0,"e":"90° − 18° = 72°.","v":"complementary-supplementary-angles"},{"d":"BASIC","q":"The supplement of 47° is…","o":["227°","133°","43°","143°"],"a":1,"e":"180° − 47° = 133°.","v":"complementary-supplementary-angles"},{"d":"BASIC","q":"Two angles add up to 90°. They are called…","o":["Vertical angles","Adjacent angles","Complementary angles","Supplementary angles"],"a":2,"e":"A pair whose measures total 90° is complementary.","v":"complementary-supplementary-angles"},{"d":"BASIC","q":"Two angles add up to 180°. They are called…","o":["Acute angles","Reflex angles","Complementary angles","Supplementary angles"],"a":3,"e":"A pair whose measures total 180° is supplementary.","v":"complementary-supplementary-angles"},{"d":"BASIC","q":"A right angle is 90°. What is the complement of 90°?","o":["0°","180°","45°","90°"],"a":0,"e":"90° − 90° = 0°.","v":"complementary-supplementary-angles"},{"d":"BASIC","q":"An angle is 150°. Is its supplement acute, right, or obtuse?","o":["Right","Acute","Obtuse","Straight"],"a":1,"e":"Its supplement is 180° − 150° = 30°, which is acute.","v":"complementary-supplementary-angles"},{"d":"MEDIUM","q":"Two complementary angles are x° and 3x°. Find x.","o":["30°","45°","22.5°","15°"],"a":2,"e":"x + 3x = 90°, so 4x = 90° and x = 22.5°.","v":"complementary-supplementary-angles"},{"d":"MEDIUM","q":"Two supplementary angles are x° and (x + 20)°. Find x.","o":["100°","70°","90°","80°"],"a":3,"e":"x + x + 20 = 180°, so 2x = 160° and x = 80°.","v":"complementary-supplementary-angles"},{"d":"MEDIUM","q":"An angle is 12° less than its complement. Find the larger angle.","o":["51°","39°","45°","57°"],"a":0,"e":"Let the larger be L; the smaller is L − 12 and their sum is 90°, giving L = 51°.","v":"complementary-supplementary-angles"},{"d":"MEDIUM","q":"An angle and its supplement differ by 40°. Find the larger angle.","o":["90°","110°","140°","70°"],"a":1,"e":"Let larger L and smaller S: L + S = 180° and L − S = 40°, so L = 110°.","v":"complementary-supplementary-angles"},{"d":"MEDIUM","q":"One of two complementary angles is twice the other. Find the smaller angle.","o":["60°","20°","30°","45°"],"a":2,"e":"Let the smaller be x; x + 2x = 90°, so x = 30°.","v":"complementary-supplementary-angles"},{"d":"MEDIUM","q":"One of two supplementary angles is three times the other. Find the smaller angle.","o":["30°","60°","90°","45°"],"a":3,"e":"Let the smaller be x; x + 3x = 180°, so x = 45°.","v":"complementary-supplementary-angles"},{"d":"MEDIUM","q":"The complement of an angle is 24°. Find the angle.","o":["66°","76°","156°","24°"],"a":0,"e":"The angle plus 24° equals 90°, so the angle is 66°.","v":"complementary-supplementary-angles"},{"d":"MEDIUM","q":"The supplement of an angle is 103°. Find the angle.","o":["103°","77°","67°","87°"],"a":1,"e":"The angle plus 103° equals 180°, so it is 77°.","v":"complementary-supplementary-angles"},{"d":"MEDIUM","q":"Two complementary angles are (2x + 5)° and (x + 10)°. Find x.","o":["20","30","25","35"],"a":2,"e":"2x + 5 + x + 10 = 90, so 3x = 75 and x = 25.","v":"complementary-supplementary-angles"},{"d":"MEDIUM","q":"Two supplementary angles are (4x)° and (2x)°. Find the larger angle.","o":["60°","90°","30°","120°"],"a":3,"e":"4x + 2x = 180°, so x = 30° and the larger angle is 120°.","v":"complementary-supplementary-angles"},{"d":"HARD","q":"Two complementary angles are in the ratio 2:3. Find the larger angle.","o":["54°","60°","36°","45°"],"a":0,"e":"Five equal parts make 90°, so each part is 18° and the larger angle is 3 × 18° = 54°.","v":"complementary-supplementary-angles"},{"d":"HARD","q":"Two supplementary angles are in the ratio 4:5. Find the smaller angle.","o":["40°","80°","90°","100°"],"a":1,"e":"Nine equal parts make 180°, so each part is 20° and the smaller angle is 4 × 20° = 80°.","v":"complementary-supplementary-angles"},{"d":"HARD","q":"An angle is 18° more than its complement. Find the angle.","o":["45°","72°","54°","36°"],"a":2,"e":"Let the angle be x; x = (90° − x) + 18°, so 2x = 108° and x = 54°.","v":"complementary-supplementary-angles"},{"d":"HARD","q":"An angle is 26° less than its supplement. Find the smaller angle.","o":["103°","67°","87°","77°"],"a":3,"e":"Let smaller x; its supplement is x + 26°, so 2x + 26° = 180° and x = 77°.","v":"complementary-supplementary-angles"},{"d":"HARD","q":"Three angles on a straight line are 2x°, 3x° and 4x°. Find the largest angle.","o":["80°","40°","60°","100°"],"a":0,"e":"2x + 3x + 4x = 180°, so x = 20°; largest is 4x = 80°.","v":"complementary-supplementary-angles"},{"d":"HARD","q":"Two complementary angles are (x + 8)° and (2x − 5)°. Find the smaller angle.","o":["34°","37°","53°","29°"],"a":1,"e":"x + 8 + 2x − 5 = 90°, so x = 29°; the angles are 37° and 53°.","v":"complementary-supplementary-angles"},{"d":"HARD","q":"Two supplementary angles are (3x − 10)° and (x + 30)°. Find the larger angle.","o":["100°","70°","110°","80°"],"a":2,"e":"3x − 10 + x + 30 = 180°, so x = 40°; angles are 110° and 70°.","v":"complementary-supplementary-angles"},{"d":"HARD","q":"An angle is 4 times its complement. Find the supplement of the angle.","o":["18°","36°","144°","108°"],"a":3,"e":"Let the angle be 4x and its complement x: 5x = 90°, so the angle is 72°; its supplement is 180° − 72° = 108°.","v":"complementary-supplementary-angles"},{"d":"HARD","q":"The sum of an angle and twice its supplement is 300°. Find the angle.","o":["60°","100°","120°","80°"],"a":0,"e":"Let angle be x: x + 2(180° − x) = 300°, so x = 60°.","v":"complementary-supplementary-angles"},{"d":"HARD","q":"Two supplementary angles differ by 86°. Find the smaller angle.","o":["67°","47°","37°","57°"],"a":1,"e":"Let larger L and smaller S; L + S = 180° and L − S = 86°, so S = 47°.","v":"complementary-supplementary-angles"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}const visuals={
balance:'',
blocks:'',
bars:'',
picture:''
};function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🔢</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+'<div class="skill-item '+(correct>=8?'unlocked':'')+'">'+(correct>=8?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Identify complementary and supplementary angles</div>'+'<div class="skill-item '+(correct>=18?'unlocked':'')+'">'+(correct>=18?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Calculate missing angle measures</div>'+'<div class="skill-item '+(correct>=24?'unlocked':'')+'">'+(correct>=24?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Solve angle relationship problems</div>'+'</div></div>' ;$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script>
