<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What is the principal in a loan of ₹1,000?","o":["₹1,000","₹100","₹1,100","₹10"],"a":0,"e":"The principal is the original amount borrowed or invested: ₹1,000.","v":"compound-interest-basics"},{"d":"BASIC","q":"At 10% per year, what is the simple interest on ₹500 for one year?","o":["₹5","₹50","₹100","₹550"],"a":1,"e":"Interest = 10% of ₹500 for one year = ₹50.","v":"compound-interest-basics"},{"d":"BASIC","q":"₹1,000 is invested at 10% compound interest per year. What is the amount after one year?","o":["₹1,200","₹1,010","₹1,100","₹1,000"],"a":2,"e":"After one year, amount = ₹1,000 × 1.10 = ₹1,100.","v":"compound-interest-basics"},{"d":"BASIC","q":"At 10% compound interest annually, what interest is earned on ₹200 in the first year?","o":["₹200","₹10","₹22","₹20"],"a":3,"e":"First-year interest = 10% of ₹200 = ₹20.","v":"compound-interest-basics"},{"d":"BASIC","q":"What is the amount after one year on ₹800 at 5% compound interest per year?","o":["₹840","₹805","₹845","₹880"],"a":0,"e":"Amount = ₹800 × 1.05 = ₹840.","v":"compound-interest-basics"},{"d":"BASIC","q":"Compound interest is calculated on which amount in later years?","o":["Only the original principal","Principal plus previously added interest","Only the previous year's interest","The interest rate only"],"a":1,"e":"Each period's interest is calculated on the updated amount, including earlier interest.","v":"compound-interest-basics"},{"d":"BASIC","q":"₹1,000 earns 10% compound interest for one year. How much interest is earned?","o":["₹1,100","₹10","₹100","₹90"],"a":2,"e":"10% of ₹1,000 is ₹100.","v":"compound-interest-basics"},{"d":"BASIC","q":"At 10% annual compound interest, what is the amount on ₹100 after two years?","o":["₹122","₹120","₹110","₹121"],"a":3,"e":"Year 1: ₹110; year 2: ₹110 × 1.10 = ₹121.","v":"compound-interest-basics"},{"d":"BASIC","q":"Which expression gives the amount after one year at annual rate r on principal P?","o":["P(1 + r)","P + r","Pr","P(1 − r)"],"a":0,"e":"For one year, the amount is principal multiplied by one plus the rate as a decimal.","v":"compound-interest-basics"},{"d":"BASIC","q":"A deposit of ₹2,000 earns 5% compound interest for one year. Find the interest.","o":["₹50","₹100","₹2,100","₹150"],"a":1,"e":"5% of ₹2,000 = ₹100.","v":"compound-interest-basics"},{"d":"MEDIUM","q":"Find the amount on ₹2,000 at 10% compound interest per year for two years.","o":["₹2,440","₹2,400","₹2,420","₹2,200"],"a":2,"e":"Amount = ₹2,000 × 1.1² = ₹2,420.","v":"compound-interest-basics"},{"d":"MEDIUM","q":"Find the compound interest on ₹1,000 at 10% per year for two years.","o":["₹110","₹200","₹220","₹210"],"a":3,"e":"Amount = ₹1,210; compound interest = ₹1,210 − ₹1,000 = ₹210.","v":"compound-interest-basics"},{"d":"MEDIUM","q":"₹4,000 is invested at 5% compound interest annually for two years. Find the amount.","o":["₹4,410","₹4,400","₹4,420","₹4,200"],"a":0,"e":"Amount = ₹4,000 × 1.05² = ₹4,410.","v":"compound-interest-basics"},{"d":"MEDIUM","q":"What is the compound interest on ₹5,000 at 10% per year for two years?","o":["₹1,000","₹1,050","₹1,100","₹500"],"a":1,"e":"Amount = ₹5,000 × 1.1² = ₹6,050; interest = ₹1,050.","v":"compound-interest-basics"},{"d":"MEDIUM","q":"₹1,500 grows at 20% compound interest annually for two years. What is the final amount?","o":["₹1,860","₹2,100","₹2,160","₹2,400"],"a":2,"e":"Amount = ₹1,500 × 1.2² = ₹2,160.","v":"compound-interest-basics"},{"d":"MEDIUM","q":"At 10% compound interest, an amount of ₹1,210 is reached from ₹1,000. How long was it invested?","o":["4 years","1 year","3 years","2 years"],"a":3,"e":"₹1,000 × 1.1² = ₹1,210, so the time is two years.","v":"compound-interest-basics"},{"d":"MEDIUM","q":"Find the difference between compound interest and simple interest on ₹1,000 at 10% per year for two years.","o":["₹10","₹0","₹20","₹21"],"a":0,"e":"Simple interest is ₹200; compound interest is ₹210; difference = ₹10.","v":"compound-interest-basics"},{"d":"MEDIUM","q":"A principal of ₹3,000 is compounded annually at 10%. What is the interest in the second year?","o":["₹300","₹330","₹360","₹630"],"a":1,"e":"After year one the amount is ₹3,300; 10% of ₹3,300 is ₹330.","v":"compound-interest-basics"},{"d":"MEDIUM","q":"At 5% compound interest per year, what is the amount on ₹10,000 after two years?","o":["₹10,500","₹11,000","₹11,025","₹11,250"],"a":2,"e":"Amount = ₹10,000 × 1.05² = ₹11,025.","v":"compound-interest-basics"},{"d":"MEDIUM","q":"A sum of ₹2,500 becomes ₹3,025 in two years at annual compound interest. What is the annual rate?","o":["15%","5%","12%","10%"],"a":3,"e":"₹3,025 ÷ ₹2,500 = 1.21 = 1.1², so the annual rate is 10%.","v":"compound-interest-basics"},{"d":"HARD","q":"Find the compound interest on ₹8,000 at 10% per year for three years, compounded annually.","o":["₹2,648","₹2,400","₹2,880","₹10,648"],"a":0,"e":"Amount = ₹8,000 × 1.1³ = ₹10,648; interest = ₹2,648.","v":"compound-interest-basics"},{"d":"HARD","q":"₹6,000 is invested at 10% compound interest annually. What is the interest earned during the third year?","o":["₹600","₹726","₹660","₹1,986"],"a":1,"e":"Amount after two years is ₹7,260; third-year interest = 10% of ₹7,260 = ₹726.","v":"compound-interest-basics"},{"d":"HARD","q":"A sum becomes ₹1,331 from ₹1,000 in three years at annual compound interest. Find the annual rate.","o":["9%","11%","10%","12%"],"a":2,"e":"₹1,331 ÷ ₹1,000 = 1.331 = 1.1³, so the rate is 10%.","v":"compound-interest-basics"},{"d":"HARD","q":"At 10% compound interest per year, a principal becomes ₹2,662 in three years. What was the principal?","o":["₹2,400","₹2,200","₹1,800","₹2,000"],"a":3,"e":"Growth factor = 1.1³ = 1.331; ₹2,662 ÷ 1.331 = ₹2,000.","v":"compound-interest-basics"},{"d":"HARD","q":"A bank compounds interest annually at 8%. What is the amount on ₹12,500 after two years?","o":["₹14,580","₹14,500","₹13,500","₹14,700"],"a":0,"e":"Amount = ₹12,500 × 1.08² = ₹14,580.","v":"compound-interest-basics"},{"d":"HARD","q":"The compound interest on ₹2,000 at 10% per year for two years is reinvested. What is the amount after those two years?","o":["₹2,400","₹2,420","₹2,200","₹2,440"],"a":1,"e":"The amount after two annual periods is ₹2,000 × 1.1² = ₹2,420.","v":"compound-interest-basics"},{"d":"HARD","q":"A sum is compounded annually at 20% for two years. If the principal is ₹2,500, how much greater is compound interest than simple interest?","o":["₹200","₹0","₹100","₹120"],"a":2,"e":"CI = ₹2,500 × (1.44 − 1) = ₹1,100; SI = ₹1,000; difference = ₹100.","v":"compound-interest-basics"},{"d":"HARD","q":"An amount of ₹4,840 is reached from ₹4,000 in two years at annual compound interest. What is the rate?","o":["9%","8%","12%","10%"],"a":3,"e":"₹4,840 ÷ ₹4,000 = 1.21 = 1.1², giving 10% per year.","v":"compound-interest-basics"},{"d":"HARD","q":"A principal of ₹10,000 is compounded annually at 10%. What is the total interest earned over three years?","o":["₹3,310","₹3,000","₹3,100","₹13,310"],"a":0,"e":"Amount = ₹10,000 × 1.1³ = ₹13,310; interest = ₹3,310.","v":"compound-interest-basics"},{"d":"HARD","q":"A deposit earns 10% compound interest annually. Its amount after two years is ₹6,050. What was the principal?","o":["₹4,500","₹5,000","₹5,500","₹6,000"],"a":1,"e":"Two-year growth factor is 1.21; ₹6,050 ÷ 1.21 = ₹5,000.","v":"compound-interest-basics"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Calculate compound interest</strong><small>Principal, rate, time and compound amount</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Annual compounding and interest growth</strong><small>Solve compound interest problems step by step</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply percentages to real-life situations</strong><small>Reason about perfect squares and nearest squares</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
