<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="skillup-release" content="20261107-cone-sphere-simulator-v1"><title>Cone and Sphere · Simulator | SkillUp Maths</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f9fa;color:#263746;font:15px/1.5 system-ui}header{background:#fff;border-bottom:1px solid #e3e9ed}.nav,main{width:min(100% - 24px,680px);margin:auto}.nav{height:50px;display:flex;align-items:center;gap:12px}.nav a{color:#248ac0;text-decoration:none;font-weight:800}.nav b{flex:1}main{padding:18px 6px 40px}h1{font-size:26px;margin:4px 0}.muted{color:#71808d;font-size:13px}.card{background:#fff;border:1px solid #e3e9ed;border-radius:16px;padding:16px;margin:12px 0}.tabs{display:flex;gap:8px}.tabs button{flex:1;border:1px solid #dce5eb;background:#fff;border-radius:10px;padding:11px;font-weight:800;color:#263746}.tabs button.active{background:#eaf5fb;border-color:#248ac0;color:#236b91}.control{margin:14px 0}.control label{display:flex;justify-content:space-between;font-weight:750;font-size:13px}.control input{width:100%;accent-color:#48b516}.outputs{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.out{background:#f0f8fc;border:1px solid #d8eaf4;border-radius:12px;padding:12px}.out small{display:block;color:#71808d}.out strong{font-size:18px}.formula{background:#f7f9fa;padding:12px;border-radius:11px;font-size:13px;line-height:1.8}.visual{display:flex;justify-content:center;align-items:center;min-height:160px;background:#f7fbff;border-radius:12px;margin-bottom:12px}svg{max-width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.actions a{padding:10px 13px;background:#48b516;color:#17350b;border-radius:10px;text-decoration:none;font-weight:800;font-size:12px}.actions a.secondary{background:#eaf5fb;color:#236b91}</style></head><body><header><div class="nav"><a href="maths-home.html">← Maths</a><b>SkillUp · Simulator</b><a href="maths-cone-sphere-learn.html?v=20261107-cone-sphere-brief-learn-v1">Brief Learn</a></div></header><main><div class="muted">INTERACTIVE MENSURATION LAB</div><h1>Cone and Sphere Simulator</h1><p class="muted">Change the dimensions and observe how surface area and volume respond.</p><section class="card"><div class="tabs"><button id="coneBtn" class="active">Cone</button><button id="sphereBtn">Sphere</button></div><div class="visual" id="visual"></div><div id="coneControls"><div class="control"><label>Radius (r) <output id="rv">3</output> cm</label><input id="r" type="range" min="1" max="15" value="3"></div><div class="control"><label>Height (h) <output id="hv">4</output> cm</label><input id="h" type="range" min="1" max="20" value="4"></div></div><div id="sphereControls" hidden><div class="control"><label>Radius (r) <output id="srv">5</output> cm</label><input id="sr" type="range" min="1" max="15" value="5"></div></div><div class="outputs"><div class="out"><small id="areaLabel">Curved surface area</small><strong id="area">—</strong></div><div class="out"><small id="totalLabel">Total surface area</small><strong id="total">—</strong></div><div class="out"><small>Volume</small><strong id="volume">—</strong></div><div class="out"><small id="extraLabel">Slant height</small><strong id="extra">—</strong></div></div><p class="formula" id="formula"></p></section><div class="actions"><a class="secondary" href="maths-cone-sphere-learn.html?v=20261107-cone-sphere-brief-learn-v1">📘 Brief Learn</a><a href="maths-cone-sphere-class9-quiz.html?v=20261107-cone-sphere-quiz-v1">Practice 30 questions →</a><a class="secondary" href="maths-home.html">Maths Home</a></div></main><script>const $=id=>document.getElementById(id),fmt=n=>Number(n.toFixed(2)).toString();let mode='cone';function drawCone(r,h){$('visual').innerHTML='<svg viewBox="0 0 220 150" width="220" height="150" role="img" aria-label="Cone diagram"><path d="M110 12 L35 118 Q110 144 185 118 Z" fill="#dff2ff" stroke="#248ac0" stroke-width="2"/><ellipse cx="110" cy="118" rx="75" ry="17" fill="none" stroke="#248ac0" stroke-width="2"/><path d="M110 12 V118 M110 118 H185" stroke="#48b516" stroke-width="2" stroke-dasharray="4 3"/><text x="116" y="70" fill="#263746" font-size="12">h='+h+'</text><text x="145" y="136" fill="#263746" font-size="12">r='+r+'</text></svg>'}function drawSphere(r){$('visual').innerHTML='<svg viewBox="0 0 200 150" width="200" height="150" role="img" aria-label="Sphere diagram"><circle cx="95" cy="72" r="55" fill="#e8e2ff" stroke="#7757c8" stroke-width="2"/><ellipse cx="95" cy="72" rx="55" ry="18" fill="none" stroke="#7757c8" stroke-dasharray="4 3"/><path d="M95 72 H150" stroke="#48b516" stroke-width="2"/><text x="119" y="64" font-size="12" fill="#263746">r='+r+'</text></svg>'}function cone(){const r=+$('r').value,h=+$('h').value,l=Math.sqrt(r*r+h*h),csa=Math.PI*r*l,tsa=csa+Math.PI*r*r,v=Math.PI*r*r*h/3;$('rv').textContent=r;$('hv').textContent=h;$('areaLabel').textContent='Curved surface area';$('totalLabel').textContent='Total surface area';$('extraLabel').textContent='Slant height';$('area').textContent=fmt(csa)+' cm²';$('total').textContent=fmt(tsa)+' cm²';$('volume').textContent=fmt(v)+' cm³';$('extra').textContent=fmt(l)+' cm';$('formula').textContent='l = √(r² + h²) = '+fmt(l)+' cm · CSA = πrl · TSA = πr(l + r) · V = ⅓πr²h';drawCone(r,h)}function sphere(){const r=+$('sr').value,sa=4*Math.PI*r*r,v=4*Math.PI*r*r*r/3;$('srv').textContent=r;$('areaLabel').textContent='Surface area';$('totalLabel').textContent='Surface area (same)';$('extraLabel').textContent='Diameter';$('area').textContent=fmt(sa)+' cm²';$('total').textContent=fmt(sa)+' cm²';$('volume').textContent=fmt(v)+' cm³';$('extra').textContent=(2*r)+' cm';$('formula').textContent='Surface area = 4πr² · Volume = ⁴⁄₃πr³ · Diameter = 2r';drawSphere(r)}function setMode(m){mode=m;$('coneControls').hidden=m!=='cone';$('sphereControls').hidden=m!=='sphere';$('coneBtn').classList.toggle('active',m==='cone');$('sphereBtn').classList.toggle('active',m==='sphere');m==='cone'?cone():sphere()}$('coneBtn').addEventListener('click',()=>setMode('cone'));$('sphereBtn').addEventListener('click',()=>setMode('sphere'));['r','h'].forEach(id=>$(id).addEventListener('input',cone));$('sr').addEventListener('input',sphere);cone();</script></body></html>
