<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"Two figures are congruent when they have:","o":["Same shape only","Same size only","Same shape and same size","Same perimeter only"],"a":2,"why":"Congruent figures match exactly in shape and size."},{"d":"BASIC","q":"Which is a valid triangle congruence criterion?","o":["AAA","SSS","SSA in every case","Equal perimeter"],"a":1,"why":"SSS says three corresponding sides are equal."},{"d":"BASIC","q":"SSS stands for:","o":["Side-Side-Side","Side-Sum-Side","Same-Side-Same","Side-Shape-Side"],"a":0,"why":"All three corresponding sides must be equal."},{"d":"BASIC","q":"SAS congruence requires two sides and the:","o":["Non-included angle","Included angle","Third side","Largest angle"],"a":1,"why":"The angle between the two corresponding sides must be equal."},{"d":"BASIC","q":"ASA stands for:","o":["Angle-Side-Angle","Angle-Sum-Angle","Area-Side-Area","Angle-Side-Area"],"a":0,"why":"ASA compares two angles and their included side."},{"d":"BASIC","q":"RHS is used for:","o":["Any quadrilaterals","Right-angled triangles","Equilateral triangles only","Any pair with equal angles"],"a":1,"why":"RHS is a congruence criterion for right triangles."},{"d":"BASIC","q":"If △ABC ≅ △PQR, vertex A corresponds to:","o":["P","Q","R","All three"],"a":0,"why":"The order of letters gives the correspondence A↔P, B↔Q, C↔R."},{"d":"BASIC","q":"CPCT means corresponding parts of congruent triangles are:","o":["Always perpendicular","Equal","Parallel","Supplementary"],"a":1,"why":"CPCT stands for Corresponding Parts of Congruent Triangles are equal."},{"d":"BASIC","q":"If three sides of one triangle equal the three corresponding sides of another, use:","o":["ASA","RHS","SSS","AAA"],"a":2,"why":"Three pairs of equal corresponding sides establish SSS congruence."},{"d":"BASIC","q":"AAA equality of angles generally proves triangles are:","o":["Congruent","Similar","Equilateral","Right-angled"],"a":1,"why":"AAA fixes shape but not size, so it establishes similarity, not congruence."},{"d":"MEDIUM","q":"In △ABC and △DEF, AB=DE, BC=EF and AC=DF. The triangles are congruent by:","o":["SAS","ASA","SSS","RHS"],"a":2,"why":"All three corresponding side pairs are equal."},{"d":"MEDIUM","q":"AB=PQ, AC=PR and ∠A=∠P, where the angles are included between the given sides. Criterion?","o":["SAS","SSA","AAA","RHS"],"a":0,"why":"Two sides and their included angle are equal: SAS."},{"d":"MEDIUM","q":"∠A=∠D, AB=DE and ∠B=∠E. Which criterion applies?","o":["SSS","ASA","RHS","AAA"],"a":1,"why":"The equal side lies between the two equal angles, so ASA applies."},{"d":"MEDIUM","q":"Two right triangles have equal hypotenuses and one corresponding leg equal. They are congruent by:","o":["AAA","RHS","SSA only","ASA only"],"a":1,"why":"For right triangles, equal hypotenuse and one equal side establish RHS."},{"d":"MEDIUM","q":"If △ABC ≅ △XYZ, which side corresponds to BC?","o":["XY","YZ","XZ","YX and XZ"],"a":1,"why":"The order gives B↔Y and C↔Z, so BC corresponds to YZ."},{"d":"MEDIUM","q":"If △ABC ≅ △PQR and ∠B=48°, then ∠Q is:","o":["42°","48°","90°","132°"],"a":1,"why":"Corresponding angles of congruent triangles are equal."},{"d":"MEDIUM","q":"Two triangles have two equal sides and an equal angle that is NOT between those sides. Is this always enough?","o":["Yes, always SAS","Yes, always ASA","No, SSA is not a general criterion","Yes, always SSS"],"a":2,"why":"SSA does not guarantee congruence in general; the included angle matters for SAS."},{"d":"MEDIUM","q":"If AB=DE, BC=EF and ∠B=∠E, then △ABC and △DEF are congruent by:","o":["SAS","SSS","AAA","RHS"],"a":0,"why":"∠B and ∠E are included between the given equal side pairs."},{"d":"MEDIUM","q":"Two triangles have two equal angles and a corresponding side that is NOT between those angles. Which criterion applies?","o":["AAS","SSS","RHS","AAA"],"a":0,"why":"Two corresponding angles and a non-included corresponding side determine congruence by AAS; the third angle is fixed by the 180° angle sum."},{"d":"MEDIUM","q":"If △ABC ≅ △DEF, AB=7 cm and DE corresponds to AB. DE equals:","o":["3.5 cm","7 cm","14 cm","Cannot be found"],"a":1,"why":"Corresponding sides of congruent triangles are equal."},{"d":"HARD","q":"In △ABC and △PQR, AB=PQ, AC=PR and ∠A=∠P. What additional detail is essential for SAS?","o":["∠A and ∠P are included between those sides","BC=QR must already be known","All angles are 90°","The perimeters are equal"],"a":0,"why":"The equal angle must be the included angle between the two known sides."},{"d":"HARD","q":"In an RHS proof, which set of facts is sufficient?","o":["One acute angle and one leg equal","Hypotenuse and one corresponding leg equal in right triangles","All three angles equal","Two sides and a non-included angle in any triangles"],"a":1,"why":"Both triangles must be right-angled, with hypotenuse and one corresponding side equal."},{"d":"HARD","q":"△ABC ≅ △DEF. If ∠A=35° and ∠B=65°, then ∠F is:","o":["35°","65°","80°","100°"],"a":2,"why":"∠C=180°−35°−65°=80°. C corresponds to F."},{"d":"HARD","q":"Which statement is justified directly by CPCT after proving △ABC ≅ △PQR?","o":["AB+BC=180°","∠A=∠P","Every side is parallel","Both triangles have area zero"],"a":1,"why":"CPCT lets us conclude equality of corresponding sides and angles."},{"d":"HARD","q":"For △ABC ≅ △XYZ, the correspondence is A↔X, B↔Y, C↔Z. Which equality is correct?","o":["AC=XY","∠B=∠Z","BC=YZ","AB=XZ"],"a":2,"why":"Side BC corresponds to side YZ under the stated vertex matching."},{"d":"HARD","q":"Two triangles have sides 4 cm, 6 cm, 8 cm and 4 cm, 6 cm, 8 cm respectively. Which conclusion follows?","o":["Congruent by SSS","Only similar, never congruent","Congruent by AAA","Not enough information"],"a":0,"why":"All three side lengths match, so SSS proves congruence."},{"d":"HARD","q":"Two triangles have angles 40°, 60°, 80° each, but their side lengths differ by a scale factor. They must be:","o":["Congruent by AAA","Similar, but not necessarily congruent","Congruent by RHS","Not triangles"],"a":1,"why":"Equal angles give similarity; different sizes mean they are not congruent."},{"d":"HARD","q":"Which condition is insufficient on its own to prove two triangles congruent?","o":["SSS","SAS with included angle","ASA","AAA"],"a":3,"why":"AAA determines shape but not size, so it cannot alone prove congruence."},{"d":"HARD","q":"In two right triangles, hypotenuse lengths are equal and one leg is 5 cm in both. What follows?","o":["They are congruent by RHS","They are congruent by AAA","They are congruent by SSA for all triangles","Only their perimeters are equal"],"a":0,"why":"Right angles, equal hypotenuses and one equal leg satisfy RHS."},{"d":"HARD","q":"△ABC ≅ △DEF, AB=2x+1 and DE=11. If AB corresponds to DE, x equals:","o":["4","5","6","10"],"a":1,"why":"Corresponding sides are equal: 2x+1=11, so x=5."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round((index)/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1)+' · '+item.d;
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Congruence Criteria Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
