<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Two figures are congruent when they have:","o":["Same shape only","Same size only","Same shape and same size","Same perimeter only"],"a":2,"e":"Congruent figures match exactly in shape and size."},{"d":"BASIC","q":"Which is a valid triangle congruence criterion?","o":["AAA","SSS","SSA in every case","Equal perimeter"],"a":1,"e":"SSS says three corresponding sides are equal."},{"d":"BASIC","q":"SSS stands for:","o":["Side-Side-Side","Side-Sum-Side","Same-Side-Same","Side-Shape-Side"],"a":0,"e":"All three corresponding sides must be equal."},{"d":"BASIC","q":"SAS congruence requires two sides and the:","o":["Non-included angle","Included angle","Third side","Largest angle"],"a":1,"e":"The angle between the two corresponding sides must be equal."},{"d":"BASIC","q":"ASA stands for:","o":["Angle-Side-Angle","Angle-Sum-Angle","Area-Side-Area","Angle-Side-Area"],"a":0,"e":"ASA compares two angles and their included side."},{"d":"BASIC","q":"RHS is used for:","o":["Any quadrilaterals","Right-angled triangles","Equilateral triangles only","Any pair with equal angles"],"a":1,"e":"RHS is a congruence criterion for right triangles."},{"d":"BASIC","q":"If △ABC ≅ △PQR, vertex A corresponds to:","o":["P","Q","R","All three"],"a":0,"e":"The order of letters gives the correspondence A↔P, B↔Q, C↔R."},{"d":"BASIC","q":"CPCT means corresponding parts of congruent triangles are:","o":["Always perpendicular","Equal","Parallel","Supplementary"],"a":1,"e":"CPCT stands for Corresponding Parts of Congruent Triangles are equal."},{"d":"BASIC","q":"If three sides of one triangle equal the three corresponding sides of another, use:","o":["ASA","RHS","SSS","AAA"],"a":2,"e":"Three pairs of equal corresponding sides establish SSS congruence."},{"d":"BASIC","q":"AAA equality of angles generally proves triangles are:","o":["Congruent","Similar","Equilateral","Right-angled"],"a":1,"e":"AAA fixes shape but not size, so it establishes similarity, not congruence."},{"d":"MEDIUM","q":"In △ABC and △DEF, AB=DE, BC=EF and AC=DF. The triangles are congruent by:","o":["SAS","ASA","SSS","RHS"],"a":2,"e":"All three corresponding side pairs are equal."},{"d":"MEDIUM","q":"AB=PQ, AC=PR and ∠A=∠P, where the angles are included between the given sides. Criterion?","o":["SAS","SSA","AAA","RHS"],"a":0,"e":"Two sides and their included angle are equal: SAS."},{"d":"MEDIUM","q":"∠A=∠D, AB=DE and ∠B=∠E. Which criterion applies?","o":["SSS","ASA","RHS","AAA"],"a":1,"e":"The equal side lies between the two equal angles, so ASA applies."},{"d":"MEDIUM","q":"Two right triangles have equal hypotenuses and one corresponding leg equal. They are congruent by:","o":["AAA","RHS","SSA only","ASA only"],"a":1,"e":"For right triangles, equal hypotenuse and one equal side establish RHS."},{"d":"MEDIUM","q":"If △ABC ≅ △XYZ, which side corresponds to BC?","o":["XY","YZ","XZ","YX and XZ"],"a":1,"e":"The order gives B↔Y and C↔Z, so BC corresponds to YZ."},{"d":"MEDIUM","q":"If △ABC ≅ △PQR and ∠B=48°, then ∠Q is:","o":["42°","48°","90°","132°"],"a":1,"e":"Corresponding angles of congruent triangles are equal."},{"d":"MEDIUM","q":"Two triangles have two equal sides and an equal angle that is NOT between those sides. Is this always enough?","o":["Yes, always SAS","Yes, always ASA","No, SSA is not a general criterion","Yes, always SSS"],"a":2,"e":"SSA does not guarantee congruence in general; the included angle matters for SAS."},{"d":"MEDIUM","q":"If AB=DE, BC=EF and ∠B=∠E, then △ABC and △DEF are congruent by:","o":["SAS","SSS","AAA","RHS"],"a":0,"e":"∠B and ∠E are included between the given equal side pairs."},{"d":"MEDIUM","q":"Two triangles have two angles equal pairwise and their included sides equal. Which criterion is most direct?","o":["ASA","SSS","RHS","AAA"],"a":0,"e":"Two angles and the included side match, so ASA applies."},{"d":"MEDIUM","q":"If △ABC ≅ △DEF, AB=7 cm and DE corresponds to AB. DE equals:","o":["3.5 cm","7 cm","14 cm","Cannot be found"],"a":1,"e":"Corresponding sides of congruent triangles are equal."},{"d":"HARD","q":"In △ABC and △PQR, AB=PQ, AC=PR and ∠A=∠P. What additional detail is essential for SAS?","o":["∠A and ∠P are included between those sides","BC=QR must already be known","All angles are 90°","The perimeters are equal"],"a":0,"e":"The equal angle must be the included angle between the two known sides."},{"d":"HARD","q":"In an RHS proof, which set of facts is sufficient?","o":["One acute angle and one leg equal","Hypotenuse and one corresponding leg equal in right triangles","All three angles equal","Two sides and a non-included angle in any triangles"],"a":1,"e":"Both triangles must be right-angled, with hypotenuse and one corresponding side equal."},{"d":"HARD","q":"△ABC ≅ △DEF. If ∠A=35° and ∠B=65°, then ∠F is:","o":["35°","65°","80°","100°"],"a":2,"e":"∠C=180°−35°−65°=80°. C corresponds to F."},{"d":"HARD","q":"Which statement is justified directly by CPCT after proving △ABC ≅ △PQR?","o":["AB+BC=180°","∠A=∠P","Every side is parallel","Both triangles have area zero"],"a":1,"e":"CPCT lets us conclude equality of corresponding sides and angles."},{"d":"HARD","q":"For △ABC ≅ △XYZ, the correspondence is A↔X, B↔Y, C↔Z. Which equality is correct?","o":["AC=XY","∠B=∠Z","BC=YZ","AB=XZ"],"a":2,"e":"Side BC corresponds to side YZ under the stated vertex matching."},{"d":"HARD","q":"Two triangles have sides 4 cm, 6 cm, 8 cm and 4 cm, 6 cm, 8 cm respectively. Which conclusion follows?","o":["Congruent by SSS","Only similar, never congruent","Congruent by AAA","Not enough information"],"a":0,"e":"All three side lengths match, so SSS proves congruence."},{"d":"HARD","q":"Two triangles have angles 40°, 60°, 80° each, but their side lengths differ by a scale factor. They must be:","o":["Congruent by AAA","Similar, but not necessarily congruent","Congruent by RHS","Not triangles"],"a":1,"e":"Equal angles give similarity; different sizes mean they are not congruent."},{"d":"HARD","q":"Which condition is insufficient on its own to prove two triangles congruent?","o":["SSS","SAS with included angle","ASA","AAA"],"a":3,"e":"AAA determines shape but not size, so it cannot alone prove congruence."},{"d":"HARD","q":"In two right triangles, hypotenuse lengths are equal and one leg is 5 cm in both. What follows?","o":["They are congruent by RHS","They are congruent by AAA","They are congruent by SSA for all triangles","Only their perimeters are equal"],"a":0,"e":"Right angles, equal hypotenuses and one equal leg satisfy RHS."},{"d":"HARD","q":"△ABC ≅ △DEF, AB=2x+1 and DE=11. If AB corresponds to DE, x equals:","o":["4","5","6","10"],"a":1,"e":"Corresponding sides are equal: 2x+1=11, so x=5."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Master triangle congruence</strong><small>Apply triangle congruence criteria</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Match corresponding parts</strong><small>Use CPCT accurately</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Prove triangles congruent</strong><small>Choose SSS, SAS, ASA and RHS</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
