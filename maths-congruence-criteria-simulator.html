:root{--blue:#248ac0;--green:#48b516;--ink:#263746;--muted:#71808d;--line:#e3e9ed;--bg:#f7f9fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:3}.nav{max-width:620px;margin:auto;min-height:48px;padding:7px 12px;display:flex;align-items:center;gap:10px}.back{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;text-decoration:none;color:var(--blue)}.brand{font-size:15px;font-weight:850;flex:1}.pill{font-size:11px;font-weight:800;padding:6px 9px;border-radius:9px;background:#eef7fc;color:#236b91;text-decoration:none}main{width:min(100% - 24px,620px);margin:auto;padding:16px 8px 32px}h1{font-size:24px;margin:2px 0 5px}.sub{color:var(--muted);font-size:13px;margin:0 0 14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin:11px 0}.control{margin:13px 0}.control label{display:block;font-size:13px;font-weight:750;margin-bottom:6px}.control select,.control input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit}.pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}.pair label{font-size:12px;color:var(--muted)}.result{padding:13px;border-radius:10px;background:#eef8ff;border:1px solid #d7eaf5;font-size:13px;line-height:1.55}.diagram{display:block;width:100%;max-width:390px;margin:5px auto}.diagram text{font:13px system-ui;fill:#345}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.actions a{flex:1;min-width:130px;text-align:center;text-decoration:none;padding:12px;border-radius:10px;background:#48b516;color:#fff;font-weight:850;font-size:13px}.actions a.secondary{background:#eaf5fb;color:#236b91}@media(max-width:480px){main{width:100%;padding:12px 10px 26px}h1{font-size:21px}.card{padding:13px}}</style></head><body>
<header><div class="nav"><a class="back" href="maths-congruence-criteria-learn.html?v=20261107-congruence-criteria-brief-learn-v1">←</a><div class="brand">SkillUp <span style="color:#58a900">Maths</span></div><a class="pill" href="maths-congruence-criteria-class9-quiz.html?v=20261107-congruence-criteria-learn-sim-v1">Practice</a></div></header>
<main><h1>Triangle Congruence Simulator</h1><p class="sub">Choose a criterion and compare the matching information for two triangles.</p><section class="card">
<div class="control"><label for="criterion">Congruence rule</label><select id="criterion"><option value="SSS">SSS · three sides</option><option value="SAS">SAS · two sides and included angle</option><option value="ASA">ASA · two angles and included side</option><option value="RHS">RHS · right angle, hypotenuse and side</option><option value="SSA">SSA · non-included angle (not sufficient generally)</option><option value="AAA">AAA · three angles (similarity only)</option></select></div>
<div class="diagram"><svg viewBox="0 0 360 155" role="img" aria-label="Two corresponding triangles"><path d="M22 120 L115 120 L72 30 Z M205 120 L298 120 L255 30 Z" fill="#eef8fc" stroke="#4388ad" stroke-width="2.5"/><text x="20" y="139">△ABC</text><text x="203" y="139">△PQR</text><text x="72" y="20" text-anchor="middle">A</text><text x="255" y="20" text-anchor="middle">P</text></svg></div>
<div class="pair"><div class="control"><label id="label1" for="v1">Triangle 1 · value 1</label><input id="v1" type="number" min="1" max="999" value="5"></div><div class="control"><label for="w1">Triangle 2 · value 1</label><input id="w1" type="number" min="1" max="999" value="5"></div></div>
<div class="pair"><div class="control"><label id="label2" for="v2">Triangle 1 · value 2</label><input id="v2" type="number" min="1" max="999" value="6"></div><div class="control"><label for="w2">Triangle 2 · value 2</label><input id="w2" type="number" min="1" max="999" value="6"></div></div>
<div class="pair"><div class="control"><label id="label3" for="v3">Triangle 1 · value 3</label><input id="v3" type="number" min="1" max="999" value="7"></div><div class="control"><label for="w3">Triangle 2 · value 3</label><input id="w3" type="number" min="1" max="999" value="7"></div></div>
<div class="result" id="result" aria-live="polite">All three corresponding sides match. SSS proves the triangles congruent.</div></section>
<div class="actions"><a class="secondary" href="maths-congruence-criteria-learn.html?v=20261107-congruence-criteria-brief-learn-v1">📘 Brief Learn</a><a href="maths-congruence-criteria-class9-quiz.html?v=20261107-congruence-criteria-learn-sim-v1">Start quiz →</a></div></main>
<script>(function(){const $=id=>document.getElementById(id),select=$('criterion'),ids=['v1','v2','v3'],other=['w1','w2','w3'],labels={SSS:['Side 1 length','Side 2 length','Side 3 length'],SAS:['Side 1 length','Included angle (°)','Side 2 length'],ASA:['Angle 1 (°)','Included side length','Angle 2 (°)'],RHS:['Hypotenuse length','One leg length','Right angle (fixed at 90°)'],SSA:['Side 1 length','Side 2 length','Non-included angle (°)'],AAA:['Angle 1 (°)','Angle 2 (°)','Angle 3 (°)']};function update(){const rule=select.value;labels[rule].forEach((t,i)=>{$('label'+(i+1)).textContent=t;$('w'+(i+1)).previousElementSibling.textContent='Triangle 2 · '+t;});$('v3').disabled=rule==='RHS';$('w3').disabled=rule==='RHS';const vals=ids.map(id=>Number($(id).value)),vals2=other.map(id=>Number($(id).value));const used=rule==='RHS'?2:3,valid=vals.slice(0,used).every((v,i)=>Number.isFinite(v)&&v>0&&v===vals2[i]);let message='';if(rule==='SSA')message='SSA is not a general congruence criterion. Two sides and a non-included angle can produce different triangles.';else if(rule==='AAA')message='AAA establishes similarity, not congruence: equal angles do not fix the triangle size.';else if(rule==='RHS')message='Both triangles are treated as right-angled. '+(valid?'The hypotenuses and one corresponding leg match, so RHS proves congruence.':'Make both hypotenuse values and both corresponding leg values equal to satisfy RHS.');else message=valid?'All required corresponding measurements match. '+rule+' proves the triangles congruent.':'At least one required corresponding measurement differs. The selected criterion is not satisfied yet.';$('result').textContent=message;}[...ids,...other].forEach(id=>$(id).addEventListener('input',update));select.addEventListener('change',update);update();})();</script><script src="/shared-nav.js?v=20261106-maths-header-v6"></script></body></html>
