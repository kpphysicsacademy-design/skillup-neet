(function(){'use strict';const questions=[{"d":"BASIC","q":"In an ordered pair (x, y), which value is written first?","o":["The y-coordinate","The x-coordinate","The origin","The quadrant"],"a":1,"e":"An ordered pair always lists x first and y second."},{"d":"BASIC","q":"What is the x-coordinate of the point (6, −2)?","o":["−2","2","6","−6"],"a":2,"e":"The first entry is the x-coordinate, so it is 6."},{"d":"BASIC","q":"What is the y-coordinate of (−4, 7)?","o":["−4","4","7","−7"],"a":2,"e":"The second entry is the y-coordinate, so it is 7."},{"d":"BASIC","q":"Which ordered pair represents the origin?","o":["(1, 0)","(0, 1)","(0, 0)","(−1, −1)"],"a":2,"e":"The origin has both coordinates equal to zero."},{"d":"BASIC","q":"Which point has x-coordinate 0 and y-coordinate 5?","o":["(5, 0)","(0, 5)","(0, −5)","(5, 5)"],"a":1,"e":"Write x first, then y: (0,5)."},{"d":"BASIC","q":"Which point has x-coordinate −3 and y-coordinate −2?","o":["(−2, −3)","(3, −2)","(−3, −2)","(−3, 2)"],"a":2,"e":"The ordered pair is written (x,y), so the point is (−3,−2)."},{"d":"BASIC","q":"What does the ordered pair (2, 0) tell you?","o":["2 units up","2 units right on the x-axis","2 units left","2 units down"],"a":1,"e":"The x-coordinate 2 means right 2, while y=0 keeps the point on the x-axis."},{"d":"BASIC","q":"A point is 4 units above the origin on the y-axis. What are its coordinates?","o":["(4, 0)","(−4, 0)","(0, 4)","(0, −4)"],"a":2,"e":"On the y-axis x=0, and above the origin means y=4."},{"d":"BASIC","q":"Which point has y-coordinate 0?","o":["(−2, 3)","(0, 5)","(4, 0)","(1, −1)"],"a":2,"e":"In (4,0), the second coordinate is zero."},{"d":"BASIC","q":"For the point (−5, 1), how far left of the y-axis is it?","o":["1 unit","5 units","−5 units","6 units"],"a":1,"e":"The horizontal distance from the y-axis is |x|=|−5|=5 units."},{"d":"MEDIUM","q":"A point is 3 units right and 6 units up from the origin. Which ordered pair represents it?","o":["(−3, 6)","(3, −6)","(3, 6)","(6, 3)"],"a":2,"e":"Right means positive x and up means positive y, giving (3,6)."},{"d":"MEDIUM","q":"Point A is (−2, 4). Which point has the same y-coordinate as A?","o":["(4, −2)","(3, 4)","(−2, 3)","(−4, 2)"],"a":1,"e":"Both A and (3,4) have y-coordinate 4."},{"d":"MEDIUM","q":"Which point is 5 units left of the origin and 2 units above the x-axis?","o":["(5, 2)","(−5, −2)","(−5, 2)","(2, −5)"],"a":2,"e":"Left gives x=−5; above the x-axis gives y=2."},{"d":"MEDIUM","q":"If P=(a,−3) and its x-coordinate is 4, what is P?","o":["(−3, 4)","(4, −3)","(4, 3)","(−4, −3)"],"a":1,"e":"Substitute a=4 into (a,−3) to get (4,−3)."},{"d":"MEDIUM","q":"Which point is on the y-axis and 7 units below the origin?","o":["(−7, 0)","(7, 0)","(0, 7)","(0, −7)"],"a":3,"e":"On the y-axis x=0; below the origin means y=−7."},{"d":"MEDIUM","q":"The point (x, 0) lies on which axis?","o":["y-axis only","x-axis","Neither axis","Both axes for every x"],"a":1,"e":"Any point whose y-coordinate is zero lies on the x-axis."},{"d":"MEDIUM","q":"Which pair of points has the same x-coordinate?","o":["(2, 3) and (2, −4)","(1, 2) and (2, 1)","(−3, 1) and (3, 1)","(0, 2) and (2, 0)"],"a":0,"e":"Both points in the first pair have x-coordinate 2."},{"d":"MEDIUM","q":"Point B is (−1, 2). Move it 3 units right without moving vertically. What are the new coordinates?","o":["(−4, 2)","(2, 2)","(−1, 5)","(2, −1)"],"a":1,"e":"Increase x by 3: −1+3=2; y remains 2."},{"d":"MEDIUM","q":"Which point has a negative x-coordinate and a positive y-coordinate?","o":["(2, 3)","(−2, 3)","(−2, −3)","(2, −3)"],"a":1,"e":"The point (−2,3) has x negative and y positive."},{"d":"MEDIUM","q":"The point (0,−4) is located where?","o":["On the negative y-axis","On the positive y-axis","On the negative x-axis","In quadrant III"],"a":0,"e":"Its x-coordinate is zero and its y-coordinate is negative."},{"d":"HARD","q":"A point (a, b) is 4 units left and 3 units down from the origin. Find (a,b).","o":["(4, 3)","(−4, 3)","(4, −3)","(−4, −3)"],"a":3,"e":"Left means a=−4 and down means b=−3."},{"d":"HARD","q":"Point P=(−3,5) moves 2 units left and 7 units down. What is its new position?","o":["(−1, 12)","(−5, −2)","(−5, 12)","(−1, −2)"],"a":1,"e":"New x=−3−2=−5 and new y=5−7=−2."},{"d":"HARD","q":"A point (k, 2) is 6 units to the right of the y-axis. What is k?","o":["−6","0","2","6"],"a":3,"e":"Six units to the right of the y-axis means x=6."},{"d":"HARD","q":"A point (−4,m) is 3 units below the x-axis. What is m?","o":["3","−3","−4","4"],"a":1,"e":"Three units below the x-axis means y=−3."},{"d":"HARD","q":"Which point is 2 units from the y-axis and 5 units from the x-axis in the third quadrant?","o":["(2, 5)","(−2, 5)","(−2, −5)","(2, −5)"],"a":2,"e":"In quadrant III both coordinates are negative; the distances give x=−2 and y=−5."},{"d":"HARD","q":"If P=(x,y) lies on the x-axis and is 8 units to the left of the origin, which statement is correct?","o":["x=8, y=0","x=−8, y=0","x=0, y=−8","x=−8, y=−8"],"a":1,"e":"Left 8 gives x=−8; being on the x-axis gives y=0."},{"d":"HARD","q":"The coordinates of A are (3,−2). Which point is 4 units vertically above A?","o":["(7,−2)","(−1,−2)","(3,2)","(3,−6)"],"a":2,"e":"Keep x=3 and add 4 to y: −2+4=2."},{"d":"HARD","q":"Which point has the same distance from the y-axis as (−6,2), but lies to the right of it?","o":["(−6,−2)","(6,2)","(2,6)","(6,−2)"],"a":1,"e":"The same horizontal distance means |x|=6; to the right means x=6. The y-coordinate can stay 2."},{"d":"HARD","q":"Point Q=(a,b) is at the intersection of the two coordinate axes. What are a and b?","o":["a=1, b=1","a=0, b=1","a=1, b=0","a=0, b=0"],"a":3,"e":"The axes intersect at the origin, (0,0)."},{"d":"HARD","q":"Point R=(−2,−3) moves 5 units right and 1 unit up. What are its new coordinates?","o":["(3,−2)","(−7,−4)","(3,−4)","(−3,2)"],"a":0,"e":"New x=−2+5=3 and new y=−3+1=−2."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Master coordinates of a point</strong><small>Read and write ordered pairs</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Identify x- and y-coordinates</strong><small>Move points using coordinates</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Interpret coordinates in context</strong><small>Solve multi-step coordinate problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
