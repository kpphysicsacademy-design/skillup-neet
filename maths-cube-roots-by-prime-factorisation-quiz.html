<style>

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What is ∛27?","o":["3","2","6","9"],"a":0,"e":"3³ = 27, so ∛27 = 3.","v":"cube-roots-by-prime-factorisation"},{"d":"BASIC","q":"Find ∛64.","o":["2","4","6","8"],"a":1,"e":"4³ = 64.","v":"cube-roots-by-prime-factorisation"},{"d":"BASIC","q":"What is ∛125?","o":["3","4","5","25"],"a":2,"e":"5³ = 125.","v":"cube-roots-by-prime-factorisation"},{"d":"BASIC","q":"Which is the prime factorisation of 216?","o":["2 × 3³","2² × 3³","2³ × 3²","2³ × 3³"],"a":3,"e":"216 = 8 × 27 = 2³ × 3³.","v":"cube-roots-by-prime-factorisation"},{"d":"BASIC","q":"Find ∛8.","o":["2","1","3","4"],"a":0,"e":"2³ = 8.","v":"cube-roots-by-prime-factorisation"},{"d":"BASIC","q":"What is ∛1000?","o":["20","10","30","100"],"a":1,"e":"10³ = 1000.","v":"cube-roots-by-prime-factorisation"},{"d":"BASIC","q":"Which number is a perfect cube?","o":["36","81","216","400"],"a":2,"e":"216 = 6³.","v":"cube-roots-by-prime-factorisation"},{"d":"BASIC","q":"Find ∛343.","o":["6","9","8","7"],"a":3,"e":"343 = 7³.","v":"cube-roots-by-prime-factorisation"},{"d":"BASIC","q":"What is ∛729?","o":["9","8","7","11"],"a":0,"e":"729 = 9³.","v":"cube-roots-by-prime-factorisation"},{"d":"BASIC","q":"Find ∛1.","o":["0","1","−1","3"],"a":1,"e":"1³ = 1.","v":"cube-roots-by-prime-factorisation"},{"d":"MEDIUM","q":"Using prime factorisation, find ∛1728.","o":["10","14","12","16"],"a":2,"e":"1728 = 2⁶ × 3³, so ∛1728 = 2² × 3 = 12.","v":"cube-roots-by-prime-factorisation"},{"d":"MEDIUM","q":"What is ∛(2⁶ × 5³)?","o":["100","40","80","20"],"a":3,"e":"Taking one-third of each exponent gives 2² × 5 = 20.","v":"cube-roots-by-prime-factorisation"},{"d":"MEDIUM","q":"Find ∛3375.","o":["15","12","18","25"],"a":0,"e":"3375 = 3³ × 5³, so ∛3375 = 3 × 5 = 15.","v":"cube-roots-by-prime-factorisation"},{"d":"MEDIUM","q":"Which is the prime factorisation of 512?","o":["2⁷","2⁹","2⁸","2⁶"],"a":1,"e":"512 = 2⁹, so its cube root is 2³ = 8.","v":"cube-roots-by-prime-factorisation"},{"d":"MEDIUM","q":"Find ∛2197.","o":["11","12","13","14"],"a":2,"e":"13³ = 2197.","v":"cube-roots-by-prime-factorisation"},{"d":"MEDIUM","q":"What is ∛(3³ × 7³)?","o":["10","63","27","21"],"a":3,"e":"∛(3³ × 7³) = 3 × 7 = 21.","v":"cube-roots-by-prime-factorisation"},{"d":"MEDIUM","q":"Find ∛4096.","o":["16","14","12","18"],"a":0,"e":"4096 = 2¹², and ∛4096 = 2⁴ = 16.","v":"cube-roots-by-prime-factorisation"},{"d":"MEDIUM","q":"Which expression equals ∛(64 × 125)?","o":["8 × 5 = 40","4 × 5 = 20","4 × 25 = 100","8 × 25 = 200"],"a":1,"e":"∛64 × ∛125 = 4 × 5 = 20.","v":"cube-roots-by-prime-factorisation"},{"d":"MEDIUM","q":"Find ∛(−216).","o":["−8","6","−6","8"],"a":2,"e":"(−6)³ = −216.","v":"cube-roots-by-prime-factorisation"},{"d":"MEDIUM","q":"What is ∛5832?","o":["16","22","20","18"],"a":3,"e":"18³ = 5832.","v":"cube-roots-by-prime-factorisation"},{"d":"HARD","q":"What is the smallest positive integer by which 72 must be multiplied to make a perfect cube?","o":["3","2","6","9"],"a":0,"e":"72 = 2³ × 3²; multiply by 3 to make the exponents multiples of 3.","v":"cube-roots-by-prime-factorisation"},{"d":"HARD","q":"What is the smallest positive integer by which 108 must be multiplied to make a perfect cube?","o":["3","2","6","12"],"a":1,"e":"108 = 2² × 3³; multiplying by 2 gives 2³ × 3³ = 216.","v":"cube-roots-by-prime-factorisation"},{"d":"HARD","q":"What is the least positive integer by which 675 must be divided to obtain a perfect-cube integer?","o":["3","5","25","9"],"a":2,"e":"675 ÷ 25 = 27 = 3³.","v":"cube-roots-by-prime-factorisation"},{"d":"HARD","q":"If N = 2⁶ × 3³ × 5⁴, what is ∛N?","o":["300","120","180","60"],"a":3,"e":"∛N = 2² × 3 × 5 = 60.","v":"cube-roots-by-prime-factorisation"},{"d":"HARD","q":"A cube has volume 2,744 cm³. What is its edge length?","o":["14 cm","13 cm","12 cm","16 cm"],"a":0,"e":"14³ = 2744, so the edge length is 14 cm.","v":"cube-roots-by-prime-factorisation"},{"d":"HARD","q":"What is ∛(0.000125)?","o":["0.005","0.05","0.5","0.025"],"a":1,"e":"0.05³ = 0.000125.","v":"cube-roots-by-prime-factorisation"},{"d":"HARD","q":"What is the smallest integer by which 250 must be multiplied to make a perfect cube?","o":["2","5","4","10"],"a":2,"e":"250 = 2 × 5³; multiplying by 4 gives 2³ × 5³ = 1000.","v":"cube-roots-by-prime-factorisation"},{"d":"HARD","q":"Which number has prime factorisation 2³ × 3⁶ and cube root 18?","o":["1944","2916","11664","5832"],"a":3,"e":"∛(2³ × 3⁶) = 2 × 3² = 18, and the number is 8 × 729 = 5832.","v":"cube-roots-by-prime-factorisation"},{"d":"HARD","q":"If ∛x = 7, what is x?","o":["343","147","49","729"],"a":0,"e":"x = 7³ = 343.","v":"cube-roots-by-prime-factorisation"},{"d":"HARD","q":"What is ∛(−1728)?","o":["−14","−12","12","14"],"a":1,"e":"(−12)³ = −1728.","v":"cube-roots-by-prime-factorisation"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Find cube roots using prime factorisation</strong><small>Prime factor groups and cube roots</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Simplify cube roots using prime factors</strong><small>Solve cube-root problems with prime exponents</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply prime factorisation and square-number patterns</strong><small>Reason about perfect squares and nearest squares</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
