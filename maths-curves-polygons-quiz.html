<style>

<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Which figure is made using only straight line segments and is closed?","o":["Circle","Polygon","Open curve","Ray"],"a":1,"e":"A polygon is a closed plane figure made entirely from straight line segments."},{"d":"BASIC","q":"Which of these is a curved line?","o":["Side of a square","Straight road edge","Round outline of a coin","Edge of a ruler"],"a":2,"e":"The outline of a coin is curved."},{"d":"BASIC","q":"Which figure is an open curve?","o":["A complete circle","A closed triangle","A line shaped like a U with separated ends","A square"],"a":2,"e":"An open curve has two endpoints that do not meet."},{"d":"BASIC","q":"How many sides does a triangle have?","o":["2","3","4","5"],"a":1,"e":"A triangle is a polygon with three straight sides."},{"d":"BASIC","q":"How many sides does a quadrilateral have?","o":["3","4","5","6"],"a":1,"e":"A quadrilateral has four sides."},{"d":"BASIC","q":"Which one is not a polygon?","o":["Pentagon","Rectangle","Circle","Triangle"],"a":2,"e":"A circle has a curved boundary, not straight line-segment sides."},{"d":"BASIC","q":"A polygon must be…","o":["Open and curved","Closed and made of straight segments","Made only of curves","A solid object"],"a":1,"e":"A polygon is closed and its boundary consists of straight line segments."},{"d":"BASIC","q":"What is the point where two sides of a polygon meet called?","o":["Centre","Vertex","Diameter","Curve"],"a":1,"e":"The meeting point of two sides is a vertex."},{"d":"BASIC","q":"Which polygon has five sides?","o":["Hexagon","Pentagon","Octagon","Quadrilateral"],"a":1,"e":"A pentagon has five sides."},{"d":"BASIC","q":"Which shape has no straight sides?","o":["Triangle","Square","Circle","Pentagon"],"a":2,"e":"A circle has a curved boundary and no straight sides."},{"d":"MEDIUM","q":"A closed figure has 6 straight sides. What is it called?","o":["Pentagon","Hexagon","Heptagon","Octagon"],"a":1,"e":"A six-sided polygon is a hexagon."},{"d":"MEDIUM","q":"How many vertices does a rectangle have?","o":["2","3","4","6"],"a":2,"e":"A rectangle has four corners, so it has four vertices."},{"d":"MEDIUM","q":"Which statement about a closed curve is correct?","o":["Its endpoints remain separate","It has no inside region","Its ends meet to form a loop","It must have straight sides"],"a":2,"e":"A closed curve loops back to meet itself."},{"d":"MEDIUM","q":"Which of these is a polygon?","o":["A crescent outline","A closed shape with four straight sides","A circle","A wavy closed outline"],"a":1,"e":"A closed shape bounded by four straight sides is a quadrilateral polygon."},{"d":"MEDIUM","q":"A polygon has 7 sides. What is its name?","o":["Hexagon","Heptagon","Octagon","Nonagon"],"a":1,"e":"A seven-sided polygon is a heptagon."},{"d":"MEDIUM","q":"How many sides does an octagon have?","o":["6","7","8","9"],"a":2,"e":"The prefix octa- indicates eight; an octagon has eight sides."},{"d":"MEDIUM","q":"Which pair contains only polygons?","o":["Circle and triangle","Rectangle and pentagon","Oval and square","Open curve and hexagon"],"a":1,"e":"A rectangle and a pentagon both have closed boundaries made of straight segments."},{"d":"MEDIUM","q":"A simple polygon has 5 vertices. How many sides does it have?","o":["3","4","5","6"],"a":2,"e":"Each vertex joins adjacent sides; a pentagon has five vertices and five sides."},{"d":"MEDIUM","q":"Which figure has a boundary that is not made of straight line segments?","o":["Triangle","Hexagon","Circle","Pentagon"],"a":2,"e":"A circle's boundary is curved."},{"d":"MEDIUM","q":"Which is true of every triangle?","o":["It has four vertices","It has three straight sides","It has one curved side","It is an open curve"],"a":1,"e":"Every triangle is a closed polygon with three straight sides."},{"d":"HARD","q":"A simple polygon has 9 sides. How many vertices does it have?","o":["7","8","9","10"],"a":2,"e":"A polygon has the same number of sides and vertices, so it has 9 vertices."},{"d":"HARD","q":"Which description identifies a hexagon?","o":["A closed figure with 5 straight sides","A closed figure with 6 straight sides","A closed figure with 7 straight sides","A curve with 6 bends"],"a":1,"e":"A hexagon is a polygon with six straight sides."},{"d":"HARD","q":"A student draws a closed figure using 4 straight segments, but two segments cross each other. Is it a simple quadrilateral?","o":["Yes, every closed four-segment figure is simple","No, a simple polygon does not have crossing sides","Yes, because it has four vertices","No, because quadrilaterals have three sides"],"a":1,"e":"In a simple polygon, sides meet only at adjacent endpoints; crossing sides make it non-simple."},{"d":"HARD","q":"Which option correctly compares a circle and a polygon?","o":["Both have only straight sides","A circle is a polygon with one side","A polygon has straight sides; a circle has a curved boundary","A polygon must be open"],"a":2,"e":"Polygons use straight line segments, whereas a circle has a curved boundary."},{"d":"HARD","q":"A polygon has 3 more sides than a quadrilateral. How many sides does it have?","o":["5","6","7","8"],"a":2,"e":"A quadrilateral has 4 sides; 4 + 3 = 7, which is a heptagon."},{"d":"HARD","q":"Which shape is an open curve rather than a closed curve?","o":["A complete oval outline","A complete circle","A curved line whose endpoints do not meet","A closed wavy loop"],"a":2,"e":"An open curve has distinct endpoints."},{"d":"HARD","q":"A polygon has 8 vertices. How many sides does it have?","o":["6","7","8","9"],"a":2,"e":"A polygon has one side between each pair of consecutive vertices; sides and vertices are equal in number."},{"d":"HARD","q":"Which claim is always true for a polygon?","o":["At least one side is curved","Its boundary is closed and made of straight segments","It has exactly four vertices","It must look regular"],"a":1,"e":"Every polygon is a closed plane figure made of straight line segments; it need not be regular."},{"d":"HARD","q":"A figure is closed and has 5 straight sides of unequal lengths. Can it be a polygon?","o":["No, polygon sides must be equal","Yes, it is a pentagon","No, all polygons are regular","Yes, but only if it is a hexagon"],"a":1,"e":"Equal side lengths are not required; a closed five-sided figure is a pentagon."},{"d":"HARD","q":"Which statement about a regular polygon is correct?","o":["All sides and all angles are equal","Only one side is straight","It must be open","It has a curved boundary"],"a":0,"e":"A regular polygon has all sides equal and all interior angles equal."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const skills=[['Recognise open and closed curves',8],['Identify polygons by sides and vertices',18],['Distinguish regular and irregular polygons',24]];$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">📐</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+skills.map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script>
