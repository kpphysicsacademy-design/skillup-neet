,"4","5"],"a":1,"e":"A triangle is a polygon with three straight sides."},{"d":"BASIC","q":"How many sides does a quadrilateral have?","o":["3","4","5","6"],"a":1,"e":"A quadrilateral has four sides."},{"d":"BASIC","q":"Which one is not a polygon?","o":["Pentagon","Rectangle","Circle","Triangle"],"a":2,"e":"A circle has a curved boundary, not straight line-segment sides."},{"d":"BASIC","q":"A polygon must be…","o":["Open and curved","Closed and made of straight segments","Made only of curves","A solid object"],"a":1,"e":"A polygon is closed and its boundary consists of straight line segments."},{"d":"BASIC","q":"What is the point where two sides of a polygon meet called?","o":["Centre","Vertex","Diameter","Curve"],"a":1,"e":"The meeting point of two sides is a vertex."},{"d":"BASIC","q":"Which polygon has five sides?","o":["Hexagon","Pentagon","Octagon","Quadrilateral"],"a":1,"e":"A pentagon has five sides."},{"d":"BASIC","q":"Which shape has no straight sides?","o":["Triangle","Square","Circle","Pentagon"],"a":2,"e":"A circle has a curved boundary and no straight sides."},{"d":"MEDIUM","q":"A closed figure has 6 straight sides. What is it called?","o":["Pentagon","Hexagon","Heptagon","Octagon"],"a":1,"e":"A six-sided polygon is a hexagon."},{"d":"MEDIUM","q":"How many vertices does a rectangle have?","o":["2","3","4","6"],"a":2,"e":"A rectangle has four corners, so it has four vertices."},{"d":"MEDIUM","q":"Which statement about a closed curve is correct?","o":["Its endpoints remain separate","It has no inside region","Its ends meet to form a loop","It must have straight sides"],"a":2,"e":"A closed curve loops back to meet itself."},{"d":"MEDIUM","q":"Which of these is a polygon?","o":["A crescent outline","A closed shape with four straight sides","A circle","A wavy closed outline"],"a":1,"e":"A closed shape bounded by four straight sides is a quadrilateral polygon."},{"d":"MEDIUM","q":"A polygon has 7 sides. What is its name?","o":["Hexagon","Heptagon","Octagon"," 100%';$('percent').textContent='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">📐</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>🔥 Best streak: '+bestStreak+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;streak=0;bestStreak=0;correct=0;$('xp').textContent=0;$('streak').textContent=0;render()}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return}act()});render()})();</script><script src="/shared-nav.js?v=20261017-duolingo-standard-v1"></script></body></html>
