<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"A quadrilateral is cyclic when:","o":["Its opposite sides are equal","All four vertices lie on one circle","It has four right angles","Its diagonals are equal"],"a":1,"e":"A cyclic quadrilateral has all four vertices on the circumference of a circle."},{"d":"BASIC","q":"The sum of opposite angles of a cyclic quadrilateral is:","o":["90°","180°","270°","360°"],"a":1,"e":"Opposite angles in a cyclic quadrilateral are supplementary."},{"d":"BASIC","q":"In cyclic quadrilateral ABCD, ∠A=82°. Find ∠C.","o":["82°","98°","108°","118°"],"a":1,"e":"∠C=180°−82°=98°."},{"d":"BASIC","q":"If one angle of a cyclic quadrilateral is 90°, its opposite angle is:","o":["45°","60°","90°","180°"],"a":2,"e":"Opposite angles sum to 180°, so the opposite angle is also 90°."},{"d":"BASIC","q":"An exterior angle of a cyclic quadrilateral equals the:","o":["Adjacent interior angle","Opposite interior angle","Sum of all interior angles","Half the opposite angle"],"a":1,"e":"The exterior angle equals the interior opposite angle."},{"d":"BASIC","q":"In cyclic quadrilateral PQRS, ∠P=110°. Find ∠R.","o":["60°","70°","80°","110°"],"a":1,"e":"∠R=180°−110°=70°."},{"d":"BASIC","q":"Which condition is sufficient to show a quadrilateral is cyclic?","o":["One pair of adjacent angles is equal","A pair of opposite angles sums to 180°","All sides are different","One diagonal bisects the other"],"a":1,"e":"If a pair of opposite angles is supplementary, the quadrilateral is cyclic."},{"d":"BASIC","q":"If ∠A and ∠C are opposite angles of a cyclic quadrilateral, and ∠A=3x, ∠C=2x, then x is:","o":["30°","36°","45°","60°"],"a":1,"e":"3x+2x=180°, so x=36°."},{"d":"BASIC","q":"A cyclic quadrilateral has angles 70°, 95°, 110° and x°. Find x.","o":["75°","85°","95°","105°"],"a":1,"e":"The angles sum to 360°, so x=360−70−95−110=85°."},{"d":"BASIC","q":"Opposite angles of a cyclic quadrilateral are:","o":["Equal always","Supplementary","Complementary","Always acute"],"a":1,"e":"Their sum is 180°."},{"d":"MEDIUM","q":"In cyclic quadrilateral ABCD, ∠A=2x+10° and ∠C=3x°. Find x.","o":["30°","34°","36°","40°"],"a":1,"e":"2x+10+3x=180, so x=34°."},{"d":"MEDIUM","q":"In cyclic quadrilateral PQRS, ∠Q=4x−5° and ∠S=2x+17°. Find x.","o":["24°","28°","30°","32°"],"a":1,"e":"6x+12=180, so x=28°."},{"d":"MEDIUM","q":"An exterior angle at A of cyclic quadrilateral ABCD is 115°. The interior opposite angle C is:","o":["65°","75°","115°","125°"],"a":2,"e":"The exterior angle equals the opposite interior angle, so ∠C=115°."},{"d":"MEDIUM","q":"In a cyclic quadrilateral, ∠A=75° and ∠B=68°. Find ∠C and ∠D respectively.","o":["105°, 112°","112°, 105°","75°, 68°","105°, 68°"],"a":0,"e":"∠C=180−75=105° and ∠D=180−68=112°."},{"d":"MEDIUM","q":"If opposite angles of a quadrilateral are (x+20)° and (2x+10)°, and the quadrilateral is cyclic, x equals:","o":["40°","45°","50°","60°"],"a":2,"e":"x+20+2x+10=180 gives x=50°."},{"d":"MEDIUM","q":"A cyclic quadrilateral has angles A=90°, B=72°, C=90°. Find D.","o":["72°","90°","108°","118°"],"a":2,"e":"∠D=180°−72°=108°."},{"d":"MEDIUM","q":"If an exterior angle of a cyclic quadrilateral is 3x° and its opposite interior angle is 75°, find x.","o":["20°","25°","30°","35°"],"a":1,"e":"3x=75, so x=25°."},{"d":"MEDIUM","q":"In cyclic quadrilateral ABCD, ∠A:∠C=2:3. Find ∠A.","o":["60°","72°","90°","108°"],"a":1,"e":"Let angles be 2k and 3k; 5k=180, so ∠A=72°."},{"d":"MEDIUM","q":"Three angles of a cyclic quadrilateral are 85°, 95° and 105°. The fourth angle is:","o":["65°","75°","85°","95°"],"a":1,"e":"The total is 360°, so the fourth angle is 75°."},{"d":"MEDIUM","q":"In cyclic quadrilateral ABCD, ∠A=4x° and ∠C=(2x+30)°. Find x.","o":["20°","25°","30°","35°"],"a":1,"e":"4x+2x+30=180, so x=25°."},{"d":"HARD","q":"In cyclic quadrilateral ABCD, ∠A=(3x−10)° and ∠C=(2x+20)°. Find x.","o":["30°","32°","34°","36°"],"a":1,"e":"5x+10=180, so x=34°."},{"d":"HARD","q":"An exterior angle of a cyclic quadrilateral is (5x−10)° and the opposite interior angle is (3x+30)°. Find x.","o":["10°","15°","20°","25°"],"a":2,"e":"5x−10=3x+30 gives x=20°."},{"d":"HARD","q":"In cyclic quadrilateral ABCD, ∠A=2x°, ∠B=(x+20)°, ∠C=4x°. Find ∠D.","o":["110°","120°","130°","140°"],"a":2,"e":"A+C=180 gives x=30; B=50 and D=130°."},{"d":"HARD","q":"Opposite angles of a cyclic quadrilateral are (4x+5)° and (2x+25)°. Find the angles.","o":["105° and 75°","115° and 65°","125° and 55°","135° and 45°"],"a":0,"e":"6x+30=180, x=25; angles are 105° and 75°."},{"d":"HARD","q":"A cyclic quadrilateral has ∠A=72°, ∠B=3x°, ∠C=108°. Find x.","o":["Cannot be determined","20°","24°","30°"],"a":0,"e":"The given opposite angles A and C are supplementary, but they do not determine B, so x cannot be determined."},{"d":"HARD","q":"In cyclic quadrilateral ABCD, ∠A=65° and exterior angle at C is:","o":["65°","95°","115°","125°"],"a":0,"e":"Interior C=115°, so exterior C=65°."},{"d":"HARD","q":"In cyclic quadrilateral ABCD, ∠A=2x+5° and ∠C=4x−35°. Find ∠A.","o":["55°","65°","75°","85°"],"a":2,"e":"6x−30=180 gives x=35; ∠A=2(35)+5=75°."},{"d":"HARD","q":"In cyclic quadrilateral ABCD, ∠A=80° and ∠B=75°. The exterior angle at D equals:","o":["75°","80°","100°","105°"],"a":0,"e":"Interior D=180−75=105°, so its exterior angle is 75°."},{"d":"HARD","q":"Opposite angles of a cyclic quadrilateral are in ratio 4:5. The smaller angle is:","o":["60°","80°","90°","100°"],"a":1,"e":"4k+5k=180, k=20, so smaller angle=80°."},{"d":"HARD","q":"In a cyclic quadrilateral, one angle is 2x+10° and its opposite angle is 4x−10°. Find x and the angles.","o":["x=20; 50°,130°","x=30; 70°,110°","x=25; 60°,120°","x=35; 80°,100°"],"a":1,"e":"6x=180, x=30; the angles are 70° and 110°."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand cyclic quadrilaterals</strong><small>Use opposite-angle properties</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Solve cyclic quadrilateral problems in cyclic quadrilaterals</strong><small>Apply exterior-angle properties</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Find unknown angles</strong><small>Practise circle geometry applications</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
