<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Cylinder Basics</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"A cylinder has radius 7 cm and height 10 cm. Find its volume using π = 22/7.","o":["154 cm³","440 cm³","1540 cm³","3080 cm³"],"a":2,"e":"Volume = πr²h = (22/7) × 7² × 10 = 1540 cm³.","v":"cylinder-basics"},{"d":"BASIC","q":"Find the curved surface area of a cylinder with radius 7 cm and height 8 cm, using π = 22/7.","o":["176 cm²","352 cm²","616 cm²","1232 cm²"],"a":1,"e":"CSA = 2πrh = 2 × (22/7) × 7 × 8 = 352 cm².","v":"cylinder-basics"},{"d":"BASIC","q":"Find the total surface area of a closed cylinder of radius 3 cm and height 5 cm.","o":["15π cm²","30π cm²","48π cm²","60π cm²"],"a":2,"e":"TSA = 2πr(r + h) = 2π × 3 × 8 = 48π cm².","v":"cylinder-basics"},{"d":"BASIC","q":"A cylinder has diameter 14 cm and height 6 cm. Find its volume using π = 22/7.","o":["462 cm³","924 cm³","1848 cm³","308 cm³"],"a":1,"e":"Radius = 7 cm; volume = (22/7) × 7² × 6 = 924 cm³.","v":"cylinder-basics"},{"d":"BASIC","q":"The radius of a cylinder is 4 cm and its height is 9 cm. Find its volume.","o":["36π cm³","72π cm³","144π cm³","288π cm³"],"a":2,"e":"Volume = π × 4² × 9 = 144π cm³.","v":"cylinder-basics"},{"d":"BASIC","q":"Find the curved surface area of a cylinder with radius 5 cm and height 12 cm.","o":["60π cm²","120π cm²","170π cm²","240π cm²"],"a":1,"e":"CSA = 2πrh = 2π × 5 × 12 = 120π cm².","v":"cylinder-basics"},{"d":"BASIC","q":"The volume of a cylinder is 1540 cm³, radius 7 cm. Using π = 22/7, find its height.","o":["5 cm","10 cm","15 cm","20 cm"],"a":1,"e":"h = V/(πr²) = 1540 ÷ 154 = 10 cm.","v":"cylinder-basics"},{"d":"BASIC","q":"A cylinder has radius 2 cm and height 7 cm. Find its total surface area.","o":["18π cm²","28π cm²","36π cm²","44π cm²"],"a":2,"e":"TSA = 2πr(r + h) = 2π × 2 × 9 = 36π cm².","v":"cylinder-basics"},{"d":"BASIC","q":"Which formula gives the volume of a cylinder?","o":["2πrh","πr²h","πrh²","2πr(r + h)"],"a":1,"e":"Volume equals area of circular base times height: πr²h.","v":"cylinder-basics"},{"d":"BASIC","q":"Which formula gives the curved surface area of a cylinder?","o":["πr²h","πr²","2πrh","2πr(r + h)"],"a":2,"e":"Curved surface area is circumference of base × height = 2πrh.","v":"cylinder-basics"},{"d":"MEDIUM","q":"If the radius of a cylinder doubles while height stays the same, its volume becomes:","o":["2 times","3 times","4 times","8 times"],"a":2,"e":"Volume depends on r²; doubling radius multiplies volume by 2² = 4.","v":"cylinder-basics"},{"d":"MEDIUM","q":"If the height of a cylinder doubles while radius stays the same, its volume becomes:","o":["2 times","4 times","6 times","8 times"],"a":0,"e":"Volume is directly proportional to height, so it doubles.","v":"cylinder-basics"},{"d":"MEDIUM","q":"A cylinder has base radius 7 cm and height 3 cm. Find its curved surface area using π = 22/7.","o":["66 cm²","132 cm²","154 cm²","462 cm²"],"a":1,"e":"CSA = 2 × (22/7) × 7 × 3 = 132 cm².","v":"cylinder-basics"},{"d":"MEDIUM","q":"A cylinder's radius is 3 cm and height is 4 cm. Find its volume.","o":["12π cm³","24π cm³","36π cm³","48π cm³"],"a":2,"e":"V = π × 3² × 4 = 36π cm³.","v":"cylinder-basics"},{"d":"MEDIUM","q":"A closed cylinder has radius 7 cm and height 10 cm. Find its total surface area using π = 22/7.","o":["440 cm²","616 cm²","748 cm²","880 cm²"],"a":2,"e":"TSA = 2πr(r + h) = 2 × (22/7) × 7 × 17 = 748 cm².","v":"cylinder-basics"},{"d":"MEDIUM","q":"A cylindrical can has radius 4 cm and height 10 cm. What is its capacity?","o":["40π cm³","80π cm³","160π cm³","200π cm³"],"a":2,"e":"Capacity is volume = π × 4² × 10 = 160π cm³.","v":"cylinder-basics"},{"d":"MEDIUM","q":"A cylinder has volume 450π cm³ and radius 5 cm. Find its height.","o":["9 cm","18 cm","45 cm","90 cm"],"a":1,"e":"450π = π × 25 × h, so h = 18 cm.","v":"cylinder-basics"},{"d":"MEDIUM","q":"Find the volume of a cylinder with diameter 10 cm and height 8 cm.","o":["100π cm³","200π cm³","400π cm³","800π cm³"],"a":1,"e":"Radius = 5 cm; volume = π × 25 × 8 = 200π cm³.","v":"cylinder-basics"},{"d":"MEDIUM","q":"A cylinder has radius 7 cm and height 14 cm. Find the volume using π = 22/7.","o":["1078 cm³","2156 cm³","4312 cm³","616 cm³"],"a":1,"e":"V = (22/7) × 49 × 14 = 2156 cm³.","v":"cylinder-basics"},{"d":"MEDIUM","q":"What is the area of the circular base of a cylinder of radius 6 cm?","o":["6π cm²","12π cm²","36π cm²","72π cm²"],"a":2,"e":"Base area = πr² = 36π cm².","v":"cylinder-basics"},{"d":"HARD","q":"The circumference of a cylinder's base is 44 cm and its height is 5 cm. Find its curved surface area.","o":["110 cm²","220 cm²","440 cm²","55 cm²"],"a":1,"e":"CSA = circumference × height = 44 × 5 = 220 cm².","v":"cylinder-basics"},{"d":"HARD","q":"If a cylinder's radius is 3 cm and its volume is 72π cm³, what is its height?","o":["4 cm","6 cm","8 cm","12 cm"],"a":2,"e":"72π = π × 9 × h, so h = 8 cm.","v":"cylinder-basics"},{"d":"HARD","q":"A cylinder has radius 2.5 cm and height 4 cm. Find its volume.","o":["10π cm³","20π cm³","25π cm³","40π cm³"],"a":2,"e":"V = π × (2.5)² × 4 = 25π cm³.","v":"cylinder-basics"},{"d":"HARD","q":"The radius of a cylinder is 7 cm and its height is 20 cm. Find the curved surface area using π = 22/7.","o":["440 cm²","770 cm²","880 cm²","1540 cm²"],"a":2,"e":"CSA = 2 × (22/7) × 7 × 20 = 880 cm².","v":"cylinder-basics"},{"d":"HARD","q":"A cylinder has radius 4 cm and height 6 cm. Find its total surface area.","o":["24π cm²","48π cm²","80π cm²","96π cm²"],"a":2,"e":"TSA = 2πr(r + h) = 2π × 4 × 10 = 80π cm².","v":"cylinder-basics"},{"d":"HARD","q":"A cylinder's volume is 616 cm³ and its height is 4 cm. Using π = 22/7, find its radius.","o":["3.5 cm","7 cm","14 cm","21 cm"],"a":1,"e":"616 = (22/7)r² × 4, so r² = 49 and r = 7 cm.","v":"cylinder-basics"},{"d":"HARD","q":"A cylinder has radius 10 cm and height 2 cm. Find its volume.","o":["20π cm³","100π cm³","200π cm³","400π cm³"],"a":2,"e":"V = π × 10² × 2 = 200π cm³.","v":"cylinder-basics"},{"d":"HARD","q":"The radius of a cylinder is tripled and its height remains the same. Its volume becomes:","o":["3 times","6 times","9 times","27 times"],"a":2,"e":"Volume depends on the square of the radius, so 3² = 9 times.","v":"cylinder-basics"},{"d":"HARD","q":"A cylindrical container has diameter 20 cm and height 15 cm. Find its volume.","o":["500π cm³","1000π cm³","1500π cm³","3000π cm³"],"a":2,"e":"Radius = 10 cm; volume = π × 100 × 15 = 1500π cm³.","v":"cylinder-basics"},{"d":"HARD","q":"A cylinder has radius 7 cm and height 5 cm. Find its total surface area using π = 22/7.","o":["220 cm²","440 cm²","528 cm²","616 cm²"],"a":2,"e":"TSA = 2 × (22/7) × 7 × (7 + 5) = 528 cm².","v":"cylinder-basics"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand cylinder volume and surface area</strong><small>Apply πr²h, 2πrh and 2πr(r + h)</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Find missing radius or height</strong><small>Interpret cylinder capacity and dimensions</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve practical cylinder problems</strong><small>Apply cylinder formulas accurately</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
