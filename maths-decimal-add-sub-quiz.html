<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What is 0.4 + 0.3?","o":["0.7","0.43","0.1","7"],"a":0,"e":"Four tenths plus three tenths equals seven tenths.","v":"decimal-add-sub"},{"d":"BASIC","q":"Calculate 1.2 + 0.5.","o":["1.7","1.25","0.7","1.3"],"a":0,"e":"1.2 + 0.5 = 1.7.","v":"decimal-add-sub"},{"d":"BASIC","q":"What is 0.9 − 0.4?","o":["0.5","0.13","0.4","1.3"],"a":0,"e":"Nine tenths minus four tenths is five tenths.","v":"decimal-add-sub"},{"d":"BASIC","q":"Calculate 2.35 + 1.20.","o":["3.55","3.25","2.47","3.65"],"a":0,"e":"2.35 + 1.20 = 3.55.","v":"decimal-add-sub"},{"d":"BASIC","q":"What is 5.8 − 2.3?","o":["3.5","3.1","7.1","2.5"],"a":0,"e":"5.8 − 2.3 = 3.5.","v":"decimal-add-sub"},{"d":"BASIC","q":"Calculate 0.25 + 0.25.","o":["0.50","0.025","0.30","1.00"],"a":0,"e":"A quarter plus a quarter equals one half: 0.50.","v":"decimal-add-sub"},{"d":"BASIC","q":"What is 4.06 + 0.10?","o":["4.16","4.07","4.60","5.06"],"a":0,"e":"One tenth is 0.10, so the total is 4.16.","v":"decimal-add-sub"},{"d":"BASIC","q":"Calculate 3.00 − 1.45.","o":["1.55","2.55","1.65","2.45"],"a":0,"e":"3.00 − 1.45 = 1.55.","v":"decimal-add-sub"},{"d":"BASIC","q":"What is 0.7 + 0.08?","o":["0.78","0.15","0.708","0.87"],"a":0,"e":"0.70 + 0.08 = 0.78.","v":"decimal-add-sub"},{"d":"BASIC","q":"Calculate 6.4 − 0.9.","o":["5.5","6.3","5.3","7.3"],"a":0,"e":"6.4 − 0.9 = 5.5.","v":"decimal-add-sub"},{"d":"MEDIUM","q":"What is 12.75 + 3.6?","o":["16.35","15.81","16.11","15.35"],"a":0,"e":"Write 3.6 as 3.60: 12.75 + 3.60 = 16.35.","v":"decimal-add-sub"},{"d":"MEDIUM","q":"Calculate 8.2 − 3.56.","o":["4.64","5.36","4.74","4.54"],"a":0,"e":"8.20 − 3.56 = 4.64.","v":"decimal-add-sub"},{"d":"MEDIUM","q":"What is 0.485 + 0.27?","o":["0.755","0.512","0.752","0.7550? no"],"a":0,"e":"0.485 + 0.270 = 0.755.","v":"decimal-add-sub"},{"d":"MEDIUM","q":"Calculate 20 − 7.85.","o":["12.15","13.15","12.25","12.85"],"a":0,"e":"20.00 − 7.85 = 12.15.","v":"decimal-add-sub"},{"d":"MEDIUM","q":"A notebook costs ₹24.75 and a pen costs ₹8.50. What is the total?","o":["₹33.25","₹32.25","₹34.25","₹33.15"],"a":0,"e":"24.75 + 8.50 = ₹33.25.","v":"decimal-add-sub"},{"d":"MEDIUM","q":"A ribbon is 5.6 m long. If 2.85 m is cut off, how much remains?","o":["2.75 m","3.25 m","2.85 m","3.75 m"],"a":0,"e":"5.60 − 2.85 = 2.75 m.","v":"decimal-add-sub"},{"d":"MEDIUM","q":"Calculate 3.408 + 1.62.","o":["5.028","4.628","5.208","4.028"],"a":0,"e":"3.408 + 1.620 = 5.028.","v":"decimal-add-sub"},{"d":"MEDIUM","q":"What is 10.05 − 6.789?","o":["3.261","4.261","3.371","3.271"],"a":0,"e":"10.050 − 6.789 = 3.261.","v":"decimal-add-sub"},{"d":"MEDIUM","q":"Add 0.09 + 0.009.","o":["0.099","0.18","0.9","0.0099"],"a":0,"e":"Nine hundredths plus nine thousandths is 0.099.","v":"decimal-add-sub"},{"d":"MEDIUM","q":"A jug contains 2.5 L. Another 0.75 L is poured in. How much is there?","o":["3.25 L","2.575 L","3.15 L","2.75 L"],"a":0,"e":"2.50 + 0.75 = 3.25 L.","v":"decimal-add-sub"},{"d":"HARD","q":"Calculate 14.006 + 2.789.","o":["16.795","16.785","15.795","17.795"],"a":0,"e":"14.006 + 2.789 = 16.795.","v":"decimal-add-sub"},{"d":"HARD","q":"What is 30.4 − 12.875?","o":["17.525","18.525","17.625","17.425"],"a":0,"e":"30.400 − 12.875 = 17.525.","v":"decimal-add-sub"},{"d":"HARD","q":"Calculate 5.75 + 0.806 − 1.9.","o":["4.656","4.756","3.856","4.556"],"a":0,"e":"5.750 + 0.806 = 6.556; subtract 1.900 to get 4.656.","v":"decimal-add-sub"},{"d":"HARD","q":"A runner completes 1.25 km in the morning and 2.875 km in the evening. Total distance?","o":["4.125 km","3.125 km","4.025 km","3.875 km"],"a":0,"e":"1.250 + 2.875 = 4.125 km.","v":"decimal-add-sub"},{"d":"HARD","q":"A tank has 18.5 L. After using 6.875 L and adding 2.4 L, how much remains?","o":["14.025 L","13.025 L","14.125 L","15.025 L"],"a":0,"e":"18.500 − 6.875 + 2.400 = 14.025 L.","v":"decimal-add-sub"},{"d":"HARD","q":"What number must be added to 4.785 to make 10?","o":["5.215","5.315","6.215","5.125"],"a":0,"e":"10.000 − 4.785 = 5.215.","v":"decimal-add-sub"},{"d":"HARD","q":"Calculate 0.999 + 0.001.","o":["1","0.1000","0.9991","1.001"],"a":0,"e":"0.999 + 0.001 = 1.000.","v":"decimal-add-sub"},{"d":"HARD","q":"The temperature rises from −2.5°C to 3.75°C. What is the increase?","o":["6.25°C","1.25°C","5.25°C","6.75°C"],"a":0,"e":"The increase is 3.75 − (−2.5) = 6.25°C.","v":"decimal-add-sub"},{"d":"HARD","q":"A shopper spends ₹45.85 from ₹100. How much change is left?","o":["₹54.15","₹55.15","₹54.25","₹45.15"],"a":0,"e":"100.00 − 45.85 = ₹54.15.","v":"decimal-add-sub"},{"d":"HARD","q":"Calculate 7.007 + 0.993 − 2.5.","o":["5.5","5.4","6.5","4.5"],"a":0,"e":"7.007 + 0.993 = 8; then 8 − 2.5 = 5.5.","v":"decimal-add-sub"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Add and subtract decimals</strong><small>Align decimal points</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Calculate decimal sums and differences</strong><small>Regroup and borrow across decimal places</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve decimal calculations</strong><small>Use decimal operations in everyday problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script></body></html>
