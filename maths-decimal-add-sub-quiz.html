<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What is 0.6 + 0.2?","o":["0.8","0.62","0.4","8"],"a":0,"e":"Six tenths plus two tenths equals eight tenths.","v":"decimal-add-sub"},{"d":"BASIC","q":"Calculate 1.4 + 0.3.","o":["1.7","1.43","1.1","1.8"],"a":0,"e":"1.4 + 0.3 = 1.7.","v":"decimal-add-sub"},{"d":"BASIC","q":"What is 0.9 − 0.5?","o":["0.4","0.14","0.5","1.4"],"a":0,"e":"Nine tenths minus five tenths is four tenths.","v":"decimal-add-sub"},{"d":"BASIC","q":"Calculate 2.25 + 1.50.","o":["3.75","3.25","2.40","3.65"],"a":0,"e":"2.25 + 1.50 = 3.75.","v":"decimal-add-sub"},{"d":"BASIC","q":"What is 7.8 − 2.4?","o":["5.4","5.6","10.2","4.4"],"a":0,"e":"7.8 − 2.4 = 5.4.","v":"decimal-add-sub"},{"d":"BASIC","q":"Calculate 0.35 + 0.25.","o":["0.60","0.40","0.510","0.70"],"a":0,"e":"35 hundredths plus 25 hundredths equals 60 hundredths.","v":"decimal-add-sub"},{"d":"BASIC","q":"What is 5.06 + 0.10?","o":["5.16","5.07","5.60","6.06"],"a":0,"e":"One tenth is 0.10, so the sum is 5.16.","v":"decimal-add-sub"},{"d":"BASIC","q":"Calculate 4.00 − 1.75.","o":["2.25","3.25","2.35","2.75"],"a":0,"e":"4.00 − 1.75 = 2.25.","v":"decimal-add-sub"},{"d":"BASIC","q":"What is 0.8 + 0.07?","o":["0.87","0.15","0.807","0.78"],"a":0,"e":"0.80 + 0.07 = 0.87.","v":"decimal-add-sub"},{"d":"BASIC","q":"Calculate 6.3 − 0.8.","o":["5.5","5.1","6.1","7.1"],"a":0,"e":"6.3 − 0.8 = 5.5.","v":"decimal-add-sub"},{"d":"MEDIUM","q":"What is 13.65 + 4.7?","o":["18.35","17.72","18.12","17.35"],"a":0,"e":"Write 4.7 as 4.70; 13.65 + 4.70 = 18.35.","v":"decimal-add-sub"},{"d":"MEDIUM","q":"Calculate 9.1 − 3.48.","o":["5.62","6.38","5.72","5.52"],"a":0,"e":"9.10 − 3.48 = 5.62.","v":"decimal-add-sub"},{"d":"MEDIUM","q":"What is 0.486 + 0.27?","o":["0.756","0.513","0.753","0.783"],"a":0,"e":"0.486 + 0.270 = 0.756.","v":"decimal-add-sub"},{"d":"MEDIUM","q":"Calculate 15.08 − 6.795.","o":["8.285","9.285","8.395","8.185"],"a":0,"e":"15.080 − 6.795 = 8.285.","v":"decimal-add-sub"},{"d":"MEDIUM","q":"A pencil costs ₹8.75 and an eraser costs ₹4.50. What is the total cost?","o":["₹13.25","₹12.25","₹13.75","₹14.25"],"a":0,"e":"₹8.75 + ₹4.50 = ₹13.25.","v":"decimal-add-sub"},{"d":"MEDIUM","q":"A bottle contains 2.5 L of water. If 0.85 L is used, how much remains?","o":["1.65 L","1.75 L","1.55 L","3.35 L"],"a":0,"e":"2.50 − 0.85 = 1.65 L.","v":"decimal-add-sub"},{"d":"MEDIUM","q":"Find 3.275 + 1.86.","o":["5.135","4.135","5.035","5.225"],"a":0,"e":"3.275 + 1.860 = 5.135.","v":"decimal-add-sub"},{"d":"MEDIUM","q":"Find 20 − 7.68.","o":["12.32","13.32","12.42","13.68"],"a":0,"e":"20.00 − 7.68 = 12.32.","v":"decimal-add-sub"},{"d":"MEDIUM","q":"A runner completes 2.35 km in the morning and 3.8 km in the evening. How far in total?","o":["6.15 km","5.15 km","6.05 km","5.95 km"],"a":0,"e":"2.35 + 3.80 = 6.15 km.","v":"decimal-add-sub"},{"d":"MEDIUM","q":"What number must be added to 4.68 to make 10?","o":["5.32","5.42","6.32","4.32"],"a":0,"e":"10.00 − 4.68 = 5.32.","v":"decimal-add-sub"},{"d":"HARD","q":"Calculate 8.006 + 3.789.","o":["11.795","11.785","12.795","10.795"],"a":0,"e":"8.006 + 3.789 = 11.795.","v":"decimal-add-sub"},{"d":"HARD","q":"Calculate 30.4 − 12.875.","o":["17.525","18.525","17.625","16.525"],"a":0,"e":"30.400 − 12.875 = 17.525.","v":"decimal-add-sub"},{"d":"HARD","q":"A board is 5.75 m long. A piece of 1.825 m is cut off, then another piece of 0.95 m is cut off. How much remains?","o":["2.975 m","3.025 m","2.875 m","3.075 m"],"a":0,"e":"5.750 − 1.825 − 0.950 = 2.975 m.","v":"decimal-add-sub"},{"d":"HARD","q":"Find the value of 14.28 + 0.906 − 3.7.","o":["11.486","11.586","12.486","10.586"],"a":0,"e":"14.280 + 0.906 = 15.186; 15.186 − 3.700 = 11.486.","v":"decimal-add-sub"},{"d":"HARD","q":"A shopper has ₹50.00 and spends ₹18.65 and ₹7.90. How much money remains?","o":["₹23.45","₹24.45","₹23.55","₹22.45"],"a":0,"e":"50.00 − 18.65 − 7.90 = ₹23.45.","v":"decimal-add-sub"},{"d":"HARD","q":"What is the missing number: 6.4 + □ = 10.025?","o":["3.625","3.525","4.625","3.725"],"a":0,"e":"10.025 − 6.400 = 3.625.","v":"decimal-add-sub"},{"d":"HARD","q":"Three lengths are 1.275 m, 2.08 m and 0.965 m. Find their total.","o":["4.320 m","4.220 m","3.320 m","4.310 m"],"a":0,"e":"1.275 + 2.080 + 0.965 = 4.320 m.","v":"decimal-add-sub"},{"d":"HARD","q":"Evaluate 100 − 46.785.","o":["53.215","54.215","53.315","52.215"],"a":0,"e":"100.000 − 46.785 = 53.215.","v":"decimal-add-sub"},{"d":"HARD","q":"A tank holds 12.5 L. It has 4.875 L added and then 3.96 L removed. How much is in it now if it started full?","o":["13.415 L","13.515 L","12.415 L","14.415 L"],"a":0,"e":"12.500 + 4.875 − 3.960 = 13.415 L.","v":"decimal-add-sub"},{"d":"HARD","q":"Find the difference between 7.005 and 2.879.","o":["4.126","5.126","4.226","4.136"],"a":0,"e":"7.005 − 2.879 = 4.126.","v":"decimal-add-sub"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Add and subtract decimals</strong><small>Align decimal points</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Calculate decimal sums and differences</strong><small>Regroup and borrow across decimal places</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve decimal calculations</strong><small>Use decimal operations in everyday problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
