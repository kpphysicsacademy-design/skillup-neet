<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:spa <script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Round 4.37 to the nearest tenth.","o":["4.3","4.4","4.37","5.0"],"a":1,"e":"The hundredths digit is 7, so increase the tenths digit from 3 to 4.","v":"decimal-estimation-rounding"},{"d":"BASIC","q":"Round 8.42 to the nearest whole number.","o":["8","9","8.4","8.5"],"a":0,"e":"The tenths digit is 4, so the nearest whole number is 8.","v":"decimal-estimation-rounding"},{"d":"BASIC","q":"Round 6.786 to the nearest hundredth.","o":["6.78","6.79","6.80","6.7"],"a":1,"e":"The thousandths digit is 6, so the hundredths digit rounds up.","v":"decimal-estimation-rounding"},{"d":"BASIC","q":"Estimate 19.6 + 30.2 by rounding each number to the nearest whole number.","o":["49","50","51","48"],"a":1,"e":"19.6 rounds to 20 and 30.2 rounds to 30; their sum is 50.","v":"decimal-estimation-rounding"},{"d":"BASIC","q":"Round 2.14 to the nearest tenth.","o":["2.1","2.2","2.14","3.0"],"a":0,"e":"The hundredths digit is 4, so the tenths digit remains 1.","v":"decimal-estimation-rounding"},{"d":"BASIC","q":"Round 7.85 to the nearest whole number.","o":["7","7.5","8","9"],"a":2,"e":"The tenths digit is 8, so round 7 up to 8.","v":"decimal-estimation-rounding"},{"d":"BASIC","q":"Which is 3.746 rounded to the nearest tenth?","o":["3.7","3.8","3.75","4.0"],"a":0,"e":"The hundredths digit is 4, so the tenths digit remains 7: 3.7.","v":"decimal-estimation-rounding"},{"d":"BASIC","q":"Round 0.968 to the nearest hundredth.","o":["0.96","0.97","1.00","0.9"],"a":1,"e":"The thousandths digit is 8, so 0.96 rounds up to 0.97.","v":"decimal-estimation-rounding"},{"d":"BASIC","q":"Estimate 51.3 − 18.7 by rounding each number to the nearest whole number.","o":["32","33","34","31"],"a":0,"e":"51.3 rounds to 51 and 18.7 rounds to 19; 51 − 19 = 32.","v":"decimal-estimation-rounding"},{"d":"BASIC","q":"Which number rounds to 5.6 to the nearest tenth?","o":["5.54","5.64","5.66","5.49"],"a":1,"e":"5.64 rounds to 5.6 because the hundredths digit is 4.","v":"decimal-estimation-rounding"},{"d":"MEDIUM","q":"Round 12.995 to the nearest hundredth.","o":["12.99","13.00","12.90","12.98"],"a":1,"e":"The thousandths digit is 5, so 12.99 rounds up to 13.00.","v":"decimal-estimation-rounding"},{"d":"MEDIUM","q":"Estimate 4.82 × 6.1 by rounding to the nearest whole number first.","o":["24","30","36","25"],"a":1,"e":"4.82 rounds to 5 and 6.1 rounds to 6; 5 × 6 = 30.","v":"decimal-estimation-rounding"},{"d":"MEDIUM","q":"Estimate 29.4 ÷ 5.8 by rounding to convenient whole numbers.","o":["4","5","6","3"],"a":1,"e":"29.4 is about 30 and 5.8 is about 6; 30 ÷ 6 = 5.","v":"decimal-estimation-rounding"},{"d":"MEDIUM","q":"Round 0.0496 to the nearest hundredth.","o":["0.04","0.05","0.049","0.10"],"a":1,"e":"The thousandths digit is 9, so 0.04 rounds up to 0.05.","v":"decimal-estimation-rounding"},{"d":"MEDIUM","q":"A bottle holds 1.96 L. To the nearest tenth of a litre, how much is that?","o":["1.9 L","2.0 L","1.96 L","2.1 L"],"a":1,"e":"The hundredths digit is 6, so 1.9 rounds up to 2.0 L.","v":"decimal-estimation-rounding"},{"d":"MEDIUM","q":"Estimate 198.7 + 402.3 by rounding each value to the nearest hundred.","o":["500","600","700","601"],"a":1,"e":"198.7 rounds to 200 and 402.3 rounds to 400; the estimate is 600.","v":"decimal-estimation-rounding"},{"d":"MEDIUM","q":"Round 45.649 to the nearest tenth.","o":["45.6","45.7","46.0","45.65"],"a":0,"e":"The hundredths digit is 4, so the tenths digit stays 6.","v":"decimal-estimation-rounding"},{"d":"MEDIUM","q":"Estimate 78.2 ÷ 9.7 using nearby easy numbers.","o":["7","8","9","10"],"a":1,"e":"78.2 is about 80 and 9.7 is about 10; 80 ÷ 10 = 8.","v":"decimal-estimation-rounding"},{"d":"MEDIUM","q":"Which value rounds to 12.4 to the nearest tenth?","o":["12.35","12.44","12.46","12.49"],"a":1,"e":"12.44 has hundredths digit 4, so it rounds to 12.4.","v":"decimal-estimation-rounding"},{"d":"MEDIUM","q":"Estimate 15.8 × 2.9 by rounding each factor to the nearest whole number.","o":["45","48","51","42"],"a":1,"e":"15.8 rounds to 16 and 2.9 rounds to 3; 16 × 3 = 48.","v":"decimal-estimation-rounding"},{"d":"HARD","q":"Round 9.999 to the nearest hundredth.","o":["9.99","10.00","9.90","10.09"],"a":1,"e":"Rounding 9.99 up one hundredth carries through to 10.00.","v":"decimal-estimation-rounding"},{"d":"HARD","q":"Estimate 48.6 × 19.7 by rounding to the nearest ten.","o":["800","900","1,000","700"],"a":2,"e":"48.6 rounds to 50 and 19.7 rounds to 20; 50 × 20 = 1,000.","v":"decimal-estimation-rounding"},{"d":"HARD","q":"A journey is 186.4 km, then another 92.8 km. Estimate the total to the nearest ten kilometres.","o":["270 km","280 km","290 km","300 km"],"a":1,"e":"186.4 rounds to 190 and 92.8 rounds to 90; total estimate is 280 km.","v":"decimal-estimation-rounding"},{"d":"HARD","q":"Round 0.995 to the nearest tenth.","o":["0.9","1.0","0.99","0.10"],"a":1,"e":"The hundredths digit is 9, so 0.9 rounds up to 1.0.","v":"decimal-estimation-rounding"},{"d":"HARD","q":"Estimate 602.8 − 298.3 by rounding both numbers to the nearest hundred.","o":["200","300","400","500"],"a":1,"e":"602.8 rounds to 600 and 298.3 rounds to 300; 600 − 300 = 300.","v":"decimal-estimation-rounding"},{"d":"HARD","q":"Which number rounds to 4.30 to the nearest hundredth?","o":["4.294","4.304","4.305","4.315"],"a":1,"e":"4.304 rounds to 4.30 because the thousandths digit is 4.","v":"decimal-estimation-rounding"},{"d":"HARD","q":"Estimate 7.92 × 0.48 by rounding to one significant digit.","o":["3","4","5","2"],"a":1,"e":"7.92 rounds to 8 and 0.48 rounds to 0.5; 8 × 0.5 = 4.","v":"decimal-estimation-rounding"},{"d":"HARD","q":"A shop bill is ₹498.75 and a second item costs ₹203.20. Estimate the total to the nearest hundred rupees by rounding each price to the nearest hundred.","o":["₹600","₹700","₹800","₹900"],"a":1,"e":"₹498.75 rounds to ₹500 and ₹203.20 rounds to ₹200; total estimate ₹700.","v":"decimal-estimation-rounding"},{"d":"HARD","q":"Round 16.4501 to the nearest hundredth.","o":["16.44","16.45","16.46","16.50"],"a":1,"e":"The thousandths digit is 0, so the hundredths digit stays 5.","v":"decimal-estimation-rounding"},{"d":"HARD","q":"Estimate 1,984 ÷ 48 using compatible numbers.","o":["30","40","50","60"],"a":1,"e":"Use 2,000 ÷ 50 = 40 as a nearby easy estimate.","v":"decimal-estimation-rounding"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Multiply positive and negative integers</strong><small>Apply sign rules to integer products</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Solve multiplication word problems</strong><small>Reason with signs and products</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply ruler-and-compass reasoning</strong><small>Use accurate integer multiplication methods</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
