<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Which decimal is terminating?","o":["0.333…","0.125","0.272727…","π"],"a":1,"e":"0.125 has a finite number of decimal digits."},{"d":"BASIC","q":"Which fraction equals 0.5?","o":["1/4","1/2","2/3","3/4"],"a":1,"e":"0.5 = 5/10 = 1/2."},{"d":"BASIC","q":"How is 0.777… classified?","o":["Terminating","Non-terminating repeating","Non-terminating non-repeating","An integer"],"a":1,"e":"The digit 7 repeats indefinitely, so the decimal is repeating."},{"d":"BASIC","q":"Which decimal represents 3/4?","o":["0.34","0.75","0.8","0.25"],"a":1,"e":"3 ÷ 4 = 0.75."},{"d":"BASIC","q":"What is 0.2 written as a fraction in simplest form?","o":["1/2","1/5","2/5","1/10"],"a":1,"e":"0.2 = 2/10 = 1/5."},{"d":"BASIC","q":"Which decimal is non-terminating and repeating?","o":["0.125","0.1010010001…","0.454545…","2.75"],"a":2,"e":"The block 45 repeats indefinitely."},{"d":"BASIC","q":"How many decimal places are in 4.062?","o":["1","2","3","4"],"a":2,"e":"The digits after the decimal point are 0, 6 and 2."},{"d":"BASIC","q":"Which fraction gives the terminating decimal 0.25?","o":["1/4","1/3","2/3","3/7"],"a":0,"e":"0.25 = 25/100 = 1/4."},{"d":"BASIC","q":"Which is the decimal form of 7/10?","o":["0.07","0.7","7.0","0.17"],"a":1,"e":"Seven tenths is written as 0.7."},{"d":"BASIC","q":"Which decimal is greater?","o":["0.6","0.56","They are equal","Cannot compare"],"a":0,"e":"0.60 is greater than 0.56."},{"d":"MEDIUM","q":"Which fraction has a terminating decimal expansion?","o":["1/6","7/20","2/9","5/12"],"a":1,"e":"In simplest form, a rational fraction terminates if the denominator has only prime factors 2 and/or 5; 20 = 2² × 5."},{"d":"MEDIUM","q":"Convert 0.363636… to a fraction in simplest form.","o":["4/11","36/100","3/8","5/11"],"a":0,"e":"Let x = 0.363636…; 100x − x = 36, so 99x = 36 and x = 4/11."},{"d":"MEDIUM","q":"Which fraction has a non-terminating repeating decimal?","o":["3/8","7/25","5/11","9/40"],"a":2,"e":"11 has a prime factor other than 2 or 5, so 5/11 repeats."},{"d":"MEDIUM","q":"Write 0.125 as a fraction in simplest form.","o":["1/4","1/8","1/5","5/8"],"a":1,"e":"0.125 = 125/1000 = 1/8."},{"d":"MEDIUM","q":"What is 2.375 as a fraction in simplest form?","o":["19/8","2375/100","23/10","17/8"],"a":0,"e":"2.375 = 2375/1000 = 19/8."},{"d":"MEDIUM","q":"Which statement about 0.1010010001… is correct, assuming the number of zeros between successive 1s keeps increasing?","o":["It terminates","It repeats with a fixed block","It is non-terminating and non-repeating","It is an integer"],"a":2,"e":"The pattern does not repeat in a fixed cycle and never ends."},{"d":"MEDIUM","q":"Which denominator in simplest form guarantees a terminating decimal?","o":["12","15","28","125"],"a":3,"e":"125 = 5³, containing only the prime factor 5."},{"d":"MEDIUM","q":"Convert 13/20 to a decimal.","o":["0.13","0.65","0.75","1.3"],"a":1,"e":"13 ÷ 20 = 0.65."},{"d":"MEDIUM","q":"Which is the correct ascending order?","o":["0.4, 0.404, 0.44, 0.5","0.404, 0.4, 0.5, 0.44","0.5, 0.44, 0.404, 0.4","0.44, 0.4, 0.404, 0.5"],"a":0,"e":"Write 0.4 as 0.400: then 0.400 < 0.404 < 0.440 < 0.500."},{"d":"MEDIUM","q":"What is 0.090909… as a fraction?","o":["1/9","1/11","9/100","1/10"],"a":1,"e":"The repeating block 09 gives 9/99 = 1/11."},{"d":"HARD","q":"Which fraction has a terminating decimal expansion after simplification?","o":["13/30","21/56","17/45","11/75"],"a":1,"e":"21/56 simplifies to 3/8, whose denominator has only factor 2."},{"d":"HARD","q":"Convert 0.1666… (only the 6 repeats) to a fraction.","o":["1/6","16/99","1/5","2/15"],"a":0,"e":"0.1666… = 1/6."},{"d":"HARD","q":"Which statement is true for a rational number p/q in lowest terms, where q is positive?","o":["Its decimal always terminates","Its decimal terminates only if q is prime","Its decimal terminates if q has no prime factors other than 2 and 5","Its decimal is always irrational"],"a":2,"e":"A reduced rational fraction terminates exactly when q = 2ᵐ5ⁿ for non-negative integers m and n."},{"d":"HARD","q":"Convert 0.272727… to a fraction in simplest form.","o":["3/11","27/100","2/7","5/18"],"a":0,"e":"Let x = 0.272727…; 100x − x = 27, so x = 27/99 = 3/11."},{"d":"HARD","q":"Which number has a non-terminating, non-repeating decimal expansion?","o":["√2","3/8","0.625","0.121212…"],"a":0,"e":"√2 is irrational, so its decimal expansion is non-terminating and non-repeating."},{"d":"HARD","q":"A reduced fraction has denominator 2³ × 5². What can you conclude about its decimal expansion?","o":["It is terminating","It is repeating forever","It is irrational","It is an integer in every case"],"a":0,"e":"The denominator contains only factors 2 and 5, so the decimal terminates."},{"d":"HARD","q":"What is 1.2̅ where only the digit 2 repeats (1.2222…)?","o":["11/9","6/5","5/4","10/9"],"a":0,"e":"1.2222… = 1 + 0.2222… = 1 + 2/9 = 11/9."},{"d":"HARD","q":"Which fraction equals 0.083333… where only the 3 repeats?","o":["1/12","1/8","5/60","1/9"],"a":0,"e":"0.083333… = 1/12."},{"d":"HARD","q":"Which is the best reason that 7/30 has a non-terminating repeating decimal?","o":["30 contains a factor 3 after simplification","7 is prime","30 is even","7/30 is greater than zero"],"a":0,"e":"The denominator 30 = 2 × 3 × 5 includes factor 3, so the decimal repeats."},{"d":"HARD","q":"Which comparison is correct?","o":["0.3̅ = 1/3","0.3̅ = 3/10","0.333 = 1/3 exactly","0.303030… = 1/3"],"a":0,"e":"0.333… with 3 repeating equals 1/3; finite 0.333 is not exactly 1/3."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Convert decimals and fractions</strong><small>Change terminating and repeating decimals into fractions</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Classify decimal expansions</strong><small>Identify terminating, repeating and non-repeating decimals</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply rational number rules</strong><small>Use denominator factors to predict decimal behaviour</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
