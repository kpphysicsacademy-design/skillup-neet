minates exactly when q = 2ᵐ5ⁿ for non-negative integers m and n."},{"d":"HARD","q":"Convert 0.272727… to a fraction in simplest form.","o":["3/11","27/100","2/7","5/18"],"a":0,"why":"Let x = 0.272727…; 100x − x = 27, so x = 27/99 = 3/11."},{"d":"HARD","q":"Which number has a non-terminating, non-repeating decimal expansion?","o":["√2","3/8","0.625","0.121212…"],"a":0,"why":"√2 is irrational, so its decimal expansion is non-terminating and non-repeating."},{"d":"HARD","q":"A reduced fraction has denominator 2³ × 5². What can you conclude about its decimal expansion?","o":["It is terminating","It is repeating forever","It is irrational","It is an integer in every case"],"a":0,"why":"The denominator contains only factors 2 and 5, so the decimal terminates."},{"d":"HARD","q":"What is 1.2̅ where only the digit 2 repeats (1.2222…)?","o":["11/9","6/5","5/4","10/9"],"a":0,"why":"1.2222… = 1 + 0.2222… = 1 + 2/9 = 11/9."},{"d":"HARD","q":"Which fraction equals 0.083333… where only the 3 repeats?","o":["1/12","1/8","5/60","1/9"],"a":0,"why":"0.083333… = 1/12."},{"d":"HARD","q":"Which is the best reason that 7/30 has a non-terminating repeating decimal?","o":["30 contains a factor 3 after simplification","7 is prime","30 is even","7/30 is greater than zero"],"a":0,"why":"The denominator 30 = 2 × 3 × 5 includes factor 3, so the decimal repeats."},{"d":"HARD","q":"Which comparison is correct?","o":["0.3̅ = 1/3","0.3̅ = 3/10","0.333 = 1/3 exactly","0.303030… = 1/3"],"a":0,"why":"0.333… with 3 repeating equals 1/3; finite 0.333 is not exactly 1/3."}];
