<meta name="description" content="Interactive decimal expansion classifier for Class 9 Maths.">
<title>Decimal Expansion Simulator | SkillUp</title>
<style>
:root{--ink:#1e315f;--muted:#66758b;--line:#dce7f0;--blue:#1685bd;--bg:#f1f7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line)}.nav{max-width:720px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:12px}.back{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;color:var(--blue);text-decoration:none;font-size:20px}.brand{font-weight:900;font-size:18px}.brand span{color:#3686df}
main{max-width:680px;margin:auto;padding:22px 16px 36px}.eyebrow{color:var(--blue);font-size:12px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}h1{font-size:clamp(26px,6vw,34px);margin:5px 0}.sub{color:var(--muted);line-height:1.5;margin:0 0 18px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 5px 18px #1d47700a}.label{font-size:13px;font-weight:850;display:block;margin-bottom:9px}.samples{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.sample{border:1px solid var(--line);background:#f8fbff;border-radius:11px;padding:12px 9px;font-size:15px;font-weight:850;color:var(--ink);cursor:pointer}.sample.active{border-color:var(--blue);background:#eaf6ff;color:#126b98}
.number{margin:16px 0 6px;padding:14px;border-radius:12px;background:#f1f6fb;text-align:center;font-size:clamp(22px,6vw,30px);font-weight:900;overflow-wrap:anywhere}
.options{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}.choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;text-align:left;font-weight:750;color:var(--ink);font-size:14px;cursor:pointer}.choice:disabled{opacity:1}.choice.correct{background:#edf9ef;border-color:#9bd3a5;color:#216b32}.choice.wrong{background:#fff1f1;border-color:#e6aaaa;color:#a02e2e}
.result{display:none;margin-top:13px;padding:13px;border-radius:12px;background:#edf7ff;color:#28536e;line-height:1.5;font-size:14px}.result.show{display:block}.reset{margin-top:12px;width:100%;padding:12px;border:0;border-radius:11px;background:#1685bd;color:#fff;font-weight:850;font-size:14px}
@media(max-width:520px){main{padding:18px 13px 28px}.panel{padding:14px}.samples{grid-template-columns:1fr 1fr}.sample{font-size:13px;padding:11px 7px}}
</style></head><body>
<header><div class="nav"><a class="back" href="maths-decimal-expansions-quiz.html?v=20261121-decimal-expansions-quiz-learn-sim-v2" aria-label="Back to quiz">←</a><div class="brand">SkillUp <span>Maths</span></div></div></header>
<main><div class="eyebrow">Class 9 • Interactive</div><h1>Decimal Classifier</h1><p class="sub">Choose a sample, then classify its decimal expansion.</p>
<section class="panel"><span class="label">1. Choose a decimal</span><div class="samples" id="samples">
<button class="sample active" data-i="0">0.375</button><button class="sample" data-i="1">0.666…</button><button class="sample" data-i="2">1.414213…</button><button class="sample" data-i="3">0.142857…</button>
</div><div class="number" id="number">0.375</div><span class="label">2. Select its type</span><div class="options" id="options">
<button class="choice" data-v="term">Terminating</button><button class="choice" data-v="repeat">Non-terminating recurring</button><button class="choice" data-v="nonrepeat">Non-terminating non-recurring</button>
</div><div class="result" id="result" aria-live="polite"></div><button class="reset" id="reset">Try again</button></section>
</main>
<script>
(function(){
const data=[
{n:"0.375",type:"term",label:"Terminating",why:"It ends after three decimal places. In fraction form, 0.375 = 3/8."},
{n:"0.666…",type:"repeat",label:"Non-terminating recurring",why:"The digit 6 repeats forever. It is rational: 0.666… = 2/3."},
{n:"1.414213…",type:"nonrepeat",label:"Non-terminating non-recurring",why:"This is the decimal expansion of √2; its digits continue without a repeating block."},
{n:"0.142857…",type:"repeat",label:"Non-terminating recurring",why:"The block 142857 repeats forever. It is rational: 1/7 = 0.142857142857…"}
];
let active=0,locked=false;
const number=document.getElementById("number"),result=document.getElementById("result"),choices=[...document.querySelectorAll(".choice")];
function reset(){locked=false;result.className="result";result.textContent="";choices.forEach(b=>{b.disabled=false;b.classList.remove("correct","wrong")});}
document.querySelectorAll(".sample").forEach(b=>b.addEventListener("click",()=>{active=Number(b.dataset.i);document.querySelectorAll(".sample").forEach(x=>x.classList.toggle("active",x===b));number.textContent=data[active].n;reset()}));
choices.forEach(b=>b.addEventListener("click",()=>{if(locked)return;locked=true;const d=data[active],ok=b.dataset.v===d.type;choices.forEach(x=>{x.disabled=true;if(x.dataset.v===d.type)x.classList.add("correct")});if(!ok)b.classList.add("wrong");result.className="result show";result.textContent=(ok?"✓ Correct. ":"Not quite. ")+d.label+". "+d.why;}));
document.getElementById("reset").addEventListener("click",reset);
})();
</script><script src="/shared-nav.js?v=20261125-central-design-system-v2"></script>
</body></html>
