<style>

ce-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What is 0.4 × 3?","o":["1.2","0.12","0.7","12"],"a":0,"e":"Four tenths multiplied by three equals twelve tenths, or 1.2.","v":"decimal-mul-div"},{"d":"BASIC","q":"Calculate 2.5 × 2.","o":["5","4.5","0.5","50"],"a":0,"e":"2.5 doubled is 5.","v":"decimal-mul-div"},{"d":"BASIC","q":"What is 0.8 × 0.5?","o":["0.4","4","0.13","0.04"],"a":0,"e":"Eight tenths multiplied by five tenths is forty hundredths, or 0.4.","v":"decimal-mul-div"},{"d":"BASIC","q":"Calculate 6.3 ÷ 3.","o":["2.1","2.3","21","0.21"],"a":0,"e":"6.3 divided equally into three parts gives 2.1 each.","v":"decimal-mul-div"},{"d":"BASIC","q":"What is 4.8 ÷ 2?","o":["2.4","2.8","1.4","24"],"a":0,"e":"Half of 4.8 is 2.4.","v":"decimal-mul-div"},{"d":"BASIC","q":"Calculate 0.7 × 10.","o":["7","0.07","70","0.17"],"a":0,"e":"Multiplying by 10 shifts the decimal one place to the right.","v":"decimal-mul-div"},{"d":"BASIC","q":"What is 5.6 ÷ 10?","o":["0.56","56","5.06","0.056"],"a":0,"e":"Dividing by 10 shifts the decimal one place to the left.","v":"decimal-mul-div"},{"d":"BASIC","q":"Calculate 1.2 × 4.","o":["4.8","3.2","1.6","48"],"a":0,"e":"1.2 × 4 = 4.8.","v":"decimal-mul-div"},{"d":"BASIC","q":"What is 0.9 ÷ 3?","o":["0.3","0.03","3","0.6"],"a":0,"e":"Nine tenths divided by three is three tenths.","v":"decimal-mul-div"},{"d":"BASIC","q":"Calculate 2.4 ÷ 0.6.","o":["4","0.4","40","3"],"a":0,"e":"2.4 ÷ 0.6 = 24 ÷ 6 = 4 after multiplying both numbers by 10.","v":"decimal-mul-div"},{"d":"MEDIUM","q":"What is 1.25 × 4?","o":["5","4.5","0.5","50"],"a":0,"e":"1.25 × 4 = 5.","v":"decimal-mul-div"},{"d":"MEDIUM","q":"Calculate 3.6 × 0.7.","o":["2.52","25.2","0.252","4.3"],"a":0,"e":"36 × 7 = 252; there are two decimal places in the factors, giving 2.52.","v":"decimal-mul-div"},{"d":"MEDIUM","q":"What is 8.64 ÷ 1.2?","o":["7.2","72","0.72","6.2"],"a":0,"e":"Multiply both numbers by 10: 86.4 ÷ 12 = 7.2.","v":"decimal-mul-div"},{"d":"MEDIUM","q":"Calculate 5.04 ÷ 0.7.","o":["7.2","0.72","72","6.2"],"a":0,"e":"Multiply both numbers by 10: 50.4 ÷ 7 = 7.2.","v":"decimal-mul-div"},{"d":"MEDIUM","q":"A notebook costs ₹12.50. What do 4 notebooks cost?","o":["₹50","₹48","₹40","₹52"],"a":0,"e":"₹12.50 × 4 = ₹50.","v":"decimal-mul-div"},{"d":"MEDIUM","q":"A 6.3 L jug is poured equally into 9 bottles. How much goes into each bottle?","o":["0.7 L","7 L","0.07 L","1.4 L"],"a":0,"e":"6.3 ÷ 9 = 0.7 L per bottle.","v":"decimal-mul-div"},{"d":"MEDIUM","q":"What is 0.125 × 8?","o":["1","0.1","10","0.8"],"a":0,"e":"125 thousandths multiplied by 8 equals 1000 thousandths, or 1.","v":"decimal-mul-div"},{"d":"MEDIUM","q":"Calculate 14.4 ÷ 0.6.","o":["24","2.4","240","14"],"a":0,"e":"Multiply both numbers by 10: 144 ÷ 6 = 24.","v":"decimal-mul-div"},{"d":"MEDIUM","q":"A ribbon 7.5 m long is cut into pieces of 0.5 m each. How many pieces are made?","o":["15","1.5","150","14"],"a":0,"e":"7.5 ÷ 0.5 = 75 ÷ 5 = 15 pieces.","v":"decimal-mul-div"},{"d":"MEDIUM","q":"Calculate 2.4 × 1.5.","o":["3.6","36","0.36","3.9"],"a":0,"e":"24 × 15 = 360; two decimal places give 3.60 = 3.6.","v":"decimal-mul-div"},{"d":"HARD","q":"Calculate 0.48 × 0.35.","o":["0.168","1.68","0.0168","16.8"],"a":0,"e":"48 × 35 = 1680; four decimal places give 0.1680 = 0.168.","v":"decimal-mul-div"},{"d":"HARD","q":"What is 12.096 ÷ 0.8?","o":["15.12","1.512","151.2","14.12"],"a":0,"e":"Multiply both numbers by 10: 120.96 ÷ 8 = 15.12.","v":"decimal-mul-div"},{"d":"HARD","q":"A car uses 4.8 L of fuel to travel 60 km. How many kilometres per litre does it travel?","o":["12.5 km/L","12 km/L","10.5 km/L","15 km/L"],"a":0,"e":"Distance per litre = 60 ÷ 4.8 = 12.5 km/L.","v":"decimal-mul-div"},{"d":"HARD","q":"Calculate 3.75 ÷ 0.25.","o":["15","1.5","150","12"],"a":0,"e":"Multiply both numbers by 100: 375 ÷ 25 = 15.","v":"decimal-mul-div"},{"d":"HARD","q":"A 2.4 kg bag of rice is split into packets of 0.15 kg. How many packets are filled?","o":["16","1.6","160","14"],"a":0,"e":"2.4 ÷ 0.15 = 240 ÷ 15 = 16 packets.","v":"decimal-mul-div"},{"d":"HARD","q":"Find 0.064 × 2.5.","o":["0.16","1.6","0.016","16"],"a":0,"e":"0.064 × 2.5 = 0.064 × (5 ÷ 2) = 0.32 ÷ 2 = 0.16.","v":"decimal-mul-div"},{"d":"HARD","q":"Calculate 18.9 ÷ 0.09.","o":["210","21","2.1","2100"],"a":0,"e":"Multiply both numbers by 100: 1890 ÷ 9 = 210.","v":"decimal-mul-div"},{"d":"HARD","q":"A 15.75 m wire is cut into 1.25 m lengths. How many full lengths can be made?","o":["12","12.6","13","11"],"a":0,"e":"15.75 ÷ 1.25 = 1575 ÷ 125 = 12.6, so 12 full lengths can be made.","v":"decimal-mul-div"},{"d":"HARD","q":"Evaluate 2.4 × 0.75 ÷ 0.3.","o":["6","0.6","60","1.8"],"a":0,"e":"2.4 × 0.75 = 1.8, and 1.8 ÷ 0.3 = 6.","v":"decimal-mul-div"},{"d":"HARD","q":"A shop packs 3.6 kg of sweets into bags of 0.08 kg each. How many bags are needed?","o":["45","4.5","450","35"],"a":0,"e":"3.6 ÷ 0.08 = 360 ÷ 8 = 45 bags.","v":"decimal-mul-div"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Multiply and divide decimals</strong><small>Use place value and decimal shifts</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Multiply and divide decimal numbers</strong><small>Shift decimals correctly and simplify</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Calculate decimal products and quotients</strong><small>Solve decimal multiplication and division problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
