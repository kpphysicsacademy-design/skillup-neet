<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What is 0.4 × 3?","o":["1.2","0.12","7","0.7"],"a":0,"e":"Four tenths multiplied by 3 is twelve tenths, or 1.2.","v":"decimal-mul-div"},{"d":"BASIC","q":"Calculate 2.5 × 2.","o":["5","4.5","0.5","25"],"a":0,"e":"2.5 doubled is 5.","v":"decimal-mul-div"},{"d":"BASIC","q":"What is 6.4 ÷ 2?","o":["3.2","2.3","12.8","32"],"a":0,"e":"6.4 split equally into 2 parts gives 3.2.","v":"decimal-mul-div"},{"d":"BASIC","q":"Calculate 0.8 × 10.","o":["8","0.08","80","0.8"],"a":0,"e":"Multiplying by 10 moves the decimal point one place right.","v":"decimal-mul-div"},{"d":"BASIC","q":"What is 4.5 ÷ 10?","o":["0.45","45","4.05","0.045"],"a":0,"e":"Dividing by 10 moves the decimal point one place left.","v":"decimal-mul-div"},{"d":"BASIC","q":"Calculate 1.2 × 3.","o":["3.6","2.6","36","0.36"],"a":0,"e":"1.2 × 3 = 3.6.","v":"decimal-mul-div"},{"d":"BASIC","q":"What is 7.5 ÷ 5?","o":["1.5","2.5","3.5","15"],"a":0,"e":"7.5 divided by 5 equals 1.5.","v":"decimal-mul-div"},{"d":"BASIC","q":"Calculate 0.6 × 0.2.","o":["0.12","1.2","0.012","12"],"a":0,"e":"6 × 2 = 12; there are two decimal places, so 0.12.","v":"decimal-mul-div"},{"d":"BASIC","q":"What is 9.6 ÷ 3?","o":["3.2","2.3","32","0.32"],"a":0,"e":"9.6 ÷ 3 = 3.2.","v":"decimal-mul-div"},{"d":"BASIC","q":"Calculate 3.4 × 100.","o":["340","34","3.400","0.034"],"a":0,"e":"Multiplying by 100 moves the decimal point two places right.","v":"decimal-mul-div"},{"d":"MEDIUM","q":"What is 2.35 × 4?","o":["9.4","8.4","0.94","94"],"a":0,"e":"235 hundredths × 4 = 940 hundredths = 9.4.","v":"decimal-mul-div"},{"d":"MEDIUM","q":"Calculate 8.64 ÷ 4.","o":["2.16","2.6","21.6","0.216"],"a":0,"e":"8.64 ÷ 4 = 2.16.","v":"decimal-mul-div"},{"d":"MEDIUM","q":"What is 0.25 × 0.4?","o":["0.1","1.0","0.01","0.16"],"a":0,"e":"25 hundredths × 4 tenths = 100 thousandths = 0.1.","v":"decimal-mul-div"},{"d":"MEDIUM","q":"Calculate 12.6 ÷ 0.3.","o":["42","4.2","0.42","420"],"a":0,"e":"Multiply both numbers by 10: 126 ÷ 3 = 42.","v":"decimal-mul-div"},{"d":"MEDIUM","q":"A pen costs ₹12.50. What do 4 pens cost?","o":["₹50","₹48","₹40","₹5"],"a":0,"e":"12.50 × 4 = ₹50.","v":"decimal-mul-div"},{"d":"MEDIUM","q":"A 3.6 m rope is cut into 6 equal pieces. How long is each?","o":["0.6 m","6 m","0.06 m","2.16 m"],"a":0,"e":"3.6 ÷ 6 = 0.6 m.","v":"decimal-mul-div"},{"d":"MEDIUM","q":"Calculate 4.08 × 0.5.","o":["2.04","20.4","0.204","4.58"],"a":0,"e":"Multiplying by 0.5 is the same as taking half.","v":"decimal-mul-div"},{"d":"MEDIUM","q":"What is 15.75 ÷ 100?","o":["0.1575","1.575","1575","0.01575"],"a":0,"e":"Dividing by 100 moves the decimal point two places left.","v":"decimal-mul-div"},{"d":"MEDIUM","q":"Calculate 2.4 × 1.5.","o":["3.6","3.9","36","0.36"],"a":0,"e":"24 × 15 = 360; two decimal places give 3.60.","v":"decimal-mul-div"},{"d":"MEDIUM","q":"What is 7.2 ÷ 0.8?","o":["9","0.9","90","8"],"a":0,"e":"Multiply both numbers by 10: 72 ÷ 8 = 9.","v":"decimal-mul-div"},{"d":"HARD","q":"Calculate 0.36 × 0.25.","o":["0.09","0.9","0.009","9"],"a":0,"e":"One quarter of 0.36 is 0.09.","v":"decimal-mul-div"},{"d":"HARD","q":"What is 18.375 ÷ 1.5?","o":["12.25","1.225","122.5","12.5"],"a":0,"e":"Multiply both numbers by 10: 183.75 ÷ 15 = 12.25.","v":"decimal-mul-div"},{"d":"HARD","q":"Calculate 3.75 × 2.4.","o":["9","8.5","0.9","90"],"a":0,"e":"375 × 24 = 9000; three decimal places give 9.000.","v":"decimal-mul-div"},{"d":"HARD","q":"A car travels 18.6 km using 1.2 L of fuel. Distance per litre?","o":["15.5 km/L","14.5 km/L","16.5 km/L","1.55 km/L"],"a":0,"e":"18.6 ÷ 1.2 = 186 ÷ 12 = 15.5 km/L.","v":"decimal-mul-div"},{"d":"HARD","q":"Calculate 5.04 ÷ 0.07.","o":["72","7.2","0.72","720"],"a":0,"e":"Multiply both numbers by 100: 504 ÷ 7 = 72.","v":"decimal-mul-div"},{"d":"HARD","q":"What is 0.125 × 0.8?","o":["0.1","1","0.01","0.001"],"a":0,"e":"0.125 is one eighth; one eighth of 0.8 is 0.1.","v":"decimal-mul-div"},{"d":"HARD","q":"A 2.75 kg bag is split into 5 equal portions. Each portion weighs?","o":["0.55 kg","0.5 kg","0.75 kg","5.5 kg"],"a":0,"e":"2.75 ÷ 5 = 0.55 kg.","v":"decimal-mul-div"},{"d":"HARD","q":"Calculate 6.25 × 0.16.","o":["1","10","0.1","100"],"a":0,"e":"6.25 × 16/100 = 100/100 = 1.","v":"decimal-mul-div"},{"d":"HARD","q":"What is 24.48 ÷ 0.6?","o":["40.8","4.08","408","0.408"],"a":0,"e":"Multiply both numbers by 10: 244.8 ÷ 6 = 40.8.","v":"decimal-mul-div"},{"d":"HARD","q":"A 7.5 L container is poured into bottles of 0.25 L each. How many bottles can be filled?","o":["30","3","25","300"],"a":0,"e":"7.5 ÷ 0.25 = 750 ÷ 25 = 30.","v":"decimal-mul-div"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Multiply and divide decimals</strong><small>Use place value and decimal shifts</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Multiply and divide decimal numbers</strong><small>Shift decimals correctly and simplify</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Calculate decimal products and quotients</strong><small>Solve decimal multiplication and division problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script></body></html>
