<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261012-decimal-operations-quiz-v1"><title>Decimal Operations | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Calculate 3.4 + 2.5.","o":["5.9","5.8","6.0","0.9"],"a":0,"e":"Add the tenths and whole-number parts by aligning decimal points: 3.4 + 2.5 = 5.9.","v":"decimal-operations"},{"d":"BASIC","q":"Calculate 8.7 − 3.2.","o":["5.3","5.5","6.5","4.5"],"a":1,"e":"Subtract aligned place values: 8.7 − 3.2 = 5.5.","v":"decimal-operations"},{"d":"BASIC","q":"Calculate 0.6 + 0.25.","o":["0.31","0.85","0.65","0.91"],"a":1,"e":"Write 0.6 as 0.60; 0.60 + 0.25 = 0.85.","v":"decimal-operations"},{"d":"BASIC","q":"Calculate 4.8 × 10.","o":["4.80","48","480","0.48"],"a":1,"e":"Multiplying by 10 shifts each digit one place to the left in place value.","v":"decimal-operations"},{"d":"BASIC","q":"Calculate 7.2 ÷ 10.","o":["72","0.72","7.02","0.072"],"a":1,"e":"Dividing by 10 shifts the digits one place to the right in place value.","v":"decimal-operations"},{"d":"BASIC","q":"Calculate 0.4 × 0.3.","o":["1.2","0.12","0.012","0.7"],"a":1,"e":"4 × 3 = 12 and there are two decimal places in total, giving 0.12.","v":"decimal-operations"},{"d":"BASIC","q":"Calculate 2.4 ÷ 0.6.","o":["0.4","4","40","3"],"a":1,"e":"Multiply both numbers by 10: 24 ÷ 6 = 4.","v":"decimal-operations"},{"d":"BASIC","q":"Write 35/100 as a decimal.","o":["3.5","0.35","0.035","35.0"],"a":1,"e":"Thirty-five hundredths is written as 0.35.","v":"decimal-operations"},{"d":"BASIC","q":"Which is the greatest decimal?","o":["0.7","0.67","0.706","0.699"],"a":2,"e":"Compare to thousandths: 0.700, 0.670, 0.706, and 0.699.","v":"decimal-operations"},{"d":"BASIC","q":"Round 6.784 to the nearest hundredth.","o":["6.78","6.79","6.7","6.80"],"a":1,"e":"The thousandths digit is 4, so the hundredths digit stays 8: 6.78.","v":"decimal-operations"},{"d":"MEDIUM","q":"Calculate 12.45 + 3.8.","o":["16.25","15.83","16.83","15.25"],"a":0,"e":"Write 3.8 as 3.80; 12.45 + 3.80 = 16.25.","v":"decimal-operations"},{"d":"MEDIUM","q":"Calculate 10 − 4.675.","o":["5.325","6.325","5.425","6.675"],"a":0,"e":"Align decimal points: 10.000 − 4.675 = 5.325.","v":"decimal-operations"},{"d":"MEDIUM","q":"Calculate 1.25 × 0.4.","o":["5.0","0.5","0.05","0.9"],"a":1,"e":"125 × 4 = 500; three decimal places total give 0.500 = 0.5.","v":"decimal-operations"},{"d":"MEDIUM","q":"Calculate 3.36 ÷ 0.8.","o":["0.42","4.2","42","2.68"],"a":1,"e":"Multiply dividend and divisor by 10: 33.6 ÷ 8 = 4.2.","v":"decimal-operations"},{"d":"MEDIUM","q":"Calculate 0.75 + 1.6 − 0.28.","o":["2.07","2.13","1.97","2.23"],"a":0,"e":"0.75 + 1.60 = 2.35; 2.35 − 0.28 = 2.07.","v":"decimal-operations"},{"d":"MEDIUM","q":"A ribbon is 5.5 m long. Pieces of 1.25 m and 0.8 m are cut off. How much remains?","o":["3.45 m","3.55 m","4.25 m","2.45 m"],"a":0,"e":"The total cut is 1.25 + 0.80 = 2.05 m; 5.50 − 2.05 = 3.45 m.","v":"decimal-operations"},{"d":"MEDIUM","q":"Calculate 2.5 × 1.2.","o":["3.0","30","0.30","2.7"],"a":0,"e":"25 × 12 = 300; two decimal places give 3.00 = 3.0.","v":"decimal-operations"},{"d":"MEDIUM","q":"Calculate 6.72 ÷ 1.2.","o":["0.56","5.6","56","8.064"],"a":1,"e":"Multiply both values by 10: 67.2 ÷ 12 = 5.6.","v":"decimal-operations"},{"d":"MEDIUM","q":"Which decimal is equivalent to 7/8?","o":["0.78","0.875","0.87","0.785"],"a":1,"e":"7 ÷ 8 = 0.875.","v":"decimal-operations"},{"d":"MEDIUM","q":"A notebook costs ₹18.75. What is the cost of 4 notebooks?","o":["₹75.00","₹72.75","₹74.00","₹76.25"],"a":0,"e":"18.75 × 4 = 75.00 rupees.","v":"decimal-operations"},{"d":"HARD","q":"Calculate 4.8 ÷ 0.06.","o":["8","0.8","80","800"],"a":2,"e":"Multiply both values by 100: 480 ÷ 6 = 80.","v":"decimal-operations"},{"d":"HARD","q":"Calculate (2.4 + 1.6) × 0.25.","o":["1","4","0.1","10"],"a":0,"e":"First 2.4 + 1.6 = 4; then 4 × 0.25 = 1.","v":"decimal-operations"},{"d":"HARD","q":"Calculate 7.5 − 2.4 ÷ 0.6.","o":["8.5","3.5","5.1","0.85"],"a":1,"e":"Perform division first: 2.4 ÷ 0.6 = 4; then 7.5 − 4 = 3.5.","v":"decimal-operations"},{"d":"HARD","q":"A car travels 12.6 km using 0.9 L of fuel. At the same rate, how far does it travel per litre?","o":["14 km/L","11.34 km/L","13.5 km/L","1.4 km/L"],"a":0,"e":"Distance per litre is 12.6 ÷ 0.9 = 126 ÷ 9 = 14 km/L.","v":"decimal-operations"},{"d":"HARD","q":"Calculate 0.125 × 0.8.","o":["1.0","0.01","0.1","0.001"],"a":2,"e":"125 × 8 = 1000; four decimal places give 0.1000 = 0.1.","v":"decimal-operations"},{"d":"HARD","q":"Calculate 15.75 ÷ 2.5.","o":["6.3","63","0.63","5.3"],"a":0,"e":"Multiply both numbers by 10: 157.5 ÷ 25 = 6.3.","v":"decimal-operations"},{"d":"HARD","q":"A jug contains 2.4 L of juice. It is poured equally into 6 glasses. How much juice is in each glass?","o":["0.04 L","0.4 L","4 L","1.4 L"],"a":1,"e":"2.4 ÷ 6 = 0.4 litre per glass.","v":"decimal-operations"},{"d":"HARD","q":"Calculate 3.06 + 0.708.","o":["3.138","3.768","3.778","3.78"],"a":1,"e":"Align decimal places: 3.060 + 0.708 = 3.768.","v":"decimal-operations"},{"d":"HARD","q":"A number multiplied by 0.4 gives 3.2. What is the number?","o":["1.28","8","0.8","12.8"],"a":1,"e":"Divide 3.2 by 0.4: 32 ÷ 4 = 8.","v":"decimal-operations"},{"d":"HARD","q":"Calculate 5.04 ÷ 0.12.","o":["4.2","42","0.42","420"],"a":1,"e":"Multiply both numbers by 100: 504 ÷ 12 = 42.","v":"decimal-operations"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Multiply positive and negative integers</strong><small>Apply sign rules to integer products</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Solve multiplication word problems</strong><small>Reason with signs and products</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply ruler-and-compass reasoning</strong><small>Use accurate integer multiplication methods</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
