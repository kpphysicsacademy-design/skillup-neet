ce-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"If 4 notebooks cost ₹60, what do 7 notebooks cost at the same price each?","o":["₹90","₹100","₹105","₹120"],"a":2,"e":"Unit price = ₹60 ÷ 4 = ₹15. Seven notebooks cost 7 × ₹15 = ₹105.","v":"direct"},{"d":"BASIC","q":"A recipe uses 250 g of flour for 5 servings. How much flour is needed for 8 servings?","o":["300 g","350 g","400 g","450 g"],"a":2,"e":"Flour per serving = 250 ÷ 5 = 50 g. For 8 servings, use 8 × 50 = 400 g.","v":"direct"},{"d":"BASIC","q":"A car travels 120 km in 2 hours at a constant speed. How far will it travel in 5 hours?","o":["240 km","280 km","300 km","360 km"],"a":2,"e":"Speed = 120 ÷ 2 = 60 km/h. In 5 hours, distance = 60 × 5 = 300 km.","v":"direct"},{"d":"BASIC","q":"If 6 pens cost ₹72, what is the cost of 10 pens at the same rate?","o":["₹100","₹110","₹120","₹132"],"a":2,"e":"Each pen costs ₹72 ÷ 6 = ₹12. Ten pens cost ₹120.","v":"direct"},{"d":"BASIC","q":"A printer prints 90 pages in 3 minutes. How many pages can it print in 8 minutes at the same rate?","o":["180","210","240","270"],"a":2,"e":"Rate = 90 ÷ 3 = 30 pages per minute. In 8 minutes it prints 240 pages.","v":"direct"},{"d":"BASIC","q":"Four identical taps fill a container in 18 minutes. How long would 6 taps take, assuming equal constant flow?","o":["9 min","12 min","15 min","27 min"],"a":1,"e":"Tap count × time stays constant: 4 × 18 = 6 × t, so t = 12 minutes.","v":"inverse"},{"d":"BASIC","q":"Eight workers finish a job in 15 days. How many days would 12 workers take at the same work rate?","o":["8 days","10 days","12 days","22.5 days"],"a":1,"e":"Workers × days = 8 × 15 = 120. With 12 workers, time = 120 ÷ 12 = 10 days.","v":"inverse"},{"d":"BASIC","q":"A journey takes 4 hours at 60 km/h. How long will the same journey take at 80 km/h?","o":["2 h","3 h","4 h","5 h"],"a":1,"e":"Distance = 60 × 4 = 240 km. At 80 km/h, time = 240 ÷ 80 = 3 hours.","v":"inverse"},{"d":"BASIC","q":"Twelve identical machines complete a batch in 5 hours. How long would 4 machines take?","o":["10 h","12 h","15 h","20 h"],"a":2,"e":"Machines × time = 12 × 5 = 60 machine-hours. With 4 machines, time = 15 hours.","v":"inverse"},{"d":"BASIC","q":"A fixed amount of food feeds 6 people for 14 days. For how many days will it feed 12 people?","o":["5 days","7 days","14 days","28 days"],"a":1,"e":"People × days = 6 × 14 = 84 person-days. For 12 people, it lasts 84 ÷ 12 = 7 days.","v":"inverse"},{"d":"MEDIUM","q":"If 2.5 kg of apples cost ₹200, what will 4.5 kg cost at the same price per kilogram?","o":["₹320","₹340","₹360","₹400"],"a":2,"e":"Price per kg = ₹200 ÷ 2.5 = ₹80. Cost for 4.5 kg = ₹80 × 4.5 = ₹360.","v":"direct"},{"d":"MEDIUM","q":"A map scale is 1 cm : 8 km. What actual distance is represented by 6.5 cm?","o":["42 km","48 km","52 km","56 km"],"a":2,"e":"Each centimetre represents 8 km, so 6.5 cm represents 6.5 × 8 = 52 km.","v":"direct"},{"d":"MEDIUM","q":"A worker earns ₹840 for 7 hours. At the same hourly rate, how much will the worker earn for 11 hours?","o":["₹1,200","₹1,260","₹1,320","₹1,440"],"a":2,"e":"Hourly pay = ₹840 ÷ 7 = ₹120. For 11 hours, pay = ₹1,320.","v":"direct"},{"d":"MEDIUM","q":"Five litres of paint cover 42 m². How much area can 8 litres cover at the same coverage rate?","o":["56.2 m²","64.8 m²","67.2 m²","72 m²"],"a":2,"e":"Coverage per litre = 42 ÷ 5 = 8.4 m². Eight litres cover 8 × 8.4 = 67.2 m².","v":"direct"},{"d":"MEDIUM","q":"A machine makes 156 parts in 6 hours. How many parts will 9 identical machines make in 4 hours at the same rate?","o":["312","360","390","468"],"a":2,"e":"One machine makes 156 ÷ 6 = 26 parts/hour. Nine machines for 4 hours make 26 × 9 × 4 = 936 parts.","v":"direct"},{"d":"MEDIUM","q":"Six workers can finish a task in 20 days. How many workers are needed to finish it in 8 days?","o":["12","15","18","24"],"a":1,"e":"Total work = 6 × 20 = 120 worker-days. To finish in 8 days, 120 ÷ 8 = 15 workers are needed.","v":"inverse"},{"d":"MEDIUM","q":"A car takes 3.5 hours to cover a fixed route at 72 km/h. How long will it take at 84 km/h?","o":["2.5 h","3 h","3.25 h","4 h"],"a":1,"e":"Distance = 72 × 3.5 = 252 km. Time at 84 km/h = 252 ÷ 84 = 3 hours.","v":"inverse"},{"d":"MEDIUM","q":"Nine pumps empty a pool in 16 hours. How long would 12 identical pumps take?","o":["9 h","10 h","12 h","14 h"],"a":2,"e":"Pumps × time = 9 × 16 = 144 pump-hours. With 12 pumps, time = 144 ÷ 12 = 12 hours.","v":"inverse"},{"d":"MEDIUM","q":"A supply lasts 18 days for 20 students. If 30 students use it equally, how long will it last?","o":["10 days","12 days","15 days","27 days"],"a":1,"e":"Students × days = 20 × 18 = 360 student-days. For 30 students, it lasts 360 ÷ 30 = 12 days.","v":"inverse"},{"d":"MEDIUM","q":"Four printers finish a job in 27 minutes. How long would 9 identical printers take?","o":["9 min","12 min","15 min","18 min"],"a":1,"e":"Printers × time = 4 × 27 = 108 printer-minutes. With 9 printers, time = 12 minutes.","v":"inverse"},{"d":"HARD","q":"A delivery van uses 18 litres of fuel to travel 240 km. How much fuel is needed for 460 km under the same conditions?","o":["30.5 L","32.5 L","34.5 L","36 L"],"a":2,"e":"Fuel per kilometre = 18 ÷ 240 = 0.075 L/km. For 460 km, fuel = 0.075 × 460 = 34.5 L. Correct option: C.","v":"direct"},{"d":"HARD","q":"A blueprint uses 3.2 cm to represent 12 m. How many centimetres represent 27 m at the same scale?","o":["6.4 cm","7.2 cm","8 cm","9.6 cm"],"a":1,"e":"Scale length per metre = 3.2 ÷ 12 cm. For 27 m: 3.2 × 27 ÷ 12 = 7.2 cm.","v":"direct"},{"d":"HARD","q":"A factory packs 1,260 items in 7 hours. At the same rate, how many hours are needed to pack 2,340 items?","o":["11 h","12 h","13 h","14 h"],"a":2,"e":"Rate = 1,260 ÷ 7 = 180 items/hour. Time = 2,340 ÷ 180 = 13 hours.","v":"direct"},{"d":"HARD","q":"A recipe for 12 people uses 1.8 kg of rice. How much rice is needed for 35 people?","o":["4.8 kg","5.0 kg","5.25 kg","5.4 kg"],"a":2,"e":"Rice per person = 1.8 ÷ 12 = 0.15 kg. For 35 people, 35 × 0.15 = 5.25 kg.","v":"direct"},{"d":"HARD","q":"Fourteen workers complete a project in 18 days. After 6 days, 7 workers leave. How many more days will the remaining workers need, assuming equal work rates?","o":["18 days","20 days","24 days","30 days"],"a":2,"e":"Total work = 14 × 18 = 252 worker-days. Work done in 6 days = 14 × 6 = 84; remaining = 168 worker-days. Seven workers need 168 ÷ 7 = 24 more days.","v":"inverse"},{"d":"HARD","q":"A journey takes 5 hours at 64 km/h. If speed increases to 80 km/h, how many minutes are saved?","o":["45 min","60 min","75 min","90 min"],"a":1,"e":"Distance = 64 × 5 = 320 km. New time = 320 ÷ 80 = 4 h, so 60 minutes are saved. Correct option: B.","v":"inverse"},{"d":"HARD","q":"Ten machines make 3,600 units in 6 hours. How many units will 15 such machines make in 8 hours?","o":["5,400","6,000","7,200","8,400"],"a":2,"e":"One machine makes 3,600 ÷ (10 × 6) = 60 units/hour. Output = 15 × 8 × 60 = 7,200 units.","v":"direct"},{"d":"HARD","q":"A team of 16 workers planned to finish a job in 15 days. After 5 days, the remaining work is done by 20 workers. How many additional days are required?","o":["6 days","8 days","10 days","12 days"],"a":1,"e":"Total work = 16 × 15 = 240 worker-days. In 5 days, 80 worker-days are done; 160 remain. With 20 workers, 160 ÷ 20 = 8 additional days.","v":"inverse"},{"d":"HARD","q":"If 7 identical pumps fill a reservoir in 12 hours, how long will 4 pumps take?","o":["18 h","19 h","21 h","24 h"],"a":2,"e":"Pumps × time = 7 × 12 = 84 pump-hours. For 4 pumps, time = 84 ÷ 4 = 21 hours.","v":"inverse"},{"d":"HARD","q":"A print shop charges ₹540 for 36 identical flyers. At the same rate, what is the cost of 250 flyers?","o":["₹3,250","₹3,500","₹3,750","₹4,000"],"a":2,"e":"Each flyer costs ₹540 ÷ 36 = ₹15. For 250 flyers, cost = ₹3,750.","v":"direct"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand direct proportion and constant ratios</strong><small>Find unit rates and proportional values</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Solve ratio-based word problems</strong><small>Scale quantities at a constant rate</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve direct proportion problems</strong><small>Apply direct proportion accurately</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
