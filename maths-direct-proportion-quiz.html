(function(){'use strict';const questions=[{"d":"BASIC","q":"If 3 notebooks cost ₹45, what is the cost of 5 notebooks at the same rate?","o":["₹60","₹65","₹75","₹90"],"a":2,"e":"Cost is directly proportional to quantity: ₹45 ÷ 3 = ₹15 each; 5 cost ₹75.","v":"direct-proportion"},{"d":"BASIC","q":"If 4 kg of rice costs ₹240, how much do 7 kg cost?","o":["₹360","₹400","₹420","₹480"],"a":2,"e":"Unit price = ₹240 ÷ 4 = ₹60/kg; 7 kg costs ₹420.","v":"direct-proportion"},{"d":"BASIC","q":"A car travels 150 km in 3 hours at constant speed. How far in 5 hours?","o":["200 km","225 km","250 km","300 km"],"a":2,"e":"Speed = 150 ÷ 3 = 50 km/h; in 5 hours it travels 250 km.","v":"direct-proportion"},{"d":"BASIC","q":"If 6 pens cost ₹54, what do 10 pens cost?","o":["₹80","₹90","₹96","₹100"],"a":1,"e":"Each pen costs ₹9, so 10 pens cost ₹90.","v":"direct-proportion"},{"d":"BASIC","q":"Which pair represents direct proportion?","o":["More workers, same task time decreases","More items at fixed price per item, greater total cost","Greater speed for fixed distance, more travel time","More taps, less time to fill a tank"],"a":1,"e":"At a fixed unit price, total cost increases in the same ratio as the number of items.","v":"direct-proportion"},{"d":"BASIC","q":"If y is directly proportional to x and y = 20 when x = 4, find y when x = 7.","o":["28","30","35","40"],"a":2,"e":"y/x = 20/4 = 5, so y = 5 × 7 = 35.","v":"direct-proportion"},{"d":"BASIC","q":"A recipe for 4 people uses 300 g of flour. How much is needed for 10 people?","o":["600 g","700 g","750 g","800 g"],"a":2,"e":"Scale by 10/4: 300 × 2.5 = 750 g.","v":"direct-proportion"},{"d":"BASIC","q":"A photocopier prints 120 pages in 4 minutes. How many pages in 9 minutes at the same rate?","o":["240","260","270","300"],"a":2,"e":"Rate = 120/4 = 30 pages/min; 30 × 9 = 270.","v":"direct-proportion"},{"d":"BASIC","q":"If 8 metres of cloth cost ₹560, find the cost of 3 metres.","o":["₹180","₹200","₹210","₹240"],"a":2,"e":"Cost per metre = ₹560/8 = ₹70; 3 metres cost ₹210.","v":"direct-proportion"},{"d":"BASIC","q":"If 5 identical toys cost ₹375, what is the cost of 8 toys?","o":["₹500","₹550","₹600","₹625"],"a":2,"e":"One toy costs ₹75, so 8 cost ₹600.","v":"direct-proportion"},{"d":"MEDIUM","q":"A map uses 1 cm for 5 km. What actual distance does 7 cm represent?","o":["25 km","30 km","35 km","40 km"],"a":2,"e":"At 5 km per cm, 7 cm represents 7 × 5 = 35 km.","v":"direct-proportion"},{"d":"MEDIUM","q":"If 12 oranges cost ₹96, how much do 15 oranges cost?","o":["₹100","₹110","₹120","₹125"],"a":2,"e":"Each orange costs ₹8; 15 cost ₹120.","v":"direct-proportion"},{"d":"MEDIUM","q":"A machine makes 84 parts in 7 minutes. How many parts in 12 minutes at the same rate?","o":["120","132","144","156"],"a":2,"e":"The rate is 84/7 = 12 parts/min; in 12 minutes it makes 144.","v":"direct-proportion"},{"d":"MEDIUM","q":"If 2.5 kg of apples costs ₹200, what does 4 kg cost?","o":["₹280","₹300","₹320","₹350"],"a":2,"e":"Price per kg = ₹200/2.5 = ₹80; 4 kg costs ₹320.","v":"direct-proportion"},{"d":"MEDIUM","q":"If x and y are directly proportional, which ratio stays constant?","o":["x + y","x − y","y/x","xy"],"a":2,"e":"For direct proportion, y = kx, so y/x = k is constant.","v":"direct-proportion"},{"d":"MEDIUM","q":"If y = kx and y = 18 when x = 6, find k.","o":["2","3","6","12"],"a":1,"e":"k = y/x = 18/6 = 3.","v":"direct-proportion"},{"d":"MEDIUM","q":"A cyclist covers 36 km in 2 hours at constant speed. How far in 7 hours?","o":["108 km","112 km","126 km","144 km"],"a":2,"e":"Speed = 18 km/h; distance in 7 hours = 126 km.","v":"direct-proportion"},{"d":"MEDIUM","q":"If 9 identical bottles hold 13.5 litres altogether, how much do 4 bottles hold?","o":["4.5 L","5 L","6 L","7.5 L"],"a":2,"e":"Each bottle holds 13.5/9 = 1.5 L; 4 hold 6 L.","v":"direct-proportion"},{"d":"MEDIUM","q":"A worker earns ₹720 for 8 hours at a fixed hourly rate. How much for 5 hours?","o":["₹400","₹450","₹480","₹500"],"a":1,"e":"Hourly rate = ₹720/8 = ₹90; 5 hours pay ₹450. Correct option: B.","v":"direct-proportion"},{"d":"MEDIUM","q":"If 15 metres of wire weighs 6 kg, what does 25 metres weigh at uniform thickness?","o":["8 kg","9 kg","10 kg","12 kg"],"a":2,"e":"Weight per metre = 6/15 = 0.4 kg; 25 m weighs 10 kg.","v":"direct-proportion"},{"d":"HARD","q":"A printer uses 24 ml of ink for 600 pages. How much ink for 1500 pages at the same rate?","o":["48 ml","54 ml","60 ml","72 ml"],"a":2,"e":"1500/600 = 2.5; ink needed = 24 × 2.5 = 60 ml.","v":"direct-proportion"},{"d":"HARD","q":"If 7 tickets cost ₹1,050, how much do 12 tickets cost?","o":["₹1,500","₹1,650","₹1,800","₹2,000"],"a":2,"e":"Each ticket costs ₹150; 12 tickets cost ₹1,800.","v":"direct-proportion"},{"d":"HARD","q":"A train travels 280 km in 4 hours at constant speed. How far in 6.5 hours?","o":["420 km","435 km","455 km","480 km"],"a":2,"e":"Speed = 70 km/h; 70 × 6.5 = 455 km.","v":"direct-proportion"},{"d":"HARD","q":"If 3 litres of paint cover 24 m², how much area do 8 litres cover?","o":["48 m²","56 m²","64 m²","72 m²"],"a":2,"e":"Coverage = 24/3 = 8 m² per litre; 8 litres cover 64 m².","v":"direct-proportion"},{"d":"HARD","q":"If y varies directly as x and y = 42 when x = 14, find y when x = 9.","o":["18","21","27","36"],"a":2,"e":"k = 42/14 = 3, so y = 3 × 9 = 27.","v":"direct-proportion"},{"d":"HARD","q":"A 2.4 m ribbon costs ₹36. What is the cost of 5 m?","o":["₹60","₹70","₹75","₹90"],"a":2,"e":"Cost per metre = ₹36/2.4 = ₹15; 5 m costs ₹75.","v":"direct-proportion"},{"d":"HARD","q":"If 18 identical tiles cover 2.7 m², how much area do 30 tiles cover?","o":["3.6 m²","4.2 m²","4.5 m²","5.4 m²"],"a":2,"e":"Area per tile = 2.7/18 = 0.15 m²; 30 cover 4.5 m².","v":"direct-proportion"},{"d":"HARD","q":"A tap fills 15 litres in 3 minutes at a steady rate. How much in 11 minutes?","o":["45 L","50 L","55 L","60 L"],"a":2,"e":"Rate = 5 L/min; in 11 minutes it fills 55 L.","v":"direct-proportion"},{"d":"HARD","q":"If 4 packets contain 28 biscuits, how many biscuits are in 9 packets of the same size?","o":["56","63","72","81"],"a":1,"e":"Each packet has 7 biscuits; 9 packets have 63.","v":"direct-proportion"},{"d":"HARD","q":"A quantity y is directly proportional to x. If x doubles, what happens to y?","o":["It halves","It stays the same","It doubles","It becomes four times"],"a":2,"e":"Since y = kx, doubling x doubles y.","v":"direct-proportion"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand direct proportion and constant ratios</strong><small>Find unit rates and proportional values</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Solve ratio-based word problems</strong><small>Scale quantities at a constant rate</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve direct proportion problems</strong><small>Apply direct proportion accurately</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
