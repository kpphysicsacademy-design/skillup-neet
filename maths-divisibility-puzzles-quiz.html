ivisible by 9.","o":["0","3","6","9"],"a":0,"e":"3 + 0 + 6 = 9, so the smallest digit is 0."},{"d":"HARD","q":"A number 5□2 is divisible by 9. Which digit replaces □?","o":["0","1","2","3"],"a":2,"e":"5 + 2 + 2 = 9, so □ = 2."},{"d":"HARD","q":"Which digit can replace □ to make 24□ divisible by both 3 and 4?","o":["4","2","4","6"],"a":2,"e":"For divisibility by 4, □ is 0, 4 or 8; divisibility by 3 requires □ = 4."},{"d":"HARD","q":"A four-digit number 3□72 is divisible by 9. What digit belongs in the box?","o":["4","5","6","7"],"a":2,"e":"3 + 6 + 7 + 2 = 18, divisible by 9, so □ = 6."},{"d":"HARD","q":"Which is the greatest three-digit number divisible by 8?","o":["992","984","996","998"],"a":0,"e":"992 ÷ 8 = 124, so 992 is divisible by 8 and is the greatest listed valid option."},{"d":"HARD","q":"Which is the smallest positive number that is divisible by both 6 and 8?","o":["12","18","24","48"],"a":2,"e":"The least common multiple of 6 and 8 is 24."},{"d":"HARD","q":"A number 4□5 is divisible by 3 and 5. Which digit could replace □?","o":["0","1","2","4"],"a":0,"e":"It already ends in 5. For divisibility by 3, 4 + □ + 5 must be divisible by 3; among these options, 0 gives 9."},{"d":"HARD","q":"Which digit makes 7□0 divisible by 9?","o":["0","1","2","3"],"a":2,"e":"7 + 2 + 0 = 9, so the missing digit is 2."},{"d":"HARD","q":"A number is divisible by 12. Which pair of tests guarantees divisibility by 12?","o":["Divisible by 2 and 6","Divisible by 3 and 4","Divisible by 2 and 9","Divisible by 5 and 6"],"a":1,"e":"Since 12 = 3 × 4 and 3 and 4 are coprime, divisibility by both 3 and 4 guarantees divisibility by 12."},{"d":"HARD","q":"Which number leaves remainder 0 when divided by both 4 and 9?","o":["126","144","150","162"],"a":1,"e":"144 is divisible by 4 (last two digits 44) and by 9 (digit sum 9)."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role=
