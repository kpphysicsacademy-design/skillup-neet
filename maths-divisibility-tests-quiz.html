</head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Divisibility Tests</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Divisibility Tests skills"><div class="skill-title">🎯 Divisibility Tests Skills</div><div class="skill-list"><div class="skill-item">Apply divisibility rules</div><div class="skill-item">Find common factors and multiples</div><div class="skill-item">Apply factors and multiples to word problems</div></div></section></div><script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Which number is divisible by 2?","o":["135","246","351","475"],"a":1,"e":"A number is divisible by 2 when its last digit is even. 246 ends in 6.","v":"lastdigit"},{"d":"BASIC","q":"Which number is divisible by 5?","o":["123","242","365","418"],"a":2,"e":"Numbers ending in 0 or 5 are divisible by 5. 365 ends in 5.","v":"lastdigit"},{"d":"BASIC","q":"Which number is divisible by 10?","o":["145","230","327","415"],"a":1,"e":"A number is divisible by 10 when its last digit is 0.","v":"lastdigit"},{"d":"BASIC","q":"Is 123 divisible by 3?","o":["Yes, because it is odd","Yes, because 1 + 2 + 3 = 6","No, because it ends in 3","No, because it has three digits"],"a":1,"e":"Add the digits: 1 + 2 + 3 = 6. Since 6 is divisible by 3, 123 is divisible by 3.","v":"digitsum"},{"d":"BASIC","q":"Which number is divisible by 9?","o":["124","234","352","415"],"a":1,"e":"2 + 3 + 4 = 9, so 234 is divisible by 9.","v":"digitsum"},{"d":"BASIC","q":"Which number is divisible by 4?","o":["132","145","218","326"],"a":0,"e":"A number is divisible by 4 when its last two digits form a number divisible by 4. 32 is divisible by 4.","v":"lasttwo"},{"d":"BASIC","q":"Which number is divisible by 6?","o":["25","33","42","55"],"a":2,"e":"A number is divisible by 6 if it is divisible by both 2 and 3. 42 is even and 4 + 2 = 6.","v":"combined"},{"d":"BASIC","q":"Which number is divisible by 3?","o":["124","221","312","401"],"a":2,"e":"3 + 1 + 2 = 6, and 6 is divisible by 3.","v":"digitsum"},{"d":"BASIC","q":"Which number is divisible by 8?","o":["216","222","234","250"],"a":0,"e":"216 ÷ 8 = 27 exactly.","v":"lastthree"},{"d":"BASIC","q":"What is the divisibility rule for 2?","o":["Digit sum is even","Last digit is 0, 2, 4, 6 or 8","Last digit is 5","Last two digits divide by 3"],"a":1,"e":"An integer is divisible by 2 when its units digit is even.","v":"lastdigit"},{"d":"MEDIUM","q":"Which number is divisible by both 3 and 5?","o":["125","135","142","155"],"a":1,"e":"135 ends in 5 and its digit sum is 1 + 3 + 5 = 9, divisible by 3.","v":"combined"},{"d":"MEDIUM","q":"Which number is divisible by 9?","o":["729","734","742","751"],"a":0,"e":"7 + 2 + 9 = 18, and 18 is divisible by 9.","v":"digitsum"},{"d":"MEDIUM","q":"Which number is divisible by 4?","o":["1,214","1,328","1,346","1,358"],"a":1,"e":"The last two digits of 1,328 are 28, and 28 is divisible by 4.","v":"lasttwo"},{"d":"MEDIUM","q":"Which number is divisible by 8?","o":["1,234","1,248","1,254","1,262"],"a":1,"e":"The last three digits, 248, are divisible by 8 because 248 ÷ 8 = 31.","v":"lastthree"},{"d":"MEDIUM","q":"Which number is divisible by 6?","o":["124","222","325","437"],"a":1,"e":"222 is even and its digit sum is 6, so it is divisible by both 2 and 3.","v":"combined"},{"d":"MEDIUM","q":"Which number is divisible by 3 but NOT by 9?","o":["126","123","144","207"],"a":1,"e":"1 + 2 + 3 = 6: divisible by 3 but not by 9.","v":"digitsum"},{"d":"MEDIUM","q":"Which number is divisible by 11?","o":["121","124","133","145"],"a":0,"e":"For 121, the alternating digit sums differ by (1 + 1) − 2 = 0, a multiple of 11.","v":"eleven"},{"d":"MEDIUM","q":"A number ends in 0. Which statement is always true?","o":["It is divisible by 2 and 5","It is divisible only by 10","It is odd","It is not divisible by 5"],"a":0,"e":"Every whole number ending in 0 is divisible by 2, 5 and 10.","v":"lastdigit"},{"d":"MEDIUM","q":"Which number is divisible by 3 and 4?","o":["132","134","142","146"],"a":0,"e":"132 has digit sum 6 (divisible by 3) and last two digits 32 (divisible by 4).","v":"combined"},{"d":"MEDIUM","q":"Which number is NOT divisible by 5?","o":["1,025","2,140","3,275","4,282"],"a":3,"e":"4,282 ends in 2, not 0 or 5, so it is not divisible by 5.","v":"lastdigit"},{"d":"HARD","q":"What digit can replace □ in 47□ to make the number divisible by 3?","o":["1 only","2 only","4 only","Any of 1, 4 or 7"],"a":3,"e":"The digit sum is 11 + □. For digits 1, 4 or 7, the sum is 12, 15 or 18, all divisible by 3.","v":"digitsum"},{"d":"HARD","q":"Which number is divisible by both 8 and 3?","o":["1,024","1,032","1,038","1,046"],"a":1,"e":"1,032 has last three digits 032 = 32, divisible by 8; digit sum 6, divisible by 3.","v":"combined"},{"d":"HARD","q":"Which number is divisible by 11?","o":["2,728","2,724","2,731","2,745"],"a":0,"e":"For 2,728, alternating sums are 2 + 2 = 4 and 7 + 8 = 15; difference 11, divisible by 11.","v":"eleven"},{"d":"HARD","q":"A four-digit number ends in 48. Which rule does this ending confirm?","o":["Divisibility by 3","Divisibility by 4","Divisibility by 5","Divisibility by 9"],"a":1,"e":"A number ending in 48 is divisible by 4 because 48 is divisible by 4.","v":"lasttwo"},{"d":"HARD","q":"Which number is divisible by 9 but NOT by 2?","o":["234","351","468","7290"],"a":1,"e":"3 + 5 + 1 = 9, so 351 is divisible by 9; it is odd, so not divisible by 2.","v":"combined"},{"d":"HARD","q":"Which digit makes 6□2 divisible by 9?","o":["1","2","4","5"],"a":0,"e":"The digit sum is 8 + □. Choosing 1 gives 9, which is divisible by 9.","v":"digitsum"},{"d":"HARD","q":"Which number is divisible by 8?","o":["3,114","3,120","3,126","3,134"],"a":1,"e":"The last three digits of 3,120 are 120, and 120 ÷ 8 = 15.","v":"lastthree"},{"d":"HARD","q":"A number is divisible by both 2 and 3. What must be true?","o":["It is divisible by 6","It is prime","It is odd","It must end in 0"],"a":0,"e":"A whole number divisible by both 2 and 3 is divisible by their product, 6.","v":"combined"},{"d":"HARD","q":"Which number is divisible by 3 and 5 but NOT by 2?","o":["270","315","420","510"],"a":1,"e":"315 ends in 5 and its digit sum is 9, but it is odd, so not divisible by 2.","v":"combined"},{"d":"HARD","q":"Which statement correctly describes the divisibility test for 11?","o":["Last digit must be 1","Digit sum must equal 11","Difference of alternating digit sums is 0 or a multiple of 11","Last two digits must be divisible by 11"],"a":2,"e":"A number is divisible by 11 when the difference between alternating digit sums is 0 or a multiple of 11.","v":"eleven"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');const visuals={
lastdigit:'<svg viewBox="0 0 300 100" role="img" aria-label="Check the last digit"><rect x="32" y="18" width="236" height="54" rx="10" fill="#91b7ff18" stroke="#91b7ff" stroke-width="2"/><text x="150" y="42" fill="#f2f5ff" text-anchor="middle">Check the units digit</text><text x="150" y="62" fill="#58d6a3" text-anchor="middle">0, 2, 4, 6, 8 → divisible by 2</text></svg>',
digitsum:'<svg viewBox="0 0 300 100" role="img" aria-label="Add the digits"><g>'+['1','2','3'].map((n,i)=>'<circle cx="'+(72+i*78)+'" cy="34" r="17" fill="#91b7ff22" stroke="#91b7ff"/><text x="'+(72+i*78)+'" y="40" fill="#f2f5ff" text-anchor="middle">'+n+'</text>').join('')+'</g><text x="150" y="78" fill="#58d6a3" text-anchor="middle">1 + 2 + 3 = 6</text></svg>',
lasttwo:'<svg viewBox="0 0 300 100" role="img" aria-label="Check the last two digits"><text x="150" y="28" fill="#f2f5ff" text-anchor="middle">Example: 1,328</text><rect x="115" y="38" width="70" height="34" rx="7" fill="#58d6a322" stroke="#58d6a3" stroke-width="2"/><text x="150" y="60" fill="#f2f5ff" text-anchor="middle">28</text><text x="150" y="91" fill="#f2f5ff" text-anchor="middle">28 ÷ 4 = 7</text></svg>',
lastthree:'<svg viewBox="0 0 300 100" role="img" aria-label="Check the last three digits"><text x="150" y="24" fill="#f2f5ff" text-anchor="middle">Example: 3,120</text><rect x="90" y="32" width="120" height="34" rx="7" fill="#58d6a322" stroke="#58d6a3" stroke-width="2"/><text x="150" y="54" fill="#f2f5ff" text-anchor="middle">120</text><text x="150" y="88" fill="#f2f5ff" text-anchor="middle">120 ÷ 8 = 15</text></svg>',
combined:'<svg viewBox="0 0 300 100" role="img" aria-label="Combine divisibility tests"><rect x="18" y="18" width="76" height="32" rx="7" stroke="#91b7ff" fill="#91b7ff18"/><text x="56" y="39" fill="#f2f5ff" text-anchor="middle">Even?</text><text x="108" y="39" fill="#58d6a3" text-anchor="middle">AND</text><rect x="125" y="18" width="76" height="32" rx="7" stroke="#91b7ff" fill="#91b7ff18"/><text x="163" y="39" fill="#f2f5ff" text-anchor="middle">÷ 3?</text><path d="M56 54 V68 H244 V54" fill="none" stroke="#58d6a3" stroke-width="2"/><text x="150" y="89" fill="#f2f5ff" text-anchor="middle">Both true → divisible by 6</text></svg>',
eleven:'<svg viewBox="0 0 300 100" role="img" aria-label="Alternating digit sums test for 11"><text x="150" y="24" fill="#f2f5ff" text-anchor="middle">Example: 2,728</text><rect x="32" y="34" width="236" height="30" rx="7" fill="#91b7ff18" stroke="#91b7ff"/><text x="150" y="54" fill="#f2f5ff" text-anchor="middle">(2 + 2) − (7 + 8) = −11</text><text x="150" y="87" fill="#58d6a3" text-anchor="middle">Multiple of 11 ✓</text></svg>'
};function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'<div class="diagram">'+visuals[q.v]+'</div>':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const skills=[['Apply divisibility tests for 2, 5 and 10',8],['Test divisibility by 3, 9 and 11',18],['Use divisibility rules in number problems',24]];$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">📏</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+skills.map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script>
