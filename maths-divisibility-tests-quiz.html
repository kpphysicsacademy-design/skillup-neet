<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Divisibility tests</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Which number is divisible by 2?","o":["135","248","351","467"],"a":1,"e":"A number ending in 0, 2, 4, 6 or 8 is divisible by 2."},{"d":"BASIC","q":"Which number is divisible by 5?","o":["42","63","75","88"],"a":2,"e":"A number divisible by 5 ends in 0 or 5."},{"d":"BASIC","q":"Which number is divisible by 10?","o":["125","230","345","456"],"a":1,"e":"A number divisible by 10 ends in 0."},{"d":"BASIC","q":"Which number is divisible by 3?","o":["124","221","312","401"],"a":2,"e":"The digit sum of 312 is 6, divisible by 3."},{"d":"BASIC","q":"Which number is divisible by 9?","o":["234","235","236","238"],"a":0,"e":"The digit sum of 234 is 9, divisible by 9."},{"d":"BASIC","q":"Which number is divisible by both 2 and 5?","o":["15","22","40","33"],"a":2,"e":"40 ends in 0, so it is divisible by both 2 and 5."},{"d":"BASIC","q":"Which number is divisible by 4?","o":["122","316","530","714"],"a":1,"e":"The last two digits of 316 form 16, divisible by 4."},{"d":"BASIC","q":"The digit-sum test is used to check divisibility by which number?","o":["2","3","5","10"],"a":1,"e":"A number is divisible by 3 when its digit sum is divisible by 3."},{"d":"BASIC","q":"Which number is divisible by 6?","o":["21","25","32","42"],"a":3,"e":"42 is divisible by both 2 and 3."},{"d":"BASIC","q":"Which number is divisible by 8?","o":["312","314","318","322"],"a":0,"e":"312 ÷ 8 = 39 exactly."},{"d":"MEDIUM","q":"Which number is divisible by 11?","o":["121","123","125","127"],"a":0,"e":"121 = 11 × 11."},{"d":"MEDIUM","q":"Which number is divisible by 9?","o":["4,321","4,320","4,325","4,327"],"a":1,"e":"The digit sum of 4,320 is 9, so it is divisible by 9."},{"d":"MEDIUM","q":"Which number is divisible by 3?","o":["5,103","5,104","5,105","5,107"],"a":0,"e":"The digit sum of 5,103 is 9, so it is divisible by 3."},{"d":"MEDIUM","q":"Which number is divisible by 8?","o":["1,234","1,240","1,246","1,250"],"a":1,"e":"The last three digits 240 are divisible by 8."},{"d":"MEDIUM","q":"Which number is divisible by 6?","o":["124","132","145","155"],"a":1,"e":"132 is even and its digit sum is 6."},{"d":"MEDIUM","q":"Which number is divisible by 5 but not by 10?","o":["60","72","85","90"],"a":2,"e":"85 ends in 5, so it is divisible by 5 but not 10."},{"d":"MEDIUM","q":"Which number is divisible by 11?","o":["242","243","245","247"],"a":0,"e":"242 = 11 × 22."},{"d":"MEDIUM","q":"Which number is divisible by both 3 and 5?","o":["125","132","145","150"],"a":3,"e":"150 ends in 0 and its digit sum is 6."},{"d":"MEDIUM","q":"Which number is divisible by 4?","o":["1,234","1,236","1,238","1,242"],"a":1,"e":"The last two digits 36 are divisible by 4."},{"d":"MEDIUM","q":"Which number is divisible by 8?","o":["1,016","1,018","1,022","1,026"],"a":0,"e":"1,016 ÷ 8 = 127."},{"d":"HARD","q":"Which digit can replace □ in 47□ so that the number is divisible by 3?","o":["0","1","2","3"],"a":1,"e":"The digit sum is 11 + □; only □ = 1 makes 12, divisible by 3."},{"d":"HARD","q":"Which digit can replace □ in 5□2 so that the number is divisible by 9?","o":["1","2","3","4"],"a":1,"e":"5 + 2 + 2 = 9, so the missing digit is 2."},{"d":"HARD","q":"Which number is divisible by both 8 and 3?","o":["1,024","1,032","1,036","1,040"],"a":1,"e":"1,032 is divisible by 8 and its digit sum is 6."},{"d":"HARD","q":"Which number is divisible by 11?","o":["1,331","1,332","1,334","1,336"],"a":0,"e":"1,331 = 11 × 121."},{"d":"HARD","q":"Which digit can replace □ in 63□ so the number is divisible by both 5 and 3?","o":["0","1","2","5"],"a":0,"e":"630 ends in 0 and its digit sum is 9."},{"d":"HARD","q":"Which number is divisible by 4 but not by 8?","o":["1,216","1,220","1,224","1,232"],"a":1,"e":"1,220 is divisible by 4, but 220 is not divisible by 8."},{"d":"HARD","q":"Which number is divisible by 9 but not by 2?","o":["729","738","744","756"],"a":0,"e":"729 has digit sum 18 and is odd."},{"d":"HARD","q":"Which digit can replace □ in 2□4 to make the number divisible by 3?","o":["1","3","4","6"],"a":1,"e":"With 3, the digit sum is 2 + 3 + 4 = 9."},{"d":"HARD","q":"A number is divisible by 2, 3 and 5. Which must it be divisible by?","o":["7","10","15","30"],"a":3,"e":"It must be divisible by the least common multiple of 2, 3 and 5: 30."},{"d":"HARD","q":"Which number is divisible by both 8 and 9?","o":["1,008","1,016","1,024","1,032"],"a":0,"e":"1,008 ÷ 8 = 126 and its digit sum is 9."}];let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🔢</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(index>=questions.length){restart();return;}act();});render();})();</script></body></html>
