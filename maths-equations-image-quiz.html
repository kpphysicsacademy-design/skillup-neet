<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261012-equations-no-images-duolingo-v2"><title>Equations Quiz | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
 .skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}.skills-result{margin-top:14px;text-align:left}.skills-result h3{margin:0 0 8px;font-size:1rem}.skills-result .skill-item{margin-top:7px}.skill-item.unlocked{border-color:var(--green);color:var(--green2);background:#174b42} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}.diagram .accent{stroke:#58d6a3}.diagram .blue{stroke:#91b7ff}.diagram .gold{stroke:#ffd27a} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Equations</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Equation Skills"><div class="skill-title">🎯 Equation Skills</div><div class="skill-list"><div class="skill-item">Translate words into equations</div><div class="skill-item">Solve one-step and multi-step equations</div><div class="skill-item">Model real-life problems</div></div></section></div>
<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Solve: x + 3 = 8","o":["3","5","8","11"],"a":1,"e":"Subtract 3 from both sides: x = 8 − 3 = 5.","v":"balance"},{"d":"BASIC","q":"Solve: x − 4 = 6","o":["2","10","−2","24"],"a":1,"e":"Add 4 to both sides: x = 6 + 4 = 10.","v":"blocks"},{"d":"BASIC","q":"Solve: 3x = 15","o":["3","5","12","45"],"a":1,"e":"Divide both sides by 3: x = 15 ÷ 3 = 5.","v":"bars"},{"d":"BASIC","q":"Solve: x ÷ 2 = 7","o":["3.5","9","14","5"],"a":2,"e":"Multiply both sides by 2: x = 14.","v":"balance"},{"d":"BASIC","q":"Which equation matches: a number x increased by 6 gives 13?","o":["x − 6 = 13","6x = 13","x + 6 = 13","x ÷ 6 = 13"],"a":2,"e":"Increased by 6 means add 6, so x + 6 = 13.","v":"picture"},{"d":"BASIC","q":"Solve: x + 9 = 12","o":["2","3","9","21"],"a":1,"e":"Subtract 9 from both sides: x = 3.","v":"balance"},{"d":"BASIC","q":"Solve: x − 7 = 2","o":["−5","5","9","14"],"a":2,"e":"Add 7 to both sides: x = 9.","v":"blocks"},{"d":"BASIC","q":"Solve: 4x = 20","o":["4","5","16","24"],"a":1,"e":"Divide both sides by 4: x = 5.","v":"bars"},{"d":"BASIC","q":"Solve: x ÷ 5 = 3","o":["8","15","2","10"],"a":1,"e":"Multiply both sides by 5: x = 15.","v":"balance"},{"d":"BASIC","q":"A mystery number plus 2 equals 10. Which is the number?","o":["6","8","10","12"],"a":1,"e":"The number is 10 − 2 = 8.","v":"picture"},{"d":"MEDIUM","q":"Solve: 2x + 3 = 11","o":["3","4","7","14"],"a":1,"e":"Subtract 3: 2x = 8; divide by 2: x = 4.","v":"balance"},{"d":"MEDIUM","q":"Solve: 5x − 4 = 21","o":["4","5","17","25"],"a":1,"e":"Add 4: 5x = 25; divide by 5: x = 5.","v":"blocks"},{"d":"MEDIUM","q":"Solve: 3(x + 2) = 21","o":["5","7","9","19"],"a":0,"e":"Divide by 3: x + 2 = 7; subtract 2: x = 5.","v":"bars"},{"d":"MEDIUM","q":"Solve: x/3 + 2 = 6","o":["4","8","12","18"],"a":2,"e":"Subtract 2: x/3 = 4; multiply by 3: x = 12.","v":"balance"},{"d":"MEDIUM","q":"A number doubled and then increased by 5 gives 17. Find the number.","o":["5","6","11","22"],"a":1,"e":"Let x be the number: 2x + 5 = 17, so 2x = 12 and x = 6.","v":"picture"},{"d":"MEDIUM","q":"Solve: 4x + 1 = 2x + 9","o":["2","4","5","8"],"a":1,"e":"Subtract 2x and 1: 2x = 8, so x = 4.","v":"bars"},{"d":"MEDIUM","q":"Solve: 7 − x = 2","o":["−5","5","9","−9"],"a":1,"e":"7 − x = 2 gives −x = −5, so x = 5.","v":"balance"},{"d":"MEDIUM","q":"Solve: 2(x − 3) = 10","o":["2","5","8","13"],"a":2,"e":"Divide by 2: x − 3 = 5; add 3: x = 8.","v":"blocks"},{"d":"MEDIUM","q":"If 3 identical boxes and 2 loose counters total 14, how many counters are in each box?","o":["3","4","5","6"],"a":1,"e":"Let each box be x: 3x + 2 = 14, so 3x = 12 and x = 4.","v":"picture"},{"d":"MEDIUM","q":"Solve: (x + 5)/2 = 8","o":["11","13","16","21"],"a":0,"e":"Multiply by 2: x + 5 = 16; subtract 5: x = 11.","v":"balance"},{"d":"HARD","q":"Solve: 3x + 7 = 2x + 19","o":["10","12","13","26"],"a":1,"e":"Subtract 2x and 7: x = 12.","v":"bars"},{"d":"HARD","q":"Solve: 4(x − 2) + 3 = 19","o":["4","5","6","7"],"a":2,"e":"Expand: 4x − 8 + 3 = 19, so 4x = 24 and x = 6.","v":"balance"},{"d":"HARD","q":"A rectangle has perimeter 30 cm. Its length is 3 cm more than its width. Find the width.","o":["5 cm","6 cm","7 cm","9 cm"],"a":1,"e":"Let width be w and length w + 3. 2w + 2(w + 3) = 30 gives 4w = 24, so w = 6 cm.","v":"picture"},{"d":"HARD","q":"Solve: 2x/3 − 4 = 8","o":["6","12","18","24"],"a":2,"e":"Add 4: 2x/3 = 12; multiply by 3: 2x = 36; divide by 2: x = 18.","v":"bars"},{"d":"HARD","q":"Three consecutive integers have sum 51. What is the smallest?","o":["15","16","17","18"],"a":1,"e":"Let the smallest be n: n + (n + 1) + (n + 2) = 51; 3n + 3 = 51, so n = 16.","v":"picture"},{"d":"HARD","q":"Solve: 5(x + 1) = 3x + 17","o":["4","5","6","7"],"a":2,"e":"Expand: 5x + 5 = 3x + 17; 2x = 12, so x = 6.","v":"balance"},{"d":"HARD","q":"A balance shows 2 identical bags and 6 kg on one side, and 20 kg on the other. What is each bag's mass?","o":["6 kg","7 kg","8 kg","13 kg"],"a":1,"e":"Let a bag weigh x kg: 2x + 6 = 20, so 2x = 14 and x = 7 kg.","v":"picture"},{"d":"HARD","q":"Solve: (2x − 5)/3 = 7","o":["8","11","13","16"],"a":2,"e":"Multiply by 3: 2x − 5 = 21; add 5 and divide by 2: x = 13.","v":"bars"},{"d":"HARD","q":"The sum of a number and half of it is 18. Find the number.","o":["9","12","15","27"],"a":1,"e":"x + x/2 = 18; multiplying by 2 gives 3x = 36, so x = 12.","v":"picture"},{"d":"HARD","q":"Solve: 0.5x + 4 = 10","o":["3","8","12","28"],"a":2,"e":"Subtract 4: 0.5x = 6; divide by 0.5: x = 12.","v":"balance"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}const visuals={
balance:'',
blocks:'',
bars:'',
picture:''
};function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🔢</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+'<div class="skill-item '+(correct>=8?'unlocked':'')+'">'+(correct>=8?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Translate words into equations</div>'+'<div class="skill-item '+(correct>=18?'unlocked':'')+'">'+(correct>=18?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Solve one-step and multi-step equations</div>'+'<div class="skill-item '+(correct>=24?'unlocked':'')+'">'+(correct>=24?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Model real-life problems</div>'+'</div></div>' ;$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script></body></html>
