<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Solve 2(x + 3) = 14.","o":["x = 4","x = 5","x = 7","x = 2"],"a":0,"e":"Divide both sides by 2, then subtract 3.","v":"equations-reducible-to-linear-form"},{"d":"BASIC","q":"Solve 3(x − 2) = 9.","o":["x = 5","x = 3","x = 6","x = 1"],"a":0,"e":"Divide by 3, then add 2.","v":"equations-reducible-to-linear-form"},{"d":"BASIC","q":"Solve (x + 4)/3 = 5.","o":["x = 11","x = 15","x = 7","x = 19"],"a":0,"e":"Multiply both sides by 3 and subtract 4.","v":"equations-reducible-to-linear-form"},{"d":"BASIC","q":"Solve 2x + 3x = 25.","o":["x = 5","x = 8","x = 3","x = 10"],"a":0,"e":"Combine like terms to get 5x = 25.","v":"equations-reducible-to-linear-form"},{"d":"BASIC","q":"Solve 4(x + 1) − 2x = 10.","o":["x = 3","x = 2","x = 4","x = 5"],"a":0,"e":"Expand the brackets and combine the x terms.","v":"equations-reducible-to-linear-form"},{"d":"BASIC","q":"Solve 3x + 6 = 2(x + 9).","o":["x = 12","x = 6","x = 9","x = 15"],"a":0,"e":"Expand the right side and subtract 2x.","v":"equations-reducible-to-linear-form"},{"d":"BASIC","q":"Solve 5(x − 1) = 3x + 7.","o":["x = 6","x = 4","x = 5","x = 7"],"a":0,"e":"Expand, subtract 3x, then add 5.","v":"equations-reducible-to-linear-form"},{"d":"BASIC","q":"Solve (x − 2)/4 = 3.","o":["x = 14","x = 10","x = 12","x = 16"],"a":0,"e":"Multiply both sides by 4 and add 2.","v":"equations-reducible-to-linear-form"},{"d":"BASIC","q":"Solve 2(3x − 1) = 4x + 10.","o":["x = 4","x = 6","x = 5","x = 8"],"a":1,"e":"Expand and collect variable terms on one side.","v":"equations-reducible-to-linear-form"},{"d":"BASIC","q":"Solve 7x − 2x + 1 = 26.","o":["x = 4","x = 5","x = 6","x = 7"],"a":1,"e":"Combine the x terms, then subtract 1.","v":"equations-reducible-to-linear-form"},{"d":"MEDIUM","q":"Solve (2x + 3)/5 = 3.","o":["x = 5","x = 6","x = 9","x = 12"],"a":1,"e":"Multiply both sides by 5, then subtract 3.","v":"equations-reducible-to-linear-form"},{"d":"MEDIUM","q":"Solve (x + 2)/3 + 1 = 5.","o":["x = 8","x = 10","x = 12","x = 15"],"a":1,"e":"Subtract 1 and multiply by 3.","v":"equations-reducible-to-linear-form"},{"d":"MEDIUM","q":"Solve 4x/3 − 2 = 6.","o":["x = 3","x = 6","x = 8","x = 9"],"a":1,"e":"Add 2, then multiply by 3/4.","v":"equations-reducible-to-linear-form"},{"d":"MEDIUM","q":"Solve 2(x + 4) = 3(x − 1).","o":["x = 5","x = 11","x = 7","x = 9"],"a":1,"e":"Expand both sides and isolate x.","v":"equations-reducible-to-linear-form"},{"d":"MEDIUM","q":"Solve (x − 1)/2 = (x + 5)/4.","o":["x = 3","x = 7","x = 5","x = 9"],"a":1,"e":"Multiply both sides by 4 to clear denominators.","v":"equations-reducible-to-linear-form"},{"d":"MEDIUM","q":"Solve 5 − 2(x − 3) = x + 2.","o":["x = 1","x = 3","x = 2","x = 4"],"a":1,"e":"Distribute −2 through the parentheses before collecting terms.","v":"equations-reducible-to-linear-form"},{"d":"MEDIUM","q":"Solve 3(x + 1) − 2(x − 4) = 20.","o":["x = 7","x = 8","x = 9","x = 10"],"a":2,"e":"Expand both brackets, combine like terms and subtract the constant.","v":"equations-reducible-to-linear-form"},{"d":"MEDIUM","q":"Solve (x + 1)/2 + (x − 1)/2 = 7.","o":["x = 5","x = 6","x = 7","x = 8"],"a":2,"e":"Combine the numerators because the denominators are equal.","v":"equations-reducible-to-linear-form"},{"d":"MEDIUM","q":"Solve 0.5x + 2 = 0.25x + 5.","o":["x = 8","x = 10","x = 12","x = 15"],"a":2,"e":"Subtract 0.25x and then subtract 2.","v":"equations-reducible-to-linear-form"},{"d":"MEDIUM","q":"Solve 2x/3 + 4 = 10.","o":["x = 6","x = 8","x = 9","x = 12"],"a":2,"e":"Subtract 4 and multiply both sides by 3/2.","v":"equations-reducible-to-linear-form"},{"d":"HARD","q":"Solve (x + 3)/2 + (x − 1)/3 = 7.","o":["x = 5","x = 6","x = 7","x = 8"],"a":2,"e":"Multiply by 6 to clear denominators, then combine terms.","v":"equations-reducible-to-linear-form"},{"d":"HARD","q":"Solve (3x − 5)/4 = (x + 1)/2.","o":["x = 5","x = 6","x = 7","x = 9"],"a":2,"e":"Multiply both sides by 4 and collect the x terms.","v":"equations-reducible-to-linear-form"},{"d":"HARD","q":"Solve 2(x − 3)/5 + 1 = x/5.","o":["x = 2","x = 3","x = 1","x = 5"],"a":2,"e":"Multiply by 5 first, then simplify both sides.","v":"equations-reducible-to-linear-form"},{"d":"HARD","q":"Solve 4 − (2x − 3)/3 = 2.","o":["x = 1","x = 2","x = 5/2","x = 3/2"],"a":3,"e":"Subtract 2 from 4, then solve the fraction equation.","v":"equations-reducible-to-linear-form"},{"d":"HARD","q":"Solve (2x + 1)/3 − (x − 2)/2 = 4.","o":["x = 12","x = 14","x = 18","x = 16"],"a":3,"e":"Multiply by 6 and combine the resulting linear terms.","v":"equations-reducible-to-linear-form"},{"d":"HARD","q":"Solve 0.3x + 1.2 = 0.5x − 2.","o":["x = 12","x = 14","x = 18","x = 16"],"a":3,"e":"Subtract 0.3x and add 2 to isolate the decimal coefficient.","v":"equations-reducible-to-linear-form"},{"d":"HARD","q":"Solve 3(2x − 1) − 2(x + 4) = x + 7.","o":["x = 4","x = 5","x = 7","x = 6"],"a":3,"e":"Expand both brackets and combine like terms.","v":"equations-reducible-to-linear-form"},{"d":"HARD","q":"Solve (x − 4)/3 + (x + 2)/6 = 5.","o":["x = 8","x = 10","x = 14","x = 12"],"a":3,"e":"Multiply every term by 6 to remove denominators.","v":"equations-reducible-to-linear-form"},{"d":"HARD","q":"Solve 5 − 2[x − (x − 3)/2] = 1.","o":["x = 2","x = 3","x = 4","x = 1"],"a":3,"e":"Simplify the expression inside the square brackets first.","v":"equations-reducible-to-linear-form"},{"d":"HARD","q":"Solve (2x − 1)/5 + (x + 4)/10 = 3.","o":["x = 4","x = 5","x = 6","x = 28/5"],"a":3,"e":"Multiply the whole equation by 10 and combine like terms.","v":"equations-reducible-to-linear-form"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Reduce equations to linear form</strong><small>Simplify brackets, fractions and decimals</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Clear denominators and isolate the variable</strong><small>Solve equations reducible to linear form</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Check simplified equations by substitution</strong><small>Solve equations reducible to linear form</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
