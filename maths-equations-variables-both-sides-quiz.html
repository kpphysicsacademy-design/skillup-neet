<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Solve 2x + 3 = x + 11.","o":["x = 8","x = 7","x = 14","x = −8"],"a":0,"e":"Subtract x from both sides to get x + 3 = 11, then subtract 3."},{"d":"BASIC","q":"Solve 5x − 4 = 3x + 10.","o":["x = 7","x = 3","x = −7","x = 14"],"a":0,"e":"Subtract 3x, then add 4: 2x = 14."},{"d":"BASIC","q":"Solve 4x + 6 = 2x + 18.","o":["x = 6","x = 12","x = −6","x = 3"],"a":0,"e":"Subtract 2x and then subtract 6: 2x = 12."},{"d":"BASIC","q":"Solve 7x − 5 = 4x + 16.","o":["x = 7","x = 11/3","x = −7","x = 21"],"a":0,"e":"Subtract 4x and add 5: 3x = 21."},{"d":"BASIC","q":"Solve 3x + 8 = x + 20.","o":["x = 6","x = 12","x = 14","x = −6"],"a":0,"e":"Move x terms to one side and constants to the other: 2x = 12."},{"d":"BASIC","q":"Solve 9x + 2 = 6x + 20.","o":["x = 6","x = 18","x = 3","x = −6"],"a":0,"e":"Subtract 6x and 2: 3x = 18."},{"d":"BASIC","q":"Solve 8x − 7 = 5x + 8.","o":["x = 5","x = 3","x = −5","x = 15"],"a":0,"e":"Subtract 5x and add 7: 3x = 15."},{"d":"BASIC","q":"Solve 6x + 1 = 2x + 17.","o":["x = 4","x = 16","x = −4","x = 8"],"a":0,"e":"Subtract 2x and 1: 4x = 16."},{"d":"BASIC","q":"Solve 10x − 9 = 7x + 12.","o":["x = 7","x = 3","x = −7","x = 21"],"a":0,"e":"Subtract 7x and add 9: 3x = 21."},{"d":"BASIC","q":"Solve 4x − 3 = x + 12.","o":["x = 5","x = 3","x = −5","x = 15"],"a":0,"e":"Subtract x and add 3: 3x = 15."},{"d":"MEDIUM","q":"Solve 2(x + 4) = x + 13.","o":["x = 5","x = 9","x = −5","x = 13"],"a":0,"e":"Expand the left side to get 2x + 8 = x + 13."},{"d":"MEDIUM","q":"Solve 3(x − 2) = x + 8.","o":["x = 7","x = 5","x = 10","x = −7"],"a":0,"e":"Expand: 3x − 6 = x + 8, then collect x terms."},{"d":"MEDIUM","q":"Solve 5(x + 1) = 2x + 17.","o":["x = 4","x = 6","x = −4","x = 12"],"a":0,"e":"Expand: 5x + 5 = 2x + 17, so 3x = 12."},{"d":"MEDIUM","q":"Solve 4(x − 3) = 2x + 6.","o":["x = 9","x = 3","x = 6","x = −9"],"a":0,"e":"Expand to 4x − 12 = 2x + 6, then 2x = 18."},{"d":"MEDIUM","q":"Solve 2x + 7 = 3x − 5.","o":["x = 12","x = 2","x = −12","x = 5"],"a":0,"e":"Subtract 2x, then add 5 to both sides."},{"d":"MEDIUM","q":"Solve 7x + 4 = 9x − 10.","o":["x = 7","x = −7","x = 3","x = 14"],"a":0,"e":"Subtract 7x and add 10: 14 = 2x."},{"d":"MEDIUM","q":"Solve 6(x + 2) = 4x + 22.","o":["x = 5","x = 7","x = −5","x = 11"],"a":0,"e":"Expand to 6x + 12 = 4x + 22, so 2x = 10."},{"d":"MEDIUM","q":"Solve 3(x + 5) = 2(x + 9).","o":["x = 3","x = 9","x = −3","x = 6"],"a":0,"e":"Expand both sides: 3x + 15 = 2x + 18."},{"d":"MEDIUM","q":"Solve 8x − 3 = 5(x + 3).","o":["x = 6","x = 4","x = −6","x = 9"],"a":0,"e":"Expand the right side: 8x − 3 = 5x + 15."},{"d":"MEDIUM","q":"Solve 2(3x − 1) = 4x + 10.","o":["x = 6","x = 4","x = −6","x = 12"],"a":0,"e":"Expand: 6x − 2 = 4x + 10, then 2x = 12."},{"d":"HARD","q":"Solve (x + 4)/2 = x − 1.","o":["x = 6","x = 2","x = −6","x = 4"],"a":0,"e":"Multiply both sides by 2: x + 4 = 2x − 2."},{"d":"HARD","q":"Solve (3x − 2)/2 = x + 4.","o":["x = 10","x = 6","x = −10","x = 4"],"a":0,"e":"Multiply by 2: 3x − 2 = 2x + 8."},{"d":"HARD","q":"Solve 0.5x + 4 = 0.2x + 10.","o":["x = 20","x = 10","x = −20","x = 2"],"a":0,"e":"Subtract 0.2x and 4: 0.3x = 6."},{"d":"HARD","q":"Solve 1.2x − 3 = 0.7x + 5.","o":["x = 16","x = 8","x = −16","x = 4"],"a":0,"e":"Subtract 0.7x and add 3: 0.5x = 8."},{"d":"HARD","q":"Solve 5 − 2x = x − 7.","o":["x = 4","x = −4","x = 12","x = 2"],"a":0,"e":"Add 2x and 7 to both sides: 12 = 3x."},{"d":"HARD","q":"Solve 4x + 9 = 2(x + 11).","o":["x = 13/2","x = 7","x = 11/2","x = 6"],"a":0,"e":"Expand: 4x + 9 = 2x + 22, so 2x = 13."},{"d":"HARD","q":"Solve 3(2x + 1) = 5x + 12.","o":["x = 9","x = 3","x = −9","x = 6"],"a":0,"e":"Expand: 6x + 3 = 5x + 12."},{"d":"HARD","q":"Solve 2(x − 5) + 3 = x + 4.","o":["x = 11","x = 7","x = −11","x = 9"],"a":0,"e":"Simplify the left side to 2x − 7 = x + 4."},{"d":"HARD","q":"Solve 7 − 3(x − 2) = x + 1.","o":["x = 3","x = 2","x = −3","x = 5"],"a":0,"e":"Expand: 13 − 3x = x + 1, then 12 = 4x."},{"d":"HARD","q":"Solve 2(2x + 5) − 3 = 3x + 8.","o":["x = 1","x = 3","x = −1","x = 5"],"a":0,"e":"Simplify to 4x + 7 = 3x + 8."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id);function updateProgress(){const p=index>=questions.length?100:index/questions.length*100;$('bar').style.width=p+'%';}function render(){if(index>=questions.length){results();return;}const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · VARIABLES ON BOTH SIDES';$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';const content=$('content');content.replaceChildren();const question=document.createElement('div');question.className='question';question.textContent=q.q;content.appendChild(question);const choices=document.createElement('div');choices.className='choices';content.appendChild(choices);q.o.forEach((answer,i)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=answer;b.addEventListener('click',()=>{if(locked)return;selected=i;choices.querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===i));$('action').disabled=false;});choices.appendChild(b);});$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';if(window.skillupCelebrate)window.skillupCelebrate();}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===selected&&!good)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Explanation: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();}else results();}function results(){finished=true;updateProgress();$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='🏆 Variables on both sides complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const content=$('content');content.replaceChildren();const end=document.createElement('div');end.className='end';const title=document.createElement('h1');title.textContent=correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!';end.appendChild(title);const score=document.createElement('div');score.className='score';score.textContent=correct+' / '+questions.length;end.appendChild(score);const p=document.createElement('p');p.textContent='You answered '+correct+' questions correctly.';end.appendChild(p);const summary=document.createElement('div');summary.className='summary';summary.innerHTML='⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining';end.appendChild(summary);content.appendChild(end);$('action').textContent='Try again ↻';$('action').disabled=false;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished)restart();else act();});try{render();}catch(error){$('content').textContent='Quiz could not start. Please refresh the page.';console.error('Variables on both sides quiz initialization failed',error);}})();</script>
