<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Which decimal is equivalent to 0.5?","o":["0.05","0.50","0.005","5.00"],"a":1,"e":"Appending a zero to the right of a decimal's last digit does not change its value.","v":"equivalent-decimals"},{"d":"BASIC","q":"Which decimal is equivalent to 2.30?","o":["2.3","23.0","0.230","2.03"],"a":0,"e":"The zero at the end of 2.30 is a trailing decimal zero and does not change its value.","v":"equivalent-decimals"},{"d":"BASIC","q":"How many tenths are in 0.7?","o":["7","70","0.7","70 tenths"],"a":0,"e":"Seven tenths is written as 0.7.","v":"equivalent-decimals"},{"d":"BASIC","q":"What is the value of digit 6 in 4.268?","o":["6 tenths","6 hundredths","6 thousandths","6 ones"],"a":1,"e":"The second digit after the decimal point is in the hundredths place.","v":"equivalent-decimals"},{"d":"BASIC","q":"Which is the expanded form of 3.42?","o":["3 + 4/10 + 2/100","3 + 4/100 + 2/10","30 + 4 + 2","3 + 42/10"],"a":0,"e":"3.42 has 3 ones, 4 tenths, and 2 hundredths.","v":"equivalent-decimals"},{"d":"BASIC","q":"Which decimal has 8 tenths and 3 hundredths?","o":["0.038","0.83","8.03","0.803"],"a":1,"e":"Eight tenths is 0.8 and three hundredths is 0.03; together they make 0.83.","v":"equivalent-decimals"},{"d":"BASIC","q":"Write 6/10 as a decimal.","o":["0.06","0.6","6.0","0.006"],"a":1,"e":"Six tenths is 0.6.","v":"equivalent-decimals"},{"d":"BASIC","q":"Which is the same as 0.400?","o":["4","0.04","0.4","0.004"],"a":2,"e":"Two trailing zeros can be removed without changing the value.","v":"equivalent-decimals"},{"d":"BASIC","q":"In 12.507, what is the place value of 5?","o":["5 ones","5 tenths","5 hundredths","5 thousandths"],"a":1,"e":"The first digit after the decimal point represents tenths.","v":"equivalent-decimals"},{"d":"BASIC","q":"Which number has 2 ones, 0 tenths, and 9 hundredths?","o":["2.9","2.09","2.90","0.29"],"a":1,"e":"Two ones plus zero tenths plus nine hundredths equals 2.09.","v":"equivalent-decimals"},{"d":"MEDIUM","q":"Which pair represents equal decimals?","o":["0.6 and 0.06","1.20 and 1.2","2.03 and 2.3","0.70 and 0.07"],"a":1,"e":"1.20 and 1.2 have the same value because the final zero is not significant to the value.","v":"equivalent-decimals"},{"d":"MEDIUM","q":"Write 47/100 as a decimal.","o":["4.7","0.047","0.47","47.00"],"a":2,"e":"Forty-seven hundredths is 0.47.","v":"equivalent-decimals"},{"d":"MEDIUM","q":"Which is the greatest number?","o":["3.08","3.8","3.18","3.108"],"a":1,"e":"Write to hundredths: 3.08, 3.80, 3.18, and 3.11; 3.80 is greatest.","v":"equivalent-decimals"},{"d":"MEDIUM","q":"What digit should replace □ to make 5.□2 equal to 5.32?","o":["2","3","0","9"],"a":1,"e":"Matching tenths and hundredths in 5.32 means the missing tenths digit is 3.","v":"equivalent-decimals"},{"d":"MEDIUM","q":"How many thousandths are represented by 0.125?","o":["125","12.5","1,250","1.25"],"a":0,"e":"0.125 is 125 thousandths.","v":"equivalent-decimals"},{"d":"MEDIUM","q":"Which fraction is equivalent to 0.75?","o":["75/10","3/4","7/5","1/4"],"a":1,"e":"0.75 = 75/100, which simplifies to 3/4.","v":"equivalent-decimals"},{"d":"MEDIUM","q":"Which decimal is equal to 9 + 6/10 + 4/100?","o":["9.064","9.64","9.604","96.4"],"a":1,"e":"Six tenths is 0.6 and four hundredths is 0.04, giving 9.64.","v":"equivalent-decimals"},{"d":"MEDIUM","q":"Which statement about 0.80 and 0.8 is correct?","o":["0.80 is greater","0.8 is greater","They are equal","Their difference is 0.08"],"a":2,"e":"Both represent eight tenths.","v":"equivalent-decimals"},{"d":"MEDIUM","q":"Write 3/5 as a decimal.","o":["0.35","0.6","0.06","0.8"],"a":1,"e":"Convert 3/5 to 6/10, which is 0.6.","v":"equivalent-decimals"},{"d":"MEDIUM","q":"Which decimal has the digit 4 in the thousandths place?","o":["0.402","0.042","0.004","0.240"],"a":2,"e":"In 0.004, the 4 is in the thousandths place.","v":"equivalent-decimals"},{"d":"HARD","q":"Arrange 0.9, 0.09, 0.909, and 0.99 in ascending order.","o":["0.09, 0.9, 0.909, 0.99","0.9, 0.09, 0.99, 0.909","0.09, 0.909, 0.9, 0.99","0.99, 0.909, 0.9, 0.09"],"a":0,"e":"Write them as 0.090, 0.900, 0.909, and 0.990 to compare.","v":"equivalent-decimals"},{"d":"HARD","q":"What is the value of 7 in 5.073?","o":["7 tenths","7 hundredths","7 thousandths","7 ones"],"a":1,"e":"The second digit after the decimal point is hundredths; 7 is in that position.","v":"equivalent-decimals"},{"d":"HARD","q":"Which is the correct expanded form of 0.506?","o":["5/10 + 6/1000","5/100 + 6/10","5/100 + 6/1000","5/10 + 6/100"],"a":0,"e":"0.506 has 5 tenths, 0 hundredths, and 6 thousandths.","v":"equivalent-decimals"},{"d":"HARD","q":"A number is 4.7. Which expression is equal to it?","o":["47 hundredths","4 ones + 7 tenths","4 tenths + 7 ones","470 thousandths"],"a":1,"e":"4.7 is four ones and seven tenths.","v":"equivalent-decimals"},{"d":"HARD","q":"Which decimal is exactly halfway between 2.4 and 2.6?","o":["2.45","2.5","2.55","2.0"],"a":1,"e":"The midpoint is the average of the endpoints: (2.4 + 2.6) ÷ 2 = 2.5.","v":"equivalent-decimals"},{"d":"HARD","q":"How many hundredths equal 3.07?","o":["307","37","3,070","30.7"],"a":0,"e":"3.07 = 307/100, or 307 hundredths.","v":"equivalent-decimals"},{"d":"HARD","q":"Which is the smallest number?","o":["0.505","0.55","0.5005","0.506"],"a":2,"e":"Write to ten-thousandths: 0.5050, 0.5500, 0.5005, and 0.5060; 0.5005 is smallest.","v":"equivalent-decimals"},{"d":"HARD","q":"A decimal has 2 tens, 4 tenths, and 6 thousandths. What is the number?","o":["20.406","20.46","2.406","24.006"],"a":0,"e":"Two tens is 20, four tenths is 0.4, and six thousandths is 0.006; total 20.406.","v":"equivalent-decimals"},{"d":"HARD","q":"Which statement is true?","o":["0.230 = 0.23","0.230 = 0.203","0.230 > 0.23","0.23 = 0.023"],"a":0,"e":"The final zero in 0.230 does not change its value.","v":"equivalent-decimals"},{"d":"HARD","q":"Which decimal is equivalent to 17/20?","o":["0.17","0.75","0.85","0.95"],"a":2,"e":"Multiply numerator and denominator by 5: 17/20 = 85/100 = 0.85.","v":"equivalent-decimals"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){ind
