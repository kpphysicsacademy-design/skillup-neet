(function(){'use strict';const questions=[{"d":"BASIC","q":"Playfair's axiom says that through a point outside a given line, how many lines can be drawn parallel to it?","o":["None","Exactly one","Exactly two","Infinitely many"],"a":1,"e":"Playfair's axiom states that exactly one parallel to a given line passes through an external point."},{"d":"BASIC","q":"If a transversal makes interior angles on the same side add to 180°, the two lines are:","o":["Perpendicular","Parallel","Intersecting at 45°","Coincident always"],"a":1,"e":"Same-side interior angles supplementary imply the two lines are parallel."},{"d":"BASIC","q":"If corresponding angles formed by a transversal are equal, the two lines are:","o":["Parallel","Perpendicular","Always intersecting","Unequal"],"a":0,"e":"Equal corresponding angles are a test for parallel lines."},{"d":"BASIC","q":"If alternate interior angles are equal, the lines cut by the transversal are:","o":["Parallel","Perpendicular","Always coincident","Not related"],"a":0,"e":"Equal alternate interior angles imply parallel lines."},{"d":"BASIC","q":"Euclid's fifth postulate concerns the conditions under which:","o":["A circle is drawn","Two lines meet when extended","A triangle has equal sides","A segment is bisected"],"a":1,"e":"The fifth postulate describes when lines meet based on the interior angles made by a transversal."},{"d":"BASIC","q":"A line crosses two lines. Same-side interior angles are 110° and 70°. The two lines are:","o":["Parallel","Not parallel by this test","Perpendicular","Coincident"],"a":0,"e":"110°+70°=180°, so the lines are parallel."},{"d":"BASIC","q":"A line through a point not on line l is parallel to l. Under Playfair's axiom, another distinct parallel through that same point:","o":["Always exists","Cannot exist","Must be perpendicular","Must cross l"],"a":1,"e":"Playfair's axiom gives uniqueness: only one parallel through the external point."},{"d":"BASIC","q":"If same-side interior angles sum to less than 180°, Euclid's fifth postulate says the lines:","o":["Never meet","Meet on that side when extended","Are perpendicular","Are equal in length"],"a":1,"e":"They meet on the side where the interior-angle sum is less than two right angles."},{"d":"BASIC","q":"Which angle condition is commonly used to prove two lines parallel?","o":["Corresponding angles equal","Adjacent angles unequal","One angle is 30°","Angles have different names"],"a":0,"e":"Equality of corresponding angles is a standard parallel-line criterion."},{"d":"BASIC","q":"If same-side interior angles are 90° and 90°, the lines are:","o":["Parallel","Perpendicular and intersecting","Always coincident","Impossible to decide"],"a":0,"e":"Their sum is 180°, so the parallel-line criterion is satisfied."},{"d":"MEDIUM","q":"Same-side interior angles are (3x+10)° and (2x+20)°. If the lines are parallel, x equals:","o":["20","25","30","35"],"a":2,"e":"5x+30=180, so x=30."},{"d":"MEDIUM","q":"Corresponding angles are (4x−5)° and (3x+15)°. If the lines are parallel, find x.","o":["10","15","20","25"],"a":2,"e":"4x−5=3x+15, so x=20."},{"d":"MEDIUM","q":"Same-side interior angles are 4x° and 2x°. If the lines are parallel, x is:","o":["20°","25°","30°","35°"],"a":2,"e":"4x+2x=180, so x=30°."},{"d":"MEDIUM","q":"One same-side interior angle is 68°. Find the other angle if the lines are parallel.","o":["22°","68°","112°","122°"],"a":2,"e":"The same-side interior angles sum to 180°, so the other is 112°."},{"d":"MEDIUM","q":"Alternate interior angles measure (2x+15)° and (3x−10)°. If the lines are parallel, x is:","o":["15","20","25","30"],"a":2,"e":"2x+15=3x−10, so x=25."},{"d":"MEDIUM","q":"Two same-side interior angles sum to 175°. Under the fifth-postulate criterion, the lines:","o":["Are parallel","Meet on that side when extended","Must be perpendicular","Cannot be described"],"a":1,"e":"175° is less than 180°, so the lines meet on that side when extended."},{"d":"MEDIUM","q":"Two lines are cut by a transversal and corresponding angles are 72° and 108°. What follows?","o":["The lines are parallel","The lines are not parallel by the equal-corresponding-angle test","The lines are perpendicular","They must be the same line"],"a":1,"e":"Corresponding angles are not equal, so the parallel criterion is not satisfied."},{"d":"MEDIUM","q":"If alternate interior angles are 5x° and (3x+40)°, and the lines are parallel, x equals:","o":["10","15","20","25"],"a":2,"e":"5x=3x+40 gives x=20."},{"d":"MEDIUM","q":"A transversal gives same-side interior angles of (x+40)° and (2x+20)°. If lines are parallel, x is:","o":["30","35","40","45"],"a":2,"e":"3x+60=180, so x=40."},{"d":"MEDIUM","q":"Which is an equivalent way to express the parallel-line condition using same-side interior angles?","o":["They sum to 90°","They sum to 180°","They are always equal","Their difference is 180°"],"a":1,"e":"For parallel lines, same-side interior angles are supplementary."},{"d":"HARD","q":"Same-side interior angles are (5x−10)° and (3x+30)°. If the lines are parallel, find x.","o":["15","20","25","30"],"a":1,"e":"5x−10+3x+30=180, so 8x=160 and x=20."},{"d":"HARD","q":"Through point P outside line l, two distinct lines m and n are both claimed parallel to l. Which principle rules this out in Euclidean geometry?","o":["First postulate","Playfair's axiom","Triangle angle-sum property","Circle postulate"],"a":1,"e":"Playfair's axiom says exactly one parallel to l passes through P."},{"d":"HARD","q":"A transversal makes same-side interior angles 2x° and (x+30)°. If the lines are parallel, find x.","o":["40°","50°","60°","70°"],"a":1,"e":"2x+x+30=180, so x=50°."},{"d":"HARD","q":"Corresponding angles are (7x−8)° and (5x+22)°. For parallel lines, x is:","o":["10","12","15","18"],"a":2,"e":"7x−8=5x+22 gives 2x=30, x=15."},{"d":"HARD","q":"Same-side interior angles are 95° and 85°. Which conclusion is justified?","o":["They are parallel by the supplementary-angle criterion","They must intersect at 90°","They are not parallel","The transversal is parallel to both"],"a":0,"e":"95°+85°=180°, so the two lines are parallel."},{"d":"HARD","q":"A transversal makes same-side interior angles 80° and 95°. Under Euclid's fifth postulate, the lines:","o":["Are parallel","Meet on the side with sum less than 180°","Meet on both sides","Are perpendicular"],"a":1,"e":"The sum is 175°, less than 180°, so the lines meet on that side."},{"d":"HARD","q":"If alternate interior angles are equal, but corresponding angles are not equal in the same configuration, what is the best conclusion?","o":["The lines are parallel; the stated angle information is inconsistent for a transversal","The lines must be perpendicular","No parallel criterion applies","Both lines are circles"],"a":0,"e":"Equal alternate interior angles imply parallel lines; corresponding angles should then also be equal, so the data conflict."},{"d":"HARD","q":"Same-side interior angles are (2x+5)° and (4x−5)°. For parallel lines, find the larger angle.","o":["55°","65°","115°","125°"],"a":2,"e":"6x=180, x=30; angles are 65° and 115°, so the larger is 115°."},{"d":"HARD","q":"The same-side interior angles made by a transversal are in ratio 4:5. If the lines are parallel, the smaller angle is:","o":["60°","70°","80°","100°"],"a":2,"e":"Let angles be 4k and 5k; 9k=180, k=20, smaller angle=80°."},{"d":"HARD","q":"Which statement captures the uniqueness part of Playfair's axiom?","o":["Every line has two parallels through each point","Exactly one line through an external point is parallel to a given line","All lines intersect at a right angle","Parallel lines are always the same line"],"a":1,"e":"The uniqueness claim is that one and only one parallel passes through the point outside the given line."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand Euclid's fifth postulate</strong><small>Apply Playfair's axiom</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Test parallel-line criteria</strong><small>Use angle relationships</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve parallel-line problems</strong><small>Solve multi-step angle problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
