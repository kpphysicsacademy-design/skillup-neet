s="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Equivalent Fractions</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Equivalent Fractions skills"><div class="skill-title">🎯 Equivalent Fractions Skills</div><div class="skill-list"><div class="skill-item">Identify and generate equivalent fractions</div><div class="skill-item">Simplify fractions to lowest terms</div><div class="skill-item">Solve missing-numerator and denominator problems</div></div></section></div><script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Which fraction is equivalent to 1/3?","o":["2/6","2/5","3/5","4/9"],"a":0,"e":"Multiply the numerator and denominator of 1/3 by 2: 2/6."},{"d":"BASIC","q":"Which fraction is equivalent to 2/5?","o":["4/10","3/10","2/10","5/2"],"a":0,"e":"Multiplying both parts of 2/5 by 2 gives 4/10."},{"d":"BASIC","q":"Complete: 1/2 = □/8","o":["2","3","4","6"],"a":2,"e":"The denominator 2 is multiplied by 4 to make 8, so multiply the numerator 1 by 4."},{"d":"BASIC","q":"Simplify 4/8.","o":["1/4","1/2","2/3","4/2"],"a":1,"e":"Divide the numerator and denominator by 4: 4/8 = 1/2."},{"d":"BASIC","q":"Which fraction is equivalent to 3/4?","o":["6/8","6/10","9/16","4/3"],"a":0,"e":"Multiplying 3/4 by 2/2 gives 6/8."},{"d":"BASIC","q":"Simplify 6/9.","o":["1/3","2/3","3/2","3/4"],"a":1,"e":"Divide numerator and denominator by 3 to get 2/3."},{"d":"BASIC","q":"Complete: 2/3 = 8/□","o":["9","10","12","15"],"a":2,"e":"The numerator is multiplied by 4, so 3 × 4 = 12."},{"d":"BASIC","q":"Which fraction is equivalent to 5/6?","o":["10/12","10/18","15/24","6/5"],"a":0,"e":"Multiplying numerator and denominator by 2 gives 10/12."},{"d":"BASIC","q":"Simplify 10/15.","o":["1/3","2/3","3/5","5/3"],"a":1,"e":"Divide both 10 and 15 by 5 to get 2/3."},{"d":"BASIC","q":"Equivalent fractions have…","o":["Different values","The same value","Always the same numerator","Always the same denominator"],"a":1,"e":"Equivalent fractions may look different but represent the same value."},{"d":"MEDIUM","q":"Complete: 3/5 = 21/□","o":["25","30","35","40"],"a":2,"e":"3 is multiplied by 7 to get 21, so 5 × 7 = 35."},{"d":"MEDIUM","q":"Simplify 18/24.","o":["2/3","3/4","4/3","6/8"],"a":1,"e":"Divide numerator and denominator by 6: 18/24 = 3/4."},{"d":"MEDIUM","q":"Which fraction is NOT equivalent to 2/3?","o":["4/6","6/9","8/12","10/12"],"a":3,"e":"10/12 simplifies to 5/6, not 2/3."},{"d":"MEDIUM","q":"Complete: □/18 = 2/3","o":["6","9","12","15"],"a":2,"e":"Since 3 × 6 = 18, multiply the numerator 2 by 6 to get 12."},{"d":"MEDIUM","q":"Simplify 21/28.","o":["2/3","3/4","4/7","7/4"],"a":1,"e":"Divide both numbers by 7: 21/28 = 3/4."},{"d":"MEDIUM","q":"Which fraction is equivalent to 7/10?","o":["14/20","21/40","28/30","10/7"],"a":0,"e":"Multiplying top and bottom by 2 gives 14/20."},{"d":"MEDIUM","q":"Complete: 4/7 = 20/□","o":["28","30","35","40"],"a":2,"e":"4 is multiplied by 5 to get 20, so 7 × 5 = 35."},{"d":"MEDIUM","q":"Reduce 32/40 to simplest form.","o":["3/4","4/5","5/8","8/5"],"a":1,"e":"Divide numerator and denominator by 8 to get 4/5."},{"d":"MEDIUM","q":"Which pair represents equivalent fractions?","o":["2/5 and 6/15","3/4 and 6/10","1/3 and 2/5","4/7 and 8/21"],"a":0,"e":"6/15 simplifies to 2/5, so the values match."},{"d":"MEDIUM","q":"Complete: 5/8 = □/40","o":["20","25","30","35"],"a":1,"e":"The denominator is multiplied by 5, so 5 × 5 = 25."},{"d":"HARD","q":"Simplify 42/56.","o":["2/3","3/4","4/7","7/8"],"a":1,"e":"The greatest common factor is 14; 42/56 = 3/4."},{"d":"HARD","q":"Which fraction is equivalent to 9/14 with denominator 70?","o":["35/70","40/70","45/70","50/70"],"a":2,"e":"14 × 5 = 70, so 9 × 5 = 45."},{"d":"HARD","q":"Find x if x/36 = 5/9.","o":["15","18","20","25"],"a":2,"e":"Since 9 × 4 = 36, x = 5 × 4 = 20."},{"d":"HARD","q":"Which fraction is already in simplest form?","o":["15/25","21/35","16/27","24/36"],"a":2,"e":"16 and 27 share no factor greater than 1."},{"d":"HARD","q":"A fraction equivalent to 4/9 has numerator 28. What is its denominator?","o":["36","49","54","63"],"a":3,"e":"4 is multiplied by 7 to get 28, so 9 × 7 = 63."},{"d":"HARD","q":"Simplify 84/126.","o":["1/2","2/3","3/4","4/7"],"a":1,"e":"Divide numerator and denominator by 42 to get 2/3."},{"d":"HARD","q":"Which statement is always true for equivalent fractions a/b and c/d, with nonzero denominators?","o":["a + b = c + d","a × d = b × c","a − b = c − d","a × b = c × d"],"a":1,"e":"Equivalent fractions have equal cross-products: a × d = b × c."},{"d":"HARD","q":"Complete: 11/15 = 44/□","o":["45","50","55","60"],"a":2,"e":"11 is multiplied by 4, so 15 × 4 = 60."},{"d":"HARD","q":"A recipe uses 3/4 cup of milk. Which amount is equivalent?","o":["6/10 cup","9/12 cup","8/12 cup","12/20 cup"],"a":1,"e":"9/12 simplifies to 3/4 by dividing numerator and denominator by 3."},{"d":"HARD","q":"Simplify 105/140.","o":["2/3","3/4","4/5","5/7"],"a":1,"e":"Divide both numerator and denominator by 35 to get 3/4."}];let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0,finished=false;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const skills=[['Identify equivalent fractions',8],['Simplify fractions to lowest terms',18],['Solve missing-value problems',24]];$('content').innerHTML='<di
