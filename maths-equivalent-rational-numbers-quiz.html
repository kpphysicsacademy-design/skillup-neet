<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font:inherit;font-weight:750;min-height:52px;overflow-wrap:anywhere}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}a:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}

<main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Equivalent Rational Numbers</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button" disabled>Check answer</button></div></section></main>
</div>
<script>
(function(){
'use strict';
const questions=[
{d:"BASIC",q:"Which fraction is equivalent to 2/3?",o:["4/9","6/9","2/6","3/2"],a:1,e:"Multiplying numerator and denominator by 3 gives 6/9, which has the same value as 2/3."},
{d:"BASIC",q:"Which fraction is equivalent to −3/5?",o:["6/10","−6/10","−3/10","3/10"],a:1,e:"Multiplying both numerator and denominator by 2 gives −6/10; the negative value is preserved."},
{d:"BASIC",q:"Complete: 4/7 = x/21. What is x?",o:["8","12","14","28"],a:1,e:"The denominator is multiplied by 3, so the numerator must also be multiplied by 3: x = 4 × 3 = 12."},
{d:"BASIC",q:"Which pair represents equivalent rational numbers?",o:["2/5 and 4/15","3/4 and 9/12","−1/2 and 1/2","5/6 and 5/12"],a:1,e:"Dividing 9/12 by 3 in both numerator and denominator gives 3/4."},
{d:"BASIC",q:"Which fraction is equivalent to 5/8?",o:["10/16","10/12","15/32","5/16"],a:0,e:"Multiplying both numerator and denominator by 2 gives 10/16."},
{d:"BASIC",q:"If 3/4 = 12/x, what is x?",o:["9","12","16","18"],a:2,e:"The numerator 3 is multiplied by 4 to get 12, so the denominator 4 must also be multiplied by 4: x = 16."},
{d:"BASIC",q:"Which fraction has the value zero and a defined denominator?",o:["0/9","9/0","1/0","0/0"],a:0,e:"Zero divided by any non-zero number is zero. A denominator of zero is not allowed."},
{d:"BASIC",q:"Which fraction is equivalent to −2/9?",o:["2/9","−4/18","−2/18","4/9"],a:1,e:"Multiplying numerator and denominator by 2 gives −4/18."},
{d:"BASIC",q:"Complete: 7/10 = 21/x. What is x?",o:["20","30","40","70"],a:1,e:"The numerator is multiplied by 3, so the denominator is 10 × 3 = 30."},
{d:"BASIC",q:"Which fraction is equivalent to 6/11?",o:["12/22","18/22","6/22","11/6"],a:0,e:"Multiplying the numerator and denominator by 2 gives 12/22."},
{d:"MEDIUM",q:"Find x if 5/8 = x/40.",o:["20","25","30","32"],a:1,e:"The denominator is multiplied by 5, so the numerator is 5 × 5 = 25."},
{d:"MEDIUM",q:"Which fraction is equivalent to −7/12 with denominator 60?",o:["−28/60","−35/60","35/60","−42/60"],a:1,e:"Since 12 × 5 = 60, multiply the numerator by 5 too: −7 × 5 = −35."},
{d:"MEDIUM",q:"Find x: 9/15 = 3/x.",o:["3","5","9","15"],a:1,e:"Reducing 9/15 by dividing both terms by 3 gives 3/5, so x = 5."},
{d:"MEDIUM",q:"Which fraction is NOT equivalent to 4/9?",o:["8/18","12/27","16/36","12/18"],a:3,e:"12/18 reduces to 2/3, which is different from 4/9. The other three reduce to 4/9."},
{d:"MEDIUM",q:"A fraction equivalent to 2/7 has numerator 10. What is its denominator?",o:["14","21","28","35"],a:3,e:"The numerator is multiplied by 5, so multiply the denominator by 5 as well: 7 × 5 = 35."},
{d:"MEDIUM",q:"Reduce 24/36 to its lowest terms.",o:["2/3","3/2","4/6","6/9"],a:0,e:"The greatest common divisor of 24 and 36 is 12. Dividing both terms by 12 gives 2/3."},
{d:"MEDIUM",q:"Which equality is correct?",o:["2/3 = 8/15","3/5 = 12/25","4/7 = 12/21","5/8 = 10/24"],a:2,e:"12/21 reduces by dividing both terms by 3, giving 4/7."},
{d:"MEDIUM",q:"Find x if −4/9 = x/27.",o:["−12","12","−9","9"],a:0,e:"The denominator is multiplied by 3, so x = −4 × 3 = −12."},
{d:"MEDIUM",q:"Which denominator makes 7/8 = 35/x true?",o:["32","40","48","56"],a:1,e:"The numerator 7 is multiplied by 5 to make 35, so x = 8 × 5 = 40."},
{d:"MEDIUM",q:"An equivalent form of 11/13 has numerator 33. What is its denominator?",o:["26","39","13","52"],a:1,e:"The numerator is multiplied by 3, so the denominator is 13 × 3 = 39."},
{d:"HARD",q:"If 6/x = 18/24, find x.",o:["6","8","12","18"],a:1,e:"18/24 reduces to 3/4. Solving 6/x = 3/4 gives 24 = 3x, so x = 8."},
{d:"HARD",q:"A recipe needs 3/4 cup of flour. Which fraction expresses the same amount in twelfths?",o:["6/12","8/12","9/12","10/12"],a:2,e:"Since 4 × 3 = 12, multiply the numerator by 3 too: 3/4 = 9/12."},
{d:"HARD",q:"Which fraction is equivalent to −5/6 and has denominator 42?",o:["−30/42","−35/42","35/42","−25/42"],a:1,e:"Multiply numerator and denominator by 7: −5/6 = −35/42."},
{d:"HARD",q:"If 14/21 = 2/x, what is x?",o:["2","3","6","7"],a:1,e:"14/21 reduces to 2/3, so 2/x = 2/3 and x = 3."},
{d:"HARD",q:"Which statement about equivalent rational numbers is always true when the multiplier is non-zero?",o:["Adding the same number to both terms preserves value","Multiplying numerator and denominator by the same integer preserves value","Changing only the denominator preserves value","Negating only the denominator preserves value"],a:1,e:"Multiplying both numerator and denominator by the same non-zero integer scales both by the same factor, leaving the ratio unchanged."},
{d:"HARD",q:"A student changes 3/8 to 6/16. What operation did they apply?",o:["Added 3 to both terms","Multiplied both terms by 2","Multiplied only the numerator by 2","Divided both terms by 2"],a:1,e:"3 × 2 = 6 and 8 × 2 = 16, so both numerator and denominator were multiplied by 2."},
{d:"HARD",q:"Find x if 15/25 = x/100.",o:["30","40","50","60"],a:3,e:"15/25 reduces to 3/5. Therefore x/100 = 3/5, giving x = 60."},
{d:"HARD",q:"Which fraction is equivalent to 7/9 and has denominator 63?",o:["21/63","35/63","49/63","56/63"],a:2,e:"Multiply numerator and denominator by 7 to get 49/63."},
{d:"HARD",q:"If x/32 = −3/8, what is x?",o:["−12","12","−8","8"],a:0,e:"Since 8 × 4 = 32, multiply the numerator by 4 too: x = −3 × 4 = −12."},
{d:"HARD",q:"Which pair contains equivalent rational numbers with positive denominators?",o:["−2/5 and 4/10","3/7 and 9/21","−4/9 and −12/25","5/6 and 15/17"],a:1,e:"9/21 reduces to 3/7 by dividing numerator and denominator by 3. The other pairs have unequal values."}
];
let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0;
const $=id=>document.getElementById(id);
function updateProgress(){const p=index/questions.length*100;$('bar').style.width+p+'%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(p)));}
function render(){
 const q=questions[index];selected=-1;locked=false;
 $('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;
 $('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · EQUIVALENT RATIONAL NUMBERS';
 $('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';
 $('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';
 $('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));
 $('action').textContent='Check answer';$('action').disabled=true;updateProgress();
}
function results(){
 $('bar').style.width='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 $('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';
 $('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Generate equivalent fractions</strong><small>Scale numerator and denominator equally</small></div></div><div class="skill"><span class="skill-icon">➗</span><div><strong>Reduce to lowest terms</strong><small>Find and divide by a common factor</small></div></div><div class="skill"><span class="skill-icon">➖</span><div><strong>Work with negative rational numbers</strong><small>Preserve signs and solve for missing terms</small></div></div></div></div>';
 $('action').textContent='Try again ↻';$('action').disabled=false;
}
function act(){
 const q=questions[index];
 if(!locked){
  if(selected<0)return;locked=true;const good=selected===q.a;
  if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}
  $('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});
  $('feedback').textContent=(good?'✨ Correct! ':'💡 Review: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');
  $('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;
 }
 if(index<questions.length-1){index++;render();return;}results();
}
function restart(){index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}
$('action').addEventListener('click',()=>{if($('counter').textContent==='QUIZ COMPLETE'){restart();return;}act();});
render();
})();
</script>
