<script>
(function(){
'use strict';
const questions=[{"q":"Which fraction is equivalent to 2/3?","o":["4/9","6/9","2/6","3/2"],"a":1,"why":"Multiplying numerator and denominator by 3 gives 6/9, which has the same value as 2/3."},{"q":"Which fraction is equivalent to −3/5?","o":["6/10","−6/10","−3/10","3/10"],"a":1,"why":"Multiplying both numerator and denominator by 2 gives −6/10; the negative value is preserved."},{"q":"Complete: 4/7 = x/21. What is x?","o":["8","12","14","28"],"a":1,"why":"The denominator is multiplied by 3, so the numerator must also be multiplied by 3: x = 4 × 3 = 12."},{"q":"Which pair represents equivalent rational numbers?","o":["2/5 and 4/15","3/4 and 9/12","−1/2 and 1/2","5/6 and 5/12"],"a":1,"why":"Dividing 9/12 by 3 in both numerator and denominator gives 3/4."},{"q":"Which fraction is equivalent to 5/8?","o":["10/16","10/12","15/32","5/16"],"a":0,"why":"Multiplying both numerator and denominator by 2 gives 10/16."},{"q":"If 3/4 = 12/x, what is x?","o":["9","12","16","18"],"a":2,"why":"The numerator 3 is multiplied by 4 to get 12, so the denominator 4 must also be multiplied by 4: x = 16."},{"q":"Which fraction has the value zero and a defined denominator?","o":["0/9","9/0","1/0","0/0"],"a":0,"why":"Zero divided by any non-zero number is zero. A denominator of zero is not allowed."},{"q":"Which fraction is equivalent to −2/9?","o":["2/9","−4/18","−2/18","4/9"],"a":1,"why":"Multiplying numerator and denominator by 2 gives −4/18."},{"q":"Complete: 7/10 = 21/x. What is x?","o":["20","30","40","70"],"a":1,"why":"The numerator is multiplied by 3, so the denominator is 10 × 3 = 30."},{"q":"Which fraction is equivalent to 6/11?","o":["12/22","18/22","6/22","11/6"],"a":0,"why":"Multiplying the numerator and denominator by 2 gives 12/22."},{"q":"Find x if 5/8 = x/40.","o":["20","25","30","32"],"a":1,"why":"The denominator is multiplied by 5, so the numerator is 5 × 5 = 25."},{"q":"Which fraction is equivalent to −7/12 with denominator 60?","o":["−28/60","−35/60","35/60","−42/60"],"a":1,"why":"Since 12 × 5 = 60, multiply the numerator by 5 too: −7 × 5 = −35."},{"q":"Find x: 9/15 = 3/x.","o":["3","5","9","15"],"a":1,"why":"Reducing 9/15 by dividing both terms by 3 gives 3/5, so x = 5."},{"q":"Which fraction is NOT equivalent to 4/9?","o":["8/18","12/27","16/36","12/18"],"a":3,"why":"12/18 reduces to 2/3, which is different from 4/9. The other three reduce to 4/9."},{"q":"A fraction equivalent to 2/7 has numerator 10. What is its denominator?","o":["14","21","28","35"],"a":3,"why":"The numerator is multiplied by 5, so multiply the denominator by 5 as well: 7 × 5 = 35."},{"q":"Reduce 24/36 to its lowest terms.","o":["2/3","3/2","4/9","6/8"],"a":0,"why":"The greatest common divisor of 24 and 36 is 12. Dividing both terms by 12 gives 2/3."},{"q":"Which equality is correct?","o":["2/3 = 8/15","3/5 = 12/25","4/7 = 12/21","5/8 = 10/24"],"a":2,"why":"12/21 reduces by dividing both terms by 3, giving 4/7."},{"q":"Find x if −4/9 = x/27.","o":["−12","12","−9","9"],"a":0,"why":"The denominator is multiplied by 3, so x = −4 × 3 = −12."},{"q":"Which denominator makes 7/8 = 35/x true?","o":["32","40","48","56"],"a":1,"why":"The numerator 7 is multiplied by 5 to make 35, so x = 8 × 5 = 40."},{"q":"An equivalent form of 11/13 has numerator 33. What is its denominator?","o":["26","39","13","52"],"a":1,"why":"The numerator is multiplied by 3, so the denominator is 13 × 3 = 39."},{"q":"If 6/x = 18/24, find x.","o":["6","8","12","18"],"a":1,"why":"18/24 reduces to 3/4. Solving 6/x = 3/4 gives 24 = 3x, so x = 8."},{"q":"A recipe needs 3/4 cup of flour. Which fraction expresses the same amount in twelfths?","o":["6/12","8/12","9/12","10/12"],"a":2,"why":"Since 4 × 3 = 12, multiply the numerator by 3 too: 3/4 = 9/12."},{"q":"Which fraction is equivalent to −5/6 and has denominator 42?","o":["−30/42","−35/42","35/42","−25/42"],"a":1,"why":"Multiply numerator and denominator by 7: −5/6 = −35/42."},{"q":"If 14/21 = 2/x, what is x?","o":["2","3","6","7"],"a":1,"why":"14/21 reduces to 2/3, so 2/x = 2/3 and x = 3."},{"q":"Which statement about equivalent rational numbers is always true when the multiplier is non-zero?","o":["Adding the same number to both terms preserves value","Multiplying numerator and denominator by the same integer preserves value","Changing only the denominator preserves value","Negating only the denominator preserves value"],"a":1,"why":"Multiplying both numerator and denominator by the same non-zero integer scales both by the same factor, leaving the ratio unchanged."},{"q":"A student changes 3/8 to 6/16. What operation did they apply?","o":["Added 3 to both terms","Multiplied both terms by 2","Multiplied only the numerator by 2","Divided both terms by 2"],"a":1,"why":"3 × 2 = 6 and 8 × 2 = 16, so both numerator and denominator were multiplied by 2."},{"q":"Find x if 15/25 = x/100.","o":["30","40","50","60"],"a":3,"why":"15/25 reduces to 3/5. Therefore x/100 = 3/5, giving x = 60."},{"q":"Which fraction is equivalent to 7/9 and has denominator 63?","o":["21/63","35/63","49/63","56/63"],"a":2,"why":"Multiply numerator and denominator by 7 to get 49/63."},{"q":"If x/32 = −3/8, what is x?","o":["−12","12","−8","8"],"a":0,"why":"Since 8 × 4 = 32, multiply the numerator by 4 too: x = −3 × 4 = −12."},{"q":"Which pair contains equivalent rational numbers with positive denominators?","o":["−2/5 and 4/10","3/7 and 9/21","−4/9 and −12/25","5/6 and 15/17"],"a":1,"why":"9/21 reduces to 3/7 by dividing numerator and denominator by 3. The other pairs have unequal values."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 while($('options').firstChild)$('options').removeChild($('options').firstChild);
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.appendChild(letter);b.appendChild(label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Large Numbers Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261104-physics-path-layout-v2" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 while($('finishSlot').firstChild)$('finishSlot').removeChild($('finishSlot').firstChild);$('finishSlot').appendChild(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';while($('finishSlot').firstChild)$('finishSlot').removeChild($('finishSlot').firstChild);render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
