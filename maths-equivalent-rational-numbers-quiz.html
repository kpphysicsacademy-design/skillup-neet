<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Which fraction is equivalent to 2/3?","o":["4/9","6/9","2/6","3/2"],"a":1,"e":"Multiply numerator and denominator by 3 to get 6/9.","v":"equivalent-rational-numbers"},{"d":"BASIC","q":"Which fraction is equivalent to −3/5?","o":["6/10","−6/10","−3/10","3/10"],"a":1,"e":"Multiplying both numerator and denominator by 2 preserves the value −3/5.","v":"equivalent-rational-numbers"},{"d":"BASIC","q":"Complete: 4/7 = □/21.","o":["8","12","14","28"],"a":1,"e":"The denominator is multiplied by 3, so multiply the numerator by 3 as well.","v":"equivalent-rational-numbers"},{"d":"BASIC","q":"Which pair represents equivalent rational numbers?","o":["2/5 and 4/15","3/4 and 9/12","−1/2 and 1/2","5/6 and 5/12"],"a":1,"e":"9/12 simplifies by dividing numerator and denominator by 3 to 3/4.","v":"equivalent-rational-numbers"},{"d":"BASIC","q":"Which fraction is equivalent to 5/8?","o":["10/16","10/12","15/32","5/16"],"a":0,"e":"Multiplying both terms by 2 gives 10/16.","v":"equivalent-rational-numbers"},{"d":"BASIC","q":"If 3/4 = 12/x, what is x?","o":["9","12","16","18"],"a":2,"e":"Since 3 is multiplied by 4 to get 12, multiply 4 by 4 to get 16.","v":"equivalent-rational-numbers"},{"d":"BASIC","q":"Which is equivalent to 0?","o":["0/9","9/0","1/0","0/0"],"a":0,"e":"Zero divided by a non-zero denominator equals zero.","v":"equivalent-rational-numbers"},{"d":"BASIC","q":"Which fraction is equivalent to −2/9?","o":["2/9","−4/18","−2/18","4/9"],"a":1,"e":"Multiplying numerator and denominator by 2 gives −4/18.","v":"equivalent-rational-numbers"},{"d":"BASIC","q":"Fill in: 7/10 = 21/□.","o":["20","30","40","70"],"a":1,"e":"The numerator is multiplied by 3, so the denominator is also multiplied by 3.","v":"equivalent-rational-numbers"},{"d":"BASIC","q":"Which fraction is equivalent to 6/11?","o":["12/22","18/22","6/22","11/6"],"a":0,"e":"Multiplying both terms by 2 gives 12/22.","v":"equivalent-rational-numbers"},{"d":"MEDIUM","q":"Find x if 5/8 = x/40.","o":["20","25","30","32"],"a":1,"e":"The denominator is multiplied by 5, so x = 5 × 5 = 25.","v":"equivalent-rational-numbers"},{"d":"MEDIUM","q":"Which fraction is equivalent to −7/12 with denominator 60?","o":["−28/60","−35/60","35/60","−42/60"],"a":1,"e":"Multiply numerator and denominator by 5.","v":"equivalent-rational-numbers"},{"d":"MEDIUM","q":"Find x: 9/15 = 3/x.","o":["3","5","9","15"],"a":1,"e":"Reduce 9/15 to 3/5, so x = 5.","v":"equivalent-rational-numbers"},{"d":"MEDIUM","q":"Which fraction is NOT equivalent to 4/9?","o":["8/18","12/27","16/36","12/18"],"a":3,"e":"12/18 simplifies to 2/3, not 4/9.","v":"equivalent-rational-numbers"},{"d":"MEDIUM","q":"A fraction equivalent to 2/7 has numerator 10. What is its denominator?","o":["14","21","28","35"],"a":3,"e":"The numerator is multiplied by 5, so the denominator is 7 × 5 = 35.","v":"equivalent-rational-numbers"},{"d":"MEDIUM","q":"Simplify the equivalent fraction 24/36 to its lowest terms.","o":["2/3","3/2","4/6","6/9"],"a":0,"e":"Divide numerator and denominator by 12 to get 2/3.","v":"equivalent-rational-numbers"},{"d":"MEDIUM","q":"Which comparison is correct?","o":["2/3 = 8/15","3/5 = 12/20","4/7 = 12/21","5/8 = 10/24"],"a":2,"e":"12/21 simplifies to 4/7.","v":"equivalent-rational-numbers"},{"d":"MEDIUM","q":"Find x if −4/9 = x/27.","o":["−12","12","−9","9"],"a":0,"e":"The denominator is multiplied by 3, so the numerator becomes −4 × 3 = −12.","v":"equivalent-rational-numbers"},{"d":"MEDIUM","q":"Which denominator makes 7/8 = 35/x true?","o":["32","40","48","56"],"a":1,"e":"The numerator is multiplied by 5, so the denominator is 8 × 5 = 40.","v":"equivalent-rational-numbers"},{"d":"MEDIUM","q":"Which fraction is equivalent to 11/13 with numerator 33?","o":["33/26","33/39","33/13","33/52"],"a":1,"e":"Multiply numerator and denominator by 3 to get 33/39.","v":"equivalent-rational-numbers"},{"d":"HARD","q":"If 6/ x = 18/24, find x.","o":["6","8","12","18"],"a":1,"e":"18/24 simplifies to 3/4; 6/x = 3/4 gives 24 = 3x, so x = 8.","v":"equivalent-rational-numbers"},{"d":"HARD","q":"A recipe uses 3/4 cup of flour. Which fraction expresses the same amount in twelfths?","o":["6/12","8/12","9/12","10/12"],"a":2,"e":"Multiply numerator and denominator by 3 to obtain 9/12.","v":"equivalent-rational-numbers"},{"d":"HARD","q":"Which fraction is equivalent to −5/6 and has denominator 42?","o":["−30/42","−35/42","35/42","−25/42"],"a":1,"e":"Multiply numerator and denominator by 7.","v":"equivalent-rational-numbers"},{"d":"HARD","q":"If 14/21 = 2/x, what is x?","o":["2","3","6","7"],"a":1,"e":"14/21 reduces to 2/3, so x = 3.","v":"equivalent-rational-numbers"},{"d":"HARD","q":"Which statement about equivalent fractions is always true?","o":["Adding the same number to numerator and denominator preserves value","Multiplying numerator and denominator by the same non-zero integer preserves value","Changing only the denominator preserves value","Negating only the denominator preserves value"],"a":1,"e":"Multiplying both parts by the same non-zero integer leaves the ratio unchanged.","v":"equivalent-rational-numbers"},{"d":"HARD","q":"A student changes 3/8 to 6/16. What operation did they apply?","o":["Added 3 to both terms","Multiplied both terms by 2","Multiplied numerator by 2 only","Divided both terms by 2"],"a":1,"e":"Both numerator and denominator were multiplied by 2.","v":"equivalent-rational-numbers"},{"d":"HARD","q":"Find x if 15/25 = x/100.","o":["30","40","50","60"],"a":3,"e":"15/25 = 3/5, so x/100 = 3/5 gives x = 60.","v":"equivalent-rational-numbers"},{"d":"HARD","q":"Which fraction is equivalent to 7/9 and has denominator 63?","o":["21/63","35/63","49/63","56/63"],"a":2,"e":"Multiply numerator and denominator by 7 to obtain 49/63.","v":"equivalent-rational-numbers"},{"d":"HARD","q":"If x/32 = −3/8, what is x?","o":["−12","12","−8","8"],"a":0,"e":"Since 8 × 4 = 32, multiply −3 by 4 to get −12.","v":"equivalent-rational-numbers"},{"d":"HARD","q":"Which pair are equivalent and already written with positive denominators?","o":["−2/5 and 4/10","3/7 and 9/21","−4/9 and −12/27","All of these"],"a":3,"e":"Each pair has equal values and positive denominators.","v":"equivalent-rational-numbers"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Multiply positive and negative integers</strong><small>Apply sign rules to integer products</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Solve multiplication word problems</strong><small>Reason with signs and products</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply ruler-and-compass reasoning</strong><small>Use accurate integer multiplication methods</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
