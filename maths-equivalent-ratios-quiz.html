(function(){'use strict';const questions=[{"d":"BASIC","q":"Which ratio is equivalent to 3:4?","o":["6:8","6:7","9:8","4:3"],"a":0,"e":"Multiply both terms by 2.","v":"equivalent-ratios"},{"d":"BASIC","q":"2:5 = 4: □","o":["7","8","10","12"],"a":2,"e":"The first term doubles, so double the second term.","v":"equivalent-ratios"},{"d":"BASIC","q":"Which is not equivalent to 1:3?","o":["2:6","3:9","4:12","3:8"],"a":3,"e":"Simplify each ratio to compare.","v":"equivalent-ratios"},{"d":"BASIC","q":"Simplify 12:16.","o":["2:3","3:4","4:3","6:8"],"a":1,"e":"Divide both terms by their greatest common factor.","v":"equivalent-ratios"},{"d":"BASIC","q":"Multiply both terms of 5:7 by 3.","o":["8:10","15:21","15:7","5:21"],"a":1,"e":"Multiply each term by the same number.","v":"equivalent-ratios"},{"d":"BASIC","q":"Which is equivalent to 4:9?","o":["8:18","8:9","4:18","9:4"],"a":0,"e":"Use the same scale factor for both terms.","v":"equivalent-ratios"},{"d":"BASIC","q":"6:10 = 3: □","o":["3","4","5","6"],"a":2,"e":"Reduce both terms by the same factor.","v":"equivalent-ratios"},{"d":"BASIC","q":"Which pair is equivalent?","o":["2:5 and 4:10","3:4 and 6:10","1:2 and 2:5","5:6 and 10:18"],"a":0,"e":"Simplify the second ratio in each pair.","v":"equivalent-ratios"},{"d":"BASIC","q":"Simplify 15:25.","o":["3:5","5:3","1:5","5:10"],"a":0,"e":"Divide both terms by 5.","v":"equivalent-ratios"},{"d":"BASIC","q":"Multiply both terms of 7:8 by 5.","o":["12:13","35:40","35:8","7:40"],"a":1,"e":"Apply the factor to both terms.","v":"equivalent-ratios"},{"d":"MEDIUM","q":"4:7 = 20:x. Find x.","o":["28","30","35","40"],"a":2,"e":"The first term is multiplied by 5.","v":"equivalent-ratios"},{"d":"MEDIUM","q":"Simplify 18:24.","o":["2:3","3:4","4:3","6:8"],"a":1,"e":"Divide both terms by 6.","v":"equivalent-ratios"},{"d":"MEDIUM","q":"Which ratio scales 5:2 by 2?","o":["10:4","10:5","15:4","5:4"],"a":0,"e":"Multiply both terms by 2.","v":"equivalent-ratios"},{"d":"MEDIUM","q":"9:12 = x:4. Find atios"},{"d":"HARD","q":"A 3 cm by 5 cm photo is enlarged by a scale factor of 4. What are the dimensions?","o":["7 by 9 cm","12 by 20 cm","12 by 5 cm","3 by 20 cm"],"a":1,"e":"Scale both dimensions by 4.","v":"equivalent-ratios"},{"d":"HARD","q":"24:36 = 2:x. Find x.","o":["2","3","4","6"],"a":1,"e":"Reduce 24:36 to simplest form.","v":"equivalent-ratios"},{"d":"HARD","q":"Teachers:students = 4:72. An equivalent ratio has 126 students. How many teachers?","o":["4","6","7","8"],"a":2,"e":"Find the scale factor from 72 to 126.","v":"equivalent-ratios"},{"d":"HARD","q":"Length:width = 7:4. A rectangle's perimeter is 66 cm. Find its length.","o":["14 cm","21 cm","28 cm","35 cm"],"a":1,"e":"The dimensions total 11 equal parts; perimeter is twice that total.","v":"equivalent-ratios"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Recognise and generate equivalent ratios</strong><small>Scale both terms by the same factor</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Find missing terms in equivalent ratios</strong><small>Compare equivalent ratio forms</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply equivalent ratios to scale and proportion problems</strong><small>Apply rectangle area in real life</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
