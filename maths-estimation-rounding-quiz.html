<script>
(function(){
'use strict';
const questions=[{"q":"Round 24 to the nearest ten.","o":["20","24","30","40"],"a":0,"why":"The ones digit is 4, so round down to 20."},{"q":"Round 67 to the nearest ten.","o":["60","65","70","100"],"a":2,"why":"The ones digit is 7, so round up to 70."},{"q":"Round 341 to the nearest hundred.","o":["300","340","400","500"],"a":0,"why":"The tens digit is 4, so 341 rounds down to 300."},{"q":"Round 786 to the nearest hundred.","o":["700","780","800","900"],"a":2,"why":"The tens digit is 8, so round up to 800."},{"q":"Round 2,413 to the nearest thousand.","o":["2,000","2,400","2,500","3,000"],"a":0,"why":"The hundreds digit is 4, so round down to 2,000."},{"q":"Round 5,782 to the nearest ten.","o":["5,780","5,790","5,700","5,800"],"a":0,"why":"The ones digit is 2, so keep the tens digit unchanged: 5,780."},{"q":"What is 398 rounded to the nearest hundred?","o":["300","350","400","500"],"a":2,"why":"The tens digit is 9, so 398 rounds up to 400."},{"q":"Round 6,249 to the nearest thousand.","o":["6,000","6,200","6,500","7,000"],"a":0,"why":"The hundreds digit is 2, so round down to 6,000."},{"q":"Which is closest to 51 when rounded to the nearest ten?","o":["40","50","60","100"],"a":1,"why":"51 is closer to 50 than to 60."},{"q":"Round 9,950 to the nearest hundred.","o":["9,900","9,950","10,000","9,000"],"a":2,"why":"The tens digit is 5, so round 9,950 up to 10,000."},{"q":"Estimate 192 + 307 by rounding each number to the nearest hundred.","o":["400","500","600","700"],"a":1,"why":"192 ≈ 200 and 307 ≈ 300. So the estimate is 200 + 300 = 500."},{"q":"Estimate 684 − 219 by rounding each number to the nearest hundred.","o":["300","400","500","600"],"a":2,"why":"684 ≈ 700 and 219 ≈ 200. So 700 − 200 = 500."},{"q":"A bag costs ₹497. About how much is it to the nearest hundred?","o":["₹400","₹450","₹500","₹600"],"a":2,"why":"₹497 rounds to ₹500 because the tens digit is 9."},{"q":"Round 38,642 to the nearest thousand.","o":["38,000","38,600","39,000","40,000"],"a":2,"why":"The hundreds digit is 6, so 38,642 rounds up to 39,000."},{"q":"Estimate 48 × 19 by rounding to the nearest ten.","o":["700","800","900","1,000"],"a":3,"why":"48 ≈ 50 and 19 ≈ 20. Then 50 × 20 = 1,000."},{"q":"Estimate 1,204 + 2,781 by rounding both numbers to the nearest thousand.","o":["3,000","4,000","5,000","6,000"],"a":1,"why":"1,204 ≈ 1,000 and 2,781 ≈ 3,000. Total ≈ 4,000."},{"q":"Round 76,549 to the nearest ten thousand.","o":["70,000","75,000","80,000","77,000"],"a":2,"why":"The thousands digit is 6, so round 70,000 up to 80,000."},{"q":"Which is the best estimate for 2,965 + 4,112 to the nearest thousand?","o":["6,000","7,000","8,000","9,000"],"a":1,"why":"2,965 ≈ 3,000 and 4,112 ≈ 4,000, giving about 7,000."},{"q":"Estimate 803 − 397 by rounding to the nearest hundred.","o":["300","400","500","600"],"a":1,"why":"803 ≈ 800 and 397 ≈ 400. The estimate is 400."},{"q":"Round 149,501 to the nearest ten thousand.","o":["140,000","145,000","150,000","160,000"],"a":2,"why":"The thousands digit is 9, so 149,501 rounds up to 150,000."},{"q":"Estimate 398 + 1,603 + 2,412 by rounding each number to the nearest hundred.","o":["4,000","4,300","4,400","4,500"],"a":2,"why":"398 ≈ 400, 1,603 ≈ 1,600, and 2,412 ≈ 2,400. Total ≈ 4,400."},{"q":"A school has 1,986 students and another has 2,147. Estimate the total to the nearest thousand for each school.","o":["3,000","4,000","5,000","6,000"],"a":1,"why":"1,986 ≈ 2,000 and 2,147 ≈ 2,000. The estimated total is 4,000."},{"q":"Estimate 6,048 ÷ 29 by rounding to convenient numbers.","o":["100","200","300","400"],"a":1,"why":"6,048 is about 6,000 and 29 is about 30. 6,000 ÷ 30 = 200."},{"q":"A shop sells 198 pencils each day for 6 days. Estimate the number sold by rounding 198 to the nearest hundred.","o":["600","900","1,200","1,800"],"a":2,"why":"198 rounds to 200. Then 200 × 6 = 1,200 pencils."},{"q":"Which is the best estimate of 5,892 − 2,146 when rounding to the nearest thousand?","o":["2,000","3,000","4,000","5,000"],"a":2,"why":"5,892 ≈ 6,000 and 2,146 ≈ 2,000. The estimate is 4,000."},{"q":"A trip is 287 km each way. Estimate the round-trip distance by rounding to the nearest hundred.","o":["400 km","500 km","600 km","700 km"],"a":2,"why":"287 km ≈ 300 km. For two ways, 300 × 2 = 600 km."},{"q":"Estimate 39 × 62 by rounding each factor to the nearest ten.","o":["1,800","2,000","2,400","3,000"],"a":2,"why":"39 ≈ 40 and 62 ≈ 60. Then 40 × 60 = 2,400."},{"q":"A library has 3,487 books and receives 1,526 more. Estimate the total to the nearest thousand.","o":["4,000","5,000","6,000","7,000"],"a":1,"why":"3,487 ≈ 3,000 and 1,526 ≈ 2,000. The estimated total is 5,000."},{"q":"A number rounds to 7,500 to the nearest hundred. Which number could it be?","o":["7,449","7,451","7,550","7,601"],"a":1,"why":"Numbers from 7,450 through 7,549 round to 7,500. So 7,451 works."},{"q":"A stadium holds 18,760 people. Estimate attendance to the nearest ten thousand.","o":["10,000","15,000","20,000","30,000"],"a":2,"why":"The thousands digit is 8, so 18,760 rounds up to 20,000."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Estimation and Rounding Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-large-numbers-line-symmetry-layout-v2" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>


<script>
(()=>{const b=document.getElementById('home-menu-toggle'),p=document.getElementById('home-menu-panel');if(!b||!p)return;const close=()=>{p.hidden=true;b.setAttribute('aria-expanded','false')};b.addEventListener('click',()=>{const open=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',String(open));p.hidden=!open});document.addEventListener('click',e=>{if(!e.target.closest('.home-menu'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();b.focus()}});})();
</script>
