<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Estimation and Rounding Quiz | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--panel2:#263c5b;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.hearts,.xp{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}h1{font-size:clamp(1.65rem,6vw,2.2rem);line-height:1.15;margin:10px 0 16px}.question{font-size:1.2rem;font-weight:800;margin:8px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.mascot{font-size:3.2rem}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.hide{display:none!important}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.hearts,.xp{font-size:.74rem;padding:5px 7px}.actions{align-items:stretch}.actions button{flex:1}.hint{align-self:center}}
</style>
</head>
<body><div class="wrap">
<header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="hearts" id="hearts">❤️ 5</div><div class="xp" id="xp">⭐ 0 XP</div></header>
<div class="meta"><span id="counter">QUESTION 1 OF 10</span><span>🎯 Quick practice</span></div>
<main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Estimation and rounding</div><div id="content"><h1>Ready to round? 🔢</h1><p>Choose an answer, get instant feedback, and build your number skills one question at a time.</p></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">10 quick questions</span><button class="primary" id="action" type="button">Let's go →</button></div></section></main>
</div>
<script>
(function(){
'use strict';
const questions=[
{q:"Round 347 to the nearest ten.",o:["340","350","300","400"],a:1,e:"The ones digit is 7, so increase the tens digit. 347 rounds to 350."},
{q:"Round 682 to the nearest hundred.",o:["600","680","700","800"],a:2,e:"The tens digit is 8, so round the hundreds digit up. 682 rounds to 700."},
{q:"Round 4,261 to the nearest thousand.",o:["4,000","4,200","4,300","5,000"],a:0,e:"The hundreds digit is 2, which is less than 5. Keep 4 thousand."},
{q:"Which is the best estimate of 198 + 304, rounding to the nearest hundred first?",o:["300","400","500","600"],a:2,e:"198 rounds to 200 and 304 rounds to 300. Then 200 + 300 = 500."},
{q:"Round 7,856 to the nearest ten.",o:["7,850","7,860","7,800","7,900"],a:1,e:"The ones digit is 6, so round the tens place up: 7,856 → 7,860."},
{q:"Round 12,449 to the nearest thousand.",o:["12,000","12,400","12,500","13,000"],a:0,e:"The hundreds digit is 4, so round down to 12,000."},
{q:"Estimate 612 − 289 by rounding both numbers to the nearest hundred.",o:["200","300","400","500"],a:1,e:"612 rounds to 600 and 289 rounds to 300. Then 600 − 300 = 300."},
{q:"A book costs ₹497. About how much is that to the nearest hundred?",o:["₹400","₹450","₹500","₹600"],a:2,e:"The tens digit is 9, so ₹497 rounds up to ₹500."},
{q:"Round 2,650 to the nearest hundred.",o:["2,600","2,650","2,700","3,000"],a:2,e:"The tens digit is 5, so round the hundreds place up to 2,700."},
{q:"Estimate 49 × 21 by rounding to the nearest ten first.",o:["500","900","1,000","1,500"],a:2,e:"49 rounds to 50 and 21 rounds to 20. Then 50 × 20 = 1,000."}
];
let started=false,index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0;
const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');
function updateProgress(){const p=started?index/questions.length*100:0;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}
function renderQuestion(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent='Question '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>selectAnswer(Number(b.dataset.i))));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}
function selectAnswer(i){if(locked)return;selected=i;$('content').querySelectorAll('.choice').forEach((b,j)=>{b.classList.toggle('selected',j===i);});$('action').disabled=false;}
function checkAnswer(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});const f=$('feedback');f.textContent=(good?'✨ Great job! ':'💡 Keep going! ')+q.e;f.className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Learn from this one';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;renderQuestion();return;}showResults();}
function showResults(){bar.style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can try again anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div class="mascot">'+(correct>=8?'🏆':correct>=5?'🌟':'💪')+'</div><h1>'+(correct>=8?'Amazing work!':correct>=5?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><p>Remember: check the digit immediately to the right of the place you are rounding.</p></div>';$('action').textContent='Try again ↻';$('action').disabled=false;}
function start(){started=true;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';renderQuestion();}
$('action').addEventListener('click',()=>{if(!started){start();return;}if(index>=questions.length){start();return;}checkAnswer();});
})();
</script></body></html>
