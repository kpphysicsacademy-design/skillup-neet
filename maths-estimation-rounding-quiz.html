<main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Estimation and rounding</div><div id="content"><h1>Ready to round? 🔢</h1><p>Choose an answer, get instant feedback, and build your number skills one question at a time.</p></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · Basic → Medium → Hard</span><button class="primary" id="action" type="button">Let's go →</button></div></section></main>
</div>
<script>
(function(){
'use strict';
const questions=[
{"d":"BASIC","q":"Round 24 to the nearest ten.","o":["20","24","30","40"],"a":0,"e":"The ones digit is 4, so round down to 20."},
{"d":"BASIC","q":"Round 67 to the nearest ten.","o":["60","65","70","100"],"a":2,"e":"The ones digit is 7, so round up to 70."},
{"d":"BASIC","q":"Round 341 to the nearest hundred.","o":["300","340","400","500"],"a":0,"e":"The tens digit is 4, so 341 rounds down to 300."},
{"d":"BASIC","q":"Round 786 to the nearest hundred.","o":["700","780","800","900"],"a":2,"e":"The tens digit is 8, so round up to 800."},
{"d":"BASIC","q":"Round 2,413 to the nearest thousand.","o":["2,000","2,400","2,500","3,000"],"a":0,"e":"The hundreds digit is 4, so round down to 2,000."},
{"d":"BASIC","q":"Round 5,782 to the nearest ten.","o":["5,780","5,790","5,700","5,800"],"a":0,"e":"The ones digit is 2, so keep the tens digit unchanged: 5,780."},
{"d":"BASIC","q":"What is 398 rounded to the nearest hundred?","o":["300","350","400","500"],"a":2,"e":"The tens digit is 9, so 398 rounds up to 400."},
{"d":"BASIC","q":"Round 6,249 to the nearest thousand.","o":["6,000","6,200","6,500","7,000"],"a":0,"e":"The hundreds digit is 2, so round down to 6,000."},
{"d":"BASIC","q":"Which is closest to 51 when rounded to the nearest ten?","o":["40","50","60","100"],"a":1,"e":"51 is closer to 50 than to 60."},
{"d":"BASIC","q":"Round 9,950 to the nearest hundred.","o":["9,900","9,950","10,000","9,000"],"a":2,"e":"The tens digit is 5, so round 9,950 up to 10,000."},
{"d":"MEDIUM","q":"Estimate 192 + 307 by rounding each number to the nearest hundred.","o":["400","500","600","700"],"a":1,"e":"192 ≈ 200 and 307 ≈ 300. So the estimate is 200 + 300 = 500."},
{"d":"MEDIUM","q":"Estimate 684 − 219 by rounding each number to the nearest hundred.","o":["300","400","500","600"],"a":2,"e":"684 ≈ 700 and 219 ≈ 200. So 700 − 200 = 500."},
{"d":"MEDIUM","q":"A bag costs ₹497. About how much is it to the nearest hundred?","o":["₹400","₹450","₹500","₹600"],"a":2,"e":"₹497 rounds to ₹500 because the tens digit is 9."},
{"d":"MEDIUM","q":"Round 38,642 to the nearest thousand.","o":["38,000","38,600","39,000","40,000"],"a":2,"e":"The hundreds digit is 6, so 38,642 rounds up to 39,000."},
{"d":"MEDIUM","q":"Estimate 48 × 19 by rounding to the nearest ten.","o":["700","800","900","1,000"],"a":3,"e":"48 ≈ 50 and 19 ≈ 20. Then 50 × 20 = 1,000."},
{"d":"MEDIUM","q":"Estimate 1,204 + 2,781 by rounding both numbers to the nearest thousand.","o":["3,000","4,000","5,000","6,000"],"a":1,"e":"1,204 ≈ 1,000 and 2,781 ≈ 3,000. Total ≈ 4,000."},
{"d":"MEDIUM","q":"Round 76,549 to the nearest ten thousand.","o":["70,000","75,000","80,000","77,000"],"a":2,"e":"The thousands digit is 6, so round 70,000 up to 80,000."},
{"d":"MEDIUM","q":"Which is the best estimate for 2,965 + 4,112 to the nearest thousand?","o":["6,000","7,000","8,000","9,000"],"a":1,"e":"2,965 ≈ 3,000 and 4,112 ≈ 4,000, giving about 7,000."},
{"d":"MEDIUM","q":"Estimate 803 − 397 by rounding to the nearest hundred.","o":["300","400","500","600"],"a":1,"e":"803 ≈ 800 and 397 ≈ 400. The estimate is 400."},
{"d":"MEDIUM","q":"Round 149,501 to the nearest ten thousand.","o":["140,000","145,000","150,000","160,000"],"a":2,"e":"The thousands digit is 9, so 149,501 rounds up to 150,000."},
{"d":"HARD","q":"Estimate 398 + 1,603 + 2,412 by rounding each number to the nearest hundred.","o":["4,000","4,300","4,400","4,500"],"a":2,"e":"398 ≈ 400, 1,603 ≈ 1,600, and 2,412 ≈ 2,400. Total ≈ 4,400."},
{"d":"HARD","q":"A school has 1,986 students and another has 2,147. Estimate the total to the nearest thousand for each school.","o":["3,000","4,000","5,000","6,000"],"a":1,"e":"1,986 ≈ 2,000 and 2,147 ≈ 2,000. The estimated total is 4,000."},
{"d":"HARD","q":"Estimate 6,048 ÷ 29 by rounding to convenient numbers.","o":["100","200","300","400"],"a":1,"e":"6,048 is about 6,000 and 29 is about 30. 6,000 ÷ 30 = 200."},
{"d":"HARD","q":"A shop sells 198 pencils each day for 6 days. Estimate the number sold by rounding 198 to the nearest hundred.","o":["600","900","1,200","1,800"],"a":2,"e":"198 rounds to 200. Then 200 × 6 = 1,200 pencils."},
{"d":"HARD","q":"Which is the best estimate of 5,892 − 2,146 when rounding to the nearest thousand?","o":["2,000","3,000","4,000","5,000"],"a":2,"e":"5,892 ≈ 6,000 and 2,146 ≈ 2,000. The estimate is 4,000."},
{"d":"HARD","q":"A trip is 287 km each way. Estimate the round-trip distance by rounding to the nearest hundred.","o":["400 km","500 km","600 km","700 km"],"a":2,"e":"287 km ≈ 300 km. For two ways, 300 × 2 = 600 km."},
{"d":"HARD","q":"Estimate 39 × 62 by rounding each factor to the nearest ten.","o":["1,800","2,000","2,400","3,000"],"a":2,"e":"39 ≈ 40 and 62 ≈ 60. Then 40 × 60 = 2,400."},
{"d":"HARD","q":"A library has 3,487 books and receives 1,526 more. Estimate the total to the nearest thousand.","o":["4,000","5,000","6,000","7,000"],"a":1,"e":"3,487 ≈ 3,000 and 1,526 ≈ 2,000. The estimated total is 5,000."},
{"d":"HARD","q":"A number rounds to 7,500 to the nearest hundred. Which number could it be?","o":["7,449","7,451","7,550","7,601"],"a":1,"e":"Numbers from 7,450 through 7,549 round to 7,500. So 7,451 works."},
{"d":"HARD","q":"A stadium holds 18,760 people. Estimate attendance to the nearest ten thousand.","o":["10,000","15,000","20,000","30,000"],"a":2,"e":"The thousands digit is 8, so 18,760 rounds up to 20,000."}
];
let started=true,index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;
const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');
function updateProgress(){const p=started?index/questions.length*100:0;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}
function renderQuestion(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>selectAnswer(Number(b.dataset.i))));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}
function selectAnswer(i){if(locked)return;selected=i;$('content').querySelectorAll('.choice').forEach((b,j)=>{b.classList.toggle('selected',j===i);});$('action').disabled=false;}
function checkAnswer(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});const f=$('feedback');f.textContent=(good?'✨ Great job! ':'💡 Keep going! ')+q.e;f.className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Learn from this one';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;renderQuestion();return;}showResults();}
function showResults(){finished=true;bar.style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can try again anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div class="mascot">'+(correct>=8?'🏆':correct>=5?'🌟':'💪')+'</div><h1>'+(correct>=8?'Amazing work!':correct>=5?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🎯</span><div><strong>Rounding numbers</strong><small>Round to tens, hundreds and thousands</small></div></div><div class="skill"><span class="skill-icon">🧠</span><div><strong>Estimating answers</strong><small>Use rounded numbers to calculate quickly</small></div></div><div class="skill"><span class="skill-icon">🛍️</span><div><strong>Real-life estimation</strong><small>Estimate money, distance and quantities</small></div></div></div><p>Remember: check the digit immediately to the right of the place you are rounding.</p></div>';$('action').textContent='Try again ↻';$('action').disabled=false;}
function start(){started=true;finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';renderQuestion();}
$('action').addEventListener('click',()=>{if(finished){start();return;}checkAnswer();});
renderQuestion();
})();
</script>
