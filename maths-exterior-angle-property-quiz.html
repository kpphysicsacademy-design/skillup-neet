<main>
<section class="hero">
<h1>Exterior Angle Property of a Triangle</h1>
<p class="muted">Remote interior angles · Exterior angles · Angle equations</p>

<div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div>
<div class="track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
</section>
<section class="quiz" id="quiz">
<div class="qmeta" id="qmeta">QUESTION 1</div>
<h2 class="question" id="question"></h2>
<div class="options" id="options"></div>
<div class="feedback" id="feedback" aria-live="polite"></div>
<div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div>
</section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[{"q":"An exterior angle of a triangle is 120°. One remote interior angle is 50°. Find the other remote interior angle.","o":["50°","60°","70°","80°"],"a":2,"why":"An exterior angle equals the sum of the two remote interior angles, so the missing angle is 120° − 50° = 70°."},{"q":"An exterior angle of a triangle is 105°. One remote interior angle is 45°. Find the other.","o":["50°","60°","70°","75°"],"a":1,"why":"The remote interior angles sum to the exterior angle: 105° − 45° = 60°."},{"q":"Which statement describes the exterior angle property?","o":["An exterior angle equals the sum of the two remote interior angles","An exterior angle equals every interior angle","An exterior angle is always 90°","An exterior angle is half the adjacent interior angle"],"a":0,"why":"The exterior angle equals the sum of the two non-adjacent interior angles."},{"q":"An interior angle adjacent to an exterior angle is 65°. Find the exterior angle.","o":["65°","105°","115°","125°"],"a":2,"why":"They form a linear pair, so the exterior angle is 180° − 65° = 115°."},{"q":"A triangle has remote interior angles 35° and 75°. Find the exterior angle at the third vertex.","o":["100°","110°","120°","130°"],"a":1,"why":"The exterior angle is 35° + 75° = 110°."},{"q":"An exterior angle is 140°. One remote interior angle is 80°. Find the other.","o":["50°","60°","70°","80°"],"a":1,"why":"The other remote interior angle is 140° − 80° = 60°."},{"q":"A triangle’s exterior angle is 90°. Its two remote interior angles are equal. Find each.","o":["30°","45°","60°","90°"],"a":1,"why":"The two equal angles sum to 90°, so each is 45°."},{"q":"If an exterior angle is 125° and its adjacent interior angle is x°, find x.","o":["45°","55°","65°","75°"],"a":1,"why":"Adjacent interior and exterior angles sum to 180°, so x = 55°."},{"q":"Remote interior angles are 42° and 58°. What is the exterior angle?","o":["90°","100°","110°","120°"],"a":1,"why":"The exterior angle is the sum 42° + 58° = 100°."},{"q":"An exterior angle is 150°. One remote interior angle is 90°. Find the other.","o":["40°","50°","60°","70°"],"a":2,"why":"The other remote angle is 150° − 90° = 60°."},{"q":"An exterior angle is (3x + 10)° and remote interior angles are 70° and 60°. Find x.","o":["30","35","40","45"],"a":2,"why":"3x + 10 = 70 + 60 = 130, so 3x = 120 and x = 40."},{"q":"An exterior angle is 4x°. Its remote interior angles are 50° and 70°. Find x.","o":["20","25","30","35"],"a":2,"why":"4x = 50 + 70 = 120, so x = 30."},{"q":"An exterior angle is (2x + 20)°. Its adjacent interior angle is (x + 10)°. Find x.","o":["40","45","50","60"],"a":2,"why":"2x + 20 + x + 10 = 180, so 3x = 150 and x = 50."},{"q":"Remote interior angles are (x + 15)° and (2x + 5)°. The exterior angle is 110°. Find x.","o":["20","25","30","35"],"a":2,"why":"(x + 15) + (2x + 5) = 110, so 3x = 90 and x = 30."},{"q":"An exterior angle is 3 times one remote interior angle. The other remote interior angle is 40°, and the first is x°. Find x.","o":["15°","20°","25°","30°"],"a":1,"why":"3x = x + 40, so 2x = 40 and x = 20°."},{"q":"An exterior angle is 128°. Its remote interior angles are in ratio 3:5. Find the smaller angle.","o":["36°","48°","60°","80°"],"a":1,"why":"Eight ratio parts equal 128°, so one part is 16°; the smaller is 3 × 16° = 48°."},{"q":"A triangle’s exterior angle is 135°. Its remote interior angles are (x + 15)° and (2x)°. Find x.","o":["30","35","40","45"],"a":2,"why":"3x + 15 = 135 gives 3x = 120 and x = 40."},{"q":"An exterior angle is 4x − 10 degrees. The remote interior angles are 2x° and 50°. Find x.","o":["20","25","30","35"],"a":2,"why":"4x − 10 = 2x + 50, so 2x = 60 and x = 30."},{"q":"The exterior angle is 120°. One remote interior angle is twice the other. Find the smaller angle.","o":["30°","40°","50°","60°"],"a":1,"why":"Let the smaller be x: x + 2x = 120°, so x = 40°."},{"q":"An exterior angle of a triangle is 145°. Find its adjacent interior angle.","o":["25°","35°","45°","55°"],"a":1,"why":"The adjacent interior angle is supplementary: 180° − 145° = 35°."},{"q":"An exterior angle is (5x − 10)°. Its remote interior angles are (2x + 5)° and (x + 35)°. Find x.","o":["20","25","30","35"],"a":1,"why":"5x − 10 = 3x + 40 gives 2x = 50, so x = 25."},{"q":"An exterior angle is 4x + 8°. Its remote interior angles are 2x° and (x + 10)°. Find x.","o":["2","4","6","8"],"a":1,"why":"4x + 8 = 2x + (x + 10), so x = 2. Correct choice is 2."},{"q":"An exterior angle is 3x + 15 degrees. Its adjacent interior angle is 2x degrees. Find x.","o":["25","30","33","35"],"a":2,"why":"3x + 15 + 2x = 180 gives 5x = 165, so x = 33."},{"q":"Remote interior angles are (2x + 10)° and (3x − 5)°. The exterior angle is 130°. Find the larger remote angle.","o":["45°","60°","70°","75°"],"a":2,"why":"5x + 5 = 130 gives x = 25; the remote angles are 60° and 70°, so the larger is 70°."},{"q":"The exterior angle is 150°. Remote interior angles are in ratio 2:3. Find the larger remote angle.","o":["50°","60°","90°","100°"],"a":2,"why":"Five parts equal 150°, so each part is 30° and the larger angle is 90°."},{"q":"An exterior angle (x + 40)° equals the sum of remote angles (2x − 10)° and 30°. Find x.","o":["10","15","20","25"],"a":2,"why":"x + 40 = (2x − 10) + 30 = 2x + 20, so x = 20."},{"q":"A triangle’s exterior angle is 3 times the adjacent interior angle. Find the exterior angle.","o":["45°","90°","135°","150°"],"a":2,"why":"Let adjacent interior be x; 3x + x = 180, so exterior angle is 135°."},{"q":"An exterior angle is (3x + 20)°. Its remote interior angles are (x + 30)° and (x + 50)°. Find x.","o":["40","50","60","70"],"a":2,"why":"3x + 20 = 2x + 80, so x = 60."},{"q":"An exterior angle is 160°. The remote interior angles differ by 20°. Find the larger remote angle.","o":["70°","80°","90°","100°"],"a":2,"why":"Let larger L and smaller S: L + S = 160, L − S = 20, so L = 90°."},{"q":"An exterior angle is (6x − 15)°. The remote interior angles are (2x + 5)° and (3x − 10)°. Find x.","o":["10","15","20","25"],"a":0,"why":"6x − 15 = (2x + 5) + (3x − 10) = 5x − 5, so x = 10."}];
/* question bank */
const originalQuestions=questions.slice();

let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Exterior Angle Property Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261104-physics-path-layout-v2" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
