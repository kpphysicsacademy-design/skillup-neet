<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"An exterior angle of a triangle is 120°. One remote interior angle is 50°. Find the other remote interior angle.","o":["50°","60°","70°","80°"],"a":2,"e":"An exterior angle equals the sum of the two remote interior angles, so the missing angle is 120° − 50° = 70°.","v":"exterior-angle-property"},{"d":"BASIC","q":"An exterior angle of a triangle is 105°. One remote interior angle is 45°. Find the other.","o":["50°","60°","70°","75°"],"a":1,"e":"The remote interior angles sum to the exterior angle: 105° − 45° = 60°.","v":"exterior-angle-property"},{"d":"BASIC","q":"Which statement describes the exterior angle property?","o":["An exterior angle equals the sum of the two remote interior angles","An exterior angle equals every interior angle","An exterior angle is always 90°","An exterior angle is half the adjacent interior angle"],"a":0,"e":"The exterior angle equals the sum of the two non-adjacent interior angles.","v":"exterior-angle-property"},{"d":"BASIC","q":"An interior angle adjacent to an exterior angle is 65°. Find the exterior angle.","o":["65°","105°","115°","125°"],"a":2,"e":"They form a linear pair, so the exterior angle is 180° − 65° = 115°.","v":"exterior-angle-property"},{"d":"BASIC","q":"A triangle has remote interior angles 35° and 75°. Find the exterior angle at the third vertex.","o":["100°","110°","120°","130°"],"a":1,"e":"The exterior angle is 35° + 75° = 110°.","v":"exterior-angle-property"},{"d":"BASIC","q":"An exterior angle is 140°. One remote interior angle is 80°. Find the other.","o":["50°","60°","70°","80°"],"a":1,"e":"The other remote interior angle is 140° − 80° = 60°.","v":"exterior-angle-property"},{"d":"BASIC","q":"A triangle’s exterior angle is 90°. Its two remote interior angles are equal. Find each.","o":["30°","45°","60°","90°"],"a":1,"e":"The two equal angles sum to 90°, so each is 45°.","v":"exterior-angle-property"},{"d":"BASIC","q":"If an exterior angle is 125° and its adjacent interior angle is x°, find x.","o":["45°","55°","65°","75°"],"a":1,"e":"Adjacent interior and exterior angles sum to 180°, so x = 55°.","v":"exterior-angle-property"},{"d":"BASIC","q":"Remote interior angles are 42° and 58°. What is the exterior angle?","o":["90°","100°","110°","120°"],"a":1,"e":"The exterior angle is the sum 42° + 58° = 100°.","v":"exterior-angle-property"},{"d":"BASIC","q":"An exterior angle is 150°. One remote interior angle is 90°. Find the other.","o":["40°","50°","60°","70°"],"a":2,"e":"The other remote angle is 150° − 90° = 60°.","v":"exterior-angle-property"},{"d":"MEDIUM","q":"An exterior angle is (3x + 10)° and remote interior angles are 70° and 60°. Find x.","o":["30","35","40","45"],"a":2,"e":"3x + 10 = 70 + 60 = 130, so 3x = 120 and x = 40.","v":"exterior-angle-property"},{"d":"MEDIUM","q":"An exterior angle is 4x°. Its remote interior angles are 50° and 70°. Find x.","o":["20","25","30","35"],"a":2,"e":"4x = 50 + 70 = 120, so x = 30.","v":"exterior-angle-property"},{"d":"MEDIUM","q":"An exterior angle is (2x + 20)°. Its adjacent interior angle is (x + 10)°. Find x.","o":["40","45","50","60"],"a":2,"e":"2x + 20 + x + 10 = 180, so 3x = 150 and x = 50.","v":"exterior-angle-property"},{"d":"MEDIUM","q":"Remote interior angles are (x + 15)° and (2x + 5)°. The exterior angle is 110°. Find x.","o":["20","25","30","35"],"a":2,"e":"(x + 15) + (2x + 5) = 110, so 3x = 90 and x = 30.","v":"exterior-angle-property"},{"d":"MEDIUM","q":"An exterior angle is 3 times one remote interior angle. The other remote interior angle is 40°, and the first is x°. Find x.","o":["15°","20°","25°","30°"],"a":1,"e":"3x = x + 40, so 2x = 40 and x = 20°.","v":"exterior-angle-property"},{"d":"MEDIUM","q":"An exterior angle is 128°. Its remote interior angles are in ratio 3:5. Find the smaller angle.","o":["36°","48°","60°","80°"],"a":1,"e":"Eight ratio parts equal 128°, so one part is 16°; the smaller is 3 × 16° = 48°.","v":"exterior-angle-property"},{"d":"MEDIUM","q":"A triangle’s exterior angle is 135°. Its remote interior angles are (x + 15)° and (2x)°. Find x.","o":["30","35","40","45"],"a":2,"e":"3x + 15 = 135 gives 3x = 120 and x = 40.","v":"exterior-angle-property"},{"d":"MEDIUM","q":"An exterior angle is 4x − 10 degrees. The remote interior angles are 2x° and 50°. Find x.","o":["20","25","30","35"],"a":2,"e":"4x − 10 = 2x + 50, so 2x = 60 and x = 30.","v":"exterior-angle-property"},{"d":"MEDIUM","q":"The exterior angle is 120°. One remote interior angle is twice the other. Find the smaller angle.","o":["30°","40°","50°","60°"],"a":1,"e":"Let the smaller be x: x + 2x = 120°, so x = 40°.","v":"exterior-angle-property"},{"d":"MEDIUM","q":"An exterior angle of a triangle is 145°. Find its adjacent interior angle.","o":["25°","35°","45°","55°"],"a":1,"e":"The adjacent interior angle is supplementary: 180° − 145° = 35°.","v":"exterior-angle-property"},{"d":"HARD","q":"An exterior angle is (5x − 10)°. Its remote interior angles are (2x + 5)° and (x + 35)°. Find x.","o":["20","25","30","35"],"a":1,"e":"5x − 10 = 3x + 40 gives 2x = 50, so x = 25.","v":"exterior-angle-property"},{"d":"HARD","q":"An exterior angle is 4x + 8°. Its remote interior angles are 2x° and (x + 10)°. Find x.","o":["2","4","6","8"],"a":1,"e":"4x + 8 = 2x + (x + 10), so x = 2. Correct choice is 2.","v":"exterior-angle-property"},{"d":"HARD","q":"An exterior angle is 3x + 15 degrees. Its adjacent interior angle is 2x degrees. Find x.","o":["25","30","33","35"],"a":2,"e":"3x + 15 + 2x = 180 gives 5x = 165, so x = 33.","v":"exterior-angle-property"},{"d":"HARD","q":"Remote interior angles are (2x + 10)° and (3x − 5)°. The exterior angle is 130°. Find the larger remote angle.","o":["45°","60°","70°","75°"],"a":2,"e":"5x + 5 = 130 gives x = 25; the remote angles are 60° and 70°, so the larger is 70°.","v":"exterior-angle-property"},{"d":"HARD","q":"The exterior angle is 150°. Remote interior angles are in ratio 2:3. Find the larger remote angle.","o":["50°","60°","90°","100°"],"a":2,"e":"Five parts equal 150°, so each part is 30° and the larger angle is 90°.","v":"exterior-angle-property"},{"d":"HARD","q":"An exterior angle (x + 40)° equals the sum of remote angles (2x − 10)° and 30°. Find x.","o":["10","15","20","25"],"a":2,"e":"x + 40 = (2x − 10) + 30 = 2x + 20, so x = 20.","v":"exterior-angle-property"},{"d":"HARD","q":"A triangle’s exterior angle is 3 times the adjacent interior angle. Find the exterior angle.","o":["45°","90°","135°","150°"],"a":2,"e":"Let adjacent interior be x; 3x + x = 180, so exterior angle is 135°.","v":"exterior-angle-property"},{"d":"HARD","q":"An exterior angle is (3x + 20)°. Its remote interior angles are (x + 30)° and (x + 50)°. Find x.","o":["40","50","60","70"],"a":2,"e":"3x + 20 = 2x + 80, so x = 60.","v":"exterior-angle-property"},{"d":"HARD","q":"An exterior angle is 160°. The remote interior angles differ by 20°. Find the larger remote angle.","o":["70°","80°","90°","100°"],"a":2,"e":"Let larger L and smaller S: L + S = 160, L − S = 20, so L = 90°.","v":"exterior-angle-property"},{"d":"HARD","q":"An exterior angle is (6x − 15)°. The remote interior angles are (2x + 5)° and (3x − 10)°. Find x.","o":["10","15","20","25"],"a":0,"e":"6x − 15 = (2x + 5) + (3x − 10) = 5x − 5, so x = 10.","v":"exterior-angle-property"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}const visuals={
balance:'',
blocks:'',
bars:'',
picture:''
};function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🔢</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+'<div class="skill-item '+(correct>=8?'unlocked':'')+'">'+(correct>=8?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Recognise the exterior angle theorem</div>'+'<div class="skill-item '+(correct>=18?'unlocked':'')+'">'+(correct>=18?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Find remote interior and exterior angles</div>'+'<div class="skill-item '+(correct>=24?'unlocked':'')+'">'+(correct>=24?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Solve exterior-angle equations</div>'+'</div></div>' ;$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script>
