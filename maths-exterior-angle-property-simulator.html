<header><div class="nav"><a class="back" href="maths-exterior-angle-property-learn.html?v=20261117-exterior-angle-property-learn-v1" aria-label="Back to brief learn">←</a><div class="brand">SkillUp <span style="color:#58a900">Maths</span></div><a class="pill" href="maths-exterior-angle-property-quiz.html?v=20261117-exterior-angle-property-quiz-architecture-v1">Practice</a></div></header>
<main><h1>Exterior Angle Property Simulator</h1><p class="sub">Change the two remote interior angles and watch the exterior angle update.</p>
<section class="card"><div class="stage"><svg viewBox="0 0 360 245" role="img" aria-label="Interactive triangle with one side extended to show its exterior angle"><path id="shape" class="side" d="M55 190 L270 190 L180 45 Z"/><path id="extension" class="extend" d="M270 190 L330 94"/><path id="arcA" class="arc"/><path id="arcB" class="arc"/><path id="arcE" class="arc"/><text class="vertex" x="39" y="210">A</text><text class="vertex" x="273" y="210">B</text><text class="vertex" x="176" y="34">C</text><text class="vertex" x="333" y="90">D</text><text id="labelA" class="angle-label">35°</text><text id="labelB" class="angle-label">75°</text><text id="labelE" class="angle-label">110°</text></svg></div>
<div class="controls"><div class="control"><label for="a">Angle A</label><input id="a" type="range" min="10" max="100" value="35"><output class="value" id="av">35°</output></div><div class="control"><label for="b">Angle B</label><input id="b" type="range" min="10" max="100" value="75"><output class="value" id="bv">75°</output></div></div>
<div class="total"><div><span>Exterior angle (A + B)</span><strong id="exterior">110°</strong></div><div><span>Adjacent interior angle</span><strong id="adjacent">70°</strong></div></div>
<div class="presets"><button type="button" data-a="35" data-b="75">Example 35° + 75°</button><button type="button" data-a="50" data-b="70">Example 50° + 70°</button><button type="button" data-a="45" data-b="45">Equal remote angles</button><button type="button" data-a="30" data-b="90">Right remote angle</button></div>
<p class="hint" id="explain" aria-live="polite">The exterior angle equals the sum of the two remote interior angles.</p></section>
<div class="actions"><a class="secondary" href="maths-exterior-angle-property-learn.html?v=20261117-exterior-angle-property-learn-v1">📘 Brief Learn</a><a href="maths-exterior-angle-property-quiz.html?v=20261117-exterior-angle-property-quiz-architecture-v1">Start quiz →</a></div></main>
<script>(function(){
const A=document.getElementById('a'),B=document.getElementById('b'),$=id=>document.getElementById(id);
function update(changed){let a=Number(A.value),b=Number(B.value);if(a+b>160){if(changed==='a'){b=160-a;B.value=b;}else{a=160-b;A.value=a;}}const e=a+b,adj=180-e;
const rad=Math.PI/180,base=205,side=base*Math.sin(b*rad)/Math.sin((180-e)*rad);
const ax=55,ay=190,bx=260,by=190,cx=ax+side*Math.cos(a*rad),cy=ay-side*Math.sin(a*rad);
const dx=cx+(cx-bx)*.48,dy=cy+(cy-by)*.48;
$('shape').setAttribute('d',`M ${ax} ${ay} L ${bx} ${by} L ${cx} ${cy} Z`);
$('extension').setAttribute('d',`M ${bx} ${by} L ${dx} ${dy}`);
function arcPath(x,y,r,start,end){const p1={x:x+r*Math.cos(start),y:y+r*Math.sin(start)},p2={x:x+r*Math.cos(end),y:y+r*Math.sin(end)};let delta=end-start;while(delta<0)delta+=Math.PI*2;while(delta>Math.PI*2)delta-=Math.PI*2;return `M ${p1.x} ${p1.y} A ${r} ${r} 0 ${delta>Math.PI?1:0} 1 ${p2.x} ${p2.y}`;}
const angleA=-a*rad,angleB=Math.PI+b*rad;
$('arcA').setAttribute('d',arcPath(ax,ay,23,-Math.PI/2,angleA));
$('arcB').setAttribute('d',arcPath(bx,by,23,Math.PI,Math.PI+b*rad));
$('arcE').setAttribute('d',arcPath(cx,cy,25,Math.atan2(by-cy,bx-cx),Math.atan2(dy-cy,dx-cx)));
$('labelA').setAttribute('x',ax+26);$('labelA').setAttribute('y',ay-16);$('labelA').textContent=a+'°';
$('labelB').setAttribute('x',bx-58);$('labelB').setAttribute('y',by-15);$('labelB').textContent=b+'°';
$('labelE').setAttribute('x',Math.min(315,cx+27));$('labelE').setAttribute('y',Math.max(24,cy-14));$('labelE').textContent=e+'°';
$('av').textContent=a+'°';$('bv').textContent=b+'°';$('exterior').textContent=e+'°';$('adjacent').textContent=adj+'°';
$('explain').textContent='Exterior angle = '+a+'° + '+b+'° = '+e+'°. Its adjacent interior angle is 180° − '+e+'° = '+adj+'°.';
}
A.addEventListener('input',()=>update('a'));B.addEventListener('input',()=>update('b'));
document.querySelectorAll('[data-a]').forEach(btn=>btn.addEventListener('click',()=>{A.value=btn.dataset.a;B.value=btn.dataset.b;update('preset');}));
update('init');
})();</script><script src="/shared-nav.js?v=20261125-unified-botany-theme-v1"></script>
