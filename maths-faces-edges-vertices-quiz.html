<style>

ce-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"How many flat faces does a cube have?","o":["6","4","5","8"],"a":0,"e":"A cube has six square faces.","v":"faces-edges-vertices"},{"d":"BASIC","q":"How many edges does a cube have?","o":["6","12","8","10"],"a":1,"e":"A cube has four edges on the top, four on the bottom, and four joining them: 12 in total.","v":"faces-edges-vertices"},{"d":"BASIC","q":"How many vertices does a cube have?","o":["6","10","8","12"],"a":2,"e":"A cube has four vertices on each of its two square faces, giving 8 distinct vertices.","v":"faces-edges-vertices"},{"d":"BASIC","q":"How many flat faces does a cuboid have?","o":["4","8","12","6"],"a":3,"e":"A cuboid has six rectangular faces.","v":"faces-edges-vertices"},{"d":"BASIC","q":"How many vertices does a triangular prism have?","o":["6","5","8","9"],"a":0,"e":"Each triangular end has three vertices, so there are 3 + 3 = 6.","v":"faces-edges-vertices"},{"d":"BASIC","q":"How many edges does a triangular prism have?","o":["6","9","8","12"],"a":1,"e":"It has three edges on each triangular end and three joining edges: 3 + 3 + 3 = 9.","v":"faces-edges-vertices"},{"d":"BASIC","q":"How many faces does a tetrahedron have?","o":["3","5","4","6"],"a":2,"e":"A tetrahedron is a triangular pyramid with four triangular faces.","v":"faces-edges-vertices"},{"d":"BASIC","q":"How many vertices does a square-based pyramid have?","o":["4","6","8","5"],"a":3,"e":"It has four vertices on its square base and one apex.","v":"faces-edges-vertices"},{"d":"BASIC","q":"Which solid has one curved surface and no vertices?","o":["A cylinder","A cone","A cube","A triangular prism"],"a":0,"e":"A cylinder has one curved surface and two flat circular faces, with no vertices.","v":"faces-edges-vertices"},{"d":"BASIC","q":"How many vertices does a cone have?","o":["0","1","2","3"],"a":1,"e":"A cone has one pointed vertex, called its apex.","v":"faces-edges-vertices"},{"d":"MEDIUM","q":"How many edges does a square-based pyramid have?","o":["5","6","8","10"],"a":2,"e":"It has four base edges and four edges from the base vertices to the apex.","v":"faces-edges-vertices"},{"d":"MEDIUM","q":"How many faces does a triangular prism have?","o":["3","4","6","5"],"a":3,"e":"It has two triangular faces and three rectangular faces.","v":"faces-edges-vertices"},{"d":"MEDIUM","q":"A cuboid has 6 faces and 8 vertices. How many edges does it have?","o":["12","8","10","14"],"a":0,"e":"A cuboid has 12 edges: four on each of two opposite faces and four joining them.","v":"faces-edges-vertices"},{"d":"MEDIUM","q":"Which solid has 5 faces, 8 edges, and 5 vertices?","o":["A triangular prism","A square-based pyramid","A cube","A tetrahedron"],"a":1,"e":"A square-based pyramid has one square base and four triangular sides, 8 edges, and 5 vertices.","v":"faces-edges-vertices"},{"d":"MEDIUM","q":"How many flat faces does a cylinder have?","o":["0","1","2","3"],"a":2,"e":"A cylinder has two flat circular faces; its side surface is curved.","v":"faces-edges-vertices"},{"d":"MEDIUM","q":"How many flat faces does a cone have?","o":["0","2","3","1"],"a":3,"e":"A cone has one flat circular base and one curved surface.","v":"faces-edges-vertices"},{"d":"MEDIUM","q":"Which solid has 2 triangular faces and 3 rectangular faces?","o":["A triangular prism","A square-based pyramid","A cube","A cone"],"a":0,"e":"A triangular prism has two triangular ends joined by three rectangular faces.","v":"faces-edges-vertices"},{"d":"MEDIUM","q":"How many vertices does a hexagonal prism have?","o":["6","12","8","18"],"a":1,"e":"Each hexagonal end has six vertices, giving 6 + 6 = 12.","v":"faces-edges-vertices"},{"d":"MEDIUM","q":"How many edges does a pentagonal prism have?","o":["10","12","15","20"],"a":2,"e":"A prism with a pentagonal base has 5 + 5 base edges and 5 joining edges, totalling 15.","v":"faces-edges-vertices"},{"d":"MEDIUM","q":"A solid has 2 identical pentagonal faces and 5 rectangular faces. What is it?","o":["A pentagonal pyramid","A hexagonal prism","A triangular prism","A pentagonal prism"],"a":3,"e":"A pentagonal prism has two pentagonal bases and one rectangular face for each of the five sides.","v":"faces-edges-vertices"},{"d":"HARD","q":"A prism has a 7-sided polygon as each base. How many vertices does it have?","o":["14","7","21","28"],"a":0,"e":"A prism has two copies of its base vertices, so 2 × 7 = 14.","v":"faces-edges-vertices"},{"d":"HARD","q":"How many edges does a hexagonal prism have?","o":["12","18","15","24"],"a":1,"e":"It has 6 edges on each base and 6 joining edges: 6 + 6 + 6 = 18.","v":"faces-edges-vertices"},{"d":"HARD","q":"A polygon-based pyramid has a hexagonal base. How many faces does it have?","o":["6","8","7","12"],"a":2,"e":"A hexagonal pyramid has one base and six triangular side faces, giving 7.","v":"faces-edges-vertices"},{"d":"HARD","q":"A pentagonal pyramid has how many vertices?","o":["5","10","15","6"],"a":3,"e":"The five base vertices plus one apex make 6 vertices.","v":"faces-edges-vertices"},{"d":"HARD","q":"Which solid has 6 faces, 12 edges, and 8 vertices?","o":["A cube","A triangular prism","A square-based pyramid","A pentagonal prism"],"a":0,"e":"A cube has exactly 6 faces, 12 edges, and 8 vertices.","v":"faces-edges-vertices"},{"d":"HARD","q":"A prism has 10 vertices. What polygon is its base?","o":["A triangle","A pentagon","A square","A hexagon"],"a":1,"e":"A prism has twice as many vertices as its base polygon has corners; 10 ÷ 2 = 5.","v":"faces-edges-vertices"},{"d":"HARD","q":"A hexagonal pyramid has how many edges?","o":["6","10","12","18"],"a":2,"e":"It has six edges around the base and six edges joining base vertices to the apex, for 12 edges.","v":"faces-edges-vertices"},{"d":"HARD","q":"A solid has 8 vertices and 6 faces. If it is a convex polyhedron, how many edges does it have?","o":["10","14","16","12"],"a":3,"e":"Euler's formula gives V − E + F = 2; 8 − E + 6 = 2, so E = 12.","v":"faces-edges-vertices"},{"d":"HARD","q":"A convex polyhedron has 10 vertices and 7 faces. How many edges does it have?","o":["15","13","16","17"],"a":0,"e":"Using V − E + F = 2 gives 10 − E + 7 = 2, so E = 15.","v":"faces-edges-vertices"},{"d":"HARD","q":"A prism has 8 edges around its two bases combined. What polygon is its base?","o":["A triangle","A quadrilateral","A pentagon","A hexagon"],"a":1,"e":"The two bases contribute 2n edges; 2n = 8 means n = 4.","v":"faces-edges-vertices"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Identify faces, edges and vertices</strong><small>Count parts of common 3D solids</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Compare prisms, pyramids and curved solids</strong><small>Use solid properties and Euler’s formula</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve multi-step solid-shape questions</strong><small>Connect faces, edges and vertices</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
