<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"What does the Factor Theorem say about p(x)?","o":["If p(a)=0, then (x−a) is a factor","Every number is a factor","The remainder is always 1","Every polynomial is quadratic"],"a":0,"why":"If p(a)=0, then x−a is a factor of p(x)."},{"d":"BASIC","q":"If p(2)=0, which is a factor of p(x)?","o":["x+2","x−2","x","x+1"],"a":1,"why":"Since p(2)=0, the factor is x−2."},{"d":"BASIC","q":"Is x−3 a factor of p(x)=x²−9?","o":["Yes","No","Only x+3 is a factor","Cannot determine"],"a":0,"why":"p(3)=9−9=0, so x−3 is a factor."},{"d":"BASIC","q":"Which value should be substituted to test whether x+4 is a factor?","o":["4","−4","0","1"],"a":1,"why":"x+4=x−(−4), so test p(−4)."},{"d":"BASIC","q":"If p(1)=5, is x−1 a factor of p(x)?","o":["Yes, always","No, because p(1)≠0","Yes, if degree is 2","Cannot tell without the leading term"],"a":1,"why":"The Factor Theorem requires p(1)=0; here it equals 5."},{"d":"BASIC","q":"Which is a factor of x²−4?","o":["x−1","x+1","x−2","x−3"],"a":2,"why":"x²−4=(x−2)(x+2), so x−2 is a factor."},{"d":"BASIC","q":"If x+2 is a factor of p(x), what must be true?","o":["p(2)=0","p(−2)=0","p(0)=2","p(−1)=0"],"a":1,"why":"x+2 corresponds to x−(−2), so p(−2)=0."},{"d":"BASIC","q":"Which expression is a factor of x²+5x+6?","o":["x−2","x+2","x−3","x+1"],"a":1,"why":"x²+5x+6=(x+2)(x+3)."},{"d":"BASIC","q":"If p(a)=0, then a is:","o":["The degree","A zero of p(x)","The leading coefficient","Always positive"],"a":1,"why":"A value making p(a)=0 is a zero of the polynomial."},{"d":"BASIC","q":"If p(0)=0, which factor must divide p(x)?","o":["x","x−1","x+1","x−2"],"a":0,"why":"Since p(0)=0, the Factor Theorem gives x−0=x as a factor."},{"d":"MEDIUM","q":"Is x−2 a factor of p(x)=x³−4x?","o":["Yes","No","Only if x=−2","Cannot tell"],"a":0,"why":"p(2)=8−8=0, so x−2 is a factor."},{"d":"MEDIUM","q":"Find k if x−1 is a factor of p(x)=x²+kx−6.","o":["−5","−4","5","6"],"a":2,"why":"p(1)=1+k−6=0, so k=5."},{"d":"MEDIUM","q":"Which is a factor of x²−x−12?","o":["x−3","x+3","x−4","x+6"],"a":2,"why":"x²−x−12=(x−4)(x+3), so x−4 is a factor."},{"d":"MEDIUM","q":"If x+1 is a factor of p(x)=2x³+kx+3, find k.","o":["−5","−1","1","5"],"a":2,"why":"p(−1)=−2−k+3=0, so k=1."},{"d":"MEDIUM","q":"Which value of a makes x−a a factor of p(x)=x²−16?","o":["1","2","4","8"],"a":2,"why":"p(4)=16−16=0, so x−4 is a factor; a=4."},{"d":"MEDIUM","q":"Is x+3 a factor of p(x)=x²+2x−3?","o":["Yes","No","Only x−3 is a factor","Cannot determine"],"a":0,"why":"p(−3)=9−6−3=0, so x+3 is a factor."},{"d":"MEDIUM","q":"Find k if x+2 is a factor of p(x)=x²+kx+2.","o":["−3","−2","1","3"],"a":3,"why":"p(−2)=4−2k+2=0 gives k=3."},{"d":"MEDIUM","q":"Which factorisation is correct for x²+7x+12?","o":["(x+2)(x+6)","(x+3)(x+4)","(x−3)(x−4)","(x+1)(x+12)"],"a":1,"why":"3 and 4 add to 7 and multiply to 12."},{"d":"MEDIUM","q":"If p(3)=0, which factor divides p(x)?","o":["x+3","x−3","x","x+1"],"a":1,"why":"By the Factor Theorem, p(3)=0 means x−3 is a factor."},{"d":"MEDIUM","q":"Is x−2 a factor of x³−8?","o":["Yes","No","Only x+2","Cannot tell"],"a":0,"why":"p(2)=8−8=0; x³−8=(x−2)(x²+2x+4)."},{"d":"HARD","q":"Find k if x−2 is a factor of p(x)=x³+kx−10.","o":["−3","−2","1","3"],"a":2,"why":"p(2)=8+2k−10=0 gives k=1."},{"d":"HARD","q":"Which is a factor of x³−3x²−4x+12?","o":["x−1","x−2","x+3","x+4"],"a":1,"why":"Grouping gives x²(x−3)−4(x−3)=(x−3)(x²−4)=(x−3)(x−2)(x+2). x−2 is a factor."},{"d":"HARD","q":"If x+1 and x−2 are factors of p(x)=x³+ax²+bx−2, find a+b.","o":["−3","−2","0","1"],"a":0,"why":"Solving p(−1)=0 and p(2)=0 gives a=0, b=−3, so a+b=−3."},{"d":"HARD","q":"Find k if x−1 is a factor of p(x)=2x³−kx²+x+4.","o":["−7","−5","5","7"],"a":3,"why":"p(1)=2−k+1+4=0, so k=7."},{"d":"HARD","q":"Which polynomial has x−3 as a factor?","o":["x²−6x+9","x²+9","x²−3x+1","x²−2x−3"],"a":0,"why":"p(3)=9−18+9=0 for x²−6x+9."},{"d":"HARD","q":"If p(x)=x³−4x²+x+6, test whether x−2 is a factor.","o":["Yes","No","Only x+2","Not enough information"],"a":0,"why":"p(2)=8−16+2+6=0, so x−2 is a factor."},{"d":"HARD","q":"If x−2 is a factor of x³+ax²−4x+4, find a.","o":["−2","−1","0","1"],"a":1,"why":"p(2)=8+4a−8+4=0 gives a=−1."},{"d":"HARD","q":"Which factor is guaranteed if p(−5)=0?","o":["x−5","x+5","x","x−1"],"a":1,"why":"p(−5)=0 means x−(−5)=x+5 is a factor."},{"d":"HARD","q":"If p(x)=x³−6x²+11x−6, which is NOT a factor?","o":["x−1","x−2","x−3","x+1"],"a":3,"why":"The polynomial factors as (x−1)(x−2)(x−3), so x+1 is not a factor."},{"d":"HARD","q":"If x−4 is a factor of p(x)=x²−kx+8, find k.","o":["4","6","8","10"],"a":1,"why":"p(4)=16−4k+8=0 gives k=6."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Factor Theorem Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
