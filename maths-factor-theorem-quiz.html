(function(){'use strict';const questions=[{"d":"BASIC","q":"What does the Factor Theorem say about p(x)?","o":["If p(a)=0, then (x−a) is a factor","Every number is a factor","The remainder is always 1","Every polynomial is quadratic"],"a":0,"e":"If p(a)=0, then x−a is a factor of p(x)."},{"d":"BASIC","q":"If p(2)=0, which is a factor of p(x)?","o":["x+2","x−2","x","x+1"],"a":1,"e":"Since p(2)=0, the factor is x−2."},{"d":"BASIC","q":"Is x−3 a factor of p(x)=x²−9?","o":["Yes","No","Only x+3 is a factor","Cannot determine"],"a":0,"e":"p(3)=9−9=0, so x−3 is a factor."},{"d":"BASIC","q":"Which value should be substituted to test whether x+4 is a factor?","o":["4","−4","0","1"],"a":1,"e":"x+4=x−(−4), so test p(−4)."},{"d":"BASIC","q":"If p(1)=5, is x−1 a factor of p(x)?","o":["Yes, always","No, because p(1)≠0","Yes, if degree is 2","Cannot tell without the leading term"],"a":1,"e":"The Factor Theorem requires p(1)=0; here it equals 5."},{"d":"BASIC","q":"Which is a factor of x²−4?","o":["x−1","x+1","x−2","x−3"],"a":2,"e":"x²−4=(x−2)(x+2), so x−2 is a factor."},{"d":"BASIC","q":"If x+2 is a factor of p(x), what must be true?","o":["p(2)=0","p(−2)=0","p(0)=2","p(−1)=0"],"a":1,"e":"x+2 corresponds to x−(−2), so p(−2)=0."},{"d":"BASIC","q":"Which expression is a factor of x²+5x+6?","o":["x−2","x+2","x−3","x+1"],"a":1,"e":"x²+5x+6=(x+2)(x+3)."},{"d":"BASIC","q":"If p(a)=0, then a is:","o":["The degree","A zero of p(x)","The leading coefficient","Always positive"],"a":1,"e":"A value making p(a)=0 is a zero of the polynomial."},{"d":"BASIC","q":"If p(0)=0, which factor must divide p(x)?","o":["x","x−1","x+1","x−2"],"a":0,"e":"Since p(0)=0, the Factor Theorem gives x−0=x as a factor."},{"d":"MEDIUM","q":"Is x−2 a factor of p(x)=x³−4x?","o":["Yes","No","Only if x=−2","Cannot tell"],"a":0,"e":"p(2)=8−8=0, so x−2 is a factor."},{"d":"MEDIUM","q":"Find k if x−1 is a factor of p(x)=x²+kx−6.","o":["−5","−4","5","6"],"a":2,"e":"p(1)=1+k−6=0, so k=5."},{"d":"MEDIUM","q":"Which is a factor of x²−x−12?","o":["x−3","x+3","x−4","x+6"],"a":2,"e":"x²−x−12=(x−4)(x+3), so x−4 is a factor."},{"d":"MEDIUM","q":"If x+1 is a factor of p(x)=2x³+kx+3, find k.","o":["−5","−1","1","5"],"a":2,"e":"p(−1)=−2−k+3=0, so k=1."},{"d":"MEDIUM","q":"Which value of a makes x−a a factor of p(x)=x²−16?","o":["1","2","4","8"],"a":2,"e":"p(4)=16−16=0, so x−4 is a factor; a=4."},{"d":"MEDIUM","q":"Is x+3 a factor of p(x)=x²+2x−3?","o":["Yes","No","Only x−3 is a factor","Cannot determine"],"a":0,"e":"p(−3)=9−6−3=0, so x+3 is a factor."},{"d":"MEDIUM","q":"Find k if x+2 is a factor of p(x)=x²+kx+2.","o":["−3","−2","1","3"],"a":3,"e":"p(−2)=4−2k+2=0 gives k=3."},{"d":"MEDIUM","q":"Which factorisation is correct for x²+7x+12?","o":["(x+2)(x+6)","(x+3)(x+4)","(x−3)(x−4)","(x+1)(x+12)"],"a":1,"e":"3 and 4 add to 7 and multiply to 12."},{"d":"MEDIUM","q":"If p(3)=0, which factor divides p(x)?","o":["x+3","x−3","x","x+1"],"a":1,"e":"By the Factor Theorem, p(3)=0 means x−3 is a factor."},{"d":"MEDIUM","q":"Is x−2 a factor of x³−8?","o":["Yes","No","Only x+2","Cannot tell"],"a":0,"e":"p(2)=8−8=0; x³−8=(x−2)(x²+2x+4)."},{"d":"HARD","q":"Find k if x−2 is a factor of p(x)=x³+kx−10.","o":["−3","−2","1","3"],"a":2,"e":"p(2)=8+2k−10=0 gives k=1."},{"d":"HARD","q":"Which is a factor of x³−3x²−4x+12?","o":["x−1","x−2","x+3","x+4"],"a":1,"e":"Grouping gives x²(x−3)−4(x−3)=(x−3)(x²−4)=(x−3)(x−2)(x+2). x−2 is a factor."},{"d":"HARD","q":"If x+1 and x−2 are factors of p(x)=x³+ax²+bx−2, find a+b.","o":["−3","−2","0","1"],"a":0,"e":"Solving p(−1)=0 and p(2)=0 gives a=0, b=−3, so a+b=−3."},{"d":"HARD","q":"Find k if x−1 is a factor of p(x)=2x³−kx²+x+4.","o":["−7","−5","5","7"],"a":3,"e":"p(1)=2−k+1+4=0, so k=7."},{"d":"HARD","q":"Which polynomial has x−3 as a factor?","o":["x²−6x+9","x²+9","x²−3x+1","x²−2x−3"],"a":0,"e":"p(3)=9−18+9=0 for x²−6x+9."},{"d":"HARD","q":"If p(x)=x³−4x²+x+6, test whether x−2 is a factor.","o":["Yes","No","Only x+2","Not enough information"],"a":0,"e":"p(2)=8−16+2+6=0, so x−2 is a factor."},{"d":"HARD","q":"If x−2 is a factor of x³+ax²−4x+4, find a.","o":["−2","−1","0","1"],"a":1,"e":"p(2)=8+4a−8+4=0 gives a=−1."},{"d":"HARD","q":"Which factor is guaranteed if p(−5)=0?","o":["x−5","x+5","x","x−1"],"a":1,"e":"p(−5)=0 means x−(−5)=x+5 is a factor."},{"d":"HARD","q":"If p(x)=x³−6x²+11x−6, which is NOT a factor?","o":["x−1","x−2","x−3","x+1"],"a":3,"e":"The polynomial factors as (x−1)(x−2)(x−3), so x+1 is not a factor."},{"d":"HARD","q":"If x−4 is a factor of p(x)=x²−kx+8, find k.","o":["4","6","8","10"],"a":1,"e":"p(4)=16−4k+8=0 gives k=6."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Apply the Factor Theorem</strong><small>Test polynomial factors using p(a)</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Connect zeros with linear factors</strong><small>Find unknown coefficients using factor conditions</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Substitute candidate roots into polynomials</strong><small>Solve factor-theorem problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
