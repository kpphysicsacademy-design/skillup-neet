<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261015-class8-factorisation-basics-v1"><title>Factorisation Basics | Class 8 Maths | SkillUp</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Factorisation Basics</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Factorise 6x + 12.","o":["6(x + 2)","6(x − 2)","3(2x + 12)","6x(1 + 2)"],"a":0,"e":"The greatest common factor is 6: 6x + 12 = 6(x + 2).","v":"factorisation-basics"},{"d":"BASIC","q":"Factorise 5a − 15.","o":["5(a − 3)","5(a + 3)","a(5 − 15)","15(a − 5)"],"a":0,"e":"Take out the common factor 5.","v":"factorisation-basics"},{"d":"BASIC","q":"Factorise 4x² + 8x.","o":["4x(x + 2)","4x(x − 2)","2x(2x + 8)","4(x² + 8x)"],"a":0,"e":"Both terms share the factor 4x.","v":"factorisation-basics"},{"d":"BASIC","q":"Factorise 3ab + 6a.","o":["3a(b + 2)","3b(a + 2)","6a(b + 3)","3a(b − 2)"],"a":0,"e":"The common factor is 3a.","v":"factorisation-basics"},{"d":"BASIC","q":"Factorise x² + 5x.","o":["x(x + 5)","x²(x + 5)","5x(x + 1)","x(x − 5)"],"a":0,"e":"Both terms contain x, so x² + 5x = x(x + 5).","v":"factorisation-basics"},{"d":"BASIC","q":"Factorise 7m² − 14m.","o":["7m(m − 2)","7(m² − 2m)","14m(m − 1)","7m(m + 2)"],"a":0,"e":"Take out the common factor 7m.","v":"factorisation-basics"},{"d":"BASIC","q":"Factorise 9p + 12.","o":["3(3p + 4)","3(9p + 12)","9(p + 12)","12(9p + 1)"],"a":0,"e":"The greatest common factor of 9 and 12 is 3.","v":"factorisation-basics"},{"d":"BASIC","q":"Factorise 10x²y + 15xy².","o":["5xy(2x + 3y)","5xy(2x − 3y)","5x(2xy + 3y²)","10xy(x + 15y)"],"a":0,"e":"The common factor is 5xy.","v":"factorisation-basics"},{"d":"BASIC","q":"Factorise x² − 9.","o":["(x − 3)(x + 3)","(x − 9)(x + 1)","(x − 3)²","(x + 3)²"],"a":0,"e":"Use the difference-of-squares identity x² − 3² = (x − 3)(x + 3).","v":"factorisation-basics"},{"d":"BASIC","q":"Factorise a² + 6a + 9.","o":["(a + 3)²","(a − 3)²","(a + 9)(a + 1)","a(a + 6) + 9"],"a":0,"e":"This is a² + 2·a·3 + 3² = (a + 3)².","v":"factorisation-basics"},{"d":"MEDIUM","q":"Factorise x² − 10x + 25.","o":["(x − 5)²","(x + 5)²","(x − 25)(x + 1)","x(x − 10) + 25"],"a":0,"e":"This is x² − 2·x·5 + 5² = (x − 5)².","v":"factorisation-basics"},{"d":"MEDIUM","q":"Factorise 4y² − 25.","o":["(2y − 5)(2y + 5)","(4y − 5)(y + 5)","(2y − 5)²","(2y + 5)²"],"a":0,"e":"Difference of squares: (2y)² − 5².","v":"factorisation-basics"},{"d":"MEDIUM","q":"Factorise x² + 7x + 12.","o":["(x + 3)(x + 4)","(x + 2)(x + 6)","(x − 3)(x − 4)","(x + 12)(x + 1)"],"a":0,"e":"Find two numbers with sum 7 and product 12: 3 and 4.","v":"factorisation-basics"},{"d":"MEDIUM","q":"Factorise x² − x − 12.","o":["(x − 4)(x + 3)","(x − 3)(x + 4)","(x − 6)(x + 2)","(x + 12)(x − 1)"],"a":0,"e":"The numbers −4 and 3 have product −12 and sum −1.","v":"factorisation-basics"},{"d":"MEDIUM","q":"Factorise x² + 2x − 15.","o":["(x + 5)(x − 3)","(x − 5)(x + 3)","(x + 15)(x − 1)","(x + 3)(x − 5)"],"a":0,"e":"The numbers 5 and −3 add to 2 and multiply to −15.","v":"factorisation-basics"},{"d":"MEDIUM","q":"Factorise 2x² + 6x.","o":["2x(x + 3)","2x(x + 6)","x(2x + 6x)","6x(x + 2)"],"a":0,"e":"The common factor is 2x.","v":"factorisation-basics"},{"d":"MEDIUM","q":"Factorise 12a²b − 8ab².","o":["4ab(3a − 2b)","4ab(3a + 2b)","2ab(6a − 8b)","4a(3ab − 2b²)"],"a":0,"e":"Take out the common factor 4ab.","v":"factorisation-basics"},{"d":"MEDIUM","q":"Factorise 3x² − 12.","o":["3(x − 2)(x + 2)","3(x − 4)(x + 1)","(3x − 12)(x + 1)","3(x − 2)²"],"a":0,"e":"First take out 3, then factor x² − 4 as (x − 2)(x + 2).","v":"factorisation-basics"},{"d":"MEDIUM","q":"Factorise 2a² + 7a + 3.","o":["(2a + 1)(a + 3)","(2a + 3)(a + 1)","(a + 7)(2a + 3)","(2a − 1)(a − 3)"],"a":0,"e":"(2a + 1)(a + 3) expands to 2a² + 7a + 3.","v":"factorisation-basics"},{"d":"MEDIUM","q":"Factorise 6x² + 11x + 3.","o":["(3x + 1)(2x + 3)","(3x + 3)(2x + 1)","(6x + 1)(x + 3)","(2x + 1)(3x + 3)"],"a":0,"e":"Multiplying (3x + 1)(2x + 3) gives 6x² + 11x + 3.","v":"factorisation-basics"},{"d":"HARD","q":"Which is a factor of x² − 16?","o":["x − 4","x − 8","x + 16","x² − 4"],"a":0,"e":"x² − 16 = (x − 4)(x + 4), so x − 4 is a factor.","v":"factorisation-basics"},{"d":"HARD","q":"Factorise 15m²n + 20mn².","o":["5mn(3m + 4n)","5mn(3m − 4n)","5m(3mn + 4n²)","15mn(m + 20n)"],"a":0,"e":"The greatest common factor is 5mn.","v":"factorisation-basics"},{"d":"HARD","q":"Factorise 8x³ − 12x².","o":["4x²(2x − 3)","4x(2x² − 3)","2x²(4x − 12)","4x²(2x + 3)"],"a":0,"e":"The common factor is 4x².","v":"factorisation-basics"},{"d":"HARD","q":"Factorise x² + 11x + 30.","o":["(x + 5)(x + 6)","(x + 3)(x + 10)","(x − 5)(x − 6)","(x + 15)(x + 2)"],"a":0,"e":"5 and 6 add to 11 and multiply to 30.","v":"factorisation-basics"},{"d":"HARD","q":"Factorise x² − 7x + 12.","o":["(x − 3)(x − 4)","(x + 3)(x + 4)","(x − 2)(x − 6)","(x − 12)(x + 1)"],"a":0,"e":"−3 and −4 add to −7 and multiply to 12.","v":"factorisation-basics"},{"d":"HARD","q":"Factorise 5x² − 20.","o":["5(x − 2)(x + 2)","5(x − 4)(x + 1)","(5x − 20)(x + 1)","5(x − 2)²"],"a":0,"e":"Take out 5, then use x² − 4 = (x − 2)(x + 2).","v":"factorisation-basics"},{"d":"HARD","q":"Factorise 4a² + 12a + 9.","o":["(2a + 3)²","(2a − 3)²","(4a + 3)(a + 3)","(2a + 9)(2a + 1)"],"a":0,"e":"This is (2a)² + 2(2a)(3) + 3².","v":"factorisation-basics"},{"d":"HARD","q":"Factorise 9x² − 24x + 16.","o":["(3x − 4)²","(3x + 4)²","(9x − 4)(x − 4)","(3x − 8)²"],"a":0,"e":"9x² − 24x + 16 = (3x)² − 2(3x)(4) + 4².","v":"factorisation-basics"},{"d":"HARD","q":"Factorise 2x² − 8x + 6.","o":["2(x − 1)(x − 3)","2(x + 1)(x + 3)","(2x − 2)(x − 3)","2(x − 2)(x − 3)"],"a":0,"e":"Take out 2: 2(x² − 4x + 3) = 2(x − 1)(x − 3).","v":"factorisation-basics"},{"d":"HARD","q":"If x² − 5x + 6 is factorised, which pair is correct?","o":["(x − 2)(x − 3)","(x + 2)(x + 3)","(x − 1)(x − 6)","(x + 1)(x − 6)"],"a":0,"e":"−2 and −3 add to −5 and multiply to 6, so the factors are (x − 2)(x − 3).","v":"factorisation-basics"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Apply standard algebraic identities</strong><small>Expand squares of sums and differences</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Use the difference-of-squares identity</strong><small>Recognise and simplify equivalent algebraic forms</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply identities accurately to expressions</strong><small>Reason about perfect squares and nearest squares</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
