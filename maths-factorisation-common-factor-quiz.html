(function(){'use strict';const questions=[{"d":"BASIC","q":"What is the greatest common factor of 12 and 18?","o":["2","3","6","9"],"a":2,"e":"The factors shared by 12 and 18 include 1, 2, 3 and 6. The greatest is 6."},{"d":"BASIC","q":"Factorise 6x + 12.","o":["6(x + 2)","3(2x + 12)","6(x + 12)","2(3x + 12)"],"a":0,"e":"Both terms are divisible by 6: 6x + 12 = 6(x + 2)."},{"d":"BASIC","q":"Factorise 5a + 15.","o":["5(a + 3)","15(a + 1)","5(a + 15)","a(5 + 15)"],"a":0,"e":"The common factor is 5, so 5a + 15 = 5(a + 3)."},{"d":"BASIC","q":"What is the common factor in 8x and 20?","o":["2","4","5","8"],"a":1,"e":"The greatest number dividing both 8 and 20 is 4."},{"d":"BASIC","q":"Factorise 9y − 27.","o":["9(y − 3)","3(3y − 27)","9(y − 27)","y(9 − 27)"],"a":0,"e":"Take 9 outside: 9y − 27 = 9(y − 3)."},{"d":"BASIC","q":"Factorise 4x² + 8x.","o":["4x(x + 2)","4(x² + 2)","x(4x + 8x)","8x(x + 4)"],"a":0,"e":"Both terms contain 4x: 4x² + 8x = 4x(x + 2)."},{"d":"BASIC","q":"Which expression is equivalent to 7m + 14n?","o":["7(m + 2n)","14(7m + n)","7(m + 14n)","m(7 + 14n)"],"a":0,"e":"Factor out 7 from both terms to get 7(m + 2n)."},{"d":"BASIC","q":"Factorise 3p − 6q.","o":["3(p − 2q)","6(p − q)","3(p − 6q)","p(3 − 6q)"],"a":0,"e":"The common factor is 3, giving 3(p − 2q)."},{"d":"BASIC","q":"What is the greatest common factor of 15a and 25a²?","o":["5","5a","15a","25a²"],"a":1,"e":"The common numerical factor is 5 and the lowest shared power is a, so the GCF is 5a."},{"d":"BASIC","q":"Factorise 10x + 5.","o":["5(2x + 1)","10(x + 5)","5(10x + 1)","x(10 + 5)"],"a":0,"e":"Take out the common factor 5: 10x + 5 = 5(2x + 1)."},{"d":"MEDIUM","q":"Factorise 12x² + 18x.","o":["6x(2x + 3)","3x(4x + 18)","6(2x² + 3x)","12x(x + 18)"],"a":0,"e":"The greatest common factor is 6x, leaving 2x + 3."},{"d":"MEDIUM","q":"Factorise 14ab − 21ac.","o":["7a(2b − 3c)","7(2ab − 21ac)","14a(b − 3c)","a(14b − 21c)"],"a":0,"e":"The common factor is 7a. Dividing each term by 7a gives 2b and 3c."},{"d":"MEDIUM","q":"Factorise 16x³ − 24x².","o":["8x²(2x − 3)","8x(2x² − 3)","4x²(4x − 24)","16x²(x − 24)"],"a":0,"e":"The greatest common factor is 8x², so the result is 8x²(2x − 3)."},{"d":"MEDIUM","q":"Which is the fully factorised form of 18a²b + 12ab²?","o":["6ab(3a + 2b)","3ab(6a + 12b)","6a(3ab + 2b²)","ab(18a + 12b)"],"a":0,"e":"The GCF is 6ab. The remaining terms are 3a and 2b."},{"d":"MEDIUM","q":"Factorise 5(x + 2) + 3(x + 2).","o":["8(x + 2)","8x + 2","15(x + 2)","5(x + 5)"],"a":0,"e":"The common factor is (x + 2): [5 + 3](x + 2) = 8(x + 2)."},{"d":"MEDIUM","q":"Factorise 4x(x − 1) + 7(x − 1).","o":["(x − 1)(4x + 7)","(x − 1)(4x − 7)","4x( x + 6)","(4x + 7)(x + 1)"],"a":0,"e":"Both terms share (x − 1), so factor it out to obtain (x − 1)(4x + 7)."},{"d":"MEDIUM","q":"Factorise 21m²n − 14mn².","o":["7mn(3m − 2n)","7m(3mn − 2n²)","14mn(3m − n)","7n(3m² − 2mn)"],"a":0,"e":"The common factor is 7mn, leaving 3m − 2n."},{"d":"MEDIUM","q":"What is the greatest common factor of 24x²y and 36xy²?","o":["6xy","12xy","12x²y²","24xy"],"a":1,"e":"The GCF of 24 and 36 is 12; the shared variables at their lowest powers are xy. So the GCF is 12xy."},{"d":"MEDIUM","q":"Factorise 9(x − 4) − 2(x − 4).","o":["7(x − 4)","11(x − 4)","7x − 4","18(x − 4)"],"a":0,"e":"Take out the shared factor (x − 4): (9 − 2)(x − 4) = 7(x − 4)."},{"d":"MEDIUM","q":"Factorise 15x²y + 20xy² − 5xy.","o":["5xy(3x + 4y − 1)","5xy(3x + 4y + 1)","5x(3xy + 4y² − y)","xy(15x + 20y)"],"a":0,"e":"The GCF is 5xy. Dividing each term gives 3x + 4y − 1."},{"d":"HARD","q":"Fully factorise 18x³y² − 30x²y³ + 12x²y².","o":["6x²y²(3x − 5y + 2)","6xy²(3x² − 5xy + 2x)","3x²y²(6x − 10y + 4)","6x²y(3xy − 5y² + 2y)"],"a":0,"e":"The GCF is 6x²y². Dividing each term gives 3x, −5y and 2."},{"d":"HARD","q":"Factorise 3a(a + b) − 5b(a + b).","o":["(a + b)(3a − 5b)","(a + b)(3a + 5b)","3a(a − 4b)","(3a − 5b)(a − b)"],"a":0,"e":"The binomial (a + b) is common, so the expression becomes (a + b)(3a − 5b)."},{"d":"HARD","q":"Factorise 2x(x + 3) + 5(x + 3) − 4(x + 3).","o":["(x + 3)(2x + 1)","(x + 3)(2x + 9)","(x + 3)(2x − 1)","(x + 3)(10x + 1)"],"a":0,"e":"Factor out (x + 3). The remaining coefficient is 2x + 5 − 4 = 2x + 1."},{"d":"HARD","q":"What is the greatest common factor of 42p³q² and 56p²q⁴?","o":["14p²q²","7p²q²","14p³q⁴","28pq²"],"a":0,"e":"GCF(42, 56) = 14. The shared lowest powers are p² and q², so the GCF is 14p²q²."},{"d":"HARD","q":"Factorise 12x²(x − 2) − 8x(x − 2).","o":["4x(x − 2)(3x − 2)","4x(3x² − 2)","4x(x − 2)(3x + 2)","2x(x − 2)(6x − 8)"],"a":0,"e":"First factor out 4x(x − 2): 12x²(x − 2) − 8x(x − 2) = 4x(x − 2)(3x − 2)."},{"d":"HARD","q":"Factorise 6ab − 9ac + 4db − 6dc by grouping.","o":["(2a + 3d)(3b − 3c)","(2a + 3d)(3b − 3c)","(3a + 2d)(2b − 3c)","(2a + 3d)(3b − 3c)"],"a":2,"e":"Group as (6ab − 9ac) + (4db − 6dc) = 3a(2b − 3c) + 2d(2b − 3c) = (3a + 2d)(2b − 3c)."},{"d":"HARD","q":"Factorise 7x(2y − 1) + 3(2y − 1) − 4(2y − 1).","o":["(2y − 1)(7x − 1)","(2y − 1)(7x + 7)","(2y − 1)(7x + 1)","(2y − 1)(7x − 7)"],"a":0,"e":"Factor out (2y − 1). The remaining expression is 7x + 3 − 4 = 7x − 1."},{"d":"HARD","q":"Factorise 20m²n − 15mn² + 5mn.","o":["5mn(4m − 3n + 1)","5mn(4m + 3n + 1)","5m(4mn − 3n² + n)","5mn(4m − 3n − 1)"],"a":0,"e":"Take out the GCF 5mn. The remaining terms are 4m − 3n + 1."},{"d":"HARD","q":"Which is the fully factorised form of 8x²(x + 1) + 12x(x + 1)?","o":["4x(x + 1)(2x + 3)","4x(2x² + 3)","4x(x + 1)(2x − 3)","2x(x + 1)(4x + 12)"],"a":0,"e":"Factor out 4x(x + 1), leaving 2x + 3."},{"d":"HARD","q":"Factorise 5p(p − q) − 2q(p − q) + 3(p − q).","o":["(p − q)(5p − 2q + 3)","(p − q)(5p + 2q + 3)","(p − q)(5p − 2q − 3)","(p − q)(10p − 2q + 3)"],"a":0,"e":"All terms share (p − q). Factor it out to obtain (p − q)(5p − 2q + 3)."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand direct proportion and constant ratios</strong><small>Find unit rates and proportional values</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Solve ratio-based word problems</strong><small>Scale quantities at a constant rate</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve direct proportion problems</strong><small>Apply direct proportion accurately</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
