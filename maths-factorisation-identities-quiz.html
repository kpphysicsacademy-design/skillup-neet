<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Expand (x + 3)².","o":["x² + 9","x² + 6x + 9","x² + 3x + 9","x² + 6"],"a":1,"e":"Use (a + b)² = a² + 2ab + b². Thus (x + 3)² = x² + 6x + 9."},{"d":"BASIC","q":"Expand (a − 4)².","o":["a² − 16","a² − 8a + 16","a² − 4a + 16","a² + 8a + 16"],"a":1,"e":"Use (a − b)² = a² − 2ab + b². So (a − 4)² = a² − 8a + 16."},{"d":"BASIC","q":"Simplify (x + 5)(x − 5).","o":["x² + 25","x² − 10x + 25","x² − 25","x² + 10x − 25"],"a":2,"e":"This is a difference of squares: (x + 5)(x − 5) = x² − 25."},{"d":"BASIC","q":"Expand (y + 2)².","o":["y² + 4","y² + 2y + 4","y² + 4y + 4","y² − 4y + 4"],"a":2,"e":"(y + 2)² = y² + 2(y)(2) + 2² = y² + 4y + 4."},{"d":"BASIC","q":"Which identity is correct?","o":["(a + b)² = a² + b²","(a + b)² = a² + 2ab + b²","(a − b)² = a² − b²","(a + b)(a − b) = a² + 2ab + b²"],"a":1,"e":"The square of a sum is a² + 2ab + b²."},{"d":"BASIC","q":"Expand (m − 3)(m + 3).","o":["m² + 9","m² − 6m + 9","m² − 9","m² + 6m + 9"],"a":2,"e":"Use (a − b)(a + b) = a² − b², so the answer is m² − 9."},{"d":"BASIC","q":"Expand (2x + 1)².","o":["4x² + 1","4x² + 2x + 1","4x² + 4x + 1","2x² + 4x + 1"],"a":2,"e":"(2x + 1)² = (2x)² + 2(2x)(1) + 1² = 4x² + 4x + 1."},{"d":"BASIC","q":"Factorise x² + 10x + 25.","o":["(x + 5)²","(x − 5)²","(x + 10)(x + 2.5)","x(x + 25)"],"a":0,"e":"x² + 10x + 25 matches x² + 2(5)x + 5², so it is (x + 5)²."},{"d":"BASIC","q":"Expand (p − 2)².","o":["p² − 4","p² − 2p + 4","p² − 4p + 4","p² + 4p + 4"],"a":2,"e":"(p − 2)² = p² − 4p + 4."},{"d":"BASIC","q":"Factorise 9x² − 16.","o":["(9x − 4)(x + 4)","(3x − 4)(3x + 4)","(3x − 4)²","(9x − 16)(x + 1)"],"a":1,"e":"9x² − 16 = (3x)² − 4², a difference of squares: (3x − 4)(3x + 4)."},{"d":"MEDIUM","q":"Expand (3x − 2)².","o":["9x² − 4","9x² − 6x + 4","9x² − 12x + 4","9x² + 12x + 4"],"a":2,"e":"(3x − 2)² = 9x² − 12x + 4."},{"d":"MEDIUM","q":"Factorise x² − 14x + 49.","o":["(x + 7)²","(x − 7)²","(x − 14)(x + 3.5)","(x − 49)(x + 1)"],"a":1,"e":"x² − 14x + 49 = x² − 2(7)x + 7² = (x − 7)²."},{"d":"MEDIUM","q":"Simplify (2a + 3b)(2a − 3b).","o":["4a² + 9b²","4a² − 12ab + 9b²","4a² − 9b²","2a² − 3b²"],"a":2,"e":"Apply (u + v)(u − v) = u² − v²: 4a² − 9b²."},{"d":"MEDIUM","q":"Factorise 4x² + 12x + 9.","o":["(2x + 3)²","(2x − 3)²","(4x + 3)(x + 3)","(2x + 9)(2x + 1)"],"a":0,"e":"4x² + 12x + 9 = (2x)² + 2(2x)(3) + 3² = (2x + 3)²."},{"d":"MEDIUM","q":"Expand (x + 4)(x + 7).","o":["x² + 11x + 28","x² + 28x + 11","x² + 3x + 28","x² + 11x + 11"],"a":0,"e":"Multiply term by term: x² + 7x + 4x + 28 = x² + 11x + 28."},{"d":"MEDIUM","q":"Factorise 25m² − 1.","o":["(25m − 1)(m + 1)","(5m − 1)(5m + 1)","(5m − 1)²","(25m + 1)(m − 1)"],"a":1,"e":"25m² − 1 = (5m)² − 1² = (5m − 1)(5m + 1)."},{"d":"MEDIUM","q":"Simplify (a + b)² − (a − b)².","o":["2a² + 2b²","4ab","2ab","4a²"],"a":1,"e":"Expand both squares: (a² + 2ab + b²) − (a² − 2ab + b²) = 4ab."},{"d":"MEDIUM","q":"Factorise 6x² + 12x + 6 completely.","o":["6(x + 1)²","6(x² + 2x + 1)","3(2x + 1)²","6(x − 1)²"],"a":0,"e":"Take out 6: 6(x² + 2x + 1) = 6(x + 1)²."},{"d":"MEDIUM","q":"If a + b = 10 and ab = 21, find a² + b².","o":["58","79","100","121"],"a":0,"e":"a² + b² = (a + b)² − 2ab = 100 − 42 = 58."},{"d":"MEDIUM","q":"Expand (2x + 5)(2x − 5).","o":["4x² − 25","4x² + 20x + 25","2x² − 25","4x² + 25"],"a":0,"e":"Difference of squares: (2x)² − 5² = 4x² − 25."},{"d":"HARD","q":"Factorise 4x² − 20x + 25.","o":["(2x − 5)²","(2x + 5)²","(4x − 5)(x − 5)","(2x − 25)(2x − 1)"],"a":0,"e":"4x² − 20x + 25 = (2x)² − 2(2x)(5) + 5² = (2x − 5)²."},{"d":"HARD","q":"If x − y = 7 and xy = 8, find x² + y².","o":["33","49","65","81"],"a":2,"e":"x² + y² = (x − y)² + 2xy = 49 + 16 = 65."},{"d":"HARD","q":"Simplify (x + 2)² − (x − 2)².","o":["8x","4x","8","2x² + 8"],"a":0,"e":"Expand and subtract: (x² + 4x + 4) − (x² − 4x + 4) = 8x."},{"d":"HARD","q":"Factorise 49a² − 70ab + 25b².","o":["(7a + 5b)²","(7a − 5b)²","(49a − 25b)(a − b)","(7a − 5b)(7a + 5b)"],"a":1,"e":"This is (7a)² − 2(7a)(5b) + (5b)² = (7a − 5b)²."},{"d":"HARD","q":"If p + q = 13 and pq = 30, find p² + q².","o":["109","139","169","199"],"a":0,"e":"p² + q² = (p + q)² − 2pq = 169 − 60 = 109."},{"d":"HARD","q":"Factorise x⁴ − 81.","o":["(x² − 9)(x² + 9) only","(x − 3)(x + 3)(x² + 9)","(x − 9)(x + 9)","(x² − 81)(x² + 1)"],"a":0,"e":"x⁴ − 81 = (x² − 9)(x² + 9) = (x − 3)(x + 3)(x² + 9)."},{"d":"HARD","q":"Simplify (3x + 2)² − (3x − 2)².","o":["24x","12x","36x² + 4","8"],"a":0,"e":"Use (u + v)² − (u − v)² = 4uv with u = 3x, v = 2. Result = 24x."},{"d":"HARD","q":"Factorise 16x² − 40xy + 25y².","o":["(4x − 5y)²","(4x + 5y)²","(16x − 25y)(x − y)","(4x − 5y)(4x + 5y)"],"a":0,"e":"This is (4x)² − 2(4x)(5y) + (5y)² = (4x − 5y)²."},{"d":"HARD","q":"If a + b = 9 and a² + b² = 41, find ab.","o":["20","19","10","40"],"a":0,"e":"(a + b)² = a² + b² + 2ab. Thus 81 = 41 + 2ab, so ab = 20. Correct option: A."},{"d":"HARD","q":"Factorise 9x² − 24xy + 16y².","o":["(3x − 4y)²","(3x + 4y)²","(9x − 16y)(x − y)","(3x − 4y)(3x + 4y)"],"a":0,"e":"This is (3x)² − 2(3x)(4y) + (4y)² = (3x − 4y)²."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand direct proportion and constant ratios</strong><small>Find unit rates and proportional values</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Solve ratio-based word problems</strong><small>Scale quantities at a constant rate</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve direct proportion problems</strong><small>Apply direct proportion accurately</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
