<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Which number is a factor of 12?","o":["5","3","7","8"],"a":1,"e":"12 ÷ 3 = 4 with no remainder, so 3 is a factor of 12."},{"d":"BASIC","q":"Which is a multiple of 6?","o":["14","18","22","25"],"a":1,"e":"6 × 3 = 18, so 18 is a multiple of 6."},{"d":"BASIC","q":"Which number is a factor of every whole number?","o":["0","1","The number 2","The number 10"],"a":1,"e":"Every whole number is divisible by 1."},{"d":"BASIC","q":"Which is a multiple of 4?","o":["10","12","14","18"],"a":1,"e":"4 × 3 = 12."},{"d":"BASIC","q":"How many factors does 7 have?","o":["1","2","3","7"],"a":1,"e":"7 is prime, so its positive factors are 1 and 7."},{"d":"BASIC","q":"Which number is a factor of 20?","o":["3","6","5","8"],"a":2,"e":"20 ÷ 5 = 4, a whole number."},{"d":"BASIC","q":"Which is a multiple of 9?","o":["27","28","32","35"],"a":0,"e":"9 × 3 = 27."},{"d":"BASIC","q":"Is 1 a prime number?","o":["Yes, because it has one factor","No, because it has only one positive factor","Yes, because it is odd","No, because it is even"],"a":1,"e":"A prime number has exactly two distinct positive factors; 1 has only one."},{"d":"BASIC","q":"Which number is a factor of 15?","o":["4","6","5","8"],"a":2,"e":"15 ÷ 5 = 3."},{"d":"BASIC","q":"What is the smallest positive multiple of 8?","o":["0","1","8","16"],"a":2,"e":"Positive multiples of 8 begin 8, 16, 24, …"},{"d":"MEDIUM","q":"Which list contains all positive factors of 18?","o":["1, 2, 3, 6, 9, 18","1, 2, 4, 6, 9, 18","1, 3, 5, 9, 18","2, 3, 6, 9"],"a":0,"e":"The factor pairs are 1×18, 2×9 and 3×6."},{"d":"MEDIUM","q":"Which number is a common multiple of 3 and 4?","o":["18","20","24","27"],"a":2,"e":"24 is divisible by both 3 and 4."},{"d":"MEDIUM","q":"Which pair are both factors of 36?","o":["5 and 8","4 and 9","7 and 6","8 and 9"],"a":1,"e":"36 ÷ 4 = 9 and 36 ÷ 9 = 4."},{"d":"MEDIUM","q":"Which number is NOT a factor of 24?","o":["2","3","6","5"],"a":3,"e":"24 is not divisible by 5 without a remainder."},{"d":"MEDIUM","q":"What is the first three positive multiples of 7?","o":["7, 14, 21","0, 7, 14","7, 21, 28","14, 21, 35"],"a":0,"e":"Multiply 7 by 1, 2 and 3."},{"d":"MEDIUM","q":"A number is divisible by both 2 and 5. Which could it be?","o":["23","30","42","55"],"a":1,"e":"30 is even and ends in 0, so it is divisible by both 2 and 5."},{"d":"MEDIUM","q":"Which number has exactly three positive factors?","o":["8","9","10","12"],"a":1,"e":"9 has factors 1, 3 and 9."},{"d":"MEDIUM","q":"Which statement is true?","o":["Every multiple of 5 is a factor of 5","Every factor of 5 is greater than 5","Every multiple of 5 is divisible by 5","5 has infinitely many factors"],"a":2,"e":"Multiples of 5 are numbers formed by 5 × a whole number."},{"d":"MEDIUM","q":"Which is the greatest common factor of 12 and 18?","o":["2","3","6","9"],"a":2,"e":"Common factors include 1, 2, 3 and 6; the greatest is 6."},{"d":"MEDIUM","q":"Which number is divisible by 3?","o":["124","125","123","127"],"a":2,"e":"The digit sum of 123 is 1 + 2 + 3 = 6, divisible by 3."},{"d":"HARD","q":"Two bells ring every 6 minutes and 8 minutes. If they ring together now, after how many minutes will they ring together again?","o":["12","14","24","48"],"a":2,"e":"The least common multiple of 6 and 8 is 24."},{"d":"HARD","q":"What is the least common multiple of 9 and 12?","o":["18","24","36","108"],"a":2,"e":"Multiples meet first at 36: 9×4 = 36 and 12×3 = 36."},{"d":"HARD","q":"What is the greatest common factor of 24 and 40?","o":["4","6","8","12"],"a":2,"e":"The greatest number dividing both 24 and 40 is 8."},{"d":"HARD","q":"Which number has exactly two positive factors?","o":["1","15","17","21"],"a":2,"e":"17 is prime and has only 1 and 17 as positive factors."},{"d":"HARD","q":"A class has 24 students. Which arrangement makes equal rows with more than one row and more than one student per row?","o":["5 rows of 4","6 rows of 4","3 rows of 8","Both B and C"],"a":3,"e":"24 = 6×4 and 3×8, so both arrangements work."},{"d":"HARD","q":"Which number is a common factor of 30, 42 and 54?","o":["4","6","8","9"],"a":1,"e":"Each number is divisible by 6."},{"d":"HARD","q":"Find the smallest number greater than 1 that is a multiple of both 5 and 7.","o":["12","25","35","70"],"a":2,"e":"The least positive common multiple is 5 × 7 = 35."},{"d":"HARD","q":"A number has factors 1, 2, 4, 8 and 16. What is the number?","o":["8","16","24","32"],"a":1,"e":"16 has exactly the listed positive factors."},{"d":"HARD","q":"Which pair has a greatest common factor of 1?","o":["8 and 12","9 and 15","14 and 25","21 and 28"],"a":2,"e":"14 and 25 share no positive factor other than 1."},{"d":"HARD","q":"A gardener has 36 red flowers and 48 yellow flowers. They want identical bunches with no flowers left over. What is the greatest number of bunches possible?","o":["6","8","12","16"],"a":2,"e":"The greatest common factor of 36 and 48 is 12, so 12 identical bunches are possible."}];let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🔢</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(index>=questions.length){restart();return;}act();});render();})();</script></body></html>
