ce-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
 .skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}.skills-result{margin-top:14px;text-align:left}.skills-result h3{margin:0 0 8px;font-size:1rem}.skills-result .skill-item{margin-top:7px}.skill-item.unlocked{border-color:var(--green);color:var(--green2);background:#174b42} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}.diagram .accent{stroke:#58d6a3}.diagram .blue{stroke:#91b7ff}.diagram .gold{stroke:#ffd27a}.skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}.skills-result{margin-top:14px;text-align:left}.skills-result h3{margin:0 0 8px;font-size:1rem}.skills-result .skill-item{margin-top:7px}.skill-item.unlocked{border-color:var(--green);color:var(--green2);background:#174b42}</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Factors and Multiples</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Factors and Multiples skills"><div class="skill-title">🎯 Factors and Multiples Skills</div><div class="skill-list"><div class="skill-item">Identify factors and multiples</div><div class="skill-item">Find common factors and multiples</div><div class="skill-item">Apply factors and multiples to word problems</div></div></section></div><script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Which number is a factor of 12?","o":["5","7","3","8"],"a":2,"e":"12 ÷ 3 = 4 with no remainder, so 3 is a factor of 12.","v":"factors"},{"d":"BASIC","q":"Which number is a multiple of 6?","o":["14","18","20","25"],"a":1,"e":"6 × 3 = 18, so 18 is a multiple of 6.","v":"multiples"},{"d":"BASIC","q":"Which number is a factor of every positive whole number?","o":["0","1","10","2"],"a":1,"e":"Every positive whole number is divisible by 1.","v":"factors"},{"d":"BASIC","q":"Which is a multiple of 4?","o":["6","10","12","14"],"a":2,"e":"4 × 3 = 12, so 12 is a multiple of 4.","v":"multiples"},{"d":"BASIC","q":"Which list shows all positive factors of 8?","o":["1, 2, 4, 8","1, 2, 3, 8","2, 4, 6, 8","1, 4, 8, 16"],"a":0,"e":"The positive divisors of 8 are 1, 2, 4 and 8.","v":"factorpairs"},{"d":"BASIC","q":"What is the smallest positive multiple of 9?","o":["0","1","9","18"],"a":2,"e":"The positive multiples of 9 begin 9, 18, 27, …","v":"multiples"},{"d":"BASIC","q":"Which pair multiplies to make 15?","o":["2 and 7","3 and 5","4 and 4","1 and 12"],"a":1,"e":"3 × 5 = 15, so 3 and 5 are a factor pair.","v":"factorpairs"},{"d":"BASIC","q":"Is 21 divisible by 7?","o":["Yes, because 7 × 3 = 21","No, because 21 is odd","No, because 7 is larger","Yes, because 21 × 7 = 3"],"a":0,"e":"21 ÷ 7 = 3 exactly, so 21 is divisible by 7.","v":"division"},{"d":"BASIC","q":"Which number is a common factor of 8 and 12?","o":["5","6","4","9"],"a":2,"e":"4 divides both 8 and 12 exactly.","v":"common"},{"d":"BASIC","q":"Which number is a common multiple of 3 and 5?","o":["10","12","15","18"],"a":2,"e":"15 = 3 × 5, so it is a multiple of both 3 and 5.","v":"common"},{"d":"MEDIUM","q":"How many positive factors does 10 have?","o":["2","3","4","5"],"a":2,"e":"The positive factors are 1, 2, 5 and 10, giving four factors.","v":"factorpairs"},{"d":"MEDIUM","q":"Which list contains the first four positive multiples of 7?","o":["7, 14, 21, 28","1, 7, 14, 21","7, 12, 17, 22","14, 21, 28, 35"],"a":0,"e":"The first four positive multiples are 7×1, 7×2, 7×3 and 7×4.","v":"multiples"},{"d":"MEDIUM","q":"Which number is NOT a factor of 24?","o":["2","3","6","5"],"a":3,"e":"24 is not divisible by 5 without a remainder.","v":"factors"},{"d":"MEDIUM","q":"Find the greatest common factor of 12 and 18.","o":["2","3","6","9"],"a":2,"e":"Common factors include 1, 2, 3 and 6; the greatest is 6.","v":"common"},{"d":"MEDIUM","q":"Find the least positive common multiple of 4 and 6.","o":["6","10","12","24"],"a":2,"e":"12 is the first positive number in both the 4-times and 6-times tables.","v":"common"},{"d":"MEDIUM","q":"Which is a factor pair of 36?","o":["4 and 8","3 and 12","5 and 7","6 and 7"],"a":1,"e":"3 × 12 = 36, so 3 and 12 form a factor pair.","v":"factorpairs"},{"d":"MEDIUM","q":"A number is divisible by 2 and 3. Which must be a factor of that number?","o":["5","6","9","12"],"a":1,"e":"Divisibility by both 2 and 3 guarantees divisibility by their least common multiple, 6.","v":"division"},{"d":"MEDIUM","q":"Which number has exactly two positive factors?","o":["1","7","9","12"],"a":1,"e":"7 has only 1 and 7 as positive factors, so it has exactly two.","v":"factors"},{"d":"MEDIUM","q":"Which number is a common multiple of 4 and 10?","o":["20","24","30","36"],"a":0,"e":"20 = 4 × 5 and 10 × 2, so it is a common multiple.","v":"common"},{"d":"MEDIUM","q":"If 5 is a factor of n, which statement must be true for a positive integer n written in base ten?","o":["n is odd","n ends in 0 or 5","n is prime","n is less than 10"],"a":1,"e":"Positive multiples of 5 end in 0 or 5 in base ten.","v":"division"},{"d":"HARD","q":"Find the greatest common factor of 24 and 36.","o":["6","8","12","18"],"a":2,"e":"The greatest positive integer dividing both 24 and 36 is 12.","v":"common"},{"d":"HARD","q":"Find the least common multiple of 8 and 12.","o":["16","24","36","48"],"a":1,"e":"24 is 8 × 3 and 12 × 2, and is the least positive common multiple.","v":"common"},{"d":"HARD","q":"A teacher has 30 pencils and wants equal bundles with none left over. Which bundle size is NOT possible?","o":["3","5","6","8"],"a":3,"e":"30 ÷ 8 is not a whole number, so bundles of 8 leave pencils over.","v":"division"},{"d":"HARD","q":"Which number between 20 and 40 is a multiple of both 6 and 8?","o":["24","30","32","36"],"a":0,"e":"24 = 6 × 4 and 8 × 3, so it is divisible by both.","v":"common"},{"d":"HARD","q":"A number has positive factors 1, 2, 4, 8 and 16 only. What is the number?","o":["8","12","16","32"],"a":2,"e":"The positive factors of 16 are exactly 1, 2, 4, 8 and 16.","v":"factorpairs"},{"d":"HARD","q":"Which statement about positive multiples is always true for a positive integer n?","o":["n has finitely many positive multiples","n has infinitely many positive multiples","n is a factor of no number","Every multiple of n is smaller than n"],"a":1,"e":"The positive multiples n, 2n, 3n, and so on continue without end.","v":"multiples"},{"d":"HARD","q":"Two bells ring every 6 minutes and every 8 minutes. If they ring together now, after how many minutes will they next ring together?","o":["12","14","24","48"],"a":2,"e":"The least common multiple of 6 and 8 is 24 minutes.","v":"common"},{"d":"HARD","q":"Which number has exactly six positive factors?","o":["8","10","12","16"],"a":2,"e":"12 has positive factors 1, 2, 3, 4, 6 and 12—six in total.","v":"factors"},{"d":"HARD","q":"Find the smallest positive number divisible by 3, 4 and 5.","o":["12","20","30","60"],"a":3,"e":"The least common multiple of 3, 4 and 5 is 60.","v":"common"},{"d":"HARD","q":"A rectangular array has 4 rows and 9 columns. How many objects are there, and which is a factor of the total?","o":["36 objects; 5","36 objects; 9","32 objects; 9","13 objects; 4"],"a":1,"e":"4 × 9 = 36, and 9 divides 36 exactly.","v":"factorpairs"}];let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');const visuals={
factors:'<svg viewBox="0 0 300 100" role="img" aria-label="Factors divide a number into equal groups"><rect x="35" y="25" width="230" height="50" rx="10" fill="#91b7ff18" stroke="#91b7ff" stroke-width="2"/>'+Array.from({length:6},(_,i)=>'<circle cx="'+(60+i*36)+'" cy="50" r="8" fill="#58d6a3"/>').join('')+'<text x="150" y="91" fill="#f2f5ff" text-anchor="middle">Equal groups</text></svg>',
multiples:'<svg viewBox="0 0 320 100" role="img" aria-label="Multiples on a counting line"><path d="M20 52 H300" stroke="#91b7ff" stroke-width="2"/>'+[1,2,3,4,5].map((n,i)=>'<circle cx="'+(35+i*60)+'" cy="52" r="5" fill="#58d6a3"/><text x="'+(35+i*60)+'" y="78" fill="#f2f5ff" text-anchor="middle">'+(n*6)+'</text>').join('')+'</svg>',
factorpairs:'<svg viewBox="0 0 300 110" role="img" aria-label="Factor pairs multiply to form a number"><rect x="20" y="15" width="100" height="34" rx="8" stroke="#91b7ff" fill="#91b7ff18"/><text x="70" y="37" fill="#f2f5ff" text-anchor="middle">3</text><text x="150" y="37" fill="#58d6a3" text-anchor="middle">×</text><rect x="180" y="15" width="100" height="34" rx="8" stroke="#91b7ff" fill="#91b7ff18"/><text x="230" y="37" fill="#f2f5ff" text-anchor="middle">4</text><path d="M70 55 V68 H230 V55 M150 68 V80" stroke="#58d6a3" stroke-width="2" fill="none"/><text x="150" y="100" fill="#f2f5ff" text-anchor="middle">Product = 12</text></svg>',
division:'<svg viewBox="0 0 300 100" role="img" aria-label="Division tests whether a number divides evenly"><rect x="40" y="20" width="220" height="60" rx="10" fill="#58d6a318" stroke="#58d6a3" stroke-width="2"/><text x="150" y="46" fill="#f2f5ff" text-anchor="middle">Dividend ÷ divisor</text><text x="150" y="67" fill="#58d6a3" text-anchor="middle">No remainder</text></svg>',
common:'<svg viewBox="0 0 300 110" role="img" aria-label="Common factors or multiples shared by two numbers"><circle cx="115" cy="52" r="40" fill="#91b7ff22" stroke="#91b7ff" stroke-width="2"/><circle cx="185" cy="52" r="40" fill="#58d6a322" stroke="#58d6a3" stroke-width="2"/><text x="95" y="57" fill="#f2f5ff" text-anchor="middle">A</text><text x="205" y="57" fill="#f2f5ff" text-anchor="middle">B</text><text x="150" y="57" fill="#ffd27a" text-anchor="middle">Shared</text></svg>'
};function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'<div class="diagram">'+visuals[q.v]+'</div>':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const skills=[['Identify factors and multiples',8],['Order integers and interpret inequalities',18],['Solve multi-step integer comparisons',24]];$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">📏</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+skills.map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(index>=questions.length){restart();return;}act();});render();})();</script></body></html>
