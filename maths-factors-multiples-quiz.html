mber?","o":["5","6","9","12"],"a":1,"e":"Divisibility by both 2 and 3 guarantees divisibility by their least common multiple, 6.","v":"division"},{"d":"MEDIUM","q":"Which number has exactly two positive factors?","o":["1","7","9","12"],"a":1,"e":"7 has only 1 and 7 as positive factors, so it has exactly two.","v":"factors"},{"d":"MEDIUM","q":"Which number is a common multiple of 4 and 10?","o":["20","24","30","36"],"a":0,"e":"20 = 4 × 5 and 10 × 2, so it is a common multiple.","v":"common"},{"d":"MEDIUM","q":"If 5 is a factor of n, which statement must be true for a positive integer n written in base ten?","o":["n is odd","n ends in 0 or 5","n is prime","n is less than 10"],"a":1,"e":"Positive multiples of 5 end in 0 or 5 in base ten.","v":"division"},{"d":"HARD","q":"Find the greatest common factor of 24 and 36.","o":["6","8","12","18"],"a":2,"e":"The greatest positive integer dividing both 24 and 36 is 12.","v":"common"},{"d":"HARD","q":"Find the least common multiple of 8 and 12.","o":["16","24","36","48"],"a":1,"e":"24 is 8 × 3 and 12 × 2, and is the least positive common multiple.","v":"common"},{"d":"HARD","q":"A teacher has 30 pencils and wants equal bundles with none left over. Which bundle size is NOT possible?","o":["3","5","6","8"],"a":3,"e":"30 ÷ 8 is not a whole number, so bundles of 8 leave pencils over.","v":"division"},{"d":"HARD","q":"Which number between 20 and 40 is a multiple of both 6 and 8?","o":["24","30","32","36"],"a":0,"e":"24 = 6 × 4 and 8 × 3, so it is divisible by both.","v":"common"},{"d":"HARD","q":"A number has positive factors 1, 2, 4, 8 and 16 only. What is the number?","o":["8","12","16","32"],"a":2,"e":"The positive factors of 16 are exactly 1, 2, 4, 8 and 16.","v":"factorpairs"},{"d":"HARD","q":"Which statement about positive multiples is always true for a positive integer n?","o":["n has finitely many positive multiples","n has infinitely many positive multiples","n is a factor of no number","Every multiple of n is smaller than '')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;streak=0;correct=0;$('xp').textContent='0';$('streak').textContent='0';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script>
