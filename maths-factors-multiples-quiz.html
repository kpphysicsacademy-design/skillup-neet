<script>
(function(){'use strict';
const originalQuestions=[{"id":"b01","d":"BASIC","q":"Which number is a factor of 18?","o":["5","6","7","8"],"a":1,"e":"18 ÷ 6 = 3 with no remainder, so 6 is a factor of 18."},{"id":"b02","d":"BASIC","q":"Which number is a multiple of 8?","o":["18","24","30","34"],"a":1,"e":"8 × 3 = 24, so 24 is a multiple of 8."},{"id":"b03","d":"BASIC","q":"Which list gives all positive factors of 15?","o":["1, 3, 5, 15","1, 2, 5, 15","3, 5, 10, 15","1, 5, 15, 30"],"a":0,"e":"The positive whole numbers that divide 15 exactly are 1, 3, 5 and 15."},{"id":"b04","d":"BASIC","q":"What is the smallest positive multiple of 7?","o":["0","1","7","14"],"a":2,"e":"The positive multiples of 7 begin 7, 14, 21, and so on."},{"id":"b05","d":"BASIC","q":"Which pair is a factor pair of 24?","o":["3 and 8","4 and 5","2 and 10","6 and 6"],"a":0,"e":"3 × 8 = 24, so 3 and 8 form a factor pair."},{"id":"b06","d":"BASIC","q":"Which number is a factor of every positive whole number?","o":["0","1","2","10"],"a":1,"e":"Every positive whole number is divisible by 1."},{"id":"b07","d":"BASIC","q":"Which number is a common factor of 12 and 18?","o":["4","5","6","9"],"a":2,"e":"Both 12 ÷ 6 = 2 and 18 ÷ 6 = 3 are exact divisions."},{"id":"b08","d":"BASIC","q":"Which number is a common multiple of 3 and 4?","o":["8","10","12","15"],"a":2,"e":"12 = 3 × 4 and also 4 × 3, so it is a multiple of both."},{"id":"b09","d":"BASIC","q":"Is 35 divisible by 5?","o":["Yes, because 5 × 7 = 35","No, because 35 is odd","No, because 5 is smaller","Yes, because 35 + 5 = 40"],"a":0,"e":"35 ÷ 5 = 7 exactly, so 35 is divisible by 5."},{"id":"b10","d":"BASIC","q":"Which number is a multiple of both 2 and 5?","o":["12","15","20","25"],"a":2,"e":"20 is divisible by 2 and by 5, so it is a common multiple."},{"id":"m11","d":"MEDIUM","q":"How many positive factors does 18 have?","o":["4","5","6","8"],"a":2,"e":"The positive factors are 1, 2, 3, 6, 9 and 18: six in total."},{"id":"m12","d":"MEDIUM","q":"Which list shows the first four positive multiples of 6?","o":["6, 12, 18, 24","0, 6, 12, 18","6, 10, 14, 18","12, 18, 24, 30"],"a":0,"e":"The first four positive multiples are 6 × 1, 6 × 2, 6 × 3 and 6 × 4."},{"id":"m13","d":"MEDIUM","q":"Which number is NOT a factor of 42?","o":["2","3","6","8"],"a":3,"e":"42 ÷ 8 is not a whole number, so 8 is not a factor."},{"id":"m14","d":"MEDIUM","q":"Find the greatest common factor of 18 and 30.","o":["3","6","9","12"],"a":1,"e":"The common positive factors are 1, 2, 3 and 6; the greatest is 6."},{"id":"m15","d":"MEDIUM","q":"Find the least positive common multiple of 8 and 12.","o":["16","20","24","48"],"a":2,"e":"24 is the smallest positive number divisible by both 8 and 12."},{"id":"m16","d":"MEDIUM","q":"Which pair is a factor pair of 48?","o":["5 and 9","6 and 8","4 and 10","3 and 15"],"a":1,"e":"6 × 8 = 48, so this pair gives a product of 48."},{"id":"m17","d":"MEDIUM","q":"A whole number is divisible by both 2 and 3. Which number must divide it?","o":["4","5","6","9"],"a":2,"e":"A number divisible by both 2 and 3 is divisible by their least common multiple, 6."},{"id":"m18","d":"MEDIUM","q":"Which number has exactly two positive factors?","o":["1","13","15","21"],"a":1,"e":"13 is prime: its only positive factors are 1 and 13."},{"id":"m19","d":"MEDIUM","q":"Which number is a common multiple of 6 and 9?","o":["18","24","30","36"],"a":0,"e":"18 = 6 × 3 and 9 × 2, so it is a common multiple."},{"id":"m20","d":"MEDIUM","q":"How many groups of 8 can be made from 72 objects with none left over?","o":["7","8","9","10"],"a":2,"e":"72 ÷ 8 = 9, so nine equal groups can be made."},{"id":"h21","d":"HARD","q":"Find the greatest common factor of 36 and 60.","o":["6","9","12","18"],"a":2,"e":"The greatest integer that divides both 36 and 60 exactly is 12."},{"id":"h22","d":"HARD","q":"Find the least common multiple of 12 and 15.","o":["30","45","60","90"],"a":2,"e":"12 = 2² × 3 and 15 = 3 × 5, so the LCM is 2² × 3 × 5 = 60."},{"id":"h23","d":"HARD","q":"A teacher has 48 pencils and makes equal bundles with none left over. Which bundle size is NOT possible?","o":["4","6","8","5"],"a":3,"e":"48 ÷ 5 is not a whole number, so bundles of 5 leave a remainder."},{"id":"h24","d":"HARD","q":"Which number between 60 and 80 is a multiple of both 8 and 9?","o":["64","68","72","76"],"a":2,"e":"72 = 8 × 9 and 9 × 8, so it is divisible by both."},{"id":"h25","d":"HARD","q":"A number has exactly the positive factors 1, 2, 3, 6, 9 and 18. What is the number?","o":["12","15","18","24"],"a":2,"e":"The positive factors of 18 are exactly 1, 2, 3, 6, 9 and 18."},{"id":"h26","d":"HARD","q":"Two alarms sound every 12 minutes and every 18 minutes. If they sound together now, when will they next sound together?","o":["24 minutes","30 minutes","36 minutes","48 minutes"],"a":2,"e":"The least common multiple of 12 and 18 is 36 minutes."},{"id":"h27","d":"HARD","q":"Which number has exactly eight positive factors?","o":["16","18","24","32"],"a":2,"e":"24 has factors 1, 2, 3, 4, 6, 8, 12 and 24: eight factors."},{"id":"h28","d":"HARD","q":"Find the smallest positive number divisible by 4, 6 and 10.","o":["20","30","40","60"],"a":3,"e":"The LCM of 4, 6 and 10 is 60."},{"id":"h29","d":"HARD","q":"A rectangular array has 6 rows and 8 columns. Which statement is correct?","o":["48 objects; 6 is a factor of 48","42 objects; 8 is a factor of 42","48 objects; 5 is a factor of 48","56 objects; 6 is a factor of 56"],"a":0,"e":"6 × 8 = 48, and 48 ÷ 6 = 8 exactly."},{"id":"h30","d":"HARD","q":"A number is divisible by 3 and 5. Which must be true?","o":["It is divisible by 8","It is divisible by 15","It is always prime","It must be odd"],"a":1,"e":"Since 3 and 5 are coprime, divisibility by both guarantees divisibility by 15."}];
let questions=originalQuestions.slice(),index=0,selected=-1,locked=false,xp=0,correct=0,streak=0;
let mistakes=[];
const $=id=>document.getElementById(id);
function make(tag,cls,txt){const el=document.createElement(tag);if(cls)el.className=cls;if(txt!==undefined)el.textContent=txt;return el;}
function updateProgress(){const pct=Math.round(index/questions.length*100);$('fill').style.width=pct+'%';$('percent').textContent=pct+'%';$('progressText').textContent='Question '+Math.min(index+1,questions.length)+' of '+questions.length;document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(pct));}
function render(){const q=questions[index];selected=-1;locked=false;$('qmeta').textContent='QUESTION '+(index+1)+' · '+q.d;$('question').textContent=q.q;$('options').replaceChildren();q.o.forEach((label,i)=>{const b=make('button','option');b.type='button';const letter=make('span','letter',String.fromCharCode(65+i));const value=make('span','',label);b.append(letter,value);b.addEventListener('click',()=>{if(locked)return;selected=i;$('options').querySelectorAll('.option').forEach((el,j)=>el.classList.toggle('selected',j===i));$('check').disabled=false;});$('options').append(b);});$('feedback').className='feedback';$('feedback').textContent='';$('check').style.display='block';$('check').disabled=true;$('continue').className='btn continue';updateProgress();}
function checkAnswer(){if(selected<0||locked)return;locked=true;const q=questions[index],isCorrect=selected===q.a;if(isCorrect){correct++;xp+=10;streak++;$('xp').textContent=String(xp);$('streak').textContent=String(streak);}else{streak=0;$('streak').textContent='0';mistakes.push({id:q.id,question:q.q,chosen:q.o[selected],answer:q.o[q.a],explanation:q.e});}
$('options').querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});
$('feedback').textContent=(isCorrect?'Correct! ':'Let’s review. ')+q.e;$('feedback').className='feedback show '+(isCorrect?'good':'bad');$('check').style.display='none';$('continue').className='btn continue show';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';}
function restart(wrongOnly){const retry=wrongOnly?originalQuestions.filter(q=>mistakes.some(m=>m.id===q.id)):originalQuestions.slice();questions=retry;index=0;selected=-1;locked=false;xp=0;correct=0;streak=0;mistakes=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();}
function finish(){updateProgress();$('quiz').style.display='none';const slot=$('finishSlot');slot.replaceChildren();const card=make('section','finish');const trophy=make('div','trophy','🏆');const heading=make('h2', '',correct>=25?'Excellent work!':correct>=18?'Good progress!':'Keep practising!');const simulator=make('a','topic-link','🧪 Explore Factors & Multiples Simulator →');simulator.href='maths-factors-multiples-simulator.html?v=20261111-factors-multiples-simulator-v1';const score=make('div','score',correct+' / '+questions.length);const summary=make('p','muted','You answered '+correct+' correctly and earned '+xp+' XP.');const accuracy=make('p','',Math.round(correct/questions.length*100)+'% accuracy');card.append(trophy,heading,simulator,score,summary,accuracy);
const review=make('div','review');review.append(make('h3','',mistakes.length?'Review your mistakes ('+mistakes.length+')':'Perfect round!'));mistakes.forEach((m,i)=>{const item=make('div','review-item');item.append(make('b','',(i+1)+'. '+m.question),make('p','your-answer','Your answer: '+m.chosen),make('p','correct-answer','Correct answer: '+m.answer),make('p','',m.explanation));review.append(item);});card.append(review);
const actions=make('div','review-actions');const wrong=make('button','btn secondary','Retry mistakes');wrong.type='button';wrong.disabled=!mistakes.length;wrong.addEventListener('click',()=>restart(true));const all=make('button','btn primary','Retry all');all.type='button';all.addEventListener('click',()=>restart(false));actions.append(wrong,all);card.append(actions);slot.append(card);}
$('check').addEventListener('click',checkAnswer);$('continue').addEventListener('click',()=>{index++;if(index<questions.length)render();else finish();});render();
})();
</script>
