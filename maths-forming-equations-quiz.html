<script>
(function(){'use strict';
const questions=[{"d":"BASIC","q":"Which equation means “a number n plus 6 is 14”?","o":["n − 6 = 14","n + 6 = 14","6n = 14","n + 14 = 6"],"a":1,"e":"“Plus 6” gives n + 6, and “is 14” means equals 14.","v":"forming-equations"},{"d":"BASIC","q":"Which equation means “twice x is 18”?","o":["x + 2 = 18","x − 2 = 18","2x = 18","x ÷ 2 = 18"],"a":2,"e":"Twice x means 2 multiplied by x.","v":"forming-equations"},{"d":"BASIC","q":"A number y decreased by 5 is 9. Which equation represents this?","o":["5 − y = 9","y + 5 = 9","5y = 9","y − 5 = 9"],"a":3,"e":"Decreased by 5 means subtract 5 from y.","v":"forming-equations"},{"d":"BASIC","q":"Which equation means “7 more than p equals 20”?","o":["7p = 20","p − 7 = 20","p + 7 = 20","p + 20 = 7"],"a":2,"e":"Seven more than p is p + 7.","v":"forming-equations"},{"d":"BASIC","q":"A pencil costs ₹x. Four pencils cost ₹28. Which equation models this?","o":["x + 4 = 28","4 + x = 28","x − 4 = 28","4x = 28"],"a":3,"e":"Four equal-price pencils cost 4x rupees.","v":"forming-equations"},{"d":"BASIC","q":"The sum of a number a and 11 is 25. Choose the equation.","o":["a − 11 = 25","11a = 25","a + 11 = 25","a + 25 = 11"],"a":2,"e":"The sum of a and 11 is written a + 11.","v":"forming-equations"},{"d":"BASIC","q":"A number m divided by 3 gives 8. Which equation is correct?","o":["3m = 8","m + 3 = 8","m − 3 = 8","m ÷ 3 = 8"],"a":3,"e":"Dividing m by 3 is m ÷ 3.","v":"forming-equations"},{"d":"BASIC","q":"Five times a number t is 35. Which equation represents it?","o":["t + 5 = 35","5t = 35","t − 5 = 35","t ÷ 5 = 35"],"a":1,"e":"Five times t is 5t.","v":"forming-equations"},{"d":"BASIC","q":"A number k is 4 less than 13. Which equation matches the statement?","o":["k + 4 = 13","4 − k = 13","k − 4 = 13","13k = 4"],"a":0,"e":"If k is 4 less than 13, then k + 4 = 13.","v":"forming-equations"},{"d":"BASIC","q":"There are x students on a bus. 9 more board and there are 27. Which equation fits?","o":["x − 9 = 27","9x = 27","x + 9 = 27","x + 27 = 9"],"a":2,"e":"Adding 9 students to x gives x + 9 = 27.","v":"forming-equations"},{"d":"MEDIUM","q":"A number plus 12 equals 31. What is the number?","o":["17","19","21","43"],"a":1,"e":"Subtract 12 from both sides: 31 − 12 = 19.","v":"forming-equations"},{"d":"MEDIUM","q":"Three times a number is 42. Find the number.","o":["12","14","39","45"],"a":1,"e":"Divide 42 by 3 to find the number.","v":"forming-equations"},{"d":"MEDIUM","q":"A number minus 8 equals 17. Find the number.","o":["9","25","15","136"],"a":1,"e":"Add 8 to 17: the number is 25.","v":"forming-equations"},{"d":"MEDIUM","q":"Twice a number plus 5 equals 23. What is the number?","o":["7","9","14","18"],"a":0,"e":"Subtract 5 to get 18, then divide by 2.","v":"forming-equations"},{"d":"MEDIUM","q":"Seven less than a number is 16. Find the number.","o":["9","23","112","14"],"a":1,"e":"Add 7 to 16 to recover the number.","v":"forming-equations"},{"d":"MEDIUM","q":"A number divided by 4 is 6. What is the number?","o":["10","1.5","24","2"],"a":2,"e":"Multiply 6 by 4.","v":"forming-equations"},{"d":"MEDIUM","q":"The perimeter of a square is 36 cm. If each side is s cm, which equation models it?","o":["s + 4 = 36","4s = 36","s ÷ 4 = 36","s − 4 = 36"],"a":1,"e":"A square has four equal sides, so its perimeter is 4s.","v":"forming-equations"},{"d":"MEDIUM","q":"An adult ticket costs ₹a. Two tickets and a ₹10 fee cost ₹70. Which equation fits?","o":["2a − 10 = 70","a + 10 = 70","2a + 10 = 70","10a + 2 = 70"],"a":2,"e":"Two tickets cost 2a; adding the fee gives 2a + 10.","v":"forming-equations"},{"d":"MEDIUM","q":"Five more than three times x is 26. Which equation represents it?","o":["3(x + 5) = 26","5x + 3 = 26","3x + 5 = 26","3x − 5 = 26"],"a":2,"e":"Three times x is 3x; five more gives 3x + 5.","v":"forming-equations"},{"d":"MEDIUM","q":"A ribbon of length L is cut into 4 equal pieces of 7 cm each. Which equation finds L?","o":["L + 4 = 7","L − 4 = 7","4L = 7","L ÷ 4 = 7"],"a":3,"e":"Each piece is one-fourth of L, so L ÷ 4 = 7.","v":"forming-equations"},{"d":"HARD","q":"Three times a number decreased by 4 equals 29. Find the number.","o":["7","11","13","33"],"a":1,"e":"Write 3x − 4 = 29; add 4 to get 33, then divide by 3 to get 11.","v":"forming-equations"},{"d":"HARD","q":"A number and its double add to 45. What is the number?","o":["15","22","30","43"],"a":0,"e":"Let x be the number: x + 2x = 45.","v":"forming-equations"},{"d":"HARD","q":"A rectangle has width w and length w + 5. Its perimeter is 34 cm. Find w.","o":["5 cm","6 cm","8 cm","12 cm"],"a":1,"e":"Use 2(w + w + 5) = 34, then solve for w.","v":"forming-equations"},{"d":"HARD","q":"Four identical notebooks and a ₹12 pen cost ₹92. What is the price of one notebook?","o":["₹18","₹20","₹23","₹26"],"a":1,"e":"Let n be the notebook price: 4n + 12 = 92.","v":"forming-equations"},{"d":"HARD","q":"A number is multiplied by 5, then 7 is added; the result is 52. Find the number.","o":["9","11","12","45"],"a":0,"e":"Solve 5x + 7 = 52 by undoing addition before multiplication.","v":"forming-equations"},{"d":"HARD","q":"Three consecutive integers have sum 72. What is the smallest integer?","o":["22","23","24","25"],"a":1,"e":"Let the integers be n, n + 1 and n + 2; their sum is 72.","v":"forming-equations"},{"d":"HARD","q":"A taxi charges ₹50 plus ₹12 per kilometre. The total fare is ₹146. How many kilometres were travelled?","o":["6 km","8 km","12 km","16 km"],"a":1,"e":"Let d be distance: 50 + 12d = 146.","v":"forming-equations"},{"d":"HARD","q":"A father is 4 times his child's age. Their ages total 50 years. How old is the child?","o":["8 years","10 years","12 years","40 years"],"a":1,"e":"If the child is c, then c + 4c = 50, so 5c = 50 and c = 10.","v":"forming-equations"},{"d":"HARD","q":"A number is halved and then 9 is added to get 21. Find the number.","o":["6","15","24","42"],"a":3,"e":"Let x be the number: x ÷ 2 + 9 = 21.","v":"forming-equations"},{"d":"HARD","q":"Three identical boxes and a 5 kg bag weigh 32 kg altogether. Each box weighs how much?","o":["7 kg","8 kg","9 kg","12 kg"],"a":2,"e":"Let b be one box’s weight: 3b + 5 = 32.","v":"forming-equations"}];

const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');
function updateProgress(){const p=index>=questions.length?100:index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}
function render(){if(index>=questions.length){results();return;}const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · FORMING EQUATIONS';$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';const content=$('content');content.replaceChildren();const question=document.createElement('div');question.className='question';question.textContent=q.q;content.appendChild(question);const choices=document.createElement('div');choices.className='choices';content.appendChild(choices);q.o.forEach((answer,i)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.dataset.i=String(i);b.textContent=answer;b.addEventListener('click',()=>{if(locked)return;selected=i;choices.querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===i));$('action').disabled=false;});choices.appendChild(b);});$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}
function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;if(window.skillupCelebrate)window.skillupCelebrate();xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===selected&&!good)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Explanation: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();}else results();}
function results(){finished=true;updateProgress();$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='🏆 Forming Equations complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const content=$('content');content.replaceChildren();const end=document.createElement('div');end.className='end';const trophy=document.createElement('div');trophy.style.fontSize='3rem';trophy.textContent='🏆';end.appendChild(trophy);const title=document.createElement('h1');title.textContent=correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!';end.appendChild(title);const score=document.createElement('div');score.className='score';score.textContent=correct+' / '+questions.length;end.appendChild(score);const p=document.createElement('p');p.textContent='You answered '+correct+' questions correctly.';end.appendChild(p);const summary=document.createElement('div');summary.className='summary';summary.innerHTML='⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining';end.appendChild(summary);const skills=document.createElement('div');skills.className='skills';[['🔤','Translate words into equations','Turn statements into mathematical sentences'],['🧮','Identify unknowns and operations','Choose operations from clue words'],['🎯','Model real-world problems','Represent relationships with equations']].forEach(item=>{const row=document.createElement('div');row.className='skill';const icon=document.createElement('span');icon.className='skill-icon';icon.textContent=item[0];const info=document.createElement('div');const strong=document.createElement('strong');strong.textContent=item[1];const small=document.createElement('small');small.textContent=item[2];info.append(strong,small);row.append(icon,info);skills.appendChild(row);});end.appendChild(skills);content.appendChild(end);$('action').textContent='Try again ↻';$('action').disabled=false;}
function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}
$('action').addEventListener('click',()=>{if(finished)restart();else act();});try{render();}catch(err){$('content').textContent='The quiz could not start. Please refresh the page.';console.error('Forming Equations quiz initialization failed',err);}
})();
</script>
