<h1>Addition &amp; Subtraction of Fractions</h1>
<p class="sub">Practise adding and subtracting like fractions, unlike fractions and mixed numbers with step-by-step feedback.</p>

<script>
(()=>{'use strict';
const questions=[{"q":"1/5 + 2/5 = ?","o":["2/5","3/5","1/5","3/10"],"a":1,"why":"The denominators are equal, so add the numerators: 1 + 2 = 3."},{"q":"4/7 − 1/7 = ?","o":["3/14","1/7","3/7","5/7"],"a":2,"why":"Subtract the numerators: 4 − 1 = 3; keep denominator 7."},{"q":"2/8 + 3/8 = ?","o":["6/8","5/16","1/8","5/8"],"a":3,"why":"Add the numerators to get 5 and keep denominator 8."},{"q":"6/9 − 2/9 = ?","o":["4/9","8/9","4/18","2/9"],"a":0,"why":"6 − 2 = 4, so the result is 4/9."},{"q":"1/4 + 1/4 = ?","o":["1/4","2/4","3/8","1/2"],"a":3,"why":"1/4 + 1/4 = 2/4, which simplifies to 1/2."},{"q":"5/6 − 2/6 = ?","o":["3/12","1/2","2/6","7/6"],"a":1,"why":"The difference is 3/6, which simplifies to 1/2."},{"q":"3/10 + 4/10 = ?","o":["1/10","7/10","6/10","7/20"],"a":1,"why":"Add 3 and 4 while keeping the denominator 10."},{"q":"7/8 − 3/8 = ?","o":["4/16","3/8","1/2","5/8"],"a":2,"why":"7/8 − 3/8 = 4/8 = 1/2."},{"q":"2/5 + 1/5 = ?","o":["2/10","3/10","1/5","3/5"],"a":3,"why":"The sum is 3/5 because the denominators are the same."},{"q":"4/6 − 1/6 = ?","o":["1/2","5/6","3/12","2/6"],"a":0,"why":"4/6 − 1/6 = 3/6 = 1/2."},{"q":"1/2 + 1/4 = ?","o":["1/6","1/4","2/6","3/4"],"a":3,"why":"Rewrite 1/2 as 2/4; then 2/4 + 1/4 = 3/4."},{"q":"2/3 − 1/6 = ?","o":["1/3","1/2","3/9","1/6"],"a":1,"why":"2/3 = 4/6, and 4/6 − 1/6 = 3/6 = 1/2."},{"q":"1/3 + 1/6 = ?","o":["1/9","1/2","2/6","2/9"],"a":1,"why":"1/3 = 2/6; adding gives 3/6 = 1/2."},{"q":"3/4 − 1/2 = ?","o":["2/2","2/4","1/4","1/2"],"a":2,"why":"1/2 = 2/4; therefore 3/4 − 2/4 = 1/4."},{"q":"2/5 + 1/10 = ?","o":["2/15","3/15","3/10","1/2"],"a":3,"why":"2/5 = 4/10; the sum is 5/10 = 1/2."},{"q":"5/6 − 1/3 = ?","o":["1/2","2/3","4/3","1/3"],"a":0,"why":"1/3 = 2/6, so 5/6 − 2/6 = 3/6 = 1/2."},{"q":"1/8 + 3/4 = ?","o":["1/2","5/8","4/12","7/8"],"a":3,"why":"3/4 = 6/8; 1/8 + 6/8 = 7/8."},{"q":"7/10 − 1/5 = ?","o":["6/5","1/2","3/10","5/10"],"a":1,"why":"1/5 = 2/10; 7/10 − 2/10 = 5/10 = 1/2."},{"q":"2/3 + 1/9 = ?","o":["5/9","7/9","1","3/12"],"a":1,"why":"2/3 = 6/9; adding 1/9 gives 7/9."},{"q":"5/8 − 1/4 = ?","o":["4/4","1/8","3/8","1/2"],"a":2,"why":"1/4 = 2/8; 5/8 − 2/8 = 3/8."},{"q":"3/5 + 7/10 = ?","o":["9/10","10/15","1","13/10"],"a":3,"why":"3/5 = 6/10; 6/10 + 7/10 = 13/10 = 1 3/10."},{"q":"7/12 − 1/8 = ?","o":["11/24","5/24","6/4","13/24"],"a":0,"why":"Use denominator 24: 14/24 − 3/24 = 11/24."},{"q":"2 1/4 + 1 2/3 = ?","o":["4 1/12","3 1/12","3 5/7","3 11/12"],"a":3,"why":"Add whole parts to get 3; 1/4 + 2/3 = 3/12 + 8/12 = 11/12."},{"q":"4 1/2 − 2 3/4 = ?","o":["2 1/4","1 3/4","2 3/4","1 1/4"],"a":1,"why":"4 1/2 = 4 2/4; regroup to 3 6/4, then subtract 2 3/4 = 1 3/4."},{"q":"A recipe needs 3/4 cup of milk. You have added 1/3 cup. How much more is needed?","o":["7/12 cup","5/12 cup","1/4 cup","1/2 cup"],"a":1,"why":"3/4 − 1/3 = 9/12 − 4/12 = 5/12 cup."},{"q":"A path is 5/6 km long. You walk 3/8 km. How much remains?","o":["2/3 km","7/24 km","11/24 km","1/2 km"],"a":2,"why":"5/6 − 3/8 = 20/24 − 9/24 = 11/24 km."},{"q":"What is 1 1/2 + 2 2/5?","o":["3 7/10","3 3/7","4 1/10","3 9/10"],"a":3,"why":"Add whole parts to get 3; 1/2 + 2/5 = 5/10 + 4/10 = 9/10."},{"q":"A tank is 7/8 full. Water equal to 1/3 of the tank is used. What fraction remains?","o":["13/24","4/11","5/8","17/24"],"a":0,"why":"7/8 − 1/3 = 21/24 − 8/24 = 13/24."},{"q":"Calculate 2/3 + 5/12 − 1/4.","o":["7/12","1","3/4","5/6"],"a":3,"why":"Convert to twelfths: 8/12 + 5/12 − 3/12 = 10/12 = 5/6."},{"q":"You read 2/5 of a book on Monday and 1/4 on Tuesday. What fraction of the book is unread?","o":["13/20","7/20","9/20","3/20"],"a":1,"why":"Read total is 2/5 + 1/4 = 8/20 + 5/20 = 13/20; unread is 7/20."}];
let index=0,selected=-1,locked=false,xp=0,correct=0,finished=false,wrong=[];
const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');
function setProgress(value){const p=Math.round(value);bar.style.width=p+'%';$('pct').textContent=p+'%';progress.setAttribute('aria-valuenow',String(p));}
function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='Question '+(index+1)+' of '+questions.length;$('meta').textContent=(index<10?'BASIC':index<20?'MEDIUM':'HARD')+' · Choose one answer';$('hint').textContent='Select an answer to continue';$('feedback').className='feedback';$('feedback').textContent='';$('content').replaceChildren();const stem=document.createElement('h2');stem.className='question';stem.textContent=q.q;$('content').appendChild(stem);const list=document.createElement('div');list.className='options';q.o.forEach((label,i)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+i);const text=document.createElement('span');text.textContent=label;b.append(letter,text);b.addEventListener('click',()=>{if(locked)return;selected=i;list.querySelectorAll('.option').forEach((el,j)=>el.classList.toggle('selected',j===i));$('action').disabled=false;});list.appendChild(b);});$('content').appendChild(list);$('action').textContent='Check answer';$('action').disabled=true;setProgress(index/questions.length*100);}
function showResults(){finished=true;setProgress(100);$('counter').textContent='Quiz complete';$('meta').textContent='PRACTICE COMPLETE';$('hint').textContent='Review your mistakes or practise again';$('feedback').className='feedback';$('content').replaceChildren();const box=document.createElement('div');box.className='result';const title=document.createElement('h2');title.textContent=correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!';const score=document.createElement('div');score.className='score';score.textContent=correct+' / '+questions.length;const pct=document.createElement('p');pct.textContent=Math.round(correct/questions.length*100)+'% correct';const summary=document.createElement('div');summary.className='summary';summary.textContent='⭐ '+xp+' XP earned';box.append(title,score,pct,summary);if(wrong.length){const heading=document.createElement('h3');heading.textContent='Review your mistakes';const review=document.createElement('div');review.className='review';wrong.forEach((item,i)=>{const row=document.createElement('div');row.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(i+1)+'. '+item.q;const your=document.createElement('p');your.textContent='Your answer: '+item.your;const answer=document.createElement('p');answer.className='correct-answer';answer.textContent='Correct answer: '+item.answer;const why=document.createElement('p');why.textContent=item.why;row.append(q,your,answer,why);review.appendChild(row);});box.append(heading,review);}else{const perfect=document.createElement('p');perfect.textContent='🌟 Perfect score! All answers correct.';box.appendChild(perfect);}$('content').appendChild(box);$('action').textContent='Try again ↻';$('action').disabled=false;}
function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{wrong.push({q:q.q,your:q.o[selected],answer:q.o[q.a],why:q.why});}$('content').querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('correct');else if(i===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'Correct! ':'Not quite. ')+q.why;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Read the explanation, then continue';$('action').textContent=index===questions.length-1?'View results':'Next question';return;}if(index<questions.length-1){index++;render();}else showResults();}
function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;correct=0;wrong=[];$('xp').textContent='⭐ 0 XP';render();}
$('action').addEventListener('click',()=>finished?restart():act());render();
})();
</script>
