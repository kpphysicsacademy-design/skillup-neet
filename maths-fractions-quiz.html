s="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Fractions</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Fractions skills"><div class="skill-title">🎯 Fractions Skills</div><div class="skill-list"><div class="skill-item">Recognise fractions and equivalent forms</div><div class="skill-item">Compare and simplify fractions</div><div class="skill-item">Calculate fraction operations and word problems</div></div></section></div><script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Which fraction represents one half?","o":["1/3","1/2","2/3","3/4"],"a":1,"e":"One half means one of two equal parts.","v":"fraction"},{"d":"BASIC","q":"In 3/7, what is the denominator?","o":["3","4","7","10"],"a":2,"e":"The denominator is the bottom number, 7.","v":"fraction"},{"d":"BASIC","q":"Which fraction is equivalent to 1/2?","o":["2/3","2/4","3/5","4/6"],"a":1,"e":"Multiplying numerator and denominator of 1/2 by 2 gives 2/4.","v":"equivalent"},{"d":"BASIC","q":"Which fraction is greater?","o":["1/4","1/2","They are equal","Cannot compare"],"a":1,"e":"For unit fractions, the smaller denominator gives the larger fraction: 1/2 > 1/4.","v":"compare"},{"d":"BASIC","q":"What is 1/5 + 2/5?","o":["3/10","3/5","2/5","3/25"],"a":1,"e":"With equal denominators, add numerators: (1 + 2)/5 = 3/5.","v":"add"},{"d":"BASIC","q":"What is 4/7 − 1/7?","o":["3/7","3/14","5/7","1/7"],"a":0,"e":"Subtract the numerators and keep denominator 7: 4/7 − 1/7 = 3/7.","v":"add"},{"d":"BASIC","q":"Which fraction is in simplest form?","o":["2/4","3/9","4/8","2/5"],"a":3,"e":"2 and 5 have no common factor greater than 1, so 2/5 is simplified.","v":"equivalent"},{"d":"BASIC","q":"What is 1/2 of 10?","o":["2","5","8","10"],"a":1,"e":"Half of 10 is 10 ÷ 2 = 5.","v":"fraction"},{"d":"BASIC","q":"Which fraction equals one whole?","o":["2/3","3/4","5/5","4/5"],"a":2,"e":"A fraction with equal numerator and denominator equals 1 whole.","v":"fraction"},{"d":"BASIC","q":"Which fraction is the smallest?","o":["1/2","1/3","1/4","1/5"],"a":3,"e":"Among unit fractions, a larger denominator means a smaller part.","v":"compare"},{"d":"MEDIUM","q":"Simplify 6/8.","o":["2/3","3/4","4/5","6/4"],"a":1,"e":"Divide numerator and denominator by 2: 6/8 = 3/4.","v":"equivalent"},{"d":"MEDIUM","q":"Calculate 1/2 + 1/4.","o":["2/6","3/4","1/6","2/4"],"a":1,"e":"Convert 1/2 to 2/4; then 2/4 + 1/4 = 3/4.","v":"add"},{"d":"MEDIUM","q":"Calculate 5/6 − 1/3.","o":["4/3","4/6","1/2","2/3"],"a":2,"e":"1/3 = 2/6, so 5/6 − 2/6 = 3/6 = 1/2.","v":"add"},{"d":"MEDIUM","q":"Calculate 2/3 × 3/5.","o":["1/5","2/5","3/5","6/5"],"a":1,"e":"Multiply across: (2 × 3)/(3 × 5) = 6/15 = 2/5.","v":"multiply"},{"d":"MEDIUM","q":"Calculate 3/4 ÷ 1/2.","o":["3/8","3/2","4/3","1/4"],"a":1,"e":"Divide by 1/2 by multiplying by 2: 3/4 × 2 = 3/2.","v":"divide"},{"d":"MEDIUM","q":"Which is greater: 3/4 or 2/3?","o":["3/4","2/3","They are equal","Both equal 1"],"a":0,"e":"Using denominator 12 gives 9/12 > 8/12.","v":"compare"},{"d":"MEDIUM","q":"Convert 7/4 to a mixed number.","o":["1 1/4","1 3/4","2 1/4","3 1/4"],"a":1,"e":"7 ÷ 4 gives 1 remainder 3, so 7/4 = 1 3/4.","v":"fraction"},{"d":"MEDIUM","q":"What fraction of 12 is 3?","o":["1/3","1/4","1/2","3/4"],"a":1,"e":"The fraction is 3/12, which simplifies to 1/4.","v":"fraction"},{"d":"MEDIUM","q":"Calculate 2/5 + 1/10.","o":["3/15","3/10","1/2","1/5"],"a":2,"e":"2/5 = 4/10; 4/10 + 1/10 = 5/10 = 1/2.","v":"add"},{"d":"MEDIUM","q":"Which fraction is equivalent to 9/12 in simplest form?","o":["2/3","3/4","4/5","5/6"],"a":1,"e":"Divide top and bottom by 3 to get 3/4.","v":"equivalent"},{"d":"HARD","q":"Calculate 2/3 + 3/8.","o":["5/24","17/24","25/24","23/24"],"a":2,"e":"Using denominator 24: 2/3 = 16/24 and 3/8 = 9/24, total 25/24 = 1 1/24.","v":"add"},{"d":"HARD","q":"Calculate 7/10 − 1/4.","o":["9/20","6/6","3/20","1/2"],"a":0,"e":"Using denominator 20: 14/20 − 5/20 = 9/20.","v":"add"},{"d":"HARD","q":"Calculate 5/6 × 9/10 and simplify.","o":["3/4","4/5","5/9","45/16"],"a":0,"e":"5/6 × 9/10 = 45/60 = 3/4.","v":"multiply"},{"d":"HARD","q":"Calculate 4/5 ÷ 2/3.","o":["8/15","6/5","5/6","2/5"],"a":1,"e":"4/5 × 3/2 = 12/10 = 6/5.","v":"divide"},{"d":"HARD","q":"A pizza has 8 equal slices. Priya eats 3 slices. What fraction remains?","o":["3/8","5/8","1/2","3/5"],"a":1,"e":"Eight slices minus three leaves five, so 5/8 remains.","v":"fraction"},{"d":"HARD","q":"Which is the correct ascending order?","o":["1/2, 1/3, 1/4","1/4, 1/3, 1/2","1/3, 1/4, 1/2","1/2, 1/4, 1/3"],"a":1,"e":"For unit fractions, 1/4 < 1/3 < 1/2.","v":"compare"},{"d":"HARD","q":"A bottle is 3/5 full. You drink 1/5 of the bottle's capacity. What fraction remains full?","o":["2/5","3/5","1/5","4/5"],"a":0,"e":"3/5 − 1/5 = 2/5 of the bottle's capacity remains.","v":"fraction"},{"d":"HARD","q":"Calculate 1 1/2 + 2 1/4.","o":["3 1/4","3 3/4","4 1/4","2 3/4"],"a":1,"e":"1 1/2 = 1 2/4; adding 2 1/4 gives 3 3/4.","v":"add"},{"d":"HARD","q":"Which fraction is closest to 1?","o":["5/6","2/3","3/5","1/4"],"a":0,"e":"5/6 is only 1/6 below 1, a smaller gap than the others.","v":"compare"},{"d":"HARD","q":"A ribbon 5/6 m long is cut by 1/3 m. How much remains?","o":["1/2 m","2/3 m","1/3 m","1/6 m"],"a":0,"e":"5/6 − 1/3 = 5/6 − 2/6 = 3/6 = 1/2 m.","v":"add"}];let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0,finished=false;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');const visuals={
fraction:'<svg viewBox="0 0 300 100" role="img" aria-label="Fraction parts"><g>'+Array.from({length:4},(_,i)=>'<rect x="'+(58+i*47)+'" y="20" width="42" height="42" rx="4" fill="'+(i<2?'#58d6a3':'#91b7ff18')+'" stroke="'+(i<2?'#58d6a3':'#91b7ff')+'"/>').join('')+'</g><text x="150" y="88" fill="#f2f5ff" text-anchor="middle">Two of four equal parts</text></svg>',
equivalent:'<svg viewBox="0 0 300 100" role="img" aria-label="Equivalent fractions"><text x="150" y="32" fill="#f2f5ff" text-anchor="middle">1/2 = 2/4 = 3/6</text><path d="M50 48 H250" stroke="#58d6a3" stroke-width="2"/><text x="150" y="78" fill="#58d6a3" text-anchor="middle">Same value, different forms</text></svg>',
compare:'<svg viewBox="0 0 300 100" role="img" aria-label="Compare fraction sizes"><rect x="28" y="20" width="110" height="20" rx="5" fill="#91b7ff18" stroke="#91b7ff"/><rect x="28" y="20" width="82" height="20" rx="5" fill="#58d6a3"/><rect x="162" y="20" width="110" height="20" rx="5" fill="#91b7ff18" stroke="#91b7ff"/><rect x="162" y="20" width="55" height="20" rx="5" fill="#58d6a3"/><text x="83" y="64" fill="#f2f5ff" text-anchor="middle">3/4</text><text x="217" y="64" fill="#f2f5ff" text-anchor="middle">1/2</text><text x="150" y="89" fill="#f2f5ff" text-anchor="middle">Compare equal wholes</text></svg>',
add:'<svg viewBox="0 0 300 100" role="img" aria-label="Adding fractions with a common denominator"><text x="150" y="32" fill="#f2f5ff" text-anchor="middle">1/4 + 2/4</text><path d="M50 48 H250" stroke="#58d6a3" stroke-width="2"/><text x="150" y="78" fill="#58d6a3" text-anchor="middle">Add numerators; keep denominator</text></svg>',
multiply:'<svg viewBox="0 0 300 100" role="img" aria-label="Multiply fractions"><rect x="30" y="20" width="90" height="38" rx="7" fill="#91b7ff18" stroke="#91b7ff"/><text x="75" y="44" fill="#f2f5ff" text-anchor="middle">2/3</text><text x="150" y="44" fill="#58d6a3" text-anchor="middle">×</text><rect x="180" y="20" width="90" height="38" rx="7" fill="#91b7ff18" stroke="#91b7ff"/><text x="225" y="44" fill="#f2f5ff" text-anchor="middle">3/5</text><text x="150" y="84" fill="#f2f5ff" text-anchor="middle">Multiply across, then simplify</text></svg>',
divide:'<svg viewBox="0 0 300 100" role="img" aria-label="Divide fractions using reciprocal"><text x="150" y="32" fill="#f2f5ff" text-anchor="middle">3/4 ÷ 1/2</text><path d="M70 48 H230" stroke="#58d6a3" stroke-width="2"/><text x="150" y="78" fill="#58d6a3" text-anchor="middle">Keep · Flip · Multiply</text></svg>'
};function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'<div class="diagram">'+visuals[q.v]+'</div>':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$ ('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const skills=[['Recognise fractions and equivalent forms',8],['Compare and simplify fractions',18],['Calculate fraction operations',24]];$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">📏</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+skills.map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();</script>\n<script src="/shared-nav.js?v=20261013-universal-nav-v1"></script>\n</body></html>
