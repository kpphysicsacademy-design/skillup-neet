(function(){'use strict';const questions=[{"d":"BASIC","q":"Which expression represents “a number n increased by 7”?","o":["n − 7","7n","n + 7","n ÷ 7"],"a":2,"e":"Increased by 7 means add 7, giving n + 7."},{"d":"BASIC","q":"Which expression represents twice a number x?","o":["x + 2","2x","x − 2","x ÷ 2"],"a":1,"e":"Twice x is 2 multiplied by x, or 2x."},{"d":"BASIC","q":"Which property is shown by 4 + 9 = 9 + 4?","o":["Associative property","Distributive property","Commutative property of addition","Additive identity"],"a":2,"e":"The order of the addends changes but the sum stays the same."},{"d":"BASIC","q":"Which property is shown by (2 × 5) × 3 = 2 × (5 × 3)?","o":["Commutative","Associative","Distributive","Multiplicative identity"],"a":1,"e":"The grouping changes but the factors stay in the same order: associative property."},{"d":"BASIC","q":"Complete the general rule: a + 0 = __.","o":["0","a","1","a + 1"],"a":1,"e":"Adding zero leaves a number unchanged."},{"d":"BASIC","q":"Complete the general rule: a × 1 = __.","o":["1","0","a","a + 1"],"a":2,"e":"Multiplying by 1 leaves a number unchanged."},{"d":"BASIC","q":"Which expression is equivalent to 3(x + 4)?","o":["3x + 4","3x + 12","x + 12","7x"],"a":1,"e":"Distribute 3: 3 × x + 3 × 4 = 3x + 12."},{"d":"BASIC","q":"Which statement is always true for an even integer n?","o":["n = 2k for some integer k","n = 2k + 1 for some integer k","n is always prime","n is always positive"],"a":0,"e":"Every even integer can be written as 2 times an integer."},{"d":"BASIC","q":"Which expression represents the next integer after n?","o":["n − 1","n + 1","2n","n ÷ 2"],"a":1,"e":"The next integer is one more than n."},{"d":"BASIC","q":"Which expression represents the sum of two consecutive integers starting with n?","o":["2n","n + 2","n(n + 1)","n + (n + 1)"],"a":3,"e":"Consecutive integers are n and n + 1, so their sum is n + (n + 1)."},{"d":"MEDIUM","q":"Simplify using the distributive property: 5a + 5b.","o":["5(a + b)","10ab","5(a − b)","a + b + 5"],"a":0,"e":"Factor out the common factor 5 to get 5(a + b)."},{"d":"MEDIUM","q":"Which expression is equivalent to 7(x − 2)?","o":["7x − 2","7x − 14","x − 14","7x + 14"],"a":1,"e":"Multiply both terms by 7: 7x − 14."},{"d":"MEDIUM","q":"If n is an odd integer, which form represents it?","o":["2k","2k + 1","k + 1","3k"],"a":1,"e":"Every odd integer can be written as 2k + 1 for some integer k."},{"d":"MEDIUM","q":"The sum of any two even integers is always…","o":["Odd","Even","Prime","Negative"],"a":1,"e":"Adding 2a and 2b gives 2(a + b), which is even."},{"d":"MEDIUM","q":"The product of an even integer and any integer is always…","o":["Odd","Even","Prime","One"],"a":1,"e":"If one factor is even, the product contains a factor of 2 and is even."},{"d":"MEDIUM","q":"Which statement illustrates the distributive property?","o":["a + b = b + a","a(b + c) = ab + ac","(ab)c = a(bc)","a + 0 = a"],"a":1,"e":"Multiplication distributes over addition: a(b + c) = ab + ac."},{"d":"MEDIUM","q":"Which is a correct generalisation for the sum of three consecutive integers starting at n?","o":["3n","n + 3","n + (n + 1) + (n + 2)","n(n + 1)(n + 2)"],"a":2,"e":"The three consecutive integers are n, n + 1 and n + 2."},{"d":"MEDIUM","q":"Simplify: 4(2x + 3) − 5.","o":["8x + 7","8x + 8","8x + 15","6x − 2"],"a":0,"e":"4(2x + 3) − 5 = 8x + 12 − 5 = 8x + 7."},{"d":"MEDIUM","q":"Which expression is always even for integer n?","o":["n + 1","2n","2n + 1","n² + 1 for every n"],"a":1,"e":"2n is divisible by 2 for every integer n."},{"d":"MEDIUM","q":"If a and b are integers, which expression is always equal to a + b?","o":["a − b","b + a","ab","a ÷ b"],"a":1,"e":"Addition is commutative, so a + b = b + a."},{"d":"HARD","q":"Which expression represents the sum of an integer n and the next two integers?","o":["3n","n + (n + 1) + (n + 2)","n(n + 1)(n + 2)","3n + 2n"],"a":1,"e":"The next two integers after n are n + 1 and n + 2."},{"d":"HARD","q":"For every integer n, which expression is always odd?","o":["2n","2n + 1","4n","6n"],"a":1,"e":"An even number 2n plus 1 is odd."},{"d":"HARD","q":"Which expression is equivalent to 6x + 9?","o":["3(2x + 3)","6(x + 9)","9(6x + 1)","3(2x + 9)"],"a":0,"e":"Factoring out 3 gives 3(2x + 3) = 6x + 9."},{"d":"HARD","q":"If n is an integer, which expression is always divisible by 3?","o":["n + 3","3n","3n + 1","n² + 3"],"a":1,"e":"3n is a multiple of 3 for every integer n."},{"d":"HARD","q":"The sum of two odd integers is always…","o":["Odd","Even","Prime","A multiple of 3"],"a":1,"e":"(2a + 1) + (2b + 1) = 2(a + b + 1), which is even."},{"d":"HARD","q":"Which expression gives the product of two consecutive integers?","o":["n + (n + 1)","n(n + 1)","2n + 1","n² + 1"],"a":1,"e":"Two consecutive integers are n and n + 1; their product is n(n + 1)."},{"d":"HARD","q":"Which statement is always true for integer n?","o":["n² is always odd","n² has the same parity as n","n² is always even","n² is always prime"],"a":1,"e":"The square of an even integer is even, and the square of an odd integer is odd."},{"d":"HARD","q":"Simplify: 2(3x − 4) + 5(x + 1).","o":["11x − 3","11x − 13","x − 3","6x + 5"],"a":0,"e":"Expand: 6x − 8 + 5x + 5 = 11x − 3."},{"d":"HARD","q":"Which expression represents three less than twice the sum of x and 4?","o":["2x + 4 − 3","2(x + 4) − 3","2(x − 3) + 4","2x + 4 + 3"],"a":1,"e":"Twice the sum is 2(x + 4); three less means subtract 3."},{"d":"HARD","q":"For any integers a and b, which statement is always true?","o":["a + b = ab","a(b + 1) = ab + a","a − b = b − a","a + 1 = 1"],"a":1,"e":"Distributing a over (b + 1) gives ab + a."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Generalise number properties using algebra</strong><small>Use algebraic expressions and number rules</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Explore even, odd, and consecutive integers</strong><small>Simplify expressions with algebraic properties</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve direct proportion problems</strong><small>Apply direct proportion accurately</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
