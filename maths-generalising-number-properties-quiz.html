<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"Which expression represents “a number n increased by 7”?","o":["n − 7","7n","n + 7","n ÷ 7"],"a":2,"why":"Increased by 7 means add 7, giving n + 7."},{"d":"BASIC","q":"Which expression represents twice a number x?","o":["x + 2","2x","x − 2","x ÷ 2"],"a":1,"why":"Twice x is 2 multiplied by x, or 2x."},{"d":"BASIC","q":"Which property is shown by 4 + 9 = 9 + 4?","o":["Associative property","Distributive property","Commutative property of addition","Additive identity"],"a":2,"why":"The order of the addends changes but the sum stays the same."},{"d":"BASIC","q":"Which property is shown by (2 × 5) × 3 = 2 × (5 × 3)?","o":["Commutative","Associative","Distributive","Multiplicative identity"],"a":1,"why":"The grouping changes but the factors stay in the same order: associative property."},{"d":"BASIC","q":"Complete the general rule: a + 0 = __.","o":["0","a","1","a + 1"],"a":1,"why":"Adding zero leaves a number unchanged."},{"d":"BASIC","q":"Complete the general rule: a × 1 = __.","o":["1","0","a","a + 1"],"a":2,"why":"Multiplying by 1 leaves a number unchanged."},{"d":"BASIC","q":"Which expression is equivalent to 3(x + 4)?","o":["3x + 4","3x + 12","x + 12","7x"],"a":1,"why":"Distribute 3: 3 × x + 3 × 4 = 3x + 12."},{"d":"BASIC","q":"Which statement is always true for an even integer n?","o":["n = 2k for some integer k","n = 2k + 1 for some integer k","n is always prime","n is always positive"],"a":0,"why":"Every even integer can be written as 2 times an integer."},{"d":"BASIC","q":"Which expression represents the next integer after n?","o":["n − 1","n + 1","2n","n ÷ 2"],"a":1,"why":"The next integer is one more than n."},{"d":"BASIC","q":"Which expression represents the sum of two consecutive integers starting with n?","o":["2n","n + 2","n(n + 1)","n + (n + 1)"],"a":3,"why":"Consecutive integers are n and n + 1, so their sum is n + (n + 1)."},{"d":"MEDIUM","q":"Simplify using the distributive property: 5a + 5b.","o":["5(a + b)","10ab","5(a − b)","a + b + 5"],"a":0,"why":"Factor out the common factor 5 to get 5(a + b)."},{"d":"MEDIUM","q":"Which expression is equivalent to 7(x − 2)?","o":["7x − 2","7x − 14","x − 14","7x + 14"],"a":1,"why":"Multiply both terms by 7: 7x − 14."},{"d":"MEDIUM","q":"If n is an odd integer, which form represents it?","o":["2k","2k + 1","k + 1","3k"],"a":1,"why":"Every odd integer can be written as 2k + 1 for some integer k."},{"d":"MEDIUM","q":"The sum of any two even integers is always…","o":["Odd","Even","Prime","Negative"],"a":1,"why":"Adding 2a and 2b gives 2(a + b), which is even."},{"d":"MEDIUM","q":"The product of an even integer and any integer is always…","o":["Odd","Even","Prime","One"],"a":1,"why":"If one factor is even, the product contains a factor of 2 and is even."},{"d":"MEDIUM","q":"Which statement illustrates the distributive property?","o":["a + b = b + a","a(b + c) = ab + ac","(ab)c = a(bc)","a + 0 = a"],"a":1,"why":"Multiplication distributes over addition: a(b + c) = ab + ac."},{"d":"MEDIUM","q":"Which is a correct generalisation for the sum of three consecutive integers starting at n?","o":["3n","n + 3","n + (n + 1) + (n + 2)","n(n + 1)(n + 2)"],"a":2,"why":"The three consecutive integers are n, n + 1 and n + 2."},{"d":"MEDIUM","q":"Simplify: 4(2x + 3) − 5.","o":["8x + 7","8x + 8","8x + 15","6x − 2"],"a":0,"why":"4(2x + 3) − 5 = 8x + 12 − 5 = 8x + 7."},{"d":"MEDIUM","q":"Which expression is always even for integer n?","o":["n + 1","2n","2n + 1","n² + 1 for every n"],"a":1,"why":"2n is divisible by 2 for every integer n."},{"d":"MEDIUM","q":"If a and b are integers, which expression is always equal to a + b?","o":["a − b","b + a","ab","a ÷ b"],"a":1,"why":"Addition is commutative, so a + b = b + a."},{"d":"HARD","q":"Which expression represents the sum of an integer n and the next two integers?","o":["3n","n + (n + 1) + (n + 2)","n(n + 1)(n + 2)","3n + 2n"],"a":1,"why":"The next two integers after n are n + 1 and n + 2."},{"d":"HARD","q":"For every integer n, which expression is always odd?","o":["2n","2n + 1","4n","6n"],"a":1,"why":"An even number 2n plus 1 is odd."},{"d":"HARD","q":"Which expression is equivalent to 6x + 9?","o":["3(2x + 3)","6(x + 9)","9(6x + 1)","3(2x + 9)"],"a":0,"why":"Factoring out 3 gives 3(2x + 3) = 6x + 9."},{"d":"HARD","q":"If n is an integer, which expression is always divisible by 3?","o":["n + 3","3n","3n + 1","n² + 3"],"a":1,"why":"3n is a multiple of 3 for every integer n."},{"d":"HARD","q":"The sum of two odd integers is always…","o":["Odd","Even","Prime","A multiple of 3"],"a":1,"why":"(2a + 1) + (2b + 1) = 2(a + b + 1), which is even."},{"d":"HARD","q":"Which expression gives the product of two consecutive integers?","o":["n + (n + 1)","n(n + 1)","2n + 1","n² + 1"],"a":1,"why":"Two consecutive integers are n and n + 1; their product is n(n + 1)."},{"d":"HARD","q":"Which statement is always true for integer n?","o":["n² is always odd","n² has the same parity as n","n² is always even","n² is always prime"],"a":1,"why":"The square of an even integer is even, and the square of an odd integer is odd."},{"d":"HARD","q":"Simplify: 2(3x − 4) + 5(x + 1).","o":["11x − 3","11x − 13","x − 3","6x + 5"],"a":0,"why":"Expand: 6x − 8 + 5x + 5 = 11x − 3."},{"d":"HARD","q":"Which expression represents three less than twice the sum of x and 4?","o":["2x + 4 − 3","2(x + 4) − 3","2(x − 3) + 4","2x + 4 + 3"],"a":1,"why":"Twice the sum is 2(x + 4); three less means subtract 3."},{"d":"HARD","q":"For any integers a and b, which statement is always true?","o":["a + b = ab","a(b + 1) = ab + a","a − b = b − a","a + 1 = 1"],"a":1,"why":"Distributing a over (b + 1) gives ab + a."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Generalising Number Properties Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
