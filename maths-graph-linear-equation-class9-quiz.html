<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"What does the graph of a linear equation in two variables usually look like?","o":["A straight line","A circle","A single point always","A curved parabola always"],"a":0,"why":"The graph of a first-degree equation in two variables is a straight line."},{"d":"BASIC","q":"Which point lies on the graph y=x?","o":["(2,3)","(3,3)","(1,2)","(0,1)"],"a":1,"why":"For (3,3), y=x because both coordinates equal 3."},{"d":"BASIC","q":"Which point lies on the graph y=2x?","o":["(1,3)","(2,4)","(3,5)","(0,2)"],"a":1,"why":"For (2,4), 2x=4, equal to y."},{"d":"BASIC","q":"To find where the graph of x+y=4 crosses the x-axis, what should you set to zero?","o":["x","y","Both x and y","Neither"],"a":1,"why":"On the x-axis, y=0. Substitute into x+y=4 to get x=4."},{"d":"BASIC","q":"To find where the graph of 2x+y=6 crosses the y-axis, what should you set to zero?","o":["x","y","Both x and y","The coefficient 2"],"a":0,"why":"On the y-axis x=0, so y=6."},{"d":"BASIC","q":"Which pair is a solution of y=x+1?","o":["(1,1)","(2,3)","(3,2)","(0,0)"],"a":1,"why":"For (2,3), x+1=3, which equals y."},{"d":"BASIC","q":"Which equation has a graph passing through the origin?","o":["y=x+2","y=2x","y=3","x=4"],"a":1,"why":"At (0,0), y=2x gives 0=0."},{"d":"BASIC","q":"If the graph contains the point (0,5), what is the y-intercept?","o":["0","−5","5","Cannot be determined"],"a":2,"why":"The y-intercept is the y-value where x=0, here 5."},{"d":"BASIC","q":"Which point should be plotted to graph y=3 when x=0?","o":["(3,0)","(0,3)","(0,0)","(3,3)"],"a":1,"why":"When x=0, y remains 3, so plot (0,3)."},{"d":"BASIC","q":"How many points are sufficient to draw a straight-line graph, if they are distinct?","o":["One","Two","Three always","Ten"],"a":1,"why":"Two distinct points determine a straight line."},{"d":"MEDIUM","q":"Which is the x-intercept of the line x+y=7?","o":["(0,7)","(7,0)","(7,7)","(0,0)"],"a":1,"why":"Set y=0 to get x=7, so the x-intercept is (7,0)."},{"d":"MEDIUM","q":"What is the y-intercept of 3x+y=9?","o":["(3,0)","(0,9)","(0,3)","(9,0)"],"a":1,"why":"Set x=0; then y=9."},{"d":"MEDIUM","q":"Which point lies on y=2x−1?","o":["(1,1)","(2,2)","(0,1)","(3,4)"],"a":0,"why":"For x=1, y=2(1)−1=1, so (1,1) lies on the line."},{"d":"MEDIUM","q":"For y=−x+4, what is y when x=2?","o":["−2","2","4","6"],"a":1,"why":"Substitute x=2: y=−2+4=2."},{"d":"MEDIUM","q":"Which pair of points can be used to draw y=x+2?","o":["(0,2) and (2,4)","(0,0) and (2,2)","(1,1) and (2,1)","(0,−2) and (2,0)"],"a":0,"why":"Both points satisfy y=x+2."},{"d":"MEDIUM","q":"A line crosses the x-axis at (−3,0). What is x when y=0 on that line?","o":["3","−3","0","Cannot be determined"],"a":1,"why":"The x-intercept is the point where y=0, here x=−3."},{"d":"MEDIUM","q":"Which table row satisfies y=2x+1?","o":["x=1, y=2","x=2, y=5","x=3, y=5","x=0, y=0"],"a":1,"why":"For x=2, y=2(2)+1=5."},{"d":"MEDIUM","q":"What is the x-intercept of 2x−y=8?","o":["(0,−8)","(4,0)","(0,8)","(8,0)"],"a":1,"why":"Set y=0: 2x=8, so x=4."},{"d":"MEDIUM","q":"If the line y=5 is graphed, which description is correct?","o":["Vertical line through x=5","Horizontal line through y=5","Line through origin","Line coinciding with x-axis"],"a":1,"why":"Every point has y=5, creating a horizontal line."},{"d":"MEDIUM","q":"Which point is on the graph of x−2y=0?","o":["(2,1)","(1,2)","(0,2)","(2,2)"],"a":0,"why":"For (2,1), x−2y=2−2=0."},{"d":"HARD","q":"A line passes through (0,2) and (2,6). Which equation fits these points?","o":["y=x+2","y=2x+2","y=2x−2","y=x+6"],"a":1,"why":"At x=0, y=2; at x=2, y=6, so y=2x+2 fits."},{"d":"HARD","q":"Which point is the intersection of x+y=6 and the y-axis?","o":["(6,0)","(0,6)","(3,3)","(0,0)"],"a":1,"why":"On the y-axis x=0, so y=6."},{"d":"HARD","q":"For y=3x−6, where does the line cross the x-axis?","o":["(0,−6)","(2,0)","(−2,0)","(0,2)"],"a":1,"why":"Set y=0: 3x−6=0, so x=2."},{"d":"HARD","q":"Which equation has a line parallel to y=4 and passes through (0,−2)?","o":["x=−2","y=−2","y=x−2","x+y=−2"],"a":1,"why":"Lines y=constant are horizontal; through (0,−2), the equation is y=−2."},{"d":"HARD","q":"A line through the origin contains (3,−6). Which equation describes it?","o":["y=2x","y=−2x","y=x−3","x=−2y"],"a":1,"why":"The ratio y/x=−6/3=−2, so y=−2x."},{"d":"HARD","q":"Which pair of intercepts belongs to 2x+3y=12?","o":["(6,0) and (0,4)","(4,0) and (0,6)","(12,0) and (0,12)","(3,0) and (0,2)"],"a":0,"why":"Set y=0 to get x=6; set x=0 to get y=4."},{"d":"HARD","q":"The graph of y=−3 is:","o":["Vertical and crosses x-axis at −3","Horizontal and crosses y-axis at −3","A line through the origin","A line with positive slope"],"a":1,"why":"The y-coordinate is always −3, so the line is horizontal."},{"d":"HARD","q":"Which point lies on both x+y=5 and y=2x−1?","o":["(1,1)","(2,3)","(3,2)","(0,5)"],"a":1,"why":"At (2,3), x+y=5 and 2x−1=3=y."},{"d":"HARD","q":"A graph of y=2x+3 contains point P where x=−2. What is P?","o":["(−2,−1)","(−2,1)","(2,−1)","(−1,−2)"],"a":0,"why":"y=2(−2)+3=−1, so P=(−2,−1)."},{"d":"HARD","q":"Which statement about the graph of x=3 is true?","o":["It is a horizontal line","It is a vertical line through x=3","It passes through the origin","It has y=3 for every point"],"a":1,"why":"Every point on the line has x-coordinate 3, making it vertical."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Graph of a Linear Equation Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
