d":"MEDIUM","q":"What is the y-intercept of 3x+y=9?","o":["(3,0)","(0,9)","(0,3)","(9,0)"],"a":1,"e":"Set x=0; then y=9."},{"d":"MEDIUM","q":"Which point lies on y=2x−1?","o":["(1,1)","(2,2)","(0,1)","(3,4)"],"a":0,"e":"For x=1, y=2(1)−1=1, so (1,1) lies on the line."},{"d":"MEDIUM","q":"For y=−x+4, what is y when x=2?","o":["−2","2","4","6"],"a":1,"e":"Substitute x=2: y=−2+4=2."},{"d":"MEDIUM","q":"Which pair of points can be used to draw y=x+2?","o":["(0,2) and (2,4)","(0,0) and (2,2)","(1,1) and (2,1)","(0,−2) and (2,0)"],"a":0,"e":"Both points satisfy y=x+2."},{"d":"MEDIUM","q":"A line crosses the x-axis at (−3,0). What is x when y=0 on that line?","o":["3","−3","0","Cannot be determined"],"a":1,"e":"The x-intercept is the point where y=0, here x=−3."},{"d":"MEDIUM","q":"Which table row satisfies y=2x+1?","o":["x=1, y=2","x=2, y=5","x=3, y=5","x=0, y=0"],"a":1,"e":"For x=2, y=2(2)+1=5."},{"d":"MEDIUM","q":"What is the x-intercept of 2x−y=8?","o":["(0,−8)","(4,0)","(0,8)","(8,0)"],"a":1,"e":"Set y=0: 2x=8, so x=4."},{"d":"MEDIUM","q":"If the line y=5 is graphed, which description is correct?","o":["Vertical line through x=5","Horizontal line through y=5","Line through origin","Line coinciding with x-axis"],"a":1,"e":"Every point has y=5, creating a horizontal line."},{"d":"MEDIUM","q":"Which point is on the graph of x−2y=0?","o":["(2,1)","(1,2)","(0,2)","(2,2)"],"a":0,"e":"For (2,1), x−2y=2−2=0."},{"d":"HARD","q":"A line passes through (0,2) and (2,6). Which equation fits these points?","o":["y=x+2","y=2x+2","y=2x−2","y=x+6"],"a":1,"e":"At x=0, y=2; at x=2, y=6, so y=2x+2 fits."},{"d":"HARD","q":"Which point is the intersection of x+y=6 and the y-axis?","o":["(6,0)","(0,6)","(3,3)","(0,0)"],"a":1,"e":"On the y-axis x=0, so y=6."},{"d":"HARD","q":"For y=3x−6, where does the line cross the x-axis?","o":["(0,−6)","(2,0)","(−2,0)","(0,2)"],"a":1,"e":"Set y=0: 3x−6=0, so x=2."},{"d":"HARD","q":"Which equation has a line parallel to y=4 and passes through (0,−2)?","o":["x=−2","y=−2","y=x−2","x+y=−2"],"a":1,"e":"Lines y=constant are horizontal; through (0,−2), the equation is y=−2."},{"d":"HARD","q":"A line through the origin contains (3,−6). Which equation describes it?","o":["y=2x","y=−2x","y=x−3","x=−2y"],"a":1,"e":"The ratio y/x=−6/3=−2, so y=−2x."},{"d":"HARD","q":"Which pair of intercepts belongs to 2x+3y=12?","o":["(6,0) and (0,4)","(4,0) and (0,6)","(12,0) and (0,12)","(3,0) and (0,2)"],"a":0,"e":"Set y=0 to get x=6; set x=0 to get y=4."},{"d":"HARD","q":"The graph of y=−3 is:","o":["Vertical and crosses x-axis at −3","Horizontal and crosses y-axis at −3","A line through the origin","A line with positive slope"],"a":1,"e":"The y-coordinate is always −3, so the line is horizontal."},{"d":"HARD","q":"Which point lies on both x+y=5 and y=2x−1?","o":["(1,1)","(2,3)","(3,2)","(0,5)"],"a":1,"e":"At (2,3), x+y=5 and 2x−1=3=y."},{"d":"HARD","q":"A graph of y=2x+3 contains point P where x=−2. What is P?","o":["(−2,−1)","(−2,1)","(2,−1)","(−1,−2)"],"a":0,"e":"y=2(−2)+3=−1, so P=(−2,−1)."},{"d":"HARD","q":"Which statement about the graph of x=3 is true?","o":["It is a horizontal line","It is a vertical line through x=3","It passes through the origin","It has y=3 for every point"],"a":1,"e":"Every point on the line has x-coordinate 3, making it vertical."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Master linear equation graphs</strong><small>Plot points on straight lines</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Find x- and y-intercepts</strong><small>Recognise horizontal and vertical lines</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Connect equations and graphs</strong><small>Solve graph-based problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
