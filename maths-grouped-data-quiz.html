<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261013-grouped-data-duolingo-v1"><title>Grouped Data | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Grouped data</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"In a frequency table, what does frequency tell you?","o":["How many times a value or class occurs","The largest value only","The difference between two values","The number of classes multiplied by ten"],"a":0,"e":"Frequency counts how many observations belong to a value or class.","v":"grouped-data"},{"d":"BASIC","q":"The class interval 10–19 contains which whole-number values?","o":["11 through 20","10 through 19","10 through 20","9 through 19"],"a":1,"e":"The class includes whole-number values from 10 to 19.","v":"grouped-data"},{"d":"BASIC","q":"For the class interval 20–29, what is the lower class limit?","o":["29","9","20","24.5"],"a":2,"e":"The lower class limit is the smallest stated value of the interval: 20.","v":"grouped-data"},{"d":"BASIC","q":"For the class interval 30–39, what is the upper class limit?","o":["30","34.5","9","39"],"a":3,"e":"The upper class limit is 39.","v":"grouped-data"},{"d":"BASIC","q":"What is the class mark of the interval 10–20?","o":["15","10","20","30"],"a":0,"e":"Class mark is the midpoint: (10 + 20) ÷ 2 = 15.","v":"grouped-data"},{"d":"BASIC","q":"A class has frequency 7. How many observations belong to that class?","o":["1","7","14","0"],"a":1,"e":"The frequency directly gives the number of observations in that class.","v":"grouped-data"},{"d":"BASIC","q":"Why is raw data often grouped into intervals?","o":["To change the original observations","To make the total frequency smaller","To summarize many observations clearly","To remove all variation"],"a":2,"e":"Grouping condenses a large dataset into a clearer summary.","v":"grouped-data"},{"d":"BASIC","q":"What is the class width of continuous interval 20–30?","o":["20","30","50","10"],"a":3,"e":"Class width is upper boundary minus lower boundary: 30 − 20 = 10.","v":"grouped-data"},{"d":"BASIC","q":"Which display is commonly used to summarize grouped numerical data in a table?","o":["Frequency distribution table","Family tree","Venn diagram only","Compass rose"],"a":0,"e":"A frequency distribution table lists classes and their frequencies.","v":"grouped-data"},{"d":"BASIC","q":"The total frequency of a distribution is 25. What does 25 represent?","o":["The number of class intervals necessarily","The total number of observations","The largest observation","The class width"],"a":1,"e":"Adding all class frequencies gives the total number of observations.","v":"grouped-data"},{"d":"MEDIUM","q":"Find the class mark of 40–50.","o":["40","50","45","10"],"a":2,"e":"The midpoint is (40 + 50) ÷ 2 = 45.","v":"grouped-data"},{"d":"MEDIUM","q":"A class interval is 15–25. What is its width?","o":["15","25","40","10"],"a":3,"e":"Width = 25 − 15 = 10.","v":"grouped-data"},{"d":"MEDIUM","q":"Frequencies are 4, 7, 6 and 3. What is the total frequency?","o":["20","17","16","24"],"a":0,"e":"Total frequency = 4 + 7 + 6 + 3 = 20.","v":"grouped-data"},{"d":"MEDIUM","q":"The frequencies for three classes are 5, 8 and x. Total frequency is 21. Find x.","o":["13","8","16","3"],"a":1,"e":"5 + 8 + x = 21, so x = 8.","v":"grouped-data"},{"d":"MEDIUM","q":"Find the class mark of the interval 12–18.","o":["12","18","15","6"],"a":2,"e":"Class mark = (12 + 18) ÷ 2 = 15.","v":"grouped-data"},{"d":"MEDIUM","q":"A frequency table shows 6 students in 0–10, 9 in 10–20 and 5 in 20–30. How many students are there altogether?","o":["14","15","25","20"],"a":3,"e":"Total = 6 + 9 + 5 = 20 students.","v":"grouped-data"},{"d":"MEDIUM","q":"Which class interval has the greatest frequency: 0–10 (4), 10–20 (9), 20–30 (7), 30–40 (3)?","o":["10–20","0–10","20–30","30–40"],"a":0,"e":"The frequency 9 is the largest, belonging to class 10–20.","v":"grouped-data"},{"d":"MEDIUM","q":"If 18 observations are split equally between 3 classes, what is each class frequency?","o":["3","6","9","15"],"a":1,"e":"Equal frequencies are 18 ÷ 3 = 6 per class.","v":"grouped-data"},{"d":"MEDIUM","q":"The class mark is 35 and the interval is symmetric about its mark. Which interval fits a class width of 10?","o":["25–35","35–45","30–40","20–40"],"a":2,"e":"A width of 10 centered at 35 extends 5 on either side: 30–40.","v":"grouped-data"},{"d":"MEDIUM","q":"Frequencies are 2, 5, 8 and 5. What is the combined frequency of the first two classes?","o":["10","13","15","7"],"a":3,"e":"The first two classes contain 2 + 5 = 7 observations.","v":"grouped-data"},{"d":"HARD","q":"A grouped table has frequencies 6, 11, 9 and 4. What percentage of observations are in the second class?","o":["36.67%","11%","30%","40%"],"a":0,"e":"Total = 30; second-class percentage = 11 ÷ 30 × 100 ≈ 36.67%.","v":"grouped-data"},{"d":"HARD","q":"Class frequencies are 3, 7, 12 and 8. How many observations lie in the first three classes combined?","o":["20","22","30","12"],"a":1,"e":"Cumulative total through the third class is 3 + 7 + 12 = 22.","v":"grouped-data"},{"d":"HARD","q":"A class interval has class mark 24 and width 8. What are its symmetric boundaries?","o":["16 and 24","24 and 32","20 and 28","18 and 30"],"a":2,"e":"Half the width is 4, so the boundaries are 24 − 4 = 20 and 24 + 4 = 28.","v":"grouped-data"},{"d":"HARD","q":"A dataset has total frequency 50. Three classes have frequencies 12, 15 and 9. Find the fourth frequency.","o":["12","16","23","14"],"a":3,"e":"Fourth frequency = 50 − (12 + 15 + 9) = 14.","v":"grouped-data"},{"d":"HARD","q":"The class mark of a class is 42 and its lower boundary is 36. What is its upper boundary?","o":["48","46","42","54"],"a":0,"e":"The midpoint is 42, six above 36, so the upper boundary is 42 + 6 = 48.","v":"grouped-data"},{"d":"HARD","q":"A distribution has frequencies 4, 6, 10 and 5. What is the cumulative frequency through the third class?","o":["10","20","15","25"],"a":1,"e":"Cumulative frequency through class three = 4 + 6 + 10 = 20.","v":"grouped-data"},{"d":"HARD","q":"A class has frequency 12 out of a total of 80 observations. What fraction of the observations is in that class, in simplest form?","o":["3/10","12/80","3/20","1/8"],"a":2,"e":"12/80 simplifies by dividing numerator and denominator by 4 to 3/20.","v":"grouped-data"},{"d":"HARD","q":"Four equal-width classes span continuously from 0 to 40. What is the width of each class?","o":["8","20","40","10"],"a":3,"e":"Total span 40 divided into 4 equal classes gives width 40 ÷ 4 = 10.","v":"grouped-data"},{"d":"HARD","q":"Frequencies for five classes are 3, 5, 8, 6 and 4. What percentage of observations are in the third class?","o":["30.77%","25%","8%","32%"],"a":0,"e":"Total frequency is 26; 8 ÷ 26 × 100 ≈ 30.77%.","v":"grouped-data"},{"d":"HARD","q":"A class mark is 17.5 for an interval with whole-number limits and equal continuous boundaries from 10 to 25. What is the class mark of 10–25?","o":["15","17.5","25","35"],"a":1,"e":"The midpoint of 10 and 25 is (10 + 25) ÷ 2 = 17.5.","v":"grouped-data"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Organize numerical observations into grouped frequency tables</strong><small>Class intervals, frequencies and class marks</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Totals, cumulative frequencies and percentages</strong><small>Interpret grouped data and calculate frequencies</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Connect side counts, angles and diagonals</strong><small>Solve equations reducible to linear form</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script></body></html>
