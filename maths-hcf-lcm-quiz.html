<main><section class="hero"><h1>HCF and LCM</h1><p class="muted">Find the highest common factor and least common multiple using factors, multiples and prime factorisation.</p><a class="topic-link" href="maths-hcf-lcm-simulator.html?v=20261111-hcf-lcm-simulator-v1">🧪 Explore HCF and LCM Simulator →</a><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div></section>

<script>
(function(){'use strict';
const originalQuestions=[{"id":"b01","d":"BASIC","q":"What is the HCF of 8 and 12?","o":["2","4","6","8"],"a":1,"e":"The common factors are 1, 2 and 4. The greatest is 4."},{"id":"b02","d":"BASIC","q":"What is the LCM of 3 and 4?","o":["7","9","12","24"],"a":2,"e":"12 is the smallest positive number divisible by both 3 and 4."},{"id":"b03","d":"BASIC","q":"Which is a common factor of 10 and 15?","o":["4","5","6","8"],"a":1,"e":"5 divides both 10 and 15 exactly."},{"id":"b04","d":"BASIC","q":"What is the HCF of 6 and 9?","o":["1","2","3","6"],"a":2,"e":"The common factors are 1 and 3, so the HCF is 3."},{"id":"b05","d":"BASIC","q":"What is the LCM of 2 and 5?","o":["5","7","10","20"],"a":2,"e":"2 and 5 have no common factor other than 1, so their LCM is 2 × 5 = 10."},{"id":"b06","d":"BASIC","q":"What is the HCF of 7 and 14?","o":["2","3","7","14"],"a":2,"e":"7 divides both numbers and is the greatest common factor."},{"id":"b07","d":"BASIC","q":"Which number is a common multiple of 4 and 6?","o":["8","12","16","18"],"a":1,"e":"12 = 4 × 3 = 6 × 2, so it is a common multiple."},{"id":"b08","d":"BASIC","q":"What is the HCF of 9 and 12?","o":["1","2","3","6"],"a":2,"e":"The common factors are 1 and 3; the greatest is 3."},{"id":"b09","d":"BASIC","q":"What is the LCM of 5 and 10?","o":["5","10","15","50"],"a":1,"e":"10 is already a multiple of both 5 and 10."},{"id":"b10","d":"BASIC","q":"When do we usually use HCF?","o":["To find the smallest common multiple","To split things into the largest equal groups without leftovers","To add fractions only","To find the largest number"],"a":1,"e":"HCF helps find the greatest size or number of equal groups that divides quantities exactly."},{"id":"m11","d":"MEDIUM","q":"Find the HCF of 18 and 24.","o":["3","6","9","12"],"a":1,"e":"18 = 2 × 3² and 24 = 2³ × 3; common prime factors give HCF 2 × 3 = 6."},{"id":"m12","d":"MEDIUM","q":"Find the LCM of 6 and 8.","o":["12","18","24","48"],"a":2,"e":"Multiples show the first shared positive multiple is 24."},{"id":"m13","d":"MEDIUM","q":"What is the HCF of 20, 30 and 50?","o":["5","10","15","20"],"a":1,"e":"10 divides all three numbers and is the greatest such divisor."},{"id":"m14","d":"MEDIUM","q":"What is the LCM of 4, 6 and 8?","o":["12","18","24","48"],"a":2,"e":"24 is divisible by 4, 6 and 8 and is the smallest such positive number."},{"id":"m15","d":"MEDIUM","q":"Two bells ring every 6 minutes and 8 minutes. If they ring together now, when will they next ring together?","o":["12 minutes","14 minutes","24 minutes","48 minutes"],"a":2,"e":"The next shared ringing time is after LCM(6, 8) = 24 minutes."},{"id":"m16","d":"MEDIUM","q":"Which is the HCF of 36 and 48?","o":["6","8","12","18"],"a":2,"e":"36 = 3 × 12 and 48 = 4 × 12; 12 is the greatest common factor."},{"id":"m17","d":"MEDIUM","q":"Find the LCM of 9 and 12.","o":["18","24","36","108"],"a":2,"e":"36 is the smallest number divisible by both 9 and 12."},{"id":"m18","d":"MEDIUM","q":"Which pair has HCF 1?","o":["8 and 12","9 and 15","8 and 15","14 and 21"],"a":2,"e":"8 has factors 1, 2, 4, 8; 15 has factors 1, 3, 5, 15. Their only common factor is 1."},{"id":"m19","d":"MEDIUM","q":"Find the HCF of 42 and 56.","o":["7","14","21","28"],"a":1,"e":"42 = 3 × 14 and 56 = 4 × 14, so the HCF is 14."},{"id":"m20","d":"MEDIUM","q":"Find the LCM of 10 and 15.","o":["15","20","30","60"],"a":2,"e":"30 is the first positive multiple common to 10 and 15."},{"id":"h21","d":"HARD","q":"Find the HCF of 72 and 90.","o":["6","9","18","36"],"a":2,"e":"72 = 2³ × 3² and 90 = 2 × 3² × 5; common prime factors give 2 × 3² = 18."},{"id":"h22","d":"HARD","q":"Find the LCM of 12 and 18.","o":["24","30","36","72"],"a":2,"e":"12 = 2² × 3 and 18 = 2 × 3²; use highest powers: 2² × 3² = 36."},{"id":"h23","d":"HARD","q":"Two ribbons are 48 cm and 60 cm long. What is the greatest equal length into which both can be cut with no waste?","o":["6 cm","10 cm","12 cm","15 cm"],"a":2,"e":"The greatest equal length is HCF(48, 60) = 12 cm."},{"id":"h24","d":"HARD","q":"Three lights flash every 4, 6 and 10 seconds. When do they flash together next?","o":["20 seconds","30 seconds","60 seconds","120 seconds"],"a":2,"e":"LCM(4, 6, 10) = 60 seconds."},{"id":"h25","d":"HARD","q":"If HCF(a, b) = 6 and LCM(a, b) = 72, and a = 18, what is b?","o":["12","18","24","36"],"a":2,"e":"For positive integers, a × b = HCF × LCM. Thus b = (6 × 72) ÷ 18 = 24."},{"id":"h26","d":"HARD","q":"What is the LCM of 8, 12 and 15?","o":["60","90","120","240"],"a":2,"e":"8 = 2³, 12 = 2² × 3, 15 = 3 × 5; LCM = 2³ × 3 × 5 = 120."},{"id":"h27","d":"HARD","q":"What is the HCF of 96 and 144?","o":["12","24","36","48"],"a":3,"e":"96 = 2⁵ × 3 and 144 = 2⁴ × 3²; HCF = 2⁴ × 3 = 48."},{"id":"h28","d":"HARD","q":"A teacher has 24 pencils and 36 erasers to make identical kits with no items left over. What is the greatest number of kits?","o":["6","8","12","18"],"a":2,"e":"The greatest number of identical kits is HCF(24, 36) = 12."},{"id":"h29","d":"HARD","q":"Which statement is true for any two positive integers a and b?","o":["HCF is always greater than LCM","HCF × LCM = a × b","HCF + LCM = a × b","HCF is always 1"],"a":1,"e":"For two positive integers, HCF(a, b) × LCM(a, b) = a × b."},{"id":"h30","d":"HARD","q":"Find the LCM of 14 and 35.","o":["49","70","105","140"],"a":1,"e":"14 = 2 × 7 and 35 = 5 × 7; LCM = 2 × 5 × 7 = 70."}];
let questions=originalQuestions.slice(),index=0,selected=-1,locked=false,xp=0,correct=0,streak=0;
let mistakes=[];
const $=id=>document.getElementById(id);
function make(tag,cls,txt){const el=document.createElement(tag);if(cls)el.className=cls;if(txt!==undefined)el.textContent=txt;return el;}
function updateProgress(){const pct=Math.round(index/questions.length*100);$('fill').style.width=pct+'%';$('percent').textContent=pct+'%';$('progressText').textContent='Question '+Math.min(index+1,questions.length)+' of '+questions.length;document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(pct));}
function render(){const q=questions[index];selected=-1;locked=false;$('qmeta').textContent='QUESTION '+(index+1)+' · '+q.d;$('question').textContent=q.q;$('options').replaceChildren();q.o.forEach((label,i)=>{const b=make('button','option');b.type='button';const letter=make('span','letter',String.fromCharCode(65+i));const value=make('span','',label);b.append(letter,value);b.addEventListener('click',()=>{if(locked)return;selected=i;$('options').querySelectorAll('.option').forEach((el,j)=>el.classList.toggle('selected',j===i));$('check').disabled=false;});$('options').append(b);});$('feedback').className='feedback';$('feedback').textContent='';$('check').style.display='block';$('check').disabled=true;$('continue').className='btn continue';updateProgress();}
function checkAnswer(){if(selected<0||locked)return;locked=true;const q=questions[index],isCorrect=selected===q.a;if(isCorrect){correct++;xp+=10;streak++;$('xp').textContent=String(xp);$('streak').textContent=String(streak);}else{streak=0;$('streak').textContent='0';mistakes.push({id:q.id,question:q.q,chosen:q.o[selected],answer:q.o[q.a],explanation:q.e});}
$('options').querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});
$('feedback').textContent=(isCorrect?'Correct! ':'Let’s review. ')+q.e;$('feedback').className='feedback show '+(isCorrect?'good':'bad');$('check').style.display='none';$('continue').className='btn continue show';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';}
function restart(wrongOnly){const retry=wrongOnly?originalQuestions.filter(q=>mistakes.some(m=>m.id===q.id)):originalQuestions.slice();questions=retry;index=0;selected=-1;locked=false;xp=0;correct=0;streak=0;mistakes=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();}
function finish(){updateProgress();$('quiz').style.display='none';const slot=$('finishSlot');slot.replaceChildren();const card=make('section','finish');const trophy=make('div','trophy','🏆');const heading=make('h2', '',correct>=25?'Excellent work!':correct>=18?'Good progress!':'Keep practising!');const simulator=make('a','topic-link','🧪 Explore HCF and LCM Simulator →');simulator.href='maths-hcf-lcm-simulator.html?v=20261111-hcf-lcm-simulator-v1';const score=make('div','score',correct+' / '+questions.length);const summary=make('p','muted','You answered '+correct+' correctly and earned '+xp+' XP.');const accuracy=make('p','',Math.round(correct/questions.length*100)+'% accuracy');card.append(trophy,heading,simulator,score,summary,accuracy);
const review=make('div','review');review.append(make('h3','',mistakes.length?'Review your mistakes ('+mistakes.length+')':'Perfect round!'));mistakes.forEach((m,i)=>{const item=make('div','review-item');item.append(make('b','',(i+1)+'. '+m.question),make('p','your-answer','Your answer: '+m.chosen),make('p','correct-answer','Correct answer: '+m.answer),make('p','',m.explanation));review.append(item);});card.append(review);
const actions=make('div','review-actions');const wrong=make('button','btn secondary','Retry mistakes');wrong.type='button';wrong.disabled=!mistakes.length;wrong.addEventListener('click',()=>restart(true));const all=make('button','btn primary','Retry all');all.type='button';all.addEventListener('click',()=>restart(false));actions.append(wrong,all);card.append(actions);slot.append(card);}
$('check').addEventListener('click',checkAnswer);$('continue').addEventListener('click',()=>{index++;if(index<questions.length)render();else finish();});render();
})();
</script>
