<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"What is the HCF of 8 and 12?","o":["2","4","6","8"],"a":1,"e":"The common factors are 1, 2 and 4; the greatest is 4."},{"d":"BASIC","q":"What is the LCM of 3 and 4?","o":["7","9","12","24"],"a":2,"e":"12 is the smallest positive number divisible by both 3 and 4."},{"d":"BASIC","q":"Which number is a common factor of 10 and 15?","o":["2","3","5","10"],"a":2,"e":"5 divides both 10 and 15."},{"d":"BASIC","q":"What is the HCF of 6 and 9?","o":["1","2","3","6"],"a":2,"e":"The common factors are 1 and 3, so the HCF is 3."},{"d":"BASIC","q":"What is the LCM of 2 and 5?","o":["5","7","10","15"],"a":2,"e":"The smallest positive common multiple is 10."},{"d":"BASIC","q":"Which number is a common multiple of 4 and 6?","o":["8","12","16","18"],"a":1,"e":"12 is divisible by both 4 and 6."},{"d":"BASIC","q":"What is the HCF of 7 and 14?","o":["2","5","7","14"],"a":2,"e":"7 divides both numbers and is the greatest common factor."},{"d":"BASIC","q":"What is the LCM of 5 and 10?","o":["5","10","15","50"],"a":1,"e":"10 is already a multiple of both 5 and 10."},{"d":"BASIC","q":"If two numbers have HCF 1, what are they called?","o":["Equal numbers","Co-prime numbers","Prime multiples","Twin factors"],"a":1,"e":"Numbers whose HCF is 1 are called co-prime."},{"d":"BASIC","q":"What is the HCF of 9 and 10?","o":["1","2","3","9"],"a":0,"e":"They have no common positive factor other than 1."},{"d":"MEDIUM","q":"Find the HCF of 18 and 24.","o":["3","6","9","12"],"a":1,"e":"The greatest number that divides both 18 and 24 is 6."},{"d":"MEDIUM","q":"Find the LCM of 6 and 8.","o":["12","18","24","48"],"a":2,"e":"24 is the first positive multiple shared by 6 and 8."},{"d":"MEDIUM","q":"Find the HCF of 28 and 42.","o":["7","14","21","28"],"a":1,"e":"28 = 2×14 and 42 = 3×14; the HCF is 14."},{"d":"MEDIUM","q":"Find the LCM of 9 and 12.","o":["18","24","36","108"],"a":2,"e":"36 is divisible by both 9 and 12, and no smaller positive common multiple exists."},{"d":"MEDIUM","q":"What is the HCF of 16, 24 and 40?","o":["4","8","12","16"],"a":1,"e":"8 divides all three numbers and is the greatest common factor."},{"d":"MEDIUM","q":"What is the LCM of 3, 4 and 6?","o":["12","18","24","36"],"a":0,"e":"12 is divisible by 3, 4 and 6."},{"d":"MEDIUM","q":"Two ribbons are 20 cm and 30 cm long. What is the greatest equal length into which both can be cut with no leftover?","o":["5 cm","10 cm","15 cm","20 cm"],"a":1,"e":"The greatest common factor of 20 and 30 is 10."},{"d":"MEDIUM","q":"One light flashes every 4 seconds and another every 6 seconds. If they flash together now, when will they next flash together?","o":["8 seconds","10 seconds","12 seconds","24 seconds"],"a":2,"e":"Their next shared flash is after the LCM of 4 and 6, which is 12 seconds."},{"d":"MEDIUM","q":"If one number divides another exactly, what is their HCF?","o":["The smaller number","The larger number","Their sum","Their product"],"a":0,"e":"The smaller number divides both and is the greatest common factor."},{"d":"MEDIUM","q":"Find the LCM of 8 and 10.","o":["20","30","40","80"],"a":2,"e":"40 is the smallest positive number divisible by both 8 and 10."},{"d":"HARD","q":"Find the HCF of 36 and 60 using prime factors.","o":["6","12","18","24"],"a":1,"e":"36 = 2²×3² and 60 = 2²×3×5; common prime factors give 2²×3 = 12."},{"d":"HARD","q":"Find the LCM of 12 and 18.","o":["24","30","36","72"],"a":2,"e":"12 = 2²×3 and 18 = 2×3²; use highest powers to get 2²×3² = 36."},{"d":"HARD","q":"Two buses leave a stop every 15 minutes and 20 minutes. If they leave together at 9:00, when do they next leave together?","o":["9:30","9:45","10:00","10:15"],"a":2,"e":"The LCM of 15 and 20 is 60 minutes, so they next coincide at 10:00."},{"d":"HARD","q":"What is the greatest number of identical gift packs that can be made from 48 pencils and 60 erasers with none left over?","o":["6","10","12","15"],"a":2,"e":"The HCF of 48 and 60 is 12, so 12 identical packs can be made."},{"d":"HARD","q":"Find the LCM of 14 and 21.","o":["35","42","63","84"],"a":1,"e":"14 = 2×7 and 21 = 3×7; the LCM is 2×3×7 = 42."},{"d":"HARD","q":"Two numbers have HCF 6 and LCM 72. If one number is 18, what is the other?","o":["12","24","36","48"],"a":1,"e":"For positive integers, product = HCF×LCM. The other number is (6×72)÷18 = 24."},{"d":"HARD","q":"Find the HCF of 72 and 120.","o":["12","18","24","36"],"a":2,"e":"72 = 2³×3² and 120 = 2³×3×5; the HCF is 2³×3 = 24."},{"d":"HARD","q":"Find the LCM of 16, 20 and 24.","o":["120","180","240","480"],"a":2,"e":"16 = 2⁴, 20 = 2²×5 and 24 = 2³×3; LCM = 2⁴×3×5 = 240."},{"d":"HARD","q":"A floor is 240 cm long and 168 cm wide. What is the largest square tile size, in cm, that fits exactly with no cutting?","o":["12","18","24","36"],"a":2,"e":"The largest square side is HCF(240,168) = 24 cm."},{"d":"HARD","q":"Three bells ring every 6, 8 and 10 minutes. If they ring together now, after how many minutes will they ring together again?","o":["60","80","120","240"],"a":2,"e":"The LCM of 6, 8 and 10 is 120 minutes."}];let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🔢</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(index>=questions.length){restart();return;}act();});render();})();</script></body></html>
