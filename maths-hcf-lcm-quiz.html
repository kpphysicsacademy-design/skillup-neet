ce-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
 .skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}.skills-result{margin-top:14px;text-align:left}.skills-result h3{margin:0 0 8px;font-size:1rem}.skills-result .skill-item{margin-top:7px}.skill-item.unlocked{border-color:var(--green);color:var(--green2);background:#174b42} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}.diagram .accent{stroke:#58d6a3}.diagram .blue{stroke:#91b7ff}.diagram .gold{stroke:#ffd27a}.skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}.skills-result{margin-top:14px;text-align:left}.skills-result h3{margin:0 0 8px;font-size:1rem}.skills-result .skill-item{margin-top:7px}.skill-item.unlocked{border-color:var(--green);color:var(--green2);background:#174b42}</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">HCF and LCM</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="HCF and LCM skills"><div class="skill-title">🎯 HCF and LCM Skills</div><div class="skill-list"><div class="skill-item">Find the highest common factor (HCF)</div><div class="skill-item">Find common factors and multiples</div><div class="skill-item">Apply factors and multiples to word problems</div></div></section></div><script>(function(){'use strict';const questions=[{"d":"BASIC","q":"What is the HCF of 8 and 12?","o":["2","4","6","8"],"a":1,"e":"The common factors are 1, 2 and 4. The greatest is 4.","v":"hcf"},{"d":"BASIC","q":"What is the LCM of 3 and 4?","o":["7","9","12","24"],"a":2,"e":"12 is the smallest positive number divisible by both 3 and 4.","v":"lcm"},{"d":"BASIC","q":"Which is a common factor of 10 and 15?","o":["4","5","6","8"],"a":1,"e":"5 divides both 10 and 15 exactly.","v":"hcf"},{"d":"BASIC","q":"What is the HCF of 6 and 9?","o":["1","2","3","6"],"a":2,"e":"The common factors are 1 and 3, so the HCF is 3.","v":"hcf"},{"d":"BASIC","q":"What is the LCM of 2 and 5?","o":["5","7","10","20"],"a":2,"e":"2 and 5 have no common factor other than 1, so their LCM is 2 × 5 = 10.","v":"lcm"},{"d":"BASIC","q":"What is the HCF of 7 and 14?","o":["2","3","7","14"],"a":2,"e":"7 divides both numbers and is the greatest common factor.","v":"hcf"},{"d":"BASIC","q":"Which number is a common multiple of 4 and 6?","o":["8","12","16","18"],"a":1,"e":"12 = 4 × 3 = 6 × 2, so it is a common multiple.","v":"lcm"},{"d":"BASIC","q":"What is the HCF of 9 and 12?","o":["1","2","3","6"],"a":2,"e":"The common factors are 1 and 3; the greatest is 3.","v":"hcf"},{"d":"BASIC","q":"What is the LCM of 5 and 10?","o":["5","10","15","50"],"a":1,"e":"10 is already a multiple of both 5 and 10.","v":"lcm"},{"d":"BASIC","q":"When do we usually use HCF?","o":["To find the smallest common multiple","To split things into the largest equal groups without leftovers","To add fractions only","To find the largest number"],"a":1,"e":"HCF helps find the greatest size or number of equal groups that divides quantities exactly.","v":"word"},{"d":"MEDIUM","q":"Find the HCF of 18 and 24.","o":["3","6","9","12"],"a":1,"e":"18 = 2 × 3² and 24 = 2³ × 3; common prime factors give HCF 2 × 3 = 6.","v":"prime"},{"d":"MEDIUM","q":"Find the LCM of 6 and 8.","o":["12","18","24","48"],"a":2,"e":"Multiples show the first shared positive multiple is 24.","v":"lcm"},{"d":"MEDIUM","q":"What is the HCF of 20, 30 and 50?","o":["5","10","15","20"],"a":1,"e":"10 divides all three numbers and is the greatest such divisor.","v":"hcf"},{"d":"MEDIUM","q":"What is the LCM of 4, 6 and 8?","o":["12","18","24","48"],"a":2,"e":"24 is divisible by 4, 6 and 8 and is the smallest such positive number.","v":"lcm"},{"d":"MEDIUM","q":"Two bells ring every 6 minutes and 8 minutes. If they ring together now, when will they next ring together?","o":["12 minutes","14 minutes","24 minutes","48 minutes"],"a":2,"e":"The next shared ringing time is after LCM(6, 8) = 24 minutes.","v":"word"},{"d":"MEDIUM","q":"Which is the HCF of 36 and 48?","o":["6","8","12","18"],"a":2,"e":"36 = 3 × 12 and 48 = 4 × 12; 12 is the greatest common factor.","v":"hcf"},{"d":"MEDIUM","q":"Find the LCM of 9 and 12.","o":["18","24","36","108"],"a":2,"e":"36 is the smallest number divisible by both 9 and 12.","v":"lcm"},{"d":"MEDIUM","q":"Which pair has HCF 1?","o":["8 and 12","9 and 15","8 and 15","14 and 21"],"a":2,"e":"8 has factors 1, 2, 4, 8; 15 has factors 1, 3, 5, 15. Their only common factor is 1.","v":"hcf"},{"d":"MEDIUM","q":"Find the HCF of 42 and 56.","o":["7","14","21","28"],"a":1,"e":"42 = 3 × 14 and 56 = 4 × 14, so the HCF is 14.","v":"prime"},{"d":"MEDIUM","q":"Find the LCM of 10 and 15.","o":["15","20","30","60"],"a":2,"e":"30 is the first positive multiple common to 10 and 15.","v":"lcm"},{"d":"HARD","q":"Find the HCF of 72 and 90.","o":["6","9","18","36"],"a":2,"e":"72 = 2³ × 3² and 90 = 2 × 3² × 5; common prime factors give 2 × 3² = 18.","v":"prime"},{"d":"HARD","q":"Find the LCM of 12 and 18.","o":["24","30","36","72"],"a":2,"e":"12 = 2² × 3 and 18 = 2 × 3²; use highest powers: 2² × 3² = 36.","v":"prime"},{"d":"HARD","q":"Two ribbons are 48 cm and 60 cm long. What is the greatest equal length into which both can be cut with no waste?","o":["6 cm","10 cm","12 cm","15 cm"],"a":2,"e":"The greatest equal length is HCF(48, 60) = 12 cm.","v":"word"},{"d":"HARD","q":"Three lights flash every 4, 6 and 10 seconds. When do they flash together next?","o":["20 seconds","30 seconds","60 seconds","120 seconds"],"a":2,"e":"LCM(4, 6, 10) = 60 seconds.","v":"word"},{"d":"HARD","q":"If HCF(a, b) = 6 and LCM(a, b) = 72, and a = 18, what is b?","o":["12","18","24","36"],"a":2,"e":"For positive integers, a × b = HCF × LCM. Thus b = (6 × 72) ÷ 18 = 24.","v":"relation"},{"d":"HARD","q":"What is the LCM of 8, 12 and 15?","o":["60","90","120","240"],"a":2,"e":"8 = 2³, 12 = 2² × 3, 15 = 3 × 5; LCM = 2³ × 3 × 5 = 120.","v":"prime"},{"d":"HARD","q":"What is the HCF of 96 and 144?","o":["12","24","36","48"],"a":3,"e":"96 = 2⁵ × 3 and 144 = 2⁴ × 3²; HCF = 2⁴ × 3 = 48.","v":"prime"},{"d":"HARD","q":"A teacher has 24 pencils and 36 erasers to make identical kits with no items left over. What is the greatest number of kits?","o":["6","8","12","18"],"a":2,"e":"The greatest number of identical kits is HCF(24, 36) = 12.","v":"word"},{"d":"HARD","q":"Which statement is true for any two positive integers a and b?","o":["HCF is always greater than LCM","HCF × LCM = a × b","HCF + LCM = a × b","HCF is always 1"],"a":1,"e":"For two positive integers, HCF(a, b) × LCM(a, b) = a × b.","v":"relation"},{"d":"HARD","q":"Find the LCM of 14 and 35.","o":["49","70","105","140"],"a":1,"e":"14 = 2 × 7 and 35 = 5 × 7; LCM = 2 × 5 × 7 = 70.","v":"prime"}];let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');const visuals={
hcf:'<svg viewBox="0 0 300 100" role="img" aria-label="Common factors of two numbers"><text x="150" y="20" fill="#f2f5ff" text-anchor="middle">Factors of 8: 1, 2, 4, 8</text><text x="150" y="43" fill="#f2f5ff" text-anchor="middle">Factors of 12: 1, 2, 3, 4, 6, 12</text><rect x="73" y="56" width="154" height="30" rx="7" fill="#58d6a322" stroke="#58d6a3"/><text x="150" y="76" fill="#f2f5ff" text-anchor="middle">HCF = 4</text></svg>',
lcm:'<svg viewBox="0 0 300 100" role="img" aria-label="Multiples meet at the least common multiple"><text x="18" y="28" fill="#f2f5ff">Multiples of 3</text><text x="18" y="48" fill="#91b7ff">3, 6, 9, 12, 15…</text><text x="18" y="68" fill="#f2f5ff">Multiples of 4</text><text x="18" y="88" fill="#58d6a3">4, 8, 12, 16…</text><rect x="145" y="33" width="47" height="35" rx="7" fill="#58d6a322" stroke="#58d6a3"/><text x="168" y="55" fill="#f2f5ff" text-anchor="middle">12</text></svg>',
prime:'<svg viewBox="0 0 300 100" role="img" aria-label="Prime factor method for HCF and LCM"><text x="150" y="24" fill="#f2f5ff" text-anchor="middle">12 = 2² × 3</text><text x="150" y="49" fill="#f2f5ff" text-anchor="middle">18 = 2 × 3²</text><path d="M70 60 H230" stroke="#58d6a3" stroke-width="2"/><text x="150" y="84" fill="#58d6a3" text-anchor="middle">HCF: lowest powers · LCM: highest powers</text></svg>',
word:'<svg viewBox="0 0 300 100" role="img" aria-label="Choose HCF for largest equal groups and LCM for repeating events"><rect x="12" y="16" width="132" height="68" rx="9" fill="#91b7ff18" stroke="#91b7ff"/><rect x="156" y="16" width="132" height="68" rx="9" fill="#58d6a318" stroke="#58d6a3"/><text x="78" y="40" fill="#f2f5ff" text-anchor="middle">HCF</text><text x="78" y="62" fill="#f2f5ff" text-anchor="middle">Equal groups</text><text x="222" y="40" fill="#f2f5ff" text-anchor="middle">LCM</text><text x="222" y="62" fill="#f2f5ff" text-anchor="middle">Repeat together</text></svg>',
relation:'<svg viewBox="0 0 300 100" role="img" aria-label="Relationship between HCF and LCM"><rect x="20" y="24" width="260" height="50" rx="10" fill="#91b7ff18" stroke="#91b7ff" stroke-width="2"/><text x="150" y="45" fill="#f2f5ff" text-anchor="middle">HCF(a, b) × LCM(a, b)</text><text x="150" y="64" fill="#58d6a3" text-anchor="middle">= a × b</text></svg>'
};function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'<div class="diagram">'+visuals[q.v]+'</div>':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const skills=[['Find the highest common factor (HCF)',8],['Order integers and interpret inequalities',18],['Solve multi-step integer comparisons',24]];$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">📏</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+skills.map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(index>=questions.length){restart();return;}act();});render();})();</script></body></html>
