ral is split into triangles with sides (10,10,12) m and (13,14,15) m. Its area is:","o":["132 m²","144 m²","156 m²","168 m²"],"a":0,"e":"The triangle areas are 48 m² and 84 m²; total=132 m². Correct option is 132 m²."},{"d":"MEDIUM","q":"Triangle A has sides 20, 21, 29 cm. Triangle B has area 75 cm². Total area:","o":["210 cm²","275 cm²","285 cm²","300 cm²"],"a":2,"e":"Triangle A area=210 cm²; total=210+75=285 cm². Correct option is 285 cm²."},{"d":"MEDIUM","q":"A quadrilateral's two triangular parts have areas 72 cm² and 48 cm². What fraction of its area is the first triangle?","o":["2/5","3/5","3/4","5/6"],"a":1,"e":"Total=120 cm²; first part is 72/120=3/5."},{"d":"HARD","q":"A diagonal divides a quadrilateral into triangles with sides (26,28,30) m and (13,14,15) m. Find the total area.","o":["420 m²","336 m²","450 m²","504 m²"],"a":0,"e":"Their areas are 336 m² and 84 m²; total=420 m²."},{"d":"HARD","q":"A quadrilateral consists of triangles with side lengths (25,25,14) cm and (20,21,29) cm. Its area is:","o":["378 cm²","390 cm²","420 cm²","450 cm²"],"a":0,"e":"Areas are 168 cm² and 210 cm²; total=378 cm². Correct option is 378 cm²."},{"d":"HARD","q":"The area of one triangle formed by a diagonal is 150 cm². The other triangle has sides 13, 14, 15 cm. Find the quadrilateral's area.","o":["204 cm²","224 cm²","234 cm²","250 cm²"],"a":2,"e":"The second triangle's area is 84 cm²; total=150+84=234 cm²."},{"d":"HARD","q":"A diagonal splits a quadrilateral into triangles with sides (39,42,45) m and (8,15,17) m. Find its area.","o":["816 m²","840 m²","876 m²","900 m²"],"a":0,"e":"Areas are 756 m² and 60 m², so total=816 m²."},{"d":"HARD","q":"One triangular half has sides 51, 37, 20 cm. The other has area 94 cm². Find total area.","o":["400 cm²","394 cm²","306 cm²","500 cm²"],"a":0,"e":"The first area is 306 cm²; total=306+94=400 cm²."},{"d":"HARD","q":"A quadrilateral is split into triangles with sides (17,25,28) cm and (15,20,25) cm. Total area:","o":["360 cm²","340 cm
