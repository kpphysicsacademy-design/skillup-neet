<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="SkillUp Mathematics — Learn, Practice, Master.">
<title>SkillUp | Mathematics</title>
<style>
:root{--navy:#071a31;--blue:#1677ff;--teal:#0b6b78;--green:#58cc02;--gold:#ffc800;--text:#172033;--muted:#667085;--border:#dce7f3;--bg:#f5f9ff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--text)}
a{text-decoration:none;color:inherit}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e7ebf2}.nav{max-width:1050px;height:62px;margin:auto;padding:0 14px;display:flex;align-items:center;gap:10px}.home{padding:8px 11px;border:1px solid var(--border);border-radius:999px;color:var(--blue);font-size:11px;font-weight:900}.brand{font-weight:950;color:var(--navy)}.rocket{font-size:23px}.status{margin-left:auto;background:#fff4df;color:#b45309;border-radius:999px;padding:7px 10px;font-size:9px;font-weight:950}
.wrap{max-width:1050px;margin:auto;padding:18px 14px 90px}.hero{position:relative;overflow:hidden;text-align:center;color:#fff;padding:34px 20px;border-radius:27px;background:linear-gradient(135deg,#071a31,#123a66 55%,#0b6b78);box-shadow:0 14px 36px rgba(7,26,49,.16)}.hero:before{content:"";position:absolute;width:210px;height:210px;right:-80px;top:-90px;border-radius:50%;background:rgba(255,200,0,.16)}.hero:after{content:"∑  π  √  ∞";position:absolute;left:-10px;bottom:-12px;font-size:42px;font-weight:900;color:rgba(255,255,255,.08);letter-spacing:8px}.hero>*{position:relative;z-index:1}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:900;opacity:.85}.hero h1{margin:10px 0;font-size:clamp(34px,7vw,54px);line-height:1}.hero h1 span{background:linear-gradient(90deg,#58cc02,#ffc800,#19c8ff);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{max-width:650px;margin:auto;color:rgba(255,255,255,.87);font-size:14px;line-height:1.55}
.tools{display:flex;gap:8px;margin:18px 0 12px}.search{flex:1;padding:12px;border:2px solid var(--border);border-radius:13px;font-size:12px;background:#fff}.search:focus{outline:0;border-color:#8ebced}.search-btn{border:0;border-radius:13px;background:var(--blue);color:#fff;font-weight:950;padding:0 16px;box-shadow:0 3px 0 #0d5bbf}
.section-title{margin:20px 2px 10px;font-size:14px;font-weight:950;color:#526070;letter-spacing:1.3px}.path{position:relative;padding-left:8px}.path:before{content:"";position:absolute;left:25px;top:10px;bottom:10px;width:4px;background:repeating-linear-gradient(to bottom,#cfe0f2 0 12px,transparent 12px 22px);border-radius:5px}.chapter{position:relative;margin:9px 0 9px 44px}.node{position:absolute;left:-28px;top:27px;width:18px;height:18px;border-radius:50%;background:#fff;border:5px solid #b8d3ef;z-index:2}.chapter a{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fff;border:2px solid var(--border);border-radius:18px;padding:12px;box-shadow:0 6px 16px rgba(18,59,112,.07);transition:.18s}.chapter a:hover{transform:translateY(-3px);border-color:#8ebced;box-shadow:0 12px 24px rgba(18,59,112,.12)}.title{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:950}.icon{width:45px;height:45px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,#fff,#eaf3ff);border:2px solid #cfe2f6;box-shadow:0 4px 0 #b5cfe9;font-size:22px}.sub{margin:4px 0 0;font-size:9px;color:var(--muted)}.tag{display:inline-block;margin-top:6px;margin-right:4px;padding:3px 7px;border-radius:99px;background:#eef4fb;color:#526b86;font-size:7px;font-weight:900}.go{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:950;box-shadow:0 4px 0 #0d5bbf}.quiz{margin:12px 0 22px 44px}.quiz a{display:flex;justify-content:center;background:#1677ff;color:#fff;border-radius:14px;padding:11px;font-size:10px;font-weight:950;box-shadow:0 3px 0 #0d5bbf}.empty{display:none;text-align:center;padding:25px;color:var(--muted)}
.bottom{position:fixed;left:0;right:0;bottom:0;height:66px;background:#fff;border-top:1px solid #e7ebf2;box-shadow:0 -6px 22px rgba(23,32,51,.08);display:grid;grid-template-columns:repeat(3,1fr);z-index:30}.bottom a{display:flex;align-items:center;justify-content:center;font-size:21px}.bottom a.active{color:var(--green)}
@media(max-width:650px){.wrap{padding:14px 9px 82px}.hero{padding:28px 15px;border-radius:22px}.hero h1{font-size:36px}.tools{margin-top:14px}.chapter{margin-left:29px}.node{left:-19px}.chapter a{padding:10px}.icon{width:40px;height:40px;font-size:20px}.title{font-size:11px}.go{width:30px;height:30px}.status{font-size:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="nav"><a class="home" href="index.html">🏠 Home</a><span class="rocket">🚀</span><span class="brand">SkillUp</span><span class="status">MATHEMATICS</span></div></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">MATHEMATICS LEARNING JOURNEY</div><h1>Think smart.<br><span>Calculate with confidence.</span></h1><p>Build concepts step by step, practise every important question type, and master Mathematics through progressive learning.</p></section>
<div class="tools"><input id="q" class="search" placeholder="Search Mathematics concepts…" aria-label="Search Mathematics concepts"><button id="searchBtn" class="search-btn">SEARCH</button></div>
<div class="section-title">MATHEMATICS PATH</div><section id="path" class="path"></section><div id="empty" class="empty">No matching Mathematics concepts found.</div>
</main>
<nav class="bottom" aria-label="SkillUp Mathematics navigation"><a href="index.html" title="Home">🏠</a><a href="question-bank.html?subject=mathematics" title="Practice" class="active">🎯</a><a href="question-bank.html?subject=mathematics" title="Tests">🏆</a></nav>
<script>
const units=[
["🔢","Sets, Relations & Functions",["Sets","Relations and functions","Types of functions","Composition of functions","Inverse functions"]],
["📐","Trigonometry",["Trigonometric ratios","Trigonometric identities","Trigonometric equations","Inverse trigonometric functions","Properties of triangles"]],
["🧮","Algebra",["Complex numbers","Quadratic equations","Sequences and series","Binomial theorem","Permutations and combinations","Matrices","Determinants"]],
["📈","Coordinate Geometry",["Straight lines","Circle","Parabola","Ellipse","Hyperbola"]],
["∫","Calculus",["Limits","Continuity","Differentiability","Application of derivatives","Indefinite integration","Definite integration","Area under curves","Differential equations"]],
["🎲","Probability & Statistics",["Probability","Conditional probability","Bayes theorem","Random variables","Statistics"]],
["📏","Vectors & 3D Geometry",["Vector algebra","Scalar and vector products","Three-dimensional geometry","Lines in space","Planes"]],
["📊","Mathematical Reasoning & Miscellaneous",["Mathematical reasoning","Statistics basics","Linear programming","Mathematical modelling","Mixed practice"]]
];
const path=document.getElementById("path"),empty=document.getElementById("empty");
function render(filter=""){
 path.innerHTML="";let count=0;
 units.forEach((u,i)=>{
   const matches=u[2].filter(x=>(u[1]+" "+x).toLowerCase().includes(filter.toLowerCase()));
   if(filter && !matches.length)return;
   count++;
   const box=document.createElement("div");box.className="chapter";
   const topics=filter?matches:u[2].slice(0,4);
   box.innerHTML='<span class="node"></span><a href="question-bank.html?subject=mathematics&topic='+encodeURIComponent(u[1])+'"><span><span class="title"><span class="icon">'+u[0]+'</span>'+u[1]+'</span><span class="sub">'+topics.join(" • ")+'</span><span class="tag">CONCEPTS</span><span class="tag">MCQs</span><span class="tag">REVISION</span></span><span class="go">›</span></a>';
   path.appendChild(box);
   const quiz=document.createElement("div");quiz.className="quiz";quiz.innerHTML='<a href="question-bank.html?subject=mathematics&topic='+encodeURIComponent(u[1])+'">🎯 Practice '+u[1]+' →</a>';path.appendChild(quiz);
 });
 empty.style.display=count?"none":"block";
}
render();
document.getElementById("searchBtn").onclick=()=>render(document.getElementById("q").value);
document.getElementById("q").addEventListener("input",e=>render(e.target.value));
</script>
<script src="central-config.js"></script><script src="central-auth.js"></script>
<script>(async function(){const session=await window.SkillUpAuth.requireAuth(location.href);if(!session)return;document.documentElement.dataset.authenticated="true";})();</script>
</body>
</html>
