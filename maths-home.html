.nav-status{margin-left:auto;height:28px;padding:0 9px;border-radius:999px;display:grid;place-items:center;background:#eaf8e6;color:#318600;font-size:10px;font-weight:950}.mascot{font-size:24px}
.wrap{padding:16px 13px 70px}.concept-count{font-size:12px;font-weight:950;color:var(--n);margin:2px 0 10px}
.tools{display:flex;gap:8px;margin:0 0 10px}.search{flex:1;min-width:0;padding:11px;border:2px solid var(--l);border-radius:13px;font-size:12px;background:#fff}.search-btn{border:0;border-radius:13px;background:var(--b);color:#fff;font-weight:950;padding:0 16px;cursor:pointer;box-shadow:0 3px 0 #46a302}

<script>
(function(){
'use strict';
const data=window.SKILLUP_MATH_PATH,path=document.getElementById('path'),empty=document.getElementById('empty'),count=document.getElementById('conceptCount');
let concepts=0,subs=0;data.forEach(([_,obj])=>Object.values(obj).forEach(a=>{concepts++;subs+=a.length}));
count.textContent=concepts+' Concepts • '+subs+' Sub-concepts • Class 8 → JEE';
const icons=['🔢','📐','📊','📈','🧮','📏','🎯','🧠','∞','📍','⚡','🧩'];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(term=''){
 const t=term.trim().toLowerCase();let out='',visible=0;
 data.forEach(([level,obj])=>{
  let cards='';
  Object.entries(obj).forEach(([title,list],ci)=>{
   const blob=(level+' '+title+' '+list.join(' ')).toLowerCase();
   if(t&&!blob.includes(t))return;visible++;
   cards+='<article class="unit"><div class="concept-card"><div class="concept-head"><div class="icon">'+icons[ci%icons.length]+'</div><div><div class="title">'+esc(title)+'</div><div class="sub">'+list.length+' sub-concepts</div></div><div class="go">›</div></div><div class="workflow"><span class="tag">LEARN</span><span class="tag">PRACTICE</span><span class="tag">CONCEPT QUIZ</span><span class="tag">MASTERY</span></div><div class="subconcepts">'+list.map(s=>'<div class="subitem">'+esc(s)+'</div>').join('')+'</div><div class="progress"><i></i></div></div></article>';
  });
  if(cards)out+='<section class="level"><div class="level-title"><span>'+esc(level)+'</span><span class="level-count">'+Object.keys(obj).length+' concepts</span></div>'+cards+'</section>';
 });
 path.innerHTML=out;empty.style.display=visible?'none':'block';
}
document.getElementById('q').addEventListener('input',e=>render(e.target.value));
document.getElementById('searchBtn').addEventListener('click',()=>render(document.getElementById('q').value));
const mb=document.getElementById('menuBtn'),mn=document.getElementById('menu');
if(mb&&mn){mb.addEventListener('click',e=>{e.stopPropagation();const open=mn.classList.toggle('open');mb.setAttribute('aria-expanded',open?'true':'false')});document.addEventListener('click',e=>{if(!e.target.closest('.menu-wrap')){mn.classList.remove('open');mb.setAttribute('aria-expanded','false')}})}
render();
})();
</script>
