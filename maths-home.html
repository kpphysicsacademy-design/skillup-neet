<head>

<title>SkillUp Mathematics • Learning Path • 20261012-maths-home-cleared-v1</title>
<style>
:root{--g:#58cc02;--deep:#173f27;--text:#263238;--muted:#66736b;--line:#d9e8d4;--bg:#f7fbf5;--card:#fff;--soft:#f8fcf6;--shadow:0 5px 18px rgba(23,69,42,.06)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.nav,.wrap{max-width:760px;margin:auto}.nav{height:58px;padding:0 10px;display:flex;align-items:center;gap:10px}
.brand{flex:1;text-align:center;font-weight:950;color:var(--deep);font-size:16px;line-height:1}.brand small{display:block;margin-top:4px;font-size:7px;letter-spacing:1px;color:#64806b}
.badge{font-size:8px;font-weight:950;background:#eaf8e6;color:#318600;padding:6px 9px;border-radius:999px}
.wrap{padding:10px 10px 65px}.hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:10px}
.kicker{font-size:8px;letter-spacing:1px;color:#64806b;font-weight:950}.hero h1{margin:5px 0 7px;color:var(--deep);font-size:28px;line-height:1.12}.hero p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.stat{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center}.stat strong{display:block;color:var(--deep);font-size:15px}.stat span{display:block;color:#718078;font-size:8px;font-weight:800;margin-top:2px}
.searchbox{position:sticky;top:58px;z-index:10;background:var(--bg);padding:7px 0 9px}.searchrow{display:flex;gap:7px}.search{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;font-size:12px}.search:focus,.navselect:focus{border-color:#9fd68f;box-shadow:0 0 0 3px #58cc0215}.clear,.toolbtn{border:1px solid var(--line);background:#fff;color:var(--deep);border-radius:12px;padding:0 13px;font-size:11px;font-weight:900;cursor:pointer}.searchtools{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;margin-top:7px}.navselect{min-width:0;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--deep);font-size:11px}.toolbtn{min-height:36px;padding:0 10px}.quickfilters{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin}.filterchip{flex:none;border:1px solid var(--line);background:#fff;color:var(--deep);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:850;cursor:pointer}.filterchip[aria-pressed="true"]{background:#eaf8e6;border-color:#9fd68f;color:#245d13}.resultbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 1px 9px;color:#718078;font-size:10px;font-weight:750}.resultbar strong{color:var(--deep)}.chapter[open] summary{background:#fbfef9}.chapter summary:focus-visible,.concept:focus-visible,.filterchip:focus-visible,.toolbtn:focus-visible,.clear:focus-visible{outline:3px solid #9fd68f;outline-offset:2px}
.stage{margin:14px 0 7px}.stage-head{display:flex;align-items:center;gap:8px}.stage-num{width:27px;height:27px;border-radius:9px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:950}.stage-title{color:var(--deep);font-size:12px;font-weight:950;letter-spacing:.5px}.stage-count{margin-left:auto;color:#718078;font-size:9px;font-weight:800}
.chapter{background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden;box-shadow:0 2px 8px rgba(23,69,42,.03)}.chapter summary{cursor:pointer;list-style:none;padding:13px 14px;color:var(--deep);font-size:13px;font-weight:900;display:flex;align-items:center;gap:8px}.chapter summary::-webkit-details-marker{display:none}.chapter summary:after{content:"+";margin-left:auto;color:#58a942;font-size:17px}.chapter[open] summary:after{content:"−"}
.chapter-meta{font-size:8px;color:#78907f;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 7px}.concepts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:0 10px 10px}
.concept{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:43px;padding:9px 10px;background:var(--soft);border:1px solid var(--line);border-radius:11px;color:#264b31;text-decoration:none;font-size:11px;font-weight:750;line-height:1.25}.concept:hover{border-color:#9fd68f;background:#eef8ea}.arrow{color:#58a942;font-weight:950;flex:none}
.noresults{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;text-align:center;color:var(--muted);font-size:12px}.hint{margin-top:9px;font-size:9px;color:#78907f;text-align:center}
@media(max-width:520px){.nav{padding:0 8px}.wrap{padding:8px 8px 55px}.hero{padding:16px 14px}.hero h1{font-size:24px}.stats{gap:5px}.stat{padding:8px 4px}.stat strong{font-size:14px}.concepts{grid-template-columns:1fr}.concept{min-height:42px}.searchbox{top:58px}}
</style>
<style>

@media(max-width:600px){
 html,body{width:100%;min-width:0;overflow-x:hidden;-webkit-text-size-adjust:100%}

 .brand small{font-size:6px;letter-spacing:.7px}
 .badge{font-size:7px;padding:5px 7px}

}
@media(max-width:360px){
 .nav{height:52px;padding:0 7px}
 .wrap{padding-left:5px;padding-right:5px}
 .hero{padding:13px 11px}
 .hero h1{font-size:20px}
 .searchbox{top:52px}
}
