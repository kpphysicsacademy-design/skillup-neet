<script>window.SKILLUP_MATH_PATH=[["CLASS 8 • FOUNDATION",["Rational Numbers","Linear Equations","Understanding Quadrilaterals","Data Handling","Squares & Square Roots","Cubes & Cube Roots","Comparing Quantities","Algebraic Expressions & Identities","Exponents & Powers","Direct & Inverse Proportion","Introduction to Graphs"]],["CLASS 9 • CORE",["Number System","Polynomials","Linear Equations in Two Variables","Coordinate Geometry","Lines & Angles","Triangles","Quadrilaterals","Circles","Areas & Volumes","Statistics & Probability"]],["CLASS 10 • BOARD MASTERY",["Real Numbers","Polynomials","Pair of Linear Equations","Quadratic Equations","Arithmetic Progressions","Coordinate Geometry","Triangles & Circles","Introduction to Trigonometry","Trigonometric Applications","Statistics","Probability"]],["CLASS 11 • COMPETITIVE FOUNDATION",["Sets","Relations & Functions","Trigonometric Functions","Complex Numbers","Quadratic Equations","Sequences & Series","Permutations & Combinations","Binomial Theorem","Straight Lines","Circles","Conic Sections","Limits & Derivatives","Statistics & Probability"]],["CLASS 12 • ADVANCED",["Matrices & Determinants","Continuity & Differentiability","Applications of Derivatives","Integrals","Applications of Integrals","Differential Equations","Vectors","Three-Dimensional Geometry","Probability"]],["JEE • MASTERY",["Advanced Algebra","Advanced Trigonometry","Advanced Coordinate Geometry","Advanced Calculus","Advanced Probability","Inequalities","Mixed JEE Problems","Full Mathematics Revision"]]]</script>
<style>
:root{--g:#58cc02;--dark:#173f67;--muted:#6b7d8f;--line:#dbe7f0;--bg:#f4f8fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#243746;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}.nav{max-width:850px;margin:auto;height:58px;padding:0 14px;display:flex;align-items:center;gap:9px}.logo{font-size:23px}.brand{font-weight:950;color:var(--dark)}.brand small{display:block;font-size:8px;letter-spacing:1px;color:var(--muted)}.count{margin-left:auto;font-size:9px;font-weight:950;color:#438c13;background:#edf8e9;padding:7px 9px;border-radius:99px}
main{max-width:850px;margin:auto;padding:15px 12px 70px}.hero{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 6px 18px #173f6710}.hero h1{margin:0;color:var(--dark);font-size:clamp(27px,6vw,40px)}.hero p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.5}.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.stat{padding:6px 9px;border-radius:99px;background:#f4f8fb;border:1px solid var(--line);font-size:8px;font-weight:950}
.searchbox{position:sticky;top:58px;z-index:8;margin:12px 0;background:var(--bg);padding:2px 0 8px;display:flex;gap:7px}.search{width:100%;border:2px solid var(--line);border-radius:13px;padding:11px 12px;background:#fff;font-size:12px}.clear{border:0;border-radius:13px;background:var(--g);color:#fff;font-weight:950;padding:0 13px}
.path{position:relative;padding:4px 0}.level{margin:8px 0 22px}.level-title{font-size:11px;font-weight:950;color:var(--dark);background:#eaf5e5;border-radius:12px;padding:9px 12px;margin:0 0 12px}.concept-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:0 4px 12px #173f6708}.concept-card h2{margin:0;color:var(--dark);font-size:18px}.concept-card small{font-size:8px;color:var(--muted)}.progress{height:5px;background:#edf3f7;border-radius:99px;margin-top:10px}.progress span{display:block;width:0;height:100%;background:var(--g);border-radius:99px}.path:before{content:"";position:absolute;left:27px;top:15px;bottom:15px;width:4px;background:#d8ead0;border-radius:9px}.unit{position:relative;margin:0 0 17px;padding-left:58px}.unitdot{position:absolute;left:11px;top:3px;width:36px;height:36px;border-radius:50%;background:var(--g);border:5px solid #e5f6dc;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:950;z-index:2}.concept-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:0 4px 12px #173f6708}.concept-card h2{margin:0;color:var(--dark);font-size:18px}.concept-card small{font-size:8px;color:var(--muted)}.unit h2{margin:0 0 2px;color:var(--dark);font-size:16px}.unit small{font-size:8px;color:var(--muted)}.chapter{margin-top:10px}.chapter-title{font-size:8px;font-weight:950;color:#438c13;margin:10px 0 6px;letter-spacing:.7px}.formulas{display:grid;grid-template-columns:1fr 1fr;gap:7px}.formula{background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px;text-decoration:none;color:#243746;min-height:56px;box-shadow:0 3px 9px #173f6708}.formula:hover{border-color:#8fc0df}.num{font-size:7px;font-weight:950;color:#8a9aaa;margin-bottom:3px}.math{font-size:14px;overflow-x:auto;white-space:nowrap}.empty{text-align:center;padding:25px;color:var(--muted);display:none}
@media(max-width:600px){.formulas{grid-template-columns:1fr}.unit{padding-left:55px}.path:before{left:25px}.unitdot{left:8px}.hero{padding:17px}.math{font-size:14px}}
</style></head>
<body><header><div class="nav"><span class="logo">📐</span><div class="brand">SkillUp<small>MATHEMATICS • CONCEPT LEARNING PATH</small></div><span class="count" id="count"></span></div></header>
<main><section class="hero"><h1>Mathematics Learning Path</h1><p>Learn each concept first, then study its key formulas and apply them in practice. Mathematics is rendered with MathJax.</p><div class="stats"><span class="stat" id="formulaCount"></span><span class="stat" id="chapterCount"></span><span class="stat">MATHJAX 3</span><span class="stat">CLASS 8 → JEE</span></div></section>
<div class="searchbox"><input id="search" class="search" placeholder="Search a concept or formula…" autocomplete="off"><button class="clear" id="clear">CLEAR</button></div>
<section id="path" class="path"></section><div id="empty" class="empty">No matching concepts.</div></main>
<script>(()=>{const data=window.SKILLUP_MATH_PATH,path=document.getElementById('path'),empty=document.getElementById('empty');let total=0;data.forEach(x=>total+=x[1].length);document.getElementById('count').textContent=total+' CONCEPTS';document.getElementById('formulaCount').textContent=data.length+' LEVELS';document.getElementById('chapterCount').textContent=total+' CONCEPTS';function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(term=''){const t=term.trim().toLowerCase();let h='',shown=0,n=0;data.forEach(level=>{const hits=level[1].filter(x=>!t||(level[0]+' '+x).toLowerCase().includes(t));if(!hits.length)return;h+='<section class="level"><div class="level-title">'+esc(level[0])+'</div>';hits.forEach(title=>{n++;shown++;h+='<article class="unit"><span class="unitdot">'+n+'</span><div class="concept-card"><h2>'+esc(title)+'</h2><small>CONCEPT • LEARN → PRACTICE → MASTER</small><div class="progress"><span></span></div></div></article>'});h+='</section>'});path.innerHTML=h;empty.style.display=shown?'none':'block'}document.getElementById('search').oninput=e=>render(e.target.value);document.getElementById('clear').onclick=()=>{document.getElementById('search').value='';render()};render()})();</script><script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script></body></html>
