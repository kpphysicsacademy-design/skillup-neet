<script>(()=>{const data=window.SKILLUP_MATH_PATH,path=document.getElementById('path'),empty=document.getElementById('empty');let total=0;data.forEach(x=>Object.keys(x[1]).forEach(k=>total+=x[1][k].length));document.getElementById('count').textContent=total+' SUB-CONCEPTS';document.getElementById('formulaCount').textContent=data.length+' LEVELS';document.getElementById('chapterCount').textContent=total+' LEARNING STEPS';function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(term=''){const t=term.trim().toLowerCase();let h='',shown=0,n=0;data.forEach(level=>{let lh='';Object.entries(level[1]).forEach(([title,subs])=>{const blob=(level[0]+' '+title+' '+subs.join(' ')).toLowerCase();if(t&&!blob.includes(t))return;n++;shown++;lh+='<article class="unit"><span class="unitdot">'+n+'</span><div class="concept-card"><h2>'+esc(title)+'</h2><small>CONCEPT • '+subs.length+' SUB-CONCEPTS</small><div class="subconcepts">'+subs.map((s,i)=>'<div class="sub"><span>'+(i+1)+'</span>'+esc(s)+'</div>').join('')+'</div><div class="progress"><span></span></div></div></article>'});if(lh)h+='<section class="level"><div class="level-title">'+esc(level[0])+'</div>'+lh+'</section>'});path.innerHTML=h;empty.style.display=shown?'none':'block'}document.getElementById('search').oninput=e=>render(e.target.value);document.getElementById('clear').onclick=()=>{document.getElementById('search').value='';render()};render()})();</script><script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script></body></html>
