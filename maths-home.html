<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp | Complete Mathematics Path</title>
<style>
:root{--b:#1677ff;--n:#123b70;--m:#6b7280;--l:#d9e5f2;--bg:#f5f9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#263238;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--l)}
.nav,.wrap{max-width:1050px;margin:auto}.nav{height:60px;padding:0 14px;display:flex;align-items:center;gap:10px}
.brand{font-weight:950;color:var(--n)}.mark{font-size:24px}.status{margin-left:auto;background:#eaf8e6;color:#318600;border-radius:999px;padding:7px 10px;font-size:9px;font-weight:950}
.wrap{padding:16px 12px 70px}.hero{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px 18px;box-shadow:0 5px 16px rgba(18,59,112,.06)}
.hero h1{margin:0;color:var(--n);font-size:clamp(25px,6vw,36px)}.hero p{margin:7px 0 0;color:var(--m);font-size:12px;line-height:1.5}
.search{width:100%;margin-top:14px;padding:11px 12px;border:2px solid var(--l);border-radius:13px;font-size:12px;background:#fff}
.path{margin-top:14px;padding-left:9px;position:relative}.path:before{content:"";position:absolute;left:17px;top:10px;bottom:20px;width:3px;background:repeating-linear-gradient(to bottom,#dbe8f5 0 12px,transparent 12px 22px)}
.level{margin:22px 0 10px;display:flex;align-items:center;gap:8px}.lnum{width:38px;height:38px;flex:0 0 38px;border-radius:50%;display:grid;place-items:center;background:var(--b);color:#fff;font-size:11px;font-weight:950;border:4px solid #e7f1ff}.level h2{margin:0;color:var(--n);font-size:15px}.unit-toggle{margin-left:auto;border:1px solid var(--l);background:#fff;color:var(--b);border-radius:999px;padding:7px 10px;font-size:8px;font-weight:900;cursor:pointer;white-space:nowrap}.unit-toggle:hover{background:#eef6ff}.level small{color:var(--m);font-size:8px}
.chapter{position:relative;margin:8px 0 8px 43px}.chapter-node{position:absolute;left:-27px;top:22px;width:17px;height:17px;border-radius:50%;background:#fff;border:5px solid #b8d3ef;z-index:2}
.chapter-head{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#fff;border:2px solid var(--l);border-radius:17px;padding:10px;box-shadow:0 6px 16px rgba(18,59,112,.07)}
.chapter-title{font-size:12px;font-weight:950;color:#263238}.chapter-meta{margin-top:3px;font-size:8px;color:var(--m)}.sub-toggle{border:1px solid var(--l);background:#fff;color:var(--b);border-radius:999px;padding:5px 8px;font-size:7px;font-weight:900;cursor:pointer;white-space:nowrap}.sub-toggle:hover{background:#eef6ff}.go{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--b);color:#fff;font-weight:950;box-shadow:0 4px 0 #0d5bbf}
.tags{margin-top:5px}.tag{display:inline-block;margin-right:4px;padding:3px 6px;border-radius:99px;background:#eef4fb;color:#526b86;font-size:7px;font-weight:900}
.concepts{margin:5px 0 14px 28px;display:grid;gap:5px}.concept{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center;background:#fff;border:1px solid var(--l);border-radius:12px;padding:8px 9px;text-decoration:none;color:#526b86;font-size:9px;font-weight:800;box-shadow:0 3px 9px rgba(18,59,112,.04)}.concept:hover{border-color:#8ebced}.cmeta{font-size:7px;color:#98a4b3;font-weight:700}.empty{display:none;background:#fff;border:1px solid var(--l);border-radius:14px;padding:18px;text-align:center;color:var(--m)}
@media(max-width:700px){.wrap{padding:12px 9px 60px}.hero{padding:18px 14px}.chapter{margin-left:28px}.chapter-node{left:-18px}.concepts{margin-left:18px}.chapter-head{padding:9px}.chapter-title{font-size:11px}.go{width:29px;height:29px}}
</style>
<script src="iit-maths-path-curriculum.js?v=20261005"></script>
</head>
<body>
<header class="top"><div class="nav"><span class="mark">📐</span><span class="brand">SkillUp Mathematics</span><span class="status">MATHEMATICS</span></div></header>
<main class="wrap">
<section class="hero">
<h1>Mathematics Path</h1>
<p>Progressive Mathematics from absolute fundamentals to IIT-JEE mastery — levels, chapters and individual concepts, with notation, pronunciation, meaning, usage and practice built into the learning path.</p>
<input id="search" class="search" placeholder="Search chapters or concepts…" aria-label="Search Mathematics path">
</section>
<section id="path" class="path"></section>
<div id="empty" class="empty">No matching Mathematics concepts found.</div>
</main>
<script>
(function(){
"use strict";
var data=window.SKILLUP_IIT_MATHS_PATH||[];
var path=document.getElementById("path"),search=document.getElementById("search"),empty=document.getElementById("empty");
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function render(term){
term=(term||"").trim().toLowerCase();var html="",matched=0;
data.forEach(function(level,li){
var chapters=level[2]||[],lh="";
chapters.forEach(function(ch,ci){
var concepts=ch[1]||[], filtered=concepts.filter(function(x){return !term||(level[1]+" "+ch[0]+" "+x).toLowerCase().indexOf(term)>-1;});
if(!filtered.length)return;
matched+=filtered.length;
var cid="unit-"+li+"-chapter-"+ci;
lh+='<article class="chapter"><span class="chapter-node"></span><div class="chapter-head"><div><div class="chapter-title">'+esc(ch[0])+'</div><div class="chapter-meta">Chapter '+(ci+1)+' • '+filtered.length+(term?' matching ':'')+' concepts</div><div class="tags"><span class="tag">📘 CONCEPT</span><span class="tag">🧠 PRACTICE</span></div></div><div><button class="sub-toggle" type="button" data-target="'+cid+'">Open all</button><span class="go">›</span></div></div><div class="concepts" id="'+cid+'">';
filtered.forEach(function(concept){
lh+='<a class="concept" href="/iit-maths-path.html?concept='+encodeURIComponent(concept)+'&v=20261005"><span>'+esc(concept)+'</span><span class="cmeta">›</span></a>';
});
lh+='</div></article>';
});
if(lh){var uid="unit-"+li;html+='<div class="level" data-unit="'+uid+'"><span class="lnum">'+(li+1)+'</span><div><h2>'+esc(level[1])+'</h2><small>'+chapters.length+' chapters • progressive unit '+(li+1)+' of '+data.length+'</small></div><button class="unit-toggle" type="button" data-target="'+uid+'">Open all</button></div><div class="unit-content" id="'+uid+'">'+lh+'</div>';}
});
path.innerHTML=html;empty.style.display=matched?'none':'block';
path.querySelectorAll(".unit-toggle").forEach(function(btn){
btn.addEventListener("click",function(){
var box=document.getElementById(btn.getAttribute("data-target"));
var open=btn.getAttribute("data-open")==="1";
box.style.display=open?"none":"block";
btn.setAttribute("data-open",open?"0":"1");
btn.textContent=open?"Open all":"Close all";
});
});
path.querySelectorAll(".sub-toggle").forEach(function(btn){
btn.addEventListener("click",function(){
var box=document.getElementById(btn.getAttribute("data-target"));
var open=btn.getAttribute("data-open")==="1";
box.style.display=open?"none":"grid";
btn.setAttribute("data-open",open?"0":"1");
btn.textContent=open?"Open all":"Close all";
});
});
}
render("");
search.addEventListener("input",function(){render(this.value);});
})();
</script>
</body>
</html>
