<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="SkillUp Mathematics — progressive IIT-JEE Mathematics concept path.">
<title>SkillUp | Mathematics</title>
<script src="iit-maths-path-curriculum.js?v=20261005"></script>
<style>
:root{--b:#58cc02;--n:#173f5f;--m:#6b7280;--l:#dce8f0;--bg:#f5f9fc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#263238;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--l)}.nav,.wrap{max-width:1050px;margin:auto}
.nav{height:60px;padding:0 14px;display:flex;align-items:center;gap:9px;position:relative}.menu-wrap{position:relative}
.menu-btn{width:38px;height:38px;border:1px solid var(--l);border-radius:12px;background:#fff;font-size:21px;cursor:pointer;display:grid;place-items:center}
.menu{position:absolute;left:0;top:46px;width:240px;background:#fff;border:1px solid var(--l);border-radius:16px;box-shadow:0 12px 28px rgba(23,63,95,.16);padding:8px;display:none;z-index:50}.menu.open{display:block}
.menu a{display:block;padding:11px 12px;border-radius:10px;font-size:12px;font-weight:800;color:var(--n);text-decoration:none}.menu a:hover{background:#eef7fc}
.menu-title{padding:8px 12px 6px;font-size:10px;font-weight:950;color:var(--m);letter-spacing:.7px}.brand{font-weight:950;color:var(--n)}.brand small{display:block;font-size:8px;letter-spacing:1px;color:#6d8190}
.nav-status{margin-left:auto;height:28px;padding:0 9px;border-radius:999px;display:grid;place-items:center;background:#edf5ff;color:#2f68a5;font-size:10px;font-weight:950}.mascot{font-size:24px}
.wrap{padding:16px 13px 70px}.concept-count{display:none}
.tools{display:flex;gap:8px;margin:5px 0 16px}.search{flex:1;padding:11px;border:2px solid var(--l);border-radius:13px;font-size:12px;outline:none}.search:focus{border-color:#8bc8f1}.search-btn{border:0;border-radius:13px;background:var(--b);color:#fff;font-weight:950;padding:0 16px;cursor:pointer;box-shadow:0 3px 0 #46a302}
.path{padding-left:9px}.unit{display:flex;align-items:center;gap:8px;margin:20px 0 9px}.unit-main{display:flex;align-items:center;gap:8px;min-width:0}
.unum{width:36px;height:36px;flex:0 0 36px;border-radius:50%;display:grid;place-items:center;background:var(--b);color:#fff;font-size:11px;font-weight:950;border:4px solid #e7f6df}
.unit h2{margin:0;color:var(--n);font-size:15px}.unit small{color:var(--m);font-size:8px}
.chapter{position:relative;margin:7px 0 7px 43px}.node{position:absolute;left:-27px;top:23px;width:17px;height:17px;border-radius:50%;background:#fff;border:5px solid #b9d7e8}
.chapter a{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#fff;border:2px solid var(--l);border-radius:17px;padding:10px;box-shadow:0 6px 16px rgba(23,63,95,.07);transition:.16s;text-decoration:none;color:inherit}
.chapter a:hover{transform:translateY(-2px);border-color:#9cc8e6}.title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:950}
.icon{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,#fff,#eaf5fc);border:2px solid #cde1ef;box-shadow:0 4px 0 #b8d2e2,0 7px 14px rgba(52,152,219,.10);font-size:21px}
.sub{margin:3px 0 0;font-size:8px;color:var(--m)}.tag{display:inline-block;margin-top:5px;margin-right:4px;padding:3px 6px;border-radius:99px;background:#edf5fa;color:#526b7b;font-size:7px;font-weight:900}
.go{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:var(--b);color:#fff;font-weight:950;box-shadow:0 4px 0 #46a302}.empty{text-align:center;padding:20px;color:var(--m);display:none}
@media(max-width:700px){.wrap{padding:12px 9px 70px}.chapter{margin-left:28px}.node{left:-18px}.chapter a{padding:9px}.title{font-size:11px}.icon{width:37px;height:37px;flex-basis:37px;font-size:19px}.go{width:30px;height:30px}}
</style></head>
<body>
<header class="top"><div class="nav"><div class="menu-wrap"><button class="menu-btn" id="menuBtn" type="button" aria-label="Open SkillUp menu" aria-expanded="false">☰</button><div class="menu" id="menu" aria-label="SkillUp navigation"><div class="menu-title">SKILLUP</div><a href="physics-home-fast.html">🚀 Physics</a><a href="chemistry-home.html">🧪 Chemistry</a><a href="botany-home.html">🌿 Botany</a><a href="zoology-home.html">🦁 Zoology</a><a href="maths-home.html">📐 Mathematics</a><a href="profile.html">👤 Profile</a><a href="progress.html">📊 My Progress</a><a href="tests.html">📝 My Tests</a><a href="revision.html">🔄 Revision</a><a href="achievements.html">🏆 Achievements</a><div class="menu-title">MORE</div><a href="help.html">❓ Help &amp; Feedback</a><a href="about.html">ℹ️ About SkillUp</a></div></div><span class="mascot">📐</span><div class="brand">SkillUp<small>MATHEMATICS • IIT-JEE</small></div><span class="nav-status">MATHEMATICS</span></div></header>
<main class="wrap">
<div class="tools"><input id="q" class="search" placeholder="Search Mathematics concepts…" aria-label="Search Mathematics concepts"><button id="searchBtn" class="search-btn" type="button">SEARCH</button></div>
<section id="path" class="path"></section><div id="empty" class="empty">No matching Mathematics concepts found.</div>
</main>
<script>
(function(){
'use strict';
const data=window.SKILLUP_IIT_MATHS_PATH||[],path=document.getElementById('path'),empty=document.getElementById('empty'),q=document.getElementById('q');
const icons=['🔢','🔗','📐','🧮','📊','📍','📈','∫','🧭','🏆'];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(term=''){
 const f=term.toLowerCase();path.innerHTML='';let shown=0;
 data.forEach((u,ui)=>{
   const chapters=u[2]||[];
   const matches=chapters.filter(ch=>!f||(u[1]+' '+ch[0]+' '+(ch[1]||[]).join(' ')).toLowerCase().includes(f));
   if(!matches.length)return;
   path.insertAdjacentHTML('beforeend','<div class="unit"><div class="unit-main"><span class="unum">'+(ui+1)+'</span><div><h2>'+esc(u[1])+'</h2><small>'+chapters.length+' chapters • UNIT '+(ui+1)+' of '+data.length+'</small></div></div></div>');
   matches.forEach((ch,ci)=>{
     shown++;
     const concepts=ch[1]||[];
     const href='/iit-maths-path.html?chapter='+encodeURIComponent(ch[0])+'&v=20261005';
     const conceptText=concepts.length+' concepts';
     path.insertAdjacentHTML('beforeend','<article class="chapter"><span class="node"></span><a href="'+href+'"><div><div class="title"><span class="icon">'+icons[ui%icons.length]+'</span><span>'+esc(ch[0])+'</span></div><div class="sub">Chapter '+shown+' • '+esc(u[1])+' • '+conceptText+'</div><span class="tag">🎯 CHAPTER '+shown+'</span><span class="tag">🧠 QUIZ</span><span class="tag">📘 PRACTICE</span></div><span class="go">›</span></a></article>');
   });
 });
 empty.style.display=shown?'none':'block';
}
render();
document.getElementById('searchBtn').onclick=()=>render(q.value.trim());
q.addEventListener('keydown',e=>{if(e.key==='Enter')render(q.value.trim())});
document.getElementById('menuBtn').onclick=()=>{const m=document.getElementById('menu'),open=m.classList.toggle('open');document.getElementById('menuBtn').setAttribute('aria-expanded',open)};
document.addEventListener('click',e=>{if(!e.target.closest('.menu-wrap'))document.getElementById('menu').classList.remove('open')});
})();
</script></body></html>
