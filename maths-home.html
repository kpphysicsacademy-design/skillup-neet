<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="SkillUp Mathematics learning path from Class 8 foundation to JEE mastery">
<title>SkillUp Mathematics • Learning Path</title>
<style>
:root{--g:#58cc02;--dark:#173f27;--text:#263238;--muted:#6b7280;--line:#d9e8d4;--bg:#f7fbf5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.nav,.wrap{max-width:760px;margin:auto}.nav{height:60px;padding:0 14px;display:flex;align-items:center;gap:10px}
.brand{font-weight:950;color:var(--dark);font-size:17px}.brand small{display:block;color:#64806b;font-size:8px;letter-spacing:1px}
.badge{margin-left:auto;padding:7px 11px;border-radius:999px;background:#eaf8e6;color:#318600;font-size:10px;font-weight:900}
.wrap{padding:14px 12px 70px}.hero{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px 18px;box-shadow:0 4px 14px #17452a10}
.hero h1{margin:0;color:var(--dark);font-size:clamp(28px,5vw,38px)}.stats{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.stat{padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:#f8fcf6;color:var(--dark);font-size:10px;font-weight:900}
.tools{display:flex;gap:8px;margin:14px 0}.search{flex:1;padding:12px;border:2px solid var(--line);border-radius:14px;font-size:13px}
.search-btn{border:0;border-radius:14px;padding:0 17px;background:var(--g);color:white;font-weight:950}
.level{margin:18px 0 8px;color:#52735a;font-size:11px;font-weight:950;letter-spacing:.7px}
.chapter{background:#fff;border:1px solid var(--line);border-radius:18px;margin:9px 0;overflow:hidden}
.chapter summary{cursor:pointer;padding:15px;font-weight:900;color:var(--dark);list-style:none}.chapter summary::-webkit-details-marker{display:none}
.chapter summary:after{content:'+';float:right;color:#58a942}.chapter[open] summary:after{content:'−'}
.chapter-meta{font-size:9px;color:#78907f;font-weight:700;margin-left:7px}
.concepts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 12px 12px}
.concept{display:block;padding:11px;background:#f8fcf6;border:1px solid var(--line);border-radius:12px;color:#264b31;text-decoration:none;font-size:12px;font-weight:700}
.concept:hover{border-color:#9fd68f;background:#eef8ea}
.empty{padding:15px;background:#fff;border:1px solid var(--line);border-radius:16px;color:var(--muted);font-size:12px}
@media(max-width:520px){.wrap{padding:10px 9px 55px}.concepts{grid-template-columns:1fr}.hero{padding:18px 14px}.search-btn{padding:0 13px}}
</style>
</head>
<body>
<header class="top"><div class="nav"><div class="brand">SkillUp<small>MATHEMATICS • CONCEPT PATH</small></div><span class="badge">MATHS</span></div></header>
<main class="wrap">
<section class="hero">
<h1>Mathematics Learning Path</h1>
<div class="stats">
<span class="stat" id="conceptStat">0 Concepts</span>
<span class="stat" id="chapterStat">0 Chapters</span>
<span class="stat">CLASS 8 → JEE</span>
</div>
</section>
<div class="tools">
<input id="q" class="search" type="search" placeholder="Search chapters or concepts…" aria-label="Search Mathematics">
<button id="searchBtn" class="search-btn" type="button">SEARCH</button>
</div>
<section id="path"></section>
</main>
<script src="maths-path-data.js?v=20261006-2350"></script>
<script>
(function(){
"use strict";
const data=Array.isArray(window.SKILLUP_MATH_PATH)?window.SKILLUP_MATH_PATH:[];
const path=document.getElementById("path"), all=[];
data.forEach(function(levelItem){
  const level=levelItem[0], chapters=levelItem[1]||{};
  Object.entries(chapters).forEach(function(entry){
    const chapter=entry[0], concepts=Array.isArray(entry[1])?entry[1]:[];
    concepts.forEach(function(concept){all.push({level,chapter,concept});});
  });
});
document.getElementById("conceptStat").textContent=all.length+" Concepts";
document.getElementById("chapterStat").textContent=new Set(all.map(function(x){return x.chapter;})).size+" Chapters";

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}
function link(x){
  return "maths-path-concept.html?concept="+encodeURIComponent(x.concept)+"&level="+encodeURIComponent(x.level)+"&chapter="+encodeURIComponent(x.chapter)+"&v=20261006-2350";
}
function render(list){
  let html="", lastLevel="";
  const groups=new Map();
  list.forEach(function(x){
    const key=x.level+"||"+x.chapter;
    if(!groups.has(key))groups.set(key,{level:x.level,chapter:x.chapter,items:[]});
    groups.get(key).items.push(x);
  });
  groups.forEach(function(g){
    if(g.level!==lastLevel){html+='<div class="level">'+esc(g.level)+"</div>";lastLevel=g.level;}
    html+='<details class="chapter" open><summary>'+esc(g.chapter)+' <span class="chapter-meta">'+g.items.length+' concepts</span></summary><div class="concepts">';
    g.items.forEach(function(x){html+='<a class="concept" href="'+link(x)+'">'+esc(x.concept)+' →</a>';});
    html+="</div></details>";
  });
  path.innerHTML=html||'<div class="empty">No matching concepts found.</div>';
}
function search(){
  const t=document.getElementById("q").value.toLowerCase().trim();
  render(t?all.filter(function(x){return (x.level+" "+x.chapter+" "+x.concept).toLowerCase().includes(t);}):all);
}
document.getElementById("q").addEventListener("input",search);
document.getElementById("searchBtn").addEventListener("click",search);
render(all);
})();
</script>
</body>
</html>
