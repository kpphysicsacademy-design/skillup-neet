<script>
(function(){

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(term=''){

 });
 path.innerHTML=html;empty.style.display=shown?'none':'block';if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([path]);
}
