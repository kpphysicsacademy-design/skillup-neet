<section class="hero">
<h1>Mathematics Path</h1>
<p>20 progressive core areas — from absolute fundamentals to advanced IIT-JEE problem solving. Learn concepts, notation, pronunciation, usage and practice step by step.</p>
</section>
<section id="path" class="path"></section>
<a class="cta" href="/iit-maths-path.html?v=20261005">📘 OPEN COMPLETE CONCEPT PATH →</a>
</main>
<script>
(function(){
var areas=[
["🔢","Number System","Numbers, operations, fractions, decimals, powers, roots, surds, divisibility and remainders."],
["➕","Algebraic Foundations","Variables, expressions, identities, factorisation, algebraic fractions and polynomial basics."],
["∈","Sets","Set representation, subsets, power sets, union, intersection, difference, complement and Venn diagrams."],
["🔗","Relations","Ordered pairs, Cartesian products, relations, domain, range and relation properties."],
["ƒ","Functions","Function notation, domain, codomain, range, graphs, types, composition and inverse functions."],
["x²","Quadratic Equations & Inequalities","Roots, discriminant, graphs, common roots, location of roots, maxima, minima and inequalities."],
["Σ","Sequences & Series","AP, GP, HP, means, special series, sigma notation, telescoping and arithmetic-geometric series."],
["∑","Induction, P&C & Binomial","Mathematical induction, permutations, combinations, counting principles and binomial expansion."],
["i","Complex Numbers","Complex plane, Argand diagram, modulus, argument, polar form, De Moivre theorem and roots."],
["▣","Matrices, Determinants & Logarithms","Matrix operations, determinants, inverse, systems of equations, logarithms and exponential relations."],
["sin","Trigonometry","Angles, radians, trigonometric ratios, unit circle, identities, compound angles and transformations."],
["tan⁻¹","Trig Equations, Inverse Trig & Triangles","General solutions, inverse functions, principal values, identities and triangle properties."],
["📍","Coordinate Foundations","Cartesian plane, distance, section formula, midpoint, centroid, area, slope and locus."],
["／","Straight Lines & Circle","Line equations, angles, distances, families of lines, angle bisectors and circle geometry."],
["⌁","Conic Sections","Parabola, ellipse, hyperbola, standard forms, tangents, normals, chords and advanced properties."],
["lim","Limits & Continuity","Limits, one-sided limits, standard limits, indeterminate forms and continuity."],
["dy","Differentiation & Applications","Derivative rules, implicit and parametric differentiation, MVT, monotonicity, extrema and AOD."],
["∫","Integration","Indefinite integration, substitution, parts, partial fractions, trigonometric forms and reduction."],
["∫ₐᵇ","Definite Integration, Area & Differential Equations","Definite integrals, properties, FTC, area under curves and first-order differential equations."],
["→","Vectors, 3D, Probability, Statistics & JEE Mastery","Vectors, 3D geometry, probability, statistics, mixed problems, JEE Main and JEE Advanced mastery."]
];
var p=document.getElementById("path");
p.innerHTML=areas.map(function(x,i){
return '<article class="area"><span class="node"></span><a href="/iit-maths-path.html?area='+encodeURIComponent(x[1])+'&v=20261005"><div><div class="title"><span class="icon">'+x[0]+'</span><span>'+x[1]+'</span></div><div class="sub">Core Area '+(i+1)+' • Progressive Mathematics Path</div><span class="tag">🎯 AREA '+(i+1)+'</span><span class="tag">📘 CONCEPT</span><span class="tag">🧠 PRACTICE</span></div><span class="go">›</span></a></article>';
}).join("");
})();
</script>
