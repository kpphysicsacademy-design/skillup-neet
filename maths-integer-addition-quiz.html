<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261012-integer-addition-quiz-v1"><title>Integer Addition | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Integer addition</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What is (-3) + 8?","o":["-11","-5","5","11"],"a":2,"e":"Starting at -3 and moving 8 units right gives 5.","v":"integer-addition"},{"d":"BASIC","q":"What is 7 + (-12)?","o":["19","5","-5","-19"],"a":2,"e":"Adding a negative is moving left 12 units from 7.","v":"integer-addition"},{"d":"BASIC","q":"What is (-6) + (-4)?","o":["-10","-2","2","10"],"a":0,"e":"Adding two negative numbers adds their magnitudes and keeps the negative sign.","v":"integer-addition"},{"d":"BASIC","q":"What is 15 + (-9)?","o":["24","6","-6","-24"],"a":1,"e":"The signs differ, so subtract 9 from 15 and keep the sign of 15.","v":"integer-addition"},{"d":"BASIC","q":"What is (-14) + 20?","o":["-34","-6","6","34"],"a":2,"e":"The positive magnitude is larger: 20 − 14 = 6.","v":"integer-addition"},{"d":"BASIC","q":"Which expression equals zero?","o":["(-8)+8","(-8)+(-8)","8+8","(-8)+1"],"a":0,"e":"A number and its additive inverse sum to zero.","v":"integer-addition"},{"d":"BASIC","q":"What is (-25) + 13?","o":["38","12","-12","-38"],"a":2,"e":"Subtract 13 from 25 and keep the negative sign.","v":"integer-addition"},{"d":"BASIC","q":"What is 0 + (-17)?","o":["17","-17","0","-1"],"a":1,"e":"Adding zero leaves a number unchanged.","v":"integer-addition"},{"d":"BASIC","q":"What is (-9) + 4 + 6?","o":["-19","-1","1","19"],"a":2,"e":"First -9 + 4 = -5, then -5 + 6 = 1.","v":"integer-addition"},{"d":"BASIC","q":"What is 18 + (-18) + (-2)?","o":["0","2","-2","34"],"a":2,"e":"The first two terms cancel to zero, leaving -2.","v":"integer-addition"},{"d":"MEDIUM","q":"A lift is on floor -2 and rises 7 floors. Which floor does it reach?","o":["-9","-5","5","9"],"a":2,"e":"Moving up 7 from -2 gives -2 + 7 = 5.","v":"integer-addition"},{"d":"MEDIUM","q":"The temperature is -4°C and rises by 9°C. What is the new temperature?","o":["-13°C","-5°C","5°C","13°C"],"a":2,"e":"-4 + 9 = 5°C.","v":"integer-addition"},{"d":"MEDIUM","q":"Which sum is equal to -7?","o":["(-3)+(-4)","(-3)+4","3+4","(-7)+7"],"a":0,"e":"Two negative addends with magnitudes 3 and 4 total -7.","v":"integer-addition"},{"d":"MEDIUM","q":"Evaluate (-16) + 5.","o":["21","-21","11","-11"],"a":3,"e":"The magnitudes differ by 11 and the negative magnitude is larger.","v":"integer-addition"},{"d":"MEDIUM","q":"Evaluate 23 + (-31).","o":["54","8","-8","-54"],"a":2,"e":"31 − 23 = 8, and the larger magnitude is negative.","v":"integer-addition"},{"d":"MEDIUM","q":"Which number must be added to -12 to get 5?","o":["-17","-7","7","17"],"a":3,"e":"Solve -12 + x = 5, so x = 17.","v":"integer-addition"},{"d":"MEDIUM","q":"If a diver is at -15 m and rises 6 m, what is the new position?","o":["-21 m","-9 m","9 m","21 m"],"a":1,"e":"Rising adds 6: -15 + 6 = -9 m.","v":"integer-addition"},{"d":"MEDIUM","q":"What is (-7) + 0 + (-2)?","o":["-9","-5","5","9"],"a":0,"e":"Zero changes nothing, and -7 + -2 = -9.","v":"integer-addition"},{"d":"MEDIUM","q":"Which is greater?","o":["(-5)+2","(-5)+(-2)","They are equal","Cannot be compared"],"a":0,"e":"-3 is greater than -7.","v":"integer-addition"},{"d":"MEDIUM","q":"What is the sum of the smallest and largest integers in {-4, 3, -9, 6}?","o":["-15","-3","3","15"],"a":1,"e":"The smallest is -9 and largest is 6; their sum is -3.","v":"integer-addition"},{"d":"HARD","q":"Evaluate (-18) + 27 + (-4).","o":["5","9","13","49"],"a":0,"e":"-18 + 27 = 9, then 9 - 4 = 5.","v":"integer-addition"},{"d":"HARD","q":"A bank balance is -₹120. A deposit of ₹175 is made. What is the new balance?","o":["-₹295","-₹55","₹55","₹295"],"a":2,"e":"-120 + 175 = ₹55.","v":"integer-addition"},{"d":"HARD","q":"Which statement about adding integers is true?","o":["The sum of two integers is always an integer","The sum is always positive","The sum is always larger than both addends","Adding a negative always gives a negative sum"],"a":0,"e":"Integers are closed under addition.","v":"integer-addition"},{"d":"HARD","q":"Find x if x + (-8) = -3.","o":["-11","-5","5","11"],"a":2,"e":"Add 8 to both sides to obtain x = 5.","v":"integer-addition"},{"d":"HARD","q":"Evaluate (-32) + 19.","o":["51","-51","13","-13"],"a":3,"e":"32 − 19 = 13 and the larger magnitude is negative.","v":"integer-addition"},{"d":"HARD","q":"The temperature changes from 6°C to -2°C. What integer represents the change?","o":["-8°C","-4°C","4°C","8°C"],"a":0,"e":"Change = final − initial = -2 − 6 = -8°C.","v":"integer-addition"},{"d":"HARD","q":"Which pair has a sum of -1?","o":["(-6)+5","(-6)+(-5)","6+5","(-1)+1"],"a":0,"e":"-6 + 5 = -1.","v":"integer-addition"},{"d":"HARD","q":"Evaluate (-45) + 45 + (-13).","o":["0","13","-13","77"],"a":2,"e":"-45 and 45 cancel, leaving -13.","v":"integer-addition"},{"d":"HARD","q":"A hiker is 8 m below a reference level and climbs 13 m. What is the final position?","o":["-21 m","-5 m","5 m","21 m"],"a":2,"e":"-8 + 13 = 5 m above the reference level.","v":"integer-addition"},{"d":"HARD","q":"If a + (-9) = -20, what is a?","o":["-29","-11","11","29"],"a":1,"e":"-11 + (-9) = -20, so a = -11.","v":"integer-addition"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Add positive and negative integers</strong><small>Use number lines and additive inverses</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Solve integer addition word problems</strong><small>Reason with signs and integer sums</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply ruler-and-compass reasoning</strong><small>Use accurate integer addition methods</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script></body></html>
