<script>
(function(){
'use strict';
const questions=[{"q":"What is (-3) + 8?","o":["-11","-5","5","11"],"a":2,"why":"Starting at -3 and moving 8 units right gives 5."},{"q":"What is 7 + (-12)?","o":["19","5","-5","-19"],"a":2,"why":"Adding a negative is moving left 12 units from 7."},{"q":"What is (-6) + (-4)?","o":["-10","-2","2","10"],"a":0,"why":"Adding two negative numbers adds their magnitudes and keeps the negative sign."},{"q":"What is 15 + (-9)?","o":["24","6","-6","-24"],"a":1,"why":"The signs differ, so subtract 9 from 15 and keep the sign of 15."},{"q":"What is (-14) + 20?","o":["-34","-6","6","34"],"a":2,"why":"The positive magnitude is larger: 20 − 14 = 6."},{"q":"Which expression equals zero?","o":["(-8)+8","(-8)+(-8)","8+8","(-8)+1"],"a":0,"why":"A number and its additive inverse sum to zero."},{"q":"What is (-25) + 13?","o":["38","12","-12","-38"],"a":2,"why":"Subtract 13 from 25 and keep the negative sign."},{"q":"What is 0 + (-17)?","o":["17","-17","0","-1"],"a":1,"why":"Adding zero leaves a number unchanged."},{"q":"What is (-9) + 4 + 6?","o":["-19","-1","1","19"],"a":2,"why":"First -9 + 4 = -5, then -5 + 6 = 1."},{"q":"What is 18 + (-18) + (-2)?","o":["0","2","-2","34"],"a":2,"why":"The first two terms cancel to zero, leaving -2."},{"q":"A lift is on floor -2 and rises 7 floors. Which floor does it reach?","o":["-9","-5","5","9"],"a":2,"why":"Moving up 7 from -2 gives -2 + 7 = 5."},{"q":"The temperature is -4°C and rises by 9°C. What is the new temperature?","o":["-13°C","-5°C","5°C","13°C"],"a":2,"why":"-4 + 9 = 5°C."},{"q":"Which sum is equal to -7?","o":["(-3)+(-4)","(-3)+4","3+4","(-7)+7"],"a":0,"why":"Two negative addends with magnitudes 3 and 4 total -7."},{"q":"Evaluate (-16) + 5.","o":["21","-21","11","-11"],"a":3,"why":"The magnitudes differ by 11 and the negative magnitude is larger."},{"q":"Evaluate 23 + (-31).","o":["54","8","-8","-54"],"a":2,"why":"31 − 23 = 8, and the larger magnitude is negative."},{"q":"Which number must be added to -12 to get 5?","o":["-17","-7","7","17"],"a":3,"why":"Solve -12 + x = 5, so x = 17."},{"q":"If a diver is at -15 m and rises 6 m, what is the new position?","o":["-21 m","-9 m","9 m","21 m"],"a":1,"why":"Rising adds 6: -15 + 6 = -9 m."},{"q":"What is (-7) + 0 + (-2)?","o":["-9","-5","5","9"],"a":0,"why":"Zero changes nothing, and -7 + -2 = -9."},{"q":"Which is greater?","o":["(-5)+2","(-5)+(-2)","They are equal","Cannot be compared"],"a":0,"why":"-3 is greater than -7."},{"q":"What is the sum of the smallest and largest integers in {-4, 3, -9, 6}?","o":["-15","-3","3","15"],"a":1,"why":"The smallest is -9 and largest is 6; their sum is -3."},{"q":"Evaluate (-18) + 27 + (-4).","o":["5","9","13","49"],"a":0,"why":"-18 + 27 = 9, then 9 - 4 = 5."},{"q":"A bank balance is -₹120. A deposit of ₹175 is made. What is the new balance?","o":["-₹295","-₹55","₹55","₹295"],"a":2,"why":"-120 + 175 = ₹55."},{"q":"Which statement about adding integers is true?","o":["The sum of two integers is always an integer","The sum is always positive","The sum is always larger than both addends","Adding a negative always gives a negative sum"],"a":0,"why":"Integers are closed under addition."},{"q":"Find x if x + (-8) = -3.","o":["-11","-5","5","11"],"a":2,"why":"Add 8 to both sides to obtain x = 5."},{"q":"Evaluate (-32) + 19.","o":["51","-51","13","-13"],"a":3,"why":"32 − 19 = 13 and the larger magnitude is negative."},{"q":"The temperature changes from 6°C to -2°C. What integer represents the change?","o":["-8°C","-4°C","4°C","8°C"],"a":0,"why":"Change = final − initial = -2 − 6 = -8°C."},{"q":"Which pair has a sum of -1?","o":["(-6)+5","(-6)+(-5)","6+5","(-1)+1"],"a":0,"why":"-6 + 5 = -1."},{"q":"Evaluate (-45) + 45 + (-13).","o":["0","13","-13","77"],"a":2,"why":"-45 and 45 cancel, leaving -13."},{"q":"A hiker is 8 m below a reference level and climbs 13 m. What is the final position?","o":["-21 m","-5 m","5 m","21 m"],"a":2,"why":"-8 + 13 = 5 m above the reference level."},{"q":"If a + (-9) = -20, what is a?","o":["-29","-11","11","29"],"a":1,"why":"-11 + (-9) = -20, so a = -11."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Integer Addition Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261104-physics-path-layout-v2" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
