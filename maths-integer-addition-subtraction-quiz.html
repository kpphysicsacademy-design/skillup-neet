<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Calculate 4 + (−2).","o":["6","2","−2","−6"],"a":1,"e":"Adding −2 means moving two steps left from 4, landing at 2.","v":"add"},{"d":"BASIC","q":"Calculate −3 + 5.","o":["−8","−2","2","8"],"a":2,"e":"Starting at −3 and moving five steps right reaches 2.","v":"numberline"},{"d":"BASIC","q":"Calculate −4 + (−3).","o":["−7","−1","1","7"],"a":0,"e":"Adding two negative integers combines their magnitudes and keeps the negative sign: −7.","v":"add"},{"d":"BASIC","q":"Calculate 8 − 6.","o":["14","−14","2","−2"],"a":2,"e":"Eight minus six equals 2.","v":"subtract"},{"d":"BASIC","q":"Calculate 2 − 7.","o":["5","−5","9","−9"],"a":1,"e":"Moving seven steps left from 2 reaches −5.","v":"subtract"},{"d":"BASIC","q":"What is −6 + 6?","o":["−12","12","0","6"],"a":2,"e":"Opposite integers cancel because they are equally far from zero on opposite sides.","v":"zero"},{"d":"BASIC","q":"Calculate −2 − 3.","o":["1","−1","−5","5"],"a":2,"e":"Subtracting 3 moves three steps left from −2, reaching −5.","v":"subtract"},{"d":"BASIC","q":"Calculate 7 + (−7).","o":["14","−14","0","7"],"a":2,"e":"7 and −7 are opposites, so their sum is zero.","v":"opposite"},{"d":"BASIC","q":"A temperature is −2°C and rises by 4°C. What is the new temperature?","o":["−6°C","−2°C","2°C","6°C"],"a":2,"e":"−2 + 4 = 2°C.","v":"thermometer"},{"d":"BASIC","q":"Calculate −9 − (−4).","o":["−13","−5","5","13"],"a":1,"e":"Subtracting a negative is adding its opposite: −9 + 4 = −5.","v":"subtract"},{"d":"MEDIUM","q":"Calculate −8 + 13 − 4.","o":["1","−1","9","−9"],"a":0,"e":"−8 + 13 = 5, then 5 − 4 = 1.","v":"steps"},{"d":"MEDIUM","q":"Calculate 12 − (−5).","o":["7","−7","17","−17"],"a":2,"e":"Subtracting −5 is equivalent to adding 5: 12 + 5 = 17.","v":"subtract"},{"d":"MEDIUM","q":"Calculate −7 − 6 + 10.","o":["−23","−3","3","9"],"a":1,"e":"−7 − 6 = −13, and −13 + 10 = −3.","v":"steps"},{"d":"MEDIUM","q":"Which expression equals −4?","o":["−9 + 5","−9 − 5","9 − 5","−9 + 4"],"a":0,"e":"−9 + 5 = −4; the other options give −14, 4 and −5.","v":"add"},{"d":"MEDIUM","q":"A lift starts at floor −3, rises 8 floors, then descends 6 floors. Which floor does it reach?","o":["−17","−1","1","11"],"a":1,"e":"−3 + 8 − 6 = 5 − 6 = −1.","v":"elevator"},{"d":"MEDIUM","q":"Calculate −15 − (−8).","o":["−23","−7","7","23"],"a":1,"e":"−15 + 8 = −7.","v":"subtract"},{"d":"MEDIUM","q":"What number must be added to −6 to obtain 4?","o":["−10","−2","10","12"],"a":2,"e":"−6 + 10 = 4, so the required number is 10.","v":"numberline"},{"d":"MEDIUM","q":"A bank balance is −₹40. A deposit of ₹75 is made. What is the new balance?","o":["−₹115","−₹35","₹35","₹115"],"a":2,"e":"−40 + 75 = ₹35.","v":"money"},{"d":"MEDIUM","q":"Calculate 6 + (−11) + 3.","o":["−2","2","−8","20"],"a":0,"e":"6 − 11 + 3 = −5 + 3 = −2.","v":"add"},{"d":"MEDIUM","q":"Which is greater: −4 − 2 or −4 + 2?","o":["−4 − 2","−4 + 2","They are equal","Both are positive"],"a":1,"e":"−4 − 2 = −6, while −4 + 2 = −2; −2 is greater.","v":"compare"},{"d":"HARD","q":"Evaluate −12 + 7 − (−5).","o":["−10","0","10","−24"],"a":1,"e":"−12 + 7 + 5 = −5 + 5 = 0.","v":"steps"},{"d":"HARD","q":"A diver is at −18 m. The diver rises 7 m, descends 11 m, then rises 9 m. What is the final position?","o":["−33 m","−13 m","−4 m","9 m"],"a":1,"e":"−18 + 7 = −11; −11 − 11 = −22; −22 + 9 = −13 m.","v":"diver"},{"d":"HARD","q":"Find x: x + (−9) = −2.","o":["−11","−7","7","11"],"a":2,"e":"Add 9 to both sides: x = −2 + 9 = 7.","v":"equation"},{"d":"HARD","q":"Evaluate −5 − (−12) − 9.","o":["−26","−2","2","16"],"a":1,"e":"−5 + 12 − 9 = 7 − 9 = −2.","v":"subtract"},{"d":"HARD","q":"The temperature is 3°C, falls by 10°C, then rises by 4°C. What is the final temperature?","o":["−11°C","−3°C","3°C","17°C"],"a":1,"e":"3 − 10 + 4 = −7 + 4 = −3°C.","v":"thermometer"},{"d":"HARD","q":"Calculate −3 × 1 + 8 − 10.","o":["−5","−1","5","15"],"a":0,"e":"−3 + 8 − 10 = 5 − 10 = −5.","v":"steps"},{"d":"HARD","q":"A wallet balance is −₹125. You add ₹200 and then spend ₹90. What is the final balance?","o":["−₹415","−₹15","₹15","₹165"],"a":1,"e":"−125 + 200 − 90 = 75 − 90 = −₹15.","v":"money"},{"d":"HARD","q":"Which value of x makes −8 − x = −3?","o":["−5","5","−11","11"],"a":0,"e":"−8 − (−5) = −8 + 5 = −3, so x = −5.","v":"equation"},{"d":"HARD","q":"Evaluate 14 − 20 + (−6) − (−9).","o":["−21","−3","3","9"],"a":1,"e":"14 − 20 − 6 + 9 = −6 − 6 + 9 = −12 + 9 = −3.","v":"steps"},{"d":"HARD","q":"A lift starts at floor −4, goes up 9 floors, down 12 floors, then up 3 floors. Where does it finish?","o":["−4","−10","−2","8"],"a":0,"e":"−4 + 9 − 12 + 3 = 5 − 12 + 3 = −7 + 3 = −4.","v":"elevator"}];let index=0,selected=-1,locked=false,finished=false,xp=0,streak=0,bestStreak=0,correct=0;const el=id=>document.getElementById(id);function progress(){const p=Math.round(index/questions.length*100);el('fill').style.width=p+'%';el('percent').textContent=p+'%';el('progressText').textContent='QUESTION '+Math.min(index+1,questions.length)+' OF '+questions.length;}function render(){const q=questions[index];selected=-1;locked=false;el('level').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);el('question').textContent=q.q;el('choices').innerHTML=q.o.map((v,i)=>'<button type="button" class="choice" data-letter="'+String.fromCharCode(65+i)+'" data-index="'+i+'">'+v+'</button>').join('');el('choices').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.index);el('choices').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));el('action').disabled=false;}));el('feedback').className='feedback';el('feedback').textContent='';el('hint').textContent='Choose one answer';el('action').textContent='Check answer';el('action').disabled=true;progress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;streak++;bestStreak=Math.max(bestStreak,streak);}else streak=0;el('xp').textContent='⭐ '+xp+' XP';el('streak').textContent='🔥 '+streak+' streak';el('choices').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});el('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;el('feedback').className='feedback show '+(good?'good':'bad');el('hint').textContent=good?'+10 XP':'Keep practising';el('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();}else results();}function results(){finished=true;el('fill').style.width='100%';el('percent').textContent='100%';el('progressText').textContent='QUIZ COMPLETE';el('level').textContent='Practice complete';el('question').innerHTML='<div class="finish"><div style="font-size:42px">➕</div><h2>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h2><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><a class="sim" href="maths-positive-negative-integers-simulator.html?v=20261111-positive-negative-integers-simulator-v1">Explore the integers simulator →</a><div class="summary">⭐ '+xp+' XP earned<br>🔥 Best streak: '+bestStreak+'</div></div>';el('choices').innerHTML='';el('feedback').className='feedback';el('hint').textContent='You can retry anytime';el('action').textContent='Try again ↻';el('action').disabled=false;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;streak=0;bestStreak=0;correct=0;el('xp').textContent='⭐ 0 XP';el('streak').textContent='🔥 0 streak';render();}el('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();</script><script src="/shared-nav.js?v=20261017-duolingo-standard-v1"></script></body></html>
