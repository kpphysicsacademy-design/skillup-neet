<main>

<script>
(function(){
'use strict';
const questions=[{"q":"What is 12 ÷ (−3)?","o":["−4","4","−9","9"],"a":0,"why":"12 ÷ 3 = 4; opposite signs give a negative quotient."},{"q":"What is (−24) ÷ 6?","o":["4","−4","−18","18"],"a":1,"why":"24 ÷ 6 = 4; opposite signs give a negative quotient."},{"q":"What is (−35) ÷ (−7)?","o":["−5","5","−28","28"],"a":1,"why":"35 ÷ 7 = 5; two negative numbers give a positive quotient."},{"q":"What is 0 ÷ (−9)?","o":["−9","9","0","Undefined"],"a":2,"why":"Zero divided by any non-zero number is zero."},{"q":"What is 42 ÷ 7?","o":["−6","6","35","49"],"a":1,"why":"42 ÷ 7 = 6."},{"q":"What is (−56) ÷ 8?","o":["7","−7","−48","48"],"a":1,"why":"56 ÷ 8 = 7; the signs differ, so the quotient is negative."},{"q":"What is 81 ÷ (−9)?","o":["9","−9","−8","8"],"a":1,"why":"81 ÷ 9 = 9; opposite signs give a negative quotient."},{"q":"What is (−64) ÷ (−8)?","o":["−8","8","−56","56"],"a":1,"why":"64 ÷ 8 = 8; equal signs give a positive quotient."},{"q":"Which expression is undefined?","o":["0 ÷ 5","5 ÷ 0","0 ÷ (−5)","(−5) ÷ 1"],"a":1,"why":"Division by zero is undefined."},{"q":"What is (−1) ÷ (−1)?","o":["−1","0","1","Undefined"],"a":2,"why":"A non-zero number divided by itself is 1."},{"q":"If x ÷ (−6) = 5, what is x?","o":["−30","30","−11","11"],"a":0,"why":"Multiply both sides by −6: x = 5 × (−6)."},{"q":"If (−48) ÷ x = 6, what is x?","o":["−8","8","−288","288"],"a":0,"why":"The divisor must be −8 because (−48) ÷ (−8) = 6."},{"q":"Evaluate (−72) ÷ 9.","o":["8","−8","−63","63"],"a":1,"why":"72 ÷ 9 = 8 and the signs differ."},{"q":"Evaluate 96 ÷ (−12).","o":["8","−8","−12","12"],"a":1,"why":"96 ÷ 12 = 8; opposite signs give a negative quotient."},{"q":"Evaluate (−100) ÷ (−10).","o":["−10","10","−90","90"],"a":1,"why":"100 ÷ 10 = 10 and the signs are the same."},{"q":"A temperature change of −36°C is split equally over 4 hours. What is the change per hour?","o":["−9°C","9°C","−32°C","32°C"],"a":0,"why":"Divide −36 by 4 to find the equal hourly change."},{"q":"Which quotient is positive?","o":["(−42) ÷ 7","24 ÷ (−6)","(−45) ÷ (−9)","(−16) ÷ 4"],"a":2,"why":"A quotient is positive when the dividend and divisor have the same sign."},{"q":"What is (−84) ÷ 7 ÷ (−2), working from left to right?","o":["−6","6","−12","12"],"a":1,"why":"First −84 ÷ 7 = −12; then −12 ÷ −2 = 6."},{"q":"If 63 ÷ x = −9, find x.","o":["−7","7","−6","6"],"a":0,"why":"63 ÷ (−7) = −9, so the divisor is −7."},{"q":"What is (−120) ÷ 15?","o":["8","−8","−105","105"],"a":1,"why":"120 ÷ 15 = 8; the signs differ."},{"q":"Evaluate [ (−96) ÷ 12 ] ÷ (−2).","o":["−4","4","−8","8"],"a":1,"why":"First −96 ÷ 12 = −8; then −8 ÷ −2 = 4."},{"q":"Evaluate (−144) ÷ [ (−6) × 4 ].","o":["−6","6","−24","24"],"a":1,"why":"The denominator is −24, so (−144) ÷ (−24) = 6."},{"q":"If x ÷ 8 = −7, then x equals:","o":["−56","56","−15","15"],"a":0,"why":"Multiply both sides by 8 to get x = −56."},{"q":"A lift's signed change is −54 floors over 6 equal intervals. What is the change per interval?","o":["9 floors","−9 floors","−60 floors","60 floors"],"a":1,"why":"−54 ÷ 6 = −9 floors per interval."},{"q":"Which statement about integer division is always true when the divisor is non-zero?","o":["The quotient is always positive","Zero divided by the divisor is zero","Division is commutative","The quotient is always an integer"],"a":1,"why":"For any non-zero divisor, 0 divided by it equals 0."},{"q":"Evaluate 180 ÷ (−5) ÷ (−6).","o":["−6","6","−30","30"],"a":1,"why":"Work left to right: 180 ÷ −5 = −36, then −36 ÷ −6 = 6."},{"q":"If (−9) ÷ x = 3, what is x?","o":["−3","3","−27","27"],"a":0,"why":"Since −9 ÷ −3 = 3, the divisor is −3."},{"q":"Which pair of expressions both have value −12?","o":["72 ÷ (−6) and (−72) ÷ 6","(−72) ÷ (−6) and 72 ÷ 6","(−60) ÷ 5 and 60 ÷ 5","(−36) ÷ (−3) and 36 ÷ 3"],"a":0,"why":"Both 72 ÷ (−6) and (−72) ÷ 6 equal −12."},{"q":"A debt of ₹84 is represented by −84. If it is shared equally among 7 people, what is the signed amount per person?","o":["₹12","−₹12","−₹77","₹77"],"a":1,"why":"−84 ÷ 7 = −12, representing a debt of ₹12 each."},{"q":"Which equation is correct?","o":["(−63) ÷ (−7) = −9","63 ÷ (−7) = 9","(−63) ÷ 7 = −9","0 ÷ 0 = 0"],"a":2,"why":"−63 ÷ 7 = −9; division by zero, including 0 ÷ 0, is undefined."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Integer Division Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261104-physics-path-layout-v2" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
