<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What is 12 ÷ (−3)?","o":["−4","4","−9","9"],"a":0,"e":"12 ÷ 3 = 4; opposite signs give a negative quotient.","v":"integer-division"},{"d":"BASIC","q":"What is (−24) ÷ 6?","o":["4","−4","−18","18"],"a":1,"e":"24 ÷ 6 = 4; opposite signs give a negative quotient.","v":"integer-division"},{"d":"BASIC","q":"What is (−35) ÷ (−7)?","o":["−5","5","−28","28"],"a":1,"e":"35 ÷ 7 = 5; two negative numbers give a positive quotient.","v":"integer-division"},{"d":"BASIC","q":"What is 0 ÷ (−9)?","o":["−9","9","0","Undefined"],"a":2,"e":"Zero divided by any non-zero number is zero.","v":"integer-division"},{"d":"BASIC","q":"What is 42 ÷ 7?","o":["−6","6","35","49"],"a":1,"e":"42 ÷ 7 = 6.","v":"integer-division"},{"d":"BASIC","q":"What is (−56) ÷ 8?","o":["7","−7","−48","48"],"a":1,"e":"56 ÷ 8 = 7; the signs differ, so the quotient is negative.","v":"integer-division"},{"d":"BASIC","q":"What is 81 ÷ (−9)?","o":["9","−9","−8","8"],"a":1,"e":"81 ÷ 9 = 9; opposite signs give a negative quotient.","v":"integer-division"},{"d":"BASIC","q":"What is (−64) ÷ (−8)?","o":["−8","8","−56","56"],"a":1,"e":"64 ÷ 8 = 8; equal signs give a positive quotient.","v":"integer-division"},{"d":"BASIC","q":"Which expression is undefined?","o":["0 ÷ 5","5 ÷ 0","0 ÷ (−5)","(−5) ÷ 1"],"a":1,"e":"Division by zero is undefined.","v":"integer-division"},{"d":"BASIC","q":"What is (−1) ÷ (−1)?","o":["−1","0","1","Undefined"],"a":2,"e":"A non-zero number divided by itself is 1.","v":"integer-division"},{"d":"MEDIUM","q":"If x ÷ (−6) = 5, what is x?","o":["−30","30","−11","11"],"a":0,"e":"Multiply both sides by −6: x = 5 × (−6).","v":"integer-division"},{"d":"MEDIUM","q":"If (−48) ÷ x = 6, what is x?","o":["−8","8","−288","288"],"a":0,"e":"The divisor must be −8 because (−48) ÷ (−8) = 6.","v":"integer-division"},{"d":"MEDIUM","q":"Evaluate (−72) ÷ 9.","o":["8","−8","−63","63"],"a":1,"e":"72 ÷ 9 = 8 and the signs differ.","v":"integer-division"},{"d":"MEDIUM","q":"Evaluate 96 ÷ (−12).","o":["8","−8","−12","12"],"a":1,"e":"96 ÷ 12 = 8; opposite signs give a negative quotient.","v":"integer-division"},{"d":"MEDIUM","q":"Evaluate (−100) ÷ (−10).","o":["−10","10","−90","90"],"a":1,"e":"100 ÷ 10 = 10 and the signs are the same.","v":"integer-division"},{"d":"MEDIUM","q":"A temperature change of −36°C is split equally over 4 hours. What is the change per hour?","o":["−9°C","9°C","−32°C","32°C"],"a":0,"e":"Divide −36 by 4 to find the equal hourly change.","v":"integer-division"},{"d":"MEDIUM","q":"Which quotient is positive?","o":["(−42) ÷ 7","24 ÷ (−6)","(−45) ÷ (−9)","(−16) ÷ 4"],"a":2,"e":"A quotient is positive when the dividend and divisor have the same sign.","v":"integer-division"},{"d":"MEDIUM","q":"What is (−84) ÷ 7 ÷ (−2), working from left to right?","o":["−6","6","−12","12"],"a":1,"e":"First −84 ÷ 7 = −12; then −12 ÷ −2 = 6.","v":"integer-division"},{"d":"MEDIUM","q":"If 63 ÷ x = −9, find x.","o":["−7","7","−6","6"],"a":1,"e":"63 ÷ 7 = 9, and a negative quotient requires a negative divisor? Check: 63 ÷ (−7) = −9.","v":"integer-division"},{"d":"MEDIUM","q":"What is (−120) ÷ 15?","o":["8","−8","−105","105"],"a":1,"e":"120 ÷ 15 = 8; the signs differ.","v":"integer-division"},{"d":"HARD","q":"Evaluate [ (−96) ÷ 12 ] ÷ (−2).","o":["−4","4","−8","8"],"a":1,"e":"First −96 ÷ 12 = −8; then −8 ÷ −2 = 4.","v":"integer-division"},{"d":"HARD","q":"Evaluate (−144) ÷ [ (−6) × 4 ].","o":["−6","6","−24","24"],"a":1,"e":"The denominator is −24, so (−144) ÷ (−24) = 6.","v":"integer-division"},{"d":"HARD","q":"If x ÷ 8 = −7, then x equals:","o":["−56","56","−15","15"],"a":0,"e":"Multiply both sides by 8 to get x = −56.","v":"integer-division"},{"d":"HARD","q":"A lift's signed change is −54 floors over 6 equal intervals. What is the change per interval?","o":["9 floors","−9 floors","−60 floors","60 floors"],"a":1,"e":"−54 ÷ 6 = −9 floors per interval.","v":"integer-division"},{"d":"HARD","q":"Which statement about integer division is always true when the divisor is non-zero?","o":["The quotient is always positive","Zero divided by the divisor is zero","Division is commutative","The quotient is always an integer"],"a":1,"e":"For any non-zero divisor, 0 divided by it equals 0.","v":"integer-division"},{"d":"HARD","q":"Evaluate 180 ÷ (−5) ÷ (−6).","o":["−6","6","−30","30"],"a":1,"e":"Work left to right: 180 ÷ −5 = −36, then −36 ÷ −6 = 6.","v":"integer-division"},{"d":"HARD","q":"If (−9) ÷ x = 3, what is x?","o":["−3","3","−27","27"],"a":0,"e":"Since −9 ÷ −3 = 3, the divisor is −3.","v":"integer-division"},{"d":"HARD","q":"Which pair of expressions both have value −12?","o":["72 ÷ (−6) and (−72) ÷ 6","(−72) ÷ (−6) and 72 ÷ 6","(−60) ÷ 5 and 60 ÷ 5","(−36) ÷ (−3) and 36 ÷ 3"],"a":0,"e":"Both 72 ÷ (−6) and (−72) ÷ 6 equal −12.","v":"integer-division"},{"d":"HARD","q":"A debt of ₹84 is represented by −84. If it is shared equally among 7 people, what is the signed amount per person?","o":["₹12","−₹12","−₹77","₹77"],"a":1,"e":"−84 ÷ 7 = −12, representing a debt of ₹12 each.","v":"integer-division"},{"d":"HARD","q":"Which equation is correct?","o":["(−63) ÷ (−7) = −9","63 ÷ (−7) = 9","(−63) ÷ 7 = −9","0 ÷ 0 = 0"],"a":2,"e":"−63 ÷ 7 = −9; division by zero, including 0 ÷ 0, is undefined.","v":"integer-division"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Multiply positive and negative integers</strong><small>Apply sign rules to integer products</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Solve multiplication word problems</strong><small>Reason with signs and products</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply ruler-and-compass reasoning</strong><small>Use accurate integer multiplication methods</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
