ce-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What is (−4) × 3?","o":["−12","−7","7","12"],"a":0,"e":"A negative times a positive is negative, and 4 × 3 = 12.","v":"integer-multiplication"},{"d":"BASIC","q":"What is (−6) × (−5)?","o":["−30","−11","11","30"],"a":3,"e":"A negative times a negative is positive; 6 × 5 = 30.","v":"integer-multiplication"},{"d":"BASIC","q":"What is 7 × (−8)?","o":["56","−56","−15","15"],"a":1,"e":"A positive times a negative is negative; 7 × 8 = 56.","v":"integer-multiplication"},{"d":"BASIC","q":"What is (−9) × 0?","o":["−9","0","9","1"],"a":1,"e":"Any number multiplied by zero equals zero.","v":"integer-multiplication"},{"d":"BASIC","q":"What is (−1) × 24?","o":["−24","−1","1","24"],"a":0,"e":"Multiplication by −1 changes the sign of 24.","v":"integer-multiplication"},{"d":"BASIC","q":"What is (−7) × (−4)?","o":["−28","−11","11","28"],"a":3,"e":"The product of two negative numbers is positive.","v":"integer-multiplication"},{"d":"BASIC","q":"Evaluate 12 × (−3).","o":["36","−36","−15","15"],"a":1,"e":"12 × 3 = 36, and the signs differ.","v":"integer-multiplication"},{"d":"BASIC","q":"Evaluate (−2) × (−2) × 5.","o":["−20","−10","10","20"],"a":3,"e":"(−2) × (−2) = 4, then 4 × 5 = 20.","v":"integer-multiplication"},{"d":"BASIC","q":"Which product is negative?","o":["(−3) × (−6)","5 × 4","(−7) × 2","(−8) × (−1)"],"a":2,"e":"A product with exactly one negative factor is negative.","v":"integer-multiplication"},{"d":"BASIC","q":"What is 1 × (−19)?","o":["19","−19","0","−1"],"a":1,"e":"Multiplication by 1 leaves the number unchanged.","v":"integer-multiplication"},{"d":"MEDIUM","q":"A submarine descends 4 metres each minute for 6 minutes. Represent its total change in height.","o":["+24 m","−24 m","+10 m","−10 m"],"a":1,"e":"A descent is negative: 6 × (−4) = −24 m.","v":"integer-multiplication"},{"d":"MEDIUM","q":"What is (−15) × 4?","o":["−60","−19","19","60"],"a":0,"e":"15 × 4 = 60 and the signs differ.","v":"integer-multiplication"},{"d":"MEDIUM","q":"What is (−12) × (−3)?","o":["−36","−15","15","36"],"a":3,"e":"Two negative factors produce a positive product.","v":"integer-multiplication"},{"d":"MEDIUM","q":"Evaluate 8 × (−6) × (−1).","o":["−48","−14","14","48"],"a":3,"e":"8 × (−6) = −48; multiplying by −1 gives 48.","v":"integer-multiplication"},{"d":"MEDIUM","q":"Which number multiplied by −7 gives 42?","o":["−6","−5","5","6"],"a":0,"e":"42 ÷ (−7) = −6.","v":"integer-multiplication"},{"d":"MEDIUM","q":"If x × (−4) = −28, what is x?","o":["−7","−3","3","7"],"a":3,"e":"Divide both sides by −4: x = 7.","v":"integer-multiplication"},{"d":"MEDIUM","q":"What is the sign of the product (−2) × (−3) × (−4)?","o":["Positive","Negative","Zero","Cannot be determined"],"a":1,"e":"Three negative factors give an odd number of negative signs, so the product is negative.","v":"integer-multiplication"},{"d":"MEDIUM","q":"What is (−5) × 6 + 8?","o":["−38","−22","22","38"],"a":1,"e":"First −5 × 6 = −30; then −30 + 8 = −22.","v":"integer-multiplication"},{"d":"MEDIUM","q":"A shop loses ₹12 each day for 5 days. Which integer represents the total change?","o":["+₹60","−₹60","+₹17","−₹17"],"a":1,"e":"Five daily losses of 12 give 5 × (−12) = −60.","v":"integer-multiplication"},{"d":"MEDIUM","q":"Evaluate (−11) × (−2) − 7.","o":["−29","−15","15","29"],"a":2,"e":"The product is 22, and 22 − 7 = 15.","v":"integer-multiplication"},{"d":"HARD","q":"What is (−13) × 3?","o":["−39","−16","16","39"],"a":0,"e":"13 × 3 = 39 and the signs differ.","v":"integer-multiplication"},{"d":"HARD","q":"Which equation is true?","o":["(−4) × 5 = 20","(−4) × (−5) = 20","4 × (−5) = 20","(−4) × 0 = −4"],"a":1,"e":"Two negative factors give a positive product: 4 × 5 = 20.","v":"integer-multiplication"},{"d":"HARD","q":"If 9 × x = −81, find x.","o":["−9","−8","8","9"],"a":0,"e":"−81 ÷ 9 = −9.","v":"integer-multiplication"},{"d":"HARD","q":"Evaluate (−3) × (−4) × (−2).","o":["−24","−12","12","24"],"a":0,"e":"The first two factors give 12, then 12 × −2 = −24.","v":"integer-multiplication"},{"d":"HARD","q":"What is the product of the integers −1, −2, −3 and −4?","o":["−24","−10","10","24"],"a":3,"e":"Four negative factors give a positive result; 1 × 2 × 3 × 4 = 24.","v":"integer-multiplication"},{"d":"HARD","q":"A lift changes height by −3 floors per trip. After 7 such trips, what is the total change?","o":["−21 floors","−10 floors","10 floors","21 floors"],"a":0,"e":"7 × (−3) = −21 floors.","v":"integer-multiplication"},{"d":"HARD","q":"Which statement about integer multiplication is correct?","o":["A negative times a positive is positive","A negative times a negative is positive","Any product with a negative factor is negative","Multiplying by zero keeps the number unchanged"],"a":1,"e":"Two negative factors multiply to a positive result.","v":"integer-multiplication"},{"d":"HARD","q":"Evaluate 25 × (−4) × (−1).","o":["−100","−29","29","100"],"a":3,"e":"25 × −4 = −100; multiplying by −1 gives 100.","v":"integer-multiplication"},{"d":"HARD","q":"If (−6) × x = 54, what is x?","o":["−9","−8","8","9"],"a":0,"e":"54 ÷ −6 = −9.","v":"integer-multiplication"},{"d":"HARD","q":"The temperature drops 2°C each hour for 9 hours. What integer represents the total change?","o":["+18°C","−18°C","+11°C","−11°C"],"a":1,"e":"Nine drops of 2°C give 9 × (−2) = −18°C.","v":"integer-multiplication"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Multiply positive and negative integers</strong><small>Apply sign rules to integer products</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Solve multiplication word problems</strong><small>Reason with signs and products</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply ruler-and-compass reasoning</strong><small>Use accurate integer multiplication methods</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>\n<script src="/shared-nav.js?v=20261013-universal-nav-v1"></script>\n</body></html>
