(function(){'use strict';const questions=[{"d":"BASIC","q":"Which property is shown by 7 + (−3) = (−3) + 7?","o":["Commutative property of addition","Associative property of addition","Distributive property","Additive identity"],"a":0,"e":"The addends switch places while the sum remains unchanged.","v":"integer-properties"},{"d":"BASIC","q":"Which property is shown by (−4) × 6 = 6 × (−4)?","o":["Associative property","Commutative property of multiplication","Distributive property","Multiplicative identity"],"a":1,"e":"The factors change order without changing the product.","v":"integer-properties"},{"d":"BASIC","q":"Which statement shows that subtraction is not commutative?","o":["8 + 2 = 2 + 8","(−3) × 5 = 5 × (−3)","9 − 4 ≠ 4 − 9","(2 + 3) + 4 = 2 + (3 + 4)"],"a":2,"e":"9 − 4 = 5, whereas 4 − 9 = −5.","v":"integer-properties"},{"d":"BASIC","q":"What is the additive identity for integers?","o":["−1","0","1","10"],"a":1,"e":"Adding zero leaves any integer unchanged.","v":"integer-properties"},{"d":"BASIC","q":"What is the multiplicative identity for integers?","o":["−1","0","1","2"],"a":2,"e":"Multiplying any integer by 1 leaves it unchanged.","v":"integer-properties"},{"d":"BASIC","q":"Which expression uses the associative property of addition?","o":["a + b = b + a","(a + b) + c = a + (b + c)","a(b + c) = ab + ac","a + 0 = a"],"a":1,"e":"Associativity changes grouping, not the order of the addends.","v":"integer-properties"},{"d":"BASIC","q":"Which expression shows the distributive property?","o":["a + b = b + a","a × 1 = a","a(b + c) = ab + ac","a + 0 = a"],"a":2,"e":"Multiplication distributes across the sum inside the brackets.","v":"integer-properties"},{"d":"BASIC","q":"What is the additive inverse of −13?","o":["−13","0","13","1"],"a":2,"e":"The additive inverse combines with −13 to give zero.","v":"integer-properties"},{"d":"BASIC","q":"Evaluate (−8) + 0.","o":["0","−8","8","−1"],"a":1,"e":"Zero is the additive identity, so the integer stays −8.","v":"integer-properties"},{"d":"BASIC","q":"Evaluate (−6) × 1.","o":["6","−1","0","−6"],"a":3,"e":"One is the multiplicative identity.","v":"integer-properties"},{"d":"MEDIUM","q":"Evaluate (−5) × [3 + (−2)] using the distributive property.","o":["−5","5","−25","25"],"a":0,"e":"Distribute: (−5 × 3) + (−5 × −2) = −15 + 10 = −5.","v":"integer-properties"},{"d":"MEDIUM","q":"Which equation demonstrates that multiplication is associative?","o":["(−2 × 3) × 4 = −2 × (3 × 4)","−2 × 3 = 3 × 2","−2 + 0 = −2","−2 × (3 + 4) = −6 + 4"],"a":0,"e":"Both groupings multiply the same three factors and give −24.","v":"integer-properties"},{"d":"MEDIUM","q":"Which statement is true for all integers a and b?","o":["a − b = b − a","a ÷ b = b ÷ a for all b","a + b = b + a","a × 0 = a"],"a":2,"e":"Integer addition is commutative.","v":"integer-properties"},{"d":"MEDIUM","q":"Simplify 7 × (−12) + 7 × 2 by factoring out 7.","o":["7 × (−10) = −70","7 × (−14) = −98","7 × 10 = 70","−84 + 2 = −82"],"a":0,"e":"The distributive property gives 7 × [−12 + 2] = 7 × (−10) = −70.","v":"integer-properties"},{"d":"MEDIUM","q":"Which equation uses the additive inverse property?","o":["(−9) + 9 = 0","(−9) × 9 = 0","(−9) + 1 = −8","(−9) × 1 = −9"],"a":0,"e":"A number and its opposite add to zero.","v":"integer-properties"},{"d":"MEDIUM","q":"What is the value of (−7) × [4 + (−4)]?","o":["−56","56","0","−7"],"a":2,"e":"The bracket equals zero, and any integer multiplied by zero is zero.","v":"integer-properties"},{"d":"MEDIUM","q":"Which operation is commutative over integers?","o":["Subtraction only","Division only","Addition and multiplication","Subtraction and division"],"a":2,"e":"For integers, changing the order of addends or factors does not change the result.","v":"integer-properties"},{"d":"MEDIUM","q":"Evaluate [−10 + 6] + 9 using a convenient grouping.","o":["−13","5","−5","13"],"a":1,"e":"Regrouping gives −10 + (6 + 9) = −10 + 15 = 5.","v":"integer-properties"},{"d":"MEDIUM","q":"Which expression is equal to (−3) × 8 + (−3) × 2?","o":["(−3) × 10 = −30","(−3) × 6 = −18","−3 × 8 + 2 = −22","−3 × 16 = −48"],"a":0,"e":"Factor out −3: (−3) × (8 + 2) = −30.","v":"integer-properties"},{"d":"MEDIUM","q":"Is division associative for integers when all displayed divisions are defined: (24 ÷ 6) ÷ 2 and 24 ÷ (6 ÷ 2)?","o":["Yes; both equal 2","No; they equal 2 and 8","Yes; both equal 8","No; they equal 4 and 2"],"a":1,"e":"(24 ÷ 6) ÷ 2 = 4 ÷ 2 = 2, while 24 ÷ (6 ÷ 2) = 24 ÷ 3 = 8.","v":"integer-properties"},{"d":"HARD","q":"Simplify (−8) × 17 + (−8) × 3 using a property.","o":["−8 × 20 = −160","−8 × 14 = −112","−8 × 51 = −408","−136 + 3 = −133"],"a":0,"e":"Factor out −8: (−8) × (17 + 3) = (−8) × 20 = −160.","v":"integer-properties"},{"d":"HARD","q":"Which statement correctly applies distributivity to 6 × (−5 + 2)?","o":["6 × (−5) + 6 × 2 = −18","6 × (−5) + 2 = −28","6 + (−5) × 2 = −4","6 × (−5) × 2 = 60"],"a":0,"e":"Distributing gives −30 + 12 = −18.","v":"integer-properties"},{"d":"HARD","q":"Which is the correct regrouping of (−12 + 7) + 3?","o":["−12 + (7 + 3) = −2","(−12 + 7) × 3 = −15","−12 × (7 + 3) = −120","−12 + 7 − 3 = −8"],"a":0,"e":"Associativity allows regrouping: −12 + 10 = −2.","v":"integer-properties"},{"d":"HARD","q":"Which statement about zero is correct?","o":["a ÷ 0 = 0 for every integer a","0 ÷ a = 0 when a ≠ 0","a + 0 = 0 for every integer a","a × 0 = a for every integer a"],"a":1,"e":"Zero divided by a non-zero integer is zero; division by zero is undefined.","v":"integer-properties"},{"d":"HARD","q":"If x + (−18) = 0, what is x?","o":["−18","0","18","36"],"a":2,"e":"The additive inverse of −18 is 18.","v":"integer-properties"},{"d":"HARD","q":"Evaluate (−4) × 25 + (−4) × (−5) by factoring.","o":["−4 × 20 = −80","−4 × 30 = −120","−100 − 20 = −120","−4 × 125 = −500"],"a":0,"e":"Factor out −4: (−4) × [25 + (−5)] = (−4) × 20 = −80.","v":"integer-properties"},{"d":"HARD","q":"Which equation is NOT generally true for integers?","o":["a + b = b + a","a × b = b × a","a − b = b − a","(a + b) + c = a + (b + c)"],"a":2,"e":"Subtraction is not commutative; for example, 5 − 2 = 3 but 2 − 5 = −3.","v":"integer-properties"},{"d":"HARD","q":"Use distributivity to evaluate 13 × (−9) + 13 × 4.","o":["13 × (−5) = −65","13 × (−13) = −169","−117 + 4 = −113","13 × 36 = 468"],"a":0,"e":"Factor 13: 13 × [−9 + 4] = 13 × (−5) = −65.","v":"integer-properties"},{"d":"HARD","q":"Which pair has equal values by the associative property of multiplication?","o":["[(−2) × 5] × 3 and (−2) × [5 × 3]","(−2) × 5 and 5 × 2","(−2) − 5 and 5 − (−2)","(−2) ÷ 5 and 5 ÷ (−2)"],"a":0,"e":"Both groupings equal −30 because only the grouping changes.","v":"integer-properties"},{"d":"HARD","q":"For integers a and b, which identity is always valid?","o":["a × (b + 0) = a × b","a ÷ b = b ÷ a","a − 0 = 0","a + (−a) = 1"],"a":0,"e":"Since b + 0 = b, multiplying by a gives a × b.","v":"integer-properties"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Commutative and associative properties</strong><small>Recognise changes in order and grouping</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Distributive property</strong><small>Expand brackets and factor common terms</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Identity and inverse properties</strong><small>Use zero, one, and additive inverses correctly</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
