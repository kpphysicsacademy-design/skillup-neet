<style>

ce-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What is 8 − 13?","o":["21","5","−5","−21"],"a":2,"e":"Subtracting 13 from 8 gives −5.","v":"integer-subtraction"},{"d":"BASIC","q":"What is −4 − 6?","o":["−10","−2","2","10"],"a":0,"e":"Starting at −4 and moving 6 more units left gives −10.","v":"integer-subtraction"},{"d":"BASIC","q":"What is −7 − (−3)?","o":["−10","−4","4","10"],"a":1,"e":"Subtracting −3 is equivalent to adding 3: −7 + 3 = −4.","v":"integer-subtraction"},{"d":"BASIC","q":"What is 12 − (−5)?","o":["7","−7","17","−17"],"a":2,"e":"Subtracting a negative is equivalent to adding its positive: 12 + 5 = 17.","v":"integer-subtraction"},{"d":"BASIC","q":"What is −15 − 4?","o":["−19","−11","11","19"],"a":0,"e":"Subtracting 4 from −15 gives −19.","v":"integer-subtraction"},{"d":"BASIC","q":"What is 0 − (−9)?","o":["−9","0","9","−18"],"a":2,"e":"Subtracting −9 is the same as adding 9.","v":"integer-subtraction"},{"d":"BASIC","q":"Evaluate 6 − 14.","o":["20","8","−8","−20"],"a":2,"e":"6 − 14 = −8 because 14 is 8 greater than 6.","v":"integer-subtraction"},{"d":"BASIC","q":"Evaluate −11 − (−11).","o":["−22","−11","0","22"],"a":2,"e":"−11 + 11 = 0.","v":"integer-subtraction"},{"d":"BASIC","q":"What is 25 − (−7)?","o":["18","−18","32","−32"],"a":2,"e":"Subtracting a negative gives 25 + 7 = 32.","v":"integer-subtraction"},{"d":"BASIC","q":"What is −3 − 9?","o":["−12","−6","6","12"],"a":0,"e":"Moving 9 units left from −3 gives −12.","v":"integer-subtraction"},{"d":"MEDIUM","q":"The temperature is 4°C and drops by 10°C. What is the new temperature?","o":["14°C","6°C","−6°C","−14°C"],"a":2,"e":"A drop of 10 means 4 − 10 = −6°C.","v":"integer-subtraction"},{"d":"MEDIUM","q":"A diver is at −8 m and descends another 5 m. What is the new position?","o":["−13 m","−3 m","3 m","13 m"],"a":0,"e":"Descending moves farther below zero: −8 − 5 = −13 m.","v":"integer-subtraction"},{"d":"MEDIUM","q":"Which expression equals 7?","o":["−2 − 5","−2 − (−9)","2 − 9","−7 − 0"],"a":1,"e":"−2 − (−9) = −2 + 9 = 7.","v":"integer-subtraction"},{"d":"MEDIUM","q":"Evaluate −20 − (−6).","o":["−26","−14","14","26"],"a":1,"e":"Subtracting −6 means add 6: −20 + 6 = −14.","v":"integer-subtraction"},{"d":"MEDIUM","q":"What number results from 3 − 18?","o":["21","15","−15","−21"],"a":2,"e":"18 − 3 = 15 and the result is negative.","v":"integer-subtraction"},{"d":"MEDIUM","q":"Find x if x − 7 = −2.","o":["−9","−5","5","9"],"a":2,"e":"Adding 7 to both sides gives x = 5.","v":"integer-subtraction"},{"d":"MEDIUM","q":"A bank balance is ₹30. A charge of ₹45 is deducted. What is the balance?","o":["₹75","₹15","−₹15","−₹75"],"a":2,"e":"30 − 45 = −15 rupees.","v":"integer-subtraction"},{"d":"MEDIUM","q":"Evaluate −9 − (−4) − 2.","o":["−15","−7","−3","3"],"a":1,"e":"−9 + 4 − 2 = −5 − 2 = −7.","v":"integer-subtraction"},{"d":"MEDIUM","q":"Which is greater?","o":["−6 − 2","−6 − (−2)","They are equal","Cannot be determined"],"a":1,"e":"−6 − (−2) = −4, which is greater than −8.","v":"integer-subtraction"},{"d":"MEDIUM","q":"Evaluate 14 − (−3) − 20.","o":["−9","−3","3","37"],"a":1,"e":"14 + 3 − 20 = 17 − 20 = −3.","v":"integer-subtraction"},{"d":"HARD","q":"If x − (−8) = 2, what is x?","o":["−10","−6","6","10"],"a":1,"e":"x + 8 = 2, so x = −6.","v":"integer-subtraction"},{"d":"HARD","q":"Which expression has value −1?","o":["−5 − (−4)","−5 − 4","5 − (−4)","−1 − (−1)"],"a":0,"e":"−5 + 4 = −1.","v":"integer-subtraction"},{"d":"HARD","q":"A lift is on floor 3 and moves down 7 floors. Which floor does it reach?","o":["10","4","−4","−10"],"a":2,"e":"3 − 7 = −4.","v":"integer-subtraction"},{"d":"HARD","q":"Evaluate −32 − (−18).","o":["−50","−14","14","50"],"a":1,"e":"−32 + 18 = −14.","v":"integer-subtraction"},{"d":"HARD","q":"What must be subtracted from 9 to get −4?","o":["−13","−5","5","13"],"a":3,"e":"9 − x = −4 gives x = 13.","v":"integer-subtraction"},{"d":"HARD","q":"Evaluate −16 − 7 + 10.","o":["−33","−13","−3","3"],"a":1,"e":"−16 − 7 = −23; then −23 + 10 = −13.","v":"integer-subtraction"},{"d":"HARD","q":"The temperature changes from −3°C to −11°C. What is the change (final minus initial)?","o":["−14°C","−8°C","8°C","14°C"],"a":1,"e":"−11 − (−3) = −11 + 3 = −8°C.","v":"integer-subtraction"},{"d":"HARD","q":"Evaluate 40 − (−12) − 60.","o":["−32","−8","8","112"],"a":0,"e":"40 + 12 − 60 = 52 − 60 = −8.","v":"integer-subtraction"},{"d":"HARD","q":"If a − 5 = −17, what is a?","o":["−22","−12","12","22"],"a":1,"e":"Add 5 to both sides: a = −12.","v":"integer-subtraction"},{"d":"HARD","q":"A hiker is at 6 m and descends 15 m relative to the starting reference. What is the final position?","o":["21 m","9 m","−9 m","−21 m"],"a":2,"e":"6 − 15 = −9 m.","v":"integer-subtraction"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Subtract positive and negative integers</strong><small>Apply subtraction of signed integers</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Solve integer subtraction word problems</strong><small>Reason with signs and integer differences</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply ruler-and-compass reasoning</strong><small>Use accurate integer subtraction methods</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
