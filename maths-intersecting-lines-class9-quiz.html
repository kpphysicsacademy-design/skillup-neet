<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"When two straight lines intersect, how many angles are formed?","o":["2","3","4","6"],"a":2,"why":"Two intersecting lines form four angles."},{"d":"BASIC","q":"Vertically opposite angles are always:","o":["Equal","Supplementary","Complementary","Unequal"],"a":0,"why":"Vertically opposite angles are equal."},{"d":"BASIC","q":"Adjacent angles share:","o":["Only a vertex","A common vertex and arm","No common point","Two arms"],"a":1,"why":"Adjacent angles share a vertex and one arm."},{"d":"BASIC","q":"A linear pair always adds up to:","o":["90°","120°","180°","360°"],"a":2,"why":"A linear pair forms a straight angle of 180°."},{"d":"BASIC","q":"If one angle is 48°, its vertically opposite angle is:","o":["42°","48°","132°","142°"],"a":1,"why":"Vertically opposite angles are equal."},{"d":"BASIC","q":"If one angle in a linear pair is 110°, the other is:","o":["60°","70°","80°","110°"],"a":1,"why":"180°−110°=70°."},{"d":"BASIC","q":"Two lines that meet at one point are:","o":["Parallel","Intersecting","Curved","Perpendicular only"],"a":1,"why":"Intersecting lines meet at a common point."},{"d":"BASIC","q":"Perpendicular lines form:","o":["Four acute angles","Four obtuse angles","Four right angles","Two right angles"],"a":2,"why":"Perpendicular lines meet at 90°."},{"d":"BASIC","q":"Adjacent angles whose non-common arms form a straight line are:","o":["A linear pair","Vertically opposite","Complementary","Reflex"],"a":0,"why":"This is the definition of a linear pair."},{"d":"BASIC","q":"The common endpoint of the arms of an angle is its:","o":["Arm","Side","Vertex","Midpoint"],"a":2,"why":"The common endpoint is called the vertex."},{"d":"MEDIUM","q":"Vertically opposite angles are (3x+15)° and (5x−25)°. Find x.","o":["15","20","25","30"],"a":1,"why":"3x+15=5x−25, so x=20."},{"d":"MEDIUM","q":"A linear pair is (2x+10)° and (4x−10)°. Find x.","o":["20","25","30","35"],"a":2,"why":"Their sum is 180°: 6x=180, so x=30."},{"d":"MEDIUM","q":"One angle is 3 times its adjacent angle. Find the smaller angle.","o":["30°","45°","60°","90°"],"a":1,"why":"x+3x=180°, so x=45°."},{"d":"MEDIUM","q":"One angle is 76°. What is the largest angle at the intersection?","o":["76°","104°","114°","180°"],"a":1,"why":"Adjacent angle=180°−76°=104°."},{"d":"MEDIUM","q":"Equal adjacent angles forming a linear pair are each:","o":["45°","60°","90°","180°"],"a":2,"why":"Each is 180°/2=90°."},{"d":"MEDIUM","q":"An angle is 20° more than its adjacent angle. Find the larger angle.","o":["80°","90°","100°","110°"],"a":2,"why":"x+(x+20)=180; larger angle=100°."},{"d":"MEDIUM","q":"Vertically opposite angles are (7x−12)° and (5x+18)°. Find their measure.","o":["83°","93°","103°","113°"],"a":1,"why":"7x−12=5x+18 gives x=15; angle=93°."},{"d":"MEDIUM","q":"One angle is 125°. The other three angles are:","o":["125°,55°,55°","55°,125°,55°","125°,125°,55°","35°,125°,35°"],"a":0,"why":"Opposite angle=125°; adjacent angles=55° each."},{"d":"MEDIUM","q":"Adjacent angles are (x+30)° and 2x°. Find the smaller angle.","o":["70°","80°","90°","100°"],"a":1,"why":"3x+30=180 gives x=50; smaller angle=80°."},{"d":"MEDIUM","q":"If two lines intersect at right angles, each angle is:","o":["45°","60°","90°","180°"],"a":2,"why":"Perpendicular lines form four 90° angles."},{"d":"HARD","q":"Vertically opposite angles are (4x+8)° and (6x−22)°. Find x and angle.","o":["x=12, 56°","x=15, 68°","x=18, 80°","x=20, 88°"],"a":1,"why":"Equating gives x=15 and angle=68°."},{"d":"HARD","q":"An angle is 4 times its adjacent angle. Find the larger angle.","o":["120°","135°","144°","150°"],"a":2,"why":"5x=180 gives x=36; larger=144°."},{"d":"HARD","q":"Adjacent angles (3x−5)° and (2x+10)° form a straight angle. Find larger.","o":["95°","100°","105°","110°"],"a":1,"why":"5x+5=180 gives x=35; angles 100° and 80°."},{"d":"HARD","q":"Angles (5x−20)° and (3x+40)° are adjacent in a linear pair. Find x.","o":["15","20","25","30"],"a":1,"why":"8x+20=180 gives x=20."},{"d":"HARD","q":"An angle is 2x° and its vertically opposite angle is (x+30)°. Find the angle.","o":["30°","45°","60°","90°"],"a":2,"why":"2x=x+30 gives x=30; angle=60°."},{"d":"HARD","q":"The difference between adjacent angles in a linear pair is 36°. Find the larger.","o":["98°","108°","118°","126°"],"a":1,"why":"Solving sum 180 and difference 36 gives 108°."},{"d":"HARD","q":"Vertically opposite angles are (8x−15)° and (5x+30)°. Find x.","o":["10","12","15","18"],"a":2,"why":"8x−15=5x+30 gives x=15."},{"d":"HARD","q":"Adjacent angles are in ratio 4:5 and form a linear pair. Find larger.","o":["80°","90°","100°","110°"],"a":2,"why":"Nine parts=180°, so larger=5×20°=100°."},{"d":"HARD","q":"One angle is 30° less than its vertically opposite angle. What follows?","o":["Angle is 15°","Angle is 30°","Angle is 75°","Impossible"],"a":3,"why":"Vertically opposite angles must be equal."},{"d":"HARD","q":"Adjacent angles are (2x+10)° and (4x−10)°. Find smaller.","o":["60°","70°","80°","90°"],"a":1,"why":"Their sum is 180°; x=30 and smaller angle=70°."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Intersecting Lines Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
