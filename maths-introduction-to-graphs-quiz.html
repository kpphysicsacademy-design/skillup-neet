<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"In the ordered pair (3, 5), what does the first number represent?","o":["The x-coordinate","The y-coordinate","The distance from origin","The quadrant number"],"a":0,"e":"An ordered pair is written (x, y). The first value, 3, is the x-coordinate."},{"d":"BASIC","q":"In which quadrant does the point (4, 2) lie?","o":["Quadrant I","Quadrant II","Quadrant III","Quadrant IV"],"a":0,"e":"Both coordinates are positive, so (4, 2) lies in Quadrant I."},{"d":"BASIC","q":"What is the y-coordinate of the point (−3, 7)?","o":["−3","7","3","−7"],"a":1,"e":"In (x, y), the second value is the y-coordinate, which is 7."},{"d":"BASIC","q":"Which point lies on the x-axis?","o":["(0, 5)","(−2, 0)","(3, 4)","(1, −1)"],"a":1,"e":"Every point on the x-axis has y-coordinate 0; (−2, 0) meets this condition."},{"d":"BASIC","q":"Which point lies on the y-axis?","o":["(6, 0)","(0, −4)","(2, 3)","(−5, 1)"],"a":1,"e":"Every point on the y-axis has x-coordinate 0, as in (0, −4)."},{"d":"BASIC","q":"What are the coordinates of the origin?","o":["(1, 1)","(0, 1)","(0, 0)","(1, 0)"],"a":2,"e":"The x-axis and y-axis intersect at the origin (0, 0)."},{"d":"BASIC","q":"In which quadrant does (−5, 3) lie?","o":["Quadrant I","Quadrant II","Quadrant III","Quadrant IV"],"a":1,"e":"A negative x-coordinate and positive y-coordinate place the point in Quadrant II."},{"d":"BASIC","q":"Which ordered pair has x = 2 and y = −6?","o":["(−6, 2)","(2, −6)","(6, −2)","(−2, 6)"],"a":1,"e":"Ordered pairs are written (x, y), so the pair is (2, −6)."},{"d":"BASIC","q":"A point is 4 units to the right of the origin and 3 units up. What are its coordinates?","o":["(−4, 3)","(4, 3)","(3, 4)","(4, −3)"],"a":1,"e":"Right means positive x and up means positive y, giving (4, 3)."},{"d":"BASIC","q":"Which point is in Quadrant IV?","o":["(−2, 4)","(2, 4)","(−2, −4)","(2, −4)"],"a":3,"e":"Quadrant IV has positive x-coordinates and negative y-coordinates."},{"d":"MEDIUM","q":"A point moves from (−1, 2) three units right and two units down. What is the new point?","o":["(2, 0)","(−4, 4)","(2, 4)","(−3, 0)"],"a":0,"e":"Add 3 to x: −1 + 3 = 2. Subtract 2 from y: 2 − 2 = 0. New point: (2, 0)."},{"d":"MEDIUM","q":"Which point is 5 units from the y-axis and 2 units below the x-axis in Quadrant IV?","o":["(5, −2)","(−5, −2)","(2, −5)","(−2, 5)"],"a":0,"e":"Distance from the y-axis gives |x| = 5; Quadrant IV means x is positive and y negative. The specified y-distance is 2, so (5, −2)."},{"d":"MEDIUM","q":"If the point (a, −3) lies on the y-axis, what is a?","o":["−3","0","3","1"],"a":1,"e":"A point on the y-axis has x-coordinate 0, so a = 0."},{"d":"MEDIUM","q":"The point (−4, b) lies in Quadrant III. Which condition must b satisfy?","o":["b > 0","b = 0","b < 0","b = −4"],"a":2,"e":"Quadrant III contains points with both coordinates negative. Since x is already −4, b must be negative."},{"d":"MEDIUM","q":"A library is at (2, 5) and a park at (2, −1). Which statement is correct?","o":["They have the same x-coordinate","They have the same y-coordinate","Both are on the x-axis","They are in the same quadrant"],"a":0,"e":"Both ordered pairs begin with 2, so they share the same x-coordinate and lie on the same vertical line."},{"d":"MEDIUM","q":"Which point is closest to the x-axis?","o":["(2, 5)","(−1, 2)","(4, −3)","(0, 6)"],"a":1,"e":"Distance to the x-axis is the absolute value of y. The distances are 5, 2, 3 and 6; the smallest is 2."},{"d":"MEDIUM","q":"A point has coordinates (−3, −6). Reflecting it across the x-axis gives which point?","o":["(3, −6)","(−3, 6)","(3, 6)","(−6, −3)"],"a":1,"e":"Reflection across the x-axis keeps x the same and changes the sign of y: (−3, 6)."},{"d":"MEDIUM","q":"Which pair of points lies on a horizontal line?","o":["(1, 2) and (1, 5)","(−2, 4) and (3, 4)","(0, 0) and (0, 3)","(2, −1) and (4, 3)"],"a":1,"e":"Points on a horizontal line have the same y-coordinate. Both listed points have y = 4."},{"d":"MEDIUM","q":"A point has x-coordinate 0 and y-coordinate 8. Where is it located?","o":["On the x-axis","On the y-axis","At the origin","In Quadrant II"],"a":1,"e":"When x = 0, the point lies on the y-axis; (0, 8) is not the origin."},{"d":"MEDIUM","q":"What is the reflection of (4, −7) across the y-axis?","o":["(−4, −7)","(4, 7)","(−4, 7)","(7, −4)"],"a":0,"e":"Reflection across the y-axis changes the sign of x but keeps y unchanged, giving (−4, −7)."},{"d":"HARD","q":"A point (x, y) lies in Quadrant II and is 6 units from the y-axis and 4 units from the x-axis. What are its coordinates?","o":["(−6, 4)","(6, 4)","(−4, 6)","(6, −4)"],"a":0,"e":"Distance from the y-axis gives |x| = 6 and from the x-axis gives |y| = 4. Quadrant II has x negative and y positive: (−6, 4)."},{"d":"HARD","q":"Point A is (−2, 3). Move A 5 units left and 4 units down. What are the new coordinates?","o":["(3, −1)","(−7, −1)","(−7, 7)","(−3, −1)"],"a":1,"e":"Moving left subtracts 5 from x: −2 − 5 = −7. Moving down subtracts 4 from y: 3 − 4 = −1."},{"d":"HARD","q":"Which point is equally distant from both coordinate axes and lies in Quadrant III?","o":["(3, −3)","(−4, −4)","(−2, 5)","(5, 5)"],"a":1,"e":"Equal distances from both axes mean |x| = |y|. Quadrant III requires both negative; (−4, −4) satisfies both."},{"d":"HARD","q":"The point P is (a, 2a), and P lies in Quadrant IV. Which condition on a is required?","o":["a > 0","a < 0","a = 0","a = 2"],"a":1,"e":"Quadrant IV requires x positive and y negative. Here x = a and y = 2a, which always have the same sign, so no value of a places P in Quadrant IV."},{"d":"HARD","q":"Which point is the reflection of (−5, 2) in both axes, applied successively?","o":["(5, −2)","(−5, −2)","(5, 2)","(−2, 5)"],"a":0,"e":"Reflecting across both axes changes the signs of both coordinates: (−5, 2) becomes (5, −2)."},{"d":"HARD","q":"A point lies on the line x = −3 and is 5 units from the x-axis. Which option lists all possible points?","o":["(−3, 5) only","(−3, −5) only","(−3, 5) and (−3, −5)","(3, 5) and (3, −5)"],"a":2,"e":"The line fixes x = −3. Being 5 units from the x-axis means |y| = 5, so y can be 5 or −5."},{"d":"HARD","q":"A point (x, y) is reflected across the x-axis and becomes (−4, 7). What was the original point?","o":["(−4, −7)","(4, 7)","(4, −7)","(−4, 7)"],"a":0,"e":"Reflection across the x-axis preserves x and reverses y. Reversing the transformation gives original point (−4, −7)."},{"d":"HARD","q":"Three vertices of a rectangle are (1, 2), (1, 6), and (5, 2). What is the fourth vertex?","o":["(5, 6)","(6, 5)","(−5, 6)","(5, −6)"],"a":0,"e":"The rectangle's vertical side keeps x = 1 or 5 and its horizontal side keeps y = 2 or 6. The missing corner is (5, 6)."},{"d":"HARD","q":"Which statement about the point (0, −9) is true?","o":["It lies in Quadrant III","It lies on the negative y-axis","It lies on the negative x-axis","It is the origin"],"a":1,"e":"Its x-coordinate is zero and its y-coordinate is negative, so it lies on the negative y-axis."},{"d":"HARD","q":"A point is reflected across the y-axis and then translated 2 units up. Starting from (−3, −1), where does it end?","o":["(3, 1)","(3, −1)","(−3, 1)","(−1, 3)"],"a":0,"e":"Reflect across the y-axis: (−3, −1) → (3, −1). Move up 2: (3, 1)."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand direct proportion and constant ratios</strong><small>Find unit rates and proportional values</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Solve ratio-based word problems</strong><small>Scale quantities at a constant rate</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve direct proportion problems</strong><small>Apply direct proportion accurately</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
