<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261015-class8-inverse-proportion-v1"><title>Inverse Proportion | Class 8 Maths | SkillUp</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Inverse Proportion</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"If 4 workers finish a job in 12 days, how many days will 8 workers take at the same rate?","o":["3","6","8","24"],"a":1,"e":"Workers and days are inversely proportional: 4 × 12 = 8 × d, so d = 6.","v":"inverse-proportion"},{"d":"BASIC","q":"A car takes 3 hours at 60 km/h to cover a route. How long at 90 km/h for the same distance?","o":["1 hour","2 hours","2.5 hours","4.5 hours"],"a":1,"e":"For fixed distance, speed × time is constant: 60 × 3 = 90 × t, so t = 2 hours.","v":"inverse-proportion"},{"d":"BASIC","q":"Six taps fill a tank in 20 minutes. How long would 4 identical taps take?","o":["10 min","20 min","30 min","40 min"],"a":2,"e":"Taps × time is constant: 6 × 20 = 4 × t, so t = 30 minutes.","v":"inverse-proportion"},{"d":"BASIC","q":"Twelve workers complete a task in 15 days. How many days would 20 workers take?","o":["6","9","12","25"],"a":1,"e":"12 × 15 = 20 × d, so d = 9 days.","v":"inverse-proportion"},{"d":"BASIC","q":"Which pair is inversely proportional for a fixed task?","o":["Number of items and total cost at fixed price","Speed and time for a fixed distance","Hours worked and wages at fixed hourly rate","Number of people and total food needed"],"a":1,"e":"For fixed distance, increasing speed decreases time in the same inverse ratio.","v":"inverse-proportion"},{"d":"BASIC","q":"If 5 machines make a batch in 18 hours, how long would 6 identical machines take?","o":["12 h","15 h","18 h","21.6 h"],"a":1,"e":"Machines × time = constant: 5 × 18 = 6 × t, so t = 15 hours.","v":"inverse-proportion"},{"d":"BASIC","q":"Eight people share enough food for 15 days. If 12 people share it equally, how many days will it last?","o":["8 days","10 days","12 days","22.5 days"],"a":1,"e":"People × days is constant: 8 × 15 = 12 × d, so d = 10 days.","v":"inverse-proportion"},{"d":"BASIC","q":"A journey takes 5 hours at 48 km/h. How long at 60 km/h for the same journey?","o":["3 h","4 h","5 h","6.25 h"],"a":1,"e":"Distance is 48 × 5 = 240 km; time at 60 km/h is 240/60 = 4 hours.","v":"inverse-proportion"},{"d":"BASIC","q":"Ten identical pumps empty a pool in 6 hours. How long would 15 pumps take?","o":["2 h","3 h","4 h","9 h"],"a":2,"e":"10 × 6 = 15 × t, so t = 4 hours.","v":"inverse-proportion"},{"d":"BASIC","q":"If 9 workers build a wall in 16 days, how long would 12 workers take?","o":["9 days","12 days","14 days","21 days"],"a":1,"e":"9 × 16 = 12 × d, so d = 12 days.","v":"inverse-proportion"},{"d":"MEDIUM","q":"A cyclist needs 4 hours at 15 km/h for a route. At 20 km/h, how long will the route take?","o":["2 h","3 h","4 h","5 h"],"a":1,"e":"The route is 15 × 4 = 60 km; 60/20 = 3 hours.","v":"inverse-proportion"},{"d":"MEDIUM","q":"Four identical printers complete a job in 30 minutes. How long would 10 printers take?","o":["8 min","12 min","15 min","20 min"],"a":1,"e":"4 × 30 = 10 × t, giving t = 12 minutes.","v":"inverse-proportion"},{"d":"MEDIUM","q":"If 18 workers can complete a job in 20 days, how many workers are needed to finish in 12 days?","o":["24","28","30","36"],"a":2,"e":"Workers × days = 18 × 20 = 360; 360/12 = 30 workers.","v":"inverse-proportion"},{"d":"MEDIUM","q":"A supply of grain lasts 24 days for 25 people. How long will it last for 30 people?","o":["18 days","20 days","22 days","28.8 days"],"a":1,"e":"People × days = 25 × 24 = 600; 600/30 = 20 days.","v":"inverse-proportion"},{"d":"MEDIUM","q":"If 3 hoses fill a tank in 40 minutes, how long do 5 identical hoses take?","o":["20 min","24 min","30 min","60 min"],"a":1,"e":"3 × 40 = 5 × t, so t = 24 minutes.","v":"inverse-proportion"},{"d":"MEDIUM","q":"A train takes 8 hours at 50 km/h for a route. How long at 80 km/h?","o":["4 h","5 h","6 h","12.8 h"],"a":1,"e":"Distance = 50 × 8 = 400 km; 400/80 = 5 hours.","v":"inverse-proportion"},{"d":"MEDIUM","q":"If y varies inversely as x and y = 12 when x = 4, find y when x = 8.","o":["3","6","12","24"],"a":1,"e":"For inverse proportion xy = k. Here k = 12 × 4 = 48; y = 48/8 = 6.","v":"inverse-proportion"},{"d":"MEDIUM","q":"If x and y are inversely proportional, which expression is constant?","o":["x + y","x − y","xy","y/x"],"a":2,"e":"Inverse proportion has the form y = k/x, so xy = k.","v":"inverse-proportion"},{"d":"MEDIUM","q":"Six workers need 14 days for a job. How many workers are needed to finish in 7 days?","o":["3","6","12","14"],"a":2,"e":"Workers × days = 6 × 14 = 84; 84/7 = 12 workers.","v":"inverse-proportion"},{"d":"MEDIUM","q":"A pump empties a tank in 9 hours. If three identical pumps work together, how long will they take?","o":["2 h","3 h","6 h","27 h"],"a":1,"e":"Three times as many pumps take one-third the time: 9/3 = 3 hours.","v":"inverse-proportion"},{"d":"HARD","q":"A car covers a fixed distance in 6 hours at 70 km/h. How long at 105 km/h?","o":["3 h","4 h","5 h","9 h"],"a":1,"e":"Distance = 70 × 6 = 420 km; 420/105 = 4 hours.","v":"inverse-proportion"},{"d":"HARD","q":"Fourteen workers finish a job in 9 days. How many days for 21 workers?","o":["4 days","6 days","7 days","13.5 days"],"a":1,"e":"14 × 9 = 21 × d, so d = 6 days.","v":"inverse-proportion"},{"d":"HARD","q":"If 5 identical taps fill a tank in 36 minutes, how long do 9 taps take?","o":["15 min","20 min","25 min","30 min"],"a":1,"e":"5 × 36 = 9 × t, so t = 20 minutes.","v":"inverse-proportion"},{"d":"HARD","q":"A bus takes 2.5 hours at 72 km/h. How long would it take at 90 km/h?","o":["1.5 h","2 h","2.25 h","3.125 h"],"a":1,"e":"Distance = 72 × 2.5 = 180 km; 180/90 = 2 hours.","v":"inverse-proportion"},{"d":"HARD","q":"If 16 people can paint a building in 5 days, how many days would 10 people take?","o":["3.125 days","6 days","8 days","10 days"],"a":2,"e":"16 × 5 = 10 × d, so d = 8 days.","v":"inverse-proportion"},{"d":"HARD","q":"A fixed amount of work takes 24 hours with 2 machines. How long with 8 identical machines?","o":["3 h","6 h","8 h","12 h"],"a":1,"e":"2 × 24 = 8 × t, so t = 6 hours.","v":"inverse-proportion"},{"d":"HARD","q":"If 12 workers need 18 days, how many workers are required to finish in 8 days?","o":["18","24","27","30"],"a":2,"e":"12 × 18 = 216 worker-days; 216/8 = 27 workers.","v":"inverse-proportion"},{"d":"HARD","q":"A journey takes 7.5 hours at 64 km/h. How long at 80 km/h?","o":["5 h","6 h","6.5 h","9.375 h"],"a":1,"e":"Distance = 64 × 7.5 = 480 km; 480/80 = 6 hours.","v":"inverse-proportion"},{"d":"HARD","q":"A food stock feeds 40 students for 18 days. How long will it feed 24 students?","o":["12 days","24 days","30 days","36 days"],"a":2,"e":"Students × days = 40 × 18 = 720; 720/24 = 30 days.","v":"inverse-proportion"},{"d":"HARD","q":"If 7 identical machines finish an order in 12 hours, how long would 4 machines take?","o":["6 h","18 h","21 h","24 h"],"a":2,"e":"7 × 12 = 4 × t, so t = 21 hours.","v":"inverse-proportion"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand inverse proportion and constant products</strong><small>Find missing values using inverse ratios</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Solve work, speed and time problems</strong><small>Apply x × y = constant</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve inverse proportion problems</strong><small>Apply inverse proportion accurately</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
