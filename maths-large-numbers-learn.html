<title>Large Numbers in Daily Life | SkillUp Academy</title>
<style>
:root{color-scheme:dark;--bg:#10182b;--card:#1b2942;--line:#344866;--text:#f5f8ff;--muted:#b8c6dc;--green:#58d6a3;--blue:#8eb5ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:12px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.2rem}.brand{font-weight:850;flex:1}.brand span{color:var(--green)}.progress{height:10px;border-radius:99px;background:#33425b;overflow:hidden;flex:2}.bar{height:100%;width:25%;background:var(--green);border-radius:99px;transition:width .2s}.count{font-size:.85rem;color:var(--muted);white-space:nowrap}.lesson{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;min-height:390px;display:flex;flex-direction:column}.label{font-size:.78rem;letter-spacing:1px;text-transform:uppercase;color:var(--green);font-weight:850}h1{font-size:clamp(1.8rem,7vw,2.5rem);line-height:1.15;margin:8px 0 12px}h2{font-size:1.35rem;margin:10px 0}.muted{color:var(--muted)}.picture{font-size:3rem;text-align:center;margin:12px 0}.number{font-size:clamp(1.8rem,8vw,2.6rem);font-weight:900;color:var(--green);overflow-wrap:anywhere;text-align:center;margin:12px 0}.bubble{background:#101b30;border:1px solid var(--line);padding:14px;border-radius:14px;margin:10px 0}.bubble strong{color:var(--green)}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}.btn{border:0;border-radius:14px;padding:13px 20px;background:var(--green);color:#102235;font:inherit;font-weight:850;cursor:pointer}.btn:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.tip{font-size:.85rem;color:var(--muted)}.done{text-align:center}.done .picture{font-size:4rem}@media(max-width:420px){.wrap{padding:12px}.lesson{padding:18px;min-height:370px}.bottom{align-items:stretch}.btn{flex:1}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths Path">←</a>
<div class="brand">SkillUp <span>Maths</span></div>
<div class="progress" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="25"><div class="bar" id="bar"></div></div>
<div class="count" id="count">1/4</div>
</header>
<main>
<section class="lesson" aria-live="polite">
<div class="label" id="label">Mini lesson · 1 of 4</div>
<div id="content">
<div class="picture" aria-hidden="true">🌍</div>
<h1>Big numbers are everywhere!</h1>
<p>We use large numbers to talk about people, money, distance and much more.</p>
<div class="bubble">👥 Population: <strong>1,25,000</strong><br>💰 Cost: <strong>₹8,50,000</strong></div>
<p class="muted">These numbers are easier to understand when we read them in groups.</p>
</div>
<div class="bottom"><span class="tip" id="tip">Learn at your pace</span><button class="btn" id="continue" type="button">Continue →</button></div>
</section>
</main>
</div>
<script>
(function(){
const steps=[
{label:"Mini lesson · 1 of 4",tip:"Learn at your pace",html:'<div class="picture" aria-hidden="true">🌍</div><h1>Big numbers are everywhere!</h1><p>We use large numbers to talk about people, money, distance and much more.</p><div class="bubble">👥 Population: <strong>1,25,000</strong><br>💰 Cost: <strong>₹8,50,000</strong></div><p class="muted">These numbers are easier to understand when we read them in groups.</p>'},
{label:"Mini lesson · 2 of 4",tip:"Read from left to right",html:'<div class="picture" aria-hidden="true">🔢</div><h1>Read in groups</h1><div class="number">5,08,24,019</div><div class="bubble"><strong>5 crore</strong> · <strong>8 lakh</strong> · <strong>24 thousand</strong> · <strong>19</strong></div><p>Say each group, then finish with the last group: <b>Five crore eight lakh twenty-four thousand nineteen.</b></p>'},
{label:"Mini lesson · 3 of 4",tip:"Compare the leftmost digits first",html:'<div class="picture" aria-hidden="true">⚖️</div><h1>Which number is bigger?</h1><div class="bubble"><div class="number">6,75,000</div><p style="text-align:center">is greater than</p><div class="number">6,57,000</div></div><p>Both begin with 6. Compare the next digits: <strong>7 is greater than 5</strong>, so 6,75,000 is bigger.</p>'},
{label:"Mini lesson · 4 of 4",tip:"You learned the key ideas!",html:'<div class="picture" aria-hidden="true">⭐</div><h1>Round to make it simpler</h1><div class="bubble"><div class="number">4,87,600</div><p style="text-align:center">Nearest thousand →</p><div class="number">4,88,000</div></div><p>Because the hundreds digit is 6, round the thousands place up.</p><p class="muted">Remember: read in groups, compare from the left, and round to estimate.</p>'}
];
let current=0;const content=document.getElementById("content"),bar=document.getElementById("bar"),count=document.getElementById("count"),label=document.getElementById("label"),tip=document.getElementById("tip"),button=document.getElementById("continue"),progress=document.querySelector('[role="progressbar"]');
function render(){const step=steps[current];content.innerHTML=step.html;label.textContent=step.label;tip.textContent=step.tip;count.textContent=(current+1)+"/"+steps.length;const pct=((current+1)/steps.length)*100;bar.style.width=pct+"%";progress.setAttribute("aria-valuenow",String(pct));button.textContent=current===steps.length-1?"Finish lesson ✓":"Continue →";}
button.addEventListener("click",function(){if(current<steps.length-1){current++;render();return;}content.innerHTML='<div class="done"><div class="picture" aria-hidden="true">🎉</div><h1>Lesson complete!</h1><p>You explored large numbers, place-value groups, comparison and rounding.</p><div class="bubble"><strong>Great learning!</strong><br>Keep going one concept at a time.</div><a href="maths-home.html?v=20261012-iit-foundation-path-v1">← Return to Maths Path</a></div>';label.textContent="Completed";tip.textContent="Concept learned";count.textContent="✓";bar.style.width="100%";progress.setAttribute("aria-valuenow","100");button.textContent="Review lesson";button.onclick=function(){current=0;button.onclick=null;render();};});
})();
</script>
</body>
