<style>

header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}

.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:5px 8px;font-size:10px;font-weight:850}

.letter{flex:0 0 24px;height:24px;border:1.5px solid var(--line);border-radius:7px;display:grid;place-items:center;font-size:11px;color:#60758a;font-weight:900}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}
.option.selected{border-color:var(--blue);background:#e8f7ff}
.option.correct{border-color:var(--green);background:#efffe7;color:#245b12}
.option.wrong{border-color:var(--red);background:#fff0f0;color:#8f2020}
.option:disabled{cursor:default;opacity:1}
.feedback{display:none;margin-top:11px;padding:10px 11px;border-radius:12px;font-size:13px;line-height:1.45;font-weight:650}
.feedback.show{display:block}
.feedback.good{background:#efffe7;border:1.5px solid #c8f0b2;color:#245b12}
.feedback.bad{background:#fff0f0;border:1.5px solid #ffcaca;color:#842029}
.actions{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;min-height:42px;border:0;border-radius:11px;padding:9px 12px;font-size:14px;font-weight:900;cursor:pointer}
.check{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-dark)}
.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 3px 0 #1596d0}
.continue.show{display:block}
.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:21px 14px}
.trophy{font-size:48px}
.score{font-size:36px;font-weight:950;color:#174a78}
.finish h2{margin:5px 0 8px}
.finish .btn{margin-top:13px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-dark)}
.review{text-align:left;margin:14px 0 5px}
.review-item{padding:10px;margin:8px 0;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.review-item p{margin:4px 0}
.your-answer{color:#a12b30}.correct-answer{color:#245b12}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
@media(max-width:480px){
 .nav{gap:6px;padding:6px 9px;min-height:48px}.back{flex-basis:32px;width:32px;height:32px;font-size:16px}
 .brand{font-size:15px}.brand small{font-size:7px;letter-spacing:.5px}
 .pill{padding:5px 7px;font-size:10px}
 main{width:100%;padding:10px 9px 25px}
 .hero,.quiz,.finish{padding:12px;border-radius:15px}
 .hero h1{font-size:21px}.muted{font-size:11px}
 .option{font-size:13px;padding:8px 9px;min-height:40px;gap:7px;border-radius:10px}
 .letter{flex-basis:22px;height:22px;font-size:10px}
 .question{font-size:18px;margin:8px 0 11px}
 .options{gap:7px}
 .feedback{font-size:12px;padding:9px}
 .btn{min-height:38px;font-size:13px;padding:8px 10px}
}
@media(max-width:360px){.nav{gap:4px;padding-inline:6px}.brand{font-size:14px}.pill{padding:5px 6px;font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}

<header><div class="nav">

<div class="brand">SkillUp <span style="color:#58a900">Maths</span><small>FOUNDATION • PRACTICE MODE</small></div>

<main>
<section class="hero">
<h1>🔢 Large Numbers</h1>
<p class="muted">Build confidence with number names, place value, comparison, rounding and real-life calculations.</p>
<div class="tags"><span class="tag">🌱 Foundation practice</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Instant explanations</span></div>
<div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div>
<div class="track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
</section>
<section class="quiz" id="quiz">
<div class="qmeta" id="qmeta">QUESTION 1</div>
<h2 class="question" id="question"></h2>
<div class="options" id="options"></div>
<div class="feedback" id="feedback" aria-live="polite"></div>
<div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div>
</section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[{"q":"What is the number name of 4,215?","o":["Four thousand two hundred fifteen","Forty-two thousand fifteen","Four thousand twenty-five","Four hundred two thousand fifteen"],"a":0,"why":"4,215 has 4 thousands, 2 hundreds, 1 ten and 5 ones."},{"q":"Which number is the greatest?","o":["3,405","3,450","3,045","3,504"],"a":3,"why":"All have 3 thousands; comparing hundreds, 5 hundreds makes 3,504 the greatest."},{"q":"What is the place value of 6 in 26,341?","o":["6","60","600","6,000"],"a":3,"why":"The 6 is in the thousands place, so its place value is 6,000."},{"q":"Which is the expanded form of 7,208?","o":["7,000 + 200 + 8","7,000 + 20 + 8","700 + 200 + 8","7,000 + 200 + 80"],"a":0,"why":"7,208 contains 7 thousands, 2 hundreds, 0 tens and 8 ones."},{"q":"What number comes just before 50,000?","o":["49,000","49,999","50,001","40,999"],"a":1,"why":"One less than 50,000 is 49,999."},{"q":"How is 3,06,018 read in the Indian system?","o":["Three lakh six thousand eighteen","Thirty lakh six thousand eighteen","Three lakh sixty thousand eighteen","Three crore six thousand eighteen"],"a":0,"why":"3,06,018 groups as 3 lakh, 6 thousand and 18."},{"q":"Which digit is in the ten-thousands place in 8,46,291?","o":["8","4","6","2"],"a":1,"why":"In 8,46,291, 8 is in lakhs and 4 is in ten-thousands."},{"q":"Which is the smallest number?","o":["5,08,120","5,80,120","5,18,020","5,08,210"],"a":0,"why":"Compare from the left: the 5,08,xxx numbers are smaller than 5,18,020 and 5,80,120; 5,08,120 is less than 5,08,210."},{"q":"One lakh equals how many thousands?","o":["10","100","1,000","10,000"],"a":1,"why":"1,00,000 divided into groups of 1,000 gives 100 thousands."},{"q":"Round 6,742 to the nearest hundred.","o":["6,700","6,740","6,800","7,000"],"a":0,"why":"The tens digit is 4, so keep the hundreds digit unchanged: 6,742 rounds to 6,700."},{"q":"Which is the correct ascending order?","o":["24,501; 24,150; 24,105","24,105; 24,150; 24,501","24,150; 24,105; 24,501","24,501; 24,105; 24,150"],"a":1,"why":"Compare the last three digits: 105 is less than 150, which is less than 501."},{"q":"What is 3,00,000 + 40,000 + 700 + 9?","o":["3,40,709","3,04,709","3,47,009","3,40,079"],"a":0,"why":"Adding the place values gives 3,40,709."},{"q":"Which number has 5 in the lakhs place?","o":["2,54,761","5,24,761","25,47,610","4,52,761"],"a":1,"why":"In 5,24,761, the first digit 5 represents five lakhs."},{"q":"Round 8,64,300 to the nearest ten thousand.","o":["8,60,000","8,64,000","8,70,000","9,00,000"],"a":0,"why":"The thousands digit is 4, so keep the ten-thousands digit and round down to 8,60,000."},{"q":"Which comparison is correct?","o":["7,09,999 > 7,10,000","7,09,999 = 7,10,000","7,09,999 < 7,10,000","7,09,999 > 7,90,000"],"a":2,"why":"7,09,999 is one less than 7,10,000."},{"q":"A town has 2,35,480 people. What is the value of digit 3?","o":["3,000","30,000","3,00,000","300"],"a":1,"why":"The 3 is in the ten-thousands place, so its value is 30,000."},{"q":"Which number is exactly 10,000 more than 4,76,250?","o":["4,77,250","4,86,250","5,76,250","4,76,350"],"a":1,"why":"Adding 10,000 increases the ten-thousands place: 4,76,250 + 10,000 = 4,86,250."},{"q":"Round 12,49,650 to the nearest lakh.","o":["12,00,000","12,50,000","13,00,000","12,40,000"],"a":0,"why":"12,49,650 is below the midpoint 12,50,000, so it rounds down to 12,00,000."},{"q":"Which is the greatest 6-digit number using 2, 0, 8, 5, 1 and 7 once each?","o":["875,210","875,201","872,510","857,210"],"a":0,"why":"Arrange the digits in descending order: 8, 7, 5, 2, 1, 0 gives 875,210."},{"q":"A number rounds to 3,60,000 to the nearest ten thousand. Which could be the number?","o":["3,54,999","3,61,250","3,66,000","3,49,999"],"a":1,"why":"3,61,250 lies between 3,55,000 and 3,64,999, so it rounds to 3,60,000."},{"q":"What is the difference between 10,00,000 and 9,87,654?","o":["12,346","13,346","12,446","22,346"],"a":0,"why":"10,00,000 − 9,87,654 = 12,346."},{"q":"A library has 1,25,780 books and receives 24,650 more. How many books does it have now?","o":["1,40,430","1,50,430","1,49,430","1,51,430"],"a":1,"why":"1,25,780 + 24,650 = 1,50,430."},{"q":"Which is the correct descending order?","o":["4,05,610; 4,50,106; 4,15,600","4,50,106; 4,15,600; 4,05,610","4,15,600; 4,50,106; 4,05,610","4,05,610; 4,15,600; 4,50,106"],"a":1,"why":"Compare ten-thousands: 50 thousand is greater than 15 thousand, which is greater than 5 thousand."},{"q":"A stadium holds 78,950 people. Estimate this to the nearest thousand.","o":["78,000","78,900","79,000","80,000"],"a":2,"why":"The hundreds digit is 9, so round 78,950 up to 79,000."},{"q":"What is the smallest 5-digit number that can be made using 0, 3, 4, 6 and 8 once each?","o":["03,468","30,468","30,648","34,068"],"a":1,"why":"A five-digit number cannot start with zero. Start with the smallest non-zero digit 3, then arrange the remaining digits in ascending order: 30,468."},{"q":"A district's population is 8,76,450. It increases by 25,000. What is the new population?","o":["8,91,450","9,01,450","9,11,450","8,76,475"],"a":1,"why":"8,76,450 + 25,000 = 9,01,450."},{"q":"Which number rounds to 5,00,000 to the nearest lakh?","o":["4,49,999","4,50,000","5,50,000","5,60,000"],"a":1,"why":"4,50,000 is the midpoint and rounds up to 5,00,000. 5,50,000 rounds to 6,00,000."},{"q":"A company produced 3,48,750 items in January and 2,76,580 in February. How many items were produced in total?","o":["6,15,330","6,25,330","6,35,330","5,25,330"],"a":1,"why":"3,48,750 + 2,76,580 = 6,25,330."},{"q":"Which number is 1,00,000 less than 7,04,020?","o":["6,04,020","7,03,020","6,94,020","6,04,200"],"a":0,"why":"Subtracting one lakh from 7,04,020 gives 6,04,020."},{"q":"A number rounded to the nearest thousand is 2,38,000. Which number could it be?","o":["2,37,499","2,38,250","2,38,501","2,37,400"],"a":1,"why":"2,38,250 lies from 2,37,500 through 2,38,499, so it rounds to 2,38,000."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Large Numbers Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261104-physics-path-layout-v2" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
