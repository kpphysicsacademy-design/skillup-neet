<style>
:root{color-scheme:light;--green:#58cc02;--green-dark:#46a302;--blue:#1cb0f6;--ink:#3c3c3c;--muted:#777;--line:#e5e5e5;--good:#d7ffb8;--bad:#ffdfe0}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
.shell{width:min(100%,760px);margin:auto;padding:0 24px 44px}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:20px 0 18px;background:rgba(255,255,255,.97);backdrop-filter:blur(10px)}
.back{display:grid;place-items:center;flex:0 0 70px;width:70px;height:70px;border:3px solid var(--line);border-bottom-width:5px;border-radius:25px;color:var(--blue);text-decoration:none;font-size:30px;font-weight:950}
.brand{font-size:25px;font-weight:1000;letter-spacing:-.7px;white-space:nowrap}.brand span{color:#58a900}
.track{height:28px;flex:1;min-width:24px;overflow:hidden;border-radius:99px;background:#eee}.fill{height:100%;width:0;border-radius:99px;background:var(--green);transition:width .25s}
.stat{display:flex;align-items:center;justify-content:center;min-height:58px;padding:8px 15px;border-radius:24px;font-size:22px;font-weight:950;white-space:nowrap}.xp{color:#398600;background:#f0f9e9}.lives{color:#d9435a;background:#fff0f2}
.meta{display:none}
.stage{min-height:600px;padding:36px 38px 42px;border:3px solid var(--line);border-bottom-width:7px;border-radius:30px;background:#fff}
.kicker{display:inline-flex;align-items:center;min-height:60px;padding:10px 22px;border-radius:99px;background:#effbe7;color:#398600;font-size:23px;font-weight:1000;letter-spacing:.025em;text-transform:uppercase}
h1{margin:32px 0 36px;font-size:clamp(34px,6vw,48px);line-height:1.12;letter-spacing:-1.4px}
.question{margin:0 0 48px;font-size:clamp(25px,4.5vw,36px);font-weight:950;line-height:1.4;letter-spacing:-.4px}
.answers{display:grid;gap:28px}
.answer{width:100%;min-height:104px;padding:22px 25px;border:3px solid var(--line);border-bottom-width:7px;border-radius:27px;background:#fff;color:var(--ink);font:inherit;font-size:clamp(20px,3.6vw,28px);font-weight:900;line-height:1.35;text-align:left;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.answer:hover:not(:disabled){border-color:#84d8ff;background:#f6fbff;transform:translateY(-1px)}
.answer:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.answer:disabled{cursor:default;opacity:1}
.answer.correct{border-color:var(--green);background:var(--good);color:#286b00}
.answer.incorrect{border-color:#ff4b4b;background:var(--bad);color:#a3212a}
.feedback{margin-top:22px;padding:18px 20px;border:2px solid transparent;border-radius:18px;font-size:19px;font-weight:800;line-height:1.5}
.feedback.good{border-color:var(--green);background:#effbe7;color:#286b00}
.feedback.bad{border-color:#ff7777;background:#fff0f2;color:#a3212a}
.footer{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:50px}
.encourage{max-width:42%;color:var(--muted);font-size:22px;font-weight:800;line-height:1.55}
.primary{width:min(48%,295px);min-height:145px;padding:20px 28px;border:0;border-bottom:8px solid var(--green-dark);border-radius:28px;background:var(--green);color:#fff;font:inherit;font-size:29px;font-weight:1000;letter-spacing:.015em;text-transform:uppercase;cursor:pointer}
.primary:disabled{background:#b9dca4;border-bottom-color:#9abe83;cursor:not-allowed}
.result{text-align:center}.trophy{font-size:64px}.score{margin:12px 0 0;color:#398600;font-size:64px;font-weight:1000;line-height:1}.percent{color:var(--muted);font-weight:850}.result-box{margin:24px 0;padding:20px;border-radius:18px;background:#f5faff;border:1px solid #dceaf8}.result-box strong{font-size:19px}.result-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:24px}.secondary{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:12px 20px;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;color:var(--blue);font-weight:900;text-decoration:none;background:#fff}
@media(max-width:600px){.shell{padding:0 14px 30px}.top{gap:8px;padding:12px 0 14px}.back{flex-basis:44px;width:44px;height:44px;border-radius:16px;font-size:23px}.brand{font-size:16px;letter-spacing:-.4px}.track{height:15px}.stat{min-height:40px;padding:5px 8px;border-radius:16px;font-size:14px}.stage{min-height:500px;padding:22px 20px 25px;border-radius:22px;border-width:2px;border-bottom-width:5px}.kicker{min-height:42px;padding:7px 13px;font-size:14px}h1{margin:22px 0 24px;font-size:31px;letter-spacing:-.8px}.question{margin:0 0 30px;font-size:23px;line-height:1.42}.answers{gap:15px}.answer{min-height:72px;padding:15px 16px;border-width:2px;border-bottom-width:5px;border-radius:19px;font-size:18px}.feedback{margin-top:15px;padding:13px 14px;font-size:16px}.footer{gap:12px;margin-top:30px}.encourage{max-width:43%;font-size:15px}.primary{width:52%;min-height:88px;padding:12px 14px;border-bottom-width:5px;border-radius:20px;font-size:20px}}
@media(max-width:370px){.brand{font-size:14px}.stat{font-size:12px;padding:5px 6px}.shell{padding-left:10px;padding-right:10px}.stage{padding:18px 15px}.answer{font-size:16px}.encourage{font-size:13px}.primary{font-size:17px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

<body>
<div class="shell">
<header class="top">

<div class="brand">SkillUp <span>Maths</span></div>
<div class="track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="progressFill"></div></div>
<div class="stat xp" id="xp">⭐ 0 XP</div><div class="stat lives" id="lives" aria-label="3 hearts">♥ 3</div>
</header>
<div class="meta"><span id="counter">QUESTION 1 OF 30</span><span id="scoreLabel">0 CORRECT</span></div>
<main><section class="stage" aria-live="polite">
<div class="kicker" id="kicker">Large Numbers · Practice</div>
<div id="questionArea"></div>

</section></main>
</div>
<script>
(function(){
const questions=[{"q":"What is the number name of 4,215?","o":["Four thousand two hundred fifteen","Forty-two thousand fifteen","Four thousand twenty-five","Four hundred two thousand fifteen"],"a":0,"why":"4,215 has 4 thousands, 2 hundreds, 1 ten and 5 ones."},{"q":"Which number is the greatest?","o":["3,405","3,450","3,045","3,504"],"a":3,"why":"All have 3 thousands; comparing hundreds, 5 hundreds makes 3,504 the greatest."},{"q":"What is the place value of 6 in 26,341?","o":["6","60","600","6,000"],"a":3,"why":"The 6 is in the thousands place, so its place value is 6,000."},{"q":"Which is the expanded form of 7,208?","o":["7,000 + 200 + 8","7,000 + 20 + 8","700 + 200 + 8","7,000 + 200 + 80"],"a":0,"why":"7,208 contains 7 thousands, 2 hundreds, 0 tens and 8 ones."},{"q":"What number comes just before 50,000?","o":["49,000","49,999","50,001","40,999"],"a":1,"why":"One less than 50,000 is 49,999."},{"q":"How is 3,06,018 read in the Indian system?","o":["Three lakh six thousand eighteen","Thirty lakh six thousand eighteen","Three lakh sixty thousand eighteen","Three crore six thousand eighteen"],"a":0,"why":"3,06,018 groups as 3 lakh, 6 thousand and 18."},{"q":"Which digit is in the ten-thousands place in 8,46,291?","o":["8","4","6","2"],"a":1,"why":"In 8,46,291, 8 is in lakhs and 4 is in ten-thousands."},{"q":"Which is the smallest number?","o":["5,08,120","5,80,120","5,18,020","5,08,210"],"a":0,"why":"Compare from the left: the 5,08,xxx numbers are smaller than 5,18,020 and 5,80,120; 5,08,120 is less than 5,08,210."},{"q":"One lakh equals how many thousands?","o":["10","100","1,000","10,000"],"a":1,"why":"1,00,000 divided into groups of 1,000 gives 100 thousands."},{"q":"Round 6,742 to the nearest hundred.","o":["6,700","6,740","6,800","7,000"],"a":0,"why":"The tens digit is 4, so keep the hundreds digit unchanged: 6,742 rounds to 6,700."},{"q":"Which is the correct ascending order?","o":["24,501; 24,150; 24,105","24,105; 24,150; 24,501","24,150; 24,105; 24,501","24,501; 24,105; 24,150"],"a":1,"why":"Compare the last three digits: 105 is less than 150, which is less than 501."},{"q":"What is 3,00,000 + 40,000 + 700 + 9?","o":["3,40,709","3,04,709","3,47,009","3,40,079"],"a":0,"why":"Adding the place values gives 3,40,709."},{"q":"Which number has 5 in the lakhs place?","o":["2,54,761","5,24,761","25,47,610","4,52,761"],"a":1,"why":"In 5,24,761, the first digit 5 represents five lakhs."},{"q":"Round 8,64,300 to the nearest ten thousand.","o":["8,60,000","8,64,000","8,70,000","9,00,000"],"a":0,"why":"The thousands digit is 4, so keep the ten-thousands digit and round down to 8,60,000."},{"q":"Which comparison is correct?","o":["7,09,999 > 7,10,000","7,09,999 = 7,10,000","7,09,999 < 7,10,000","7,09,999 > 7,90,000"],"a":2,"why":"7,09,999 is one less than 7,10,000."},{"q":"A town has 2,35,480 people. What is the value of digit 3?","o":["3,000","30,000","3,00,000","300"],"a":1,"why":"The 3 is in the ten-thousands place, so its value is 30,000."},{"q":"Which number is exactly 10,000 more than 4,76,250?","o":["4,77,250","4,86,250","5,76,250","4,76,350"],"a":1,"why":"Adding 10,000 increases the ten-thousands place: 4,76,250 + 10,000 = 4,86,250."},{"q":"Round 12,49,650 to the nearest lakh.","o":["12,00,000","12,50,000","13,00,000","12,40,000"],"a":0,"why":"12,49,650 is below the midpoint 12,50,000, so it rounds down to 12,00,000."},{"q":"Which is the greatest 6-digit number using 2, 0, 8, 5, 1 and 7 once each?","o":["875,210","875,201","872,510","857,210"],"a":0,"why":"Arrange the digits in descending order: 8, 7, 5, 2, 1, 0 gives 875,210."},{"q":"A number rounds to 3,60,000 to the nearest ten thousand. Which could be the number?","o":["3,54,999","3,61,250","3,66,000","3,49,999"],"a":1,"why":"3,61,250 lies between 3,55,000 and 3,64,999, so it rounds to 3,60,000."},{"q":"What is the difference between 10,00,000 and 9,87,654?","o":["12,346","13,346","12,446","22,346"],"a":0,"why":"10,00,000 − 9,87,654 = 12,346."},{"q":"A library has 1,25,780 books and receives 24,650 more. How many books does it have now?","o":["1,40,430","1,50,430","1,49,430","1,51,430"],"a":1,"why":"1,25,780 + 24,650 = 1,50,430."},{"q":"Which is the correct descending order?","o":["4,05,610; 4,50,106; 4,15,600","4,50,106; 4,15,600; 4,05,610","4,15,600; 4,50,106; 4,05,610","4,05,610; 4,15,600; 4,50,106"],"a":1,"why":"Compare ten-thousands: 50 thousand is greater than 15 thousand, which is greater than 5 thousand."},{"q":"A stadium holds 78,950 people. Estimate this to the nearest thousand.","o":["78,000","78,900","79,000","80,000"],"a":2,"why":"The hundreds digit is 9, so round 78,950 up to 79,000."},{"q":"What is the smallest 5-digit number that can be made using 0, 3, 4, 6 and 8 once each?","o":["03,468","30,468","30,648","34,068"],"a":1,"why":"A five-digit number cannot start with zero. Start with the smallest non-zero digit 3, then arrange the remaining digits in ascending order: 30,468."},{"q":"A district's population is 8,76,450. It increases by 25,000. What is the new population?","o":["8,91,450","9,01,450","9,11,450","8,76,475"],"a":1,"why":"8,76,450 + 25,000 = 9,01,450."},{"q":"Which number rounds to 5,00,000 to the nearest lakh?","o":["4,49,999","4,50,000","5,50,000","5,60,000"],"a":1,"why":"4,50,000 is the midpoint and rounds up to 5,00,000. 5,50,000 rounds to 6,00,000."},{"q":"A company produced 3,48,750 items in January and 2,76,580 in February. How many items were produced in total?","o":["6,15,330","6,25,330","6,35,330","5,25,330"],"a":1,"why":"3,48,750 + 2,76,580 = 6,25,330."},{"q":"Which number is 1,00,000 less than 7,04,020?","o":["6,04,020","7,03,020","6,94,020","6,04,200"],"a":0,"why":"Subtracting one lakh from 7,04,020 gives 6,04,020."},{"q":"A number rounded to the nearest thousand is 2,38,000. Which number could it be?","o":["2,37,499","2,38,250","2,38,501","2,37,400"],"a":1,"why":"2,38,250 lies from 2,37,500 through 2,38,499, so it rounds to 2,38,000."}];
let index=0,score=0,xp=0,lives=3,answered=false,finished=false;
const area=document.getElementById("questionArea"),fill=document.getElementById("progressFill"),counter=document.getElementById("counter"),scoreLabel=document.getElementById("scoreLabel"),xpEl=document.getElementById("xp"),livesEl=document.getElementById("lives"),kicker=document.getElementById("kicker"),encourage=document.getElementById("encourage"),next=document.getElementById("next"),track=document.querySelector('[role="progressbar"]');
function updateProgress(){const value=Math.round(index/questions.length*100);fill.style.width=value+"%";track.setAttribute("aria-valuenow",String(value));}
function render(){
 answered=false;const q=questions[index];
 counter.textContent="QUESTION "+(index+1)+" OF "+questions.length;scoreLabel.textContent=score+" CORRECT";
 kicker.textContent=index<10?"FOUNDATION PRACTICE":index<20?"BUILD YOUR SKILLS":"CHALLENGE ROUND";
 encourage.textContent="Choose the best answer.";next.disabled=true;next.textContent="Check answer";
 area.innerHTML='<h1>Large Numbers</h1><p class="question">'+q.q+'</p><div class="answers">'+q.o.map((v,i)=>'<button class="answer" type="button" data-index="'+i+'"><span aria-hidden="true">'+String.fromCharCode(65+i)+'. </span>'+v+'</button>').join("")+'</div><div id="feedback" aria-live="polite"></div>';
 area.querySelectorAll(".answer").forEach(button=>button.addEventListener("click",()=>selectAnswer(Number(button.dataset.index))));
 updateProgress();
}
function selectAnswer(choice){
 if(answered||finished)return;answered=true;const q=questions[index],correct=choice===q.a;
 area.querySelectorAll(".answer").forEach((button,i)=>{button.disabled=true;if(i===q.a)button.classList.add("correct");else if(i===choice)button.classList.add("incorrect");});
 if(correct){score++;xp+=10;kicker.textContent="WELL DONE!";encourage.textContent="+10 XP added to your score.";}
 else{lives=Math.max(0,lives-1);kicker.textContent="LEARN FROM THIS";encourage.textContent="Keep going — mistakes help you learn.";}
 xpEl.textContent="⭐ "+xp+" XP";livesEl.textContent="♥ "+lives;livesEl.setAttribute("aria-label",lives+" hearts");scoreLabel.textContent=score+" CORRECT";
 const feedback=document.getElementById("feedback");feedback.className="feedback "+(correct?"good":"bad");feedback.textContent=(correct?"✓ Correct. ":"Not quite. ")+q.why;
 next.disabled=false;next.textContent=index===questions.length-1?"View results →":"Continue →";
}
function finish(){
 finished=true;fill.style.width="100%";track.setAttribute("aria-valuenow","100%");counter.textContent="PRACTICE COMPLETE";kicker.textContent="YOUR RESULT";encourage.textContent="Every attempt makes your number skills stronger.";
 const percent=Math.round(score/questions.length*100),message=percent>=80?"Excellent work! You have a strong grasp of large numbers.":percent>=50?"Good effort! Review the explanations and practise once more.":"Keep practising. Build accuracy one question at a time.";
 area.innerHTML='<div class="result"><div class="trophy">🏆</div><h1>Challenge complete!</h1><div class="score">'+score+'/'+questions.length+'</div><p class="percent">'+percent+'% correct</p><div class="result-box"><strong>'+message+'</strong><p>'+score+' correct answers · '+(questions.length-score)+' to review</p><strong>⭐ '+xp+' XP earned</strong></div><div class="result-actions"><a class="secondary" href="maths-home.html?v=20261012-iit-foundation-path-v1">Maths home</a></div></div>';
 next.textContent="Try again ↻";next.disabled=false;
}
next.addEventListener("click",function(){
 if(finished){index=0;score=0;xp=0;lives=3;finished=false;xpEl.textContent="⭐ 0 XP";livesEl.textContent="♥ 3";livesEl.setAttribute("aria-label","3 hearts");render();return;}
 if(!answered)return;if(index<questions.length-1){index++;render();}else finish();
});
render();
})();
</script>
