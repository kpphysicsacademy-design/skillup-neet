<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,sans-serif}.wrap{max-width:650px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 20px}.back{color:var(--muted);text-decoration:none;font-size:1.3rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .25s}.xp,.heart{background:#3a4b64;padding:5px 9px;border-radius:12px;font-size:.8rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.heart{color:#ff9aa7}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.85rem;margin:0 2px 10px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:22px;min-height:430px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}h1{font-size:clamp(1.65rem,6vw,2.25rem);line-height:1.15;margin:10px 0 12px}.question{font-size:1.15rem;font-weight:800;margin:12px 0 18px}.options{display:grid;gap:10px}.option{display:block;text-align:left;width:100%;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--panel2);color:var(--ink);padding:13px 14px;font:inherit;font-weight:750;cursor:pointer}.option:hover:not(:disabled){border-color:var(--blue)}.option:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.option:disabled{cursor:default;opacity:1}.option.correct{border-color:var(--green);background:#21483f}.option.wrong{border-color:var(--red);background:#4b2b3a}.feedback{border-radius:13px;padding:12px;margin-top:14px;font-weight:650}.feedback.good{background:#21483f;color:var(--green2)}.feedback.bad{background:#4b2b3a;color:#ffd7dd}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{font-size:.8rem;color:var(--muted)}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 18px}button.primary:disabled{opacity:.45;cursor:not-allowed}.summary{text-align:center}.bigscore{font-size:3.2rem;font-weight:950;color:var(--green2);margin:6px}.reward{display:inline-block;margin:10px auto;background:#2d4a47;color:var(--green2);border-radius:14px;padding:10px 16px;font-weight:900}.tile{background:#142139;border:1px solid var(--line);border-radius:15px;padding:14px;margin:12px 0}.summary a{color:var(--green2);font-weight:800}.small{color:var(--muted);font-size:.9rem}@media(max-width:420px){.wrap{padding:12px}.card{padding:17px;min-height:400px}.brand{font-size:.9rem}.xp,.heart{font-size:.75rem;padding:5px 7px}.actions{align-items:stretch}.actions button{flex:1}.hint{align-self:center}}

<body><div class="wrap">
<header class="top"><a class="back" href="maths-large-numbers-learn.html?v=20261012-large-numbers-mcq-v2" aria-label="Back to lesson">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="xp" id="xp">⭐ 0 XP</div><div class="heart" id="hearts" aria-label="3 hearts">♥ 3</div></header>
<div class="meta"><span id="counter">QUESTION 1 OF 10</span><span>🎯 MCQ Challenge</span></div>
<main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Choose one answer</div><div id="content"><h1>Large Numbers</h1><p class="question">In the Indian place-value system, how is 5,08,24,019 read?</p><div class="options"><button class="option">Five crore eight lakh twenty-four thousand nineteen</button></div></div><div class="actions"><span class="hint" id="hint">Take your time. You can do it!</span><button class="primary" id="next" type="button" disabled>Check answer</button></div></section></main>
</div>
<script>
(function(){
const questions=[
{q:"In the Indian place-value system, how is 5,08,24,019 read?",o:["Five crore eight lakh twenty-four thousand nineteen","Five crore eighty lakh twenty-four thousand nineteen","Fifty crore eight lakh twenty-four thousand nineteen","Five crore eight lakh two thousand four hundred nineteen"],a:0,why:"5,08,24,019 groups as 5 crore, 8 lakh, 24 thousand and 19."},
{q:"Which number is greater?",o:["6,57,000","6,75,000","6,57,900","6,70,500"],a:1,why:"6,75,000 is greatest; after the common 6 lakh, 75 thousand is more than the other values."},
{q:"What is the place value of 8 in 4,83,216?",o:["8,000","80,000","8,00,000","800"],a:1,why:"The 8 is in the ten-thousands place, so its place value is 80,000."},
{q:"Which is the expanded form of 3,42,105?",o:["3,00,000 + 40,000 + 2,000 + 100 + 5","3,00,000 + 4,000 + 200 + 10 + 5","30,000 + 4,000 + 200 + 5","3,00,000 + 40,000 + 200 + 10 + 5"],a:0,why:"3,42,105 = 3,00,000 + 40,000 + 2,000 + 100 + 5."},
{q:"What number comes immediately after 9,99,999?",o:["9,99,998","10,00,000","9,99,000","10,00,001"],a:1,why:"Adding 1 to 9,99,999 gives 10,00,000, which is ten lakh."},
{q:"Round 4,87,600 to the nearest thousand.",o:["4,87,000","4,87,500","4,88,000","4,90,000"],a:2,why:"The hundreds digit is 6, so round 4,87,600 up to 4,88,000."},
{q:"Which symbol makes this statement true: 8,09,500 __ 8,90,500?",o:[" > "," < "," = "," + "],a:1,why:"Both have 8 lakh, but 9 thousand is less than 90 thousand, so 8,09,500 is smaller."},
{q:"How many lakhs are there in one crore?",o:["10 lakhs","100 lakhs","1,000 lakhs","1 lakh"],a:1,why:"One crore equals 100 lakhs in the Indian place-value system."},
{q:"Which number has 7 in the ten-thousands place?",o:["2,07,450","2,70,450","2,47,050","7,02,450"],a:1,why:"In 2,70,450, the digit 7 is in the ten-thousands place and has value 70,000."},
{q:"Estimate 3,48,200 to the nearest ten thousand.",o:["3,40,000","3,48,000","3,50,000","4,00,000"],a:2,why:"The thousands digit is 8, so round the ten-thousands place up to 3,50,000."}
];
let index=0,score=0,xp=0,hearts=3,chosen=false,ended=false;
const content=document.getElementById("content"),bar=document.getElementById("bar"),xpEl=document.getElementById("xp"),heartsEl=document.getElementById("hearts"),counter=document.getElementById("counter"),eyebrow=document.getElementById("eyebrow"),hint=document.getElementById("hint"),next=document.getElementById("next"),progress=document.querySelector('[role="progressbar"]');
function render(){chosen=false;const q=questions[index];counter.textContent="QUESTION "+(index+1)+" OF "+questions.length;eyebrow.textContent="Choose one answer";hint.textContent="One question at a time";next.textContent="Check answer";next.disabled=true;content.innerHTML='<h1>Large Numbers</h1><p class="question">'+q.q+'</p><div class="options">'+q.o.map((v,i)=>'<button class="option" type="button" data-i="'+i+'"><span aria-hidden="true">'+String.fromCharCode(65+i)+'. </span>'+v+'</button>').join("")+'</div><div id="feedback" aria-live="polite"></div>';content.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>choose(Number(b.dataset.i))));const pct=(index/questions.length)*100;bar.style.width=pct+"%";progress.setAttribute("aria-valuenow",String(Math.round(pct)));}
function choose(i){if(chosen||ended)return;chosen=true;const q=questions[index],correct=i===q.a;const buttons=content.querySelectorAll(".option");buttons.forEach((b,n)=>{b.disabled=true;if(n===q.a)b.classList.add("correct");else if(n===i)b.classList.add("wrong");});if(correct){score++;xp+=10;eyebrow.textContent="Nice work!";}else{hearts=Math.max(0,hearts-1);eyebrow.textContent="Keep going!";}xpEl.textContent="⭐ "+xp+" XP";heartsEl.textContent="♥ "+hearts;heartsEl.setAttribute("aria-label",hearts+" hearts remaining");const fb=document.getElementById("feedback");fb.className="feedback "+(correct?"good":"bad");fb.textContent=(correct?"✓ Correct! ":"Not quite. ")+q.why;hint.textContent=correct?"+10 XP earned":"Learn from it and try the next one";next.disabled=false;next.textContent=index===questions.length-1?"See results →":"Next question →";}
function finish(){ended=true;bar.style.width="100%";progress.setAttribute("aria-valuenow","100");counter.textContent="CHALLENGE COMPLETE";eyebrow.textContent="Your results";hint.textContent="Every question helps you improve";const pct=Math.round(score/questions.length*100);let message=pct>=80?"Excellent work! Your number skills are growing.":pct>=50?"Good effort! Review the explanations and try again.":"Keep practising. Small steps lead to big progress.";content.innerHTML='<div class="summary"><div style="font-size:3.5rem">🏆</div><h1>Challenge complete!</h1><div class="bigscore">'+score+'/'+questions.length+'</div><p>'+pct+'% correct</p><div class="reward">⭐ '+xp+' XP earned</div><div class="tile"><strong>'+message+'</strong><p class="small">Correct answers: '+score+' · Review each explanation as you practise.</p></div><p><a href="maths-large-numbers-learn.html?v=20261012-large-numbers-mcq-v2">← Review lesson</a></p></div>';next.textContent="Try again ↻";next.disabled=false;}
next.addEventListener("click",function(){if(ended){index=0;score=0;xp=0;hearts=3;ended=false;xpEl.textContent="⭐ 0 XP";heartsEl.textContent="♥ 3";render();return;}if(!chosen)return;if(index<questions.length-1){index++;render();}else finish();});
render();
})();
</script>
</body></html>
