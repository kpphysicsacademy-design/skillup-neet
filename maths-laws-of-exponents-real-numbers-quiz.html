<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Simplify 2³ × 2².","o":["2⁵","2⁶","4⁵","2"],"a":0,"e":"When multiplying powers with the same base, add exponents: 2³ × 2² = 2⁵."},{"d":"BASIC","q":"Simplify 5⁶ ÷ 5².","o":["5³","5⁴","5⁸","1"],"a":1,"e":"When dividing powers with the same base, subtract exponents: 5⁶⁻² = 5⁴."},{"d":"BASIC","q":"What is (3²)³?","o":["3⁵","3⁶","9⁶","3⁸"],"a":1,"e":"A power raised to a power means multiply exponents: 3^(2×3) = 3⁶."},{"d":"BASIC","q":"What is 7⁰ for non-zero 7?","o":["0","1","7","−1"],"a":1,"e":"Any non-zero number raised to the zero power equals 1."},{"d":"BASIC","q":"Write 2⁻³ using a positive exponent.","o":["−2³","1/2³","2³","1/2"],"a":1,"e":"A negative exponent means take the reciprocal: 2⁻³ = 1/2³."},{"d":"BASIC","q":"Simplify (2 × 3)².","o":["2² × 3²","2² × 3","2 × 3²","2 + 3²"],"a":0,"e":"A product raised to a power applies the exponent to each factor."},{"d":"BASIC","q":"Simplify x⁴ × x³.","o":["x¹²","x⁷","x","2x⁷"],"a":1,"e":"Add exponents for the same base: x⁴ × x³ = x⁷."},{"d":"BASIC","q":"Simplify a⁹ ÷ a⁵, where a ≠ 0.","o":["a¹⁴","a⁴","a⁵","a⁴⁵"],"a":1,"e":"Subtract exponents: a⁹ ÷ a⁵ = a⁴."},{"d":"BASIC","q":"Which is equal to 10⁻²?","o":["−100","1/100","1/10","100"],"a":1,"e":"10⁻² = 1/10² = 1/100."},{"d":"BASIC","q":"Simplify (m³)².","o":["m⁵","m⁶","m⁹","2m³"],"a":1,"e":"Multiply the exponents: (m³)² = m⁶."},{"d":"MEDIUM","q":"Simplify 2⁴ × 2⁻⁶.","o":["2¹⁰","2⁻²","2²","2⁻¹⁰"],"a":1,"e":"Add exponents: 4 + (−6) = −2, so the result is 2⁻²."},{"d":"MEDIUM","q":"Simplify (x²y³)(x⁴y), assuming variables are non-zero.","o":["x⁶y⁴","x⁸y³","x⁶y³","x²y⁴"],"a":0,"e":"Add exponents separately for each base: x²⁺⁴y³⁺¹ = x⁶y⁴."},{"d":"MEDIUM","q":"Simplify (a⁵ ÷ a²) × a⁻¹, where a ≠ 0.","o":["a²","a³","a⁴","a⁶"],"a":0,"e":"First a⁵ ÷ a² = a³; then a³ × a⁻¹ = a²."},{"d":"MEDIUM","q":"Which expression equals 1/x³ for x ≠ 0?","o":["x³","x⁻³","−x³","3/x"],"a":1,"e":"A reciprocal can be written with a negative exponent: 1/x³ = x⁻³."},{"d":"MEDIUM","q":"Simplify (2x²)³.","o":["6x⁶","8x⁶","8x⁵","2x⁶"],"a":1,"e":"Raise both factors to the third power: 2³x⁶ = 8x⁶."},{"d":"MEDIUM","q":"Simplify (p⁻²)⁻³, where p ≠ 0.","o":["p⁻⁶","p⁶","p⁻¹","p⁵"],"a":1,"e":"Multiply exponents: (−2)(−3) = 6, giving p⁶."},{"d":"MEDIUM","q":"Evaluate 4⁻¹ + 2⁻¹.","o":["1/6","3/4","1/4","6"],"a":1,"e":"4⁻¹ + 2⁻¹ = 1/4 + 1/2 = 3/4."},{"d":"MEDIUM","q":"Simplify (x³y²)² ÷ (xy), where x and y are non-zero.","o":["x⁵y³","x⁶y⁴","x⁵y⁴","x²y"],"a":0,"e":"Expand to x⁶y⁴ and divide by xy to get x⁵y³."},{"d":"MEDIUM","q":"Which is the standard form of 0.00056?","o":["5.6 × 10⁻⁴","56 × 10⁻⁵","5.6 × 10⁴","0.56 × 10⁻³"],"a":0,"e":"Move the decimal four places right to get 5.6, so the power is 10⁻⁴."},{"d":"MEDIUM","q":"Simplify (3²)⁻¹.","o":["1/9","−9","9","1/6"],"a":0,"e":"(3²)⁻¹ = 3⁻² = 1/9."},{"d":"HARD","q":"Simplify (a⁻²b³)² ÷ (a b⁻¹), with a,b ≠ 0.","o":["a⁻⁵b⁷","a⁻³b⁵","a⁵b⁷","a⁻⁴b⁶"],"a":0,"e":"The numerator is a⁻⁴b⁶; dividing by ab⁻¹ gives a⁻⁵b⁷."},{"d":"HARD","q":"If 2ˣ × 2³ = 2⁹, what is x?","o":["3","6","9","12"],"a":1,"e":"x + 3 = 9, so x = 6."},{"d":"HARD","q":"Simplify (x⁻³ ÷ x²)⁻¹ for x ≠ 0.","o":["x⁵","x⁻⁵","x","1/x⁵"],"a":0,"e":"Inside the brackets, x⁻³ ÷ x² = x⁻⁵; raising to −1 gives x⁵."},{"d":"HARD","q":"Evaluate 8⁻² × 4³.","o":["1/4","1","4","16"],"a":1,"e":"8⁻² × 4³ = (2³)⁻² × (2²)³ = 2⁻⁶ × 2⁶ = 1."},{"d":"HARD","q":"Which is equivalent to (x² − y²)⁰ when x² ≠ y²?","o":["0","1","x² − y²","undefined"],"a":1,"e":"Any non-zero base raised to zero equals 1."},{"d":"HARD","q":"Simplify (5⁻¹ + 5⁻²) × 25.","o":["6","5","30","1"],"a":0,"e":"(1/5 + 1/25) × 25 = (6/25) × 25 = 6."},{"d":"HARD","q":"If 10ᵃ = 0.001, what is a?","o":["−2","−3","3","−4"],"a":1,"e":"0.001 = 10⁻³, so a = −3."},{"d":"HARD","q":"Simplify (m⁴n⁻²) ÷ (m⁻¹n³), for non-zero m,n.","o":["m⁵/n⁵","m³n","m⁵n","m⁻³n⁻⁵"],"a":0,"e":"Subtract exponents: m⁴⁻⁽⁻¹⁾n⁻²⁻³ = m⁵n⁻⁵ = m⁵/n⁵."},{"d":"HARD","q":"Which is equal to 16^(3/4)?","o":["4","8","12","64"],"a":1,"e":"16^(1/4) = 2, so 16^(3/4) = 2³ = 8."},{"d":"HARD","q":"Simplify (2⁻³)⁻² ÷ 2⁴.","o":["2²","2⁻¹⁰","2⁻²","2¹⁰"],"a":0,"e":"(2⁻³)⁻² = 2⁶; then 2⁶ ÷ 2⁴ = 2²."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Apply exponent laws</strong><small>Multiply, divide and raise powers correctly</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Work with zero and negative exponents</strong><small>Rewrite powers as reciprocals and simplify expressions</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Simplify multi-step expressions</strong><small>Combine powers and use scientific notation</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
