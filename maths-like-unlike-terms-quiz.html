<h1>Like and Unlike Terms</h1>
<p class="muted">Variable parts · Coefficients · Exponents · Simplifying expressions</p>

<div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div>
<div class="track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>

<script>
(function(){
'use strict';
const questions=[{"q":"Which term is like 4x?","o":["7x","7y","4x²","7xy"],"a":0,"why":"Like terms have the same variable part with the same exponents; coefficients may differ."},{"q":"Which term is like −3a?","o":["8b","8a","8a²","8ab"],"a":1,"why":"Both terms have the variable a to the first power."},{"q":"Which pair contains like terms?","o":["5m and 5n","m and m²","5m and −2m","mn and m"],"a":2,"why":"5m and −2m have the same variable part, m."},{"q":"Which term is unlike 6p²?","o":["−p²","10p²","0.5p²","6p"],"a":3,"why":"p and p² are different variable parts because their exponents differ."},{"q":"Which term is like 9xy?","o":["−4yx","9x","−4y","−4x²y"],"a":0,"why":"xy and yx represent the same product, so their variable parts match."},{"q":"Which pair is unlike?","o":["a and −2a","3a and 3b","7xy and xy","4m² and −m²"],"a":1,"why":"The variables a and b differ, so these terms are unlike."},{"q":"Which term is like 12?","o":["5x","−5x²","−5","5xy"],"a":2,"why":"Constants have no variable part; all constants are like terms."},{"q":"Which term is like 2x²y?","o":["−7xy²","7x²","−7xy","−7yx²"],"a":3,"why":"Reordering factors does not change the variable part: x²y = yx²."},{"q":"Which pair contains unlike terms?","o":["2ab and 2a","ab and −3ab","x² and 5x²","4 and −9"],"a":0,"why":"The first term contains both a and b, while the second contains only a."},{"q":"Are 6r and −11r like terms?","o":["No, because coefficients differ","Yes, because both have r","No, because one is negative","Only if r = 1"],"a":1,"why":"Different coefficients and signs do not stop terms from being like."},{"q":"Which set contains only like terms?","o":["3x², −x, 10x²","3xy, −x², 10xy","3x², −x², 10x²","3x, −x, 10x²"],"a":2,"why":"All three terms in the correct set have variable part x²."},{"q":"Which term is unlike both 4ab and −9ba?","o":["7ab","−2ba","0.5ab","3a²b"],"a":3,"why":"4ab and −9ba both have variable part ab; a²b has a different power of a."},{"q":"Which pair can be combined as like terms?","o":["8mn and −3nm","8mn and −3m","8m²n and −3mn","8m and −3n"],"a":0,"why":"mn and nm are the same variable part."},{"q":"Which term is unlike 5x³y²?","o":["−x³y²","2x²y³","9y²x³","0.4x³y²"],"a":1,"why":"The powers of x and y are switched, so x³y² and x²y³ are unlike."},{"q":"Which expression has exactly two groups of like terms: x-terms and y-terms?","o":["2x + 5x² − 3x + y","2xy + 5y − 3x + y²","2x + 5y − 3x + y","2x² + 5y − 3x³ + y"],"a":2,"why":"The x terms form one group and the y terms form another."},{"q":"Which term is like −6m²n?","o":["12mn²","12m²","12mn","12nm²"],"a":3,"why":"Rearranging factors gives the same variable part m²n."},{"q":"Which pair is unlike even though the coefficients are equal?","o":["7x and 7x²","7x and −2x","7ab and 3ba","7 and 2"],"a":0,"why":"Equal coefficients do not make terms like; variable parts must also match."},{"q":"Which collection can be grouped together as one like-term group?","o":["4a²b, −a², 9ab²","4a²b, −a²b, 9ba²","4ab, −a²b, 9a²","4a²b, −ab², 9ab"],"a":1,"why":"Each term has exactly a²b as its variable part."},{"q":"Which term is like 0.25z?","o":["−100z²","−100","−100z","−100zy"],"a":2,"why":"Any coefficient is allowed if the variable part is z."},{"q":"Which statement about like terms is true?","o":["They must have the same coefficient","They must both be positive","They must have the same number of letters only","They must have identical variables and exponents"],"a":3,"why":"The complete variable part, including every exponent, must match."},{"q":"Simplify 7x + 3y − 2x + 5y by combining like terms.","o":["5x + 8y","5xy + 8","9x + 2y","5x + 2y"],"a":0,"why":"Combine x terms: 7x − 2x = 5x; combine y terms: 3y + 5y = 8y."},{"q":"Which term is not like the others: 3a²b, −5ba², 8a²b, 2ab²?","o":["3a²b","2ab²","−5ba²","8a²b"],"a":1,"why":"The first three have variable part a²b; 2ab² has variable part ab²."},{"q":"Simplify 4p² − 7p + 3p² + 2p.","o":["7p² + 9p","p² − 5p","7p² − 5p","7p − 5p²"],"a":2,"why":"Combine p² terms to get 7p² and p terms to get −5p."},{"q":"A student combines 5x and 2x² to get 7x³. What is the correct conclusion?","o":["The sum is 7x³","The sum is 10x²","They are like because both contain x","They are unlike and cannot be combined into one term"],"a":3,"why":"x and x² have different exponents, so they are unlike terms."},{"q":"Simplify 6ab − 2ba + 4a − 9a.","o":["4ab − 5a","4ab + 13a","8ab − 5a","4a²b − 5a"],"a":0,"why":"Since ba = ab, 6ab − 2ba = 4ab; 4a − 9a = −5a."},{"q":"Which expression simplifies to 3x² + 2xy − y²?","o":["5x² + 2x² + 7xy − 5xy − y²","5x² − 2x² + 7xy − 5xy − y²","3x² + 2xy + y²","3x + 2xy − y²"],"a":1,"why":"5x² − 2x² = 3x² and 7xy − 5xy = 2xy; the −y² term remains."},{"q":"How many distinct like-term groups are in 2a + 3b + 4a² + 5ab − b + 7a?","o":["Three","Five","Four","Six"],"a":2,"why":"The groups are a terms, b terms, a² terms, and ab terms."},{"q":"Simplify −3m²n + 8nm² − 2mn².","o":["3m²n − 2mn²","5mn²","3m²n + 2mn²","5m²n − 2mn²"],"a":3,"why":"−3m²n and 8nm² are like, giving 5m²n; mn² is a separate group."},{"q":"Which statement correctly compares 2xy² and 2x²y?","o":["They are unlike because the exponents on x and y differ","They are like because both use x and y","They are like because both coefficients are 2","They are unlike only when x and y are unequal"],"a":0,"why":"Like terms require each matching variable to have the same exponent."},{"q":"Simplify 9u − 4v + 6u + 10v − 3u.","o":["18u + 6v","12u + 6v","12u + 10v","12uv + 6"],"a":1,"why":"For u: 9 + 6 − 3 = 12; for v: −4 + 10 = 6."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function clearChildren(node){while(node.firstChild)node.removeChild(node.firstChild);}
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 clearChildren($('options'));
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.appendChild(letter);b.appendChild(label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Like and Unlike Terms Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261104-physics-path-layout-v2" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.appendChild(q);item.appendChild(yours);item.appendChild(correct);item.appendChild(why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 clearChildren($('finishSlot'));$('finishSlot').appendChild(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';clearChildren($('finishSlot'));render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
