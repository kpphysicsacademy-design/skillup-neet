<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"A shape has a line of symmetry when folding it along that line makes the two halves...","o":["match exactly","have equal area only","point in the same direction","become the same colour"],"a":0,"e":"A symmetry line divides a figure into matching mirror halves.","v":"line-symmetry"},{"d":"BASIC","q":"How many lines of symmetry does a square have?","o":["1","2","4","8"],"a":2,"e":"A square has two diagonals and two lines through the midpoints of opposite sides.","v":"line-symmetry"},{"d":"BASIC","q":"How many lines of symmetry does a non-square rectangle have?","o":["1","2","3","4"],"a":1,"e":"Its horizontal and vertical midlines divide it into matching halves.","v":"line-symmetry"},{"d":"BASIC","q":"How many lines of symmetry does an equilateral triangle have?","o":["1","2","3","4"],"a":2,"e":"Each vertex-to-opposite-side midpoint line is a symmetry line.","v":"line-symmetry"},{"d":"BASIC","q":"How many lines of symmetry does a circle have?","o":["0","1","4","Infinitely many"],"a":3,"e":"Every diameter is a line of symmetry, and a circle has infinitely many diameters.","v":"line-symmetry"},{"d":"BASIC","q":"How many lines of symmetry does a regular pentagon have?","o":["2","3","5","10"],"a":2,"e":"A regular polygon has as many symmetry lines as sides.","v":"line-symmetry"},{"d":"BASIC","q":"Which capital letter has vertical line symmetry in its usual block form?","o":["A","F","G","R"],"a":0,"e":"The two sides of the block letter A mirror across a vertical line.","v":"line-symmetry"},{"d":"BASIC","q":"Which shape has exactly one line of symmetry?","o":["A non-square rectangle","A typical isosceles triangle","A scalene triangle","A parallelogram"],"a":1,"e":"An isosceles triangle has one line through its apex and base midpoint.","v":"line-symmetry"},{"d":"BASIC","q":"A line of symmetry is also called a line of...","o":["rotation","reflection","measurement","translation"],"a":1,"e":"It acts as the mirror line for a reflection.","v":"line-symmetry"},{"d":"BASIC","q":"How many lines of symmetry does a regular hexagon have?","o":["3","4","5","6"],"a":3,"e":"A regular hexagon has three lines through opposite vertices and three through opposite side midpoints.","v":"line-symmetry"},{"d":"MEDIUM","q":"How many lines of symmetry does a scalene triangle have?","o":["0","1","2","3"],"a":0,"e":"All side lengths differ, so no fold can match its halves.","v":"line-symmetry"},{"d":"MEDIUM","q":"Which shape has exactly two lines of symmetry?","o":["Square","Non-square rectangle","Equilateral triangle","Regular pentagon"],"a":1,"e":"A non-square rectangle has only its two midlines as symmetry lines.","v":"line-symmetry"},{"d":"MEDIUM","q":"How many lines of symmetry does a regular octagon have?","o":["4","6","8","16"],"a":2,"e":"A regular n-sided polygon has n symmetry lines.","v":"line-symmetry"},{"d":"MEDIUM","q":"Which word best describes two halves on opposite sides of a symmetry line?","o":["Mirror images","Parallel copies","Equal-sized rotations","Translated copies"],"a":0,"e":"Reflection across the line maps each point to its mirror point.","v":"line-symmetry"},{"d":"MEDIUM","q":"A heart symbol drawn in its usual simple form is typically symmetric about which line?","o":["Horizontal","Vertical","Both horizontal and vertical","Neither"],"a":1,"e":"The left and right sides mirror across a vertical axis.","v":"line-symmetry"},{"d":"MEDIUM","q":"Which capital letter has horizontal symmetry in a common block style?","o":["C","A","F","L"],"a":0,"e":"A block C can have matching upper and lower halves across a horizontal line.","v":"line-symmetry"},{"d":"MEDIUM","q":"A figure has one vertical and one horizontal symmetry line. What must be true of its reflected halves?","o":["Each line divides the figure into matching halves","The figure must be a triangle","It has exactly one corner","Its sides must all be different"],"a":0,"e":"Each stated symmetry line separately creates two matching mirror halves.","v":"line-symmetry"},{"d":"MEDIUM","q":"Where does a point on a symmetry line move when reflected across that same line?","o":["It moves twice as far","It stays in place","It moves to the centre","It changes direction by 90°"],"a":1,"e":"Points on the mirror line have zero distance from it and remain fixed.","v":"line-symmetry"},{"d":"MEDIUM","q":"How many symmetry lines does a regular triangle have?","o":["1","2","3","6"],"a":2,"e":"A regular triangle is equilateral and has one symmetry line from each vertex.","v":"line-symmetry"},{"d":"MEDIUM","q":"Which shape has no line symmetry?","o":["Circle","Square","A general parallelogram that is not a rectangle or rhombus","Equilateral triangle"],"a":2,"e":"A general parallelogram has rotational symmetry but no reflection line.","v":"line-symmetry"},{"d":"HARD","q":"A regular polygon has 9 sides. How many lines of symmetry does it have?","o":["3","6","9","18"],"a":2,"e":"A regular polygon has one symmetry line for each side.","v":"line-symmetry"},{"d":"HARD","q":"A square is rotated by 90 degrees about its centre. Which statement about its appearance is true?","o":["It no longer matches itself","It matches its original outline","It becomes a rectangle only","It has fewer symmetry lines"],"a":1,"e":"A square maps onto itself after a quarter-turn.","v":"line-symmetry"},{"d":"HARD","q":"A rectangle is 8 cm wide and 5 cm tall. Which line is a symmetry line?","o":["A diagonal","A vertical line through its centre","A line through one corner parallel to a side","Any line at 45 degrees"],"a":1,"e":"The central vertical line divides the rectangle into equal mirror halves.","v":"line-symmetry"},{"d":"HARD","q":"A regular decagon has how many lines of symmetry?","o":["5","8","10","20"],"a":2,"e":"A regular decagon has ten sides and ten symmetry lines.","v":"line-symmetry"},{"d":"HARD","q":"A shape has exactly 4 lines of symmetry. Which could it be?","o":["A non-square rectangle","A square","A scalene triangle","A typical isosceles triangle"],"a":1,"e":"A square has four symmetry lines: two midlines and two diagonals.","v":"line-symmetry"},{"d":"HARD","q":"Which statement about a circle's symmetry lines is accurate?","o":["Only vertical diameters work","Only horizontal diameters work","Every diameter is a symmetry line","A circle has exactly two symmetry lines"],"a":2,"e":"Any diameter divides the circle into matching semicircles.","v":"line-symmetry"},{"d":"HARD","q":"A regular hexagon is folded along a line through opposite vertices. What happens?","o":["Its halves match","Only the edges match","Its halves have different areas","It folds into three pieces"],"a":0,"e":"A line through opposite vertices is one of a regular hexagon's symmetry lines.","v":"line-symmetry"},{"d":"HARD","q":"A figure has no line symmetry. What does this tell us?","o":["It cannot have rotational symmetry","No reflection line divides it into matching halves","It has no equal sides","It must be curved"],"a":1,"e":"No line symmetry means no reflection axis produces matching halves.","v":"line-symmetry"},{"d":"HARD","q":"Which has more lines of symmetry: a regular pentagon or a regular hexagon, and by how many?","o":["Pentagon by 1","Hexagon by 1","Hexagon by 2","They have the same number"],"a":1,"e":"They have 5 and 6 lines respectively, so the hexagon has one more.","v":"line-symmetry"},{"d":"HARD","q":"A rectangle is not a square. Why are its diagonals not lines of symmetry?","o":["They are too short","Reflecting across a diagonal does not map its unequal side lengths onto matching positions","Diagonals never cross at the centre","A rectangle has no symmetry"],"a":1,"e":"A diagonal reflection would interchange the unequal length and width, so the rectangle would not match.","v":"line-symmetry"}]let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Identify and count lines of symmetry</strong><small>Compare mirror-image halves</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Classify symmetric and asymmetric shapes</strong><small>Reason about symmetry in polygons</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply line symmetry to shapes and reflections</strong><small>Apply rectangle area in real life</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
