<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
 .skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}.skills-result{margin-top:14px;text-align:left}.skills-result h3{margin:0 0 8px;font-size:1rem}.skills-result .skill-item{margin-top:7px}.skill-item.unlocked{border-color:var(--green);color:var(--green2);background:#174b42} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}.diagram .accent{stroke:#58d6a3}.diagram .blue{stroke:#91b7ff}.diagram .gold{stroke:#ffd27a} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Equations</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Equation Skills"><div class="skill-title">🎯 Angle Skills</div><div class="skill-list"><div class="skill-item">Identify linear pairs</div><div class="skill-item">Calculate missing supplementary angles</div><div class="skill-item">Solve linear-pair equations</div></div></section></div>
<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"A linear pair consists of two adjacent angles whose non-common arms are…","o":["Opposite rays","Parallel rays","Perpendicular rays","Equal rays"],"a":0,"e":"Opposite rays form a straight line, which is the defining extra condition for a linear pair.","v":"linear-pairs"},{"d":"BASIC","q":"One angle in a linear pair is 68°. Find the other angle.","o":["22°","112°","68°","122°"],"a":1,"e":"Angles in a linear pair total 180°; 180° − 68° = 112°.","v":"linear-pairs"},{"d":"BASIC","q":"Which sum must the measures of a linear pair have?","o":["90°","120°","180°","360°"],"a":2,"e":"A linear pair forms a straight angle, which measures 180°.","v":"linear-pairs"},{"d":"BASIC","q":"If two adjacent angles measure 90° and 90°, do they form a linear pair when their non-common arms are opposite rays?","o":["No, because both are right angles","Only if their vertices differ","Only if their common arm is horizontal","Yes"],"a":3,"e":"They are adjacent, total 180°, and the non-common arms are opposite rays.","v":"linear-pairs"},{"d":"BASIC","q":"A linear pair has one angle measuring 125°. What is the other?","o":["55°","45°","65°","75°"],"a":0,"e":"180° − 125° = 55°.","v":"linear-pairs"},{"d":"BASIC","q":"Which condition distinguishes a linear pair from adjacent angles in general?","o":["Both angles are acute","Their non-common arms are opposite rays","They have equal measures","They share no vertex"],"a":1,"e":"Adjacent angles need not form a straight line; a linear pair has opposite non-common rays.","v":"linear-pairs"},{"d":"BASIC","q":"If one angle of a linear pair is 90°, the other angle is…","o":["45°","60°","90°","180°"],"a":2,"e":"180° − 90° = 90°.","v":"linear-pairs"},{"d":"BASIC","q":"Two adjacent angles measure 70° and 110°. If their non-common arms are opposite rays, they form a…","o":["Complementary pair","Vertically opposite pair","Pair of equal angles","Linear pair"],"a":3,"e":"They are adjacent and total 180°, with opposite non-common rays.","v":"linear-pairs"},{"d":"BASIC","q":"An angle and its linear-pair partner are supplementary. This means their measures total…","o":["180°","90°","270°","360°"],"a":0,"e":"Supplementary angles have measures adding to 180°.","v":"linear-pairs"},{"d":"BASIC","q":"One angle of a linear pair is 35°. Find its partner.","o":["55°","145°","125°","155°"],"a":1,"e":"180° − 35° = 145°.","v":"linear-pairs"},{"d":"MEDIUM","q":"Two angles in a linear pair are (3x + 10)° and (2x + 20)°. Find x.","o":["20","25","30","35"],"a":2,"e":"3x + 10 + 2x + 20 = 180 gives 5x = 150, so x = 30.","v":"linear-pairs"},{"d":"MEDIUM","q":"The angles in a linear pair are (x + 25)° and (2x + 5)°. Find the smaller angle.","o":["65°","85°","95°","75°"],"a":3,"e":"x + 25 + 2x + 5 = 180 gives x = 50; angles are 75° and 105°, so the smaller is 75°.","v":"linear-pairs"},{"d":"MEDIUM","q":"A linear pair has angles in the ratio 2:7. Find the smaller angle.","o":["40°","20°","30°","70°"],"a":0,"e":"Nine parts total 180°, each part is 20°, so the smaller is 2 × 20° = 40°.","v":"linear-pairs"},{"d":"MEDIUM","q":"One angle of a linear pair is 24° more than the other. Find the smaller angle.","o":["68°","78°","88°","102°"],"a":1,"e":"Let smaller be x; x + (x + 24) = 180, so x = 78°.","v":"linear-pairs"},{"d":"MEDIUM","q":"The angles in a linear pair are (4x − 10)° and (2x + 10)°. Find the larger angle.","o":["70°","80°","110°","120°"],"a":2,"e":"4x − 10 + 2x + 10 = 180 gives x = 30; angles are 110° and 70°.","v":"linear-pairs"},{"d":"MEDIUM","q":"One angle of a linear pair is 3 times the other. Find the larger angle.","o":["45°","90°","120°","135°"],"a":3,"e":"Let smaller be x; x + 3x = 180 gives x = 45°, so the larger is 135°.","v":"linear-pairs"},{"d":"MEDIUM","q":"Two angles form a linear pair. If one is 5x° and the other is (x + 30)°, find x.","o":["25","20","30","35"],"a":0,"e":"5x + x + 30 = 180 gives 6x = 150 and x = 25.","v":"linear-pairs"},{"d":"MEDIUM","q":"A linear pair consists of angles (2x + 15)° and (3x − 10)°. Find the smaller angle.","o":["76.5°","85°","95°","103.5°"],"a":1,"e":"2x + 15 + 3x − 10 = 180 gives x = 35; angles are 85° and 95°, so the smaller is 85°.","v":"linear-pairs"},{"d":"MEDIUM","q":"Two angles form a linear pair. The larger angle is 4 times the smaller. Find the smaller angle.","o":["30°","45°","36°","60°"],"a":2,"e":"Let smaller be x; x + 4x = 180 gives x = 36°.","v":"linear-pairs"},{"d":"MEDIUM","q":"If an angle in a linear pair increases by 15°, what must happen to its partner's measure?","o":["Increase by 15°","Stay the same","Double","Decrease by 15°"],"a":3,"e":"Their total remains 180°, so an increase of 15° in one requires a decrease of 15° in the other.","v":"linear-pairs"},{"d":"HARD","q":"A linear pair measures (7x − 5)° and (2x + 5)°. Find the larger angle.","o":["135°","130°","140°","145°"],"a":0,"e":"7x − 5 + 2x + 5 = 180 gives x = 20; angles are 135° and 45°, so the larger is 135°.","v":"linear-pairs"},{"d":"HARD","q":"The larger angle in a linear pair is 5 times the smaller. Find the smaller angle.","o":["20°","30°","36°","45°"],"a":1,"e":"Let smaller be x; x + 5x = 180 gives x = 30°.","v":"linear-pairs"},{"d":"HARD","q":"Two angles in a linear pair differ by 52°. Find the larger angle.","o":["64°","90°","116°","128°"],"a":2,"e":"Let larger L and smaller S: L + S = 180 and L − S = 52, so L = 116°.","v":"linear-pairs"},{"d":"HARD","q":"A linear pair has angles (3x + 12)° and (5x − 4)°. Find the smaller angle.","o":["80°","95°","103.5°","76.5°"],"a":3,"e":"3x + 12 + 5x − 4 = 180 gives x = 21.5; angles are 76.5° and 103.5°, so the smaller is 76.5°.","v":"linear-pairs"},{"d":"HARD","q":"One angle in a linear pair is 20° less than twice the other. Find the smaller angle.","o":["66⅔°","60°","73⅓°","80°"],"a":0,"e":"Let smaller be x and larger be 2x − 20; 3x − 20 = 180 gives x = 66⅔°.","v":"linear-pairs"},{"d":"HARD","q":"Three adjacent angles on a straight line are x°, (x + 20)° and (2x − 10)°. Find the largest angle.","o":["65°","75°","85°","95°"],"a":1,"e":"x + (x + 20) + (2x − 10) = 180 gives x = 42.5; the angles are 42.5°, 62.5° and 75°, so the largest is 75°.","v":"linear-pairs"},{"d":"HARD","q":"Two linear-pair angles are in the ratio 7:11. Find the larger angle.","o":["70°","90°","110°","100°"],"a":2,"e":"Eighteen parts total 180°, each part is 10°, so the larger is 11 × 10° = 110°.","v":"linear-pairs"},{"d":"HARD","q":"A linear pair has angles (x + 40)° and (3x − 20)°. Find the smaller angle.","o":["70°","90°","100°","80°"],"a":3,"e":"x + 40 + 3x − 20 = 180 gives x = 40; the angles are 80° and 100°, so the smaller is 80°.","v":"linear-pairs"},{"d":"HARD","q":"One angle in a linear pair is 7 times the other. What is the difference between them?","o":["135°","90°","105°","120°"],"a":0,"e":"Let smaller be x; 8x = 180, so x = 22.5° and larger = 157.5°; difference = 135°.","v":"linear-pairs"},{"d":"HARD","q":"The larger of two linear-pair angles is 36° more than the smaller. Find the smaller angle.","o":["62°","72°","82°","92°"],"a":1,"e":"Let smaller x; x + (x + 36) = 180, so x = 72°.","v":"linear-pairs"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}const visuals={
balance:'',
blocks:'',
bars:'',
picture:''
};function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🔢</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+'<div class="skill-item '+(correct>=8?'unlocked':'')+'">'+(correct>=8?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Identify linear pairs</div>'+'<div class="skill-item '+(correct>=18?'unlocked':'')+'">'+(correct>=18?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Calculate missing supplementary angles</div>'+'<div class="skill-item '+(correct>=24?'unlocked':'')+'">'+(correct>=24?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Solve linear-pair equations</div>'+'</div></div>' ;$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script>
