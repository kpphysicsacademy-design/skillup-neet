<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What is the sum of angles on a straight line?","o":["90°","180°","270°","360°"],"a":1,"e":"Angles forming a straight line add up to 180°."},{"d":"BASIC","q":"What is the sum of angles around a point?","o":["90°","180°","270°","360°"],"a":3,"e":"Angles around a point make one full turn, or 360°."},{"d":"BASIC","q":"Vertically opposite angles are:","o":["Always equal","Always supplementary","Always complementary","Always unequal"],"a":0,"e":"Vertically opposite angles formed by intersecting lines are equal."},{"d":"BASIC","q":"If one angle on a straight line is 65°, what is the adjacent angle?","o":["65°","115°","125°","25°"],"a":1,"e":"A linear pair sums to 180°; 180°−65°=115°."},{"d":"BASIC","q":"Two angles whose sum is 90° are called:","o":["Supplementary","Vertically opposite","Complementary","Adjacent only"],"a":2,"e":"Complementary angles add up to 90°."},{"d":"BASIC","q":"Two angles whose sum is 180° are called:","o":["Complementary","Supplementary","Reflex","Vertical"],"a":1,"e":"Supplementary angles add up to 180°."},{"d":"BASIC","q":"If two lines intersect, how many pairs of vertically opposite angles are formed?","o":["One","Two","Three","Four"],"a":1,"e":"Two pairs of vertically opposite angles are formed."},{"d":"BASIC","q":"An angle measuring 90° is called:","o":["Acute","Obtuse","Right","Reflex"],"a":2,"e":"A right angle measures exactly 90°."},{"d":"BASIC","q":"An angle measuring 125° is:","o":["Acute","Right","Obtuse","Straight"],"a":2,"e":"An obtuse angle is greater than 90° and less than 180°."},{"d":"BASIC","q":"A straight angle measures:","o":["90°","120°","180°","360°"],"a":2,"e":"A straight angle measures 180°."},{"d":"MEDIUM","q":"Two adjacent angles form a linear pair. If one is 3x° and the other is 60°, find x.","o":["20","30","40","60"],"a":2,"e":"3x+60=180, so 3x=120 and x=40."},{"d":"MEDIUM","q":"Vertically opposite angles measure (2x+10)° and 70°. Find x.","o":["20","30","40","50"],"a":1,"e":"Set 2x+10=70; then x=30."},{"d":"MEDIUM","q":"Angles around a point are 80°, 110°, and x°. Find x if these are the only three angles.","o":["150°","160°","170°","180°"],"a":2,"e":"80+110+x=360, so x=170°."},{"d":"MEDIUM","q":"An angle is 35°. What is its complement?","o":["45°","55°","145°","155°"],"a":1,"e":"90°−35°=55°."},{"d":"MEDIUM","q":"An angle is 142°. What is its supplement?","o":["28°","38°","48°","58°"],"a":1,"e":"180°−142°=38°."},{"d":"MEDIUM","q":"Two intersecting lines form one angle of 48°. What is the vertically opposite angle?","o":["42°","48°","132°","142°"],"a":1,"e":"Vertically opposite angles are equal, so the angle is 48°."},{"d":"MEDIUM","q":"One angle of a linear pair is twice the other. What is the smaller angle?","o":["60°","90°","120°","45°"],"a":0,"e":"Let the smaller be x; x+2x=180°, so x=60°."},{"d":"MEDIUM","q":"Three angles around a point are 90°, 120°, and x°. Find x.","o":["120°","140°","150°","160°"],"a":2,"e":"90+120+x=360, so x=150°."},{"d":"MEDIUM","q":"If an angle is 4x° and its complement is 20°, find x.","o":["15","17.5","20","22.5"],"a":1,"e":"4x+20=90, so 4x=70 and x=17.5."},{"d":"MEDIUM","q":"Two vertically opposite angles are (5x−10)° and (3x+30)°. Find x.","o":["10","15","20","25"],"a":2,"e":"5x−10=3x+30 gives 2x=40, so x=20."},{"d":"HARD","q":"Two adjacent angles on a straight line are (4x+5)° and (2x−5)°. Find x.","o":["20","25","30","35"],"a":1,"e":"(4x+5)+(2x−5)=180 gives 6x=180, so x=30°."},{"d":"HARD","q":"Two vertically opposite angles are (3x+15)° and (5x−25)°. Find the angle when x is found.","o":["60°","75°","90°","105°"],"a":1,"e":"3x+15=5x−25 gives x=20, so the angle is 75°."},{"d":"HARD","q":"Four angles around a point are x°, 2x°, 3x°, and 4x°. Find the largest angle.","o":["72°","108°","144°","180°"],"a":2,"e":"10x=360 gives x=36°, so largest is 4x=144°."},{"d":"HARD","q":"A linear pair has angles (x+20)° and (2x+10)°. Find the larger angle.","o":["60°","80°","110°","120°"],"a":2,"e":"3x+30=180 gives x=50; angles are 70° and 110°."},{"d":"HARD","q":"An angle is 25° less than its supplement. Find the angle.","o":["77.5°","85°","102.5°","115°"],"a":0,"e":"Let the angle be x; x is 25° less than its supplement: x=180−x−25, so x=77.5°."},{"d":"HARD","q":"Two angles are complementary in the ratio 2:3. Find the larger angle.","o":["36°","45°","54°","60°"],"a":2,"e":"Five parts equal 90°, so one part is 18° and the larger is 3×18°=54°."},{"d":"HARD","q":"Vertically opposite angles are (7x−15)° and (4x+30)°. Find the angle.","o":["75°","90°","95°","105°"],"a":1,"e":"7x−15=4x+30 gives x=15, so the angle is 90°."},{"d":"HARD","q":"An angle and its complement differ by 18°. Find the larger angle.","o":["36°","45°","54°","63°"],"a":2,"e":"The larger angle x differs from its complement by 18°: x−(90−x)=18, so x=54°."},{"d":"HARD","q":"Angles around a point are in ratio 1:2:3. What is the largest angle?","o":["60°","120°","180°","240°"],"a":1,"e":"Six parts equal 360°, each part is 60°; largest is 3×60°=180°."},{"d":"HARD","q":"Two supplementary angles are in ratio 4:5. Find the smaller angle.","o":["40°","60°","80°","100°"],"a":2,"e":"Nine parts equal 180°, each is 20°; smaller is 4×20°=80°."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Master lines and angles</strong><small>Classify angle pairs</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Calculate complementary and supplementary angles</strong><small>Use vertically opposite angles</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve angle equations</strong><small>Solve multi-step angle problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
