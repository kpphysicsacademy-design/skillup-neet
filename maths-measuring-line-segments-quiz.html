il"},{"d":"BASIC","q":"How many millimetres make 1 centimetre?","o":["10 mm","100 mm","1,000 mm","5 mm"],"a":0,"e":"One centimetre equals ten millimetres.","v":"scale"},{"d":"BASIC","q":"A segment begins at 0 cm and ends at 4 cm. What is its length?","o":["0 cm","2 cm","4 cm","5 cm"],"a":2,"e":"Subtract the start reading from the end reading: 4 − 0 = 4 cm.","v":"ruler4"},{"d":"BASIC","q":"When using a ruler, where should one endpoint be placed if the zero mark is clear?","o":["At the 1 cm mark","At the zero mark","At the ruler's edge regardless of scale","At the 10 cm mark"],"a":1,"e":"Align the first endpoint with the zero graduation, not merely the physical edge.","v":"ruler"},{"d":"BASIC","q":"A line segment measures 8 cm. How many centimetres long is it?","o":["80 cm","0.8 cm","8 cm","800 cm"],"a":2,"e":"The measurement is already in centimetres: 8 cm.","v":"segment8"},{"d":"BASIC","q":"Which is the longest length?","o":["25 mm","2 cm","3 cm","18 mm"],"a":2,"e":"3 cm = 30 mm, which is longer than 25 mm, 20 mm and 18 mm.","v":"compare"},{"d":"BASIC","q":"What is the distance between ruler readings 2 cm and 7 cm?","o":["9 cm","5 cm","7 cm","2 cm"],"a":1,"e":"Length = 7 − 2 = 5 cm.","v":"offset"},{"d":"BASIC","q":"Which statement describes a line segment?","o":["It has one endpoint","It extends forever in both directions","It has two endpoints and a fixed length","It is always curved"],"a":2,"e":"A line segment is part of a line bounded by two endpoints.","v":"segment"},{"d":"MEDIUM","q":"A segment starts at 1 cm and ends at 9 cm on a ruler. What is its length?","o":["10 cm","8 cm","9 cm","1 cm"],"a":1,"e":"Subtract the start reading: 9 − 1 = 8 cm.","v":"offset"},{"d":"MEDIUM","q":"Convert 4.5 cm to millimetres.","o":["45 mm","4.5 mm","450 mm","0.45 mm"],"a":0,"e":"Multiply centimetres by 10: 4.5 cm = 45 mm.","v":"scale"},{"d":"MEDIUM","q":"A line segment is 72 mm long. How long is it in centimetres?","o":["720 cm","7.2 cm","0.72 cm","72 cm"],"a":1,"e":"Divide millimetres by 10: 72 mm = 7.2 cm.","v":"scale"},{"d":"MEDIUM","q":"Two adjacent segments are 3 cm and 5 cm long. What is their combined length when joined end to end?","o":["8 cm","15 cm","2 cm","5 cm"],"a":0,"e":"Add the lengths: 3 + 5 = 8 cm.","v":"joined"},{"d":"MEDIUM","q":"A ruler reading changes from 2.4 cm to 6.9 cm. Find the segment length.","o":["9.3 cm","4.5 cm","4.7 cm","6.9 cm"],"a":1,"e":"The measured length is 6.9 − 2.4 = 4.5 cm.","v":"decimal"},{"d":"MEDIUM","q":"Which length is equal to 1.2 metres?","o":["12 cm","120 cm","1,200 cm","0.12 cm"],"a":1,"e":"One metre is 100 cm, so 1.2 m = 120 cm.","v":"scale"},{"d":"MEDIUM","q":"A 10 cm segment is split into parts of 3.5 cm and another length. Find the missing length.","o":["6.5 cm","7.5 cm","13.5 cm","3.5 cm"],"a":0,"e":"Subtract the known part from the total: 10 − 3.5 = 6.5 cm.","v":"joined"},{"d":"MEDIUM","q":"A segment measures 6 cm 4 mm. Express this in millimetres.","o":["10 mm","64 mm","604 mm","6.4 mm"],"a":1,"e":"6 cm = 60 mm; add 4 mm to get 64 mm.","v":"scale"},{"d":"MEDIUM","q":"A ribbon is 35 cm long. A 12 cm piece is cut off. How much remains?","o":["47 cm","23 cm","24 cm","17 cm"],"a":1,"e":"Remaining length = 35 − 12 = 23 cm.","v":"ribbon"},{"d":"MEDIUM","q":"Which pair is the same length?","o":["3 cm and 300 mm","4.2 cm and 42 mm","15 mm and 15 cm","2 m and 20 cm"],"a":1,"e":"4.2 cm equals 42 mm because 1 cm = 10 mm; the other pairs are unequal.","v":"compare"},{"d":"HARD","q":"A segment's endpoints align with 1.6 cm and 8.3 cm. What is its length?","o":["9.9 cm","6.7 cm","7.3 cm","8.3 cm"],"a":1,"e":"Subtract the initial reading: 8.3 − 1.6 = 6.7 cm.","v":"decimal"},{"d":"HARD","q":"A 2.75 cm segment is measured in millimetres. What is the result?","o":["27.5 mm","2.75 mm","275 mm","0.275 mm"],"a":0,"e":"Multiply by 10: 2.75 cm = 27.5 mm.","v":"scale"},{"d":"HARD","q":"Three pieces of wire measure 12.5 cm, 8.75 cm and 6.25 cm. What is their total length?","o":["27.5 cm","26.5 cm","27 cm","28.5 cm"],"a":0,"e":"12.5 + 8.75 + 6.25 = 27.5 cm.","v":"joined"},{"d":"HARD","q":"A strip is 1 m long. Two pieces of 28 cm and 35 cm are cut from it. How much remains?","o":["63 cm","47 cm","37 cm","53 cm"],"a":2,"e":"1 m = 100 cm; remaining = 100 − 28 − 35 = 37 cm.","v":"ribbon"},{"d":"HARD","q":"A segment measures 5.08 cm. Express it in millimetres.","o":["5.08 mm","50.8 mm","508 mm","0.508 mm"],"a":1,"e":"5.08 × 10 = 50.8 mm.","v":"scale"},{"d":"HARD","q":"Segment AB is 7.4 cm. Segment BC is 2.85 cm and they join at B without overlap. Find AC.","o":["10.25 cm","4.55 cm","9.25 cm","10.15 cm"],"a":0,"e":"Joined segments add: AC = 7.4 + 2.85 = 10.25 cm.","v":"joined"},{"d":"HARD","q":"A ruler has a damaged zero mark. An object's ends read 2.3 cm and 11.8 cm. What is its length?","o":["14.1 cm","9.5 cm","11.8 cm","2.3 cm"],"a":1,"e":"Use the difference between readings: 11.8 − 2.3 = 9.5 cm.","v":"decimal"},{"d":"HARD","q":"A 4.6 cm segment is extended by 18 mm. What is the new length in centimetres?","o":["6.4 cm","22.6 cm","5.4 cm","4.78 cm"],"a":0,"e":"18 mm = 1.8 cm; 4.6 + 1.8 = 6.4 cm.","v":"joined"},{"d":"HARD","q":"A wire is 2.4 m long. How many 30 cm pieces can be cut from it with no leftover?","o":["6","7","8","9"],"a":2,"e":"2.4 m = 240 cm; 240 ÷ 30 = 8 pieces.","v":"scale"},{"d":"HARD","q":"A segment of 9.2 cm is divided into three parts: 2.75 cm, 3.1 cm and the remainder. Find the remainder.","o":["3.35 cm","3.45 cm","3.25 cm","4.35 cm"],"a":0,"e":"The known parts total 5.85 cm; 9.2 − 5.85 = 3.35 cm.","v":"joined"}];let index=0,selected=-1,locked=false,finished=false,xp=0,streak=0,bestStreak=0,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function visual(kind){const titles={ruler6:'Ruler: 0 to 6 cm',ruler:'Ruler scale',pencil:'Pencil length',scale:'Centimetre and millimetre scale',ruler4:'Ruler: 0 to 4 cm',segment8:'8 cm line segment',compare:'Compare lengths',offset:'Offset ruler readings',segment:'Line segment',joined:'Joined line segments',decimal:'Decimal ruler readings',ribbon:'Ribbon length'};let marks='';for(let i=0;i<=12;i++){const x=25+i*24;marks+='<path d="M'+x+' 44 v'+(i%2?9:15)+'" stroke="#71808d"/><text x="'+x+'" y="78" text-anchor="middle" font-size="9" fill="#263746">'+(i/2)+'</text>'}return '<div class="diagram"><svg viewBox="0 0 340 100" role="img" aria-label="'+(titles[kind]||'Measurement diagram')+'"><rect x="20" y="28" width="300" height="50" rx="5" fill="#fff" stroke="#cbd8df"/>'+marks+'</svg><div class="small">'+(titles[kind]||'Measurement illustration')+'</div></div>'}function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';$('percent').textContent=Math.round(p)+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)))}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='Question '+(index+1)+' of '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML=(q.v?visual(q.v):'')+'<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-letter="'+String.fromCharCode(65+i)+'" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress()}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;streak++;bestStreak=Math.max(bestStreak,streak);xp+=10;$('xp').textContent=xp;$('streak').textContent=streak}else{streak=0;$('streak').textContent=0}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong')});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return}if(index<questions.length-1){index++;render();return}results()}function results(){finished=true;$('bar').style.width='100%';$('percent').textContent='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">📏</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>🔥 Best streak: '+bestStreak+'</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+[['Read ruler markings accurately',8],['Convert between cm, mm and m',18],['Add and compare segment lengths',24]].map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;streak=0;bestStreak=0;correct=0;$('xp').textContent=0;$('streak').textContent=0;render()}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return}act()});render()})();</script><script src="/shared-nav.js?v=20261017-duolingo-standard-v1"></script></body></html>
