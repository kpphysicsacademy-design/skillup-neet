<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"In triangle ABC, D is the midpoint of BC. Which segment is a median from vertex A?","o":["AB","AC","AD","BC"],"a":2,"e":"A median joins a vertex to the midpoint of the opposite side.","v":"median-altitude"},{"d":"BASIC","q":"An altitude of a triangle is drawn from a vertex and meets the opposite side at…","o":["Any point without a condition","A right angle","The midpoint always","An angle bisector"],"a":1,"e":"An altitude is perpendicular to the opposite side or its extended line.","v":"median-altitude"},{"d":"BASIC","q":"In triangle PQR, M is the midpoint of QR. Which statement shows that PM is a median?","o":["PQ = PR","QM = MR","PM ⟂ QR","∠P = 90°"],"a":1,"e":"A median ends at the midpoint, so QM and MR are equal.","v":"median-altitude"},{"d":"BASIC","q":"Which feature defines an altitude of a triangle?","o":["It always bisects the opposite side","It joins two side midpoints","It is perpendicular from a vertex to the opposite side or its extension","It always bisects the vertex angle"],"a":2,"e":"Perpendicularity to the opposite side or its extension defines an altitude.","v":"median-altitude"},{"d":"BASIC","q":"A triangle has vertices A, B, and C. A line segment from A meets BC at D at 90°. What is AD if D lies on BC?","o":["A median necessarily","An altitude from A","A side bisector necessarily","A perimeter"],"a":1,"e":"AD is perpendicular to BC and starts at A, so it is an altitude.","v":"median-altitude"},{"d":"BASIC","q":"In triangle ABC, AD is a median and BC = 18 cm. Find BD.","o":["6 cm","9 cm","12 cm","18 cm"],"a":1,"e":"A median meets the opposite side at its midpoint: BD = DC = 18 ÷ 2 = 9 cm.","v":"median-altitude"},{"d":"BASIC","q":"In triangle XYZ, XM is a median and YM = 7 cm. Find YZ.","o":["7 cm","10 cm","14 cm","21 cm"],"a":2,"e":"M is the midpoint of YZ, so YZ = 2 × YM = 14 cm.","v":"median-altitude"},{"d":"BASIC","q":"An altitude is  perpendicular to which part of a triangle?","o":["The opposite side or its extension","Only the adjacent side","The median from another vertex always","The perimeter"],"a":0,"e":"The altitude meets the opposite side, or its extension, at a right angle.","v":"median-altitude"},{"d":"BASIC","q":"In a right triangle, the two perpendicular sides can serve as…","o":["Medians only","Altitudes from the opposite acute vertices","Angle bisectors only","The hypotenuse"],"a":1,"e":"Each leg is perpendicular to the other, so it acts as an altitude from the opposite acute vertex.","v":"median-altitude"},{"d":"BASIC","q":"Which statement is always true about a median?","o":["It is perpendicular to the opposite side","It divides the opposite side into two equal parts","It always lies inside every triangle","It always bisects the angle"],"a":1,"e":"The median meets the opposite side at its midpoint, dividing it equally.","v":"median-altitude"},{"d":"MEDIUM","q":"In triangle ABC, D is the midpoint of BC. If BD = 3x + 1 and DC = 5x − 7, find x.","o":["3","4","5","6"],"a":1,"e":"BD = DC, so 3x + 1 = 5x − 7; 8 = 2x and x = 4.","v":"median-altitude"},{"d":"MEDIUM","q":"A median divides side BC into BD = 2x + 3 and DC = 5x − 9. Find x.","o":["3","4","5","6"],"a":1,"e":"Set 2x + 3 = 5x − 9, giving 12 = 3x and x = 4.","v":"median-altitude"},{"d":"MEDIUM","q":"In triangle PQR, PM is a median. If QR = 26 cm, what is QM?","o":["10 cm","12 cm","13 cm","26 cm"],"a":2,"e":"M is the midpoint of QR, so QM = QR ÷ 2 = 13 cm.","v":"median-altitude"},{"d":"MEDIUM","q":"An altitude from A meets the line BC at D, with ∠ADB = 90°. What is the key property of AD?","o":["It bisects BC","It is perpendicular to BC","It equals BD","It bisects ∠A"],"a":1,"e":"The right angle at D means AD is perpendicular to the line BC.","v":"median-altitude"},{"d":"MEDIUM","q":"In triangle ABC, AD is a median. If BD = 4x − 2 and DC = 2x + 8, find x.","o":["3","4","5","6"],"a":2,"e":"BD = DC gives 4x − 2 = 2x + 8, so 2x = 10 and x = 5.","v":"median-altitude"},{"d":"MEDIUM","q":"Triangle ABC has BC = 20 cm and AD is a median. What are BD and DC?","o":["5 cm and 15 cm","8 cm and 12 cm","10 cm and 10 cm","20 cm and 0 cm"],"a":2,"e":"The median bisects BC, so each half is 20 ÷ 2 = 10 cm.","v":"median-altitude"},{"d":"MEDIUM","q":"A triangle has an altitude from a vertex that meets the extension of the opposite side outside the triangle. Is this possible?","o":["No, an altitude must always be inside","Yes, in an obtuse triangle","Only in an equilateral triangle","Only when all sides are equal"],"a":1,"e":"In an obtuse triangle, an altitude may meet the extension of the opposite side.","v":"median-altitude"},{"d":"MEDIUM","q":"In triangle ABC, AD is both a median and an altitude to BC. What follows?","o":["BD = DC and AD ⟂ BC","AB = AC must be false","BC = AD","∠A must be 90°"],"a":0,"e":"Median gives BD = DC, while altitude gives AD perpendicular to BC.","v":"median-altitude"},{"d":"MEDIUM","q":"In triangle XYZ, XM is a median. If YM = 2x + 1 and MZ = 4x − 9, find x.","o":["4","5","6","7"],"a":1,"e":"YM = MZ gives 2x + 1 = 4x − 9, so 10 = 2x and x = 5.","v":"median-altitude"},{"d":"MEDIUM","q":"A triangle has side BC = 15 cm. A median from A meets BC at D. What is the length of DC?","o":["5 cm","7.5 cm","10 cm","15 cm"],"a":1,"e":"D is the midpoint, so DC = 15 ÷ 2 = 7.5 cm.","v":"median-altitude"},{"d":"HARD","q":"In triangle ABC, AD is a median. BD = 7x − 5 and DC = 4x + 13. Find the length of BC if x = 6.","o":["66 cm","72 cm","74 cm","82 cm"],"a":2,"e":"At x = 6, BD = 7(6) − 5 = 37 and DC = 4(6) + 13 = 37; BC = 74 cm.","v":"median-altitude"},{"d":"HARD","q":"In triangle PQR, PM is a median. QM = 3x − 2 and MR = x + 8. Find QR.","o":["20 cm","24 cm","26 cm","32 cm"],"a":2,"e":"3x − 2 = x + 8 gives x = 5; each half is 13 cm, so QR = 26 cm.","v":"median-altitude"},{"d":"HARD","q":"In triangle ABC, AD is an altitude to BC. If ∠ADB = (3x + 6)° and ∠ADB = 90°, find x.","o":["24","26","28","30"],"a":2,"e":"3x + 6 = 90, so 3x = 84 and x = 28.","v":"median-altitude"},{"d":"HARD","q":"A median meets a 34 cm side at its midpoint. The two resulting segments are expressed as (3x − 1) cm and (x + 9) cm. Find x.","o":["4","5","6","7"],"a":1,"e":"3x − 1 = x + 9 gives 2x = 10, so x = 5.","v":"median-altitude"},{"d":"HARD","q":"In triangle ABC, AD is a median to BC. If BD = 2x + 5 and BC = 6x + 2, find x.","o":["2","3","4","5"],"a":2,"e":"A median gives BD = BC/2: 2(2x + 5) = 6x + 2, so x = 4.","v":"median-altitude"},{"d":"HARD","q":"In triangle XYZ, XN is an altitude to YZ. If ∠XNY = (5x − 10)° and is a right angle, find x.","o":["18","20","22","24"],"a":1,"e":"5x − 10 = 90, so 5x = 100 and x = 20.","v":"median-altitude"},{"d":"HARD","q":"A triangle's side is 28 cm. Its median divides that side into two parts, one labelled (3x + 2) cm. Find x.","o":["3","4","5","6"],"a":1,"e":"The midpoint is 14 cm from either endpoint, so 3x + 2 = 14 and x = 4.","v":"median-altitude"},{"d":"HARD","q":"In triangle ABC, AD is a median and BD = 3x + 4, DC = 7x − 12. Find BC.","o":["32 cm","36 cm","40 cm","44 cm"],"a":0,"e":"3x + 4 = 7x − 12 gives x = 4; each half is 16 cm, so BC = 32 cm.","v":"median-altitude"},{"d":"HARD","q":"In an obtuse triangle ABC, the altitude from A meets the extension of BC at D. Which is necessarily true?","o":["D must be the midpoint of BC","AD ⟂ BC","AB = AC","AD must lie inside triangle ABC"],"a":1,"e":"An altitude is perpendicular to the line containing the opposite side, even if it meets an extension.","v":"median-altitude"},{"d":"HARD","q":"In triangle ABC, AD is both a median and an altitude to BC. If BC = 18 cm, BD = DC and AD ⟂ BC. What is BD?","o":["6 cm","9 cm","12 cm","18 cm"],"a":1,"e":"Since AD is a median, D is the midpoint of BC; BD = 18 ÷ 2 = 9 cm.","v":"median-altitude"}];
let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;
const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');
function updateProgress(){const p=index>=questions.length?100:index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}
function render(){if(index>=questions.length){results();return;}const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · MEDIAN & ALTITUDE';$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';const content=$('content');content.replaceChildren();const question=document.createElement('div');question.className='question';question.textContent=q.q;content.appendChild(question);const choices=document.createElement('div');choices.className='choices';content.appendChild(choices);q.o.forEach((answer,i)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=answer;b.addEventListener('click',()=>{if(locked)return;selected=i;choices.querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===i));$('action').disabled=false;});choices.appendChild(b);});$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}
function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;if(window.skillupCelebrate)window.skillupCelebrate();xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===selected&&!good)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Explanation: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();}else results();}
function results(){finished=true;updateProgress();$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='🏆 Median & altitude quiz complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const content=$('content');content.replaceChildren();const end=document.createElement('div');end.className='end';const title=document.createElement('h1');title.textContent=correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!';end.appendChild(title);const score=document.createElement('div');score.className='score';score.textContent=correct+' / '+questions.length;end.appendChild(score);const p=document.createElement('p');p.textContent='You answered '+correct+' questions correctly.';end.appendChild(p);const summary=document.createElement('div');summary.className='summary';summary.innerHTML='⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining';end.appendChild(summary);content.appendChild(end);$('action').textContent='Try again ↻';$('action').disabled=false;}
function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}
$('action').addEventListener('click',()=>{if(finished)restart();else act();});try{render();}catch(err){$('content').textContent='Quiz could not start. Please refresh the page.';console.error('Median and altitude quiz initialization failed',err);}
})();
