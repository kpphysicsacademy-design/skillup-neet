<script>
(function(){
'use strict';
const questions=[{"q":"Which expression is a monomial?","o":["7x²","x + 3","a − b","1/x + 2"],"a":0,"why":"A monomial is a single term; 7x² has one term."},{"q":"How many terms are in 3x + 5?","o":["1","2","3","5"],"a":1,"why":"The terms are 3x and 5, separated by the plus sign."},{"q":"Which expression is a binomial?","o":["8y","3x² + 2x + 1","x² + 4","x + y + z"],"a":2,"why":"A binomial has exactly two unlike or like terms; x² + 4 has two."},{"q":"What is the coefficient of x in 9x − 4?","o":["−9","−4","4","9"],"a":3,"why":"The numerical factor multiplying x is 9."},{"q":"What is the constant term in 5a² − 3a + 7?","o":["7","5","−3","a"],"a":0,"why":"The constant term has no variable, so it is 7."},{"q":"Which expression is a trinomial?","o":["x + 2","x² + x + 1","4y²","a − b"],"a":1,"why":"A trinomial has three terms; x², x and 1 are three terms."},{"q":"What is the degree of the monomial 6x³?","o":["9","6","3","1"],"a":2,"why":"The exponent of x is 3, so the degree is 3."},{"q":"How many terms are in 4p² − 2p + 8?","o":["1","2","4","3"],"a":3,"why":"The terms are 4p², −2p and 8."},{"q":"Which pair consists of like terms?","o":["3x² and −5x²","2x and 2x²","a and a²","4xy and 4x"],"a":0,"why":"Like terms have identical variable parts and exponents."},{"q":"What is the coefficient of y² in −7y² + 3y − 1?","o":["7","−7","3","−1"],"a":1,"why":"The coefficient of y² is −7, including its sign."},{"q":"Simplify 3x + 5x − 2x.","o":["8x","10x","6x","6x²"],"a":2,"why":"Combine coefficients: 3 + 5 − 2 = 6, giving 6x."},{"q":"Which is a polynomial in x?","o":["x⁻² + 4","1/x + 2","√x + 1","2x² − 3x + 1"],"a":3,"why":"Polynomial exponents of the variable are non-negative integers; 2x² − 3x + 1 qualifies."},{"q":"Find the degree of 4x³ − 2x² + 9.","o":["3","2","4","9"],"a":0,"why":"The highest exponent of x with a nonzero coefficient is 3."},{"q":"What is the coefficient of x² in 5 − 8x² + 3x?","o":["8","−8","5","3"],"a":1,"why":"The x² term is −8x², so its coefficient is −8."},{"q":"Classify 4a²b + 3ab − 7 as an expression by number of terms.","o":["Binomial","Monomial","Trinomial","Polynomial with four terms"],"a":2,"why":"There are three terms: 4a²b, 3ab and −7."},{"q":"Evaluate 2x² − 3x + 1 when x = 2.","o":["7","5","1","3"],"a":3,"why":"Substitute x = 2: 2(4) − 3(2) + 1 = 8 − 6 + 1 = 3."},{"q":"Which is the constant polynomial?","o":["5","5x","x + 5","5x²"],"a":0,"why":"The polynomial 5 has no variable and is constant."},{"q":"What is the degree of 7x⁴ + 2x² − x?","o":["2","4","7","5"],"a":1,"why":"The greatest exponent of x is 4."},{"q":"Which expression has exactly two terms?","o":["9p","m² + m + 1","3m² − 4n","a + b + c"],"a":2,"why":"3m² and −4n are the two terms."},{"q":"If P(x) = x² + 2x, find P(3).","o":["18","12","9","15"],"a":3,"why":"P(3) = 3² + 2(3) = 9 + 6 = 15."},{"q":"Which is the correct classification of 9x⁵?","o":["Monomial of degree 5","Binomial of degree 5","Monomial of degree 9","Polynomial of degree 4"],"a":0,"why":"It has one term and the highest exponent is 5."},{"q":"For P(x) = 4x³ − 2x + 6, what is P(−1)?","o":["0","4","−4","8"],"a":1,"why":"P(−1) = 4(−1)³ − 2(−1) + 6 = −4 + 2 + 6 = 4."},{"q":"Which expression is not a polynomial in x?","o":["5x² − 7","x³ − 2x + 1","3x² + 1/x","4"],"a":2,"why":"1/x = x⁻¹ has a negative exponent, which is not allowed in a polynomial."},{"q":"A polynomial has terms 5x⁴, −2x³ and 7x. What is its degree?","o":["7","3","5","4"],"a":3,"why":"The highest exponent among the terms is 4."},{"q":"If P(x) = 2x² − x − 3, find P(−2).","o":["7","3","5","−1"],"a":0,"why":"P(−2) = 2(4) − (−2) − 3 = 8 + 2 − 3 = 7."},{"q":"Which expression has degree 3 and exactly three terms?","o":["x² + x + 1","2x³ − x + 4","5x³","x⁴ + x + 1"],"a":1,"why":"It has three terms and the highest exponent is 3."},{"q":"If P(x) = x³ − 4x, what is P(2)?","o":["−8","4","0","8"],"a":2,"why":"P(2) = 2³ − 4(2) = 8 − 8 = 0."},{"q":"The expression 6a²b³ − 4ab + 9 has what degree in total (highest sum of exponents in a term)?","o":["6","3","2","5"],"a":3,"why":"The term a²b³ has total degree 2 + 3 = 5, greater than the other terms."},{"q":"If P(x) = 3x² + kx + 2 and P(1) = 10, find k.","o":["5","4","6","7"],"a":0,"why":"P(1) = 3 + k + 2 = 10, so k = 5."},{"q":"Which statement about the zero polynomial 0 is correct?","o":["Its degree is 0","Its degree is not defined","It has degree 1","It has degree −1"],"a":1,"why":"By the standard convention, the zero polynomial has no defined degree."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Monomials, Binomials and Polynomials Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-monomials-binomials-polynomials-recreated-v2" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
