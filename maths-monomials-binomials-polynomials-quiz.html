<style>

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Which expression is a monomial?","o":["7x²","x + 3","a − b","1/x + 2"],"a":0,"e":"A monomial is a single term; 7x² has one term.","v":"monomials-binomials-and-polynomials"},{"d":"BASIC","q":"How many terms are in 3x + 5?","o":["1","2","3","5"],"a":1,"e":"The terms are 3x and 5, separated by the plus sign.","v":"monomials-binomials-and-polynomials"},{"d":"BASIC","q":"Which expression is a binomial?","o":["8y","3x² + 2x + 1","x² + 4","x + y + z"],"a":2,"e":"A binomial has exactly two unlike or like terms; x² + 4 has two.","v":"monomials-binomials-and-polynomials"},{"d":"BASIC","q":"What is the coefficient of x in 9x − 4?","o":["−9","−4","4","9"],"a":3,"e":"The numerical factor multiplying x is 9.","v":"monomials-binomials-and-polynomials"},{"d":"BASIC","q":"What is the constant term in 5a² − 3a + 7?","o":["7","5","−3","a"],"a":0,"e":"The constant term has no variable, so it is 7.","v":"monomials-binomials-and-polynomials"},{"d":"BASIC","q":"Which expression is a trinomial?","o":["x + 2","x² + x + 1","4y²","a − b"],"a":1,"e":"A trinomial has three terms; x², x and 1 are three terms.","v":"monomials-binomials-and-polynomials"},{"d":"BASIC","q":"What is the degree of the monomial 6x³?","o":["9","6","3","1"],"a":2,"e":"The exponent of x is 3, so the degree is 3.","v":"monomials-binomials-and-polynomials"},{"d":"BASIC","q":"How many terms are in 4p² − 2p + 8?","o":["1","2","4","3"],"a":3,"e":"The terms are 4p², −2p and 8.","v":"monomials-binomials-and-polynomials"},{"d":"BASIC","q":"Which pair consists of like terms?","o":["3x² and −5x²","2x and 2x²","a and a²","4xy and 4x"],"a":0,"e":"Like terms have identical variable parts and exponents.","v":"monomials-binomials-and-polynomials"},{"d":"BASIC","q":"What is the coefficient of y² in −7y² + 3y − 1?","o":["7","−7","3","−1"],"a":1,"e":"The coefficient of y² is −7, including its sign.","v":"monomials-binomials-and-polynomials"},{"d":"MEDIUM","q":"Simplify 3x + 5x − 2x.","o":["8x","10x","6x","6x²"],"a":2,"e":"Combine coefficients: 3 + 5 − 2 = 6, giving 6x.","v":"monomials-binomials-and-polynomials"},{"d":"MEDIUM","q":"Which is a polynomial in x?","o":["x⁻² + 4","1/x + 2","√x + 1","2x² − 3x + 1"],"a":3,"e":"Polynomial exponents of the variable are non-negative integers; 2x² − 3x + 1 qualifies.","v":"monomials-binomials-and-polynomials"},{"d":"MEDIUM","q":"Find the degree of 4x³ − 2x² + 9.","o":["3","2","4","9"],"a":0,"e":"The highest exponent of x with a nonzero coefficient is 3.","v":"monomials-binomials-and-polynomials"},{"d":"MEDIUM","q":"What is the coefficient of x² in 5 − 8x² + 3x?","o":["8","−8","5","3"],"a":1,"e":"The x² term is −8x², so its coefficient is −8.","v":"monomials-binomials-and-polynomials"},{"d":"MEDIUM","q":"Classify 4a²b + 3ab − 7 as an expression by number of terms.","o":["Binomial","Monomial","Trinomial","Polynomial with four terms"],"a":2,"e":"There are three terms: 4a²b, 3ab and −7.","v":"monomials-binomials-and-polynomials"},{"d":"MEDIUM","q":"Evaluate 2x² − 3x + 1 when x = 2.","o":["7","5","1","3"],"a":3,"e":"Substitute x = 2: 2(4) − 3(2) + 1 = 8 − 6 + 1 = 3.","v":"monomials-binomials-and-polynomials"},{"d":"MEDIUM","q":"Which is the constant polynomial?","o":["5","5x","x + 5","5x²"],"a":0,"e":"The polynomial 5 has no variable and is constant.","v":"monomials-binomials-and-polynomials"},{"d":"MEDIUM","q":"What is the degree of 7x⁴ + 2x² − x?","o":["2","4","7","5"],"a":1,"e":"The greatest exponent of x is 4.","v":"monomials-binomials-and-polynomials"},{"d":"MEDIUM","q":"Which expression has exactly two terms?","o":["9p","m² + m + 1","3m² − 4n","a + b + c"],"a":2,"e":"3m² and −4n are the two terms.","v":"monomials-binomials-and-polynomials"},{"d":"MEDIUM","q":"If P(x) = x² + 2x, find P(3).","o":["18","12","9","15"],"a":3,"e":"P(3) = 3² + 2(3) = 9 + 6 = 15.","v":"monomials-binomials-and-polynomials"},{"d":"HARD","q":"Which is the correct classification of 9x⁵?","o":["Monomial of degree 5","Binomial of degree 5","Monomial of degree 9","Polynomial of degree 4"],"a":0,"e":"It has one term and the highest exponent is 5.","v":"monomials-binomials-and-polynomials"},{"d":"HARD","q":"For P(x) = 4x³ − 2x + 6, what is P(−1)?","o":["0","4","−4","8"],"a":1,"e":"P(−1) = 4(−1)³ − 2(−1) + 6 = −4 + 2 + 6 = 4.","v":"monomials-binomials-and-polynomials"},{"d":"HARD","q":"Which expression is not a polynomial in x?","o":["5x² − 7","x³ − 2x + 1","3x² + 1/x","4"],"a":2,"e":"1/x = x⁻¹ has a negative exponent, which is not allowed in a polynomial.","v":"monomials-binomials-and-polynomials"},{"d":"HARD","q":"A polynomial has terms 5x⁴, −2x³ and 7x. What is its degree?","o":["7","3","5","4"],"a":3,"e":"The highest exponent among the terms is 4.","v":"monomials-binomials-and-polynomials"},{"d":"HARD","q":"If P(x) = 2x² − x − 3, find P(−2).","o":["7","3","5","−1"],"a":0,"e":"P(−2) = 2(4) − (−2) − 3 = 8 + 2 − 3 = 7.","v":"monomials-binomials-and-polynomials"},{"d":"HARD","q":"Which expression has degree 3 and exactly three terms?","o":["x² + x + 1","2x³ − x + 4","5x³","x⁴ + x + 1"],"a":1,"e":"It has three terms and the highest exponent is 3.","v":"monomials-binomials-and-polynomials"},{"d":"HARD","q":"If P(x) = x³ − 4x, what is P(2)?","o":["−8","4","0","8"],"a":2,"e":"P(2) = 2³ − 4(2) = 8 − 8 = 0.","v":"monomials-binomials-and-polynomials"},{"d":"HARD","q":"The expression 6a²b³ − 4ab + 9 has what degree in total (highest sum of exponents in a term)?","o":["6","3","2","5"],"a":3,"e":"The term a²b³ has total degree 2 + 3 = 5, greater than the other terms.","v":"monomials-binomials-and-polynomials"},{"d":"HARD","q":"If P(x) = 3x² + kx + 2 and P(1) = 10, find k.","o":["5","4","6","7"],"a":0,"e":"P(1) = 3 + k + 2 = 10, so k = 5.","v":"monomials-binomials-and-polynomials"},{"d":"HARD","q":"Which statement about the zero polynomial 0 is correct?","o":["Its degree is 0","Its degree is not defined","It has degree 1","It has degree −1"],"a":1,"e":"By the standard convention, the zero polynomial has no defined degree.","v":"monomials-binomials-and-polynomials"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Identify algebraic expressions</strong><small>Terms, coefficients, variables and constants</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Classify monomials, binomials and polynomials</strong><small>Evaluate polynomials and determine degree</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply percentages to real-life situations</strong><small>Reason about perfect squares and nearest squares</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>\n<script src="/shared-nav.js?v=20261013-universal-nav-v1"></script>\n</body></html>
