<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Expand: 3x × 4x","o":["7x","12x","12x²","7x²"],"a":2,"e":"Multiply coefficients 3 × 4 = 12 and variables x × x = x².","v":"multiplication-of-expressions"},{"d":"BASIC","q":"Expand: 2a(3a + 5)","o":["6a² + 10a","5a² + 7a","6a + 10","6a² + 5"],"a":0,"e":"Use distributive property: 2a × 3a + 2a × 5 = 6a² + 10a.","v":"multiplication-of-expressions"},{"d":"BASIC","q":"Expand: 4(x + 3)","o":["4x + 3","4x + 12","x + 12","7x"],"a":1,"e":"Multiply both terms inside the bracket by 4.","v":"multiplication-of-expressions"},{"d":"BASIC","q":"Expand: −2(y − 4)","o":["−2y − 8","2y − 8","−2y + 8","2y + 8"],"a":2,"e":"Multiply −2 by y and by −4: −2y + 8.","v":"multiplication-of-expressions"},{"d":"BASIC","q":"Expand: (x + 2)(x + 3)","o":["x² + 5x + 6","x² + 6x + 5","x² + x + 6","2x² + 5"],"a":0,"e":"Multiply each term: x² + 3x + 2x + 6 = x² + 5x + 6.","v":"multiplication-of-expressions"},{"d":"BASIC","q":"Expand: (a + 4)(a + 2)","o":["a² + 6a + 8","a² + 8a + 6","a² + 2a + 8","a² + 6"],"a":0,"e":"The middle terms add to 4a + 2a = 6a; the constant is 8.","v":"multiplication-of-expressions"},{"d":"BASIC","q":"Expand: (x − 5)(x + 2)","o":["x² − 3x − 10","x² + 3x − 10","x² − 7x + 10","x² − 10"],"a":0,"e":"Multiply to get x² + 2x − 5x − 10 = x² − 3x − 10.","v":"multiplication-of-expressions"},{"d":"BASIC","q":"Simplify: 3x(2x − 1) + x","o":["6x² − 2x","6x² − 3x","6x² − 2x + x","6x² − 2x + x is already simplified"],"a":0,"e":"First expand to 6x² − 3x, then add x to obtain 6x² − 2x.","v":"multiplication-of-expressions"},{"d":"BASIC","q":"Expand: (2x + 1)(x + 3)","o":["2x² + 7x + 3","2x² + 6x + 1","2x² + 5x + 3","3x² + 7x + 3"],"a":0,"e":"Products give 2x² + 6x + x + 3 = 2x² + 7x + 3.","v":"multiplication-of-expressions"},{"d":"BASIC","q":"Expand: (m − 2)(m − 3)","o":["m² − 5m + 6","m² + 5m + 6","m² − m − 6","m² − 6"],"a":0,"e":"Multiply: m² − 3m − 2m + 6 = m² − 5m + 6.","v":"multiplication-of-expressions"},{"d":"MEDIUM","q":"What is 5a × (2a²)?","o":["10a²","7a³","10a³","10a"],"a":2,"e":"Multiply coefficients and add exponents: 5 × 2 = 10 and a × a² = a³.","v":"multiplication-of-expressions"},{"d":"MEDIUM","q":"Simplify: 2x(x + 4) − x²","o":["x² + 8x","3x² + 8x","x² + 4x","2x² + 8x"],"a":0,"e":"Expand to 2x² + 8x, then subtract x² to get x² + 8x.","v":"multiplication-of-expressions"},{"d":"MEDIUM","q":"Expand: (x + 1)(x − 1)","o":["x² − 1","x² + 1","x² − 2x − 1","x² − x − 1"],"a":0,"e":"Products x² − x + x − 1 leave x² − 1.","v":"multiplication-of-expressions"},{"d":"MEDIUM","q":"Expand: (2a − 3)(a + 2)","o":["2a² + a − 6","2a² − a − 6","2a² + 4a − 3","2a² − 6"],"a":0,"e":"Multiply: 2a² + 4a − 3a − 6 = 2a² + a − 6.","v":"multiplication-of-expressions"},{"d":"MEDIUM","q":"Simplify: 3p(2p + 5)","o":["6p² + 15p","5p² + 8p","6p + 15","6p² + 5p"],"a":0,"e":"Distribute 3p to both terms.","v":"multiplication-of-expressions"},{"d":"MEDIUM","q":"Expand: (y + 3)²","o":["y² + 6y + 9","y² + 9","y² + 3y + 9","y² + 6"],"a":0,"e":"(y + 3)(y + 3) = y² + 3y + 3y + 9.","v":"multiplication-of-expressions"},{"d":"MEDIUM","q":"Expand: (a − 4)²","o":["a² − 8a + 16","a² − 16","a² + 8a + 16","a² − 4a + 16"],"a":0,"e":"(a − 4)(a − 4) = a² − 8a + 16.","v":"multiplication-of-expressions"},{"d":"MEDIUM","q":"Expand: (2x + 3)(2x − 3)","o":["4x² − 9","4x² + 9","4x² − 12x + 9","2x² − 9"],"a":0,"e":"This is a difference of squares: (2x)² − 3² = 4x² − 9.","v":"multiplication-of-expressions"},{"d":"MEDIUM","q":"Simplify: (x + 2)(x + 1) − x²","o":["3x + 2","2x + 3","x² + 3x + 2","3x − 2"],"a":0,"e":"Expand to x² + 3x + 2, then subtract x².","v":"multiplication-of-expressions"},{"d":"MEDIUM","q":"Expand: (3a + 2)(a − 1)","o":["3a² − a − 2","3a² + 5a − 2","3a² − 3a + 2","3a² − a + 2"],"a":0,"e":"Products: 3a² − 3a + 2a − 2 = 3a² − a − 2.","v":"multiplication-of-expressions"},{"d":"HARD","q":"Expand: (p − 2)(p + 5)","o":["p² + 3p − 10","p² − 3p − 10","p² + 7p + 10","p² + 3p + 10"],"a":0,"e":"p² + 5p − 2p − 10 = p² + 3p − 10.","v":"multiplication-of-expressions"},{"d":"HARD","q":"Simplify: 2x(3x − 4) + 5x","o":["6x² − 3x","6x² − 8x","6x² + x","6x² − 13x"],"a":0,"e":"Expand to 6x² − 8x, then add 5x to get 6x² − 3x.","v":"multiplication-of-expressions"},{"d":"HARD","q":"Expand: (a + b)(a + 2b)","o":["a² + 3ab + 2b²","a² + 2ab + 2b²","a² + 3b²","2a² + 3ab"],"a":0,"e":"Multiply: a² + 2ab + ab + 2b² = a² + 3ab + 2b².","v":"multiplication-of-expressions"},{"d":"HARD","q":"Expand: (2m − 1)(m − 4)","o":["2m² − 9m + 4","2m² − 7m + 4","2m² − 8m − 1","2m² − 9m − 4"],"a":0,"e":"Multiply: 2m² − 8m − m + 4 = 2m² − 9m + 4.","v":"multiplication-of-expressions"},{"d":"HARD","q":"If x = 2, evaluate 3x(x + 1).","o":["18","12","9","6"],"a":0,"e":"Substitute x = 2: 3 × 2 × 3 = 18.","v":"multiplication-of-expressions"},{"d":"HARD","q":"Simplify: (x − 3)(x + 3) + 9","o":["x²","x² + 18","x² − 9","x² + 9"],"a":0,"e":"Difference of squares gives x² − 9; adding 9 leaves x².","v":"multiplication-of-expressions"},{"d":"HARD","q":"Expand: (3x − 2)(x + 4)","o":["3x² + 10x − 8","3x² + 12x − 2","3x² − 10x − 8","3x² + 2x − 8"],"a":0,"e":"Multiply: 3x² + 12x − 2x − 8 = 3x² + 10x − 8.","v":"multiplication-of-expressions"},{"d":"HARD","q":"Simplify: 4a(a − 2) − 2a(a + 1)","o":["2a² − 10a","2a² − 6a","6a² − 10a","2a² − 8a"],"a":0,"e":"4a² − 8a − (2a² + 2a) = 2a² − 10a.","v":"multiplication-of-expressions"},{"d":"HARD","q":"Expand: (x + 5)(x − 2)","o":["x² + 3x − 10","x² − 3x − 10","x² + 7x − 10","x² + 3x + 10"],"a":0,"e":"Multiply: x² − 2x + 5x − 10 = x² + 3x − 10.","v":"multiplication-of-expressions"},{"d":"HARD","q":"Simplify: (2x + 3)(x + 1) − 2x²","o":["5x + 3","3x + 3","2x² + 5x + 3","5x − 3"],"a":0,"e":"Expand to 2x² + 5x + 3, then subtract 2x².","v":"multiplication-of-expressions"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Multiply algebraic terms</strong><small>Use coefficients, variables and exponents correctly</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Expand products using the distributive property</strong><small>Multiply monomials and polynomials, then simplify</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply algebraic multiplication and identities</strong><small>Reason about perfect squares and nearest squares</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
