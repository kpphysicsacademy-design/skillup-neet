<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"Which of these is a natural number?","o":["−2","0.5","7","−1"],"a":2,"why":"Natural numbers are counting numbers such as 1, 2, 3, …."},{"d":"BASIC","q":"Which number is an integer?","o":["3/4","−8","2.6","√2"],"a":1,"why":"Integers include negative whole numbers, zero and positive whole numbers."},{"d":"BASIC","q":"Which number is rational?","o":["√3","π","5/9","√7"],"a":2,"why":"A rational number can be written as a ratio of two integers with a non-zero denominator."},{"d":"BASIC","q":"Which number is irrational?","o":["0.25","−6","√2","7/11"],"a":2,"why":"√2 cannot be expressed as a ratio of two integers."},{"d":"BASIC","q":"Which set contains all integers?","o":["…, −2, −1, 0, 1, 2, …","1, 2, 3, … only","Fractions only","Irrational numbers only"],"a":0,"why":"Integers extend in both directions from zero and include zero."},{"d":"BASIC","q":"Is zero a rational number?","o":["Yes, because 0 = 0/1","No, because it has no value","Only when written as a decimal","It is irrational"],"a":0,"why":"Zero can be written as 0/1, so it is rational."},{"d":"BASIC","q":"Which is a terminating decimal?","o":["0.333…","0.125","1.414213…","π"],"a":1,"why":"0.125 ends after three decimal places."},{"d":"BASIC","q":"Which fraction equals 0.75?","o":["1/4","2/3","3/4","4/3"],"a":2,"why":"0.75 = 75/100 = 3/4."},{"d":"BASIC","q":"Every natural number is also an…","o":["irrational number","integer","non-terminating decimal","negative number"],"a":1,"why":"Natural numbers are a subset of the integers."},{"d":"BASIC","q":"Which number lies between 2 and 3?","o":["√5","√2","√10","√16"],"a":0,"why":"√5 is about 2.236, so it lies between 2 and 3."},{"d":"MEDIUM","q":"Which fraction has a terminating decimal expansion?","o":["1/6","3/8","2/9","5/12"],"a":1,"why":"In lowest terms, a rational number terminates when its denominator has only factors 2 and/or 5; 8 = 2³."},{"d":"MEDIUM","q":"The decimal 0.272727… is…","o":["irrational","rational and repeating","an integer","a natural number"],"a":1,"why":"A repeating decimal is rational."},{"d":"MEDIUM","q":"Which statement about √49 is correct?","o":["It is irrational","It equals 7 and is rational","It is not real","It equals 49"],"a":1,"why":"The principal square root of 49 is 7."},{"d":"MEDIUM","q":"Which number is not an integer?","o":["−12","0","19","−2.5"],"a":3,"why":"Integers do not include non-whole fractions or decimals."},{"d":"MEDIUM","q":"Which is an irrational number?","o":["√64","√81","√11","√100"],"a":2,"why":"11 is not a perfect square, so √11 is irrational."},{"d":"MEDIUM","q":"Which number is rational and negative?","o":["√5","−7/4","π","√3"],"a":1,"why":"−7/4 is a ratio of integers and is negative."},{"d":"MEDIUM","q":"Which is equivalent to 0.666…?","o":["1/6","2/3","3/5","6/10"],"a":1,"why":"0.666… repeating equals 2/3."},{"d":"MEDIUM","q":"Between any two distinct rational numbers, there are…","o":["no other rational numbers","exactly one rational number","infinitely many rational numbers","only integers"],"a":2,"why":"For example, their average is another rational number; this can be repeated indefinitely."},{"d":"MEDIUM","q":"Which set includes both rational and irrational real numbers?","o":["Integers","Natural numbers","Real numbers","Whole numbers"],"a":2,"why":"The real numbers consist of rational and irrational numbers."},{"d":"MEDIUM","q":"What is the value of |−13|?","o":["−13","0","13","26"],"a":2,"why":"Absolute value is distance from zero, so it is non-negative."},{"d":"HARD","q":"Which statement is always true?","o":["Every rational number is an integer","Every integer is rational","Every real number is rational","Every irrational number is negative"],"a":1,"why":"Any integer n can be written as n/1, so every integer is rational."},{"d":"HARD","q":"Which number is between 3 and 4?","o":["√8","√10","√15","√20"],"a":2,"why":"√15 is about 3.87, between 3 and 4."},{"d":"HARD","q":"Which fraction has a non-terminating repeating decimal?","o":["7/40","9/25","5/6","3/8"],"a":2,"why":"5/6 = 0.8333… repeats after the first decimal digit."},{"d":"HARD","q":"If x = 0.121221222… with one more 2 between successive 1s, x is generally classified as…","o":["natural","integer","rational","irrational"],"a":3,"why":"The non-repeating decimal pattern continues without a fixed repeating block, so it is irrational."},{"d":"HARD","q":"Which expression is irrational?","o":["√2 × √8","√3 × √3","√5 + √5","√2 + √3"],"a":3,"why":"√2 + √3 is irrational; the other expressions simplify to rational values."},{"d":"HARD","q":"Which number is not real?","o":["√9","−√16","√(−9)","0"],"a":2,"why":"The square root of a negative number is not a real number."},{"d":"HARD","q":"Which number is rational?","o":["0.1010010001… with increasing zeros","π","−√36","√13"],"a":2,"why":"−√36 = −6, which is an integer and therefore rational."},{"d":"HARD","q":"Which ordering is correct from smallest to largest?","o":["−2, −1/2, 0, 3/4","−1/2, −2, 0, 3/4","0, −2, −1/2, 3/4","−2, 0, −1/2, 3/4"],"a":0,"why":"Numerically, −2 < −0.5 < 0 < 0.75."},{"d":"HARD","q":"Which number is a rational number between 1/3 and 1/2?","o":["1/4","2/5","3/5","3/4"],"a":1,"why":"2/5 = 0.4, which lies between 1/3 and 1/2."},{"d":"HARD","q":"If a is irrational and b is rational, which statement is always true?","o":["a + b is irrational","a × b is always irrational","a − b is rational","a is an integer"],"a":0,"why":"Adding a rational number to an irrational number always gives an irrational number."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Direct Proportion Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
