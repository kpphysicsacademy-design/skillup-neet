<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="description" content="Interactive number classifier for natural, whole, integer, rational, irrational and real numbers.">
<title>Number Classifier | SkillUp Maths</title>
<style>
:root{--ink:#203449;--muted:#687b8d;--line:#e5edf3;--blue:#167db5;--bg:#f5f9ff}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line)}.nav,main{max-width:660px;margin:auto}.nav{padding:11px 15px;display:flex;justify-content:space-between;align-items:center}.nav a{color:var(--blue);text-decoration:none;font-weight:800}
main{padding:22px 14px 36px}h1{font-size:clamp(25px,5vw,33px);margin:4px 0 6px}.sub,.hint{color:var(--muted);font-size:13px;line-height:1.5;margin:0}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 5px 18px #24445c09}
label{display:block;font-size:13px;font-weight:850;margin:14px 0 6px}input{width:100%;min-height:48px;padding:11px 13px;border:1px solid #cbd9e4;border-radius:11px;background:#fff;color:var(--ink);font:650 18px system-ui}
.samples{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}.samples button{border:0;border-radius:9px;padding:9px 12px;background:#eaf5ff;color:#176b9b;font-weight:850;cursor:pointer}
.result{background:#f0f8ff;border:1px solid #d4eaf7;border-radius:12px;padding:14px;margin-top:14px;font-size:15px;line-height:1.6;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.tag{font-size:13px;font-weight:850;padding:7px 10px;border-radius:9px}.n{background:#e4f3ff;color:#176b9b}.w{background:#eaf7e3;color:#397d20}.z{background:#fff0dc;color:#a35d17}.q{background:#f0eaff;color:#6948ac}.i{background:#ffe9ef;color:#b43c61}.r{background:#e4f6f1;color:#197865}
.links{display:flex;gap:9px;margin-top:15px}.links a{flex:1;text-align:center;text-decoration:none;padding:12px;border-radius:10px;background:var(--blue);color:#fff;font-weight:850}.links a:last-child{background:#e8f4fc;color:#176b9b;border:1px solid #c8e2f1}
@media(max-width:480px){main{padding:16px 11px 28px}.card{padding:15px}.links{flex-direction:column}}
</style></head>
<body><header><div class="nav"><a href="maths-natural-integer-rational-irrational-numbers-quiz.html?v=20261106-class9-number-systems-types-v1&route=20261014-existing-quizzes-v1">← Quiz</a><b>SkillUp Maths</b></div></header>
<main>
<h1>🔢 Number Classifier</h1>
<p class="sub">Enter a number to identify all number sets it belongs to.</p>
<section class="card">
<label for="num">Enter a number or expression</label>
<input id="num" value="-7/4" autocomplete="off" spellcheck="false" aria-describedby="help">
<div class="samples"><button type="button" data-num="12">12</button><button type="button" data-num="0">0</button><button type="button" data-num="-5">−5</button><button type="button" data-num="3/8">3/8</button><button type="button" data-num="0.25">0.25</button><button type="button" data-num="√2">√2</button><button type="button" data-num="√49">√49</button><button type="button" data-num="π">π</button></div>
<div class="result" id="answer" aria-live="polite"></div>
<div class="tags" id="tags" aria-label="Number sets"></div>
<p class="hint" id="help">Try integers, fractions, terminating decimals, √number or π. Use a non-zero denominator.</p>
</section>
<div class="links"><a href="maths-natural-integer-rational-irrational-numbers-learn.html?v=20261121-number-systems-brief-learn-v2">📘 Quick Learn</a><a href="maths-natural-integer-rational-irrational-numbers-quiz.html?v=20261106-class9-number-systems-types-v1&route=20261014-existing-quizzes-v1">Take Quiz →</a></div>
</main>
<script>
(()=>{const $=id=>document.getElementById(id),names={N:'Natural (N)',W:'Whole (W)',Z:'Integer (Z)',Q:'Rational (Q)',I:'Irrational',R:'Real (R)'},styles={N:'n',W:'w',Z:'z',Q:'q',I:'i',R:'r'};
function parse(s){s=String(s).trim().replace(/[−]/g,'-').replace(/,/g,'');if(s==='π'||s.toLowerCase()==='pi')return{v:Math.PI,kind:'I',label:'π'};
if(/^√\s*\d+$/.test(s)){const n=Number(s.replace(/[^0-9]/g,'')),v=Math.sqrt(n);return{v,kind:Number.isInteger(v)?'Q':'I',label:'√'+n};}
if(/^-?\d+\s*\/\s*-?\d+$/.test(s)){const[a,b]=s.split('/').map(Number);if(!b)return null;return{v:a/b,kind:'Q',label:a+'/'+b};}
if(/^-?(?:\d+\.?\d*|\.\d+)$/.test(s))return{v:Number(s),kind:'Q',label:s};return null;}
function classify(){const raw=$('num').value,p=parse(raw),out=$('answer'),tags=$('tags');tags.replaceChildren();if(!p){out.textContent='Please enter a valid integer, fraction, decimal, √number or π.';return;}
let sets=[];if(p.kind==='I')sets=['I','R'];else{const v=p.v;if(Number.isInteger(v)&&v>=1)sets.push('N');if(Number.isInteger(v)&&v>=0)sets.push('W');if(Number.isInteger(v))sets.push('Z');sets.push('Q','R');}
sets.forEach(k=>{const el=document.createElement('span');el.className='tag '+styles[k];el.textContent=names[k];tags.appendChild(el);});
let msg=p.kind==='I'?p.label+' is irrational and real.':p.label+' is rational and real.';
if(p.kind==='Q'&&Number.isInteger(p.v)){if(p.v>=1)msg+=' It is also natural, whole and an integer.';else if(p.v===0)msg+=' It is whole and an integer, but not natural.';else msg+=' It is an integer, but not natural or whole.';}
else if(p.kind==='Q'&&raw.includes('/'))msg+=' It is a ratio of integers.';else if(p.kind==='Q')msg+=' A terminating decimal is rational.';
out.textContent=msg;}
$('num').addEventListener('input',classify);document.querySelectorAll('[data-num]').forEach(b=>b.addEventListener('click',()=>{$('num').value=b.dataset.num;classify();}));classify();
})();
</script></body></html>
