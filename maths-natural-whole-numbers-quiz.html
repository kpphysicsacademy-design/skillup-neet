<style>

ce-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Which number is a natural number?","o":["0","1","−1","1/2"],"a":1,"e":"Natural numbers used for counting begin with 1 in this convention."},{"d":"BASIC","q":"What is the smallest whole number?","o":["1","−1","0","10"],"a":2,"e":"Whole numbers include zero, so 0 is the smallest."},{"d":"BASIC","q":"Which set contains 0, 1, 2, 3, …?","o":["Natural numbers only","Whole numbers","Negative integers only","Fractions only"],"a":1,"e":"Whole numbers are 0 and all positive counting numbers."},{"d":"BASIC","q":"Which number comes immediately after 8?","o":["7","8","9","10"],"a":2,"e":"The next whole number after 8 is 9."},{"d":"BASIC","q":"Which number is neither positive nor negative?","o":["−1","0","1","10"],"a":1,"e":"Zero is neither positive nor negative."},{"d":"BASIC","q":"Which is the greatest number?","o":["14","41","24","40"],"a":1,"e":"41 has four tens and one unit, making it the greatest."},{"d":"BASIC","q":"How many whole numbers are there?","o":["10","100","1,000","Infinitely many"],"a":3,"e":"Whole numbers continue without an end."},{"d":"BASIC","q":"Which is a whole number?","o":["2.5","3/4","12","−3"],"a":2,"e":"12 is a non-negative integer."},{"d":"BASIC","q":"What is the predecessor of 15?","o":["13","14","15","16"],"a":1,"e":"The predecessor is one less: 15 − 1 = 14."},{"d":"BASIC","q":"What is the successor of 29?","o":["28","29","30","31"],"a":2,"e":"The successor is one more: 29 + 1 = 30."},{"d":"MEDIUM","q":"Which statement is true?","o":["Every natural number is a whole number","Every whole number is negative","0 is greater than every whole number","Whole numbers include 1/2"],"a":0,"e":"Natural numbers are contained within the whole numbers."},{"d":"MEDIUM","q":"How many whole numbers lie between 4 and 9?","o":["3","4","5","6"],"a":1,"e":"They are 5, 6, 7, and 8: four numbers."},{"d":"MEDIUM","q":"What is the sum of the smallest whole number and 37?","o":["0","36","37","38"],"a":2,"e":"The smallest whole number is 0, and 0 + 37 = 37."},{"d":"MEDIUM","q":"Which number lies between 199 and 201?","o":["198","200","202","210"],"a":1,"e":"200 is one more than 199 and one less than 201."},{"d":"MEDIUM","q":"Which comparison is correct?","o":["0 > 5","7 < 3","12 > 9","4 = 6"],"a":2,"e":"12 is greater than 9."},{"d":"MEDIUM","q":"Find 245 + 0.","o":["0","245","246","244"],"a":1,"e":"Zero is the additive identity: adding it leaves a number unchanged."},{"d":"MEDIUM","q":"Find 68 × 1.","o":["0","1","68","69"],"a":2,"e":"One is the multiplicative identity: 68 × 1 = 68."},{"d":"MEDIUM","q":"Which number has no whole-number predecessor?","o":["1","2","0","10"],"a":2,"e":"There is no whole number immediately before 0."},{"d":"MEDIUM","q":"How many whole numbers are from 6 to 10, including both endpoints?","o":["4","5","6","10"],"a":1,"e":"The list is 6, 7, 8, 9, 10: five numbers."},{"d":"MEDIUM","q":"Which list is in ascending order?","o":["5, 3, 4, 6","2, 4, 7, 9","8, 6, 7, 9","1, 0, 2, 3"],"a":1,"e":"Ascending order means smallest to largest."},{"d":"HARD","q":"How many whole numbers are strictly between 100 and 110?","o":["8","9","10","11"],"a":1,"e":"They are 101 through 109, which makes nine numbers."},{"d":"HARD","q":"A counter starts at 0 and increases by 5 each time. What is its fourth value after starting?","o":["15","20","25","5"],"a":1,"e":"The values after starting are 5, 10, 15, 20."},{"d":"HARD","q":"Which expression equals 1,000 using the identity property of multiplication?","o":["1,000 × 0","1,000 × 1","1,000 + 1","1,000 − 1"],"a":1,"e":"Multiplying by 1 leaves the number unchanged."},{"d":"HARD","q":"A number is 1 less than the successor of 456. What is it?","o":["455","456","457","458"],"a":1,"e":"The successor is 457; one less than 457 is 456."},{"d":"HARD","q":"How many whole numbers are less than 6?","o":["5","6","7","Infinite"],"a":1,"e":"They are 0, 1, 2, 3, 4, and 5: six numbers."},{"d":"HARD","q":"Which statement about zero is correct?","o":["Zero has a whole-number predecessor","Zero is the smallest whole number","Zero is greater than 1","Zero is not a whole number"],"a":1,"e":"Zero is the smallest whole number."},{"d":"HARD","q":"If a = 125, what is a + 0 + 1?","o":["125","126","127","0"],"a":1,"e":"125 + 0 + 1 = 126."},{"d":"HARD","q":"A number line starts at 0. Move 7 steps right, then 3 steps left. Where do you land?","o":["3","4","7","10"],"a":1,"e":"Starting at 0: move to 7, then left to 4."},{"d":"HARD","q":"Which is the correct order from smallest to largest?","o":["0, 1, 10, 2","0, 1, 2, 10","10, 2, 1, 0","1, 0, 2, 10"],"a":1,"e":"Compare values: 0 < 1 < 2 < 10."},{"d":"HARD","q":"A whole number has successor 1,001. What is the number?","o":["999","1,000","1,001","1,002"],"a":1,"e":"The predecessor of 1,001 is 1,000."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Recognise whole numbers</strong><small>Identify natural numbers and zero</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Compare and order</strong><small>Arrange numbers and find numbers between values</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Use number properties</strong><small>Apply zero, one, successor and predecessor</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
