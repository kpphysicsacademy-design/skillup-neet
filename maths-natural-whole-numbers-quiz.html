te"],"a":1,"why":"They are 0, 1, 2, 3, 4, and 5: six numbers."},{"level":"HARD","q":"Which statement about zero is correct?","o":["Zero has a whole-number predecessor","Zero is the smallest whole number","Zero is greater than 1","Zero is not a whole number"],"a":1,"why":"Zero is the smallest whole number."},{"level":"HARD","q":"If a = 125, what is a + 0 + 1?","o":["125","126","127","0"],"a":1,"why":"125 + 0 + 1 = 126."},{"level":"HARD","q":"A number line starts at 0. Move 7 steps right, then 3 steps left. Where do you land?","o":["3","4","7","10"],"a":1,"why":"Starting at 0: move to 7, then left to 4."},{"level":"HARD","q":"Which is the correct order from smallest to largest?","o":["0, 1, 10, 2","0, 1, 2, 10","10, 2, 1, 0","1, 0, 2, 10"],"a":1,"why":"Compare values: 0 < 1 < 2 < 10."},{"level":"HARD","q":"A whole number has successor 1,001. What is the number?","o":["999","1,000","1,001","1,002"],"a":1,"why":"The predecessor of 1,001 is 1,000."}];

ng){const retryQuestions=onlyWrong?wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean):originalQuestions.slice();questions.splice(0,questions.length,...retryQuestions);index=0;score=0;wrongAttempts=[];$('xp').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});} $('retry').addEventListener('click',()=>reset(false));$('retryWrong').addEventListener('click',()=>reset(true));});render();})();
