<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"A net is a flat pattern that can be folded to make a...","o":["3D solid","number line","circle only","line segment"],"a":0,"e":"A net shows the faces laid flat before they are folded into a solid.","v":"nets-of-solids"},{"d":"BASIC","q":"Which solid can be made from a net of 6 equal squares?","o":["Cone","Cube","Triangular prism","Cylinder"],"a":1,"e":"Six equal square faces fold together to form a cube.","v":"nets-of-solids"},{"d":"BASIC","q":"A cube net must contain how many square faces?","o":["4","5","6","8"],"a":2,"e":"A cube has six square faces, so its net must include six squares.","v":"nets-of-solids"},{"d":"BASIC","q":"Which 2D shape is needed for the curved side of a cylinder's net?","o":["Triangle","Pentagon","Hexagon","Rectangle"],"a":3,"e":"The curved surface unwraps into a rectangle, alongside two circular bases.","v":"nets-of-solids"},{"d":"BASIC","q":"A cone's net contains one circular sector and one...","o":["circle","rectangle","square","triangle"],"a":0,"e":"A cone's net has a circular sector for its curved surface and a circle for its base.","v":"nets-of-solids"},{"d":"BASIC","q":"Which solid has a net made of 2 circles and 1 rectangle?","o":["Cone","Cylinder","Cube","Square-based pyramid"],"a":1,"e":"The rectangle forms the curved side and the circles form the two ends.","v":"nets-of-solids"},{"d":"BASIC","q":"A triangular prism net includes how many triangular faces?","o":["1","3","2","4"],"a":2,"e":"A triangular prism has two triangular ends.","v":"nets-of-solids"},{"d":"BASIC","q":"Which solid's net can have a square base and four triangles?","o":["Cube","Cuboid","Cylinder","Square-based pyramid"],"a":3,"e":"The square is the base and each triangle folds up to meet at the apex.","v":"nets-of-solids"},{"d":"BASIC","q":"A cuboid net contains how many rectangular faces?","o":["6","4","5","8"],"a":0,"e":"A cuboid has six rectangular faces.","v":"nets-of-solids"},{"d":"BASIC","q":"What happens when the faces of a valid net are folded along their edges?","o":["They form a circle every time","They form a 3D solid","They overlap completely","They always form a cylinder"],"a":1,"e":"A valid net folds so its faces meet along matching edges and enclose a solid.","v":"nets-of-solids"},{"d":"MEDIUM","q":"Which collection of faces can make a triangular prism net?","o":["2 rectangles and 3 triangles","4 triangles and 1 square","3 rectangles and 2 triangles","6 equal squares"],"a":2,"e":"A triangular prism has three rectangular side faces and two triangular ends.","v":"nets-of-solids"},{"d":"MEDIUM","q":"Which collection of faces can make a square-based pyramid net?","o":["2 squares and 4 triangles","1 rectangle and 2 circles","6 equal squares","1 square and 4 triangles"],"a":3,"e":"The pyramid's square base is joined to four triangular side faces.","v":"nets-of-solids"},{"d":"MEDIUM","q":"A cube net has six squares. How many edges will be shared by pairs of faces in the folded cube?","o":["12","6","8","14"],"a":0,"e":"A cube has 12 edges; each edge is where two faces meet.","v":"nets-of-solids"},{"d":"MEDIUM","q":"Which statement about a cylinder net is correct?","o":["The rectangle's length equals the circle's diameter","The rectangle's length equals the circumference of the circular base","The rectangle is a square in every cylinder","The rectangle replaces both circular bases"],"a":1,"e":"When unwrapped, the curved side spans one full circumference around the base.","v":"nets-of-solids"},{"d":"MEDIUM","q":"A cone's curved surface is unwrapped. Which shape does it form?","o":["A rectangle","A triangle","A circular sector","A complete ring"],"a":2,"e":"The cone's curved surface unfolds as a sector of a circle.","v":"nets-of-solids"},{"d":"MEDIUM","q":"Which net is appropriate for a cuboid with dimensions 2 cm, 3 cm and 5 cm?","o":["Six 2×3 rectangles","Two 2×2 squares and four circles","Five identical 3×5 rectangles","Three pairs of rectangles: 2×3, 2×5, and 3×5"],"a":3,"e":"Opposite faces of the cuboid form pairs with dimensions 2×3, 2×5, and 3×5.","v":"nets-of-solids"},{"d":"MEDIUM","q":"A net for a cube has four squares in a row and one square attached above and one below the second square. What solid can it form?","o":["A cube","A cone","A triangular prism","A cylinder"],"a":0,"e":"This common six-square arrangement folds into the six faces of a cube.","v":"nets-of-solids"},{"d":"MEDIUM","q":"What must be true of two faces that share an edge in a net?","o":["Their areas must be equal","Their shared edge lengths must match","They must have the same shape","They must be circles"],"a":1,"e":"Faces joined along an edge must have equal lengths along that shared edge.","v":"nets-of-solids"},{"d":"MEDIUM","q":"A triangular pyramid net is made of how many triangular faces?","o":["3","5","4","6"],"a":2,"e":"A triangular pyramid, or tetrahedron, has four triangular faces.","v":"nets-of-solids"},{"d":"MEDIUM","q":"Which net components form a square-based pyramid?","o":["Two squares and two triangles","Three rectangles and two triangles","Two circles and one rectangle","One square and four triangles"],"a":3,"e":"The square base and four triangular sides fold into the pyramid.","v":"nets-of-solids"},{"d":"HARD","q":"A cube net has 6 squares. How many faces meet at each vertex after folding?","o":["3","2","4","6"],"a":0,"e":"At every cube vertex, three square faces meet.","v":"nets-of-solids"},{"d":"HARD","q":"A cuboid has dimensions 4 cm × 3 cm × 2 cm. What is the total area of the rectangles in its net?","o":["24 cm²","52 cm²","48 cm²","26 cm²"],"a":1,"e":"Surface area = 2(4×3 + 4×2 + 3×2) = 2(12 + 8 + 6) = 52 cm².","v":"nets-of-solids"},{"d":"HARD","q":"A cube has side length 5 cm. What is the total area of its net before folding?","o":["25 cm²","100 cm²","150 cm²","125 cm²"],"a":2,"e":"The net has six squares, each 5×5 = 25 cm², so total area is 6×25 = 150 cm².","v":"nets-of-solids"},{"d":"HARD","q":"A cylinder has radius 3 cm and height 7 cm. What is the area of its rectangular curved-surface net? Use π = 3.14.","o":["65.94 cm²","94.2 cm²","197.82 cm²","131.88 cm²"],"a":3,"e":"Rectangle area = circumference × height = 2πr × h = 2×3.14×3×7 = 131.88 cm².","v":"nets-of-solids"},{"d":"HARD","q":"A cone has base radius 4 cm and slant height 5 cm. What is its curved surface area? Use π = 3.14.","o":["62.8 cm²","50.24 cm²","31.4 cm²","125.6 cm²"],"a":0,"e":"The sector area equals πrl = 3.14×4×5 = 62.8 cm².","v":"nets-of-solids"},{"d":"HARD","q":"Which arrangement is a valid cube net?","o":["Six squares all attached around one central square in a way that forces overlap","Six squares arranged in a cross-like pattern that folds without overlap","Five squares in a row only","Four squares arranged in a 2×2 block only"],"a":1,"e":"A valid cube net has six squares arranged so folding produces six distinct faces without overlap.","v":"nets-of-solids"},{"d":"HARD","q":"A triangular prism has triangular ends with sides 3 cm, 4 cm and 5 cm, and prism length 10 cm. What is the total area of its net?","o":["120 cm²","60 cm²","132 cm²","144 cm²"],"a":2,"e":"Three rectangles total 10(3+4+5)=120 cm²; the two triangles total 2×(½×3×4)=12 cm²; total 132 cm².","v":"nets-of-solids"},{"d":"HARD","q":"A square-based pyramid has base side 6 cm and each triangular side has base 6 cm and height 5 cm. What is the total net area?","o":["66 cm²","90 cm²","120 cm²","96 cm²"],"a":3,"e":"Base area = 36 cm²; four triangles total 4×(½×6×5)=60 cm²; total 96 cm².","v":"nets-of-solids"},{"d":"HARD","q":"Which net has enough faces for a hexagonal prism?","o":["2 hexagons and 6 rectangles","1 hexagon and 6 rectangles","2 hexagons and 5 rectangles","6 hexagons and 2 rectangles"],"a":0,"e":"A hexagonal prism has two hexagonal bases and six rectangular side faces.","v":"nets-of-solids"},{"d":"HARD","q":"A cuboid net has faces measuring 8×5, 8×2, and 5×2 cm, with each rectangle appearing twice. What is its total area?","o":["66 cm²","132 cm²","80 cm²","160 cm²"],"a":1,"e":"Total area = 2(40+16+10)=132 cm².","v":"nets-of-solids"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand nets of 3D solids</strong><small>Match flat patterns to solid shapes</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Recognise faces in nets of prisms and pyramids</strong><small>Calculate surface area from a net</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve net and surface-area problems</strong><small>Connect 2D patterns to 3D solids</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
