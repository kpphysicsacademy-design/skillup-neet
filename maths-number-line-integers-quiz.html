 .skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}.skills-result{margin-top:14px;text-align:left}.skills-result h3{margin:0 0 8px;font-size:1rem}.skills-result .skill-item{margin-top:7px}.skill-item.unlocked{border-color:var(--green);color:var(--green2);background:#174b42} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}.diagram .accent{stroke:#58d6a3}.diagram .blue{stroke:#91b7ff}.diagram .gold{stroke:#ffd27a}.skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}.skills-result{margin-top:14px;text-align:left}.skills-result h3{margin:0 0 8px;font-size:1rem}.skills-result .skill-item{margin-top:7px}.skill-item.unlocked{border-color:var(--green);color:var(--green2);background:#174b42}</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Number Line with Integers</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Number Line with Integers skills"><div class="skill-title">🎯 Number Line Skills</div><div class="skill-list"><div class="skill-item">Locate integers accurately on a number line</div><div class="skill-item">Compare positions and find distances</div><div class="skill-item">Solve multi-step movement problems</div></div></section></div><script>(function(){'use strict';const questions=[{"d":"BASIC","q":"On the number line, which integer is 3 units to the right of 0?","o":["−3","0","3","4"],"a":2,"e":"Each step to the right increases the value by 1, so three steps right of zero is 3.","v":"numberline"},{"d":"BASIC","q":"Which integer is marked 4 steps to the left of 0?","o":["4","−4","−3","0"],"a":1,"e":"Moving four equal steps left from zero reaches −4.","v":"numberline"},{"d":"BASIC","q":"What integer lies one step to the right of −2?","o":["−3","−1","1","2"],"a":1,"e":"Moving one step right increases −2 to −1.","v":"steps"},{"d":"BASIC","q":"What integer lies one step to the left of 5?","o":["6","4","−5","0"],"a":1,"e":"The integer immediately left of 5 is 4.","v":"steps"},{"d":"BASIC","q":"Which number is halfway between −2 and 2 on the number line?","o":["−1","0","1","2"],"a":1,"e":"The midpoint of −2 and 2 is zero because they are equally far from it.","v":"zero"},{"d":"BASIC","q":"Which list is arranged from left to right on a number line?","o":["3, 1, 0, −2","−2, 0, 1, 3","0, −2, 3, 1","1, 3, −2, 0"],"a":1,"e":"Values increase from left to right: −2, 0, 1, 3.","v":"sequence"},{"d":"BASIC","q":"How far apart are −3 and 2 on the number line?","o":["1 unit","5 units","−5 units","6 units"],"a":1,"e":"Count from −3 to 2: −3 to −2 to −1 to 0 to 1 to 2 is 5 units.","v":"distance"},{"d":"BASIC","q":"Which integer is farther left: −6 or −4?","o":["−4","−6","They are at the same point","0"],"a":1,"e":"−6 is smaller than −4, so it lies farther left.","v":"compare"},{"d":"BASIC","q":"What is the distance from 0 to −7?","o":["−7 units","0 units","7 units","14 units"],"a":2,"e":"Distance is non-negative; −7 is seven units from zero.","v":"absolute"},{"d":"BASIC","q":"A point is at 2 and moves 3 units left. Where does it land?","o":["5","−1","−5","1"],"a":1,"e":"Starting at 2 and moving left three steps gives 2 − 3 = −1.","v":"steps"},{"d":"MEDIUM","q":"Which integer is 4 units to the right of −5?","o":["−9","−1","1","9"],"a":1,"e":"Starting at −5 and moving right four steps reaches −1.","v":"steps"},{"d":"MEDIUM","q":"Which integer is 6 units to the left of 2?","o":["8","−8","−4","4"],"a":2,"e":"2 − 6 = −4, so the point lands at −4.","v":"steps"},{"d":"MEDIUM","q":"What is the distance between −8 and −3?","o":["−5 units","5 units","11 units","3 units"],"a":1,"e":"From −8 to −3 is five steps to the right.","v":"distance"},{"d":"MEDIUM","q":"Which is the correct increasing order?","o":["−1, −4, 2, 5","−4, −1, 2, 5","5, 2, −1, −4","−4, 2, −1, 5"],"a":1,"e":"Increasing order follows the number line from left to right: −4, −1, 2, 5.","v":"sequence"},{"d":"MEDIUM","q":"A marker moves from −4 to 3. How many units does it travel?","o":["1","7","−7","12"],"a":1,"e":"The distance from −4 to 3 is 7 units.","v":"distance"},{"d":"MEDIUM","q":"Which point is closest to zero?","o":["−6","4","−2","5"],"a":2,"e":"The distance of −2 from zero is 2 units, less than the other distances.","v":"absolute"},{"d":"MEDIUM","q":"The point A is at −3 and point B is at −7. Which statement is true?","o":["A is left of B","B is left of A","They are the same point","Both are right of zero"],"a":1,"e":"−7 is smaller than −3, so B lies to the left of A.","v":"compare"},{"d":"MEDIUM","q":"What integer is exactly 2 units to the left of −1?","o":["1","−3","−2","3"],"a":1,"e":"Two steps left from −1 gives −2, then −3.","v":"numberline"},{"d":"MEDIUM","q":"A temperature point moves from −6°C to 1°C on a vertical number line. How many degrees did it rise?","o":["5°C","7°C","−7°C","−5°C"],"a":1,"e":"The change is 1 − (−6) = 7 degrees.","v":"thermometer"},{"d":"MEDIUM","q":"Which integer has a distance of 5 units from zero and lies to the left of zero?","o":["5","−5","0","−4"],"a":1,"e":"Five units left of zero is −5.","v":"absolute"},{"d":"HARD","q":"A point starts at −9, moves 12 units right, then 5 units left. Where does it finish?","o":["−2","−14","8","2"],"a":0,"e":"−9 + 12 − 5 = 3 − 5 = −2.","v":"steps"},{"d":"HARD","q":"Point P is at −4 and point Q is at 6. What is the distance between them?","o":["2 units","10 units","−10 units","24 units"],"a":1,"e":"From −4 to 0 is 4 units and from 0 to 6 is 6, totalling 10.","v":"distance"},{"d":"HARD","q":"Three consecutive integer points appear from left to right as □, −1, □. What are the missing integers?","o":["−3 and 0","−2 and 0","0 and −2","−1 and 1"],"a":1,"e":"The integer immediately before −1 is −2, and the one after is 0.","v":"sequence"},{"d":"HARD","q":"A token starts at 4. It moves left 9 units, right 2 units, then left 3 units. What is its final position?","o":["−6","−10","0","2"],"a":0,"e":"4 − 9 + 2 − 3 = −5 + 2 − 3 = −6.","v":"steps"},{"d":"HARD","q":"The distance from integer x to zero is 8 units, and x is to the right of zero. What is x?","o":["−8","8","0","16"],"a":1,"e":"Eight units to the right of zero is +8.","v":"absolute"},{"d":"HARD","q":"On a number line, A = −11 and B = −2. How many units must A move right to reach B?","o":["9","−9","13","−13"],"a":0,"e":"−11 to −2 is 9 steps to the right.","v":"distance"},{"d":"HARD","q":"A number is 3 units to the left of −2. Which number is 5 units to the right of that number?","o":["0","−10","−4","6"],"a":0,"e":"Three left of −2 is −5; five right of −5 is 0.","v":"steps"},{"d":"HARD","q":"Which pair of integers has a distance of 6 units and lies on opposite sides of zero?","o":["−2 and 4","−3 and 3","−1 and 5","−4 and 2"],"a":1,"e":"−3 to 0 is 3 units and 0 to 3 is 3 units, so the distance is 6 and the points are on opposite sides.","v":"opposite"},{"d":"HARD","q":"A point is at −7. It moves 4 units right, then moves to a point 6 units left of zero. How far does it travel in total?","o":["1 unit","5 units","7 units","11 units"],"a":2,"e":"First it reaches −3, then travels from −3 to −6, which is 3 more units; total distance is 4 + 3 = 7 units.","v":"distance"},{"d":"HARD","q":"Integers A, B and C are consecutive and appear left to right. If B = 0, what is A + C?","o":["−2","0","1","2"],"a":1,"e":"The consecutive integers are −1, 0, 1; the outer values sum to −1 + 1 = 0.","v":"sequence"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');const visuals={
numberline:'',
steps:'',
distance:'',
compare:'',
zero:'',
sequence:'',
absolute:'',
thermometer:'',
opposite:''
};function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const skills=[['Locate integers and identify neighbours',8],['Compare integers and calculate distances',18],['Solve multi-step number-line problems',24]];$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">📏</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+skills.map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script></body></html>
