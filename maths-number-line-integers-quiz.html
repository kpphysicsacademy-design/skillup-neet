s"},{"d":"HARD","q":"Point P is at −4 and point Q is at 6. What is the distance between them?","o":["2 units","10 units","−10 units","24 units"],"a":1,"e":"From −4 to 0 is 4 units and from 0 to 6 is 6, totalling 10.","v":"distance"},{"d":"HARD","q":"Three consecutive integer points appear from left to right as □, −1, □. What are the missing integers?","o":["−3 and 0","−2 and 0","0 and −2","−1 and 1"],"a":1,"e":"The integer immediately before −1 is −2, and the one after is 0.","v":"sequence"},{"d":"HARD","q":"A token starts at 4. It moves left 9 units, right 2 units, then left 3 units. What is its final position?","o":["−6","−10","0","2"],"a":0,"e":"4 − 9 + 2 − 3 = −5 + 2 − 3 = −6.","v":"steps"},{"d":"HARD","q":"The distance from integer x to zero is 8 units, and x is to the right of zero. What is x?","o":["−8","8","0","16"],"a":1,"e":"Eight units to the right of zero is +8.","v":"absolute"},{"d":"HARD","q":"On a number line, A = −11 and B = −2. How many units must A move right to reach B?","o":["9","−9","13","−13"],"a":0,"e":"−11 to −2 is 9 steps to the right.","v":"distance"},{"d":"HARD","q":"A number is 3 units to the left of −2. Which number is 5 units to the right of that number?","o":["0","−10","−4","6"],"a":0,"e":"Three left of −2 is −5; five right of −5 is 0.","v":"steps"},{"d":"HARD","q":"Which pair of integers has a distance of 6 units and lies on opposite sides of zero?","o":["−2 and 4","−3 and 3","−1 and 5","−4 and 2"],"a":1,"e":"−3 to 0 is 3 units and 0 to 3 is 3 units, so the distance is 6 and the points are on opposite sides.","v":"opposite"},{"d":"HARD","q":"A point is at −7. It moves 4 units right, then moves to a point 6 units left of zero. How far does it travel in total?","o":["1 unit","5 units","7 units","11 units"],"a":2,"e":"First it reaches −3, then travels from −3 to −6, which is 3 more units; total distance is 4 + 3 = 7 units.","v":"distance"},{"d":"HARD","q":"Integers A, B and C are consecutive and appear left to right. If B = 0, what is A
