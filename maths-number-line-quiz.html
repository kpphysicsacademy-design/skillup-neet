:focus-visible{outline:2px solid var(--blue);outline-offset:2px}@media(max-width:480px){.nav{min-height:44px;padding:5px 9px;gap:7px}.brand{font-size:14px}.pill{font-size:10px;padding:5px 7px}main{width:100%;padding:10px 9px 22px}.hero{padding:2px 2px 10px}.hero h1{font-size:19px}.quiz,.finish{padding:12px;border-radius:11px}.question{font-size:18px;margin:7px 0 11px}.option{min-height:39px;padding:7px 9px;font-size:13px}.options{gap:6px}.btn{min-height:37px;font-size:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}

<main><section class="hero"><h1>📍 Number Line</h1><p class="muted">Locate numbers · Move left and right · Compare integers · Find distance and midpoint</p><div style="display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0"><a href="maths-number-line-simulator.html?v=20261110-number-line-simulator-v1" style="display:block;text-align:center;text-decoration:none;background:#eaf7ff;color:#116b96;padding:10px;border-radius:10px;font-weight:800;font-size:13px;border:1px solid #b8deed">📐 Simulate Number Lines</a></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1 · BASIC</div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section><div id="finishSlot"></div></main>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"On a number line, which number is immediately to the right of 3?","o":["2","3","4","5"],"a":2,"e":"Numbers increase as you move to the right."},{"d":"BASIC","q":"Which number is immediately to the left of 7?","o":["5","6","7","8"],"a":1,"e":"One step left from 7 is 6."},{"d":"BASIC","q":"Where is zero usually placed on a number line?","o":["At the origin","At the far right","At the far left always","Above 1"],"a":0,"e":"Zero is the reference point called the origin."},{"d":"BASIC","q":"Which number is greater on a number line?","o":["2","5","They are equal","Cannot tell"],"a":1,"e":"The number farther to the right is greater."},{"d":"BASIC","q":"How many unit steps are there from 0 to 4?","o":["2","3","4","5"],"a":2,"e":"Count four steps: 0→1→2→3→4."},{"d":"BASIC","q":"Which number is halfway between 2 and 4?","o":["1","2","3","4"],"a":2,"e":"The midpoint between 2 and 4 is 3."},{"d":"BASIC","q":"If you move 1 step right from 9, where do you land?","o":["8","9","10","11"],"a":2,"e":"Moving one step right adds 1: 9 + 1 = 10."},{"d":"BASIC","q":"Which direction shows decreasing numbers?","o":["Right","Left","Up","Down"],"a":1,"e":"Moving left along a standard number line means the values decrease."},{"d":"BASIC","q":"Which number is between 5 and 7?","o":["4","5","6","8"],"a":2,"e":"6 is greater than 5 and less than 7."},{"d":"BASIC","q":"What is the distance between 1 and 6 on a number line?","o":["4 units","5 units","6 units","7 units"],"a":1,"e":"Distance is the difference: 6 − 1 = 5 units."},{"d":"MEDIUM","q":"Start at 4 and move 3 steps right. Where do you land?","o":["1","6","7","8"],"a":2,"e":"Moving right adds 3: 4 + 3 = 7."},{"d":"MEDIUM","q":"Start at 9 and move 5 steps left. Where do you land?","o":["3","4","5","14"],"a":1,"e":"Moving left subtracts 5: 9 − 5 = 4."},{"d":"MEDIUM","q":"Which number is 2 units to the left of 3?","o":["1","2","4","5"],"a":0,"e":"Two steps left from 3 gives 2, then 1."},{"d":"MEDIUM","q":"What is the distance between −2 and 3 on a number line?","o":["1 unit","3 units","5 units","6 units"],"a":2,"e":"From −2 to 0 is 2 units and 0 to 3 is 3 units; total 5."},{"d":"MEDIUM","q":"Which is the correct order from left to right?","o":["4, 2, 0","0, 2, 4","2, 0, 4","4, 0, 2"],"a":1,"e":"Values increase from left to right: 0, 2, 4."},{"d":"MEDIUM","q":"What number is exactly halfway between 10 and 16?","o":["12","13","14","15"],"a":1,"e":"The midpoint is (10 + 16) ÷ 2 = 13."},{"d":"MEDIUM","q":"A point is at −1. It moves 4 units right. Where is it now?","o":["−5","−3","3","4"],"a":2,"e":"−1 + 4 = 3."},{"d":"MEDIUM","q":"Which number is farther right?","o":["−4","−1","They are equal","Cannot tell"],"a":1,"e":"−1 is greater than −4, so it lies farther right."},{"d":"MEDIUM","q":"A point moves from 2 to 8. How many units did it travel?","o":["5","6","8","10"],"a":1,"e":"The distance is 8 − 2 = 6 units."},{"d":"MEDIUM","q":"Which point is 3 units to the left of 0?","o":["−3","−2","3","2"],"a":0,"e":"Moving left from zero gives negative numbers; three steps gives −3."},{"d":"HARD","q":"Start at −3, move 8 units right, then 2 units left. Where do you end?","o":["1","2","3","7"],"a":2,"e":"−3 + 8 − 2 = 3."},{"d":"HARD","q":"The distance between a number and 4 is 7 units. Which could the number be?","o":["−3","−2","3","10"],"a":0,"e":"The number −3 is 7 units from 4 because 4 − (−3) = 7."},{"d":"HARD","q":"A point moves from −5 to 2. How many units does it move?","o":["3","5","7","8"],"a":2,"e":"Distance = 2 − (−5) = 7 units."},{"d":"HARD","q":"What is the midpoint between −6 and 4?","o":["−2","−1","0","2"],"a":1,"e":"The midpoint is (−6 + 4) ÷ 2 = −1."},{"d":"HARD","q":"A point at 7 moves left by 12 units. Where does it land?","o":["−5","−4","5","19"],"a":0,"e":"7 − 12 = −5."},{"d":"HARD","q":"Which integer is 4 units from −2 and lies to its right?","o":["−6","−4","2","4"],"a":2,"e":"Moving four units right from −2 gives 2."},{"d":"HARD","q":"A point travels from 3 to −4 and then to 1. What is the total distance travelled?","o":["11 units","12 units","7 units","5 units"],"a":1,"e":"From 3 to −4 is 7 units; from −4 to 1 is 5 units; total 12 units."},{"d":"HARD","q":"Which statement is always true on a standard number line?","o":["Numbers increase to the left","Numbers increase to the right","Negative numbers are right of zero","Zero is greater than every number"],"a":1,"e":"On a standard number line, values increase as you move right."},{"d":"HARD","q":"A point at −8 moves 3 units right and then 6 units right. What is its final position?","o":["−17","−5","1","−1"],"a":2,"e":"−8 + 3 + 6 = 1."},{"d":"HARD","q":"The midpoint of two numbers is 5. One number is 2. What is the other number?","o":["6","7","8","10"],"a":2,"e":"(2 + x) ÷ 2 = 5, so x = 8."}];const originalQuestions=questions.slice();let index=0,selected=-1,locked=false,xp=0,correct=0,streak=0;const mistakes=[];const $=id=>document.getElementById(id);function progress(){const p=Math.round(index/questions.length*100);$('fill').style.width=p+'%';$('percent').textContent=p+'%';$('progressText').textContent='Question '+Math.min(index+1,questions.length)+' of '+questions.length;document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',p)}
function render(){const q=questions[index];selected=-1;locked=false;$('qmeta').textContent='QUESTION '+(index+1)+' · '+q.d;$('question').textContent=q.q;$('options').innerHTML=q.o.map((v,i)=>'<button class="option" type="button" data-i="'+i+'"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+v+'</span></button>').join('');$('options').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('options').querySelectorAll('.option').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('check').disabled=false}));$('feedback').className='feedback';$('feedback').textContent='';$('check').style.display='block';$('check').disabled=true;$('continue').className='btn continue';progress()}
function check(){if(selected<0||locked)return;locked=true;const q=questions[index],good=selected===q.a;if(good){correct++;xp+=10;streak++;$('xp').textContent=xp;$('streak').textContent=streak}else{streak=0;$('streak').textContent='0';mistakes.push({q:q.q,chosen:q.o[selected],answer:q.o[q.a],why:q.e});}$('options').querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong')});$('feedback').textContent=(good?'✓ Correct! ':'Review this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('check').style.display='none';$('continue').className='btn continue show';$('continue').textContent=index===questions.length-1?'See results →':'Continue →'}
function finish(){progress();$('quiz').style.display='none';const slot=$('finishSlot');slot.innerHTML='<section class="finish"><div class="trophy">🏆</div><h2>'+(correct>=25?'Excellent work!':correct>=18?'Good progress!':'Keep practising!')+'</h2><div class="score">'+correct+' / '+questions.length+'</div><p class="muted">You answered '+correct+' correctly and earned '+xp+' XP.</p><p><b>'+Math.round(correct/questions.length*100)+'%</b> accuracy</p><div class="review">'+(mistakes.length?'<h3>Review your mistakes ('+mistakes.length+')</h3>':'<h3>Perfect round!</h3>')+mistakes.map((m,i)=>'<div class="review-item"><b>'+(i+1)+'. '+m.q+'</b><p class="your-answer">Your answer: '+m.chosen+'</p><p class="correct-answer">Correct answer: '+m.answer+'</p><p>'+m.why+'</p></div>').join('')+'</div><div class="review-actions"><button class="btn" id="retryWrong" '+(mistakes.length?'':'disabled')+'>Retry mistakes</button><button class="btn" id="retryAll">Retry all</button></div></section>';$('retryWrong').addEventListener('click',()=>restart(true));$('retryAll').addEventListener('click',()=>restart(false))}
function restart(wrongOnly){const next=wrongOnly?originalQuestions.filter(q=>mistakes.some(m=>m.q===q.q)):originalQuestions.slice();questions.splice(0,questions.length,...next);index=0;selected=-1;locked=false;xp=0;correct=0;streak=0;mistakes.length=0;$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').innerHTML='';render()}
$('check').addEventListener('click',check);$('continue').addEventListener('click',()=>{index++;if(index<questions.length)render();else finish()});render()})();
</script></body></html>
