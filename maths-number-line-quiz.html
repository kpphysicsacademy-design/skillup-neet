<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261012-number-line-duolingo-v2"><title>Number Line Quiz | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Number line</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"On a number line, which number is immediately to the right of 3?","o":["2","3","4","5"],"a":2,"e":"Numbers increase as you move to the right."},{"d":"BASIC","q":"Which number is immediately to the left of 7?","o":["5","6","7","8"],"a":1,"e":"One step left from 7 is 6."},{"d":"BASIC","q":"Where is zero usually placed on a number line?","o":["At the origin","At the far right","At the far left always","Above 1"],"a":0,"e":"Zero is the reference point called the origin."},{"d":"BASIC","q":"Which number is greater on a number line?","o":["2","5","They are equal","Cannot tell"],"a":1,"e":"The number farther to the right is greater."},{"d":"BASIC","q":"How many unit steps are there from 0 to 4?","o":["2","3","4","5"],"a":2,"e":"Count four steps: 0→1→2→3→4."},{"d":"BASIC","q":"Which number is halfway between 2 and 4?","o":["1","2","3","4"],"a":2,"e":"The midpoint between 2 and 4 is 3."},{"d":"BASIC","q":"If you move 1 step right from 9, where do you land?","o":["8","9","10","11"],"a":2,"e":"Moving one step right adds 1: 9 + 1 = 10."},{"d":"BASIC","q":"Which direction shows decreasing numbers?","o":["Right","Left","Up","Down"],"a":1,"e":"Moving left along a standard number line means the values decrease."},{"d":"BASIC","q":"Which number is between 5 and 7?","o":["4","5","6","8"],"a":2,"e":"6 is greater than 5 and less than 7."},{"d":"BASIC","q":"What is the distance between 1 and 6 on a number line?","o":["4 units","5 units","6 units","7 units"],"a":1,"e":"Distance is the difference: 6 − 1 = 5 units."},{"d":"MEDIUM","q":"Start at 4 and move 3 steps right. Where do you land?","o":["1","6","7","8"],"a":2,"e":"Moving right adds 3: 4 + 3 = 7."},{"d":"MEDIUM","q":"Start at 9 and move 5 steps left. Where do you land?","o":["3","4","5","14"],"a":1,"e":"Moving left subtracts 5: 9 − 5 = 4."},{"d":"MEDIUM","q":"Which number is 2 units to the left of 3?","o":["1","2","4","5"],"a":0,"e":"Two steps left from 3 gives 2, then 1."},{"d":"MEDIUM","q":"What is the distance between −2 and 3 on a number line?","o":["1 unit","3 units","5 units","6 units"],"a":2,"e":"From −2 to 0 is 2 units and 0 to 3 is 3 units; total 5."},{"d":"MEDIUM","q":"Which is the correct order from left to right?","o":["4, 2, 0","0, 2, 4","2, 0, 4","4, 0, 2"],"a":1,"e":"Values increase from left to right: 0, 2, 4."},{"d":"MEDIUM","q":"What number is exactly halfway between 10 and 16?","o":["12","13","14","15"],"a":1,"e":"The midpoint is (10 + 16) ÷ 2 = 13."},{"d":"MEDIUM","q":"A point is at −1. It moves 4 units right. Where is it now?","o":["−5","−3","3","4"],"a":2,"e":"−1 + 4 = 3."},{"d":"MEDIUM","q":"Which number is farther right?","o":["−4","−1","They are equal","Cannot tell"],"a":1,"e":"−1 is greater than −4, so it lies farther right."},{"d":"MEDIUM","q":"A point moves from 2 to 8. How many units did it travel?","o":["5","6","8","10"],"a":1,"e":"The distance is 8 − 2 = 6 units."},{"d":"MEDIUM","q":"Which point is 3 units to the left of 0?","o":["−3","−2","3","2"],"a":0,"e":"Moving left from zero gives negative numbers; three steps gives −3."},{"d":"HARD","q":"Start at −3, move 8 units right, then 2 units left. Where do you end?","o":["1","2","3","7"],"a":2,"e":"−3 + 8 − 2 = 3."},{"d":"HARD","q":"The distance between a number and 4 is 7 units. Which could the number be?","o":["−3","−2","3","11"],"a":0,"e":"The number −3 is 7 units from 4 because 4 − (−3) = 7."},{"d":"HARD","q":"A point moves from −5 to 2. How many units does it move?","o":["3","5","7","8"],"a":2,"e":"Distance = 2 − (−5) = 7 units."},{"d":"HARD","q":"What is the midpoint between −6 and 4?","o":["−2","−1","0","2"],"a":1,"e":"The midpoint is (−6 + 4) ÷ 2 = −1."},{"d":"HARD","q":"A point at 7 moves left by 12 units. Where does it land?","o":["−5","−4","5","19"],"a":0,"e":"7 − 12 = −5."},{"d":"HARD","q":"Which integer is 4 units from −2 and lies to its right?","o":["−6","−4","2","4"],"a":2,"e":"Moving four units right from −2 gives 2."},{"d":"HARD","q":"A point travels from 3 to −4 and then to 1. What is the total distance travelled?","o":["11 units","12 units","7 units","5 units"],"a":1,"e":"From 3 to −4 is 7 units; from −4 to 1 is 5 units; total 12 units."},{"d":"HARD","q":"Which statement is always true on a standard number line?","o":["Numbers increase to the left","Numbers increase to the right","Negative numbers are right of zero","Zero is greater than every number"],"a":1,"e":"On a standard number line, values increase as you move right."},{"d":"HARD","q":"A point at −8 moves 3 units right and then 6 units right. What is its final position?","o":["−17","−5","1","−1"],"a":2,"e":"−8 + 3 + 6 = 1."},{"d":"HARD","q":"The midpoint of two numbers is 5. One number is 2. What is the other number?","o":["6","7","8","10"],"a":2,"e":"(2 + x) ÷ 2 = 5, so x = 8."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">📍</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">📍</span><div><strong>Read a number line</strong><small>Locate numbers and move left or right</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Find distance and midpoint</strong><small>Count steps between numbers</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Track number moves</strong><small>Use addition and subtraction on the line</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();</script>
