<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What comes next: 2, 4, 6, 8, __?","o":["9","10","11","12"],"a":1,"e":"Add 2 each time, so the next number is 10."},{"d":"BASIC","q":"Find the next number: 5, 10, 15, 20, __.","o":["22","24","25","30"],"a":2,"e":"The pattern adds 5 each time."},{"d":"BASIC","q":"What is the rule for 3, 6, 9, 12, 15?","o":["Add 2","Add 3","Multiply by 3","Subtract 3"],"a":1,"e":"Each term is 3 more than the previous term."},{"d":"BASIC","q":"Complete the pattern: 1, 4, 7, 10, __.","o":["11","12","13","14"],"a":2,"e":"Add 3 to 10 to get 13."},{"d":"BASIC","q":"What comes next: 10, 20, 30, 40, __?","o":["45","50","60","80"],"a":1,"e":"The sequence increases by 10 each time."},{"d":"BASIC","q":"Which number is missing? 2, 4, __, 8, 10.","o":["5","6","7","9"],"a":1,"e":"The even numbers increase by 2; the missing number is 6."},{"d":"BASIC","q":"Find the next number: 1, 2, 4, 8, __.","o":["10","12","14","16"],"a":3,"e":"Each term doubles, so 8 × 2 = 16."},{"d":"BASIC","q":"What comes next: 20, 18, 16, 14, __?","o":["10","11","12","13"],"a":2,"e":"Subtract 2 each time; the next term is 12."},{"d":"BASIC","q":"Which sequence increases by 4 each time?","o":["2, 6, 10, 14","1, 4, 9, 16","3, 6, 12, 24","10, 9, 8, 7"],"a":0,"e":"The differences in 2, 6, 10, 14 are all 4."},{"d":"BASIC","q":"Complete: 1, 3, 5, 7, __.","o":["8","9","10","11"],"a":1,"e":"These are consecutive odd numbers; the next is 9."},{"d":"MEDIUM","q":"What comes next: 1, 4, 9, 16, 25, __?","o":["30","32","35","36"],"a":3,"e":"These are square numbers: 1², 2², 3², 4², 5², then 6² = 36."},{"d":"MEDIUM","q":"Find the next term: 2, 6, 12, 20, 30, __.","o":["36","40","42","44"],"a":2,"e":"The differences are 4, 6, 8, 10; next add 12 to get 42."},{"d":"MEDIUM","q":"A pattern is 7, 14, 21, 28, ... What is the 8th term?","o":["49","56","63","64"],"a":1,"e":"The nth term is 7n, so the 8th term is 7 × 8 = 56."},{"d":"MEDIUM","q":"Find the missing number: 3, 8, 13, __, 23.","o":["16","17","18","19"],"a":2,"e":"Add 5 each time; the missing term is 18."},{"d":"MEDIUM","q":"What comes next: 81, 27, 9, 3, __?","o":["0","1","2","6"],"a":1,"e":"Each term is divided by 3; 3 ÷ 3 = 1."},{"d":"MEDIUM","q":"The pattern is 4, 7, 10, 13, ... Which expression gives the nth term, starting at n = 1?","o":["n + 3","3n + 1","4n","3n + 4"],"a":1,"e":"For n = 1, 3n + 1 = 4, and it increases by 3 each term."},{"d":"MEDIUM","q":"What is the 10th term of 5, 10, 15, 20, ...?","o":["40","45","50","55"],"a":2,"e":"The nth term is 5n; the 10th term is 50."},{"d":"MEDIUM","q":"Find the next number: 1, 1, 2, 3, 5, 8, __.","o":["11","12","13","15"],"a":2,"e":"Each term is the sum of the previous two: 5 + 8 = 13."},{"d":"MEDIUM","q":"A sequence starts at 6 and adds 4 each time. What is its 6th term?","o":["22","24","26","30"],"a":2,"e":"The terms are 6, 10, 14, 18, 22, 26."},{"d":"MEDIUM","q":"Which number does not fit the pattern 6, 12, 18, 25, 30?","o":["12","18","25","30"],"a":2,"e":"The pattern uses multiples of 6; 25 is not a multiple of 6."},{"d":"HARD","q":"The nth term of a sequence is 4n − 1. What is the 12th term?","o":["43","45","47","48"],"a":2,"e":"Substitute n = 12: 4 × 12 − 1 = 47."},{"d":"HARD","q":"A sequence has nth term 3n + 2. What is the 7th term?","o":["21","23","24","26"],"a":1,"e":"Substitute n = 7: 3 × 7 + 2 = 23."},{"d":"HARD","q":"The sequence is 2, 5, 10, 17, 26, __. What comes next?","o":["35","36","37","38"],"a":2,"e":"The differences are 3, 5, 7, 9; next add 11 to get 37."},{"d":"HARD","q":"A row of connected squares uses 4 matchsticks for 1 square and 7 for 2 squares, sharing one side. How many matchsticks are needed for 5 squares in a row?","o":["13","15","16","17"],"a":2,"e":"The first square uses 4 matchsticks and each additional square adds 3: 4 + 4 × 3 = 16."},{"d":"HARD","q":"What is the next term: 1, 8, 27, 64, __?","o":["100","125","144","216"],"a":1,"e":"These are cube numbers: 1³, 2³, 3³, 4³, then 5³ = 125."},{"d":"HARD","q":"A sequence follows the rule: multiply by 2, then add 1. Starting at 2, what are the first four terms?","o":["2, 5, 11, 23","2, 4, 8, 16","2, 6, 13, 27","2, 3, 5, 9"],"a":0,"e":"Apply ×2 then +1: 2 → 5 → 11 → 23."},{"d":"HARD","q":"The 3rd term is 11 and the 7th term is 27 in an arithmetic sequence. What is the common difference?","o":["3","4","5","6"],"a":1,"e":"There are 4 steps between terms; (27 − 11) ÷ 4 = 4."},{"d":"HARD","q":"A pattern uses 5, 9, 13, 17, ... Which term is 41?","o":["8th","9th","10th","11th"],"a":2,"e":"The nth term is 4n + 1. Set 4n + 1 = 41, so n = 10."},{"d":"HARD","q":"The nth term is n² + 2. What is the difference between the 5th and 4th terms?","o":["7","8","9","10"],"a":2,"e":"The 5th term is 5² + 2 = 27 and the 4th is 4² + 2 = 18; the difference is 9."},{"d":"HARD","q":"A sequence has terms 3, 6, 11, 18, 27, ... Which rule generates it?","o":["n² + 2","n² + 1","2n + 1","3n"],"a":0,"e":"For n = 1, n² + 2 = 3; n = 2 gives 6, and the pattern continues."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Recognise and extend number patterns</strong><small>Identify arithmetic and multiplicative rules</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Use square, cube, and Fibonacci-style sequences</strong><small>Find missing terms and nth-term rules</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve direct proportion problems</strong><small>Apply direct proportion accurately</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
