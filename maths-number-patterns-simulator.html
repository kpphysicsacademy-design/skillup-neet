<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f9ff"><meta name="skillup-release" content="20261120-number-patterns-smart-simulator-v1"><title>Number Pattern Simulator | SkillUp Maths</title>
<style>
:root{--blue:#1686bd;--ink:#263746;--muted:#687987;--line:#dceaf1;--bg:#f3f8fc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#eff8ff,#fbfdff 55%,#f2fbf4);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:10px max(14px,calc((100% - 760px)/2));display:flex;gap:12px;align-items:center;z-index:2;box-shadow:0 4px 18px #18394b0b}.top a{color:var(--blue);text-decoration:none;font-weight:800}.brand{font-weight:900;flex:1}main{max-width:760px;margin:auto;padding:18px 14px 40px}h1{font-size:clamp(24px,5vw,32px);margin:5px 0;color:#173c55}h2{font-size:18px;margin:0 0 8px;color:#155d83}.muted{color:var(--muted);line-height:1.5}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #18394b08}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;font-weight:800;color:#526575}input,select{width:100%;padding:11px;border:1px solid #d5e1e8;border-radius:10px;font:inherit;margin-top:5px;background:#fff;color:var(--ink)}.presets{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.presets button,.action{border:1px solid #cde7f5;border-radius:10px;padding:10px 13px;background:#eaf7ff;color:#086b9b;font-weight:850;cursor:pointer}.action{background:#1686bd;color:white;width:100%;margin-top:10px;border:0}.sequence{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0}.term{display:grid;place-items:center;min-height:55px;border-radius:12px;background:#eaf7ff;border:1px solid #cde7f5;color:#075d86;font-size:18px;font-weight:900;overflow-wrap:anywhere}.term:nth-child(2n){background:#eff9e9;border-color:#dcefd2;color:#367b25}.term.next{background:#fff5df;border-color:#f4dfae;color:#8a5a00}.result{background:#eff8ff;border:1px solid #d6edf9;border-radius:12px;padding:13px}.result b{font-size:20px;color:#0875a8}.steps{line-height:1.7;color:#526575;background:#f7fafc;padding:12px;border-radius:11px}.links{display:flex;gap:10px;margin:14px 0}.links a{flex:1;text-align:center;text-decoration:none;background:#e5f5ff;padding:12px;border-radius:10px;color:#086b9b;font-weight:850}@media(max-width:560px){main{padding:15px 12px 32px}.card{padding:14px}.fields{grid-template-columns:1fr 1fr}.sequence{grid-template-columns:repeat(3,minmax(0,1fr))}.links{flex-direction:column}}
</style></head><body><header class="top"><a href="maths-number-patterns-learn.html?v=20261120-number-patterns-simple-learn-v1">← Learn</a><div class="brand">SkillUp <span style="color:#58a900">Maths</span></div><span>🧮 Simulator</span></header><main>
<p class="muted">CLASS 8 · INTERACTIVE PRACTICE</p><h1>Number Pattern Lab</h1><p class="muted">Choose a rule, change the values and watch the sequence update instantly.</p>
<section class="card"><div class="fields"><label>Pattern type<select id="mode"><option value="add">Add a fixed number</option><option value="subtract">Subtract a fixed number</option><option value="multiply">Multiply each time</option><option value="divide">Divide each time</option><option value="square">Square numbers</option><option value="cube">Cube numbers</option><option value="fibonacci">Add previous two terms</option></select></label><label>Number of terms<select id="count"><option>5</option><option selected>6</option><option>7</option><option>8</option></select></label><label id="startWrap">Starting number<input id="start" type="number" value="3" step="1"></label><label id="stepWrap">Rule value<input id="step" type="number" value="4" step="1"></label></div><div class="presets"><button onclick="preset('add',3,4)">+4 pattern</button><button onclick="preset('multiply',2,2)">×2 pattern</button><button onclick="preset('square',1,1)">Squares</button><button onclick="preset('fibonacci',1,1)">Fibonacci</button></div><button class="action" id="generate">Generate pattern</button></section>
<section class="card"><h2>Your sequence</h2><div class="sequence" id="sequence"></div><div class="result"><p class="muted">Next term</p><b id="next">—</b><p id="ruleText" class="muted"></p></div><p class="steps" id="working" aria-live="polite"></p></section>
<section class="card"><h2>Try a challenge</h2><p class="muted">Set the pattern and predict its next term before pressing Generate.</p><button class="action" onclick="preset('subtract',30,3)">Challenge: count backwards by 3</button><button class="action" style="background:#48a94c" onclick="preset('multiply',5,3)">Challenge: multiply by 3</button></section>
<div class="links"><a href="maths-number-patterns-learn.html?v=20261120-number-patterns-simple-learn-v1">📘 Learn</a><a href="maths-number-patterns-quiz.html?v=20261120-number-patterns-learn-simulator-v1&route=20261014-existing-quizzes-v1">✍️ Quiz</a></div>
</main><script>
const $=id=>document.getElementById(id);function preset(mode,start,step){$('mode').value=mode;$('start').value=start;$('step').value=step;draw()}
function draw(){const mode=$('mode').value,n=Number($('count').value),start=Number($('start').value),step=Number($('step').value);$('startWrap').style.display=['square','cube','fibonacci'].includes(mode)?'none':'block';$('stepWrap').style.display=['square','cube','fibonacci'].includes(mode)?'none':'block';let a=[];if(mode==='square')a=Array.from({length:n+1},(_,i)=>(i+1)**2);else if(mode==='cube')a=Array.from({length:n+1},(_,i)=>(i+1)**3);else if(mode==='fibonacci'){a=[1,1];while(a.length<n+1)a.push(a[a.length-1]+a[a.length-2]);}else{if(!Number.isFinite(start)||!Number.isFinite(step))return;a=[start];for(let i=1;i<n;i++){const p=a[i-1];a.push(mode==='add'?p+step:mode==='subtract'?p-step:mode==='multiply'?p*step:p/step);}}const terms=a.slice(0,n),next=a[n];$('sequence').replaceChildren();terms.forEach((v,i)=>{const d=document.createElement('div');d.className='term';d.textContent=Number.isInteger(v)?v:Number(v.toFixed(4));$('sequence').append(d)});const d=document.createElement('div');d.className='term next';d.textContent=Number.isInteger(next)?next:Number(next.toFixed(4));d.title='Next term';$('sequence').append(d);$('next').textContent=Number.isInteger(next)?next:Number(next.toFixed(4));const labels={add:'Add '+step+' each time',subtract:'Subtract '+step+' each time',multiply:'Multiply by '+step+' each time',divide:'Divide by '+step+' each time',square:'Consecutive square numbers',cube:'Consecutive cube numbers',fibonacci:'Add the previous two terms'};$('ruleText').textContent=labels[mode];$('working').textContent='Working: '+terms.join(' → ')+' → '+(Number.isInteger(next)?next:Number(next.toFixed(4)))+'. '+labels[mode]+'.';}
$('generate').addEventListener('click',draw);['mode','count','start','step'].forEach(id=>$(id).addEventListener('input',draw));draw();
</script></body></html>
