(function(){'use strict';const questions=[{"d":"BASIC","q":"A pair of linear equations in two variables represents:","o":["Two equations of degree 1 in two variables","One quadratic equation","Two cubic equations","An equation with three variables"],"a":0,"e":"Each equation is linear and contains two variables, usually x and y."},{"d":"BASIC","q":"Which ordered pair satisfies x+y=5 and x−y=1?","o":["(2,3)","(3,2)","(4,1)","(1,4)"],"a":1,"e":"Adding equations gives 2x=6, so x=3 and y=2."},{"d":"BASIC","q":"The graph of a linear equation in two variables is a:","o":["Circle","Parabola","Straight line","Point only"],"a":2,"e":"Every linear equation in two variables represents a straight line."},{"d":"BASIC","q":"For 2x+y=7, if x=2, then y is:","o":["1","2","3","5"],"a":2,"e":"4+y=7, so y=3."},{"d":"BASIC","q":"If two lines intersect at exactly one point, the pair of equations has:","o":["No solution","Exactly one solution","Infinitely many solutions","Always two solutions"],"a":1,"e":"The intersection point satisfies both equations."},{"d":"BASIC","q":"Which pair has infinitely many solutions?","o":["x+y=4 and x+y=7","x+y=4 and 2x+2y=8","x−y=2 and x−y=5","2x+y=3 and 2x+y=6"],"a":1,"e":"The second equation is exactly twice the first, so both lines coincide."},{"d":"BASIC","q":"Which pair represents parallel distinct lines?","o":["x+y=2 and 2x+2y=4","x+y=2 and x+y=5","x+y=3 and 2x+2y=6","x−y=1 and 2x−2y=2"],"a":1,"e":"The equations have the same left-side coefficients but different constants."},{"d":"BASIC","q":"Solve x=4 and y=−2. The solution pair is:","o":["(−2,4)","(4,−2)","(4,2)","(−4,2)"],"a":1,"e":"The ordered pair lists x first and y second."},{"d":"BASIC","q":"In the substitution method, you first:","o":["Square both equations","Express one variable in terms of the other","Draw a circle","Multiply both sides by zero"],"a":1,"e":"Solve one equation for a variable and substitute it into the other."},{"d":"BASIC","q":"The equations x+y=6 and x−y=2 have solution:","o":["(2,4)","(4,2)","(3,3)","(6,2)"],"a":1,"e":"Adding gives 2x=8, so x=4 and y=2."},{"d":"MEDIUM","q":"Solve 2x+y=8 and x−y=1.","o":["(2,4)","(3,2)","(4,0)","(1,6)"],"a":1,"e":"From x−y=1, y=x−1. Substitute: 3x−1=8, so x=3 and y=2."},{"d":"MEDIUM","q":"Solve x+y=10 and x−y=4.","o":["(7,3)","(3,7)","(6,4)","(5,5)"],"a":0,"e":"Adding gives 2x=14, so x=7 and y=3."},{"d":"MEDIUM","q":"For the pair 3x+2y=8 and 6x+4y=16, the number of solutions is:","o":["Zero","Exactly one","Infinitely many","Exactly two"],"a":2,"e":"The second equation is twice the first, so both represent the same line."},{"d":"MEDIUM","q":"For 2x+3y=7 and 4x+6y=20, the pair has:","o":["One solution","No solution","Infinitely many solutions","Two solutions"],"a":1,"e":"The coefficients are proportional but constants are not (7×2≠20), so the lines are parallel."},{"d":"MEDIUM","q":"Solve 3x+y=11 and x+y=5.","o":["(3,2)","(2,3)","(4,−1)","(−3,8)"],"a":0,"e":"Subtract equations: 2x=6, so x=3 and y=2."},{"d":"MEDIUM","q":"For which value of k do 2x+ky=6 and 4x+6y=12 have infinitely many solutions?","o":["2","3","4","6"],"a":1,"e":"All coefficients must be proportional: 4/2=6/k=12/6=2, so k=3."},{"d":"MEDIUM","q":"If x=2 and y=−1 satisfy 3x+ay=7, find a.","o":["−1","1","−2","2"],"a":0,"e":"6−a=7, hence a=−1."},{"d":"MEDIUM","q":"A notebook and a pen cost ₹50 together. Two notebooks and one pen cost ₹80. What is the cost of one notebook?","o":["₹20","₹25","₹30","₹40"],"a":2,"e":"Let notebook=n, pen=p. n+p=50 and 2n+p=80; subtract to get n=30."},{"d":"MEDIUM","q":"The sum of two numbers is 18 and their difference is 4. The numbers are:","o":["11 and 7","10 and 8","12 and 6","9 and 9"],"a":0,"e":"Adding equations gives twice the larger number=22, so numbers are 11 and 7."},{"d":"MEDIUM","q":"The graphical solution of a pair of equations is the:","o":["Slope of either line","Point where the lines intersect, if any","Y-intercept only","Area between the lines"],"a":1,"e":"A common solution lies on both lines, at their intersection."},{"d":"HARD","q":"Solve 5x+2y=16 and 3x−2y=0.","o":["(2,3)","(3,1/2)","(1,5)","(4,−2)"],"a":0,"e":"Adding gives 8x=16, so x=2; then 3x−2y=0 gives y=3."},{"d":"HARD","q":"For 3x+ky=7 and 6x+4y=14 to have infinitely many solutions, k must be:","o":["1","2","3","4"],"a":1,"e":"6/3=4/k=14/7=2, so 4/k=2 and k=2."},{"d":"HARD","q":"Two numbers have sum 31. The larger exceeds the smaller by 7. Find the numbers.","o":["19 and 12","18 and 13","20 and 11","17 and 14"],"a":0,"e":"Solving x+y=31 and x−y=7 gives x=19, y=12."},{"d":"HARD","q":"A fraction becomes 1/3 when 1 is subtracted from its numerator and 2 is added to its denominator. It becomes 1/2 when 1 is added to its numerator and 1 is subtracted from its denominator. What is the fraction?","o":["3/7","5/11","8/19","7/15"],"a":2,"e":"Let the fraction be x/y. From (x−1)/(y+2)=1/3, 3x−y=5. From (x+1)/(y−1)=1/2, 2x−y=−3. Subtracting gives x=8; then y=19, so the fraction is 8/19."},{"d":"HARD","q":"If 2x+3y=12 and 4x+6y=k represent the same line, k equals:","o":["6","12","18","24"],"a":3,"e":"The second equation is twice the first, so its constant must be 24."},{"d":"HARD","q":"For the pair ax+2y=5 and 3x+6y=15 to have infinitely many solutions, a equals:","o":["1","2","3","4"],"a":2,"e":"The second equation is 3 times the first, so 3a? Matching x coefficients gives a=1. Correct option is 1."},{"d":"HARD","q":"If 2x+3y=13 and 4x−y=5, find x+y.","o":["1","2","3","4"],"a":0,"e":"The second equation is 3 times the first, so matching x coefficients gives a=1."},{"d":"HARD","q":"A two-digit number has digit sum 9. Reversing its digits increases it by 27. The number is:","o":["3","4","5","6"],"a":2,"e":"From 4x−y=5, y=4x−5. Substituting gives x=2, y=3, so x+y=5."},{"d":"HARD","q":"The lines 2x−3y=7 and 4x−6y=14 are:","o":["Parallel and distinct","Perpendicular","Coincident","Intersecting at (0,0)"],"a":2,"e":"The second equation is twice the first, so they are the same line."},{"d":"HARD","q":"A taxi charges a fixed fee plus a rate per kilometre. A 4 km trip costs ₹70 and a 7 km trip costs ₹100. What is the fixed fee?","o":["₹20","₹30","₹40","₹50"],"a":1,"e":"Rate=(100−70)/3=₹10/km. Fixed fee=70−4×10=₹30."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Solve pairs of linear equations</strong><small>Use substitution and elimination</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Analyse consistency of two lines</strong><small>Interpret graphs and intersections</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve word problems with two variables</strong><small>Apply linear equation methods</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
