<p class="muted">Identify corresponding, alternate and co-interior angles; apply parallel-line tests and solve angle problems.</p>
<div class="topic-actions" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;margin:10px 0 12px"><a href="maths-parallel-lines-transversal-learn.html?v=20261107-parallel-lines-transversal-brief-learn-v1" style="display:flex;align-items:center;justify-content:center;min-width:0;min-height:36px;padding:7px 8px;border:1px solid #dce7ed;border-radius:9px;background:#fff;color:#167eae;text-decoration:none;font-size:12px;font-weight:800;white-space:nowrap">📘 Brief Learn</a><a href="maths-parallel-lines-transversal-simulator.html?v=20261107-parallel-lines-transversal-simulator-v1" style="display:flex;align-items:center;justify-content:center;min-width:0;min-height:36px;padding:7px 8px;border:1px solid #dce7ed;border-radius:9px;background:#fff;color:#167eae;text-decoration:none;font-size:12px;font-weight:800;white-space:nowrap">📐 Simulator</a></div>

<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"When a transversal cuts two parallel lines, corresponding angles are:","o":["Equal","Supplementary","Complementary","Always 90°"],"a":0,"why":"Corresponding angles are equal when the two lines are parallel."},{"d":"BASIC","q":"When a transversal cuts two parallel lines, alternate interior angles are:","o":["Equal","Unequal","Always supplementary","Always right angles"],"a":0,"why":"Alternate interior angles are equal for parallel lines."},{"d":"BASIC","q":"Same-side interior angles formed by a transversal with parallel lines add up to:","o":["90°","120°","180°","360°"],"a":2,"why":"Same-side interior angles are supplementary, so their sum is 180°."},{"d":"BASIC","q":"Which pair of angles lies between the two lines and on opposite sides of a transversal?","o":["Corresponding angles","Alternate interior angles","Alternate exterior angles","Vertically opposite angles"],"a":1,"why":"Alternate interior angles lie inside the two lines and on opposite sides of the transversal."},{"d":"BASIC","q":"Which pair occupies the same relative position at the two intersections of a transversal?","o":["Corresponding angles","Vertically opposite angles","Adjacent angles","Linear-pair angles"],"a":0,"why":"Corresponding angles occupy matching positions at the two intersections."},{"d":"BASIC","q":"If one angle formed by two intersecting lines is 65°, its vertically opposite angle is:","o":["25°","65°","115°","130°"],"a":1,"why":"Vertically opposite angles are equal."},{"d":"BASIC","q":"If one angle in a linear pair is 125°, the other angle is:","o":["45°","55°","65°","125°"],"a":1,"why":"A linear pair sums to 180°; 180°−125°=55°."},{"d":"BASIC","q":"If a pair of alternate interior angles is equal, the two lines are:","o":["Parallel","Perpendicular","Always coincident","Unequal in length"],"a":0,"why":"Equal alternate interior angles establish that the two lines are parallel."},{"d":"BASIC","q":"If corresponding angles are 72° and 72°, what can be concluded about the two lines?","o":["They are parallel","They are perpendicular","They intersect at 72°","They are the same segment"],"a":0,"why":"Equal corresponding angles are a converse test for parallel lines."},{"d":"BASIC","q":"An angle measuring 90° is called a:","o":["Acute angle","Obtuse angle","Right angle","Reflex angle"],"a":2,"why":"A right angle measures exactly 90°."},{"d":"MEDIUM","q":"Two corresponding angles are (3x + 10)° and (5x − 30)°. If the lines are parallel, find x.","o":["15","20","25","30"],"a":1,"why":"3x+10=5x−30, so 40=2x and x=20."},{"d":"MEDIUM","q":"Two alternate interior angles are (4x − 5)° and (3x + 20)°. If the lines are parallel, x is:","o":["15","20","25","30"],"a":2,"why":"4x−5=3x+20, so x=25."},{"d":"MEDIUM","q":"Same-side interior angles are (2x + 20)° and (3x + 10)°. If the lines are parallel, find x.","o":["20","25","30","35"],"a":2,"why":"2x+20+3x+10=180 gives 5x=150, so x=30."},{"d":"MEDIUM","q":"One of a pair of same-side interior angles is 118°. Find the other angle when the lines are parallel.","o":["52°","62°","72°","118°"],"a":1,"why":"Same-side interior angles sum to 180°; 180°−118°=62°."},{"d":"MEDIUM","q":"A transversal cuts two lines. A pair of corresponding angles measures 105° and 75°. Which conclusion is justified?","o":["The lines are parallel by the corresponding-angle test","The lines are not parallel by the equal-corresponding-angle test","The lines are perpendicular","The lines must coincide"],"a":1,"why":"Corresponding angles are unequal, so the equal-corresponding-angle test for parallel lines is not satisfied."},{"d":"MEDIUM","q":"An exterior angle is 132°. Its alternate exterior angle is formed by a transversal cutting parallel lines. Find the alternate exterior angle.","o":["48°","58°","132°","180°"],"a":2,"why":"Alternate exterior angles are equal for parallel lines, so the angle is 132°."},{"d":"MEDIUM","q":"Two interior angles on the same side of a transversal are 4x° and 2x°. If the lines are parallel, x equals:","o":["20°","25°","30°","35°"],"a":2,"why":"4x+2x=180 gives 6x=180, so x=30°."},{"d":"MEDIUM","q":"An angle is 3 times its adjacent angle in a linear pair. Find the smaller angle.","o":["30°","45°","60°","90°"],"a":1,"why":"Let the smaller angle be x; 3x+x=180, so x=45°."},{"d":"MEDIUM","q":"If alternate interior angles are (2x + 15)° and (3x − 10)°, and the lines are parallel, find the common angle.","o":["55°","65°","75°","85°"],"a":1,"why":"2x+15=3x−10 gives x=25; each angle is 65°."},{"d":"MEDIUM","q":"A transversal forms corresponding angles of 7x° and (5x + 30)°. If the lines are parallel, x equals:","o":["10","12","15","18"],"a":2,"why":"7x=5x+30 gives 2x=30, so x=15."},{"d":"HARD","q":"Two same-side interior angles are (5x − 12)° and (3x + 16)°. If the lines are parallel, find the larger angle.","o":["82°","92°","98°","108°"],"a":2,"why":"8x+4=180 gives x=22; the angles are 98° and 82°, so the larger is 98°."},{"d":"HARD","q":"A pair of corresponding angles is in the ratio 4:5. If the lines are parallel, which conclusion is correct?","o":["The angles are 80° and 100°","The angles are 72° and 90°","The stated ratio is impossible because corresponding angles must be equal","The angles must be 45° and 135°"],"a":2,"why":"Corresponding angles are equal for parallel lines, so their ratio must be 1:1, not 4:5."},{"d":"HARD","q":"A pair of same-side interior angles is in the ratio 2:7. If the lines are parallel, find the smaller angle.","o":["30°","36°","40°","45°"],"a":2,"why":"Nine parts equal 180°, so one part is 20° and the smaller angle is 2×20°=40°."},{"d":"HARD","q":"Two alternate interior angles are (7x − 8)° and (5x + 22)°. If the lines are parallel, find x.","o":["10","12","15","18"],"a":2,"why":"7x−8=5x+22 gives 2x=30, so x=15."},{"d":"HARD","q":"A transversal cuts parallel lines. One acute angle is 38°. What is the measure of each obtuse angle formed?","o":["38°","52°","142°","152°"],"a":2,"why":"Each obtuse angle is supplementary to 38°, so 180°−38°=142°."},{"d":"HARD","q":"Same-side interior angles are (x + 35)° and (2x + 25)°. If the lines are parallel, find the larger angle.","o":["75°","95°","105°","115°"],"a":2,"why":"3x+60=180 gives x=40; the angles are 75° and 105°, so the larger is 105°."},{"d":"HARD","q":"A pair of alternate exterior angles is (6x − 14)° and (4x + 26)°. If the lines are parallel, x equals:","o":["15","18","20","22"],"a":2,"why":"6x−14=4x+26 gives 2x=40, so x=20."},{"d":"HARD","q":"The ratio of two same-side interior angles is 5:7. If the lines are parallel, find the larger angle.","o":["75°","90°","105°","120°"],"a":2,"why":"Twelve parts equal 180°, so one part is 15° and the larger angle is 7×15°=105°."},{"d":"HARD","q":"Two lines are cut by a transversal. A pair of alternate interior angles is 84° and 96°. Which statement is correct?","o":["The lines are parallel because the angles are equal","The lines are not parallel by the alternate-interior-angle test","The lines are perpendicular","The lines coincide"],"a":1,"why":"The alternate interior angles are unequal, so the equality test for parallel lines is not met."},{"d":"HARD","q":"An angle is 24° less than its supplementary angle. Find the larger angle.","o":["78°","90°","102°","114°"],"a":2,"why":"Let the larger angle be y and the smaller be y−24. Then 2y−24=180, so y=102°."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Parallel Lines and Transversal Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
