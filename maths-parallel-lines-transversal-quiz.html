n><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Equations</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Equation Skills"><div class="skill-title">🎯 Angle Skills</div><div class="skill-list"><div class="skill-item">Recognise parallel lines and a transversal</div><div class="skill-item">Calculate corresponding and alternate angles</div><div class="skill-item">Apply parallel-line angle relationships</div></div></section></div>
<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Two parallel lines are crossed by a transversal. If a corresponding angle is 65°, its matching corresponding angle is…","o":["65°","115°","90°","125°"],"a":0,"e":"Corresponding angles are equal when the two lines are parallel.","v":"parallel-lines-transversal"},{"d":"BASIC","q":"For two parallel lines cut by a transversal, an alternate interior angle is 48°. The other alternate interior angle is…","o":["132°","48°","42°","90°"],"a":1,"e":"Alternate interior angles are equal for parallel lines.","v":"parallel-lines-transversal"},{"d":"BASIC","q":"Two parallel lines are crossed by a transversal. One alternate exterior angle is 121°. The other alternate exterior angle is…","o":["59°","121°","61°","180°"],"a":1,"e":"Alternate exterior angles are equal when the lines are parallel.","v":"parallel-lines-transversal"},{"d":"BASIC","q":"A pair of co-interior angles lies between parallel lines on the same side of a transversal. If one is 72°, the other is…","o":["72°","108°","118°","98°"],"a":1,"e":"Co-interior angles sum to 180°; 180° − 72° = 108°.","v":"parallel-lines-transversal"},{"d":"BASIC","q":"Two parallel lines are cut by a transversal. A corresponding angle is 90°. Its corresponding partner is…","o":["0°","90°","180°","Cannot be determined"],"a":1,"e":"Corresponding angles have equal measures; the partner is 90°.","v":"parallel-lines-transversal"},{"d":"BASIC","q":"If one co-interior angle is 134° on a pair of parallel lines, find the other co-interior angle.","o":["134°","46°","56°","180°"],"a":1,"e":"Co-interior angles are supplementary: 180° − 134° = 46°.","v":"parallel-lines-transversal"},{"d":"BASIC","q":"Which angle pair is equal when two parallel lines are cut by a transversal?","o":["Co-interior angles","Adjacent angles on a straight line","Alternate interior angles","A linear pair"],"a":2,"e":"Alternate interior angles are equal for parallel lines.","v":"parallel-lines-transversal"},{"d":"BASIC","q":"A transversal crosses two parallel lines. An angle is 38°. Its adjacent angle on the same intersection is…","o":["38°","142°","52°","180°"],"a":1,"e":"Adjacent angles forming a straight line sum to 180°; 180° − 38° = 142°.","v":"parallel-lines-transversal"},{"d":"BASIC","q":"A corresponding angle measures 107° when a transversal crosses parallel lines. What is the matching angle?","o":["73°","107°","83°","180°"],"a":1,"e":"Corresponding angles are equal, so the matching angle is 107°.","v":"parallel-lines-transversal"},{"d":"BASIC","q":"If a co-interior angle is 90°, its co-interior partner is…","o":["45°","90°","180°","Cannot be determined"],"a":1,"e":"The two co-interior angles total 180°, so the partner is 90°.","v":"parallel-lines-transversal"},{"d":"MEDIUM","q":"Two parallel lines are cut by a transversal. Corresponding angles are (3x + 10)° and 100°. Find x.","o":["20","25","30","35"],"a":2,"e":"Corresponding angles are equal: 3x + 10 = 100, so 3x = 90 and x = 30.","v":"parallel-lines-transversal"},{"d":"MEDIUM","q":"Alternate interior angles are (5x − 15)° and 75° on parallel lines. Find x.","o":["12","15","18","20"],"a":2,"e":"Set 5x − 15 = 75. Then 5x = 90 and x = 18.","v":"parallel-lines-transversal"},{"d":"MEDIUM","q":"Co-interior angles are (2x + 20)° and 100°. Find x.","o":["20","25","30","40"],"a":2,"e":"(2x + 20) + 100 = 180, so 2x = 60 and x = 30.","v":"parallel-lines-transversal"},{"d":"MEDIUM","q":"One angle is 4x° and its corresponding angle is 120° on parallel lines. Find x.","o":["20","25","30","40"],"a":2,"e":"Corresponding angles are equal: 4x = 120, so x = 30.","v":"parallel-lines-transversal"},{"d":"MEDIUM","q":"Co-interior angles are (3x)° and (2x + 30)°. Find x.","o":["20","25","30","35"],"a":2,"e":"3x + 2x + 30 = 180, so 5x = 150 and x = 30.","v":"parallel-lines-transversal"},{"d":"MEDIUM","q":"An alternate exterior angle is (x + 40)° and its equal partner is (2x − 10)°. Find x.","o":["30","40","50","60"],"a":2,"e":"Set x + 40 = 2x − 10, giving x = 50.","v":"parallel-lines-transversal"},{"d":"MEDIUM","q":"Two corresponding angles are (2x + 15)° and (x + 45)°. Find the angle measure.","o":["45°","60°","75°","90°"],"a":2,"e":"Equate expressions: 2x + 15 = x + 45, so x = 30; each angle is 75°.","v":"parallel-lines-transversal"},{"d":"MEDIUM","q":"One co-interior angle is twice the other. What are the two angles?","o":["60° and 120°","45° and 135°","70° and 140°","80° and 100°"],"a":0,"e":"Let the smaller angle be x; x + 2x = 180, so the angles are 60° and 120°.","v":"parallel-lines-transversal"},{"d":"MEDIUM","q":"A transversal forms an angle of 116° at one parallel line. What is the acute angle at the other intersection?","o":["116°","64°","74°","54°"],"a":1,"e":"The acute angle is supplementary to 116°: 180° − 116° = 64°.","v":"parallel-lines-transversal"},{"d":"MEDIUM","q":"If alternate interior angles are (7x − 5)° and (4x + 40)°, find x.","o":["10","12","15","18"],"a":2,"e":"7x − 5 = 4x + 40, so 3x = 45 and x = 15.","v":"parallel-lines-transversal"},{"d":"HARD","q":"Co-interior angles are (4x − 8)° and (2x + 20)°. Find the larger angle.","o":["92°","100°","104°","112°"],"a":2,"e":"6x + 12 = 180, so x = 28. The angles are 104° and 76°; the larger is 104°.","v":"parallel-lines-transversal"},{"d":"HARD","q":"Corresponding angles are (5x − 12)° and (3x + 24)°. Find the angle measure.","o":["72°","78°","84°","90°"],"a":1,"e":"5x − 12 = 3x + 24, so x = 18; the angle is 5(18) − 12 = 78°.","v":"parallel-lines-transversal"},{"d":"HARD","q":"A pair of co-interior angles are (x + 35)° and (2x + 10)°. Find the smaller angle.","o":["65°","80°","90°","115°"],"a":1,"e":"x + 35 + 2x + 10 = 180, so x = 45; angles are 80° and 100°.","v":"parallel-lines-transversal"},{"d":"HARD","q":"Alternate interior angles are (4x + 6)° and (6x − 34)°. Find x and the angle.","o":["x = 20, angle 86°","x = 18, angle 78°","x = 16, angle 70°","x = 22, angle 94°"],"a":0,"e":"4x + 6 = 6x − 34 gives x = 20; the angle is 4(20) + 6 = 86°.","v":"parallel-lines-transversal"},{"d":"HARD","q":"Two co-interior angles are in the ratio 2:3. Find the smaller angle.","o":["60°","72°","90°","108°"],"a":1,"e":"Let them be 2k and 3k. Then 5k = 180, k = 36; smaller angle = 72°.","v":"parallel-lines-transversal"},{"d":"HARD","q":"An angle and its corresponding angle are (3x + 18)° and (5x − 22)°. Find x.","o":["15","18","20","22"],"a":2,"e":"3x + 18 = 5x − 22 gives 2x = 40 and x = 20.","v":"parallel-lines-transversal"},{"d":"HARD","q":"Co-interior angles are (x + 15)° and (3x − 3)°. What is the larger angle?","o":["57°","66°","111°","123°"],"a":3,"e":"x + 15 + 3x − 3 = 180 gives x = 42; the angles are 57° and 123°, so the larger is 123°.","v":"parallel-lines-transversal"},{"d":"HARD","q":"For parallel lines, an alternate exterior angle is (2x + 14)° and its partner is (5x − 40)°. Find x.","o":["16","18","20","22"],"a":1,"e":"2x + 14 = 5x − 40 gives 3x = 54, so x = 18.","v":"parallel-lines-transversal"},{"d":"HARD","q":"A corresponding angle is 3 times its adjacent angle at the same intersection. Find the corresponding angle.","o":["45°","90°","135°","150°"],"a":2,"e":"The adjacent pair sums to 180°. If the corresponding angle is 3x and adjacent is x, 4x = 180; corresponding angle = 135°.","v":"parallel-lines-transversal"},{"d":"HARD","q":"Two co-interior angles differ by 40°. Find the larger angle.","o":["70°","90°","110°","120°"],"a":2,"e":"Let larger L and smaller S. L + S = 180 and L − S = 40, so 2L = 220 and L = 110°.","v":"parallel-lines-transversal"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}const visuals={
balance:'',

bars:'',

};function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🔢</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+'<div class="skill-item '+(correct>=8?'unlocked':'')+'">'+(correct>=8?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Identify complementary and supplementary angles</div>'+'<div class="skill-item '+(correct>=18?'unlocked':'')+'">'+(correct>=18?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Calculate corresponding and alternate angles</div>'+'<div class="skill-item '+(correct>=24?'unlocked':'')+'">'+(correct>=24?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Solve angle relationship problems</div>'+'</div></div>' ;$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script>
