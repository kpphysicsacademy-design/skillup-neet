(function(){'use strict';const questions=[{"d":"BASIC","q":"A parallelogram is a quadrilateral in which:","o":["All sides are equal","Both pairs of opposite sides are parallel","All angles are right angles","Diagonals are always equal"],"a":1,"e":"A parallelogram has both pairs of opposite sides parallel."},{"d":"BASIC","q":"Opposite sides of a parallelogram are:","o":["Always unequal","Equal and parallel","Perpendicular","Always of different lengths"],"a":1,"e":"Opposite sides in a parallelogram are equal and parallel."},{"d":"BASIC","q":"Opposite angles of a parallelogram are:","o":["Equal","Always 90°","Always supplementary to each other","Always unequal"],"a":0,"e":"Each pair of opposite angles in a parallelogram is equal."},{"d":"BASIC","q":"Adjacent angles of a parallelogram add up to:","o":["90°","180°","270°","360°"],"a":1,"e":"Consecutive interior angles between parallel sides are supplementary."},{"d":"BASIC","q":"The diagonals of a parallelogram:","o":["Are always equal","Bisect each other","Are always perpendicular","Never intersect"],"a":1,"e":"Each diagonal cuts the other into two equal parts."},{"d":"BASIC","q":"If one angle of a parallelogram is 70°, its adjacent angle is:","o":["70°","90°","110°","290°"],"a":2,"e":"Adjacent angles are supplementary: 180°−70°=110°."},{"d":"BASIC","q":"If one angle of a parallelogram is 90°, the figure is a:","o":["Rhombus only","Rectangle","Kite only","Trapezium only"],"a":1,"e":"If a parallelogram has one right angle, all its angles are right angles, making it a rectangle."},{"d":"BASIC","q":"A point where the diagonals of a parallelogram intersect is:","o":["The midpoint of neither diagonal","The midpoint of both diagonals","Always a vertex","Outside the figure"],"a":1,"e":"The diagonals bisect each other, so their intersection is the midpoint of each."},{"d":"BASIC","q":"Which statement is always true for a parallelogram?","o":["Diagonals are equal","Diagonals bisect each other","Diagonals are perpendicular","All four sides are equal"],"a":1,"e":"The diagonals bisect each other in every parallelogram."},{"d":"BASIC","q":"If opposite sides of a quadrilateral are both parallel, the quadrilateral is a:","o":["Triangle","Parallelogram","Circle","Pentagon"],"a":1,"e":"A quadrilateral with both pairs of opposite sides parallel is a parallelogram."},{"d":"MEDIUM","q":"In parallelogram ABCD, AB=8 cm. What is CD?","o":["4 cm","8 cm","16 cm","Cannot be determined"],"a":1,"e":"Opposite sides AB and CD are equal."},{"d":"MEDIUM","q":"In parallelogram ABCD, ∠A=65°. Find ∠C.","o":["65°","115°","90°","130°"],"a":0,"e":"Opposite angles A and C are equal."},{"d":"MEDIUM","q":"In parallelogram ABCD, ∠A=65°. Find ∠B.","o":["65°","115°","125°","295°"],"a":1,"e":"Adjacent angles add to 180°, so ∠B=115°."},{"d":"MEDIUM","q":"Diagonals AC and BD intersect at O. If AO=6 cm, then AC is:","o":["3 cm","6 cm","12 cm","18 cm"],"a":2,"e":"O bisects AC, so AC=AO+OC=6+6=12 cm."},{"d":"MEDIUM","q":"Diagonals AC and BD intersect at O. If BO=4.5 cm, then BD is:","o":["2.25 cm","4.5 cm","9 cm","13.5 cm"],"a":2,"e":"O is the midpoint of BD, so BD=2×4.5=9 cm."},{"d":"MEDIUM","q":"In parallelogram PQRS, PQ=3x+2 and SR=14. Find x.","o":["2","3","4","6"],"a":2,"e":"Opposite sides are equal: 3x+2=14, so x=4. The correct solution is x=4."},{"d":"MEDIUM","q":"A parallelogram has perimeter 34 cm. One side is 10 cm. The adjacent side is:","o":["7 cm","10 cm","12 cm","14 cm"],"a":0,"e":"2(a+b)=34 gives a+b=17. If one side is 10 cm, the other is 7 cm."},{"d":"MEDIUM","q":"Which condition alone is sufficient to show a quadrilateral is a parallelogram?","o":["One pair of adjacent sides equal","Diagonals are equal","Diagonals bisect each other","One angle is 90°"],"a":2,"e":"If the diagonals of a quadrilateral bisect each other, it is a parallelogram."},{"d":"MEDIUM","q":"If one pair of opposite sides in a quadrilateral is both equal and parallel, the quadrilateral is:","o":["A parallelogram","Always a square","Always a rhombus","Always a kite"],"a":0,"e":"One pair of opposite sides that are both equal and parallel is a sufficient parallelogram test."},{"d":"MEDIUM","q":"In parallelogram ABCD, ∠A=2x and ∠B=4x. Find x.","o":["15°","30°","45°","60°"],"a":1,"e":"Adjacent angles: 2x+4x=180°, so x=30°."},{"d":"HARD","q":"In parallelogram ABCD, diagonals intersect at O. If AC=5x−2 and AO=9, find x.","o":["2","3","4","5"],"a":2,"e":"AO=AC/2, so AC=18. Then 5x−2=18, giving x=4."},{"d":"HARD","q":"In parallelogram ABCD, ∠A=(3x+10)° and ∠C=(5x−30)°. Find x.","o":["10","15","20","25"],"a":2,"e":"Opposite angles are equal: 3x+10=5x−30, so x=20."},{"d":"HARD","q":"A parallelogram has ∠A=(2x+10)° and ∠B=(4x−10)°. Find x.","o":["20","25","30","35"],"a":2,"e":"Adjacent angles add to 180°: 2x+10+4x−10=180, so x=30."},{"d":"HARD","q":"In parallelogram ABCD, AB=2x+3 and CD=5x−12. Find x.","o":["3","4","5","6"],"a":2,"e":"Opposite sides are equal: 2x+3=5x−12, giving 3x=15 and x=5."},{"d":"HARD","q":"Which extra fact guarantees that a parallelogram is a rectangle?","o":["All sides are equal","Diagonals are equal","Diagonals bisect each other","Opposite angles are equal"],"a":1,"e":"A parallelogram with equal diagonals is a rectangle."},{"d":"HARD","q":"Which extra fact guarantees that a parallelogram is a rhombus?","o":["Diagonals are equal","Diagonals are perpendicular","One angle is 90°","Opposite sides are parallel"],"a":1,"e":"A parallelogram whose diagonals are perpendicular is a rhombus."},{"d":"HARD","q":"In parallelogram ABCD, diagonals meet at O. If AO=3x−1 and OC=x+7, find x.","o":["2","3","4","5"],"a":2,"e":"AO=OC, so 3x−1=x+7; 2x=8 and x=4."},{"d":"HARD","q":"A quadrilateral's diagonals bisect each other, but are not equal and not perpendicular. Which conclusion is certain?","o":["It is a parallelogram","It is a rectangle","It is a rhombus","It is a square"],"a":0,"e":"Diagonals bisecting each other guarantees a parallelogram, but not necessarily a rectangle or rhombus."},{"d":"HARD","q":"In parallelogram ABCD, ∠A=3x° and ∠B=(2x+30)°. Find ∠C.","o":["60°","90°","108°","120°"],"a":1,"e":"3x+2x+30=180 gives x=30. Thus ∠A=90° and opposite ∠C=90°. The correct option is 90°."},{"d":"HARD","q":"A parallelogram has adjacent sides 9 cm and 13 cm. What is its perimeter?","o":["22 cm","44 cm","117 cm","26 cm"],"a":1,"e":"Perimeter=2(9+13)=44 cm."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Master parallelogram properties</strong><small>Use opposite sides and angles</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Understand diagonal properties</strong><small>Apply parallelogram tests</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve geometry problems</strong><small>Use angle and side relationships</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
