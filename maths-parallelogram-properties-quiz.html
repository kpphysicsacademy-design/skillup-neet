<script>
(function(){
'use strict';
const questions=[{"q":"In a parallelogram, which sides are equal?","o":["Opposite sides","Adjacent sides always","Only the longer sides","No sides"],"a":0,"why":"Both pairs of opposite sides are equal in a parallelogram."},{"q":"Opposite angles of a parallelogram are:","o":["Always supplementary to each other","Equal","Always 90°","Always unequal"],"a":1,"why":"Opposite angles in a parallelogram have equal measures."},{"q":"Adjacent angles in a parallelogram add up to:","o":["90°","270°","180°","360°"],"a":2,"why":"Adjacent angles are supplementary, so their sum is 180°."},{"q":"The diagonals of a parallelogram:","o":["Are always equal","Are always perpendicular","Never intersect","Bisect each other"],"a":3,"why":"Each diagonal cuts the other into two equal parts."},{"q":"One angle of a parallelogram is 75°. What is the opposite angle?","o":["75°","105°","90°","15°"],"a":0,"why":"Opposite angles are equal, so the opposite angle is 75°."},{"q":"One angle of a parallelogram is 110°. What is an adjacent angle?","o":["110°","70°","90°","55°"],"a":1,"why":"Adjacent angles sum to 180°; 180° − 110° = 70°."},{"q":"If one side of a parallelogram is 8 cm, what is the length of its opposite side?","o":["4 cm","16 cm","8 cm","Cannot be determined"],"a":2,"why":"Opposite sides of a parallelogram are equal."},{"q":"A parallelogram has adjacent side lengths 5 cm and 9 cm. What is its perimeter?","o":["14 cm","45 cm","18 cm","28 cm"],"a":3,"why":"Perimeter = 2(5 + 9) = 28 cm."},{"q":"If the diagonals of a parallelogram intersect at O and one half of a diagonal is 6 cm, the other half of that diagonal is:","o":["6 cm","3 cm","12 cm","Cannot be determined"],"a":0,"why":"Diagonals bisect each other, so both halves are equal."},{"q":"Which statement is always true for a parallelogram?","o":["All four angles are right angles","Both pairs of opposite sides are parallel","All four sides are equal","Diagonals are always perpendicular"],"a":1,"why":"A parallelogram has two pairs of parallel opposite sides."},{"q":"One angle of a parallelogram is 3x° and its adjacent angle is 2x°. Find x.","o":["30","45","36","60"],"a":2,"why":"Adjacent angles sum to 180°: 3x + 2x = 180, so x = 36."},{"q":"Opposite angles are (4x + 8)° and (6x − 22)°. Find x.","o":["12","18","20","15"],"a":3,"why":"Opposite angles are equal: 4x + 8 = 6x − 22, giving x = 15."},{"q":"A parallelogram has perimeter 46 cm. One side is 8 cm. Find the adjacent side.","o":["15 cm","23 cm","19 cm","31 cm"],"a":0,"why":"2(a + b) = 46, so a + b = 23 and b = 23 − 8 = 15 cm."},{"q":"Diagonals AC and BD meet at O. If AO = 7.5 cm, what is AC?","o":["7.5 cm","15 cm","3.75 cm","30 cm"],"a":1,"why":"The diagonals bisect each other, so AC = 2 × AO = 15 cm."},{"q":"In parallelogram ABCD, AB = 3x + 1 and CD = 5x − 9. Find x.","o":["4","6","5","8"],"a":2,"why":"Opposite sides are equal: 3x + 1 = 5x − 9, so x = 5."},{"q":"A parallelogram has one angle of 128°. What are the other three angles?","o":["128°, 128°, 128°","52°, 52°, 52°","90°, 90°, 52°","52°, 128°, 52°"],"a":3,"why":"Adjacent angles are 52° and opposite angles match, giving 52°, 128°, 52°."},{"q":"Diagonals of a parallelogram intersect at O. If BO = 4.2 cm, find BD.","o":["8.4 cm","4.2 cm","2.1 cm","16.8 cm"],"a":0,"why":"O is the midpoint of BD, so BD = 2 × 4.2 = 8.4 cm."},{"q":"Which extra condition guarantees that a parallelogram is a rectangle?","o":["All sides are equal","One angle is 90°","Diagonals are perpendicular","Adjacent sides are unequal"],"a":1,"why":"If one angle is 90°, adjacent and opposite angle properties make all four right angles."},{"q":"Which extra condition guarantees that a parallelogram is a rhombus?","o":["One angle is 90°","Diagonals are equal","Two adjacent sides are equal","Opposite angles are equal"],"a":2,"why":"Adjacent sides equal, together with opposite-side equality, makes all four sides equal."},{"q":"A parallelogram's diagonals are 18 cm and 24 cm. What are the lengths of their halves?","o":["18 cm and 24 cm","6 cm and 8 cm","9 cm and 24 cm","9 cm and 12 cm"],"a":3,"why":"Each diagonal is bisected, so the half-lengths are 9 cm and 12 cm."},{"q":"In parallelogram ABCD, angle A = (5x − 10)° and angle C = (3x + 30)°. Find x.","o":["20","10","15","25"],"a":0,"why":"Opposite angles are equal: 5x − 10 = 3x + 30, so x = 20."},{"q":"Adjacent angles of a parallelogram are (7x + 5)° and (5x + 7)°. Find x.","o":["12","14","15","10"],"a":1,"why":"Their sum is 180°: 12x + 12 = 180, so x = 14."},{"q":"The perimeter of a parallelogram is 64 cm. Its adjacent sides are in the ratio 3:5. Find the shorter side.","o":["8 cm","20 cm","12 cm","24 cm"],"a":2,"why":"Let sides be 3k and 5k. Then 2(8k) = 64, so k = 4 and the shorter side is 12 cm."},{"q":"Diagonals AC and BD meet at O. If AC = 4x + 2 and AO = 11 cm, find x.","o":["4","6","10","5"],"a":3,"why":"Since O bisects AC, AC = 22; hence 4x + 2 = 22 and x = 5."},{"q":"In parallelogram ABCD, AB = 2x + 7 and CD = 5x − 8. Find the length of AB.","o":["17","15","19","23"],"a":0,"why":"Opposite sides are equal: 2x + 7 = 5x − 8, so x = 5 and AB = 17."},{"q":"A parallelogram has angles A = (2x + 20)° and B = (4x − 8)°. Find angle A.","o":["104°","76°","84°","96°"],"a":1,"why":"Adjacent angles sum to 180°: 6x + 12 = 180, so x = 28; angle A = 2(28) + 20 = 76°."},{"q":"A parallelogram has adjacent sides 2x cm and (x + 6) cm, and perimeter 48 cm. Find x.","o":["4","8","6","10"],"a":2,"why":"Perimeter gives 2(2x + x + 6) = 48, so 6x + 12 = 48 and x = 6."},{"q":"The diagonals of a parallelogram intersect at O. If AO = 3x − 1 and OC = x + 7, find x.","o":["3","5","6","4"],"a":3,"why":"The diagonals bisect each other, so 3x − 1 = x + 7, giving x = 4."},{"q":"A parallelogram has one angle of 4x° and an adjacent angle of (2x + 30)°. Find the larger angle.","o":["110°","70°","100°","120°"],"a":0,"why":"6x + 30 = 180, so x = 25; the angles are 100° and 80°."},{"q":"In parallelogram ABCD, AB = 12 cm and BC = 7 cm. If the diagonals intersect at O, what is the perimeter of triangle AOB if AO = 8 cm and BO = 6 cm?","o":["27 cm","26 cm","25 cm","24 cm"],"a":1,"why":"Triangle AOB has sides AO = 8 cm, BO = 6 cm, and AB = 12 cm, so its perimeter is 26 cm."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Parallelogram Properties Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-parallelogram-properties-large-numbers-layout-v1" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
