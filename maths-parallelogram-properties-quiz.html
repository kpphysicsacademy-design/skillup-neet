<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"In a parallelogram, which sides are equal?","o":["Opposite sides","Adjacent sides always","Only the longer sides","No sides"],"a":0,"e":"Both pairs of opposite sides are equal in a parallelogram.","v":"parallelogram-properties"},{"d":"BASIC","q":"Opposite angles of a parallelogram are:","o":["Always supplementary to each other","Equal","Always 90°","Always unequal"],"a":1,"e":"Opposite angles in a parallelogram have equal measures.","v":"parallelogram-properties"},{"d":"BASIC","q":"Adjacent angles in a parallelogram add up to:","o":["90°","270°","180°","360°"],"a":2,"e":"Adjacent angles are supplementary, so their sum is 180°.","v":"parallelogram-properties"},{"d":"BASIC","q":"The diagonals of a parallelogram:","o":["Are always equal","Are always perpendicular","Never intersect","Bisect each other"],"a":3,"e":"Each diagonal cuts the other into two equal parts.","v":"parallelogram-properties"},{"d":"BASIC","q":"One angle of a parallelogram is 75°. What is the opposite angle?","o":["75°","105°","90°","15°"],"a":0,"e":"Opposite angles are equal, so the opposite angle is 75°.","v":"parallelogram-properties"},{"d":"BASIC","q":"One angle of a parallelogram is 110°. What is an adjacent angle?","o":["110°","70°","90°","55°"],"a":1,"e":"Adjacent angles sum to 180°; 180° − 110° = 70°.","v":"parallelogram-properties"},{"d":"BASIC","q":"If one side of a parallelogram is 8 cm, what is the length of its opposite side?","o":["4 cm","16 cm","8 cm","Cannot be determined"],"a":2,"e":"Opposite sides of a parallelogram are equal.","v":"parallelogram-properties"},{"d":"BASIC","q":"A parallelogram has adjacent side lengths 5 cm and 9 cm. What is its perimeter?","o":["14 cm","45 cm","18 cm","28 cm"],"a":3,"e":"Perimeter = 2(5 + 9) = 28 cm.","v":"parallelogram-properties"},{"d":"BASIC","q":"If the diagonals of a parallelogram intersect at O and one half of a diagonal is 6 cm, the other half of that diagonal is:","o":["6 cm","3 cm","12 cm","Cannot be determined"],"a":0,"e":"Diagonals bisect each other, so both halves are equal.","v":"parallelogram-properties"},{"d":"BASIC","q":"Which statement is always true for a parallelogram?","o":["All four angles are right angles","Both pairs of opposite sides are parallel","All four sides are equal","Diagonals are always perpendicular"],"a":1,"e":"A parallelogram has two pairs of parallel opposite sides.","v":"parallelogram-properties"},{"d":"MEDIUM","q":"One angle of a parallelogram is 3x° and its adjacent angle is 2x°. Find x.","o":["30","45","36","60"],"a":2,"e":"Adjacent angles sum to 180°: 3x + 2x = 180, so x = 36.","v":"parallelogram-properties"},{"d":"MEDIUM","q":"Opposite angles are (4x + 8)° and (6x − 22)°. Find x.","o":["12","18","20","15"],"a":3,"e":"Opposite angles are equal: 4x + 8 = 6x − 22, giving x = 15.","v":"parallelogram-properties"},{"d":"MEDIUM","q":"A parallelogram has perimeter 46 cm. One side is 8 cm. Find the adjacent side.","o":["15 cm","23 cm","19 cm","31 cm"],"a":0,"e":"2(a + b) = 46, so a + b = 23 and b = 23 − 8 = 15 cm.","v":"parallelogram-properties"},{"d":"MEDIUM","q":"Diagonals AC and BD meet at O. If AO = 7.5 cm, what is AC?","o":["7.5 cm","15 cm","3.75 cm","30 cm"],"a":1,"e":"The diagonals bisect each other, so AC = 2 × AO = 15 cm.","v":"parallelogram-properties"},{"d":"MEDIUM","q":"In parallelogram ABCD, AB = 3x + 1 and CD = 5x − 9. Find x.","o":["4","6","5","8"],"a":2,"e":"Opposite sides are equal: 3x + 1 = 5x − 9, so x = 5.","v":"parallelogram-properties"},{"d":"MEDIUM","q":"A parallelogram has one angle of 128°. What are the other three angles?","o":["128°, 128°, 128°","52°, 52°, 52°","90°, 90°, 52°","52°, 128°, 52°"],"a":3,"e":"Adjacent angles are 52° and opposite angles match, giving 52°, 128°, 52°.","v":"parallelogram-properties"},{"d":"MEDIUM","q":"Diagonals of a parallelogram intersect at O. If BO = 4.2 cm, find BD.","o":["8.4 cm","4.2 cm","2.1 cm","16.8 cm"],"a":0,"e":"O is the midpoint of BD, so BD = 2 × 4.2 = 8.4 cm.","v":"parallelogram-properties"},{"d":"MEDIUM","q":"Which extra condition guarantees that a parallelogram is a rectangle?","o":["All sides are equal","One angle is 90°","Diagonals are perpendicular","Adjacent sides are unequal"],"a":1,"e":"If one angle is 90°, adjacent and opposite angle properties make all four right angles.","v":"parallelogram-properties"},{"d":"MEDIUM","q":"Which extra condition guarantees that a parallelogram is a rhombus?","o":["One angle is 90°","Diagonals are equal","Two adjacent sides are equal","Opposite angles are equal"],"a":2,"e":"Adjacent sides equal, together with opposite-side equality, makes all four sides equal.","v":"parallelogram-properties"},{"d":"MEDIUM","q":"A parallelogram's diagonals are 18 cm and 24 cm. What are the lengths of their halves?","o":["18 cm and 24 cm","6 cm and 8 cm","9 cm and 24 cm","9 cm and 12 cm"],"a":3,"e":"Each diagonal is bisected, so the half-lengths are 9 cm and 12 cm.","v":"parallelogram-properties"},{"d":"HARD","q":"In parallelogram ABCD, angle A = (5x − 10)° and angle C = (3x + 30)°. Find x.","o":["20","10","15","25"],"a":0,"e":"Opposite angles are equal: 5x − 10 = 3x + 30, so x = 20.","v":"parallelogram-properties"},{"d":"HARD","q":"Adjacent angles of a parallelogram are (7x + 5)° and (5x + 7)°. Find x.","o":["12","14","15","10"],"a":1,"e":"Their sum is 180°: 12x + 12 = 180, so x = 14.","v":"parallelogram-properties"},{"d":"HARD","q":"The perimeter of a parallelogram is 64 cm. Its adjacent sides are in the ratio 3:5. Find the shorter side.","o":["8 cm","20 cm","12 cm","24 cm"],"a":2,"e":"Let sides be 3k and 5k. Then 2(8k) = 64, so k = 4 and the shorter side is 12 cm.","v":"parallelogram-properties"},{"d":"HARD","q":"Diagonals AC and BD meet at O. If AC = 4x + 2 and AO = 11 cm, find x.","o":["4","6","10","5"],"a":3,"e":"Since O bisects AC, AC = 22; hence 4x + 2 = 22 and x = 5.","v":"parallelogram-properties"},{"d":"HARD","q":"In parallelogram ABCD, AB = 2x + 7 and CD = 5x − 8. Find the length of AB.","o":["17","15","19","23"],"a":0,"e":"Opposite sides are equal: 2x + 7 = 5x − 8, so x = 5 and AB = 17.","v":"parallelogram-properties"},{"d":"HARD","q":"A parallelogram has angles A = (2x + 20)° and B = (4x − 8)°. Find angle A.","o":["104°","76°","84°","96°"],"a":1,"e":"Adjacent angles sum to 180°: 6x + 12 = 180, so x = 28; angle A = 2(28) + 20 = 76°.","v":"parallelogram-properties"},{"d":"HARD","q":"A parallelogram has adjacent sides 2x cm and (x + 6) cm, and perimeter 48 cm. Find x.","o":["4","8","6","10"],"a":2,"e":"Perimeter gives 2(2x + x + 6) = 48, so 6x + 12 = 48 and x = 6.","v":"parallelogram-properties"},{"d":"HARD","q":"The diagonals of a parallelogram intersect at O. If AO = 3x − 1 and OC = x + 7, find x.","o":["3","5","6","4"],"a":3,"e":"The diagonals bisect each other, so 3x − 1 = x + 7, giving x = 4.","v":"parallelogram-properties"},{"d":"HARD","q":"A parallelogram has one angle of 4x° and an adjacent angle of (2x + 30)°. Find the larger angle.","o":["110°","70°","100°","120°"],"a":0,"e":"6x + 30 = 180, so x = 25; the angles are 100° and 80°.","v":"parallelogram-properties"},{"d":"HARD","q":"In parallelogram ABCD, AB = 12 cm and BC = 7 cm. If the diagonals intersect at O, what is the perimeter of triangle AOB if AO = 8 cm and BO = 6 cm?","o":["27 cm","26 cm","25 cm","24 cm"],"a":1,"e":"Triangle AOB has sides AO = 8 cm, BO = 6 cm, and AB = 12 cm, so its perimeter is 26 cm.","v":"parallelogram-properties"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Explore parallelogram sides, angles and diagonals</strong><small>Opposite sides and adjacent angles</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Angle and diagonal calculations</strong><small>Apply parallelogram properties to solve problems</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Connect side counts, angles and diagonals</strong><small>Solve equations reducible to linear form</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
