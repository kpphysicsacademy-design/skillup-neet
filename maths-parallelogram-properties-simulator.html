<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="skillup-no-standard-menu" content="true"><meta name="skillup-release" content="20261119-parallelogram-properties-simulator-v1"><title>Parallelogram Properties | Simulator | SkillUp Maths</title><style>
:root{--blue:#267fbd;--green:#269b72;--ink:#1d3046;--muted:#718096;--line:#dce5ee;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line)}.nav{max-width:850px;margin:auto;min-height:54px;padding:8px 14px;display:flex;align-items:center;gap:12px}.nav a{color:var(--blue);font-weight:850;text-decoration:none}.brand{flex:1;font-weight:900}main{width:min(100% - 28px,800px);margin:auto;padding:18px 4px 38px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}h1{font-size:clamp(23px,4vw,30px);margin:0 0 8px}h2{font-size:18px;margin:0 0 8px}.muted{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field label{display:block;font-size:12px;font-weight:850;margin:0 0 5px}.field input,.field select{width:100%;min-height:44px;padding:8px 10px;border:1px solid #cbd7e1;border-radius:9px;font:inherit;background:#fff;color:var(--ink)}.formula{padding:13px;border-radius:11px;background:#eff7fc;text-align:center;font-size:clamp(18px,4vw,24px);font-weight:900;margin:12px 0;overflow-wrap:anywhere}.primary{width:100%;min-height:44px;margin-top:12px;border:0;border-radius:10px;background:var(--green);color:#fff;font:850 14px system-ui;cursor:pointer}.result{margin-top:12px;padding:13px;border-radius:11px;background:#f0f8f3;border:1px solid #d5eadc;font-size:14px;line-height:1.8;overflow-wrap:anywhere}.result.bad{background:#fff4f4;border-color:#f0d4d4;color:#963b3b}.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.links a{display:flex;align-items:center;justify-content:center;min-height:44px;padding:8px;border-radius:10px;background:#eaf5ff;border:1px solid #c9deee;color:#176a9b;text-decoration:none;text-align:center;font-size:13px;font-weight:850}@media(max-width:520px){main{width:100%;padding:12px 10px 28px}.card{padding:15px}.grid{grid-template-columns:1fr}}</style></head><body><header><div class="nav"><a href="maths-parallelogram-properties-quiz.html?v=20261119-parallelogram-properties-design-learn-simulator-v2">← Quiz</a><div class="brand">SkillUp Maths</div><span>🧮 Simulator</span></div></header><main>
<section class="card"><h1>Parallelogram Property Simulator</h1><p class="muted">Choose a calculation, enter values and explore the rule with worked steps.</p><div class="field"><label for="mode">Calculation</label><select id="mode"><option value="angle">Find adjacent angle</option><option value="opposite">Find opposite angle</option><option value="side">Find opposite side</option><option value="perimeter">Find perimeter</option><option value="height">Find area</option><option value="diagonal">Find full diagonal</option><option value="algebra">Solve equal opposite sides</option></select></div>
<div class="grid" style="margin-top:12px"><div class="field"><label id="labelA" for="a">Known angle (°)</label><input id="a" type="number" step="any" value="110"></div><div class="field"><label id="labelB" for="b">—</label><input id="b" type="number" step="any" value="8"></div></div><div class="grid" style="margin-top:9px"><div class="field"><label id="labelC" for="c">—</label><input id="c" type="number" step="any" value="15"></div><div class="field"><label id="labelD" for="d">—</label><input id="d" type="number" step="any" value="7"></div></div><div class="formula" id="preview">Adjacent angle = 180° − known angle</div><button class="primary" id="calculate">Calculate</button><div class="result" id="result" aria-live="polite">Select a calculation and enter values.</div></section>
<div class="links"><a href="maths-parallelogram-properties-quiz.html?v=20261119-parallelogram-properties-design-learn-simulator-v2">📝 Practice Quiz</a><a href="maths-parallelogram-properties-learn.html?v=20261119-parallelogram-properties-learn-v1">📘 Learn</a></div></main>
<script>(()=>{'use strict';const $=id=>document.getElementById(id);const configs={
angle:{labels:['Known angle (°)','—','—','—'],defaults:[110,0,0,0],formula:'Adjacent angle = 180° − known angle',run:v=>{if(v[0]<=0||v[0]>=180)return{error:'Enter an angle greater than 0° and less than 180°.'};return{answer:180-v[0],unit:'°',steps:['Adjacent angles in a parallelogram are supplementary.','Adjacent angle = 180° − '+v[0]+'°.','180° − '+v[0]+'° = '+(180-v[0])+'°.']};}},
opposite:{labels:['Known angle (°)','—','—','—'],defaults:[75,0,0,0],formula:'Opposite angle = known angle',run:v=>{if(v[0]<=0||v[0]>=180)return{error:'Enter an angle greater than 0° and less than 180°.'};return{answer:v[0],unit:'°',steps:['Opposite angles of a parallelogram are equal.','Opposite angle = '+v[0]+'°.']};}},
side:{labels:['Known side length','—','—','—'],defaults:[8,0,0,0],formula:'Opposite side = known side',run:v=>{if(v[0]<=0)return{error:'Enter a positive side length.'};return{answer:v[0],unit:' units',steps:['Opposite sides of a parallelogram are equal.','The opposite side has the same length: '+v[0]+'.']};}},
perimeter:{labels:['Side a','Adjacent side b','—','—'],defaults:[8,15,0,0],formula:'Perimeter = 2(a + b)',run:v=>{if(v[0]<=0||v[1]<=0)return{error:'Enter positive side lengths.'};return{answer:2*(v[0]+v[1]),unit:' units',steps:['Perimeter = a + b + a + b.','P = 2(a + b).','P = 2('+v[0]+' + '+v[1]+') = '+(2*(v[0]+v[1]))+'.']};}},
height:{labels:['Base','Perpendicular height','—','—'],defaults:[12,7,0,0],formula:'Area = base × perpendicular height',run:v=>{if(v[0]<=0||v[1]<=0)return{error:'Enter positive base and perpendicular height.'};return{answer:v[0]*v[1],unit:' square units',steps:['Area of a parallelogram = base × perpendicular height.','A = '+v[0]+' × '+v[1]+'.','A = '+(v[0]*v[1])+' square units.']};}},
diagonal:{labels:['Half of diagonal','—','—','—'],defaults:[7.5,0,0,0],formula:'Full diagonal = 2 × half diagonal',run:v=>{if(v[0]<=0)return{error:'Enter a positive half-diagonal length.'};return{answer:2*v[0],unit:' units',steps:['Diagonals of a parallelogram bisect each other.','Full diagonal = 2 × half diagonal.','2 × '+v[0]+' = '+(2*v[0])+'.']};}},
algebra:{labels:['Coefficient p','Constant q','Coefficient r','Constant s'],defaults:[3,1,5,-9],formula:'If opposite sides are equal: px + q = rx + s',run:v=>{const p=v[0],q=v[1],r=v[2],s=v[3];if(p===r)return{error:'The x coefficients are equal; this setup does not give a unique x value.'};const x=(s-q)/(p-r);return{answer:x,unit:'',steps:['Opposite sides are equal, so '+p+'x + ('+q+') = '+r+'x + ('+s+').','Move x terms to one side and constants to the other.','('+p+' − '+r+')x = '+(s-q)+'.','x = '+(s-q)+' ÷ ('+(p-r)+') = '+Number(x.toFixed(6))+'.']};}}
};
function update(){const cfg=configs[$('mode').value];['a','b','c','d'].forEach((id,i)=>{$('label'+id.toUpperCase()).textContent=cfg.labels[i];$(id).value=cfg.defaults[i];$(id).disabled=cfg.labels[i]==='—';});$('preview').textContent=cfg.formula;$('result').textContent='Enter values and calculate to see the working.';}
function calculate(){const cfg=configs[$('mode').value],v=['a','b','c','d'].map(id=>Number($(id).value));if(v.some((x,i)=>!$('abcd'[i]).disabled&&!Number.isFinite(x))){$('result').className='result bad';$('result').textContent='Enter valid numbers.';return;}const out=cfg.run(v);if(out.error){$('result').className='result bad';$('result').textContent=out.error;return;}$('result').className='result';$('result').innerHTML='<b>Answer: '+Number(out.answer.toFixed(6))+out.unit+'</b><br>'+out.steps.map((x,i)=>'<b>Step '+(i+1)+':</b> '+x).join('<br>');}
$('mode').addEventListener('change',update);$('calculate').addEventListener('click',calculate);update();calculate();})();</script></body></html>
