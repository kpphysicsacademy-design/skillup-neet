<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"In parallelogram ABCD, which side is equal in length to AB?","o":["AD","BC","CD","AC"],"a":2,"why":"Opposite sides of a parallelogram are equal, so AB = CD."},{"d":"BASIC","q":"Which angle relationship is always true in a parallelogram?","o":["Adjacent angles are equal","Opposite angles are equal","All four angles are equal","Every angle is 90°"],"a":1,"why":"Both pairs of opposite angles in a parallelogram are equal."},{"d":"BASIC","q":"What is the sum of two consecutive interior angles of a parallelogram?","o":["90°","180°","270°","360°"],"a":1,"why":"Consecutive angles lie on the same side of a transversal between parallel sides, so they are supplementary."},{"d":"BASIC","q":"The diagonals of a parallelogram always:","o":["Are equal in length","Meet at right angles","Bisect each other","Bisect every interior angle"],"a":2,"why":"Each diagonal cuts the other into two equal parts."},{"d":"BASIC","q":"In parallelogram ABCD, diagonal AC is drawn. Which pair of triangles is formed?","o":["△ABC and △CDA","△ABD and △BCD","△ABC and △BCD","△ACD and △ABD"],"a":0,"why":"Diagonal AC joins A to C and divides ABCD into △ABC and △CDA."},{"d":"BASIC","q":"In parallelogram PQRS, ∠P = 74°. What is ∠R?","o":["74°","106°","90°","148°"],"a":0,"why":"Opposite angles of a parallelogram are equal, so ∠R = 74°."},{"d":"BASIC","q":"In parallelogram ABCD, ∠A = 121°. Find ∠B.","o":["121°","59°","69°","239°"],"a":1,"why":"Consecutive angles are supplementary: ∠B = 180° − 121° = 59°."},{"d":"BASIC","q":"The diagonals AC and BD of parallelogram ABCD meet at O. If AO = 6 cm, find AC.","o":["6 cm","9 cm","12 cm","18 cm"],"a":2,"why":"The diagonals bisect each other, so OC = 6 cm and AC = AO + OC = 12 cm."},{"d":"BASIC","q":"A quadrilateral has one pair of opposite sides that are both equal and parallel. What can be concluded?","o":["It is a kite","It is a trapezium only","It is a parallelogram","It must be a rectangle"],"a":2,"why":"A quadrilateral with one pair of opposite sides both equal and parallel is a parallelogram."},{"d":"BASIC","q":"Which statement is not true for every parallelogram?","o":["Opposite sides are parallel","Opposite sides are equal","Diagonals bisect each other","Diagonals are equal in length"],"a":3,"why":"Diagonals of a general parallelogram bisect each other but need not be equal; equal diagonals are a special property of rectangles."},{"d":"MEDIUM","q":"In parallelogram ABCD, AB = 2x + 5 cm and CD = 17 cm. Find x.","o":["5","6","7","11"],"a":1,"why":"Opposite sides are equal: 2x + 5 = 17, so 2x = 12 and x = 6."},{"d":"MEDIUM","q":"In parallelogram ABCD, ∠A = (3x + 12)° and ∠C = (5x − 28)°. Find x.","o":["18","20","22","24"],"a":1,"why":"Opposite angles are equal: 3x + 12 = 5x − 28, giving 2x = 40 and x = 20."},{"d":"MEDIUM","q":"In parallelogram ABCD, ∠A = (2x + 15)° and ∠B = (3x + 30)°. Find x.","o":["25","27","30","33"],"a":1,"why":"Consecutive angles sum to 180°: 2x + 15 + 3x + 30 = 180, so 5x = 135 and x = 27."},{"d":"MEDIUM","q":"Diagonals AC and BD of parallelogram ABCD meet at O. If AO = (3x − 2) cm and OC = (x + 8) cm, find x.","o":["4","5","6","7"],"a":1,"why":"The diagonals bisect each other, so 3x − 2 = x + 8. Thus 2x = 10 and x = 5."},{"d":"MEDIUM","q":"In parallelogram ABCD, AB = (2x + 4) cm and CD = (4x − 10) cm. Find the length of AB.","o":["14 cm","16 cm","18 cm","20 cm"],"a":2,"why":"Set opposite sides equal: 2x + 4 = 4x − 10, so x = 7. Therefore AB = 2(7) + 4 = 18 cm."},{"d":"MEDIUM","q":"A parallelogram has perimeter 62 cm. One side is 18 cm. Find the length of an adjacent side.","o":["11 cm","13 cm","15 cm","26 cm"],"a":1,"why":"Perimeter = 2(a + b). Thus 62 = 2(18 + b), so 31 = 18 + b and b = 13 cm."},{"d":"MEDIUM","q":"In parallelogram ABCD, BC = 7 cm. What is the length of AD?","o":["3.5 cm","7 cm","14 cm","Cannot be determined"],"a":1,"why":"AD and BC are opposite sides of the parallelogram, so AD = BC = 7 cm."},{"d":"MEDIUM","q":"In parallelogram ABCD, ∠A = (4x + 10)° and ∠B = (2x + 20)°. Find x.","o":["20","25","30","35"],"a":1,"why":"Consecutive angles sum to 180°: 4x + 10 + 2x + 20 = 180, so 6x = 150 and x = 25."},{"d":"MEDIUM","q":"Which condition is sufficient by itself to prove that a quadrilateral is a parallelogram?","o":["Its diagonals are equal","Its diagonals bisect each other","One pair of adjacent sides is equal","One angle is 90°"],"a":1,"why":"If the diagonals of a quadrilateral bisect each other, the quadrilateral is a parallelogram."},{"d":"MEDIUM","q":"In parallelogram PQRS, ∠P = 68°. What is the exterior angle adjacent to ∠P?","o":["68°","102°","112°","122°"],"a":2,"why":"An interior angle and its adjacent exterior angle form a straight line: 180° − 68° = 112°."},{"d":"HARD","q":"In parallelogram ABCD, AB = (5x − 7) cm and CD = (3x + 9) cm. Find the common length of AB and CD.","o":["29 cm","31 cm","33 cm","35 cm"],"a":2,"why":"Set opposite sides equal: 5x − 7 = 3x + 9, so x = 8. The common length is 5(8) − 7 = 33 cm."},{"d":"HARD","q":"In parallelogram ABCD, ∠A = (4x − 6)° and ∠B = (2x + 12)°. Find ∠A.","o":["104°","108°","110°","114°"],"a":2,"why":"Consecutive angles sum to 180°: 4x − 6 + 2x + 12 = 180, so x = 29. Hence ∠A = 4(29) − 6 = 110°."},{"d":"HARD","q":"Diagonals AC and BD of parallelogram PQRS meet at O. If AO = (3x − 4) cm and OC = (x + 8) cm, find the full diagonal AC.","o":["24 cm","26 cm","28 cm","30 cm"],"a":2,"why":"The diagonals bisect each other: 3x − 4 = x + 8, so x = 6. Then AO = OC = 14 cm, giving AC = 28 cm."},{"d":"HARD","q":"Two consecutive angles of a parallelogram are in the ratio 4 : 5. Find the larger angle.","o":["80°","90°","100°","120°"],"a":2,"why":"Consecutive angles sum to 180°. Nine ratio parts equal 180°, so one part is 20° and the larger angle is 5 × 20° = 100°."},{"d":"HARD","q":"Both pairs of opposite sides of a quadrilateral are equal in length. Which conclusion follows?","o":["It is a parallelogram","It is always a rectangle","It is always a rhombus","Its diagonals must be equal"],"a":0,"why":"A quadrilateral with both pairs of opposite sides equal is a parallelogram; it need not be a rectangle or rhombus."},{"d":"HARD","q":"In parallelogram ABCD, diagonal BD is drawn. Which fact helps prove △ABD ≅ △CDB by SSS?","o":["AB = CD, AD = CB, and BD is common","AB = AD, and BC = CD","∠A = ∠C, and ∠B = ∠D","AC = BD, and AB = CD"],"a":0,"why":"Opposite sides are equal (AB = CD and AD = CB), and BD is the common side, so all three corresponding sides match."},{"d":"HARD","q":"In parallelogram ABCD, ∠A = (5x − 10)° and ∠C = (3x + 30)°. Find ∠A.","o":["80°","90°","100°","110°"],"a":1,"why":"Opposite angles are equal: 5x − 10 = 3x + 30, so x = 20. Therefore ∠A = 5(20) − 10 = 90°."},{"d":"HARD","q":"A parallelogram has perimeter 74 cm and one side is 21 cm. Find the adjacent side.","o":["14 cm","16 cm","18 cm","32 cm"],"a":1,"why":"74 = 2(21 + b), so 37 = 21 + b and the adjacent side is 16 cm."},{"d":"HARD","q":"The diagonals of a parallelogram are equal in length. Which special type must it be?","o":["Rhombus","Rectangle","Kite","Trapezium"],"a":1,"why":"A parallelogram with equal diagonals is a rectangle. A square is also a rectangle, so the statement remains true."},{"d":"HARD","q":"In parallelogram ABCD, ∠A : ∠B = 7 : 5. Find ∠C.","o":["75°","90°","105°","120°"],"a":2,"why":"Consecutive angles total 180°. Twelve parts equal 180°, so one part is 15°; ∠A = 7 × 15° = 105°. Opposite angles are equal, so ∠C = 105°."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Parallelogram Theorems Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
