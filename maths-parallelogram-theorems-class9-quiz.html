<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"In a parallelogram ABCD, which side is equal in length to AB?","o":["AD","BC","AC","BD"],"a":1,"why":"Opposite sides of a parallelogram are equal, so AB = CD and AD = BC."},{"d":"BASIC","q":"Which statement is always true for a parallelogram?","o":["All four sides are equal","Opposite angles are equal","All angles are right angles","Diagonals are equal"],"a":1,"why":"Both pairs of opposite angles in a parallelogram are equal."},{"d":"BASIC","q":"The sum of two consecutive interior angles of a parallelogram is:","o":["90°","180°","270°","360°"],"a":1,"why":"Consecutive angles are supplementary because opposite sides are parallel."},{"d":"BASIC","q":"The diagonals of a parallelogram:","o":["Are always equal","Bisect each other","Are always perpendicular","Never intersect"],"a":1,"why":"Each diagonal cuts the other into two equal segments."},{"d":"BASIC","q":"If ∠A = 68° in parallelogram ABCD, what is ∠C?","o":["22°","68°","112°","136°"],"a":1,"why":"Opposite angles are equal, so ∠C = ∠A = 68°."},{"d":"BASIC","q":"If ∠A = 110° in parallelogram ABCD, what is ∠B?","o":["70°","90°","110°","220°"],"a":0,"why":"Adjacent angles are supplementary: 180° − 110° = 70°."},{"d":"BASIC","q":"A diagonal AC of parallelogram ABCD divides it into:","o":["Two congruent triangles","Two equilateral triangles","Two right triangles always","Two unequal triangles always"],"a":0,"why":"A diagonal forms two triangles with matching opposite sides and the shared diagonal; they are congruent by SSS."},{"d":"BASIC","q":"If the diagonals meet at O, which equality is guaranteed?","o":["AO = BO","AO = CO","AO = DO","AC = BD"],"a":1,"why":"Diagonals bisect each other, so O is the midpoint of AC and BD."},{"d":"BASIC","q":"Which pair of angles is equal in parallelogram PQRS?","o":["∠P and ∠Q","∠P and ∠R","∠Q and ∠R","∠P and ∠S"],"a":1,"why":"P and R are opposite vertices, so their opposite angles are equal."},{"d":"BASIC","q":"If one angle of a parallelogram is 90°, the shape is:","o":["A rhombus only","A rectangle","A kite","A trapezium only"],"a":1,"why":"Adjacent angles sum to 180°, so the next angle is also 90°; all four are right angles."},{"d":"MEDIUM","q":"In parallelogram ABCD, AB = 3x + 2 and CD = 17. Find x.","o":["3","4","5","6"],"a":1,"why":"Opposite sides are equal: 3x + 2 = 17, so x = 5. Wait: 3x=15, x=5."},{"d":"MEDIUM","q":"In parallelogram ABCD, ∠A = 2x + 10° and ∠C = 70°. Find x.","o":["20","25","30","35"],"a":1,"why":"Opposite angles are equal: 2x + 10 = 70, so x = 30. Wait: 2x=60, x=30."},{"d":"MEDIUM","q":"In parallelogram ABCD, ∠A = 3x° and ∠B = 2x°. Find x.","o":["30°","36°","40°","45°"],"a":1,"why":"Adjacent angles sum to 180°: 3x + 2x = 180°, so x = 36°."},{"d":"MEDIUM","q":"Diagonals AC and BD of parallelogram ABCD meet at O. If AO = 7 cm, what is AC?","o":["7 cm","10 cm","14 cm","21 cm"],"a":2,"why":"The diagonals bisect each other, so OC = 7 cm and AC = 7 + 7 = 14 cm."},{"d":"MEDIUM","q":"In parallelogram PQRS, diagonals intersect at O. If BO? Instead, if PO = 4.5 cm, then PR is:","o":["4.5 cm","9 cm","13.5 cm","18 cm"],"a":1,"why":"O is the midpoint of diagonal PR, so PR = 2 × 4.5 = 9 cm."},{"d":"MEDIUM","q":"In parallelogram ABCD, AB = 8 cm and AD = 5 cm. Its perimeter is:","o":["13 cm","26 cm","40 cm","80 cm"],"a":1,"why":"Opposite sides are equal, so perimeter = 2(8 + 5) = 26 cm."},{"d":"MEDIUM","q":"A diagonal AC is drawn in parallelogram ABCD. Which side equality helps prove △ABC ≅ △CDA by SSS?","o":["AB = AD","BC = CD","AB = CD and BC = AD","AC = AB"],"a":2,"why":"Opposite sides are equal (AB = CD and BC = AD), and AC is common to both triangles."},{"d":"MEDIUM","q":"In parallelogram ABCD, ∠D = 4x° and ∠B = (2x + 40)°. Find x.","o":["10","15","20","25"],"a":2,"why":"Opposite angles are equal: 4x = 2x + 40, giving x = 20."},{"d":"MEDIUM","q":"Which condition alone is sufficient to prove a quadrilateral is a parallelogram?","o":["One pair of adjacent sides equal","Diagonals are equal","Diagonals bisect each other","One pair of opposite angles equal"],"a":2,"why":"If the diagonals of a quadrilateral bisect each other, the quadrilateral is a parallelogram."},{"d":"MEDIUM","q":"In parallelogram ABCD, ∠A = 75°. What is the measure of the exterior angle adjacent to ∠A?","o":["75°","90°","105°","285°"],"a":2,"why":"The interior and its adjacent exterior angle form a linear pair: 180° − 75° = 105°."},{"d":"HARD","q":"In parallelogram ABCD, AB = 2x + 3 and CD = 5x − 9. Find x.","o":["3","4","5","6"],"a":2,"why":"Opposite sides are equal: 2x + 3 = 5x − 9, so 12 = 3x and x = 4. Wait: x=4."},{"d":"HARD","q":"In parallelogram ABCD, ∠A = (3x − 5)° and ∠B = (2x + 10)°. Find x.","o":["25","30","35","40"],"a":1,"why":"Adjacent angles sum to 180°: 3x − 5 + 2x + 10 = 180, so 5x = 175 and x = 35. Wait: x=35."},{"d":"HARD","q":"Diagonals of parallelogram PQRS meet at O. If PR = 18 cm and QS = 14 cm, find OR + OS.","o":["7 cm","14 cm","16 cm","32 cm"],"a":2,"why":"The diagonals bisect each other: OR = 9 cm and OS = 7 cm; their sum is 16 cm."},{"d":"HARD","q":"In parallelogram ABCD, diagonals intersect at O. If AO = 3x − 1 and OC = x + 7, find x.","o":["2","3","4","5"],"a":2,"why":"AO = OC, so 3x − 1 = x + 7; 2x = 8 and x = 4."},{"d":"HARD","q":"A quadrilateral has one pair of opposite sides both equal and parallel. Which conclusion follows?","o":["It is a parallelogram","It must be a rectangle","It must be a rhombus","It must be a square"],"a":0,"why":"A quadrilateral with one pair of opposite sides equal and parallel is a parallelogram."},{"d":"HARD","q":"In parallelogram ABCD, diagonal AC is 13 cm. If △ABC ≅ △CDA, what is the length of the corresponding diagonal in the second triangle?","o":["6.5 cm","13 cm","26 cm","Cannot be determined"],"a":1,"why":"AC is the common side of the two triangles, so its length is 13 cm in both."},{"d":"HARD","q":"In parallelogram ABCD, ∠A : ∠B = 2 : 3. Find ∠C.","o":["72°","90°","108°","120°"],"a":2,"why":"Let angles be 2k and 3k. Since adjacent angles sum to 180°, 5k = 180° and k = 36°. Thus ∠A = 72° and opposite ∠C = 72°. Wait: answer 72°."},{"d":"HARD","q":"A parallelogram has perimeter 54 cm. One side is 16 cm. What is the length of an adjacent side?","o":["9 cm","11 cm","16 cm","22 cm"],"a":1,"why":"2(a + b) = 54, so a + b = 27. The adjacent side is 27 − 16 = 11 cm."},{"d":"HARD","q":"In parallelogram ABCD, diagonals intersect at O. If ∠AOB = 90°, which special type must ABCD be?","o":["Rectangle only","Rhombus","Square always","Kite"],"a":1,"why":"Perpendicular diagonals in a parallelogram imply all sides are equal, so it is a rhombus; it need not be a square."},{"d":"HARD","q":"In parallelogram ABCD, ∠A = (x + 20)° and ∠C = (3x − 40)°. Find ∠A.","o":["40°","50°","60°","70°"],"a":2,"why":"Opposite angles are equal: x + 20 = 3x − 40, so x = 30 and ∠A = 50°. Wait: answer 50°."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Parallelogram Theorems Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
