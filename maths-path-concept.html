 let t=esc(String(s));
 t=t.replace(/\\\\([()\\[\\]])/g,"$1");
 const supers={"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
 t=t.replace(/\\^\\{?(\\d+)\\}?/g,function(_,n){return "<sup>"+n.split("").map(x=>supers[x]).join("")+"</sup>";});
 t=t.replace(/([A-Za-z0-9]+)\\^([0-9]+)/g,function(_,base,n){return base+"<sup>"+n.split("").map(x=>supers[x]).join("")+"</sup>";});
 return t;
}
function mathifyDom(root){
 const walker=document.createTreeWalker(root,4);
 const nodes=[];
 let node;
 while(node=walker.nextNode())nodes.push(node);
 nodes.forEach(function(n){
  if(!n.nodeValue||n.nodeValue.includes("\\(")||n.nodeValue.includes("\\["))return;
  const p=n.parentElement;
  if(!p||p.closest("script,style,textarea,mjx-container,.peP,.sqP,.quiz-section,.cube-lesson,.variables-lesson,.algebra-lesson,.terms-lesson,.like-lesson,.identity-lesson,.factor-lesson,.linear-lesson,.geometry-lesson"))return;
  const out=mathifyText(n.nodeValue);
  if(out!==n.nodeValue)n.nodeValue=out;
 });
}
let mathTimer=0;
function refreshMath(){
 mathifyDom(app);
 if(window.MathJax&&window.MathJax.typesetPromise)window.MathJax.typesetPromise([app]).catch(()=>{});
}
function scheduleMath(){

}
function whenMathJaxReady(){
 if(window.MathJax&&window.MathJax.startup&&window.MathJax.startup.promise){
  window.MathJax.startup.promise.then(function(){refreshMath();}).catch(function(){});
 }else{
  setTimeout(whenMathJaxReady,100);
 }
}

function startPropertiesDemo(){
 const pick=document.getElementById("prProperty");if(!pick)return;
 const sl=["prA","prB","prC","prD","prE","prF"].map(id=>document.getElementById(id));
 const eq=document.getElementById("prEquation"),out=document.getElementById("prWork"),status=document.getElementById("prStatus"),third=document.getElementById("prThirdControls"),thirdDen=document.getElementById("prThirdDenControl"),thirdProp=document.getElementById("prThirdProp");
 const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a||1};
 const q=(n,d)=>{if(!d)return null;if(d<0){n=-n;d=-d}const g=gcd(n,d);return[n/g,d/g]};
 const add=(x,y)=>q(x[0]*y[1]+y[0]*x[1],x[1]*y[1]),mul=(x,y)=>q(x[0]*y[0],x[1]*y[1]),neg=x=>q(-x[0],x[1]),div=(x,y)=>y[0]===0?null:q(x[0]*y[1],x[1]*y[0]);
 const fhtml=x=>!x?"<span>Undefined</span>":x[1]===1?"<span>"+x[0]+"</span>":"<span>"+x[0]+"</span><span>"+x[1]+"</span>";
 const ftext=x=>!x?"Undefined":x[1]===1?String(x[0]):x[0]+"/"+x[1];
 const F=x=>"<span class=\"stacked-fraction\">"+fhtml(x)+"</span>";
 const token=x=>Array.isArray(x)?F(x):(typeof x==="string"?"<span class=\"pr-op\">"+x+"</span>":x);
 const side=items=>"<span class=\"pr-side\">"+items.map(token).join("")+"</span>";
 function update(){
  const [an,b,cn,d,en,f]=sl.map(x=>Number(x.value)),a=q(an,b),c=q(cn,d),e=q(en,f),p=pick.value;
  document.getElementById("prAvN").textContent=an;document.getElementById("prBv").textContent=b;document.getElementById("prCvN").textContent=cn;document.getElementById("prDv").textContent=d;document.getElementById("prEvN").textContent=en;document.getElementById("prFv").textContent=f;
  document.getElementById("prAv").textContent=ftext(a);document.getElementById("prCv").textContent=ftext(c);document.getElementById("prEv").textContent=ftext(e);
  const show=["assocAdd","assocMul","dist"].includes(p);third.style.display=show?"":"none";thirdDen.style.display=show?"":"none";thirdProp.style.display=show?"":"none";
  let l,r,L,R,desc;
  if(p==="commAdd"){l=add(a,c);r=add(c,a);L=[a,"+",c];R=[c,"+",a];desc="Changing the order keeps the sum the same."}
  else if(p==="commMul"){l=mul(a,c);r=mul(c,a);L=[a,"×",c];R=[c,"×",a];desc="Changing the order keeps the product the same."}
  else if(p==="assocAdd"){l=add(add(a,c),e);r=add(a,add(c,e));L=["(",a,"+",c,")","+",e];R=[a,"+","(",c,"+",e,")"];desc="Changing the grouping keeps the sum the same."}
  else if(p==="assocMul"){l=mul(mul(a,c),e);r=mul(a,mul(c,e));L=["(",a,"×",c,")","×",e];R=[a,"×","(",c,"×",e,")"];desc="Changing the grouping keeps the product the same."}
  else if(p==="dist"){l=mul(a,add(c,e));r=add(mul(a,c),mul(a,e));L=[a,"×","(",c,"+",e,")"];R=[a,"×",c,"+",a,"×",e];desc="Multiplication distributes across addition."}
  else if(p==="addId"){l=add(a,[0,1]);r=a;L=[a,"+",[0,1]];R=[a];desc="Adding zero leaves a rational number unchanged."}
  else if(p==="mulId"){l=mul(a,[1,1]);r=a;L=[a,"×",[1,1]];R=[a];desc="Multiplying by one leaves a rational number unchanged."}
  else if(p==="inverse"){l=add(a,neg(a));r=[0,1];L=[a,"+",neg(a)];R=[[0,1]];desc="A rational number plus its additive inverse is zero."}
  else {l=div(a,c);r=l;L=[a,"÷",c];R=[l];desc=l?"The quotient is rational because the divisor is non-zero.":"Division by zero is undefined. Change the second numerator."}
  eq.innerHTML=side(L)+"<span class=\"pr-eq\">=</span>"+side(R);
  const ok=!!(l&&r&&l[0]===r[0]&&l[1]===r[1]);
  status.textContent=ok?"TRUE":"UNDEFINED";
  out.innerHTML="<b>Result:</b> "+(l&&r?F(l)+" <span class=\"pr-eq\">=</span> "+F(r)+". ":"")+desc;
 }
 [...sl,pick].forEach(x=>x.addEventListener("input",update));
 document.querySelectorAll(".prP").forEach(btn=>btn.addEventListener("click",()=>{pick.value=btn.dataset.p;sl[0].value=btn.dataset.a;sl[1].value=btn.dataset.b;sl[2].value=btn.dataset.c;sl[3].value=btn.dataset.d;sl[4].value=btn.dataset.e;sl[5].value=btn.dataset.f;update()}));
 update();
}

  if(mode.value==="equilateral"){a=60;b=60;aSlider.value=60;bSlider.value=60;}
  else if(mode.value==="isosceles"){a=Math.min(89,Math.max(31,Number(aSlider.value)));b=a;aSlider.value=a;bSlider.value=b;}
  else if(mode.value==="right"){b=Math.min(80,Math.max(10,Number(bSlider.value)));a=90;aSlider.value=90;}
  else {a=Math.min(160,Math.max(10,a));b=Math.min(160,Math.max(10,b));if(a+b>170){b=170-a;bSlider.value=b;}}
  const c=180-a-b;if(c<=0)return;
  const typeName=classify(a,b,c);
  set("triALive",a+"°");set("triBLive",b+"°");set("triCLive",c+"°");set("triAPropLive",a+"°");set("triBPropLive",b+"°");set("triCPropLive",c+"°");set("triTypePropLive",typeName);set("triSliderAVal",a+"°");set("triSliderBVal",b+"°");
  set("triModeVal",mode.value==="equilateral"?"Equilateral":mode.value==="isosceles"?"Isosceles":mode.value==="right"?"Right triangle":"Free angles");
  set("triLiveTitle",typeName.toUpperCase());
  set("triLiveLine1",a+"° + "+b+"° + "+c+"° = 180°");

  const work=document.getElementById("triWorkLive");if(work)work.innerHTML="<b>Result:</b> "+a+"° + "+b+"° + "+c+"° = 180°. This is a "+typeName.toLowerCase()+".";
  const poly=document.getElementById("triLiveShape"),marks=document.getElementById("triLiveMarks");if(!poly||!marks)return;

  /* Build the triangle from the actual angle values, then auto-fit it into the SVG.
     Base BC is fixed first; the sine rule determines the other sides. This makes the
     drawn triangle itself change whenever either angle slider changes. */
  const bx=0,cx=280,by=0,base=cx-bx;
  const ar=a*Math.PI/180,br=b*Math.PI/180,cr=c*Math.PI/180;
  const ab=base*Math.sin(cr)/Math.sin(ar);
  const rawA={x:ab*Math.cos(br),y:-ab*Math.sin(br)};
  const pts=[{x:bx,y:by},rawA,{x:cx,y:by}];
  const minX=Math.min(...pts.map(p=>p.x)),maxX=Math.max(...pts.map(p=>p.x));
  const minY=Math.min(...pts.map(p=>p.y)),maxY=Math.max(...pts.map(p=>p.y));
  const width=Math.max(1,maxX-minX),height=Math.max(1,maxY-minY);
  const pad=35,targetW=350,targetH=220;
  const scale=Math.min(targetW/width,targetH/height);
  const ox=35-minX*scale+(targetW-width*scale)/2;
  const oy=35-minY*scale+(targetH-height*scale)/2;
  const p=pts.map(q=>({x:q.x*scale+ox,y:q.y*scale+oy}));
  poly.setAttribute("points",p.map(q=>q.x.toFixed(1)+","+q.y.toFixed(1)).join(" "));
  poly.setAttribute("vector-effect","non-scaling-stroke");

  const angleLabel=(q,dx,dy)=>({x:q.x+dx,y:q.y+dy});

 }

ator is made rational by multiplying by its conjugate?",["2+√5","√5","7","3/2"],0,"A binomial involving a radical is rationalised using its conjugate."],["What is the rationalised form of 3/(2+√5)?",["3(2−√5)/(−1)","3(2+√5)/9","(2−√5)/3","3/(2−√5)"],0,"The conjugate gives denominator 2²−5 = −1, so the result is −3(2−√5), equivalent to 3(√5−2)."],["Which denominator results from rationalising 1/(a+√b)?",["a²−b","a²+b","a+b","√(a²−b)"],0,"Multiplying by a−√b uses difference of squares: a²−b."],["Which statement best describes rationalisation?",["Removing a radical from the denominator without changing the value","Removing every radical from a fraction","Changing an irrational number into a rational number","Making the numerator equal to 1"],0,"Rationalisation changes the form of a fraction so its denominator is rational while preserving its value."]];
