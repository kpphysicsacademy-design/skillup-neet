function mathifyText(s){
 let t=String(s);
 // Remove orphaned MathJax closing delimiters from quiz text.
 if(!t.includes("\\(")&&!t.includes("\\["))t=t.replace(/\\\)/g,"");
 if(t.includes("\\(")||t.includes("\\[")){
  return t.replace(/\\\(([^]*?)\\\)/g,function(_,inner){
   inner=inner.replace(/([A-Za-z0-9]+)²/g,"$1^2").replace(/([A-Za-z0-9]+)³/g,"$1^3");
   return "\\("+inner+"\\)";
  });
 }
 t=t.replace(/([A-Za-z0-9]+)²/g,"\\($1^2\\)").replace(/([A-Za-z0-9]+)³/g,"\\($1^3\\)");
 t=t.replace(/([A-Za-z0-9]+)\^\{?(\d+)\}?/g,"\\($1^{$2}\\)");
 t=t.replace(/√\\s*([−-]?\\d+(?:\\.\\d+)?)/g,"\\(\\sqrt{$1}\\)");
 t=t.replace(/∛\\s*([−-]?\\d+(?:\\.\\d+)?)/g,"\\(\\sqrt[3]{$1}\\)");
 const term="(?:\\\\([^()]+\\\\)(?:\\^\\\\{?\\d+\\\\}?)?|[−-]?\\d*[A-Za-z](?:\\^\\\\{?\\d+\\\\}?)?|[−-]?\\d+(?:\\.\\d+)?(?:\\^\\\\{?\\d+\\\\}?)?)";
 const expr=new RegExp("(?<![A-Za-z0-9])("+term+"(?:\\\\s*[+−\\-×÷=<>]\\\\s*"+term+")+)(?![A-Za-z0-9])","g");
 t=t.replace(expr,"\\($1\\)");
 t=t.replace(/([−-]?\d+)\s*\/\s*([−-]?\d+)/g,"\\(\\frac{$1}{$2}\\)");
 return t;
}
function quizMath(s){
 let t=esc(String(s));
 // Normalize escaped delimiters and convert simple math to valid MathJax.
 t=t.replace(/\\\\[()\\[\\]]/g,"");
 t=t.replace(/([A-Za-z0-9]+)²/g,"\\\\($1^2\\\\)").replace(/([A-Za-z0-9]+)³/g,"\\\\($1^3\\\\)");
 t=t.replace(/([A-Za-z0-9]+)\\^{?(\\d+)}?/g,"\\\\($1^{$2}\\\\)");
 t=t.replace(/√\\s*([−-]?\\d+(?:\\.\\d+)?)/g,"\\\\(\\\\sqrt{$1}\\\\)");
 t=t.replace(/∛\\s*([−-]?\\d+(?:\\.\\d+)?)/g,"\\\\(\\\\sqrt[3]{$1}\\\\)");
 t=t.replace(/([−-]?\\d+)\\s*\/\\s*([−-]?\\d+)/g,"\\\\(\\\\frac{$1}{$2}\\\\)");
 return t;
}
function mathifyOption(s){
 let t=String(s);
 if(!t.includes("\\(")&&!t.includes("\\["))t=t.replace(/\\\)/g,"");
 if(t.includes("\\(")||t.includes("\\["))return t;
 if(/[²³^√∛]/.test(t) || (/[+−×÷=]/.test(t) && /[A-Za-z0-9]/.test(t)) || /^\s*[−-]?\d+\s*\/\s*[−-]?\d+\s*$/.test(t)){
  t=t.replace(/([A-Za-z0-9]+)²/g,"$1^2").replace(/([A-Za-z0-9]+)³/g,"$1^3");
  t=t.replace(/√\s*([−-]?\d+(?:\.\d+)?)/g,"\\sqrt{$1}");
  t=t.replace(/∛\s*([−-]?\d+(?:\.\d+)?)/g,"\\sqrt[3]{$1}");
  return "\\("+t+"\\)";
 }
 return mathifyText(t);
}
function mathifyDom(root){
 const walker=document.createTreeWalker(root,4);
 const nodes=[];
 let node;
 while(node=walker.nextNode())nodes.push(node);
 nodes.forEach(function(n){
  if(!n.nodeValue||n.nodeValue.includes("\\(")||n.nodeValue.includes("\\["))return;
  const p=n.parentElement;
  if(!p||p.closest("script,style,textarea,mjx-container,.peP,.sqP,.quiz-section,.cube-lesson,.variables-lesson,.algebra-lesson,.terms-lesson,.like-lesson,.identity-lesson,.factor-lesson,.linear-lesson,.geometry-lesson"))return;
  const out=mathifyText(n.nodeValue);
  if(out!==n.nodeValue)n.nodeValue=out;
 });
}

function startAlgebraIdentitiesDemo(){

 const type=document.getElementById("idTypeSelect"),as=document.getElementById("idASlider"),bs=document.getElementById("idBSlider");
 if(!type||!as||!bs)return;
 const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
 const fmt=n=>n<0?"−"+Math.abs(n):String(n);
 function update(){
  const a=Number(as.value),b=Number(bs.value),t=type.value;
  let left,right,leftLabel,rightLabel,leftPill,rightPill,formula,explain;
  if(t==="sum"){
   left=(a+b)*(a+b); right=a*a+2*a*b+b*b;
   leftLabel="LEFT SIDE"; rightLabel="RIGHT SIDE"; leftPill="(a+b)²"; rightPill="a² + 2ab + b²";
   formula="("+fmt(a)+" + "+fmt(b)+")² = "+fmt(a)+"² + 2×"+fmt(a)+"×"+fmt(b)+" + "+fmt(b)+"²";
   explain="Square of a sum: square the first term, add twice the product, then square the second term.";
   set("idTypeVal","Square of a sum");
  }else if(t==="diff"){
   left=(a-b)*(a-b); right=a*a-2*a*b+b*b;
   leftLabel="LEFT SIDE"; rightLabel="RIGHT SIDE"; leftPill="(a−b)²"; rightPill="a² − 2ab + b²";
   formula="("+fmt(a)+" − "+fmt(b)+")² = "+fmt(a)+"² − 2×"+fmt(a)+"×"+fmt(b)+" + "+fmt(b)+"²";
   explain="Square of a difference: the middle term is negative.";
   set("idTypeVal","Square of a difference");
  }else{
   left=a*a-b*b; right=(a+b)*(a-b);
   leftLabel="LEFT SIDE"; rightLabel="RIGHT SIDE"; leftPill="a² − b²"; rightPill="(a+b)(a−b)";
   formula=fmt(a)+"² − "+fmt(b)+"² = ("+fmt(a)+" + "+fmt(b)+")("+fmt(a)+" − "+fmt(b)+")";
   explain="Difference of two squares: factor it as sum × difference.";
   set("idTypeVal","Difference of two squares");
  }
  set("idAProp",fmt(a));set("idBProp",fmt(b));set("idASliderVal",fmt(a));set("idBSliderVal",fmt(b));
  set("idLeftLabel",leftLabel);set("idRightLabel",rightLabel);set("idLeftPill",leftPill);set("idRightPill",rightPill);
  set("idLeft",fmt(left));set("idRight",fmt(right));set("idLeftProp",fmt(left));set("idRightProp",fmt(right));
  set("idDiffProp",fmt(left-right));set("idStatus",left===right?"TRUE":"CHECK");
  set("idFormula",formula);
  const work=document.getElementById("idWork");
  if(work)work.innerHTML="<b>Result:</b> "+formula+" = "+fmt(left)+". Both sides are equal. "+explain;
 }
 [type,as,bs].forEach(el=>el.addEventListener("input",update));
 type.addEventListener("change",update);
 document.querySelectorAll(".idP").forEach(btn=>btn.addEventListener("click",()=>{type.value=btn.dataset.t;as.value=btn.dataset.a;bs.value=btn.dataset.b;update();}));
 update();
}

  }
  const w=document.getElementById("laWorkLive");if(w)w.innerHTML="<b>Result:</b> "+(t==="vertical"?a+"° = "+b+"°":a+"° + "+b+"° = "+rule)+".";
 }
 slider.addEventListener("input",update);type.addEventListener("change",()=>{if(type.value==="comp"){slider.min="5";slider.max="85";slider.value="30";}else if(type.value==="vertical"){slider.min="5";slider.max="175";slider.value="75";}else{slider.min="5";slider.max="175";slider.value="65";}update();});
 document.querySelectorAll(".laLiveP").forEach(btn=>btn.addEventListener("click",()=>{type.value=btn.dataset.t;if(type.value==="comp"){slider.min="5";slider.max="85";}else{slider.min="5";slider.max="175";}slider.value=btn.dataset.a;update();}));update();

function startBasicGeometricIdeasDemo(){
 if(norm(concept)!=="basic geometric ideas")return;
 const type=document.getElementById("bgiTypeSelect"),slider=document.getElementById("bgiSlider");
 if(!type||!slider)return;
 const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
 const fmt=n=>n<0?"−"+Math.abs(n):String(n);
 const escSvg=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
 function update(){
  const t=type.value, v=Number(slider.value), shape=document.getElementById("bgiShape");
  let title,desc1,desc2,desc3,measure,ends,property,left,middle,right,lp,mp,rp;
  if(t==="segment"){
   title="LINE SEGMENT";desc1="A finite part of a line";desc2="2 endpoints";desc3="Length = "+v+" cm";
   measure=v+" cm";ends="2";property="Finite length";left="Segment";middle=v+" cm";right="2 endpoints";lp="finite";mp="measured";rp="closed ends";
   shape.innerHTML='<line x1="55" y1="145" x2="'+(55+v*12)+'" y2="145" class="geo-line"/><circle cx="55" cy="145" r="7" class="geo-point"/><circle cx="'+(55+v*12)+'" cy="145" r="7" class="geo-point"/><text x="50" y="178" class="geo-note">A</text><text x="'+(50+v*12)+'" y="178" class="geo-note">B</text>';
  }else if(t==="ray"){
   title="RAY";desc1="Starts at one endpoint";desc2="Extends endlessly one way";desc3="1 endpoint";
   measure="∞";ends="1";property="One-way extension";left="Ray";middle="∞";right="1 endpoint";lp="one direction";mp="infinite";rp="start point";
   shape.innerHTML='<line x1="70" y1="145" x2="350" y2="145" class="geo-accent"/><path d="M350 145 L330 134 L330 156 Z" fill="#60a5fa"/><circle cx="70" cy="145" r="7" class="geo-point"/><text x="62" y="178" class="geo-note">A</text>';
  }else if(t==="line"){
   title="LINE";desc1="Extends endlessly both ways";desc2="No endpoints";desc3="No finite length";
   measure="∞";ends="0";property="Two-way extension";left="Line";middle="∞";right="0 endpoints";lp="both directions";mp="infinite";rp="no endpoints";
   shape.innerHTML='<line x1="45" y1="145" x2="355" y2="145" class="geo-line"/><path d="M45 145 L65 134 L65 156 Z" fill="#173f27"/><path d="M355 145 L335 134 L335 156 Z" fill="#173f27"/>';
  }else{
   title="ANGLE";desc1="Two rays share a vertex";desc2="Measure = "+v+"°";desc3="1 common vertex";
   measure=v+"°";ends="1 vertex";property="Opening between rays";left="Angle";middle=v+"°";right="1 vertex";lp="two rays";mp="measure";rp="common point";
   const rad=v*Math.PI/180, x2=70+210*Math.cos(rad), y2=145-210*Math.sin(rad);
   shape.innerHTML='<line x1="70" y1="145" x2="330" y2="145" class="geo-accent"/><line x1="70" y1="145" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" class="geo-accent"/><path d="M110 145 A40 40 0 '+(v>180?1:0)+' 0 '+(110+40*Math.cos(rad)).toFixed(1)+' '+(145-40*Math.sin(rad)) .toFixed(1)+'" class="geo-arc"/><circle cx="70" cy="145" r="7" class="geo-point"/><text x="62" y="178" class="geo-note">O</text>';
  }
  set("bgiTypeVal",t==="segment"?"Line segment":t==="ray"?"Ray":t==="line"?"Line":"Angle");
  set("bgiLeft",left);set("bgiMiddle",middle);set("bgiRight",right);set("bgiLeftPill",lp);set("bgiMiddlePill",mp);set("bgiRightPill",rp);
  set("bgiTypeProp",t==="segment"?"Line segment":t==="ray"?"Ray":t==="line"?"Line":"Angle");set("bgiMeasureProp",measure);set("bgiEndsProp",ends);set("bgiPropertyProp",property);
  set("bgiSliderLabel",t==="angle"?"Angle measure":"Size / value");set("bgiSliderVal",v);
  document.getElementById("bgiMeasureControl").style.display="block";
  set("bgiImgTitle",title);set("bgiImgLine1",desc1);set("bgiImgLine2",desc2);set("bgiImgLine3",desc3);set("bgiImgLine4",property);
  const work=document.getElementById("bgiWork");
  if(work){
   const name=t==="segment"?"line segment":t==="ray"?"ray":t==="line"?"line":"angle";
   work.innerHTML="<b>Result:</b> This is a "+name+". "+desc2+". "+desc3+".";
  }
 }
 [type,slider].forEach(el=>el.addEventListener("input",update));
 type.addEventListener("change",()=>{
  if(type.value==="angle"){slider.min="10";slider.max="170";slider.value="60";}
  else{slider.min="2";slider.max="20";slider.value="8";}
  update();
 });
 document.querySelectorAll(".bgiP").forEach(btn=>btn.addEventListener("click",()=>{
  type.value=btn.dataset.t;
  if(type.value==="angle"){slider.min="10";slider.max="170";}
  else{slider.min="2";slider.max="20";}

 }));
 update();
}
function startQuiz(){
 const host=document.getElementById("quiz");
 if(!host)return;
 host.innerHTML='<div style="padding:14px;color:#64806b;font-size:12px;font-weight:800">Loading mastery quiz…</div>';
 let quizSource;
 try{
  const quizKey=norm(concept)==="properties of rational numbers" ? "Properties of rational numbers" : key;
  const dedicated=bank[quizKey];
  quizSource=norm(concept)==="properties of rational numbers" ? (dedicated||INLINE_PROPERTIES_QUIZ) : (norm(concept)==="squares and square roots" ? (dedicated||INLINE_SQUARES_QUIZ) : (norm(concept)==="terms and coefficients" ? (dedicated||INLINE_TERMS_COEFFICIENTS_QUIZ) : (norm(concept)==="like and unlike terms" ? (dedicated||INLINE_LIKE_AND_UNLIKE_TERMS_QUIZ) : (norm(concept)==="factorisation basics" ? (dedicated||INLINE_FACTORISATION_BASICS_QUIZ) : (norm(concept)==="variables and constants" ? (dedicated||INLINE_VARIABLES_CONSTANTS_QUIZ) : dedicated)))));
 }catch(e){
  host.innerHTML='<div class="empty">Mastery Quiz could not load. Please refresh this page.</div>';
  return;
 }
 if(!Array.isArray(quizSource)||quizSource.length===0){host.innerHTML='<div class="empty">No dedicated 30-question bank is available for <b>'+esc(title)+'</b> yet. This quiz is intentionally empty — no other concept questions are reused.</div>';return}
 const questions=quizSource.slice(0,30), total=questions.length;let i=0,score=0,answered=false;
 host.className="quiz-section";host.innerHTML='<div class="quiz-head"><span class="progress" id="qp">Question 1 of '+total+'</span><span class="progress" id="qs">Score 0</span></div><div class="bar"><div class="fill" id="qf"></div></div><div class="qno" id="qno"></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="explain" id="explain"></div><button class="next" id="next" disabled>Next</button>';
 const qno=document.getElementById("qno"),q=document.getElementById("question"),opts=document.getElementById("options"),fb=document.getElementById("feedback"),ex=document.getElementById("explain"),next=document.getElementById("next");
 function quizPlain(s){
  let t=esc(String(s));
  t=t.replace(/\\\(([^]*?)\\\)/g,"$1").replace(/\\\[([^]*?)\\\]/g,"$1").replace(/\\\)/g,"").replace(/\\\]/g,"");
  return t;
 }
 function render(){answered=false;next.disabled=true;fb.textContent="";ex.textContent="";ex.style.display="none";const item=questions[i];qno.textContent="MASTERY PRACTICE • "+(i+1);q.textContent=String(item[0]).replace(/\\\(([^]*?)\\\)/g,"$1").replace(/\\\[([^]*?)\\\]/g,"$1").replace(/\\\)/g,"").replace(/\\\]/g,"");opts.innerHTML=item[1].map((o,j)=>'<button class="opt" data-i="'+j+'">'+quizPlain(o)+'</button>').join("");document.getElementById("qp").textContent="Question "+(i+1)+" of "+total;document.getElementById("qf").style.width=(i/total*100)+"%";document.getElementById("qs").textContent="Score "+score;opts.querySelectorAll(".opt").forEach(btn=>btn.addEventListener("click",()=>answer(+btn.dataset.i)));
 }
 function answer(j){if(answered)return;answered=true;const item=questions[i],correct=item[2];opts.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k===correct)b.classList.add("correct");else if(k===j)b.classList.add("wrong")});if(j===correct){score++;fb.textContent="Correct";}else fb.textContent="Review the highlighted answer";ex.textContent=quizPlain(item[3]||"");ex.style.display="block";next.disabled=false;document.getElementById("qs").textContent="Score "+score;}
 next.addEventListener("click",()=>{i++;if(i>=total){host.innerHTML='<div class="result"><div class="score">'+score+' / '+total+'</div><p>Mastery quiz complete for <b>'+esc(title)+'</b>.</p><button class="next" id="again">Try Again</button></div>';document.getElementById("again").onclick=()=>startQuiz();return}render()});render();
}
