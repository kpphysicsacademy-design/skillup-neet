<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Mathematics Concept</title>
<script>
window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['$','$']]},svg:{fontCache:'global'}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
:root{--green:#58cc02;--green-dark:#46a302;--blue:#1cb0f6;--navy:#183b63;--ink:#263238;--muted:#718096;--line:#dfe7ee;--bg:#f7fafc;--red:#ff4b4b;--gold:#ffc800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.nav{max-width:780px;height:58px;margin:auto;padding:0 16px;display:flex;align-items:center;justify-content:center}
.brand{color:var(--navy);font-weight:950;font-size:20px;text-align:center}
.wrap{max-width:780px;margin:auto;padding:18px 14px 80px}.hero{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px 22px;margin-bottom:14px;box-shadow:0 4px 14px #183b6310}
.eyebrow{font-size:10px;font-weight:950;letter-spacing:1px;color:var(--muted)}h1{font-size:clamp(30px,6vw,44px);line-height:1.05;color:var(--navy);margin:6px 0 12px}
.pathmeta{display:flex;gap:7px;flex-wrap:wrap}.pill{font-size:10px;font-weight:950;padding:6px 10px;border-radius:999px;background:#eef8e9;color:#338700}
.progress{height:10px;background:#e8eef3;border-radius:999px;overflow:hidden;margin-top:16px}.bar{height:100%;width:0;background:var(--green);border-radius:999px;transition:.3s}
.lesson{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;margin-bottom:14px;box-shadow:0 4px 14px #183b6310}.lesson h2{margin:0 0 10px;color:var(--navy)}.learn{line-height:1.65}.formula{margin-top:14px;padding:15px;border:1px solid var(--line);border-radius:16px;background:#f9fbfd;text-align:center;font-size:21px}
.quiz{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;margin-bottom:14px;box-shadow:0 5px 18px #183b6312}
.quizhead{display:flex;align-items:center;gap:12px}.level{font-size:10px;font-weight:950;letter-spacing:1px;color:var(--muted);flex:1}.qnum{font-size:13px;font-weight:950;color:var(--navy)}
.qtext{font-size:22px;line-height:1.4;font-weight:900;color:var(--ink);margin:22px 0 18px}
.answers{display:grid;gap:11px}.ans{position:relative;width:100%;min-height:56px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:13px 16px 13px 50px;text-align:left;font-size:16px;font-weight:800;cursor:pointer;transition:.12s;box-shadow:0 2px 0 #e3e9ee}
.ans:before{content:attr(data-letter);position:absolute;left:14px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:2px solid #cbd7e0;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:950;color:var(--muted)}
.ans:hover{border-color:#a9c7dc;transform:translateY(-1px)}.ans:disabled{cursor:default;transform:none}.ans.correct{border-color:var(--green);background:#effbe9;box-shadow:0 2px 0 var(--green-dark)}.ans.correct:before{border-color:var(--green);color:var(--green-dark)}.ans.wrong{border-color:var(--red);background:#fff0f0;box-shadow:0 2px 0 #d83a3a}.ans.wrong:before{border-color:var(--red);color:var(--red)}
.actions{display:flex;justify-content:flex-end;margin-top:16px}.continue{display:none;border:0;border-radius:14px;background:var(--green);box-shadow:0 4px 0 var(--green-dark);color:#fff;padding:13px 22px;font-size:15px;font-weight:950;cursor:pointer}.continue:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-dark)}
.result{display:none;background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px 22px;text-align:center;box-shadow:0 5px 18px #183b6312}.trophy{font-size:52px}.result h2{color:var(--navy);font-size:28px}.score{font-size:20px;font-weight:950}.next{display:inline-block;margin-top:12px;background:var(--navy);color:#fff;text-decoration:none;padding:13px 20px;border-radius:14px;font-weight:950}

.result .pathmeta{display:flex;gap:7px;flex-wrap:wrap}.result .pill{font-size:11px}.result .next{border:0;cursor:pointer}
@media(max-width:560px){.stats .stat{padding:6px 8px;font-size:11px}.wrap{padding:12px 10px 70px}.hero,.lesson,.quiz,.result{border-radius:20px;padding:18px}.qtext{font-size:19px}.ans{font-size:15px;min-height:54px}}
</style>
</head>
<body>
<header class="top"><nav class="nav"><span class="brand" id="headerTitle">Mathematics</span></nav></header>
<main class="wrap">


<section class="quiz" id="quiz"><div class="quizhead"><div class="level">🎯 PRACTICE</div><div class="qnum" id="qnum">1 / 10</div></div><div id="question" class="qtext"></div><div id="answers" class="answers"></div><div class="actions"><button id="continue" class="continue">Continue →</button></div></section>

<section class="result" id="result">
<div class="trophy" id="resultIcon">🏆</div>
<h2 id="resultTitle">Quiz complete!</h2>
<div class="score" id="finalScore"></div>
<div class="pathmeta" style="justify-content:center;margin-top:14px">
<span class="pill" id="accuracyStat">Accuracy 0%</span>
<span class="pill" id="correctStat">Correct 0</span>
<span class="pill" id="timeStat">Time 0s</span>
</div>
<div id="analyticsSummary" style="margin-top:18px;line-height:1.6;font-weight:700;color:#52616f"></div>
<a class="next" id="retry" href="#">Try again</a>
</section>
</main>
<script src="central-config.js?v=20260909fb3"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="central-auth.js?v=20260910authfix4"></script>
<script src="maths-question-bank.js?v=20261005z"></script>
<script>
const qs=new URLSearchParams(location.search),concept=qs.get('concept')||'Natural numbers';
let skillUpSession=null;
(async()=>{
  if(!window.SkillUpAuth || !window.SkillUpAuth.configured){
    console.warn('SkillUp authentication is not configured; quiz will remain read-only.');
    return;
  }
  skillUpSession=await window.SkillUpAuth.requireAuth(location.href);
})();
const bank={
'Natural numbers':{
learn:'Natural numbers are the counting numbers used to describe quantity. In this path we use <b>1, 2, 3, 4, …</b>. The successor of a natural number <i>n</i> is <i>n+1</i>, while its predecessor is <i>n−1</i> for n>1. Natural numbers are closed under addition and multiplication.',
formula:'$$\mathbb{N}=\{1,2,3,4,\ldots\}$$',
next:'Integers',
questions:[
['Which set represents the natural numbers?',['{1, 2, 3, 4, …}','{0, 1, 2, 3, …}','{…, −2, −1, 0, 1, …}','{1/2, 1, 2, 3, …}'],0,'Using the convention in this course, natural numbers begin with 1.'],
['What is the successor of 8?',['7','8','9','10'],2,'The successor is the next number: 8+1=9.'],
['What is the predecessor of 10?',['8','9','10','11'],1,'The predecessor is the number immediately before 10: 10−1=9.'],
['Which operation keeps natural numbers closed?',['Subtraction','Division','Addition','Square root'],2,'Adding two natural numbers always gives another natural number.'],
['4+7=7+4 illustrates which property?',['Associative','Commutative','Distributive','Closure'],1,'Changing the order does not change the sum, so addition is commutative.'],
['Which number is the additive identity?',['0','1','−1','10'],0,'For addition, 0 is the identity because n+0=n.'],
['Which is an even natural number?',['11','13','14','17'],2,'14 is divisible by 2, so it is even.'],
['24+16 equals:',['30','36','40','42'],2,'24+16=40.'],
['Are natural numbers closed under multiplication?',['Yes','No','Only for even numbers','Only for prime numbers'],0,'The product of two natural numbers is another natural number.'],
['3×(4+5)=3×4+3×5 illustrates:',['Commutative law','Associative law','Distributive law','Identity law'],2,'Multiplication distributes over addition: a(b+c)=ab+ac.']
]},
'Integers':{learn:'Integers include positive whole numbers, zero, and their negative counterparts.',formula:'$$\mathbb{Z}=\{\ldots,-3,-2,-1,0,1,2,3,\ldots\}$$',next:'Rational numbers',questions:[
['Which is an integer?',['2.5','−7','1/3','√2'],1,'Negative whole numbers are integers.'],
['The additive inverse of 6 is:',['6','0','−6','1/6'],2,'6+(−6)=0.']
]}
};
const fallback={learn:'This concept is part of the SkillUp Mathematics progressive path. Study the definition, key properties, worked examples, then practise before moving to the next concept.',formula:'',next:'Integers',questions:[['Is this concept available for practice?',['Yes','No','Only later','Not sure'],0,'This concept is connected to the progressive practice flow.']]};
const data=bank[concept]||fallback;document.getElementById('headerTitle').textContent=concept;
function typeset(){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();}
if(window.MathJax&&MathJax.startup)MathJax.startup.promise.then(typeset);
const bankQuiz=(window.SKILLUP_MATHS_QUIZ_BANK&&window.SKILLUP_MATHS_QUIZ_BANK[concept]);
const questions=Array.isArray(bankQuiz)&&bankQuiz.length?bankQuiz:data.questions;
if(!Array.isArray(bankQuiz)||!bankQuiz.length){console.warn('Dedicated Maths quiz bank entry not loaded for concept:',concept);}
let i=0,score=0,answered=false;
const startedAt=Date.now();
const qEl=document.getElementById('question'),aEl=document.getElementById('answers'),cont=document.getElementById('continue'),quizEl=document.getElementById('quiz'),resultEl=document.getElementById('result');
function render(){answered=false;cont.style.display='none';cont.disabled=false;cont.textContent='Continue →';document.getElementById('qnum').textContent=(i+1)+' / '+questions.length;const q=questions[i];qEl.innerHTML=q[0];aEl.innerHTML='';q[1].slice(0,4).forEach((x,n)=>{const b=document.createElement('button');b.className='ans';b.dataset.letter=String.fromCharCode(65+n);b.textContent=x;b.onclick=()=>answer(n,b);aEl.appendChild(b)});typeset()}
function answer(n,button){if(answered)return;answered=true;const q=questions[i];[...aEl.children].forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct')});if(n===q[2])score++;else button.classList.add('wrong');cont.textContent=(i===questions.length-1)?'Done ✓':'Continue →';cont.style.display='inline-block'}
async function showResults(){
 const total=questions.length,accuracy=total?Math.round(score/total*100):0,time=Math.max(1,Math.round((Date.now()-startedAt)/1000));
 quizEl.style.display='none';resultEl.style.display='block';
 document.getElementById('finalScore').textContent=score+' / '+total+' correct';
 document.getElementById('accuracyStat').textContent='Accuracy '+accuracy+'%';
 document.getElementById('correctStat').textContent='Correct '+score;
 document.getElementById('timeStat').textContent='Time '+time+'s';
 document.getElementById('analyticsSummary').textContent=accuracy>=90?'Excellent mastery — ready to move forward.':accuracy>=70?'Good progress — review the missed questions once.':'Keep practising — review this concept before moving forward.';
 const icon=document.getElementById('resultIcon');icon.textContent=accuracy>=90?'🏆':accuracy>=70?'⭐':'💪';
 document.getElementById('retry').href=location.href;

 if(skillUpSession && window.SkillUpAuth && window.SkillUpAuth.saveProgress){
   try{
     await window.SkillUpAuth.saveProgress({
       subject:'Mathematics',
       topic:concept,
       score:score,
       total:total,
       accuracy:accuracy,
       time_seconds:time,
       completed:true,
       source:'maths-path-concept',
       completed_at:new Date().toISOString()
     });
     document.getElementById('analyticsSummary').textContent += ' Progress saved to your SkillUp account.';
   }catch(err){
     console.warn('Unable to save quiz progress',err);
   }
 }
}
cont.onclick=()=>{if(i<questions.length-1){i++;render()}else{showResults()}};
render();
</script>
</body></html>
