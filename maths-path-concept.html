<script defer>
(function(){
"use strict";
const qs=new URLSearchParams(location.search);
const concept=(qs.get("concept")||"Natural numbers").trim();
const $=id=>document.getElementById(id);
$("conceptTitle").textContent=concept;
const guides={"Real numbers":`<div style="display:grid;gap:16px"><div style="padding:16px;border-radius:18px;background:#f0f8ff;border:1px solid #d7eaf7"><div style="font-size:12px;font-weight:950;color:#1c78a8">🌱 START WITH AN IDEA</div><h3 style="margin:7px 0 6px;color:#183b63">Numbers are everywhere.</h3><p style="margin:0">A temperature can be $-2.5^\\circ C$, a measurement can be $1.72\\,m$, and a calculation can contain $\\sqrt2$. These numbers all live on the real number line.</p></div><div style="padding:16px;border-radius:18px;background:#fff;border:1px solid #dfe7ee"><div style="font-size:12px;font-weight:950;color:#718096">💡 THE BIG IDEA</div><p><strong>Real numbers</strong> are all numbers that can be represented by points on the real number line.</p><p style="font-size:20px;font-weight:900;text-align:center">\\(\\mathbb N\\subseteq\\mathbb Z\\subseteq\\mathbb Q\\subseteq\\mathbb R\\)</p><p style="margin-bottom:0">Natural numbers are inside integers, integers are inside rationals, and rationals are inside real numbers.</p></div><div style="padding:16px;border-radius:18px;background:#fff;border:1px solid #dfe7ee"><div style="font-size:12px;font-weight:950;color:#718096">👨‍🏫 LET'S SOLVE ONE</div><p><strong>Classify \\(\\sqrt2\\).</strong></p><p>It is real, but it cannot be written as \\(\\frac pq\\) with integers \\(p,q\\), so it is irrational.</p><p style="font-size:18px;font-weight:900;margin-bottom:0">\\(\\boxed{\\sqrt2\\in\\mathbb R\\setminus\\mathbb Q}\\)</p></div><div style="padding:16px;border-radius:18px;background:#f9f7ff;border:1px solid #e3dcfa"><div style="font-size:12px;font-weight:950;color:#6853a8">🧩 YOUR TURN</div><p><strong>Which is rational?</strong> \\(\\sqrt3\\), \\(\\frac37\\), \\(\\pi\\), or \\(\\sqrt7\\)?</p><details><summary style="cursor:pointer;font-weight:900;color:#183b63">Think → reveal</summary><p><strong>\\(\\frac37\\)</strong>, because it has the form \\(\\frac pq\\).</p></details></div><div style="padding:16px;border-radius:18px;background:#eef8e9;border:1px solid #d5ebc8"><div style="font-size:12px;font-weight:950;color:#338700">🧠 REMEMBER</div><p style="font-size:19px;font-weight:900;margin:7px 0">Rational = ratio of integers.</p><p style="margin:0">Irrational = real, but not expressible as a ratio of integers.</p></div></div>`,"Intervals":`<div style="display:grid;gap:16px"><div class="lesson-card" style="padding:18px;border-radius:20px;background:#eef8ff;border:1px solid #d7eaf7"><div class="eyebrow">🌱 DISCOVER</div><h3>Intervals = continuous parts of the number line.</h3><p>An interval describes every real number between two boundaries without listing them one by one.</p><p style="font-size:22px;font-weight:900;text-align:center">\\(2&lt;x&lt;5\\)</p><p>This means all real numbers greater than 2 and less than 5.</p></div><div style="padding:18px;border-radius:20px;background:#fff;border:1px solid #dfe7ee"><div class="eyebrow">💡 THE SYMBOLS</div><p style="font-size:19px;font-weight:900;text-align:center">\\([2,5]\\) &nbsp; included &nbsp;&nbsp; | &nbsp;&nbsp; \\( (2,5) \\) &nbsp; excluded</p><p>Square brackets include an endpoint. Parentheses exclude it.</p></div><div style="padding:18px;border-radius:20px;background:#f9f7ff;border:1px solid #e3dcfa"><div class="eyebrow">👨‍🏫 TRANSLATE INEQUALITY → INTERVAL</div><p>Use MathJax/LaTeX notation for the rule:</p><p style="font-size:18px;font-weight:900">\\(2&lt;x&lt;5\\) → \\( (2,5) \\)</p><p style="font-size:18px;font-weight:900">\\(2\\le x&lt;5\\) → \\( [2,5) \\)</p><p style="font-size:18px;font-weight:900">\\(2&lt;x\\le5\\) → \\( (2,5] \\)</p><p style="font-size:18px;font-weight:900">\\(2\\le x\\le5\\) → \\( [2,5] \\)</p></div><div style="padding:18px;border-radius:20px;background:#fff;border:1px solid #dfe7ee"><div class="eyebrow">♾️ INFINITY</div><p>Infinity is not a real endpoint, so always use parentheses.</p><p style="font-size:20px;font-weight:900;text-align:center">\\((-∞,4]\\) &nbsp;&nbsp; \\([3,\\infty)\\)</p></div><div style="padding:18px;border-radius:20px;background:#eef8e9;border:1px solid #d5ebc8"><div class="eyebrow">✍️ WORKED EXAMPLE</div><p><strong>Write \\(x\\ge3\\) in interval notation.</strong></p><p>3 is included because of \\(\\ge\\). The solution continues right forever.</p><p style="font-size:23px;font-weight:950;text-align:center">\\(\\boxed{[3,\\infty)}\\)</p></div><div style="padding:18px;border-radius:20px;background:#f0f8ff;border:1px solid #d7eaf7"><div class="eyebrow">🧩 YOUR TURN</div><p><strong>Convert \\(0\\le x&lt;7\\).</strong></p><details><summary style="cursor:pointer;font-weight:900">Think → reveal</summary><p>0 is included and 7 is excluded, so <strong>\\(\\boxed{[0,7)}\\)</strong>.</p></details></div><div style="padding:18px;border-radius:20px;background:#fff8ef;border:1px solid #f1dfc4"><div class="eyebrow">🎯 CHECKPOINT</div><p style="font-size:19px;font-weight:900;text-align:center">\\(\\le,\\ge\\) → [ ] &nbsp;&nbsp;&nbsp; \\(&lt;,&gt;\\) → ( )</p><p>For \\(\\pm\\infty\\), always use parentheses.</p></div><div style="padding:18px;border-radius:20px;background:#eef8e9;border:1px solid #d5ebc8"><div class="eyebrow">🧠 REMEMBER</div><p style="font-size:19px;font-weight:900">Bracket = included. Parenthesis = excluded.</p></div><div style="padding:16px;border-radius:18px;background:#fff;border:2px dashed #cfdbe5"><strong>🏆 Ready for mastery?</strong><p style="margin:6px 0 0">You can now read inequalities, convert them to interval notation and interpret them on the number line.</p></div></div>`,"Absolute value":`<div style="display:grid;gap:16px"><div style="padding:16px;border-radius:18px;background:#f0f8ff;border:1px solid #d7eaf7"><div style="font-size:12px;font-weight:950;color:#1c78a8">🌱 START WITH AN IDEA</div><h3 style="margin:7px 0 6px;color:#183b63">Absolute value means distance.</h3><p style="margin:0">Imagine standing at zero on a number line. The absolute value of a number tells you <strong>how far you are from zero</strong>, without caring whether you move left or right.</p><p style="font-size:22px;font-weight:950;text-align:center;margin:14px 0">\\(|-5|=5\\qquad |5|=5\\)</p><p style="margin:0">Both numbers are 5 units away from zero.</p></div><div style="padding:16px;border-radius:18px;background:#fff;border:1px solid #dfe7ee"><div style="font-size:12px;font-weight:950;color:#718096">💡 THE BIG IDEA</div><p>The absolute value is always non-negative:</p><p style="font-size:20px;font-weight:900;text-align:center">\\(|x|\\ge0\\)</p><p>Its piecewise definition is:</p><p style="font-size:19px;font-weight:900;text-align:center">\\(|x|=\\begin{cases}x,&x\\ge0\\\\-x,&x<0\\end{cases}\\)</p><p style="margin-bottom:0"><strong>Memory trick:</strong> if the number is already positive, keep it. If it is negative, change its sign.</p></div><div style="padding:16px;border-radius:18px;background:#fff;border:1px solid #dfe7ee"><div style="font-size:12px;font-weight:950;color:#718096">👨‍🏫 LET'S SOLVE ONE</div><p><strong>Find \\(|3-7|\\).</strong></p><p>First calculate inside the bars:</p><p style="font-size:18px;font-weight:900">\\(3-7=-4\\)</p><p>Now take the distance from zero:</p><p style="font-size:20px;font-weight:900">\\(|-4|=4\\)</p><p style="margin-bottom:0">Therefore, \\(\\boxed{|3-7|=4}\\).</p></div><div style="padding:16px;border-radius:18px;background:#f9f7ff;border:1px solid #e3dcfa"><div style="font-size:12px;font-weight:950;color:#6853a8">🧩 YOUR TURN</div><p><strong>Which pair has the same absolute value?</strong></p><p style="font-size:18px">\\(-3\\) and \\(3\\) &nbsp; | &nbsp; \\(-4\\) and \\(4\\) &nbsp; | &nbsp; \\(-5\\) and \\(2\\)</p><details><summary style="cursor:pointer;font-weight:900;color:#183b63">Think → reveal</summary><p><strong>\\(-4\\) and \\(4\\)</strong> have the same absolute value: \\(|-4|=|4|=4\\).</p></details></div><div style="padding:16px;border-radius:18px;background:#fff8ef;border:1px solid #f1dfc4"><div style="font-size:12px;font-weight:950;color:#a66b16">⭐ NEXT IDEA</div><p style="margin-bottom:0">Absolute value is also the language of <strong>distance and inequalities</strong>. For example:</p><p style="font-size:19px;font-weight:900;text-align:center">\\(|x|<3\\iff -3<x<3\\)</p><p style="margin-bottom:0">So an absolute-value inequality can be understood visually on the number line.</p></div><div style="padding:16px;border-radius:18px;background:#eef8e9;border:1px solid #d5ebc8"><div style="font-size:12px;font-weight:950;color:#338700">🧠 REMEMBER</div><p style="font-size:19px;font-weight:900;margin:7px 0">Absolute value = distance from zero.</p><p style="margin:0">Distance is never negative.</p></div><div style="padding:14px;border-radius:16px;background:#fff;border:2px dashed #cfdbe5"><strong>🎯 Ready for mastery?</strong><p style="margin:6px 0 0">You have learned the meaning, rule, example and visual idea. Start the 30-question mastery practice when you are ready.</p></div></div>`};$("lessonTitle").textContent=concept+" — Concept lesson";
$("lessonBody").innerHTML=guides[concept]||`<p>Learn the definition, key relationships, formulas, restrictions and common mistakes before starting the 30-MCQ practice.</p>`;
typeset();
window.addEventListener("load",typeset,{once:true});
document.addEventListener("DOMContentLoaded",typeset,{once:true});
$("retry").href=location.href;

let skillUpSession=null;
(async function(){
 try{
  if(window.SkillUpAuth&&window.SkillUpAuth.configured){
   skillUpSession=await window.SkillUpAuth.requireAuth(location.href);
  }
 }catch(e){console.warn("Authentication check failed; quiz remains usable.",e);}
})();

function validQuizBank(list){
 if(!Array.isArray(list)||list.length!==30)return false;
 const seenQ=new Set();
 return list.every(function(q){
  if(!Array.isArray(q)||q.length<4)return false;
  if(typeof q[0]!=="string"||!q[0].trim()||seenQ.has(q[0].trim()))return false;
  seenQ.add(q[0].trim());
  if(!Array.isArray(q[1])||q[1].length!==4)return false;
  const opts=q[1].map(x=>String(x).trim());
  if(opts.some(x=>!x)||new Set(opts).size!==4)return false;
  return Number.isInteger(q[2])&&q[2]>=0&&q[2]<4&&typeof q[3]==="string"&&q[3].trim().length>0;
 });
}

let questions=window.SKILLUP_MATHS_QUIZ_BANK&&window.SKILLUP_MATHS_QUIZ_BANK[concept];
if(!validQuizBank(questions)){
 $("quiz").style.display="none";
 $("errorBox").style.display="block";
 $("errorBox").textContent="This concept quiz is unavailable because its question bank failed validation. Please return to the Maths path and try again.";
 console.error("Invalid or missing Maths quiz bank:",concept,questions);
 return;
}

let i=0,score=0,answered=false;
const startedAt=Date.now();

$("startPractice").addEventListener("click",function(){ $("lesson").style.display="none"; $("quiz").style.display="block"; typeset(); window.scrollTo({top:0,behavior:"smooth"}); });
function formatQuizMath(value){
 let s=String(value);
 if(/\\\(|\\\[|\$/.test(s)) return s;
 s=s.replace(/\\|[^|]+\\|/g,function(m){return "\\("+m+"\\)";});
 if(/^\\s*[-+−]?(?:\\d+(?:\\.\\d+)?|x|a|b)(?:\\s*(?:=|<|>|<=|>=|≤|≥|±|\\+|−|\\-)\\s*[-+−]?(?:\\d+(?:\\.\\d+)?|x|a|b))*\\s*$/.test(s)||/^\\s*[\\(\\[][-+]?\\d+(?:\\.\\d+)?\\s*,\\s*(?:[-+]?\\d+(?:\\.\\d+)?|infinity)\\)?\\]?[\\)]?\\s*$/.test(s)||/^(?:\\(|\\[)-?infinity\\s*,/.test(s)){
  return "\\("+s+"\\)";
 }
 return s;
}
let mathTypesetQueue=Promise.resolve();
function typeset(){
 mathTypesetQueue=mathTypesetQueue.then(async function(){
  try{
   for(let n=0;n<100&&!window.MathJax;n++) await new Promise(r=>setTimeout(r,50));
   if(!window.MathJax||!window.MathJax.typesetPromise) return;
   if(window.MathJax.startup&&window.MathJax.startup.promise) await window.MathJax.startup.promise;
   await window.MathJax.typesetPromise();
  }catch(e){console.warn("MathJax typesetting failed",e);}
 });
 return mathTypesetQueue;
}
function render(){
 answered=false;
 $("continue").style.display="none";
 $("feedback").style.display="none";
 $("feedback").textContent="";
 $("qnum").textContent=(i+1)+" / "+questions.length;
 $("progressText").textContent="Question "+(i+1)+" of "+questions.length;
 $("progressBar").style.width=((i)/questions.length*100)+"%";
 const q=questions[i];
 $("question").innerHTML=formatQuizMath(q[0]);
 $("answers").textContent="";
 q[1].forEach(function(option,n){
  const b=document.createElement("button");
  b.type="button"; b.className="ans";
  b.dataset.letter=String.fromCharCode(65+n);
  b.innerHTML=formatQuizMath(option);
  b.addEventListener("click",()=>answer(n,b));
  $("answers").appendChild(b);
 });
 typeset();
}
function answer(n,button){
 if(answered)return;
 answered=true;
 const q=questions[i];
 [...$("answers").children].forEach(function(b,k){
  b.disabled=true;
  if(k===q[2])b.classList.add("correct");
 });
 const correct=n===q[2];
 if(correct)score++; else button.classList.add("wrong");
 $("feedback").innerHTML=(correct?"Correct — ":"Review this one — ")+formatQuizMath(q[3]);
 $("feedback").style.display="block";
 typeset();
 $("continue").textContent=i===questions.length-1?"Finish ✓":"Continue →";
 $("continue").style.display="inline-block";
}
async function finish(){
 const total=questions.length;
 const accuracy=Math.round(score/total*100);
 const time=Math.max(1,Math.round((Date.now()-startedAt)/1000));
 $("progressBar").style.width="100%";
 $("progressText").textContent="Completed — "+total+" of "+total;
 $("quiz").style.display="none";
 $("result").style.display="block";
 $("finalScore").textContent=score+" / "+total+" correct";
 $("accuracyStat").textContent="Accuracy "+accuracy+"%";
 $("correctStat").textContent="Correct "+score;
 $("timeStat").textContent="Time "+time+"s";
 $("resultIcon").textContent=accuracy>=90?"🏆":accuracy>=70?"⭐":"💪";
 $("resultTitle").textContent=accuracy>=90?"Excellent work!":accuracy>=70?"Good progress!":"Keep practising!";
 $("analyticsSummary").textContent=accuracy>=90
  ?"Excellent mastery — this concept is ready for the next level."
  :accuracy>=70
  ?"Good progress — review the missed questions once, then continue."
  :"Review this concept and try the quiz again to strengthen mastery.";
 if(skillUpSession&&window.SkillUpAuth&&window.SkillUpAuth.saveProgress){
  try{
   await window.SkillUpAuth.saveProgress({
    subject:"Mathematics",topic:concept,score:score,total:total,accuracy:accuracy,
    time_seconds:time,completed:true,source:"maths-path-concept",
    completed_at:new Date().toISOString()
   });
   $("analyticsSummary").textContent+=" Progress saved to your SkillUp account.";
  }catch(e){console.warn("Progress save failed",e);}
 }
}
document.addEventListener("keydown",function(e){
 if(answered && (e.key==="Enter" || e.key===" ")){e.preventDefault();$("continue").click();return;}
 if(!answered && /^[1-4]$/.test(e.key)){const n=Number(e.key)-1;const btn=$("answers").children[n];if(btn)btn.click();}
});
$("continue").addEventListener("click",function(){
 if(i<questions.length-1){i++;render();window.scrollTo({top:0,behavior:"smooth"});}
 else finish();
});
render();
})();
</script>
</body>
