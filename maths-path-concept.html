:root{--g:#58cc02;--deep:#173f27;--text:#263238;--muted:#66736b;--line:#d9e8d4;--bg:#f7fbf5;--card:#fff;--dark:#12151b;--warn:#fff7ed;--warnline:#fed7aa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}
.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}.nav,.wrap{max-width:760px;margin:auto}.nav{height:58px;padding:0 10px;display:flex;align-items:center;gap:8px}.back{font-size:11px;font-weight:900;color:var(--deep);text-decoration:none}.brand{flex:1;text-align:center;font-weight:950;color:var(--deep)}.brand small{display:block;font-size:7px;letter-spacing:1px;color:#64806b}.badge{font-size:8px;font-weight:950;background:#eaf8e6;color:#318600;padding:6px 9px;border-radius:999px}
.wrap{padding:10px 10px 60px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:10px;box-shadow:0 4px 14px rgba(23,69,42,.04)}.hero{padding:20px 18px}.kicker{font-size:8px;letter-spacing:1px;color:#64806b;font-weight:950}.hero h1{margin:5px 0;color:var(--deep);font-size:27px;line-height:1.15}.hero p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}h2{margin:0 0 11px;color:var(--deep);font-size:18px}
.lesson{background:#f8fcf6;border:1px solid var(--line);border-radius:15px;padding:14px}.lesson strong{font-size:16px}.lesson p{font-size:12px;line-height:1.6}.formula{margin:10px 0;padding:12px;background:#fff;border-radius:12px;text-align:center;font-size:18px;overflow-x:auto}

.props{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.prop{background:#f8fcf6;border:1px solid var(--line);border-radius:11px;padding:10px}.prop span{display:block;color:#718078;font-size:9px;font-weight:800}.prop strong{display:block;margin-top:3px;color:var(--deep);font-size:12px;overflow-wrap:anywhere}.control{margin-top:12px}.head{display:flex;justify-content:space-between;font-size:11px;font-weight:900}.val{color:#46a302}.range{width:100%;accent-color:var(--g)}select{width:100%;margin-top:7px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:800}.checks{margin-top:10px;background:#f8fcf6;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:11px;line-height:1.7}.presets{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.preset{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-weight:800;font-size:10px;cursor:pointer}.empty{padding:13px;background:var(--warn);border:1px solid var(--warnline);border-radius:12px;color:#9a3412;font-size:12px;line-height:1.5}

<body>
<header class="top"><div class="nav"><a class="back" href="maths-home.html?v=20261006-2359">← Maths Path</a><div class="brand">SkillUp<small>MATHEMATICS • CONCEPT PRACTICE</small></div><span class="badge">30 • MASTERY</span></div></header>
<main class="wrap" id="app"></main>
<script src="maths-quiz-bank.js?v=20261006-2359"></script>
<script>
(function(){
"use strict";
const qs=new URLSearchParams(location.search), concept=(qs.get("concept")||"").trim(), level=(qs.get("level")||"").trim(), chapter=(qs.get("chapter")||"").trim();
const app=document.getElementById("app"), bank=window.SKILLUP_MATHS_QUIZ_BANK||{};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const norm=s=>String(s||"").trim().toLowerCase();
const key=Object.keys(bank).find(k=>norm(k)===norm(concept));
const title=concept||"Mathematics Concept";
const header=level||"MATHEMATICS";
const chapterText=chapter||"Concept Practice";
function lessonHtml(){
 if(norm(concept)==="operations on rational numbers") return `
<strong>Rational numbers can be added, subtracted, multiplied, and divided using fraction rules.</strong>
<p><b>Addition:</b> use a common denominator. <b>Subtraction:</b> subtract numerators after using a common denominator.</p>
<div class="formula">\\(\\frac{a}{b}+\\frac{c}{d}=\\frac{ad+bc}{bd}\\)</div>
<div class="formula">\\(\\frac{a}{b}-\\frac{c}{d}=\\frac{ad-bc}{bd}\\)</div>
<p><b>Multiplication:</b> multiply numerator by numerator and denominator by denominator.</p>
<div class="formula">\\(\\frac{a}{b}\\times\\frac{c}{d}=\\frac{ac}{bd}\\)</div>
<p><b>Division:</b> multiply by the reciprocal of the divisor.</p>
<div class="formula">\\(\\frac{a}{b}\\div\\frac{c}{d}=\\frac{a}{b}\\times\\frac{d}{c},\\quad c\\ne0\\)</div>
<p style="margin-bottom:0;color:#66736b"><b>Important:</b> simplify the final answer. Division by zero is undefined.</p>`;
 if(norm(concept)==="rational numbers") return `
<strong>A rational number is any number that can be written as \\(p/q\\), where \\(p,q\\) are integers and \\(q\\ne0\\).</strong>
<div class="formula">\\(\\text{Rational number}=\\frac{p}{q},\\quad p,q\\in\\mathbb Z,\\ q\\ne0\\)</div>
<p>Examples include \\(3/5\\), \\(-7/2\\), \\(0/9\\), and every integer because \\(n=n/1\\).</p>`;
 if(norm(concept)==="equivalent rational numbers") return `
<strong>Equivalent rational numbers have the same value even when their numerator and denominator look different.</strong>
<div class="formula">\\(\\frac{a}{b}=\\frac{ak}{bk},\\quad k\\ne0\\)</div>
<p>Multiply or divide the numerator and denominator by the same non-zero number. Example: \\(2/3=4/6=6/9\\).</p>`;
 if(norm(concept)==="comparing rational numbers") return `
<strong>To compare rational numbers, convert them to a common denominator or compare their cross-products when denominators are positive.</strong>
<div class="formula">\\(\\frac{a}{b}\\ ?\\ \\frac{c}{d}\\quad\\Longleftrightarrow\\quad ad\\ ?\\ cb\\)</div>
<p>Example: \\(3/4\\) and \\(5/8\\): \\(3\\times8=24\\) and \\(5\\times4=20\\), so \\(3/4>5/8\\).</p>`;
 return `<strong>Build this concept from definition → example → practice.</strong><p>This page is routed specifically to <b>${esc(title)}</b>. No other concept's lesson is reused.</p><div class="formula">\\(\\text{Learn}\\rightarrow\\text{Explore}\\rightarrow\\text{Practice}\\)</div><p style="margin-bottom:0;color:#66736b">The dedicated lesson can be expanded with concept-specific definitions, examples, and worked practice.</p>`;
}
function explorerHtml(){
 if(norm(concept)!=="operations on rational numbers") return '<div class="empty">A concept-specific interactive explorer is not yet available for this concept. No unrelated visualizer is shown.</div>';
 return `
<div class="visual-banner"><div class="frac"><span class="n" id="an">1</span><span id="ad">2</span></div><div class="eq" id="sign">+</div><div class="frac"><span class="n" id="cn">1</span><span id="cd">3</span></div><div class="eq">=</div><div class="value-box"><small>SIMPLIFIED RESULT</small><strong id="result">5 / 6</strong><span class="pill" id="pill">Addition</span></div></div>
<div class="props"><div class="prop"><span>First rational</span><strong id="left">1 / 2</strong></div><div class="prop"><span>Second rational</span><strong id="right">1 / 3</strong></div><div class="prop"><span>Operation</span><strong id="operation">Addition</strong></div><div class="prop"><span>Decimal result</span><strong id="decimal">0.833</strong></div></div>
<div class="control"><div class="head"><span>Operation</span><span class="val" id="opv">Addition</span></div><select id="op"><option value="+">Addition (+)</option><option value="-">Subtraction (−)</option><option value="*">Multiplication (×)</option><option value="/">Division (÷)</option></select></div>
<div class="control"><div class="head"><span>First numerator</span><span class="val" id="av">1</span></div><input class="range" id="a" type="range" min="-12" max="12" value="1"></div>
<div class="control"><div class="head"><span>First denominator</span><span class="val" id="bv">2</span></div><input class="range" id="b" type="range" min="1" max="12" value="2"></div>
<div class="control"><div class="head"><span>Second numerator</span><span class="val" id="cv">1</span></div><input class="range" id="c" type="range" min="-12" max="12" value="1"></div>
<div class="control"><div class="head"><span>Second denominator</span><span class="val" id="dv">3</span></div><input class="range" id="d" type="range" min="1" max="12" value="3"></div>
<div class="checks" id="work"></div>
<div class="presets"><button class="preset p" data-a="1" data-b="2" data-c="1" data-d="3" data-o="+">1/2 + 1/3</button><button class="preset p" data-a="3" data-b="4" data-c="1" data-d="2" data-o="-">3/4 − 1/2</button><button class="preset p" data-a="-2" data-b="3" data-c="4" data-d="5" data-o="*">−2/3 × 4/5</button><button class="preset p" data-a="3" data-b="4" data-c="2" data-d="3" data-o="/">3/4 ÷ 2/3</button></div>`;
}
app.innerHTML=`
<section class="card hero"><div class="kicker">${esc(header)} • ${esc(chapterText)}</div><h1>${esc(title)}</h1><p>Concept learning page with a dedicated lesson, an interactive explorer where available, and a concept-specific mastery quiz.</p></section>
<section class="card"><h2>Step 1 • Learn the Concept</h2><div class="lesson">${lessonHtml()}</div></section>
<section class="card"><h2>Step 2 • Concept Explorer</h2>${explorerHtml()}</section>
<section class="card"><h2>Step 3 • Mastery Quiz</h2><div id="quiz"></div></section>`;
function startExplorer(){
 if(norm(concept)!=="operations on rational numbers")return;
 const A=document.getElementById("a"),B=document.getElementById("b"),C=document.getElementById("c"),D=document.getElementById("d"),O=document.getElementById("op");
 const gcd=(x,y)=>{x=Math.abs(x);y=Math.abs(y);while(y){let t=x%y;x=y;y=t}return x||1};
 const simp=(n,d)=>{if(d===0)return null;let g=gcd(n,d);n/=g;d/=g;if(d<0){n=-n;d=-d}return[n,d]};
 function update(){const a=+A.value,b=+B.value,c=+C.value,d=+D.value,o=O.value;let n,den,name;
 if(o==="+"){n=a*d+c*b;den=b*d;name="Addition"}else if(o==="-"){n=a*d-c*b;den=b*d;name="Subtraction"}else if(o==="*"){n=a*c;den=b*d;name="Multiplication"}else{n=a*d;den=b*c;name="Division"}
 const s=simp(n,den);["an","ad","cn","cd"].forEach((id,i)=>document.getElementById(id).textContent=[a,b,c,d][i]);document.getElementById("sign").textContent=o;
 ["av","bv","cv","dv"].forEach((id,i)=>document.getElementById(id).textContent=[a,b,c,d][i]);document.getElementById("left").textContent=a+" / "+b;document.getElementById("right").textContent=c+" / "+d;document.getElementById("operation").textContent=name;document.getElementById("opv").textContent=name;document.getElementById("pill").textContent=name;
 if(!s){document.getElementById("result").textContent="Undefined";document.getElementById("decimal").textContent="—";document.getElementById("pill").className="pill bad";document.getElementById("work").innerHTML="<b>Undefined:</b> division by zero is not allowed.";return}
 const v=s[0]/s[1];document.getElementById("result").textContent=s[0]+" / "+s[1];document.getElementById("decimal").textContent=v.toFixed(3);document.getElementById("pill").className="pill";document.getElementById("work").innerHTML="<b>Result:</b> "+s[0]+" / "+s[1]+"<br><b>Decimal:</b> "+v.toFixed(3)+"<br><b>Method:</b> "+(o==="+"?"Use a common denominator.":o==="-"?"Use a common denominator.":o==="*"?"Multiply numerators and denominators.":"Multiply by the reciprocal.");
 }
 [A,B,C,D,O].forEach(e=>e.addEventListener("input",update));O.addEventListener("change",update);document.querySelectorAll(".p").forEach(x=>x.addEventListener("click",()=>{A.value=x.dataset.a;B.value=x.dataset.b;C.value=x.dataset.c;D.value=x.dataset.d;O.value=x.dataset.o;update()}));update();
}
function startQuiz(){
 const host=document.getElementById("quiz");
 if(!key||!Array.isArray(bank[key])||bank[key].length===0){host.innerHTML='<div class="empty">No dedicated 30-question bank is available for <b>'+esc(title)+'</b> yet. This quiz is intentionally empty — no other concept questions are reused.</div>';return}
 const questions=bank[key].slice(0,30), total=questions.length;let i=0,score=0,answered=false;
 host.innerHTML='<div class="quiz-head"><span class="progress" id="qp">Question 1 of '+total+'</span><span class="progress" id="qs">Score 0</span></div><div class="bar"><div class="fill" id="qf"></div></div><div class="qno" id="qno"></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="explain" id="explain"></div><button class="next" id="next" disabled>Next</button>';
 const qno=document.getElementById("qno"),q=document.getElementById("question"),opts=document.getElementById("options"),fb=document.getElementById("feedback"),ex=document.getElementById("explain"),next=document.getElementById("next");
 function render(){answered=false;next.disabled=true;fb.textContent="";ex.textContent="";ex.style.display="none";const item=questions[i];qno.textContent="MASTERy PRACTICE • "+(i+1);q.innerHTML=item[0];opts.innerHTML=item[1].map((o,j)=>'<button class="opt" data-i="'+j+'">'+esc(o)+'</button>').join("");document.getElementById("qp").textContent="Question "+(i+1)+" of "+total;document.getElementById("qf").style.width=(i/total*100)+"%";document.getElementById("qs").textContent="Score "+score;opts.querySelectorAll(".opt").forEach(btn=>btn.addEventListener("click",()=>answer(+btn.dataset.i)));if(window.MathJax)window.MathJax.typesetPromise([q]).catch(()=>{})}
 function answer(j){if(answered)return;answered=true;const item=questions[i],correct=item[2];opts.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k===correct)b.classList.add("correct");else if(k===j)b.classList.add("wrong")});if(j===correct){score++;fb.textContent="Correct";}else fb.textContent="Review the highlighted answer";ex.textContent=item[3]||"";ex.style.display="block";next.disabled=false;document.getElementById("qs").textContent="Score "+score}
 next.addEventListener("click",()=>{i++;if(i>=total){host.innerHTML='<div class="result"><div class="score">'+score+' / '+total+'</div><p>Mastery quiz complete for <b>'+esc(title)+'</b>.</p><button class="next" id="again">Try Again</button></div>';document.getElementById("again").onclick=()=>startQuiz();return}render()});render();
}
startExplorer();startQuiz();if(window.MathJax)window.MathJax.typesetPromise().catch(()=>{});
})();
</script>
</body>
