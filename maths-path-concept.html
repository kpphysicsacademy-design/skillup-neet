<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="SkillUp Mathematics concept lesson and mastery quiz.">
<title>SkillUp | Mathematics Concept</title>
<script>
window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']]},svg:{fontCache:'global'}};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script src="maths-path-data.js?v=20261006"></script>
<script src="maths-question-bank.js?v=20261006"></script>
<style>
:root{--g:#58cc02;--dark:#17452a;--muted:#66756b;--line:#dce8d8;--bg:#f5faf3;--card:#fff;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#24332a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}.nav{max-width:1050px;height:60px;margin:auto;padding:0 14px;display:flex;align-items:center;gap:10px}
.back{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 11px;text-decoration:none;color:var(--dark);font-weight:900;font-size:13px}.brand{font-weight:950;color:var(--dark);font-size:16px}.brand small{display:block;font-size:8px;letter-spacing:1px;color:#64806b}.badge{margin-left:auto;background:#eaf8e6;color:#318600;border-radius:999px;padding:7px 11px;font-size:10px;font-weight:950}
.wrap{max-width:900px;margin:auto;padding:18px 13px 70px}.hero,.quiz,.result{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 6px 18px rgba(23,69,42,.07)}.hero{padding:24px 22px;margin-bottom:14px}
.kicker{font-size:11px;font-weight:950;letter-spacing:.7px;color:#4b9c20;text-transform:uppercase}h1{margin:6px 0 7px;color:var(--dark);font-size:clamp(30px,6vw,42px);line-height:1.1}.lead{margin:0;color:var(--muted);font-size:15px;line-height:1.6}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.pill{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#f7fbf5;font-size:11px;font-weight:900;color:var(--dark)}
.learn{margin-top:18px;padding:16px;border-radius:15px;background:#f2faef;border-left:5px solid var(--g)}.learn h2{margin:0 0 7px;font-size:18px;color:var(--dark)}.sublist{display:flex;flex-wrap:wrap;gap:6px}.subitem{padding:6px 9px;border:1px solid #d7ead0;border-radius:999px;background:#fff;font-size:11px;font-weight:800;color:#45614c}
.quiz{padding:22px}.quiz-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.quiz-head h2{margin:0;color:var(--dark);font-size:22px}.progress{font-size:11px;font-weight:900;color:var(--muted)}
.question{border:1px solid var(--line);border-radius:17px;padding:18px;background:#fff}.qno{font-size:11px;font-weight:950;color:#4b9c20;margin-bottom:8px}.qtext{font-size:18px;font-weight:800;line-height:1.55;margin-bottom:14px}.options{display:grid;gap:9px}.opt{width:100%;text-align:left;border:2px solid #e3ece0;background:#fbfdfb;border-radius:13px;padding:12px 13px;font-size:15px;font-weight:700;cursor:pointer}.opt:hover{border-color:#9bd889;background:#f2faef}.opt.correct{border-color:#58cc02;background:#eefbe9}.opt.wrong{border-color:#ef4444;background:#fff2f2}.feedback{min-height:24px;margin-top:12px;font-weight:800;font-size:13px}.explanation{display:none;margin-top:10px;padding:12px 14px;border-radius:12px;background:#f2f8ff;border-left:4px solid #2563eb;color:#334155;font-size:13px;line-height:1.55}.explanation.show{display:block}.next,.restart{margin-top:10px;border:0;border-radius:13px;background:var(--g);color:#fff;padding:12px 18px;font-weight:950;cursor:pointer;box-shadow:0 3px 0 #46a302}.next:disabled{opacity:.45;cursor:not-allowed}.result{display:none;text-align:center;padding:28px;margin-top:14px}.score{font-size:42px;font-weight:950;color:var(--dark)}.result p{color:var(--muted)}.error{padding:18px;border:2px solid #fecaca;background:#fff7f7;border-radius:16px;color:#991b1b;font-weight:700}
@media(max-width:650px){.wrap{padding:12px 9px 60px}.hero{padding:20px 16px}.qtext{font-size:16px}.opt{font-size:14px}.quiz{padding:16px}.brand small{display:none}}
</style>
</head>
<body>
<header class="top"><div class="nav"><a class="back" href="maths-home.html?v=20261006">← Maths Path</a><div class="brand">SkillUp<small>MATHEMATICS • CONCEPT PRACTICE</small></div><div class="badge" id="badge">MATHS</div></div></header>
<main class="wrap">
<section class="hero"><div class="kicker" id="level">Mathematics</div><h1 id="title">Loading…</h1><p class="lead">Learn the concept structure, then practise with 30 mastery questions.</p><div class="meta"><span class="pill">📚 Learn</span><span class="pill">🧠 Practice</span><span class="pill">🎯 30 MCQs</span><span class="pill">∑ MathJax</span></div><div class="learn"><h2>Concept map</h2><div id="sublist" class="sublist"></div></div></section>
<section class="quiz" id="quiz"><div class="quiz-head"><h2>🧠 Mastery Quiz</h2><div class="progress" id="progress"></div></div><div class="question"><div class="qno" id="qno"></div><div class="qtext" id="qtext"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="explanation" id="explanation"></div><button class="next" id="next" disabled>Next Question →</button></div></section>
<section class="result" id="result"><div class="score" id="score"></div><h2>Quiz complete 🎉</h2><p id="message"></p><button class="restart" id="restart">Try Again</button></section>
<div id="error" class="error" hidden></div>
</main>
<script>
(()=>{'use strict';
const params=new URLSearchParams(location.search), requested=(params.get('concept')||'').trim();
const norm=s=>String(s).toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,' ').trim();
const path=window.SKILLUP_MATH_PATH||[];
const bank=window.SKILLUP_MATHS_QUIZ_BANK||{};
const all=path.flatMap(([level,obj])=>Object.entries(obj).map(([concept,subs])=>({level,concept,subs})));
const item=all.find(x=>norm(x.concept)===norm(requested))||all[0];
const title=document.getElementById('title'),level=document.getElementById('level'),sublist=document.getElementById('sublist'),badge=document.getElementById('badge');
title.textContent=item.concept;level.textContent=item.level;badge.textContent='MATHS • 30 MCQs';
item.subs.forEach(s=>{const el=document.createElement('span');el.className='subitem';el.textContent=s;sublist.appendChild(el);});
function collectQuestions(){
 const out=[],seen=new Set();
 const add=(arr,key)=>{if(!Array.isArray(arr))return;arr.forEach(q=>{if(!Array.isArray(q)||q.length<4||!Array.isArray(q[1])||q[1].length<2)return;const sig=String(q[0])+'|'+JSON.stringify(q[1]);if(!seen.has(sig)){seen.add(sig);out.push(q.map((v,i)=>i===1?[...v]:v));}});};
 const direct=Object.keys(bank).find(k=>norm(k)===norm(item.concept)); add(direct?bank[direct]:null,direct);
 item.subs.forEach(s=>{const k=Object.keys(bank).find(k=>norm(k)===norm(s));add(k?bank[k]:null,k);});
 if(out.length<30){
   const words=norm(item.concept).split(' ').filter(w=>w.length>3);
   Object.entries(bank).forEach(([k,v])=>{const nk=norm(k);if(words.some(w=>nk.includes(w)))add(v,k);});
 }
 return out.slice(0,30);
}
let qs=collectQuestions(),i=0,score=0,answered=false;
const qtext=document.getElementById('qtext'),options=document.getElementById('options'),feedback=document.getElementById('feedback'),explanation=document.getElementById('explanation'),next=document.getElementById('next');
function showError(msg){document.getElementById('quiz').hidden=true;document.getElementById('error').hidden=false;document.getElementById('error').textContent=msg;}
if(qs.length<30){showError(item.concept+' currently has only '+qs.length+' validated questions from its mapped bank. Add '+(30-qs.length)+' questions before publishing this quiz.');}
function render(){if(!qs.length)return;answered=false;document.getElementById('qno').textContent='QUESTION '+(i+1);document.getElementById('progress').textContent='Question '+(i+1)+' of '+qs.length;qtext.innerHTML=qs[i][0];options.innerHTML='';feedback.textContent='';explanation.textContent='';explanation.classList.remove('show');next.disabled=true;next.textContent=i===qs.length-1?'Finish Quiz →':'Next Question →';qs[i][1].forEach((o,n)=>{const b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+String.fromCharCode(65+n)+'.</b> '+o;b.onclick=()=>answer(n);options.appendChild(b)});if(window.MathJax)MathJax.typesetPromise([qtext,options]);}
function answer(n){if(answered)return;answered=true;const q=qs[i],btns=[...options.children],correct=Number(q[2]);btns.forEach(b=>b.disabled=true);if(btns[correct])btns[correct].classList.add('correct');if(n===correct){score++;feedback.textContent='✅ Correct!'}else{if(btns[n])btns[n].classList.add('wrong');feedback.textContent='❌ Not quite.'}explanation.innerHTML='<b>💡 Explanation:</b> '+q[3];explanation.classList.add('show');if(window.MathJax)MathJax.typesetPromise([explanation]);next.disabled=false;}
next.onclick=()=>{if(i<qs.length-1){i++;render();window.scrollTo({top:document.querySelector('.quiz').offsetTop-70,behavior:'smooth'})}else{document.querySelector('.quiz').style.display='none';document.getElementById('result').style.display='block';document.getElementById('score').textContent=score+' / '+qs.length;document.getElementById('message').textContent=score>=26?'Excellent mastery!':score>=20?'Strong foundation. Review the missed questions.':'Keep practising — mastery comes with repetition.'}};
restart.onclick=()=>{i=0;score=0;document.getElementById('result').style.display='none';document.querySelector('.quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});};
render();
})();
</script>
</body></html>
