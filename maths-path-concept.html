<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Mathematics Concept</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
:root{--green:#58cc02;--green2:#46a302;--navy:#183b63;--ink:#243447;--muted:#718096;--line:#e5edf3;--bg:#f7fafc;--gold:#ffc800;--red:#ff4b4b;--blue:#1cb0f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.nav{max-width:760px;margin:auto;height:64px;padding:0 16px;display:flex;align-items:center;gap:14px}
.back{color:var(--navy);text-decoration:none;font-weight:900}.brand{font-weight:950;color:var(--navy);flex:1}
.stats{display:flex;gap:10px;font-weight:900;font-size:13px}.stat{padding:7px 9px;border-radius:12px;background:#f4f7fa}
.wrap{max-width:760px;margin:auto;padding:18px 14px 70px}
.hero{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 4px 14px #183b6310;margin-bottom:14px}
.eyebrow{font-size:11px;font-weight:950;letter-spacing:.9px;color:var(--muted)}
h1{font-size:clamp(30px,7vw,46px);margin:6px 0 12px;color:var(--navy);line-height:1.05}
.pathmeta{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 10px;border-radius:999px;background:#eef8e9;color:#338700;font-size:10px;font-weight:950}
.progress{height:12px;background:#e9eff4;border-radius:99px;overflow:hidden;margin-top:16px}.bar{height:100%;width:0;background:var(--green);border-radius:99px;transition:.3s}
.lesson,.quiz,.result{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 4px 14px #183b6310;margin-bottom:14px}
.lesson{padding:22px}.lesson h2{margin:0 0 12px}.learn{line-height:1.7}.formula{background:#f8fbfd;border:1px solid var(--line);padding:16px;border-radius:16px;margin-top:14px;text-align:center;font-size:20px}
.quiz{padding:22px}.quizhead{display:flex;align-items:center;justify-content:space-between;gap:12px}.level{font-size:11px;font-weight:950;color:var(--muted);letter-spacing:.8px}.qnum{font-size:13px;font-weight:900;color:var(--navy)}
.qtext{font-size:21px;font-weight:900;line-height:1.45;margin:20px 0 14px}
.answers{display:grid;gap:10px}.ans{width:100%;min-height:52px;border:2px solid var(--line);background:#fff;border-radius:15px;padding:13px 15px;text-align:left;font-size:15px;font-weight:800;cursor:pointer;transition:.12s}
.ans:hover{border-color:#b8cee0;transform:translateY(-1px)}.ans:disabled{cursor:default;transform:none}
.ans.correct{border-color:var(--green);background:#f0fbe9}.ans.wrong{border-color:var(--red);background:#fff0f0}
.feedback{margin-top:14px;padding:12px 14px;border-radius:14px;background:#f7fafc;min-height:24px;font-weight:800;line-height:1.45}
.actions{display:flex;justify-content:flex-end}.continue{display:none;margin-top:14px;border:0;border-radius:14px;background:var(--green);box-shadow:0 3px 0 var(--green2);color:#fff;padding:13px 20px;font-weight:950;cursor:pointer}
.result{padding:30px;text-align:center}.result h2{font-size:28px;color:var(--navy)}.score{font-size:20px;font-weight:900}.next{display:inline-block;margin-top:12px;background:var(--navy);color:#fff;text-decoration:none;padding:13px 20px;border-radius:14px;font-weight:900}
@media(max-width:560px){.stats{gap:4px}.stat{padding:6px;font-size:11px}.wrap{padding-top:12px}.hero,.lesson,.quiz{border-radius:20px}.qtext{font-size:19px}}
</style>
</head>
<body>
<header class="top"><nav class="nav"><a class="back" href="maths-home.html">← Maths</a><span class="brand">SkillUp · Mathematics</span><div class="stats"><span class="stat">🔥 0</span><span class="stat">⚡ 10 XP</span></div></nav></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">MATHEMATICS · PROGRESSIVE PATH</div><h1 id="title">Loading…</h1><div class="pathmeta"><span class="pill">🌱 FOUNDATION</span><span class="pill">📘 LEARN</span><span class="pill">🎯 PRACTICE</span></div><div class="progress"><div class="bar" id="bar"></div></div></section>
<section class="lesson"><h2>📘 Learn</h2><div id="learn" class="learn"></div></section>
<section class="quiz" id="quiz"><div class="quizhead"><div class="level">🎯 PRACTICE</div><div class="qnum" id="qnum">1 / 10</div></div><div id="question" class="qtext"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="actions"><button id="continue" class="continue">Continue →</button></div></section>
<section class="result" id="result"><div style="font-size:46px">🏆</div><h2>Concept complete!</h2><p id="score" class="score"></p><a id="next" class="next" href="maths-path-concept.html?concept=Integers">Continue to Integers →</a></section>
</main>
<script src="maths-question-bank.js"></script>
<script>
const qs=new URLSearchParams(location.search),concept=qs.get('concept')||'Natural numbers';
const bank={
'Natural numbers':{
learn:'Natural numbers are the counting numbers used to describe quantity. In this path we use <b>1, 2, 3, 4, …</b>. The successor of a natural number <i>n</i> is <i>n+1</i>, while its predecessor is <i>n−1</i> for n>1. Natural numbers are closed under addition and multiplication.',
formula:'$$\mathbb{N}=\{1,2,3,4,\ldots\}$$',
next:'Integers',
questions:[
['Which set represents the natural numbers?',['{1, 2, 3, 4, …}','{0, 1, 2, 3, …}','{…, −2, −1, 0, 1, …}','{1/2, 1, 2, 3, …}'],0,'Using the convention in this course, natural numbers begin with 1.'],
['What is the successor of 8?',['7','8','9','10'],2,'The successor is the next number: 8+1=9.'],
['What is the predecessor of 10?',['8','9','10','11'],1,'The predecessor is the number immediately before 10: 10−1=9.'],
['Which operation keeps natural numbers closed?',['Subtraction','Division','Addition','Square root','Addition'],2,'Adding two natural numbers always gives another natural number.'],
['4+7=7+4 illustrates which property?',['Associative','Commutative','Distributive','Closure'],1,'Changing the order does not change the sum, so addition is commutative.'],
['Which number is the additive identity?',['0','1','−1','10'],0,'For addition, 0 is the identity because n+0=n.'],
['Which is an even natural number?',['11','13','14','17'],2,'14 is divisible by 2, so it is even.'],
['24+16 equals:',['30','36','40','42'],2,'24+16=40.'],
['Are natural numbers closed under multiplication?',['Yes','No','Only for even numbers','Only for prime numbers'],0,'The product of two natural numbers is another natural number.'],
['3×(4+5)=3×4+3×5 illustrates:',['Commutative law','Associative law','Distributive law','Identity law'],2,'Multiplication distributes over addition: a(b+c)=ab+ac.']
]},
'Integers':{learn:'Integers include positive whole numbers, zero, and their negative counterparts.',formula:'$$\mathbb{Z}=\{\ldots,-3,-2,-1,0,1,2,3,\ldots\}$$',next:'Rational numbers',questions:[
['Which is an integer?',['2.5','−7','1/3','√2'],1,'Negative whole numbers are integers.'],
['The additive inverse of 6 is:',['6','0','−6','1/6'],2,'6+(−6)=0.']
]}
};
const fallback={learn:'This concept is part of the SkillUp Mathematics progressive path. Study the definition, key properties, worked examples, then practise before moving to the next concept.',formula:'',next:'Integers',questions:[['Is this concept available for practice?',['Yes','No','Only later','Not sure'],0,'This concept is connected to the progressive practice flow.']]};
const data=bank[concept]||fallback;document.getElementById('title').textContent=concept;document.getElementById('learn').innerHTML=data.learn+(data.formula?'<div class="formula">'+data.formula+'</div>':'');
if(window.MathJax)MathJax.typesetPromise();
const questions=(window.SKILLUP_MATHS_QUIZ_BANK&&window.SKILLUP_MATHS_QUIZ_BANK[concept])||data.questions;let i=0,score=0,answered=false;
const qEl=document.getElementById('question'),aEl=document.getElementById('answers'),fb=document.getElementById('feedback'),cont=document.getElementById('continue'),bar=document.getElementById('bar');
function render(){answered=false;cont.style.display='none';fb.textContent='';document.getElementById('qnum').textContent=(i+1)+' / '+questions.length;bar.style.width=(i/questions.length*100)+'%';const q=questions[i];qEl.innerHTML=q[0];aEl.innerHTML='';q[1].forEach((x,n)=>{const b=document.createElement('button');b.className='ans';b.textContent=x;b.onclick=()=>answer(n,b);aEl.appendChild(b)});if(window.MathJax)MathJax.typesetPromise()}
function answer(n,button){if(answered)return;answered=true;const q=questions[i];[...aEl.children].forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct')});if(n===q[2]){score++;fb.textContent='✅ Correct — '+q[3]}else{button.classList.add('wrong');fb.textContent='❌ Not quite — '+q[3]}cont.style.display='inline-block'}
cont.onclick=()=>{i++;if(i<questions.length)render();else finish()};
function finish(){bar.style.width='100%';document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';document.getElementById('score').textContent='⭐ '+score+' / '+questions.length+' correct · '+(score>=8?'Excellent mastery!':'Review and try again for mastery.');document.getElementById('next').href='maths-path-concept.html?concept='+encodeURIComponent(data.next||'Integers')}
render();
</script>
</body></html>
