<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7fbf5">
<meta name="description" content="SkillUp Mathematics concept practice">
<title>SkillUp Mathematics • Concept Practice</title>

window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]]},svg:{fontCache:"global"}};

<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
:root{--green:#58cc02;--deep:#173f27;--text:#263238;--muted:#66736b;--line:#d9e8d4;--bg:#f7fbf5;--card:#fff;--dark:#12151b;--blue:#3b82f6;--red:#dc5b55}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.nav{max-width:760px;height:58px;margin:auto;padding:0 10px;display:flex;align-items:center;gap:8px}
.back{color:var(--deep);font-size:11px;font-weight:900;text-decoration:none;white-space:nowrap}
.brand{flex:1;text-align:center;color:var(--deep);font-size:16px;font-weight:950}
.brand small{display:block;color:#64806b;font-size:7px;letter-spacing:1px}
.badge{padding:6px 9px;border-radius:999px;background:#eaf8e6;color:#318600;font-size:8px;font-weight:950;white-space:nowrap}
.wrap{width:100%;max-width:760px;margin:auto;padding:10px 10px 65px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:10px;box-shadow:0 4px 14px rgba(23,69,42,.04)}
.hero{padding:20px 18px}
.kicker{font-size:8px;letter-spacing:1px;color:#64806b;font-weight:950}
.hero h1{margin:5px 0;color:var(--deep);font-size:27px;line-height:1.15}
.hero p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
h2{margin:0 0 11px;color:var(--deep);font-size:18px}
.lesson{background:#f8fcf6;border:1px solid var(--line);border-radius:15px;padding:14px}
.lesson strong{font-size:16px}
.lesson p{font-size:12px;line-height:1.6}
.formula{margin:11px 0;padding:13px;text-align:center;background:#fff;border-radius:12px;font-size:18px;overflow-x:auto}
.visual{overflow:hidden}
.visual-banner{display:flex;align-items:center;justify-content:center;gap:14px;background:var(--dark);color:#f3f4f6;border:1px solid #282c35;border-radius:13px;padding:16px;margin:8px 0 10px}
.frac{display:inline-flex;flex-direction:column;align-items:center;font-size:25px;font-weight:900;line-height:1.05;min-width:45px}
.frac .n{border-bottom:2px solid currentColor;padding:0 8px 3px}
.eq{font-size:21px;color:#9ca3af}
.value-box{text-align:center;min-width:95px}
.value-box small{display:block;color:#9ca3af;font-size:9px;font-weight:800}
.value-box strong{display:block;color:#60a5fa;font-size:16px;margin-top:2px}
.pill{display:inline-block;margin-top:6px;padding:5px 9px;border-radius:999px;background:#153d25;color:#7ee35a;font-size:9px;font-weight:900}
.pill.negative{background:#4a2630;color:#fca5a5}
.pill.undefined{background:#4a1f1f;color:#fca5a5}
.canvas-wrap{background:var(--dark);border:1px solid #282c35;border-radius:13px;padding:8px}
canvas{width:100%;height:105px;display:block}
.props{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.prop{background:#f8fcf6;border:1px solid var(--line);border-radius:11px;padding:10px}
.prop span{display:block;color:#718078;font-size:9px;font-weight:800}
.prop strong{display:block;margin-top:3px;color:var(--deep);font-size:12px;overflow-wrap:anywhere}
.control{margin-top:12px}
.control-head{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:900}
.control-value{color:#46a302}
.range{width:100%;margin:7px 0 0;accent-color:var(--green)}
.checks{margin-top:10px;background:#f8fcf6;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:11px;line-height:1.7}
.presets{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.preset{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-weight:800;font-size:10px;cursor:pointer}
.preset:active{transform:scale(.98)}
.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.progress{font-size:9px;font-weight:900;color:#64806b;white-space:nowrap}
.bar{height:6px;background:#e8efe5;border-radius:99px;overflow:hidden;margin:0 0 13px}
.fill{height:100%;width:0;background:var(--green);transition:width .25s}
.qno{font-size:9px;color:#64806b;font-weight:950;letter-spacing:.7px}
.question{font-size:15px;font-weight:850;line-height:1.5;margin-top:4px}
.options{display:grid;gap:7px;margin-top:12px}
.opt{width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px;color:var(--text);font-size:12px;cursor:pointer}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--green);background:#eefbe9}
.opt.wrong{border-color:#ef9b94;background:#fff3f2}
.feedback{margin-top:10px;font-weight:950;font-size:12px}
.explain{margin-top:7px;padding:10px;background:#f8fcf6;border-radius:11px;color:#52625a;font-size:11px;line-height:1.55;display:none}
.next{margin-top:11px;border:0;border-radius:12px;padding:11px 15px;background:var(--green);color:#fff;font-weight:950;cursor:pointer}
.next:disabled{opacity:.45;cursor:default}
.empty{padding:13px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;color:#9a3412;font-size:12px;line-height:1.5}
.result{text-align:center}
.result[hidden]{display:none}
.score{font-size:40px;font-weight:950;color:var(--deep)}
.status{margin-top:8px;font-size:10px;color:#64806b;text-align:center;min-height:15px}
@media(max-width:520px){
 .nav{padding:0 8px;gap:5px}.back{font-size:10px}.brand{font-size:14px}.badge{font-size:7px}
 .hero{padding:18px 14px}.hero h1{font-size:23px}.question{font-size:14px}.visual-banner{gap:9px;padding:13px}
}
</style>
</head>
<body>
<header class="top">
 <div class="nav">
  <a class="back" href="maths-home.html?v=20261006-1006">← Maths Path</a>
  <div class="brand">SkillUp<small>MATHEMATICS • CONCEPT PRACTICE</small></div>
  <span class="badge">30 • MASTERY</span>
 </div>
</header>

<main class="wrap">
<section class="card hero">
 <div class="kicker" id="routeLabel">MATHEMATICS</div>
 <h1 id="conceptTitle">Concept</h1>
 <p id="heroText">Learn the concept first, explore it interactively, then practise.</p>
</section>

<section class="card" id="lessonCard"></section>
<section class="card visual" id="visualCard"></section>

<section class="card quiz" id="quizCard">
 <div class="quiz-head"><h2>Step 3 • Mastery Quiz</h2><span class="progress" id="progress">30 Questions</span></div>
 <div class="bar"><div class="fill" id="fill"></div></div>
 <div class="qno" id="qno"></div>
 <div class="question" id="question"></div>
 <div class="options" id="options"></div>
 <div class="feedback" id="feedback"></div>
 <div class="explain" id="explain"></div>
 <button class="next" id="next" disabled>Next Question →</button>
 <div class="status" id="quizStatus"></div>
</section>

<section class="card result" id="result" hidden>
 <div class="score" id="score"></div>
 <h2>Quiz complete 🎉</h2>
 <p id="message"></p>
 <button class="next" id="restart">Try Again</button>
</section>
</main>

<script src="maths-quiz-bank.js?v=20261006-1006"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const requested=(params.get("concept")||"").trim();
const level=(params.get("level")||"").trim();
const chapter=(params.get("chapter")||"").trim();
const bank=window.SKILLUP_MATHS_QUIZ_BANK||{};
const key=Object.keys(bank).find(k=>requested&&k.trim().toLowerCase()===requested.toLowerCase())||requested;
const qs=requested&&Array.isArray(bank[key])?bank[key]:[];
const slug=key.toLowerCase();

$("conceptTitle").textContent=key||"Concept";
$("routeLabel").textContent=level+(chapter?" • "+chapter:"");
document.title="SkillUp • "+(key||"Concept")+" • Concept Practice";

if(!requested){
 $("routeLabel").textContent="INVALID CONCEPT ROUTE";
 $("heroText").textContent="Open this page from the Mathematics Learning Path.";
 $("lessonCard").innerHTML='<h2>Concept route required</h2><div class="empty">No concept was supplied in the URL.</div>';
 $("visualCard").hidden=true;
 $("quizCard").innerHTML='<h2>Quiz unavailable</h2><div class="empty">Return to the Mathematics Learning Path and select a concept.</div>';
 return;
}

function rationalLesson(){
 $("lessonCard").innerHTML=
 '<h2>Step 1 • Learn the Concept</h2>'+
 '<div class="lesson">'+
 '<strong>Rational numbers are numbers that can be written as p/q.</strong>'+
 '<p>A rational number has an integer numerator and an integer denominator, with the denominator never equal to zero. Integers, fractions, terminating decimals, and repeating decimals can all be rational.</p>'+
 '<div class="formula">\\(\\frac{p}{q},\\quad p,q\\in\\mathbb{Z},\\quad q\\ne0\\)</div>'+
 '<p style="margin:0;color:#66736b"><b>Examples:</b> \\(\\frac{3}{4}\\), \\(-\\frac{5}{2}\\), 7, 0.25, and 0.333…</p>'+
 '</div>';
}

function rationalVisualizer(){
 $("visualCard").innerHTML=
 '<h2>Step 2 • Rational Number Visualizer</h2>'+
 '<div class="visual-banner">'+
 '<div class="frac"><span class="n" id="rn">3</span><span id="rd">4</span></div>'+
 '<div class="eq">=</div>'+
 '<div class="value-box"><small>DECIMAL VALUE</small><strong id="rv">0.750</strong><span class="pill" id="rs">Positive</span></div>'+
 '</div>'+
 '<div class="canvas-wrap"><canvas id="rc" width="600" height="110"></canvas></div>'+
 '<div class="props">'+
 '<div class="prop"><span>Numerator</span><strong id="rnp">3</strong></div>'+
 '<div class="prop"><span>Denominator</span><strong id="rdp">4</strong></div>'+
 '<div class="prop"><span>Sign</span><strong id="rsp">Positive</strong></div>'+
 '<div class="prop"><span>Simplest form</span><strong id="rmp">3 / 4</strong></div>'+
 '</div>'+
 '<div class="control"><div class="control-head"><span>Numerator</span><span class="control-value" id="rnv">3</span></div><input id="rns" class="range" type="range" min="-12" max="12" value="3" step="1"></div>'+
 '<div class="control"><div class="control-head"><span>Denominator</span><span class="control-value" id="rdv">4</span></div><input id="rds" class="range" type="range" min="-12" max="12" value="4" step="1"></div>'+
 '<div class="checks" id="rcheck"></div>'+
 '<div class="presets"><button class="preset rp" data-n="-3" data-d="4">−3/4</button><button class="preset rp" data-n="1" data-d="2">1/2</button><button class="preset rp" data-n="5" data-d="4">5/4</button><button class="preset rp" data-n="0" data-d="7">0/7</button></div>';

 const ns=$("rns"),ds=$("rds"),cv=$("rc"),ctx=cv.getContext("2d");
 function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a}
 function draw(value){
  const w=cv.width,left=35,right=w-35,y=47;
  ctx.clearRect(0,0,w,cv.height);
  ctx.strokeStyle="#474e61";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();
  for(let i=-2;i<=2;i++){
   const x=left+(i+2)*(right-left)/4;
   ctx.beginPath();ctx.moveTo(x,y-8);ctx.lineTo(x,y+8);ctx.stroke();
   ctx.fillStyle="#9ca3af";ctx.font="10px sans-serif";ctx.textAlign="center";ctx.fillText(String(i),x,y+25);
  }
  if(!Number.isFinite(value))return;
  const v=Math.max(-2,Math.min(2,value)),x=left+(v+2)*(right-left)/4;
  ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fillStyle="#3b82f6";ctx.fill();
  ctx.strokeStyle="#fff";ctx.stroke();
  ctx.fillStyle="#10b981";ctx.font="bold 11px sans-serif";ctx.fillText(value.toFixed(3),x,y-15);
 }
 function update(){
  const n=Number(ns.value),d=Number(ds.value);
  $("rnv").textContent=n;$("rdv").textContent=d;
  $("rnp").textContent=n;$("rdp").textContent=d;
  if(d===0){
   $("rn").textContent=n;$("rd").textContent="0";$("rv").textContent="—";
   $("rs").textContent="Undefined";$("rs").className="pill undefined";
   $("rsp").textContent="Undefined";$("rmp").textContent="—";
   $("rcheck").innerHTML="<b>Undefined:</b> the denominator of a rational number cannot be zero.";
   draw(NaN);return;
  }
  const value=n/d,g=gcd(n,d)||1;
  let sn=n/g,sd=d/g;if(sd<0){sn=-sn;sd=-sd}
  const sign=value>0?"Positive":value<0?"Negative":"Zero";
  $("rn").textContent=n;$("rd").textContent=d;$("rv").textContent=value.toFixed(3);
  $("rs").textContent=sign;$("rs").className="pill"+(sign==="Negative"?" negative":"");
  $("rsp").textContent=sign;$("rmp").textContent=sn+" / "+sd;
  $("rcheck").innerHTML="<b>Value:</b> "+n+" ÷ "+d+" = <b>"+value.toFixed(3)+"</b><br><b>Number line:</b> "+(value<0?"left of 0":value>0?"right of 0":"at 0")+"<br><b>Simplest form:</b> "+sn+" / "+sd;
  draw(value);
 }
 ns.addEventListener("input",update);ds.addEventListener("input",update);
 document.querySelectorAll(".rp").forEach(b=>b.addEventListener("click",()=>{ns.value=b.dataset.n;ds.value=b.dataset.d;update()}));
 update();
}

function genericLesson(){
 $("lessonCard").innerHTML='<h2>Step 1 • Learn the Concept</h2><div class="lesson"><strong>'+escapeHtml(key)+'</strong><p>This page is routed specifically to this concept under '+escapeHtml(chapter||"Mathematics")+'. No other concept lesson is reused.</p><div class="formula">Concept focus: '+escapeHtml(key)+'</div><p style="margin:0;color:#66736b">The dedicated lesson will be expanded with definitions, examples, and worked practice.</p></div>';
 $("visualCard").innerHTML='<h2>Step 2 • Concept Explorer</h2><div class="empty">The concept-specific interactive visualizer is being built. No unrelated visualizer is shown here.</div>';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

if(slug==="rational numbers"){
 rationalLesson();rationalVisualizer();
 $("heroText").textContent="Learn the definition, explore rational numbers on a number line, then complete the dedicated 30-question mastery quiz.";
}else if(slug==="equivalent rational numbers"){
 genericLesson();
}else{
 genericLesson();
 $("heroText").textContent=qs.length?"Learn this concept, then complete its dedicated mastery quiz.":"This concept is mapped in the learning path. Its dedicated 30-question quiz remains empty until it is created.";
}

if(!qs.length){
 $("quizCard").innerHTML='<h2>Step 3 • Mastery Quiz</h2><div class="empty">No dedicated question bank is available for this concept yet. This quiz is intentionally kept empty — no other concept\'s questions are reused.</div>';
 if(window.MathJax&&window.MathJax.typesetPromise)window.MathJax.typesetPromise().catch(()=>{});
 return;
}

let index=0,score=0,answered=false;
const question=$("question"),options=$("options"),feedback=$("feedback"),explain=$("explain"),next=$("next");
function render(){
 const q=qs[index];answered=false;
 $("qno").textContent="QUESTION "+(index+1);
 $("progress").textContent="Question "+(index+1)+" of "+qs.length;
 $("fill").style.width=(index/qs.length*100)+"%";
 question.textContent=q[0];options.innerHTML="";feedback.textContent="";explain.style.display="none";
 next.disabled=true;next.textContent=index===qs.length-1?"Finish Quiz →":"Next Question →";
 q[1].forEach((text,n)=>{
  const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+". "+text;
  b.addEventListener("click",()=>answer(n,b));options.appendChild(b);
 });
 if(window.MathJax&&window.MathJax.typesetPromise)window.MathJax.typesetPromise([question,options]).catch(()=>{});
}
function answer(choice,clicked){
 if(answered)return;answered=true;const q=qs[index];
 Array.from(options.children).forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add("correct")});
 if(choice===q[2]){score++;feedback.textContent="Correct! 🎯"}else{clicked.classList.add("wrong");feedback.textContent="Not quite — review the explanation."}
 explain.innerHTML="<strong>Explanation:</strong> "+q[3];explain.style.display="block";next.disabled=false;
 $("quizStatus").textContent="Answer recorded • Score "+score;
}
next.addEventListener("click",()=>{
 if(!answered)return;
 if(index<qs.length-1){index++;render();window.scrollTo({top:$("quizCard").offsetTop-65,behavior:"smooth"})}
 else{$("quizCard").hidden=true;$("result").hidden=false;$("score").textContent=score+" / "+qs.length;$("message").textContent=score>=26?"Excellent mastery!":score>=20?"Strong foundation. Review the missed questions.":"Keep practising and retry for mastery.";window.scrollTo({top:$("result").offsetTop-65,behavior:"smooth"})}
});
$("restart").addEventListener("click",()=>{index=0;score=0;$("result").hidden=true;$("quizCard").hidden=false;render();window.scrollTo({top:$("quizCard").offsetTop-65,behavior:"smooth"})});
render();
if(window.MathJax&&window.MathJax.typesetPromise)window.MathJax.typesetPromise().catch(()=>{});
})();
</script>
</body>
</html>
