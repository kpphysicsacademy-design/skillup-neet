function mathifyText(s){
 let t=String(s);
 if(t.includes("\\(")||t.includes("\\["))return t;
 t=t.replace(/([A-Za-z0-9]+)²/g,"$1^2").replace(/([A-Za-z0-9]+)³/g,"$1^3");
 t=t.replace(/([A-Za-z0-9]+)\^(\d+)/g,"$1^{$2}");
 if(/^\([^()]+\)\^\d+$/.test(t.trim()))return "\\("+t+"\\)";
 t=t.replace(/√\s*([−-]?\d+(?:\.\d+)?)/g,"\\sqrt{$1}");
 t=t.replace(/∛\s*([−-]?\d+(?:\.\d+)?)/g,"\\sqrt[3]{$1}");
 t=t.replace(/([−-]?\d+)\s*\/\s*([−-]?\d+)/g,"\\frac{$1}{$2}");
 const term="(?:\\([^()]+\\)(?:\^\\{?\\d+\\}?)?|[−-]?\\d*[A-Za-z](?:\^\\{?\\d+\\}?)?|[−-]?\\d+(?:\\.\\d+)?(?:\^\\{?\\d+\\}?)?)";
 const expr=new RegExp("(?<![A-Za-z0-9])("+term+"(?:\\s*[+−\\-×÷=<>]\\s*"+term+")+)(?![A-Za-z0-9])","g");
 t=t.replace(expr,"\\($1\\)");
 if(!t.includes("\\(")){
  t=t.replace(/(?<![A-Za-z0-9\\^])([A-Za-z0-9]+)\^\{(\d+)\}/g,"\\($1^{$2}\\)");
 }
 if((t.includes("\\sqrt")||t.includes("\\frac"))&&!t.includes("\\("))t="\\("+t+"\\)";
 return t;
}
function mathifyOption(s){
 let t=String(s);
 if(t.includes("\\(")||t.includes("\\["))return t;
 if(/[²³^√∛]/.test(t) || (/[+−×÷=]/.test(t) && /[A-Za-z0-9]/.test(t)) || /^\s*[−-]?\d+\s*\/\s*[−-]?\d+\s*$/.test(t)){
  t=t.replace(/([A-Za-z0-9]+)²/g,"$1^2").replace(/([A-Za-z0-9]+)³/g,"$1^3");
  t=t.replace(/√\s*([−-]?\d+(?:\.\d+)?)/g,"\\sqrt{$1}");
  t=t.replace(/∛\s*([−-]?\d+(?:\.\d+)?)/g,"\\sqrt[3]{$1}");
  return "\\("+t+"\\)";
 }
 return mathifyText(t);
}
function mathifyDom(root){
 const walker=document.createTreeWalker(root,4);
 const nodes=[];
 let node;
 while(node=walker.nextNode())nodes.push(node);
 nodes.forEach(function(n){
  if(!n.nodeValue||n.nodeValue.includes("\\(")||n.nodeValue.includes("\\["))return;
  const p=n.parentElement;
  if(!p||p.closest("script,style,textarea,mjx-container"))return;
  const out=mathifyText(n.nodeValue);
  if(out!==n.nodeValue)n.nodeValue=out;
 });
}

<p><b>Diagonals:</b> a diagonal joins two non-adjacent vertices. The number of diagonals is:</p>

<div class="visual-banner"><div class="value-box"><small id="polyLessonName">HEXAGON</small><strong id="polyLessonN" style="color:#60a5fa">\\(n=6\\)</strong><span class="pill" id="polyLessonSides">6 sides</span></div><div class="eq">→</div><div class="value-box"><small>ANGLE SUM</small><strong id="polyLessonSum" style="color:#fbbf24">\\(720^\\circ\\)</strong><span class="pill" id="polyLessonFormula">\\((6-2)\\times180^\\circ\\)</span></div><div class="eq">→</div><div class="value-box"><small>DIAGONALS</small><strong id="polyLessonDiag" style="color:#34d399">9</strong><span class="pill" id="polyLessonDiagFormula">\\(6(6-3)/2\\)</span></div></div>
<p style="margin-bottom:0;color:#66736b"><b>Remember:</b> identify \\(n\\) first, then choose the correct polygon formula.</p>`;
if(norm(concept)==="factorisation basics") return `
<strong>Factorisation means writing an algebraic expression as a product of simpler factors.</strong>
<div class="formula">\\(6x+12=6(x+2)\\)</div>
<p><b>Common factor:</b> find the greatest common factor of all terms, then take it outside the brackets.</p>
<div class="formula">\\(8a^2+12a=4a(2a+3)\\)</div>
<p><b>Grouping:</b> group terms that share a common factor and then factor the common expression.</p>
<div class="formula">\\(x^2+5x=x(x+5)\\)</div>
<p><b>Check:</b> expand the factors again. If you get the original expression, the factorisation is correct.</p>
<div class="visual-banner"><div class="value-box"><small>EXPRESSION</small><strong style="color:#60a5fa">\\(6x+12\\)</strong><span class="pill">factorise</span></div><div class="eq">=</div><div class="value-box"><small>FACTORS</small><strong style="color:#fbbf24">\\(6(x+2)\\)</strong><span class="pill">product form</span></div></div>
<p style="margin-bottom:0;color:#66736b"><b>Remember:</b> factorisation is the reverse process of expansion.</p>`;

if(norm(concept)==="algebraic identities") return `
<strong>Algebraic identities are formulas that remain true for all allowed values of the variables.</strong>
<div class="formula">\\((a+b)^2=a^2+2ab+b^2\\)</div>
<p><b>Square of a sum:</b> square the first term, add twice the product, then add the square of the second term.</p>
<div class="formula">\\((a-b)^2=a^2-2ab+b^2\\)</div>
<p><b>Square of a difference:</b> the middle term is negative.</p>
<div class="formula">\\(a^2-b^2=(a+b)(a-b)\\)</div>
<p><b>Difference of two squares:</b> factor as the sum multiplied by the difference.</p>
<div class="visual-banner"><div class="value-box"><small>IDENTITY</small><strong style="color:#60a5fa">\\((a+b)^2\\)</strong><span class="pill">square of a sum</span></div><div class="eq">↔</div><div class="value-box"><small>EXPANDED</small><strong style="color:#fbbf24">\\(a^2+2ab+b^2\\)</strong><span class="pill">always equal</span></div></div>
<p><b>Example:</b> \\((x+3)^2=x^2+6x+9\\).</p>
<p style="margin-bottom:0;color:#66736b"><b>Remember:</b> an identity stays true when valid values are substituted.</p>`;

 if(norm(concept)==="operations on rational numbers") return `
<strong>Rational numbers can be added, subtracted, multiplied, and divided using fraction rules.</strong>
<p><b>Addition:</b> use a common denominator. <b>Subtraction:</b> subtract numerators after using a common denominator.</p>
<div class="formula">\\(\\frac{a}{b}+\\frac{c}{d}=\\frac{ad+bc}{bd}\\)</div>
<div class="formula">\\(\\frac{a}{b}-\\frac{c}{d}=\\frac{ad-bc}{bd}\\)</div>
<p><b>Multiplication:</b> multiply numerator by numerator and denominator by denominator.</p>
<div class="formula">\\(\\frac{a}{b}\\times\\frac{c}{d}=\\frac{ac}{bd}\\)</div>
<p><b>Division:</b> multiply by the reciprocal of the divisor.</p>
<div class="formula">\\(\\frac{a}{b}\\div\\frac{c}{d}=\\frac{a}{b}\\times\\frac{d}{c},\\quad c\\ne0\\)</div>
<p style="margin-bottom:0;color:#66736b"><b>Important:</b> simplify the final answer. Division by zero is undefined.</p>`;
 if(norm(concept)==="rational numbers") return `
<strong>A rational number is any number that can be written as \\(p/q\\), where \\(p,q\\) are integers and \\(q\\ne0\\).</strong>
<div class="formula">\\(\\text{Rational number}=\\frac{p}{q},\\quad p,q\\in\\mathbb Z,\\ q\\ne0\\)</div>
<p>Examples include \\(3/5\\), \\(-7/2\\), \\(0/9\\), and every integer because \\(n=n/1\\).</p>`;
 if(norm(concept)==="equivalent rational numbers") return `
<strong>Equivalent rational numbers have the same value even when their numerator and denominator look different.</strong>
<div class="formula">\\(\\frac{a}{b}=\\frac{ak}{bk},\\quad k\\ne0\\)</div>
<p>Multiply or divide the numerator and denominator by the same non-zero number. Example: \\(2/3=4/6=6/9\\).</p>`;
 if(norm(concept)==="comparing rational numbers") return `
<strong>To compare rational numbers, convert them to a common denominator or compare their cross-products when denominators are positive.</strong>
<div class="formula">\\(\\frac{a}{b}\\ ?\\ \\frac{c}{d}\\quad\\Longleftrightarrow\\quad ad\\ ?\\ cb\\)</div>
<p>Example: \\(3/4\\) and \\(5/8\\): \\(3\\times8=24\\) and \\(5\\times4=20\\), so \\(3/4>5/8\\).</p>`;
 if(norm(concept)==="cubes and cube roots") return `
<strong>A cube is the product of a number multiplied by itself three times. A cube root asks which number produces a given perfect cube.</strong>
<div class="formula">\\(a^3=a\\times a\\times a\\)</div>
<p>For example, \\(4^3=4\\times4\\times4=64\\). Therefore \\(\\sqrt[3]{64}=4\\).</p>
<div class="formula">\\(\\sqrt[3]{a^3}=a\\)</div>
<p><b>Perfect cube:</b> the cube of an integer, such as 1, 8, 27, 64 and 125. Unlike square roots, cube roots can be negative: \\(\\sqrt[3]{-27}=-3\\).</p>
<p style="margin-bottom:0;color:#66736b"><b>Remember:</b> an odd number has an odd cube and an even number has an even cube.</p>`;
 if(norm(concept)==="cubes and cube roots") return `
<div class="visual-banner"><div style="font-size:42px;font-weight:950;line-height:1;color:#f3f4f6"><span id="cuben">4</span><sup style="font-size:22px">3</sup></div><div class="eq">=</div><div class="value-box"><small>CUBE VALUE</small><strong id="cubevalue">64</strong><span class="pill" id="cubepill">4³ = 64</span></div></div>
<div class="props"><div class="prop"><span>Number</span><strong id="cubenval">4</strong></div><div class="prop"><span>Cube</span><strong id="cubecval">64</strong></div><div class="prop"><span>Cube root</span><strong id="cuberootval">4</strong></div><div class="prop"><span>Perfect cube</span><strong id="cubeperfect">Yes</strong></div></div>
<div class="control"><div class="head"><span>Number</span><span class="val" id="cubenv">4</span></div><input class="range" id="cubeslider" type="range" min="-20" max="20" value="4"></div>
<div class="checks" id="cubework"></div>
<div class="presets"><button class="preset cubep" data-n="2">2³</button><button class="preset cubep" data-n="3">3³</button><button class="preset cubep" data-n="5">5³</button><button class="preset cubep" data-n="-3">−3³</button></div>`;
 if(norm(concept)==="like and unlike terms") return `
<strong>Like terms have the same variables raised to the same powers. Unlike terms have different variables or different powers.</strong>
<div class="formula">\\(5x+3x=8x\\)</div>
<p><b>Like terms:</b> \\(4x\\), \\(−7x\\), and \\(12x\\) are like terms because they have the same variable part, \\(x\\).</p>
<p><b>Unlike terms:</b> \\(3x\\) and \\(3y\\) are unlike terms because their variables are different. Likewise, \\(x\\) and \\(x^2\\) are unlike terms because their powers are different.</p>
<div class="visual-banner">
 <div class="value-box"><small>LIKE</small><strong style="color:#60a5fa">2x, −5x</strong><span class="pill">same variable & power</span></div>
 <div class="eq">≠</div>
 <div class="value-box"><small>UNLIKE</small><strong style="color:#fbbf24">2x, 2y</strong><span class="pill">different variable</span></div>
</div>
<p><b>Key rule:</b> only like terms can be combined by adding or subtracting their coefficients.</p>
<p style="margin-bottom:0;color:#66736b"><b>Example:</b> \\(7a−2a=5a\\), but \\(7a+2b\\) cannot be combined into one term.</p>`;
 if(norm(concept)==="variables and constants") return `
<strong>A variable is a symbol whose value can change. A constant is a fixed value that does not change.</strong>
<div class="formula">\\(x+5\\)</div>
<p>In \\(x+5\\), <b>x</b> is the variable and <b>5</b> is the constant.</p>
<div class="visual-banner"><div class="value-box"><small>VARIABLE</small><strong style="color:#60a5fa">x</strong><span class="pill">can change</span></div><div class="eq">+</div><div class="value-box"><small>CONSTANT</small><strong style="color:#fbbf24">5</strong><span class="pill">fixed</span></div></div>
<p><b>Examples:</b> In \\(7+y\\), \\(y\\) is the variable and \\(7\\) is the constant. In \\(a-3\\), \\(a\\) is the variable and \\(3\\) is the constant.</p>
<p style="margin-bottom:0;color:#66736b"><b>Remember:</b> a variable represents a value that may change, while a constant keeps the same value within the expression.</p>`;
 if(norm(concept)==="powers and exponents") return `
<strong>A power is a compact way to write repeated multiplication of the same number.</strong>
<div class="formula">\\(a^n=\\underbrace{a\\times a\\times\\cdots\\times a}_{n\\text{ factors}}\\)</div>
<p>Here <b>a</b> is the <b>base</b> and <b>n</b> is the <b>exponent</b>. For example, \\(2^4=2\\times2\\times2\\times2=16\\).</p>
<div class="formula">\\(a^m\\times a^n=a^{m+n}\\)</div>
<div class="formula">\\(a^m\\div a^n=a^{m-n}\\quad(a\\ne0,\\ m\\ge n)\\)</div>
<div class="formula">\\((a^m)^n=a^{mn}\\)</div>
<div class="formula">\\(a^m b^m=(ab)^m\\)</div>
<p style="margin-bottom:0;color:#66736b"><b>Remember:</b> the exponent tells how many times the base is used as a factor. \\(a^1=a\\) and for non-zero \\(a\\), \\(a^0=1\\).</p>`;
 if(norm(concept)==="squares and square roots") return `
<strong>A square is a number multiplied by itself. A square root tells you the non-negative number that produces a given perfect square.</strong>
<div class="formula squares-formula">\\(a^2=a\\times a\\)</div><div class="formula squares-formula">\\(\\sqrt{a^2}=|a|\\)</div>
<div class="visual-banner">
  <div class="value-box"><small>NUMBER</small><strong style="color:#60a5fa">6</strong><span class="pill">base</span></div>
  <div class="eq">→</div>
  <div class="value-box"><small>SQUARE</small><strong style="color:#fbbf24">36</strong><span class="pill">6² = 36</span></div>
  <div class="eq">→</div>
  <div class="value-box"><small>SQUARE ROOT</small><strong style="color:#34d399">6</strong><span class="pill">√36 = 6</span></div>
</div>
<p><b>Perfect squares:</b> 1, 4, 9, 16, 25, 36, 49, 64, 81, 100, ... Each has an integer square root.</p>
<p><b>Square:</b> \\(8^2=64\\). <b>Square root:</b> \\(\\sqrt{64}=8\\).</p>
<p><b>Important:</b> \\(\\sqrt{36}=6\\), not ±6. But if \\(x^2=36\\), then \\(x=\\pm6\\).</p>
<p><b>Parity:</b> the square of an even number is even; the square of an odd number is odd.</p>
<p style="margin-bottom:0;color:#66736b"><b>Remember:</b> square and square root are inverse ideas for non-negative numbers: squaring builds the perfect square, while the principal square root returns its non-negative root.</p>`;
if(norm(concept)==="properties of rational numbers") return `
<strong>Rational numbers follow important properties that make calculations consistent and predictable.</strong>
<div class="formula">\\(a+b=b+a\\quad\\text{and}\\quad a\\times b=b\\times a\\)</div>
<p><b>Commutative:</b> changing the order does not change the sum or product.</p>
<div class="formula">\\((a+b)+c=a+(b+c)\\quad\\text{and}\\quad(a\\times b)\\times c=a\\times(b\\times c)\\)</div>
<p><b>Associative:</b> changing the grouping does not change the result.</p>
<div class="formula">\\(a+0=a,\\quad a\\times1=a,\\quad a+(-a)=0\\)</div>
<p style="margin-bottom:0;color:#66736b"><b>Key idea:</b> rational numbers are closed under addition, subtraction and multiplication; division is closed when the divisor is non-zero.</p>`;
 if(norm(concept)==="terms and coefficients") return `
<strong>Every algebraic expression is built from terms, and each variable term has a coefficient.</strong>
<div class="formula">\\(5x + 3y - 7\\)</div>
<p>In <b>5x + 3y - 7</b>, the three terms are <b>5x</b>, <b>3y</b>, and <b>-7</b>.</p>
<div class="visual-banner">
  <div class="value-box"><small>TERM</small><strong style="color:#60a5fa">5x</strong><span class="pill">coefficient = 5</span></div>
  <div class="eq">+</div>
  <div class="value-box"><small>TERM</small><strong style="color:#60a5fa">3y</strong><span class="pill">coefficient = 3</span></div>
  <div class="eq">−</div>
  <div class="value-box"><small>CONSTANT TERM</small><strong style="color:#fbbf24">7</strong><span class="pill">coefficient = 7</span></div>
</div>
<p><b>Term:</b> a part of an expression separated by + or − signs.</p>
<p><b>Coefficient:</b> the numerical factor multiplying a variable. For example, the coefficient of <b>x</b> in <b>-4x</b> is <b>-4</b>.</p>
<p><b>Special case:</b> when no number is written, the coefficient is 1. So <b>x = 1x</b>.</p>
<p style="margin-bottom:0;color:#66736b"><b>Remember:</b> the sign belongs to the term. In <b>6a − 2b + 9</b>, the terms are <b>6a</b>, <b>−2b</b>, and <b>9</b>.</p>
`;
if(norm(concept)==="geometric constructions") return `
<strong>Geometric constructions create exact lines, angles, and points using a compass and straightedge.</strong>
<p><b>Core idea:</b> the compass transfers equal distances and draws arcs; the straightedge joins the construction points.</p>
<div class="formula gc-formula">\\(\\text{Given}\\rightarrow\\text{arcs}\\rightarrow\\text{intersections}\\rightarrow\\text{result}\\)</div>
<div class="concept-image" role="img" aria-label="Perpendicular bisector construction with equal arcs">
<svg viewBox="0 0 640 300" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<rect width="640" height="300" rx="18" fill="#f8fcf6"/><line x1="65" y1="190" x2="330" y2="190" stroke="#173f27" stroke-width="5"/><circle cx="65" cy="190" r="112" fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="8 7"/><circle cx="330" cy="190" r="112" fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="8 7"/><line x1="197.5" y1="65" x2="197.5" y2="270" stroke="#f59e0b" stroke-width="4"/><circle cx="197.5" cy="190" r="6" fill="#173f27"/><text x="365" y="65" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#173f27">PERPENDICULAR BISECTOR</text><text x="365" y="102" font-family="system-ui,sans-serif" font-size="12" fill="#263238">Equal arcs meet</text><text x="365" y="128" font-family="system-ui,sans-serif" font-size="12" fill="#263238">Join the intersections</text><text x="365" y="154" font-family="system-ui,sans-serif" font-size="12" fill="#263238">Midpoint + 90°</text><text x="365" y="184" font-family="system-ui,sans-serif" font-size="11" fill="#66736b">Blue = arcs • Orange = result</text></svg></div>
<div class="visual-banner"><div class="value-box"><small>GIVEN</small><strong style="color:#60a5fa">AB</strong><span class="pill">segment</span></div><div class="eq">→</div><div class="value-box"><small>MIDPOINT</small><strong style="color:#fbbf24">AM = MB</strong><span class="pill">equal halves</span></div><div class="eq">→</div><div class="value-box"><small>ANGLE</small><strong style="color:#34d399">90°</strong><span class="pill">perpendicular</span></div></div>
<p><b>Copy a segment:</b> set the compass opening to the given segment and transfer the same opening to the new starting point.</p><p><b>Perpendicular bisector:</b> draw equal-radius arcs from both endpoints, then join their intersections. The line crosses the segment at its midpoint and at 90°.</p><p><b>Angle bisector:</b> draw an arc from the vertex, mark equal points on both arms, then use equal arcs to locate the final point and join it to the vertex.</p><p><b>Perpendicular and parallel lines:</b> use equal-distance arcs for a perpendicular; copy a corresponding angle or use two perpendiculars to construct a parallel.</p>
<p style="margin-bottom:0;color:#66736b"><b>Remember:</b> construction marks are evidence of the method. Do not guess the final point or line—let the compass arcs determine it.</p>`;
if(norm(concept)==="algebraic expressions") return `
<strong>An algebraic expression combines numbers, variables, and operations without an equals sign.</strong>
<div class="formula">\\(3x+5\\)</div>
<p>In \\(3x+5\\), <b>3</b> is the coefficient of \\(x\\), <b>x</b> is the variable, and <b>5</b> is the constant term.</p>
<div class="visual-banner"><div class="value-box"><small>COEFFICIENT</small><strong style="color:#60a5fa">3</strong><span class="pill">multiplies x</span></div><div class="eq">×</div><div class="value-box"><small>VARIABLE</small><strong style="color:#60a5fa">x</strong><span class="pill">can change</span></div><div class="eq">+</div><div class="value-box"><small>CONSTANT</small><strong style="color:#fbbf24">5</strong><span class="pill">fixed</span></div></div>
<p><b>Terms:</b> the parts separated by + or − are terms. So \\(3x+5\\) has two terms: \\(3x\\) and \\(5\\).</p>
<p><b>Examples:</b> \\(7a-2\\), \\(4m+3n\\), and \\(9x^2-5x+1\\) are algebraic expressions.</p>
<p style="margin-bottom:0;color:#66736b"><b>Remember:</b> an expression does not have an equals sign. A term may contain a coefficient, variable, and exponent.</p>`;
 return `<strong>Build this concept from definition → example → practice.</strong><p>This page is routed specifically to <b>${esc(title)}</b>. No other concept's lesson is reused.</p><div class="formula">\\(\\text{Learn}\\rightarrow\\text{Practice}\\)</div><p style="margin-bottom:0;color:#66736b">The dedicated lesson can be expanded with concept-specific definitions, examples, and worked practice.</p>`;
}
function renderConceptPage(){
 app.innerHTML='<section class="card hero"><div class="kicker">'+esc(header)+' • '+esc(chapterText)+'</div><h1>'+esc(title)+'</h1><p>Learn the concept, then complete 30-question mastery practice.</p></section><section class="card"><h2>STEP 1 • LEARN</h2><div class="lesson">'+lessonHtml()+'</div></section><section class="card"><h2>STEP 2 • MASTERY QUIZ</h2><div id="quiz"></div></section>';
}
function startQuiz(){
 const host=document.getElementById("quiz");
 if(!host)return;
 host.innerHTML='<div style="padding:14px;color:#64806b;font-size:12px;font-weight:800">Loading mastery quiz…</div>';
 let quizSource;
 try{
  const quizKey=norm(concept)==="properties of rational numbers" ? "Properties of rational numbers" : key;
  const dedicated=bank[quizKey];
  quizSource=norm(concept)==="properties of rational numbers" ? (dedicated||INLINE_PROPERTIES_QUIZ) : (norm(concept)==="squares and square roots" ? (dedicated||INLINE_SQUARES_QUIZ) : (norm(concept)==="terms and coefficients" ? (dedicated||INLINE_TERMS_COEFFICIENTS_QUIZ) : (norm(concept)==="like and unlike terms" ? (dedicated||INLINE_LIKE_AND_UNLIKE_TERMS_QUIZ) : (norm(concept)==="factorisation basics" ? (dedicated||INLINE_FACTORISATION_BASICS_QUIZ) : dedicated))));
 }catch(e){
  host.innerHTML='<div class="empty">Mastery Quiz could not load. Please refresh this page.</div>';
  return;
 }
 if(!Array.isArray(quizSource)||quizSource.length===0){host.innerHTML='<div class="empty">No dedicated 30-question bank is available for <b>'+esc(title)+'</b> yet. This quiz is intentionally empty — no other concept questions are reused.</div>';return}
 const questions=quizSource.slice(0,30), total=questions.length;let i=0,score=0,answered=false;
 host.innerHTML='<div class="quiz-head"><span class="progress" id="qp">Question 1 of '+total+'</span><span class="progress" id="qs">Score 0</span></div><div class="bar"><div class="fill" id="qf"></div></div><div class="qno" id="qno"></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="explain" id="explain"></div><button class="next" id="next" disabled>Next</button>';
 const qno=document.getElementById("qno"),q=document.getElementById("question"),opts=document.getElementById("options"),fb=document.getElementById("feedback"),ex=document.getElementById("explain"),next=document.getElementById("next");
 function render(){answered=false;next.disabled=true;fb.textContent="";ex.textContent="";ex.style.display="none";const item=questions[i];qno.textContent="MASTERY PRACTICE • "+(i+1);q.innerHTML=mathifyText(item[0]);opts.innerHTML=item[1].map((o,j)=>'<button class="opt" data-i="'+j+'">'+mathifyOption(esc(o))+'</button>').join("");document.getElementById("qp").textContent="Question "+(i+1)+" of "+total;document.getElementById("qf").style.width=(i/total*100)+"%";document.getElementById("qs").textContent="Score "+score;opts.querySelectorAll(".opt").forEach(btn=>btn.addEventListener("click",()=>answer(+btn.dataset.i)));if(window.MathJax&&window.MathJax.typesetPromise)window.MathJax.typesetPromise([q,opts]).catch(()=>{})}
 function answer(j){if(answered)return;answered=true;const item=questions[i],correct=item[2];opts.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k===correct)b.classList.add("correct");else if(k===j)b.classList.add("wrong")});if(j===correct){score++;fb.textContent="Correct";}else fb.textContent="Review the highlighted answer";ex.innerHTML=mathifyText(esc(item[3]||""));ex.style.display="block";next.disabled=false;document.getElementById("qs").textContent="Score "+score;scheduleMath()}
 next.addEventListener("click",()=>{i++;if(i>=total){host.innerHTML='<div class="result"><div class="score">'+score+' / '+total+'</div><p>Mastery quiz complete for <b>'+esc(title)+'</b>.</p><button class="next" id="again">Try Again</button></div>';document.getElementById("again").onclick=()=>startQuiz();return}render()});render();
}
