const INLINE_BASIC_PROPORTIONALITY_THEOREM_QUIZ=[["In △ABC, D lies on AB and E lies on AC. If DE ∥ BC, which relation follows from BPT?",["AD/DB = AE/EC","AD/DB = AC/AE","AB/AD = AE/EC","AD/AE = DB/BC"],0,"The Basic Proportionality Theorem states AD/DB = AE/EC when DE ∥ BC."],["If AD = 4, DB = 6, AE = 8 and DE ∥ BC, find EC.",["10","12","14","16"],1,"AD/DB = AE/EC gives 4/6 = 8/EC, so EC = 12."],["Which condition is essential for applying BPT in △ABC?",["DE ⟂ BC","DE ∥ BC","D is the midpoint of AB","AB = AC"],1,"BPT applies when a line parallel to one side intersects the other two sides."],["If AB = 15 and AD = 9, find DB.",["4","5","6","9"],2,"Since D lies between A and B, DB = AB − AD = 15 − 9 = 6."],["The Basic Proportionality Theorem is also known as:",["Pythagoras theorem","Thales' theorem","Angle bisector theorem","Midpoint theorem only"],1,"BPT is also commonly called Thales' theorem."],["If AD/DB = AE/EC, what does the converse of BPT conclude?",["DE ∥ BC","DE ⟂ BC","AB = AC","∠A = 90°"],0,"If a line divides two sides of a triangle in the same ratio, it is parallel to the third side."],["If DE ∥ BC, AD = 6, AB = 10 and AC = 20, find AE.",["8","10","12","15"],2,"AD/AB = AE/AC, so 6/10 = AE/20 and AE = 12. Wait calculation: AE = 12."],["If DE ∥ BC, which equality compares the smaller triangle to the whole triangle?",["AD/AB = AE/AC","AD/DB = AC/EC","AB/AD = AE/AC","DB/AB = AE/AC"],0,"△ADE is similar to △ABC, so AD/AB = AE/AC = DE/BC."],["D and E are midpoints of AB and AC. Which statement is true?",["DE ∥ BC and DE = BC/2","DE = BC","DE ⟂ BC","AB = AC"],0,"The midpoint theorem states that the segment joining two midpoints is parallel to the third side and half its length."],["If AD = 5, DB = 3, AE = 10 and DE ∥ BC, find EC.",["4","5","6","8"],2,"5/3 = 10/EC, so EC = 6."],["If DE ∥ BC and AD/AB = 3/5, what is AE/AC?",["2/5","3/5","5/3","3/2"],1,"Corresponding sides of similar triangles are proportional, so AE/AC = AD/AB = 3/5."],["Which statement gives the conv function mathifyText(s){
 let t=String(s);
 // Remove orphaned MathJax closing delimiters from quiz text.
 if(!t.includes("\\(")&&!t.includes("\\["))t=t.replace(/\\\)/g,"");
 if(t.includes("\\(")||t.includes("\\[")){
  return t.replace(/\\\(([^]*?)\\\)/g,function(_,inner){
   inner=inner.replace(/([A-Za-z0-9]+)²/g,"$1^2").replace(/([A-Za-z0-9]+)³/g,"$1^3");
   return "\\("+inner+"\\)";
  });
 }
 t=t.replace(/([A-Za-z0-9]+)²/g,"\\($1^2\\)").replace(/([A-Za-z0-9]+)³/g,"\\($1^3\\)");
 t=t.replace(/([A-Za-z0-9]+)\^\{?(\d+)\}?/g,"\\($1^{$2}\\)");
 t=t.replace(/√\\s*([−-]?\\d+(?:\\.\\d+)?)/g,"\\(\\sqrt{$1}\\)");
 t=t.replace(/∛\\s*([−-]?\\d+(?:\\.\\d+)?)/g,"\\(\\sqrt[3]{$1}\\)");
 const term="(?:\\\\([^()]+\\\\)(?:\\^\\\\{?\\d+\\\\}?)?|[−-]?\\d*[A-Za-z](?:\\^\\\\{?\\d+\\\\}?)?|[−-]?\\d+(?:\\.\\d+)?(?:\\^\\\\{?\\d+\\\\}?)?)";
 const expr=new RegExp("(?<![A-Za-z0-9])("+term+"(?:\\\\s*[+−\\-×÷=<>]\\\\s*"+term+")+)(?![A-Za-z0-9])","g");
 t=t.replace(expr,"\\($1\\)");
 t=t.replace(/([−-]?\d+)\s*\/\s*([−-]?\d+)/g,"\\(\\frac{$1}{$2}\\)");

}
function quizMath(s){

function mathifyDom(root){
 const walker=document.createTreeWalker(root,4);
 const nodes=[];
 let node;
 while(node=walker.nextNode())nodes.push(node);
 nodes.forEach(function(n){
  if(!n.nodeValue||n.nodeValue.includes("\\(")||n.nodeValue.includes("\\["))return;
  const p=n.parentElement;

  const out=mathifyText(n.nodeValue);
  if(out!==n.nodeValue)n.nodeValue=out;
 });
}

function arithmeticProgressionLessonHtml(){
return `
<div class="lesson-block">
<h3>Arithmetic Progression (AP)</h3>
<p>An AP is a number pattern where we add or subtract the same number each time.</p>
<div class="formula">4, 7, 10, 13, 16, … &nbsp; (add 3 each time)</div>
<h3>Remember these 3 formulas</h3>
<ul>
<li><b>Common difference:</b> d = second term − first term</li>
<li><b>Find any term:</b> aₙ = a + (n − 1)d</li>
<li><b>Sum of first n terms:</b> Sₙ = n/2 [2a + (n − 1)d]</li>
</ul>
<p><b>Letters:</b> a = first term, d = common difference, n = term number.</p>
<h3>Try it yourself</h3>
<p>Move the sliders. Watch the sequence, selected term, and sum change.</p>
<div class="interactive-panel">
<div class="control-row"><label for="apFirst">First term (a)</label><input id="apFirst" type="range" min="-10" max="20" value="4"><b id="apFirstVal">4</b></div>
<div class="control-row"><label for="apDiff">Difference (d)</label><input id="apDiff" type="range" min="-6" max="8" value="3"><b id="apDiffVal">3</b></div>
<div class="control-row"><label for="apTerm">Term number (n)</label><input id="apTerm" type="range" min="1" max="12" value="5"><b id="apTermVal">5</b></div>
<div class="formula"><b>Sequence:</b> <span id="apSequence">4, 7, 10, 13, 16, …</span></div>
<div class="formula"><b>Selected term:</b> <span id="apNth">a₅ = 16</span></div>
<div class="formula"><b>Calculation:</b> <span id="apWork">a₅ = 4 + (5 − 1) × 3 = 16</span></div>
<div class="formula"><b>Sum of first n terms:</b> <span id="apSum">S₅ = 5/2 [2 × 4 + (5 − 1) × 3] = 40</span></div>
<div class="formula"><b>Check:</b> <span id="apSumCheck">S₅ = 5/2 (4 + 16) = 50</span></div>
</div>
<h3>One solved example</h3>
<p>Find the 10th term of 2, 5, 8, 11, …</p>
<p>a = 2, d = 3, n = 10</p>
<div class="formula">a₁₀ = 2 + (10 − 1) × 3 = 29</div>
<h3>Quick tips</h3>
<ul>
<li>d is positive: terms increase.</li>
<li>d is negative: terms decrease.</li>
<li>d = 0: all terms are equal.</li>
<li>Use n − 1 because the first term is already a.</li>
</ul>
</div>`;
}

function startCommonDifferenceDemo(){
if(norm(concept)!=="common difference")return;
const aEl=document.getElementById("cdFirst"),dEl=document.getElementById("cdDiff");
if(!aEl||!dEl)return;
const put=(id,value)=>{const el=document.getElementById(id);if(el)el.textContent=value;};
function update(){
const a=Number(aEl.value),d=Number(dEl.value);
put("cdFirstVal",a);put("cdDiffVal",d);
put("cdSequence",Array.from({length:5},(_,i)=>a+i*d).join(", ")+" …");
put("cdCheck",(a+d)+" − "+a+" = "+d);
put("cdPattern",d>0?"Each term increases by "+d+".":d<0?"Each term decreases by "+Math.abs(d)+".":"Every term stays equal to "+a+".");
}
[aEl,dEl].forEach(el=>el.addEventListener("input",update));update();
}

<h3>2. Choose the correct ratio</h3>
<div class="formula"><b>Use tangent</b> when height and horizontal distance are involved: tan θ = opposite ÷ adjacent.<br><b>Use sine</b> when the line of sight is the hypotenuse and height is opposite: sin θ = height ÷ line of sight.<br><b>Use cosine</b> when horizontal distance is adjacent to the angle and line of sight is the hypotenuse: cos θ = distance ÷ line of sight.</div>

<div class="geometry-lesson trig-identities-lab">
<strong>Trigonometric Identities — Interactive Explorer</strong>
<p>An identity remains true for every angle where its expressions are defined. Change θ to check the Pythagorean identity and see how tangent and secant are related.</p>
<div class="formula">sin²θ + cos²θ = 1<br>1 + tan²θ = sec²θ<br>1 + cot²θ = cosec²θ</div>
<div class="control"><div class="head"><label for="tiAngle">Choose angle θ</label><span class="val"><span id="tiAngleOut">30</span>°</span></div><input id="tiAngle" class="range" type="range" min="5" max="85" step="1" value="30"></div>
<div class="props"><div class="prop"><span>sin²θ + cos²θ</span><strong id="tiPythagorean">1.0000</strong></div><div class="prop"><span>tan²θ + 1</span><strong id="tiTanLeft">1.3333</strong></div><div class="prop"><span>sec²θ</span><strong id="tiSecRight">1.3333</strong></div><div class="prop"><span>cot²θ + 1</span><strong id="tiCotLeft">4.0000</strong></div><div class="prop"><span>cosec²θ</span><strong id="tiCosecRight">4.0000</strong></div></div>
<div class="checks" id="tiCheck" aria-live="polite">Both sides match (allowing for rounding), so the identities are verified for this angle.</div>
<h3>How to derive the identities</h3>
<ul><li>Start with sin²θ + cos²θ = 1.</li><li>Divide every term by cos²θ (where cos θ ≠ 0) to obtain 1 + tan²θ = sec²θ.</li><li>Divide every term by sin²θ (where sin θ ≠ 0) to obtain 1 + cot²θ = cosec²θ.</li></ul>
<div class="formula"><b>Remember:</b> an identity is not just true for one example. It holds for every permitted value of θ.</div>
</div>`;

<div class="geometry-lesson trig-functions-lesson"><strong>Trigonometric Functions — Unit Circle Explorer</strong>
<p>Trigonometric functions connect an angle to coordinates on a circle. For a point on the unit circle at angle θ, the coordinates are <b>(cos θ, sin θ)</b>. This extends sine and cosine beyond right-triangle angles.</p>
<div class="lesson"><b>Core definitions</b><div class="formula">sin θ = y &nbsp; • &nbsp; cos θ = x<br>tan θ = sin θ / cos θ = y/x (when cos θ ≠ 0)</div><p>Angles are measured from the positive x-axis. Anticlockwise rotation is positive; clockwise rotation is negative.</p></div>
<div class="concept-image"><svg id="tfCircle" viewBox="0 0 320 240" role="img" aria-label="Unit circle showing the angle, radius and point coordinates"><circle cx="150" cy="118" r="78" fill="#f4fbef" stroke="#173f27" stroke-width="2.5"/><path d="M35 118H278 M150 218V18" stroke="#9aada0" stroke-width="1.5"/><path d="M270 113L278 118L270 123 M145 26L150 18L155 26" fill="none" stroke="#66736b" stroke-width="1.5"/><path id="tfRadius" d="M150 118 L204 62" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><path id="tfAngleArc" d="M180 118 A30 30 0 0 0 174 97" fill="none" stroke="#f59e0b" stroke-width="3"/><circle id="tfPoint" cx="204" cy="62" r="5" fill="#58cc02" stroke="#173f27" stroke-width="1.5"/><path id="tfDropX" d="M204 62V118" stroke="#58cc02" stroke-dasharray="4 3" stroke-width="1.5"/><path id="tfDropY" d="M150 62H204" stroke="#f59e0b" stroke-dasharray="4 3" stroke-width="1.5"/><g font-family="system-ui,sans-serif" font-size="10" font-weight="800" fill="#173f27"><text x="284" y="111">x</text><text x="159" y="19">y</text><text x="157" y="132">O</text><text id="tfPointLabel" x="211" y="55">(x, y)</text><text x="43" y="232">Radius = 1</text></g></svg></div>
<div class="control"><div class="head"><label for="tfAngle">Choose angle θ</label><span class="val"><span id="tfAngleOut">45</span>°</span></div><input class="range" id="tfAngle" type="range" min="-360" max="360" value="45" step="15"></div>
<div class="props"><div class="prop"><span>cos θ (x-coordinate)</span><strong id="tfCos">0.7071</strong></div><div class="prop"><span>sin θ (y-coordinate)</span><strong id="tfSin">0.7071</strong></div><div class="prop"><span>tan θ</span><strong id="tfTan">1</strong></div><div class="prop"><span>Quadrant / axis</span><strong id="tfQuadrant">I</strong></div></div>
<div class="checks" id="tfExplain">At 45°, sine and cosine are equal and positive.</div>
<div class="lesson"><b>Standard values to remember</b><p>θ = 0°: sin θ = 0, cos θ = 1. θ = 30°: sin θ = 1/2, cos θ = √3/2. θ = 45°: both are √2/2. θ = 60°: sin θ = √3/2, cos θ = 1/2. θ = 90°: sin θ = 1, cos θ = 0.</p></div>
<div class="lesson"><b>Signs in each quadrant</b><p><b>I:</b> sin and cos positive. <b>II:</b> sin positive, cos negative. <b>III:</b> both negative. <b>IV:</b> sin negative, cos positive. Tangent is undefined whenever cos θ = 0.</p></div>
<div class="lesson"><b>Periodicity and symmetry</b><div class="formula">sin(θ + 360°) = sin θ<br>cos(θ + 360°) = cos θ<br>tan(θ + 180°) = tan θ</div><p>Sine and cosine have period 360° (2π radians); tangent has period 180° (π radians). Also, sin(−θ) = −sin θ and cos(−θ) = cos θ.</p></div>
<div class="lesson"><b>Common mistakes</b><p>Do not confuse sin θ with cos θ: on the unit circle, cosine is the horizontal coordinate and sine is the vertical coordinate. tan θ is undefined at 90° + k·180°, where k is any integer.</p></div></div>`;

<div class="terms-lesson">
<strong>Basic Proportionality Theorem (BPT)</strong>
<p>In a triangle, a line drawn parallel to one side and intersecting the other two sides divides those two sides in the same ratio.</p>
<div class="formula">If DE ∥ BC, then AD/DB = AE/EC</div>
<div class="concept-image" role="img" aria-label="Triangle ABC with D on AB, E on AC and DE parallel to BC">
<svg viewBox="0 0 320 205" width="100%" class="pc-responsive-svg" xmlns="http://www.w3.org/2000/svg">
<path d="M160 20 L42 180 L278 180 Z" fill="#e7f1ff" stroke="#2457a7" stroke-width="2.5"/>
<path d="M101 100 L219 100" stroke="#d97706" stroke-width="3"/>
<text x="160" y="13" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">A</text>
<text x="30" y="194" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">B</text>
<text x="290" y="194" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">C</text>
<text x="95" y="94" text-anchor="end" font-size="12" font-weight="700" fill="currentColor">D</text>
<text x="225" y="94" text-anchor="start" font-size="12" font-weight="700" fill="currentColor">E</text>
<text x="160" y="91" text-anchor="middle" font-size="11" fill="#b45309">DE ∥ BC</text>
</svg></div>
<div class="checks"><b>How to use BPT</b><br>1. Confirm that D lies on AB and E lies on AC.<br>2. Check that DE is parallel to BC.<br>3. Set up AD/DB = AE/EC, then solve for the unknown segment.</div>
<div class="checks"><b>Example</b><br>If AD = 3, DB = 2, AE = 6 and DE ∥ BC, then 3/2 = 6/EC, so EC = 4.</div>
<div class="checks"><b>Converse of BPT</b><br>If a line divides two sides of a triangle in the same ratio, then that line is parallel to the third side: if AD/DB = AE/EC, then DE ∥ BC.</div>
<div class="checks"><b>Remember</b><br>BPT guarantees equal ratios, not necessarily equal segment lengths. If D and E are midpoints, the midpoint theorem gives DE ∥ BC and DE = BC/2.</div>
</div>`;

<div class="terms-lesson">
<strong>Similarity of triangles</strong>
<p>Two triangles are similar when their corresponding angles are equal and their corresponding sides are in the same ratio. Similar triangles have the same shape, but not necessarily the same size.</p>
<div class="formula">△ABC ∼ △PQR</div>
<div class="checks"><b>Similarity criteria</b><br><b>AA (or AAA):</b> two corresponding angles are equal.<br><b>SAS:</b> two pairs of corresponding sides are proportional and the included angles are equal.<br><b>SSS:</b> all three pairs of corresponding sides are proportional.</div>
<div class="checks"><b>Correspondence matters</b><br>If △ABC ∼ △DEF, then A ↔ D, B ↔ E, C ↔ F. Therefore AB/DE = BC/EF = AC/DF. Match the vertices in the stated order before forming ratios.</div>
<div class="checks"><b>Worked example</b><br>△ABC ∼ △DEF. AB = 6 cm, DE = 9 cm and BC = 8 cm. Find EF.<br>AB/DE = BC/EF → 6/9 = 8/EF → 6EF = 72 → <b>EF = 12 cm</b>.</div>
<div class="checks"><b>Perimeters and areas</b><br>If the ratio of corresponding sides is k, the ratio of perimeters is k and the ratio of areas is k². For example, a side ratio of 2:3 gives an area ratio of 4:9.</div>
<div class="concept-image"><svg viewBox="0 0 640 280" width="100%" height="auto" role="img" aria-label="Two similar triangles with corresponding sides in proportion"><rect width="640" height="280" rx="18" fill="#f8fcf6"/><polygon points="60,220 230,220 150,75" fill="#dff3d8" stroke="#173f27" stroke-width="4"/><polygon points="330,220 585,220 465,20" fill="#eaf0ff" stroke="#2563eb" stroke-width="4"/><g fill="#173f27" font-size="17" font-weight="800"><text x="48" y="242">A</text><text x="232" y="242">B</text><text x="147" y="64">C</text><text x="316" y="242">D</text><text x="588" y="242">E</text><text x="463" y="18">F</text></g><text x="320" y="265" text-anchor="middle" fill="#66736b" font-size="14">Corresponding angles equal • corresponding sides proportional</text></svg></div>
<p><b>Common mistakes:</b> matching the wrong sides, comparing sides in inconsistent order, and forgetting to square the side ratio when comparing areas.</p>
</div>`;

<div class="terms-lesson">
<strong>Sum of terms in an arithmetic progression (AP)</strong>
<p>An arithmetic progression is a sequence in which the difference between consecutive terms is constant. The sum of its first n terms is written as Sₙ.</p>
<div class="formula">Sₙ = n/2 [2a + (n − 1)d]</div>
<p><b>Here:</b> a = first term, d = common difference, n = number of terms. If the last term l is known, use:</p>
<div class="formula">Sₙ = n/2 (a + l)</div>
<div class="checks"><b>Worked example</b><br>Find the sum of the first 10 terms of 3, 7, 11, 15, …<br>a = 3, d = 4, n = 10<br>S₁₀ = 10/2 [2(3) + 9(4)] = 5(6 + 36) = <b>210</b>.</div>
<div class="checks"><b>When to use each formula</b><br>Use Sₙ = n/2[2a + (n−1)d] when the first term and common difference are known. Use Sₙ = n/2(a+l) when the first and last terms are known.</div>
<div class="control"><div class="head"><span>Interactive example</span><span class="val" id="sumApValue">S₈ = 100</span></div>
<div class="props"><div class="prop"><span>First term (a)</span><strong id="sumApAVal">2</strong><input class="range" id="sumApA" type="range" min="-5" max="10" value="2" step="1"></div><div class="prop"><span>Common difference (d)</span><strong id="sumApDVal">3</strong><input class="range" id="sumApD" type="range" min="-4" max="8" value="3" step="1"></div><div class="prop"><span>Number of terms (n)</span><strong id="sumApNVal">8</strong><input class="range" id="sumApN" type="range" min="1" max="20" value="8" step="1"></div><div class="prop"><span>Last term</span><strong id="sumApLVal">23</strong></div></div>
<div class="checks" id="sumApWork">S₈ = 8/2 [2(2) + 7(3)] = 4(4 + 21) = 100.</div></div>
<p><b>Common mistakes:</b> using n instead of n−1 in the bracket; forgetting to multiply by n/2; mixing up the last term and common difference.</p>
</div>`;

<div class="lesson" style="margin:10px 0">
<strong>Grouped data</strong>
<p>When there are many different observations, combine them into class intervals. Example: 0–10, 10–20, 20–30. Each observation must be counted in exactly one class.</p>
<div class="concept-image"><table style="width:100%;border-collapse:collapse;background:#fff;text-align:center"><thead><tr><th style="padding:8px;border:1px solid #d9e8d4">Class interval</th><th style="padding:8px;border:1px solid #d9e8d4">Frequency</th><th style="padding:8px;border:1px solid #d9e8d4">Class width</th></tr></thead><tbody>
<tr><td style="padding:7px;border:1px solid #d9e8d4">0–10</td><td style="padding:7px;border:1px solid #d9e8d4">4</td><td style="padding:7px;border:1px solid #d9e8d4">10</td></tr>
<tr><td style="padding:7px;border:1px solid #d9e8d4">10–20</td><td style="padding:7px;border:1px solid #d9e8d4">7</td><td style="padding:7px;border:1px solid #d9e8d4">10</td></tr>
<tr><td style="padding:7px;border:1px solid #d9e8d4">20–30</td><td style="padding:7px;border:1px solid #d9e8d4">5</td><td style="padding:7px;border:1px solid #d9e8d4">10</td></tr>
<tr><td style="padding:7px;border:1px solid #d9e8d4"><b>Total</b></td><td style="padding:7px;border:1px solid #d9e8d4"><b>16</b></td><td style="padding:7px;border:1px solid #d9e8d4">—</td></tr>
</tbody></table></div>
<p><b>Class width</b> = upper class boundary − lower class boundary. Here, 20 − 10 = 10 for the interval 10–20.</p>
</div>
<p><b>Key terms</b></p>
<ul style="padding-left:20px;line-height:1.6">
<li><b>Class limits:</b> the lower and upper values written for a class.</li>
<li><b>Class interval:</b> a group or range used to organise observations.</li>
<li><b>Class width:</b> the size of the interval.</li>
<li><b>Total frequency:</b> the sum of all frequencies, written as \\(\\sum f\\).</li>
<li><b>Tally marks:</b> quick count marks, commonly grouped in fives.</li>
</ul>
<div class="formula">\\(\\text{Total frequency}=\\sum f=\\text{number of observations}\\)</div>
<p><b>Quick check</b></p>
<p>If three classes have frequencies 5, 8 and 7, the total frequency is 5 + 8 + 7 = 20. If the raw data contain 21 observations, recheck the tally: one observation has been missed or counted incorrectly.</p>
<p style="margin-bottom:0;color:#66736b"><b>Common mistake:</b> do not confuse a value or class interval with its frequency. The interval tells which observations belong together; the frequency tells how many are in that group.</p>
</div>`;

<div class="geometry-lesson irrationality-proofs-lesson">
<strong>Use proof by contradiction to show that the square root of a prime number is irrational.</strong>
<p>Assume the opposite: write \\(\\sqrt{p}=\\frac{a}{b}\\), where \\(a,b\\) are coprime integers and \\(b\\ne0\\). Squaring gives \\(a^2=pb^2\\). Since \\(p\\) is prime and divides \\(a^2\\), it divides \\(a\\). Put \\(a=pc\\); substitution gives \\(b^2=pc^2\\), so \\(p\\) also divides \\(b\\). Both \\(a\\) and \\(b\\) are divisible by \\(p\\), contradicting that they are coprime.</p>
<div class="formula">\\(\\boxed{\\sqrt{p}\\text{ is irrational for every prime }p}\\)</div>
<div class="visual-banner"><div class="value-box"><small>ASSUME</small><strong>\\(\\sqrt{p}=a/b\\)</strong><span class="pill">lowest terms</span></div><div class="eq">→</div><div class="value-box"><small>DERIVE</small><strong>\\(p\\mid a,\\ p\\mid b\\)</strong><span class="pill bad">contradiction</span></div></div>

<div style="border:1px solid #d9e6dc;border-radius:14px;padding:14px;background:#f7fbf7;color:#193d29"><div style="font-weight:800;margin-bottom:8px">Heron’s formula</div><div style="font-size:1.12rem;font-weight:850">Area = √[s(s − a)(s − b)(s − c)]</div><div style="font-size:.92rem;margin-top:8px">s = (a + b + c) ÷ 2</div><div style="font-size:.85rem;margin-top:6px">s is the semiperimeter: half the perimeter.</div></div>

<div style="border:1px solid #dce5df;border-radius:16px;padding:12px"><svg id="heronTriangleSvg" viewBox="0 0 480 285" width="100%" role="img" aria-label="Triangle changes with side lengths" style="display:block;max-height:310px"><rect x="1" y="1" width="478" height="283" rx="12" fill="#f7fbf8" stroke="#e0e9e2"/><polygon id="heronTriangle" points="95,220 375,220 235,80" fill="#d7f0df" stroke="#23834b" stroke-width="3" stroke-linejoin="round"/><line id="heronAltitude" x1="235" y1="80" x2="235" y2="220" stroke="#71877a" stroke-dasharray="5 5" stroke-width="2"/><text id="heronLabelA" x="310" y="140" font-size="15" font-weight="800" fill="#173f27">a = 5</text><text id="heronLabelB" x="125" y="140" font-size="15" font-weight="800" fill="#173f27">b = 4</text><text id="heronLabelC" x="220" y="248" font-size="15" font-weight="800" fill="#173f27">c = 3</text><text x="16" y="24" font-size="12" fill="#567160">Live triangle diagram</text></svg>
<div id="heronValidity" role="status" style="font-weight:800;margin:4px 2px 10px;color:#21663b">Valid triangle</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
<label style="display:block;font-weight:750">Side a: <span id="heronAVal">5</span><input id="heronASlider" type="range" min="3" max="20" step="1" value="5" style="display:block;width:100%;margin-top:8px"></label>
<label style="display:block;font-weight:750">Side b: <span id="heronBVal">4</span><input id="heronBSlider" type="range" min="3" max="20" step="1" value="4" style="display:block;width:100%;margin-top:8px"></label>
<label style="display:block;font-weight:750">Side c: <span id="heronCVal">3</span><input id="heronCSlider" type="range" min="3" max="20" step="1" value="3" style="display:block;width:100%;margin-top:8px"></label></div></div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-top:12px"><div style="border-radius:12px;padding:12px;background:#f5f7f6"><small>Semiperimeter (s)</small><div id="heronSVal" style="font-size:1.2rem;font-weight:850">6 units</div></div><div style="border-radius:12px;padding:12px;background:#f5f7f6"><small>Heron product</small><div id="heronProductVal" style="font-size:1.2rem;font-weight:850">36</div></div><div style="border-radius:12px;padding:12px;background:#e8f6ec"><small>Triangle area</small><div id="heronAreaVal" style="font-size:1.2rem;font-weight:850">6 square units</div></div></div>
<div style="margin-top:12px;border-left:4px solid #3d9660;padding:10px 14px;background:#f7fbf8;border-radius:8px"><div style="font-weight:800;margin-bottom:5px">Follow the calculation</div><div id="heronWorking" aria-live="polite">s = (3 + 4 + 5) ÷ 2 = 6; area = √(6 × 2 × 3 × 1) = 6 square units.</div></div>
<div style="margin-top:14px"><div style="font-weight:850;margin-bottom:6px">What to notice</div><ul style="margin-top:6px"><li>The sum of any two sides must exceed the third side.</li><li>If this triangle inequality fails, the side lengths do not make a triangle.</li><li>The product under the square root is the area squared; take its square root to get the area.</li></ul></div></div>
`;

<div class="geometry-lesson"><strong>Mean of Grouped Data</strong>
<p>Use the midpoint of each class and how often it occurs to estimate the average.</p>
<div class="formula"><b>1. Class mark:</b> x = (lower class limit + upper class limit) ÷ 2<br><b>2. Total frequency:</b> N = Σf<br><b>3. Estimated mean:</b> x̄ = Σfx ÷ Σf = Σfx ÷ N</div>

<div class="formula">\\(20+\\left(\\frac{20-12}{8}\\right)10=30\\)</div>
<ol><li>Compute N/2.</li><li>Find the first cumulative frequency that reaches or exceeds N/2.</li><li>Substitute the values from that median class.</li></ol>
<div class="checks"><b>Remember:</b> cf is the cumulative frequency before the median class.</div></div>`;

<p>When all outcomes are equally likely, probability is the fraction of outcomes that satisfy the event.</p>

const INLINE_SECTION_FORMULA_QUIZ=[["Which point P divides A(x₁,y₁), B(x₂,y₂) internally in ratio AP:PB=m:n?",["((mx₂+nx₁)/(m+n),(my₂+ny₁)/(m+n))","((mx₁+nx₂)/(m+n),(my₁+ny₂)/(m+n))","((x₁+x₂)/2,(y₁+y₂)/2)","((mx₂−nx₁)/(m+n),(my₂−ny₁)/(m+n))"],0,"The coordinate nearer B receives coefficient m; the coordinate nearer A receives n."],["Find midpoint of A(2,4), B(8,10).",["(5,7)","(6,7)","(5,6)","(10,14)"],0,"Average both coordinates: ((2+8)/2,(4+10)/2)=(5,7)."],["A(0,0), B(12,6), ratio 1:2. Find P.",["(4,2)","(8,4)","(6,3)","(3,4)"],0,"P=((1·12+2·0)/3,(1·6+2·0)/3)=(4,2)."],["A(1,2), B(7,8), ratio 2:1. Find P.",["(5,6)","(3,4)","(4,5)","(6,7)"],0,"P=((2·7+1·1)/3,(2·8+1·2)/3)=(5,6)."],["A(−2,4), B(8,−1), ratio 3:2. Find x-coordinate of P.",["4","2","6","−4"],0,"x=(3·8+2·(−2))/5=4."],["A(2,−3), B(10,5), ratio 1:3. Find y-coordinate of P.",["−1","1","3","−2"],0,"y=(1·5+3·(−3))/4=−1."],["Which ratio describes a midpoint?",["1:1","1:2","2:1","2:3"],0,"A midpoint is equally distant from both endpoints: 1:1."],["P(4,5) is midpoint of A(1,2), B(x,y). Find (x,y).",["(7,8)","(6,7)","(5,6)","(3,3)"],0,"4=(1+x)/2 gives x=7; 5=(2+y)/2 gives y=8."],["A(−4,6), B(8,0), ratio 1:2. Find P.",["(0,4)","(4,2)","(2,4)","(0,2)"],0,"P=((8+2(−4))/3,(0+2·6)/3)=(0,4)."],["A(3,−2), B(9,4), ratio 2:1. Find P.",["(7,2)","(5,0)","(6,1)","(8,3)"],0,"P=((2·9+3)/3,(2·4−2)/3)=(7,2)."],["Internal section formula denominator is:",["m+n","m−n","mn","m/n"],0,"For internal division, ratio weights add: m+n."],["Find midpoint of A(−3,−6), B(9,6).",["(3,0)","(6,0)","(3,3)","(−6,−12)"],0,"((−3+9)/2,(−6+6)/2)=(3,0)."],["A(2,1), B(14,7), ratio 1:3. Find x-coordinate.",["5","8","11","4"],0,"x=(14+3·2)/4=5."],["A(2,1), B(14,7), ratio 1:3. Find y-coordinate.",["2.5","4","5.5","3"],0,"y=(7+3·1)/4=2.5."],["P(5,3) divides A(1,1), B(9,5) internally. Find ratio.",["1:1","1:2","2:1","3:1"],0,"P is the midpoint because both coordinate changes from the endpoints are equal."],["A(0,4), B(10,−6), ratio 2:3. Find P.",["(4,0)","(6,−2)","(5,−1)","(2,2)"],0,"P=((2·10+3·0)/5,(2·(−6)+3·4)/5)=(4,0)."],["Which principle underlies section formula?",["Same weighted ratio applies to x and y separately","Only x-coordinates matter","Coordinates must be equal","Coordinates are multiplied without division"],0,"Both coordinates follow the same ratio-weighted average."],["Find midpoint of A(−5,2), B(5,12).",["(0,7)","(5,7)","(0,5)","(−5,7)"],0,"((−5+5)/2,(2+12)/2)=(0,7)."],["A(4,−1), B(16,8), ratio 2:1. Find P.",["(12,5)","(10,4)","(8,3)","(14,6)"],0,"P=((2·16+4)/3,(2·8−1)/3)=(12,5)."],["If AP:PB=1:3, P lies:",["One-quarter of the way from A to B","Three-quarters of the way from A to B","At the midpoint","Beyond B"],0,"There are four ratio parts in total, and AP is one part."],["A(2,6), B(12,1), ratio 3:2. Find y-coordinate.",["3","4","5","2"],0,"y=(3·1+2·6)/5=3."],["Midpoint x-coordinate of A(x₁,y₁), B(x₂,y₂) is:",["(x₁+x₂)/2","(x₁−x₂)/2","x₁+x₂","x₁x₂/2"],0,"The midpoint averages the x-coordinates."],["P(6,4) divides A(2,2), B(10,6) internally. Find ratio.",["1:1","1:2","2:1","3:2"],0,"P is halfway in both coordinates, so AP=PB."],["Find midpoint of A(1,−4), B(11,6).",["(6,1)","(5,1)","(6,2)","(12,2)"],0,"((1+11)/2,(−4+6)/2)=(6,1)."],["For internal ratio 2:3, coefficient of A in section formula is:",["3","2","5","6"],0,"A is weighted by the opposite ratio part n=3."],["A(−2,3), B(6,11), ratio 1:3. Find P.",["(0,5)","(2,7)","(4,9)","(1,6)"],0,"P=((6+3(−2))/4,(11+3·3)/4)=(0,5)."],["P is one-third of the way from A(0,0) to B(9,12). Find P.",["(3,4)","(6,8)","(4,3)","(9,12)"],0,"One-third of coordinate changes gives (9/3,12/3)=(3,4)."],["Find midpoint of A(−6,2), B(4,12).",["(−1,7)","(−2,5)","(1,7)","(−1,5)"],0,"((−6+4)/2,(2+12)/2)=(−1,7)."],["A(2,5), B(8,−1), ratio 1:2. Find P.",["(4,3)","(6,1)","(5,2)","(3,4)"],0,"P=((8+2·2)/3,(−1+2·5)/3)=(4,3)."],["If internal ratio m:n has m=n, P is:",["The midpoint of AB","Always A","Always B","Outside segment AB"],0,"Equal ratio parts place P equally far from both end function safeInit(label, fn) {
 try { fn(); }
 catch (err) {
  console.error("SkillUp Maths init failed [" + label + "]:", err);
  const box = document.getElementById("app");
  if (box && !box.querySelector('[data-init-warning="' + label.replace(/[^a-z0-9_-]/gi, "-") + '"]')) {
   const warning = document.createElement("section");
   warning.className = "card";
   warning.dataset.initWarning = label.replace(/[^a-z0-9_-]/gi, "-");
   warning.innerHTML = '<div class="empty"><b>Some interactive content could not load.</b> The lesson and quiz may still be available. Refresh the page or report this error if it continues.</div>';
   box.prepend(warning);
  }
 }
}

   tri.setAttribute("d","M48 166 L48 "+y+" L"+right+" 166 Z");

function initSetRepresentationVirtualLab(){
 if(norm(concept)!=="set representation")return;
 const mode=document.getElementById("srMode"),limit=document.getElementById("srLimit");
 if(!mode||!limit)return;
 const put=(id,value)=>{const el=document.getElementById(id);if(el)el.textContent=value;};
 const update=()=>{
  const max=Number(limit.value),kind=mode.value;
  let values=[],rule="";
  if(kind==="even"){values=Array.from({length:Math.max(0,Math.floor(max/2))},(_,i)=>(i+1)*2);rule="x is even and 2 ≤ x ≤ "+max;}
  else if(kind==="odd"){values=Array.from({length:Math.max(0,Math.ceil(max/2))},(_,i)=>2*i+1).filter(x=>x<=max);rule="x is odd and 1 ≤ x ≤ "+max;}
  else if(kind==="multiples"){values=Array.from({length:Math.floor(max/3)},(_,i)=>(i+1)*3);rule="x is a multiple of 3 and 3 ≤ x ≤ "+max;}
  else {values=Array.from({length:Math.floor(Math.sqrt(max))},(_,i)=>(i+1)*(i+1));rule="x = n² for n ∈ ℕ and x ≤ "+max;}
  put("srLimitOut",max);put("srRoster",values.length?"{"+values.join(", ")+"}":"∅");put("srCount",values.length);
  put("srBuilder","A = {x ∈ ℕ | "+rule+"}");
  put("srExplanation",values.length+" distinct element"+(values.length===1?"":"s")+" satisfy the selected rule. "+(values.length?"Roster form lists them; set-builder form describes the same collection.":"No natural number in the chosen range satisfies this rule."));
 };
 mode.addEventListener("change",update);limit.addEventListener("input",update);update();
}

 slider.addEventListener("input",update);document.querySelectorAll(".amPreset").forEach(btn=>btn.addEventListener("click",()=>{slider.value=btn.dataset.deg;update();}));update();

function initTrigonometricFunctionsLab(){
 if(norm(concept)!=="trigonometric functions")return;
 const angle=document.getElementById("tfAngle");if(!angle)return;
 const put=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
 const fmt=n=>Math.abs(n)<0.00005?"0":n.toFixed(4);
 const update=()=>{
  const deg=Number(angle.value),rad=deg*Math.PI/180,c=Math.cos(rad),sn=Math.sin(rad),t=Math.abs(c)<1e-10?null:sn/c;
  const x=150+78*c,y=118-78*sn;
  put("tfAngleOut",deg);put("tfCos",fmt(c));put("tfSin",fmt(sn));put("tfTan",t===null?"Undefined":fmt(t));
  put("tfQuadrant",Math.abs(sn)<1e-8?(c>0?"Positive x-axis":"Negative x-axis"):Math.abs(c)<1e-8?(sn>0?"Positive y-axis":"Negative y-axis"):c>0?(sn>0?"I":"IV"):(sn>0?"II":"III"));
  put("tfExplain","At "+deg+"°, the unit-circle point is approximately ("+fmt(c)+", "+fmt(sn)+"). "+(t===null?"Tangent is undefined because cos θ = 0.": "tan θ = sin θ / cos θ = "+fmt(t)+"."));
  const point=document.getElementById("tfPoint"),radius=document.getElementById("tfRadius"),dx=document.getElementById("tfDropX"),dy=document.getElementById("tfDropY"),label=document.getElementById("tfPointLabel");
  if(point){point.setAttribute("cx",x);point.setAttribute("cy",y);}
  if(radius)radius.setAttribute("d","M150 118 L"+x+" "+y);
  if(dx)dx.setAttribute("d","M"+x+" "+y+"V118");
  if(dy)dy.setAttribute("d","M150 "+y+"H"+x);
  if(label){label.setAttribute("x",x+(c>=0?7:-48));label.setAttribute("y",y+(sn>=0?-8:15));label.textContent="("+fmt(c)+", "+fmt(sn)+")";}
 };
 angle.addEventListener("input",update);update();
}

function initCartesianProductVirtualLab(){
