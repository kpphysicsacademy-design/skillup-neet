 square of 25?",["125","500","625","650"],2,"25 × 25 = 625."],["Which expression equals 11²?",["11 + 11","11 × 11","2 × 11","121 + 11"],1,"A square means multiplying the number by itself."],["Which number has square root 13?",["156","169","196","219"],1,"13² = 169."],["Between which two consecutive integers does √50 lie?",["5 and 6","6 and 7","7 and 8","8 and 9"],2,"49 < 50 < 64, so 7 < √50 < 8."],["A perfect square has:",["An integer square root","Only an even square root","A negative square root only","No square root"],0,"A perfect square is the square of an integer."],["What is 18²?",["324","288","316","342"],0,"18 × 18 = 324."]];

<p><b>Division:</b> multiply by the reciprocal of the divisor.</p>

<p style="margin-bottom:0;color:#66736b"><b>Important:</b> simplify the final answer. Division by zero is undefined.</p>`;
