 rational numbers, which operation is commutative?",["Subtraction","Division","Addition","None"],2,"Addition is commutative: a + b = b + a."],["For rational numbers, which operation is also commutative?",["Division","Multiplication","Subtraction","None"],1,"Multiplication is commutative: ab = ba."],["Which operation is not commutative for rational numbers?",["Addition","Multiplication","Subtraction","Both addition and multiplication"],2,"In general, a − b is not equal to b − a."],["Which operation is not associative for rational numbers?",["Addition","Multiplication","Subtraction","Both addition and multiplication"],2,"Subtraction is generally not associative."],["Which operation is not associative for rational numbers?",["Addition","Multiplication","Division","Both addition and multiplication"],2,"Division is generally not associative."],["Which statement about closure under addition is correct?",["The sum of two rational numbers is rational","The sum is always an integer","The sum is never zero","The sum is irrational"],0,"Adding two rational numbers produces another rational number."],["Which statement about closure under subtraction is correct?",["The difference of two rational numbers is rational","The difference is always positive","The difference is always an integer","The difference is irrational"],0,"Subtracting two rational numbers produces another rational number."],["Which statement about closure under multiplication is correct?",["The product of two rational numbers is rational","The product is always positive","The product is never zero","The product is irrational"],0,"Multiplying two rational numbers gives a rational number."],["When is division of rational numbers closed within the rational numbers?",["Only when the dividend is zero","When the divisor is non-zero","Only when both numbers are positive","Never"],1,"Division by a non-zero rational number gives a rational result."],["Which equation shows associativity of addition?",["1/2 + 1/3 = 1/3 + 1/ function mathifyText(s){
 let t=String(s);
 // Normalize repeated MathJax delimiters, then never wrap an already-delimited expression again.
 t=t.replace(/(?:\\\(){2,}/g,"\\(").replace(/(?:\\\)){2,}/g,"\\)");
 if(t.includes("\\(")||t.includes("\\["))return t;
 t=t.replace(/([A-Za-z0-9]+)²/g,"$1^2").replace(/([A-Za-z0-9]+)³/g,"$1^3");
 t=t.replace(/√\s*([−-]?[0-9]+(?:\.[0-9]+)?)/g,"\\sqrt{$1}");
 t=t.replace(/∛\s*([−-]?[0-9]+(?:\.[0-9]+)?)/g,"\\sqrt[3]{$1}");
 t=t.replace(/([−-]?[0-9]+)\s*\/\s*([−-]?[0-9]+)/g,"\\frac{$1}{$2}");
 const term="(?:[−-]?[0-9]*[A-Za-z](?:\\^[0-9]+)?|[−-]?[0-9]+(?:\\.[0-9]+)?)";
 const mathPattern=new RegExp("("+term+"(?:[ \t]*[+−\\-×÷=<>][ \t]*(?:"+term+"|\\([^()]+\\)))+|\\([^()]+\\)(?:\\^[0-9]+)?)","g");
 t=t.replace(mathPattern,function(m){return "\\("+m+"\\)";});
 return t;
}
function mathifyOption(s){

 if(/[²³^√∛]/.test(t) || (/[+−×÷=]/.test(t) && /[A-Za-z0-9]/.test(t)) || /^\s*[−-]?\d+\s*\/\s*[−-]?\d+\s*$/.test(t)){
  t=t.replace(/([A-Za-z0-9]+)²/g,"$1^2").replace(/([A-Za-z0-9]+)³/g,"$1^3");
  t=t.replace(/√\s*([−-]?\d+(?:\.\d+)?)/g,"\\sqrt{$1}");
  t=t.replace(/∛\s*([−-]?\d+(?:\.\d+)?)/g,"\\sqrt[3]{$1}");
  return "\\("+t+"\\)";
 }

}
function mathifyDom(root){
 const walker=document.createTreeWalker(root,4);
 const nodes=[];
 let node;
 while(node=walker.nextNode())nodes.push(node);
 nodes.forEach(function(n){
  if(!n.nodeValue||n.nodeValue.includes("\\(")||n.nodeValue.includes("\\["))return;
  const p=n.parentElement;
  if(!p||p.closest("script,style,textarea,mjx-container"))return;
  const out=mathifyText(n.nodeValue);
  if(out!==n.nodeValue)n.nodeValue=out;
 });
}

<p style="margin-bottom:0;color:#66736b"><b>Remember:</b> the exponent tells how many times the base is used as a factor. \\(a^1=a\\) and for non-zero \\(a\\), \\(a^0=1\\).</p>`;
 if(norm(concept)==="squares and square roots") return `
<strong>A square is the product of a number multiplied by itself. A square root asks which non-negative number produces a given perfect square.</strong>
<div class="formula">\\(a^2=a\\times a\\)</div>
<p>For example, \\(6^2=36\\). Therefore \\(\\sqrt{36}=6\\). The numbers 1, 4, 9, 16, 25, 36, ... are perfect squares.</p>
<div class="formula">\\(\\sqrt{a^2}=|a|\\)</div>
<p><b>Perfect square:</b> its square root is an integer. <b>Non-perfect square:</b> its square root is not an integer.</p>
<p><b>Useful facts:</b> the square of an even number is even, the square of an odd number is odd, and a perfect square has an integer square root.</p>`;
 if(norm(concept)==="properties of rational numbers") return `
<strong>Rational numbers follow important properties that make calculations consistent and predictable.</strong>
<div class="formula">\\(a+b=b+a\\quad\\text{and}\\quad a\\times b=b\\times a\\)</div>
<p><b>Commutative:</b> changing the order does not change the sum or product.</p>
<div class="formula">\\((a+b)+c=a+(b+c)\\quad\\text{and}\\quad(a\\times b)\\times c=a\\times(b\\times c)\\)</div>
<p><b>Associative:</b> changing the grouping does not change the result.</p>
<div class="formula">\\(a+0=a,\\quad a\\times1=a,\\quad a+(-a)=0\\)</div>
<p style="margin-bottom:0;color:#66736b"><b>Key idea:</b> rational numbers are closed under addition, subtraction and multiplication; division is closed when the divisor is non-zero.</p>`;
 if(norm(concept)==="terms and coefficients") return `
<strong>Every algebraic expression is built from terms, and each variable term has a coefficient.</strong>
<div class="formula">\\(5x + 3y - 7\\)</div>
<p>In <b>5x + 3y - 7</b>, the three terms are <b>5x</b>, <b>3y</b>, and <b>-7</b>.</p>
<div class="visual-banner">
  <div class="value-box"><small>TERM</small><strong style="color:#60a5fa">5x</strong><span class="pill">coefficient = 5</span></div>
  <div class="eq">+</div>
  <div class="value-box"><small>TERM</small><strong style="color:#60a5fa">3y</strong><span class="pill">coefficient = 3</span></div>
  <div class="eq">−</div>
  <div class="value-box"><small>CONSTANT TERM</small><strong style="color:#fbbf24">7</strong><span class="pill">coefficient = 7</span></div>
</div>
<p><b>Term:</b> a part of an expression separated by + or − signs.</p>
<p><b>Coefficient:</b> the numerical factor multiplying a variable. For example, the coefficient of <b>x</b> in <b>-4x</b> is <b>-4</b>.</p>
<p><b>Special case:</b> when no number is written, the coefficient is 1. So <b>x = 1x</b>.</p>
<p style="margin-bottom:0;color:#66736b"><b>Remember:</b> the sign belongs to the term. In <b>6a − 2b + 9</b>, the terms are <b>6a</b>, <b>−2b</b>, and <b>9</b>.</p>
`;
if(norm(concept)==="algebraic expressions") return `
<strong>An algebraic expression combines numbers, variables, and operations without an equals sign.</strong>
<div class="formula">\\(3x+5\\)</div>
<p>In \\(3x+5\\), <b>3</b> is the coefficient of \\(x\\), <b>x</b> is the variable, and <b>5</b> is the constant term.</p>
<div class="visual-banner"><div class="value-box"><small>COEFFICIENT</small><strong style="color:#60a5fa">3</strong><span class="pill">multiplies x</span></div><div class="eq">×</div><div class="value-box"><small>VARIABLE</small><strong style="color:#60a5fa">x</strong><span class="pill">can change</span></div><div class="eq">+</div><div class="value-box"><small>CONSTANT</small><strong style="color:#fbbf24">5</strong><span class="pill">fixed</span></div></div>
<p><b>Terms:</b> the parts separated by + or − are terms. So \\(3x+5\\) has two terms: \\(3x\\) and \\(5\\).</p>
<p><b>Examples:</b> \\(7a-2\\), \\(4m+3n\\), and \\(9x^2-5x+1\\) are algebraic expressions.</p>
<p style="margin-bottom:0;color:#66736b"><b>Remember:</b> an expression does not have an equals sign. A term may contain a coefficient, variable, and exponent.</p>`;

function startExplorer(){if(norm(concept)==="triangles"){
 const A=document.getElementById("triA"),B=document.getElementById("triB"); if(!A||!B)return;
 function updateTR(){
  let a=+A.value,b=+B.value,c=180-a-b;if(c<1){c=1;b=179-a;B.value=b;}
  const max=Math.max(a,b,c),right=[a,b,c].some(v=>v===90),obtuse=max>90,acute=!right&&!obtuse;
  const angleType=right?"Right":obtuse?"Obtuse":"Acute",equil=a===60&&b===60&&c===60,isos=a===b||b===c||a===c;
  const sideType=equil?"Equilateral":isos?"Isosceles":"Scalene";
  document.getElementById("triAVal").textContent=a+"°";document.getElementById("triBVal").textContent=b+"°";document.getElementById("triCVal").textContent=c+"°";document.getElementById("triAS").textContent=a+"°";document.getElementById("triBS").textContent=b+"°";document.getElementById("triType").textContent=angleType+" triangle";document.getElementById("triClass").textContent=sideType+" • "+angleType;
  const cx=160,baseY=160,base=180,scale=0.9,rad=a*Math.PI/180,px=160+70*Math.cos((180-b)*Math.PI/180),py=baseY-70*Math.sin((180-b)*Math.PI/180);
  document.getElementById("triPoly").setAttribute("points","70,"+baseY+" "+(70+base)+","+baseY+" "+px.toFixed(1)+","+py.toFixed(1));
  document.getElementById("triWork").innerHTML="<b>Angle sum:</b> \\("+a+"^\\circ+"+b+"^\\circ+"+c+"^\\circ=180^\\circ\\). Classification: "+sideType+" "+angleType+" triangle.";scheduleMath();
 }
 A.addEventListener("input",updateTR);B.addEventListener("input",updateTR);document.querySelectorAll(".triP").forEach(btn=>btn.addEventListener("click",()=>{A.value=btn.dataset.a;B.value=btn.dataset.b;updateTR();}));updateTR();return;
}

 const qno=document.getElementById("qno"),q=document.getElementById("question"),opts=document.getElementById("options"),fb=document.getElementById("feedback"),ex=document.getElementById("explain"),next=document.getElementById("next");
 function render(){answered=false;next.disabled=true;fb.textContent="";ex.textContent="";ex.style.display="none";const item=questions[i];qno.textContent="MASTERY PRACTICE • "+(i+1);q.innerHTML=mathifyText(item[0]);opts.innerHTML=item[1].map((o,j)=>'<button class="opt" data-i="'+j+'">'+mathifyOption(esc(o))+'</button>').join("");document.getElementById("qp").textContent="Question "+(i+1)+" of "+total;document.getElementById("qf").style.width=(i/total*100)+"%";document.getElementById("qs").textContent="Score "+score;opts.querySelectorAll(".opt").forEach(btn=>btn.addEventListener("click",()=>answer(+btn.dataset.i)));if(window.MathJax&&window.MathJax.typesetPromise)window.MathJax.typesetPromise([q,opts]).catch(()=>{})}
 function answer(j){if(answered)return;answered=true;const item=questions[i],correct=item[2];opts.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k===correct)b.classList.add("correct");else if(k===j)b.classList.add("wrong")});if(j===correct){score++;fb.textContent="Correct";}else fb.textContent="Review the highlighted answer";ex.innerHTML=mathifyText(esc(item[3]||""));ex.style.display="block";next.disabled=false;document.getElementById("qs").textContent="Score "+score;scheduleMath()}
 next.addEventListener("click",()=>{i++;if(i>=total){host.innerHTML='<div class="result"><div class="score">'+score+' / '+total+'</div><p>Mastery quiz complete for <b>'+esc(title)+'</b>.</p><button class="next" id="again">Try Again</button></div>';document.getElementById("again").onclick=()=>startQuiz();return}render()});render();
}
startExplorer();startQuiz();refreshMath();whenMathJaxReady();
window.addEventListener("load",function(){whenMathJaxReady();});
})();
