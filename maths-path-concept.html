<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SkillUp Mathematics — Concept Quiz</title>
<script>
window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]},svg:{fontCache:'global'}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
:root{
 --green:#58cc02;--green2:#46a302;--blue:#1cb0f6;--navy:#183b63;
 --ink:#263238;--muted:#718096;--line:#dfe7ee;--bg:#f5f9fc;
 --red:#ff4b4b;--card:#fff;--gold:#ffc800
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.top{height:64px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.nav{max-width:920px;height:64px;margin:auto;padding:0 14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.brand{font-weight:950;font-size:19px;color:var(--navy);white-space:nowrap}
.back{justify-self:start;text-decoration:none;color:var(--muted);font-weight:900;font-size:13px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.back:hover{border-color:#9ec6df;color:var(--navy)}
.navRight{justify-self:end;display:flex;align-items:center;gap:7px}
.navBadge{font-size:11px;font-weight:950;color:#338700;background:#eef8e9;padding:7px 10px;border-radius:999px}
.wrap{max-width:820px;margin:auto;padding:18px 14px 90px}
.hero,.quiz,.result{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 5px 18px #183b6310}
.hero{padding:20px 22px;margin-bottom:14px}
.eyebrow{font-size:11px;font-weight:950;letter-spacing:1px;color:var(--muted)}
h1{margin:5px 0 8px;font-size:clamp(30px,7vw,44px);line-height:1.05;color:var(--navy)}
.subtitle{color:var(--muted);font-weight:650;line-height:1.5}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.meta span{font-size:11px;font-weight:850;color:#52616f;background:#f2f6f9;border:1px solid #e2e9ee;padding:6px 9px;border-radius:999px}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.pill{padding:7px 11px;border-radius:999px;background:#eef8e9;color:#338700;font-size:11px;font-weight:900}
.progress{height:10px;background:#e8eef3;border-radius:99px;overflow:hidden;margin-top:16px}
.progress>span{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:.25s}
.progressLabel{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;font-weight:850;color:var(--muted)}
.quiz{padding:22px;margin-bottom:14px}
.quizhead{display:flex;align-items:center;gap:12px}
.level{flex:1;font-size:11px;font-weight:950;letter-spacing:1px;color:var(--muted)}
.qnum{font-size:14px;font-weight:950;color:var(--navy)}
.qtext{font-size:clamp(21px,5vw,27px);line-height:1.4;font-weight:900;margin:24px 0 20px;min-height:1.4em}
.answers{display:grid;gap:11px}
.ans{position:relative;width:100%;min-height:58px;border:2px solid var(--line);background:#fff;border-radius:17px;padding:13px 15px 13px 52px;text-align:left;font-size:16px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 #e3e9ee;transition:.12s}
.ans:before{content:attr(data-letter);position:absolute;left:14px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:2px solid #cbd7e0;border-radius:9px;display:grid;place-items:center;font-size:12px;color:var(--muted);font-weight:950}
.ans:hover{border-color:#9ec6df;transform:translateY(-1px)}
.ans:disabled{cursor:default;transform:none}
.ans.correct{border-color:var(--green);background:#effbe9;box-shadow:0 2px 0 var(--green2)}
.ans.correct:before{border-color:var(--green);color:var(--green2)}
.ans.wrong{border-color:var(--red);background:#fff0f0;box-shadow:0 2px 0 #d83a3a}
.ans.wrong:before{border-color:var(--red);color:var(--red)}
.feedback{display:none;margin-top:14px;padding:14px 16px;border-radius:15px;background:#f5f8fb;line-height:1.55;font-weight:650}
.feedback strong{color:var(--navy)}
.actions{display:flex;justify-content:flex-end;margin-top:16px}
.continue{display:none;border:0;border-radius:15px;background:var(--green);box-shadow:0 4px 0 var(--green2);color:#fff;padding:13px 23px;font-size:15px;font-weight:950;cursor:pointer}
.continue:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green2)}
.result{display:none;padding:30px 22px;text-align:center}
.trophy{font-size:52px}
.result h2{margin:5px 0 8px;color:var(--navy);font-size:30px}
.score{font-size:22px;font-weight:950}
.result .pills{justify-content:center}
.analytics{margin:18px auto;max-width:560px;line-height:1.6;font-weight:700;color:#52616f}
.retry{display:inline-block;border:0;margin-top:5px;background:var(--navy);color:#fff;text-decoration:none;padding:13px 22px;border-radius:15px;font-weight:950}
.error{display:none;padding:20px;border-radius:18px;background:#fff0f0;border:2px solid #ffb0b0;color:#8d1d1d;font-weight:800;line-height:1.5}
@media(max-width:560px){
 .wrap{padding:12px 10px 70px}
 .hero,.quiz,.result{border-radius:20px;padding:18px}
 .qtext{font-size:20px}
 .ans{font-size:15px;min-height:56px}
}
</style>
</head>
<body>
<header class="top"><nav class="nav">
 <a class="back" href="maths-home.html">← Maths Path</a>
 <span class="brand">SkillUp Mathematics</span>
 <div class="navRight"><span class="navBadge">CONCEPT QUIZ</span></div>
</nav></header>
<main class="wrap">
<section class="hero">
 <div class="eyebrow">MATHEMATICS • CONCEPT PRACTICE</div>
 <h1 id="conceptTitle">Loading…</h1>
 <div class="progress"><span id="progressBar"></span></div><div class="progressLabel"><span id="progressText">Question 1 of 10</span><span>Mastery practice</span></div>
</section>

<div id="errorBox" class="error"></div>

<section class="quiz" id="quiz">
 <div class="quizhead"><div class="level">🎯 PRACTICE</div><div class="qnum" id="qnum">1 / 10</div></div>
 <div id="question" class="qtext"></div>
 <div id="answers" class="answers"></div>
 <div id="feedback" class="feedback"></div>
 <div class="actions"><button id="continue" class="continue">Continue →</button></div>
</section>

<section class="result" id="result">
 <div class="trophy" id="resultIcon">🏆</div>
 <h2 id="resultTitle">Quiz complete!</h2>
 <div class="score" id="finalScore"></div>
 <div class="pills">
  <span class="pill" id="accuracyStat">Accuracy 0%</span>
  <span class="pill" id="correctStat">Correct 0</span>
  <span class="pill" id="timeStat">Time 0s</span>
 </div>
 <div class="analytics" id="analyticsSummary"></div>
 <a class="retry" id="retry" href="#">Try again</a>
</section>
</main>

<script src="central-config.js?v=20260909fb3"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="central-auth.js?v=20260910authfix4"></script>
<script src="iit-maths-path-curriculum.js?v=20261005"></script>
<script src="maths-question-bank.js?v=20261005-safe21"></script>
<script>
(function(){
"use strict";
const qs=new URLSearchParams(location.search);
const concept=(qs.get("concept")||"Natural numbers").trim();
const $=id=>document.getElementById(id);
$("conceptTitle").textContent=concept;
$("retry").href=location.href;

let skillUpSession=null;
(async function(){
 try{
  if(window.SkillUpAuth&&window.SkillUpAuth.configured){
   skillUpSession=await window.SkillUpAuth.requireAuth(location.href);
  }
 }catch(e){console.warn("Authentication check failed; quiz remains usable.",e);}
})();

function validQuizBank(list){
 if(!Array.isArray(list)||list.length!==10)return false;
 const seenQ=new Set();
 return list.every(function(q){
  if(!Array.isArray(q)||q.length<4)return false;
  if(typeof q[0]!=="string"||!q[0].trim()||seenQ.has(q[0].trim()))return false;
  seenQ.add(q[0].trim());
  if(!Array.isArray(q[1])||q[1].length!==4)return false;
  const opts=q[1].map(x=>String(x).trim());
  if(opts.some(x=>!x)||new Set(opts).size!==4)return false;
  return Number.isInteger(q[2])&&q[2]>=0&&q[2]<4&&typeof q[3]==="string"&&q[3].trim().length>0;
 });
}

let questions=window.SKILLUP_MATHS_QUIZ_BANK&&window.SKILLUP_MATHS_QUIZ_BANK[concept];
if(!validQuizBank(questions)){
 $("quiz").style.display="none";
 $("errorBox").style.display="block";
 $("errorBox").textContent="This concept quiz is unavailable because its question bank failed validation. Please return to the Maths path and try again.";
 console.error("Invalid or missing Maths quiz bank:",concept,questions);
 return;
}

let i=0,score=0,answered=false;
const startedAt=Date.now();

function typeset(){
 if(window.MathJax&&window.MathJax.typesetPromise) window.MathJax.typesetPromise().catch(()=>{});
}
function render(){
 answered=false;
 $("continue").style.display="none";
 $("feedback").style.display="none";
 $("feedback").textContent="";
 $("qnum").textContent=(i+1)+" / "+questions.length;
 $("progressText").textContent="Question "+(i+1)+" of "+questions.length;
 $("progressBar").style.width=((i)/questions.length*100)+"%";
 const q=questions[i];
 $("question").innerHTML=q[0];
 $("answers").textContent="";
 q[1].forEach(function(option,n){
  const b=document.createElement("button");
  b.type="button"; b.className="ans";
  b.dataset.letter=String.fromCharCode(65+n);
  b.innerHTML=option;
  b.addEventListener("click",()=>answer(n,b));
  $("answers").appendChild(b);
 });
 typeset();
}
function answer(n,button){
 if(answered)return;
 answered=true;
 const q=questions[i];
 [...$("answers").children].forEach(function(b,k){
  b.disabled=true;
  if(k===q[2])b.classList.add("correct");
 });
 const correct=n===q[2];
 if(correct)score++; else button.classList.add("wrong");
 $("feedback").innerHTML=(correct?"Correct — ":"Review this one — ")+q[3];
 $("feedback").style.display="block";
 typeset();
 $("continue").textContent=i===questions.length-1?"Finish ✓":"Continue →";
 $("continue").style.display="inline-block";
}
async function finish(){
 const total=questions.length;
 const accuracy=Math.round(score/total*100);
 const time=Math.max(1,Math.round((Date.now()-startedAt)/1000));
 $("progressBar").style.width="100%";
 $("progressText").textContent="Completed — 10 of 10";
 $("quiz").style.display="none";
 $("result").style.display="block";
 $("finalScore").textContent=score+" / "+total+" correct";
 $("accuracyStat").textContent="Accuracy "+accuracy+"%";
 $("correctStat").textContent="Correct "+score;
 $("timeStat").textContent="Time "+time+"s";
 $("resultIcon").textContent=accuracy>=90?"🏆":accuracy>=70?"⭐":"💪";
 $("resultTitle").textContent=accuracy>=90?"Excellent work!":accuracy>=70?"Good progress!":"Keep practising!";
 $("analyticsSummary").textContent=accuracy>=90
  ?"Excellent mastery — this concept is ready for the next level."
  :accuracy>=70
  ?"Good progress — review the missed questions once, then continue."
  :"Review this concept and try the quiz again to strengthen mastery.";
 if(skillUpSession&&window.SkillUpAuth&&window.SkillUpAuth.saveProgress){
  try{
   await window.SkillUpAuth.saveProgress({
    subject:"Mathematics",topic:concept,score:score,total:total,accuracy:accuracy,
    time_seconds:time,completed:true,source:"maths-path-concept",
    completed_at:new Date().toISOString()
   });
   $("analyticsSummary").textContent+=" Progress saved to your SkillUp account.";
  }catch(e){console.warn("Progress save failed",e);}
 }
}
document.addEventListener("keydown",function(e){
 if(answered && (e.key==="Enter" || e.key===" ")){e.preventDefault();$("continue").click();return;}
 if(!answered && /^[1-4]$/.test(e.key)){const n=Number(e.key)-1;const btn=$("answers").children[n];if(btn)btn.click();}
});
$("continue").addEventListener("click",function(){
 if(i<questions.length-1){i++;render();window.scrollTo({top:0,behavior:"smooth"});}
 else finish();
});
render();
})();
</script>
</body>
</html>
