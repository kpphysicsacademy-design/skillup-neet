function mathifyText(s){
 let t=String(s);

 if(!t.includes("\\(")&&!t.includes("\\["))t=t.replace(/\\\)/g,"");

 }

 t=t.replace(/([A-Za-z0-9]+)\^\{?(\d+)\}?/g,"\\($1^{$2}\\)");
 t=t.replace(/√\\s*([−-]?\\d+(?:\\.\\d+)?)/g,"\\(\\sqrt{$1}\\)");
 t=t.replace(/∛\\s*([−-]?\\d+(?:\\.\\d+)?)/g,"\\(\\sqrt[3]{$1}\\)");
 const term="(?:\\\\([^()]+\\\\)(?:\\^\\\\{?\\d+\\\\}?)?|[−-]?\\d*[A-Za-z](?:\\^\\\\{?\\d+\\\\}?)?|[−-]?\\d+(?:\\.\\d+)?(?:\\^\\\\{?\\d+\\\\}?)?)";
 const expr=new RegExp("(?<![A-Za-z0-9])("+term+"(?:\\\\s*[+−\\-×÷=<>]\\\\s*"+term+")+)(?![A-Za-z0-9])","g");
 t=t.replace(expr,"\\($1\\)");
 t=t.replace(/([−-]?\d+)\s*\/\s*([−-]?\d+)/g,"\\(\\frac{$1}{$2}\\)");
 return t;
}

function mathifyDom(root){
 const walker=document.createTreeWalker(root,4);
 const nodes=[];
 let node;
 while(node=walker.nextNode())nodes.push(node);
 nodes.forEach(function(n){
  if(!n.nodeValue||n.nodeValue.includes("\\(")||n.nodeValue.includes("\\["))return;
  const p=n.parentElement;
  if(!p||p.closest("script,style,textarea,mjx-container,.peP,.sqP,.quiz-section,.cube-lesson"))return;
  const out=mathifyText(n.nodeValue);
  if(out!==n.nodeValue)n.nodeValue=out;
 });
}

if(norm(concept)==="polygons") return `
<strong>A polygon is a closed plane figure made only from straight line segments.</strong>
<div class="formula">\\(n\\text{ sides}\\Rightarrow n\\text{ vertices and }n\\text{ interior angles}\\)</div>
<p><b>Classify by sides:</b> 3 = triangle, 4 = quadrilateral, 5 = pentagon, 6 = hexagon, 7 = heptagon, 8 = octagon, 9 = nonagon, 10 = decagon.</p>
<p><b>Regular vs irregular:</b> a regular polygon has all sides equal and all interior angles equal. An irregular polygon does not have this complete equality.</p>
<p><b>Convex vs concave:</b> a convex polygon has every interior angle less than \\(180^\\circ\\). A concave polygon has at least one interior angle greater than \\(180^\\circ\\).</p>
<div class="formula">\\(\\text{Interior-angle sum}=(n-2)\\times180^\\circ\\)</div>
<p>For a regular polygon, every interior angle is equal, so:</p>
<div class="formula">\\(\\text{Each interior angle}=\\frac{(n-2)\\times180^\\circ}{n}\\)</div>
<div class="formula">\\(\\text{Each exterior angle of a regular polygon}=\\frac{360^\\circ}{n}\\)</div>
<p><b>Diagonals:</b> a diagonal joins two non-adjacent vertices. The number of diagonals is:</p>
<div class="formula">\\(D=\\frac{n(n-3)}{2}\\)</div>
<div class="concept-image" role="img" aria-label="Regular hexagon diagram showing six equal sides, six equal angles and diagonals">

</div>

if(norm(concept)==="factorisation basics") return `
<strong>Factorisation means writing an algebraic expression as a product of simpler factors.</strong>
<div class="formula">\\(6x+12=6(x+2)\\)</div>
<p><b>Common factor:</b> find the greatest common factor of all terms, then take it outside the brackets.</p>
<div class="formula">\\(8a^2+12a=4a(2a+3)\\)</div>
<p><b>Grouping:</b> group terms that share a common factor and then factor the common expression.</p>
<div class="formula">\\(x^2+5x=x(x+5)\\)</div>
<p><b>Check:</b> expand the factors again. If you get the original expression, the factorisation is correct.</p>
<div class="visual-banner"><div class="value-box"><small>EXPRESSION</small><strong style="color:#60a5fa">\\(6x+12\\)</strong><span class="pill">factorise</span></div><div class="eq">=</div><div class="value-box"><small>FACTORS</small><strong style="color:#fbbf24">\\(6(x+2)\\)</strong><span class="pill">product form</span></div></div>
<p style="margin-bottom:0;color:#66736b"><b>Remember:</b> factorisation is the reverse process of expansion.</p>`;

if(norm(concept)==="algebraic identities") return `
<strong>Algebraic identities are formulas that remain true for all allowed values of the variables.</strong>
<div class="formula">\\((a+b)^2=a^2+2ab+b^2\\)</div>
<p><b>Square of a sum:</b> square the first term, add twice the product, then add the square of the second term.</p>
<div class="formula">\\((a-b)^2=a^2-2ab+b^2\\)</div>
<p><b>Square of a difference:</b> the middle term is negative.</p>
<div class="formula">\\(a^2-b^2=(a+b)(a-b)\\)</div>
<p><b>Difference of two squares:</b> factor as the sum multiplied by the difference.</p>
<div class="visual-banner"><div class="value-box"><small>IDENTITY</small><strong style="color:#60a5fa">\\((a+b)^2\\)</strong><span class="pill">square of a sum</span></div><div class="eq">↔</div><div class="value-box"><small>EXPANDED</small><strong style="color:#fbbf24">\\(a^2+2ab+b^2\\)</strong><span class="pill">always equal</span></div></div>
<p><b>Example:</b> \\((x+3)^2=x^2+6x+9\\).</p>
<p style="margin-bottom:0;color:#66736b"><b>Remember:</b> an identity stays true when valid values are substituted.</p>`;

<div class="formula">\\(5x + 3y - 7\\)</div>
<p>In <b>5x + 3y - 7</b>, the three terms are <b>5x</b>, <b>3y</b>, and <b>-7</b>.</p>
<div class="visual-banner">
  <div class="value-box"><small>TERM</small><strong style="color:#60a5fa">5x</strong><span class="pill">coefficient = 5</span></div>

</div>
<p><b>Term:</b> a part of an expression separated by + or − signs.</p>
<p><b>Coefficient:</b> the numerical factor multiplying a variable. For example, the coefficient of <b>x</b> in <b>-4x</b> is <b>-4</b>.</p>
<p><b>Special case:</b> when no number is written, the coefficient is 1. So <b>x = 1x</b>.</p>
<p style="margin-bottom:0;color:#66736b"><b>Remember:</b> the sign belongs to the term. In <b>6a − 2b + 9</b>, the terms are <b>6a</b>, <b>−2b</b>, and <b>9</b>.</p>
`;

function startEquivalentDemo(){
 if(norm(concept)!=="equivalent rational numbers")return;
 const ns=document.getElementById("erNslider"),ds=document.getElementById("erDslider"),ks=document.getElementById("erKslider");

 const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
 function update(){

function startPropertiesDemo(){
 const pick=document.getElementById("prProperty");if(!pick)return;
 const sl=["prA","prB","prC","prD","prE","prF"].map(id=>document.getElementById(id));
 const eq=document.getElementById("prEquation"),out=document.getElementById("prWork"),status=document.getElementById("prStatus"),third=document.getElementById("prThirdControls"),thirdDen=document.getElementById("prThirdDenControl"),thirdProp=document.getElementById("prThirdProp");
 const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a||1};
 const q=(n,d)=>{if(!d)return null;if(d<0){n=-n;d=-d}const g=gcd(n,d);return[n/g,d/g]};
 const add=(x,y)=>q(x[0]*y[1]+y[0]*x[1],x[1]*y[1]),mul=(x,y)=>q(x[0]*y[0],x[1]*y[1]),neg=x=>q(-x[0],x[1]),div=(x,y)=>y[0]===0?null:q(x[0]*y[1],x[1]*y[0]);
 const fhtml=x=>!x?"<span>Undefined</span>":x[1]===1?"<span>"+x[0]+"</span>":"<span>"+x[0]+"</span><span>"+x[1]+"</span>";
 const ftext=x=>!x?"Undefined":x[1]===1?String(x[0]):x[0]+"/"+x[1];
 const F=x=>"<span class=\"stacked-fraction\">"+fhtml(x)+"</span>";
 const token=x=>Array.isArray(x)?F(x):(typeof x==="string"?"<span class=\"pr-op\">"+x+"</span>":x);
 const side=items=>"<span class=\"pr-side\">"+items.map(token).join("")+"</span>";
 function update(){
  const [an,b,cn,d,en,f]=sl.map(x=>Number(x.value)),a=q(an,b),c=q(cn,d),e=q(en,f),p=pick.value;
  document.getElementById("prAvN").textContent=an;document.getElementById("prBv").textContent=b;document.getElementById("prCvN").textContent=cn;document.getElementById("prDv").textContent=d;document.getElementById("prEvN").textContent=en;document.getElementById("prFv").textContent=f;
  document.getElementById("prAv").textContent=ftext(a);document.getElementById("prCv").textContent=ftext(c);document.getElementById("prEv").textContent=ftext(e);
  const show=["assocAdd","assocMul","dist"].includes(p);third.style.display=show?"":"none";thirdDen.style.display=show?"":"none";thirdProp.style.display=show?"":"none";
  let l,r,L,R,desc;
  if(p==="commAdd"){l=add(a,c);r=add(c,a);L=[a,"+",c];R=[c,"+",a];desc="Changing the order keeps the sum the same."}
  else if(p==="commMul"){l=mul(a,c);r=mul(c,a);L=[a,"×",c];R=[c,"×",a];desc="Changing the order keeps the product the same."}
  else if(p==="assocAdd"){l=add(add(a,c),e);r=add(a,add(c,e));L=["(",a,"+",c,")","+",e];R=[a,"+","(",c,"+",e,")"];desc="Changing the grouping keeps the sum the same."}
  else if(p==="assocMul"){l=mul(mul(a,c),e);r=mul(a,mul(c,e));L=["(",a,"×",c,")","×",e];R=[a,"×","(",c,"×",e,")"];desc="Changing the grouping keeps the product the same."}
  else if(p==="dist"){l=mul(a,add(c,e));r=add(mul(a,c),mul(a,e));L=[a,"×","(",c,"+",e,")"];R=[a,"×",c,"+",a,"×",e];desc="Multiplication distributes across addition."}
  else if(p==="addId"){l=add(a,[0,1]);r=a;L=[a,"+",[0,1]];R=[a];desc="Adding zero leaves a rational number unchanged."}
  else if(p==="mulId"){l=mul(a,[1,1]);r=a;L=[a,"×",[1,1]];R=[a];desc="Multiplying by one leaves a rational number unchanged."}
  else if(p==="inverse"){l=add(a,neg(a));r=[0,1];L=[a,"+",neg(a)];R=[[0,1]];desc="A rational number plus its additive inverse is zero."}
  else {l=div(a,c);r=l;L=[a,"÷",c];R=[l];desc=l?"The quotient is rational because the divisor is non-zero.":"Division by zero is undefined. Change the second numerator."}
  eq.innerHTML=side(L)+"<span class=\"pr-eq\">=</span>"+side(R);
  const ok=!!(l&&r&&l[0]===r[0]&&l[1]===r[1]);
  status.textContent=ok?"TRUE":"UNDEFINED";
  out.innerHTML="<b>Result:</b> "+(l&&r?F(l)+" <span class=\"pr-eq\">=</span> "+F(r)+". ":"")+desc;
 }
 [...sl,pick].forEach(x=>x.addEventListener("input",update));
 document.querySelectorAll(".prP").forEach(btn=>btn.addEventListener("click",()=>{pick.value=btn.dataset.p;sl[0].value=btn.dataset.a;sl[1].value=btn.dataset.b;sl[2].value=btn.dataset.c;sl[3].value=btn.dataset.d;sl[4].value=btn.dataset.e;sl[5].value=btn.dataset.f;update()}));
 update();
}
function startRationalOperationsDemo(){
 if(norm(concept)!=="operations on rational numbers")return;
 const op=document.getElementById("orOpSelect"),n1=document.getElementById("orNslider1"),d1=document.getElementById("orDslider1"),n2=document.getElementById("orNslider2"),d2=document.getElementById("orDslider2");
 if(!op||!n1||!d1||!n2||!d2)return;
 const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
 function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;}
 function frac(n,d){if(d<0){n=-n;d=-d;}const g=gcd(n,d);return [n/g,d/g];}
 function update(){
  const a=Number(n1.value),b=Math.max(1,Number(d1.value)),c=Number(n2.value),d=Math.max(1,Number(d2.value)),o=op.value;
  let rn,rd,formula;
  if(o==="+"){rn=a*d+c*b;rd=b*d;formula=a+" / "+b+" + "+c+" / "+d;}
  else if(o==="-"){rn=a*d-c*b;rd=b*d;formula=a+" / "+b+" − "+c+" / "+d;}
  else if(o==="*"){rn=a*c;rd=b*d;formula=a+" / "+b+" × "+c+" / "+d;}
  else{
   if(c===0){set("orResult","Undefined");const w=document.getElementById("orWork");if(w)w.innerHTML="<b>Result:</b> Division by zero is undefined. Change the second numerator.";return;}
   rn=a*d;rd=b*c;formula=a+" / "+b+" ÷ "+c+" / "+d;
  }
  const [sn,sd]=frac(rn,rd),value=rn/rd;
  const symbol=o==="+"?"+":o==="-"?"−":o==="*"?"×":"÷";
  set("orN1",a);set("orD1",b);set("orN2",c);set("orD2",d);set("orOp",symbol);
  set("orNv1",a);set("orDv1",b);set("orNv2",c);set("orDv2",d);set("orResult",value.toFixed(3));
  const w=document.getElementById("orWork");
  if(w)w.innerHTML="<b>Result:</b> "+formula+" = "+sn+" / "+sd+" = "+value.toFixed(3)+".";
 }
 [op,n1,d1,n2,d2].forEach(el=>el.addEventListener("input",update));
 document.querySelectorAll(".orP").forEach(btn=>btn.addEventListener("click",()=>{
  op.value=btn.dataset.op;n1.value=btn.dataset.n1;d1.value=btn.dataset.d1;n2.value=btn.dataset.n2;d2.value=btn.dataset.d2;update();
 }));
 update();
}

 }

  n1.value=btn.dataset.n1;d1.value=btn.dataset.d1;n2.value=btn.dataset.n2;d2.value=btn.dataset.d2;update();

function startPowersDemo(){
 if(norm(concept)!=="powers and exponents")return;
 const bs=document.getElementById("peBaseSlider"),es=document.getElementById("peExpSlider");
 if(!bs||!es)return;
 const set=(id,v,math=false)=>{const el=document.getElementById(id);if(el){if(math)el.innerHTML=v;else el.textContent=v;}};
 const typeset=()=>{
  const els=["peEquation","peBase","peExp","peValue","pePower","peExpanded","peBaseProp","peExpProp","peWork"]
   .map(id=>document.getElementById(id)).filter(Boolean);
  if(!window.MathJax)return;
  const run=()=>{try{window.MathJax.typesetClear(els);return window.MathJax.typesetPromise(els)}catch(_){return Promise.resolve()}};
  if(window.MathJax.startup&&window.MathJax.startup.promise)window.MathJax.startup.promise.then(run).catch(()=>{});
  else if(window.MathJax.typesetPromise)window.MathJax.typesetPromise(els).catch(()=>{});
 };
 function update(){
  const base=Math.max(1,Number(bs.value)),exp=Math.max(0,Number(es.value)),value=Math.pow(base,exp);
  const power="\\("+base+"^{"+exp+"}\\)";
  const expanded=exp===0?"\\(1\\)":"\\("+Array(exp).fill(base).join(" \\times ")+"\\)";
  const equation="\\("+base+"^{"+exp+"}="+value+"\\)";
  set("peEquation",equation,true);
  set("peBase","\\("+base+"\\)",true);
  set("peExp","\\("+exp+"\\)",true);
  set("peValue","\\("+value+"\\)",true);
  set("pePower",power,true);
  set("peExpanded",expanded,true);
  set("peBaseProp","\\("+base+"\\)",true);
  set("peExpProp","\\("+exp+"\\)",true);
  set("peBaseSliderVal",base);set("peExpSliderVal",exp);
  const work=document.getElementById("peWork");
  if(work)work.innerHTML="<b>Result:</b> "+power+" = "+expanded+" = \\("+value+"\\). The exponent tells how many times the base is used as a factor.";
  typeset();
 }
 bs.addEventListener("input",update);es.addEventListener("input",update);
 document.querySelectorAll(".peP").forEach(btn=>btn.addEventListener("click",()=>{bs.value=btn.dataset.b;es.value=btn.dataset.e;update();}));
 update();
}
function startRationalDemo(){
 if(norm(concept)!=="rational numbers")return;
 const ns=document.getElementById("rnslider"),ds=document.getElementById("rdslider");
 if(!ns||!ds)return;
 const nv=document.getElementById("rn"),dv=document.getElementById("rd");
 const topN=document.getElementById("rnNv"),topD=document.getElementById("rnDv"),value=document.getElementById("rnrval"),pill=document.getElementById("rnpill");
 const propN=document.getElementById("rnv"),propD=document.getElementById("rdv"),frac=document.getElementById("rfrac"),dec=document.getElementById("rdecimal"),work=document.getElementById("rwork");
 function update(){
  let n=Number(ns.value),d=Number(ds.value);
  if(d===0){d=1;ds.value="1";}
  const v=n/d;
  const fraction=n+" / "+d;
  const decimal=v.toFixed(3);
  [nv,topN,propN].forEach(el=>{if(el)el.textContent=n;});
  [dv,topD,propD].forEach(el=>{if(el)el.textContent=d;});
  if(value)value.textContent=decimal;
  if(pill)pill.textContent=fraction;
  if(frac)frac.textContent=fraction;
  if(dec)dec.textContent=decimal;
  if(work)work.innerHTML="<b>Result:</b> "+fraction+" = "+decimal+". The numerator is an integer and the denominator is a non-zero integer, so this is a rational number.";
 }
 ns.addEventListener("input",update);
 ds.addEventListener("input",update);
 update();
}
