</head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span></div><main><section class="hero"><h1>Patterns and Rules</h1><p class="muted">Learn to recognise number patterns, discover rules, find missing terms and solve growing-pattern problems.</p><div class="topic-actions"><a href="maths-patterns-rules-simulator.html?v=20261112-patterns-rules-simulator-v1">🧮 Open Patterns &amp; Rules Simulator</a></div></section><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Patterns and rules</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"What comes next in the pattern 2, 4, 6, 8, __?","o":["9","10","11","12"],"a":1,"e":"Add 2 each time, so the next number is 10.","v":"patterns-rules"},{"d":"BASIC","q":"Find the next number: 5, 10, 15, 20, __.","o":["22","24","25","30"],"a":2,"e":"The pattern increases by 5.","v":"patterns-rules"},{"d":"BASIC","q":"What is the rule for 3, 6, 9, 12, 15?","o":["Add 2","Add 3","Multiply by 3","Subtract 3"],"a":1,"e":"Each term is 3 more than the previous term.","v":"patterns-rules"},{"d":"BASIC","q":"Complete the pattern: 1, 4, 7, 10, __.","o":["11","12","13","14"],"a":2,"e":"Add 3 each time: 10 + 3 = 13.","v":"patterns-rules"},{"d":"BASIC","q":"Which number comes next: 10, 20, 30, 40, __?","o":["45","50","60","70"],"a":1,"e":"The pattern increases by 10.","v":"patterns-rules"},{"d":"BASIC","q":"A matchstick pattern uses 4 sticks for 1 square and 7 sticks for 2 joined squares. How many sticks are added for each new square?","o":["2","3","4","7"],"a":1,"e":"Each additional square shares one side, so it adds 3 sticks.","v":"patterns-rules"},{"d":"BASIC","q":"What comes next in 2, 4, 8, 16, __?","o":["18","24","30","32"],"a":3,"e":"Each term is doubled.","v":"patterns-rules"},{"d":"BASIC","q":"Find the missing number: 7, 14, __, 28, 35.","o":["18","20","21","24"],"a":2,"e":"The sequence adds 7 each time, so the missing number is 21.","v":"patterns-rules"},{"d":"BASIC","q":"Which pattern decreases by 2 each time?","o":["2, 4, 6, 8","9, 7, 5, 3","3, 6, 9, 12","1, 3, 5, 7"],"a":1,"e":"9 to 7 to 5 to 3 decreases by 2 each time.","v":"patterns-rules"},{"d":"BASIC","q":"If a pattern starts at 1 and adds 4 each time, what are its first four terms?","o":["1, 4, 8, 12","1, 5, 9, 13","1, 6, 10, 14","4, 8, 12, 16"],"a":1,"e":"Adding 4 repeatedly gives 1, 5, 9, 13.","v":"patterns-rules"},{"d":"MEDIUM","q":"Find the next term: 4, 8, 12, 16, __.","o":["18","20","22","24"],"a":1,"e":"The common difference is 4; 16 + 4 = 20.","v":"patterns-rules"},{"d":"MEDIUM","q":"A sequence follows the rule 'multiply by 2, then add 1' starting from 2. What is the next term after 5?","o":["8","10","11","12"],"a":2,"e":"Apply the rule to 5: 5 × 2 + 1 = 11.","v":"patterns-rules"},{"d":"MEDIUM","q":"The rule is add 6. If a term is 17, what is the next term?","o":["11","22","23","24"],"a":2,"e":"17 + 6 = 23.","v":"patterns-rules"},{"d":"MEDIUM","q":"A number pattern is 3, 6, 12, 24, __. What comes next?","o":["30","36","42","48"],"a":3,"e":"Each term is twice the previous term; 24 × 2 = 48.","v":"patterns-rules"},{"d":"MEDIUM","q":"Which expression gives the nth term for the pattern 2, 4, 6, 8, ... if n starts at 1?","o":["n + 2","2n","n²","2 + n"],"a":1,"e":"The terms are twice their position: term n = 2n.","v":"patterns-rules"},{"d":"MEDIUM","q":"A row of joined squares uses 4 sticks for 1 square, 7 for 2, and 10 for 3. How many sticks are needed for 4 squares?","o":["11","12","13","16"],"a":2,"e":"The pattern adds 3 sticks each time: 10 + 3 = 13.","v":"patterns-rules"},{"d":"MEDIUM","q":"What is the 6th term of the pattern 5, 10, 15, 20, ...?","o":["25","30","35","40"],"a":1,"e":"The terms are multiples of 5; the sixth term is 6 × 5 = 30.","v":"patterns-rules"},{"d":"MEDIUM","q":"A sequence starts at 30 and subtracts 4 each time. What is the 4th term?","o":["14","18","22","26"],"a":1,"e":"The terms are 30, 26, 22, 18.","v":"patterns-rules"},{"d":"MEDIUM","q":"Which rule creates 1, 3, 5, 7, 9, ...?","o":["Add 1","Add 2","Multiply by 2","Add 3"],"a":1,"e":"Each odd number is 2 more than the previous one.","v":"patterns-rules"},{"d":"MEDIUM","q":"The pattern is 100, 90, 80, 70, ... What is the 7th term?","o":["30","40","50","60"],"a":1,"e":"Continuing by subtracting 10 gives 100, 90, 80, 70, 60, 50, 40.","v":"patterns-rules"},{"d":"HARD","q":"A sequence starts at 2 and follows the rule 'multiply by 3'. What is the 4th term?","o":["18","27","54","81"],"a":2,"e":"The sequence is 2, 6, 18, 54.","v":"patterns-rules"},{"d":"HARD","q":"The pattern 1, 4, 9, 16, 25, ... follows which rule?","o":["Add 3 every time","Consecutive square numbers","Multiply each term by 4","Add 5 every time"],"a":1,"e":"These are 1², 2², 3², 4², 5².","v":"patterns-rules"},{"d":"HARD","q":"A tile pattern has 5 tiles in figure 1, 8 in figure 2, and 11 in figure 3. How many tiles are in figure 10 if the pattern continues?","o":["29","30","32","35"],"a":2,"e":"Add 3 each time; figure 10 has 5 + 9 × 3 = 32 tiles.","v":"patterns-rules"},{"d":"HARD","q":"The rule for a number machine is 'multiply the input by 4 and subtract 1'. What output does input 6 give?","o":["20","23","24","25"],"a":1,"e":"6 × 4 − 1 = 23.","v":"patterns-rules"},{"d":"HARD","q":"A sequence follows the rule add 5. Its 3rd term is 18. What is its 1st term?","o":["3","8","13","28"],"a":1,"e":"Work backwards: 18, 13, 8, so the first term is 8.","v":"patterns-rules"},{"d":"HARD","q":"A pattern is 2, 5, 10, 17, 26, __. What is the next term?","o":["35","36","37","38"],"a":2,"e":"The differences are 3, 5, 7, 9, so next add 11: 26 + 11 = 37.","v":"patterns-rules"},{"d":"HARD","q":"A sequence starts at 7 and adds 4 each time. Which term is 27?","o":["4th","5th","6th","7th"],"a":2,"e":"The sequence is 7, 11, 15, 19, 23, 27; 27 is the 6th term.","v":"patterns-rules"},{"d":"HARD","q":"A row pattern has 6 dots in figure 1 and increases by 4 dots per figure. How many dots are in figure 8?","o":["30","32","34","38"],"a":2,"e":"Figure 8 has 6 + 7 × 4 = 34 dots.","v":"patterns-rules"},{"d":"HARD","q":"Which rule fits the pattern 3, 7, 15, 31, 63, ...?","o":["Multiply by 2 and add 1","Add 4 each time","Multiply by 3","Add consecutive even numbers"],"a":0,"e":"Each term is twice the previous term plus 1.","v":"patterns-rules"},{"d":"HARD","q":"A pattern has 2, 6, 12, 20, 30, ... What is the next term?","o":["36","40","42","44"],"a":2,"e":"The differences are 4, 6, 8, 10; next add 12, giving 42.","v":"patterns-rules"}];
questions.forEach(q=>{const pairs=q.o.map((text,i)=>({text,correct:i===q.a}));for(let i=pairs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pairs[i],pairs[j]]=[pairs[j],pairs[i]];}q.o=pairs.map(p=>p.text);q.a=pairs.findIndex(p=>p.correct);});\nlet index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;
const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');
function updateProgress(){const p=index>=questions.length?100:index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}
function render(){
 if(index>=questions.length){results();return;}
 const q=questions[index];selected=-1;locked=false;
 $('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;
 $('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · PATTERNS AND RULES';
 $('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';
 const content=$('content');content.replaceChildren();
 const question=document.createElement('div');question.className='question';question.textContent=q.q;content.appendChild(question);
 const choices=document.createElement('div');choices.className='choices';content.appendChild(choices);
 q.o.forEach((answer,i)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.dataset.i=String(i);b.textContent=answer;b.addEventListener('click',()=>{if(locked)return;selected=i;choices.querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===i));$('action').disabled=false;});choices.appendChild(b);});
 $('action').textContent='Check answer';$('action').disabled=true;updateProgress();
}
function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;if(window.skillupCelebrate)window.skillupCelebrate();xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===selected&&!good)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Review: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();}else results();}
function results(){finished=true;updateProgress();$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='🏆 Patterns and Rules complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const content=$('content');content.replaceChildren();const end=document.createElement('div');end.className='end';const trophy=document.createElement('div');trophy.style.fontSize='3.2rem';trophy.textContent='🏆';end.appendChild(trophy);const title=document.createElement('h1');title.textContent=correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!';end.appendChild(title);const score=document.createElement('div');score.className='score';score.textContent=correct+' / '+questions.length;end.appendChild(score);const p=document.createElement('p');p.textContent='You answered '+correct+' questions correctly.';end.appendChild(p);const summary=document.createElement('div');summary.className='summary';summary.innerHTML='⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining';end.appendChild(summary);const skills=document.createElement('div');skills.className='skills';[['🔢','Recognise number patterns and rules','Predict the next term in a sequence'],['🧩','Explore growing patterns','Apply rules to solve problems'],['➕','Find missing terms','Work with sequences and positions']].forEach(item=>{const row=document.createElement('div');row.className='skill';const icon=document.createElement('span');icon.className='skill-icon';icon.textContent=item[0];const info=document.createElement('div');const strong=document.createElement('strong');strong.textContent=item[1];const small=document.createElement('small');small.textContent=item[2];info.append(strong,small);row.append(icon,info);skills.appendChild(row);});end.appendChild(skills);content.appendChild(end);$('action').textContent='Try again ↻';$('action').disabled=false;}
function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}
$('action').addEventListener('click',()=>{if(finished)restart();else act();});
try{render();}catch(err){$('content').textContent='The quiz could not start. Please refresh the page.';console.error('Patterns and Rules quiz initialization failed',err);}
})();
</script>
