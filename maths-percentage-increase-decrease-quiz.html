<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"A price rises from ₹80 to ₹100. What is the percentage increase?","o":["20%","25%","30%","35%"],"a":1,"e":"The increase is ₹20; 20 ÷ 80 × 100 = 25%.","v":"percentage-increase-decrease"},{"d":"BASIC","q":"A toy costs ₹200 and its price decreases by 10%. What is the new price?","o":["₹180","₹190","₹200","₹220"],"a":0,"e":"10% of ₹200 is ₹20, so the new price is ₹200 − ₹20 = ₹180.","v":"percentage-increase-decrease"},{"d":"BASIC","q":"A quantity increases from 40 to 50. What is the increase as a percentage of the original quantity?","o":["10%","20%","25%","50%"],"a":2,"e":"The increase is 10; 10 ÷ 40 × 100 = 25%.","v":"percentage-increase-decrease"},{"d":"BASIC","q":"A ₹600 item is reduced by 5%. Find the reduction amount.","o":["₹5","₹25","₹30","₹60"],"a":2,"e":"5% of ₹600 is 0.05 × 600 = ₹30.","v":"percentage-increase-decrease"},{"d":"BASIC","q":"A number changes from 120 to 90. What is the percentage decrease?","o":["15%","20%","25%","30%"],"a":2,"e":"The decrease is 30; 30 ÷ 120 × 100 = 25%.","v":"percentage-increase-decrease"},{"d":"BASIC","q":"A ₹400 bill increases by 15%. What is the increase amount?","o":["₹15","₹40","₹60","₹415"],"a":2,"e":"15% of ₹400 is ₹60.","v":"percentage-increase-decrease"},{"d":"BASIC","q":"A population of 1,000 grows by 10%. What is the new population?","o":["1,010","1,100","900","1,200"],"a":1,"e":"10% of 1,000 is 100, so the new population is 1,100.","v":"percentage-increase-decrease"},{"d":"BASIC","q":"A shirt price drops from ₹500 to ₹450. What is the percentage decrease?","o":["5%","10%","15%","50%"],"a":1,"e":"The decrease is ₹50; 50 ÷ 500 × 100 = 10%.","v":"percentage-increase-decrease"},{"d":"BASIC","q":"A value of 60 increases by 50%. What is the new value?","o":["80","90","100","110"],"a":1,"e":"50% of 60 is 30, so the new value is 90.","v":"percentage-increase-decrease"},{"d":"BASIC","q":"A ₹250 item is reduced by 20%. What is its new price?","o":["₹50","₹200","₹225","₹230"],"a":1,"e":"20% of ₹250 is ₹50; ₹250 − ₹50 = ₹200.","v":"percentage-increase-decrease"},{"d":"MEDIUM","q":"A bicycle's price rises from ₹2,400 to ₹2,760. Find the percentage increase.","o":["10%","12%","15%","18%"],"a":2,"e":"Increase = ₹360; 360 ÷ 2,400 × 100 = 15%.","v":"percentage-increase-decrease"},{"d":"MEDIUM","q":"A jacket marked ₹1,200 is discounted by 25%. Find the sale price.","o":["₹300","₹800","₹900","₹975"],"a":2,"e":"The discount is ₹300, leaving ₹1,200 − ₹300 = ₹900.","v":"percentage-increase-decrease"},{"d":"MEDIUM","q":"A town has 8,000 people. Its population decreases by 5%. How many people remain?","o":["7,400","7,500","7,600","7,950"],"a":2,"e":"5% of 8,000 is 400; 8,000 − 400 = 7,600.","v":"percentage-increase-decrease"},{"d":"MEDIUM","q":"A value increases from 150 to 195. Find the percentage increase.","o":["20%","25%","30%","45%"],"a":2,"e":"Increase = 45; 45 ÷ 150 × 100 = 30%.","v":"percentage-increase-decrease"},{"d":"MEDIUM","q":"A laptop costing ₹40,000 is reduced by 12%. Find the discounted price.","o":["₹4,800","₹32,000","₹35,200","₹36,800"],"a":2,"e":"12% of ₹40,000 is ₹4,800; the discounted price is ₹35,200.","v":"percentage-increase-decrease"},{"d":"MEDIUM","q":"A quantity falls from 250 to 200. What is the percentage decrease?","o":["15%","20%","25%","50%"],"a":1,"e":"Decrease = 50; 50 ÷ 250 × 100 = 20%.","v":"percentage-increase-decrease"},{"d":"MEDIUM","q":"A salary of ₹24,000 increases by 8%. What is the new salary?","o":["₹24,800","₹25,200","₹25,920","₹26,400"],"a":2,"e":"8% of ₹24,000 is ₹1,920; total = ₹25,920.","v":"percentage-increase-decrease"},{"d":"MEDIUM","q":"A price after a 20% increase is ₹720. What was the original price?","o":["₹576","₹600","₹620","₹864"],"a":1,"e":"₹720 represents 120% of the original, so original = 720 ÷ 1.2 = ₹600.","v":"percentage-increase-decrease"},{"d":"MEDIUM","q":"A number decreases by 30% and becomes 140. What was the original number?","o":["170","180","200","210"],"a":2,"e":"140 is 70% of the original; original = 140 ÷ 0.7 = 200.","v":"percentage-increase-decrease"},{"d":"MEDIUM","q":"A product price increases from ₹800 by 15%, then receives a discount of ₹120. What is the final price?","o":["₹680","₹800","₹920","₹1,040"],"a":1,"e":"After the increase: ₹800 + ₹120 = ₹920; subtract ₹120 to return to ₹800.","v":"percentage-increase-decrease"},{"d":"HARD","q":"A price increases by 20% and then decreases by 20%. Starting at ₹500, what is the final price?","o":["₹480","₹500","₹520","₹400"],"a":0,"e":"₹500 × 1.2 × 0.8 = ₹480; equal percentage changes on different bases do not cancel.","v":"percentage-increase-decrease"},{"d":"HARD","q":"A value decreases by 25%. By what percentage must the reduced value increase to return to the original?","o":["25%","30%","33⅓%","40%"],"a":2,"e":"After a 25% drop, 75% remains; the required rise is 25/75 × 100 = 33⅓%.","v":"percentage-increase-decrease"},{"d":"HARD","q":"A price rises from ₹1,600 to ₹2,000. What percentage decrease from ₹2,000 returns it to ₹1,600?","o":["15%","20%","25%","30%"],"a":1,"e":"The decrease is ₹400; 400 ÷ 2,000 × 100 = 20%.","v":"percentage-increase-decrease"},{"d":"HARD","q":"A town's population of 10,000 rises by 10% each year for two years. What is the final population?","o":["12,000","12,100","12,200","12,210"],"a":1,"e":"10,000 × 1.1 × 1.1 = 12,100.","v":"percentage-increase-decrease"},{"d":"HARD","q":"An item costs ₹800. Its price is increased by 25%, then discounted by 10%. What is the final price?","o":["₹880","₹900","₹920","₹1,000"],"a":1,"e":"After increase: ₹1,000; after discount: ₹1,000 × 0.9 = ₹900.","v":"percentage-increase-decrease"},{"d":"HARD","q":"A number increases by 40% to become 350. Find the original number.","o":["200","250","280","300"],"a":1,"e":"350 is 140% of the original; 350 ÷ 1.4 = 250.","v":"percentage-increase-decrease"},{"d":"HARD","q":"A value is reduced by 15%, then the reduced value is increased by 15%. Starting at 2,000, find the final value.","o":["1,955","2,000","2,045","2,300"],"a":0,"e":"2,000 × 0.85 × 1.15 = 1,955.","v":"percentage-increase-decrease"},{"d":"HARD","q":"A product's price is reduced from ₹2,500 to ₹2,000, then increased by 10%. What is the final price?","o":["₹2,100","₹2,200","₹2,250","₹2,300"],"a":1,"e":"After reduction it is ₹2,000; a 10% increase adds ₹200, giving ₹2,200.","v":"percentage-increase-decrease"},{"d":"HARD","q":"A value increases from 320 to 400. Then the new value decreases by 10%. What is the final value?","o":["352","360","368","380"],"a":1,"e":"The increase gives 400; reducing 400 by 10% gives 360.","v":"percentage-increase-decrease"},{"d":"HARD","q":"A price is increased by 10% and then by 10% again. The original price is ₹2,000. Find the total percentage increase.","o":["10%","20%","21%","22%"],"a":2,"e":"₹2,000 × 1.1 × 1.1 = ₹2,420, a total increase of ₹420 or 21%.","v":"percentage-increase-decrease"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}const visuals={
balance:'',
blocks:'',
bars:'',
picture:''
};function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🔢</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+'<div class="skill-item '+(correct>=8?'unlocked':'')+'">'+(correct>=8?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Simplify and compare ratios</div>'+'<div class="skill-item '+(correct>=18?'unlocked':'')+'">'+(correct>=18?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Calculate percentages and percentage changes</div>'+'<div class="skill-item '+(correct>=24?'unlocked':'')+'">'+(correct>=24?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Solve profit, loss and discount problems</div>'+'</div></div>' ;$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script>
