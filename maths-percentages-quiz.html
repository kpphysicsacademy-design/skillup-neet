<style>

ce-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What is 10% of 80?","o":["8","10","16","18"],"a":0,"e":"10% means one tenth; 80 ÷ 10 = 8.","v":"percentages"},{"d":"BASIC","q":"Write 25% as a fraction in simplest form.","o":["1/5","1/4","1/2","3/4"],"a":1,"e":"25/100 simplifies to 1/4.","v":"percentages"},{"d":"BASIC","q":"Convert 3/5 to a percentage.","o":["50%","30%","60%","80%"],"a":2,"e":"(3 ÷ 5) × 100 = 60%.","v":"percentages"},{"d":"BASIC","q":"What is 50% of 146?","o":["96","63","83","73"],"a":3,"e":"50% is half, and 146 ÷ 2 = 73.","v":"percentages"},{"d":"BASIC","q":"Convert 0.35 to a percentage.","o":["35%","3.5%","0.35%","350%"],"a":0,"e":"Multiply a decimal by 100: 0.35 × 100 = 35%.","v":"percentages"},{"d":"BASIC","q":"What percentage is 9 out of 20?","o":["40%","45%","20%","55%"],"a":1,"e":"(9 ÷ 20) × 100 = 45%.","v":"percentages"},{"d":"BASIC","q":"Find 1% of 700.","o":["0.7","70","7","17"],"a":2,"e":"1% is one hundredth; 700 ÷ 100 = 7.","v":"percentages"},{"d":"BASIC","q":"A class has 40 students and 25% are absent. How many are absent?","o":["15","8","12","10"],"a":3,"e":"25% of 40 = 40 ÷ 4 = 10.","v":"percentages"},{"d":"BASIC","q":"Convert 125% to a decimal.","o":["1.25","0.125","12.5","2.5"],"a":0,"e":"125% = 125 ÷ 100 = 1.25.","v":"percentages"},{"d":"BASIC","q":"A ₹200 item has a 10% discount. What is the discount amount?","o":["₹10","₹20","₹30","₹40"],"a":1,"e":"10% of ₹200 is ₹20.","v":"percentages"},{"d":"MEDIUM","q":"Find 18% of 250.","o":["50","40","45","55"],"a":2,"e":"0.18 × 250 = 45.","v":"percentages"},{"d":"MEDIUM","q":"A student scores 72 marks out of 90. What is the percentage?","o":["85%","75%","72%","80%"],"a":3,"e":"(72 ÷ 90) × 100 = 80%.","v":"percentages"},{"d":"MEDIUM","q":"A quantity of 160 increases by 15%. What is the new quantity?","o":["184","176","180","196"],"a":0,"e":"15% of 160 is 24; 160 + 24 = 184.","v":"percentages"},{"d":"MEDIUM","q":"A ₹800 jacket is reduced by 20%. What is its sale price?","o":["₹620","₹640","₹680","₹700"],"a":1,"e":"20% of ₹800 is ₹160; ₹800 − ₹160 = ₹640.","v":"percentages"},{"d":"MEDIUM","q":"If 35% of a number is 70, what is the number?","o":["210","180","200","250"],"a":2,"e":"Number = 70 ÷ 0.35 = 200.","v":"percentages"},{"d":"MEDIUM","q":"A tank is 60% full and holds 450 L when full. How much water is in it?","o":["360 L","250 L","300 L","270 L"],"a":3,"e":"60% of 450 = 0.6 × 450 = 270 L.","v":"percentages"},{"d":"MEDIUM","q":"Express 7/8 as a percentage.","o":["87.5%","75%","80%","92.5%"],"a":0,"e":"(7 ÷ 8) × 100 = 87.5%.","v":"percentages"},{"d":"MEDIUM","q":"The price rises from ₹400 to ₹460. What is the percentage increase?","o":["10%","15%","12%","20%"],"a":1,"e":"Increase = ₹60; (60 ÷ 400) × 100 = 15%.","v":"percentages"},{"d":"MEDIUM","q":"A learner answers 42 of 60 questions correctly. What percentage is incorrect?","o":["28%","25%","30%","35%"],"a":2,"e":"Incorrect = 18; (18 ÷ 60) × 100 = 30%.","v":"percentages"},{"d":"MEDIUM","q":"A number decreases from 250 to 200. Find the percentage decrease.","o":["50%","15%","25%","20%"],"a":3,"e":"Decrease = 50; (50 ÷ 250) × 100 = 20%.","v":"percentages"},{"d":"HARD","q":"A price of ₹1,000 increases by 20%, then decreases by 20%. What is the final price?","o":["₹960","₹1,000","₹980","₹940"],"a":0,"e":"After the rise: ₹1,200. A 20% reduction of ₹1,200 is ₹240; final price = ₹960.","v":"percentages"},{"d":"HARD","q":"A shop offers 15% off ₹2,400, then an extra 10% off the reduced price. What is the final price?","o":["₹1,800","₹1,836","₹1,860","₹1,920"],"a":1,"e":"First price: ₹2,400 × 0.85 = ₹2,040; then ₹2,040 × 0.90 = ₹1,836.","v":"percentages"},{"d":"HARD","q":"In an election, a candidate receives 54% of 25,000 votes. How many votes does the candidate receive?","o":["14,000","12,500","13,500","15,400"],"a":2,"e":"0.54 × 25,000 = 13,500.","v":"percentages"},{"d":"HARD","q":"A salary rises from ₹32,000 to ₹36,800. What is the percentage increase?","o":["20%","12%","18%","15%"],"a":3,"e":"Increase = ₹4,800; (4,800 ÷ 32,000) × 100 = 15%.","v":"percentages"},{"d":"HARD","q":"After a 12% discount, a bag costs ₹1,320. What was its marked price?","o":["₹1,500","₹1,450","₹1,480","₹1,600"],"a":0,"e":"₹1,320 is 88% of the marked price; ₹1,320 ÷ 0.88 = ₹1,500.","v":"percentages"},{"d":"HARD","q":"A population of 8,000 grows by 5% in one year. What is the new population?","o":["8,500","8,400","8,200","8,800"],"a":1,"e":"5% of 8,000 is 400; new population = 8,400.","v":"percentages"},{"d":"HARD","q":"A number is first increased by 25% and then reduced by 20%. Compared with the original, what is the final change?","o":["5% decrease","5% increase","No change","10% decrease"],"a":2,"e":"Multipliers are 1.25 × 0.80 = 1, so the final value equals the original.","v":"percentages"},{"d":"HARD","q":"A student gets 80% of the first 50 marks and 70% of the next 50 marks. What percentage of the total 100 marks is scored?","o":["80%","70%","72%","75%"],"a":3,"e":"Scores are 40 and 35; total 75 out of 100 is 75%.","v":"percentages"},{"d":"HARD","q":"An item costs ₹600 before 18% tax. What is the price including tax?","o":["₹708","₹618","₹700","₹718"],"a":0,"e":"Tax = 0.18 × ₹600 = ₹108; total = ₹708.","v":"percentages"},{"d":"HARD","q":"A value becomes 360 after a 20% decrease. What was the original value?","o":["432","450","400","480"],"a":1,"e":"360 is 80% of the original; 360 ÷ 0.8 = 450.","v":"percentages"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Calculate percentages</strong><small>Fractions, decimals and percentage conversion</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Solve percentage increase and decrease problems</strong><small>Multi-step percentage applications</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply percentages to real-life situations</strong><small>Reason about perfect squares and nearest squares</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>\n<script src="/shared-nav.js?v=20261013-universal-nav-v1"></script>\n</body></html>
