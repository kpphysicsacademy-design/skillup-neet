<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1f8ff"><meta name="skillup-no-standard-menu" content="true"><meta name="skillup-release" content="20261119-percentages-simulator-v1"><title>Percentage Calculator Simulator | SkillUp Maths</title><style>:root{--blue:#168ac0;--green:#58a900;--ink:#263b58;--muted:#718096;--line:#dce6f0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#f1fbff,#f6f8ff 60%,#f3fbf1);color:var(--ink);font-family:Nunito,system-ui,sans-serif}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}.nav{width:min(100% - 24px,760px);min-height:58px;margin:auto;display:flex;align-items:center;gap:10px;padding:8px 0}.back{display:grid;place-items:center;width:36px;height:36px;border:2px solid var(--line);border-bottom-width:3px;border-radius:11px;color:var(--blue);text-decoration:none;font-size:20px;font-weight:900}.brand{flex:1;font-size:16px;font-weight:950}.brand span{color:var(--blue)}.tag{font-size:11px;font-weight:900;color:#52616c;background:#f5f8fa;padding:6px 9px;border-radius:10px}main{width:min(100% - 24px,740px);margin:auto;padding:18px 4px 36px}.hero,.card{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:clamp(15px,4vw,22px);margin-bottom:13px}.eyebrow{font-size:11px;font-weight:950;letter-spacing:.08em;color:#278100}.hero h1{font-size:clamp(24px,5vw,32px);margin:7px 0}.muted{color:var(--muted);font-size:14px;line-height:1.65;margin:0}.formula{margin:13px 0;padding:14px;border-radius:13px;background:#eff9ff;text-align:center;color:#126d99;font-size:clamp(18px,4vw,24px);font-weight:950}.steps{padding-left:20px;line-height:1.8;font-size:14px}.note{padding:12px;border-radius:12px;background:#f1faeb;color:#365f26;font-size:13px;line-height:1.6}.links{display:grid;grid-template-columns:1fr 1fr;gap:9px}.links a{display:flex;align-items:center;justify-content:center;min-height:48px;padding:9px;border:2px solid #b9e4f6;border-bottom-width:4px;border-radius:13px;background:#f0faff;color:#0877a8;text-decoration:none;text-align:center;font-size:13px;font-weight:950}.links a:last-child{border-color:#d3e9c7;background:#f2fbea;color:#347b18}@media(max-width:520px){main{width:100%;padding:13px 10px 28px}.hero,.card{padding:15px}.links{grid-template-columns:1fr}}.control{display:grid;gap:6px;margin-top:12px}.control label{font-size:13px;font-weight:850}.control input,.control select{width:100%;padding:11px;border:2px solid var(--line);border-radius:11px;font:800 16px system-ui;color:var(--ink);background:white}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{margin-top:13px;padding:15px;border-radius:14px;background:#eff9ff;text-align:center}.result b{display:block;font-size:clamp(24px,5vw,34px);color:#126d99}.result span{font-size:12px;color:var(--muted);font-weight:800}.btn{margin-top:12px;border:0;border-radius:11px;padding:11px 15px;background:#58cc02;color:#173500;font-size:13px;font-weight:900;cursor:pointer}.explain{font-size:13px;line-height:1.6;color:#52616c;margin-top:10px}@media(max-width:520px){.grid2{grid-template-columns:1fr}}</style></head><body><header><div class="nav"><a class="back" href="maths-percentages-quiz.html?v=20261119-percentages-duolingo-v2">←</a><div class="brand">SkillUp <span>Maths</span></div><span class="tag">🔢 Simulator</span></div></header><main>
<section class="hero"><div class="eyebrow">INTERACTIVE NUMBER LAB</div><h1>Percentage Calculator</h1><p class="muted">Choose a percentage operation, enter your values and see the calculation step by step.</p></section>
<section class="card"><h2>1. Choose operation</h2><div class="control"><label for="mode">Calculation type</label><select id="mode"><option value="of">Find x% of a number</option><option value="what">What percentage is A of B?</option><option value="change">Percentage increase or decrease</option><option value="discount">Discount and sale price</option><option value="original">Find original before discount</option></select></div><div class="grid2"><div class="control"><label id="labelA" for="a">Percentage (%)</label><input id="a" type="number" step="any" value="15"></div><div class="control"><label id="labelB" for="b">Number</label><input id="b" type="number" step="any" value="240"></div></div><div class="result"><b id="answer">36</b><span id="caption">15% of 240</span></div><p class="explain" id="steps">15 ÷ 100 × 240 = 36</p></section>
<div class="links"><a href="maths-percentages-learn.html?v=20261119-percentages-learn-v1">📘 Learn</a><a href="maths-percentages-quiz.html?v=20261119-percentages-duolingo-v2">📝 Practice quiz</a></div></main>
<script>(function(){const $=id=>document.getElementById(id);const mode=$('mode');function fmt(x){return Number.isFinite(x)?Number(x.toFixed(6)).toString():'—'}function update(){const m=mode.value,a=Number($('a').value),b=Number($('b').value);$('labelA').textContent=m==='of'?'Percentage (%)':m==='what'?'Part (A)':m==='change'?'Original value':'Marked price';$('labelB').textContent=m==='of'?'Number':m==='what'?'Whole (B)':m==='change'?'New value':'Discount percentage (%)';let answer,caption,steps;if($('a').value===''||$('b').value===''||!Number.isFinite(a)||!Number.isFinite(b)){answer='—';caption='Enter both values';steps='Provide valid numbers to calculate.'}else if(m==='of'){answer=a/100*b;caption=fmt(a)+'% of '+fmt(b);steps=fmt(a)+' ÷ 100 × '+fmt(b)+' = '+fmt(answer)}else if(m==='what'){answer=b===0?NaN:a/b*100;caption=fmt(a)+' as a percentage of '+fmt(b);steps='('+fmt(a)+' ÷ '+fmt(b)+') × 100 = '+fmt(answer)+'%'}else if(m==='change'){answer=a===0?NaN:Math.abs(b-a)/Math.abs(a)*100;caption=(b>=a?'Increase':'Decrease')+' percentage';steps='Change = |'+fmt(b)+' − '+fmt(a)+'| = '+fmt(Math.abs(b-a))+'. Percentage change = change ÷ original × 100 = '+fmt(answer)+'%'}else if(m==='discount'){answer=a*(1-b/100);caption='Sale price after '+fmt(b)+'% discount';steps='Discount = '+fmt(a)+' × '+fmt(b)+' ÷ 100 = '+fmt(a*b/100)+'. Sale price = '+fmt(a)+' − '+fmt(a*b/100)+' = '+fmt(answer)}else{answer=b===100?NaN:a/(1-b/100);caption='Original price before '+fmt(b)+'% discount';steps='Original = sale price ÷ (1 − discount rate) = '+fmt(a)+' ÷ '+fmt(1-b/100)+' = '+fmt(answer)}$('answer').textContent=fmt(answer)+(m==='what'||m==='change'?'%':'');$('caption').textContent=caption;$('steps').textContent=steps}mode.addEventListener('change',update);$('a').addEventListener('input',update);$('b').addEventListener('input',update);update()})();</script></body></html>
