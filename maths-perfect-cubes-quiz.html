7","9 and 10","8 and 9"],"a":3,"e":"8³ = 512 and 9³ = 729.","v":"perfect-cubes"},{"d":"MEDIUM","q":"What is 20³?","o":["8,000","4,000","400","80,000"],"a":0,"e":"20³ = 20 × 20 × 20 = 8,000.","v":"perfect-cubes"},{"d":"MEDIUM","q":"Which is the greatest perfect cube less than 500?","o":["216","343","512","441"],"a":1,"e":"7³ = 343 and 8³ = 512, which exceeds 500.","v":"perfect-cubes"},{"d":"MEDIUM","q":"If n = 4, what is n³ + 2?","o":["18","64","66","72"],"a":2,"e":"4³ + 2 = 64 + 2 = 66.","v":"perfect-cubes"},{"d":"MEDIUM","q":"What is the cube of −3?","o":["27","−9","9","−27"],"a":3,"e":"(−3)³ = (−3)(−3)(−3) = −27.","v":"perfect-cubes"},{"d":"HARD","q":"What is the smallest positive integer by which 72 must be multiplied to make a perfect cube?","o":["3","6","9","12"],"a":0,"e":"72 = 2³ × 3²; multiply by 3 to obtain 2³ × 3³ = 216.","v":"perfect-cubes"},{"d":"HARD","q":"What is the smallest positive integer by which 108 must be multiplied to make a perfect cube?","o":["3","2","6","18"],"a":1,"e":"108 = 2² × 3³; multiply by 2 to obtain 2³ × 3³ = 216.","v":"perfect-cubes"},{"d":"HARD","q":"What is the least positive integer by which 500 must be divided to get a perfect-cube integer?","o":["2","5","4","10"],"a":2,"e":"500 ÷ 4 = 125 = 5³.","v":"perfect-cubes"},{"d":"HARD","q":"If x³ = 1,331 and x is positive, what is x?","o":["9","10","12","11"],"a":3,"e":"11³ = 1,331.","v":"perfect-cubes"},{"d":"HARD","q":"Which expression equals 14³?","o":["2744","196","2401","2916"],"a":0,"e":"14² × 14 = 196 × 14 = 2,744.","v":"perfect-cubes"},{"d":"HARD","q":"A cube has volume 729 cm³. What is its edge length?","o":["7 cm","9 cm","8 cm","10 cm"],"a":1,"e":"The edge length is ∛729 = 9 cm because 9³ = 729.","v":"perfect-cubes"},{"d":"HARD","q":"What is the units digit of 17³?","o":["1","7","3","9"],"a":2,"e":"17³ = 4,913, whose units digit is 3.","v":"perfect-cubes"},{"d":"HARD","q":"Which number has prime factorisation 2³ × 3⁶ and is therefore a perfect cube?","o":["216","432","1,458","5,832"],"a":3,"e":"2³ × 3⁶ = 8 × 729 = 5,832; every prime exponent is divisible by 3.","v":"perfect-cubes"},{"d":"HARD","q":"What is 25³?","o":["15,625","12,500","1,562","25,000"],"a":0,"e":"25² × 25 = 625 × 25 = 15,625.","v":"perfect-cubes"},{"d":"HARD","q":"Which is the smallest perfect cube greater than 1,000?","o":["1,064","1,331","1,200","1,444"],"a":1,"e":"10³ = 1,000; the next cube is 11³ = 1,331.","v":"perfect-cubes"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Recognise and calculate perfect cubes</strong><small>Cube numbers and patterns</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Calculate cubes of integers</strong><small>Apply cube properties to numerical problems</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply prime factorisation and square-number patterns</strong><small>Reason about perfect squares and nearest squares</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
