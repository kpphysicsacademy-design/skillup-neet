(function(){'use strict';const questions=[{"d":"BASIC","q":"Which number is a perfect square?","o":["49","45","52","63"],"a":0,"e":"49 = 7 × 7 = 7².","v":"perfect-squares"},{"d":"BASIC","q":"What is 8²?","o":["16","64","56","72"],"a":1,"e":"8² means 8 × 8, which equals 64.","v":"perfect-squares"},{"d":"BASIC","q":"What is 12²?","o":["124","24","144","122"],"a":2,"e":"12 × 12 = 144.","v":"perfect-squares"},{"d":"BASIC","q":"Which number is NOT a perfect square?","o":["36","81","121","50"],"a":3,"e":"50 lies between 7² = 49 and 8² = 64, so it is not a square.","v":"perfect-squares"},{"d":"BASIC","q":"The sequence is 1, 4, 9, 16, __. What comes next?","o":["25","20","24","36"],"a":0,"e":"These are 1², 2², 3², 4²; the next is 5² = 25.","v":"perfect-squares"},{"d":"BASIC","q":"What is the square of 15?","o":["30","225","125","215"],"a":1,"e":"15 × 15 = 225.","v":"perfect-squares"},{"d":"BASIC","q":"Which perfect square has units digit 6?","o":["25","49","36","64"],"a":2,"e":"6² = 36, which ends in 6.","v":"perfect-squares"},{"d":"BASIC","q":"What is 20²?","o":["40","200","2000","400"],"a":3,"e":"20 × 20 = 400.","v":"perfect-squares"},{"d":"BASIC","q":"Which perfect square lies between 30 and 40?","o":["36","25","49","64"],"a":0,"e":"6² = 36, and 30 < 36 < 40.","v":"perfect-squares"},{"d":"BASIC","q":"What is √81?","o":["8","9","10","7"],"a":1,"e":"9 × 9 = 81, so the principal square root is 9.","v":"perfect-squares"},{"d":"MEDIUM","q":"Which number is a perfect square and also odd?","o":["72","98","169","180"],"a":2,"e":"169 = 13² and is odd.","v":"perfect-squares"},{"d":"MEDIUM","q":"What is the smallest perfect square greater than 150?","o":["144","196","225","169"],"a":3,"e":"12² = 144 is below 150; 13² = 169 is the next square.","v":"perfect-squares"},{"d":"MEDIUM","q":"How many integers are there from 1² through 6², inclusive, in the list of square numbers?","o":["6","5","7","12"],"a":0,"e":"The listed squares are 1², 2², 3², 4², 5² and 6²: six numbers.","v":"perfect-squares"},{"d":"MEDIUM","q":"Which statement about the square of an even integer is always true?","o":["It is odd","It is even","It ends in 2","It is prime"],"a":1,"e":"If n is even, n = 2k, so n² = 4k² is even.","v":"perfect-squares"},{"d":"MEDIUM","q":"What is 25²?","o":["650","525","625","725"],"a":2,"e":"25 × 25 = 625.","v":"perfect-squares"},{"d":"MEDIUM","q":"Which number cannot be the units digit of a perfect square in base ten?","o":["9","5","6","2"],"a":3,"e":"A square can end in 0, 1, 4, 5, 6 or 9, but not 2.","v":"perfect-squares"},{"d":"MEDIUM","q":"If n² = 196 and n is positive, what is n?","o":["14","13","12","16"],"a":0,"e":"14 × 14 = 196, so the positive value is 14.","v":"perfect-squares"},{"d":"MEDIUM","q":"What is the difference between 10² and 9²?","o":["1","19","10","9"],"a":1,"e":"100 − 81 = 19.","v":"perfect-squares"},{"d":"MEDIUM","q":"Which pair consists of consecutive perfect squares?","o":["36 and 64","25 and 49","64 and 81","49 and 100"],"a":2,"e":"64 = 8² and 81 = 9², so they are consecutive squares.","v":"perfect-squares"},{"d":"MEDIUM","q":"A square number is between 80 and 90. Which is it?","o":["89","82","84","81"],"a":3,"e":"9² = 81, the only square in that interval.","v":"perfect-squares"},{"d":"HARD","q":"What is the smallest positive integer by which 72 must be multiplied to make a perfect square?","o":["2","3","6","8"],"a":0,"e":"72 = 2³ × 3². Multiplying by 2 gives 2⁴ × 3² = 144, a perfect square.","v":"perfect-squares"},{"d":"HARD","q":"What is the smallest positive integer by which 180 must be divided to get a perfect-square integer?","o":["2","5","3","10"],"a":1,"e":"180 = 2² × 3² × 5. Divide by 5 to get 36 = 6².","v":"perfect-squares"},{"d":"HARD","q":"Between which two consecutive integers does √70 lie?","o":["6 and 7","8 and 9","7 and 8","9 and 10"],"a":2,"e":"8² = 64 < 70 < 81 = 9², so √70 lies between 8 and 9.","v":"perfect-squares"},{"d":"HARD","q":"A square number is written as 4k + r, where k is an integer. Which remainder r is possible when divided by 4?","o":["2","3","All of 1, 2 and 3","1"],"a":3,"e":"An integer square is either even and leaves remainder 0, or odd and leaves remainder 1 when divided by 4.","v":"perfect-squares"},{"d":"HARD","q":"What is the least number that must be added to 250 to obtain a perfect square?","o":["6","5","11","14"],"a":0,"e":"The next square after 250 is 16² = 256, and 256 − 250 = 6.","v":"perfect-squares"},{"d":"HARD","q":"What is the greatest perfect square less than 500?","o":["441","484","400","529"],"a":1,"e":"22² = 484, while 23² = 529 exceeds 500.","v":"perfect-squares"},{"d":"HARD","q":"If 31² = 961, what is 32²?","o":["992","1001","1024","1025"],"a":2,"e":"(31 + 1)² = 31² + 2×31 + 1 = 961 + 63 = 1024.","v":"perfect-squares"},{"d":"HARD","q":"Which number must be added to 999 to make the result a perfect square?","o":["1","16","24","25"],"a":3,"e":"1000 is not a square; the next square is 32² = 1024, and 1024 − 999 = 25.","v":"perfect-squares"},{"d":"HARD","q":"A number has prime factorisation 2² × 3 × 5². What is the smallest multiplier that makes it a perfect square?","o":["3","2","5","6"],"a":0,"e":"Only the exponent of 3 is odd, so multiply by 3 to make every prime exponent even.","v":"perfect-squares"},{"d":"HARD","q":"What is the sum of the first five positive perfect squares?","o":["50","55","45","35"],"a":1,"e":"1² + 2² + 3² + 4² + 5² = 1 + 4 + 9 + 16 + 25 = 55.","v":"perfect-squares"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 ned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Recognise square numbers and their patterns</strong><small>Square numbers and integer properties</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Calculate squares and compare neighbouring square numbers</strong><small>Use square-number properties to solve problems</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply prime factorisation and square-number patterns</strong><small>Reason about perfect squares and nearest squares</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
