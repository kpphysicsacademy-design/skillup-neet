<section class="hero">
<h1>▦ Perfect Squares</h1>
<p class="muted">Square numbers · Square roots · Number patterns · Perfect-square properties</p>

<div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div>

<script>
(function(){
'use strict';
const questions=[{"q":"Which number is a perfect square?","o":["49","45","52","63"],"a":0,"why":"49 = 7 × 7 = 7²."},{"q":"What is 8²?","o":["16","64","56","72"],"a":1,"why":"8² means 8 × 8, which equals 64."},{"q":"What is 12²?","o":["124","24","144","122"],"a":2,"why":"12 × 12 = 144."},{"q":"Which number is NOT a perfect square?","o":["36","81","121","50"],"a":3,"why":"50 lies between 7² = 49 and 8² = 64, so it is not a square."},{"q":"The sequence is 1, 4, 9, 16, __. What comes next?","o":["25","20","24","36"],"a":0,"why":"These are 1², 2², 3², 4²; the next is 5² = 25."},{"q":"What is the square of 15?","o":["30","225","125","215"],"a":1,"why":"15 × 15 = 225."},{"q":"Which perfect square has units digit 6?","o":["25","49","36","64"],"a":2,"why":"6² = 36, which ends in 6."},{"q":"What is 20²?","o":["40","200","2000","400"],"a":3,"why":"20 × 20 = 400."},{"q":"Which perfect square lies between 30 and 40?","o":["36","25","49","64"],"a":0,"why":"6² = 36, and 30 < 36 < 40."},{"q":"What is √81?","o":["8","9","10","7"],"a":1,"why":"9 × 9 = 81, so the principal square root is 9."},{"q":"Which number is a perfect square and also odd?","o":["72","98","169","180"],"a":2,"why":"169 = 13² and is odd."},{"q":"What is the smallest perfect square greater than 150?","o":["144","196","225","169"],"a":3,"why":"12² = 144 is below 150; 13² = 169 is the next square."},{"q":"How many integers are there from 1² through 6², inclusive, in the list of square numbers?","o":["6","5","7","12"],"a":0,"why":"The listed squares are 1², 2², 3², 4², 5² and 6²: six numbers."},{"q":"Which statement about the square of an even integer is always true?","o":["It is odd","It is even","It ends in 2","It is prime"],"a":1,"why":"If n is even, n = 2k, so n² = 4k² is even."},{"q":"What is 25²?","o":["650","525","625","725"],"a":2,"why":"25 × 25 = 625."},{"q":"Which number cannot be the units digit of a perfect square in base ten?","o":["9","5","6","2"],"a":3,"why":"A square can end in 0, 1, 4, 5, 6 or 9, but not 2."},{"q":"If n² = 196 and n is positive, what is n?","o":["14","13","12","16"],"a":0,"why":"14 × 14 = 196, so the positive value is 14."},{"q":"What is the difference between 10² and 9²?","o":["1","19","10","9"],"a":1,"why":"100 − 81 = 19."},{"q":"Which pair consists of consecutive perfect squares?","o":["36 and 64","25 and 49","64 and 81","49 and 100"],"a":2,"why":"64 = 8² and 81 = 9², so they are consecutive squares."},{"q":"A square number is between 80 and 90. Which is it?","o":["89","82","84","81"],"a":3,"why":"9² = 81, the only square in that interval."},{"q":"What is the smallest positive integer by which 72 must be multiplied to make a perfect square?","o":["2","3","6","8"],"a":0,"why":"72 = 2³ × 3². Multiplying by 2 gives 2⁴ × 3² = 144, a perfect square."},{"q":"What is the smallest positive integer by which 180 must be divided to get a perfect-square integer?","o":["2","5","3","10"],"a":1,"why":"180 = 2² × 3² × 5. Divide by 5 to get 36 = 6²."},{"q":"Between which two consecutive integers does √70 lie?","o":["6 and 7","8 and 9","7 and 8","9 and 10"],"a":2,"why":"8² = 64 < 70 < 81 = 9², so √70 lies between 8 and 9."},{"q":"A square number is written as 4k + r, where k is an integer. Which remainder r is possible when divided by 4?","o":["2","3","All of 1, 2 and 3","1"],"a":3,"why":"An integer square is either even and leaves remainder 0, or odd and leaves remainder 1 when divided by 4."},{"q":"What is the least number that must be added to 250 to obtain a perfect square?","o":["6","5","11","14"],"a":0,"why":"The next square after 250 is 16² = 256, and 256 − 250 = 6."},{"q":"What is the greatest perfect square less than 500?","o":["441","484","400","529"],"a":1,"why":"22² = 484, while 23² = 529 exceeds 500."},{"q":"If 31² = 961, what is 32²?","o":["992","1001","1024","1025"],"a":2,"why":"(31 + 1)² = 31² + 2×31 + 1 = 961 + 63 = 1024."},{"q":"Which number must be added to 999 to make the result a perfect square?","o":["1","16","24","25"],"a":3,"why":"1000 is not a square; the next square is 32² = 1024, and 1024 − 999 = 25."},{"q":"A number has prime factorisation 2² × 3 × 5². What is the smallest multiplier that makes it a perfect square?","o":["3","2","5","6"],"a":0,"why":"Only the exponent of 3 is odd, so multiply by 3 to make every prime exponent even."},{"q":"What is the sum of the first five positive perfect squares?","o":["50","55","45","35"],"a":1,"why":"1² + 2² + 3² + 4² + 5² = 1 + 4 + 9 + 16 + 25 = 55."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Perfect Squares Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-perfect-squares-large-numbers-layout-v1" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
