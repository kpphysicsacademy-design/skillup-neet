<script>
const questions=[{"d":"BASIC","q":"Find the perimeter of a square with side 5 cm.","o":["10 cm","15 cm","20 cm","25 cm"],"a":2,"e":"Perimeter of a square = 4 × side = 4 × 5 = 20 cm.","v":"perimeter-plane-figures"},{"d":"BASIC","q":"A rectangle is 8 cm long and 3 cm wide. Find its perimeter.","o":["11 cm","22 cm","24 cm","30 cm"],"a":1,"e":"Perimeter = 2 × (length + width) = 2 × (8 + 3) = 22 cm.","v":"perimeter-plane-figures"},{"d":"BASIC","q":"An equilateral triangle has side 7 cm. What is its perimeter?","o":["14 cm","21 cm","28 cm","49 cm"],"a":1,"e":"All three sides are equal, so perimeter = 3 × 7 = 21 cm.","v":"perimeter-plane-figures"},{"d":"BASIC","q":"A triangle has sides 4 cm, 5 cm and 6 cm. Find its perimeter.","o":["9 cm","10 cm","15 cm","20 cm"],"a":2,"e":"Add the side lengths: 4 + 5 + 6 = 15 cm.","v":"perimeter-plane-figures"},{"d":"BASIC","q":"A regular pentagon has each side 6 cm. Find its perimeter.","o":["11 cm","24 cm","30 cm","36 cm"],"a":2,"e":"A pentagon has five sides, so perimeter = 5 × 6 = 30 cm.","v":"perimeter-plane-figures"},{"d":"BASIC","q":"Find the perimeter of a rectangle with length 12 m and width 5 m.","o":["17 m","24 m","34 m","60 m"],"a":2,"e":"Perimeter = 2 × (12 + 5) = 34 m.","v":"perimeter-plane-figures"},{"d":"BASIC","q":"A square has perimeter 36 cm. How long is each side?","o":["6 cm","8 cm","9 cm","12 cm"],"a":2,"e":"Each side = perimeter ÷ 4 = 36 ÷ 4 = 9 cm.","v":"perimeter-plane-figures"},{"d":"BASIC","q":"A shape has side lengths 2 cm, 3 cm, 4 cm and 5 cm. What is its perimeter?","o":["9 cm","12 cm","14 cm","20 cm"],"a":2,"e":"Perimeter is the sum of all outer sides: 2 + 3 + 4 + 5 = 14 cm.","v":"perimeter-plane-figures"},{"d":"BASIC","q":"A rectangular garden measures 10 m by 4 m. How much fencing is needed around it?","o":["14 m","20 m","28 m","40 m"],"a":2,"e":"Fencing follows the perimeter: 2 × (10 + 4) = 28 m.","v":"perimeter-plane-figures"},{"d":"BASIC","q":"What is the perimeter of a regular hexagon with side 3 cm?","o":["9 cm","12 cm","18 cm","36 cm"],"a":2,"e":"A hexagon has six sides, so 6 × 3 = 18 cm.","v":"perimeter-plane-figures"},{"d":"MEDIUM","q":"A rectangle has perimeter 50 cm and length 15 cm. Find its width.","o":["5 cm","10 cm","15 cm","20 cm"],"a":1,"e":"50 = 2(15 + w), so 25 = 15 + w and w = 10 cm.","v":"perimeter-plane-figures"},{"d":"MEDIUM","q":"The perimeter of a square is 64 m. Find its side length.","o":["8 m","12 m","16 m","32 m"],"a":2,"e":"Side length = 64 ÷ 4 = 16 m.","v":"perimeter-plane-figures"},{"d":"MEDIUM","q":"A triangle has perimeter 31 cm. Two sides are 9 cm and 12 cm. Find the third side.","o":["8 cm","10 cm","12 cm","19 cm"],"a":1,"e":"Third side = 31 − 9 − 12 = 10 cm.","v":"perimeter-plane-figures"},{"d":"MEDIUM","q":"A rectangular field is 24 m long and 16 m wide. What is the distance around it?","o":["40 m","64 m","80 m","384 m"],"a":2,"e":"Perimeter = 2 × (24 + 16) = 80 m.","v":"perimeter-plane-figures"},{"d":"MEDIUM","q":"A regular octagon has side length 4.5 cm. Find its perimeter.","o":["18 cm","32 cm","36 cm","40.5 cm"],"a":2,"e":"An octagon has eight sides: 8 × 4.5 = 36 cm.","v":"perimeter-plane-figures"},{"d":"MEDIUM","q":"A rectangle has width 7 cm and perimeter 38 cm. Find its length.","o":["10 cm","12 cm","14 cm","17 cm"],"a":1,"e":"19 = length + 7, so length = 12 cm.","v":"perimeter-plane-figures"},{"d":"MEDIUM","q":"A square garden has side 13 m. A person walks around it twice. How far do they walk?","o":["26 m","52 m","78 m","104 m"],"a":3,"e":"One perimeter is 4 × 13 = 52 m; twice around is 104 m.","v":"perimeter-plane-figures"},{"d":"MEDIUM","q":"A regular pentagon has perimeter 45 cm. Find each side length.","o":["5 cm","8 cm","9 cm","15 cm"],"a":2,"e":"Each side = 45 ÷ 5 = 9 cm.","v":"perimeter-plane-figures"},{"d":"MEDIUM","q":"A wire 48 cm long is shaped into a square. Find the side length.","o":["8 cm","10 cm","12 cm","16 cm"],"a":2,"e":"The wire is the perimeter, so side = 48 ÷ 4 = 12 cm.","v":"perimeter-plane-figures"},{"d":"MEDIUM","q":"A rectangle is 9 cm long and has perimeter 30 cm. Find its width.","o":["3 cm","6 cm","9 cm","12 cm"],"a":1,"e":"Half the perimeter is 15 cm; width = 15 − 9 = 6 cm.","v":"perimeter-plane-figures"},{"d":"HARD","q":"A rectangle's length is twice its width. Its perimeter is 54 cm. Find its length.","o":["9 cm","12 cm","18 cm","27 cm"],"a":2,"e":"Let width be w and length 2w. Then 2(3w)=54, so w=9 and length=18 cm.","v":"perimeter-plane-figures"},{"d":"HARD","q":"A square and an equilateral triangle each have perimeter 36 cm. What is the difference between their side lengths?","o":["2 cm","3 cm","4 cm","6 cm"],"a":1,"e":"Square side = 36/4 = 9 cm; triangle side = 36/3 = 12 cm; difference = 3 cm.","v":"perimeter-plane-figures"},{"d":"HARD","q":"A rectangular park is 35 m long and 20 m wide. A gate 5 m wide needs no fencing. How much fencing is needed?","o":["100 m","105 m","107 m","110 m"],"a":1,"e":"Perimeter = 2(35 + 20) = 110 m. Excluding the 5 m gate gives 105 m.","v":"perimeter-plane-figures"},{"d":"HARD","q":"A rectangular sheet is 18 cm long and 11 cm wide. If each dimension increases by 2 cm, how much does the perimeter increase?","o":["2 cm","4 cm","6 cm","8 cm"],"a":3,"e":"Each of the two dimensions increases by 2 cm; perimeter increases by 2 × (2 + 2) = 8 cm.","v":"perimeter-plane-figures"},{"d":"HARD","q":"A square has the same perimeter as a rectangle measuring 14 cm by 6 cm. Find the square's side.","o":["8 cm","10 cm","12 cm","20 cm"],"a":1,"e":"Rectangle perimeter = 2(14 + 6) = 40 cm; square side = 40 ÷ 4 = 10 cm.","v":"perimeter-plane-figures"},{"d":"HARD","q":"A triangular path has sides 12 m, 15 m and 17 m. How many metres are needed to go around it 3 times?","o":["44 m","88 m","132 m","144 m"],"a":2,"e":"One circuit is 12 + 15 + 17 = 44 m; three circuits total 132 m.","v":"perimeter-plane-figures"},{"d":"HARD","q":"A rectangle has perimeter 72 cm. Its length is 4 cm more than its width. Find its width.","o":["14 cm","16 cm","18 cm","20 cm"],"a":1,"e":"Half perimeter is 36, so length + width = 36. With l = w + 4, 2w + 4 = 36; w = 16 cm.","v":"perimeter-plane-figures"},{"d":"HARD","q":"A regular hexagon's perimeter is 7.2 m. What is the length of each side in centimetres?","o":["12 cm","72 cm","120 cm","720 cm"],"a":2,"e":"7.2 m = 720 cm; each of six equal sides is 720 ÷ 6 = 120 cm.","v":"perimeter-plane-figures"},{"d":"HARD","q":"A rectangular courtyard is 28 m by 17 m. Fencing costs ₹45 per metre. What is the total cost to fence the entire boundary?","o":["₹2,025","₹3,600","₹4,050","₹5,400"],"a":2,"e":"Perimeter = 2(28 + 17) = 90 m; cost = 90 × ₹45 = ₹4,050.","v":"perimeter-plane-figures"},{"d":"HARD","q":"A rectangle's perimeter is 84 cm and its length is 26 cm. What is its width?","o":["12 cm","14 cm","16 cm","32 cm"],"a":2,"e":"Half perimeter is 42 cm; width = 42 − 26 = 16 cm.","v":"perimeter-plane-figures"}];
let index=0,score=0,answered=false,results=[];
const $=id=>document.getElementById(id);
function start(){index=0;score=0;results=[];$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()}
function render(){answered=false;const item=questions[index];$("level").textContent=item.d;$("counter").textContent='Question '+(index+1)+' of '+questions.length;$("bar").style.width=(index/questions.length*100)+'%';$("question").textContent=item.q;$("options").innerHTML='';$("feedback").classList.add("hidden");$("next").disabled=true;$("next").textContent=index===questions.length-1?'See results →':'Next question →';item.o.forEach((label,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+label;b.onclick=()=>choose(i);$("options").appendChild(b)})}
function choose(choice){if(answered)return;answered=true;const item=questions[index];const buttons=[...$("options").children];buttons.forEach((b,i)=>{b.disabled=true;if(i===item.a)b.classList.add('correct');if(i===choice&&i!==item.a)b.classList.add('wrong')});const ok=choice===item.a;if(ok)score++;results.push({d:item.d,ok});$("feedback").textContent=(ok?'Correct! ':'Not quite. ')+item.e;$("feedback").classList.remove('hidden');$("next").disabled=false;$("bar").style.width=((index+1)/questions.length*100)+'%'}
function next(){if(!answered)return;if(index<questions.length-1){index++;render()}else showResults()}
function showResults(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("score").textContent=score+'/'+questions.length;$("percent").textContent=Math.round(score/questions.length*100)+'%';$("summary").textContent=score>=24?'Excellent work — your profit-and-loss skills are developing well.':score>=16?'Good practice. Review the explanations and try again.':'Keep going. Review perimeter formulas and side-length calculations, then retry.';const levels=['BASIC','MEDIUM','HARD'].map(d=>d+': '+results.filter(r=>r.d===d&&r.ok).length+'/'+results.filter(r=>r.d===d).length);$("breakdown").textContent=levels.join(' · ')}
function restart(){start()}
$("next").addEventListener('click',next);start();
</script>
