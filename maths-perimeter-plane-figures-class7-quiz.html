<script>
(function(){
'use strict';
const questions=[{"q":"Perimeter is the:","o":["Space inside a shape","Total distance around a shape","Height of a shape","Number of corners"],"a":1,"why":"Perimeter is the total length of the boundary."},{"q":"A square has side 5 cm. Its perimeter is:","o":["10 cm","15 cm","20 cm","25 cm"],"a":2,"why":"Perimeter of a square = 4 × side = 20 cm."},{"q":"A rectangle is 8 cm long and 3 cm wide. Its perimeter is:","o":["11 cm","22 cm","24 cm","48 cm"],"a":1,"why":"Perimeter = 2(length + width) = 2(8+3) = 22 cm."},{"q":"The perimeter of an equilateral triangle with side 7 cm is:","o":["14 cm","21 cm","28 cm","49 cm"],"a":1,"why":"All three sides are equal: 3 × 7 = 21 cm."},{"q":"Which unit is suitable for the perimeter of a garden?","o":["Square metres","Cubic metres","Metres","Litres"],"a":2,"why":"Perimeter measures length, so use a linear unit such as metres."},{"q":"A triangle has sides 4 cm, 5 cm and 6 cm. Its perimeter is:","o":["9 cm","11 cm","15 cm","120 cm"],"a":2,"why":"Add all side lengths: 4+5+6=15 cm."},{"q":"A regular pentagon has each side 4 cm. Its perimeter is:","o":["9 cm","16 cm","20 cm","25 cm"],"a":2,"why":"A pentagon has five sides, so perimeter = 5×4=20 cm."},{"q":"The perimeter of a rectangle with length l and width w is:","o":["l×w","l+w","2(l+w)","4l"],"a":2,"why":"A rectangle has two lengths and two widths."},{"q":"A regular hexagon has six equal sides of 3 cm. Perimeter:","o":["9 cm","18 cm","24 cm","36 cm"],"a":1,"why":"Six sides × 3 cm = 18 cm."},{"q":"A square has perimeter 36 cm. Its side is:","o":["6 cm","9 cm","12 cm","18 cm"],"a":1,"why":"Side = perimeter ÷ 4 = 36÷4 = 9 cm."},{"q":"A rectangle has perimeter 50 cm and length 15 cm. Its width is:","o":["5 cm","10 cm","20 cm","25 cm"],"a":1,"why":"2(l+w)=50, so l+w=25 and w=10 cm."},{"q":"A triangle has perimeter 32 cm. Two sides are 9 cm and 11 cm. The third side is:","o":["10 cm","12 cm","13 cm","14 cm"],"a":1,"why":"Third side = 32−9−11=12 cm."},{"q":"A square's side increases from 4 cm to 7 cm. The perimeter increases by:","o":["3 cm","7 cm","12 cm","16 cm"],"a":2,"why":"Increase = 4×(7−4)=12 cm."},{"q":"A rectangle is 3 times as long as it is wide. If width is 4 cm, perimeter is:","o":["16 cm","24 cm","32 cm","48 cm"],"a":2,"why":"Length=12 cm; perimeter=2(12+4)=32 cm. Correct answer: 32 cm."},{"q":"A regular octagon has side length 2.5 cm. Its perimeter is:","o":["10 cm","16 cm","20 cm","25 cm"],"a":2,"why":"An octagon has eight sides: 8×2.5=20 cm."},{"q":"A rectangular field is 25 m long and 18 m wide. Fencing one full boundary requires:","o":["43 m","86 m","450 m","900 m"],"a":1,"why":"Perimeter=2(25+18)=86 m."},{"q":"A square and an equilateral triangle both have perimeter 24 cm. What is the triangle's side length?","o":["4 cm","6 cm","8 cm","12 cm"],"a":2,"why":"Triangle side = 24÷3 = 8 cm."},{"q":"A rectangle has length 12 cm and perimeter 40 cm. Its width is:","o":["6 cm","8 cm","10 cm","14 cm"],"a":1,"why":"l+w=20, so w=8 cm. Correct answer: 8 cm."},{"q":"A wire 48 cm long is shaped into a square. What is each side?","o":["8 cm","10 cm","12 cm","16 cm"],"a":2,"why":"Each side = 48÷4 = 12 cm."},{"q":"A polygon has side lengths 3, 4, 5, 6 and 7 cm. Its perimeter is:","o":["20 cm","25 cm","30 cm","35 cm"],"a":1,"why":"Sum of all sides = 3+4+5+6+7=25 cm."},{"q":"A rectangle's length is (x+4) cm and width is x cm. Its perimeter is 36 cm. Find x.","o":["5","7","9","14"],"a":1,"why":"2((x+4)+x)=36 gives 4x+8=36, so x=7."},{"q":"A square and a rectangle have equal perimeters. The square side is 8 cm; the rectangle length is 10 cm. Rectangle width is:","o":["4 cm","6 cm","8 cm","12 cm"],"a":1,"why":"Square perimeter=32 cm. Then 2(10+w)=32, so w=6 cm."},{"q":"A rectangular playground is 40 m by 25 m. A person walks around it twice. Distance covered:","o":["65 m","130 m","260 m","2,000 m"],"a":2,"why":"One round is 2(40+25)=130 m; two rounds = 260 m."},{"q":"A regular pentagon has perimeter 55 cm. Each side measures:","o":["5 cm","10 cm","11 cm","15 cm"],"a":2,"why":"Each of five equal sides is 55÷5=11 cm."},{"q":"A rectangle's length is twice its width and its perimeter is 54 cm. Its length is:","o":["9 cm","18 cm","27 cm","36 cm"],"a":1,"why":"Let width=w and length=2w. 2(3w)=54, so w=9 and length=18 cm."},{"q":"A 60 cm wire forms a rectangle with length 18 cm. Its width is:","o":["6 cm","12 cm","18 cm","24 cm"],"a":1,"why":"2(18+w)=60, so 18+w=30 and w=12 cm."},{"q":"A square's perimeter is equal to a triangle's perimeter. If the triangle sides are 8 cm, 9 cm and 11 cm, the square side is:","o":["6 cm","7 cm","8 cm","9 cm"],"a":1,"why":"Triangle perimeter=28 cm; square side=28÷4=7 cm. Correct answer: 7 cm."},{"q":"A rectangle's perimeter is 70 cm. Its length is 5 cm greater than its width. The width is:","o":["10 cm","15 cm","20 cm","30 cm"],"a":1,"why":"l+w=35 and l=w+5. Thus 2w+5=35, w=15 cm."},{"q":"A regular hexagon has perimeter 42 cm. A regular triangle has the same side length. Its perimeter is:","o":["14 cm","21 cm","28 cm","42 cm"],"a":1,"why":"Hexagon side=42÷6=7 cm; triangle perimeter=3×7=21 cm."},{"q":"A rectangle is 14 m long and 9 m wide. A 2 m-wide gate is left unfenced on one side. How much fencing is needed?","o":["23 m","44 m","46 m","48 m"],"a":1,"why":"Full perimeter=2(14+9)=46 m. Subtract the 2 m gate: 44 m."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function clearChildren(node){while(node.firstChild)node.removeChild(node.firstChild);}
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 clearChildren($('options'));
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.appendChild(letter);b.appendChild(label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Perimeter of Plane Figures Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261104-physics-path-layout-v2" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.appendChild(q);item.appendChild(yours);item.appendChild(correct);item.appendChild(why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 clearChildren($('finishSlot'));$('finishSlot').appendChild(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';clearChildren($('finishSlot'));render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
