<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><meta name="skillup-release" content="20261117-perimeter-plane-figures-class7-recreated-v2-simulator"><meta name="skillup-no-standard-menu" content="true"><meta name="description" content="Interactive Class 7 perimeter simulator for squares, rectangles, triangles and regular polygons."><title>SkillUp Maths | Perimeter Explorer</title>
<style>
:root{--ink:#233047;--muted:#68758b;--line:#e2e8f0;--blue:#3478c8;--teal:#159b83;--bg:#f5f7fb;--soft:#edf4ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
.top{max-width:820px;min-height:56px;margin:auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.back{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--blue);font-size:20px}
.brand{font-weight:900;text-decoration:none;color:var(--ink)}.brand span{color:var(--teal)}.spacer{flex:1}
main{width:min(100% - 28px,780px);margin:auto;padding:22px 0 44px}
.hero{padding:20px;border:1px solid #dce6f5;border-radius:18px;background:linear-gradient(120deg,#fff,#eef5ff);margin-bottom:16px}
.eyebrow{font-size:11px;letter-spacing:1px;font-weight:900;color:var(--teal)}
h1{font-size:clamp(24px,4vw,34px);line-height:1.2;margin:8px 0}.muted{color:var(--muted);line-height:1.6;font-size:14px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.links a{padding:9px 12px;border:1px solid #d8e3f3;border-radius:10px;background:#fff;color:#315e9b;text-decoration:none;font-size:13px;font-weight:800}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
button,input,select{font:inherit}button{cursor:pointer}
@media(max-width:560px){main{padding:14px 0 32px}.hero,.panel{padding:15px}.top{min-height:50px;padding:6px 12px}}
</style></head>
<style>
.panel{padding:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:6px;color:var(--muted)}.field input,.field select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--ink);font-size:16px}.result{margin-top:16px;padding:16px;border-radius:13px;background:#eaf8f3;color:#126c57;font-size:22px;font-weight:900}.work{margin-top:10px;padding:13px;border-radius:11px;background:#f0f4fb;color:#526078;line-height:1.6}.visual{display:grid;place-items:center;min-height:190px;margin-top:14px;padding:12px;background:#f4f7ff;border-radius:14px}.visual svg{width:100%;max-width:430px;height:auto}.action{margin-top:14px;padding:11px 15px;border:0;border-radius:10px;background:var(--teal);color:white;font-weight:850}
@media(max-width:560px){.grid{grid-template-columns:1fr}.panel{padding:15px}}

<body><header><div class="top"><a class="back" href="maths-perimeter-plane-figures-class7-quiz.html?v=20261117-perimeter-plane-figures-class7-recreated-v2-quiz" aria-label="Back to quiz">←</a><a class="brand" href="maths-home.html">SkillUp <span>Maths</span></a><div class="spacer"></div><strong>🧮 SIMULATOR</strong></div></header><main><section class="hero"><span class="eyebrow">INTERACTIVE MATHS LAB</span><h1>Perimeter Explorer</h1><p class="muted">Choose a shape, change its dimensions and watch the perimeter calculation update instantly.</p><div class="links"><a href="maths-perimeter-plane-figures-class7-learn.html?v=20261117-perimeter-plane-figures-class7-recreated-v2-learn">📘 Learn</a><a href="maths-perimeter-plane-figures-class7-quiz.html?v=20261117-perimeter-plane-figures-class7-recreated-v2-quiz">Take Quiz</a></div></section>
<section class="panel"><div class="grid"><div class="field"><label for="shape">Shape</label><select id="shape"><option value="rectangle">Rectangle</option><option value="square">Square</option><option value="triangle">Triangle</option><option value="polygon">Regular polygon</option></select></div><div class="field" id="nwrap"><label for="n">Number of equal sides</label><select id="n"><option value="5">Pentagon — 5</option><option value="6">Hexagon — 6</option><option value="8">Octagon — 8</option></select></div><div class="field"><label id="alabel" for="a">Length (cm)</label><input id="a" type="number" min=".1" step=".1" value="8"></div><div class="field" id="bwrap"><label id="blabel" for="b">Width (cm)</label><input id="b" type="number" min=".1" step=".1" value="3"></div><div class="field" id="cwrap" hidden><label for="c">Third side (cm)</label><input id="c" type="number" min=".1" step=".1" value="4"></div></div><div class="visual" id="visual" aria-label="Shape preview"></div><div class="result" id="result" aria-live="polite">Perimeter = 22 cm</div><div class="work" id="work">P = 2 × (8 + 3) = 22 cm</div><button class="action" id="reset" type="button">Reset example</button></section></main>
<script>
(()=>{const $=id=>document.getElementById(id),val=id=>Number($(id).value),fmt=x=>Number(x.toFixed(4)).toString();
function draw(){const shape=$('shape').value,a=val('a'),b=val('b'),c=val('c'),n=val('n');$('nwrap').hidden=shape!=='polygon';$('bwrap').hidden=shape==='square'||shape==='polygon';$('cwrap').hidden=shape!=='triangle';$('alabel').textContent=shape==='square'||shape==='polygon'?'Side length (cm)':shape==='triangle'?'Side a (cm)':'Length (cm)';$('blabel').textContent=shape==='triangle'?'Side b (cm)':'Width (cm)';
if([a].concat(shape==='rectangle'||shape==='triangle'?[b]:[],shape==='triangle'?[c]:[]).some(x=>!Number.isFinite(x)||x<=0)){ $('result').textContent='Enter positive dimensions.';$('work').textContent='All side lengths must be greater than zero.';return}
let p,formula,shapeName=shape; if(shape==='square'){p=4*a;formula='P = 4 × side = 4 × '+a}
else if(shape==='rectangle'){p=2*(a+b);formula='P = 2 × (length + width) = 2 × ('+a+' + '+b+')'}
else if(shape==='triangle'){if(a+b<=c||a+c<=b||b+c<=a){$('result').textContent='These lengths cannot form a triangle.';$('work').textContent='The sum of any two side lengths must be greater than the third side.';return}p=a+b+c;formula='P = a + b + c = '+a+' + '+b+' + '+c}
else{p=n*a;formula='P = number of sides × side = '+n+' × '+a;shapeName=n+'-sided regular polygon'}
$('result').textContent='Perimeter = '+fmt(p)+' cm';$('work').textContent=formula+' = '+fmt(p)+' cm';
let svg='';if(shape==='rectangle'||shape==='square'){const w=shape==='square'?a:b,h=a;svg='<svg viewBox="0 0 420 190" role="img" aria-label="'+shape+' diagram"><rect x="90" y="28" width="240" height="125" rx="7" fill="#dce9ff" stroke="#3478c8" stroke-width="4"/><text x="210" y="20" text-anchor="middle" fill="#315e9b" font-size="14">'+fmt(w)+' cm</text><text x="78" y="95" text-anchor="end" fill="#315e9b" font-size="14">'+fmt(h)+' cm</text></svg>'}else if(shape==='triangle'){svg='<svg viewBox="0 0 420 190" role="img" aria-label="Triangle diagram"><polygon points="210,20 350,155 70,155" fill="#dce9ff" stroke="#3478c8" stroke-width="4"/><text x="210" y="178" text-anchor="middle" fill="#315e9b" font-size="13">a = '+fmt(a)+' · b = '+fmt(b)+' · c = '+fmt(c)+' cm</text></svg>'}else{svg='<svg viewBox="0 0 420 190" role="img" aria-label="'+shapeName+' preview"><polygon points="210,18 330,65 330,135 210,174 90,135 90,65" fill="#dce9ff" stroke="#3478c8" stroke-width="4"/><text x="210" y="100" text-anchor="middle" fill="#315e9b" font-size="14">'+n+' equal sides</text></svg>'}$('visual').innerHTML=svg}
['shape','n','a','b','c'].forEach(id=>$(id).addEventListener('input',draw));$('reset').onclick=()=>{[['shape','rectangle'],['n','5'],['a','8'],['b','3'],['c','4']].forEach(([id,v])=>$(id).value=v);draw()};draw()})();
</script><script src="/shared-nav.js?v=20261125-central-design-system-v2"></script>
