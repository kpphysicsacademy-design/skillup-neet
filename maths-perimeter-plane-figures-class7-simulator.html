<main><span class="eyebrow">INTERACTIVE MATHS LAB</span><h1>Perimeter Explorer</h1><p class="muted">Choose a plane figure and change its dimensions. The perimeter and working update instantly.</p>
<section class="panel"><div class="fields"><div class="field"><label for="shape">Shape</label><select id="shape"><option value="rectangle">Rectangle</option><option value="square">Square</option><option value="triangle">Triangle</option><option value="regular">Regular polygon</option></select></div><div class="field" id="countField"><label for="count">Number of sides</label><select id="count"><option value="5">Pentagon (5)</option><option value="6">Hexagon (6)</option><option value="8">Octagon (8)</option><option value="3">Triangle (3)</option></select></div><div class="field" id="aField"><label id="aLabel" for="a">Length (cm)</label><input id="a" type="number" min="0.1" step="0.1" value="8"></div><div class="field" id="bField"><label id="bLabel" for="b">Width (cm)</label><input id="b" type="number" min="0.1" step="0.1" value="3"></div><div class="field" id="cField"><label for="c">Third side (cm)</label><input id="c" type="number" min="0.1" step="0.1" value="4"></div></div>

<script>(function(){const $=id=>document.getElementById(id);const num=id=>Number($(id).value);function calc(){const shape=$('shape').value;const a=num('a'),b=num('b'),c=num('c');$('countField').style.display=shape==='regular'?'block':'none';$('bField').style.display=['rectangle','triangle'].includes(shape)?'block':'none';$('cField').style.display=shape==='triangle'?'block':'none';$('aLabel').textContent=shape==='square'?'Side length (cm)':shape==='triangle'?'Side a (cm)':shape==='regular'?'Side length (cm)':'Length (cm)';$('bLabel').textContent=shape==='triangle'?'Side b (cm)':'Width (cm)';if([a,b,c].some(v=>!Number.isFinite(v)||v<=0)){ $('result').textContent='Enter positive side lengths.';$('work').textContent='All dimensions must be greater than zero.';return}let p,formula,svg='';if(shape==='rectangle'){p=2*(a+b);formula='P = 2 × (length + width) = 2 × ('+a+' + '+b+')'}else if(shape==='square'){p=4*a;formula='P = 4 × side = 4 × '+a}else if(shape==='triangle'){if(a+b<=c||a+c<=b||b+c<=a){$('result').textContent='These lengths cannot form a triangle.';$('work').textContent='The sum of any two sides must be greater than the third side.';return}p=a+b+c;formula='P = a + b + c = '+a+' + '+b+' + '+c}else{const n=num('count');p=n*a;formula='P = number of sides × side = '+n+' × '+a}const fmt=x=>Number(x.toFixed(4)).toString();$('result').textContent='Perimeter = '+fmt(p)+' cm';$('work').textContent=formula+' = '+fmt(p)+' cm';if(shape==='rectangle'||shape==='square'){const w=shape==='square'?a:b,h=a;svg='<svg viewBox="0 0 420 190" role="img" aria-label="'+shape+' illustration"><rect x="85" y="25" width="'+Math.min(240,Math.max(90,w*18))+'" height="'+Math.min(120,Math.max(55,h*14))+'" rx="8" fill="#dce6ff" stroke="#5265d8" stroke-width="4"/><text x="205" y="17" text-anchor="middle" fill="#34458e" font-size="13">'+fmt(w)+' cm</text><text x="75" y="90" text-anchor="end" fill="#34458e" font-size="13">'+fmt(h)+' cm</text></svg>'}else{svg='<svg viewBox="0 0 420 190" role="img" aria-label="polygon illustration"><polygon points="210,20 350,150 70,150" fill="#dce6ff" stroke="#5265d8" stroke-width="4"/><text x="210" y="174" text-anchor="middle" fill="#34458e" font-size="13">'+(shape==='triangle'?'Triangle':'Regular polygon')+'</text></svg>'}$('visual').innerHTML=svg}['shape','count','a','b','c'].forEach(id=>$(id).addEventListener('input',calc));$('reset').addEventListener('click',()=>{[['shape','rectangle'],['count','5'],['a','8'],['b','3'],['c','4']].forEach(([id,v])=>$(id).value=v);calc()});calc()})();</script></body></html>
