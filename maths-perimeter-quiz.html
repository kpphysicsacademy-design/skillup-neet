<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What is the perimeter of a shape?","o":["The distance around its boundary","The space inside it","Its weight","Its number of corners"],"a":0,"e":"Perimeter is the total distance around a closed shape.","v":"perimeter"},{"d":"BASIC","q":"A square has side length 4 cm. What is its perimeter?","o":["8 cm","12 cm","16 cm","20 cm"],"a":2,"e":"A square has four equal sides: 4 × 4 = 16 cm.","v":"perimeter"},{"d":"BASIC","q":"A rectangle is 6 cm long and 3 cm wide. Find its perimeter.","o":["9 cm","18 cm","12 cm","15 cm"],"a":1,"e":"P = 2 × (6 + 3) = 18 cm.","v":"perimeter"},{"d":"BASIC","q":"A triangle has sides 3 cm, 4 cm and 5 cm. What is its perimeter?","o":["7 cm","12 cm","15 cm","20 cm"],"a":1,"e":"Add all sides: 3 + 4 + 5 = 12 cm.","v":"perimeter"},{"d":"BASIC","q":"Which unit is suitable for the perimeter of a notebook?","o":["cm","cm²","cm³","kg"],"a":0,"e":"Perimeter is a length, measured in units such as cm.","v":"perimeter"},{"d":"BASIC","q":"A regular pentagon has sides of 2 cm each. Find its perimeter.","o":["7 cm","10 cm","12 cm","5 cm"],"a":1,"e":"Five equal sides: 5 × 2 = 10 cm.","v":"perimeter"},{"d":"BASIC","q":"A rectangle has length 8 m and width 2 m. What is its perimeter?","o":["10 m","16 m","20 m","12 m"],"a":2,"e":"P = 2 × (8 + 2) = 20 m.","v":"perimeter"},{"d":"BASIC","q":"A square's side is 7 cm. What is its perimeter?","o":["14 cm","21 cm","28 cm","49 cm"],"a":2,"e":"P = 4 × 7 = 28 cm.","v":"perimeter"},{"d":"BASIC","q":"A closed shape has side lengths 2 cm, 5 cm, 3 cm and 4 cm. Find its perimeter.","o":["14 cm","10 cm","12 cm","15 cm"],"a":0,"e":"2 + 5 + 3 + 4 = 14 cm.","v":"perimeter"},{"d":"BASIC","q":"Perimeter measures:","o":["Boundary length","Surface inside","Volume","Mass"],"a":0,"e":"Perimeter measures the distance around the shape.","v":"perimeter"},{"d":"MEDIUM","q":"A rectangle is 15 cm long and 9 cm wide. Find its perimeter.","o":["24 cm","48 cm","135 cm","42 cm"],"a":1,"e":"P = 2 × (15 + 9) = 48 cm.","v":"perimeter"},{"d":"MEDIUM","q":"A square has perimeter 36 cm. What is the length of one side?","o":["6 cm","9 cm","12 cm","18 cm"],"a":1,"e":"Each side is 36 ÷ 4 = 9 cm.","v":"perimeter"},{"d":"MEDIUM","q":"A rectangle has perimeter 34 m and length 10 m. Find its width.","o":["7 m","14 m","24 m","17 m"],"a":0,"e":"34 = 2(10 + w), so 17 = 10 + w and w = 7 m.","v":"perimeter"},{"d":"MEDIUM","q":"A triangle has sides 8 cm, 11 cm and 13 cm. Find its perimeter.","o":["21 cm","32 cm","30 cm","35 cm"],"a":1,"e":"8 + 11 + 13 = 32 cm.","v":"perimeter"},{"d":"MEDIUM","q":"A regular hexagon has side length 6 cm. What is its perimeter?","o":["12 cm","30 cm","36 cm","42 cm"],"a":2,"e":"A hexagon has six sides: 6 × 6 = 36 cm.","v":"perimeter"},{"d":"MEDIUM","q":"A rectangular garden is 18 m by 7 m. How much fencing is needed around it?","o":["25 m","50 m","126 m","36 m"],"a":1,"e":"P = 2 × (18 + 7) = 50 m.","v":"perimeter"},{"d":"MEDIUM","q":"A square's perimeter is 52 cm. Find its side length.","o":["13 cm","26 cm","12 cm","15 cm"],"a":0,"e":"52 ÷ 4 = 13 cm.","v":"perimeter"},{"d":"MEDIUM","q":"A rectangle has length 12 cm and width 5 cm. If both dimensions double, what is the new perimeter?","o":["34 cm","68 cm","60 cm","120 cm"],"a":1,"e":"New dimensions are 24 cm and 10 cm; P = 2(24 + 10) = 68 cm.","v":"perimeter"},{"d":"MEDIUM","q":"A shape has sides 7 cm, 7 cm, 4 cm, 4 cm and 5 cm. Find its perimeter.","o":["27 cm","22 cm","25 cm","30 cm"],"a":0,"e":"7 + 7 + 4 + 4 + 5 = 27 cm.","v":"perimeter"},{"d":"MEDIUM","q":"A rectangle has perimeter 46 cm and width 8 cm. Find its length.","o":["15 cm","23 cm","30 cm","19 cm"],"a":0,"e":"Half the perimeter is 23 cm, so length = 23 − 8 = 15 cm.","v":"perimeter"},{"d":"HARD","q":"A rectangular field is 32 m long and 18 m wide. What is the cost of fencing it at ₹25 per metre?","o":["₹1,250","₹2,500","₹2,000","₹5,000"],"a":1,"e":"Perimeter = 2(32 + 18) = 100 m; cost = 100 × ₹25 = ₹2,500.","v":"perimeter"},{"d":"HARD","q":"A square has the same perimeter as a rectangle of length 14 cm and width 6 cm. Find the square's side.","o":["10 cm","20 cm","40 cm","5 cm"],"a":0,"e":"Rectangle perimeter = 2(14 + 6) = 40 cm; square side = 40 ÷ 4 = 10 cm.","v":"perimeter"},{"d":"HARD","q":"A rectangle's perimeter is 64 cm. Its length is 20 cm. Find its width.","o":["12 cm","24 cm","22 cm","14 cm"],"a":0,"e":"Half perimeter is 32 cm; width = 32 − 20 = 12 cm.","v":"perimeter"},{"d":"HARD","q":"A wire 48 cm long is bent into a square. What is each side's length?","o":["8 cm","12 cm","16 cm","24 cm"],"a":1,"e":"The wire is the perimeter: 48 ÷ 4 = 12 cm per side.","v":"perimeter"},{"d":"HARD","q":"A rectangular park is 45 m long and 25 m wide. A gate 5 m wide is left unfenced. How many metres of fencing are needed?","o":["135 m","140 m","145 m","150 m"],"a":0,"e":"Perimeter = 2(45 + 25) = 140 m; subtract 5 m for the gate: 135 m.","v":"perimeter"},{"d":"HARD","q":"A rectangle has length 3 times its width. Its perimeter is 48 cm. What is its length?","o":["18 cm","12 cm","9 cm","24 cm"],"a":0,"e":"Let width be w; 2(3w + w) = 48, so 8w = 48, w = 6 and length = 18 cm.","v":"perimeter"},{"d":"HARD","q":"A regular octagon has side length 4.5 cm. Find its perimeter.","o":["13.5 cm","32 cm","36 cm","40.5 cm"],"a":2,"e":"An octagon has 8 equal sides: 8 × 4.5 = 36 cm.","v":"perimeter"},{"d":"HARD","q":"A farmer has 96 m of fencing for a square field. What is the area of the field?","o":["576 m²","24 m²","384 m²","9216 m²"],"a":0,"e":"Side = 96 ÷ 4 = 24 m; area = 24 × 24 = 576 m².","v":"perimeter"},{"d":"HARD","q":"A rectangle is 17 cm long and has perimeter 50 cm. What is its width?","o":["8 cm","16 cm","33 cm","25 cm"],"a":0,"e":"Half the perimeter is 25 cm; width = 25 − 17 = 8 cm.","v":"perimeter"},{"d":"HARD","q":"A triangular path has sides 12 m, 15 m and 19 m. A worker walks around it twice. How far does the worker walk?","o":["46 m","92 m","84 m","96 m"],"a":1,"e":"One perimeter is 12 + 15 + 19 = 46 m; twice around is 92 m.","v":"perimeter"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand and calculate perimeter</strong><small>Add side lengths and use perimeter formulas</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Calculate perimeters of common shapes</strong><small>Calculate totals and differences</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Find missing side lengths</strong><small>Solve fencing and boundary problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script></body></html>
