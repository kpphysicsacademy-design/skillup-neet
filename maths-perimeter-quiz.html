<main><div class="eyebrow">Maths · Mensuration</div><h1>Perimeter</h1><p class="intro">Calculate the distance around 2D shapes and solve practical perimeter problems.</p>

<script>
(()=>{'use strict';const questions=[{"d":"BASIC","q":"What does the perimeter of a closed shape measure?","o":["The distance around its boundary","The surface covered inside","The number of equal sides","The height from its base"],"a":0,"e":"Perimeter is the total distance around a closed shape.","v":"perimeter"},{"d":"BASIC","q":"A square has sides of 4 cm each. What is its perimeter?","o":["8 cm","12 cm","16 cm","20 cm"],"a":2,"e":"A square has four equal sides: 4 × 4 = 16 cm.","v":"perimeter"},{"d":"BASIC","q":"A rectangle is 7 cm long and 3 cm wide. What is its perimeter?","o":["10 cm","20 cm","21 cm","14 cm"],"a":1,"e":"Perimeter = 2 × (7 + 3) = 20 cm.","v":"perimeter"},{"d":"BASIC","q":"A triangle has side lengths 5 cm, 6 cm and 7 cm. Find its perimeter.","o":["18 cm","13 cm","30 cm","17 cm"],"a":0,"e":"Add the three sides: 5 + 6 + 7 = 18 cm.","v":"perimeter"},{"d":"BASIC","q":"A regular pentagon has five sides of 3 cm each. What is its perimeter?","o":["8 cm","12 cm","15 cm","18 cm"],"a":2,"e":"Five equal sides give 5 × 3 = 15 cm.","v":"perimeter"},{"d":"BASIC","q":"A rectangle has length 9 m and width 2 m. What is its perimeter?","o":["11 m","18 m","22 m","20 m"],"a":2,"e":"Perimeter = 2 × (9 + 2) = 22 m.","v":"perimeter"},{"d":"BASIC","q":"Which unit is most suitable for the perimeter of a notebook?","o":["Square centimetres","Centimetres","Cubic centimetres","Kilograms"],"a":1,"e":"Perimeter measures length, so a length unit such as centimetres is suitable.","v":"perimeter"},{"d":"BASIC","q":"A square has a perimeter of 28 cm. How long is one side?","o":["6 cm","7 cm","14 cm","8 cm"],"a":1,"e":"Each side is 28 ÷ 4 = 7 cm.","v":"perimeter"},{"d":"BASIC","q":"A rectangular garden has length 10 m and width 5 m. How much fencing is needed to go around it once?","o":["15 m","30 m","50 m","25 m"],"a":1,"e":"The boundary length is 2 × (10 + 5) = 30 m.","v":"perimeter"},{"d":"BASIC","q":"A shape has boundary sides 2 cm, 4 cm, 3 cm and 5 cm. What is its perimeter?","o":["9 cm","12 cm","14 cm","24 cm"],"a":2,"e":"Add every boundary side: 2 + 4 + 3 + 5 = 14 cm.","v":"perimeter"},{"d":"MEDIUM","q":"A rectangle is 12 cm long and 8 cm wide. What is its perimeter?","o":["20 cm","40 cm","96 cm","32 cm"],"a":1,"e":"Perimeter = 2 × (12 + 8) = 40 cm.","v":"perimeter"},{"d":"MEDIUM","q":"An equilateral triangle has a perimeter of 27 cm. What is each side length?","o":["6 cm","9 cm","18 cm","24 cm"],"a":1,"e":"Its three equal sides each measure 27 ÷ 3 = 9 cm.","v":"perimeter"},{"d":"MEDIUM","q":"A square has side length 11 m. How far is one complete walk around its boundary?","o":["22 m","33 m","44 m","121 m"],"a":2,"e":"Four sides of 11 m give a perimeter of 4 × 11 = 44 m.","v":"perimeter"},{"d":"MEDIUM","q":"A rectangle has perimeter 34 cm and length 10 cm. What is its width?","o":["7 cm","14 cm","12 cm","24 cm"],"a":0,"e":"Half the perimeter is 17 cm; width = 17 − 10 = 7 cm.","v":"perimeter"},{"d":"MEDIUM","q":"A triangular field has sides 14 m, 18 m and 20 m. What is its perimeter?","o":["42 m","52 m","56 m","62 m"],"a":1,"e":"14 + 18 + 20 = 52 m.","v":"perimeter"},{"d":"MEDIUM","q":"A rectangular photo frame is 15 cm long and 9 cm wide. What is the total frame length around its edge?","o":["24 cm","48 cm","135 cm","42 cm"],"a":1,"e":"The edge length is its perimeter: 2 × (15 + 9) = 48 cm.","v":"perimeter"},{"d":"MEDIUM","q":"A square playground has perimeter 64 m. How long is each side?","o":["8 m","16 m","32 m","12 m"],"a":1,"e":"Divide the perimeter by four: 64 ÷ 4 = 16 m.","v":"perimeter"},{"d":"MEDIUM","q":"A rectangle has length 13 cm and width 6 cm. If its length increases to 16 cm while width stays the same, what is the new perimeter?","o":["38 cm","44 cm","32 cm","22 cm"],"a":1,"e":"New perimeter = 2 × (16 + 6) = 44 cm.","v":"perimeter"},{"d":"MEDIUM","q":"A farmer walks around a rectangular plot 25 m long and 10 m wide twice. How far does the farmer walk?","o":["70 m","140 m","250 m","100 m"],"a":1,"e":"One lap is 2 × (25 + 10) = 70 m; two laps are 140 m.","v":"perimeter"},{"d":"MEDIUM","q":"A polygon has sides 6 cm, 6 cm, 4 cm, 5 cm and 7 cm. Find its perimeter.","o":["22 cm","28 cm","30 cm","35 cm"],"a":1,"e":"6 + 6 + 4 + 5 + 7 = 28 cm.","v":"perimeter"},{"d":"HARD","q":"A rectangle has perimeter 46 cm and length 15 cm. What is its width?","o":["8 cm","16 cm","23 cm","31 cm"],"a":0,"e":"Half the perimeter is 23 cm; width = 23 − 15 = 8 cm.","v":"perimeter"},{"d":"HARD","q":"A square garden has side 18 m. A gate 3 m wide is left unfenced along one side. How many metres of fencing are needed?","o":["72 m","69 m","57 m","54 m"],"a":1,"e":"The perimeter is 4 × 18 = 72 m; subtract the 3 m gate: 69 m.","v":"perimeter"},{"d":"HARD","q":"A rectangle's length is 3 times its width. Its perimeter is 32 cm. What is its length?","o":["4 cm","8 cm","12 cm","16 cm"],"a":2,"e":"Let width be w; 2(3w + w) = 32, so 8w = 32, w = 4 cm and length = 12 cm.","v":"perimeter"},{"d":"HARD","q":"A wire 48 cm long is shaped into a square. What is the side length of the square?","o":["6 cm","12 cm","16 cm","24 cm"],"a":1,"e":"The four equal sides share 48 cm: 48 ÷ 4 = 12 cm.","v":"perimeter"},{"d":"HARD","q":"A rectangle is 20 m long and 8 m wide. Its length is reduced by 4 m and its width increases by 2 m. What is the new perimeter?","o":["56 m","52 m","60 m","48 m"],"a":1,"e":"New dimensions are 16 m and 10 m; perimeter = 2 × (16 + 10) = 52 m.","v":"perimeter"},{"d":"HARD","q":"A triangular route has sides 17 m, 21 m and 24 m. A runner completes 3 laps. How far does the runner travel?","o":["62 m","124 m","186 m","192 m"],"a":2,"e":"One lap is 17 + 21 + 24 = 62 m; three laps are 186 m.","v":"perimeter"},{"d":"HARD","q":"A rectangular enclosure has perimeter 54 m and width 11 m. What is its length?","o":["16 m","27 m","32 m","43 m"],"a":0,"e":"Half the perimeter is 27 m; length = 27 − 11 = 16 m.","v":"perimeter"},{"d":"HARD","q":"Two identical squares each have side 5 cm and are placed side by side sharing one full side. What is the perimeter of the combined rectangle?","o":["20 cm","25 cm","30 cm","40 cm"],"a":2,"e":"The combined rectangle is 10 cm by 5 cm, so its perimeter is 2 × (10 + 5) = 30 cm.","v":"perimeter"},{"d":"HARD","q":"A rectangular park is 32 m long and 18 m wide. A person walks around it 4 times. What total distance is covered?","o":["100 m","200 m","400 m","800 m"],"a":2,"e":"One lap is 2 × (32 + 18) = 100 m; four laps are 400 m.","v":"perimeter"},{"d":"HARD","q":"A rectangle is 17 cm long and has perimeter 50 cm. What is its width?","o":["8 cm","16 cm","33 cm","25 cm"],"a":0,"e":"Half the perimeter is 25 cm; width = 25 − 17 = 8 cm.","v":"perimeter"}];const $=id=>document.getElementById(id);let i=0,sel=-1,locked=false,done=false,xp=0,correct=0,streak=0;const letters=['A','B','C','D'];
function progress(){const p=Math.round(i/questions.length*100);$('bar').style.width=p+'%';$('progress').setAttribute('aria-valuenow',p);$('pct').textContent=p+'% complete';}
function render(){const q=questions[i];sel=-1;locked=false;$('quiz').hidden=false;$('finish').hidden=true;$('counter').textContent='QUESTION '+(i+1)+' OF '+questions.length;$('meta').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(i+1);$('question').textContent=q.q;$('options').innerHTML='';q.o.forEach((v,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.innerHTML='<span class="letter">'+letters[j]+'</span><span></span>';b.querySelector('span:last-child').textContent=v;b.onclick=()=>{if(locked)return;sel=j;[...$('options').children].forEach((x,k)=>x.classList.toggle('selected',k===j));$('action').disabled=false;};$('options').appendChild(b);});$('feedback').className='feedback';$('feedback').textContent='';$('hint').textContent='30 questions · Select one answer';$('action').textContent='Check answer';$('action').disabled=true;progress();}
function act(){if(done){restart();return;}const q=questions[i];if(!locked){if(sel<0)return;locked=true;const ok=sel===q.a;if(ok){correct++;xp+=10;streak++;}else streak=0;$('xp').textContent='⭐ '+xp+' XP';$('streak').textContent='🔥 '+streak;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===sel)b.classList.add('wrong');});$('feedback').textContent=(ok?'✨ Correct! ':'💡 Review: ')+q.e;$('feedback').className='feedback show '+(ok?'good':'bad');$('hint').textContent=ok?'+10 XP':'Keep practising';$('action').textContent=i===questions.length-1?'View results →':'Continue →';return;}if(i<questions.length-1){i++;render();}else results();}
function results(){done=true;$('quiz').hidden=true;$('finish').hidden=false;$('counter').textContent='QUIZ COMPLETE';$('bar').style.width='100%';$('progress').setAttribute('aria-valuenow','100');$('pct').textContent='100% complete';$('finish').innerHTML='<div style="font-size:46px">🏆</div><h2>'+(correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!')+'</h2><div class="score">'+correct+' / '+questions.length+'</div><p>'+Math.round(correct/questions.length*100)+'% accuracy · '+xp+' XP earned</p><div class="skill"><strong>🔢 Compare decimal values</strong><small>Use place value to compare decimals accurately.</small></div><div class="skill"><strong>↔️ Order decimal numbers</strong><small>Compare decimals with different numbers of digits.</small></div><div class="skill"><strong>🧠 Apply comparison strategies</strong><small>Use equivalent trailing zeros and aligned place values.</small></div><button class="btn" id="retry">Try again ↻</button>';$('retry').onclick=restart;}
function restart(){i=0;sel=-1;locked=false;done=false;xp=0;correct=0;streak=0;$('xp').textContent='⭐ 0 XP';$('streak').textContent='🔥 0';render();}
$('action').onclick=act;render();})();
</script><script src="/shared-nav.js?v=20261017-duolingo-standard-v1"></script></body></html>
