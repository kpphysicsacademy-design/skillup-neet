<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Whole numbers</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What does the perimeter of a closed shape measure?","o":["The distance around its boundary","The surface covered inside","The number of equal sides","The height from its base"],"a":0,"e":"Perimeter is the total distance around a closed shape.","v":"perimeter"},{"d":"BASIC","q":"A square has sides of 4 cm each. What is its perimeter?","o":["8 cm","12 cm","16 cm","20 cm"],"a":2,"e":"A square has four equal sides: 4 × 4 = 16 cm.","v":"perimeter"},{"d":"BASIC","q":"A rectangle is 7 cm long and 3 cm wide. What is its perimeter?","o":["10 cm","20 cm","21 cm","14 cm"],"a":1,"e":"Perimeter = 2 × (7 + 3) = 20 cm.","v":"perimeter"},{"d":"BASIC","q":"A triangle has side lengths 5 cm, 6 cm and 7 cm. Find its perimeter.","o":["18 cm","13 cm","30 cm","17 cm"],"a":0,"e":"Add the three sides: 5 + 6 + 7 = 18 cm.","v":"perimeter"},{"d":"BASIC","q":"A regular pentagon has five sides of 3 cm each. What is its perimeter?","o":["8 cm","12 cm","15 cm","18 cm"],"a":2,"e":"Five equal sides give 5 × 3 = 15 cm.","v":"perimeter"},{"d":"BASIC","q":"A rectangle has length 9 m and width 2 m. What is its perimeter?","o":["11 m","18 m","22 m","20 m"],"a":2,"e":"Perimeter = 2 × (9 + 2) = 22 m.","v":"perimeter"},{"d":"BASIC","q":"Which unit is most suitable for the perimeter of a notebook?","o":["Square centimetres","Centimetres","Cubic centimetres","Kilograms"],"a":1,"e":"Perimeter measures length, so a length unit such as centimetres is suitable.","v":"perimeter"},{"d":"BASIC","q":"A square has a perimeter of 28 cm. How long is one side?","o":["6 cm","7 cm","14 cm","8 cm"],"a":1,"e":"Each side is 28 ÷ 4 = 7 cm.","v":"perimeter"},{"d":"BASIC","q":"A rectangular garden has length 10 m and width 5 m. How much fencing is needed to go around it once?","o":["15 m","30 m","50 m","25 m"],"a":1,"e":"The boundary length is 2 × (10 + 5) = 30 m.","v":"perimeter"},{"d":"BASIC","q":"A shape has boundary sides 2 cm, 4 cm, 3 cm and 5 cm. What is its perimeter?","o":["9 cm","12 cm","14 cm","24 cm"],"a":2,"e":"Add every boundary side: 2 + 4 + 3 + 5 = 14 cm.","v":"perimeter"},{"d":"MEDIUM","q":"A rectangle is 12 cm long and 8 cm wide. What is its perimeter?","o":["20 cm","40 cm","96 cm","32 cm"],"a":1,"e":"Perimeter = 2 × (12 + 8) = 40 cm.","v":"perimeter"},{"d":"MEDIUM","q":"An equilateral triangle has a perimeter of 27 cm. What is each side length?","o":["6 cm","9 cm","18 cm","24 cm"],"a":1,"e":"Its three equal sides each measure 27 ÷ 3 = 9 cm.","v":"perimeter"},{"d":"MEDIUM","q":"A square has side length 11 m. How far is one complete walk around its boundary?","o":["22 m","33 m","44 m","121 m"],"a":2,"e":"Four sides of 11 m give a perimeter of 4 × 11 = 44 m.","v":"perimeter"},{"d":"MEDIUM","q":"A rectangle has perimeter 34 cm and length 10 cm. What is its width?","o":["7 cm","14 cm","12 cm","24 cm"],"a":0,"e":"Half the perimeter is 17 cm; width = 17 − 10 = 7 cm.","v":"perimeter"},{"d":"MEDIUM","q":"A triangular field has sides 14 m, 18 m and 20 m. What is its perimeter?","o":["42 m","52 m","56 m","62 m"],"a":1,"e":"14 + 18 + 20 = 52 m.","v":"perimeter"},{"d":"MEDIUM","q":"A rectangular photo frame is 15 cm long and 9 cm wide. What is the total frame length around its edge?","o":["24 cm","48 cm","135 cm","42 cm"],"a":1,"e":"The edge length is its perimeter: 2 × (15 + 9) = 48 cm.","v":"perimeter"},{"d":"MEDIUM","q":"A square playground has perimeter 64 m. How long is each side?","o":["8 m","16 m","32 m","12 m"],"a":1,"e":"Divide the perimeter by four: 64 ÷ 4 = 16 m.","v":"perimeter"},{"d":"MEDIUM","q":"A rectangle has length 13 cm and width 6 cm. If its length increases to 16 cm while width stays the same, what is the new perimeter?","o":["38 cm","44 cm","32 cm","22 cm"],"a":1,"e":"New perimeter = 2 × (16 + 6) = 44 cm.","v":"perimeter"},{"d":"MEDIUM","q":"A farmer walks around a rectangular plot 25 m long and 10 m wide twice. How far does the farmer walk?","o":["70 m","140 m","250 m","100 m"],"a":1,"e":"One lap is 2 × (25 + 10) = 70 m; two laps are 140 m.","v":"perimeter"},{"d":"MEDIUM","q":"A polygon has sides 6 cm, 6 cm, 4 cm, 5 cm and 7 cm. Find its perimeter.","o":["22 cm","28 cm","30 cm","35 cm"],"a":1,"e":"6 + 6 + 4 + 5 + 7 = 28 cm.","v":"perimeter"},{"d":"HARD","q":"A rectangle has perimeter 46 cm and length 15 cm. What is its width?","o":["8 cm","16 cm","23 cm","31 cm"],"a":0,"e":"Half the perimeter is 23 cm; width = 23 − 15 = 8 cm.","v":"perimeter"},{"d":"HARD","q":"A square garden has side 18 m. A gate 3 m wide is left unfenced along one side. How many metres of fencing are needed?","o":["72 m","69 m","57 m","54 m"],"a":1,"e":"The perimeter is 4 × 18 = 72 m; subtract the 3 m gate: 69 m.","v":"perimeter"},{"d":"HARD","q":"A rectangle's length is 3 times its width. Its perimeter is 32 cm. What is its length?","o":["4 cm","8 cm","12 cm","16 cm"],"a":2,"e":"Let width be w; 2(3w + w) = 32, so 8w = 32, w = 4 cm and length = 12 cm.","v":"perimeter"},{"d":"HARD","q":"A wire 48 cm long is shaped into a square. What is the side length of the square?","o":["6 cm","12 cm","16 cm","24 cm"],"a":1,"e":"The four equal sides share 48 cm: 48 ÷ 4 = 12 cm.","v":"perimeter"},{"d":"HARD","q":"A rectangle is 20 m long and 8 m wide. Its length is reduced by 4 m and its width increases by 2 m. What is the new perimeter?","o":["56 m","52 m","60 m","48 m"],"a":1,"e":"New dimensions are 16 m and 10 m; perimeter = 2 × (16 + 10) = 52 m.","v":"perimeter"},{"d":"HARD","q":"A triangular route has sides 17 m, 21 m and 24 m. A runner completes 3 laps. How far does the runner travel?","o":["62 m","124 m","186 m","192 m"],"a":2,"e":"One lap is 17 + 21 + 24 = 62 m; three laps are 186 m.","v":"perimeter"},{"d":"HARD","q":"A rectangular enclosure has perimeter 54 m and width 11 m. What is its length?","o":["16 m","27 m","32 m","43 m"],"a":0,"e":"Half the perimeter is 27 m; length = 27 − 11 = 16 m.","v":"perimeter"},{"d":"HARD","q":"Two identical squares each have side 5 cm and are placed side by side sharing one full side. What is the perimeter of the combined rectangle?","o":["20 cm","25 cm","30 cm","40 cm"],"a":2,"e":"The combined rectangle is 10 cm by 5 cm, so its perimeter is 2 × (10 + 5) = 30 cm.","v":"perimeter"},{"d":"HARD","q":"A rectangular park is 32 m long and 18 m wide. A person walks around it 4 times. What total distance is covered?","o":["100 m","200 m","400 m","800 m"],"a":2,"e":"One lap is 2 × (32 + 18) = 100 m; four laps are 400 m.","v":"perimeter"},{"d":"HARD","q":"A rectangle is 17 cm long and has perimeter 50 cm. What is its width?","o":["8 cm","16 cm","33 cm","25 cm"],"a":0,"e":"Half the perimeter is 25 cm; width = 25 − 17 = 8 cm.","v":"perimeter"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand and calculate perimeter</strong><small>Add side lengths and use perimeter formulas</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Calculate perimeters of common shapes</strong><small>Calculate totals and differences</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Find missing side lengths</strong><small>Solve fencing and boundary problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
