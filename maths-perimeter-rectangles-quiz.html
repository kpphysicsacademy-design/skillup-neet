<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What is the perimeter of a rectangle?","o":["Length × width","2 × (length + width)","Length + width","Length × 2"],"a":1,"e":"A rectangle has two lengths and two widths, so P = 2(l + w).","v":"perimeter-rectangles"},{"d":"BASIC","q":"A rectangle is 5 cm long and 3 cm wide. Find its perimeter.","o":["8 cm","15 cm","16 cm","10 cm"],"a":2,"e":"P = 2 × (5 + 3) = 16 cm.","v":"perimeter-rectangles"},{"d":"BASIC","q":"A rectangle is 8 m long and 2 m wide. What is its perimeter?","o":["10 m","16 m","20 m","12 m"],"a":2,"e":"P = 2 × (8 + 2) = 20 m.","v":"perimeter-rectangles"},{"d":"BASIC","q":"Which unit is suitable for the perimeter of a rectangular table?","o":["cm²","cm","cm³","litres"],"a":1,"e":"Perimeter is a length, so use linear units such as cm.","v":"perimeter-rectangles"},{"d":"BASIC","q":"A rectangle has length 7 cm and width 4 cm. What is the sum of all four sides?","o":["11 cm","22 cm","28 cm","14 cm"],"a":1,"e":"7 + 4 + 7 + 4 = 22 cm.","v":"perimeter-rectangles"},{"d":"BASIC","q":"A rectangle has length 10 cm and width 6 cm. Find its perimeter.","o":["16 cm","32 cm","60 cm","26 cm"],"a":1,"e":"P = 2 × (10 + 6) = 32 cm.","v":"perimeter-rectangles"},{"d":"BASIC","q":"If a rectangle's length is 9 cm and width is 5 cm, which pair of sides are equal?","o":["All four sides","Opposite sides","Only adjacent sides","No sides"],"a":1,"e":"Opposite sides of a rectangle are equal.","v":"perimeter-rectangles"},{"d":"BASIC","q":"A rectangle's length and width are 4 cm and 4 cm. What shape is it?","o":["Triangle","Circle","Square","Pentagon"],"a":2,"e":"A rectangle with all sides equal is a square.","v":"perimeter-rectangles"},{"d":"BASIC","q":"A rectangular card is 12 cm long and 3 cm wide. Its perimeter is:","o":["15 cm","30 cm","36 cm","24 cm"],"a":1,"e":"P = 2 × (12 + 3) = 30 cm.","v":"perimeter-rectangles"},{"d":"BASIC","q":"A rectangle has perimeter 18 cm, length 5 cm and width 4 cm. Is the perimeter correct?","o":["Yes, because 2 × (5 + 4) = 18","No, because it is 9 cm","No, because it is 20 cm","Yes, because 5 × 4 = 20"],"a":0,"e":"P = 2 × (5 + 4) = 18 cm, so the given perimeter is correct.","v":"perimeter-rectangles"},{"d":"MEDIUM","q":"A rectangle has perimeter 46 cm and length 15 cm. Find its width.","o":["8 cm","16 cm","23 cm","31 cm"],"a":0,"e":"Half the perimeter is 23 cm; width = 23 − 15 = 8 cm.","v":"perimeter-rectangles"},{"d":"MEDIUM","q":"A rectangle is 18 m long and 7 m wide. How much fencing is needed around it?","o":["25 m","50 m","126 m","36 m"],"a":1,"e":"P = 2 × (18 + 7) = 50 m.","v":"perimeter-rectangles"},{"d":"MEDIUM","q":"A rectangle has perimeter 60 cm and width 10 cm. Find its length.","o":["20 cm","30 cm","40 cm","15 cm"],"a":0,"e":"Half perimeter is 30 cm; length = 30 − 10 = 20 cm.","v":"perimeter-rectangles"},{"d":"MEDIUM","q":"The length of a rectangle is 12 cm and its width is 8 cm. If both double, what is the new perimeter?","o":["40 cm","80 cm","96 cm","48 cm"],"a":1,"e":"New dimensions are 24 cm and 16 cm; P = 2 × 40 = 80 cm.","v":"perimeter-rectangles"},{"d":"MEDIUM","q":"A rectangle has length 14 cm and width 9 cm. Find its perimeter.","o":["23 cm","46 cm","126 cm","42 cm"],"a":1,"e":"P = 2 × (14 + 9) = 46 cm.","v":"perimeter-rectangles"},{"d":"MEDIUM","q":"A rectangular garden has perimeter 72 m and length 22 m. What is its width?","o":["14 m","28 m","36 m","50 m"],"a":0,"e":"Half perimeter is 36 m; width = 36 − 22 = 14 m.","v":"perimeter-rectangles"},{"d":"MEDIUM","q":"A rectangle's width is 6 cm and length is 3 times its width. Find the perimeter.","o":["24 cm","48 cm","36 cm","18 cm"],"a":1,"e":"Length = 18 cm; P = 2 × (18 + 6) = 48 cm.","v":"perimeter-rectangles"},{"d":"MEDIUM","q":"A rectangular poster is 25 cm by 15 cm. How much ribbon is needed to go once around its edge?","o":["40 cm","75 cm","80 cm","100 cm"],"a":2,"e":"P = 2 × (25 + 15) = 80 cm.","v":"perimeter-rectangles"},{"d":"MEDIUM","q":"A rectangle has perimeter 100 cm and length 32 cm. Find its width.","o":["18 cm","36 cm","50 cm","68 cm"],"a":0,"e":"Half perimeter is 50 cm; width = 50 − 32 = 18 cm.","v":"perimeter-rectangles"},{"d":"MEDIUM","q":"A rectangle is 11 cm long and 5 cm wide. How much greater is its perimeter than 2 times its length?","o":["10 cm","5 cm","32 cm","22 cm"],"a":0,"e":"Perimeter = 32 cm; twice the length = 22 cm; difference = 10 cm.","v":"perimeter-rectangles"},{"d":"HARD","q":"A rectangular field is 38 m long and 17 m wide. Fencing costs ₹30 per metre. What is the total cost?","o":["₹1,650","₹3,300","₹1,140","₹3,000"],"a":1,"e":"P = 2 × (38 + 17) = 110 m; cost = 110 × ₹30 = ₹3,300.","v":"perimeter-rectangles"},{"d":"HARD","q":"A rectangle has perimeter 86 cm. Its length is 27 cm. Find its width.","o":["16 cm","32 cm","43 cm","59 cm"],"a":0,"e":"Half perimeter is 43 cm; width = 43 − 27 = 16 cm.","v":"perimeter-rectangles"},{"d":"HARD","q":"A rectangular playground is 45 m long and 28 m wide. A gate 4 m wide is not fenced. How much fencing is required?","o":["142 m","146 m","73 m","150 m"],"a":0,"e":"Perimeter = 2 × (45 + 28) = 146 m; subtract 4 m for the gate = 142 m.","v":"perimeter-rectangles"},{"d":"HARD","q":"The length of a rectangle is twice its width. Its perimeter is 54 cm. What is its length?","o":["9 cm","18 cm","27 cm","36 cm"],"a":1,"e":"Let width be w. 2(2w + w) = 54, so 6w = 54, w = 9 and length = 18 cm.","v":"perimeter-rectangles"},{"d":"HARD","q":"A rectangle has perimeter 64 cm. Its length is 4 cm more than its width. Find its length.","o":["14 cm","18 cm","16 cm","20 cm"],"a":1,"e":"Half perimeter is 32; let width w, length w+4. 2w+4=32, w=14 and length=18 cm.","v":"perimeter-rectangles"},{"d":"HARD","q":"A rectangular field has length 60 m and width 35 m. A farmer walks around it three times. How far does the farmer walk?","o":["190 m","285 m","570 m","1,140 m"],"a":2,"e":"One perimeter is 2(60 + 35) = 190 m; three laps = 570 m.","v":"perimeter-rectangles"},{"d":"HARD","q":"A rectangle's perimeter is 120 cm. If its length is 40 cm, what is its area?","o":["400 cm²","800 cm²","1,200 cm²","1,600 cm²"],"a":1,"e":"Half perimeter is 60 cm; width = 60 − 40 = 20 cm; area = 40 × 20 = 800 cm².","v":"perimeter-rectangles"},{"d":"HARD","q":"The length of a rectangle increases by 5 cm while width stays 7 cm. By how much does perimeter increase?","o":["5 cm","10 cm","12 cm","14 cm"],"a":1,"e":"Increasing one length by 5 adds 5 to each of two opposite sides, so perimeter increases by 10 cm.","v":"perimeter-rectangles"},{"d":"HARD","q":"A rectangular frame is 24 cm long and 16 cm wide. How much trim is needed for 3 identical frames?","o":["80 cm","120 cm","240 cm","480 cm"],"a":2,"e":"One frame perimeter = 2(24 + 16) = 80 cm; three frames need 240 cm.","v":"perimeter-rectangles"},{"d":"HARD","q":"A rectangle has perimeter 74 cm and width 12 cm. What is its length?","o":["25 cm","37 cm","50 cm","31 cm"],"a":0,"e":"Half perimeter is 37 cm; length = 37 − 12 = 25 cm.","v":"perimeter-rectangles"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Calculate the perimeter of rectangles</strong><small>Use length and width correctly</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Find missing rectangle dimensions</strong><small>Calculate totals and differences</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve fencing and boundary problems</strong><small>Apply rectangle perimeter in real life</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
