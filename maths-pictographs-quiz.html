<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261012-pictographs-no-images-duolingo-v1"><title>Pictographs | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Whole numbers</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"In a pictograph, what does a key explain?","o":["What each symbol represents","The title only","The page number","The colour of the paper"],"a":0,"e":"The key tells how many items each symbol stands for.","v":"pictographs"},{"d":"BASIC","q":"If one ★ represents 1 book, what do ★★★ represent?","o":["2 books","3 books","4 books","5 books"],"a":1,"e":"Each star represents one book, so three stars represent three books.","v":"pictographs"},{"d":"BASIC","q":"If one ● represents 2 votes, what do ●●● represent?","o":["3 votes","5 votes","6 votes","8 votes"],"a":2,"e":"Three symbols × 2 votes = 6 votes.","v":"pictographs"},{"d":"BASIC","q":"Which part tells what a pictograph is about?","o":["Title","Key alone","Last row only","Page number"],"a":0,"e":"A clear title identifies the subject of the data.","v":"pictographs"},{"d":"BASIC","q":"A pictograph uses one 🍎 for 4 apples. How many apples do 🍎🍎 show?","o":["2","4","8","12"],"a":2,"e":"Two symbols represent 2 × 4 = 8 apples.","v":"pictographs"},{"d":"BASIC","q":"What should categories in a pictograph have?","o":["Clear labels","No names","Random numbers","Different meanings in the same row"],"a":0,"e":"Labels identify what each row represents.","v":"pictographs"},{"d":"BASIC","q":"If one smiley represents 5 students, one smiley means:","o":["1 student","5 students","10 students","15 students"],"a":1,"e":"The key assigns a value of five students to each smiley.","v":"pictographs"},{"d":"BASIC","q":"A pictograph is most useful for:","o":["Showing data visually for easy comparison","Solving every equation","Measuring angles","Naming polygons"],"a":0,"e":"Pictures can make counts easier to compare quickly.","v":"pictographs"},{"d":"BASIC","q":"If one book symbol represents 2 books, how many books do four symbols show?","o":["4","6","8","10"],"a":2,"e":"4 × 2 = 8 books.","v":"pictographs"},{"d":"BASIC","q":"Why is the key important?","o":["Without it, symbol values may be unclear","It replaces all labels","It changes the data","It tells the future"],"a":0,"e":"The key prevents confusion about the value of each symbol.","v":"pictographs"},{"d":"MEDIUM","q":"A chart key says one ★ = 3 points. What do ★★★★★ represent?","o":["8","12","15","18"],"a":2,"e":"Five stars × 3 points = 15 points.","v":"pictographs"},{"d":"MEDIUM","q":"A pictograph shows 4 symbols for red balls and 6 for blue balls. One symbol = 2 balls. How many balls altogether?","o":"20","a":2,"e":"There are 4 + 6 = 10 symbols, each worth 2 balls: 10 × 2 = 20 balls.","v":"pictographs"},{"d":"MEDIUM","q":"A pictograph has 7 symbols in one row. Each symbol means 4 tickets. How many tickets?","o":["11","24","28","32"],"a":2,"e":"7 × 4 = 28 tickets.","v":"pictographs"},{"d":"MEDIUM","q":"One symbol stands for 5 books. A row shows 6 symbols. Another shows 4 symbols. How many more books are in the first row?","o":["5","10","20","50"],"a":1,"e":"Difference is 2 symbols × 5 books = 10.","v":"pictographs"},{"d":"MEDIUM","q":"A chart key is one ● = 2 votes. A category shows 3 ● and a half-symbol. How many votes?","o":["6","7","8","5"],"a":1,"e":"Three full symbols give 6 votes; half a symbol gives 1 more.","v":"pictographs"},{"d":"MEDIUM","q":"A pictograph shows 5 symbols for Monday and 8 for Tuesday. Each symbol = 3 visitors. How many visitors on Tuesday?","o":["11","15","24","30"],"a":2,"e":"8 × 3 = 24 visitors.","v":"pictographs"},{"d":"MEDIUM","q":"Monday has 5 symbols and Tuesday has 8; each symbol = 3 visitors. How many more visited Tuesday?","o":["3","9","15","24"],"a":1,"e":"(8 − 5) × 3 = 9 more visitors.","v":"pictographs"},{"d":"MEDIUM","q":"A pictograph's categories show 12, 20 and 16 items. Which category has the greatest count?","o":["First","Second","Third","All equal"],"a":1,"e":"20 is the largest count.","v":"pictographs"},{"d":"MEDIUM","q":"One symbol represents 4 children. A row has 3 symbols. How many children does it show?","o":["7","12","16","4"],"a":1,"e":"3 × 4 = 12 children.","v":"pictographs"},{"d":"MEDIUM","q":"A row shows 9 symbols; each symbol represents 2 plants. How many plants are shown?","o":["11","18","20","9"],"a":1,"e":"9 × 2 = 18 plants.","v":"pictographs"},{"d":"HARD","q":"A key says one ★ = 4 books. Class A has 7 stars and Class B has 5. How many books altogether?","o":["48","28","20","12"],"a":0,"e":"(7 + 5) × 4 = 48 books.","v":"pictographs"},{"d":"HARD","q":"Using one ★ = 4 books, Class A has 7 stars and B has 5. How many more books does A have?","o":["8","2","12","28"],"a":0,"e":"(7 − 5) × 4 = 8 books.","v":"pictographs"},{"d":"HARD","q":"One symbol represents 6 votes. A row has 4 symbols and another has 7. What is the difference in votes?","o":["18","24","42","66"],"a":0,"e":"(7 − 4) × 6 = 18 votes.","v":"pictographs"},{"d":"HARD","q":"A pictograph represents 3 apples per symbol. A class has 27 apples. How many symbols are needed?","o":["6","8","9","12"],"a":2,"e":"27 ÷ 3 = 9 symbols.","v":"pictographs"},{"d":"HARD","q":"One symbol equals 5 books. The library has 45 books shown in a pictograph. How many symbols are needed?","o":["8","9","10","5"],"a":1,"e":"45 ÷ 5 = 9 symbols.","v":"pictographs"},{"d":"HARD","q":"A key says one ● = 4 students. A row shows 6 ●. If 4 students join, how many students are there now?","o":["24","28","30","10"],"a":1,"e":"6 × 4 = 24; then 24 + 4 = 28.","v":"pictographs"},{"d":"HARD","q":"One symbol represents 2 points. Team Red has 9 symbols and Team Blue has 6. What is their combined score?","o":["15","24","30","18"],"a":2,"e":"(9 + 6) × 2 = 30 points.","v":"pictographs"},{"d":"HARD","q":"One symbol stands for 3 toys. A pictograph shows 8 symbols. If 6 toys are removed, how many remain?","o":["18","24","20","30"],"a":0,"e":"8 × 3 = 24; 24 − 6 = 18 toys.","v":"pictographs"},{"d":"HARD","q":"A pictograph shows 4 symbols for 20 students. If every symbol has equal value, how many students does one symbol represent?","o":["4","5","16","8"],"a":1,"e":"20 ÷ 4 = 5 students per symbol.","v":"pictographs"},{"d":"HARD","q":"A key says one ★ = 5 votes. A row has 4 stars and another has 3 stars. How many votes in total?","o":["7","20","35","15"],"a":2,"e":"(4 + 3) × 5 = 35 votes.","v":"pictographs"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Interpret pictographs</strong><small>Use keys and symbols</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Compare pictograph categories</strong><small>Calculate symbol values</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Find totals and differences from pictographs</strong><small>Solve pictograph problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script></body></html>
