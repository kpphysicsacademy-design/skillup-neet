<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261012-pictographs-quiz-v2"><title>Pictographs | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Whole numbers</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"In a pictograph, one star represents 2 books. What do 4 stars represent?","o":["8 books","6 books","4 books","2 books"],"a":0,"e":"Four symbols × 2 books = 8 books.","v":"pictographs"},{"d":"BASIC","q":"One apple symbol represents 3 apples. What do 5 symbols represent?","o":["15","8","10","12"],"a":0,"e":"5 × 3 = 15 apples.","v":"pictographs"},{"d":"BASIC","q":"One circle represents 4 students. What do 3 circles represent?","o":["12 students","7 students","4 students","16 students"],"a":0,"e":"3 × 4 = 12 students.","v":"pictographs"},{"d":"BASIC","q":"One book symbol represents 5 books. How many symbols show 20 books?","o":["4","5","15","25"],"a":0,"e":"20 ÷ 5 = 4 symbols.","v":"pictographs"},{"d":"BASIC","q":"Six sun symbols each represent 2 sunny days. How many days are shown?","o":["12 days","8 days","6 days","3 days"],"a":0,"e":"6 × 2 = 12 days.","v":"pictographs"},{"d":"BASIC","q":"What does the key in a pictograph tell you?","o":["What each symbol represents","The title only","The page number","Who drew the picture"],"a":0,"e":"The key explains the quantity represented by each symbol.","v":"pictographs"},{"d":"BASIC","q":"One bus symbol represents 10 passengers. How many passengers do 2 symbols represent?","o":["20","12","10","5"],"a":0,"e":"2 × 10 = 20 passengers.","v":"pictographs"},{"d":"BASIC","q":"One flower represents 2 votes. How many votes do 7 flowers represent?","o":["14","9","12","7"],"a":0,"e":"7 × 2 = 14 votes.","v":"pictographs"},{"d":"BASIC","q":"One triangle represents 5 toys. How many triangles show 15 toys?","o":["3","5","10","20"],"a":0,"e":"15 ÷ 5 = 3 triangles.","v":"pictographs"},{"d":"BASIC","q":"One picture represents 4 pets. What total is shown by 2½ pictures?","o":["10 pets","8 pets","12 pets","6 pets"],"a":0,"e":"2½ × 4 = 10 pets.","v":"pictographs"},{"d":"MEDIUM","q":"One book symbol represents 4 books. Monday has 3 symbols and Tuesday has 5. How many more books were read Tuesday?","o":["8","2","20","12"],"a":0,"e":"(5 − 3) × 4 = 8 books.","v":"pictographs"},{"d":"MEDIUM","q":"One banana symbol represents 6 bananas. Four symbols are shown. If 5 bananas are sold, how many remain?","o":["19","24","21","11"],"a":0,"e":"4 × 6 = 24; 24 − 5 = 19.","v":"pictographs"},{"d":"MEDIUM","q":"One star represents 3 votes. Team A has 4 stars and Team B has 7. How many votes altogether?","o":["33","11","21","24"],"a":0,"e":"(4 + 7) × 3 = 33 votes.","v":"pictographs"},{"d":"MEDIUM","q":"Each full book symbol represents 6 books. How many symbols represent 18 books?","o":["3","6","12","4"],"a":0,"e":"18 ÷ 6 = 3 symbols.","v":"pictographs"},{"d":"MEDIUM","q":"One shoe symbol represents 2 pairs. Red has 8 symbols and blue has 5. How many more pairs are red than blue?","o":["6 pairs","3 pairs","16 pairs","10 pairs"],"a":0,"e":"(8 − 5) × 2 = 6 pairs.","v":"pictographs"},{"d":"MEDIUM","q":"One leaf represents 5 plants. Roses have 6 leaves and lilies have 4. How many plants altogether?","o":["50","10","30","20"],"a":0,"e":"(6 + 4) × 5 = 50 plants.","v":"pictographs"},{"d":"MEDIUM","q":"One flag represents 8 students. How many flags represent 40 students?","o":["5","8","32","4"],"a":0,"e":"40 ÷ 8 = 5 flags.","v":"pictographs"},{"d":"MEDIUM","q":"One cup symbol represents 4 cups of juice. What does 3½ symbols represent?","o":["14 cups","12 cups","16 cups","10 cups"],"a":0,"e":"3½ × 4 = 14 cups.","v":"pictographs"},{"d":"MEDIUM","q":"One ball symbol represents 5 balls. There are 9 symbols, but 2 symbols' worth of balls are lost. How many remain?","o":["35","45","40","25"],"a":0,"e":"(9 − 2) × 5 = 35 balls.","v":"pictographs"},{"d":"MEDIUM","q":"One pencil picture represents 3 pencils. How many pictures represent 27 pencils?","o":["9","8","24","10"],"a":0,"e":"27 ÷ 3 = 9 pictures.","v":"pictographs"},{"d":"HARD","q":"One symbol represents 4 votes. Chess has 5 symbols and carrom has 3½. How many more votes were for chess?","o":["6","2","20","14"],"a":0,"e":"Chess has 20 votes and carrom 14; the difference is 6.","v":"pictographs"},{"d":"HARD","q":"One book symbol represents 8 books. Class A has 6 symbols and Class B has 4½. How many books altogether?","o":["84","80","10½","76"],"a":0,"e":"(6 + 4½) × 8 = 84 books.","v":"pictographs"},{"d":"HARD","q":"One symbol represents 12 visitors. A museum shows 7 symbols. If 18 visitors leave, how many remain?","o":["66","84","72","54"],"a":0,"e":"7 × 12 − 18 = 66 visitors.","v":"pictographs"},{"d":"HARD","q":"One icon represents 5 items. Store A has 8 icons and Store B has 11. How many items altogether?","o":["95","19","55","40"],"a":0,"e":"(8 + 11) × 5 = 95 items.","v":"pictographs"},{"d":"HARD","q":"One star represents 6 points. Red has 7 stars and Blue has 5½. What is the score difference?","o":["9 points","12 points","3 points","6 points"],"a":0,"e":"Red scores 42 and Blue 33; 42 − 33 = 9.","v":"pictographs"},{"d":"HARD","q":"A chart shows 4½ symbols for oranges, each representing 10 oranges. If 13 are used, how many remain?","o":["32","45","37","27"],"a":0,"e":"4½ × 10 − 13 = 32 oranges.","v":"pictographs"},{"d":"HARD","q":"One house icon represents 4 houses. Street A has 3 icons and Street B has 5. What is the total and how many more are on B?","o":["32 total; 8 more","8 total; 2 more","20 total; 8 more","32 total; 2 more"],"a":0,"e":"A has 12 and B has 20: total 32, difference 8.","v":"pictographs"},{"d":"HARD","q":"One symbol represents 3 kg of rice. A store displays 12 symbols and sells 7 kg. How much remains?","o":["29 kg","36 kg","31 kg","21 kg"],"a":0,"e":"12 × 3 − 7 = 29 kg.","v":"pictographs"},{"d":"HARD","q":"One picture represents 8 tickets. Morning has 6 pictures and afternoon 4. If 15 tickets are refunded, how many remain sold?","o":["65","80","50","55"],"a":0,"e":"(6 + 4) × 8 − 15 = 65 tickets.","v":"pictographs"},{"d":"HARD","q":"One symbol represents 4 points. Team X has 9 symbols and Team Y has 6½. How many points altogether?","o":["62","60","15½","64"],"a":0,"e":"(9 + 6½) × 4 = 62 points.","v":"pictographs"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Interpret pictographs</strong><small>Use keys and symbols</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Compare pictograph categories</strong><small>Calculate symbol values</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Find totals and differences from pictographs</strong><small>Solve pictograph problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
