(()=>{'use strict';const questions=[{"d":"BASIC","q":"In a pictograph, one star represents 2 books. What do 4 stars represent?","o":["8 books","6 books","4 books","2 books"],"a":0,"e":"Four symbols × 2 books = 8 books.","v":"pictographs"},{"d":"BASIC","q":"One apple symbol represents 3 apples. What do 5 symbols represent?","o":["15","8","10","12"],"a":0,"e":"5 × 3 = 15 apples.","v":"pictographs"},{"d":"BASIC","q":"One circle represents 4 students. What do 3 circles represent?","o":["12 students","7 students","4 students","16 students"],"a":0,"e":"3 × 4 = 12 students.","v":"pictographs"},{"d":"BASIC","q":"One book symbol represents 5 books. How many symbols show 20 books?","o":["4","5","15","25"],"a":0,"e":"20 ÷ 5 = 4 symbols.","v":"pictographs"},{"d":"BASIC","q":"Six sun symbols each represent 2 sunny days. How many days are shown?","o":["12 days","8 days","6 days","3 days"],"a":0,"e":"6 × 2 = 12 days.","v":"pictographs"},{"d":"BASIC","q":"What does the key in a pictograph tell you?","o":["What each symbol represents","The title only","The page number","Who drew the picture"],"a":0,"e":"The key explains the quantity represented by each symbol.","v":"pictographs"},{"d":"BASIC","q":"One bus symbol represents 10 passengers. How many passengers do 2 symbols represent?","o":["20","12","10","5"],"a":0,"e":"2 × 10 = 20 passengers.","v":"pictographs"},{"d":"BASIC","q":"One flower represents 2 votes. How many votes do 7 flowers represent?","o":["14","9","12","7"],"a":0,"e":"7 × 2 = 14 votes.","v":"pictographs"},{"d":"BASIC","q":"One triangle represents 5 toys. How many triangles show 15 toys?","o":["3","5","10","20"],"a":0,"e":"15 ÷ 5 = 3 triangles.","v":"pictographs"},{"d":"BASIC","q":"One picture represents 4 pets. What total is shown by 2½ pictures?","o":["10 pets","8 pets","12 pets","6 pets"],"a":0,"e":"2½ × 4 = 10 pets.","v":"pictographs"},{"d":"MEDIUM","q":"One book symbol represents 4 books. Monday has 3 symbols and Tuesday has 5. How many more books were read Tuesday?","o":["8","2","20","12"],"a":0,"e":"(5 − 3) × 4 = 8 books.","v":"pictographs"},{"d":"MEDIUM","q":"One banana symbol represents 6 bananas. Four symbols are shown. If 5 bananas are sold, how many remain?","o":["19","24","21","11"],"a":0,"e":"4 × 6 = 24; 0.80 is greater than 0.75.","v":"pictographs"},{"d":"BASIC","q":"Which is the smallest decimal?","o":["0.6","0.06","0.66","0.606"],"a":1,"e":"Compare place values: 0.06 is six hundredths, smaller than the other values.","v":"pictographs"},{"d":"BASIC","q":"Compare 3.45 and 3.5.","o":["3.45 > 3.5","3.45 < 3.5","3.45 = 3.5","Cannot be compared"],"a":1,"e":"Write 3.5 as 3.50; 3.45 is smaller than 3.50.","v":"pictographs"},{"d":"BASIC","q":"Which number is greatest?","o":["2.09","2.9","2.19","2.099"],"a":1,"e":"Write 2.9 as 2.900; it is greater than the other options.","v":"pictographs"},{"d":"BASIC","q":"Arrange 0.3 and 0.27 in ascending order.","o":["0.3, 0.27","0.27, 0.3","They are equal","Cannot be ordered"],"a":1,"e":"0.3 = 0.30, and 0.27 is smaller than 0.30.","v":"pictographs"},{"d":"BASIC","q":"Which is greater: 5.04 or 5.4?","o":["5.04","5.4","They are equal","Cannot be compared"],"a":1,"e":"5.4 = 5.40, which is greater than 5.04.","v":"pictographs"},{"d":"BASIC","q":"Which decimal lies between 1.2 and 1.3?","o":["1.19","1.25","1.31","1.03"],"a":1,"e":"1.25 is greater than 1.20 and less than 1.30.","v":"pictographs"},{"d":"BASIC","q":"Which is the greatest?","o":["0.99","0.909","0.9","0.099"],"a":0,"e":"Write as thousandths: 0.990, 0.909, 0.900, and 0.099.","v":"pictographs"},{"d":"BASIC","q":"Compare 7.08 and 7.080.","o":["7.08 > 7.080","7.08 < 7.080","They are equal","Their difference is 0.08"],"a":2,"e":"A zero added at the end of a decimal does not change its value.","v":"pictographs"},{"d":"BASIC","q":"Which is the smallest?","o":["4.101","4.11","4.01","4.1"],"a":2,"e":"4.01 is less than 4.100, 4.101, and 4.110.","v":"pictographs"},{"d":"MEDIUM","q":"Arrange 2.45, 2.405, 2.5 in ascending order.","o":["2.405, 2.45, 2.5","2.45, 2.405, 2.5","2.5, 2.45, 2.405","2.405, 2.5, 2.45"],"a":0,"e":"Write to thousandths: 2.405, 2.450, and 2.500.","v":"pictographs"},{"d":"MEDIUM","q":"Which comparison is correct?","o":["0.704 < 0.74","0.704 > 0.74","0.704 = 0.74","0.704 > 0.8"],"a":0,"e":"0.74 = 0.740, which is greater than 0.704.","v":"pictographs"},{"d":"MEDIUM","q":"Which is closest to 6?","o":["5.89","6.08","5.95","6.12"],"a":2,"e":"Distances from 6 are 0.11, 0.08, 0.05, and 0.12; 5.95 is closest.","v":"pictographs"},{"d":"MEDIUM","q":"Which decimal is between 0.405 and 0.41?","o":["0.4","0.407","0.415","0.401"],"a":1,"e":"0.407 is greater than 0.405 and less than 0.410.","v":"pictographs"},{"d":"MEDIUM","q":"A ribbon is 3.75 m and another is 3.705 m. Which is longer?","o":["3.75 m","3.705 m","They are equal","Not enough information"],"a":0,"e":"3.75 = 3.750, which is greater than 3.705.","v":"pictographs"},{"d":"MEDIUM","q":"Arrange 0.8, 0.808, 0.88 in descending order.","o":["0.8, 0.808, 0.88","0.88, 0.808, 0.8","0.808, 0.88, 0.8","0.88, 0.8, 0.808"],"a":1,"e":"Write to thousandths: 0.880 > 0.808 > 0.800.","v":"pictographs"},{"d":"MEDIUM","q":"Which is greater: 12.099 or 12.1?","o":["12.099","12.1","They are equal","Cannot be compared"],"a":1,"e":"12.1 = 12.100, greater than 12.099.","v":"pictographs"},{"d":"MEDIUM","q":"Which number is nearest to 0.5?","o":["0.48","0.53","0.46","0.57"],"a":0,"e":"Distances from 0.5 are 0.02, 0.03, 0.04, and 0.07; 0.48 is closest.","v":"pictographs"},{"d":"MEDIUM","q":"Which is the smallest among 9.09, 9.009, 9.9, and 9.099?","o":["9.09","9.009","9.9","9.099"],"a":1,"e":"9.009 is less than 9.090, 9.099, and 9.900.","v":"pictographs"},{"d":"MEDIUM","q":"A runner's times are 12.45 s, 12.5 s, and 12.405 s. Which is the fastest?","o":["12.45 s","12.5 s","12.405 s","All are equal"],"a":2,"e":"The smallest time is fastest; 12.405 < 12.450 < 12.500.","v":"pictographs"},{"d":"HARD","q":"Which is greater: 0.999 or 1.001?","o":["0.999","1.001","They are equal","Cannot be compared"],"a":1,"e":"1.001 is above 1, while 0.999 is below 1.","v":"pictographs"},{"d":"HARD","q":"Arrange 4.06, 4.006, 4.6, 4.0601 in ascending order.","o":["4.006, 4.06, 4.0601, 4.6","4.06, 4.006, 4.0601, 4.6","4.6, 4.0601, 4.06, 4.006","4.006, 4.0601, 4.06, 4.6"],"a":0,"e":"To four decimal places: 4.0060 < 4.0600 < 4.0601 < 4.6000.","v":"pictographs"},{"d":"HARD","q":"Which decimal is exactly halfway between 2.38 and 2.44?","o":["2.40","2.41","2.42","2.43"],"a":1,"e":"The midpoint is (2.38 + 2.44) ÷ 2 = 2.41.","v":"pictographs"},{"d":"HARD","q":"Which number is closest to 10?","o":["9.87","10.08","9.94","10.11"],"a":2,"e":"Distances from 10 are 0.13, 0.08, 0.06, and 0.11; 9.94 is closest.","v":"pictographs"},{"d":"HARD","q":"A package weighs 2.507 kg and another weighs 2.57 kg. What is their difference?","o":["0.063 kg","0.63 kg","0.037 kg","0.603 kg"],"a":0,"e":"2.570 − 2.507 = 0.063 kg.","v":"pictographs"},{"d":"HARD","q":"Which statement is true?","o":["0.120 < 0.12","0.120 = 0.12","0.120 > 0.12","0.120 = 0.012"],"a":1,"e":"0.120 and 0.12 both represent twelve hundredths.","v":"pictographs"},{"d":"HARD","q":"Which is the greatest positive decimal?","o":["0.505","0.55","0.5005","0.506"],"a":1,"e":"0.55 = 0.5500, greater than 0.5060, 0.5050, and 0.5005.","v":"pictographs"},{"d":"HARD","q":"A student records 5.608, 5.68, 5.6081. Which is the greatest?","o":["5.608","5.68","5.6081","They are equal"],"a":1,"e":"5.68 = 5.6800, which exceeds 5.6081 and 5.6080.","v":"pictographs"},{"d":"HARD","q":"Which number is strictly between 0.099 and 0.1?","o":["0.098","0.0995","0.101","0.09"],"a":1,"e":"0.0995 is greater than 0.099 and less than 0.100.","v":"pictographs"},{"d":"HARD","q":"Four lengths are 1.205 m, 1.25 m, 1.2055 m, and 1.2 m. Which is the second-longest?","o":["1.205 m","1.25 m","1.2055 m","1.2 m"],"a":2,"e":"In descending order: 1.2500, 1.2055, 1.2050, 1.2000.","v":"pictographs"}];const $=id=>document.getElementById(id);let i=0,sel=-1,locked=false,done=false,xp=0,correct=0,streak=0;const letters=['A','B','C','D'];
function progress(){const p=Math.round(i/questions.length*100);$('bar').style.width=p+'%';$('progress').setAttribute('aria-valuenow',p);$('pct').textContent=p+'% complete';}
function render(){const q=questions[i];sel=-1;locked=false;$('quiz').hidden=false;$('finish').hidden=true;$('counter').textContent='QUESTION '+(i+1)+' OF '+questions.length;$('meta').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(i+1);$('question').textContent=q.q;$('options').innerHTML='';q.o.forEach((v,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.innerHTML='<span class="letter">'+letters[j]+'</span><span></span>';b.querySelector('span:last-child').textContent=v;b.onclick=()=>{if(locked)return;sel=j;[...$('options').children].forEach((x,k)=>x.classList.toggle('selected',k===j));$('action').disabled=false;};$('options').appendChild(b);});$('feedback').className='feedback';$('feedback').textContent='';$('hint').textContent='30 questions · Select one answer';$('action').textContent='Check answer';$('action').disabled=true;progress();}
function act(){if(done){restart();return;}const q=questions[i];if(!locked){if(sel<0)return;locked=true;const ok=sel===q.a;if(ok){correct++;xp+=10;streak++;}else streak=0;$('xp').textContent='⭐ '+xp+' XP';$('streak').textContent='🔥 '+streak;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===sel)b.classList.add('wrong');});$('feedback').textContent=(ok?'✨ Correct! ':'💡 Review: ')+q.e;$('feedback').className='feedback show '+(ok?'good':'bad');$('hint').textContent=ok?'+10 XP':'Keep practising';$('action').textContent=i===questions.length-1?'View results →':'Continue →';return;}if(i<questions.length-1){i++;render();}else results();}
function results(){done=true;$('quiz').hidden=true;$('finish').hidden=false;$('counter').textContent='QUIZ COMPLETE';$('bar').style.width='100%';$('progress').setAttribute('aria-valuenow','100');$('pct').textContent='100% complete';$('finish').innerHTML='<div style="font-size:46px">🏆</div><h2>'+(correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!')+'</h2><div class="score">'+correct+' / '+questions.length+'</div><p>'+Math.round(correct/questions.length*100)+'% accuracy · '+xp+' XP earned</p><div class="skill"><strong>🔢 Compare decimal values</strong><small>Use place value to compare decimals accurately.</small></div><div class="skill"><strong>↔️ Order decimal numbers</strong><small>Compare decimals with different numbers of digits.</small></div><div class="skill"><strong>🧠 Apply comparison strategies</strong><small>Use equivalent trailing zeros and aligned place values.</small></div><button class="btn" id="retry">Try again ↻</button>';$('retry').onclick=restart;}
function restart(){i=0;sel=-1;locked=false;done=false;xp=0;correct=0;streak=0;$('xp').textContent='⭐ 0 XP';$('streak').textContent='🔥 0';render();}
$('action').onclick=act;render();})();
