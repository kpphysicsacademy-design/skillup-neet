(function(){'use strict';const questions=[{"d":"BASIC","q":"In a pictograph, one star represents 2 books. What do 4 stars represent?","o":["8 books","6 books","4 books","2 books"],"a":0,"e":"Four symbols × 2 books = 8 books.","v":"pictographs"},{"d":"BASIC","q":"One apple symbol represents 3 apples. What do 5 symbols represent?","o":["15","8","10","12"],"a":0,"e":"5 × 3 = 15 apples.","v":"pictographs"},{"d":"BASIC","q":"One circle represents 4 students. What do 3 circles represent?","o":["12 students","7 students","4 students","16 students"],"a":0,"e":"3 × 4 = 12 students.","v":"pictographs"},{"d":"BASIC","q":"One book symbol represents 5 books. How many symbols show 20 books?","o":["4","5","15","25"],"a":0,"e":"20 ÷ 5 = 4 symbols.","v":"pictographs"},{"d":"BASIC","q":"Six sun symbols each represent 2 sunny days. How many days are shown?","o":["12 days","8 days","6 days","3 days"],"a":0,"e":"6 × 2 = 12 days.","v":"pictographs"},{"d":"BASIC","q":"What does the key in a pictograph tell you?","o":["What each symbol represents","The title only","The page number","Who drew the picture"],"a":0,"e":"The key explains the quantity represented by each symbol.","v":"pictographs"},{"d":"BASIC","q":"One bus symbol represents 10 passengers. How many passengers do 2 symbols represent?","o":["20","12","10","5"],"a":0,"e":"2 × 10 = 20 passengers.","v":"pictographs"},{"d":"BASIC","q":"One flower represents 2 votes. How many votes do 7 flowers represent?","o":["14","9","12","7"],"a":0,"e":"7 × 2 = 14 votes.","v":"pictographs"},{"d":"BASIC","q":"One triangle represents 5 toys. How many triangles show 15 toys?","o":["3","5","10","20"],"a":0,"e":"15 ÷ 5 = 3 triangles.","v":"pictographs"},{"d":"BASIC","q":"One picture represents 4 pets. What total is shown by 2½ pictures?","o":["10 pets","8 pets","12 pets","6 pets"],"a":0,"e":"2½ × 4 = 10 pets.","v":"pictographs"},{"d":"MEDIUM","q":"One book symbol represents 4 books. Monday has 3 symbols and Tuesday has 5. How many more books were read Tuesday?","o":["8","2","20","12"],"a":0,"e":"(5 − 3) × 4 = 8 books.","v":"pictographs"},{"d":"MEDIUM","q":"One banana symbol represents 6 bananas. Four symbols are shown. If 5 bananas are sold, how many remain?","o":["19","24","21","11"],"a":0,"e":"4 × 6 = 24; 24 − 5 = 19.","v":"pictographs"},{"d":"MEDIUM","q":"One star represents 3 votes. Team A has 4 stars and Team B has 7. How many votes altogether?","o":["33","11","21","24"],"a":0,"e":"(4 + 7) × 3 = 33 votes.","v":"pictographs"},{"d":"MEDIUM","q":"Each full book symbol represents 6 books. How many symbols represent 18 books?","o":["3","6","12","4"],"a":0,"e":"18 ÷ 6 = 3 symbols.","v":"pictographs"},{"d":"MEDIUM","q":"One shoe symbol represents 2 pairs. Red has 8 symbols and blue has 5. How many more pairs are red than blue?","o":["6 pairs","3 pairs","16 pairs","10 pairs"],"a":0,"e":"(8 − 5) × 2 = 6 pairs.","v":"pictographs"},{"d":"MEDIUM","q":"One leaf represents 5 plants. Roses have 6 leaves and lilies have 4. How many plants altogether?","o":["50","10","30","20"],"a":0,"e":"(6 + 4) × 5 = 50 plants.","v":"pictographs"},{"d":"MEDIUM","q":"One flag represents 8 students. How many flags represent 40 students?","o":["5","8","32","4"],"a":0,"e":"40 ÷ 8 = 5 flags.","v":"pictographs"},{"d":"MEDIUM","q":"One cup symbol represents 4 cups of juice. What does 3½ symbols represent?","o":["14 cups","12 cups","16 cups","10 cups"],"a":0,"e":"3½ × 4 = 14 cups.","v":"pictographs"},{"d":"MEDIUM","q":"One ball symbol represents 5 balls. There are 9 symbols, but 2 symbols' worth of balls are lost. How many remain?","o":["35","45","40","25"],"a":0,"e":"(9 − 2) × 5 = 35 balls.","v":"pictographs"},{"d":"MEDIUM","q":"One pencil picture represents 3 pencils. How many pictures represent 27 pencils?","o":["9","8","24","10"],"a":0,"e":"27 ÷ 3 = 9 pictures.","v":"pictographs"},{"d":"HARD","q":"One symbol represents 4 votes. Chess has 5 symbols and carrom has 3½. How many more votes were for chess?","o":["6","2","20","14"],"a":0,"e":"Chess has 20 votes and carrom 14; the difference is 6.","v":"pictographs"},{"d":"HARD","q":"One book symbol represents 8 books. Class A has 6 symbols and Class B has 4½. How many books altogether?","o":["84","80","10½","76"],"a":0,"e":"(6 + 4½) × 8 = 84 books.","v":"pictographs"},{"d":"HARD","q":"One symbol represents 12 visitors. A museum shows 7 symbols. If 18 visitors leave, how many remain?","o":["66","84","72","54"],"a":0,"e":"7 × 12 − 18 = 66 visitors.","v":"pictographs"},{"d":"HARD","q":"One icon represents 5 items. Store A has 8 icons and Store B has 11. How many items altogether?","o":["95","19","55","40"],"a":0,"e":"(8 + 11) × 5 = 95 items.","v":"pictographs"},{"d":"HARD","q":"One star represents 6 points. Red has 7 stars and Blue has 5½. What is the score difference?","o":["9 points","12 points","3 points","6 points"],"a":0,"e":"Red scores 42 and Blue 33; 42 − 33 = 9.","v":"pictographs"},{"d":"HARD","q":"A chart shows 4½ symbols for oranges, each representing 10 oranges. If 13 are used, how many remain?","o":["32","45","37","27"],"a":0,"e":"4½ × 10 − 13 = 32 oranges.","v":"pictographs"},{"d":"HARD","q":"One house icon represents 4 houses. Street A has 3 icons and Street B has 5. What is the total and how many more are on B?","o":["32 total; 8 more","8 total; 2 more","20 total; 8 more","32 total; 2 more"],"a":0,"e":"A has 12 and B has 20: total 32, difference 8.","v":"pictographs"},{"d":"HARD","q":"One symbol represents 3 kg of rice. A store displays 12 symbols and sells 7 kg. How much remains?","o":["29 kg","36 kg","31 kg","21 kg"],"a":0,"e":"12 × 3 − 7 = 29 kg.","v":"pictographs"},{"d":"HARD","q":"One picture represents 8 tickets. Morning has 6 pictures and afternoon 4. If 15 tickets are refunded, how many remain sold?","o":["65","80","50","55"],"a":0,"e":"(6 + 4) × 8 − 15 = 65 tickets.","v":"pictographs"},{"d":"HARD","q":"One symbol represents 4 points. Team X has 9 symbols and Team Y has 6½. How many points altogether?","o":["62","60","15½","64"],"a":0,"e":"(
