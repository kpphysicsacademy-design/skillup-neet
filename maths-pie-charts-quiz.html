<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261013-pie-charts-duolingo-v1"><title>Pie Charts | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Pie charts</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"A full pie chart represents what fraction of the whole?","o":["1","1/2","1/4","3/4"],"a":0,"e":"A complete circle represents the entire dataset, or one whole.","v":"pie-charts"},{"d":"BASIC","q":"How many degrees are there in a complete circle?","o":["180°","360°","270°","90°"],"a":1,"e":"A full turn measures 360°.","v":"pie-charts"},{"d":"BASIC","q":"A sector represents 25% of the data. What is its central angle?","o":["45°","120°","90°","180°"],"a":2,"e":"25% of 360° is 0.25 × 360° = 90°.","v":"pie-charts"},{"d":"BASIC","q":"A pie chart sector has angle 180°. What fraction of the data does it represent?","o":["1/4","1/3","3/4","1/2"],"a":3,"e":"180° ÷ 360° = 1/2.","v":"pie-charts"},{"d":"BASIC","q":"A category represents 10% of a pie chart. Find its sector angle.","o":["36°","10°","18°","72°"],"a":0,"e":"10% of 360° is 36°.","v":"pie-charts"},{"d":"BASIC","q":"Which chart uses sectors of a circle to show parts of a whole?","o":["Line graph","Pie chart","Stem-and-leaf plot","Number line"],"a":1,"e":"A pie chart displays categories as sectors of a circle.","v":"pie-charts"},{"d":"BASIC","q":"A sector angle is 90°. What percentage of the whole does it show?","o":["10%","50%","25%","75%"],"a":2,"e":"90° ÷ 360° × 100 = 25%.","v":"pie-charts"},{"d":"BASIC","q":"The angles of all sectors in a complete pie chart add up to:","o":["180°","100°","90°","360°"],"a":3,"e":"All sectors together form a full circle of 360°.","v":"pie-charts"},{"d":"BASIC","q":"A pie chart has 4 equal sectors. What is each sector angle?","o":["90°","45°","120°","180°"],"a":0,"e":"360° divided by 4 equal sectors is 90° each.","v":"pie-charts"},{"d":"BASIC","q":"If a sector angle is 72°, what fraction of the full circle is it?","o":["1/4","1/5","1/6","1/3"],"a":1,"e":"72° ÷ 360° = 1/5.","v":"pie-charts"},{"d":"MEDIUM","q":"In a class of 40 students, 25% prefer football. What sector angle represents football?","o":["40°","100°","90°","120°"],"a":2,"e":"25% of 360° equals 90°.","v":"pie-charts"},{"d":"MEDIUM","q":"A pie chart represents 60 students. A sector angle is 120°. How many students does it represent?","o":["15","30","24","20"],"a":3,"e":"120° ÷ 360° × 60 = 20 students.","v":"pie-charts"},{"d":"MEDIUM","q":"A category accounts for 15 out of 60 observations. What is its sector angle?","o":["90°","60°","45°","120°"],"a":0,"e":"The fraction is 15/60 = 1/4, so its angle is 90°.","v":"pie-charts"},{"d":"MEDIUM","q":"A 45° sector in a pie chart represents how many percent?","o":["10%","12.5%","15%","20%"],"a":1,"e":"45° ÷ 360° × 100 = 12.5%.","v":"pie-charts"},{"d":"MEDIUM","q":"In a survey of 80 people, 30 chose option A. What is its pie-chart angle?","o":["120°","150°","135°","90°"],"a":2,"e":"30/80 × 360° = 135°.","v":"pie-charts"},{"d":"MEDIUM","q":"A sector angle is 144°. In a survey of 50 people, how many people does it represent?","o":["15","25","18","20"],"a":3,"e":"144°/360° = 0.4; 0.4 × 50 = 20 people.","v":"pie-charts"},{"d":"MEDIUM","q":"Three pie-chart sectors measure 80°, 110° and 95°. Find the fourth angle.","o":["75°","85°","65°","95°"],"a":0,"e":"The known angles total 285°, so the remaining angle is 360° − 285° = 75°.","v":"pie-charts"},{"d":"MEDIUM","q":"A sector of 30° represents how many out of 120 observations?","o":["15","10","20","30"],"a":1,"e":"30°/360° × 120 = 10 observations.","v":"pie-charts"},{"d":"MEDIUM","q":"A pie chart shows 40% for transport. What angle represents the remaining categories together?","o":["144°","180°","216°","240°"],"a":2,"e":"The remaining share is 60%; 0.60 × 360° = 216°.","v":"pie-charts"},{"d":"MEDIUM","q":"A category with angle 54° appears in a pie chart for 200 responses. How many responses belong to it?","o":["20","25","36","30"],"a":3,"e":"54°/360° × 200 = 30 responses.","v":"pie-charts"},{"d":"HARD","q":"A pie chart for 240 students shows science at 75°. How many students chose science?","o":["50","45","60","75"],"a":0,"e":"75°/360° × 240 = 50 students.","v":"pie-charts"},{"d":"HARD","q":"A category represents 35% of a survey. What is its sector angle?","o":["108°","126°","135°","144°"],"a":1,"e":"35% of 360° = 0.35 × 360° = 126°.","v":"pie-charts"},{"d":"HARD","q":"A sector angle is 84° in a chart of 150 observations. How many observations does it represent?","o":["30","40","35","42"],"a":2,"e":"84°/360° × 150 = 35 observations.","v":"pie-charts"},{"d":"HARD","q":"In a pie chart, categories A and B have angles 72° and 108°. What percentage is left for all other categories?","o":["40%","60%","70%","50%"],"a":3,"e":"The remaining angle is 360° − 180° = 180°, which is 50%.","v":"pie-charts"},{"d":"HARD","q":"In a survey of 360 people, the sector angle for cycling is 42°. How many people chose cycling?","o":["42","36","48","54"],"a":0,"e":"42°/360° × 360 = 42 people.","v":"pie-charts"},{"d":"HARD","q":"A 20% category has a sector angle of 72°. If the total is 250 responses, how many responses are in that category?","o":["45","50","72","25"],"a":1,"e":"20% of 250 is 50 responses; the 72° angle also represents 20%.","v":"pie-charts"},{"d":"HARD","q":"A pie chart's sector for books is 96° and represents 64 students. How many students were surveyed in total?","o":["192","160","240","320"],"a":2,"e":"96°/360° = 64/N, so N = 64 × 360 ÷ 96 = 240.","v":"pie-charts"},{"d":"HARD","q":"A category's angle is 2/9 of a full circle. What is its angle in degrees?","o":["40°","90°","120°","80°"],"a":3,"e":"(2/9) × 360° = 80°.","v":"pie-charts"},{"d":"HARD","q":"The angles for three categories are in the ratio 2:3:4 and together cover the whole pie chart. What is the largest angle?","o":["160°","120°","140°","180°"],"a":0,"e":"Nine ratio parts total 360°, so each part is 40° and the largest is 4 × 40° = 160°.","v":"pie-charts"},{"d":"HARD","q":"A pie chart represents 90 learners. The music sector is 140°. What is the nearest whole number of learners for music?","o":["30","35","40","45"],"a":1,"e":"140°/360° × 90 = 35 learners exactly.","v":"pie-charts"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Represent categories as sectors of a circle</strong><small>Sector angles, fractions and percentages</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Convert chart angles into quantities</strong><small>Read and calculate pie-chart proportions</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Connect side counts, angles and diagonals</strong><small>Solve equations reducible to linear form</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script></body></html>
