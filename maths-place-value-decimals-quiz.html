(()=>{'use strict';
const questions=[{"d":"BASIC","q":"In 4.582, what is the value of digit 5?","o":["5","0.5","0.05","50"],"a":1,"e":"The 5 is in the tenths place, so its value is 0.5.","v":"place-value"},{"d":"BASIC","q":"Which digit is in the hundredths place in 7.364?","o":["7","3","6","4"],"a":2,"e":"After the decimal: tenths 3, hundredths 6, thousandths 4.","v":"place-value"},{"d":"BASIC","q":"How is 0.8 read?","o":["Eight hundredths","Eight tenths","Eight thousandths","Eighty tenths"],"a":1,"e":"0.8 means eight tenths.","v":"place-value"},{"d":"BASIC","q":"What is the value of 4 in 2.047?","o":["4","0.4","0.04","0.004"],"a":2,"e":"The 4 is in the hundredths place: 0.04.","v":"place-value"},{"d":"BASIC","q":"Which decimal has 6 tenths and 2 hundredths?","o":["0.602","0.62","0.062","6.2"],"a":1,"e":"Six tenths plus two hundredths is 0.62.","v":"place-value"},{"d":"BASIC","q":"How many hundredths are in 0.35?","o":["3","5","35","350"],"a":2,"e":"0.35 is 35 hundredths.","v":"place-value"},{"d":"BASIC","q":"Which is the expanded form of 3.27?","o":["3 + 2 + 7","3 + 0.2 + 0.07","3 + 0.02 + 0.7","30 + 2 + 7"],"a":1,"e":"3.27 = 3 + 0.2 + 0.07.","v":"place-value"},{"d":"BASIC","q":"In 9.105, what is the value of 1?","o":["1","0.1","0.01","0.001"],"a":1,"e":"The first digit after the decimal is tenths, so 1 represents 0.1.","v":"place-value"},{"d":"BASIC","q":"Which number has 4 thousandths?","o":["0.4","0.04","0.004","4.004"],"a":2,"e":"Four thousandths is 0.004.","v":"place-value"},{"d":"BASIC","q":"How many tenths make one whole?","o":["1","10","100","1000"],"a":1,"e":"Ten tenths make one whole.","v":"place-value"},{"d":"MEDIUM","q":"What is the value of 8 in 12.083?","o":["8","0.8","0.08","0.008"],"a":2,"e":"The 8 is in the hundredths place.","v":"place-value"},{"d":"MEDIUM","q":"Which is equal to 5.6?","o":["5.06","5.60","5.006","56.0"],"a":1,"e":"A zero at the end of a decimal does not change its value.","v":"place-value"},{"d":"MEDIUM","q":"Which is the expanded form of 0.406?","o":["0.4 + 0.06","0.4 + 0.006","0.04 + 0.006","4 + 6"],"a":1,"e":"0.406 = 4 tenths + 6 thousandths.","v":"place-value"},{"d":"MEDIUM","q":"What digit belongs in the hundredths place of 18.257?","o":["1","2","5","7"],"a":2,"e":"The digits after the decimal are tenths 2, hundredths 5, thousandths 7.","v":"place-value"},{"d":"MEDIUM","q":"Which decimal represents 7 tenths and 9 thousandths?","o":["0.709","0.079","0.79","7.09"],"a":0,"e":"Seven tenths is 0.7 and nine thousandths is 0.009; total 0.709.","v":"place-value"},{"d":"MEDIUM","q":"How many thousandths are in 2.014?","o":["14","104","2014","214"],"a":2,"e":"2.014 is 2014 thousandths.","v":"place-value"},{"d":"MEDIUM","q":"Which is another way to write 0.7 + 0.03?","o":["0.73","0.703","0.37","7.03"],"a":0,"e":"Seven tenths plus three hundredths equals 0.73.","v":"place-value"},{"d":"MEDIUM","q":"What is the value of 9 in 6.092?","o":["9","0.9","0.09","0.009"],"a":2,"e":"The 9 is in the hundredths place.","v":"place-value"},{"d":"MEDIUM","q":"Which number has 3 in the thousandths place?","o":["4.300","4.030","4.003","4.03"],"a":2,"e":"In 4.003, the 3 is in the thousandths place.","v":"place-value"},{"d":"MEDIUM","q":"Write 46 hundredths as a decimal.","o":["4.6","0.46","0.046","46.0"],"a":1,"e":"46 hundredths is 46/100 = 0.46.","v":"place-value"},{"d":"HARD","q":"What is the value of the digit 7 in 3.071?","o":["7","0.7","0.07","0.007"],"a":2,"e":"The 7 is in the hundredths place.","v":"place-value"},{"d":"HARD","q":"Which expression equals 8.205?","o":["8 + 0.2 + 0.005","8 + 0.02 + 0.5","8 + 2 + 0.05","8 + 0.2 + 0.05"],"a":0,"e":"8.205 = 8 + 0.2 + 0.005.","v":"place-value"},{"d":"HARD","q":"How many hundredths are equivalent to 1.25?","o":["125","12.5","1025","1250"],"a":0,"e":"1.25 equals 125 hundredths.","v":"place-value"},{"d":"HARD","q":"A decimal has 2 ones, 4 tenths, 0 hundredths, and 6 thousandths. What is it?","o":["2.046","2.406","2.46","2.064"],"a":1,"e":"Combine place values: 2 + 0.4 + 0 + 0.006 = 2.406.","v":"place-value"},{"d":"HARD","q":"Which decimal has the digit 5 worth 0.005?","o":["1.05","1.005","1.5","1.050"],"a":1,"e":"In 1.005, 5 is in the thousandths place.","v":"place-value"},{"d":"HARD","q":"What is 0.3 + 0.04 + 0.006?","o":["0.346","0.64","0.3046","3.46"],"a":0,"e":"Add the place values: 0.300 + 0.040 + 0.006 = 0.346.","v":"place-value"},{"d":"HARD","q":"Which decimal represents 3 + 8/100 + 2/1000?","o":["3.082","3.802","3.82","3.0082"],"a":0,"e":"8 hundredths is 0.08 and 2 thousandths is 0.002; total 3.082.","v":"place-value"},{"d":"HARD","q":"In 42.718, what is the value of the digit 1?","o":["1","0.1","0.01","0.001"],"a":2,"e":"The 1 is in the hundredths place.","v":"place-value"},{"d":"HARD","q":"Which number is 100 times 0.036?","o":["0.0036","0.36","3.6","36"],"a":2,"e":"Multiplying by 100 moves the decimal point two places right: 3.6.","v":"place-value"},{"d":"HARD","q":"A meter is divided into 1000 equal parts. One part is what fraction of a meter?","o":["1/10","1/100","1/1000","10/1000"],"a":2,"e":"One of 1000 equal parts is one thousandth, or 1/1000.","v":"place-value"}];
const $=id=>document.getElementById(id);let index=0,selected=-1,locked=false,done=false,xp=0,correct=0,streak=0;

function progress(){const n=Math.round(index/questions.length*100);$('bar').style.width=n+'%';$('progress').setAttribute('aria-valuenow',n);$('percent').textContent=n+'% complete';}
function render(){const q=questions[index];selected=-1;locked=false;$('quiz').hidden=false;$('finish').hidden=true;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('qmeta').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('question').textContent=q.q;$('options').innerHTML='';q.o.forEach((label,i)=>{const b=document.createElement('button');b.type='button';b.className='option';b.innerHTML='<span class="letter">'+letters[i]+'</span><span></span>';b.querySelector('span:last-child').textContent=label;b.addEventListener('click',()=>choose(i));$('options').appendChild(b);});$('feedback').className='feedback';$('feedback').textContent='';$('hint').textContent='30 questions · Select one answer';$('action').textContent='Check answer';$('action').disabled=true;progress();}
function choose(i){if(locked)return;selected=i;[...$('options').children].forEach((b,j)=>b.classList.toggle('selected',j===i));$('action').disabled=false;}
function act(){if(done){restart();return;}const q=questions[index];if(!locked){if(selected<0)return;locked=true;const ok=selected===q.a;if(ok){correct++;xp+=10;streak++;}else{streak=0;}$('xp').textContent='⭐ '+xp+' XP';$('streak').textContent='🔥 '+streak;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(ok?'✨ Correct! ':'💡 Review: ')+q.e;$('feedback').className='feedback show '+(ok?'good':'bad');$('hint').textContent=ok?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'View results →':'Continue →';return;}if(index<questions.length-1){index++;render();}else results();}
function results(){done=true;$('quiz').hidden=true;$('finish').hidden=false;$('counter').textContent='QUIZ COMPLETE';$('bar').style.width='100%';$('progress').setAttribute('aria-valuenow','100');$('percent').textContent='100% complete';const pct=Math.round(correct/questions.length*100);$('finish').innerHTML='<div class="trophy">🏆</div><h2>'+(correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!')+'</h2><div class="score">'+correct+' / '+questions.length+'</div><p>'+pct+'% accuracy · '+xp+' XP earned</p><div class="summary">You practised decimal place values, expanded forms and decimal fractions.</div><div class="skill-list"><div class="skill"><strong>🔢 Place-value identification</strong><small>Recognise tenths, hundredths and thousandths</small></div><div class="skill"><strong>🧩 Expanded decimal forms</strong><small>Connect digits with their place values</small></div><div class="skill"><strong>➗ Decimal and fraction relationships</strong><small>Interpret decimal quantities in equivalent forms</small></div></div><button class="btn continue" id="retry" type="button">Try again ↻</button>';$('retry').addEventListener('click',restart);}
function restart(){index=0;selected=-1;locked=false;done=false;xp=0;correct=0;streak=0;$('xp').textContent='⭐ 0 XP';$('streak').textContent='🔥 0';render();}
$('action').addEventListener('click',act);render();
})();
