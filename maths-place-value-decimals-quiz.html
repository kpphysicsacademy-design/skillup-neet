<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7ed"><meta name="skillup-release" content="20261105-place-value-decimals-fix-v1"><title>Place Value in Decimals | SkillUp Maths</title>
<style>
:root{color-scheme:light;--cream:#f7f7ed;--paper:#fff;--ink:#344039;--muted:#788078;--line:#e2e6dc;--green:#718b6b;--green-dark:#586f53;--soft:#f2f4ec;--good:#e7f0e2;--bad:#f8e9e5;--blue:#dceaf0}
*{box-sizing:border-box}body{margin:0;background:var(--cream)!important;color:var(--ink)!important;font:15px/1.5 system-ui,-apple-system,sans-serif}
.wrap{width:min(100% - 20px,550px);margin:auto;padding:11px 0 26px}

.pill{background:#f0eee1!important;border:1px solid #e2ddc7;border-radius:10px;padding:4px 6px;color:#68634c!important;font-size:11px;font-weight:900;white-space:nowrap}.xp{background:#dfe7d8!important;border-color:#cbd7c4;color:#52694d!important}

.choices{display:grid;gap:9px}.choice{width:100%;min-height:52px;text-align:left;background:#fff!important;color:var(--ink)!important;border:1px solid #dfe4da!important;border-radius:12px!important;padding:10px 12px;font:inherit;font-weight:800;cursor:pointer}
.choice.selected{background:#edf1e8!important;border:2px solid var(--green)!important;padding:9px 11px}.choice.correct{background:var(--good)!important;border:2px solid #829b79!important;color:#405b3a!important;padding:9px 11px}.choice.wrong{background:var(--bad)!important;border:2px solid #c98b7d!important;color:#87483c!important;padding:9px 11px}.choice:disabled{cursor:default;opacity:1}
.feedback{display:none;margin-top:12px;padding:11px 12px;border-radius:12px;background:var(--soft)!important;color:#555!important}.feedback.show{display:block}.feedback.good{background:var(--good)!important;border:1px solid #cbdcc3!important;color:#405b3a!important}.feedback.bad{background:var(--bad)!important;border:1px solid #e7c8bf!important;color:#87483c!important}
.actions{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-top:0;padding-top:18px}.hint{color:var(--muted)!important;font-size:12px}
button.primary{font:900 13px system-ui;cursor:pointer;border:0!important;border-bottom:3px solid var(--green-dark)!important;border-radius:12px!important;background:var(--green)!important;color:#fff!important;padding:10px 15px;min-width:135px;min-height:47px}
button.primary:disabled{background:#e5e8df!important;border-bottom-color:#d5dacf!important;color:#969d91!important;cursor:not-allowed;opacity:1}
.end{text-align:center}.end h1{font-size:23px;margin:7px 0}.end p{color:var(--muted)!important}.score{font-size:2.5rem;color:var(--green-dark)!important;font-weight:950}.summary{background:var(--soft)!important;border:1px solid var(--line)!important;border-radius:12px!important;padding:12px;margin:12px 0;color:var(--ink)!important}.skills{display:grid;gap:8px;text-align:left;margin:12px 0}.skill{display:flex;align-items:center;gap:10px;background:var(--soft)!important;border:1px solid var(--line)!important;border-radius:11px;padding:10px}.skill-icon{font-size:1.35rem}.skill strong{display:block;color:var(--green-dark)!important}.skill small{color:var(--muted)!important}
button:focus-visible,.choice:focus-visible{outline:3px solid #91a78a!important;outline-offset:3px!important}
@media(max-width:380px){.wrap{width:calc(100% - 16px);padding-top:9px}.top{gap:5px}.brand{font-size:11px}.pill{font-size:10px;padding:4px 5px}.card{padding:13px!important}.choice{min-height:49px;padding:8px}.actions button{min-width:116px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"In 4.582, what is the value of digit 5?","o":["5","0.5","0.05","50"],"a":1,"e":"The 5 is in the tenths place, so its value is 0.5.","v":"place-value"},{"d":"BASIC","q":"Which digit is in the hundredths place in 7.364?","o":["7","3","6","4"],"a":2,"e":"After the decimal: tenths 3, hundredths 6, thousandths 4.","v":"place-value"},{"d":"BASIC","q":"How is 0.8 read?","o":["Eight hundredths","Eight tenths","Eight thousandths","Eighty tenths"],"a":1,"e":"0.8 means eight tenths.","v":"place-value"},{"d":"BASIC","q":"What is the value of 4 in 2.047?","o":["4","0.4","0.04","0.004"],"a":2,"e":"The 4 is in the hundredths place: 0.04.","v":"place-value"},{"d":"BASIC","q":"Which decimal has 6 tenths and 2 hundredths?","o":["0.602","0.62","0.062","6.2"],"a":1,"e":"Six tenths plus two hundredths is 0.62.","v":"place-value"},{"d":"BASIC","q":"How many hundredths are in 0.35?","o":["3","5","35","350"],"a":2,"e":"0.35 is 35 hundredths.","v":"place-value"},{"d":"BASIC","q":"Which is the expanded form of 3.27?","o":["3 + 2 + 7","3 + 0.2 + 0.07","3 + 0.02 + 0.7","30 + 2 + 7"],"a":1,"e":"3.27 = 3 + 0.2 + 0.07.","v":"place-value"},{"d":"BASIC","q":"In 9.105, what is the value of 1?","o":["1","0.1","0.01","0.001"],"a":1,"e":"The first digit after the decimal is tenths, so 1 represents 0.1.","v":"place-value"},{"d":"BASIC","q":"Which number has 4 thousandths?","o":["0.4","0.04","0.004","4.004"],"a":2,"e":"Four thousandths is 0.004.","v":"place-value"},{"d":"BASIC","q":"How many tenths make one whole?","o":["1","10","100","1000"],"a":1,"e":"Ten tenths make one whole.","v":"place-value"},{"d":"MEDIUM","q":"What is the value of 8 in 12.083?","o":["8","0.8","0.08","0.008"],"a":2,"e":"The 8 is in the hundredths place.","v":"place-value"},{"d":"MEDIUM","q":"Which is equal to 5.6?","o":["5.06","5.60","5.006","56.0"],"a":1,"e":"A zero at the end of a decimal does not change its value.","v":"place-value"},{"d":"MEDIUM","q":"Which is the expanded form of 0.406?","o":["0.4 + 0.06","0.4 + 0.006","0.04 + 0.006","4 + 6"],"a":1,"e":"0.406 = 4 tenths + 6 thousandths.","v":"place-value"},{"d":"MEDIUM","q":"What digit belongs in the hundredths place of 18.257?","o":["1","2","5","7"],"a":2,"e":"The digits after the decimal are tenths 2, hundredths 5, thousandths 7.","v":"place-value"},{"d":"MEDIUM","q":"Which decimal represents 7 tenths and 9 thousandths?","o":["0.709","0.079","0.79","7.09"],"a":0,"e":"Seven tenths is 0.7 and nine thousandths is 0.009; total 0.709.","v":"place-value"},{"d":"MEDIUM","q":"How many thousandths are in 2.014?","o":["14","104","2014","214"],"a":2,"e":"2.014 is 2014 thousandths.","v":"place-value"},{"d":"MEDIUM","q":"Which is another way to write 0.7 + 0.03?","o":["0.73","0.703","0.37","7.03"],"a":0,"e":"Seven tenths plus three hundredths equals 0.73.","v":"place-value"},{"d":"MEDIUM","q":"What is the value of 9 in 6.092?","o":["9","0.9","0.09","0.009"],"a":2,"e":"The 9 is in the hundredths place.","v":"place-value"},{"d":"MEDIUM","q":"Which number has 3 in the thousandths place?","o":["4.300","4.030","4.003","4.03"],"a":2,"e":"In 4.003, the 3 is in the thousandths place.","v":"place-value"},{"d":"MEDIUM","q":"Write 46 hundredths as a decimal.","o":["4.6","0.46","0.046","46.0"],"a":1,"e":"46 hundredths is 46/100 = 0.46.","v":"place-value"},{"d":"HARD","q":"What is the value of the digit 7 in 3.071?","o":["7","0.7","0.07","0.007"],"a":2,"e":"The 7 is in the hundredths place.","v":"place-value"},{"d":"HARD","q":"Which expression equals 8.205?","o":["8 + 0.2 + 0.005","8 + 0.02 + 0.5","8 + 2 + 0.05","8 + 0.2 + 0.05"],"a":0,"e":"8.205 = 8 + 0.2 + 0.005.","v":"place-value"},{"d":"HARD","q":"How many hundredths are equivalent to 1.25?","o":["125","12.5","1025","1250"],"a":0,"e":"1.25 equals 125 hundredths.","v":"place-value"},{"d":"HARD","q":"A decimal has 2 ones, 4 tenths, 0 hundredths, and 6 thousandths. What is it?","o":["2.046","2.406","2.46","2.064"],"a":1,"e":"Combine place values: 2 + 0.4 + 0 + 0.006 = 2.406.","v":"place-value"},{"d":"HARD","q":"Which decimal has the digit 5 worth 0.005?","o":["1.05","1.005","1.5","1.050"],"a":1,"e":"In 1.005, 5 is in the thousandths place.","v":"place-value"},{"d":"HARD","q":"What is 0.3 + 0.04 + 0.006?","o":["0.346","0.64","0.3046","3.46"],"a":0,"e":"Add the place values: 0.300 + 0.040 + 0.006 = 0.346.","v":"place-value"},{"d":"HARD","q":"Which decimal represents 3 + 8/100 + 2/1000?","o":["3.082","3.802","3.82","3.0082"],"a":0,"e":"8 hundredths is 0.08 and 2 thousandths is 0.002; total 3.082.","v":"place-value"},{"d":"HARD","q":"In 42.718, what is the value of the digit 1?","o":["1","0.1","0.01","0.001"],"a":2,"e":"The 1 is in the hundredths place.","v":"place-value"},{"d":"HARD","q":"Which number is 100 times 0.036?","o":["0.0036","0.36","3.6","36"],"a":2,"e":"Multiplying by 100 moves the decimal point two places right: 3.6.","v":"place-value"},{"d":"HARD","q":"A meter is divided into 1000 equal parts. One part is what fraction of a meter?","o":["1/10","1/100","1/1000","10/1000"],"a":2,"e":"One of 1000 equal parts is one thousandth, or 1/1000.","v":"place-value"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Read decimal place values</strong><small>Identify tenths, hundredths and thousandths</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Expand decimals</strong><small>Write decimals in expanded and fractional forms</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply decimal place value</strong><small>Interpret decimal quantities accurately</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
