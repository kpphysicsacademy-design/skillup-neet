<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"To plot the point (2,3), how many units do you move horizontally first?","o":["3","2","5","0"],"a":1,"e":"Move along the x-axis first by 2 units, then vertically by 3."},{"d":"BASIC","q":"When plotting (−4,1), in which direction do you move first from the origin?","o":["Right","Up","Left","Down"],"a":2,"e":"The x-coordinate is −4, so move 4 units left first."},{"d":"BASIC","q":"Which point is 3 units right and 2 units down from the origin?","o":["(−3,2)","(3,−2)","(2,−3)","(−2,3)"],"a":1,"e":"Right is positive x and down is negative y: (3,−2)."},{"d":"BASIC","q":"Where do you plot the point (0,4)?","o":["On the x-axis","On the y-axis, above origin","In quadrant I away from axes","At the origin"],"a":1,"e":"Since x=0, the point lies on the y-axis; y=4 puts it above the origin."},{"d":"BASIC","q":"Which point should be plotted 5 units left along the x-axis?","o":["(5,0)","(0,−5)","(−5,0)","(0,5)"],"a":2,"e":"Left of the origin on the x-axis is (−5,0)."},{"d":"BASIC","q":"What is the correct order for plotting an ordered pair (x,y)?","o":["Move vertically, then horizontally","Move horizontally by x, then vertically by y","Always move right and up","Start at (1,1)"],"a":1,"e":"Read x first for horizontal movement, then y for vertical movement."},{"d":"BASIC","q":"Which point is in Quadrant III and should be plotted left and down?","o":["(−2,−3)","(−2,3)","(2,−3)","(2,3)"],"a":0,"e":"Both coordinates are negative, so move left and down."},{"d":"BASIC","q":"Which point lies on the x-axis to the right of the origin?","o":["(0,3)","(−3,0)","(3,0)","(0,−3)"],"a":2,"e":"Positive x with y=0 is on the x-axis to the right."},{"d":"BASIC","q":"Which point is plotted at the origin?","o":["(0,1)","(1,0)","(0,0)","(−1,−1)"],"a":2,"e":"The origin is the intersection of both axes, at (0,0)."},{"d":"BASIC","q":"To plot (−2,−5), from the origin you move:","o":["Right 2, up 5","Left 2, down 5","Left 5, down 2","Right 2, down 5"],"a":1,"e":"The negative x-coordinate means left 2; negative y means down 5."},{"d":"MEDIUM","q":"A point is plotted 4 units left and 3 units up from the origin. What are its coordinates?","o":["(4,3)","(−4,−3)","(−4,3)","(3,−4)"],"a":2,"e":"Left gives x=−4 and up gives y=3."},{"d":"MEDIUM","q":"Which sequence correctly plots (3,−4)?","o":["Left 3, down 4","Right 3, down 4","Right 4, down 3","Down 3, right 4"],"a":1,"e":"Move 3 right for x=3, then 4 down for y=−4."},{"d":"MEDIUM","q":"A student plots (−1,4) by moving right 1 and up 4. What should be corrected?","o":["Move left 1 instead of right","Move down 4 instead of up","Move right 4 instead of left","Start at (1,1)"],"a":0,"e":"The x-coordinate −1 requires moving left, not right."},{"d":"MEDIUM","q":"Which ordered pair is obtained by moving 2 units right, then 6 units up?","o":["(−2,6)","(6,2)","(2,6)","(2,−6)"],"a":2,"e":"The horizontal movement is x=2 and vertical movement is y=6."},{"d":"MEDIUM","q":"Point A=(−3,2) is moved 5 units right and 4 units down. Where does it land?","o":["(2,−2)","(−8,6)","(2,6)","(−2,2)"],"a":0,"e":"New x=−3+5=2 and new y=2−4=−2."},{"d":"MEDIUM","q":"Which point would be plotted on the y-axis below the origin?","o":["(−4,0)","(0,−4)","(0,4)","(4,0)"],"a":1,"e":"On the y-axis x=0, and below the origin y is negative."},{"d":"MEDIUM","q":"Points P=(2,1) and Q=(2,−3) are plotted. What do they have in common?","o":["Same y-coordinate","Same x-coordinate","Both on x-axis","Both in Quadrant I"],"a":1,"e":"Both points have x-coordinate 2."},{"d":"MEDIUM","q":"Which point is 3 units from the y-axis and 2 units below the x-axis in Quadrant IV?","o":["(−3,−2)","(3,−2)","(3,2)","(−3,2)"],"a":1,"e":"Quadrant IV requires x positive and y negative; the distances give (3,−2)."},{"d":"MEDIUM","q":"A point (−4,−1) is plotted. Which direction is its next move if you increase only its y-coordinate by 3?","o":["Down 3","Right 3","Up 3","Left 3"],"a":2,"e":"Increasing y by 3 moves the point up 3 units."},{"d":"MEDIUM","q":"Which point is 2 units right and 5 units above the point (−1,−2)?","o":["(1,3)","(−3,−7)","(1,−7)","(−3,3)"],"a":0,"e":"Add 2 to x: −1+2=1; add 5 to y: −2+5=3."},{"d":"HARD","q":"On a coordinate grid, A=(−2,3) and B=(4,3). How far apart are the points horizontally?","o":["2 units","4 units","6 units","7 units"],"a":2,"e":"They share y=3; horizontal distance is |4−(−2)|=6 units."},{"d":"HARD","q":"Point P=(3,−2) is reflected across the y-axis and then plotted. What are the new coordinates?","o":["(3,2)","(−3,−2)","(−3,2)","(2,−3)"],"a":1,"e":"Reflection across the y-axis changes the sign of x only."},{"d":"HARD","q":"A point is plotted at (−5,4). To reach (−5,−2), what movement is needed?","o":["6 units right","6 units down","6 units up","10 units left"],"a":1,"e":"The x-coordinate stays −5; y decreases from 4 to −2, a move down 6."},{"d":"HARD","q":"A student plots (a,−3) at (−4,−3). What is a?","o":["3","−3","4","−4"],"a":3,"e":"The first coordinate is x, so a=−4."},{"d":"HARD","q":"Which point is closest to the origin when measured by horizontal plus vertical grid steps?","o":["(−2,3)","(4,0)","(1,1)","(0,5)"],"a":2,"e":"The grid-step totals are 5, 4, 2, and 5 respectively; (1,1) is closest by this measure."},{"d":"HARD","q":"A point in Quadrant II is 4 units from the y-axis and 2 units from the x-axis. What is it?","o":["(4,2)","(−4,−2)","(−4,2)","(2,−4)"],"a":2,"e":"Quadrant II has negative x and positive y, so the point is (−4,2)."},{"d":"HARD","q":"Point M=(−3,−2) moves 7 units right and 5 units up. Where does it end?","o":["(4,3)","(−10,−7)","(4,−7)","(−4,3)"],"a":0,"e":"New x=−3+7=4 and new y=−2+5=3."},{"d":"HARD","q":"A point on the graph has x-coordinate 0 and y-coordinate −6. Which plotting instruction is correct?","o":["Move left 6 on x-axis","Move right 6 on x-axis","Move down 6 along y-axis","Move up 6 along y-axis"],"a":2,"e":"x=0 keeps it on the y-axis, and y=−6 means down 6."},{"d":"HARD","q":"The point (2,5) is moved 4 units left and 8 units down. In which quadrant is the new point?","o":["I","II","III","IV"],"a":2,"e":"New point is (−2,−3), with both coordinates negative, so Quadrant III."},{"d":"HARD","q":"Point A=(−2,1) and point B=(3,−2) are plotted. Which statement is true?","o":["A is in Quadrant I and B in II","A is in Quadrant II and B in IV","Both points lie on axes","A is in Quadrant III and B in I"],"a":1,"e":"A has x<0,y>0 (Quadrant II); B has x>0,y<0 (Quadrant IV)."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Master plotting points</strong><small>Plot ordered pairs accurately</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Move horizontally and vertically</strong><small>Read plotted points</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Interpret coordinate grids</strong><small>Solve multi-step plotting problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
