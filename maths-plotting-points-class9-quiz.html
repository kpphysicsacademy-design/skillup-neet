<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"To plot the point (2,3), how many units do you move horizontally first?","o":["3","2","5","0"],"a":1,"why":"Move along the x-axis first by 2 units, then vertically by 3."},{"d":"BASIC","q":"When plotting (−4,1), in which direction do you move first from the origin?","o":["Right","Up","Left","Down"],"a":2,"why":"The x-coordinate is −4, so move 4 units left first."},{"d":"BASIC","q":"Which point is 3 units right and 2 units down from the origin?","o":["(−3,2)","(3,−2)","(2,−3)","(−2,3)"],"a":1,"why":"Right is positive x and down is negative y: (3,−2)."},{"d":"BASIC","q":"Where do you plot the point (0,4)?","o":["On the x-axis","On the y-axis, above origin","In quadrant I away from axes","At the origin"],"a":1,"why":"Since x=0, the point lies on the y-axis; y=4 puts it above the origin."},{"d":"BASIC","q":"Which point should be plotted 5 units left along the x-axis?","o":["(5,0)","(0,−5)","(−5,0)","(0,5)"],"a":2,"why":"Left of the origin on the x-axis is (−5,0)."},{"d":"BASIC","q":"What is the correct order for plotting an ordered pair (x,y)?","o":["Move vertically, then horizontally","Move horizontally by x, then vertically by y","Always move right and up","Start at (1,1)"],"a":1,"why":"Read x first for horizontal movement, then y for vertical movement."},{"d":"BASIC","q":"Which point is in Quadrant III and should be plotted left and down?","o":["(−2,−3)","(−2,3)","(2,−3)","(2,3)"],"a":0,"why":"Both coordinates are negative, so move left and down."},{"d":"BASIC","q":"Which point lies on the x-axis to the right of the origin?","o":["(0,3)","(−3,0)","(3,0)","(0,−3)"],"a":2,"why":"Positive x with y=0 is on the x-axis to the right."},{"d":"BASIC","q":"Which point is plotted at the origin?","o":["(0,1)","(1,0)","(0,0)","(−1,−1)"],"a":2,"why":"The origin is the intersection of both axes, at (0,0)."},{"d":"BASIC","q":"To plot (−2,−5), from the origin you move:","o":["Right 2, up 5","Left 2, down 5","Left 5, down 2","Right 2, down 5"],"a":1,"why":"The negative x-coordinate means left 2; negative y means down 5."},{"d":"MEDIUM","q":"A point is plotted 4 units left and 3 units up from the origin. What are its coordinates?","o":["(4,3)","(−4,−3)","(−4,3)","(3,−4)"],"a":2,"why":"Left gives x=−4 and up gives y=3."},{"d":"MEDIUM","q":"Which sequence correctly plots (3,−4)?","o":["Left 3, down 4","Right 3, down 4","Right 4, down 3","Down 3, right 4"],"a":1,"why":"Move 3 right for x=3, then 4 down for y=−4."},{"d":"MEDIUM","q":"A student plots (−1,4) by moving right 1 and up 4. What should be corrected?","o":["Move left 1 instead of right","Move down 4 instead of up","Move right 4 instead of left","Start at (1,1)"],"a":0,"why":"The x-coordinate −1 requires moving left, not right."},{"d":"MEDIUM","q":"Which ordered pair is obtained by moving 2 units right, then 6 units up?","o":["(−2,6)","(6,2)","(2,6)","(2,−6)"],"a":2,"why":"The horizontal movement is x=2 and vertical movement is y=6."},{"d":"MEDIUM","q":"Point A=(−3,2) is moved 5 units right and 4 units down. Where does it land?","o":["(2,−2)","(−8,6)","(2,6)","(−2,2)"],"a":0,"why":"New x=−3+5=2 and new y=2−4=−2."},{"d":"MEDIUM","q":"Which point would be plotted on the y-axis below the origin?","o":["(−4,0)","(0,−4)","(0,4)","(4,0)"],"a":1,"why":"On the y-axis x=0, and below the origin y is negative."},{"d":"MEDIUM","q":"Points P=(2,1) and Q=(2,−3) are plotted. What do they have in common?","o":["Same y-coordinate","Same x-coordinate","Both on x-axis","Both in Quadrant I"],"a":1,"why":"Both points have x-coordinate 2."},{"d":"MEDIUM","q":"Which point is 3 units from the y-axis and 2 units below the x-axis in Quadrant IV?","o":["(−3,−2)","(3,−2)","(3,2)","(−3,2)"],"a":1,"why":"Quadrant IV requires x positive and y negative; the distances give (3,−2)."},{"d":"MEDIUM","q":"A point (−4,−1) is plotted. Which direction is its next move if you increase only its y-coordinate by 3?","o":["Down 3","Right 3","Up 3","Left 3"],"a":2,"why":"Increasing y by 3 moves the point up 3 units."},{"d":"MEDIUM","q":"Which point is 2 units right and 5 units above the point (−1,−2)?","o":["(1,3)","(−3,−7)","(1,−7)","(−3,3)"],"a":0,"why":"Add 2 to x: −1+2=1; add 5 to y: −2+5=3."},{"d":"HARD","q":"On a coordinate grid, A=(−2,3) and B=(4,3). How far apart are the points horizontally?","o":["2 units","4 units","6 units","7 units"],"a":2,"why":"They share y=3; horizontal distance is |4−(−2)|=6 units."},{"d":"HARD","q":"Point P=(3,−2) is reflected across the y-axis and then plotted. What are the new coordinates?","o":["(3,2)","(−3,−2)","(−3,2)","(2,−3)"],"a":1,"why":"Reflection across the y-axis changes the sign of x only."},{"d":"HARD","q":"A point is plotted at (−5,4). To reach (−5,−2), what movement is needed?","o":["6 units right","6 units down","6 units up","10 units left"],"a":1,"why":"The x-coordinate stays −5; y decreases from 4 to −2, a move down 6."},{"d":"HARD","q":"A student plots (a,−3) at (−4,−3). What is a?","o":["3","−3","4","−4"],"a":3,"why":"The first coordinate is x, so a=−4."},{"d":"HARD","q":"Which point is closest to the origin when measured by horizontal plus vertical grid steps?","o":["(−2,3)","(4,0)","(1,1)","(0,5)"],"a":2,"why":"The grid-step totals are 5, 4, 2, and 5 respectively; (1,1) is closest by this measure."},{"d":"HARD","q":"A point in Quadrant II is 4 units from the y-axis and 2 units from the x-axis. What is it?","o":["(4,2)","(−4,−2)","(−4,2)","(2,−4)"],"a":2,"why":"Quadrant II has negative x and positive y, so the point is (−4,2)."},{"d":"HARD","q":"Point M=(−3,−2) moves 7 units right and 5 units up. Where does it end?","o":["(4,3)","(−10,−7)","(4,−7)","(−4,3)"],"a":0,"why":"New x=−3+7=4 and new y=−2+5=3."},{"d":"HARD","q":"A point on the graph has x-coordinate 0 and y-coordinate −6. Which plotting instruction is correct?","o":["Move left 6 on x-axis","Move right 6 on x-axis","Move down 6 along y-axis","Move up 6 along y-axis"],"a":2,"why":"x=0 keeps it on the y-axis, and y=−6 means down 6."},{"d":"HARD","q":"The point (2,5) is moved 4 units left and 8 units down. In which quadrant is the new point?","o":["I","II","III","IV"],"a":2,"why":"New point is (−2,−3), with both coordinates negative, so Quadrant III."},{"d":"HARD","q":"Point A=(−2,1) and point B=(3,−2) are plotted. Which statement is true?","o":["A is in Quadrant I and B in II","A is in Quadrant II and B in IV","Both points lie on axes","A is in Quadrant III and B in I"],"a":1,"why":"A has x<0,y>0 (Quadrant II); B has x>0,y<0 (Quadrant IV)."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Plotting Points Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
