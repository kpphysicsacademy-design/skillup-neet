<style>

<section class="hero">
<h1>Plotting Points</h1>
<p class="muted">Practise reading ordered pairs, locating coordinates, using axes and plotting points on the Cartesian plane.</p>
<div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div>
<div class="track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
</section>
<section class="quiz" id="quiz">

<h2 class="question" id="question">Points plotted!</h2>
<div class="options" id="options"></div>
<div class="feedback" id="feedback" aria-live="polite"></div>

</section>

<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"On a coordinate grid, how do you plot the point (3, 2)?","o":["Move 3 right, then 2 up","Move 2 right, then 3 up","Move 3 left, then 2 up","Move 3 right, then 2 down"],"a":0,"why":"In (x, y), move along x first: 3 right, then 2 up."},{"d":"BASIC","q":"Which point should be plotted 4 units left and 1 unit up from the origin?","o":["(4, 1)","(−4, 1)","(1, −4)","(−1, 4)"],"a":1,"why":"Left gives a negative x-coordinate and up gives a positive y-coordinate."},{"d":"BASIC","q":"What is the correct order for plotting (−2, −5)?","o":["Down 5, then left 2","Right 2, then down 5","Left 2, then down 5","Left 5, then down 2"],"a":2,"why":"Read the x-coordinate first, then the y-coordinate: left 2 and down 5."},{"d":"BASIC","q":"Which point is 2 units right and 4 units up?","o":["(4, 2)","(−2, 4)","(2, −4)","(2, 4)"],"a":3,"why":"Positive x is right; positive y is up, so the point is (2, 4)."},{"d":"BASIC","q":"Where does the point (0, 3) lie?","o":["On the y-axis","On the x-axis","In Quadrant I","At the origin"],"a":0,"why":"The x-coordinate is zero, so the point lies on the y-axis."},{"d":"BASIC","q":"Which coordinate pair represents the origin?","o":["(0, 1)","(0, 0)","(1, 0)","(1, 1)"],"a":1,"why":"The origin is the intersection of both axes, where x = 0 and y = 0."},{"d":"BASIC","q":"A point is plotted at (−3, 0). Where is it?","o":["On the positive y-axis","In Quadrant III","On the negative x-axis","On the positive x-axis"],"a":2,"why":"A zero y-coordinate puts it on the x-axis; negative x places it on the negative side."},{"d":"BASIC","q":"Which point is in Quadrant II?","o":["(2, 3)","(−2, −3)","(2, −3)","(−2, 3)"],"a":3,"why":"Quadrant II has negative x and positive y coordinates."},{"d":"BASIC","q":"The horizontal axis on a standard coordinate plane is called the…","o":["x-axis","y-axis","origin","vertical axis"],"a":0,"why":"The x-axis runs horizontally across the coordinate plane."},{"d":"BASIC","q":"The point (5, −2) is plotted by moving…","o":["5 left and 2 up","5 right and 2 down","2 right and 5 down","5 left and 2 down"],"a":1,"why":"The positive x-value means 5 right; the negative y-value means 2 down."},{"d":"MEDIUM","q":"On a grid where each square represents 1 unit, plot A(−2, 3). Which description is correct?","o":["2 right, 3 up","2 left, 3 down","2 left, 3 up","3 left, 2 up"],"a":2,"why":"A negative x-coordinate means left 2, and a positive y-coordinate means up 3."},{"d":"MEDIUM","q":"A point is 4 units right of the y-axis and 3 units below the x-axis. What are its coordinates?","o":["(−4, −3)","(3, −4)","(4, 3)","(4, −3)"],"a":3,"why":"Right means x = 4 and below means y = −3."},{"d":"MEDIUM","q":"Which point should be plotted at the intersection x = −1 and y = 4?","o":["(−1, 4)","(4, −1)","(1, 4)","(−4, 1)"],"a":0,"why":"The x-value is written first, followed by the y-value."},{"d":"MEDIUM","q":"A student plots (2, 5) by moving 5 units right and 2 units up. What did the student do wrong?","o":["Nothing; the point is correct","Swapped the x- and y-coordinates","Changed both signs","Used the origin as the starting point incorrectly"],"a":1,"why":"The first coordinate is x = 2 and must be read before y = 5."},{"d":"MEDIUM","q":"Which point lies 3 units from the y-axis and 2 units above the x-axis in Quadrant II?","o":["(3, 2)","(−2, 3)","(−3, 2)","(−3, −2)"],"a":2,"why":"Quadrant II means x is negative and y is positive; the distances give (−3, 2)."},{"d":"MEDIUM","q":"On a grid with 2 units per large interval, the point is 3 intervals right and 2 intervals up. What are its coordinates?","o":["(3, 2)","(6, 2)","(3, 4)","(6, 4)"],"a":3,"why":"Each interval is 2 units, so x = 3 × 2 = 6 and y = 2 × 2 = 4."},{"d":"MEDIUM","q":"Which ordered pair matches x = 0 and y = −4?","o":["(0, −4)","(−4, 0)","(0, 4)","(4, 0)"],"a":0,"why":"Write x first (0), then y (−4)."},{"d":"MEDIUM","q":"A point B is plotted at (−4, −1). In which direction is it from the origin?","o":["Right and up","Left and down","Left and up","Right and down"],"a":1,"why":"Both coordinates are negative, so move left 4 and down 1."},{"d":"MEDIUM","q":"Which point is exactly on the positive x-axis?","o":["(0, 5)","(−5, 0)","(5, 0)","(0, −5)"],"a":2,"why":"On the x-axis y = 0; on its positive side x is greater than zero."},{"d":"MEDIUM","q":"A map uses coordinates (x, y) for locations. The school is at (−2, 4) and the library at (3, 4). Which statement is true?","o":["They have different y-coordinates","The school is to the right of the library","They are on opposite sides of the x-axis","They share the same horizontal level"],"a":3,"why":"Both y-coordinates are 4, so they lie on the same horizontal level."},{"d":"HARD","q":"Point P(−3, 2) is moved 4 units right and 5 units down. Where is P now?","o":["(1, −3)","(−7, 7)","(1, 7)","(−1, −3)"],"a":0,"why":"Update each coordinate: x = −3 + 4 = 1 and y = 2 − 5 = −3."},{"d":"HARD","q":"A point on the line x = 2 is 3 units from the x-axis. Which points are possible?","o":["(−2, 3) only","(2, 3) and (2, −3)","(3, 2) and (−3, 2)","(2, 0) only"],"a":1,"why":"The x-coordinate stays 2; distance 3 from the x-axis means y = 3 or y = −3."},{"d":"HARD","q":"The point (a, −2) lies on the vertical line through (5, −2). What is a?","o":["−2","2","5","0"],"a":2,"why":"Points on the same vertical line have equal x-coordinates, so a = 5."},{"d":"HARD","q":"A point is reflected across the y-axis from (−4, 3). What are its new coordinates?","o":["(−4, −3)","(4, −3)","(−3, 4)","(4, 3)"],"a":3,"why":"Reflection across the y-axis changes the sign of x and keeps y unchanged."},{"d":"HARD","q":"A point C(2, −1) is moved 3 units left and 4 units up. Which quadrant contains the new point?","o":["Quadrant II","Quadrant I","Quadrant III","Quadrant IV"],"a":0,"why":"The new point is (−1, 3), with negative x and positive y, so it is in Quadrant II."},{"d":"HARD","q":"Which point has the same x-coordinate as (−6, 2) and lies 5 units below the x-axis?","o":["(6, −5)","(−6, −5)","(−5, −6)","(−6, 5)"],"a":1,"why":"Keep x = −6; 5 units below the x-axis means y = −5."},{"d":"HARD","q":"On a grid where each small square is 0.5 unit, a point is 6 small squares left and 4 small squares up. What are its coordinates?","o":["(−6, 4)","(3, 2)","(−3, 2)","(−3, −2)"],"a":2,"why":"Six half-units left is x = −3; four half-units up is y = 2."},{"d":"HARD","q":"Three plotted points are A(1, 1), B(1, 4), and C(5, 1). What are the coordinates of the fourth corner of the axis-aligned rectangle?","o":["(1, 5)","(4, 5)","(−5, 4)","(5, 4)"],"a":3,"why":"The missing corner combines the x-coordinate of C (5) and y-coordinate of B (4)."},{"d":"HARD","q":"A point moves from (−2, −3) to (−2, 4). What direction and distance did it move?","o":["7 units up","7 units right","7 units down","2 units up"],"a":0,"why":"The x-coordinate is unchanged; y increases from −3 to 4, a change of 7 units up."},{"d":"HARD","q":"A plotted point has x-coordinate −3 and is in Quadrant III. Which y-coordinate could it have?","o":["4","−2","0","3"],"a":1,"why":"Quadrant III requires both coordinates to be negative; y = −2 satisfies this."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Direct Proportion Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
