<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"What is a point used to represent in geometry?","o":["An exact position","A curved path","A flat surface","A measured length"],"a":0,"e":"A point marks an exact position and has no length or width."},{"d":"BASIC","q":"Which drawing best represents a straight line?","o":["A path that bends","A straight path extending endlessly both ways","A finite straight piece","A closed curved shape"],"a":1,"e":"A line is straight and extends indefinitely in both directions."},{"d":"BASIC","q":"What is a line segment?","o":["A line extending forever","A part of a line with two endpoints","A path with one endpoint only","A curved line"],"a":1,"e":"A line segment has two fixed endpoints."},{"d":"BASIC","q":"Which figure has exactly one endpoint and extends endlessly in one direction?","o":["Line","Line segment","Ray","Point"],"a":2,"e":"A ray starts at one endpoint and continues forever in one direction."},{"d":"BASIC","q":"How many endpoints does a line segment have?","o":["Zero","One","Two","Three"],"a":2,"e":"A line segment has two endpoints."},{"d":"BASIC","q":"How many endpoints does a line have?","o":["Zero","One","Two","Infinitely many endpoints"],"a":0,"e":"A line extends endlessly in both directions and has no endpoints."},{"d":"BASIC","q":"Which symbol is commonly used to name a point?","o":["A capital letter","A fraction","A degree sign","A multiplication sign"],"a":0,"e":"Points are commonly named with capital letters, such as A or B."},{"d":"BASIC","q":"If A and B are the endpoints of a segment, how is it named?","o":["Line AB only","Segment AB","Ray AB only","Angle AB"],"a":1,"e":"A segment can be named by its two endpoints: segment AB."},{"d":"BASIC","q":"Which figure can be extended in both directions without end?","o":["Ray","Line segment","Line","Point"],"a":2,"e":"A line continues endlessly in both directions."},{"d":"BASIC","q":"Which figure has a fixed starting point but no ending point?","o":["Ray","Line segment","Line","Polygon"],"a":0,"e":"A ray has one endpoint and continues indefinitely in one direction."},{"d":"MEDIUM","q":"Points A and B are 5 cm apart on a straight path. What is the length of segment AB?","o":["5 cm","10 cm","5 cm²","Cannot be measured"],"a":0,"e":"The distance between endpoints A and B is the segment's length: 5 cm."},{"d":"MEDIUM","q":"Which statement about a line segment is true?","o":["It has no endpoints","It has exactly two endpoints","It extends forever both ways","It must be curved"],"a":1,"e":"A segment is the part of a line bounded by two endpoints."},{"d":"MEDIUM","q":"A ray starts at P and passes through Q. Which point lies along its direction from P?","o":["Q","A point behind P on the opposite side","No point after Q","Only the endpoint P"],"a":0,"e":"Ray PQ begins at P and extends through Q in the same direction."},{"d":"MEDIUM","q":"How many distinct lines can pass through two different points?","o":["None","Exactly one","Exactly two","Infinitely many"],"a":1,"e":"Two distinct points determine exactly one straight line."},{"d":"MEDIUM","q":"Which pair of points is enough to name a straight line?","o":["One point only","Two distinct points","Three points always","No points"],"a":1,"e":"A line can be named using any two distinct points on it."},{"d":"MEDIUM","q":"A 9 cm segment is split at a point into parts of 4 cm and x cm. Find x.","o":["3 cm","4 cm","5 cm","13 cm"],"a":2,"e":"The parts add to 9 cm, so 4 + x = 9 and x = 5 cm."},{"d":"MEDIUM","q":"Which is the correct comparison?","o":["A line segment has no fixed length","A ray has two endpoints","A line extends in both directions","A point has length 1 cm"],"a":2,"e":"A line extends indefinitely in both directions."},{"d":"MEDIUM","q":"Segment AB is 12 cm long. Point C lies between A and B, and AC = 7 cm. Find CB.","o":["3 cm","5 cm","7 cm","19 cm"],"a":1,"e":"AB = AC + CB, so CB = 12 − 7 = 5 cm."},{"d":"MEDIUM","q":"Which figure has one endpoint and passes through two named points in order?","o":["Ray AB, starting at A and passing through B","Segment AB","Line AB","Point A"],"a":0,"e":"Ray AB starts at A and extends through B."},{"d":"MEDIUM","q":"Two segments have lengths 6 cm and 8 cm. What is their total length if placed end to end without overlap?","o":["2 cm","14 cm","48 cm","14 cm²"],"a":1,"e":"End-to-end lengths add: 6 + 8 = 14 cm."},{"d":"HARD","q":"A segment AB is 18 cm. Point C lies between A and B; AC is twice CB. What is CB?","o":["6 cm","9 cm","12 cm","3 cm"],"a":0,"e":"Let CB = x; AC = 2x, so 3x = 18 and x = 6 cm."},{"d":"HARD","q":"A line segment is 25 cm long and is divided into three consecutive parts of 7 cm, 9 cm and x cm. Find x.","o":["7 cm","8 cm","9 cm","10 cm"],"a":2,"e":"7 + 9 + x = 25, so x = 9 cm."},{"d":"HARD","q":"Point C lies between A and B. If AB = 20 cm and AC = 3 × CB, find CB.","o":["5 cm","7 cm","10 cm","15 cm"],"a":0,"e":"Let CB = x. Then 3x + x = 20, so x = 5 cm."},{"d":"HARD","q":"A 30 cm segment is divided into two parts in the ratio 2:3. What is the shorter part?","o":["10 cm","12 cm","15 cm","18 cm"],"a":1,"e":"The total is 5 equal parts, so each is 30 ÷ 5 = 6 cm; shorter part = 2 × 6 = 12 cm."},{"d":"HARD","q":"Three distinct points A, B and C are not on one straight line. How many different lines are determined by pairs of these points?","o":["1","2","3","6"],"a":2,"e":"Each pair gives one line: AB, AC and BC, for 3 lines."},{"d":"HARD","q":"A ray begins at A and passes through B. Which statement must be true?","o":["A is an endpoint","B is the endpoint","It ends at B","It extends in both directions"],"a":0,"e":"The first named point A is the ray's endpoint; it continues through B."},{"d":"HARD","q":"AB = 16 cm and C lies between A and B. If AC = 3 cm more than CB, what is CB?","o":["6.5 cm","9.5 cm","10 cm","13 cm"],"a":1,"e":"Let CB = x. Then x + (x + 3) = 16, so x = 6.5 cm."},{"d":"HARD","q":"AB = 16 cm and C lies between A and B. If AC is 3 cm more than CB, what is CB?","o":["6.5 cm","9.5 cm","10 cm","13 cm"],"a":0,"e":"Let CB = x. Then x + (x + 3) = 16, so x = 6.5 cm."},{"d":"HARD","q":"How many line segments are named by three collinear points A, B and C, with B between A and C?","o":["1","2","3","6"],"a":2,"e":"The segments are AB, BC and AC, for three in total."},{"d":"HARD","q":"Two segments have lengths 3x cm and (x + 8) cm. If they are equal, find x.","o":["2","4","6","8"],"a":1,"e":"3x = x + 8 gives 2x = 8, so x = 4."}];let index=0,selected=-1,locked=false,finished=false,xp=0,streak=0,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));$('percent').textContent=Math.round(p)+'%';}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-letter="'+String.fromCharCode(65+i)+'" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;streak++;xp+=10;$('xp').textContent=xp;$('streak').textContent=streak;}else{streak=0;$('streak').textContent=0;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const skills=[['Distinguish points, lines and line segments',8],['Recognise endpoints and line notation',18],['Apply basic geometry vocabulary',24]];$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">📐</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>🔥 Best streak: '+streak+'</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+skills.map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;streak=0;correct=0;$('xp').textContent=0;$('streak').textContent=0;render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script>
