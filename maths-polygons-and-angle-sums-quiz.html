<script>
(function(){
'use strict';
const questions=[{"q":"How many sides does a pentagon have?","o":["5","4","6","8"],"a":0,"why":"A pentagon has five sides."},{"q":"What is the sum of the interior angles of a quadrilateral?","o":["180°","360°","270°","540°"],"a":1,"why":"For n = 4, the sum is (4 − 2) × 180° = 360°."},{"q":"What is the sum of the interior angles of a triangle?","o":["360°","90°","180°","540°"],"a":2,"why":"For n = 3, (3 − 2) × 180° = 180°."},{"q":"A hexagon has how many sides?","o":["5","7","8","6"],"a":3,"why":"A hexagon has six sides."},{"q":"What is the sum of one exterior angle at each vertex of any convex polygon?","o":["360°","180°","540°","Depends on the number of sides"],"a":0,"why":"One full turn around a convex polygon totals 360°."},{"q":"How many sides does an octagon have?","o":["6","8","7","10"],"a":1,"why":"An octagon has eight sides."},{"q":"What is the sum of the interior angles of a pentagon?","o":["360°","720°","540°","900°"],"a":2,"why":"(5 − 2) × 180° = 540°."},{"q":"Each exterior angle of a regular hexagon is:","o":["45°","72°","90°","60°"],"a":3,"why":"A regular polygon's exterior angles are equal, so 360° ÷ 6 = 60°."},{"q":"How many diagonals does a quadrilateral have?","o":["2","1","3","4"],"a":0,"why":"A quadrilateral has 4(4 − 3) ÷ 2 = 2 diagonals."},{"q":"An interior angle and its adjacent exterior angle form a:","o":["Full angle of 360°","Straight angle of 180°","Right angle of 90°","Reflex angle of 270°"],"a":1,"why":"Adjacent interior and exterior angles are supplementary, totaling 180°."},{"q":"What is the sum of the interior angles of a heptagon?","o":["720°","1080°","900°","1260°"],"a":2,"why":"(7 − 2) × 180° = 900°."},{"q":"Each interior angle of a regular pentagon is:","o":["90°","120°","135°","108°"],"a":3,"why":"Each angle is 540° ÷ 5 = 108°."},{"q":"Each exterior angle of a regular decagon is:","o":["36°","30°","45°","60°"],"a":0,"why":"360° ÷ 10 = 36°."},{"q":"A polygon has interior-angle sum 1,080°. How many sides does it have?","o":["7","8","9","10"],"a":1,"why":"(n − 2) × 180° = 1,080°, so n − 2 = 6 and n = 8."},{"q":"A regular polygon has exterior angle 45° at each vertex. How many sides does it have?","o":["6","10","8","12"],"a":2,"why":"The exterior angles total 360°, so n = 360° ÷ 45° = 8."},{"q":"How many diagonals does a pentagon have?","o":["3","7","10","5"],"a":3,"why":"The number is n(n − 3) ÷ 2 = 5 × 2 ÷ 2 = 5."},{"q":"Each interior angle of a regular hexagon is:","o":["120°","108°","135°","150°"],"a":0,"why":"Its interior sum is 720°, and 720° ÷ 6 = 120°."},{"q":"A polygon's interior angles sum to 720°. What is its number of sides?","o":["5","6","7","8"],"a":1,"why":"(n − 2) × 180° = 720°, giving n = 6."},{"q":"What is the sum of the interior angles of a nonagon?","o":["1,080°","1,440°","1,260°","1,620°"],"a":2,"why":"(9 − 2) × 180° = 1,260°."},{"q":"A regular polygon has 12 sides. Each exterior angle is:","o":["24°","36°","45°","30°"],"a":3,"why":"360° ÷ 12 = 30°."},{"q":"Each interior angle of a regular polygon is 150°. How many sides does it have?","o":["12","10","8","15"],"a":0,"why":"The exterior angle is 180° − 150° = 30°, so n = 360° ÷ 30° = 12."},{"q":"A polygon has interior-angle sum 2,340°. How many sides does it have?","o":["14","15","13","16"],"a":1,"why":"(n − 2) × 180° = 2,340°, so n − 2 = 13 and n = 15."},{"q":"How many diagonals does a decagon have?","o":["30","40","35","45"],"a":2,"why":"Use n(n − 3) ÷ 2: 10 × 7 ÷ 2 = 35."},{"q":"The exterior angle of a regular polygon is 24°. How many sides does it have?","o":["12","10","18","15"],"a":3,"why":"The exterior angles total 360°, so 360° ÷ 24° = 15 sides."},{"q":"A convex polygon has 14 sides. What is its interior-angle sum?","o":["2,160°","1,980°","2,340°","2,520°"],"a":0,"why":"(14 − 2) × 180° = 2,160°."},{"q":"Each interior angle of a regular polygon is 135°. How many sides does it have?","o":["6","8","10","12"],"a":1,"why":"Each exterior angle is 45°, and 360° ÷ 45° = 8."},{"q":"A polygon has 20 diagonals. How many sides does it have?","o":["7","9","8","10"],"a":2,"why":"n(n − 3) ÷ 2 = 20; n² − 3n − 40 = 0, so (n − 8)(n + 5) = 0 and n = 8."},{"q":"The sum of a polygon's interior angles is 1,800°. How many sides does it have?","o":["10","11","14","12"],"a":3,"why":"(n − 2) × 180° = 1,800°, so n = 12."},{"q":"A regular polygon has 9 sides. What is each interior angle?","o":["140°","135°","150°","120°"],"a":0,"why":"Interior sum = (9 − 2) × 180° = 1,260°; each angle is 1,260° ÷ 9 = 140°."},{"q":"A polygon has 11 sides. How many diagonals does it have?","o":["33","44","55","22"],"a":1,"why":"11(11 − 3) ÷ 2 = 11 × 8 ÷ 2 = 44."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Polygons and Angle Sums Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-polygons-angle-sums-large-numbers-layout-v1" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
