<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"How many sides does a pentagon have?","o":["5","4","6","8"],"a":0,"e":"A pentagon has five sides.","v":"polygons-and-angle-sums"},{"d":"BASIC","q":"What is the sum of the interior angles of a quadrilateral?","o":["180°","360°","270°","540°"],"a":1,"e":"For n = 4, the sum is (4 − 2) × 180° = 360°.","v":"polygons-and-angle-sums"},{"d":"BASIC","q":"What is the sum of the interior angles of a triangle?","o":["360°","90°","180°","540°"],"a":2,"e":"For n = 3, (3 − 2) × 180° = 180°.","v":"polygons-and-angle-sums"},{"d":"BASIC","q":"A hexagon has how many sides?","o":["5","7","8","6"],"a":3,"e":"A hexagon has six sides.","v":"polygons-and-angle-sums"},{"d":"BASIC","q":"What is the sum of one exterior angle at each vertex of any convex polygon?","o":["360°","180°","540°","Depends on the number of sides"],"a":0,"e":"One full turn around a convex polygon totals 360°.","v":"polygons-and-angle-sums"},{"d":"BASIC","q":"How many sides does an octagon have?","o":["6","8","7","10"],"a":1,"e":"An octagon has eight sides.","v":"polygons-and-angle-sums"},{"d":"BASIC","q":"What is the sum of the interior angles of a pentagon?","o":["360°","720°","540°","900°"],"a":2,"e":"(5 − 2) × 180° = 540°.","v":"polygons-and-angle-sums"},{"d":"BASIC","q":"Each exterior angle of a regular hexagon is:","o":["45°","72°","90°","60°"],"a":3,"e":"A regular polygon's exterior angles are equal, so 360° ÷ 6 = 60°.","v":"polygons-and-angle-sums"},{"d":"BASIC","q":"How many diagonals does a quadrilateral have?","o":["2","1","3","4"],"a":0,"e":"A quadrilateral has 4(4 − 3) ÷ 2 = 2 diagonals.","v":"polygons-and-angle-sums"},{"d":"BASIC","q":"An interior angle and its adjacent exterior angle form a:","o":["Full angle of 360°","Straight angle of 180°","Right angle of 90°","Reflex angle of 270°"],"a":1,"e":"Adjacent interior and exterior angles are supplementary, totaling 180°.","v":"polygons-and-angle-sums"},{"d":"MEDIUM","q":"What is the sum of the interior angles of a heptagon?","o":["720°","1080°","900°","1260°"],"a":2,"e":"(7 − 2) × 180° = 900°.","v":"polygons-and-angle-sums"},{"d":"MEDIUM","q":"Each interior angle of a regular pentagon is:","o":["90°","120°","135°","108°"],"a":3,"e":"Each angle is 540° ÷ 5 = 108°.","v":"polygons-and-angle-sums"},{"d":"MEDIUM","q":"Each exterior angle of a regular decagon is:","o":["36°","30°","45°","60°"],"a":0,"e":"360° ÷ 10 = 36°.","v":"polygons-and-angle-sums"},{"d":"MEDIUM","q":"A polygon has interior-angle sum 1,080°. How many sides does it have?","o":["7","8","9","10"],"a":1,"e":"(n − 2) × 180° = 1,080°, so n − 2 = 6 and n = 8.","v":"polygons-and-angle-sums"},{"d":"MEDIUM","q":"A regular polygon has exterior angle 45° at each vertex. How many sides does it have?","o":["6","10","8","12"],"a":2,"e":"The exterior angles total 360°, so n = 360° ÷ 45° = 8.","v":"polygons-and-angle-sums"},{"d":"MEDIUM","q":"How many diagonals does a pentagon have?","o":["3","7","10","5"],"a":3,"e":"The number is n(n − 3) ÷ 2 = 5 × 2 ÷ 2 = 5.","v":"polygons-and-angle-sums"},{"d":"MEDIUM","q":"Each interior angle of a regular hexagon is:","o":["120°","108°","135°","150°"],"a":0,"e":"Its interior sum is 720°, and 720° ÷ 6 = 120°.","v":"polygons-and-angle-sums"},{"d":"MEDIUM","q":"A polygon's interior angles sum to 720°. What is its number of sides?","o":["5","6","7","8"],"a":1,"e":"(n − 2) × 180° = 720°, giving n = 6.","v":"polygons-and-angle-sums"},{"d":"MEDIUM","q":"What is the sum of the interior angles of a nonagon?","o":["1,080°","1,440°","1,260°","1,620°"],"a":2,"e":"(9 − 2) × 180° = 1,260°.","v":"polygons-and-angle-sums"},{"d":"MEDIUM","q":"A regular polygon has 12 sides. Each exterior angle is:","o":["24°","36°","45°","30°"],"a":3,"e":"360° ÷ 12 = 30°.","v":"polygons-and-angle-sums"},{"d":"HARD","q":"Each interior angle of a regular polygon is 150°. How many sides does it have?","o":["12","10","8","15"],"a":0,"e":"The exterior angle is 180° − 150° = 30°, so n = 360° ÷ 30° = 12.","v":"polygons-and-angle-sums"},{"d":"HARD","q":"A polygon has interior-angle sum 2,340°. How many sides does it have?","o":["14","15","13","16"],"a":1,"e":"(n − 2) × 180° = 2,340°, so n − 2 = 13 and n = 15.","v":"polygons-and-angle-sums"},{"d":"HARD","q":"How many diagonals does a decagon have?","o":["30","40","35","45"],"a":2,"e":"Use n(n − 3) ÷ 2: 10 × 7 ÷ 2 = 35.","v":"polygons-and-angle-sums"},{"d":"HARD","q":"The exterior angle of a regular polygon is 24°. How many sides does it have?","o":["12","10","18","15"],"a":3,"e":"The exterior angles total 360°, so 360° ÷ 24° = 15 sides.","v":"polygons-and-angle-sums"},{"d":"HARD","q":"A convex polygon has 14 sides. What is its interior-angle sum?","o":["2,160°","1,980°","2,340°","2,520°"],"a":0,"e":"(14 − 2) × 180° = 2,160°.","v":"polygons-and-angle-sums"},{"d":"HARD","q":"Each interior angle of a regular polygon is 135°. How many sides does it have?","o":["6","8","10","12"],"a":1,"e":"Each exterior angle is 45°, and 360° ÷ 45° = 8.","v":"polygons-and-angle-sums"},{"d":"HARD","q":"A polygon has 20 diagonals. How many sides does it have?","o":["7","9","8","10"],"a":2,"e":"n(n − 3) ÷ 2 = 20; n² − 3n − 40 = 0, so (n − 8)(n + 5) = 0 and n = 8.","v":"polygons-and-angle-sums"},{"d":"HARD","q":"The sum of a polygon's interior angles is 1,800°. How many sides does it have?","o":["10","11","14","12"],"a":3,"e":"(n − 2) × 180° = 1,800°, so n = 12.","v":"polygons-and-angle-sums"},{"d":"HARD","q":"A regular polygon has 9 sides. What is each interior angle?","o":["140°","135°","150°","120°"],"a":0,"e":"Interior sum = (9 − 2) × 180° = 1,260°; each angle is 1,260° ÷ 9 = 140°.","v":"polygons-and-angle-sums"},{"d":"HARD","q":"A polygon has 11 sides. How many diagonals does it have?","o":["33","44","55","22"],"a":1,"e":"11(11 − 3) ÷ 2 = 11 × 8 ÷ 2 = 44.","v":"polygons-and-angle-sums"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand polygons and angle sums</strong><small>Interior and exterior angle sums</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Regular polygon angle calculations</strong><small>Use angle sums and diagonals to solve problems</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Connect side counts, angles and diagonals</strong><small>Solve equations reducible to linear form</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
