<script>
(()=>{'use strict';
const originalQuestions=[{"id":"poly01","level":"BASIC","question":"Which condition must a simple polygon satisfy?","options":["It is a closed shape made only of straight line segments","It has at least one curved edge","It must have all sides equal","It must have exactly four vertices"],"answer":0,"explanation":"A polygon is a closed plane figure made from straight line segments."},{"id":"poly02","level":"BASIC","question":"A polygon with 5 sides is called a…","options":["Hexagon","Pentagon","Heptagon","Octagon"],"answer":1,"explanation":"A pentagon has five sides and five vertices."},{"id":"poly03","level":"BASIC","question":"How many sides does a hexagon have?","options":["5","6","7","8"],"answer":1,"explanation":"A hexagon has six sides."},{"id":"poly04","level":"BASIC","question":"Which shape is not a polygon?","options":["Triangle","Rectangle","Circle","Pentagon"],"answer":2,"explanation":"A circle has a curved boundary, not straight line segments."},{"id":"poly05","level":"BASIC","question":"In a polygon, what is a vertex?","options":["A corner where two sides meet","The middle of a side","A curved edge","The region outside the shape"],"answer":0,"explanation":"A vertex is the endpoint shared by two neighbouring sides."},{"id":"poly06","level":"BASIC","question":"A regular polygon has…","options":["Only equal sides","Only equal angles","All sides and all interior angles equal","Exactly six sides"],"answer":2,"explanation":"A regular polygon is both equilateral and equiangular."},{"id":"poly07","level":"BASIC","question":"Which polygon has 8 sides?","options":["Heptagon","Octagon","Nonagon","Decagon"],"answer":1,"explanation":"An octagon has eight sides."},{"id":"poly08","level":"BASIC","question":"What is a diagonal of a polygon?","options":["A segment joining two non-adjacent vertices","Any side of the polygon","A line that must pass through the centre","A segment joining the midpoints of two sides"],"answer":0,"explanation":"A diagonal joins vertices that are not next to each other."},{"id":"poly09","level":"BASIC","question":"A quadrilateral has how many sides?","options":["3","4","5","6"],"answer":1,"explanation":"The prefix quad- means four."},{"id":"poly10","level":"BASIC","question":"Which description fits a concave polygon?","options":["Every interior angle is less than 90°","At least one part caves inward, giving an interior angle greater than 180°","All sides and angles are equal","It has a curved edge"],"answer":1,"explanation":"A concave polygon has an inward indentation; at least one interior angle exceeds 180°."},{"id":"poly11","level":"MEDIUM","question":"What is the sum of the interior angles of a pentagon?","options":["360°","540°","720°","900°"],"answer":1,"explanation":"For an n-sided polygon, the interior-angle sum is (n − 2) × 180°. For n = 5, it is 540°."},{"id":"poly12","level":"MEDIUM","question":"Find the sum of the interior angles of a hexagon.","options":["540°","600°","720°","900°"],"answer":2,"explanation":"(6 − 2) × 180° = 720°."},{"id":"poly13","level":"MEDIUM","question":"How many diagonals can be drawn in a quadrilateral?","options":["1","2","3","4"],"answer":1,"explanation":"Each of the four vertices can connect across to one non-adjacent vertex; there are two distinct diagonals."},{"id":"poly14","level":"MEDIUM","question":"How many diagonals does a pentagon have?","options":["3","5","7","10"],"answer":1,"explanation":"A polygon with n sides has n(n − 3)/2 diagonals. For n = 5: 5 × 2 ÷ 2 = 5."},{"id":"poly15","level":"MEDIUM","question":"A convex polygon has 7 sides. What is its interior-angle sum?","options":["720°","900°","1,080°","1,260°"],"answer":1,"explanation":"(7 − 2) × 180° = 900°."},{"id":"poly16","level":"MEDIUM","question":"The sum of one exterior angle at each vertex of a convex polygon is…","options":["180°","270°","360°","It depends on the number of sides"],"answer":2,"explanation":"Taking one exterior angle at each vertex makes one complete turn, totalling 360°."},{"id":"poly17","level":"MEDIUM","question":"Each interior angle of a regular hexagon measures…","options":["90°","108°","120°","135°"],"answer":2,"explanation":"A regular hexagon has interior-angle sum 720°; each of its six equal angles is 720° ÷ 6 = 120°."},{"id":"poly18","level":"MEDIUM","question":"A polygon's interior-angle sum is 1,080°. How many sides does it have?","options":["6","7","8","9"],"answer":2,"explanation":"(n − 2) × 180° = 1,080° gives n − 2 = 6, so n = 8."},{"id":"poly19","level":"MEDIUM","question":"Which statement about every convex polygon is true?","options":["Both diagonals and sides must be equal","Every interior angle is less than 180°","It must have line symmetry","It must be regular"],"answer":1,"explanation":"In a convex polygon, each interior angle is less than 180°; convex polygons need not be regular or symmetric."},{"id":"poly20","level":"MEDIUM","question":"A regular polygon has each exterior angle equal to 45°. How many sides does it have?","options":["6","8","9","10"],"answer":1,"explanation":"The exterior angles total 360°; 360° ÷ 45° = 8 sides."},{"id":"poly21","level":"HARD","question":"A polygon has 12 sides. What is the sum of its interior angles?","options":["1,440°","1,620°","1,800°","2,160°"],"answer":2,"explanation":"(12 − 2) × 180° = 1,800°."},{"id":"poly22","level":"HARD","question":"A convex polygon has 9 sides. How many diagonals does it have?","options":["18","27","54","63"],"answer":1,"explanation":"n(n − 3)/2 = 9 × 6 ÷ 2 = 27 diagonals."},{"id":"poly23","level":"HARD","question":"Each interior angle of a regular polygon is 150°. How many sides does it have?","options":["8","10","12","15"],"answer":2,"explanation":"Each exterior angle is 180° − 150° = 30°. The number of sides is 360° ÷ 30° = 12."},{"id":"poly24","level":"HARD","question":"A polygon has an interior-angle sum of 2,340°. How many sides does it have?","options":["13","14","15","16"],"answer":2,"explanation":"(n − 2) × 180° = 2,340°; n − 2 = 13, so n = 15."},{"id":"poly25","level":"HARD","question":"A regular polygon has 15 sides. What is each exterior angle?","options":["18°","24°","30°","36°"],"answer":1,"explanation":"Each exterior angle of a regular polygon is 360° ÷ 15 = 24°."},{"id":"poly26","level":"HARD","question":"A convex polygon has 20 diagonals. How many sides does it have?","options":["6","7","8","10"],"answer":2,"explanation":"For n = 8, n(n − 3)/2 = 8 × 5 ÷ 2 = 20 diagonals, so it has 8 sides."},{"id":"poly27","level":"HARD","question":"A regular polygon's exterior angle is 24°. Find its interior-angle sum.","options":["2,160°","2,340°","2,520°","2,700°"],"answer":1,"explanation":"It has 360° ÷ 24° = 15 sides; its interior-angle sum is (15 − 2) × 180° = 2,340°."},{"id":"poly28","level":"HARD","question":"A convex polygon has 11 sides. How many triangles can be formed by drawing diagonals from one vertex without crossing?","options":["8","9","10","11"],"answer":1,"explanation":"Drawing diagonals from one vertex partitions an n-sided convex polygon into n − 2 triangles; 11 − 2 = 9."},{"id":"poly29","level":"HARD","question":"The interior angles of a pentagon are 100°, 110°, 120°, 130° and x°. Find x.","options":["60°","80°","100°","140°"],"answer":1,"explanation":"A pentagon totals 540°; x = 540° − 460° = 80°."},{"id":"poly30","level":"HARD","question":"A regular polygon has 9 sides. What is the measure of each interior angle?","options":["120°","135°","140°","144°"],"answer":2,"explanation":"Its interior-angle sum is (9 − 2) × 180° = 1,260°; each angle is 1,260° ÷ 9 = 140°."}];

function render(){const q=questions[index];selected=-1;locked=false;$('meta').textContent=q.level+' · QUESTION '+(index+1);$('question').textContent=q.question;$('options').replaceChildren();q.options.forEach((label,i)=>{const b=el('button','option'),letter=el('span','letter',letters[i]),txt=el('span','',label);b.type='button';b.append(letter,txt);b.addEventListener('click',()=>{if(locked)return;selected=i;$('options').querySelectorAll('button').forEach((x,j)=>x.classList.toggle('selected',j===i));$('check').disabled=false});$('options').append(b)});$('feedback').className='feedback';$('feedback').textContent='';$('check').style.display='block';$('check').disabled=true;$('continue').className='btn continue';progress()}
function check(){if(locked||selected<0)return;locked=true;const q=questions[index],ok=selected===q.answer;if(ok){correct++;xp+=10;streak++;bestStreak=Math.max(bestStreak,streak)}else{streak=0;mistakes.push({id:q.id,question:q.question,chosen:q.options[selected],answer:q.options[q.answer],explanation:q.explanation})}$('xp').textContent=String(xp);$('streak').textContent=String(streak);$('options').querySelectorAll('button').forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('correct');else if(j===selected)b.classList.add('wrong')});$('feedback').textContent=(ok?'Correct! ':'Review this concept. ')+q.explanation;$('feedback').className='feedback show '+(ok?'good':'bad');$('check').style.display='none';$('continue').className='btn continue show';$('continue').textContent=index===questions.length-1?'See results →':'Continue →'}
function restart(wrongOnly){questions=wrongOnly?originalQuestions.filter(q=>mistakes.some(m=>m.id===q.id)):originalQuestions.slice();index=0;selected=-1;locked=false;xp=0;correct=0;streak=0;bestStreak=0;mistakes=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render()}
function finish(){progress();$('quiz').style.display='none';const card=el('section','finish'),review=el('div','review');card.append(el('div','', '📐'),el('h2','',correct>=25?'Excellent work!':correct>=18?'Good progress!':'Keep practising!'));const link=el('a','topic-link','🧪 Explore Polygons Simulator →');link.href='maths-polygons-simulator.html?v=20261111-polygons-simulator-v1';card.append(link,el('div','score',correct+' / '+questions.length),el('p','muted','You answered '+correct+' correctly and earned '+xp+' XP.'),el('p','',Math.round(correct/questions.length*100)+'% accuracy · Best streak: '+bestStreak));review.append(el('h3','',mistakes.length?'Review your mistakes ('+mistakes.length+')':'Perfect round!'));mistakes.forEach((m,i)=>{const item=el('div','review-item');item.append(el('b','',(i+1)+'. '+m.question),el('p','your-answer','Your answer: '+m.chosen),el('p','correct-answer','Correct answer: '+m.answer),el('p','',m.explanation));review.append(item)});card.append(review);const actions=el('div','review-actions'),wrong=el('button','btn secondary','Retry mistakes'),all=el('button','btn primary','Retry all');wrong.type=all.type='button';wrong.disabled=!mistakes.length;wrong.addEventListener('click',()=>restart(true));all.addEventListener('click',()=>restart(false));actions.append(wrong,all);card.append(actions);$('finishSlot').replaceChildren(card)}
$('check').addEventListener('click',check);$('continue').addEventListener('click',()=>{index++;if(index<questions.length)render();else finish()});render()
})();
</script>
