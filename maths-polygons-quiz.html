</head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="pill xp">⭐ <span id="xp">0</span> XP</div><div class="pill">🔥 Practice</div><span id="hearts" hidden>❤️ 5</span></header><main><section class="hero"><h1>⬡ Polygons</h1><p class="muted">Polygon names · Regular and irregular shapes · Interior angles · Exterior angles · Diagonals</p><div class="links" style="display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0"><a href="maths-polygons-simulator.html?v=20261111-polygons-simulator-v1" style="display:block;text-align:center;text-decoration:none;background:#eaf7ff;color:#116b96;padding:10px;border-radius:10px;font-weight:800;font-size:13px;border:1px solid #b8deed">📐 Simulate Polygons</a></div><div class="progress-row"><span id="counter">Question 1 of 30</span><span id="percent">0%</span></div><div class="track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="bar"></div></div></section><section class="quiz card" aria-live="polite"><div class="qmeta" id="eyebrow">QUESTION 1</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="btn check primary" id="action" type="button" disabled>Check answer</button></div></section></main></div><script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Which condition must a simple polygon satisfy?","o":["It is a closed shape made only of straight line segments","It has at least one curved edge","It must have all sides equal","It must have exactly four vertices"],"a":0,"e":"A polygon is a closed plane figure made from straight line segments.","v":"polygon"},{"d":"BASIC","q":"A polygon with 5 sides is called a…","o":["Hexagon","Pentagon","Heptagon","Octagon"],"a":1,"e":"A pentagon has five sides and five vertices.","v":"pentagon"},{"d":"BASIC","q":"How many sides does a hexagon have?","o":["5","6","7","8"],"a":1,"e":"A hexagon has six sides.","v":"hexagon"},{"d":"BASIC","q":"Which shape is not a polygon?","o":["Triangle","Rectangle","Circle","Pentagon"],"a":2,"e":"A circle has a curved boundary, not straight line segments.","v":"notpolygon"},{"d":"BASIC","q":"In a polygon, what is a vertex?","o":["A corner where two sides meet","The middle of a side","A curved edge","The region outside the shape"],"a":0,"e":"A vertex is the endpoint shared by two neighbouring sides.","v":"polygon"},{"d":"BASIC","q":"A regular polygon has…","o":["Only equal sides","Only equal angles","All sides and all interior angles equal","Exactly six sides"],"a":2,"e":"A regular polygon is both equilateral and equiangular.","v":"regular"},{"d":"BASIC","q":"Which polygon has 8 sides?","o":["Heptagon","Octagon","Nonagon","Decagon"],"a":1,"e":"An octagon has eight sides.","v":"octagon"},{"d":"BASIC","q":"What is a diagonal of a polygon?","o":["A segment joining two non-adjacent vertices","Any side of the polygon","A line that must pass through the centre","A segment joining the midpoints of two sides"],"a":0,"e":"A diagonal joins vertices that are not next to each other.","v":"diagonal"},{"d":"BASIC","q":"A quadrilateral has how many sides?","o":["3","4","5","6"],"a":1,"e":"The prefix quad- means four.","v":"quadrilateral"},{"d":"BASIC","q":"Which description fits a concave polygon?","o":["Every interior angle is less than 90°","At least one part caves inward, giving an interior angle greater than 180°","All sides and angles are equal","It has a curved edge"],"a":1,"e":"A concave polygon has an inward indentation; at least one interior angle exceeds 180°.","v":"concave"},{"d":"MEDIUM","q":"What is the sum of the interior angles of a pentagon?","o":["360°","540°","720°","900°"],"a":1,"e":"For an n-sided polygon, the interior-angle sum is (n − 2) × 180°. For n = 5, it is 540°.","v":"pentagon"},{"d":"MEDIUM","q":"Find the sum of the interior angles of a hexagon.","o":["540°","600°","720°","900°"],"a":2,"e":"(6 − 2) × 180° = 720°.","v":"hexagon"},{"d":"MEDIUM","q":"How many diagonals can be drawn in a quadrilateral?","o":["1","2","3","4"],"a":1,"e":"Each of the four vertices can connect across to one non-adjacent vertex; there are two distinct diagonals.","v":"diagonal"},{"d":"MEDIUM","q":"How many diagonals does a pentagon have?","o":["3","5","7","10"],"a":1,"e":"A polygon with n sides has n(n − 3)/2 diagonals. For n = 5: 5 × 2 ÷ 2 = 5.","v":"pentagon"},{"d":"MEDIUM","q":"A convex polygon has 7 sides. What is its interior-angle sum?","o":["720°","900°","1,080°","1,260°"],"a":1,"e":"(7 − 2) × 180° = 900°.","v":"polygon"},{"d":"MEDIUM","q":"The sum of one exterior angle at each vertex of a convex polygon is…","o":["180°","270°","360°","It depends on the number of sides"],"a":2,"e":"Taking one exterior angle at each vertex makes one complete turn, totalling 360°.","v":"exterior"},{"d":"MEDIUM","q":"Each interior angle of a regular hexagon measures…","o":["90°","108°","120°","135°"],"a":2,"e":"A regular hexagon has interior-angle sum 720°; each of its six equal angles is 720° ÷ 6 = 120°.","v":"regular"},{"d":"MEDIUM","q":"A polygon's interior-angle sum is 1,080°. How many sides does it have?","o":["6","7","8","9"],"a":2,"e":"(n − 2) × 180° = 1,080° gives n − 2 = 6, so n = 8.","v":"polygon"},{"d":"MEDIUM","q":"Which statement about every convex polygon is true?","o":["Both diagonals and sides must be equal","Every interior angle is less than 180°","It must have line symmetry","It must be regular"],"a":1,"e":"In a convex polygon, each interior angle is less than 180°; convex polygons need not be regular or symmetric.","v":"convex"},{"d":"MEDIUM","q":"A regular polygon has each exterior angle equal to 45°. How many sides does it have?","o":["6","8","9","10"],"a":1,"e":"The exterior angles total 360°; 360° ÷ 45° = 8 sides.","v":"exterior"},{"d":"HARD","q":"A polygon has 12 sides. What is the sum of its interior angles?","o":["1,440°","1,620°","1,800°","2,160°"],"a":2,"e":"(12 − 2) × 180° = 1,800°.","v":"polygon"},{"d":"HARD","q":"A convex polygon has 9 sides. How many diagonals does it have?","o":["18","27","54","63"],"a":1,"e":"n(n − 3)/2 = 9 × 6 ÷ 2 = 27 diagonals.","v":"diagonal"},{"d":"HARD","q":"Each interior angle of a regular polygon is 150°. How many sides does it have?","o":["8","10","12","15"],"a":2,"e":"Each exterior angle is 180° − 150° = 30°. The number of sides is 360° ÷ 30° = 12.","v":"regular"},{"d":"HARD","q":"A polygon has an interior-angle sum of 2,340°. How many sides does it have?","o":["13","14","15","16"],"a":2,"e":"(n − 2) × 180° = 2,340°; n − 2 = 13, so n = 15.","v":"polygon"},{"d":"HARD","q":"A regular polygon has 15 sides. What is each exterior angle?","o":["18°","24°","30°","36°"],"a":1,"e":"Each exterior angle of a regular polygon is 360° ÷ 15 = 24°.","v":"exterior"},{"d":"HARD","q":"A convex polygon has 20 diagonals. How many sides does it have?","o":["6","7","8","10"],"a":2,"e":"For n = 8, n(n − 3)/2 = 8 × 5 ÷ 2 = 20 diagonals, so it has 8 sides.","v":"diagonal"},{"d":"HARD","q":"A regular polygon's exterior angle is 24°. Find its interior-angle sum.","o":["2,160°","2,340°","2,520°","2,700°"],"a":1,"e":"It has 360° ÷ 24° = 15 sides; its interior-angle sum is (15 − 2) × 180° = 2,340°.","v":"regular"},{"d":"HARD","q":"A convex polygon has 11 sides. How many triangles can be formed by drawing diagonals from one vertex without crossing?","o":["8","9","10","11"],"a":1,"e":"Drawing diagonals from one vertex partitions an n-sided convex polygon into n − 2 triangles; 11 − 2 = 9.","v":"diagonal"},{"d":"HARD","q":"The interior angles of a pentagon are 100°, 110°, 120°, 130° and x°. Find x.","o":["60°","80°","100°","140°"],"a":1,"e":"A pentagon totals 540°; x = 540° − 460° = 80°.","v":"pentagon"},{"d":"HARD","q":"A regular polygon has 9 sides. What is the measure of each interior angle?","o":["120°","135°","140°","144°"],"a":2,"e":"Its interior-angle sum is (9 − 2) × 180° = 1,260°; each angle is 1,260° ÷ 9 = 140°.","v":"regular"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');const visuals={
polygon:'',
pentagon:'',
hexagon:'',
notpolygon:'',
regular:'',
octagon:'',
diagonal:'',
quadrilateral:'',
concave:'',
exterior:'',
convex:''
};function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));$('percent').textContent=Math.round(p)+'%';}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-letter="'+String.fromCharCode(65+i)+'" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const skills=[];$('content').innerHTML='<div class="end"><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+skills.map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script>
