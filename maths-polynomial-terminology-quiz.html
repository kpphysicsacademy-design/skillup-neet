<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Which expression is a polynomial in x?","o":["3x² − 2x + 1","1/x + 2","√x + 1","x⁻² + 3"],"a":0,"e":"A polynomial has non-negative integer powers of its variable and real coefficients."},{"d":"BASIC","q":"In 5x³ + 2x − 7, what is the variable?","o":["5","x","3","−7"],"a":1,"e":"The letter x is the variable; the numbers are coefficients or constants."},{"d":"BASIC","q":"What is the coefficient of x² in 4x² − 3x + 8?","o":["−3","8","4","2"],"a":2,"e":"The number multiplying x² is 4."},{"d":"BASIC","q":"What is the constant term of 7x³ − 2x + 9?","o":["7","−2","3","9"],"a":3,"e":"The constant term has no variable; it is 9."},{"d":"BASIC","q":"How many terms are in 2x² + 3x − 5?","o":["1","2","3","4"],"a":2,"e":"The terms are 2x², 3x, and −5."},{"d":"BASIC","q":"Which is a monomial?","o":["x + 1","3x²","x² + x + 1","x − 4"],"a":1,"e":"A monomial has exactly one term, such as 3x²."},{"d":"BASIC","q":"Which is a binomial?","o":["5x","x² + 2","x² + x + 1","x − 4"],"a":1,"e":"A binomial has exactly two terms."},{"d":"BASIC","q":"Which is a trinomial?","o":["x + 2","4x²","x² + 2x + 3","9"],"a":2,"e":"A trinomial contains three terms."},{"d":"BASIC","q":"What is the degree of the non-zero constant polynomial 6?","o":["0","1","6","Not defined"],"a":0,"e":"Every non-zero constant polynomial has degree 0."},{"d":"BASIC","q":"Which expression is not a polynomial in x?","o":["x³ + 1","2x² − x","4/x + 1","7x − 3"],"a":2,"e":"4/x = 4x⁻¹ has a negative exponent, so it is not a polynomial."},{"d":"MEDIUM","q":"What is the degree of 6x⁴ − 3x² + x − 8?","o":["2","3","4","6"],"a":2,"e":"The highest power of x with a non-zero coefficient is 4."},{"d":"MEDIUM","q":"What is the coefficient of x in −5x³ + 7x − 2?","o":["−5","7","−2","3"],"a":1,"e":"The x-term is 7x, so its coefficient is 7."},{"d":"MEDIUM","q":"Which is a polynomial in two variables x and y?","o":["x² + 3xy + y²","1/x + y","√x + y","y⁻¹ + x"],"a":0,"e":"All variable exponents in x² + 3xy + y² are non-negative integers."},{"d":"MEDIUM","q":"What is the degree of 4x³y² + 2xy − 1?","o":["2","3","5","6"],"a":2,"e":"The total degree of x³y² is 3 + 2 = 5, the largest total degree."},{"d":"MEDIUM","q":"Which term is the constant term in 9x⁴ − 6x² + 11x − 4?","o":["9x⁴","−6x²","11x","−4"],"a":3,"e":"The term −4 contains no variable."},{"d":"MEDIUM","q":"If p(x) = 2x² − 3x + 1, what is the coefficient of x²?","o":["1","−3","2","0"],"a":2,"e":"The coefficient multiplying x² is 2."},{"d":"MEDIUM","q":"Which polynomial has degree 1?","o":["x² + 1","5x − 2","x³ − x","8"],"a":1,"e":"The highest exponent in 5x − 2 is 1."},{"d":"MEDIUM","q":"How many terms are in 3a²b − 4ab² + 7?","o":["1","2","3","4"],"a":2,"e":"The expression has three terms separated by plus or minus signs."},{"d":"MEDIUM","q":"Which is a quadratic polynomial in x?","o":["x³ + 1","2x² − 5x + 6","4x − 1","7"],"a":1,"e":"A quadratic polynomial has degree 2."},{"d":"MEDIUM","q":"Which expression is a cubic polynomial?","o":["x² + 2","4x³ − x + 9","5x − 2","3"],"a":1,"e":"The highest power in 4x³ − x + 9 is 3."},{"d":"HARD","q":"What is the degree of 7x⁵ − 2x⁵ + 3x²?","o":["2","3","5","7"],"a":2,"e":"Combine like terms to get 5x⁵ + 3x²; the degree is 5."},{"d":"HARD","q":"For p(x) = 3x⁴ − x² + 6, what is p(0)?","o":["0","3","6","−1"],"a":2,"e":"Substituting x = 0 leaves only the constant term, 6."},{"d":"HARD","q":"Which polynomial has degree 0?","o":["x","−12","x⁻¹","√x"],"a":1,"e":"A non-zero constant such as −12 has degree 0."},{"d":"HARD","q":"What is the degree of 2x²y³ + 5xy⁴ − 8?","o":["4","5","6","7"],"a":1,"e":"The term degrees are 2+3=5 and 1+4=5; the polynomial degree is 5."},{"d":"HARD","q":"Which statement about the zero polynomial is correct?","o":["Its degree is always 0","Its degree is not defined","Its degree is 1","It has exactly one zero"],"a":1,"e":"The zero polynomial has all coefficients zero, so its degree is not defined."},{"d":"HARD","q":"If p(x) = ax² + 3x + 1 is quadratic, which condition must hold?","o":["a = 0","a ≠ 0","a = 1 only","a < 0"],"a":1,"e":"If a were zero, the x² term would disappear and the degree would be at most 1."},{"d":"HARD","q":"What is the degree of (x² + 1)(x³ − 2)?","o":["2","3","5","6"],"a":2,"e":"The leading terms multiply to x⁵, so the product has degree 2 + 3 = 5."},{"d":"HARD","q":"Which expression has degree 4 in x?","o":["x² + x²","3x⁴ − 1","x³ + x","2x − 4"],"a":1,"e":"The highest power in 3x⁴ − 1 is 4."},{"d":"HARD","q":"A polynomial has terms 4x⁶, −x³ and 2. What is its degree?","o":["2","3","6","9"],"a":2,"e":"The highest exponent with a non-zero coefficient is 6."},{"d":"HARD","q":"If p(x) = 2x³ − 5x + 4, what is the constant term?","o":["2","−5","3","4"],"a":3,"e":"The constant term is the term without x, which is 4."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Identify polynomial terms</strong><small>Recognise variables, coefficients, and constants</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Classify polynomials</strong><small>Distinguish monomials, binomials, and trinomials</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Find polynomial degree</strong><small>Determine degree and constant terms</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
