<main>
<section class="hero">
<h1>Polynomial Terminology</h1>
<p class="muted">Learn to identify polynomial terms, variables, coefficients, constants and degree, and classify polynomials by terms and degree.</p>
<div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div>
<div class="track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
</section>
<section class="quiz" id="quiz">
<div class="qmeta" id="qmeta">QUESTION 1</div>
<h2 class="question" id="question">Polynomial terminology mastered!</h2>
<div class="options" id="options"></div>
<div class="feedback" id="feedback" aria-live="polite"></div>
<div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div>
</section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"Which expression is a polynomial in x?","o":["3x² − 2x + 1","1/x + 2","√x + 1","x⁻² + 3"],"a":0,"why":"A polynomial has non-negative integer powers of its variable and real coefficients."},{"d":"BASIC","q":"In 5x³ + 2x − 7, what is the variable?","o":["5","x","3","−7"],"a":1,"why":"The letter x is the variable; the numbers are coefficients or constants."},{"d":"BASIC","q":"What is the coefficient of x² in 4x² − 3x + 8?","o":["−3","8","4","2"],"a":2,"why":"The number multiplying x² is 4."},{"d":"BASIC","q":"What is the constant term of 7x³ − 2x + 9?","o":["7","−2","3","9"],"a":3,"why":"The constant term has no variable; it is 9."},{"d":"BASIC","q":"How many terms are in 2x² + 3x − 5?","o":["1","2","3","4"],"a":2,"why":"The terms are 2x², 3x, and −5."},{"d":"BASIC","q":"Which is a monomial?","o":["x + 1","3x²","x² + x + 1","x − 4"],"a":1,"why":"A monomial has exactly one term, such as 3x²."},{"d":"BASIC","q":"Which is a binomial?","o":["5x","x² + 2","x² + x + 1","x − 4"],"a":1,"why":"A binomial has exactly two terms."},{"d":"BASIC","q":"Which is a trinomial?","o":["x + 2","4x²","x² + 2x + 3","9"],"a":2,"why":"A trinomial contains three terms."},{"d":"BASIC","q":"What is the degree of the non-zero constant polynomial 6?","o":["0","1","6","Not defined"],"a":0,"why":"Every non-zero constant polynomial has degree 0."},{"d":"BASIC","q":"Which expression is not a polynomial in x?","o":["x³ + 1","2x² − x","4/x + 1","7x − 3"],"a":2,"why":"4/x = 4x⁻¹ has a negative exponent, so it is not a polynomial."},{"d":"MEDIUM","q":"What is the degree of 6x⁴ − 3x² + x − 8?","o":["2","3","4","6"],"a":2,"why":"The highest power of x with a non-zero coefficient is 4."},{"d":"MEDIUM","q":"What is the coefficient of x in −5x³ + 7x − 2?","o":["−5","7","−2","3"],"a":1,"why":"The x-term is 7x, so its coefficient is 7."},{"d":"MEDIUM","q":"Which is a polynomial in two variables x and y?","o":["x² + 3xy + y²","1/x + y","√x + y","y⁻¹ + x"],"a":0,"why":"All variable exponents in x² + 3xy + y² are non-negative integers."},{"d":"MEDIUM","q":"What is the degree of 4x³y² + 2xy − 1?","o":["2","3","5","6"],"a":2,"why":"The total degree of x³y² is 3 + 2 = 5, the largest total degree."},{"d":"MEDIUM","q":"Which term is the constant term in 9x⁴ − 6x² + 11x − 4?","o":["9x⁴","−6x²","11x","−4"],"a":3,"why":"The term −4 contains no variable."},{"d":"MEDIUM","q":"If p(x) = 2x² − 3x + 1, what is the coefficient of x²?","o":["1","−3","2","0"],"a":2,"why":"The coefficient multiplying x² is 2."},{"d":"MEDIUM","q":"Which polynomial has degree 1?","o":["x² + 1","5x − 2","x³ − x","8"],"a":1,"why":"The highest exponent in 5x − 2 is 1."},{"d":"MEDIUM","q":"How many terms are in 3a²b − 4ab² + 7?","o":["1","2","3","4"],"a":2,"why":"The expression has three terms separated by plus or minus signs."},{"d":"MEDIUM","q":"Which is a quadratic polynomial in x?","o":["x³ + 1","2x² − 5x + 6","4x − 1","7"],"a":1,"why":"A quadratic polynomial has degree 2."},{"d":"MEDIUM","q":"Which expression is a cubic polynomial?","o":["x² + 2","4x³ − x + 9","5x − 2","3"],"a":1,"why":"The highest power in 4x³ − x + 9 is 3."},{"d":"HARD","q":"What is the degree of 7x⁵ − 2x⁵ + 3x²?","o":["2","3","5","7"],"a":2,"why":"Combine like terms to get 5x⁵ + 3x²; the degree is 5."},{"d":"HARD","q":"For p(x) = 3x⁴ − x² + 6, what is p(0)?","o":["0","3","6","−1"],"a":2,"why":"Substituting x = 0 leaves only the constant term, 6."},{"d":"HARD","q":"Which polynomial has degree 0?","o":["x","−12","x⁻¹","√x"],"a":1,"why":"A non-zero constant such as −12 has degree 0."},{"d":"HARD","q":"What is the degree of 2x²y³ + 5xy⁴ − 8?","o":["4","5","6","7"],"a":1,"why":"The term degrees are 2+3=5 and 1+4=5; the polynomial degree is 5."},{"d":"HARD","q":"Which statement about the zero polynomial is correct?","o":["Its degree is always 0","Its degree is not defined","Its degree is 1","It has exactly one zero"],"a":1,"why":"The zero polynomial has all coefficients zero, so its degree is not defined."},{"d":"HARD","q":"If p(x) = ax² + 3x + 1 is quadratic, which condition must hold?","o":["a = 0","a ≠ 0","a = 1 only","a < 0"],"a":1,"why":"If a were zero, the x² term would disappear and the degree would be at most 1."},{"d":"HARD","q":"What is the degree of (x² + 1)(x³ − 2)?","o":["2","3","5","6"],"a":2,"why":"The leading terms multiply to x⁵, so the product has degree 2 + 3 = 5."},{"d":"HARD","q":"Which expression has degree 4 in x?","o":["x² + x²","3x⁴ − 1","x³ + x","2x − 4"],"a":1,"why":"The highest power in 3x⁴ − 1 is 4."},{"d":"HARD","q":"A polynomial has terms 4x⁶, −x³ and 2. What is its degree?","o":["2","3","6","9"],"a":2,"why":"The highest exponent with a non-zero coefficient is 6."},{"d":"HARD","q":"If p(x) = 2x³ − 5x + 4, what is the constant term?","o":["2","−5","3","4"],"a":3,"why":"The constant term is the term without x, which is 4."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Polynomial Terminology Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
