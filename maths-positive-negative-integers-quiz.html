<main><section class="hero"><h1>Positive &amp; Negative Integers</h1><p>Explore integers on a number line, compare values, and practise addition and subtraction in everyday situations.</p><a class="sim" href="maths-positive-negative-integers-simulator.html?v=20261111-positive-negative-integers-simulator-v1">↔ Open Integers Simulator</a></section>

<script>
(function(){'use strict';
const questions=[{"d":"BASIC","q":"Which integer represents 5 steps to the left of 0 on a number line?","o":["−5","5","0","−4"],"a":0,"e":"Moving left from zero gives negative integers; five steps left lands at −5.","v":"numberline"},{"d":"BASIC","q":"Which number is a positive integer?","o":["−8","0","12","−3"],"a":2,"e":"Positive integers are whole numbers greater than zero.","v":"numberline"},{"d":"BASIC","q":"Which number is neither positive nor negative?","o":["−1","0","1","10"],"a":1,"e":"Zero is neither positive nor negative.","v":"zero"},{"d":"BASIC","q":"On a thermometer, which temperature is below 0°C?","o":["4°C","0°C","−6°C","8°C"],"a":2,"e":"A negative temperature is below zero on the thermometer.","v":"thermometer"},{"d":"BASIC","q":"Which integer is the greatest?","o":["−7","−2","−10","−4"],"a":1,"e":"Among negative integers, the one closer to zero is greater.","v":"compare"},{"d":"BASIC","q":"Which integer is the smallest?","o":["3","−1","−8","0"],"a":2,"e":"The farther left an integer lies on the number line, the smaller it is.","v":"compare"},{"d":"BASIC","q":"What is the opposite of −9?","o":["−9","0","9","1"],"a":2,"e":"Opposite integers are equally far from zero on opposite sides.","v":"opposite"},{"d":"BASIC","q":"Which pair are opposites?","o":["−4 and 4","−4 and 3","0 and 4","−2 and −2"],"a":0,"e":"−4 and 4 are the same distance from zero on opposite sides.","v":"opposite"},{"d":"BASIC","q":"A lift is on floor 2 and goes down 5 floors. Which integer gives its new floor, if ground is 0 and basement floors are negative?","o":["7","−3","3","−7"],"a":1,"e":"Starting at +2 and moving down five floors gives 2 − 5 = −3.","v":"elevator"},{"d":"BASIC","q":"Which statement is true?","o":["−6 > −2","−3 < 1","0 < −4","−1 > 2"],"a":1,"e":"Every negative integer is less than every positive integer.","v":"compare"},{"d":"MEDIUM","q":"Calculate −4 + 7.","o":["−11","−3","3","11"],"a":2,"e":"Start at −4 and move 7 steps right to reach 3.","v":"add"},{"d":"MEDIUM","q":"Calculate 5 + (−8).","o":["13","−13","−3","3"],"a":2,"e":"Adding −8 means moving 8 steps left from 5: the result is −3.","v":"add"},{"d":"MEDIUM","q":"Calculate −6 + (−3).","o":["−9","−3","3","9"],"a":0,"e":"Adding two negative integers adds their magnitudes and keeps the negative sign.","v":"add"},{"d":"MEDIUM","q":"Calculate 9 − 13.","o":["4","−4","22","−22"],"a":1,"e":"9 − 13 = 9 + (−13) = −4.","v":"subtract"},{"d":"MEDIUM","q":"Calculate −7 − 4.","o":["−3","3","−11","11"],"a":2,"e":"Subtracting 4 from −7 moves four more steps left: −11.","v":"subtract"},{"d":"MEDIUM","q":"Calculate −5 − (−2).","o":["−7","−3","3","7"],"a":1,"e":"Subtracting a negative is adding its opposite: −5 + 2 = −3.","v":"subtract"},{"d":"MEDIUM","q":"Which expression equals −2?","o":["−5 + 3","−5 − 3","5 − 3","−5 + 2"],"a":0,"e":"−5 + 3 = −2; the other expressions give −8, 2 and −3.","v":"add"},{"d":"MEDIUM","q":"The temperature is −3°C and rises by 8°C. What is the new temperature?","o":["−11°C","−5°C","5°C","11°C"],"a":2,"e":"−3 + 8 = 5°C.","v":"thermometer"},{"d":"MEDIUM","q":"Arrange −2, 4, −6, 0 from smallest to greatest.","o":["−6, −2, 0, 4","−2, −6, 0, 4","4, 0, −2, −6","−6, 0, −2, 4"],"a":0,"e":"Left to right on the number line gives −6 < −2 < 0 < 4.","v":"compare"},{"d":"MEDIUM","q":"A diver is at −12 m and rises 5 m. At what height is the diver now?","o":["−17 m","−7 m","7 m","17 m"],"a":1,"e":"Rising 5 m means add 5: −12 + 5 = −7 m.","v":"diver"},{"d":"HARD","q":"Evaluate −8 + 15 − 6.","o":["1","−1","13","−29"],"a":0,"e":"−8 + 15 = 7, then 7 − 6 = 1.","v":"add"},{"d":"HARD","q":"The temperature at dawn is −7°C. It rises 11°C and then falls 9°C. What is the final temperature?","o":["−5°C","−3°C","3°C","5°C"],"a":0,"e":"−7 + 11 − 9 = 4 − 9 = −5°C.","v":"thermometer"},{"d":"HARD","q":"A lift starts at floor −2, rises 7 floors, then descends 4 floors. Where does it finish?","o":["−1","1","3","5"],"a":1,"e":"−2 + 7 − 4 = 5 − 4 = 1.","v":"elevator"},{"d":"HARD","q":"Which value makes −9 + □ = −2?","o":["−11","−7","7","11"],"a":2,"e":"Add 7 to −9 to reach −2.","v":"numberline"},{"d":"HARD","q":"Calculate −14 − (−9) + 3.","o":["−20","−8","−2","8"],"a":2,"e":"−14 + 9 + 3 = −5 + 3 = −2.","v":"subtract"},{"d":"HARD","q":"A bank balance is −₹120. A deposit of ₹200 is made, then ₹95 is withdrawn. What is the balance?","o":["−₹415","−₹15","₹15","₹175"],"a":1,"e":"−120 + 200 − 95 = 80 − 95 = −₹15.","v":"money"},{"d":"HARD","q":"Which expression has the greatest value?","o":["−4 + 1","−2 − 3","−8 + 5","−1 − 1"],"a":3,"e":"The values are −3, −5, −3 and −2; −2 is greatest.","v":"compare"},{"d":"HARD","q":"Starting at −6, a token moves 4 units right, 9 units left, then 3 units right. Where does it end?","o":["−8","−2","0","10"],"a":0,"e":"−6 + 4 − 9 + 3 = −2 − 9 + 3 = −8.","v":"numberline"},{"d":"HARD","q":"Find the missing integer: □ − 6 = −10.","o":["−16","−4","4","16"],"a":1,"e":"Add 6 to both sides: □ = −10 + 6 = −4.","v":"subtract"},{"d":"HARD","q":"A hiker is 35 m below a reference level (−35 m), climbs 18 m, then descends 12 m. What is the final position?","o":["−65 m","−29 m","−5 m","5 m"],"a":1,"e":"−35 + 18 − 12 = −17 − 12 = −29 m.","v":"diver"}];
let index=0,selected=-1,locked=false,finished=false,xp=0,streak=0,bestStreak=0,correct=0;
const el=id=>document.getElementById(id);
function progress(){const p=Math.round(index/questions.length*100);el('fill').style.width=p+'%';el('percent').textContent=p+'%';el('progressText').textContent='QUESTION '+Math.min(index+1,questions.length)+' OF '+questions.length;}
function render(){const q=questions[index];selected=-1;locked=false;el('level').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);el('question').textContent=q.q;el('choices').innerHTML=q.o.map((v,i)=>'<button type="button" class="choice" data-letter="'+String.fromCharCode(65+i)+'" data-index="'+i+'">'+v+'</button>').join('');el('choices').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.index);el('choices').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));el('action').disabled=false;}));el('feedback').className='feedback';el('feedback').textContent='';el('hint').textContent='Choose one answer';el('action').textContent='Check answer';el('action').disabled=true;progress();}
function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;streak++;bestStreak=Math.max(bestStreak,streak);}else streak=0;el('xp').textContent='⭐ '+xp+' XP';el('streak').textContent='🔥 '+streak+' streak';el('choices').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});el('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;el('feedback').className='feedback show '+(good?'good':'bad');el('hint').textContent=good?'+10 XP':'Keep practising';el('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();}else results();}
function results(){finished=true;el('fill').style.width='100%';el('percent').textContent='100%';el('progressText').textContent='QUIZ COMPLETE';el('level').textContent='Practice complete';el('question').innerHTML='<div class="finish"><div style="font-size:42px">➖</div><h2>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h2><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><a class="sim" href="maths-positive-negative-integers-simulator.html?v=20261111-positive-negative-integers-simulator-v1">Explore the simulator →</a><div class="summary">⭐ '+xp+' XP earned<br>🔥 Best streak: '+bestStreak+'</div></div>' ;el('choices').innerHTML='';el('feedback').className='feedback';el('hint').textContent='You can retry anytime';el('action').textContent='Try again ↻';el('action').disabled=false;}
function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;streak=0;bestStreak=0;correct=0;el('xp').textContent='⭐ 0 XP';el('streak').textContent='🔥 0 streak';render();}
el('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();
})();
</script></body></html>
