ce-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
 .skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}.skills-result{margin-top:14px;text-align:left}.skills-result h3{margin:0 0 8px;font-size:1rem}.skills-result .skill-item{margin-top:7px}.skill-item.unlocked{border-color:var(--green);color:var(--green2);background:#174b42} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}.diagram .accent{stroke:#58d6a3}.diagram .blue{stroke:#91b7ff}.diagram .gold{stroke:#ffd27a}.skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}.skills-result{margin-top:14px;text-align:left}.skills-result h3{margin:0 0 8px;font-size:1rem}.skills-result .skill-item{margin-top:7px}.skill-item.unlocked{border-color:var(--green);color:var(--green2);background:#174b42}</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Positive and negative integers</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Positive and negative integers skills"><div class="skill-title">🎯 Integer Skills</div><div class="skill-list"><div class="skill-item">Locate positive and negative integers</div><div class="skill-item">Compare and order integers on a number line</div><div class="skill-item">Add and subtract integers in real-life situations</div></div></section></div><script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Which integer represents 5 steps to the left of 0 on a number line?","o":["−5","5","0","−4"],"a":0,"e":"Moving left from zero gives negative integers; five steps left lands at −5.","v":"numberline"},{"d":"BASIC","q":"Which number is a positive integer?","o":["−8","0","12","−3"],"a":2,"e":"Positive integers are whole numbers greater than zero.","v":"numberline"},{"d":"BASIC","q":"Which number is neither positive nor negative?","o":["−1","0","1","10"],"a":1,"e":"Zero is neither positive nor negative.","v":"zero"},{"d":"BASIC","q":"On a thermometer, which temperature is below 0°C?","o":["4°C","0°C","−6°C","8°C"],"a":2,"e":"A negative temperature is below zero on the thermometer.","v":"thermometer"},{"d":"BASIC","q":"Which integer is the greatest?","o":["−7","−2","−10","−4"],"a":1,"e":"Among negative integers, the one closer to zero is greater.","v":"compare"},{"d":"BASIC","q":"Which integer is the smallest?","o":["3","−1","−8","0"],"a":2,"e":"The farther left an integer lies on the number line, the smaller it is.","v":"compare"},{"d":"BASIC","q":"What is the opposite of −9?","o":["−9","0","9","1"],"a":2,"e":"Opposite integers are equally far from zero on opposite sides.","v":"opposite"},{"d":"BASIC","q":"Which pair are opposites?","o":["−4 and 4","−4 and 3","0 and 4","−2 and −2"],"a":0,"e":"−4 and 4 are the same distance from zero on opposite sides.","v":"opposite"},{"d":"BASIC","q":"A lift is on floor 2 and goes down 5 floors. Which integer gives its new floor, if ground is 0 and basement floors are negative?","o":["7","−3","3","−7"],"a":1,"e":"Starting at +2 and moving down five floors gives 2 − 5 = −3.","v":"elevator"},{"d":"BASIC","q":"Which statement is true?","o":["−6 > −2","−3 < 1","0 < −4","−1 > 2"],"a":1,"e":"Every negative integer is less than every positive integer.","v":"compare"},{"d":"MEDIUM","q":"Calculate −4 + 7.","o":["−11","−3","3","11"],"a":2,"e":"Start at −4 and move 7 steps right to reach 3.","v":"add"},{"d":"MEDIUM","q":"Calculate 5 + (−8).","o":["13","−13","−3","3"],"a":2,"e":"Adding −8 means moving 8 steps left from 5: the result is −3.","v":"add"},{"d":"MEDIUM","q":"Calculate −6 + (−3).","o":["−9","−3","3","9"],"a":0,"e":"Adding two negative integers adds their magnitudes and keeps the negative sign.","v":"add"},{"d":"MEDIUM","q":"Calculate 9 − 13.","o":["4","−4","22","−22"],"a":1,"e":"9 − 13 = 9 + (−13) = −4.","v":"subtract"},{"d":"MEDIUM","q":"Calculate −7 − 4.","o":["−3","3","−11","11"],"a":2,"e":"Subtracting 4 from −7 moves four more steps left: −11.","v":"subtract"},{"d":"MEDIUM","q":"Calculate −5 − (−2).","o":["−7","−3","3","7"],"a":1,"e":"Subtracting a negative is adding its opposite: −5 + 2 = −3.","v":"subtract"},{"d":"MEDIUM","q":"Which expression equals −2?","o":["−5 + 3","−5 − 3","5 − 3","−5 + 2"],"a":0,"e":"−5 + 3 = −2; the other expressions give −8, 2 and −3.","v":"add"},{"d":"MEDIUM","q":"The temperature is −3°C and rises by 8°C. What is the new temperature?","o":["−11°C","−5°C","5°C","11°C"],"a":2,"e":"−3 + 8 = 5°C.","v":"thermometer"},{"d":"MEDIUM","q":"Arrange −2, 4, −6, 0 from smallest to greatest.","o":["−6, −2, 0, 4","−2, −6, 0, 4","4, 0, −2, −6","−6, 0, −2, 4"],"a":0,"e":"Left to right on the number line gives −6 < −2 < 0 < 4.","v":"compare"},{"d":"MEDIUM","q":"A diver is at −12 m and rises 5 m. At what height is the diver now?","o":["−17 m","−7 m","7 m","17 m"],"a":1,"e":"Rising 5 m means add 5: −12 + 5 = −7 m.","v":"diver"},{"d":"HARD","q":"Evaluate −8 + 15 − 6.","o":["1","−1","13","−29"],"a":0,"e":"−8 + 15 = 7, then 7 − 6 = 1.","v":"add"},{"d":"HARD","q":"The temperature at dawn is −7°C. It rises 11°C and then falls 9°C. What is the final temperature?","o":["−5°C","−3°C","3°C","5°C"],"a":0,"e":"−7 + 11 − 9 = 4 − 9 = −5°C.","v":"thermometer"},{"d":"HARD","q":"A lift starts at floor −2, rises 7 floors, then descends 4 floors. Where does it finish?","o":["−1","1","3","5"],"a":1,"e":"−2 + 7 − 4 = 5 − 4 = 1.","v":"elevator"},{"d":"HARD","q":"Which value makes −9 + □ = −2?","o":["−11","−7","7","11"],"a":2,"e":"Add 7 to −9 to reach −2.","v":"numberline"},{"d":"HARD","q":"Calculate −14 − (−9) + 3.","o":["−20","−8","−2","8"],"a":2,"e":"−14 + 9 + 3 = −5 + 3 = −2.","v":"subtract"},{"d":"HARD","q":"A bank balance is −₹120. A deposit of ₹200 is made, then ₹95 is withdrawn. What is the balance?","o":["−₹415","−₹15","₹15","₹175"],"a":1,"e":"−120 + 200 − 95 = 80 − 95 = −₹15.","v":"money"},{"d":"HARD","q":"Which expression has the greatest value?","o":["−4 + 1","−2 − 3","−8 + 5","−1 − 1"],"a":3,"e":"The values are −3, −5, −3 and −2; −2 is greatest.","v":"compare"},{"d":"HARD","q":"Starting at −6, a token moves 4 units right, 9 units left, then 3 units right. Where does it end?","o":["−8","−2","0","10"],"a":0,"e":"−6 + 4 − 9 + 3 = −2 − 9 + 3 = −8.","v":"numberline"},{"d":"HARD","q":"Find the missing integer: □ − 6 = −10.","o":["−16","−4","4","16"],"a":1,"e":"Add 6 to both sides: □ = −10 + 6 = −4.","v":"subtract"},{"d":"HARD","q":"A hiker is 35 m below a reference level (−35 m), climbs 18 m, then descends 12 m. What is the final position?","o":["−65 m","−29 m","−5 m","5 m"],"a":1,"e":"−35 + 18 − 12 = −17 − 12 = −29 m.","v":"diver"}];let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');const visuals={
numberline:'<svg viewBox="0 0 320 100" role="img" aria-label="Integer number line"><path d="M20 52 H300 M20 52 L30 46 M20 52 L30 58 M300 52 L290 46 M300 52 L290 58" stroke="#91b7ff" stroke-width="2" fill="none"/>'+Array.from({length:9},(_,i)=>{const x=40+i*30;return '<path d="M'+x+' 45 V59" stroke="#91b7ff" stroke-width="2"/><text x="'+x+'" y="78" fill="#f2f5ff" text-anchor="middle" font-size="12">'+(i-4)+'</text>'}).join('')+'</svg>',
zero:'<svg viewBox="0 0 300 100" role="img" aria-label="Zero separates negative and positive integers"><path d="M20 45 H280" stroke="#91b7ff" stroke-width="2"/><path d="M150 35 V55" stroke="#58d6a3" stroke-width="3"/><text x="70" y="30" fill="#ff9eaa" text-anchor="middle">Negative</text><text x="150" y="75" fill="#58d6a3" text-anchor="middle">0</text><text x="230" y="30" fill="#91b7ff" text-anchor="middle">Positive</text></svg>',
thermometer:'<svg viewBox="0 0 300 120" role="img" aria-label="Thermometer showing temperatures above and below zero"><rect x="140" y="12" width="20" height="82" rx="10" fill="none" stroke="#91b7ff" stroke-width="3"/><circle cx="150" cy="98" r="15" fill="#ff9eaa"/><path d="M150 50 V98" stroke="#ff9eaa" stroke-width="8"/><path d="M166 40 H182 M166 60 H178 M166 80 H182" stroke="#91b7ff" stroke-width="2"/><text x="190" y="44" fill="#f2f5ff">0°C</text><text x="190" y="85" fill="#ff9eaa">Below 0</text></svg>',
compare:'<svg viewBox="0 0 320 100" role="img" aria-label="Compare integers on a number line"><path d="M20 48 H300" stroke="#91b7ff" stroke-width="2"/>'+[-8,-6,-4,-2,0,2,4,6,8].map((n,i)=>'<path d="M'+(24+i*34)+' 41 V55" stroke="#91b7ff" stroke-width="2"/><text x="'+(24+i*34)+'" y="75" fill="#f2f5ff" font-size="12" text-anchor="middle">'+n+'</text>').join('')+'</svg>',
opposite:'<svg viewBox="0 0 300 100" role="img" aria-label="Opposite integers at equal distances from zero"><path d="M25 48 H275" stroke="#91b7ff" stroke-width="2"/><path d="M75 40 V56 M150 36 V60 M225 40 V56" stroke="#58d6a3" stroke-width="3"/><text x="75" y="77" fill="#f2f5ff" text-anchor="middle">−4</text><text x="150" y="77" fill="#f2f5ff" text-anchor="middle">0</text><text x="225" y="77" fill="#f2f5ff" text-anchor="middle">+4</text></svg>',
elevator:'<svg viewBox="0 0 300 120" role="img" aria-label="Elevator floors above and below ground"><rect x="120" y="10" width="60" height="100" rx="8" fill="#91b7ff18" stroke="#91b7ff" stroke-width="2"/>'+['+2','+1','0','−1','−2'].map((s,i)=>'<text x="150" y="'+(28+i*19)+'" fill="'+(i===2?'#58d6a3':'#f2f5ff')+'" text-anchor="middle">'+s+'</text>').join('')+'</svg>',
add:'<svg viewBox="0 0 300 100" role="img" aria-label="Moving right adds positive integers"><path d="M20 52 H280" stroke="#91b7ff" stroke-width="2"/><path d="M110 38 L170 38 L160 30 M170 38 L160 46" stroke="#58d6a3" stroke-width="3" fill="none"/><text x="110" y="72" fill="#f2f5ff" text-anchor="middle">Start</text><text x="190" y="72" fill="#58d6a3" text-anchor="middle">Move right</text></svg>',
subtract:'<svg viewBox="0 0 300 100" role="img" aria-label="Moving left subtracts positive integers"><path d="M20 52 H280" stroke="#91b7ff" stroke-width="2"/><path d="M190 38 L130 38 L140 30 M130 38 L140 46" stroke="#ff9eaa" stroke-width="3" fill="none"/><text x="190" y="72" fill="#f2f5ff" text-anchor="middle">Start</text><text x="110" y="72" fill="#ff9eaa" text-anchor="middle">Move left</text></svg>',
diver:'<svg viewBox="0 0 300 120" role="img" aria-label="Diver below sea level"><path d="M15 35 Q35 28 55 35 T95 35 T135 35 T175 35 T215 35 T255 35 T295 35" stroke="#91b7ff" stroke-width="3" fill="none"/><path d="M15 45 H295 V115 H15 Z" fill="#91b7ff18"/><circle cx="150" cy="69" r="9" fill="#58d6a3"/><path d="M150 78 L140 95 L125 100 M150 78 L165 92 L180 92 M145 84 L125 80 M155 84 L175 78" stroke="#58d6a3" stroke-width="4" fill="none"/><text x="180" y="62" fill="#f2f5ff">Below 0 m</text></svg>',
money:'<svg viewBox="0 0 300 100" role="img" aria-label="Account balance can be negative or positive"><rect x="48" y="18" width="204" height="64" rx="12" fill="#58d6a318" stroke="#58d6a3" stroke-width="2"/><text x="150" y="44" fill="#f2f5ff" text-anchor="middle">Account balance</text><text x="150" y="68" fill="#ff9eaa" text-anchor="middle">−₹120</text></svg>'
};function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'<div class="diagram">'+visuals[q.v]+'</div>':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const skills=[['Classify acute, right, obtuse and reflex angles',8],['Measure angles using a protractor',18],['Solve complementary and supplementary angle problems',24]];$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">📏</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+skills.map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(index>=questions.length){restart();return;}act();});render();})();</script></body></html>
