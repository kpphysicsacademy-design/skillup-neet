<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Which fraction represents a negative rational number?","o":["3/5","−3/5","0/5","5/3"],"a":1,"e":"A negative sign makes the non-zero fraction negative.","v":"positive-negative-rationals"},{"d":"BASIC","q":"Which number is a positive rational number?","o":["−7/4","−2","5/8","−0.3"],"a":2,"e":"5/8 is greater than zero and is a ratio of integers.","v":"positive-negative-rationals"},{"d":"BASIC","q":"Which number lies to the left of zero on the number line?","o":["2/7","4","−1/3","0"],"a":2,"e":"Negative numbers lie to the left of zero.","v":"positive-negative-rationals"},{"d":"BASIC","q":"Which rational number is equal to −4/9?","o":["4/9","−8/18","8/9","−4/18"],"a":1,"e":"Multiplying numerator and denominator by 2 gives −8/18.","v":"positive-negative-rationals"},{"d":"BASIC","q":"What is the additive inverse of 7/11?","o":["7/11","−7/11","11/7","0"],"a":1,"e":"A number and its additive inverse sum to zero.","v":"positive-negative-rationals"},{"d":"BASIC","q":"Which is greater: −2/5 or −1/5?","o":["−2/5","−1/5","They are equal","Cannot be compared"],"a":1,"e":"Among negative fractions with the same denominator, the one closer to zero is greater.","v":"positive-negative-rationals"},{"d":"BASIC","q":"Which rational number is equivalent to 3/4?","o":["6/8","6/7","9/16","3/8"],"a":0,"e":"Multiplying numerator and denominator of 3/4 by 2 gives 6/8.","v":"positive-negative-rationals"},{"d":"BASIC","q":"Which fraction is in standard form?","o":["6/8","−10/15","7/9","12/18"],"a":2,"e":"7/9 has coprime numerator and denominator and a positive denominator.","v":"positive-negative-rationals"},{"d":"BASIC","q":"What is the sign of (−2/3) × (5/7)?","o":["Positive","Negative","Zero","Undefined"],"a":1,"e":"A negative factor times a positive factor gives a negative product.","v":"positive-negative-rationals"},{"d":"BASIC","q":"What is the sign of (−3/8) ÷ (−2/5)?","o":["Positive","Negative","Zero","Undefined"],"a":0,"e":"Dividing two negative non-zero numbers gives a positive quotient.","v":"positive-negative-rationals"},{"d":"MEDIUM","q":"Calculate 2/7 + 3/7.","o":["5/7","5/14","1/7","6/7"],"a":0,"e":"The denominators match, so add numerators: (2 + 3)/7 = 5/7.","v":"positive-negative-rationals"},{"d":"MEDIUM","q":"Calculate −5/9 + 2/9.","o":["−7/9","−3/9","3/9","7/9"],"a":1,"e":"Add numerators: (−5 + 2)/9 = −3/9.","v":"positive-negative-rationals"},{"d":"MEDIUM","q":"Calculate 3/4 − 1/2.","o":["1/4","1/2","2/4","−1/4"],"a":0,"e":"Convert 1/2 to 2/4, then 3/4 − 2/4 = 1/4.","v":"positive-negative-rationals"},{"d":"MEDIUM","q":"Calculate (−2/3) × (3/5).","o":["−2/5","2/5","−6/8","6/5"],"a":0,"e":"Multiply and simplify: (−2 × 3)/(3 × 5) = −2/5.","v":"positive-negative-rationals"},{"d":"MEDIUM","q":"Calculate (4/9) ÷ (2/3).","o":["2/3","8/27","6/9","3/2"],"a":0,"e":"Divide by multiplying by the reciprocal: 4/9 × 3/2 = 2/3.","v":"positive-negative-rationals"},{"d":"MEDIUM","q":"Which is the greatest number?","o":["−3/4","−2/3","−5/6","−1/2"],"a":3,"e":"Among these negative values, −1/2 is closest to zero.","v":"positive-negative-rationals"},{"d":"MEDIUM","q":"Write −18/24 in standard form.","o":["−3/4","3/4","−9/12","−6/8"],"a":0,"e":"Divide numerator and denominator by 6 to obtain −3/4.","v":"positive-negative-rationals"},{"d":"MEDIUM","q":"Find x if x + 5/12 = 1/12.","o":["1/3","−1/3","−4/12","4/12"],"a":1,"e":"Subtract 5/12: x = 1/12 − 5/12 = −4/12 = −1/3.","v":"positive-negative-rationals"},{"d":"MEDIUM","q":"Calculate −7/10 − 2/10.","o":["−9/10","−5/10","9/10","−7/20"],"a":0,"e":"Subtracting 2/10 gives (−7 − 2)/10 = −9/10.","v":"positive-negative-rationals"},{"d":"MEDIUM","q":"Which pair represents the same rational number?","o":["−2/3 and 4/6","3/5 and 6/10","−1/4 and 1/4","2/7 and 2/14"],"a":1,"e":"Multiplying 3/5's numerator and denominator by 2 gives 6/10.","v":"positive-negative-rationals"},{"d":"HARD","q":"Evaluate (−3/5) + (7/10).","o":["1/10","−1/10","4/15","−13/10"],"a":0,"e":"Convert −3/5 to −6/10; −6/10 + 7/10 = 1/10.","v":"positive-negative-rationals"},{"d":"HARD","q":"Evaluate (−4/7) − (−2/7).","o":["−6/7","−2/7","2/7","6/7"],"a":1,"e":"Subtracting a negative adds its opposite: −4/7 + 2/7 = −2/7.","v":"positive-negative-rationals"},{"d":"HARD","q":"Evaluate (−5/6) × (−9/10).","o":["−3/4","3/4","−45/16","45/16"],"a":1,"e":"The product is positive; 45/60 simplifies to 3/4.","v":"positive-negative-rationals"},{"d":"HARD","q":"Evaluate (−8/15) ÷ (4/5).","o":["−2/3","2/3","−32/75","32/75"],"a":0,"e":"Multiply by the reciprocal: −8/15 × 5/4 = −40/60 = −2/3.","v":"positive-negative-rationals"},{"d":"HARD","q":"Which rational number lies between −1/2 and 0?","o":["−3/4","−1/4","1/4","−3/5"],"a":1,"e":"−1/4 is negative but closer to zero than −1/2.","v":"positive-negative-rationals"},{"d":"HARD","q":"If x − 2/9 = −5/9, find x.","o":["−7/9","−1/3","1/3","7/9"],"a":1,"e":"Add 2/9 to both sides: x = −3/9 = −1/3.","v":"positive-negative-rationals"},{"d":"HARD","q":"A hiker is 3/4 km below a reference level and climbs 1/2 km. What is the new signed position?","o":["−1/4 km","1/4 km","−5/4 km","5/4 km"],"a":0,"e":"Represent the position as −3/4 + 1/2 = −3/4 + 2/4 = −1/4 km.","v":"positive-negative-rationals"},{"d":"HARD","q":"Which expression equals 1?","o":["(−3/7) × (−7/3)","(−3/7) + (−7/3)","3/7 ÷ (−7/3)","(−3/7) × (7/3)"],"a":0,"e":"A non-zero rational number multiplied by its reciprocal equals 1.","v":"positive-negative-rationals"},{"d":"HARD","q":"Simplify 2/3 + (−5/6) + 1/2.","o":["1/3","0","−1/3","−2/3"],"a":0,"e":"Using sixths: 4/6 − 5/6 + 3/6 = 2/6 = 1/3.","v":"positive-negative-rationals"},{"d":"HARD","q":"Which statement is true for every non-zero rational number r?","o":["r ÷ 0 = 0","r × 0 = r","r × 1 = r","r + 1 = r"],"a":2,"e":"Multiplication by the identity 1 leaves r unchanged.","v":"positive-negative-rationals"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Multiply positive and negative integers</strong><small>Apply sign rules to integer products</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Solve multiplication word problems</strong><small>Reason with signs and products</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply ruler-and-compass reasoning</strong><small>Use accurate integer multiplication methods</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
