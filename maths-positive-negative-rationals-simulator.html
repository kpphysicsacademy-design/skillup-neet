</style></head><body><header><div class="nav"><a href="maths-positive-negative-rationals-quiz.html?v=20261117-positive-negative-rationals-quiz-architecture-v1">← Quiz</a><strong>SkillUp Maths</strong></div></header><main><section class="hero"><p class="muted">INTERACTIVE SIMULATOR</p><h1>Rational Number Explorer</h1><p class="muted">Change fractions, compare their values and practise addition, subtraction, multiplication and division.</p></section>
<section class="panel"><h2>1. Compare two rational numbers</h2><div class="fields"><div class="field"><label for="an">First numerator</label><input id="an" type="number" value="-2" step="1"></div><div class="field"><label for="ad">First denominator</label><input id="ad" type="number" min="1" value="5" step="1"></div><div class="field"><label for="bn">Second numerator</label><input id="bn" type="number" value="-1" step="1"></div><div class="field"><label for="bd">Second denominator</label><input id="bd" type="number" min="1" value="5" step="1"></div></div><div class="result" id="compareResult"></div><div class="line"><span class="tick neg" style="left:15%">−1</span><span class="tick neg" style="left:32%">−1/2</span><span class="tick" style="left:50%">0</span><span class="tick pos" style="left:68%">1/2</span><span class="tick pos" style="left:85%">1</span></div><p class="muted" id="compareWorking"></p></section>
<section class="panel"><h2>2. Fraction operation explorer</h2><div class="fields"><div class="field"><label for="op">Operation</label><select id="op"><option value="+">Addition (+)</option><option value="-">Subtraction (−)</option><option value="*">Multiplication (×)</option><option value="/">Division (÷)</option></select></div><div class="field"><label for="x1">First fraction</label><input id="x1" value="-3/4" aria-label="First fraction"></div><div class="field"><label for="x2">Second fraction</label><input id="x2" value="1/2" aria-label="Second fraction"></div></div><div class="result" id="opResult"></div><div class="steps" id="opSteps"></div><div class="controls"><button data-x1="2/3" data-x2="-5/6" data-op="+">Add mixed signs</button><button data-x1="-2/3" data-x2="3/5" data-op="*">Multiply</button><button data-x1="-3/8" data-x2="-2/5" data-op="/">Divide negatives</button></div></section>
<div class="cta"><a href="maths-positive-negative-rationals-learn.html?v=20261117-positive-negative-rationals-learn-v1">Brief Learn →</a><a class="secondary" href="maths-positive-negative-rationals-quiz.html?v=20261117-positive-negative-rationals-quiz-architecture-v1">Take the quiz →</a></div></main>
<script>
(function(){
const $=id=>document.getElementById(id);
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t;}return a||1;}
function frac(n,d){if(!Number.isFinite(n)||!Number.isFinite(d)||d===0)throw Error('Denominator cannot be zero.');if(d<0){n=-n;d=-d;}const g=gcd(n,d);return {n:n/g,d:d/g};}
function parse(s){const m=String(s).trim().match(/^([+-]?\d+)\s*\/\s*([+-]?\d+)$/);if(!m)throw Error('Enter a fraction in numerator/denominator form.');return frac(Number(m[1]),Number(m[2]));}
function fmt(f){return f.d===1?String(f.n):f.n+'/'+f.d;}
function compare(){try{const a=frac(Number($('an').value),Number($('ad').value)),b=frac(Number($('bn').value),Number($('bd').value));const left=a.n*b.d,right=b.n*a.d,rel=left>right?'>':left<right?'<':'=';$('compareResult').textContent=fmt(a)+' '+rel+' '+fmt(b);$('compareWorking').textContent='Cross-products: '+a.n+' × '+b.d+' = '+left+'; '+b.n+' × '+a.d+' = '+right+'. Their signs and sizes determine the order.';}catch(e){$('compareResult').textContent=e.message;$('compareWorking').textContent='';}}
function operate(){try{const a=parse($('x1').value),b=parse($('x2').value),op=$('op').value;let r;if(op==='+')r=frac(a.n*b.d+b.n*a.d,a.d*b.d);else if(op==='-')r=frac(a.n*b.d-b.n*a.d,a.d*b.d);else if(op==='*')r=frac(a.n*b.n,a.d*b.d);else{if(b.n===0)throw Error('Division by zero is undefined.');r=frac(a.n*b.d,a.d*b.n);}const symbol={'+' : '+','-':'−','*':'×','/':'÷'}[op];$('opResult').textContent=fmt(r)+'  ( '+(r.n/r.d).toFixed(4).replace(/0+$/,'').replace(/\.$/,'')+' )';$('opSteps').textContent='('+fmt(a)+') '+symbol+' ('+fmt(b)+') = '+fmt(r)+'. Simplified numerator and denominator have no common factor.';}catch(e){$('opResult').textContent=e.message;$('opSteps').textContent='';}}
['an','ad','bn','bd'].forEach(id=>$(id).addEventListener('input',compare));['op','x1','x2'].forEach(id=>$(id).addEventListener('input',operate));document.querySelectorAll('[data-x1]').forEach(b=>b.addEventListener('click',()=>{$('x1').value=b.dataset.x1;$('x2').value=b.dataset.x2;$('op').value=b.dataset.op;operate();}));compare();operate();
})();
</script><script src="/shared-nav.js?v=20261125-central-design-system-v2"></script>
