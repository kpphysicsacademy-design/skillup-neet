<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Which number is prime?","o":["1","9","11","15"],"a":2,"e":"11 has exactly two positive factors: 1 and 11."},{"d":"BASIC","q":"Which number is composite?","o":["2","3","5","8"],"a":3,"e":"8 has factors 1, 2, 4 and 8, so it is composite."},{"d":"BASIC","q":"How many positive factors does a prime number have?","o":["One","Two","Three","Infinitely many"],"a":1,"e":"A prime number has exactly two distinct positive factors."},{"d":"BASIC","q":"Which number is neither prime nor composite?","o":["0","1","2","4"],"a":1,"e":"1 has only one positive factor, so it is neither prime nor composite."},{"d":"BASIC","q":"Which is the only even prime number?","o":["0","2","4","6"],"a":1,"e":"2 is prime; every other even number greater than 2 has at least three positive factors."},{"d":"BASIC","q":"Which number is composite?","o":["13","17","19","21"],"a":3,"e":"21 = 3 × 7, so it has factors other than 1 and itself."},{"d":"BASIC","q":"Which number is prime?","o":["21","23","25","27"],"a":1,"e":"23 has no positive divisors other than 1 and 23."},{"d":"BASIC","q":"Is 15 prime or composite?","o":["Prime","Composite","Neither","Both"],"a":1,"e":"15 = 3 × 5, so it is composite."},{"d":"BASIC","q":"Which is a factor pair of 12?","o":["2 and 6","3 and 5","4 and 5","2 and 7"],"a":0,"e":"2 × 6 = 12, so both numbers form a factor pair."},{"d":"BASIC","q":"Which number is not prime?","o":["2","3","7","9"],"a":3,"e":"9 = 3 × 3, so it is composite."},{"d":"MEDIUM","q":"Which list contains only prime numbers?","o":["2, 3, 5, 7","1, 3, 5, 7","2, 4, 5, 7","3, 5, 9, 11"],"a":0,"e":"Each number in 2, 3, 5 and 7 has exactly two positive factors."},{"d":"MEDIUM","q":"What is the prime factorisation of 18?","o":["2 × 9","3 × 6","2 × 3 × 3","1 × 18"],"a":2,"e":"18 = 2 × 3 × 3, and all the factors are prime."},{"d":"MEDIUM","q":"Which number is divisible by 2 and therefore not prime, if it is greater than 2?","o":["11","13","17","22"],"a":3,"e":"22 is even and greater than 2, so it is composite."},{"d":"MEDIUM","q":"How many positive factors does 12 have?","o":["4","5","6","7"],"a":2,"e":"The positive factors are 1, 2, 3, 4, 6 and 12: six in total."},{"d":"MEDIUM","q":"Which is the prime factorisation of 30?","o":["2 × 3 × 5","3 × 10","2 × 15","1 × 30"],"a":0,"e":"30 = 2 × 3 × 5, with all factors prime."},{"d":"MEDIUM","q":"Which number is composite?","o":["29","31","33","37"],"a":2,"e":"33 = 3 × 11."},{"d":"MEDIUM","q":"Which statement about 1 is correct?","o":["1 is prime","1 is composite","1 is neither prime nor composite","1 is both prime and composite"],"a":2,"e":"Prime numbers have exactly two distinct positive factors; 1 has only one."},{"d":"MEDIUM","q":"Which is the smallest prime number greater than 10?","o":["11","12","13","15"],"a":0,"e":"11 is prime and is the first prime after 10."},{"d":"MEDIUM","q":"Which number has exactly three positive factors?","o":["6","8","9","10"],"a":2,"e":"9 has exactly 1, 3 and 9 as positive factors."},{"d":"MEDIUM","q":"Which is the prime factorisation of 42?","o":["2 × 3 × 7","6 × 7","2 × 21","3 × 14"],"a":0,"e":"42 = 2 × 3 × 7."},{"d":"HARD","q":"A number is divisible by 3 and 5, and lies between 20 and 40. Which could it be?","o":["25","30","32","35"],"a":1,"e":"30 is divisible by both 3 and 5 and lies between 20 and 40."},{"d":"HARD","q":"What is the prime factorisation of 84?","o":["2 × 3 × 7","2 × 2 × 3 × 7","4 × 3 × 7","2 × 2 × 21"],"a":1,"e":"84 = 2 × 42 = 2 × 2 × 21 = 2 × 2 × 3 × 7."},{"d":"HARD","q":"Which number is prime?","o":["51","57","59","69"],"a":2,"e":"59 is not divisible by any prime number up to its square root (2, 3, 5 or 7)."},{"d":"HARD","q":"A composite number has prime factors 2, 3 and 5, each used once. What is the number?","o":["10","15","30","60"],"a":2,"e":"2 × 3 × 5 = 30."},{"d":"HARD","q":"Which number has exactly four positive factors?","o":["8","10","12","16"],"a":1,"e":"10 has factors 1, 2, 5 and 10: four in total."},{"d":"HARD","q":"What is the prime factorisation of 100?","o":["2 × 5","2 × 2 × 5 × 5","4 × 25","10 × 10"],"a":1,"e":"100 = 2² × 5² = 2 × 2 × 5 × 5."},{"d":"HARD","q":"Which pair consists of two composite numbers?","o":["11 and 15","21 and 27","17 and 25","2 and 9"],"a":1,"e":"21 = 3×7 and 27 = 3×9, so both are composite."},{"d":"HARD","q":"A number has factors 1, 2, 4, 7, 14 and 28. Is it prime or composite?","o":["Prime","Composite","Neither","Cannot tell"],"a":1,"e":"It has more than two positive factors, so it is composite."},{"d":"HARD","q":"Which number is divisible by neither 2, 3 nor 5 and is prime?","o":["49","51","53","55"],"a":2,"e":"53 is odd, its digit sum is 8, it does not end in 0 or 5, and is prime."},{"d":"HARD","q":"What is the smallest prime factor of 91?","o":["3","5","7","13"],"a":2,"e":"91 = 7 × 13, so its smallest prime factor is 7."}];let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🔢</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(index>=questions.length){restart();return;}act();});render();})();</script></body></html>
