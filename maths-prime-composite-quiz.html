s="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Prime and Composite Numbers</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Prime and Composite Numbers skills"><div class="skill-title">🎯 Prime and Composite Numbers Skills</div><div class="skill-list"><div class="skill-item">Classify prime and composite numbers</div><div class="skill-item">Find prime factors and factor pairs</div><div class="skill-item">Use prime factorisation to solve problems</div></div></section></div><script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Which number is prime?","o":["9","11","15","21"],"a":1,"e":"11 has exactly two positive factors: 1 and 11.","v":"prime"},{"d":"BASIC","q":"Which number is composite?","o":["2","3","5","8"],"a":3,"e":"8 has factors 1, 2, 4 and 8, so it is composite.","v":"composite"},{"d":"BASIC","q":"How many positive factors does the number 1 have?","o":["Zero","One","Two","Infinitely many"],"a":1,"e":"The only positive factor of 1 is 1 itself. Therefore 1 is neither prime nor composite.","v":"one"},{"d":"BASIC","q":"Which is the smallest prime number?","o":["0","1","2","3"],"a":2,"e":"2 is the smallest prime number and the only even prime.","v":"prime"},{"d":"BASIC","q":"Why is 12 composite?","o":["It is odd","It has more than two positive factors","It has no factors","It is prime"],"a":1,"e":"12 has several positive factors, including 1, 2, 3, 4, 6 and 12.","v":"composite"},{"d":"BASIC","q":"Which number is NOT prime?","o":["7","13","17","21"],"a":3,"e":"21 = 3 × 7, so it has factors other than 1 and itself.","v":"factorpair"},{"d":"BASIC","q":"Which number has exactly two positive factors?","o":["1","4","9","19"],"a":3,"e":"19 has exactly two positive factors: 1 and 19.","v":"prime"},{"d":"BASIC","q":"Which of these numbers is even and prime?","o":["2","4","6","8"],"a":0,"e":"2 is the only even prime; every larger even number has 2 as a proper factor.","v":"prime"},{"d":"BASIC","q":"Which statement about 1 is correct?","o":["1 is prime","1 is composite","1 is neither prime nor composite","1 has two positive factors"],"a":2,"e":"A prime has exactly two positive factors; a composite has more than two. The number 1 has only one.","v":"one"},{"d":"BASIC","q":"Which number is a composite number?","o":["13","17","23","25"],"a":3,"e":"25 = 5 × 5, so it has more than two positive factors.","v":"factorpair"},{"d":"MEDIUM","q":"Which list contains only prime numbers?","o":["2, 3, 5, 7","1, 2, 3, 5","3, 5, 9, 11","2, 4, 5, 7"],"a":0,"e":"2, 3, 5 and 7 are all prime; 1 is not prime, and 9 and 4 are composite.","v":"classify"},{"d":"MEDIUM","q":"What is the prime factorisation of 18?","o":["2 × 9","3 × 6","2 × 3 × 3","1 × 18"],"a":2,"e":"18 = 2 × 9 = 2 × 3 × 3, with all factors prime.","v":"factorpair"},{"d":"MEDIUM","q":"Which number is divisible by 3 and therefore composite?","o":["17","19","27","29"],"a":2,"e":"27 is divisible by 3 and equals 3 × 9, so it is composite.","v":"divisibility"},{"d":"MEDIUM","q":"Which is the only prime number between 20 and 25?","o":["21","22","23","24"],"a":2,"e":"23 has no positive divisors other than 1 and 23; the others are composite.","v":"sieve"},{"d":"MEDIUM","q":"How many positive factors does a prime number have?","o":["One","Two","Three","Four"],"a":1,"e":"By definition, a prime number has exactly two positive factors: 1 and itself.","v":"prime"},{"d":"MEDIUM","q":"Which number has prime factorisation 2 × 2 × 5?","o":["10","15","20","25"],"a":2,"e":"2 × 2 × 5 = 20.","v":"factorpair"},{"d":"MEDIUM","q":"Which number is composite even though it is odd?","o":["2","11","15","19"],"a":2,"e":"15 is odd but composite because 15 = 3 × 5.","v":"composite"},{"d":"MEDIUM","q":"Which is a factor pair for 35?","o":["4 and 9","5 and 7","3 and 12","2 and 17"],"a":1,"e":"5 × 7 = 35, so both numbers are factors of 35.","v":"factorpair"},{"d":"MEDIUM","q":"Which number is prime?","o":["39","41","49","51"],"a":1,"e":"41 is not divisible by 2, 3 or 5, and no prime up to its square root divides it.","v":"sieve"},{"d":"MEDIUM","q":"Which statement is always true for a composite positive integer?","o":["It is even","It has more than two positive factors","It is divisible by 3","It is greater than 100"],"a":1,"e":"A composite number has more than two positive factors.","v":"composite"},{"d":"HARD","q":"What is the prime factorisation of 60?","o":["2 × 30","3 × 20","2 × 2 × 3 × 5","2 × 3 × 10"],"a":2,"e":"60 = 2 × 2 × 3 × 5, and every factor in the product is prime.","v":"factorpair"},{"d":"HARD","q":"Which number has exactly three positive factors?","o":["8","9","10","12"],"a":1,"e":"9 has factors 1, 3 and 9—exactly three positive factors.","v":"divisors"},{"d":"HARD","q":"Which pair consists of two prime numbers whose sum is 24?","o":["11 and 13","7 and 15","9 and 15","5 and 19"],"a":0,"e":"11 and 13 are both prime and 11 + 13 = 24.","v":"classify"},{"d":"HARD","q":"A number has prime factorisation 2³ × 3. What is the number?","o":["12","18","24","36"],"a":2,"e":"2³ × 3 = 8 × 3 = 24.","v":"factorpair"},{"d":"HARD","q":"Which number from 50 to 60 is prime?","o":["51","53","55","57"],"a":1,"e":"53 is not divisible by 2, 3, 5 or 7, the primes up to its square root.","v":"sieve"},{"d":"HARD","q":"Why is 91 composite?","o":["It is odd","It is not divisible by 2","91 = 7 × 13","It is greater than 90"],"a":2,"e":"91 = 7 × 13, so it has factors besides 1 and itself.","v":"factorpair"},{"d":"HARD","q":"How many prime factors, counting repeats, are in 72 = 2³ × 3²?","o":["2","3","5","6"],"a":2,"e":"Counting repeated factors gives 2, 2, 2, 3, 3: five prime factors.","v":"factorpair"},{"d":"HARD","q":"Which number is prime?","o":["87","89","91","93"],"a":1,"e":"89 has no divisor among primes up to √89, so it is prime.","v":"sieve"},{"d":"HARD","q":"A number has exactly two factors, 1 and itself. What must be true?","o":["It is composite","It is prime","It is even","It equals 1"],"a":1,"e":"Having exactly two positive factors is the definition of a prime number.","v":"prime"},{"d":"HARD","q":"Which is the correct prime factorisation of 84?","o":["2 × 42","4 × 21","2 × 2 × 3 × 7","2 × 3 × 14"],"a":2,"e":"84 = 2 × 42 = 2 × 2 × 21 = 2 × 2 × 3 × 7.","v":"factorpair"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');const visuals={
prime:'<svg viewBox="0 0 300 100" role="img" aria-label="Prime number has exactly two positive factors"><circle cx="100" cy="48" r="23" fill="#91b7ff22" stroke="#91b7ff" stroke-width="2"/><circle cx="200" cy="48" r="23" fill="#58d6a322" stroke="#58d6a3" stroke-width="2"/><text x="100" y="54" fill="#f2f5ff" text-anchor="middle">1</text><text x="200" y="54" fill="#f2f5ff" text-anchor="middle">p</text><text x="150" y="90" fill="#f2f5ff" text-anchor="middle">Exactly two factors</text></svg>',
composite:'<svg viewBox="0 0 300 100" role="img" aria-label="Composite number has more than two factors"><rect x="35" y="18" width="230" height="64" rx="10" fill="#58d6a318" stroke="#58d6a3" stroke-width="2"/>'+['1','2','4','8'].map((n,i)=>'<circle cx="'+(65+i*56)+'" cy="43" r="14" fill="#91b7ff22" stroke="#91b7ff"/><text x="'+(65+i*56)+'" y="48" fill="#f2f5ff" text-anchor="middle">'+n+'</text>').join('')+'<text x="150" y="75" fill="#f2f5ff" text-anchor="middle">More than two factors</text></svg>',
one:'<svg viewBox="0 0 300 100" role="img" aria-label="One has only one positive factor"><circle cx="150" cy="40" r="20" fill="#ffd27a22" stroke="#ffd27a" stroke-width="2"/><text x="150" y="47" fill="#f2f5ff" text-anchor="middle">1</text><text x="150" y="82" fill="#f2f5ff" text-anchor="middle">Only factor: 1</text></svg>',
factorpair:'<svg viewBox="0 0 300 100" role="img" aria-label="Prime factorisation shown as a product of prime factors"><rect x="18" y="20" width="62" height="35" rx="7" stroke="#91b7ff" fill="#91b7ff18"/><text x="49" y="42" fill="#f2f5ff" text-anchor="middle">2</text><text x="100" y="42" fill="#58d6a3" text-anchor="middle">×</text><rect x="120" y="20" width="62" height="35" rx="7" stroke="#91b7ff" fill="#91b7ff18"/><text x="151" y="42" fill="#f2f5ff" text-anchor="middle">3</text><text x="202" y="42" fill="#58d6a3" text-anchor="middle">×</text><rect x="222" y="20" width="62" height="35" rx="7" stroke="#91b7ff" fill="#91b7ff18"/><text x="253" y="42" fill="#f2f5ff" text-anchor="middle">5</text><text x="150" y="82" fill="#f2f5ff" text-anchor="middle">Prime factors multiply</text></svg>',
classify:'<svg viewBox="0 0 300 100" role="img" aria-label="Classifying numbers into prime and composite"><rect x="15" y="15" width="128" height="68" rx="9" stroke="#58d6a3" fill="#58d6a318"/><rect x="157" y="15" width="128" height="68" rx="9" stroke="#ff9eaa" fill="#ff9eaa18"/><text x="79" y="43" fill="#58d6a3" text-anchor="middle">Prime</text><text x="79" y="66" fill="#f2f5ff" text-anchor="middle">2, 3, 5, 7</text><text x="221" y="43" fill="#ff9eaa" text-anchor="middle">Composite</text><text x="221" y="66" fill="#f2f5ff" text-anchor="middle">4, 6, 8, 9</text></svg>',
divisibility:'<svg viewBox="0 0 300 100" role="img" aria-label="Divisibility check helps identify composite numbers"><rect x="35" y="20" width="230" height="60" rx="10" fill="#91b7ff18" stroke="#91b7ff" stroke-width="2"/><text x="150" y="45" fill="#f2f5ff" text-anchor="middle">27 ÷ 3</text><text x="150" y="67" fill="#58d6a3" text-anchor="middle">= 9 exactly</text></svg>',
sieve:'<svg viewBox="0 0 300 100" role="img" aria-label="Check possible divisors to identify primes"><g>'+Array.from({length:10},(_,i)=>'<rect x="'+(12+(i%5)*57)+'" y="'+(12+Math.floor(i/5)*42)+'" width="48" height="32" rx="5" fill="'+([1,2,4,6,8].includes(i)?'#58d6a322':'#91b7ff18')+'" stroke="'+([1,2,4,6,8].includes(i)?'#58d6a3':'#91b7ff')+'"/><text x="'+(36+(i%5)*57)+'" y="'+(33+Math.floor(i/5)*42)+'" fill="#f2f5ff" text-anchor="middle">'+([51,53,55,57,59,61,63,67,69,71][i])+'</text>').join('')+'</g></svg>',
divisors:'<svg viewBox="0 0 300 100" role="img" aria-label="Positive divisors of a number"><path d="M35 50 H265" stroke="#91b7ff" stroke-width="2"/>'+[1,3,9].map((n,i)=>'<circle cx="'+(60+i*90)+'" cy="50" r="17" fill="#58d6a322" stroke="#58d6a3" stroke-width="2"/><text x="'+(60+i*90)+'" y="55" fill="#f2f5ff" text-anchor="middle">'+n+'</text>').join('')+'<text x="150" y="90" fill="#f2f5ff" text-anchor="middle">Factors of 9</text></svg>'
};function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'<div class="diagram">'+visuals[q.v]+'</div>':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const skills=[['Classify prime and composite numbers',8],['Identify prime factors and factor pairs',18],['Apply prime and composite rules to problems',24]];$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">📏</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+skills.map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script></body></html>
