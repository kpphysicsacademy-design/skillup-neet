(function(){'use strict';
const originalQuestions=[{"id":"b01","d":"BASIC","q":"Which of these numbers is prime?","o":["1","9","11","15"],"a":2,"e":"11 has exactly two positive factors: 1 and 11."},{"id":"b02","d":"BASIC","q":"Which of these numbers is composite?","o":["2","3","5","8"],"a":3,"e":"8 has more than two positive factors: 1, 2, 4 and 8."},{"id":"b03","d":"BASIC","q":"How many positive factors does a prime number have?","o":["One","Two","Three","Infinitely many"],"a":1,"e":"A prime number has exactly two distinct positive factors: 1 and itself."},{"id":"b04","d":"BASIC","q":"Which statement about the number 1 is correct?","o":["1 is prime","1 is composite","1 is neither prime nor composite","1 is both prime and composite"],"a":2,"e":"The number 1 has only one positive factor, so it is neither prime nor composite."},{"id":"b05","d":"BASIC","q":"Which is the only even prime number?","o":["0","2","4","6"],"a":1,"e":"2 is the only even prime; every other even number is divisible by 2 and another number."},{"id":"b06","d":"BASIC","q":"Which number is composite?","o":["13","17","19","21"],"a":3,"e":"21 has factors 1, 3, 7 and 21."},{"id":"b07","d":"BASIC","q":"Which number is a factor of 17 other than 1?","o":["2","3","5","17"],"a":3,"e":"A prime number is divisible by itself and 1; 17 is a factor of 17."},{"id":"b08","d":"BASIC","q":"Which number is prime?","o":["25","27","29","33"],"a":2,"e":"29 has no positive factors other than 1 and 29."},{"id":"b09","d":"BASIC","q":"Which list contains only prime numbers?","o":["2, 3, 5, 7","1, 3, 5, 7","2, 4, 5, 7","3, 5, 9, 11"],"a":0,"e":"2, 3, 5 and 7 each have exactly two positive factors."},{"id":"b10","d":"BASIC","q":"Why is 12 a composite number?","o":["It is odd","It has more than two positive factors","It is less than 20","It is divisible by 1"],"a":1,"e":"12 has several positive factors, including 1, 2, 3, 4, 6 and 12."},{"id":"m11","d":"MEDIUM","q":"Which number is prime?","o":["39","41","49","51"],"a":1,"e":"41 is not divisible by any prime number up to its square root."},{"id":"m12","d":"MEDIUM","q":"How many positive factors does 18 have?","o":["4","5","6","8"],"a":2,"e":"The positive factors of 18 are 1, 2, 3, 6, 9 and 18."},{"id":"m13","d":"MEDIUM","q":"Which number is composite?","o":["31","37","43","45"],"a":3,"e":"45 = 5 × 9, so it has more than two positive factors."},{"id":"m14","d":"MEDIUM","q":"Which is the prime factorisation of 60?","o":["2 × 3 × 10","2² × 3 × 5","3 × 4 × 5","2 × 5 × 6"],"a":1,"e":"60 = 2 × 2 × 3 × 5 = 2² × 3 × 5; all factors are prime."},{"id":"m15","d":"MEDIUM","q":"Which number is divisible by 3 and is also prime?","o":["21","27","31","39"],"a":2,"e":"31 is prime; it is not divisible by 3 (3 + 1 = 4)."},{"id":"m16","d":"MEDIUM","q":"What is the smallest composite whole number greater than 1?","o":["2","3","4","5"],"a":2,"e":"4 is composite because its positive factors are 1, 2 and 4."},{"id":"m17","d":"MEDIUM","q":"Which number has exactly three positive factors?","o":["8","9","10","12"],"a":1,"e":"9 has exactly three positive factors: 1, 3 and 9."},{"id":"m18","d":"MEDIUM","q":"Which statement is always true for a composite number n?","o":["n has exactly two positive factors","n can be written as a product of two integers greater than 1","n is always even","n is divisible by 5"],"a":1,"e":"A composite number can be expressed as a product of two integers greater than 1."},{"id":"m19","d":"MEDIUM","q":"Which number is NOT prime?","o":["47","53","57","61"],"a":2,"e":"57 = 3 × 19, so it is composite."},{"id":"m20","d":"MEDIUM","q":"What is the prime factorisation of 84?","o":["2 × 3 × 14","2² × 3 × 7","2 × 6 × 7","3 × 4 × 7"],"a":1,"e":"84 = 2 × 2 × 3 × 7 = 2² × 3 × 7."},{"id":"h21","d":"HARD","q":"Which number is prime?","o":["91","97","111","121"],"a":1,"e":"97 is not divisible by any prime up to √97, so it is prime."},{"id":"h22","d":"HARD","q":"How many prime factors, counting repetitions, are in 360 = 2³ × 3² × 5?","o":["3","4","5","6"],"a":3,"e":"There are 3 twos, 2 threes and 1 five: 3 + 2 + 1 = 6 prime factors."},{"id":"h23","d":"HARD","q":"A number has prime factorisation 2² × 3 × 5. What is the number?","o":["30","45","60","90"],"a":2,"e":"2² × 3 × 5 = 4 × 15 = 60."},{"id":"h24","d":"HARD","q":"Which number has exactly four positive factors?","o":["8","10","12","16"],"a":1,"e":"10 has exactly four positive factors: 1, 2, 5 and 10."},{"id":"h25","d":"HARD","q":"Which pair consists of twin primes?","o":["11 and 13","13 and 17","17 and 21","19 and 23"],"a":0,"e":"11 and 13 are both prime and differ by 2."},{"id":"h26","d":"HARD","q":"What is the smallest prime number greater than 50?","o":["51","52","53","55"],"a":2,"e":"51 = 3 × 17 and 52 is even; 53 is prime."},{"id":"h27","d":"HARD","q":"Which number is the product of exactly three distinct prime factors?","o":["30","36","40","49"],"a":0,"e":"30 = 2 × 3 × 5, a product of three distinct primes."},{"id":"h28","d":"HARD","q":"A prime number p divides 35. Which value can p have?","o":["2","5","6","9"],"a":1,"e":"The prime divisors of 35 = 5 × 7 are 5 and 7; among the choices, 5."},{"id":"h29","d":"HARD","q":"Which number is composite and has no prime factor greater than 5?","o":["36","49","77","121"],"a":0,"e":"36 = 2² × 3²; its prime factors are 2 and 3, both no greater than 5."},{"id":"h30","d":"HARD","q":"What is the prime factorisation of 210?","o":["2 × 3 × 5 × 7","2 × 5 × 21","3 × 7 × 10","2 × 3 × 35"],"a":0,"e":"210 = 2 × 3 × 5 × 7, a product of four distinct primes."}];
let questions=originalQuestions.slice(),index=0,selected=-1,locked=false,xp=0,correct=0,streak=0;

function checkAnswer(){if(selected<0||locked)return;locked=true;const q=questions[index],isCorrect=selected===q.a;if(isCorrect){correct++;xp+=10;streak++;$('xp').textContent=String(xp);$('streak').textContent=String(streak);}else{streak=0;$('streak').textContent='0';mistakes.push({id:q.id,question:q.q,chosen:q.o[selected],answer:q.o[q.a],explanation:q.e});}

$('feedback').textContent=(isCorrect?'Correct! ':'Let’s review. ')+q.e;$('feedback').className='feedback show '+(isCorrect?'good':'bad');$('check').style.display='none';$('continue').className='btn continue show';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';}
function restart(wrongOnly){const retry=wrongOnly?originalQuestions.filter(q=>mistakes.some(m=>m.id===q.id)):originalQuestions.slice();questions=retry;index=0;selected=-1;locked=false;xp=0;correct=0;streak=0;mistakes=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();}
function finish(){updateProgress();$('quiz').style.display='none';const slot=$('finishSlot');slot.replaceChildren();const card=make('section','finish');const trophy=make('div','trophy','🏆');const heading=make('h2', '',correct>=25?'Excellent work!':correct>=18?'Good progress!':'Keep practising!');const simulator=make('a','topic-link','🧪 Explore Prime & Composite Simulator →');simulator.href='maths-prime-composite-simulator.html?v=20261111-prime-composite-simulator-v1';const score=make('div','score',correct+' / '+questions.length);const summary=make('p','muted','You answered '+correct+' correctly and earned '+xp+' XP.');const accuracy=make('p','',Math.round(correct/questions.length*100)+'% accuracy');card.append(trophy,heading,simulator,score,summary,accuracy);
const review=make('div','review');review.append(make('h3','',mistakes.length?'Review your mistakes ('+mistakes.length+')':'Perfect round!'));mistakes.forEach((m,i)=>{const item=make('div','review-item');item.append(make('b','',(i+1)+'. '+m.question),make('p','your-answer','Your answer: '+m.chosen),make('p','correct-answer','Correct answer: '+m.answer),make('p','',m.explanation));review.append(item);});card.append(review);
const actions=make('div','review-actions');const wrong=make('button','btn secondary','Retry mistakes');wrong.type='button';wrong.disabled=!mistakes.length;wrong.addEventListener('click',()=>restart(true));const all=make('button','btn primary','Retry all');all.type='button';all.addEventListener('click',()=>restart(false));actions.append(wrong,all);card.append(actions);slot.append(card);}

})();
