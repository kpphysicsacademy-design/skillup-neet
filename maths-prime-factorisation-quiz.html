uct of prime factors.","o":["2 × 24","2 × 2 × 2 × 2 × 3","4 × 4 × 3","6 × 8"],"a":1,"e":"48 = 16 × 3 = 2 × 2 × 2 × 2 × 3."},{"id":"m14","d":"MEDIUM","q":"What is the prime factorisation of 45?","o":["3 × 15","5 × 9","3 × 3 × 5","1 × 45"],"a":2,"e":"45 = 9 × 5 = 3 × 3 × 5."},{"id":"m15","d":"MEDIUM","q":"Which number has prime factorisation 2² × 3 × 5?","o":["30","45","60","90"],"a":2,"e":"2² × 3 × 5 = 4 × 15 = 60."},{"id":"m16","d":"MEDIUM","q":"In 72 = 2³ × 3², what is the exponent of 3?","o":["1","2","3","5"],"a":1,"e":"The factor 3 appears twice, so its exponent is 2."},{"id":"m17","d":"MEDIUM","q":"Which is the prime factorisation of 100?","o":["10 × 10","2 × 50","2 × 2 × 5 × 5","4 × 25"],"a":2,"e":"100 = 4 × 25 = 2 × 2 × 5 × 5."},{"id":"m18","d":"MEDIUM","q":"Which pair of prime factors makes 77?","o":["6 and 13","7 and 11","5 and 15","3 and 25"],"a":1,"e":"77 = 7 × 11, and both 7 and 11 are prime."},{"id":"m19","d":"MEDIUM","q":"What is the prime factorisation of 54?","o":["2 × 3 × 3 × 3","6 × 9","2 × 27","3 × 18"],"a":0,"e":"54 = 2 × 27 = 2 × 3 × 3 × 3."},{"id":"m20","d":"MEDIUM","q":"Which expression is NOT a complete prime factorisation?","o":["2 × 2 × 7","3 × 3 × 5","2 × 2 × 9","2 × 3 × 7"],"a":2,"e":"9 is composite, so 2 × 2 × 9 must be broken down further into 2 × 2 × 3 × 3."},{"id":"h21","d":"HARD","q":"What is the prime factorisation of 84?","o":["2 × 42","2² × 3 × 7","4 × 21","3 × 28"],"a":1,"e":"84 = 2 × 2 × 3 × 7 = 2² × 3 × 7."},{"id":"h22","d":"HARD","q":"How many prime factors, counting repetitions, are in 120 = 2³ × 3 × 5?","o":["3","4","5","6"],"a":2,"e":"Counting repeated factors gives 2, 2, 2, 3, 5: five factors."},{"id":"h23","d":"HARD","q":"Which number has prime factorisation 3² × 5²?","o":["45","75","150","225"],"a":3,"e":"3² × 5² = 9 × 25 = 225."},{"id":"h24","d":"HARD","q":"If n = 2³ × 7, what is n?","o":["28","42","56","112"],"a":2,"e":"2³ × 7 = 8 × 7 = 56."},{"id":"h25","d":"HARD","q":"What is the prime factorisation of 144?","o":["12 function updateProgress(){const pct=Math.round(index/questions.length*100);$('fill').style.width=pct+'%';$('percent').textContent=pct+'%';$('progressText').textContent='Question '+Math.min(index+1,questions.length)+' of '+questions.length;document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(pct));}

function checkAnswer(){if(selected<0||locked)return;locked=true;const q=questions[index],isCorrect=selected===q.a;if(isCorrect){correct++;xp+=10;streak++;$('xp').textContent=String(xp);$('streak').textContent=String(streak);}else{streak=0;$('streak').textContent='0';mistakes.push({id:q.id,question:q.q,chosen:q.o[selected],answer:q.o[q.a],explanation:q.e});}

function restart(wrongOnly){const retry=wrongOnly?originalQuestions.filter(q=>mistakes.some(m=>m.id===q.id)):originalQuestions.slice();questions=retry;index=0;selected=-1;locked=false;xp=0;correct=0;streak=0;mistakes=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();}
function finish(){updateProgress();$('quiz').style.display='none';const slot=$('finishSlot');slot.replaceChildren();const card=make('section','finish');const trophy=make('div','trophy','🏆');const heading=make('h2', '',correct>=25?'Excellent work!':correct>=18?'Good progress!':'Keep practising!');const simulator=make('a','topic-link','🧪 Explore Prime Factorisation Simulator →');simulator.href='maths-prime-factorisation-simulator.html?v=20261111-prime-factorisation-simulator-v1';const score=make('div','score',correct+' / '+questions.length);const summary=make('p','muted','You answered '+correct+' correctly and earned '+xp+' XP.');const accuracy=make('p','',Math.round(correct/questions.length*100)+'% accuracy');card.append(trophy,heading,simulator,score,summary,accuracy);
const review=make('div','review');review.append(make('h3','',mistakes.length?'Review your mistakes ('+mistakes.length+')':'Perfect round!'));mistakes.forEach((m,i)=>{const item=make('div','review-item');item.append(make('b','',(i+1)+'. '+m.question),make('p','your-answer','Your answer: '+m.chosen),make('p','correct-answer','Correct answer: '+m.answer),make('p','',m.explanation));review.append(item);});card.append(review);

})();
