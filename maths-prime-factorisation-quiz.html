s="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Prime Factorisation</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Prime Factorisation skills"><div class="skill-title">🎯 Prime Factorisation Skills</div><div class="skill-list"><div class="skill-item">Break numbers into prime factors</div><div class="skill-item">Find common factors and multiples</div><div class="skill-item">Apply factors and multiples to word problems</div></div></section></div><script>(function(){'use strict';const questions=[{"d":"BASIC","q":"What is the prime factorisation of 12?","o":["2 × 6","2 × 2 × 3","3 × 4","1 × 12"],"a":1,"e":"12 = 2 × 2 × 3, and every factor shown is prime.","v":"tree"},{"d":"BASIC","q":"Which is a prime factor of 15?","o":["4","6","3","9"],"a":2,"e":"15 = 3 × 5, so 3 is a prime factor.","v":"factor"},{"d":"BASIC","q":"Which is the prime factorisation of 10?","o":["2 × 5","1 × 10","2 × 2 × 5","5 × 5"],"a":0,"e":"10 = 2 × 5, and both 2 and 5 are prime.","v":"tree"},{"d":"BASIC","q":"What is the prime factorisation of 8?","o":["2 × 4","2 × 2 × 2","1 × 8","4 × 4"],"a":1,"e":"8 = 2 × 2 × 2 = 2³.","v":"tree"},{"d":"BASIC","q":"Which number is a prime factor of 21?","o":["4","7","9","14"],"a":1,"e":"21 = 3 × 7, and both 3 and 7 are prime.","v":"factor"},{"d":"BASIC","q":"Complete: 18 = 2 × 3 × __","o":["2","3","4","6"],"a":1,"e":"18 = 2 × 3 × 3.","v":"factor"},{"d":"BASIC","q":"Which expression is a complete prime factorisation of 20?","o":["2 × 10","4 × 5","2 × 2 × 5","1 × 20"],"a":2,"e":"20 = 2 × 2 × 5; all factors are prime.","v":"tree"},{"d":"BASIC","q":"What is the prime factorisation of 7?","o":["1 × 7","7","7 × 7","2 × 5"],"a":1,"e":"7 is already prime, so its prime factorisation is simply 7.","v":"prime"},{"d":"BASIC","q":"Which product equals 30 using only prime factors?","o":["2 × 3 × 5","3 × 10","5 × 6","2 × 15"],"a":0,"e":"30 = 2 × 3 × 5, and all three factors are prime.","v":"factor"},{"d":"BASIC","q":"How many times does the prime factor 2 appear in 16 = 2 × 2 × 2 × 2?","o":["One","Two","Three","Four"],"a":3,"e":"16 = 2⁴, so the factor 2 appears four times.","v":"powers"},{"d":"MEDIUM","q":"What is the prime factorisation of 36?","o":["2 × 18","3 × 12","2 × 2 × 3 × 3","6 × 6"],"a":2,"e":"36 = 4 × 9 = 2 × 2 × 3 × 3.","v":"tree"},{"d":"MEDIUM","q":"Which prime factorisation equals 42?","o":["2 × 3 × 7","2 × 21","6 × 7","3 × 14"],"a":0,"e":"42 = 2 × 3 × 7, with all factors prime.","v":"factor"},{"d":"MEDIUM","q":"Express 48 as a product of prime factors.","o":["2 × 24","2 × 2 × 2 × 2 × 3","4 × 4 × 3","6 × 8"],"a":1,"e":"48 = 16 × 3 = 2 × 2 × 2 × 2 × 3.","v":"tree"},{"d":"MEDIUM","q":"What is the prime factorisation of 45?","o":["3 × 15","5 × 9","3 × 3 × 5","1 × 45"],"a":2,"e":"45 = 9 × 5 = 3 × 3 × 5.","v":"tree"},{"d":"MEDIUM","q":"Which number has prime factorisation 2² × 3 × 5?","o":["30","45","60","90"],"a":2,"e":"2² × 3 × 5 = 4 × 15 = 60.","v":"powers"},{"d":"MEDIUM","q":"In 72 = 2³ × 3², what is the exponent of 3?","o":["1","2","3","5"],"a":1,"e":"The factor 3 appears twice, so its exponent is 2.","v":"powers"},{"d":"MEDIUM","q":"Which is the prime factorisation of 100?","o":["10 × 10","2 × 50","2 × 2 × 5 × 5","4 × 25"],"a":2,"e":"100 = 4 × 25 = 2 × 2 × 5 × 5.","v":"tree"},{"d":"MEDIUM","q":"Which pair of prime factors makes 77?","o":["6 and 13","7 and 11","5 and 15","3 and 25"],"a":1,"e":"77 = 7 × 11, and both 7 and 11 are prime.","v":"factor"},{"d":"MEDIUM","q":"What is the prime factorisation of 54?","o":["2 × 3 × 3 × 3","6 × 9","2 × 27","3 × 18"],"a":0,"e":"54 = 2 × 27 = 2 × 3 × 3 × 3.","v":"tree"},{"d":"MEDIUM","q":"Which expression is NOT a complete prime factorisation?","o":["2 × 2 × 7","3 × 3 × 5","2 × 2 × 9","2 × 3 × 7"],"a":2,"e":"9 is composite, so 2 × 2 × 9 must be broken down further into 2 × 2 × 3 × 3.","v":"factor"},{"d":"HARD","q":"What is the prime factorisation of 84?","o":["2 × 42","2² × 3 × 7","4 × 21","3 × 28"],"a":1,"e":"84 = 2 × 2 × 3 × 7 = 2² × 3 × 7.","v":"tree"},{"d":"HARD","q":"How many prime factors, counting repetitions, are in 120 = 2³ × 3 × 5?","o":["3","4","5","6"],"a":2,"e":"Counting repeated factors gives 2, 2, 2, 3, 5: five factors.","v":"powers"},{"d":"HARD","q":"Which number has prime factorisation 3² × 5²?","o":["45","75","150","225"],"a":3,"e":"3² × 5² = 9 × 25 = 225.","v":"powers"},{"d":"HARD","q":"If n = 2³ × 7, what is n?","o":["28","42","56","112"],"a":2,"e":"2³ × 7 = 8 × 7 = 56.","v":"powers"},{"d":"HARD","q":"What is the prime factorisation of 144?","o":["12 × 12","2⁴ × 3²","2³ × 3³","2² × 6²"],"a":1,"e":"144 = 16 × 9 = 2⁴ × 3².","v":"tree"},{"d":"HARD","q":"Which number has exactly the prime factorisation 2 × 3² × 7?","o":["42","84","126","252"],"a":2,"e":"2 × 9 × 7 = 126.","v":"powers"},{"d":"HARD","q":"How many factors of 2 appear in the prime factorisation of 96?","o":["Three","Four","Five","Six"],"a":2,"e":"96 = 32 × 3 = 2⁵ × 3, so 2 appears five times.","v":"powers"},{"d":"HARD","q":"Which is the correct prime factorisation of 150?","o":["2 × 3 × 5²","2 × 5 × 15","3 × 50","5 × 30"],"a":0,"e":"150 = 2 × 75 = 2 × 3 × 5 × 5 = 2 × 3 × 5².","v":"tree"},{"d":"HARD","q":"A number's prime factorisation is 2² × 3². What is the number?","o":["12","18","36","72"],"a":2,"e":"2² × 3² = 4 × 9 = 36.","v":"powers"},{"d":"HARD","q":"Which factorisation uses prime numbers only and equals 210?","o":["2 × 3 × 5 × 7","21 × 10"," tree:'<svg viewBox="0 0 300 110" role="img" aria-label="Prime factor tree"><rect x="118" y="8" width="64" height="28" rx="7" fill="#91b7ff22" stroke="#91b7ff"/><text x="150" y="27" fill="#f2f5ff" text-anchor="middle">12</text><path d="M150 36 L90 58 M150 36 L210 58" stroke="#58d6a3" stroke-width="2"/><rect x="57" y="58" width="64" height="28" rx="7" fill="#58d6a322" stroke="#58d6a3"/><rect x="178" y="58" width="64" height="28" rx="7" fill="#58d6a322" stroke="#58d6a3"/><text x="89" y="77" fill="#f2f5ff" text-anchor="middle">3</text><text x="210" y="77" fill="#f2f5ff" text-anchor="middle">4</text><text x="150" y="104" fill="#f2f5ff" text-anchor="middle">Continue until all leaves are prime</text></svg>',

};function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'<div class="diagram">'+visuals[q.v]+'</div>':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const skills=[['Write numbers as products of primes',8],['Use factor trees and repeated prime factors',18],['Apply prime factorisation to number problems',24]];$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">📏</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+skills.map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script>\n<script src="/shared-nav.js?v=20261013-universal-nav-v1"></script>\n</body></html>
