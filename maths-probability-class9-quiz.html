<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"A fair coin is tossed once. What is the probability of getting heads?","o":["0","1/4","1/2","1"],"a":2,"e":"There are two equally likely outcomes, and one is heads: P(H)=1/2."},{"d":"BASIC","q":"A fair six-sided die is rolled. What is the probability of rolling a 4?","o":["1/6","1/4","1/3","1/2"],"a":0,"e":"Only one of the six equally likely outcomes is 4."},{"d":"BASIC","q":"The probability of an impossible event is:","o":["0","1/2","1","−1"],"a":0,"e":"An impossible event has probability 0."},{"d":"BASIC","q":"The probability of a certain event is:","o":["0","1/4","1/2","1"],"a":3,"e":"A certain event always occurs, so its probability is 1."},{"d":"BASIC","q":"A bag contains 3 red balls and 2 blue balls. One ball is chosen at random. P(red) is:","o":["2/5","3/5","1/2","3/2"],"a":1,"e":"There are 3 red balls among 5 total balls, so P(red)=3/5."},{"d":"BASIC","q":"A fair die is rolled. What is the probability of getting an even number?","o":["1/6","1/3","1/2","2/3"],"a":2,"e":"Even outcomes are 2, 4 and 6: 3/6=1/2."},{"d":"BASIC","q":"A card is drawn from cards numbered 1 to 10. What is the probability of drawing a number greater than 8?","o":["1/10","1/5","2/5","1/2"],"a":1,"e":"Favourable numbers are 9 and 10, so probability=2/10=1/5."},{"d":"BASIC","q":"The probability of any event lies between:","o":["−1 and 1","0 and 1, inclusive","0 and 100 only","1 and 2"],"a":1,"e":"Probability ranges from 0 for impossible to 1 for certain."},{"d":"BASIC","q":"A coin is tossed 20 times and heads occurs 12 times. The experimental probability of heads is:","o":["3/5","1/2","2/5","12/20 only"],"a":0,"e":"Experimental probability=12/20=3/5."},{"d":"BASIC","q":"If P(A)=0.7, then P(not A) is:","o":["0.3","0.7","1.0","1.7"],"a":0,"e":"Complementary probabilities add to 1: 1−0.7=0.3."},{"d":"MEDIUM","q":"A fair die is rolled. What is the probability of getting a number less than 3?","o":["1/6","1/3","1/2","2/3"],"a":1,"e":"Favourable outcomes are 1 and 2: 2/6=1/3."},{"d":"MEDIUM","q":"A bag has 5 green, 4 yellow and 1 red ball. What is P(yellow)?","o":["1/10","2/5","1/2","4/5"],"a":1,"e":"There are 4 yellow balls out of 10: 4/10=2/5."},{"d":"MEDIUM","q":"A card is selected from cards numbered 1 to 12. Find the probability of selecting a multiple of 3.","o":["1/6","1/4","1/3","1/2"],"a":2,"e":"Multiples are 3, 6, 9, 12: 4/12=1/3."},{"d":"MEDIUM","q":"A coin is tossed 50 times and tails appears 28 times. Find the experimental probability of tails.","o":["11/25","14/25","1/2","28/50 only"],"a":1,"e":"28/50=14/25."},{"d":"MEDIUM","q":"A die is rolled. What is the probability of not getting a 6?","o":["1/6","1/3","5/6","1"],"a":2,"e":"Five of the six outcomes are not 6, so P=5/6."},{"d":"MEDIUM","q":"A spinner has 8 equal sectors: 3 red, 2 blue and 3 green. Probability of blue:","o":["1/8","1/4","3/8","1/2"],"a":1,"e":"Two of eight sectors are blue: 2/8=1/4."},{"d":"MEDIUM","q":"In 80 trials, an event occurs 18 times. What is its experimental probability?","o":["9/40","18/80 only","1/4","2/5"],"a":0,"e":"18/80 simplifies to 9/40."},{"d":"MEDIUM","q":"A number is chosen at random from 1 to 20. Find the probability it is a prime number.","o":["1/5","2/5","1/2","3/5"],"a":1,"e":"Primes are 2, 3, 5, 7, 11, 13, 17, 19: 8/20=2/5."},{"d":"MEDIUM","q":"If P(A)=2/9, what is P(not A)?","o":["2/9","4/9","7/9","1"],"a":2,"e":"P(not A)=1−2/9=7/9."},{"d":"MEDIUM","q":"A bag contains 4 white and 6 black marbles. One is drawn, replaced, then another is drawn. Probability both are white:","o":["2/5","4/25","8/25","16/25"],"a":1,"e":"With replacement, P(white twice)=(4/10)×(4/10)=16/100=4/25."},{"d":"HARD","q":"A fair die is rolled twice. What is the probability of getting two sixes?","o":["1/6","1/12","1/18","1/36"],"a":3,"e":"The rolls are independent: (1/6)×(1/6)=1/36."},{"d":"HARD","q":"A bag contains 3 red and 2 blue balls. Two balls are drawn without replacement. Probability both are red:","o":["1/5","3/10","2/5","3/5"],"a":1,"e":"P=3/5×2/4=6/20=3/10."},{"d":"HARD","q":"A fair die is rolled. What is the probability of getting a prime number or an even number?","o":["1/2","2/3","5/6","1"],"a":2,"e":"Union outcomes are 2, 3, 4, 5, 6: 5/6. Correct option is 5/6."},{"d":"HARD","q":"A coin is tossed 3 times. What is the probability of getting exactly 2 heads?","o":["1/8","3/8","1/2","5/8"],"a":1,"e":"Three outcomes have exactly two heads (HHT, HTH, THH) out of 8 equally likely outcomes: 3/8."},{"d":"HARD","q":"A number is chosen from 1 to 30. Find the probability it is divisible by 2 or 5.","o":["1/2","3/5","2/3","4/5"],"a":1,"e":"Multiples of 2: 15; multiples of 5: 6; overlap multiples of 10: 3. Union=15+6−3=18; probability=18/30=3/5."},{"d":"HARD","q":"A box has 5 red and 3 blue balls. Two balls are drawn without replacement. Probability they are different colours:","o":["15/28","15/32","3/8","5/8"],"a":0,"e":"P(RB)+P(BR)=(5/8×3/7)+(3/8×5/7)=30/56=15/28."},{"d":"HARD","q":"An event occurred 45 times in 60 trials. If the same experimental rate is used to estimate its occurrence in 200 trials, how many occurrences are expected?","o":["120","135","150","160"],"a":2,"e":"Rate=45/60=3/4; estimated occurrences=200×3/4=150."},{"d":"HARD","q":"A fair die is rolled. What is the probability of getting a number that is neither prime nor 1?","o":["1/6","1/3","1/2","2/3"],"a":1,"e":"Numbers neither prime nor 1 are 4 and 6; probability=2/6=1/3."},{"d":"HARD","q":"Two fair coins are tossed. Given that at least one head occurs, what is the probability both are heads?","o":["1/4","1/3","1/2","2/3"],"a":1,"e":"Possible outcomes with at least one head are HH, HT, TH. One of these three is HH, so probability=1/3."},{"d":"HARD","q":"A box contains 4 red, 3 blue and 3 green balls. One ball is selected at random. What is the probability it is not blue?","o":["3/10","4/10","7/10","9/10"],"a":2,"e":"Not blue means red or green: (4+3)/10=7/10."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Calculate event probabilities</strong><small>Count favourable outcomes</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Compare theoretical and experimental probability</strong><small>Solve chance problems</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Use complements and independent events</strong><small>Interpret repeated trials</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
