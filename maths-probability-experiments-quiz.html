<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261013-probability-experiments-duolingo-v1"><title>Probability Experiments | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Probability experiments</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"A fair coin is tossed once. What is the probability of getting heads?","o":["1/2","1/4","1","0"],"a":0,"e":"There are two equally likely outcomes and one is heads, so the probability is 1/2.","v":"probability-experiments"},{"d":"BASIC","q":"A fair six-sided die is rolled. What is the probability of rolling a 4?","o":["1/4","1/6","1/2","1/3"],"a":1,"e":"Only one of the six equally likely faces shows 4.","v":"probability-experiments"},{"d":"BASIC","q":"A fair die is rolled. What is the probability of getting an even number?","o":["1/6","2/3","1/2","1/3"],"a":2,"e":"The even outcomes are 2, 4 and 6: 3/6 = 1/2.","v":"probability-experiments"},{"d":"BASIC","q":"A bag contains 3 red balls and 2 blue balls. One ball is picked at random. What is P(red)?","o":["2/5","1/3","1/2","3/5"],"a":3,"e":"Three of the five balls are red, so P(red) = 3/5.","v":"probability-experiments"},{"d":"BASIC","q":"An event is certain to occur. What is its probability?","o":["1","0","1/2","Cannot be determined"],"a":0,"e":"A certain event has probability 1.","v":"probability-experiments"},{"d":"BASIC","q":"An impossible event has probability:","o":["1","0","1/2","2"],"a":1,"e":"An impossible event has probability zero.","v":"probability-experiments"},{"d":"BASIC","q":"A fair coin is tossed. What is the probability of not getting tails?","o":["0","1","1/2","1/4"],"a":2,"e":"Not tails means heads, which has probability 1/2 for a fair coin.","v":"probability-experiments"},{"d":"BASIC","q":"A spinner has 4 equal sectors numbered 1 to 4. What is P(getting a number greater than 2)?","o":["1/4","3/4","1","1/2"],"a":3,"e":"The favorable numbers are 3 and 4, so 2/4 = 1/2.","v":"probability-experiments"},{"d":"BASIC","q":"A fair die is rolled. What is the probability of getting a number greater than 6?","o":["0","1/6","1","1/2"],"a":0,"e":"A standard die has no face greater than 6, so the event is impossible.","v":"probability-experiments"},{"d":"BASIC","q":"Which value can be a probability?","o":["−0.2","0.7","1.4","3/2"],"a":1,"e":"Probabilities must lie between 0 and 1 inclusive; 0.7 is valid.","v":"probability-experiments"},{"d":"MEDIUM","q":"A fair die is rolled. What is the probability of getting a prime number?","o":["1/3","2/3","1/2","1/6"],"a":2,"e":"The prime faces are 2, 3 and 5, giving 3/6 = 1/2.","v":"probability-experiments"},{"d":"MEDIUM","q":"A bag has 5 green, 3 yellow and 2 red balls. What is P(yellow)?","o":["1/3","2/10","1/2","3/10"],"a":3,"e":"There are 3 yellow balls among 10 total, so the probability is 3/10.","v":"probability-experiments"},{"d":"MEDIUM","q":"A fair coin is tossed twice. What is the probability of getting two heads?","o":["1/4","1/2","3/4","1/3"],"a":0,"e":"The equally likely outcomes are HH, HT, TH and TT; only HH has two heads.","v":"probability-experiments"},{"d":"MEDIUM","q":"A fair die is rolled. What is the probability of getting a number less than 3?","o":["1/2","1/3","1/6","2/3"],"a":1,"e":"The favorable faces are 1 and 2, so 2/6 = 1/3.","v":"probability-experiments"},{"d":"MEDIUM","q":"A box contains 4 white and 6 black counters. One is chosen randomly. What is P(not black)?","o":["3/5","1/2","2/5","1/5"],"a":2,"e":"Not black means white; 4/10 simplifies to 2/5.","v":"probability-experiments"},{"d":"MEDIUM","q":"A letter is selected at random from the word MATHS. What is the probability it is a vowel?","o":["2/5","1/2","3/5","1/5"],"a":3,"e":"Only A is a vowel among the five letters, so the probability is 1/5.","v":"probability-experiments"},{"d":"MEDIUM","q":"A fair die is rolled 60 times. Based on the theoretical probability, how many sixes would be expected?","o":["10","6","12","20"],"a":0,"e":"Expected count = 60 × 1/6 = 10.","v":"probability-experiments"},{"d":"MEDIUM","q":"A spinner has 8 equal sectors, 3 of them blue. What is P(not blue)?","o":["3/8","5/8","1/2","1/8"],"a":1,"e":"Five sectors are not blue, so the probability is 5/8.","v":"probability-experiments"},{"d":"MEDIUM","q":"A bag has 4 red and 6 blue balls. One ball is selected and replaced; then another is selected. What is the probability both are red?","o":["2/5","8/25","4/25","16/25"],"a":2,"e":"With replacement, each red probability is 4/10, so (4/10)² = 4/25.","v":"probability-experiments"},{"d":"MEDIUM","q":"A fair coin is tossed three times. What is the probability of getting exactly three tails?","o":["1/4","3/8","1/2","1/8"],"a":3,"e":"Only TTT meets the condition among 2³ = 8 equally likely outcomes.","v":"probability-experiments"},{"d":"HARD","q":"Two fair dice are rolled. What is the probability their sum is 7?","o":["1/6","1/12","1/9","1/3"],"a":0,"e":"Six of the 36 ordered outcomes sum to 7, so 6/36 = 1/6.","v":"probability-experiments"},{"d":"HARD","q":"Two fair dice are rolled. What is the probability both show the same number?","o":["1/12","1/6","1/3","1/2"],"a":1,"e":"There are 6 matching pairs among 36 outcomes, giving 6/36 = 1/6.","v":"probability-experiments"},{"d":"HARD","q":"A bag has 3 red and 2 blue balls. Two balls are drawn without replacement. What is the probability both are red?","o":["9/25","1/2","3/10","2/5"],"a":2,"e":"P = 3/5 × 2/4 = 6/20 = 3/10.","v":"probability-experiments"},{"d":"HARD","q":"A fair die is rolled twice. What is the probability of getting at least one 6?","o":["1/6","1/3","5/36","11/36"],"a":3,"e":"Use the complement: 1 − P(no six twice) = 1 − (5/6)² = 11/36.","v":"probability-experiments"},{"d":"HARD","q":"A fair die is rolled. What is the probability of getting a factor of 6?","o":["2/3","1/2","1/3","5/6"],"a":0,"e":"The factors among die faces are 1, 2, 3 and 6, so 4/6 = 2/3.","v":"probability-experiments"},{"d":"HARD","q":"A box has 5 defective and 15 working bulbs. One bulb is chosen randomly. What is P(working)?","o":["1/4","3/4","2/3","4/5"],"a":1,"e":"There are 15 working bulbs out of 20, so 15/20 = 3/4.","v":"probability-experiments"},{"d":"HARD","q":"Two fair coins are tossed. What is the probability of exactly one head?","o":["1/4","3/4","1/2","1"],"a":2,"e":"HT and TH are favorable among HH, HT, TH and TT, so 2/4 = 1/2.","v":"probability-experiments"},{"d":"HARD","q":"A fair die is rolled. What is the probability of getting a number that is both even and greater than 3?","o":["1/2","1/6","2/3","1/3"],"a":3,"e":"The qualifying faces are 4 and 6, so 2/6 = 1/3.","v":"probability-experiments"},{"d":"HARD","q":"A bag has 4 red, 3 green and 5 blue balls. One ball is chosen, replaced, then another is chosen. What is P(red then blue)?","o":["5/36","1/3","1/6","5/12"],"a":0,"e":"With replacement, P = 4/12 × 5/12 = 20/144 = 5/36.","v":"probability-experiments"},{"d":"HARD","q":"A fair coin is tossed four times. What is the probability of getting no heads?","o":["1/8","1/16","1/4","1/2"],"a":1,"e":"Only TTTT has no heads among 2⁴ = 16 equally likely outcomes.","v":"probability-experiments"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Explore random experiments and equally likely outcomes</strong><small>Sample spaces and probability</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Calculate probabilities for coins, dice and draws</strong><small>Use theoretical probability in experiments</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Connect side counts, angles and diagonals</strong><small>Solve equations reducible to linear form</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>\n<script src="/shared-nav.js?v=20261013-universal-nav-v1"></script>\n</body></html>
