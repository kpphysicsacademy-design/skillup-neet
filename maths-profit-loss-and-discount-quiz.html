<style>

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"A shopkeeper buys a pen for ₹20 and sells it for ₹25. What is the profit?","o":["₹5","₹4","₹6","₹45"],"a":0,"e":"Profit = selling price − cost price = ₹25 − ₹20 = ₹5.","v":"profit-loss-and-discount"},{"d":"BASIC","q":"An item costs ₹80 and is sold for ₹70. What is the loss?","o":["₹8","₹10","₹12","₹150"],"a":1,"e":"Loss = cost price − selling price = ₹80 − ₹70 = ₹10.","v":"profit-loss-and-discount"},{"d":"BASIC","q":"A toy costs ₹150 and is sold for ₹180. Find the profit percentage on cost price.","o":["25%","15%","20%","30%"],"a":2,"e":"Profit is ₹30; (30 ÷ 150) × 100 = 20%.","v":"profit-loss-and-discount"},{"d":"BASIC","q":"A book bought for ₹200 is sold for ₹180. Find the loss percentage.","o":["20%","8%","12%","10%"],"a":3,"e":"Loss is ₹20; (20 ÷ 200) × 100 = 10%.","v":"profit-loss-and-discount"},{"d":"BASIC","q":"The marked price of a shirt is ₹500. A discount of 10% is given. What is the discount amount?","o":["₹50","₹40","₹60","₹450"],"a":0,"e":"10% of ₹500 is ₹50.","v":"profit-loss-and-discount"},{"d":"BASIC","q":"A ₹600 bag is sold at a 15% discount. What is its selling price?","o":["₹515","₹510","₹500","₹540"],"a":1,"e":"Discount = ₹90; selling price = ₹600 − ₹90 = ₹510.","v":"profit-loss-and-discount"},{"d":"BASIC","q":"An item is bought for ₹90 and sold for ₹90. What is the result?","o":["10% loss","10% profit","No profit and no loss","₹90 profit"],"a":2,"e":"Selling price equals cost price, so there is neither profit nor loss.","v":"profit-loss-and-discount"},{"d":"BASIC","q":"A bicycle costs ₹1,000 and earns a profit of ₹200. What is its selling price?","o":["₹1,020","₹800","₹1,100","₹1,200"],"a":3,"e":"Selling price = ₹1,000 + ₹200 = ₹1,200.","v":"profit-loss-and-discount"},{"d":"BASIC","q":"A ₹400 item is sold for ₹360. What is the loss percentage?","o":["10%","9%","12%","15%"],"a":0,"e":"Loss = ₹40; (40 ÷ 400) × 100 = 10%.","v":"profit-loss-and-discount"},{"d":"BASIC","q":"The marked price is ₹250 and the discount is ₹25. What is the discount percentage?","o":["5%","10%","12%","15%"],"a":1,"e":"(25 ÷ 250) × 100 = 10%.","v":"profit-loss-and-discount"},{"d":"MEDIUM","q":"A trader buys a chair for ₹1,200 and sells it for ₹1,380. Find the profit percentage.","o":["18%","12%","15%","20%"],"a":2,"e":"Profit = ₹180; (180 ÷ 1,200) × 100 = 15%.","v":"profit-loss-and-discount"},{"d":"MEDIUM","q":"An appliance bought for ₹2,500 is sold at a 12% loss. Find the selling price.","o":["₹2,300","₹2,180","₹2,250","₹2,200"],"a":3,"e":"Loss = 12% of ₹2,500 = ₹300; selling price = ₹2,200.","v":"profit-loss-and-discount"},{"d":"MEDIUM","q":"A shopkeeper marks an item at ₹800 and gives a 15% discount. Find the selling price.","o":["₹680","₹700","₹720","₹660"],"a":0,"e":"Discount = ₹120; ₹800 − ₹120 = ₹680.","v":"profit-loss-and-discount"},{"d":"MEDIUM","q":"A product costs ₹640. At what price should it be sold to earn 25% profit?","o":["₹760","₹800","₹820","₹840"],"a":1,"e":"25% of ₹640 is ₹160; selling price = ₹800.","v":"profit-loss-and-discount"},{"d":"MEDIUM","q":"An article is sold for ₹540 at a 10% loss. What was its cost price?","o":["₹620","₹594","₹600","₹650"],"a":2,"e":"₹540 is 90% of cost price; ₹540 ÷ 0.9 = ₹600.","v":"profit-loss-and-discount"},{"d":"MEDIUM","q":"A shop gives successive discounts of 10% and 20% on ₹1,000. What is the final price?","o":["₹800","₹700","₹750","₹720"],"a":3,"e":"After 10% off: ₹900; after 20% off: ₹720.","v":"profit-loss-and-discount"},{"d":"MEDIUM","q":"A trader buys 12 notebooks for ₹240 and sells each notebook for ₹25. Find the total profit.","o":["₹60","₹40","₹50","₹80"],"a":0,"e":"Cost per notebook is ₹20; profit per notebook is ₹5, so total profit is ₹60.","v":"profit-loss-and-discount"},{"d":"MEDIUM","q":"A shopkeeper sells an item for ₹960 and makes a 20% profit. Find the cost price.","o":["₹780","₹800","₹820","₹840"],"a":1,"e":"₹960 is 120% of cost price; ₹960 ÷ 1.2 = ₹800.","v":"profit-loss-and-discount"},{"d":"MEDIUM","q":"A marked price of ₹1,500 is reduced to ₹1,275. Find the discount percentage.","o":["17%","12%","15%","20%"],"a":2,"e":"Discount = ₹225; (225 ÷ 1,500) × 100 = 15%.","v":"profit-loss-and-discount"},{"d":"MEDIUM","q":"A seller buys 5 identical lamps for ₹1,750 and sells each for ₹400. Find the total result.","o":["No profit or loss","₹250 loss","₹200 profit","₹250 profit"],"a":3,"e":"Total selling price = ₹2,000; profit = ₹2,000 − ₹1,750 = ₹250.","v":"profit-loss-and-discount"},{"d":"HARD","q":"An article is sold for ₹1,440 at a profit of 20%. What is its cost price?","o":["₹1,200","₹1,180","₹1,250","₹1,300"],"a":0,"e":"₹1,440 = 120% of cost price; cost price = ₹1,440 ÷ 1.2 = ₹1,200.","v":"profit-loss-and-discount"},{"d":"HARD","q":"A shopkeeper marks goods 40% above cost price and gives a 15% discount on the marked price. What is the profit percentage?","o":["20%","19%","15%","25%"],"a":1,"e":"For cost ₹100, marked price ₹140; after 15% discount selling price ₹119, giving 19% profit.","v":"profit-loss-and-discount"},{"d":"HARD","q":"A dealer buys an item for ₹2,400. At what price must it be sold to make a 12.5% profit?","o":["₹2,720","₹2,650","₹2,700","₹2,800"],"a":2,"e":"12.5% of ₹2,400 is ₹300; selling price = ₹2,700.","v":"profit-loss-and-discount"},{"d":"HARD","q":"A seller incurs a 10% loss by selling an item for ₹720. At what price should it be sold to gain 20%?","o":["₹980","₹900","₹940","₹960"],"a":3,"e":"Cost price = ₹720 ÷ 0.9 = ₹800; 120% of ₹800 = ₹960.","v":"profit-loss-and-discount"},{"d":"HARD","q":"A marked price of ₹2,000 receives discounts of 20% and then 5%. Find the final price.","o":["₹1,520","₹1,500","₹1,550","₹1,600"],"a":0,"e":"After 20% off: ₹1,600; 5% off ₹1,600 is ₹80, leaving ₹1,520.","v":"profit-loss-and-discount"},{"d":"HARD","q":"A shopkeeper sells two items for ₹600 each. On one, there is a 20% profit; on the other, a 20% loss. What is the overall result?","o":["No profit or loss","₹50 loss","₹40 loss","₹50 profit"],"a":1,"e":"Costs are ₹600 ÷ 1.2 = ₹500 and ₹600 ÷ 0.8 = ₹750; total cost ₹1,250 versus sales ₹1,200, a ₹50 loss.","v":"profit-loss-and-discount"},{"d":"HARD","q":"A trader buys 30 items at ₹40 each. Five are damaged and unsellable. At what price per remaining item must the trader sell the rest to make ₹150 profit overall?","o":["₹48","₹50","₹54","₹55"],"a":2,"e":"Total cost = ₹1,200; target sales = ₹1,350 over 25 items; ₹1,350 ÷ 25 = ₹54.","v":"profit-loss-and-discount"},{"d":"HARD","q":"A shopkeeper gives a 25% discount and still makes a 20% profit. If the cost price is ₹600, what was the marked price?","o":["₹840","₹900","₹1,000","₹960"],"a":3,"e":"Required selling price = 120% of ₹600 = ₹720; this is 75% of marked price, so marked price = ₹720 ÷ 0.75 = ₹960.","v":"profit-loss-and-discount"},{"d":"HARD","q":"A seller sells an item at 8% loss for ₹1,104. What selling price would give a 15% profit?","o":["₹1,380","₹1,350","₹1,400","₹1,420"],"a":0,"e":"Cost price = ₹1,104 ÷ 0.92 = ₹1,200; at 15% profit, price = ₹1,380.","v":"profit-loss-and-discount"},{"d":"HARD","q":"An item is marked 50% above its cost price. What discount percentage on the marked price gives exactly 20% profit?","o":["15%","20%","25%","30%"],"a":1,"e":"For cost ₹100, marked price ₹150 and target selling price ₹120; discount = ₹30/₹150 = 20%.","v":"profit-loss-and-discount"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Calculate profit and loss</strong><small>Cost price, selling price and profit percentage</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Discounts and successive discounts</strong><small>Real-world profit, loss and discount problems</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply percentages to real-life situations</strong><small>Reason about perfect squares and nearest squares</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
