</head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Profit and Loss</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button" disabled>Check answer</button></div></section></main><section class="skill-panel"><div class="skill-title">🎯 Skills you will practise</div><div class="skill-list"><div class="skill-item">Calculate cost price, selling price, profit and loss</div><div class="skill-item">Find profit and loss percentages</div><div class="skill-item">Solve discount and marked-price problems</div></div></section></div><script>(function(){'use strict';const questions=[{d:"BASIC",q:"A pen costs ₹20 and sells for ₹25. What is the profit?",o:["₹3","₹5","₹20","₹45"],a:1,e:"Profit = selling price − cost price = ₹25 − ₹20 = ₹5."},{d:"BASIC",q:"A toy costs ₹80 and sells for ₹70. What is the loss?",o:["₹10","₹70","₹80","₹150"],a:0,e:"Loss = cost price − selling price = ₹80 − ₹70 = ₹10."},{d:"BASIC",q:"A book is bought for ₹120 and sold for ₹150. Find the profit percentage.",o:["20%","25%","30%","35%"],a:1,e:"Profit = ₹30; profit percentage = 30/120 × 100 = 25%."},{d:"BASIC",q:"An item costs ₹200 and is sold at a loss of ₹40. What is its selling price?",o:["₹140","₹160","₹200","₹240"],a:1,e:"Selling price = cost price − loss = ₹200 − ₹40 = ₹160."},{d:"BASIC",q:"If cost price is ₹500 and selling price is ₹550, the result is:",o:["Loss of ₹50","Profit of ₹50","No profit, no loss","Profit of ₹1,050"],a:1,e:"Selling price exceeds cost price by ₹50."},{d:"BASIC",q:"A shopkeeper buys a bag for ₹300 and sells it for ₹270. Find the loss percentage.",o:["5%","10%","15%","30%"],a:1,e:"Loss = ₹30; loss percentage = 30/300 × 100 = 10%."},{d:"BASIC",q:"What is the cost price if selling price is ₹90 and profit is ₹15?",o:["₹75","₹90","₹105","₹115"],a:0,e:"Cost price = selling price − profit = ₹90 − ₹15 = ₹75."},{d:"BASIC",q:"A chair bought for ₹800 is sold for ₹800. What is the result?",o:["20% profit","20% loss","No profit, no loss","₹800 profit"],a:2,e:"When cost price equals selling price, there is no profit or loss."},{d:"BASIC",q:"A ₹400 item is sold at a 25% profit. What is the profit amount?",o:["₹25","₹75","₹100","₹125"],a:2,e:"25% of ₹400 = ₹100."},{d:"BASIC",q:"A watch bought for ₹600 is sold at a 10% loss. Find its selling price.",o:["₹540","₹560","₹590","₹660"],a:0,e:"10% of ₹600 is ₹60; selling price = ₹600 − ₹60 = ₹540."},{d:"MEDIUM",q:"An item costs ₹750 and sells for ₹900. Find the profit percentage.",o:["15%","20%","25%","30%"],a:1,e:"Profit = ₹150; 150/750 × 100 = 20%."},{d:"MEDIUM",q:"A bicycle is sold for ₹1,080 at a 10% loss. What was its cost price?",o:["₹972","₹1,100","₹1,200","₹1,280"],a:2,e:"Selling price is 90% of cost price; cost price = 1080/0.9 = ₹1,200."},{d:"MEDIUM",q:"A trader buys 12 notebooks for ₹240 and sells each for ₹25. Find the total profit.",o:["₹40","₹50","₹60","₹300"],a:2,e:"Total selling price = 12 × ₹25 = ₹300; profit = ₹300 − ₹240 = ₹60."},{d:"MEDIUM",q:"An item is sold for ₹840 after a profit of 20%. Find its cost price.",o:["₹672","₹700","₹720","₹1,008"],a:1,e:"Selling price = 120% of cost price; 840/1.2 = ₹700."},{d:"MEDIUM",q:"A merchant buys a table for ₹1,500 and spends ₹100 on repairs. It sells for ₹1,920. Find the profit.",o:["₹320","₹420","₹520","₹620"],a:0,e:"Total cost = ₹1,600; profit = ₹1,920 − ₹1,600 = ₹320."},{d:"MEDIUM",q:"A shopkeeper sells an article for ₹460 and makes a loss of ₹40. Find the cost price.",o:["₹420","₹460","₹500","₹520"],a:2,e:"Cost price = selling price + loss = ₹460 + ₹40 = ₹500."},{d:"MEDIUM",q:"A product costs ₹2,000 and is sold for ₹2,300. Profit percentage is:",o:["10%","12%","15%","20%"],a:2,e:"Profit = ₹300; 300/2000 × 100 = 15%."},{d:"MEDIUM",q:"A seller marks an item at ₹1,000 and gives a discount of ₹100. If its cost was ₹750, find profit percentage.",o:["10%","15%","20%","25%"],a:2,e:"Selling price = ₹900; profit = ₹150; 150/750 × 100 = 20%."},{d:"MEDIUM",q:"If an article is sold at a 15% loss for ₹680, its cost price is:",o:["₹578","₹700","₹800","₹850"],a:1,e:"Selling price is 85% of cost price; 680/0.85 = ₹800."},{d:"MEDIUM",q:"A shop buys 5 lamps for ₹1,250 and sells all of them for ₹1,500. Profit percentage is:",o:["10%","15%","20%","25%"],a:2,e:"Profit = ₹250; 250/1250 × 100 = 20%."},{d:"HARD",q:"An article is sold for ₹1,440 at a profit of 20%. Find the cost price.",o:["₹1,080","₹1,150","₹1,200","₹1,728"],a:2,e:"Cost price = 1440/1.2 = ₹1,200."},{d:"HARD",q:"A trader sells an item at a 10% loss for ₹1,080. At what price must it be sold to earn a 20% profit?",o:["₹1,200","₹1,320","₹1,440","₹1,500"],a:2,e:"Cost price = 1080/0.9 = ₹1,200; 120% of ₹1,200 = ₹1,440."},{d:"HARD",q:"A shopkeeper buys an item for ₹800, marks it 25% above cost, then gives a 10% discount on the marked price. What is the profit percentage?",o:["10%","12.5%","15%","25%"],a:1,e:"Marked price = ₹1,000; selling price = ₹900; profit = ₹100, or 12.5%."},{d:"HARD",q:"A seller sells two items for ₹600 each. One sale earns 20% profit and the other makes 20% loss. Overall result is:",o:["No profit, no loss","2% loss","4% loss","4% profit"],a:2,e:"Cost prices are ₹500 and ₹750; total cost ₹1,250 versus sales ₹1,200 gives ₹50 loss = 4%."},{d:"HARD",q:"A merchant uses a cost price of ₹900, adds ₹150 transport charges, and sells for ₹1,260. Find profit percentage on total cost.",o:["10%","15%","20%","25%"],a:2,e:"Total cost = ₹1,050; profit = ₹210; 210/1050 × 100 = 20%."},{d:"HARD",q:"An item is marked 40% above cost and sold after a 15% discount on marked price. Profit percentage is:",o:["15%","19%","20%","25%"],a:1,e:"For cost ₹100, marked price ₹140; sale price ₹119, so profit is 19%."},{d:"HARD",q:"A shopkeeper wants a 25% profit after allowing a 10% discount. If cost price is ₹720, what should the marked price be?",o:["₹900","₹950","₹1,000","₹1,100"],a:2,e:"Required selling price = ₹900; this is 90% of marked price, so marked price = ₹1,000."},{d:"HARD",q:"A product sells for ₹1,725 at a 15% profit. Find the cost price.",o:["₹1,400","₹1,500","₹1,550","₹1,600"],a:1,e:"Cost price = 1725/1.15 = ₹1,500."},{d:"HARD",q:"A shopkeeper buys 20 items at ₹45 each. Five are damaged and unsellable. At what price per remaining item must the shopkeeper sell to break even?",o:["₹45","₹50","₹60","₹75"],a:2,e:"Total cost = ₹900; 15 items must recover ₹900, so each sells for ₹60."},{d:"HARD",q:"A trader gains 10% by selling an article for ₹1,320. If the selling price is reduced to ₹1,200, the result compared with cost price is:",o:["10% profit","No profit, no loss","5% loss","10% loss"],a:1,e:"Cost price = 1320/1.1 = ₹1,200, equal to the reduced selling price."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id);function updateProgress(){const p=index>=questions.length?100:index/questions.length*100;$('bar').style.width=p+'%';const pb=document.querySelector('[role="progressbar"]');if(pb)pb.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){if(index>=questions.length){results();return;}const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · PROFIT & LOSS';$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';const content=$('content');content.replaceChildren();const question=document.createElement('div');question.className='question';question.textContent=q.q;content.appendChild(question);const choices=document.createElement('div');choices.className='choices';content.appendChild(choices);q.o.forEach((answer,i)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=answer;b.addEventListener('click',()=>{if(locked)return;selected=i;choices.querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===i));$('action').disabled=false;});choices.appendChild(b);});$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';if(window.skillupCelebrate)window.skillupCelebrate();}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===selected&&!good)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Explanation: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();}else results();}function results(){finished=true;updateProgress();$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='🏆 Profit and Loss complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const content=$('content');content.replaceChildren();const end=document.createElement('div');end.className='end';const title=document.createElement('h1');title.textContent=correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!';end.appendChild(title);const score=document.createElement('div');score.className='score';score.textContent=correct+' / '+questions.length;end.appendChild(score);const p=document.createElement('p');p.textContent='You answered '+correct+' questions correctly.';end.appendChild(p);const summary=document.createElement('div');summary.className='summary';summary.innerHTML='⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining';end.appendChild(summary);content.appendChild(end);$('action').textContent='Try again ↻';$('action').disabled=false;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished)restart();else act();});try{render();}catch(error){$('content').textContent='Quiz could not start. Please refresh the page.';console.error('Profit and Loss quiz initialization failed',error);}})();</script>><script src="/shared-nav.js?v=20261017-duolingo-standard-v1"></script></body></html>
