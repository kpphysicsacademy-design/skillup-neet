<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Which fraction is a proper fraction?","o":["7/5","3/8","9/9","11/6"],"a":1,"e":"A proper fraction has a numerator smaller than its positive denominator.","v":""},{"d":"BASIC","q":"Which fraction is an improper fraction?","o":["2/7","4/9","8/5","1/6"],"a":2,"e":"An improper fraction has a numerator greater than or equal to its denominator.","v":""},{"d":"BASIC","q":"In the fraction 5/9, what is the numerator?","o":["9","5","14","4"],"a":1,"e":"The numerator is the number written above the fraction bar.","v":""},{"d":"BASIC","q":"In the fraction 7/12, what is the denominator?","o":["7","5","12","19"],"a":2,"e":"The denominator is the number below the fraction bar.","v":""},{"d":"BASIC","q":"Which fraction is equal to one whole?","o":["3/4","5/6","4/4","2/5"],"a":2,"e":"A fraction with equal numerator and denominator equals one whole.","v":""},{"d":"BASIC","q":"Which fraction is less than 1?","o":["6/5","9/8","4/7","7/7"],"a":2,"e":"A positive fraction is less than one when its numerator is smaller than its denominator.","v":""},{"d":"BASIC","q":"Which fraction is greater than 1?","o":["3/8","5/5","7/4","2/9"],"a":2,"e":"A positive fraction with numerator greater than denominator is greater than one.","v":""},{"d":"BASIC","q":"A pizza is cut into 8 equal slices. Riya eats 3 slices. What fraction of the pizza did she eat?","o":["3/8","8/3","5/8","3/5"],"a":0,"e":"The eaten part is 3 slices out of 8 equal slices.","v":""},{"d":"BASIC","q":"Which statement about 2/5 is correct?","o":["It is an improper fraction","Its numerator is 5","It is a proper fraction","It equals 1 whole"],"a":2,"e":"Since 2 is smaller than 5, the fraction is proper and less than one.","v":""},{"d":"BASIC","q":"Which fraction has numerator equal to denominator?","o":["5/8","6/6","3/7","4/9"],"a":1,"e":"Equal numerator and denominator represent one whole.","v":""},{"d":"MEDIUM","q":"Which improper fraction equals 2 1/3?","o":["5/3","
