s="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Proper and improper fractions</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Proper and improper fractions skills"><div class="skill-title">🎯 Fraction Skills</div><div class="skill-list"><div class="skill-item">Identify proper and improper fractions</div><div class="skill-item">Convert improper fractions to mixed numbers</div><div class="skill-item">Recognize fractions less than, equal to, or greater than one</div></div></section></div><script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Which fraction is a proper fraction?","o":["7/5","3/8","9/9","11/6"],"a":1,"e":"A proper fraction has a numerator smaller than its positive denominator.","v":""},{"d":"BASIC","q":"Which fraction is an improper fraction?","o":["2/7","4/9","8/5","1/6"],"a":2,"e":"An improper fraction has a numerator greater than or equal to its denominator.","v":""},{"d":"BASIC","q":"In the fraction 5/9, what is the numerator?","o":["9","5","14","4"],"a":1,"e":"The numerator is the number written above the fraction bar.","v":""},{"d":"BASIC","q":"In the fraction 7/12, what is the denominator?","o":["7","5","12","19"],"a":2,"e":"The denominator is the number below the fraction bar.","v":""},{"d":"BASIC","q":"Which fraction is equal to one whole?","o":["3/4","5/6","4/4","2/5"],"a":2,"e":"A fraction with equal numerator and denominator equals one whole.","v":""},{"d":"BASIC","q":"Which fraction is less than 1?","o":["6/5","9/8","4/7","7/7"],"a":2,"e":"A positive fraction is less than one when its numerator is smaller than its denominator.","v":""},{"d":"BASIC","q":"Which fraction is greater than 1?","o":["3/8","5/5","7/4","2/9"],"a":2,"e":"A positive fraction with numerator greater than denominator is greater than one.","v":""},{"d":"BASIC","q":"A pizza is cut into 8 equal slices. Riya eats 3 slices. What fraction of the pizza did she eat?","o":["3/8","8/3","5/8","3/5"],"a":0,"e":"The eaten part is 3 slices out of 8 equal slices.","v":""},{"d":"BASIC","q":"Which statement about 2/5 is correct?","o":["It is an improper fraction","Its numerator is 5","It is a proper fraction","It equals 1 whole"],"a":2,"e":"Since 2 is smaller than 5, the fraction is proper and less than one.","v":""},{"d":"BASIC","q":"Which fraction has numerator equal to denominator?","o":["5/8","6/6","3/7","4/9"],"a":1,"e":"Equal numerator and denominator represent one whole.","v":""},{"d":"MEDIUM","q":"Which improper fraction equals 2 1/3?","o":["5/3","6/3","7/3","4/3"],"a":2,"e":"Two wholes are 6/3; adding 1/3 gives 7/3.","v":""},{"d":"MEDIUM","q":"Convert 11/4 to a mixed number.","o":["2 3/4","3 1/4","2 1/4","1 3/4"],"a":0,"e":"Eleven divided by four gives quotient 2 and remainder 3.","v":""},{"d":"MEDIUM","q":"Which mixed number equals 9/2?","o":["3 1/2","4 1/2","2 1/2","5 1/2"],"a":1,"e":"Nine halves contain four whole groups of two halves and one half left.","v":""},{"d":"MEDIUM","q":"Which fraction is improper but equal to 1?","o":["5/4","4/5","7/7","3/8"],"a":2,"e":"An improper fraction can equal one when numerator and denominator are equal.","v":""},{"d":"MEDIUM","q":"A ribbon is 7/6 metres long. Which description is correct?","o":["Less than 1 metre","Exactly 1 metre","More than 1 metre","Exactly 6 metres"],"a":2,"e":"Since 7/6 = 1 1/6, the ribbon is longer than one metre.","v":""},{"d":"MEDIUM","q":"Which fraction is proper and closest to 1?","o":["2/9","7/8","3/5","4/7"],"a":1,"e":"Among these proper fractions, 7/8 is nearest to one.","v":""},{"d":"MEDIUM","q":"A fraction has numerator 5 and denominator 3. Which statement is true?","o":["It is proper and less than 1","It is improper and greater than 1","It equals 1","It is a whole number"],"a":1,"e":"Five is greater than three, so 5/3 is improper and greater than one.","v":""},{"d":"MEDIUM","q":"Which mixed number represents 13/5?","o":["2 3/5","3 2/5","1 3/5","2 2/5"],"a":0,"e":"Thirteen divided by five gives quotient 2 and remainder 3.","v":""},{"d":"MEDIUM","q":"Which improper fraction equals 3 wholes?","o":["3/1","3/2","2/3","1/3"],"a":0,"e":"Three wholes can be written as 3/1, with numerator at least as large as denominator.","v":""},{"d":"MEDIUM","q":"A class has 12 equal sections on a chart and 9 are shaded. Which fraction describes the shaded part, and what type is it?","o":["9/12, proper","12/9, proper","9/12, improper","12/9, improper"],"a":0,"e":"Nine is less than twelve, so 9/12 is a proper fraction.","v":""},{"d":"HARD","q":"Which improper fraction is equivalent to 4 2/7?","o":["26/7","28/7","30/7","32/7"],"a":2,"e":"Four wholes equal 28/7; adding 2/7 gives 30/7.","v":""},{"d":"HARD","q":"A water tank is 11/4 full-tank units in a measurement model. Express 11/4 as a mixed number.","o":["2 1/4","2 3/4","3 1/4","1 3/4"],"a":1,"e":"Eleven fourths make two wholes (8/4) with 3/4 remaining.","v":""},{"d":"HARD","q":"Which option orders these fractions from least to greatest: 3/4, 5/4, 2/4?","o":["2/4, 3/4, 5/4","3/4, 2/4, 5/4","5/4, 3/4, 2/4","2/4, 5/4, 3/4"],"a":0,"e":"All have denominator 4, so compare the numerators: 2 < 3 < 5.","v":""},{"d":"HARD","q":"A recipe needs 7/3 cups of flour. How many whole cups and what fraction of a cup is that?","o":["1 2/3 cups","2 1/3 cups","3 1/2 cups","2 2/3 cups"],"a":1,"e":"Seven thirds equal six thirds plus one third, or 2 1/3.","v":""},{"d":"HARD","q":"Which fraction lies between 1 and 2?","o":["5/6","9/4","7/5","2/9"],"a":2,"e":"Seven fifths is 1 2/5, which is greater than one and less than two.","v":""},{"d":"HARD","q":"A student says 8/8 is a proper fraction because the numerator is not greater than the denominator. What is the best correction?","o":["8/8 is proper and less than 1","8/8 is improper and equals 1","8/8 is improper and greater than 1","8/8 is not a fraction"],"a":1,"e":"Improper fractions include equality; 8/8 equals one whole.","v":""},{"d":"HARD","q":"A baker uses 17/6 kg of flour. Express this amount as a mixed number.","o":["2 5/6 kg","3 1/6 kg","2 1/6 kg","3 5/6 kg"],"a":0,"e":"Seventeen divided by six gives quotient 2 and remainder 5.","v":""},{"d":"HARD","q":"Which improper fraction is equal to 5 3/8?","o":["38/8","40/8","43/8","45/8"],"a":2,"e":"Five wholes equal 40/8; adding 3/8 gives 43/8.","v":""},{"d":"HARD","q":"A rope is 15/4 m long. It is described using whole metres and a fraction of a metre. Which is correct?","o":["3 3/4 m","2 3/4 m","4 1/4 m","3 1/4 m"],"a":0,"e":"Fifteen fourths make twelve fourths (3 m) plus 3/4 m.","v":""},{"d":"HARD","q":"Which statement is always true for a positive proper fraction?","o":["Numerator is greater than denominator","Its value is greater than 1","Numerator is smaller than denominator","It must equal 1/2"],"a":2,"e":"A positive proper fraction has numerator smaller than its denominator; its value is below one.","v":""}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');const visuals={

};function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const skills=[['Identify proper and improper fractions',8],['Convert improper fractions to mixed numbers',18],['Compare fractions with one whole',24]];$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🍕</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+skills.map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script>\n<script src="/shared-nav.js?v=20261013-universal-nav-v1"></script>\n</body></html>
