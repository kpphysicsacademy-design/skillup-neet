<section class="hero">
<h1>⚖️ Properties of Operations</h1>
<p class="muted">Commutative · Associative · Distributive · Identity</p>

<div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div>
<div class="track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>

</section>

</main>
<script>
(function(){
'use strict';
const questions=[{"q":"Which property is shown by 5 + (−3) = (−3) + 5?","o":["Commutative property of addition","Associative property of addition","Distributive property","Additive identity"],"a":0,"why":"Changing the order of the addends does not change their sum."},{"q":"Which property is shown by (−2 × 4) × 3 = −2 × (4 × 3)?","o":["Commutative","Associative","Distributive","Closure"],"a":1,"why":"The grouping changes, but the factors remain in the same order."},{"q":"Which property is shown by 7 × (−5 + 2) = 7 × (−5) + 7 × 2?","o":["Additive identity","Commutative","Distributive","Associative"],"a":2,"why":"Multiplication is distributed over each addend inside the brackets."},{"q":"What is the additive identity for integers?","o":["−1","0","1","10"],"a":1,"why":"Adding zero leaves every integer unchanged."},{"q":"What is the multiplicative identity for integers?","o":["−1","0","1","10"],"a":2,"why":"Multiplying any integer by one leaves it unchanged."},{"q":"Which number is the additive inverse of −12?","o":["−12","0","12","1/12"],"a":2,"why":"A number and its additive inverse add to zero."},{"q":"Which statement demonstrates the commutative property of integer multiplication?","o":["(−4) × 6 = 6 × (−4)","(−4) × (6 × 2) = ((−4) × 6) × 2","(−4) × (6 + 2) = (−4 × 6) + (−4 × 2)","(−4) × 1 = −4"],"a":0,"why":"The two factors exchange positions while the product remains the same."},{"q":"Which operation on integers is not commutative?","o":["Addition","Multiplication","Subtraction","Both addition and multiplication"],"a":2,"why":"For example, 8 − 3 is not equal to 3 − 8."},{"q":"Which operation on integers is associative?","o":["Subtraction","Division","Addition","Neither addition nor multiplication"],"a":2,"why":"Integer addition can be regrouped without changing the sum."},{"q":"Which statement about integer division is correct?","o":["Division is always commutative","Division is always associative","Division by zero is defined","Integer division is not generally commutative or associative"],"a":3,"why":"Changing the order or grouping in division can change the result; division by zero is undefined."},{"q":"Evaluate (−6) + 0 using the additive identity property.","o":["0","6","−6","−1"],"a":2,"why":"Zero is the additive identity, so the value stays −6."},{"q":"Evaluate (−9) × 1 using the multiplicative identity property.","o":["−9","9","0","−10"],"a":0,"why":"One is the multiplicative identity, so the value stays −9."},{"q":"Which is the additive inverse of 23?","o":["23","−23","0","1"],"a":1,"why":"23 + (−23) = 0."},{"q":"Which is the multiplicative inverse of 5?","o":["−5","0","1/5","5"],"a":2,"why":"The reciprocal 1/5 multiplied by 5 gives 1; it is not an integer, so this is not closure within integers."},{"q":"Are integers closed under addition?","o":["Yes, the sum of any two integers is an integer","No, every sum is a fraction","Only positive integers are closed","Only equal integers are closed"],"a":0,"why":"Adding any two integers always produces another integer."},{"q":"Are integers closed under subtraction?","o":["No, subtraction can never give an integer","Yes, the difference of any two integers is an integer","Only positive differences are integers","Only subtraction by zero is allowed"],"a":1,"why":"The difference of two integers is always an integer."},{"q":"Are integers closed under multiplication?","o":["Yes, the product of any two integers is an integer","No, products are always fractions","Only positive products are integers","Only multiplication by one is allowed"],"a":0,"why":"The product of two integers is always an integer."},{"q":"Are integers closed under division?","o":["Yes, every quotient is an integer","No, for example 1 ÷ 2 is not an integer","Only negative quotients are integers","Division by one is not an integer"],"a":1,"why":"1 ÷ 2 = 0.5, which is not an integer."},{"q":"Which equation shows the zero property of multiplication?","o":["−8 + 0 = −8","−8 × 0 = 0","−8 − 0 = 0","−8 ÷ 0 = 0"],"a":1,"why":"Any integer multiplied by zero equals zero."},{"q":"Which expression is equal to 4 × (−7 + 3)?","o":["4 × (−7) + 3","4 × (−7) + 4 × 3","(4 × −7) × 3","4 + (−7) + 3"],"a":1,"why":"Apply the distributive property by multiplying 4 by both terms."},{"q":"Which is equal to (−5 + 8) + 2 by the associative property?","o":["−5 + (8 + 2)","(−5 + 2) + 8 only","−5 × (8 + 2)","(−5 − 8) + 2"],"a":0,"why":"Associativity changes grouping while preserving the order of the addends."},{"q":"Which equality demonstrates that integer addition is commutative?","o":["−11 + 4 = 4 + (−11)","−11 + (4 + 2) = (−11 + 4) + 2","−11 + 0 = −11","−11 + 11 = 0"],"a":0,"why":"The same two addends are written in reverse order."},{"q":"Which equality demonstrates that integer multiplication is associative?","o":["(−2 × 5) × 3 = −2 × (5 × 3)","−2 × 5 = 5 × (−2)","−2 × (5 + 3) = −2 × 5 + −2 × 3","−2 × 1 = −2"],"a":0,"why":"The parentheses move but the order of the factors stays the same."},{"q":"Simplify 6 × (−4 + 9) using the distributive property.","o":["−24 + 54 = 30","−24 + 9 = −15","6 − 4 + 9 = 11","−4 + 9 = 5"],"a":0,"why":"Distribute 6: 6 × (−4) + 6 × 9 = −24 + 54 = 30."},{"q":"Which expression has the same value as (−3 × 7) + (−3 × 2)?","o":["−3 × (7 + 2)","(−3 + 7) × 2","−3 × (7 − 2)","(−3 × 7) × 2"],"a":0,"why":"Factor out the common factor −3 using the distributive property in reverse."},{"q":"Which statement is false for all integers?","o":["a + b = b + a","a × b = b × a","a − b = b − a","a + 0 = a"],"a":2,"why":"Subtraction is not commutative; for example, 5 − 2 ≠ 2 − 5."},{"q":"Which statement is false for all non-zero integers a, b and c where the expressions are defined?","o":["(a × b) × c = a × (b × c)","(a + b) + c = a + (b + c)","(a ÷ b) ÷ c = a ÷ (b ÷ c)","a × b = b × a"],"a":2,"why":"Division is not associative; for example, (24 ÷ 6) ÷ 2 = 2 but 24 ÷ (6 ÷ 2) = 8."},{"q":"If a = −7 and b = 4, what is a + b compared with b + a?","o":["a + b is greater","b + a is greater","They are equal","Their sum is zero"],"a":2,"why":"Both sums equal −3, illustrating commutativity of addition."},{"q":"If a = −3, evaluate a × (0 + 5) using the distributive property.","o":["−15","−8","8","15"],"a":0,"why":"−3 × 0 + (−3 × 5) = 0 − 15 = −15."},{"q":"Which set of properties is correctly matched?","o":["Addition—identity 1; multiplication—identity 0","Addition—identity 0; multiplication—identity 1","Subtraction—commutative; division—associative","Multiplication—identity −1; addition—identity 1"],"a":1,"why":"Zero is the additive identity and one is the multiplicative identity."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Properties of Operations Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261104-physics-path-layout-v2" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
