const originalQuestions=[{"id":"b01","d":"BASIC","q":"Which property is illustrated by 14 + 9 = 9 + 14?","o":["Associative","Commutative","Distributive","Identity"],"a":1,"e":"The commutative property of addition allows the addends to exchange places."},{"id":"b02","d":"BASIC","q":"What is the additive identity for whole numbers?","o":["0","1","10","There is no additive identity"],"a":0,"e":"Adding 0 to any whole number leaves that number unchanged."},{"id":"b03","d":"BASIC","q":"Evaluate 63 × 1.","o":["0","1","63","64"],"a":2,"e":"One is the multiplicative identity, so 63 × 1 = 63."},{"id":"b04","d":"BASIC","q":"Which expression shows the zero property of multiplication?","o":["28 + 0 = 28","28 × 1 = 28","28 × 0 = 0","28 + 1 = 29"],"a":2,"e":"Multiplying any whole number by 0 gives 0."},{"id":"b05","d":"BASIC","q":"Which equation demonstrates the associative property of addition?","o":["6 + 4 = 4 + 6","(6 + 4) + 3 = 6 + (4 + 3)","6 × (4 + 3) = 6 × 4 + 6 × 3","6 + 0 = 6"],"a":1,"e":"Associativity changes the grouping of addends while keeping their order."},{"id":"b06","d":"BASIC","q":"Which of these is a whole number?","o":["−4","2/3","5.2","0"],"a":3,"e":"Whole numbers are 0 and the positive integers."},{"id":"b07","d":"BASIC","q":"Which expression is equivalent to 7 × (8 + 2)?","o":["7 × 8 + 2","7 × 8 + 7 × 2","7 + 8 × 2","7 × 8 × 2"],"a":1,"e":"The distributive property gives 7 × 8 + 7 × 2."},{"id":"b08","d":"BASIC","q":"What is 0 + 125?","o":["0","1","125","126"],"a":2,"e":"Zero is the additive identity, so the sum is 125."},{"id":"b09","d":"BASIC","q":"Which operation is commutative on whole numbers?","o":["Subtraction","Division","Multiplication","Both subtraction and division"],"a":2,"e":"Multiplication is commutative: changing factor order does not change the product."},{"id":"b10","d":"BASIC","q":"Which statement is true for every whole number n?","o":["n × 0 = n","n + 0 = n","n × 1 = 0","n + 1 = n"],"a":1,"e":"Adding the additive identity 0 leaves n unchanged."},{"id":"m11","d":"MEDIUM","q":"Evaluate 25 × 16 by regrouping the factors.","o":["100","250","400","425"],"a":2,"e":"Write 16 as 4 × 4: 25 × 4 × 4 = 100 × 4 = 400."},{"id":"m12","d":"MEDIUM","q":"Which equation shows the associative property of multiplication?","o":["5 × 7 = 7 × 5","(5 × 7) × 2 = 5 × (7 × 2)","5 × (7 + 2) = 35 + 10","5 × 1 = 5"],"a":1,"e":"The factors remain in the same order while the grouping changes."},{"id":"m13","d":"MEDIUM","q":"Simplify 9 × 13 + 9 × 7 using a property of whole numbers.","o":["9 × 20 = 180","9 × 6 = 54","18 × 20 = 360","9 + 13 + 7 = 29"],"a":0,"e":"Factor out 9: 9 × (13 + 7) = 9 × 20 = 180."},{"id":"m14","d":"MEDIUM","q":"Which operation is not closed on the set of whole numbers?","o":["Addition","Multiplication","Subtraction","Both addition and multiplication"],"a":2,"e":"For example, 3 − 8 = −5, which is not a whole number."},{"id":"m15","d":"MEDIUM","q":"Which expression has the same value as 48 × 5?","o":["48 × (10 ÷ 2)","48 + 5","48 × 10 + 2","48 × (5 + 1)"],"a":0,"e":"Since 10 ÷ 2 = 5, the expression is equal to 48 × 5."},{"id":"m16","d":"MEDIUM","q":"Find 125 × 24 using regrouping.","o":["2,000","2,500","3,000","3,125"],"a":2,"e":"125 × 24 = 125 × (8 × 3) = 1,000 × 3 = 3,000."},{"id":"m17","d":"MEDIUM","q":"Which statement about whole-number addition is always true?","o":["It is commutative and associative","It is commutative but not associative","It is associative but not commutative","It has no identity element"],"a":0,"e":"Whole-number addition satisfies both commutative and associative properties."},{"id":"m18","d":"MEDIUM","q":"Use the distributive property to expand 12 × (20 − 3).","o":["12 × 20 − 3","12 × 20 − 12 × 3","12 + 20 − 3","12 × 20 + 12 × 3"],"a":1,"e":"Multiplication distributes over subtraction: 12 × 20 − 12 × 3."},{"id":"m19","d":"MEDIUM","q":"Which number makes 84 × □ = 84 true?","o":["0","1","2","84"],"a":1,"e":"The multiplicative identity is 1, so 84 × 1 = 84."},{"id":"m20","d":"MEDIUM","q":"Evaluate 36 + (14 + 6) by choosing a convenient grouping.","o":["50","56","60","66"],"a":1,"e":"Add 14 + 6 first to make 20; then 36 + 20 = 56."},{"id":"h21","d":"HARD","q":"Calculate 125 × 48 using a convenient regrouping.","o":["5,000","5,500","6,000","6,250"],"a":2,"e":"125 × 48 = 125 × (8 × 6) = 1,000 × 6 = 6,000."},{"id":"h22","d":"HARD","q":"Simplify 37 × 19 + 63 × 19.","o":["1,000","1,700","1,900","2,000"],"a":2,"e":"Factor out 19: (37 + 63) × 19 = 100 × 19 = 1,900."},{"id":"h23","d":"HARD","q":"Which statement is false for whole numbers?","o":["Addition is associative","Multiplication is commutative","Subtraction is commutative","Multiplication distributes over addition"],"a":2,"e":"Subtraction is not commutative; for example, 9 − 4 = 5 but 4 − 9 is not 5."},{"id":"h24","d":"HARD","q":"Find 998 × 7 using a difference from 1,000.","o":["6,986","6,990","6,993","7,006"],"a":0,"e":"998 × 7 = (1,000 − 2) × 7 = 7,000 − 14 = 6,986."},{"id":"h25","d":"HARD","q":"Evaluate 16 × 25 × 4 by regrouping.","o":["400","800","1,200","1,600"],"a":3,"e":"Group 25 × 4 = 100; then 16 × 100 = 1,600."},{"id":"h26","d":"HARD","q":"Which expression is equal to 45 × 102?","o":["45 × 100 + 2","45 × 100 + 45 × 2","45 + 100 × 2","45 × 100 − 45 × 2"],"a":1,"e":"Distribute 45 over 100 + 2: 4,500 + 90 = 4,590."},{"id":"h27","d":"HARD","q":"If a and b are whole numbers, which statement is always true?","o":["a − b = b − a","a ÷ b = b ÷ a","a × b = b × a","a + b = a"],"a":2,"e":"Multiplication of whole numbers is commutative, so the factors may be exchanged."},{"id":"h28","d":"HARD","q":"Simplify 75 × 32 + 25 × 32.","o":["2,800","3,000","3,200","3,500"],"a":2,"e":"Factor out 32: (75 + 25) × 32 = 100 × 32 = 3,200."},{"id":"h29","d":"HARD","q":"Which calculation correctly uses the associative property to evaluate 4 × 25 × 7?","o":["(4 × 25) × 7 = 700","4 × (25 + 7) = 128","(4 + 25) × 7 = 203","4 × 25 + 7 = 107"],"a":0,"e":"Regrouping gives 100 × 7 = 700; the order of the factors is unchanged."},{"id":"h30","d":"HARD","q":"A shop packs 8 boxes with 25 pencils each. Which property helps calculate 8 × 25 as 4 × (2 × 25)?","o":["Commutative property of addition","Associative property of multiplication","Additive identity property","Zero property"],"a":1,"e":"Regrouping the factors gives 4 × (2 × 25) = 4 × 50 = 200."}];
let questions=originalQuestions.slice(),index=0,selected=-1,locked=false,xp=0,correct=0,streak=0;

function make(tag,cls,txt){const el=document.createElement(tag);if(cls)el.className=cls;if(txt!==undefined)el.textContent=txt;return el;}
function updateProgress(){const pct=Math.round(index/questions.length*100);$('fill').style.width=pct+'%';$('percent').textContent=pct+'%';$('progressText').textContent='Question '+Math.min(index+1,questions.length)+' of '+questions.length;document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(pct));}

function checkAnswer(){if(selected<0||locked)return;locked=true;const q=questions[index],isCorrect=selected===q.a;if(isCorrect){correct++;xp+=10;streak++;$('xp').textContent=String(xp);$('streak').textContent=String(streak);}else{streak=0;$('streak').textContent='0';mistakes.push({id:q.id,question:q.q,chosen:q.o[selected],answer:q.o[q.a],explanation:q.e});}

function restart(wrongOnly){const retry=wrongOnly?originalQuestions.filter(q=>mistakes.some(m=>m.id===q.id)):originalQuestions.slice();questions=retry;index=0;selected=-1;locked=false;xp=0;correct=0;streak=0;mistakes=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();}
function finish(){updateProgress();$('quiz').style.display='none';const slot=$('finishSlot');slot.replaceChildren();const card=make('section','finish');const trophy=make('div','trophy','🏆');const heading=make('h2', '',correct>=25?'Excellent work!':correct>=18?'Good progress!':'Keep practising!');const simulator=make('a','topic-link','🧪 Explore Properties Simulator →');simulator.href='maths-properties-whole-numbers-simulator.html?v=20261111-properties-whole-numbers-simulator-v1';const score=make('div','score',correct+' / '+questions.length);const summary=make('p','muted','You answered '+correct+' correctly and earned '+xp+' XP.');const accuracy=make('p','',Math.round(correct/questions.length*100)+'% accuracy');card.append(trophy,heading,simulator,score,summary,accuracy);
const review=make('div','review');review.append(make('h3','',mistakes.length?'Review your mistakes ('+mistakes.length+')':'Perfect round!'));mistakes.forEach((m,i)=>{const item=make('div','review-item');item.append(make('b','',(i+1)+'. '+m.question),make('p','your-answer','Your answer: '+m.chosen),make('p','correct-answer','Correct answer: '+m.answer),make('p','',m.explanation));review.append(item);});card.append(review);
const actions=make('div','review-actions');const wrong=make('button','btn secondary','Retry mistakes');wrong.type='button';wrong.disabled=!mistakes.length;wrong.addEventListener('click',()=>restart(true));const all=make('button','btn primary','Retry all');all.type='button';all.addEventListener('click',()=>restart(false));actions.append(wrong,all);card.append(actions);slot.append(card);}

})();
