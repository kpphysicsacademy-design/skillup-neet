<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Properties of whole numbers</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Which property is shown by 7 + 5 = 5 + 7?","o":["Associative","Commutative","Distributive","Identity"],"a":1,"e":"The commutative property says changing the order of addends does not change the sum."},{"d":"BASIC","q":"Which property is shown by 4 × 9 = 9 × 4?","o":["Commutative property of multiplication","Associative property","Zero property","Distributive property"],"a":0,"e":"The factors can change order without changing the product."},{"d":"BASIC","q":"What is 36 + 0?","o":["0","1","36","37"],"a":2,"e":"Zero is the additive identity: adding 0 leaves a number unchanged."},{"d":"BASIC","q":"What is 18 × 1?","o":["0","1","18","19"],"a":2,"e":"One is the multiplicative identity: multiplying by 1 leaves a number unchanged."},{"d":"BASIC","q":"Which expression shows the associative property of addition?","o":["2 + 3 = 3 + 2","(2 + 3) + 4 = 2 + (3 + 4)","2 × (3 + 4) = 2 × 3 + 2 × 4","2 + 0 = 2"],"a":1,"e":"Associative property changes grouping, not order."},{"d":"BASIC","q":"What is 25 × 0?","o":["25","1","0","250"],"a":2,"e":"Any whole number multiplied by zero gives zero."},{"d":"BASIC","q":"Which is a whole number?","o":["−2","3/5","4.7","8"],"a":3,"e":"Whole numbers are 0 and the positive integers."},{"d":"BASIC","q":"Which expression is equal to 6 × (10 + 2)?","o":["6 × 10 + 2","6 × 10 + 6 × 2","6 + 10 × 2","6 × 12 + 2"],"a":1,"e":"The distributive property gives 6 × 10 + 6 × 2."},{"d":"BASIC","q":"Which operation is commutative for whole numbers?","o":["Subtraction","Division","Addition","Neither addition nor multiplication"],"a":2,"e":"Whole-number addition is commutative; multiplication is too."},{"d":"BASIC","q":"Which is the additive identity?","o":["0","1","10","−1"],"a":0,"e":"Adding zero leaves a whole number unchanged."},{"d":"MEDIUM","q":"Evaluate 12 + 8 + 5 by regrouping.","o":["12 + (8 + 5) = 25","(12 + 8) + 5 = 20","12 × (8 + 5) = 25","12 + 8 + 5 = 120"],"a":0,"e":"Associativity lets us group 8 + 5 first: 12 + 13 = 25."},{"d":"MEDIUM","q":"Which equation shows the distributive property?","o":["3 × (4 + 2) = 3 × 4 + 3 × 2","3 + 4 = 4 + 3","(3 × 4) × 2 = 3 × (4 × 2)","3 × 1 = 3"],"a":0,"e":"Multiplication distributes over addition."},{"d":"MEDIUM","q":"Find 25 × 16 using a convenient grouping.","o":["25 × (4 × 4) = 400","25 + 16 = 41","25 × 16 = 41","25 × (10 + 6) = 250 + 6"],"a":0,"e":"Since 16 = 4 × 4, 25 × 16 = 100 × 4 = 400."},{"d":"MEDIUM","q":"Which statement is always true for whole numbers a and b?","o":["a − b = b − a","a + b = b + a","a ÷ b = b ÷ a","a × b = a + b"],"a":1,"e":"Addition is commutative for whole numbers."},{"d":"MEDIUM","q":"Which is an example of the associative property of multiplication?","o":["2 × 5 = 5 × 2","(2 × 5) × 3 = 2 × (5 × 3)","2 × (5 + 3) = 10 + 6","2 × 1 = 2"],"a":1,"e":"Associativity changes the grouping of factors."},{"d":"MEDIUM","q":"Simplify 8 × 17 + 8 × 3 using the distributive property.","o":["8 × 20 = 160","8 × 14 = 112","8 + 17 + 3 = 28","136 + 3 = 139"],"a":0,"e":"Factor out 8: 8 × (17 + 3) = 8 × 20 = 160."},{"d":"MEDIUM","q":"Which operation does NOT have a whole-number result for every pair of whole numbers?","o":["Addition","Multiplication","Subtraction","Both addition and multiplication"],"a":2,"e":"For example, 3 − 5 = −2, which is not a whole number."},{"d":"MEDIUM","q":"What is 19 × 100 using place value?","o":["190","1,009","1,900","19,000"],"a":2,"e":"Multiplying by 100 shifts the digits two places: 1,900."},{"d":"MEDIUM","q":"Which expression equals 45 × 11?","o":["45 × (10 + 1)","45 + 11","45 × 10 + 1","45 × (10 − 1)"],"a":0,"e":"11 = 10 + 1, so use the distributive property."},{"d":"MEDIUM","q":"Which number makes 57 + □ = 57 true?","o":["0","1","57","114"],"a":0,"e":"Zero is the additive identity."},{"d":"HARD","q":"Evaluate 125 × 32 using regrouping.","o":["4,000","3,000","2,500","4,500"],"a":0,"e":"125 × 32 = 125 × (8 × 4) = 1,000 × 4 = 4,000."},{"d":"HARD","q":"Simplify 49 × 27 + 51 × 27.","o":["100 × 27 = 2,700","100 × 54 = 5,400","49 × 78 = 3,822","27 + 100 = 127"],"a":0,"e":"Factor 27: (49 + 51) × 27 = 100 × 27 = 2,700."},{"d":"HARD","q":"Which statement is false for whole numbers?","o":["Addition is associative","Multiplication is associative","Subtraction is commutative","Multiplication distributes over addition"],"a":2,"e":"Subtraction is not commutative: 9 − 4 is not equal to 4 − 9."},{"d":"HARD","q":"Calculate 999 × 8 using a convenient difference.","o":["7,992","8,000","7,900","7,982"],"a":0,"e":"999 × 8 = (1,000 − 1) × 8 = 8,000 − 8 = 7,992."},{"d":"HARD","q":"If a × (b + c) = a × b + a × c, which property is used?","o":["Commutative","Associative","Distributive","Identity"],"a":2,"e":"This is the distributive property of multiplication over addition."},{"d":"HARD","q":"Simplify 16 × 35 × 5 by regrouping.","o":["2,800","2,600","1,750","800"],"a":0,"e":"Regroup as 16 × (35 × 5) = 16 × 175 = 2,800."},{"d":"HARD","q":"Which equation illustrates both commutativity and associativity of addition?","o":["(2 + 7) + 3 = 2 + (7 + 3)","(2 + 7) + 3 = (7 + 2) + 3","Both A and B","2 + 0 = 2"],"a":2,"e":"A changes grouping (associativity); B changes order (commutativity)."},{"d":"HARD","q":"Find 48 × 25 by regrouping.","o":["1,200","1,000","1,250","980"],"a":0,"e":"48 × 25 = 12 × (4 × 25) = 12 × 100 = 1,200."},{"d":"HARD","q":"Which statement about division is correct?","o":["Division is commutative for whole numbers","Division by zero is allowed","Division of whole numbers is not always a whole number","Division is always associative"],"a":2,"e":"For example, 5 ÷ 2 = 2.5, not a whole number."},{"d":"HARD","q":"Evaluate 75 × 16 + 25 × 16.","o":["1,600","1,500","1,200","1,000"],"a":0,"e":"Factor out 16: (75 + 25) × 16 = 100 × 16 = 1,600."}];let index=0,selected=-1,locked=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🔢</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(index>=questions.length){restart();return;}act();});render();})();</script></body></html>
