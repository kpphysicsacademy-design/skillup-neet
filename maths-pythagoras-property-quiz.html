<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"A right triangle has legs 3 cm and 4 cm. Find the hypotenuse.","o":["5 cm","6 cm","7 cm","8 cm"],"a":0,"e":"3² + 4² = 25, so the hypotenuse is 5 cm.","v":"pythagoras-property"},{"d":"BASIC","q":"The legs of a right triangle are 5 cm and 12 cm. Find its hypotenuse.","o":["13 cm","15 cm","17 cm","10 cm"],"a":0,"e":"5² + 12² = 169, so the hypotenuse is 13 cm.","v":"pythagoras-property"},{"d":"BASIC","q":"A right triangle has hypotenuse 10 cm and one leg 6 cm. Find the other leg.","o":["4 cm","6 cm","8 cm","9 cm"],"a":2,"e":"The missing leg is √(10² − 6²) = √64 = 8 cm.","v":"pythagoras-property"},{"d":"BASIC","q":"Which side is the hypotenuse of a right triangle?","o":["The shortest side","The side opposite the right angle","Either side forming the right angle","Always the vertical side"],"a":1,"e":"The hypotenuse is opposite the 90° angle and is the longest side.","v":"pythagoras-property"},{"d":"BASIC","q":"A right triangle has legs 8 cm and 15 cm. Find the hypotenuse.","o":["16 cm","17 cm","18 cm","23 cm"],"a":1,"e":"8² + 15² = 289, so the hypotenuse is 17 cm.","v":"pythagoras-property"},{"d":"BASIC","q":"Which set can be the sides of a right triangle?","o":["2, 3, 4","6, 8, 10","4, 5, 6","5, 6, 7"],"a":1,"e":"6² + 8² = 10², so this is a right-triangle triple.","v":"pythagoras-property"},{"d":"BASIC","q":"A right triangle has hypotenuse 13 cm and one leg 5 cm. Find the other leg.","o":["8 cm","10 cm","12 cm","14 cm"],"a":2,"e":"The other leg is √(13² − 5²) = √144 = 12 cm.","v":"pythagoras-property"},{"d":"BASIC","q":"If the legs of a right triangle are both 1 cm, what is the square of its hypotenuse?","o":["1 cm²","2 cm²","3 cm²","4 cm²"],"a":1,"e":"The theorem gives c² = 1² + 1² = 2 cm².","v":"pythagoras-property"},{"d":"BASIC","q":"A ladder reaches 12 m up a wall, and its foot is 5 m from the wall. How long is the ladder?","o":["13 m","15 m","17 m","7 m"],"a":0,"e":"The ladder is the hypotenuse: √(12² + 5²) = 13 m.","v":"pythagoras-property"},{"d":"BASIC","q":"For a right triangle with legs a and b and hypotenuse c, which equation is correct?","o":["a + b = c","a² + b² = c²","a² − b² = c²","2a + 2b = c"],"a":1,"e":"The theorem states that the squares of the legs sum to the square of the hypotenuse.","v":"pythagoras-property"},{"d":"MEDIUM","q":"A rectangle is 9 cm long and 12 cm wide. Find its diagonal.","o":["13 cm","15 cm","18 cm","21 cm"],"a":1,"e":"The diagonal is √(9² + 12²) = 15 cm.","v":"pythagoras-property"},{"d":"MEDIUM","q":"A right triangle has hypotenuse 17 cm and one leg 8 cm. Find the other leg.","o":["9 cm","12 cm","15 cm","16 cm"],"a":2,"e":"The other leg is √(17² − 8²) = 15 cm.","v":"pythagoras-property"},{"d":"MEDIUM","q":"A square has side length 6 cm. What is the square of its diagonal length?","o":["12 cm²","18 cm²","36 cm²","72 cm²"],"a":3,"e":"The diagonal squared is 6² + 6² = 72 cm².","v":"pythagoras-property"},{"d":"MEDIUM","q":"A 13 m cable connects the top of a pole to a point 5 m from its base. How tall is the pole?","o":["8 m","10 m","12 m","18 m"],"a":2,"e":"Height = √(13² − 5²) = 12 m.","v":"pythagoras-property"},{"d":"MEDIUM","q":"Which triple satisfies the Pythagorean theorem?","o":["7, 8, 9","8, 15, 17","9, 10, 12","4, 6, 8"],"a":1,"e":"8² + 15² = 17².","v":"pythagoras-property"},{"d":"MEDIUM","q":"A right triangle has legs x and 2x, and hypotenuse √20 cm. Find x.","o":["1 cm","2 cm","√5 cm","4 cm"],"a":1,"e":"x² + 4x² = 20, so 5x² = 20 and x = 2 cm.","v":"pythagoras-property"},{"d":"MEDIUM","q":"A rectangle's diagonal is 25 cm and one side is 7 cm. Find the other side.","o":["18 cm","20 cm","24 cm","32 cm"],"a":2,"e":"The other side is √(25² − 7²) = 24 cm.","v":"pythagoras-property"},{"d":"MEDIUM","q":"A right triangle has legs 9 cm and 12 cm. What is its area?","o":["21 cm²","42 cm²","54 cm²","108 cm²"],"a":2,"e":"Area = ½ × 9 × 12 = 54 cm².","v":"pythagoras-property"},{"d":"MEDIUM","q":"A right triangle has hypotenuse 10 cm and one leg 8 cm. Find its area.","o":["16 cm²","24 cm²","30 cm²","40 cm²"],"a":1,"e":"The other leg is 6 cm, so area = ½ × 8 × 6 = 24 cm².","v":"pythagoras-property"},{"d":"MEDIUM","q":"A point is 12 m east and 5 m north of a starting point. What is the straight-line distance?","o":["7 m","13 m","17 m","60 m"],"a":1,"e":"Distance = √(12² + 5²) = 13 m.","v":"pythagoras-property"},{"d":"HARD","q":"A right triangle has legs 9 cm and 12 cm. If both legs are doubled, what is the new hypotenuse?","o":["15 cm","24 cm","30 cm","36 cm"],"a":2,"e":"The original hypotenuse is 15 cm; doubling both legs doubles it to 30 cm.","v":"pythagoras-property"},{"d":"HARD","q":"A right triangle has legs 7 cm and 24 cm. Find its hypotenuse.","o":["25 cm","26 cm","28 cm","31 cm"],"a":0,"e":"7² + 24² = 625, so the hypotenuse is 25 cm.","v":"pythagoras-property"},{"d":"HARD","q":"A rectangle has perimeter 70 cm and one side 15 cm. Find its diagonal.","o":["20 cm","25 cm","30 cm","35 cm"],"a":1,"e":"The other side is 20 cm; diagonal = √(15² + 20²) = 25 cm.","v":"pythagoras-property"},{"d":"HARD","q":"A right triangle has hypotenuse 26 cm and one leg 10 cm. Find the other leg.","o":["16 cm","20 cm","24 cm","25 cm"],"a":2,"e":"The other leg is √(26² − 10²) = 24 cm.","v":"pythagoras-property"},{"d":"HARD","q":"A square's diagonal is 10√2 cm. Find its side length.","o":["5 cm","10 cm","20 cm","50 cm"],"a":1,"e":"For a square, diagonal = side × √2, so the side is 10 cm.","v":"pythagoras-property"},{"d":"HARD","q":"A right triangle has legs 2x and 3x, and hypotenuse 13 cm. Find x.","o":["√13","√17","√20","√26"],"a":0,"e":"4x² + 9x² = 169, so 13x² = 169 and x = √13.","v":"pythagoras-property"},{"d":"HARD","q":"A 15 m pole casts a shadow 8 m long. Find the distance from the top of the pole to the shadow tip.","o":["17 m","18 m","20 m","23 m"],"a":0,"e":"Distance = √(15² + 8²) = 17 m.","v":"pythagoras-property"},{"d":"HARD","q":"A right triangle has hypotenuse 20 cm and one leg 16 cm. Find its area.","o":["48 cm²","80 cm²","96 cm²","160 cm²"],"a":2,"e":"The other leg is 12 cm, so area = ½ × 16 × 12 = 96 cm².","v":"pythagoras-property"},{"d":"HARD","q":"Which set forms an obtuse triangle, not a right triangle?","o":["5, 12, 13","7, 24, 25","6, 8, 11","9, 12, 15"],"a":2,"e":"6² + 8² = 100, which is less than 11² = 121; the angle opposite 11 is obtuse.","v":"pythagoras-property"},{"d":"HARD","q":"A rectangle has sides 10 cm and 24 cm. A square has the same diagonal. Find the square's side.","o":["13 cm","13√2 cm","26 cm","26√2 cm"],"a":1,"e":"The rectangle diagonal is 26 cm; square side = 26/√2 = 13√2 cm.","v":"pythagoras-property"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}const visuals={
balance:'',
blocks:'',
bars:'',
picture:''
};function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🔢</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+'<div class="skill-item '+(correct>=8?'unlocked':'')+'">'+(correct>=8?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Apply the Pythagorean theorem</div>'+'<div class="skill-item '+(correct>=18?'unlocked':'')+'">'+(correct>=18?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Find missing lengths in right triangles</div>'+'<div class="skill-item '+(correct>=24?'unlocked':'')+'">'+(correct>=24?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Apply triangle inequality and perimeter</div>'+'</div></div>' ;$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script>
