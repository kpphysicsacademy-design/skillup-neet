<main>
<section class="hero">

<p class="muted">Identify the four quadrants, understand coordinate signs and locate ordered pairs in the Cartesian plane.</p>

<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"In which quadrant are both coordinates positive?","o":["Quadrant I","Quadrant II","Quadrant III","Quadrant IV"],"a":0,"why":"Quadrant I has x>0 and y>0."},{"d":"BASIC","q":"In which quadrant is x negative and y positive?","o":["Quadrant I","Quadrant II","Quadrant III","Quadrant IV"],"a":1,"why":"Quadrant II has x<0 and y>0."},{"d":"BASIC","q":"In which quadrant are both coordinates negative?","o":["Quadrant I","Quadrant II","Quadrant III","Quadrant IV"],"a":2,"why":"Quadrant III has x<0 and y<0."},{"d":"BASIC","q":"In which quadrant is x positive and y negative?","o":["Quadrant I","Quadrant II","Quadrant III","Quadrant IV"],"a":3,"why":"Quadrant IV has x>0 and y<0."},{"d":"BASIC","q":"Which point lies in Quadrant I?","o":["(−2, 3)","(3, 2)","(−3, −2)","(2, −3)"],"a":1,"why":"Both coordinates of (3,2) are positive."},{"d":"BASIC","q":"Which point lies in Quadrant II?","o":["(4, 5)","(−4, 5)","(−4, −5)","(4, −5)"],"a":1,"why":"Its x-coordinate is negative and y-coordinate is positive."},{"d":"BASIC","q":"Which point lies in Quadrant III?","o":["(−1, −7)","(1, −7)","(−1, 7)","(1, 7)"],"a":0,"why":"Both coordinates are negative."},{"d":"BASIC","q":"Which point lies in Quadrant IV?","o":["(−3, 4)","(−3, −4)","(3, −4)","(3, 4)"],"a":2,"why":"The x-coordinate is positive and y-coordinate negative."},{"d":"BASIC","q":"Does a point on the x-axis belong to any quadrant?","o":["Always Quadrant I","Always Quadrant III","No, it lies on an axis","Always Quadrant IV"],"a":2,"why":"Points on either axis are not inside any quadrant."},{"d":"BASIC","q":"What are the signs of coordinates in Quadrant II?","o":["(+,+)","(−,+)","(−,−)","(+,−)"],"a":1,"why":"In Quadrant II, x is negative and y is positive."},{"d":"MEDIUM","q":"A point has coordinates (−6, 2). In which quadrant does it lie?","o":["I","II","III","IV"],"a":1,"why":"Negative x and positive y place it in Quadrant II."},{"d":"MEDIUM","q":"A point lies in Quadrant IV. Which could be its coordinates?","o":["(−5, 1)","(−5, −1)","(5, −1)","(5, 1)"],"a":2,"why":"Quadrant IV requires positive x and negative y."},{"d":"MEDIUM","q":"Which point is not in any quadrant?","o":["(2, 3)","(−2, 3)","(0, −3)","(−2, −3)"],"a":2,"why":"The point (0,−3) lies on the y-axis."},{"d":"MEDIUM","q":"If x>0 and y>0, where is the point?","o":["Quadrant I","Quadrant II","Quadrant III","Quadrant IV"],"a":0,"why":"Both positive coordinates indicate Quadrant I."},{"d":"MEDIUM","q":"If x<0 and y<0, where is the point?","o":["Quadrant I","Quadrant II","Quadrant III","Quadrant IV"],"a":2,"why":"Both negative coordinates indicate Quadrant III."},{"d":"MEDIUM","q":"Which point has the same quadrant as (−7, 4)?","o":["(−2, 8)","(2, 8)","(−2, −8)","(2, −8)"],"a":0,"why":"Both points have negative x and positive y, so both lie in Quadrant II."},{"d":"MEDIUM","q":"Reflecting (3, 5) across the y-axis gives which point?","o":["(3, −5)","(−3, 5)","(−3, −5)","(5, 3)"],"a":1,"why":"Reflection across the y-axis changes the sign of x only."},{"d":"MEDIUM","q":"Reflecting (−4, 2) across the x-axis gives which point?","o":["(4, 2)","(−4, −2)","(4, −2)","(2, −4)"],"a":1,"why":"Reflection across the x-axis changes the sign of y only."},{"d":"MEDIUM","q":"Which point lies in Quadrant III and is 2 units from the y-axis?","o":["(2, −6)","(−2, −6)","(−6, −2)","(2, 6)"],"a":1,"why":"Quadrant III requires both coordinates negative; distance 2 from the y-axis means x=−2."},{"d":"MEDIUM","q":"A point is below the x-axis and to the right of the y-axis. Which quadrant is it in?","o":["I","II","III","IV"],"a":3,"why":"Right means x positive and below means y negative: Quadrant IV."},{"d":"HARD","q":"Point P=(−3, 4) moves to (3, 4). Which axis reflection describes this change?","o":["Reflection across x-axis","Reflection across y-axis","Reflection across both axes","No reflection"],"a":1,"why":"The x-coordinate changes sign while y stays the same, indicating reflection across the y-axis."},{"d":"HARD","q":"Point A=(−2, −5) is reflected across both axes. Where does it move?","o":["(2, 5)","(−2, 5)","(2, −5)","(−5, −2)"],"a":0,"why":"Reflecting across both axes changes both signs, giving (2,5)."},{"d":"HARD","q":"Which statement about a point in Quadrant II is always true?","o":["Its x and y coordinates are positive","Its x is negative and y is positive","Its x is positive and y is negative","Both coordinates are negative"],"a":1,"why":"Quadrant II is defined by x<0 and y>0."},{"d":"HARD","q":"A point (a,b) has a<0 and b>0. After reflecting it across the x-axis, which quadrant contains the image?","o":["I","II","III","IV"],"a":2,"why":"Reflection changes b to negative while a remains negative, placing it in Quadrant III."},{"d":"HARD","q":"A point in Quadrant IV is reflected across the y-axis. In which quadrant is its image?","o":["I","II","III","IV"],"a":0,"why":"The x-coordinate changes from positive to negative while y stays negative; that is Quadrant III."},{"d":"HARD","q":"Which point is in Quadrant II and has equal absolute values of its coordinates?","o":["(4, 4)","(−4, 4)","(−4, −4)","(4, −4)"],"a":1,"why":"Quadrant II requires (−,+), and the absolute values are both 4."},{"d":"HARD","q":"A point is moved from (−5, 3) to (−5, −3). What happened?","o":["It reflected across the y-axis","It reflected across the x-axis","It moved to Quadrant II","Its x-coordinate changed sign"],"a":1,"why":"Only the y-coordinate changes sign, so it is a reflection across the x-axis."},{"d":"HARD","q":"Which point is in the same quadrant as (8, −1) and farther from the x-axis?","o":["(−8, −5)","(8, −6)","(−8, 6)","(8, 1)"],"a":1,"why":"Both (8,−1) and (8,−6) are in Quadrant IV; |−6| is greater than |−1|."},{"d":"HARD","q":"A point lies on the negative x-axis. Which condition describes it?","o":["x=0, y<0","x<0, y=0","x>0, y=0","x<0, y<0"],"a":1,"why":"On the x-axis y=0; on its negative side x<0."},{"d":"HARD","q":"Point (−2, 7) is reflected across the y-axis and then across the x-axis. What is the final point?","o":["(2, −7)","(−2, −7)","(2, 7)","(−7, 2)"],"a":0,"why":"First reflection gives (2,7); reflecting across x-axis gives (2,−7)."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Quadrants Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
