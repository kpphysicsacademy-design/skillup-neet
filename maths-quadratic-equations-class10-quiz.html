(function(){'use strict';const questions=[{"d":"BASIC","q":"Standard form of a quadratic equation is:","o":["ax+b=0","ax²+bx+c=0, a≠0","ax³+bx+c=0","a/x+b=0"],"a":1,"e":"Its degree is two, so the coefficient of x² cannot be zero."},{"d":"BASIC","q":"Solve x²−5x+6=0.","o":["1 and 6","2 and 3","−2 and −3","−2 and 3"],"a":1,"e":"(x−2)(x−3)=0."},{"d":"BASIC","q":"Solve x²−9=0.","o":["3 only","−3 only","±3","±9"],"a":2,"e":"Both 3² and (−3)² equal 9."},{"d":"BASIC","q":"The quadratic formula is:","o":["(−b±√(b²−4ac))/(2a)","(b±√(b²+4ac))/(2a)","(−b±√(b²+4ac))/a","(−b±√(b²−4ac))/a"],"a":0,"e":"The denominator is 2a and the discriminant is b²−4ac."},{"d":"BASIC","q":"Solve x²+4x+4=0.","o":["2","−2 repeated","±4","No real roots"],"a":1,"e":"(x+2)²=0."},{"d":"BASIC","q":"The discriminant of ax²+bx+c=0 is:","o":["b²+4ac","a²−4bc","b²−4ac","4ac−b"],"a":2,"e":"Δ=b²−4ac determines the nature of the roots."},{"d":"BASIC","q":"A negative discriminant means:","o":["Two distinct real roots","One repeated real root","No real roots","Two integer roots"],"a":2,"e":"A negative discriminant has no real square root."},{"d":"BASIC","q":"Solve x²−7x+12=0.","o":["2 and 6","3 and 4","−3 and −4","1 and 12"],"a":1,"e":"(x−3)(x−4)=0."},{"d":"BASIC","q":"The sum of roots of x²−6x+8=0 is:","o":["−6","6","8","−8"],"a":1,"e":"Sum of roots is −b/a=6."},{"d":"BASIC","q":"The product of roots of 2x²−5x+3=0 is:","o":["−5/2","5/2","3/2","−3/2"],"a":2,"e":"Product of roots is c/a=3/2."},{"d":"MEDIUM","q":"Solve x²−2x−8=0.","o":["4 and −2","−4 and 2","4 and 2","−4 and −2"],"a":0,"e":"(x−4)(x+2)=0."},{"d":"MEDIUM","q":"Solve 2x²−7x+3=0.","o":["3 and 1/2","−3 and −1/2","1 and 3/2","−1 and 3"],"a":0,"e":"(2x−1)(x−3)=0."},{"d":"MEDIUM","q":"Find the discriminant of 3x²−4x+2=0.","o":["−8","8","−16","16"],"a":0,"e":"Δ=16−24=−8."},{"d":"MEDIUM","q":"How many distinct real roots does x²−10x+25=0 have?","o":["Zero","One","Two","Infinitely many"],"a":1,"e":"Δ=100−100=0, giving one repeated real root."},{"d":"MEDIUM","q":"For what k does x²+6x+k=0 have equal roots?","o":["6","9","12","36"],"a":1,"e":"Set Δ=36−4k=0, so k=9."},{"d":"MEDIUM","q":"If 2 is a root of x²−kx+6=0, find k.","o":["3","5","6","8"],"a":1,"e":"Substitution gives 4−2k+6=0, hence k=5."},{"d":"MEDIUM","q":"Which equation has two distinct real roots?","o":["x²+2x+1=0","x²+1=0","x²−5x+6=0","x²−4x+4=0"],"a":2,"e":"Its discriminant is 25−24=1, which is positive."},{"d":"MEDIUM","q":"The roots of x²+px+12=0 are 3 and 4. Find p.","o":["−7","7","12","−12"],"a":0,"e":"The sum is −p=7, so p=−7."},{"d":"MEDIUM","q":"A rectangle has area 48 cm² and length 2 cm more than width w. Which equation models it?","o":["w²+2w−48=0","w²−2w+48=0","2w²−48=0","w²+48=0"],"a":0,"e":"w(w+2)=48."},{"d":"MEDIUM","q":"Solve x²=5x.","o":["5 only","0 only","0 or 5","−5 or 0"],"a":2,"e":"x(x−5)=0."},{"d":"HARD","q":"Solve 3x²−2x−1=0.","o":["1 and −1/3","−1 and 1/3","1/3 and −1","−1/3 and −1"],"a":0,"e":"(3x+1)(x−1)=0."},{"d":"HARD","q":"For what k does x²−4x+k=0 have equal roots?","o":["2","4","−4","8"],"a":1,"e":"Δ=16−4k=0 gives k=4."},{"d":"HARD","q":"If α,β are roots of x²−3x+1=0, find α²+β².","o":["7","9","11","5"],"a":0,"e":"(α+β)²−2αβ=9−2=7."},{"d":"HARD","q":"Two consecutive positive integers have product 72. Find them.","o":["7 and 8","8 and 9","9 and 10","6 and 12"],"a":1,"e":"n(n+1)=72, so n=8."},{"d":"HARD","q":"If x²−px+16=0 has equal roots and p>0, p equals:","o":["4","8","16","32"],"a":1,"e":"p²−64=0 and p is positive, so p=8."},{"d":"HARD","q":"For x²+2x+k=0 to have no real roots, k must satisfy:","o":["k<1","k=1","k>1","k≤1"],"a":2,"e":"Δ=4−4k must be negative, so k>1."},{"d":"HARD","q":"A ball's height is h=−5t²+20t+1. When does it return to height 1 after launch?","o":["1 s","2 s","4 s","5 s"],"a":2,"e":"Set h=1: −5t²+20t=0; the later time is 4 seconds."},{"d":"HARD","q":"For x²−6x+k=0, the two roots differ by 2. Find k.","o":["5","8","9","12"],"a":1,"e":"The roots are 2 and 4; their product k=8."},{"d":"HARD","q":"The roots of x²−6x+5=0 are:","o":["1 and 5","−1 and −5","2 and 3","−2 and −3"],"a":0,"e":"(x−1)(x−5)=0."},{"d":"HARD","q":"The roots are 2+√3 and 2−√3. Which is their monic quadratic equation?","o":["x²−4x+1=0","x²+4x+1=0","x²−2x+1=0","x²−4x+7=0"],"a":0,"e":"Their sum is 4 and product is 1, giving x²−4x+1=0."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Solve quadratic equations</strong><small>Use factorisation and the quadratic formula</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Analyse the discriminant and roots</strong><small>Classify the nature of roots</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Model quadratic word problems</strong><small>Apply quadratic equation methods</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
