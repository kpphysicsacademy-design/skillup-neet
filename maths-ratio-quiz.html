<main><div class="eyebrow">Maths · Ratio and Proportion</div><h1>Ratio</h1><p class="intro">Understand relationships between quantities, simplify ratios, find equivalent ratios and solve sharing and proportion problems.</p>

<script>
(()=>{'use strict';const questions=[{"d":"BASIC","q":"A basket has 2 apples and 3 oranges. What is the ratio of apples to oranges?","o":["2:3","3:2","2:5","5:2"],"a":0,"e":"Apples : oranges = 2 : 3.","v":"ratio"},{"d":"BASIC","q":"Simplify the ratio 4:8.","o":["1:2","2:1","4:2","1:4"],"a":0,"e":"Divide both terms by 4 to get 1:2.","v":"ratio"},{"d":"BASIC","q":"Which ratio is equivalent to 2:3?","o":["3:2","4:6","2:6","6:4"],"a":1,"e":"Multiply both terms by 2: 2:3 = 4:6.","v":"ratio"},{"d":"BASIC","q":"There are 5 red balls and 4 blue balls. What is the ratio of red to blue balls?","o":["4:5","5:4","5:9","4:9"],"a":1,"e":"Red to blue = 5:4.","v":"ratio"},{"d":"BASIC","q":"Simplify 6:9 to its lowest terms.","o":["2:3","3:2","1:3","6:3"],"a":0,"e":"Divide both terms by 3 to get 2:3.","v":"ratio"},{"d":"BASIC","q":"A ribbon is 10 cm long and another is 5 cm long. What is the ratio of their lengths, first to second?","o":["1:2","2:1","5:10","3:1"],"a":1,"e":"10:5 simplifies to 2:1.","v":"ratio"},{"d":"BASIC","q":"Which ratio compares 3 boys to 7 girls?","o":["7:3","3:7","3:10","7:10"],"a":1,"e":"Boys to girls = 3:7.","v":"ratio"},{"d":"BASIC","q":"A class has 12 students wearing glasses and 18 not wearing glasses. Simplify glasses : no glasses.","o":["2:3","3:2","12:30","1:3"],"a":0,"e":"12:18 simplifies by dividing both numbers by 6: 2:3.","v":"ratio"},{"d":"BASIC","q":"The ratio 1:4 means:","o":["1 part to 4 parts","4 parts to 1 part","1 part to 5 parts","4 parts in total"],"a":0,"e":"A ratio 1:4 compares one part with four parts.","v":"ratio"},{"d":"BASIC","q":"Simplify the ratio 15:5.","o":["1:3","3:1","5:1","2:1"],"a":1,"e":"Divide both terms by 5: 3:1.","v":"ratio"},{"d":"MEDIUM","q":"Find an equivalent ratio to 3:5 with first term 12.","o":["12:15","12:20","3:20","15:12"],"a":1,"e":"Multiply both terms by 4: 3:5 = 12:20.","v":"ratio"},{"d":"MEDIUM","q":"Simplify 18:24.","o":["3:4","4:3","6:8","9:12"],"a":0,"e":"Divide both terms by 6 to get 3:4.","v":"ratio"},{"d":"MEDIUM","q":"The ratio of cats to dogs is 2:5. If there are 6 cats, how many dogs are there?","o":["10","12","15","18"],"a":2,"e":"2 is multiplied by 3 to make 6, so 5 × 3 = 15 dogs.","v":"ratio"},{"d":"MEDIUM","q":"A drink uses 2 cups of juice for every 3 cups of water. How many cups of water are needed for 8 cups of juice?","o":["6","9","12","15"],"a":2,"e":"Scale 2:3 by 4; water = 3 × 4 = 12 cups.","v":"ratio"},{"d":"MEDIUM","q":"Which ratio is equivalent to 7:9?","o":["14:18","21:18","7:18","9:7"],"a":0,"e":"Multiplying both terms by 2 gives 14:18.","v":"ratio"},{"d":"MEDIUM","q":"The ratio of pencils to erasers is 4:1. If there are 20 pencils, how many erasers are there?","o":["4","5","10","16"],"a":1,"e":"The scale factor is 20 ÷ 4 = 5, so there are 5 erasers.","v":"ratio"},{"d":"MEDIUM","q":"A map uses 1 cm to represent 5 km. What distance does 4 cm represent?","o":["9 km","15 km","20 km","25 km"],"a":2,"e":"4 × 5 km = 20 km.","v":"ratio"},{"d":"MEDIUM","q":"A recipe uses flour and sugar in the ratio 5:2. If 15 cups of flour are used, how much sugar is needed?","o":["3 cups","5 cups","6 cups","10 cups"],"a":2,"e":"The scale factor is 15 ÷ 5 = 3; sugar = 2 × 3 = 6 cups.","v":"ratio"},{"d":"MEDIUM","q":"The ratio 16:20 simplifies to:","o":["4:5","5:4","8:10","2:5"],"a":0,"e":"Divide both terms by 4 to get 4:5.","v":"ratio"},{"d":"MEDIUM","q":"A team has 8 adults and 12 children. What is the ratio of adults to all team members in simplest form?","o":["2:3","2:5","3:5","4:5"],"a":1,"e":"There are 20 people total; 8:20 simplifies to 2:5.","v":"ratio"},{"d":"HARD","q":"The ratio of red to green beads is 3:4. There are 35 beads altogether. How many are green?","o":["15","20","21","28"],"a":1,"e":"There are 7 total parts; each part is 35 ÷ 7 = 5. Green = 4 × 5 = 20.","v":"ratio"},{"d":"HARD","q":"Two numbers are in the ratio 2:7 and their sum is 45. What is the larger number?","o":["10","25","35","40"],"a":2,"e":"There are 9 parts; each part is 5. Larger number = 7 × 5 = 35.","v":"ratio"},{"d":"HARD","q":"The ratio of boys to girls is 5:4. If there are 36 students, how many are boys?","o":["16","20","24","25"],"a":1,"e":"There are 9 parts; each part is 36 ÷ 9 = 4. Boys = 5 × 4 = 20.","v":"ratio"},{"d":"HARD","q":"A paint mix uses blue and white in ratio 2:3. For 25 litres of mixture, how many litres are white?","o":["10 L","12 L","15 L","18 L"],"a":2,"e":"There are 5 parts; each is 25 ÷ 5 = 5 L. White = 3 × 5 = 15 L.","v":"ratio"},{"d":"HARD","q":"The ratio of length to width of a rectangle is 5:3. If its length is 25 cm, what is its width?","o":["10 cm","12 cm","15 cm","18 cm"],"a":2,"e":"The scale factor is 25 ÷ 5 = 5, so width = 3 × 5 = 15 cm.","v":"ratio"},{"d":"HARD","q":"A sum of ₹72 is shared in the ratio 5:7. How much does the larger share receive?","o":["₹30","₹35","₹42","₹48"],"a":2,"e":"There are 12 parts; each is ₹72 ÷ 12 = ₹6. Larger share = 7 × ₹6 = ₹42.","v":"ratio"},{"d":"HARD","q":"A model's scale is 1:100. A wall is 6 cm long on the model. What is its actual length?","o":["60 cm","6 m","60 m","600 m"],"a":1,"e":"6 cm × 100 = 600 cm = 6 m.","v":"ratio"},{"d":"HARD","q":"The ratio of apples to pears is 4:3. If there are 28 apples, how many fruits are there altogether?","o":["21","35","49","56"],"a":2,"e":"The scale factor is 28 ÷ 4 = 7; pears = 3 × 7 = 21, total = 49.","v":"ratio"},{"d":"HARD","q":"A school has teachers and students in the ratio 1:18. If there are 540 students, how many teachers are there?","o":["20","25","30","36"],"a":2,"e":"540 ÷ 18 = 30 teachers.","v":"ratio"},{"d":"HARD","q":"Two quantities are in the ratio 7:9. Their difference is 14. What is their sum?","o":["98","112","126","224"],"a":1,"e":"The difference is 2 parts = 14, so one part = 7. Sum = 16 parts = 112.","v":"ratio"}];const $=id=>document.getElementById(id);let i=0,sel=-1,locked=false,done=false,xp=0,correct=0,streak=0;const letters=['A','B','C','D'];
function progress(){const p=Math.round(i/questions.length*100);$('bar').style.width=p+'%';$('progress').setAttribute('aria-valuenow',p);$('pct').textContent=p+'% complete';}
function render(){const q=questions[i];sel=-1;locked=false;$('quiz').hidden=false;$('finish').hidden=true;$('counter').textContent='QUESTION '+(i+1)+' OF '+questions.length;$('meta').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(i+1);$('question').textContent=q.q;$('options').innerHTML='';q.o.forEach((v,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.innerHTML='<span class="letter">'+letters[j]+'</span><span></span>';b.querySelector('span:last-child').textContent=v;b.onclick=()=>{if(locked)return;sel=j;[...$('options').children].forEach((x,k)=>x.classList.toggle('selected',k===j));$('action').disabled=false;};$('options').appendChild(b);});$('feedback').className='feedback';$('feedback').textContent='';$('hint').textContent='30 questions · Select one answer';$('action').textContent='Check answer';$('action').disabled=true;progress();}
function act(){if(done){restart();return;}const q=questions[i];if(!locked){if(sel<0)return;locked=true;const ok=sel===q.a;if(ok){correct++;xp+=10;streak++;}else streak=0;$('xp').textContent='⭐ '+xp+' XP';$('streak').textContent='🔥 '+streak;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===sel)b.classList.add('wrong');});$('feedback').textContent=(ok?'✨ Correct! ':'💡 Review: ')+q.e;$('feedback').className='feedback show '+(ok?'good':'bad');$('hint').textContent=ok?'+10 XP':'Keep practising';$('action').textContent=i===questions.length-1?'View results →':'Continue →';return;}if(i<questions.length-1){i++;render();}else results();}
function results(){done=true;$('quiz').hidden=true;$('finish').hidden=false;$('counter').textContent='QUIZ COMPLETE';$('bar').style.width='100%';$('progress').setAttribute('aria-valuenow','100');$('pct').textContent='100% complete';$('finish').innerHTML='<div style="font-size:46px">🏆</div><h2>'+(correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!')+'</h2><div class="score">'+correct+' / '+questions.length+'</div><p>'+Math.round(correct/questions.length*100)+'% accuracy · '+xp+' XP earned</p><div class="skill"><strong>🔢 Compare decimal values</strong><small>Use place value to compare decimals accurately.</small></div><div class="skill"><strong>↔️ Order decimal numbers</strong><small>Compare decimals with different numbers of digits.</small></div><div class="skill"><strong>🧠 Apply comparison strategies</strong><small>Use equivalent trailing zeros and aligned place values.</small></div><button class="btn" id="retry">Try again ↻</button>';$('retry').onclick=restart;}
function restart(){i=0;sel=-1;locked=false;done=false;xp=0;correct=0;streak=0;$('xp').textContent='⭐ 0 XP';$('streak').textContent='🔥 0';render();}
$('action').onclick=act;render();})();
