<style>

</head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span></div><main><section class="hero"><h1>Ratio</h1><p class="muted">Compare quantities, simplify ratios, find equivalent ratios and solve real-life sharing and scaling problems.</p><div class="topic-actions"><a href="maths-ratio-simulator.html?v=20261112-ratio-simulator-v1">🧮 Open Ratio Simulator</a></div></section><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Ratio</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"A basket has 2 apples and 3 oranges. What is the ratio of apples to oranges?","o":["2:3","3:2","2:5","5:2"],"a":0,"e":"Apples : oranges = 2 : 3.","v":"ratio"},{"d":"BASIC","q":"Simplify the ratio 4:8.","o":["1:2","2:1","4:2","1:4"],"a":0,"e":"Divide both terms by 4 to get 1:2.","v":"ratio"},{"d":"BASIC","q":"Which ratio is equivalent to 2:3?","o":["3:2","4:6","2:6","6:4"],"a":1,"e":"Multiply both terms by 2: 2:3 = 4:6.","v":"ratio"},{"d":"BASIC","q":"There are 5 red balls and 4 blue balls. What is the ratio of red to blue balls?","o":["4:5","5:4","5:9","4:9"],"a":1,"e":"Red to blue = 5:4.","v":"ratio"},{"d":"BASIC","q":"Simplify 6:9 to its lowest terms.","o":["2:3","3:2","1:3","6:3"],"a":0,"e":"Divide both terms by 3 to get 2:3.","v":"ratio"},{"d":"BASIC","q":"A ribbon is 10 cm long and another is 5 cm long. What is the ratio of their lengths, first to second?","o":["1:2","2:1","5:10","3:1"],"a":1,"e":"10:5 simplifies to 2:1.","v":"ratio"},{"d":"BASIC","q":"Which ratio compares 3 boys to 7 girls?","o":["7:3","3:7","3:10","7:10"],"a":1,"e":"Boys to girls = 3:7.","v":"ratio"},{"d":"BASIC","q":"A class has 12 students wearing glasses and 18 not wearing glasses. Simplify glasses : no glasses.","o":["2:3","3:2","12:30","1:3"],"a":0,"e":"12:18 simplifies by dividing both numbers by 6: 2:3.","v":"ratio"},{"d":"BASIC","q":"The ratio 1:4 means:","o":["1 part to 4 parts","4 parts to 1 part","1 part to 5 parts","4 parts in total"],"a":0,"e":"A ratio 1:4 compares one part with four parts.","v":"ratio"},{"d":"BASIC","q":"Simplify the ratio 15:5.","o":["1:3","3:1","5:1","2:1"],"a":1,"e":"Divide both terms by 5: 3:1.","v":"ratio"},{"d":"MEDIUM","q":"Find an equivalent ratio to 3:5 with first term 12.","o":["12:15","12:20","3:20","15:12"],"a":1,"e":"Multiply both terms by 4: 3:5 = 12:20.","v":"ratio"},{"d":"MEDIUM","q":"Simplify 18:24.","o":["3:4","4:3","6:8","9:12"],"a":0,"e":"Divide both terms by 6 to get 3:4.","v":"ratio"},{"d":"MEDIUM","q":"The ratio of cats to dogs is 2:5. If there are 6 cats, how many dogs are there?","o":["10","12","15","18"],"a":2,"e":"2 is multiplied by 3 to make 6, so 5 × 3 = 15 dogs.","v":"ratio"},{"d":"MEDIUM","q":"A drink uses 2 cups of juice for every 3 cups of water. How many cups of water are needed for 8 cups of juice?","o":["6","9","12","15"],"a":2,"e":"Scale 2:3 by 4; water = 3 × 4 = 12 cups.","v":"ratio"},{"d":"MEDIUM","q":"Which ratio is equivalent to 7:9?","o":["14:18","21:18","7:18","9:7"],"a":0,"e":"Multiplying both terms by 2 gives 14:18.","v":"ratio"},{"d":"MEDIUM","q":"The ratio of pencils to erasers is 4:1. If there are 20 pencils, how many erasers are there?","o":["4","5","10","16"],"a":1,"e":"The scale factor is 20 ÷ 4 = 5, so there are 5 erasers.","v":"ratio"},{"d":"MEDIUM","q":"A map uses 1 cm to represent 5 km. What distance does 4 cm represent?","o":["9 km","15 km","20 km","25 km"],"a":2,"e":"4 × 5 km = 20 km.","v":"ratio"},{"d":"MEDIUM","q":"A recipe uses flour and sugar in the ratio 5:2. If 15 cups of flour are used, how much sugar is needed?","o":["3 cups","5 cups","6 cups","10 cups"],"a":2,"e":"The scale factor is 15 ÷ 5 = 3; sugar = 2 × 3 = 6 cups.","v":"ratio"},{"d":"MEDIUM","q":"The ratio 16:20 simplifies to:","o":["4:5","5:4","8:10","2:5"],"a":0,"e":"Divide both terms by 4 to get 4:5.","v":"ratio"},{"d":"MEDIUM","q":"A team has 8 adults and 12 children. What is the ratio of adults to all team members in simplest form?","o":["2:3","2:5","3:5","4:5"],"a":1,"e":"There are 20 people total; 8:20 simplifies to 2:5.","v":"ratio"},{"d":"HARD","q":"The ratio of red to green beads is 3:4. There are 35 beads altogether. How many are green?","o":["15","20","21","28"],"a":1,"e":"There are 7 total parts; each part is 35 ÷ 7 = 5. Green = 4 × 5 = 20.","v":"ratio"},{"d":"HARD","q":"Two numbers are in the ratio 2:7 and their sum is 45. What is the larger number?","o":["10","25","35","40"],"a":2,"e":"There are 9 parts; each part is 5. Larger number = 7 × 5 = 35.","v":"ratio"},{"d":"HARD","q":"The ratio of boys to girls is 5:4. If there are 36 students, how many are boys?","o":["16","20","24","25"],"a":1,"e":"There are 9 parts; each part is 36 ÷ 9 = 4. Boys = 5 × 4 = 20.","v":"ratio"},{"d":"HARD","q":"A paint mix uses blue and white in ratio 2:3. For 25 litres of mixture, how many litres are white?","o":["10 L","12 L","15 L","18 L"],"a":2,"e":"There are 5 parts; each is 25 ÷ 5 = 5 L. White = 3 × 5 = 15 L.","v":"ratio"},{"d":"HARD","q":"The ratio of length to width of a rectangle is 5:3. If its length is 25 cm, what is its width?","o":["10 cm","12 cm","15 cm","18 cm"],"a":2,"e":"The scale factor is 25 ÷ 5 = 5, so width = 3 × 5 = 15 cm.","v":"ratio"},{"d":"HARD","q":"A sum of ₹72 is shared in the ratio 5:7. How much does the larger share receive?","o":["₹30","₹35","₹42","₹48"],"a":2,"e":"There are 12 parts; each is ₹72 ÷ 12 = ₹6. Larger share = 7 × ₹6 = ₹42.","v":"ratio"},{"d":"HARD","q":"A model's scale is 1:100. A wall is 6 cm long on the model. What is its actual length?","o":["60 cm","6 m","60 m","600 m"],"a":1,"e":"6 cm × 100 = 600 cm = 6 m.","v":"ratio"},{"d":"HARD","q":"The ratio of apples to pears is 4:3. If there are 28 apples, how many fruits are there altogether?","o":["21","35","49","56"],"a":2,"e":"The scale factor is 28 ÷ 4 = 7; pears = 3 × 7 = 21, total = 49.","v":"ratio"},{"d":"HARD","q":"A school has teachers and students in the ratio 1:18. If there are 540 students, how many teachers are there?","o":["20","25","30","36"],"a":2,"e":"540 ÷ 18 = 30 teachers.","v":"ratio"},{"d":"HARD","q":"Two quantities are in the ratio 7:9. Their difference is 14. What is their sum?","o":["98","112","126","224"],"a":1,"e":"The difference is 2 parts = 14, so one part = 7. Sum = 16 parts = 112.","v":"ratio"}];questions.forEach(q=>{const pairs=q.o.map((text,i)=>({text,correct:i===q.a}));for(let i=pairs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pairs[i],pairs[j]]=[pairs[j],pairs[i]];}q.o=pairs.map(p=>p.text);q.a=pairs.findIndex(p=>p.correct);});let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Compare quantities using ratios</strong><small>Write ratios in the correct order</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Simplify ratios to lowest terms</strong><small>Find equivalent ratios and missing quantities</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve real-life ratio problems</strong><small>Apply rectangle area in real life</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
