<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Calculate 1/5 + 2/5.","o":["3/5","3/10","1/5","2/5"],"a":0,"e":"The denominators match, so add the numerators: (1 + 2)/5 = 3/5.","v":"rational-number-operations"},{"d":"BASIC","q":"Calculate 7/9 − 4/9.","o":["11/9","3/9","1/9","3/18"],"a":1,"e":"Subtract the numerators: (7 − 4)/9 = 3/9 = 1/3.","v":"rational-number-operations"},{"d":"BASIC","q":"Calculate 1/2 + 1/4.","o":["2/6","3/4","1/4","1/8"],"a":1,"e":"Write 1/2 as 2/4, then 2/4 + 1/4 = 3/4.","v":"rational-number-operations"},{"d":"BASIC","q":"Calculate 5/6 − 1/3.","o":["4/3","1/2","2/3","1/3"],"a":1,"e":"Convert 1/3 to 2/6; 5/6 − 2/6 = 3/6 = 1/2.","v":"rational-number-operations"},{"d":"BASIC","q":"Calculate (2/3) × (3/5).","o":["2/5","5/2","6/8","1/5"],"a":0,"e":"Multiply numerators and denominators: 6/15 simplifies to 2/5.","v":"rational-number-operations"},{"d":"BASIC","q":"Calculate (3/4) ÷ (1/2).","o":["3/8","3/2","2/3","4/3"],"a":1,"e":"Divide by multiplying by the reciprocal: 3/4 × 2/1 = 3/2.","v":"rational-number-operations"},{"d":"BASIC","q":"Calculate (−2/7) + 5/7.","o":["−3/7","3/7","7/7","−7/7"],"a":1,"e":"Add numerators: (−2 + 5)/7 = 3/7.","v":"rational-number-operations"},{"d":"BASIC","q":"Calculate (−3/8) − 1/8.","o":["−1/4","−1/2","1/2","−4/16"],"a":1,"e":"(−3 − 1)/8 = −4/8 = −1/2.","v":"rational-number-operations"},{"d":"BASIC","q":"Calculate (−2/5) × (−5/6).","o":["−1/3","1/3","−1/6","5/3"],"a":1,"e":"Two negative factors give a positive product; 10/30 simplifies to 1/3.","v":"rational-number-operations"},{"d":"BASIC","q":"Calculate (−3/4) ÷ 3/8.","o":["−2","2","−1/2","1/2"],"a":0,"e":"Multiply by the reciprocal: −3/4 × 8/3 = −2.","v":"rational-number-operations"},{"d":"MEDIUM","q":"Calculate 2/3 + 1/6.","o":["1/2","5/6","3/9","1"],"a":1,"e":"Convert 2/3 to 4/6, then 4/6 + 1/6 = 5/6.","v":"rational-number-operations"},{"d":"MEDIUM","q":"Calculate 5/8 − 3/4.","o":["1/8","−1/8","−1/4","1/4"],"a":1,"e":"Convert 3/4 to 6/8; 5/8 − 6/8 = −1/8.","v":"rational-number-operations"},{"d":"MEDIUM","q":"Calculate (−5/12) + (1/3).","o":["−1/12","−4/9","1/12","−3/12"],"a":0,"e":"Convert 1/3 to 4/12: −5/12 + 4/12 = −1/12.","v":"rational-number-operations"},{"d":"MEDIUM","q":"Calculate 7/10 − (−1/5).","o":["1/2","9/10","6/10","−9/10"],"a":1,"e":"Subtracting a negative means add: 7/10 + 2/10 = 9/10.","v":"rational-number-operations"},{"d":"MEDIUM","q":"Calculate (4/9) × (−3/8).","o":["−1/6","1/6","−12/17","−3/8"],"a":0,"e":"The product is −12/72, which simplifies to −1/6.","v":"rational-number-operations"},{"d":"MEDIUM","q":"Calculate (−5/6) ÷ (10/9).","o":["−3/4","3/4","−4/3","−1/2"],"a":0,"e":"Multiply by the reciprocal: −5/6 × 9/10 = −45/60 = −3/4.","v":"rational-number-operations"},{"d":"MEDIUM","q":"Calculate 1/2 + (−3/4) + 1/8.","o":["−1/8","1/8","−3/8","3/8"],"a":0,"e":"In eighths: 4/8 − 6/8 + 1/8 = −1/8.","v":"rational-number-operations"},{"d":"MEDIUM","q":"Find x if x + 2/7 = −3/7.","o":["−1/7","−5/7","5/7","1/7"],"a":1,"e":"Subtract 2/7 from both sides: x = −3/7 − 2/7 = −5/7.","v":"rational-number-operations"},{"d":"MEDIUM","q":"A tank is 3/4 full and 1/3 of the tank's capacity is used. What fraction of capacity remains?","o":["5/12","1/2","1/4","13/12"],"a":0,"e":"Remaining capacity is 3/4 − 1/3 = 9/12 − 4/12 = 5/12.","v":"rational-number-operations"},{"d":"MEDIUM","q":"Calculate (−2/3) × 9/10 + 1/5.","o":["−2/5","−4/5","2/5","−3/5"],"a":0,"e":"First product is −18/30 = −3/5; then −3/5 + 1/5 = −2/5.","v":"rational-number-operations"},{"d":"HARD","q":"Calculate (1/2 − 3/4) ÷ (−1/8).","o":["2","−2","1/4","−1/4"],"a":0,"e":"The bracket is −1/4; dividing by −1/8 gives (−1/4) × (−8) = 2.","v":"rational-number-operations"},{"d":"HARD","q":"Calculate (−3/5) + (7/10) − 1/4.","o":["−3/20","3/20","−1/20","1/20"],"a":0,"e":"In twentieths: −12/20 + 14/20 − 5/20 = −3/20.","v":"rational-number-operations"},{"d":"HARD","q":"Calculate (−4/7) ÷ (2/3) × (−3/8), from left to right.","o":["9/28","−9/28","3/7","−3/7"],"a":0,"e":"First (−4/7) ÷ (2/3) = −6/7; then (−6/7) × (−3/8) = 18/56 = 9/28.","v":"rational-number-operations"},{"d":"HARD","q":"Calculate 2/3 − [1/4 + (−1/6)].","o":["7/12","5/12","1/4","3/4"],"a":0,"e":"Inside brackets, 1/4 − 1/6 = 1/12; then 2/3 − 1/12 = 8/12 − 1/12 = 7/12.","v":"rational-number-operations"},{"d":"HARD","q":"If x × (−3/5) = 9/10, find x.","o":["−3/2","3/2","−1/2","1/2"],"a":0,"e":"Divide by −3/5: x = 9/10 × (−5/3) = −45/30 = −3/2.","v":"rational-number-operations"},{"d":"HARD","q":"A hiker walks 2/3 km forward, then 5/6 km backward. What is the net signed displacement?","o":["−1/6 km","1/6 km","3/2 km","−3/2 km"],"a":0,"e":"Take forward as positive: 2/3 − 5/6 = 4/6 − 5/6 = −1/6 km.","v":"rational-number-operations"},{"d":"HARD","q":"Calculate (−7/12) ÷ (−14/9).","o":["3/8","−3/8","2/3","−2/3"],"a":0,"e":"Multiply by the reciprocal: (−7/12) × (−9/14) = 63/168 = 3/8.","v":"rational-number-operations"},{"d":"HARD","q":"Which is the value of 3/5 × (−10/9) − (−1/3)?","o":["−1/3","−1","1/3","−2/3"],"a":0,"e":"The product is −30/45 = −2/3; adding 1/3 gives −1/3.","v":"rational-number-operations"},{"d":"HARD","q":"A recipe needs 2/3 cup of milk per batch. How much milk is needed for 3/4 of a batch?","o":["1/2 cup","5/7 cup","2/9 cup","3/2 cups"],"a":0,"e":"Multiply the quantities: 2/3 × 3/4 = 6/12 = 1/2 cup.","v":"rational-number-operations"},{"d":"HARD","q":"Calculate (−1/2 + 2/3) ÷ (5/6).","o":["1/5","−1/5","1/6","−1/6"],"a":0,"e":"The numerator is −3/6 + 4/6 = 1/6; then 1/6 ÷ 5/6 = 1/5.","v":"rational-number-operations"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Multiply positive and negative integers</strong><small>Apply sign rules to integer products</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Solve multiplication word problems</strong><small>Reason with signs and products</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply ruler-and-compass reasoning</strong><small>Use accurate integer multiplication methods</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
