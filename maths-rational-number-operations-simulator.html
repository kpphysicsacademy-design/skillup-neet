<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="skillup-release" content="20261117-rational-number-operations-simulator-design-v2"><meta name="skillup-no-standard-menu" content="true"><title>Rational Operations Simulator</title><style>body{font:16px system-ui;background:#f7f9fa;color:#263746;margin:0}main,header{max-width:760px;margin:auto;padding:16px}header,.panel{background:white}.panel{border:1px solid #e3e9ed;border-radius:14px;padding:16px;margin:12px 0}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-weight:800;font-size:13px}.field input,.field select{width:100%;padding:10px;border:1px solid #d9e2e8;border-radius:9px;font:700 16px system-ui;box-sizing:border-box}.result,.steps{padding:12px;border-radius:10px;margin-top:12px;background:#eff8fd;font-weight:800}.steps{background:#f5f8f9;font-weight:400}a{color:#1682b8;font-weight:800;text-decoration:none}@media(max-width:540px){.fields{grid-template-columns:1fr}}

*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#e8edff 0,transparent 42%),#f4f6fc;color:var(--ink);font:16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:3;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px max(18px,calc((100% - 820px)/2));font-weight:800}

</style></head><body><header><a href="maths-rational-number-operations-quiz.html?v=20261117-rational-number-operations-quiz-design-v2">← Quiz</a>　SkillUp Maths</header><main><p>INTERACTIVE SIMULATOR</p><h1>Rational Operations Explorer</h1><p>Enter two fractions and explore exact addition, subtraction, multiplication or division.</p><section class="panel"><div class="fields"><div class="field"><label for="op">Operation</label><select id="op"><option value="+">Addition (+)</option><option value="-">Subtraction (−)</option><option value="*">Multiplication (×)</option><option value="/">Division (÷)</option></select></div><div class="field"><label for="an">First numerator</label><input id="an" type="number" value="-2"></div><div class="field"><label for="ad">First denominator</label><input id="ad" type="number" value="3"></div><div class="field"><label for="bn">Second numerator</label><input id="bn" type="number" value="1"></div><div class="field"><label for="bd">Second denominator</label><input id="bd" type="number" value="6"></div></div><div id="answer" class="result" aria-live="polite"></div><div id="work" class="steps"></div></section><p><a href="maths-rational-number-operations-learn.html?v=20261117-rational-number-operations-learn-design-v2">Brief Learn →</a>　<a href="maths-rational-number-operations-quiz.html?v=20261117-rational-number-operations-quiz-design-v2">Take Quiz →</a></p></main><script>(function(){const $=id=>document.getElementById(id);function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t;}return a||1}function f(n,d){if(d===0)throw Error('Denominator cannot be zero.');if(d<0){n=-n;d=-d}const g=gcd(n,d);return {n:n/g,d:d/g}}function s(x){return x.d===1?String(x.n):x.n+'/'+x.d}function calc(){try{const a=f(+$('an').value,+$('ad').value),b=f(+$('bn').value,+$('bd').value),op=$('op').value;let r;if(op==='+')r=f(a.n*b.d+b.n*a.d,a.d*b.d);else if(op==='-')r=f(a.n*b.d-b.n*a.d,a.d*b.d);else if(op==='*')r=f(a.n*b.n,a.d*b.d);else{if(!b.n)throw Error('Division by zero is undefined.');r=f(a.n*b.d,a.d*b.n)}$('answer').textContent=s(r);$('work').textContent='('+s(a)+') '+op+' ('+s(b)+') = '+s(r)+'. Result simplified using the HCF.'}catch(e){$('answer').textContent=e.message;$('work').textContent='Check that denominators are non-zero integers.'}}['op','an','ad','bn','bd'].forEach(id=>$(id).addEventListener('input',calc));calc()})();</script></body></html>
