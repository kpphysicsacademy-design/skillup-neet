<script>
(function(){
'use strict';
const questions=[{"q":"Which property is shown by 2/7 + 3/5 = 3/5 + 2/7?","o":["Commutative property of addition","Associative property of addition","Distributive property","Closure under division"],"a":0,"why":"The order of the two addends changes while the sum remains the same."},{"q":"Which property is shown by (1/4 + 1/2) + 1/3 = 1/4 + (1/2 + 1/3)?","o":["Commutative property","Associative property of addition","Multiplicative identity","Distributive property"],"a":1,"why":"The grouping changes, but the order of the addends does not."},{"q":"What is the additive identity for rational numbers?","o":["1","−1","0","The reciprocal of each number"],"a":2,"why":"Adding zero to any rational number leaves it unchanged."},{"q":"What is the multiplicative identity for rational numbers?","o":["0","1","−1","The opposite of the number"],"a":1,"why":"Multiplying any rational number by 1 leaves it unchanged."},{"q":"What is the additive inverse of −5/8?","o":["−8/5","5/8","−5/8","8/5"],"a":1,"why":"A number and its additive inverse sum to zero."},{"q":"What is the multiplicative inverse of 3/7?","o":["−3/7","3/7","7/3","−7/3"],"a":2,"why":"For a nonzero fraction, interchange its numerator and denominator."},{"q":"Which statement is true for every rational number a?","o":["a + 0 = a","a × 0 = a","a ÷ 0 = a","a − a = 1"],"a":0,"why":"Zero is the additive identity; multiplying by zero instead gives zero."},{"q":"Which rational number has no multiplicative inverse among rational numbers?","o":["1","−2/3","0","5"],"a":2,"why":"No rational number multiplied by zero can produce 1."},{"q":"Which property is shown by 3 × (2/5 + 1/4) = 3 × 2/5 + 3 × 1/4?","o":["Associative property of multiplication","Distributive property","Commutative property of addition","Additive identity"],"a":1,"why":"The factor 3 multiplies each term inside the sum."},{"q":"For rational numbers a and b, which statement expresses commutativity of multiplication?","o":["a × b = a + b","a × b = b × a","a × (b + c) = a × b + c","a × 1 = 0"],"a":1,"why":"Interchanging the factors does not change their product."},{"q":"Simplify 7/9 + (−7/9). Which property is used?","o":["Multiplicative identity","Additive inverse","Commutativity of multiplication","Closure under subtraction"],"a":1,"why":"A number plus its opposite equals zero."},{"q":"Which expression equals (−2/3) × (5/7 × 3/4) by associativity?","o":["((−2/3) × 5/7) × 3/4","(−2/3) + (5/7 × 3/4)","(−2/3) × (5/7 + 3/4)","(−2/3) × (3/4) + 5/7"],"a":0,"why":"Associativity changes the grouping of factors, not the factors or operation."},{"q":"Which property justifies (−4/5) × 1 = −4/5?","o":["Additive identity","Multiplicative identity","Additive inverse","Distributive property"],"a":1,"why":"One is the multiplicative identity."},{"q":"Which property justifies (−3/8) × (−2/5) = (−2/5) × (−3/8)?","o":["Associativity of addition","Commutativity of multiplication","Distributive property","Multiplicative inverse"],"a":1,"why":"The factors switch positions without changing the product."},{"q":"Evaluate (2/3) × (3/4 + 1/2) using distribution.","o":["5/6","7/6","1/2","2/3"],"a":0,"why":"Distribute: (2/3 × 3/4) + (2/3 × 1/2) = 1/2 + 1/3 = 5/6."},{"q":"Which is the additive inverse of the sum 2/5 + 1/3?","o":["11/15","−11/15","1/15","−1/15"],"a":1,"why":"The sum is 6/15 + 5/15 = 11/15, whose additive inverse is −11/15."},{"q":"If a = −3/4, what is a × (−1)?","o":["−3/4","3/4","−1/4","1"],"a":1,"why":"Multiplication by −1 gives the additive inverse of the original number."},{"q":"Which statement about rational numbers is correct?","o":["They are closed under addition","They are not closed under multiplication","They are not closed under subtraction","They are closed under division by zero"],"a":0,"why":"Adding two rational numbers always produces another rational number."},{"q":"Let a = 2/3 and b = −5/6. Find a + b and identify its additive inverse.","o":["−1/6 and 1/6","1/6 and −1/6","−3/2 and 3/2","−7/6 and 7/6"],"a":0,"why":"2/3 − 5/6 = 4/6 − 5/6 = −1/6; its additive inverse is 1/6."},{"q":"Which expression is equal to (4/7) × (−3/5) + (4/7) × (2/5)?","o":["(4/7) × (−1/5)","(4/7) × (−5/5)","(4/7) × (1/5)","(4/7) × (−6/10)"],"a":0,"why":"Factor 4/7: (4/7) × (−3/5 + 2/5) = (4/7) × (−1/5)."},{"q":"Which is the correct result of (−5/6) × (2/7 + 3/7), using distribution?","o":["−25/42","−5/6","−5/42","25/42"],"a":0,"why":"The bracket is 5/7, so (−5/6) × 5/7 = −25/42."},{"q":"For a = 4/9, calculate a × (a's multiplicative inverse).","o":["0","1","4/9","9/4"],"a":1,"why":"Since a is nonzero, 4/9 × 9/4 = 1."},{"q":"Which statement is always true for rational numbers a, b, and c?","o":["a ÷ b = b ÷ a for all nonzero a,b","a × (b + c) = a × b + a × c","a + (b × c) = (a + b) × c","a ÷ 0 = 0"],"a":1,"why":"Multiplication distributes over addition; division is not generally commutative and division by zero is undefined."},{"q":"If x + (−7/12) = 0, what is x?","o":["−7/12","7/12","12/7","0"],"a":1,"why":"To make the sum zero, x must be the additive inverse of −7/12."},{"q":"Simplify (−2/3) × (3/5) + (−2/3) × (2/5) by factoring.","o":["−2/3","−2/5","2/3","−4/15"],"a":0,"why":"Factor −2/3: (−2/3) × (3/5 + 2/5) = (−2/3) × 1 = −2/3."},{"q":"Which is the multiplicative inverse of −11/13?","o":["11/13","−13/11","13/11","−11/13"],"a":1,"why":"The reciprocal is −13/11, and their product is 1."},{"q":"A student claims rational numbers are closed under division. Which qualification makes the claim accurate?","o":["Division is closed even when the divisor is zero","Division is closed when the divisor is nonzero","Division is never closed","Only positive rational divisors are allowed"],"a":1,"why":"The quotient of rational numbers is rational provided the divisor is not zero."},{"q":"Let a = −2/5 and b = 3/7. Find a × b and its multiplicative inverse.","o":["−6/35 and −35/6","6/35 and 35/6","−5/14 and −14/5","−6/12 and −12/6"],"a":0,"why":"The product is −6/35; its reciprocal is −35/6."},{"q":"Which expression equals (1/2 × 3/7) + (1/2 × 4/7)?","o":["1/2 × (3/7 + 4/7) = 1/2","1/2 + (3/7 × 4/7)","(1/2 × 3/7) × 4/7","1/2 × (3/7 − 4/7)"],"a":0,"why":"Factor 1/2 and add inside: 1/2 × 7/7 = 1/2."},{"q":"Which statement correctly distinguishes additive and multiplicative inverses of a nonzero rational number a?","o":["Both inverses always equal −a","The additive inverse is −a; the multiplicative inverse is 1/a","The additive inverse is 1/a; the multiplicative inverse is −a","Both inverses always equal a"],"a":1,"why":"The additive inverse sums with a to give 0; the multiplicative inverse multiplies with a to give 1."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function clearChildren(node){while(node.firstChild)node.removeChild(node.firstChild);}
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 clearChildren($('options'));
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.appendChild(letter);b.appendChild(label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Rational Number Properties Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261104-physics-path-layout-v2" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.appendChild(q);item.appendChild(yours);item.appendChild(correct);item.appendChild(why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 clearChildren($('finishSlot'));$('finishSlot').appendChild(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';clearChildren($('finishSlot'));render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
