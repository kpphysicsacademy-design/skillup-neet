</head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Multiplication of integers</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div><script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Which property is shown by 2/7 + 3/5 = 3/5 + 2/7?","o":["Commutative property of addition","Associative property of addition","Distributive property","Closure under division"],"a":0,"e":"The order of the two addends changes while the sum remains the same.","v":"rational-number-properties"},{"d":"BASIC","q":"Which property is shown by (1/4 + 1/2) + 1/3 = 1/4 + (1/2 + 1/3)?","o":["Commutative property","Associative property of addition","Multiplicative identity","Distributive property"],"a":1,"e":"The grouping changes, but the order of the addends does not.","v":"rational-number-properties"},{"d":"BASIC","q":"What is the additive identity for rational numbers?","o":["1","−1","0","The reciprocal of each number"],"a":2,"e":"Adding zero to any rational number leaves it unchanged.","v":"rational-number-properties"},{"d":"BASIC","q":"What is the multiplicative identity for rational numbers?","o":["0","1","−1","The opposite of the number"],"a":1,"e":"Multiplying any rational number by 1 leaves it unchanged.","v":"rational-number-properties"},{"d":"BASIC","q":"What is the additive inverse of −5/8?","o":["−8/5","5/8","−5/8","8/5"],"a":1,"e":"A number and its additive inverse sum to zero.","v":"rational-number-properties"},{"d":"BASIC","q":"What is the multiplicative inverse of 3/7?","o":["−3/7","3/7","7/3","−7/3"],"a":2,"e":"For a nonzero fraction, interchange its numerator and denominator.","v":"rational-number-properties"},{"d":"BASIC","q":"Which statement is true for every rational number a?","o":["a + 0 = a","a × 0 = a","a ÷ 0 = a","a − a = 1"],"a":0,"e":"Zero is the additive identity; multiplying by zero instead gives zero.","v":"rational-number-properties"},{"d":"BASIC","q":"Which rational number has no multiplicative inverse among rational numbers?","o":["1","−2/3","0","5"],"a":2,"e":"No rational number multiplied by zero can produce 1.","v":"rational-number-properties"},{"d":"BASIC","q":"Which property is shown by 3 × (2/5 + 1/4) = 3 × 2/5 + 3 × 1/4?","o":["Associative property of multiplication","Distributive property","Commutative property of addition","Additive identity"],"a":1,"e":"The factor 3 multiplies each term inside the sum.","v":"rational-number-properties"},{"d":"BASIC","q":"For rational numbers a and b, which statement expresses commutativity of multiplication?","o":["a × b = a + b","a × b = b × a","a × (b + c) = a × b + c","a × 1 = 0"],"a":1,"e":"Interchanging the factors does not change their product.","v":"rational-number-properties"},{"d":"MEDIUM","q":"Simplify 7/9 + (−7/9). Which property is used?","o":["Multiplicative identity","Additive inverse","Commutativity of multiplication","Closure under subtraction"],"a":1,"e":"A number plus its opposite equals zero.","v":"rational-number-properties"},{"d":"MEDIUM","q":"Which expression equals (−2/3) × (5/7 × 3/4) by associativity?","o":["((−2/3) × 5/7) × 3/4","(−2/3) + (5/7 × 3/4)","(−2/3) × (5/7 + 3/4)","(−2/3) × (3/4) + 5/7"],"a":0,"e":"Associativity changes the grouping of factors, not the factors or operation.","v":"rational-number-properties"},{"d":"MEDIUM","q":"Which property justifies (−4/5) × 1 = −4/5?","o":["Additive identity","Multiplicative identity","Additive inverse","Distributive property"],"a":1,"e":"One is the multiplicative identity.","v":"rational-number-properties"},{"d":"MEDIUM","q":"Which property justifies (−3/8) × (−2/5) = (−2/5) × (−3/8)?","o":["Associativity of addition","Commutativity of multiplication","Distributive property","Multiplicative inverse"],"a":1,"e":"The factors switch positions without changing the product.","v":"rational-number-properties"},{"d":"MEDIUM","q":"Evaluate (2/3) × (3/4 + 1/2) using distribution.","o":["5/6","7/6","1/2","2/3"],"a":0,"e":"Distribute: (2/3 × 3/4) + (2/3 × 1/2) = 1/2 + 1/3 = 5/6.","v":"rational-number-properties"},{"d":"MEDIUM","q":"Which is the additive inverse of the sum 2/5 + 1/3?","o":["11/15","−11/15","1/15","−1/15"],"a":1,"e":"The sum is 6/15 + 5/15 = 11/15, whose additive inverse is −11/15.","v":"rational-number-properties"},{"d":"MEDIUM","q":"If a = −3/4, what is a × (−1)?","o":["−3/4","3/4","−1/4","1"],"a":1,"e":"Multiplication by −1 gives the additive inverse of the original number.","v":"rational-number-properties"},{"d":"MEDIUM","q":"Which statement about rational numbers is correct?","o":["They are closed under addition","They are not closed under multiplication","They are not closed under subtraction","They are closed under division by zero"],"a":0,"e":"Adding two rational numbers always produces another rational number.","v":"rational-number-properties"},{"d":"MEDIUM","q":"Let a = 2/3 and b = −5/6. Find a + b and identify its additive inverse.","o":["−1/6 and 1/6","1/6 and −1/6","−3/2 and 3/2","−7/6 and 7/6"],"a":0,"e":"2/3 − 5/6 = 4/6 − 5/6 = −1/6; its additive inverse is 1/6.","v":"rational-number-properties"},{"d":"MEDIUM","q":"Which expression is equal to (4/7) × (−3/5) + (4/7) × (2/5)?","o":["(4/7) × (−1/5)","(4/7) × (−5/5)","(4/7) × (1/5)","(4/7) × (−6/10)"],"a":0,"e":"Factor 4/7: (4/7) × (−3/5 + 2/5) = (4/7) × (−1/5).","v":"rational-number-properties"},{"d":"HARD","q":"Which is the correct result of (−5/6) × (2/7 + 3/7), using distribution?","o":["−25/42","−5/6","−5/42","25/42"],"a":0,"e":"The bracket is 5/7, so (−5/6) × 5/7 = −25/42.","v":"rational-number-properties"},{"d":"HARD","q":"For a = 4/9, calculate a × (a's multiplicative inverse).","o":["0","1","4/9","9/4"],"a":1,"e":"Since a is nonzero, 4/9 × 9/4 = 1.","v":"rational-number-properties"},{"d":"HARD","q":"Which statement is always true for rational numbers a, b, and c?","o":["a ÷ b = b ÷ a for all nonzero a,b","a × (b + c) = a × b + a × c","a + (b × c) = (a + b) × c","a ÷ 0 = 0"],"a":1,"e":"Multiplication distributes over addition; division is not generally commutative and division by zero is undefined.","v":"rational-number-properties"},{"d":"HARD","q":"If x + (−7/12) = 0, what is x?","o":["−7/12","7/12","12/7","0"],"a":1,"e":"To make the sum zero, x must be the additive inverse of −7/12.","v":"rational-number-properties"},{"d":"HARD","q":"Simplify (−2/3) × (3/5) + (−2/3) × (2/5) by factoring.","o":["−2/3","−2/5","2/3","−4/15"],"a":0,"e":"Factor −2/3: (−2/3) × (3/5 + 2/5) = (−2/3) × 1 = −2/3.","v":"rational-number-properties"},{"d":"HARD","q":"Which is the multiplicative inverse of −11/13?","o":["11/13","−13/11","13/11","−11/13"],"a":1,"e":"The reciprocal is −13/11, and their product is 1.","v":"rational-number-properties"},{"d":"HARD","q":"A student claims rational numbers are closed under division. Which qualification makes the claim accurate?","o":["Division is closed even when the divisor is zero","Division is closed when the divisor is nonzero","Division is never closed","Only positive rational divisors are allowed"],"a":1,"e":"The quotient of rational numbers is rational provided the divisor is not zero.","v":"rational-number-properties"},{"d":"HARD","q":"Let a = −2/5 and b = 3/7. Find a × b and its multiplicative inverse.","o":["−6/35 and −35/6","6/35 and 35/6","−5/14 and −14/5","−6/12 and −12/6"],"a":0,"e":"The product is −6/35; its reciprocal is −35/6.","v":"rational-number-properties"},{"d":"HARD","q":"Which expression equals (1/2 × 3/7) + (1/2 × 4/7)?","o":["1/2 × (3/7 + 4/7) = 1/2","1/2 + (3/7 × 4/7)","(1/2 × 3/7) × 4/7","1/2 × (3/7 − 4/7)"],"a":0,"e":"Factor 1/2 and add inside: 1/2 × 7/7 = 1/2.","v":"rational-number-properties"},{"d":"HARD","q":"Which statement correctly distinguishes additive and multiplicative inverses of a nonzero rational number a?","o":["Both inverses always equal −a","The additive inverse is −a; the multiplicative inverse is 1/a","The additive inverse is 1/a; the multiplicative inverse is −a","Both inverses always equal a"],"a":1,"e":"The additive inverse sums with a to give 0; the multiplicative inverse multiplies with a to give 1.","v":"rational-number-properties"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id);function updateProgress(){const p=index>=questions.length?100:index/questions.length*100;$('bar').style.width=p+'%';const pb=document.querySelector('[role="progressbar"]');if(pb)pb.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){if(index>=questions.length){results();return;}const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · PROPERTIES OF RATIONAL NUMBERS';$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';const content=$('content');content.replaceChildren();const question=document.createElement('div');question.className='question';question.textContent=q.q;content.appendChild(question);const choices=document.createElement('div');choices.className='choices';content.appendChild(choices);q.o.forEach((answer,i)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=answer;b.addEventListener('click',()=>{if(locked)return;selected=i;choices.querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===i));$('action').disabled=false;});choices.appendChild(b);});$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';if(window.skillupCelebrate)window.skillupCelebrate();}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===selected&&!good)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Explanation: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();}else results();}function results(){finished=true;updateProgress();$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='🏆 Properties of rational numbers complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const content=$('content');content.replaceChildren();const end=document.createElement('div');end.className='end';const title=document.createElement('h1');title.textContent=correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!';end.appendChild(title);const score=document.createElement('div');score.className='score';score.textContent=correct+' / '+questions.length;end.appendChild(score);const p=document.createElement('p');p.textContent='You answered '+correct+' questions correctly.';end.appendChild(p);const summary=document.createElement('div');summary.className='summary';summary.innerHTML='⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining';end.appendChild(summary);content.appendChild(end);$('action').textContent='Try again ↻';$('action').disabled=false;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished)restart();else act();});try{render();}catch(error){$('content').textContent='Quiz could not start. Please refresh the page.';console.error('Properties of rational numbers quiz initialization failed',error);}})();</script>
