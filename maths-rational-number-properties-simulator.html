<main><span class="eyebrow">INTERACTIVE MATHS LAB</span><h1>Rational Number Property Explorer</h1><p class="muted">Choose a property and enter rational numbers. The explorer evaluates both sides of the identity using exact fractions.</p>
<section class="panel"><div class="fields">
<div class="field"><label for="property">Property</label><select id="property"><option value="commAdd">Commutative — addition</option><option value="commMul">Commutative — multiplication</option><option value="assocAdd">Associative — addition</option><option value="assocMul">Associative — multiplication</option><option value="distributive">Distributive property</option><option value="identityAdd">Additive identity</option><option value="identityMul">Multiplicative identity</option><option value="inverseAdd">Additive inverse</option><option value="inverseMul">Multiplicative inverse</option><option value="closureDiv">Closure — division</option></select></div>
<div class="field"><label for="an">a numerator</label><input id="an" type="number" value="2"></div><div class="field"><label for="ad">a denominator</label><input id="ad" type="number" value="3"></div>
<div class="field"><label for="bn">b numerator</label><input id="bn" type="number" value="1"></div><div class="field"><label for="bd">b denominator</label><input id="bd" type="number" value="4"></div>
<div class="field extra"><label for="cn">c numerator</label><input id="cn" type="number" value="1"></div><div class="field extra"><label for="cd">c denominator</label><input id="cd" type="number" value="5"></div></div>
<div class="result" id="result" aria-live="polite"></div><div class="work" id="work"></div><div class="actions"><button id="reset" type="button">Reset example</button></div></section>
<div class="page-actions"><a href="maths-rational-number-properties-learn.html?v=20261117-rational-number-properties-learn-v1">Brief Learn →</a><a href="maths-rational-number-properties-quiz.html?v=20261117-rational-number-properties-quiz-architecture-v1">Take Quiz →</a></div></main>
<script>(function(){const $=id=>document.getElementById(id);const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t}return a||1};function f(n,d){if(!Number.isFinite(n)||!Number.isFinite(d)||!Number.isInteger(n)||!Number.isInteger(d))throw Error('Enter integer numerators and denominators.');if(d===0)throw Error('A denominator cannot be zero.');if(d<0){n=-n;d=-d}const g=gcd(n,d);return {n:n/g,d:d/g}}const add=(x,y)=>f(x.n*y.d+y.n*x.d,x.d*y.d),mul=(x,y)=>f(x.n*y.n,x.d*y.d),neg=x=>f(-x.n,x.d),rec=x=>{if(x.n===0)throw Error('Zero has no multiplicative inverse.');return f(x.d,x.n)},div=(x,y)=>mul(x,rec(y));const fmt=x=>x.d===1?String(x.n):x.n+'/'+x.d;function calc(){try{const a=f(+$('an').value,+$('ad').value),b=f(+$('bn').value,+$('bd').value),c=f(+$('cn').value,+$('cd').value),p=$('property').value;document.querySelectorAll('.extra').forEach(el=>el.style.display=['assocAdd','assocMul','distributive'].includes(p)?'block':'none');let l,r,statement;if(p==='commAdd'){l=add(a,b);r=add(b,a);statement=fmt(a)+' + '+fmt(b)+' = '+fmt(b)+' + '+fmt(a)}else if(p==='commMul'){l=mul(a,b);r=mul(b,a);statement=fmt(a)+' × '+fmt(b)+' = '+fmt(b)+' × '+fmt(a)}else if(p==='assocAdd'){l=add(add(a,b),c);r=add(a,add(b,c));statement='('+fmt(a)+' + '+fmt(b)+') + '+fmt(c)+' = '+fmt(a)+' + ('+fmt(b)+' + '+fmt(c)+')'}else if(p==='assocMul'){l=mul(mul(a,b),c);r=mul(a,mul(b,c));statement='('+fmt(a)+' × '+fmt(b)+') × '+fmt(c)+' = '+fmt(a)+' × ('+fmt(b)+' × '+fmt(c)+')'}else if(p==='distributive'){l=mul(a,add(b,c));r=add(mul(a,b),mul(a,c));statement=fmt(a)+' × ('+fmt(b)+' + '+fmt(c)+') = ('+fmt(a)+' × '+fmt(b)+') + ('+fmt(a)+' × '+fmt(c)+')'}else if(p==='identityAdd'){l=add(a,f(0,1));r=a;statement=fmt(a)+' + 0 = '+fmt(a)}else if(p==='identityMul'){l=mul(a,f(1,1));r=a;statement=fmt(a)+' × 1 = '+fmt(a)}else if(p==='inverseAdd'){l=add(a,neg(a));r=f(0,1);statement=fmt(a)+' + ('+fmt(neg(a))+') = 0'}else if(p==='inverseMul'){l=mul(a,rec(a));r=f(1,1);statement=fmt(a)+' × '+fmt(rec(a))+' = 1'}else{if(b.n===0)throw Error('Division by zero is undefined; the divisor must be non-zero.');l=div(a,b);r=null;statement=fmt(a)+' ÷ '+fmt(b)+' = '+fmt(l)}$('result').textContent=r?'Left side = '+fmt(l)+' · Right side = '+fmt(r)+' — '+(fmt(l)===fmt(r)?'property holds.':'values differ.'):'Quotient = '+fmt(l)+' — it is rational.';$('work').textContent=statement+(r?'\nExact comparison: '+fmt(l)+' and '+fmt(r):'\nThe quotient is rational because the divisor is non-zero.')}catch(e){$('result').textContent=e.message;$('work').textContent='Check the values and try again.'}}['property','an','ad','bn','bd','cn','cd'].forEach(id=>$(id).addEventListener('input',calc));$('reset').addEventListener('click',()=>{[['property','commAdd'],['an','2'],['ad','3'],['bn','1'],['bd','4'],['cn','1'],['cd','5']].forEach(([id,v])=>$(id).value=v);calc()});calc()})();</script><script src="/shared-nav.js?v=20261125-central-design-system-v2"></script>
