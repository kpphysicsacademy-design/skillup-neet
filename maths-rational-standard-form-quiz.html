(function(){'use strict';const questions=[{"d":"BASIC","q":"Write 18/24 in standard form.","o":["3/4","6/8","9/12","18/12"],"a":0,"e":"Divide numerator and denominator by their greatest common divisor, 6.","v":"rational-standard-form"},{"d":"BASIC","q":"Which fraction is in standard form?","o":["8/12","−6/9","5/8","14/21"],"a":2,"e":"5 and 8 have no common factor greater than 1, and the denominator is positive.","v":"rational-standard-form"},{"d":"BASIC","q":"Write −21/28 in standard form.","o":["−3/4","3/4","−7/9","−4/3"],"a":0,"e":"Divide both terms by 7 and keep the negative sign.","v":"rational-standard-form"},{"d":"BASIC","q":"What is the standard form of 0/9?","o":["0/1","1/0","0/9","9/0"],"a":0,"e":"Zero as a rational number is written as 0/1 in standard form.","v":"rational-standard-form"},{"d":"BASIC","q":"Which denominator condition is used in standard form?","o":["Denominator is negative","Denominator is positive","Numerator is always positive","Numerator is larger"],"a":1,"e":"A rational number in standard form has a positive denominator.","v":"rational-standard-form"},{"d":"BASIC","q":"Simplify 32/40 to standard form.","o":["4/5","8/10","16/20","5/4"],"a":0,"e":"The greatest common divisor of 32 and 40 is 8.","v":"rational-standard-form"},{"d":"BASIC","q":"Which fraction is already in standard form?","o":["−12/18","7/10","15/25","−8/12"],"a":1,"e":"7 and 10 are coprime and the denominator is positive.","v":"rational-standard-form"},{"d":"BASIC","q":"Simplify −16/20.","o":["−4/5","4/5","−5/4","−8/10"],"a":0,"e":"Divide numerator and denominator by 4.","v":"rational-standard-form"},{"d":"BASIC","q":"What is the standard form of 45/60?","o":["3/4","4/3","9/12","15/20"],"a":0,"e":"Divide numerator and denominator by 15.","v":"rational-standard-form"},{"d":"BASIC","q":"Which fraction is equivalent to −2/7 and in standard form?","o":["−4/14","2/7","−2/7","−6/21"],"a":2,"e":"−2/7 is already in standard form.","v":"rational-standard-form"},{"d":"MEDIUM","q":"Reduce 84/126 to standard form.","o":["2/3","3/2","4/6","7/9"],"a":0,"e":"The greatest common divisor is 42; 84/126 = 2/3.","v":"rational-standard-form"},{"d":"MEDIUM","q":"Write −54/72 in standard form.","o":["−3/4","3/4","−4/3","−6/8"],"a":0,"e":"Divide numerator and denominator by 18.","v":"rational-standard-form"},{"d":"MEDIUM","q":"Which fraction equals 7/9 and is in standard form?","o":["21/27","−7/9","14/18","7/9"],"a":3,"e":"7/9 is already reduced and has a positive denominator.","v":"rational-standard-form"},{"d":"MEDIUM","q":"Convert 6/−15 to standard form.","o":["−2/5","2/5","−5/2","6/15"],"a":0,"e":"Move the negative sign to the numerator and divide by 3.","v":"rational-standard-form"},{"d":"MEDIUM","q":"Reduce −96/144.","o":["−2/3","2/3","−3/2","−8/12"],"a":0,"e":"Divide numerator and denominator by 48.","v":"rational-standard-form"},{"d":"MEDIUM","q":"Which pair are both in standard form?","o":["6/8 and 3/7","−2/5 and 4/9","8/12 and 5/6","−9/12 and 7/10"],"a":1,"e":"Both fractions have positive denominators and coprime numerator-denominator pairs.","v":"rational-standard-form"},{"d":"MEDIUM","q":"A fraction reduces to 5/6 after dividing numerator and denominator by 4. What was the original fraction?","o":["5/6","20/24","10/12","15/18"],"a":1,"e":"Multiplying both terms of 5/6 by 4 gives 20/24.","v":"rational-standard-form"},{"d":"MEDIUM","q":"What is the standard form of 0/−13?","o":["0/1","0/13","−1/13","13/0"],"a":0,"e":"Zero over any non-zero denominator equals zero; its standard form is 0/1.","v":"rational-standard-form"},{"d":"MEDIUM","q":"Reduce 121/143 to standard form.","o":["11/13","13/11","1/2","121/143"],"a":0,"e":"Both numerator and denominator are divisible by 11: 121/143 = 11/13.","v":"rational-standard-form"},{"d":"MEDIUM","q":"Which fraction is NOT in standard form?","o":["5/12","−7/8","12/18","−4/9"],"a":2,"e":"12/18 can be reduced to 2/3, so it is not in standard form.","v":"rational-standard-form"},{"d":"HARD","q":"A rational number is −42/63. What is its standard form?","o":["−2/3","2/3","−3/2","−14/21"],"a":0,"e":"The greatest common divisor is 21; dividing gives −2/3.","v":"rational-standard-form"},{"d":"HARD","q":"If n/36 in standard form equals 5/12, what is n?","o":["5","10","15","20"],"a":2,"e":"n/36 = 5/12, so n = 36 × 5/12 = 15.","v":"rational-standard-form"},{"d":"HARD","q":"A fraction reduces to −3/5 when numerator and denominator are divided by 7. What was the fraction?","o":["−21/35","21/35","−3/35","−21/5"],"a":0,"e":"Multiplying −3/5 by 7/7 gives −21/35.","v":"rational-standard-form"},{"d":"HARD","q":"Which is the standard form of 156/−208?","o":["−3/4","3/4","−4/3","−39/52"],"a":0,"e":"Move the sign to the numerator and divide both terms by 52.","v":"rational-standard-form"},{"d":"HARD","q":"A student says 0/−8 is in standard form. Which correction is best?","o":["It is 0/1 in standard form","It is −1/8","It is 1/0","It cannot represent a rational number"],"a":0,"e":"The denominator must be positive; zero over any non-zero integer equals zero, written 0/1.","v":"rational-standard-form"},{"d":"HARD","q":"Reduce 225/375 to standard form.","o":["3/5","5/3","15/25","45/75"],"a":0,"e":"Divide numerator and denominator by 75.","v":"rational-standard-form"},{"d":"HARD","q":"Which fraction is equivalent to −11/13 and already in standard form?","o":["22/26","−33/39","−11/13","11/13"],"a":2,"e":"−11/13 is already reduced and its denominator is positive.","v":"rational-standard-form"},{"d":"HARD","q":"If 28/x is in standard form and equivalent to 4/9, what is x?","o":["63","9","7","36"],"a":0,"e":"28/x = 4/9 gives 4x = 252, so x = 63.","v":"rational-standard-form"},{"d":"HARD","q":"Which rational number has standard form −5/8?","o":["−25/40","−15/24","−5/8","5/8"],"a":2,"e":"−5/8 is reduced and has a positive denominator.","v":"rational-standard-form"},{"d":"HARD","q":"A fraction has numerator −36 and denominator 48. What is its standard form?","o":["−3/4","3/4","−4/3","−9/12"],"a":0,"e":"Divide numerator and denominator by 12 to obtain −3/4.","v":"rational-standard-form"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Multiply positive and negative integers</strong><small>Apply sign rules to integer products</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Solve multiplication word problems</strong><small>Reason with signs and products</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply ruler-and-compass reasoning</strong><small>Use accurate integer multiplication methods</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
