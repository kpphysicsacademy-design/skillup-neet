<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"Rationalise the denominator: 1/√2.","o":["√2","√2/2","2√2","1/2"],"a":1,"why":"Multiply numerator and denominator by √2: 1/√2 = √2/2."},{"d":"BASIC","q":"Which expression has a rational denominator?","o":["1/√3","2/(√5 + 1)","3/4","1/√7"],"a":2,"why":"3/4 already has a rational denominator."},{"d":"BASIC","q":"What is √3 × √3?","o":["√6","3","9","3√3"],"a":1,"why":"The square root multiplied by itself equals the number under the root."},{"d":"BASIC","q":"Rationalise 1/√5.","o":["√5/5","5/√5","1/5","√5"],"a":0,"why":"Multiply top and bottom by √5 to get √5/5."},{"d":"BASIC","q":"What is the conjugate of √7 + 2?","o":["√7 + 2","√7 − 2","2 − √7","−√7 − 2"],"a":1,"why":"The conjugate changes the sign between the two terms."},{"d":"BASIC","q":"Simplify (√5)².","o":["5","√10","25","2√5"],"a":0,"why":"Squaring a square root returns the radicand: (√5)² = 5."},{"d":"BASIC","q":"Which is the conjugate of 3 − √2?","o":["3 − √2","3 + √2","−3 + √2","3√2"],"a":1,"why":"The conjugate of a − b is a + b."},{"d":"BASIC","q":"What is (√3 + 1)(√3 − 1)?","o":["2","3","4","√3 − 1"],"a":0,"why":"Use difference of squares: (√3)² − 1² = 3 − 1 = 2."},{"d":"BASIC","q":"Which is a rational number?","o":["√2","√5","√16","π"],"a":2,"why":"√16 = 4, an integer and therefore rational."},{"d":"BASIC","q":"Why multiply by a conjugate when rationalising a denominator like √3 − 1?","o":["To make the numerator zero","To use a difference of squares and remove radicals from the denominator","To increase the denominator","To change the value of the fraction"],"a":1,"why":"Multiplying by the conjugate creates (√3)² − 1² = 2 in the denominator."},{"d":"MEDIUM","q":"Rationalise 3/√7.","o":["3√7/7","√7/3","3/7","21√7"],"a":0,"why":"Multiply numerator and denominator by √7: 3√7/7."},{"d":"MEDIUM","q":"Rationalise 1/(√3 + 1).","o":["(√3 + 1)/2","(√3 − 1)/2","√3 − 1","1/2"],"a":1,"why":"Multiply by the conjugate: (√3 − 1)/(3 − 1) = (√3 − 1)/2."},{"d":"MEDIUM","q":"Simplify 2/(√5 − 1) by rationalising.","o":["(√5 − 1)/2","(√5 + 1)/2","√5 + 1","2√5/4"],"a":1,"why":"Multiply by (√5 + 1): 2(√5 + 1)/(5 − 1) = (√5 + 1)/2."},{"d":"MEDIUM","q":"What is the product of (√7 + √2)(√7 − √2)?","o":["9","5","√14","2"],"a":1,"why":"Difference of squares gives 7 − 2 = 5."},{"d":"MEDIUM","q":"Rationalise 5/(2√3).","o":["5√3/6","5√3/2","√3/10","10√3/3"],"a":0,"why":"Multiply top and bottom by √3: 5√3/(2 × 3) = 5√3/6."},{"d":"MEDIUM","q":"Simplify 1/(√5 + √2) by rationalising.","o":["(√5 + √2)/3","(√5 − √2)/3","√5 − √2","1/3"],"a":1,"why":"The denominator becomes 5 − 2 = 3 after multiplying by the conjugate."},{"d":"MEDIUM","q":"Rationalise 4/(√6 + √2).","o":["√6 − √2","√6 + √2","√6 − √2/2","√6 − √2/1"],"a":0,"why":"Multiply by the conjugate: 4(√6 − √2)/(6 − 2) = √6 − √2."},{"d":"MEDIUM","q":"Simplify (√12)/(√3).","o":["2","√9","4","3"],"a":0,"why":"√12/√3 = √(12/3) = √4 = 2."},{"d":"MEDIUM","q":"Which is equivalent to 1/(2 − √3)?","o":["2 − √3","2 + √3","2 + √3 divided by 1","(2 + √3)"],"a":1,"why":"Multiply by 2 + √3: denominator 4 − 3 = 1, so the result is 2 + √3."},{"d":"MEDIUM","q":"Simplify (√5 + √2)².","o":["7 + 2√10","7 + √10","3 + 2√10","7 − 2√10"],"a":0,"why":"Expand: 5 + 2√10 + 2 = 7 + 2√10."},{"d":"HARD","q":"Rationalise 1/(√7 − √5).","o":["(√7 − √5)/2","(√7 + √5)/2","√7 + √5","1/2"],"a":1,"why":"Multiply by the conjugate; the denominator is 7 − 5 = 2."},{"d":"HARD","q":"Simplify 3/(√5 + √2).","o":["√5 − √2","√5 + √2","3(√5 − √2)/3","(√5 − √2)/3"],"a":0,"why":"Multiply by the conjugate: 3(√5 − √2)/(5 − 2) = √5 − √2."},{"d":"HARD","q":"Simplify (√3 + √2)/(√3 − √2).","o":["5 + 2√6","5 − 2√6","1","√6"],"a":0,"why":"Multiply top and bottom by √3 + √2: numerator (√3 + √2)² = 5 + 2√6; denominator is 1."},{"d":"HARD","q":"Rationalise 2/(3 + √5).","o":["(3 − √5)/2","3 − √5","2(3 − √5)/4","(3 + √5)/2"],"a":0,"why":"Multiply by 3 − √5: 2(3 − √5)/(9 − 5) = (3 − √5)/2."},{"d":"HARD","q":"Simplify 1/(√2 + √3) + 1/(√3 − √2).","o":["2√3","2√2","√6","2"],"a":0,"why":"Rationalise each: first is √3 − √2, second is √3 + √2; sum = 2√3."},{"d":"HARD","q":"Which is the rationalised form of 6/(√11 − √5)?","o":["√11 + √5","(√11 + √5)","(√11 + √5) / 1","(√11 + √5)"],"a":0,"why":"Multiply by the conjugate: 6(√11 + √5)/(11 − 5) = √11 + √5."},{"d":"HARD","q":"Simplify (√8 − √2)/(√8 + √2).","o":["1/3","1/2","3","√2"],"a":0,"why":"√8 = 2√2, so the ratio is (2√2 − √2)/(2√2 + √2) = 1/3."},{"d":"HARD","q":"Rationalise 1/(√6 + √5).","o":["√6 − √5","√6 + √5","1","√30"],"a":0,"why":"Multiply by the conjugate; denominator 6 − 5 = 1, giving √6 − √5."},{"d":"HARD","q":"Simplify (√5 − √3)².","o":["8 − 2√15","2 − √15","8 + 2√15","2"],"a":0,"why":"Expand: 5 + 3 − 2√15 = 8 − 2√15."},{"d":"HARD","q":"Rationalise 2/(√3 + 1) and simplify.","o":["√3 − 1","√3 + 1","2√3","1"],"a":0,"why":"Multiply by √3 − 1: 2(√3 − 1)/(3 − 1) = √3 − 1."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Rationalisation Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
