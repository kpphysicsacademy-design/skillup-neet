(function(){'use strict';const questions=[{"d":"BASIC","q":"Rationalise the denominator: 1/√2.","o":["√2","√2/2","2√2","1/2"],"a":1,"e":"Multiply numerator and denominator by √2: 1/√2 = √2/2."},{"d":"BASIC","q":"Which expression has a rational denominator?","o":["1/√3","2/(√5 + 1)","3/4","1/√7"],"a":2,"e":"3/4 already has a rational denominator."},{"d":"BASIC","q":"What is √3 × √3?","o":["√6","3","9","3√3"],"a":1,"e":"The square root multiplied by itself equals the number under the root."},{"d":"BASIC","q":"Rationalise 1/√5.","o":["√5/5","5/√5","1/5","√5"],"a":0,"e":"Multiply top and bottom by √5 to get √5/5."},{"d":"BASIC","q":"What is the conjugate of √7 + 2?","o":["√7 + 2","√7 − 2","2 − √7","−√7 − 2"],"a":1,"e":"The conjugate changes the sign between the two terms."},{"d":"BASIC","q":"Simplify (√5)².","o":["5","√10","25","2√5"],"a":0,"e":"Squaring a square root returns the radicand: (√5)² = 5."},{"d":"BASIC","q":"Which is the conjugate of 3 − √2?","o":["3 − √2","3 + √2","−3 + √2","3√2"],"a":1,"e":"The conjugate of a − b is a + b."},{"d":"BASIC","q":"What is (√3 + 1)(√3 − 1)?","o":["2","3","4","√3 − 1"],"a":0,"e":"Use difference of squares: (√3)² − 1² = 3 − 1 = 2."},{"d":"BASIC","q":"Which is a rational number?","o":["√2","√5","√16","π"],"a":2,"e":"√16 = 4, an integer and therefore rational."},{"d":"BASIC","q":"Why multiply by a conjugate when rationalising a denominator like √3 − 1?","o":["To make the numerator zero","To use a difference of squares and remove radicals from the denominator","To increase the denominator","To change the value of the fraction"],"a":1,"e":"Multiplying by the conjugate creates (√3)² − 1² = 2 in the denominator."},{"d":"MEDIUM","q":"Rationalise 3/√7.","o":["3√7/7","√7/3","3/7","21√7"],"a":0,"e":"Multiply numerator and denominator by √7: 3√7/7."},{"d":"MEDIUM","q":"Rationalise 1/(√3 + 1).","o":["(√3 + 1)/2","(√3 − 1)/2","√3 − 1","1/2"],"a":1,"e":"Multiply by the conjugate: (√3 − 1)/(3 − 1) = (√3 − 1)/2."},{"d":"MEDIUM","q":"Simplify 2/(√5 − 1) by rationalising.","o":["(√5 − 1)/2","(√5 + 1)/2","√5 + 1","2√5/4"],"a":1,"e":"Multiply by (√5 + 1): 2(√5 + 1)/(5 − 1) = (√5 + 1)/2."},{"d":"MEDIUM","q":"What is the product of (√7 + √2)(√7 − √2)?","o":["9","5","√14","2"],"a":1,"e":"Difference of squares gives 7 − 2 = 5."},{"d":"MEDIUM","q":"Rationalise 5/(2√3).","o":["5√3/6","5√3/2","√3/10","10√3/3"],"a":0,"e":"Multiply top and bottom by √3: 5√3/(2 × 3) = 5√3/6."},{"d":"MEDIUM","q":"Simplify 1/(√5 + √2) by rationalising.","o":["(√5 + √2)/3","(√5 − √2)/3","√5 − √2","1/3"],"a":1,"e":"The denominator becomes 5 − 2 = 3 after multiplying by the conjugate."},{"d":"MEDIUM","q":"Rationalise 4/(√6 + √2).","o":["√6 − √2","√6 + √2","√6 − √2/2","√6 − √2/1"],"a":0,"e":"Multiply by the conjugate: 4(√6 − √2)/(6 − 2) = √6 − √2."},{"d":"MEDIUM","q":"Simplify (√12)/(√3).","o":["2","√9","4","3"],"a":0,"e":"√12/√3 = √(12/3) = √4 = 2."},{"d":"MEDIUM","q":"Which is equivalent to 1/(2 − √3)?","o":["2 − √3","2 + √3","2 + √3 divided by 1","(2 + √3)"],"a":1,"e":"Multiply by 2 + √3: denominator 4 − 3 = 1, so the result is 2 + √3."},{"d":"MEDIUM","q":"Simplify (√5 + √2)².","o":["7 + 2√10","7 + √10","3 + 2√10","7 − 2√10"],"a":0,"e":"Expand: 5 + 2√10 + 2 = 7 + 2√10."},{"d":"HARD","q":"Rationalise 1/(√7 − √5).","o":["(√7 − √5)/2","(√7 + √5)/2","√7 + √5","1/2"],"a":1,"e":"Multiply by the conjugate; the denominator is 7 − 5 = 2."},{"d":"HARD","q":"Simplify 3/(√5 + √2).","o":["√5 − √2","√5 + √2","3(√5 − √2)/3","(√5 − √2)/3"],"a":0,"e":"Multiply by the conjugate: 3(√5 − √2)/(5 − 2) = √5 − √2."},{"d":"HARD","q":"Simplify (√3 + √2)/(√3 − √2).","o":["5 + 2√6","5 − 2√6","1","√6"],"a":0,"e":"Multiply top and bottom by √3 + √2: numerator (√3 + √2)² = 5 + 2√6; denominator is 1."},{"d":"HARD","q":"Rationalise 2/(3 + √5).","o":["(3 − √5)/2","3 − √5","2(3 − √5)/4","(3 + √5)/2"],"a":0,"e":"Multiply by 3 − √5: 2(3 − √5)/(9 − 5) = (3 − √5)/2."},{"d":"HARD","q":"Simplify 1/(√2 + √3) + 1/(√3 − √2).","o":["2√3","2√2","√6","2"],"a":0,"e":"Rationalise each: first is √3 − √2, second is √3 + √2; sum = 2√3."},{"d":"HARD","q":"Which is the rationalised form of 6/(√11 − √5)?","o":["√11 + √5","(√11 + √5)","(√11 + √5) / 1","(√11 + √5)"],"a":0,"e":"Multiply by the conjugate: 6(√11 + √5)/(11 − 5) = √11 + √5."},{"d":"HARD","q":"Simplify (√8 − √2)/(√8 + √2).","o":["1/3","1/2","3","√2"],"a":0,"e":"√8 = 2√2, so the ratio is (2√2 − √2)/(2√2 + √2) = 1/3."},{"d":"HARD","q":"Rationalise 1/(√6 + √5).","o":["√6 − √5","√6 + √5","1","√30"],"a":0,"e":"Multiply by the conjugate; denominator 6 − 5 = 1, giving √6 − √5."},{"d":"HARD","q":"Simplify (√5 − √3)².","o":["8 − 2√15","2 − √15","8 + 2√15","2"],"a":0,"e":"Expand: 5 + 3 − 2√15 = 8 − 2√15."},{"d":"HARD","q":"Rationalise 2/(√3 + 1) and simplify.","o":["√3 − 1","√3 + 1","2√3","1"],"a":0,"e":"Multiply by √3 − 1: 2(√3 − 1)/(3 − 1) = √3 − 1."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Rationalise denominators</strong><small>Remove radicals from denominators using square roots</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Use conjugates</strong><small>Apply difference of squares to simplify surds</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Simplify surd expressions</strong><small>Combine square roots and rationalise complex fractions</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
