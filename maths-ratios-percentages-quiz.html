<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
 .skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}.skills-result{margin-top:14px;text-align:left}.skills-result h3{margin:0 0 8px;font-size:1rem}.skills-result .skill-item{margin-top:7px}.skill-item.unlocked{border-color:var(--green);color:var(--green2);background:#174b42} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}.diagram .accent{stroke:#58d6a3}.diagram .blue{stroke:#91b7ff}.diagram .gold{stroke:#ffd27a} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Ratios and Percentages</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Ratios and Percentages Skills"><div class="skill-title">🎯 Pythagoras Skills</div><div class="skill-list"><div class="skill-item">Simplify and compare ratios</div><div class="skill-item">Calculate percentages and percentage changes</div><div class="skill-item">Solve profit, loss and discount problems</div></div></section></div>
<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Simplify the ratio 12:18.","o":["8:12","2:3","3:2","6:9"],"a":1,"e":"Divide both terms by their greatest common factor, 6, to get 2:3.","v":"ratios-percentages"},{"d":"BASIC","q":"A class has 10 boys and 15 girls. What is the ratio of boys to girls in simplest form?","o":["2:3","3:2","2:5","5:2"],"a":0,"e":"10:15 simplifies by dividing both terms by 5, giving 2:3.","v":"ratios-percentages"},{"d":"BASIC","q":"Write 3:5 as a fraction in simplest form.","o":["5/3","3/8","3/5","5/8"],"a":2,"e":"The ratio 3:5 corresponds to the fraction 3/5.","v":"ratios-percentages"},{"d":"BASIC","q":"Which ratio is equivalent to 4:7?","o":["8:14","12:14","4:14","7:4"],"a":0,"e":"Multiplying both terms of 4:7 by 2 gives 8:14.","v":"ratios-percentages"},{"d":"BASIC","q":"A shirt costs ₹500 before a discount of 10%. What is the discount amount?","o":["₹5","₹10","₹50","₹450"],"a":2,"e":"10% of ₹500 is 0.10 × 500 = ₹50.","v":"ratios-percentages"},{"d":"BASIC","q":"Find 25% of 80.","o":["15","20","25","40"],"a":1,"e":"One quarter of 80 is 80 ÷ 4 = 20.","v":"ratios-percentages"},{"d":"BASIC","q":"Convert 0.35 into a percentage.","o":["3.5%","35%","350%","0.35%"],"a":1,"e":"Multiply the decimal by 100: 0.35 × 100 = 35%.","v":"ratios-percentages"},{"d":"BASIC","q":"A student scores 36 marks out of 40. What is the percentage score?","o":["80%","85%","90%","95%"],"a":2,"e":"(36 ÷ 40) × 100 = 90%.","v":"ratios-percentages"},{"d":"BASIC","q":"The ratio of red to blue beads is 2:3. If there are 10 red beads, how many blue beads are there?","o":["12","15","20","30"],"a":1,"e":"The scale factor is 10 ÷ 2 = 5, so blue beads = 3 × 5 = 15.","v":"ratios-percentages"},{"d":"BASIC","q":"Which percentage is equal to 1/5?","o":["5%","10%","20%","25%"],"a":2,"e":"1/5 × 100% = 20%.","v":"ratios-percentages"},{"d":"MEDIUM","q":"Divide ₹360 in the ratio 2:4. What is the smaller share?","o":["₹60","₹90","₹120","₹180"],"a":2,"e":"There are 6 total parts; the smaller share is 2/6 × ₹360 = ₹120.","v":"ratios-percentages"},{"d":"MEDIUM","q":"A price rises from ₹200 to ₹250. What is the percentage increase?","o":["20%","25%","30%","50%"],"a":1,"e":"The increase is ₹50; 50/200 × 100 = 25%.","v":"ratios-percentages"},{"d":"MEDIUM","q":"A bag marked ₹800 is sold at a 15% discount. Find its selling price.","o":["₹120","₹680","₹700","₹785"],"a":1,"e":"Discount = 15% of 800 = ₹120, so selling price = ₹800 − ₹120 = ₹680.","v":"ratios-percentages"},{"d":"MEDIUM","q":"A recipe uses flour and sugar in the ratio 5:2. If 350 g of flour is used, how much sugar is needed?","o":["70 g","100 g","140 g","175 g"],"a":2,"e":"One ratio part is 350 ÷ 5 = 70 g; sugar is 2 × 70 = 140 g.","v":"ratios-percentages"},{"d":"MEDIUM","q":"A number is increased from 80 to 100. What is the percentage increase?","o":["20%","25%","30%","80%"],"a":1,"e":"The increase is 20, and 20/80 × 100 = 25%.","v":"ratios-percentages"},{"d":"MEDIUM","q":"In a school, 40% of 250 students take the bus. How many students take the bus?","o":["40","80","100","150"],"a":2,"e":"40% of 250 = 0.40 × 250 = 100 students.","v":"ratios-percentages"},{"d":"MEDIUM","q":"A shop buys a notebook for ₹60 and sells it for ₹75. What is the profit percentage on cost price?","o":["15%","20%","25%","30%"],"a":2,"e":"Profit = ₹15; profit percentage = 15/60 × 100 = 25%.","v":"ratios-percentages"},{"d":"MEDIUM","q":"A product costs ₹500 and is sold for ₹425. Find the loss percentage.","o":["10%","12%","15%","17%"],"a":2,"e":"Loss = ₹75; loss percentage = 75/500 × 100 = 15%.","v":"ratios-percentages"},{"d":"MEDIUM","q":"The ratio of two numbers is 3:8 and their sum is 55. Find the smaller number.","o":["11","15","24","40"],"a":1,"e":"Eleven total parts equal 55, so each part is 5; the smaller number is 3 × 5 = 15.","v":"ratios-percentages"},{"d":"MEDIUM","q":"A quantity falls from 120 to 90. What is the percentage decrease?","o":["20%","25%","30%","33⅓%"],"a":1,"e":"The decrease is 30; 30/120 × 100 = 25%.","v":"ratios-percentages"},{"d":"HARD","q":"A price of ₹1,000 is increased by 20% and then reduced by 20%. What is the final price?","o":["₹960","₹1,000","₹1,020","₹800"],"a":0,"e":"After the rise it is ₹1,200; a 20% reduction of ₹1,200 is ₹240, leaving ₹960.","v":"ratios-percentages"},{"d":"HARD","q":"A shopkeeper sells an item for ₹720 at a profit of 20%. Find its cost price.","o":["₹576","₹600","₹620","₹864"],"a":1,"e":"Selling price is 120% of cost price, so cost price = 720 ÷ 1.2 = ₹600.","v":"ratios-percentages"},{"d":"HARD","q":"After a 10% discount, a jacket costs ₹900. What was its marked price?","o":["₹990","₹1,000","₹1,100","₹810"],"a":1,"e":"₹900 is 90% of marked price; marked price = 900 ÷ 0.9 = ₹1,000.","v":"ratios-percentages"},{"d":"HARD","q":"A sum is divided between A and B in the ratio 7:5. If A receives ₹840, how much does B receive?","o":["₹500","₹600","₹700","₹720"],"a":1,"e":"One part is ₹840 ÷ 7 = ₹120; B receives 5 × ₹120 = ₹600.","v":"ratios-percentages"},{"d":"HARD","q":"A number is first decreased by 25%, then increased by 25%. Starting from 400, what is the final value?","o":["375","400","425","450"],"a":0,"e":"400 reduced by 25% becomes 300; increasing 300 by 25% gives 375.","v":"ratios-percentages"},{"d":"HARD","q":"A shopkeeper buys 40 pens for ₹600 and sells each pen for ₹18. What is the profit percentage?","o":["10%","15%","20%","25%"],"a":2,"e":"Revenue = 40 × ₹18 = ₹720; profit = ₹120, which is 20% of ₹600.","v":"ratios-percentages"},{"d":"HARD","q":"The ratio of boys to girls is 4:5. If 20 girls join and the new ratio becomes 2:3, how many boys were there originally?","o":["40","60","80","100"],"a":2,"e":"Let boys = 4k and girls = 5k. 4k/(5k+20)=2/3 gives 12k=10k+40, so k=20 and boys=80.","v":"ratios-percentages"},{"d":"HARD","q":"A trader marks an item 30% above its cost price of ₹500 and then gives a 10% discount on the marked price. Find the selling price.","o":["₹550","₹585","₹600","₹650"],"a":1,"e":"Marked price = ₹650; after 10% discount, selling price = ₹650 × 0.9 = ₹585.","v":"ratios-percentages"},{"d":"HARD","q":"A student answers 42 questions correctly out of 50. How many additional correct answers are needed to reach 90% if the total remains 50?","o":["2","3","4","5"],"a":1,"e":"90% of 50 is 45; 45 − 42 = 3 additional correct answers.","v":"ratios-percentages"},{"d":"HARD","q":"A town's population of 20,000 grows by 10% in one year and by 10% again the next year. What is the population after two years?","o":["22,000","24,000","24,200","24,400"],"a":2,"e":"After year one: 22,000; after year two: 22,000 × 1.10 = 24,200.","v":"ratios-percentages"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}const visuals={
balance:'',
blocks:'',
bars:'',
picture:''
};function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🔢</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+'<div class="skill-item '+(correct>=8?'unlocked':'')+'">'+(correct>=8?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Simplify and compare ratios</div>'+'<div class="skill-item '+(correct>=18?'unlocked':'')+'">'+(correct>=18?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Calculate percentages and percentage changes</div>'+'<div class="skill-item '+(correct>=24?'unlocked':'')+'">'+(correct>=24?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Solve profit, loss and discount problems</div>'+'</div></div>' ;$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script></body></html>
