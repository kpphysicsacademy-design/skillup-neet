<script>(function(){'use strict';const originalQuestions=[{"id":"b01","d":"BASIC","q":"A ray has which of the following?","o":["One endpoint and extends endlessly in one direction","Two endpoints","No endpoint and extends in both directions","A fixed finite length"],"a":0,"e":"A ray starts at one endpoint and continues without end in one direction."},{"id":"b02","d":"BASIC","q":"What is the common endpoint of two rays forming an angle called?","o":["Centre","Vertex","Midpoint","Radius"],"a":1,"e":"The vertex is the shared endpoint of the two arms."},{"id":"b03","d":"BASIC","q":"Which notation represents the ray that starts at A and passes through B?","o":["AB","BA","Ray AB","Segment AB"],"a":2,"e":"Ray AB starts at A and extends through B."},{"id":"b04","d":"BASIC","q":"An angle of 90° is called a:","o":["Acute angle","Right angle","Obtuse angle","Straight angle"],"a":1,"e":"A right angle measures exactly 90°."},{"id":"b05","d":"BASIC","q":"An angle of 35° is:","o":["Acute","Right","Obtuse","Reflex"],"a":0,"e":"An acute angle is greater than 0° and less than 90°."},{"id":"b06","d":"BASIC","q":"An angle of 145° is:","o":["Acute","Right","Obtuse","Straight"],"a":2,"e":"145° lies between 90° and 180°, so it is obtuse."},{"id":"b07","d":"BASIC","q":"How many degrees are in a straight angle?","o":["90°","120°","180°","360°"],"a":2,"e":"A straight angle measures 180°."},{"id":"b08","d":"BASIC","q":"Which instrument is used to measure an angle?","o":["Ruler","Protractor","Divider","Compass"],"a":1,"e":"A protractor measures angles in degrees."},{"id":"b09","d":"BASIC","q":"Two rays OA and OB form an angle. What is its vertex?","o":["A","B","O","AB"],"a":2,"e":"O is the common endpoint of both rays."},{"id":"b10","d":"BASIC","q":"An angle greater than 180° but less than 360° is:","o":["Acute","Obtuse","Reflex","Straight"],"a":2,"e":"A reflex angle is greater than 180° and less than 360°."},{"id":"m11","d":"MEDIUM","q":"Which statement correctly describes a line segment?","o":["It has one endpoint","It has two endpoints","It extends endlessly in both directions","It extends endlessly in one direction"],"a":1,"e":"A line segment is the part of a line bounded by two endpoints."},{"id":"m12","d":"MEDIUM","q":"Which pair of rays forms ∠PQR?","o":["QP and QR","PQ and PR","RQ and RP","QR and QP"],"a":0,"e":"In ∠PQR, Q is the vertex, so the arms are QP and QR."},{"id":"m13","d":"MEDIUM","q":"A straight angle is split into 68° and x°. Find x.","o":["102°","112°","122°","132°"],"a":1,"e":"Angles on a straight line total 180°; x = 180° − 68° = 112°."},{"id":"m14","d":"MEDIUM","q":"A right angle is split into 27° and x°. Find x.","o":["53°","63°","73°","117°"],"a":1,"e":"The parts of a right angle total 90°; x = 90° − 27° = 63°."},{"id":"m15","d":"MEDIUM","q":"Which of these is the largest angle?","o":["89°","91°","179°","181°"],"a":3,"e":"181° is greater than each of the other measures."},{"id":"m16","d":"MEDIUM","q":"The smaller angle between clock hands at 4:00 is:","o":["90°","100°","120°","150°"],"a":2,"e":"Each hour interval is 30°; four intervals give 4 × 30° = 120°."},{"id":"m17","d":"MEDIUM","q":"An angle measures 25°. How many degrees must it increase to become a right angle?","o":["55°","65°","75°","85°"],"a":1,"e":"90° − 25° = 65°."},{"id":"m18","d":"MEDIUM","q":"Which angle is neither acute nor obtuse?","o":["45°","90°","135°","179°"],"a":1,"e":"90° is a right angle, not acute or obtuse."},{"id":"m19","d":"MEDIUM","q":"A ray starts at O and passes through A. Which point must lie on the ray?","o":["A","A point behind O only","A point not on its path","No point"],"a":0,"e":"The ray OA begins at O and passes through A."},{"id":"m20","d":"MEDIUM","q":"An angle of 210° is classified as:","o":["Obtuse","Straight","Reflex","Full"],"a":2,"e":"210° is greater than 180° and less than 360°."},{"id":"h21","d":"HARD","q":"Two angles form a straight angle. One is twice the other. Find the smaller angle.","o":["45°","60°","90°","120°"],"a":1,"e":"Let the smaller be x. Then x + 2x = 180°, so x = 60°."},{"id":"h22","d":"HARD","q":"An angle is 18° less than a right angle. Find it.","o":["62°","72°","82°","108°"],"a":1,"e":"90° − 18° = 72°."},{"id":"h23","d":"HARD","q":"Three adjacent angles on a straight line are 38°, 67° and x°. Find x.","o":["65°","75°","85°","95°"],"a":1,"e":"38° + 67° + x = 180°, so x = 75°."},{"id":"h24","d":"HARD","q":"Two angles are in the ratio 2:3 and together form a right angle. Find the larger angle.","o":["36°","45°","54°","60°"],"a":2,"e":"Five equal parts make 90°, so one part is 18° and the larger is 3 × 18° = 54°."},{"id":"h25","d":"HARD","q":"An angle is four times its complement. Find the angle.","o":["18°","36°","72°","144°"],"a":2,"e":"Let it be x. x = 4(90° − x), so 5x = 360° and x = 72°."},{"id":"h26","d":"HARD","q":"Two angles on a straight line are (x + 20)° and 2x°. Find x.","o":["40°","50°","53⅓°","80°"],"a":2,"e":"x + 20 + 2x = 180, so 3x = 160 and x = 53⅓°."},{"id":"h27","d":"HARD","q":"The larger of two angles on a straight line is 4 times the smaller. Find the larger angle.","o":["36°","90°","120°","144°"],"a":3,"e":"Let the smaller be x. Then 5x = 180°, so x = 36° and the larger is 144°."},{"id":"h28","d":"HARD","q":"An angle is 3 times another angle. Their sum is 120°. Find the smaller angle.","o":["20°","30°","40°","60°"],"a":1,"e":"Let the smaller be x. Then 4x = 120°, so x = 30°."},{"id":"h29","d":"HARD","q":"The smaller angle between clock hands at 5:00 is:","o":["120°","150°","180°","210°"],"a":1,"e":"Five hour intervals separate the hands: 5 × 30° = 150°."},{"id":"h30","d":"HARD","q":"A reflex angle and its smaller associated angle make one full turn. If the smaller angle is 128°, find the reflex angle.","o":["212°","222°","232°","242°"],"a":2,"e":"A full turn is 360°; 360° − 128° = 232°."}];let questions=originalQuestions.slice(),index=0,selected=-1,locked=false,xp=0,correct=0,streak=0,bestStreak=0,mistakes=[];const $=id=>document.getElementById(id);functio stions.filter(q=>mistakes.some(m=>m.id===q.id)):originalQuestions.slice();index=0;selected=-1;locked=false;xp=0;correct=0;streak=0;bestStreak=0;mistakes=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render()}function finish(){progress();$('quiz').style.display='none';const card=el('section','finish'),review=el('div','review');card.append(el('div','trophy','📐'),el('h2','',correct>=25?'Excellent work!':correct>=18?'Good progress!':'Keep practising!'),el('a','topic-link','🧪 Explore Rays & Angles Simulator →'));card.querySelector('a').href='maths-rays-angles-simulator.html?v=20261111-rays-angles-simulator-v1';card.append(el('div','score',correct+' / '+questions.length),el('p','muted','You answered '+correct+' correctly and earned '+xp+' XP.'),el('p','',Math.round(correct/questions.length*100)+'% accuracy · Best streak: '+bestStreak));review.append(el('h3','',mistakes.length?'Review your mistakes ('+mistakes.length+')':'Perfect round!'));mistakes.forEach((m,i)=>{const item=el('div','review-item');item.append(el('b','',(i+1)+'. '+m.question),el('p','your-answer','Your answer: '+m.chosen),el('p','correct-answer','Correct answer: '+m.answer),el('p','',m.explanation));review.append(item)});card.append(review);const actions=el('div','review-actions'),wrong=el('button','btn secondary','Retry mistakes'),all=el('button','btn primary','Retry all');wrong.type=all.type='button';wrong.disabled=!mistakes.length;wrong.addEventListener('click',()=>restart(true));all.addEventListener('click',()=>restart(false));actions.append(wrong,all);card.append(actions);$('finishSlot').replaceChildren(card)}$('check').addEventListener('click',check);$('continue').addEventListener('click',()=>{index++;if(index<questions.length)render();else finish()});render()})();</script>
