<main><div class="eyebrow">Maths · Data Handling</div><h1>Reading Tables</h1><p class="intro">Read information in data tables, compare values, and calculate totals and differences.</p>
<a class="sim" href="maths-reading-tables-simulator.html?v=20261112-reading-tables-simulator-v1">🧮 Explore the Reading Tables Simulator</a>
<div class="pr"><span id="counter">QUESTION 1 OF 30</span><span id="pct">0% complete</span></div><div class="track" id="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="bar"></div></div>
<section class="quiz" id="quiz" aria-live="polite"><div class="meta" id="meta"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><div class="hint" id="hint">30 questions · Select one answer</div><button class="btn" id="action" disabled>Check answer</button></div></section><section class="finish" id="finish" hidden></section></main>
<script>
(()=>{'use strict';const questions=[{"d":"BASIC","q":"In a table of favourite fruits, what does the heading at the top of a column tell you?","o":["The kind of information in that column","The total number of rows only","The page number","The colour of the paper"],"a":0,"e":"A column heading names the information recorded beneath it.","v":"reading-tables"},{"d":"BASIC","q":"A library table shows Fiction 18, Science 12, History 9. How many Science books are listed?","o":["9","12","18","39"],"a":1,"e":"Read the value in the Science row: 12.","v":"reading-tables"},{"d":"BASIC","q":"A table lists Monday 14 visitors and Tuesday 17 visitors. Which day had more visitors?","o":["Monday","Tuesday","Both had the same","Cannot compare"],"a":1,"e":"17 is greater than 14, so Tuesday had more.","v":"reading-tables"},{"d":"BASIC","q":"A table shows red pens 8, blue pens 11, green pens 6. How many blue pens are there?","o":["6","8","11","25"],"a":2,"e":"The value beside blue pens is 11.","v":"reading-tables"},{"d":"BASIC","q":"In a table, the row labels are Bus, Walk, Bicycle and Car. What do these labels describe?","o":["Ways of travelling","Days of the week","Book titles","Weather types"],"a":0,"e":"Each row represents a travel method.","v":"reading-tables"},{"d":"BASIC","q":"A class table shows 13 boys and 15 girls. How many students are there altogether?","o":["28","2","15","195"],"a":0,"e":"Add the two groups: 13 + 15 = 28.","v":"reading-tables"},{"d":"BASIC","q":"A table records rainfall as 5 cm in June and 8 cm in July. Which month had less rainfall?","o":["July","June","Both equally","Not enough information"],"a":1,"e":"June's 5 cm is less than July's 8 cm.","v":"reading-tables"},{"d":"BASIC","q":"A snack table lists apples 7, bananas 10, oranges 7. Which two fruits have equal counts?","o":["Apples and bananas","Bananas and oranges","Apples and oranges","All three"],"a":2,"e":"Apples and oranges each have a count of 7.","v":"reading-tables"},{"d":"BASIC","q":"A table has headings Name, Age and Height. Which column should you read to find a person's age?","o":["Name","Age","Height","All columns equally"],"a":1,"e":"The Age column contains age values.","v":"reading-tables"},{"d":"BASIC","q":"A shop table shows notebooks 20 and pencils 35 sold. How many more pencils than notebooks were sold?","o":["15","55","20","35"],"a":0,"e":"Find the difference: 35 − 20 = 15.","v":"reading-tables"},{"d":"MEDIUM","q":"A table shows daily steps: Mon 2,400; Tue 3,100; Wed 2,800. On which day were the most steps recorded?","o":["Monday","Tuesday","Wednesday","All equal"],"a":1,"e":"3,100 is the greatest of the three values.","v":"reading-tables"},{"d":"MEDIUM","q":"A garden table lists roses 16, lilies 9 and tulips 14. How many flowers are listed in total?","o":["30","39","25","41"],"a":1,"e":"16 + 9 + 14 = 39 flowers.","v":"reading-tables"},{"d":"MEDIUM","q":"A bus table shows Route A: 28 passengers and Route B: 34 passengers. How many passengers are there altogether?","o":["6","52","62","72"],"a":2,"e":"Add 28 and 34 to get 62.","v":"reading-tables"},{"d":"MEDIUM","q":"A table records 42 students choosing cricket, 26 choosing football and 18 choosing badminton. How many more chose cricket than badminton?","o":["16","24","60","8"],"a":1,"e":"42 − 18 = 24 students.","v":"reading-tables"},{"d":"MEDIUM","q":"A canteen table lists Monday 45 meals, Tuesday 38 and Wednesday 47. How many meals were served on Monday and Tuesday together?","o":["83","92","85","130"],"a":0,"e":"45 + 38 = 83 meals.","v":"reading-tables"},{"d":"MEDIUM","q":"A table shows pages read: Saturday 64 and Sunday 37. How many pages were read over the weekend?","o":["91","27","101","111"],"a":2,"e":"64 + 37 = 101 pages.","v":"reading-tables"},{"d":"MEDIUM","q":"A table shows a shop's sales: cups 24, plates 31, bowls 19. Which item sold the fewest?","o":["Cups","Plates","Bowls","Cups and plates"],"a":2,"e":"19 is the smallest count, so bowls sold the fewest.","v":"reading-tables"},{"d":"MEDIUM","q":"A class table shows absent students: Monday 3, Tuesday 5, Wednesday 2, Thursday 4. What is the total absent across these days?","o":["12","14","10","15"],"a":1,"e":"3 + 5 + 2 + 4 = 14.","v":"reading-tables"},{"d":"MEDIUM","q":"A table lists four teams' scores: A 18, B 22, C 17, D 22. What is the highest score?","o":["17","18","20","22"],"a":3,"e":"The highest listed score is 22.","v":"reading-tables"},{"d":"MEDIUM","q":"A table shows 56 tickets sold in the morning and 39 in the evening. How many tickets were sold in all?","o":["17","85","95","105"],"a":2,"e":"56 + 39 = 95 tickets.","v":"reading-tables"},{"d":"HARD","q":"A table shows books borrowed: Monday 18, Tuesday 25, Wednesday 21. How many more books were borrowed on Monday and Wednesday combined than on Tuesday?","o":["14","7","4","46"],"a":0,"e":"Monday and Wednesday together: 18 + 21 = 39; 39 − 25 = 14.","v":"reading-tables"},{"d":"HARD","q":"A table shows apples 36, pears 28 and mangoes 41 sold. How many items were sold in total?","o":["105","95","113","99"],"a":0,"e":"36 + 28 + 41 = 105.","v":"reading-tables"},{"d":"HARD","q":"A table lists scores 14, 19, 16 and 21 for four rounds. What is the difference between the highest and lowest scores?","o":["5","7","35","9"],"a":1,"e":"The difference is 21 − 14 = 7.","v":"reading-tables"},{"d":"HARD","q":"A shop sold 125 items: 48 toys and 37 books, with the rest being games. How many games were sold?","o":["40","77","52","35"],"a":0,"e":"First add toys and books: 48 + 37 = 85; then 125 − 85 = 40.","v":"reading-tables"},{"d":"HARD","q":"A table records water used: Monday 18 L, Tuesday 23 L, Wednesday 19 L. How much water was used across all three days?","o":["50 L","60 L","61 L","59 L"],"a":1,"e":"18 + 23 + 19 = 60 L.","v":"reading-tables"},{"d":"HARD","q":"A table lists points for four players: 32, 27, 35 and 26. What is the combined score of the two highest-scoring players?","o":["67","62","61","70"],"a":0,"e":"The two highest scores are 35 and 32; 35 + 32 = 67.","v":"reading-tables"},{"d":"HARD","q":"A table shows 240 visitors over three days. Day one had 75 visitors and day two had 88. How many visited on day three?","o":["77","87","67","163"],"a":0,"e":"240 − 75 − 88 = 77 visitors.","v":"reading-tables"},{"d":"HARD","q":"A school table shows 38 students in Class A, 42 in Class B and 35 in Class C. If 12 students are away, how many are present?","o":["103","115","91","127"],"a":0,"e":"Total students are 38 + 42 + 35 = 115; present = 115 − 12 = 103.","v":"reading-tables"},{"d":"HARD","q":"A table lists monthly savings: April ₹125, May ₹175, June ₹150. How much more was saved in May than the average of April and June?","o":["₹37.50","₹25","₹50","₹75"],"a":0,"e":"The average of ₹125 and ₹150 is ₹137.50; ₹175 − ₹137.50 = ₹37.50.","v":"reading-tables"},{"d":"HARD","q":"A table shows 96 tickets sold over 3 days: 27 on day one and 35 on day two. How many sold on day three?","o":["34","32","38","29"],"a":0,"e":"96 − 27 − 35 = 34 tickets.","v":"reading-tables"}];const $=id=>document.getElementById(id);let i=0,sel=-1,locked=false,done=false,xp=0,correct=0,streak=0;const letters=['A','B','C','D'];
function progress(){const p=Math.round(i/questions.length*100);$('bar').style.width=p+'%';$('progress').setAttribute('aria-valuenow',p);$('pct').textContent=p+'% complete';}
function render(){const q=questions[i];sel=-1;locked=false;$('quiz').hidden=false;$('finish').hidden=true;$('counter').textContent='QUESTION '+(i+1)+' OF '+questions.length;$('meta').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(i+1);$('question').textContent=q.q;$('options').innerHTML='';q.o.forEach((v,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.innerHTML='<span class="letter">'+letters[j]+'</span><span></span>';b.querySelector('span:last-child').textContent=v;b.onclick=()=>{if(locked)return;sel=j;[...$('options').children].forEach((x,k)=>x.classList.toggle('selected',k===j));$('action').disabled=false;};$('options').appendChild(b);});$('feedback').className='feedback';$('feedback').textContent='';$('hint').textContent='30 questions · Select one answer';$('action').textContent='Check answer';$('action').disabled=true;progress();}
function act(){if(done){restart();return;}const q=questions[i];if(!locked){if(sel<0)return;locked=true;const ok=sel===q.a;if(ok){correct++;xp+=10;streak++;}else streak=0;$('xp').textContent='⭐ '+xp+' XP';$('streak').textContent='🔥 '+streak;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===sel)b.classList.add('wrong');});$('feedback').textContent=(ok?'✨ Correct! ':'💡 Review: ')+q.e;$('feedback').className='feedback show '+(ok?'good':'bad');$('hint').textContent=ok?'+10 XP':'Keep practising';$('action').textContent=i===questions.length-1?'View results →':'Continue →';return;}if(i<questions.length-1){i++;render();}else results();}
function results(){done=true;$('quiz').hidden=true;$('finish').hidden=false;$('counter').textContent='QUIZ COMPLETE';$('bar').style.width='100%';$('progress').setAttribute('aria-valuenow','100');$('pct').textContent='100% complete';$('finish').innerHTML='<div style="font-size:46px">🏆</div><h2>'+(correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!')+'</h2><div class="score">'+correct+' / '+questions.length+'</div><p>'+Math.round(correct/questions.length*100)+'% accuracy · '+xp+' XP earned</p><div class="skill"><strong>🔢 Compare decimal values</strong><small>Use place value to compare decimals accurately.</small></div><div class="skill"><strong>↔️ Order decimal numbers</strong><small>Compare decimals with different numbers of digits.</small></div><div class="skill"><strong>🧠 Apply comparison strategies</strong><small>Use equivalent trailing zeros and aligned place values.</small></div><button class="btn" id="retry">Try again ↻</button>';$('retry').onclick=restart;}
function restart(){i=0;sel=-1;locked=false;done=false;xp=0;correct=0;streak=0;$('xp').textContent='⭐ 0 XP';$('streak').textContent='🔥 0';render();}
$('action').onclick=act;render();})();
</script><script src="/shared-nav.js?v=20261017-duolingo-standard-v1"></script></body></html>
