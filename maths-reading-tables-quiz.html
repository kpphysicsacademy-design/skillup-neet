<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261012-reading-tables-quiz-v2"><title>Reading Tables | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Whole numbers</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"In a table of favourite fruits, what does the heading at the top of a column tell you?","o":["The kind of information in that column","The total number of rows only","The page number","The colour of the paper"],"a":0,"e":"A column heading names the information recorded beneath it.","v":"reading-tables"},{"d":"BASIC","q":"A library table shows Fiction 18, Science 12, History 9. How many Science books are listed?","o":["9","12","18","39"],"a":1,"e":"Read the value in the Science row: 12.","v":"reading-tables"},{"d":"BASIC","q":"A table lists Monday 14 visitors and Tuesday 17 visitors. Which day had more visitors?","o":["Monday","Tuesday","Both had the same","Cannot compare"],"a":1,"e":"17 is greater than 14, so Tuesday had more.","v":"reading-tables"},{"d":"BASIC","q":"A table shows red pens 8, blue pens 11, green pens 6. How many blue pens are there?","o":["6","8","11","25"],"a":2,"e":"The value beside blue pens is 11.","v":"reading-tables"},{"d":"BASIC","q":"In a table, the row labels are Bus, Walk, Bicycle and Car. What do these labels describe?","o":["Ways of travelling","Days of the week","Book titles","Weather types"],"a":0,"e":"Each row represents a travel method.","v":"reading-tables"},{"d":"BASIC","q":"A class table shows 13 boys and 15 girls. How many students are there altogether?","o":["28","2","15","195"],"a":0,"e":"Add the two groups: 13 + 15 = 28.","v":"reading-tables"},{"d":"BASIC","q":"A table records rainfall as 5 cm in June and 8 cm in July. Which month had less rainfall?","o":["July","June","Both equally","Not enough information"],"a":1,"e":"June's 5 cm is less than July's 8 cm.","v":"reading-tables"},{"d":"BASIC","q":"A snack table lists apples 7, bananas 10, oranges 7. Which two fruits have equal counts?","o":["Apples and bananas","Bananas and oranges","Apples and oranges","All three"],"a":2,"e":"Apples and oranges each have a count of 7.","v":"reading-tables"},{"d":"BASIC","q":"A table has headings Name, Age and Height. Which column should you read to find a person's age?","o":["Name","Age","Height","All columns equally"],"a":1,"e":"The Age column contains age values.","v":"reading-tables"},{"d":"BASIC","q":"A shop table shows notebooks 20 and pencils 35 sold. How many more pencils than notebooks were sold?","o":["15","55","20","35"],"a":0,"e":"Find the difference: 35 − 20 = 15.","v":"reading-tables"},{"d":"MEDIUM","q":"A table shows daily steps: Mon 2,400; Tue 3,100; Wed 2,800. On which day were the most steps recorded?","o":["Monday","Tuesday","Wednesday","All equal"],"a":1,"e":"3,100 is the greatest of the three values.","v":"reading-tables"},{"d":"MEDIUM","q":"A garden table lists roses 16, lilies 9 and tulips 14. How many flowers are listed in total?","o":["30","39","25","41"],"a":1,"e":"16 + 9 + 14 = 39 flowers.","v":"reading-tables"},{"d":"MEDIUM","q":"A bus table shows Route A: 28 passengers and Route B: 34 passengers. How many passengers are there altogether?","o":["6","52","62","72"],"a":2,"e":"Add 28 and 34 to get 62.","v":"reading-tables"},{"d":"MEDIUM","q":"A table records 42 students choosing cricket, 26 choosing football and 18 choosing badminton. How many more chose cricket than badminton?","o":["16","24","60","8"],"a":1,"e":"42 − 18 = 24 students.","v":"reading-tables"},{"d":"MEDIUM","q":"A canteen table lists Monday 45 meals, Tuesday 38 and Wednesday 47. How many meals were served on Monday and Tuesday together?","o":["83","92","85","130"],"a":0,"e":"45 + 38 = 83 meals.","v":"reading-tables"},{"d":"MEDIUM","q":"A table shows pages read: Saturday 64 and Sunday 37. How many pages were read over the weekend?","o":["91","27","101","111"],"a":2,"e":"64 + 37 = 101 pages.","v":"reading-tables"},{"d":"MEDIUM","q":"A table shows a shop's sales: cups 24, plates 31, bowls 19. Which item sold the fewest?","o":["Cups","Plates","Bowls","Cups and plates"],"a":2,"e":"19 is the smallest count, so bowls sold the fewest.","v":"reading-tables"},{"d":"MEDIUM","q":"A class table shows absent students: Monday 3, Tuesday 5, Wednesday 2, Thursday 4. What is the total absent across these days?","o":["12","14","10","15"],"a":1,"e":"3 + 5 + 2 + 4 = 14.","v":"reading-tables"},{"d":"MEDIUM","q":"A table lists four teams' scores: A 18, B 22, C 17, D 22. What is the highest score?","o":["17","18","20","22"],"a":3,"e":"The highest listed score is 22.","v":"reading-tables"},{"d":"MEDIUM","q":"A table shows 56 tickets sold in the morning and 39 in the evening. How many tickets were sold in all?","o":["17","85","95","105"],"a":2,"e":"56 + 39 = 95 tickets.","v":"reading-tables"},{"d":"HARD","q":"A table shows books borrowed: Monday 18, Tuesday 25, Wednesday 21. How many more books were borrowed on Monday and Wednesday combined than on Tuesday?","o":["14","7","4","46"],"a":0,"e":"Monday and Wednesday together: 18 + 21 = 39; 39 − 25 = 14.","v":"reading-tables"},{"d":"HARD","q":"A table shows apples 36, pears 28 and mangoes 41 sold. How many items were sold in total?","o":["105","95","113","99"],"a":0,"e":"36 + 28 + 41 = 105.","v":"reading-tables"},{"d":"HARD","q":"A table lists scores 14, 19, 16 and 21 for four rounds. What is the difference between the highest and lowest scores?","o":["5","7","35","9"],"a":1,"e":"The difference is 21 − 14 = 7.","v":"reading-tables"},{"d":"HARD","q":"A shop sold 125 items: 48 toys and 37 books, with the rest being games. How many games were sold?","o":["40","77","52","35"],"a":0,"e":"First add toys and books: 48 + 37 = 85; then 125 − 85 = 40.","v":"reading-tables"},{"d":"HARD","q":"A table records water used: Monday 18 L, Tuesday 23 L, Wednesday 19 L. How much water was used across all three days?","o":["50 L","60 L","61 L","59 L"],"a":1,"e":"18 + 23 + 19 = 60 L.","v":"reading-tables"},{"d":"HARD","q":"A table lists points for four players: 32, 27, 35 and 26. What is the combined score of the two highest-scoring players?","o":["67","62","61","70"],"a":0,"e":"The two highest scores are 35 and 32; 35 + 32 = 67.","v":"reading-tables"},{"d":"HARD","q":"A table shows 240 visitors over three days. Day one had 75 visitors and day two had 88. How many visited on day three?","o":["77","87","67","163"],"a":0,"e":"240 − 75 − 88 = 77 visitors.","v":"reading-tables"},{"d":"HARD","q":"A school table shows 38 students in Class A, 42 in Class B and 35 in Class C. If 12 students are away, how many are present?","o":["103","115","91","127"],"a":0,"e":"Total students are 38 + 42 + 35 = 115; present = 115 − 12 = 103.","v":"reading-tables"},{"d":"HARD","q":"A table lists monthly savings: April ₹125, May ₹175, June ₹150. How much more was saved in May than the average of April and June?","o":["₹37.50","₹25","₹50","₹75"],"a":0,"e":"The average of ₹125 and ₹150 is ₹137.50; ₹175 − ₹137.50 = ₹37.50.","v":"reading-tables"},{"d":"HARD","q":"A table shows 96 tickets sold over 3 days: 27 on day one and 35 on day two. How many sold on day three?","o":["34","32","38","29"],"a":0,"e":"96 − 27 − 35 = 34 tickets.","v":"reading-tables"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Read and interpret data tables</strong><small>Use table headings and values</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Compare table categories</strong><small>Calculate totals and differences</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Find missing values in tables</strong><small>Solve real-life table questions</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script></body></html>
