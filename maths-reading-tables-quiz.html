<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261012-reading-tables-no-images-duolingo-v1"><title>Reading Tables | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What does a row in a data table usually represent?","o":["A record or category of information","A random decoration","A page margin","A graph scale only"],"a":0,"e":"Rows organise related information so it can be read easily.","v":"reading-tables"},{"d":"BASIC","q":"Why should a table have headings?","o":["To explain what each column contains","To make the numbers larger","To hide the data","To remove categories"],"a":0,"e":"Headings explain the meaning of the information in each column.","v":"reading-tables"},{"d":"BASIC","q":"A table lists apples 5, bananas 3 and pears 4. Which fruit count is greatest?","o":["Apples","Bananas","Pears","All equal"],"a":0,"e":"5 is the largest count.","v":"reading-tables"},{"d":"BASIC","q":"Using apples 5, bananas 3 and pears 4, how many fruits are counted?","o":["12","9","8","15"],"a":0,"e":"5 + 3 + 4 = 12.","v":"reading-tables"},{"d":"BASIC","q":"A table shows 8 books borrowed on Monday and 6 on Tuesday. What is the total?","o":["2","14","48","8"],"a":1,"e":"8 + 6 = 14 books.","v":"reading-tables"},{"d":"BASIC","q":"Which information is easiest to find in a well-labelled table?","o":["A category's recorded value","A hidden answer","An unrelated fact","Tomorrow's weather automatically"],"a":0,"e":"A table lets you locate a category and its value.","v":"reading-tables"},{"d":"BASIC","q":"A table records 7 boys and 9 girls. How many students are there?","o":["2","16","63","9"],"a":1,"e":"7 + 9 = 16 students.","v":"reading-tables"},{"d":"BASIC","q":"If a table has a column labelled 'Number of pencils', what belongs in that column?","o":["Pencil counts","Student names only","Favourite songs","Dates with no relation"],"a":0,"e":"The values should match the column heading.","v":"reading-tables"},{"d":"BASIC","q":"A table shows 11, 6 and 10 items in three boxes. Which has the fewest?","o":["First box","Second box","Third box","All equal"],"a":1,"e":"6 is the smallest count.","v":"reading-tables"},{"d":"BASIC","q":"What should you do if you want to compare two categories in a table?","o":["Read their values and compare them","Ignore the headings","Add unrelated rows","Change the recorded values"],"a":0,"e":"Compare the values shown for the selected categories.","v":"reading-tables"},{"d":"MEDIUM","q":"A table lists Monday 14 visitors, Tuesday 18 and Wednesday 12. What is the total?","o":["44","42","40","46"],"a":0,"e":"14 + 18 + 12 = 44.","v":"reading-tables"},{"d":"MEDIUM","q":"Using Monday 14, Tuesday 18 and Wednesday 12 visitors, how many more came Tuesday than Wednesday?","o":["6","30","4","8"],"a":0,"e":"18 − 12 = 6.","v":"reading-tables"},{"d":"MEDIUM","q":"A table records storybooks 23, comics 17 and science books 12. How many books are listed altogether?","o":["52","40","42","50"],"a":0,"e":"23 + 17 + 12 = 52.","v":"reading-tables"},{"d":"MEDIUM","q":"A shop sold 35 pencils and 28 pens. How many more pencils than pens were sold?","o":["7","63","8","6"],"a":0,"e":"35 − 28 = 7.","v":"reading-tables"},{"d":"MEDIUM","q":"A table total is 60. Two categories contain 18 and 24 items. What is the third category's count?","o":["18","42","12","16"],"a":0,"e":"60 − 18 − 24 = 18.","v":"reading-tables"},{"d":"MEDIUM","q":"A table shows red 16, yellow 13 and green 19 votes. How many votes did not go to green?","o":["29","48","16","32"],"a":0,"e":"Red and yellow together: 16 + 13 = 29.","v":"reading-tables"},{"d":"MEDIUM","q":"A weekly table lists 9, 12, 8, 15 and 6 visitors. Which day has the highest count?","o":["The day with 9","The day with 12","The day with 15","The day with 6"],"a":2,"e":"15 is the greatest value.","v":"reading-tables"},{"d":"MEDIUM","q":"A table shows 24 students in chess and 19 in music. How many students are counted across both groups?","o":["43","5","456","40"],"a":0,"e":"24 + 19 = 43.","v":"reading-tables"},{"d":"MEDIUM","q":"A table has 72 items across four equal groups. How many items are in each group?","o":["18","16","24","14"],"a":0,"e":"72 ÷ 4 = 18.","v":"reading-tables"},{"d":"MEDIUM","q":"A table lists 31 adults and 27 children at an event. How many people attended?","o":["58","4","837","60"],"a":0,"e":"31 + 27 = 58.","v":"reading-tables"},{"d":"HARD","q":"A table records sales of 48, 57, 39 and 46 units across four days. What is the total?","o":["190","180","184","200"],"a":0,"e":"48 + 57 + 39 + 46 = 190.","v":"reading-tables"},{"d":"HARD","q":"Using sales 48, 57, 39 and 46, what is the difference between the greatest and smallest daily sales?","o":["18","9","96","15"],"a":0,"e":"57 − 39 = 18.","v":"reading-tables"},{"d":"HARD","q":"A table total is 125. Three categories have 36, 29 and 24 items. Find the fourth count.","o":["36","32","34","40"],"a":0,"e":"36 + 29 + 24 = 89; 125 − 89 = 36.","v":"reading-tables"},{"d":"HARD","q":"A class table has 28 students in group A and 34 in group B. If 5 move from B to A, what are the new counts A, B?","o":["33 and 29","23 and 39","28 and 29","34 and 28"],"a":0,"e":"Group A becomes 28 + 5 = 33; group B becomes 34 − 5 = 29.","v":"reading-tables"},{"d":"HARD","q":"A table shows books read: 17, 22, 19 and 26. How many books are needed to bring the smallest count up to the largest?","o":["9","4","7","8"],"a":0,"e":"26 − 17 = 9.","v":"reading-tables"},{"d":"HARD","q":"A table lists 45 adults, 38 children and 17 seniors. How many people are listed?","o":["100","90","83","110"],"a":0,"e":"45 + 38 + 17 = 100.","v":"reading-tables"},{"d":"HARD","q":"A school table totals 240 students. Class 6 has 58, Class 7 has 61, and Class 8 has 55. How many are in Class 9?","o":["66","64","76","56"],"a":0,"e":"240 − (58 + 61 + 55) = 66.","v":"reading-tables"},{"d":"HARD","q":"A table shows 84 red beads and 69 blue beads. How many fewer blue beads are there?","o":["15","153","13","16"],"a":0,"e":"84 − 69 = 15.","v":"reading-tables"},{"d":"HARD","q":"A table records 4 teams with scores 18, 25, 21 and 16. What is the combined score of the two highest-scoring teams?","o":["46","43","41","39"],"a":0,"e":"The two highest scores are 25 and 21, totaling 46.","v":"reading-tables"},{"d":"HARD","q":"A table lists 96 tickets sold over 3 days: 27 on day one and 35 on day two. How many sold on day three?","o":["34","32","38","29"],"a":0,"e":"96 − 27 − 35 = 34.","v":"reading-tables"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Read and interpret data tables</strong><small>Use table headings and values</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Compare table categories</strong><small>Calculate totals and differences</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Find missing values in tables</strong><small>Solve real-life table questions</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script></body></html>
