(function(){'use strict';const questions=[{"d":"BASIC","q":"Which number is located to the right of 2 on a number line?","o":["1.5","−3","2.4","−0.5"],"a":2,"e":"Numbers increase as you move to the right; 2.4 is greater than 2."},{"d":"BASIC","q":"Which number is farthest to the left?","o":["−1","−5","0","3"],"a":1,"e":"−5 is the smallest number listed, so it lies farthest left."},{"d":"BASIC","q":"What number is exactly halfway between 2 and 8?","o":["4","5","6","10"],"a":1,"e":"The midpoint is (2 + 8) ÷ 2 = 5."},{"d":"BASIC","q":"Which number lies between −2 and 0?","o":["−3","−1","1","2"],"a":1,"e":"−1 is greater than −2 and less than 0."},{"d":"BASIC","q":"What is the distance between 3 and 7 on a number line?","o":["3 units","4 units","7 units","10 units"],"a":1,"e":"Distance is the absolute difference: |7 − 3| = 4."},{"d":"BASIC","q":"Which number is closest to zero?","o":["−4","2","−1","3"],"a":2,"e":"The distance of −1 from zero is 1, the smallest distance listed."},{"d":"BASIC","q":"Where does zero lie on a standard number line?","o":["At the far left","At the far right","Between negative and positive numbers","Only among positive numbers"],"a":2,"e":"Negative numbers lie left of zero and positive numbers lie right of zero."},{"d":"BASIC","q":"Which inequality matches the number line order from left to right?","o":["4 < 1 < 0","−3 < −1 < 2","2 < −1 < 3","0 < −2 < 1"],"a":1,"e":"−3 is less than −1, and −1 is less than 2."},{"d":"BASIC","q":"Which point represents −4?","o":["Four units right of zero","Four units left of zero","At zero","Four units above zero"],"a":1,"e":"Negative four is four units to the left of zero."},{"d":"BASIC","q":"What is the opposite of 6 on a number line?","o":["0","−6","1/6","6"],"a":1,"e":"The opposite lies the same distance from zero on the other side."},{"d":"MEDIUM","q":"Which number lies between 1 and 2?","o":["√5","√3","√9","√16"],"a":1,"e":"√3 is about 1.732, which lies between 1 and 2."},{"d":"MEDIUM","q":"Which is the correct order from smallest to largest?","o":["−1.2, −0.8, 0.2, 1","−0.8, −1.2, 0.2, 1","0.2, −0.8, −1.2, 1","−1.2, 0.2, −0.8, 1"],"a":0,"e":"Among negatives, the number with the greater absolute value is smaller."},{"d":"MEDIUM","q":"What is the distance between −3 and 5?","o":["2 units","5 units","8 units","−8 units"],"a":2,"e":"Distance is |5 − (−3)| = 8 units."},{"d":"MEDIUM","q":"Which point is halfway between −6 and 2?","o":["−4","−2","0","4"],"a":1,"e":"The midpoint is (−6 + 2) ÷ 2 = −2."},{"d":"MEDIUM","q":"Which number is between √4 and √9?","o":["1.5","2.5","3.5","4"],"a":1,"e":"√4 = 2 and √9 = 3, so 2.5 lies between them."},{"d":"MEDIUM","q":"Which statement is true?","o":["−7 is greater than −2","−4 is less than −1","0 is less than −5","3 is less than −3"],"a":1,"e":"−4 is farther left than −1, so −4 < −1."},{"d":"MEDIUM","q":"A point moves 5 units right from −2. Where does it end?","o":["−7","−3","3","7"],"a":2,"e":"Moving right adds 5: −2 + 5 = 3."},{"d":"MEDIUM","q":"A point at 4 moves 9 units left. Where does it end?","o":["13","5","−5","−13"],"a":2,"e":"Moving left subtracts 9: 4 − 9 = −5."},{"d":"MEDIUM","q":"Which number has the greatest distance from zero?","o":["−6","5","−4","3"],"a":0,"e":"The distance from zero is the absolute value; |−6| = 6 is greatest."},{"d":"MEDIUM","q":"Which decimal lies between −1 and 0?","o":["−1.5","−0.25","0.25","1.25"],"a":1,"e":"−0.25 is greater than −1 and less than 0."},{"d":"HARD","q":"Which is the correct order from smallest to largest?","o":["−√9, −2, 0, √4","−2, −√9, 0, √4","−√9, 0, −2, √4","−2, 0, −√9, √4"],"a":0,"e":"−√9 = −3, −2 = −2, 0 = 0 and √4 = 2; hence −3 < −2 < 0 < 2."},{"d":"HARD","q":"Which number is closest to 3 on a number line?","o":["√5","√8","√12","√2"],"a":1,"e":"√8 is about 2.83, which is closer to 3 than the other options."},{"d":"HARD","q":"Point A is at −4 and point B is at 7. What is the distance AB?","o":["3 units","11 units","−11 units","28 units"],"a":1,"e":"Distance is |7 − (−4)| = 11 r('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Locate real numbers</strong><small>Place positive, negative and irrational values on a number line</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Compare and order values</strong><small>Use inequalities, decimals and square roots</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Calculate distance and midpoints</strong><small>Find positions, distances and halfway points</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
