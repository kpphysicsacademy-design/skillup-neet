<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"Which number is located to the right of 2 on a number line?","o":["1.5","−3","2.4","−0.5"],"a":2,"why":"Numbers increase as you move to the right; 2.4 is greater than 2."},{"d":"BASIC","q":"Which number is farthest to the left?","o":["−1","−5","0","3"],"a":1,"why":"−5 is the smallest number listed, so it lies farthest left."},{"d":"BASIC","q":"What number is exactly halfway between 2 and 8?","o":["4","5","6","10"],"a":1,"why":"The midpoint is (2 + 8) ÷ 2 = 5."},{"d":"BASIC","q":"Which number lies between −2 and 0?","o":["−3","−1","1","2"],"a":1,"why":"−1 is greater than −2 and less than 0."},{"d":"BASIC","q":"What is the distance between 3 and 7 on a number line?","o":["3 units","4 units","7 units","10 units"],"a":1,"why":"Distance is the absolute difference: |7 − 3| = 4."},{"d":"BASIC","q":"Which number is closest to zero?","o":["−4","2","−1","3"],"a":2,"why":"The distance of −1 from zero is 1, the smallest distance listed."},{"d":"BASIC","q":"Where does zero lie on a standard number line?","o":["At the far left","At the far right","Between negative and positive numbers","Only among positive numbers"],"a":2,"why":"Negative numbers lie left of zero and positive numbers lie right of zero."},{"d":"BASIC","q":"Which inequality matches the number line order from left to right?","o":["4 < 1 < 0","−3 < −1 < 2","2 < −1 < 3","0 < −2 < 1"],"a":1,"why":"−3 is less than −1, and −1 is less than 2."},{"d":"BASIC","q":"Which point represents −4?","o":["Four units right of zero","Four units left of zero","At zero","Four units above zero"],"a":1,"why":"Negative four is four units to the left of zero."},{"d":"BASIC","q":"What is the opposite of 6 on a number line?","o":["0","−6","1/6","6"],"a":1,"why":"The opposite lies the same distance from zero on the other side."},{"d":"MEDIUM","q":"Which number lies between 1 and 2?","o":["√5","√3","√9","√16"],"a":1,"why":"√3 is about 1.732, which lies between 1 and 2."},{"d":"MEDIUM","q":"Which is the correct order from smallest to largest?","o":["−1.2, −0.8, 0.2, 1","−0.8, −1.2, 0.2, 1","0.2, −0.8, −1.2, 1","−1.2, 0.2, −0.8, 1"],"a":0,"why":"Among negatives, the number with the greater absolute value is smaller."},{"d":"MEDIUM","q":"What is the distance between −3 and 5?","o":["2 units","5 units","8 units","−8 units"],"a":2,"why":"Distance is |5 − (−3)| = 8 units."},{"d":"MEDIUM","q":"Which point is halfway between −6 and 2?","o":["−4","−2","0","4"],"a":1,"why":"The midpoint is (−6 + 2) ÷ 2 = −2."},{"d":"MEDIUM","q":"Which number is between √4 and √9?","o":["1.5","2.5","3.5","4"],"a":1,"why":"√4 = 2 and √9 = 3, so 2.5 lies between them."},{"d":"MEDIUM","q":"Which statement is true?","o":["−7 is greater than −2","−4 is less than −1","0 is less than −5","3 is less than −3"],"a":1,"why":"−4 is farther left than −1, so −4 < −1."},{"d":"MEDIUM","q":"A point moves 5 units right from −2. Where does it end?","o":["−7","−3","3","7"],"a":2,"why":"Moving right adds 5: −2 + 5 = 3."},{"d":"MEDIUM","q":"A point at 4 moves 9 units left. Where does it end?","o":["13","5","−5","−13"],"a":2,"why":"Moving left subtracts 9: 4 − 9 = −5."},{"d":"MEDIUM","q":"Which number has the greatest distance from zero?","o":["−6","5","−4","3"],"a":0,"why":"The distance from zero is the absolute value; |−6| = 6 is greatest."},{"d":"MEDIUM","q":"Which decimal lies between −1 and 0?","o":["−1.5","−0.25","0.25","1.25"],"a":1,"why":"−0.25 is greater than −1 and less than 0."},{"d":"HARD","q":"Which is the correct order from smallest to largest?","o":["−√9, −2, 0, √4","−2, −√9, 0, √4","−√9, 0, −2, √4","−2, 0, −√9, √4"],"a":0,"why":"−√9 = −3, −2 = −2, 0 = 0 and √4 = 2; hence −3 < −2 < 0 < 2."},{"d":"HARD","q":"Which number is closest to 3 on a number line?","o":["√5","√8","√12","√2"],"a":1,"why":"√8 is about 2.83, which is closer to 3 than the other options."},{"d":"HARD","q":"Point A is at −4 and point B is at 7. What is the distance AB?","o":["3 units","11 units","−11 units","28 units"],"a":1,"why":"Distance is |7 − (−4)| = 11 units."},{"d":"HARD","q":"Which number is between 0.4 and 0.5?","o":["3/5","9/20","1/2","2/5"],"a":1,"why":"9/20 = 0.45, which is between 0.4 and 0.5."},{"d":"HARD","q":"A point is at −3.5. It moves 2 units left and then 6 units right. Where is it now?","o":["−11.5","−1.5","0.5","4.5"],"a":2,"why":"−3.5 − 2 + 6 = 0.5."},{"d":"HARD","q":"Which comparison is correct?","o":["√10 < 3","√10 > 3","√10 = 3","√10 < 0"],"a":1,"why":"Since 10 > 9, √10 > √9 = 3."},{"d":"HARD","q":"What is the midpoint between −2.5 and 4.5?","o":["0","1","2","3"],"a":1,"why":"The midpoint is (−2.5 + 4.5) ÷ 2 = 1."},{"d":"HARD","q":"Which value is greatest?","o":["−√2","−1.5","−1.2","−2"],"a":2,"why":"−1.2 is the greatest because it is closest to zero among these negative values."},{"d":"HARD","q":"A number x is 4 units from zero and lies to the left of zero. What is x?","o":["4","−4","0","−8"],"a":1,"why":"Four units left of zero represents −4."},{"d":"HARD","q":"Which point lies between −√4 and √9?","o":["−3","−1","3","4"],"a":1,"why":"−√4 = −2 and √9 = 3; −1 lies between −2 and 3."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Real Number Line Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
