<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"According to Euclid's division lemma, for positive integers a and b, a can be written as:","o":["a=bq+r, where 0≤r<b","a=br+q, where r>b","a=b+q+r only","a=bq−r, where r<0"],"a":0,"e":"Euclid's division lemma states a=bq+r with 0≤r<b."},{"d":"BASIC","q":"Which of the following is a prime number?","o":["21","27","29","39"],"a":2,"e":"29 has only two positive factors, 1 and 29."},{"d":"BASIC","q":"The prime factorisation of 60 is:","o":["2×3×10","2²×3×5","2×5²","3×4×5"],"a":1,"e":"60=2×2×3×5=2²×3×5."},{"d":"BASIC","q":"The HCF of 12 and 18 is:","o":["2","3","6","36"],"a":2,"e":"The greatest common divisor of 12 and 18 is 6."},{"d":"BASIC","q":"The LCM of 4 and 6 is:","o":["2","6","12","24"],"a":2,"e":"The smallest positive common multiple of 4 and 6 is 12."},{"d":"BASIC","q":"A rational number has a terminating decimal expansion when, in lowest terms, its denominator has prime factors only:","o":["2 and/or 5","3 and/or 7","2 and 3 only","Any primes"],"a":0,"e":"A reduced fraction terminates exactly when the denominator is of the form 2ᵐ5ⁿ."},{"d":"BASIC","q":"Which number is irrational?","o":["0.25","√9","√7","3/5"],"a":2,"e":"√7 is irrational because 7 is not a perfect square."},{"d":"BASIC","q":"The HCF of two distinct prime numbers is always:","o":["0","1","Their product","Their sum"],"a":1,"e":"Distinct primes share no positive factor other than 1."},{"d":"BASIC","q":"Which fraction has a terminating decimal expansion?","o":["7/12","5/8","11/15","13/21"],"a":1,"e":"8=2³, so 5/8 terminates."},{"d":"BASIC","q":"If HCF(a,b)=1, the two positive integers are called:","o":["Consecutive","Co-prime","Composite","Multiples"],"a":1,"e":"Co-prime integers have HCF equal to 1."},{"d":"MEDIUM","q":"When 65 is divided by 8 using Euclid's division lemma, the quotient and remainder are:","o":["q=7, r=9","q=8, r=1","q=9, r=−7","q=6, r=17"],"a":1,"e":"65=8×8+1, and 0≤1<8."},{"d":"MEDIUM","q":"Find the HCF of 96 and 404 using prime factorisation.","o":["2","4","8","12"],"a":1,"e":"96=2⁵×3 and 404=2²×101; common prime power is 2²=4."},{"d":"MEDIUM","q":"Find the LCM of 12 and 18.","o":["24","30","36","72"],"a":2,"e":"12=2²×3 and 18=2×3²; LCM=2²×3²=36."},{"d":"MEDIUM","q":"If HCF(26,91)=13, their LCM is:","o":["182","169","238","117"],"a":0,"e":"LCM=(26×91)/13=182."},{"d":"MEDIUM","q":"Which fraction has a non-terminating recurring decimal expansion?","o":["3/40","7/125","13/30","9/16"],"a":2,"e":"30=2×3×5 includes prime factor 3, so 13/30 recurs."},{"d":"MEDIUM","q":"The decimal expansion of 77/210 is:","o":["Terminating","Non-terminating recurring","Non-terminating non-recurring","An integer"],"a":1,"e":"In lowest terms, the denominator has a factor 3 or 7, so its decimal expansion recurs."},{"d":"MEDIUM","q":"Which statement about √2 is true?","o":["It is a natural number","It is rational","It is irrational","It is an integer"],"a":2,"e":"√2 cannot be expressed as a ratio of two integers."},{"d":"MEDIUM","q":"The prime factorisation of 540 is:","o":["2²×3³×5","2³×3²×5","2×3³×5²","2²×3²×5²"],"a":0,"e":"540=2²×3³×5."},{"d":"MEDIUM","q":"Find the HCF of 135 and 225.","o":["15","25","45","75"],"a":2,"e":"135=3³×5 and 225=3²×5²; HCF=3²×5=45."},{"d":"MEDIUM","q":"If a=2³×3² and b=2²×3×5, their HCF is:","o":["6","12","18","36"],"a":1,"e":"Take the smaller powers of common primes: 2²×3=12."},{"d":"HARD","q":"Use Euclid's algorithm to find the HCF of 867 and 255.","o":["17","51","85","102"],"a":1,"e":"867=255×3+102; 255=102×2+51; 102=51×2. HCF=51."},{"d":"HARD","q":"Find the LCM of 144 and 180.","o":["360","540","720","1,440"],"a":2,"e":"144=2⁴×3² and 180=2²×3²×5; LCM=720."},{"d":"HARD","q":"Three bells ring at intervals of 12, 15 and 20 minutes. If they ring together now, after how many minutes will they next ring together?","o":["30","45","60","120"],"a":2,"e":"LCM(12,15,20)=60 minutes."},{"d":"HARD","q":"In the standard contradiction proof that √5 is irrational, which assumption is made initially?","o":["√5 is an integer","√5=p/q in lowest terms for integers p,q with q≠0","5 is composite","p and q are both even"],"a":1,"e":"Assume √5=p/q in lowest terms, then show both p and q must be divisible by 5, a contradiction."},{"d":"HARD","q":"Which of these has a non-terminating, non-recurring decimal expansion?","o":["√3","7/20","0.125","11/25"],"a":0,"e":"√3 is irrational, so its decimal expansion neither terminates nor repeats."},{"d":"HARD","q":"The greatest number that divides 245 and 1,027 leaving remainders 5 and 7 respectively is:","o":["10","20","30","60"],"a":3,"e":"The divisor divides 245−5=240 and 1,027−7=1,020; HCF(240,1,020)=60."},{"d":"HARD","q":"The HCF and LCM of two positive integers are 6 and 180. If one integer is 30, the other is:","o":["24","36","40","60"],"a":1,"e":"Product=HCF×LCM=1,080; other integer=1,080/30=36."},{"d":"HARD","q":"How many digits after the decimal point are needed before 7/80 terminates?","o":["2","3","4","5"],"a":2,"e":"7/80=0.0875, which terminates after 4 decimal places."},{"d":"HARD","q":"If the denominator of a reduced fraction is 2³×5², its decimal expansion is:","o":["Always non-terminating recurring","Terminating","Non-terminating non-recurring","Always an integer"],"a":1,"e":"The denominator has only prime factors 2 and 5, so the decimal terminates."},{"d":"HARD","q":"If 3 and 7 are the only prime factors of a reduced fraction's denominator, its decimal expansion is:","o":["Terminating","Non-terminating recurring","Non-terminating non-recurring","Always an integer"],"a":1,"e":"A denominator with prime factors other than 2 or 5 produces a non-terminating recurring decimal."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Apply Euclid's division lemma</strong><small>Use prime factorisation</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Find HCF and LCM</strong><small>Classify decimal expansions</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Reason about rational and irrational numbers</strong><small>Solve real-number problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
