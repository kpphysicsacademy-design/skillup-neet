(function(){'use strict';const questions=[{"d":"BASIC","q":"What does the Remainder Theorem help you find?","o":["The degree only","The remainder when a polynomial is divided by x − a","All coefficients","The roots of every equation"],"a":1,"e":"When p(x) is divided by x − a, the remainder is p(a)."},{"d":"BASIC","q":"When p(x) is divided by x − 2, what is the remainder?","o":["p(0)","p(1)","p(2)","p(−2)"],"a":2,"e":"By the Remainder Theorem, the remainder is p(2)."},{"d":"BASIC","q":"If p(x)=x²+3x+1, what is the remainder when divided by x−1?","o":["1","3","5","7"],"a":2,"e":"p(1)=1+3+1=5."},{"d":"BASIC","q":"If p(x)=2x+5 is divided by x+1, what is the remainder?","o":["−1","1","3","7"],"a":2,"e":"p(−1)=−2+5=3."},{"d":"BASIC","q":"If p(x)=x²−4, what is the remainder on division by x−2?","o":["−4","0","2","4"],"a":1,"e":"p(2)=4−4=0."},{"d":"BASIC","q":"For divisor x+3, which value of the polynomial gives the remainder?","o":["p(3)","p(−3)","p(0)","p(−1)"],"a":1,"e":"x+3=x−(−3), so evaluate p(−3)."},{"d":"BASIC","q":"If p(0)=−4, what is the remainder when p(x) is divided by x?","o":["0","−4","4","1"],"a":1,"e":"The divisor x is x−0, so the remainder is p(0)=−4."},{"d":"BASIC","q":"If p(1)=0, what is the remainder when p(x) is divided by x−1?","o":["1","−1","0","Cannot tell"],"a":2,"e":"The remainder equals p(1), which is zero."},{"d":"BASIC","q":"If p(x)=x²+x+1, find the remainder on division by x−2.","o":["3","5","7","9"],"a":2,"e":"p(2)=4+2+1=7."},{"d":"BASIC","q":"The remainder when p(x) is divided by x−a is:","o":["p(a)","p(−a)","a","0 always"],"a":0,"e":"The Remainder Theorem states the remainder is p(a)."},{"d":"MEDIUM","q":"Find the remainder when 2x³−x+4 is divided by x−2.","o":["14","16","18","20"],"a":2,"e":"p(2)=2(8)−2+4=18."},{"d":"MEDIUM","q":"Find the remainder when x³+2x²−5 is divided by x+1.","o":["−2","−4","−6","−8"],"a":1,"e":"p(−1)=−1+2−5=−4."},{"d":"MEDIUM","q":"For p(x)=3x²−2x+7, find the remainder on division by x+2.","o":["11","15","19","23"],"a":3,"e":"p(−2)=12+4+7=23."},{"d":"MEDIUM","q":"If p(x)=x³−4x+1, what is the remainder when divided by x−3?","o":["10","12","16","18"],"a":2,"e":"p(3)=27−12+1=16."},{"d":"MEDIUM","q":"If p(x)=x²+kx+6 has remainder 0 when divided by x−2, find k.","o":["−5","−4","−3","−2"],"a":0,"e":"p(2)=4+2k+6=0, so 2k=−10 and k=−5."},{"d":"MEDIUM","q":"Find the remainder when 4x²−3x+2 is divided by x+1.","o":["3","5","7","9"],"a":3,"e":"p(−1)=4+3+2=9."},{"d":"MEDIUM","q":"If p(x)=x³+ax+2 and the remainder on division by x−1 is 5, find a.","o":["1","2","3","4"],"a":1,"e":"p(1)=1+a+2=5, so a=2."},{"d":"MEDIUM","q":"Find the remainder when x⁴−1 is divided by x−1.","o":["−1","0","1","2"],"a":1,"e":"p(1)=1−1=0."},{"d":"MEDIUM","q":"If p(x)=2x²+bx−3 and the remainder on division by x+1 is 4, find b.","o":["−9","−5","1","5"],"a":1,"e":"p(−1)=2−b−3=4, so −b−1=4 and b=−5."},{"d":"MEDIUM","q":"Find the remainder when 5x³+2x²−x+1 is divided by x+1.","o":["−1","3","5","7"],"a":0,"e":"p(−1)=−5+2+1+1=−1."},{"d":"HARD","q":"If p(x)=x³−2x²+kx+6 is divisible by x−2, find k.","o":["−3","−2","−1","0"],"a":0,"e":"p(2)=8−8+2k+6=0, so k=−3."},{"d":"HARD","q":"A polynomial p(x) leaves remainder 3 when divided by x−1 and remainder 7 when divided by x−2. Find p(1)+p(2).","o":["3","7","10","21"],"a":2,"e":"By the theorem p(1)=3 and p(2)=7, so their sum is 10."},{"d":"HARD","q":"If p(x)=x³+ax²+bx+6 has zeros at x=1 and x=−2, find a+b.","o":["−7","−3","1","3"],"a":0,"e":"p(1)=a+b+7=0, so a+b=−7."},{"d":"HARD","q":"If p(x)=2x³−kx+4 has remainder 10 on division by x−1, find k.","o":["−4","−2","2","4"],"a":0,"e":"p(1)=2−k+4=10 gives k=−4."},{"d":"HARD","q":"When p(x)=x³−3x²+2x+5 is divided by x−2, what is the remainder?","o":["1","3","5","7"],"a":2,"e":"p(2)=8−12+4+5=5."},{"d":"HARD","q":"If p(x)=x²+ax+1 has remainder 3 when divided by x+1, find a.","o":["−3","−1","1","3"],"a":1,"e":"p(−1)=1−a+1=3 gives a=−1."},{"d":"HARD","q":"If p(x) divided by x−3 has remainder −2, what is p(3)?","o":["−2","0","2","3"],"a":0,"e":"The remainder is p(3), so p(3)=−2."},{"d":"HARD","q":"If p(x)=x³+2x²−x+c has remainder 4 on division by x−1, find c.","o":["0","1","2","3"],"a":2,"e":"p(1)=1+2−1+c=2+c=4, so c=2."},{"d":"HARD","q":"If p(x)=x²−5x+k leaves remainder 6 when divided by x−2, find k.","o":["4","6","8","12"],"a":3,"e":"p(2)=4−10+k=k−6=6, so k=12."},{"d":"HARD","q":"For p(x)=3x³−x²+2x−4, find the remainder when divided by x+2.","o":["−36","−24","−16","−12"],"a":0,"e":"p(−2)=−24−4−4−4=−36."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Apply the Remainder Theorem</strong><small>Evaluate p(a) to find remainders</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Use the theorem with different divisors</strong><small>Find unknown coefficients using remainders</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Substitute divisor roots into polynomials</strong><small>Solve remainder-based problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
