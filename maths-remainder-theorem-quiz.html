<main>
<section class="hero">
<h1>Remainder Theorem</h1>
<p class="muted">Use the remainder theorem to evaluate polynomial remainders, substitute values and solve algebra problems.</p>
<div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div>
<div class="track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
</section>
<section class="quiz" id="quiz">

<h2 class="question" id="question">Remainder theorem mastered!</h2>
<div class="options" id="options"></div>
<div class="feedback" id="feedback" aria-live="polite"></div>
<div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div>
</section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"What does the Remainder Theorem help you find?","o":["The degree only","The remainder when a polynomial is divided by x − a","All coefficients","The roots of every equation"],"a":1,"why":"When p(x) is divided by x − a, the remainder is p(a)."},{"d":"BASIC","q":"When p(x) is divided by x − 2, what is the remainder?","o":["p(0)","p(1)","p(2)","p(−2)"],"a":2,"why":"By the Remainder Theorem, the remainder is p(2)."},{"d":"BASIC","q":"If p(x)=x²+3x+1, what is the remainder when divided by x−1?","o":["1","3","5","7"],"a":2,"why":"p(1)=1+3+1=5."},{"d":"BASIC","q":"If p(x)=2x+5 is divided by x+1, what is the remainder?","o":["−1","1","3","7"],"a":2,"why":"p(−1)=−2+5=3."},{"d":"BASIC","q":"If p(x)=x²−4, what is the remainder on division by x−2?","o":["−4","0","2","4"],"a":1,"why":"p(2)=4−4=0."},{"d":"BASIC","q":"For divisor x+3, which value of the polynomial gives the remainder?","o":["p(3)","p(−3)","p(0)","p(−1)"],"a":1,"why":"x+3=x−(−3), so evaluate p(−3)."},{"d":"BASIC","q":"If p(0)=−4, what is the remainder when p(x) is divided by x?","o":["0","−4","4","1"],"a":1,"why":"The divisor x is x−0, so the remainder is p(0)=−4."},{"d":"BASIC","q":"If p(1)=0, what is the remainder when p(x) is divided by x−1?","o":["1","−1","0","Cannot tell"],"a":2,"why":"The remainder equals p(1), which is zero."},{"d":"BASIC","q":"If p(x)=x²+x+1, find the remainder on division by x−2.","o":["3","5","7","9"],"a":2,"why":"p(2)=4+2+1=7."},{"d":"BASIC","q":"The remainder when p(x) is divided by x−a is:","o":["p(a)","p(−a)","a","0 always"],"a":0,"why":"The Remainder Theorem states the remainder is p(a)."},{"d":"MEDIUM","q":"Find the remainder when 2x³−x+4 is divided by x−2.","o":["14","16","18","20"],"a":2,"why":"p(2)=2(8)−2+4=18."},{"d":"MEDIUM","q":"Find the remainder when x³+2x²−5 is divided by x+1.","o":["−2","−4","−6","−8"],"a":1,"why":"p(−1)=−1+2−5=−4."},{"d":"MEDIUM","q":"For p(x)=3x²−2x+7, find the remainder on division by x+2.","o":["11","15","19","23"],"a":3,"why":"p(−2)=12+4+7=23."},{"d":"MEDIUM","q":"If p(x)=x³−4x+1, what is the remainder when divided by x−3?","o":["10","12","16","18"],"a":2,"why":"p(3)=27−12+1=16."},{"d":"MEDIUM","q":"If p(x)=x²+kx+6 has remainder 0 when divided by x−2, find k.","o":["−5","−4","−3","−2"],"a":0,"why":"p(2)=4+2k+6=0, so 2k=−10 and k=−5."},{"d":"MEDIUM","q":"Find the remainder when 4x²−3x+2 is divided by x+1.","o":["3","5","7","9"],"a":3,"why":"p(−1)=4+3+2=9."},{"d":"MEDIUM","q":"If p(x)=x³+ax+2 and the remainder on division by x−1 is 5, find a.","o":["1","2","3","4"],"a":1,"why":"p(1)=1+a+2=5, so a=2."},{"d":"MEDIUM","q":"Find the remainder when x⁴−1 is divided by x−1.","o":["−1","0","1","2"],"a":1,"why":"p(1)=1−1=0."},{"d":"MEDIUM","q":"If p(x)=2x²+bx−3 and the remainder on division by x+1 is 4, find b.","o":["−9","−5","1","5"],"a":1,"why":"p(−1)=2−b−3=4, so −b−1=4 and b=−5."},{"d":"MEDIUM","q":"Find the remainder when 5x³+2x²−x+1 is divided by x+1.","o":["−1","3","5","7"],"a":0,"why":"p(−1)=−5+2+1+1=−1."},{"d":"HARD","q":"If p(x)=x³−2x²+kx+6 is divisible by x−2, find k.","o":["−3","−2","−1","0"],"a":0,"why":"p(2)=8−8+2k+6=0, so k=−3."},{"d":"HARD","q":"A polynomial p(x) leaves remainder 3 when divided by x−1 and remainder 7 when divided by x−2. Find p(1)+p(2).","o":["3","7","10","21"],"a":2,"why":"By the theorem p(1)=3 and p(2)=7, so their sum is 10."},{"d":"HARD","q":"If p(x)=x³+ax²+bx+6 has zeros at x=1 and x=−2, find a+b.","o":["−7","−3","1","3"],"a":0,"why":"p(1)=a+b+7=0, so a+b=−7."},{"d":"HARD","q":"If p(x)=2x³−kx+4 has remainder 10 on division by x−1, find k.","o":["−4","−2","2","4"],"a":0,"why":"p(1)=2−k+4=10 gives k=−4."},{"d":"HARD","q":"When p(x)=x³−3x²+2x+5 is divided by x−2, what is the remainder?","o":["1","3","5","7"],"a":2,"why":"p(2)=8−12+4+5=5."},{"d":"HARD","q":"If p(x)=x²+ax+1 has remainder 3 when divided by x+1, find a.","o":["−3","−1","1","3"],"a":1,"why":"p(−1)=1−a+1=3 gives a=−1."},{"d":"HARD","q":"If p(x) divided by x−3 has remainder −2, what is p(3)?","o":["−2","0","2","3"],"a":0,"why":"The remainder is p(3), so p(3)=−2."},{"d":"HARD","q":"If p(x)=x³+2x²−x+c has remainder 4 on division by x−1, find c.","o":["0","1","2","3"],"a":2,"why":"p(1)=1+2−1+c=2+c=4, so c=2."},{"d":"HARD","q":"If p(x)=x²−5x+k leaves remainder 6 when divided by x−2, find k.","o":["4","6","8","12"],"a":3,"why":"p(2)=4−10+k=k−6=6, so k=12."},{"d":"HARD","q":"For p(x)=3x³−x²+2x−4, find the remainder when divided by x+2.","o":["−36","−24","−16","−12"],"a":0,"why":"p(−2)=−24−4−4−4=−36."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Remainder Theorem Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
