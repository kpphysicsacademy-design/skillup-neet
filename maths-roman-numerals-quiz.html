<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f9ff">
<meta name="skillup-release" content="20261110-roman-numerals-recreated-v1">
<meta name="description" content="Practise Roman numerals with 30 questions, instant explanations, progress tracking and mistake revision.">
<title>SkillUp Maths | Roman Numerals — Practice</title>
<style>
:root{--blue:#248ac0;--green:#48b516;--ink:#263746;--muted:#71808d;--line:#e3e9ed;--bg:#f7f9fa;--red:#d94b4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.nav{max-width:620px;margin:auto;min-height:48px;padding:6px 12px;display:flex;align-items:center;gap:9px}
.back{display:grid;place-items:center;flex:0 0 32px;width:32px;height:32px;border:1px solid var(--line);border-radius:9px;color:var(--blue);text-decoration:none;font-size:17px}
.brand{min-width:0;flex:1;font-size:15px;font-weight:850;white-space:nowrap}
.pill{padding:5px 8px;border-radius:8px;font-size:11px;font-weight:800;white-space:nowrap;background:#f4f7f8;color:#52616c}
main{width:min(100% - 24px,620px);margin:auto;padding:12px 8px 28px}
.hero{padding:4px 2px 12px;margin-bottom:10px}.hero h1{margin:0 0 3px;font-size:21px;line-height:1.25;font-weight:800}
.muted{color:var(--muted);font-size:12px;line-height:1.4;margin:0}
.progress-row{display:flex;justify-content:space-between;margin:11px 0 5px;font-size:11px;font-weight:750;color:var(--muted)}
.track{height:5px;border-radius:8px;background:#e8edf0;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:8px;transition:width .2s}
.quiz,.finish{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px;margin:0 0 12px}
.qmeta{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.4px}
.question{font-size:clamp(18px,3.8vw,22px);line-height:1.4;margin:8px 0 13px;font-weight:750}
.options{display:grid;gap:7px}.option{display:flex;gap:9px;align-items:center;width:100%;min-height:42px;padding:8px 10px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:9px;color:var(--ink);font-size:14px;font-weight:650;line-height:1.35;cursor:pointer}
.letter{flex:0 0 22px;height:22px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:10px;color:var(--muted);font-weight:800}
.option.selected{border-color:var(--blue);background:#f0f8fc}.option.correct{border-color:#a9d994;background:#f0f9ec;color:#286b19}.option.wrong{border-color:#efb6b6;background:#fff4f4;color:#9b3030}
.option:disabled{cursor:default;opacity:1}
.feedback{display:none;margin-top:10px;padding:10px;border-radius:9px;font-size:12px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#f0f9ec;color:#286b19}.feedback.bad{background:#fff4f4;color:#9b3030}
.actions{display:flex;gap:8px;margin-top:12px}.btn{flex:1;min-height:39px;border:0;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:800;cursor:pointer}
.check{background:var(--green);color:#fff}.continue{display:none;background:var(--blue);color:#fff}.continue.show{display:block}.btn:disabled{opacity:.4;cursor:not-allowed}
.finish{text-align:center;padding:20px 14px}.trophy{font-size:42px}.score{font-size:34px;font-weight:850;color:var(--ink)}.finish h2{margin:5px 0 8px}.finish .btn{margin-top:12px;max-width:250px;background:var(--green);color:#fff}
.review{text-align:left;margin:14px 0 5px}.review-item{padding:10px;margin:8px 0;border:1px solid var(--line);border-radius:9px;background:#fff}.review-item p{margin:4px 0}
.your-answer{color:#9b3030}.correct-answer{color:#286b19}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media(max-width:480px){.nav{min-height:44px;padding:5px 9px;gap:7px}.brand{font-size:14px}.pill{font-size:10px;padding:5px 7px}main{width:100%;padding:10px 9px 22px}.hero{padding:2px 2px 10px}.hero h1{font-size:19px}.quiz,.finish{padding:12px;border-radius:11px}.question{font-size:18px;margin:7px 0 11px}.option{min-height:39px;padding:7px 9px;font-size:13px}.options{gap:6px}.btn{min-height:37px;font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>
<body>
<header><div class="nav">
<a class="back" href="maths-home.html?v=20261106-large-numbers-line-symmetry-layout-v2" aria-label="Back to Maths Path">←</a>
<div class="brand">SkillUp <span style="color:#58a900">Maths</span></div>
<div class="pill">🏛️ Roman Numerals</div><div class="pill">⭐ <span id="xp">0</span> XP</div>
</div></header>
<main>
<section class="hero"><h1>🏛️ Roman Numerals</h1>
<p class="muted">Roman symbols · Addition and subtraction · Reading and writing numerals</p>
<div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div>
<div class="track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
</section>
<section class="quiz" id="quiz">
<div class="qmeta" id="qmeta">QUESTION 1</div><div class="question" id="question"></div>
<div class="options" id="options"></div><div class="feedback" id="feedback" role="status"></div>
<div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div>
</section><div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[
{"level":"BASIC","q":"What is the value of the Roman numeral I?","o":["1","5","10","50"],"a":0,"why":"I represents one."},
{"level":"BASIC","q":"Which Roman numeral represents 5?","o":["I","V","X","L"],"a":1,"why":"V represents five."},
{"level":"BASIC","q":"What number does X represent?","o":["5","10","50","100"],"a":1,"why":"X represents ten."},
{"level":"BASIC","q":"Which Roman numeral represents 50?","o":["C","L","D","V"],"a":1,"why":"L represents fifty."},
{"level":"BASIC","q":"What is the value of C?","o":["10","50","100","500"],"a":2,"why":"C represents one hundred."},
{"level":"BASIC","q":"Which Roman numeral means 500?","o":["C","D","M","L"],"a":1,"why":"D represents five hundred."},
{"level":"BASIC","q":"What number does M represent?","o":["100","500","1,000","10,000"],"a":2,"why":"M represents one thousand."},
{"level":"BASIC","q":"Which Roman numeral represents 4?","o":["IIII","IV","VI","IX"],"a":1,"why":"IV means one before five: 5 − 1 = 4."},
{"level":"BASIC","q":"What number is VI?","o":["4","5","6","9"],"a":2,"why":"V is 5 and I after V adds 1, so VI = 6."},
{"level":"BASIC","q":"What number is IX?","o":["8","9","11","19"],"a":1,"why":"I before X means subtract 1 from 10, so IX = 9."},
{"level":"MEDIUM","q":"Write 12 in Roman numerals.","o":["XII","IXI","XXI","XV"],"a":0,"why":"10 + 1 + 1 = XII."},
{"level":"MEDIUM","q":"What number is XIV?","o":["12","14","16","19"],"a":1,"why":"X is 10 and IV is 4, so XIV = 14."},
{"level":"MEDIUM","q":"Write 19 in Roman numerals.","o":["XIV","XIX","XXI","XVIIII"],"a":1,"why":"19 = 10 + 9, written XIX."},
{"level":"MEDIUM","q":"What number is XXVII?","o":["17","22","27","32"],"a":2,"why":"XX = 20 and VII = 7, giving 27."},
{"level":"MEDIUM","q":"Write 40 in Roman numerals.","o":["XXXX","XL","LX","IL"],"a":1,"why":"XL means 50 − 10 = 40."},
{"level":"MEDIUM","q":"What number is XLVI?","o":["36","44","46","56"],"a":2,"why":"XL = 40 and VI = 6, so XLVI = 46."},
{"level":"MEDIUM","q":"Write 90 in Roman numerals.","o":["LXXXX","XC","CX","IC"],"a":1,"why":"XC means 100 − 10 = 90."},
{"level":"MEDIUM","q":"What number is CXL?","o":["40","100","140","160"],"a":2,"why":"C = 100 and XL = 40, giving 140."},
{"level":"MEDIUM","q":"Write 400 in Roman numerals.","o":["CCCC","CD","DC","XD"],"a":1,"why":"CD means 500 − 100 = 400."},
{"level":"MEDIUM","q":"What number is DCCVIII?","o":["608","708","718","808"],"a":1,"why":"D = 500, CC = 200, and VIII = 8; total 708."},
{"level":"HARD","q":"Write 944 in Roman numerals.","o":["CMXLIV","DCCCCXXXXIIII","CMIL","DCLXIV"],"a":0,"why":"944 = 900 + 40 + 4 = CM + XL + IV = CMXLIV."},
{"level":"HARD","q":"What number is MCMXC?","o":["1,990","1,090","1,900","1,890"],"a":0,"why":"M = 1,000, CM = 900, and XC = 90. Total = 1,990."},
{"level":"HARD","q":"Write 1,486 in Roman numerals.","o":["MCDLXXXVI","MCCCCLXXXVI","MDLXXXIV","MCDXCVI"],"a":0,"why":"1,486 = 1,000 + 400 + 80 + 6 = M + CD + LXXX + VI."},
{"level":"HARD","q":"What number is MMCDXLII?","o":["2,342","2,442","2,542","2,642"],"a":1,"why":"MM = 2,000, CD = 400, XL = 40, and II = 2; total 2,442."},
{"level":"HARD","q":"Which Roman numeral is written correctly for 49?","o":["IL","XXXXIX","XLIX","VLIV"],"a":2,"why":"49 = 40 + 9, written XL + IX = XLIX."},
{"level":"HARD","q":"Which Roman numeral is written correctly for 99?","o":["IC","XCIX","LXXXXVIIII","VC"],"a":1,"why":"99 = 90 + 9, written XC + IX = XCIX."},
{"level":"HARD","q":"What is the value of MDCLXVI?","o":["1,566","1,666","1,766","1,966"],"a":1,"why":"M 1,000 + D 500 + C 100 + L 50 + X 10 + V 5 + I 1 = 1,666."},
{"level":"HARD","q":"Write 2,019 in Roman numerals.","o":["MMXIX","MMXIV","MMXIXI","MCMXIX"],"a":0,"why":"2,019 = 2,000 + 19 = MM + XIX = MMXIX."},
{"level":"HARD","q":"What number is MMMDCCLXXVII?","o":["3,677","3,777","3,877","3,977"],"a":1,"why":"MMM = 3,000, DCC = 700, LXX = 70, VII = 7; total 3,777."},
{"level":"HARD","q":"A clock face uses Roman numerals. If the hour marker is IX, which hour is it?","o":["7 o’clock","8 o’clock","9 o’clock","11 o’clock"],"a":2,"why":"IX represents 9, so the marker is nine o’clock."}
];
const originalQuestions=questions.slice();let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';$('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent=item.level+' · QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';$('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';$('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=String(score*10);feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100),card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Roman Numerals Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-large-numbers-line-symmetry-layout-v2" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});}
 else review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}else questions.splice(0,questions.length,...originalQuestions);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});}
 $('retry').addEventListener('click',()=>reset(false));$('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
</body></html>
