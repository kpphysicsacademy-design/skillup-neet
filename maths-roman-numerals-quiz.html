<script>
(function(){
'use strict';
const questions=[
{"d":"BASIC","q":"What is the value of the Roman numeral I?","o":["1","5","10","50"],"a":0,"e":"I represents one."},
{"d":"BASIC","q":"Which Roman numeral represents 5?","o":["I","V","X","L"],"a":1,"e":"V represents five."},
{"d":"BASIC","q":"What number does X represent?","o":["5","10","50","100"],"a":1,"e":"X represents ten."},
{"d":"BASIC","q":"Which Roman numeral represents 50?","o":["C","L","D","V"],"a":1,"e":"L represents fifty."},
{"d":"BASIC","q":"What is the value of C?","o":["10","50","100","500"],"a":2,"e":"C represents one hundred."},
{"d":"BASIC","q":"Which Roman numeral means 500?","o":["C","D","M","L"],"a":1,"e":"D represents five hundred."},
{"d":"BASIC","q":"What number does M represent?","o":["100","500","1,000","10,000"],"a":2,"e":"M represents one thousand."},
{"d":"BASIC","q":"Which Roman numeral represents 4?","o":["IIII","IV","VI","IX"],"a":1,"e":"IV means one before five: 5 − 1 = 4."},
{"d":"BASIC","q":"What number is VI?","o":["4","5","6","9"],"a":2,"e":"V is 5 and I after V adds 1, so VI = 6."},
{"d":"BASIC","q":"What number is IX?","o":["8","9","11","19"],"a":1,"e":"I before X means subtract 1 from 10, so IX = 9."},
{"d":"MEDIUM","q":"Write 12 in Roman numerals.","o":["XII","IXI","XXI","XV"],"a":0,"e":"10 + 1 + 1 = XII."},
{"d":"MEDIUM","q":"What number is XIV?","o":["12","14","16","19"],"a":1,"e":"X is 10 and IV is 4, so XIV = 14."},
{"d":"MEDIUM","q":"Write 19 in Roman numerals.","o":["XIV","XIX","XXI","XVIIII"],"a":1,"e":"19 = 10 + 9, written XIX."},
{"d":"MEDIUM","q":"What number is XXVII?","o":["17","22","27","32"],"a":2,"e":"XX = 20 and VII = 7, giving 27."},
{"d":"MEDIUM","q":"Write 40 in Roman numerals.","o":["XXXX","XL","LX","IL"],"a":1,"e":"XL means 50 − 10 = 40."},
{"d":"MEDIUM","q":"What number is XLVI?","o":["36","44","46","56"],"a":2,"e":"XL = 40 and VI = 6, so XLVI = 46."},
{"d":"MEDIUM","q":"Write 90 in Roman numerals.","o":["LXXXX","XC","CX","IC"],"a":1,"e":"XC means 100 − 10 = 90."},
{"d":"MEDIUM","q":"What number is CXL?","o":["40","100","140","160"],"a":2,"e":"C = 100 and XL = 40, giving 140."},
{"d":"MEDIUM","q":"Write 400 in Roman numerals.","o":["CCCC","CD","DC","XD"],"a":1,"e":"CD means 500 − 100 = 400."},
{"d":"MEDIUM","q":"What number is DCCVIII?","o":["608","708","718","808"],"a":1,"e":"D = 500, CC = 200, and VIII = 8; total 708."},
{"d":"HARD","q":"Write 944 in Roman numerals.","o":["CMXLIV","DCCCCXXXXIIII","CMIL","DCLXIV"],"a":0,"e":"944 = 900 + 40 + 4 = CM + XL + IV = CMXLIV."},
{"d":"HARD","q":"What number is MCMXC?","o":["1,990","1,090","1,900","1,890"],"a":0,"e":"M = 1,000, CM = 900, and XC = 90. Total = 1,990."},
{"d":"HARD","q":"Write 1,486 in Roman numerals.","o":["MCDLXXXVI","MCCCCLXXXVI","MDLXXXIV","MCDXCVI"],"a":0,"e":"1,486 = 1,000 + 400 + 80 + 6 = M + CD + LXXX + VI."},
{"d":"HARD","q":"What number is MMCDXLII?","o":["2,342","2,442","2,542","2,642"],"a":1,"e":"MM = 2,000, CD = 400, XL = 40, and II = 2; total 2,442."},
{"d":"HARD","q":"Which Roman numeral is written correctly for 49?","o":["IL","XXXXIX","XLIX","VLIV"],"a":2,"e":"49 = 40 + 9, written XL + IX = XLIX."},
{"d":"HARD","q":"Which Roman numeral is written correctly for 99?","o":["IC","XCIX","LXXXXVIIII","VC"],"a":1,"e":"99 = 90 + 9, written XC + IX = XCIX."},
{"d":"HARD","q":"What is the value of MDCLXVI?","o":["1,566","1,666","1,766","1,966"],"a":1,"e":"M 1,000 + D 500 + C 100 + L 50 + X 10 + V 5 + I 1 = 1,666."},
{"d":"HARD","q":"Write 2,019 in Roman numerals.","o":["MMXIX","MMXIV","MMXIXI","MCMXIX"],"a":0,"e":"2,019 = 2,000 + 19 = MM + XIX = MMXIX."},
{"d":"HARD","q":"What number is MMMDCCLXXVII?","o":["3,677","3,777","3,877","3,977"],"a":1,"e":"MMM = 3,000, DCC = 700, LXX = 70, VII = 7; total 3,777."},
{"d":"HARD","q":"A clock face uses Roman numerals. If the hour marker is IX, which hour is it?","o":["7 o’clock","8 o’clock","9 o’clock","11 o’clock"],"a":2,"e":"IX represents 9, so the marker is nine o’clock."}
];
let started=true,index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;
const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');
function updateProgress(){const p=started?index/questions.length*100:0;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}
function renderQuestion(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>selectAnswer(Number(b.dataset.i))));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}
function selectAnswer(i){if(locked)return;selected=i;$('content').querySelectorAll('.choice').forEach((b,j)=>{b.classList.toggle('selected',j===i);});$('action').disabled=false;}
function checkAnswer(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});const f=$('feedback');f.textContent=(good?'✨ Great job! ':'💡 Keep going! ')+q.e;f.className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Learn from this one';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;renderQuestion();return;}showResults();}
function showResults(){finished=true;bar.style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can try again anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div class="mascot">'+(correct>=8?'🏆':correct>=5?'🌟':'💪')+'</div><h1>'+(correct>=8?'Amazing work!':correct>=5?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔤</span><div><strong>Know Roman symbols</strong><small>Understand I, V, X, L, C, D and M</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Build numerals</strong><small>Combine symbols using addition and subtraction</small></div></div><div class="skill"><span class="skill-icon">🏛️</span><div><strong>Use Roman numerals</strong><small>Read numbers in dates, clocks and everyday examples</small></div></div></div><p>Remember: a smaller symbol before a larger symbol means subtraction; after it means addition.</p></div>';$('action').textContent='Try again ↻';$('action').disabled=false;}
function start(){started=true;finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';renderQuestion();}
$('action').addEventListener('click',()=>{if(finished){start();return;}checkAnswer();});
renderQuestion();
})();
</script>
