<style>

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Rotational symmetry means a shape looks unchanged after a...","o":["turn about a fixed point","slide in a straight line","change of colour","stretch in one direction"],"a":0,"e":"A rotation about a centre can map the figure onto itself.","v":"rotational-symmetry"},{"d":"BASIC","q":"What is the smallest angle of rotation that maps a square onto itself?","o":["45°","90°","120°","180°"],"a":1,"e":"A square matches itself after a quarter-turn of 90°.","v":"rotational-symmetry"},{"d":"BASIC","q":"What is the order of rotational symmetry of a square?","o":["1","2","4","8"],"a":2,"e":"It matches at 0°, 90°, 180°, and 270° in one full turn.","v":"rotational-symmetry"},{"d":"BASIC","q":"What is the order of rotational symmetry of a non-square rectangle?","o":["1","3","4","2"],"a":3,"e":"It matches after 180° and 360° in a full turn.","v":"rotational-symmetry"},{"d":"BASIC","q":"What is the order of rotational symmetry of an equilateral triangle?","o":["3","1","2","6"],"a":0,"e":"It matches after rotations of 120°, 240°, and 360°.","v":"rotational-symmetry"},{"d":"BASIC","q":"A shape matches itself only after a full 360° turn. What is its order?","o":["0","1","2","4"],"a":1,"e":"One complete turn gives order 1 when there are no earlier matching positions.","v":"rotational-symmetry"},{"d":"BASIC","q":"What is the smallest angle of rotation for a regular hexagon?","o":["30°","90°","60°","120°"],"a":2,"e":"A regular hexagon has six equal rotational positions in 360°, so 360° ÷ 6 = 60°.","v":"rotational-symmetry"},{"d":"BASIC","q":"How many degrees are in one complete rotation?","o":["90°","180°","270°","360°"],"a":3,"e":"One complete turn is 360 degrees.","v":"rotational-symmetry"},{"d":"BASIC","q":"What is the order of rotational symmetry of a circle?","o":["Infinitely many","1","2","360 only"],"a":0,"e":"A circle maps onto itself after rotation through any angle.","v":"rotational-symmetry"},{"d":"BASIC","q":"Which shape has rotational symmetry of order 2?","o":["A typical scalene triangle","A non-square rectangle","A typical isosceles triangle","A non-square trapezium"],"a":1,"e":"A non-square rectangle matches after a half-turn, giving order 2.","v":"rotational-symmetry"},{"d":"MEDIUM","q":"A regular pentagon has what order of rotational symmetry?","o":["2","4","5","10"],"a":2,"e":"A regular polygon's rotational order equals its number of sides.","v":"rotational-symmetry"},{"d":"MEDIUM","q":"Find the smallest angle of rotation for a regular octagon.","o":["30°","60°","90°","45°"],"a":3,"e":"360° ÷ 8 = 45°.","v":"rotational-symmetry"},{"d":"MEDIUM","q":"A shape has rotational symmetry of order 6. What is its smallest angle of rotation?","o":["60°","30°","90°","120°"],"a":0,"e":"The smallest angle is 360° divided by the order: 360° ÷ 6 = 60°.","v":"rotational-symmetry"},{"d":"MEDIUM","q":"A figure matches itself every 120° during a full turn. What is its order?","o":["2","3","4","6"],"a":1,"e":"360° ÷ 120° = 3 matching positions.","v":"rotational-symmetry"},{"d":"MEDIUM","q":"Which statement is true about a parallelogram?","o":["Every parallelogram has four lines of symmetry","It has rotational symmetry of order 4","It has rotational symmetry of order 2","It never matches after a half-turn"],"a":2,"e":"A half-turn about the intersection of its diagonals maps a parallelogram onto itself.","v":"rotational-symmetry"},{"d":"MEDIUM","q":"What is the smallest angle of rotation for a regular decagon?","o":["18°","45°","72°","36°"],"a":3,"e":"A decagon has 10 equal turns: 360° ÷ 10 = 36°.","v":"rotational-symmetry"},{"d":"MEDIUM","q":"A shape has order 4. At which angle does it first match itself after turning from its starting position?","o":["90°","45°","120°","180°"],"a":0,"e":"The first matching turn is 360° ÷ 4 = 90°.","v":"rotational-symmetry"},{"d":"MEDIUM","q":"Which shape has rotational symmetry of order 3?","o":["A non-square rectangle","An equilateral triangle","A regular pentagon","A typical isosceles triangle"],"a":1,"e":"An equilateral triangle has three matching orientations in one full turn.","v":"rotational-symmetry"},{"d":"MEDIUM","q":"A regular polygon's smallest rotation is 40°. How many sides does it have?","o":["8","10","9","12"],"a":2,"e":"360° ÷ 40° = 9, so it is a regular nonagon.","v":"rotational-symmetry"},{"d":"MEDIUM","q":"How many times does a regular hexagon match itself during a full 360° turn, counting the starting position at 0°?","o":["3","5","12","6"],"a":3,"e":"Its rotational order is 6, with matching positions every 60°.","v":"rotational-symmetry"},{"d":"HARD","q":"A shape has rotational order 8. How many degrees does it turn between consecutive matching positions?","o":["45°","22.5°","60°","90°"],"a":0,"e":"360° ÷ 8 = 45°.","v":"rotational-symmetry"},{"d":"HARD","q":"A design repeats after every 24° rotation. What is its rotational order?","o":["12","15","18","24"],"a":1,"e":"360° ÷ 24° = 15 matching intervals in a full turn.","v":"rotational-symmetry"},{"d":"HARD","q":"A regular polygon has a smallest angle of rotation of 24°. How many sides does it have?","o":["12","14","15","16"],"a":2,"e":"The order is 360° ÷ 24° = 15; for a regular polygon, order equals side count.","v":"rotational-symmetry"},{"d":"HARD","q":"Which statement correctly compares a square and a non-square rectangle?","o":["Both have order 1","Both have order 4","The square has order 2; the rectangle has order 4","The square has order 4; the rectangle has order 2"],"a":3,"e":"A square matches every 90°, while a non-square rectangle matches every 180°.","v":"rotational-symmetry"},{"d":"HARD","q":"A shape's smallest angle of rotation is 72°. What is its order?","o":["5","4","6","8"],"a":0,"e":"360° ÷ 72° = 5.","v":"rotational-symmetry"},{"d":"HARD","q":"A regular 12-sided polygon is rotated about its centre. What is its smallest angle of rotation?","o":["15°","30°","24°","45°"],"a":1,"e":"360° ÷ 12 = 30°.","v":"rotational-symmetry"},{"d":"HARD","q":"A shape has order 4. Which list gives all matching angles strictly between 0° and 360°?","o":["45°, 90°, 135°","120°, 240°","90°, 180°, 270°","90°, 180°, 360°"],"a":2,"e":"Order 4 gives matching turns every 90°; excluding 0° and 360° leaves 90°, 180°, and 270°.","v":"rotational-symmetry"},{"d":"HARD","q":"A regular polygon has 10 rotational positions in one full turn. What is its smallest rotation angle?","o":["30°","45°","60°","36°"],"a":3,"e":"360° divided by 10 positions is 36°.","v":"rotational-symmetry"},{"d":"HARD","q":"A design has rotational order 3. Which angle will NOT map it onto itself, assuming it has no additional rotational symmetry?","o":["60°","120°","240°","360°"],"a":0,"e":"Its matching turns are multiples of 120°; 60° is not one of them.","v":"rotational-symmetry"},{"d":"HARD","q":"A regular polygon has 18 sides. How many degrees separate adjacent matching orientations?","o":["10°","20°","18°","30°"],"a":1,"e":"360° ÷ 18 = 20°.","v":"rotational-symmetry"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand rotational symmetry</strong><small>Recognise matching orientations after a turn</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Find rotational order and smallest angle</strong><small>Apply 360° divided by rotational order</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve rotational-symmetry problems</strong><small>Connect angle and order in regular polygons</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
