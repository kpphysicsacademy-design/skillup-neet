<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261015-class8-scientific-notation-v1"><title>Scientific Notation | Class 8 Maths | SkillUp</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Scientific Notation</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Write 4500000 in scientific notation.","o":["4.5 × 10⁵","45 × 10⁵","4.5 × 10⁶","0.45 × 10⁶"],"a":2,"e":"Move the decimal six places left: 4,500,000 = 4.5 × 10⁶.","v":"scientific-notation"},{"d":"BASIC","q":"Write 0.00072 in scientific notation.","o":["7.2 × 10⁻⁴","72 × 10⁻⁵","7.2 × 10⁴","0.72 × 10⁻⁴"],"a":0,"e":"Move the decimal four places right to get 7.2, so the exponent is −4.","v":"scientific-notation"},{"d":"BASIC","q":"Which is proper scientific notation for 83000?","o":["83 × 10³","8.3 × 10⁴","0.83 × 10⁵","830 × 10²"],"a":1,"e":"The coefficient must be at least 1 and less than 10: 8.3 × 10⁴.","v":"scientific-notation"},{"d":"BASIC","q":"Write 6.02 × 10³ in ordinary form.","o":["602","6020","60200","0.00602"],"a":1,"e":"Multiplying by 10³ moves the decimal three places right: 6020.","v":"scientific-notation"},{"d":"BASIC","q":"Write 3.4 × 10⁻² in decimal form.","o":["340","0.34","0.034","0.0034"],"a":2,"e":"The exponent −2 moves the decimal two places left: 0.034.","v":"scientific-notation"},{"d":"BASIC","q":"What is the coefficient in 5.7 × 10⁸?","o":["8","10","5.7","57"],"a":2,"e":"The coefficient is the number between 1 and 10, here 5.7.","v":"scientific-notation"},{"d":"BASIC","q":"What is the power of ten in 9.1 × 10⁻⁶?","o":["9.1","10⁶","−6","10⁻⁶"],"a":3,"e":"The power-of-ten factor is 10⁻⁶.","v":"scientific-notation"},{"d":"BASIC","q":"Write 72000000 in scientific notation.","o":["7.2 × 10⁷","72 × 10⁶","7.2 × 10⁶","0.72 × 10⁸"],"a":0,"e":"Move the decimal seven places left: 7.2 × 10⁷.","v":"scientific-notation"},{"d":"BASIC","q":"Write 0.0056 in scientific notation.","o":["5.6 × 10⁻²","56 × 10⁻⁴","5.6 × 10⁻³","0.56 × 10⁻²"],"a":2,"e":"Move the decimal three places right to obtain 5.6, so use 10⁻³.","v":"scientific-notation"},{"d":"BASIC","q":"Evaluate (2 × 10³)(3 × 10²).","o":["6 × 10⁵","5 × 10⁵","6 × 10⁶","6 × 10¹"],"a":0,"e":"Multiply coefficients and add exponents: 2 × 3 = 6 and 3 + 2 = 5.","v":"scientific-notation"},{"d":"MEDIUM","q":"Evaluate (8 × 10⁶) ÷ (2 × 10²).","o":["4 × 10⁸","4 × 10⁴","6 × 10⁴","4 × 10³"],"a":1,"e":"Divide coefficients and subtract exponents: 8 ÷ 2 = 4 and 6 − 2 = 4.","v":"scientific-notation"},{"d":"MEDIUM","q":"Which number equals 1.2 × 10⁴?","o":["120","1200","12000","120000"],"a":2,"e":"1.2 × 10⁴ = 1.2 × 10000 = 12000.","v":"scientific-notation"},{"d":"MEDIUM","q":"Which number equals 4.8 × 10⁻³?","o":["0.048","0.0048","0.00048","4800"],"a":1,"e":"Moving the decimal three places left gives 0.0048.","v":"scientific-notation"},{"d":"MEDIUM","q":"Express 0.0000091 in scientific notation.","o":["9.1 × 10⁻⁵","9.1 × 10⁻⁶","91 × 10⁻⁷","0.91 × 10⁻⁵"],"a":1,"e":"Move the decimal six places right to get 9.1, giving 9.1 × 10⁻⁶.","v":"scientific-notation"},{"d":"MEDIUM","q":"Express 605000 in scientific notation.","o":["6.05 × 10⁴","60.5 × 10⁴","6.05 × 10⁵","0.605 × 10⁶"],"a":2,"e":"Move the decimal five places left: 6.05 × 10⁵.","v":"scientific-notation"},{"d":"MEDIUM","q":"Which coefficient is allowed in standard scientific notation?","o":["0.8","10","12.4","7.9"],"a":3,"e":"The coefficient must satisfy 1 ≤ coefficient < 10; 7.9 qualifies.","v":"scientific-notation"},{"d":"MEDIUM","q":"Simplify (5 × 10⁴)(2 × 10⁻²).","o":["10 × 10²","1 × 10³","10 × 10⁻⁸","7 × 10²"],"a":0,"e":"Multiply coefficients to get 10 and add exponents to get 2; 10 × 10² = 1 × 10³.","v":"scientific-notation"},{"d":"MEDIUM","q":"Simplify (9 × 10⁵) ÷ (3 × 10²).","o":["3 × 10³","3 × 10⁷","6 × 10³","3 × 10²"],"a":0,"e":"9 ÷ 3 = 3 and 10⁵ ÷ 10² = 10³.","v":"scientific-notation"},{"d":"MEDIUM","q":"Arrange in increasing order: 3 × 10⁴, 5 × 10³, 2 × 10⁵.","o":["2 × 10⁵, 3 × 10⁴, 5 × 10³","5 × 10³, 3 × 10⁴, 2 × 10⁵","3 × 10⁴, 5 × 10³, 2 × 10⁵","5 × 10³, 2 × 10⁵, 3 × 10⁴"],"a":1,"e":"Their values are 5,000, 30,000 and 200,000, respectively.","v":"scientific-notation"},{"d":"MEDIUM","q":"A bacterium is 0.000002 m long. Write this in scientific notation.","o":["2 × 10⁻⁵ m","2 × 10⁻⁶ m","2 × 10⁶ m","0.2 × 10⁻⁵ m"],"a":1,"e":"0.000002 = 2 × 10⁻⁶.","v":"scientific-notation"},{"d":"HARD","q":"The distance is 1.5 × 10⁸ km. Write it in ordinary form.","o":["15,000,000 km","150,000,000 km","1,500,000 km","1,500,000,000 km"],"a":1,"e":"1.5 × 100,000,000 = 150,000,000.","v":"scientific-notation"},{"d":"HARD","q":"Express 0.00034 as a power-of-ten product with coefficient 3.4.","o":["3.4 × 10⁻⁴","3.4 × 10⁻³","34 × 10⁻⁴","0.34 × 10⁻³"],"a":0,"e":"Moving the decimal four places right gives 3.4, so the exponent is −4.","v":"scientific-notation"},{"d":"HARD","q":"Express 9200 in scientific notation.","o":["92 × 10²","9.2 × 10³","0.92 × 10⁴","9.2 × 10²"],"a":1,"e":"9200 = 9.2 × 1000 = 9.2 × 10³.","v":"scientific-notation"},{"d":"HARD","q":"Evaluate (4 × 10⁻³)(5 × 10⁴).","o":["20 × 10¹","2 × 10²","20 × 10⁻¹²","9 × 10¹"],"a":0,"e":"Multiply coefficients to get 20 and add exponents: −3 + 4 = 1; this equals 200.","v":"scientific-notation"},{"d":"HARD","q":"Evaluate (6 × 10⁷) ÷ (3 × 10⁴).","o":["2 × 10³","2 × 10¹¹","3 × 10³","2 × 10⁴"],"a":0,"e":"6 ÷ 3 = 2 and 10⁷ ÷ 10⁴ = 10³.","v":"scientific-notation"},{"d":"HARD","q":"How many places does the decimal move to write 0.00081 as 8.1 × 10⁻⁴?","o":["2 right","3 right","4 right","4 left"],"a":2,"e":"The decimal moves four places right to turn 0.00081 into 8.1.","v":"scientific-notation"},{"d":"HARD","q":"Which is the largest number?","o":["6.2 × 10⁴","6.2 × 10⁵","6.2 × 10³","6.2 × 10²"],"a":1,"e":"With equal positive coefficients, the largest exponent gives the largest number.","v":"scientific-notation"},{"d":"HARD","q":"Which is the smallest positive number?","o":["3 × 10⁻²","3 × 10⁻⁴","3 × 10⁻¹","3 × 10⁻³"],"a":1,"e":"Among these, 3 × 10⁻⁴ is smallest because its decimal value is least.","v":"scientific-notation"},{"d":"HARD","q":"Write 0.00000045 in scientific notation.","o":["4.5 × 10⁻⁶","4.5 × 10⁻⁷","45 × 10⁻⁸","0.45 × 10⁻⁶"],"a":1,"e":"Move the decimal seven places right to obtain 4.5, so use 10⁻⁷.","v":"scientific-notation"},{"d":"HARD","q":"A file has 3.2 × 10⁶ bytes. How many bytes is that?","o":["320000","3200000","32000000","32000"],"a":1,"e":"3.2 × 1,000,000 = 3,200,000 bytes.","v":"scientific-notation"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Convert numbers to and from scientific notation</strong><small>Use coefficients and powers of ten</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Compare numbers using exponents</strong><small>Multiply and divide powers of ten</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve scientific notation problems</strong><small>Apply scientific notation accurately</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
