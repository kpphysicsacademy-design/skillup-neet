<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261012-simple-expressions-quiz-v2"><title>Simple Expressions | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Simple expressions</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Which expression means 'a number x plus 4'?","o":["x − 4","4x","x + 4","x ÷ 4"],"a":2,"e":"Plus means add, so the expression is x + 4.","v":"simple-expressions"},{"d":"BASIC","q":"Which expression means 'twice a number n'?","o":["n + 2","2n","n − 2","n ÷ 2"],"a":1,"e":"Twice n means 2 multiplied by n.","v":"simple-expressions"},{"d":"BASIC","q":"If x = 5, what is x + 7?","o":["12","35","2","57"],"a":0,"e":"Substitute x = 5: 5 + 7 = 12.","v":"simple-expressions"},{"d":"BASIC","q":"If a = 3, what is 4a?","o":["7","12","43","1"],"a":1,"e":"4a means 4 × a, so 4 × 3 = 12.","v":"simple-expressions"},{"d":"BASIC","q":"Which expression means '5 less than y'?","o":["5 − y","y − 5","5y","y + 5"],"a":1,"e":"Five less than y means y − 5.","v":"simple-expressions"},{"d":"BASIC","q":"If m = 9, find m − 6.","o":["15","54","3","6"],"a":2,"e":"9 − 6 = 3.","v":"simple-expressions"},{"d":"BASIC","q":"Which expression represents 3 more than p?","o":["3p","p − 3","p + 3","3 − p"],"a":2,"e":"Three more than p is p + 3.","v":"simple-expressions"},{"d":"BASIC","q":"If t = 4, what is 2t + 1?","o":["9","8","6","5"],"a":0,"e":"2 × 4 + 1 = 9.","v":"simple-expressions"},{"d":"BASIC","q":"A pen costs ₹p. What do 5 pens cost?","o":["p + 5","5p","p − 5","p ÷ 5"],"a":1,"e":"Five pens at ₹p each cost ₹5p.","v":"simple-expressions"},{"d":"BASIC","q":"Which is a numerical expression?","o":["x + 3","a − 2","8 + 4","3y"],"a":2,"e":"8 + 4 contains numbers and operations, with no variable.","v":"simple-expressions"},{"d":"MEDIUM","q":"If x = 6, evaluate 3x − 4.","o":["14","18","10","22"],"a":0,"e":"3 × 6 − 4 = 14.","v":"simple-expressions"},{"d":"MEDIUM","q":"Simplify: 2a + 5a.","o":["7a","10a","7","3a"],"a":0,"e":"2a + 5a = 7a.","v":"simple-expressions"},{"d":"MEDIUM","q":"Simplify: 8y − 3y.","o":["5","5y","11y","24y"],"a":1,"e":"8y − 3y = 5y.","v":"simple-expressions"},{"d":"MEDIUM","q":"If p = 2 and q = 5, find 3p + q.","o":["11","16","10","13"],"a":0,"e":"3 × 2 + 5 = 11.","v":"simple-expressions"},{"d":"MEDIUM","q":"Which expression means 'four times k, then add 6'?","o":["4(k + 6)","4k + 6","k + 24","6k + 4"],"a":1,"e":"Multiply k by 4 first, then add 6.","v":"simple-expressions"},{"d":"MEDIUM","q":"A rectangle has length l and width w. Which expression gives its perimeter?","o":["lw","l + w","2l + 2w","l − w"],"a":2,"e":"Perimeter = 2l + 2w.","v":"simple-expressions"},{"d":"MEDIUM","q":"If n = 5, evaluate n² + 2.","o":["12","27","25","35"],"a":1,"e":"5² + 2 = 27.","v":"simple-expressions"},{"d":"MEDIUM","q":"Simplify: 4x + 3 + 2x + 1.","o":["6x + 4","6x + 3","8x + 4","6x + 2"],"a":0,"e":"4x + 2x = 6x and 3 + 1 = 4.","v":"simple-expressions"},{"d":"MEDIUM","q":"Which pair are like terms?","o":["2a and 2b","3x and 7x","x and x²","5m and 5"],"a":1,"e":"Both terms contain x to the same power.","v":"simple-expressions"},{"d":"MEDIUM","q":"If y = 7, evaluate 2(y − 3).","o":["8","14","20","10"],"a":0,"e":"2 × (7 − 3) = 8.","v":"simple-expressions"},{"d":"HARD","q":"Simplify: 5a + 3b − 2a + b.","o":["3a + 4b","7a + 2b","3a + 2b","8ab"],"a":0,"e":"5a − 2a = 3a and 3b + b = 4b.","v":"simple-expressions"},{"d":"HARD","q":"If x = 3, evaluate 2x² + 1.","o":["19","7","13","37"],"a":0,"e":"2 × 3² + 1 = 19.","v":"simple-expressions"},{"d":"HARD","q":"A ticket costs ₹x and a snack costs ₹y. What do 3 tickets and 2 snacks cost?","o":["3x + 2y","5xy","3y + 2x","x + y + 5"],"a":0,"e":"Three tickets cost 3x and two snacks cost 2y.","v":"simple-expressions"},{"d":"HARD","q":"Which expression represents half of z, then add 9?","o":["z ÷ (2 + 9)","2z + 9","z/2 + 9","(z + 9)/2"],"a":2,"e":"Take half of z, then add 9.","v":"simple-expressions"},{"d":"HARD","q":"If a = 4 and b = 3, find 2(a + b).","o":["14","11","20","24"],"a":0,"e":"2 × (4 + 3) = 14.","v":"simple-expressions"},{"d":"HARD","q":"Evaluate 3(x + 2) when x = 5.","o":["21","18","17","11"],"a":0,"e":"3 × (5 + 2) = 21.","v":"simple-expressions"},{"d":"HARD","q":"A taxi charges ₹40 plus ₹15 per kilometre k. Which expression gives the fare?","o":["40k + 15","15k + 40","55k","40 + k"],"a":1,"e":"Fixed fare plus distance fare is 15k + 40.","v":"simple-expressions"},{"d":"HARD","q":"Simplify: 7m − 2 + 3m + 6.","o":["10m + 4","10m − 8","4m + 4","10m + 8"],"a":0,"e":"7m + 3m = 10m and −2 + 6 = 4.","v":"simple-expressions"},{"d":"HARD","q":"If p = 2 and q = 4, evaluate p² + 3q.","o":["16","20","14","12"],"a":0,"e":"2² + 3 × 4 = 16.","v":"simple-expressions"},{"d":"HARD","q":"A number n is tripled and then 8 is subtracted. Which expression represents this?","o":["3(n − 8)","n − 24","3n − 8","8 − 3n"],"a":2,"e":"Tripled means 3n; subtracting 8 gives 3n − 8.","v":"simple-expressions"}]let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Write and evaluate simple algebraic expressions</strong><small>Translate words into mathematical expressions</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Substitute values and simplify expressions</strong><small>Combine like terms correctly</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply expressions to everyday situations</strong><small>Apply rectangle area in real life</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
