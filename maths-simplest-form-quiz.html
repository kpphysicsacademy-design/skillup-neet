m of 27/36?",["2/3","3/4","4/9","9/12"],1,"Divide numerator and denominator by 9: 27/36 = 3/4.","MEDIUM"],["Simplify 42/56.",["3/4","4/3","6/7","7/8"],0,"Divide numerator and denominator by 14 to get 3/4.","MEDIUM"],["Which step correctly simplifies 16/28 in one step?",["Divide both by 2 to get 8/14","Subtract 12 from both","Divide only the numerator by 4","Add 4 to both"],0,"Dividing numerator and denominator by the same non-zero factor preserves the fraction's value.","MEDIUM"],["Simplify 50/100.",["1/2","2/5","5/10","1/5"],0,"Divide both numerator and denominator by 50 to get 1/2.","MEDIUM"],["Simplify 84/126.",["2/3","3/2","4/7","6/9"],0,"Divide numerator and denominator by 42 to get 2/3.","HARD"],["Simplify 96/144.",["2/3","3/4","4/5","8/12"],0,"Divide numerator and denominator by 48 to get 2/3.","HARD"],["Simplify 105/140.",["2/3","3/4","4/7","5/8"],1,"Divide numerator and denominator by 35: 105/140 = 3/4.","HARD"],["Simplify 72/120.",["3/5","5/3","6/10","12/20"],0,"Divide numerator and denominator by 24 to get 3/5.","HARD"],["A learner reduces 18/30 to 9/15. Is it now in simplest form?",["Yes, both numbers are odd","No, both are divisible by 3","Yes, numerator is smaller","No, denominator is odd"],1,"9 and 15 are both divisible by 3, so 9/15 reduces further to 3/5.","HARD"],["Simplify 121/143.",["11/13","13/11","1/2","11/12"],0,"Divide numerator and denominator by 11 to get 11/13.","HARD"],["Simplify 132/180.",["11/15","3/5","22/30","12/18"],0,"Divide numerator and denominator by 12 to get 11/15.","HARD"],["Simplify 150/210.",["5/7","7/5","15/21","10/14"],0,"Divide numerator and denominator by 30 to get 5/7.","HARD"],["There are 18 girls and 24 boys. What is the girls-to-boys ratio in simplest form?",["3:4","4:3","6:8","9:12"],0,"Divide both parts of 18:24 by 6 to get 3:4.","HARD"],["Simplify 225/300.",["2/3","3/4","4/5","5/6"],1,"Divide numerator and denominator by 75: 225/300 = 3/4.","HARD"]];
let index=0,score=0,xp=0,hearts=3,chosen=false,ended=false;
const counter=document.getElementById("counter"),level=document.getElementById("level"),bar=document.getElementById("bar"),progress=document.querySelector('[role="progressbar"]'),xpEl=document.getElementById("xp"),heartsEl=document.getElementById("hearts"),eyebrow=document.getElementById("eyebrow"),content=document.getElementById("content"),feedback=document.getElementById("feedback"),next=document.getElementById("next");
function render(){
 chosen=false;feedback.hidden=true;feedback.textContent="";next.disabled=true;next.textContent="Check answer";content.replaceChildren();
 const q=questions[index];counter.textContent="QUESTION "+(index+1)+" OF "+questions.length;level.textContent=q[4]==="BASIC"?"🟢 BASIC":q[4]==="MEDIUM"?"🟡 MEDIUM":"🔴 HARD";eyebrow.textContent="Choose one answer";

 const pct=index/questions.length*100;bar.style.width=pct+"%";document.getElementById("pct").textContent=Math.round(pct)+"%";progress.setAttribute("aria-valuenow",String(Math.round(pct)));
}
function choose(i){if(chosen||ended)return;chosen=true;const q=questions[index],buttons=content.querySelectorAll(".option");buttons.forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add("correct");else if(n===i)b.classList.add("wrong");});if(i===q[2]){score++;xp+=10;eyebrow.textContent="Nice work!";}else{hearts=Math.max(0,hearts-1);eyebrow.textContent="Keep going!";}xpEl.textContent="⭐ "+xp+" XP";heartsEl.textContent="♥ "+hearts;feedback.hidden=false;feedback.textContent=(i===q[2]?"Correct! ":"Not quite. ")+q[3];next.disabled=false;next.textContent=index===questions.length-1?"See results →":"Next question →";}
function finish(){ended=true;bar.style.width="100%";document.getElementById("pct").textContent="100%";progress.setAttribute("aria-valuenow","100");counter.textContent="Challenge complete";level.textContent="RESULTS";eyebrow.textContent="Your results";content.replaceChildren();feedback.hidden=true;const title=document.createElement("h1");title.textContent="Simplest Form complete!";const scoreEl=document.createElement("div");scoreEl.className="score";scoreEl.textContent=score+"/"+questions.length;const msg=document.createElement("p");msg.className="muted";msg.textContent=Math.round(score/questions.length*100)+"% correct · "+xp+" XP earned";const link=document.createElement("a");link.href="maths-home.html?v=20261012-simplest-form-quiz-v1";link.className="back";link.textContent="← Return to Maths Path";content.append(title,scoreEl,msg,link);next.textContent="Try again ↻";next.disabled=false;}
next.addEventListener("click",()=>{if(ended){index=0;score=0;xp=0;hearts=3;ended=false;xpEl.textContent="⭐ 0 XP";heartsEl.textContent="♥ 3";render();return;}if(!chosen)return;if(index<questions.length-1){index++;render();}else finish();});
render();
})();
