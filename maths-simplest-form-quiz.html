(()=>{'use strict';
const originalQuestions=[{"id":"simp01","level":"BASIC","question":"Simplify 6/8 to its simplest form.","options":["2/3","3/4","4/5","6/4"],"answer":1,"explanation":"Divide numerator and denominator by 2: 6/8 = 3/4."},{"id":"simp02","level":"BASIC","question":"Which fraction is already in simplest form?","options":["4/10","6/9","5/8","12/16"],"answer":2,"explanation":"5 and 8 have no common factor greater than 1."},{"id":"simp03","level":"BASIC","question":"Simplify 10/15.","options":["2/3","3/5","5/6","10/5"],"answer":0,"explanation":"Divide both 10 and 15 by 5 to get 2/3."},{"id":"simp04","level":"BASIC","question":"Simplify 12/16.","options":["2/3","3/4","4/5","6/8"],"answer":1,"explanation":"Divide numerator and denominator by 4: 12/16 = 3/4."},{"id":"simp05","level":"BASIC","question":"What is the greatest common factor of 9 and 12?","options":["2","3","4","6"],"answer":1,"explanation":"The greatest factor shared by 9 and 12 is 3."},{"id":"simp06","level":"BASIC","question":"Simplify 8/20.","options":["2/5","4/5","2/10","5/2"],"answer":0,"explanation":"Divide numerator and denominator by 4: 8/20 = 2/5."},{"id":"simp07","level":"BASIC","question":"Which fraction is in simplest form?","options":["6/10","9/15","3/5","12/20"],"answer":2,"explanation":"3 and 5 have no common factor greater than 1."},{"id":"simp08","level":"BASIC","question":"Simplify 14/21.","options":["2/3","3/2","7/21","2/7"],"answer":0,"explanation":"Divide numerator and denominator by 7 to get 2/3."},{"id":"simp09","level":"BASIC","question":"Simplify 15/25.","options":["5/3","3/5","2/5","3/10"],"answer":1,"explanation":"Divide both numerator and denominator by 5: 15/25 = 3/5."},{"id":"simp10","level":"BASIC","question":"When is a fraction in simplest form?","options":["Both numbers are even","They share no factor greater than 1","Numerator is larger","Denominator is 10"],"answer":1,"explanation":"A fraction is simplest when the numerator and denominator have no common factor greater than 1."},{"id":"simp11","level":"MEDIUM","question":"Simplify 18/24.","options":["2/3","3/4","4/6","6/8"],"answer":1,"explanation":"Divide numerator and denominator by 6: 18/24 = 3/4."},{"id":"simp12","level":"MEDIUM","question":"Simplify 24/36.","options":["2/3","3/2","4/9","6/12"],"answer":0,"explanation":"Divide numerator and denominator by 12 to get 2/3."},{"id":"simp13","level":"MEDIUM","question":"Simplify 28/42.","options":["3/2","2/3","4/7","7/14"],"answer":1,"explanation":"Divide both values by 14 to get 2/3."},{"id":"simp14","level":"MEDIUM","question":"Simplify 35/49.","options":["5/7","7/5","5/9","15/21"],"answer":0,"explanation":"Divide numerator and denominator by 7: 35/49 = 5/7."},{"id":"simp15","level":"MEDIUM","question":"Simplify 32/40.","options":["3/4","4/5","5/8","8/10"],"answer":1,"explanation":"Divide both 32 and 40 by 8 to get 4/5."},{"id":"simp16","level":"MEDIUM","question":"Simplify 45/60.","options":["2/3","3/4","4/5","5/6"],"answer":1,"explanation":"Divide numerator and denominator by 15: 45/60 = 3/4."},{"id":"simp17","level":"MEDIUM","question":"What is the simplest form of 27/36?","options":["2/3","3/4","4/9","9/12"],"answer":1,"explanation":"Divide numerator and denominator by 9: 27/36 = 3/4."},{"id":"simp18","level":"MEDIUM","question":"Simplify 42/56.","options":["3/4","4/3","6/7","7/8"],"answer":0,"explanation":"Divide numerator and denominator by 14 to get 3/4."},{"id":"simp19","level":"MEDIUM","question":"Which step correctly simplifies 16/28 in one step?","options":["Divide both by 2 to get 8/14","Subtract 12 from both","Divide only the numerator by 4","Add 4 to both"],"answer":0,"explanation":"Dividing numerator and denominator by the same non-zero factor preserves the fraction's value."},{"id":"simp20","level":"MEDIUM","question":"Simplify 50/100.","options":["1/2","2/5","5/10","1/5"],"answer":0,"explanation":"Divide both numerator and denominator by 50 to get 1/2."},{"id":"simp21","level":"HARD","question":"Simplify 84/126.","options":["2/3","3/2","4/7","6/9"],"answer":0,"explanation":"Divide numerator and denominator by 42 to get 2/3."},{"id":"simp22","level":"HARD","question":"Simplify 96/144.","options":["2/3","3/4","4/5","8/12"],"answer":0,"explanation":"Divide numerator and denominator by 48 to get 2/3."},{"id":"simp23","level":"HARD","question":"Simplify 105/140.","options":["2/3","3/4","4/7","5/8"],"answer":1,"explanation":"Divide numerator and denominator by 35: 105/140 = 3/4."},{"id":"simp24","level":"HARD","question":"Simplify 72/120.","options":["3/5","5/3","6/10","12/20"],"answer":0,"explanation":"Divide numerator and denominator by 24 to get 3/5."},{"id":"simp25","level":"HARD","question":"A learner reduces 18/30 to 9/15. Is it now in simplest form?","options":["Yes, both numbers are odd","No, both are divisible by 3","Yes, numerator is smaller","No, denominator is odd"],"answer":1,"explanation":"9 and 15 are both divisible by 3, so 9/15 reduces further to 3/5."},{"id":"simp26","level":"HARD","question":"Simplify 121/143.","options":["11/13","13/11","1/2","11/12"],"answer":0,"explanation":"Divide numerator and denominator by 11 to get 11/13."},{"id":"simp27","level":"HARD","question":"Simplify 132/180.","options":["11/15","3/5","22/30","12/18"],"answer":0,"explanation":"Divide numerator and denominator by 12 to get 11/15."},{"id":"simp28","level":"HARD","question":"Simplify 150/210.","options":["5/7","7/5","15/21","10/14"],"answer":0,"explanation":"Divide numerator and denominator by 30 to get 5/7."},{"id":"simp29","level":"HARD","question":"There are 18 girls and 24 boys. What is the girls-to-boys ratio in simplest form?","options":["3:4","4:3","6:8","9:12"],"answer":0,"explanation":"Divide both parts of 18:24 by 6 to get 3:4."},{"id":"simp30","level":"HARD","question":"Simplify 225/300.","options":["2/3","3/4","4/5","5/6"],"answer":1,"explanation":"Divide numerator and denominator by 75: 225/300 = 3/4."}];

function restart(wrongOnly){questions=wrongOnly?originalQuestions.filter(q=>mistakes.some(m=>m.id===q.id)):originalQuestions.slice();index=0;selected=-1;locked=false;xp=0;correct=0;streak=0;bestStreak=0;mistakes=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render()}
