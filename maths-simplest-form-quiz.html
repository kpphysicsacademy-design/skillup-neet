<style>
:root{color-scheme:light;--cream:#f7f7ed;--sage:#e9ecde;--sage-line:#d6ddcd;--ink:#29372e;--muted:#687565;--green:#aebfae;--green-dark:#899f89;--blue:#e4f0fb;--red:#b94c45}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;background:var(--cream);color:var(--ink);font-family:Nunito,"Arial Rounded MT Bold",system-ui,sans-serif}
body{overflow-x:hidden}
.wrap{width:min(100% - 28px,560px);margin:0 auto;padding:0 0 28px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:9px;margin:0 calc((100vw - min(100vw - 28px,560px))/ -2) 16px;padding:10px max(14px,calc((100vw - 560px)/2));min-height:68px;background:#fbfbf5;border-bottom:1px solid var(--sage-line)}
.back{display:grid;place-items:center;flex:0 0 42px;width:42px;height:42px;border:2px solid var(--sage-line);border-radius:14px;background:#f2f8ff;color:#526b59;text-decoration:none;font-size:20px}
.brand{flex:1;min-width:0;font-size:19px;font-weight:950;line-height:1.05;white-space:nowrap}
.brand span{display:block;margin-top:4px;color:var(--muted);font-size:10px;letter-spacing:.6px}
.badge{flex:0 0 auto;padding:7px 8px;border:1px solid var(--sage-line);border-radius:18px;background:#eef0e4;color:#61704f;font-size:11px;font-weight:900;white-space:nowrap}
.streak{background:#fff0e7;border-color:#f2d6c7;color:#a95532}
.progress-card{margin:0 0 16px;padding:16px 18px;border:2px solid var(--sage-line);border-radius:22px;background:var(--sage)}
.progress-card h1{margin:0 0 14px;font-size:clamp(23px,4vw,30px);line-height:1.15;font-weight:950}
.progress-line{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px;color:var(--muted);font-size:14px;font-weight:900}
.progress{height:9px;width:100%;overflow:hidden;border-radius:99px;background:#dcecf9}
.bar{height:100%;width:0;border-radius:99px;background:#aebfae;transition:width .2s}
.card{min-width:0;padding:21px;border:2px solid #e4edf5;border-radius:24px;background:#fff}
.eyebrow{color:var(--muted);font-size:13px;font-weight:950;letter-spacing:.3px}
.question{margin:16px 0 20px;font-size:clamp(19px,3.8vw,24px);line-height:1.35;font-weight:950;overflow-wrap:anywhere}
.options{display:grid;gap:11px}
.option{display:flex;align-items:center;gap:13px;width:100%;min-width:0;min-height:62px;padding:10px 12px;border:2px solid var(--sage-line);border-bottom-width:4px;border-radius:16px;background:#fafaf2;color:var(--ink);font:700 17px/1.3 inherit;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.option:before{content:attr(data-letter);display:grid;place-items:center;flex:0 0 36px;width:36px;height:36px;border:2px solid var(--sage-line);border-radius:11px;background:#f5f8ef;color:#718071;font-size:14px;font-weight:950}
.option:disabled{cursor:default}
.option.correct{background:#e9f7e2;border-color:#a9c99a;color:#315b2c}
.option.wrong{background:#fff0ed;border-color:#e7b9ad;color:#8c3f32}
.feedback{margin-top:14px;padding:13px 14px;border:1px solid var(--sage-line);border-radius:15px;background:#f5f7ef;font-size:14px;line-height:1.5}
.feedback.good{background:#eff9e9;border-color:#b7d8a8;color:#315b2c}
.feedback.bad{background:#fff0ed;border-color:#e7b9ad;color:#8c3f32}
.actions{display:flex;width:100%;margin-top:18px}
.primary{width:100%;min-height:52px;padding:11px 14px;border:0;border-bottom:4px solid var(--green-dark);border-radius:16px;background:var(--green);color:#fff;font-size:16px;font-weight:950;cursor:pointer}
.primary:disabled{opacity:.58;cursor:not-allowed}
.score{font-size:2.3rem;font-weight:950;text-align:center}
.result-title{text-align:center;font-size:23px;font-weight:950}
.result-note{text-align:center;color:var(--muted);font-weight:700}
.result-link{display:inline-flex;margin-top:12px;padding:10px 14px;border:1px solid var(--sage-line);border-radius:12px;color:#526b59;text-decoration:none;font-weight:850}
button:focus-visible,a:focus-visible{outline:3px solid #8bc9e8;outline-offset:3px}
@media(max-width:380px){
.wrap{width:calc(100% - 20px)}
.top{gap:5px;padding:9px 10px}
.back{flex-basis:36px;width:36px;height:36px;font-size:17px}
.brand{font-size:16px}.brand span{font-size:8px;letter-spacing:.2px}
.badge{font-size:9px;padding:5px 6px}
.progress-card{padding:14px}.progress-card h1{font-size:23px}
.progress-line{font-size:12px}
.card{padding:14px}.question{font-size:19px}
.option{min-height:54px;padding:8px 10px;font-size:15px;gap:10px}
.option:before{flex-basis:32px;width:32px;height:32px}
.primary{min-height:46px;font-size:14px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>

.fill,.bar{height:100%;background:var(--green);border-radius:8px;transition:width .2s}
.quiz,.finish{width:100%!important;background:#fff!important;border:1px solid var(--line)!important;border-radius:16px!important;padding:17px!important;margin:14px 0!important;box-shadow:none!important}

@media(max-width:520px){header .nav,header.top{width:100%!important;padding:6px 10px!important;gap:6px!important}.pill{font-size:10px!important;padding:5px 6px!important}main{width:100%!important;padding:10px 10px 28px!important}.quiz,.finish{padding:14px!important}.question{font-size:19px!important}}
</style>

<body>
<main class="wrap">
<header class="top">
<a class="back" href="maths-home.html?v=20261012-simplest-form-quiz-v1" aria-label="Back to Maths Path">←</a>
<div class="brand">SkillUp<span>MATHS · PRACTICE</span></div>
<div class="badge" id="xp">⭐ 0 XP</div>
<div class="badge streak">🔥 0 streak</div>
</header>
<section class="progress-card" aria-label="Quiz progress">
<h1>Simplest Form</h1>
<div class="progress-line"><span id="counter">Question 1 of 30</span><span id="pct">0%</span></div>
<div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div>
</section>
<section class="card" id="card">
<div class="eyebrow" id="eyebrow">Choose one answer</div>
<div id="content"></div>
<div class="feedback" id="feedback" hidden></div>
<div class="actions"><button class="primary" id="next" disabled>Check answer</button></div>
</section>
</main>
<script>
(function(){
"use strict";
const questions=[["Simplify 6/8 to its simplest form.",["2/3","3/4","4/5","6/4"],1,"Divide numerator and denominator by 2: 6/8 = 3/4.","BASIC"],["Which fraction is already in simplest form?",["4/10","6/9","5/8","12/16"],2,"5 and 8 have no common factor greater than 1.","BASIC"],["Simplify 10/15.",["2/3","3/5","5/6","10/5"],0,"Divide both 10 and 15 by 5 to get 2/3.","BASIC"],["Simplify 12/16.",["2/3","3/4","4/5","6/8"],1,"Divide numerator and denominator by 4: 12/16 = 3/4.","BASIC"],["What is the greatest common factor of 9 and 12?",["2","3","4","6"],1,"The greatest factor shared by 9 and 12 is 3.","BASIC"],["Simplify 8/20.",["2/5","4/5","2/10","5/2"],0,"Divide numerator and denominator by 4: 8/20 = 2/5.","BASIC"],["Which fraction is in simplest form?",["6/10","9/15","3/5","12/20"],2,"3 and 5 have no common factor greater than 1.","BASIC"],["Simplify 14/21.",["2/3","3/2","7/21","2/7"],0,"Divide numerator and denominator by 7 to get 2/3.","BASIC"],["Simplify 15/25.",["5/3","3/5","2/5","3/10"],1,"Divide both numerator and denominator by 5: 15/25 = 3/5.","BASIC"],["When is a fraction in simplest form?",["Both numbers are even","They share no factor greater than 1","Numerator is larger","Denominator is 10"],1,"A fraction is simplest when the numerator and denominator have no common factor greater than 1.","BASIC"],["Simplify 18/24.",["2/3","3/4","4/6","6/8"],1,"Divide numerator and denominator by 6: 18/24 = 3/4.","MEDIUM"],["Simplify 24/36.",["2/3","3/2","4/9","6/12"],0,"Divide numerator and denominator by 12 to get 2/3.","MEDIUM"],["Simplify 28/42.",["3/2","2/3","4/7","7/14"],1,"Divide both values by 14 to get 2/3.","MEDIUM"],["Simplify 35/49.",["5/7","7/5","5/9","15/21"],0,"Divide numerator and denominator by 7: 35/49 = 5/7.","MEDIUM"],["Simplify 32/40.",["3/4","4/5","5/8","8/10"],1,"Divide both 32 and 40 by 8 to get 4/5.","MEDIUM"],["Simplify 45/60.",["2/3","3/4","4/5","5/6"],1,"Divide numerator and denominator by 15: 45/60 = 3/4.","MEDIUM"],["What is the simplest form of 27/36?",["2/3","3/4","4/9","9/12"],1,"Divide numerator and denominator by 9: 27/36 = 3/4.","MEDIUM"],["Simplify 42/56.",["3/4","4/3","6/7","7/8"],0,"Divide numerator and denominator by 14 to get 3/4.","MEDIUM"],["Which step correctly simplifies 16/28 in one step?",["Divide both by 2 to get 8/14","Subtract 12 from both","Divide only the numerator by 4","Add 4 to both"],0,"Dividing numerator and denominator by the same non-zero factor preserves the fraction's value.","MEDIUM"],["Simplify 50/100.",["1/2","2/5","5/10","1/5"],0,"Divide both numerator and denominator by 50 to get 1/2.","MEDIUM"],["Simplify 84/126.",["2/3","3/2","4/7","6/9"],0,"Divide numerator and denominator by 42 to get 2/3.","HARD"],["Simplify 96/144.",["2/3","3/4","4/5","8/12"],0,"Divide numerator and denominator by 48 to get 2/3.","HARD"],["Simplify 105/140.",["2/3","3/4","4/7","5/8"],1,"Divide numerator and denominator by 35: 105/140 = 3/4.","HARD"],["Simplify 72/120.",["3/5","5/3","6/10","12/20"],0,"Divide numerator and denominator by 24 to get 3/5.","HARD"],["A learner reduces 18/30 to 9/15. Is it now in simplest form?",["Yes, both numbers are odd","No, both are divisible by 3","Yes, numerator is smaller","No, denominator is odd"],1,"9 and 15 are both divisible by 3, so 9/15 reduces further to 3/5.","HARD"],["Simplify 121/143.",["11/13","13/11","1/2","11/12"],0,"Divide numerator and denominator by 11 to get 11/13.","HARD"],["Simplify 132/180.",["11/15","3/5","22/30","12/18"],0,"Divide numerator and denominator by 12 to get 11/15.","HARD"],["Simplify 150/210.",["5/7","7/5","15/21","10/14"],0,"Divide numerator and denominator by 30 to get 5/7.","HARD"],["There are 18 girls and 24 boys. What is the girls-to-boys ratio in simplest form?",["3:4","4:3","6:8","9:12"],0,"Divide both parts of 18:24 by 6 to get 3:4.","HARD"],["Simplify 225/300.",["2/3","3/4","4/5","5/6"],1,"Divide numerator and denominator by 75: 225/300 = 3/4.","HARD"]];
let index=0,score=0,xp=0,chosen=false,ended=false;
const counter=document.getElementById("counter"),bar=document.getElementById("bar"),progress=document.querySelector('[role="progressbar"]'),xpEl=document.getElementById("xp"),eyebrow=document.getElementById("eyebrow"),content=document.getElementById("content"),feedback=document.getElementById("feedback"),next=document.getElementById("next"),pctEl=document.getElementById("pct");
function updateProgress(value){bar.style.width=value+"%";pctEl.textContent=Math.round(value)+"%";progress.setAttribute("aria-valuenow",String(Math.round(value)));}
function render(){
chosen=false;feedback.hidden=true;feedback.className="feedback";feedback.textContent="";next.disabled=true;next.textContent="Check answer";content.replaceChildren();
const q=questions[index];counter.textContent="Question "+(index+1)+" of "+questions.length;eyebrow.textContent="Choose one answer";
const stem=document.createElement("h2");stem.className="question";stem.textContent=q[0];content.appendChild(stem);
const options=document.createElement("div");options.className="options";
q[1].forEach((label,i)=>{const b=document.createElement("button");b.type="button";b.className="option";b.dataset.letter=String.fromCharCode(65+i);b.textContent=label;b.addEventListener("click",()=>choose(i));options.appendChild(b);});
content.appendChild(options);updateProgress(index/questions.length*100);
}
function choose(i){
if(chosen||ended)return;chosen=true;const q=questions[index],buttons=content.querySelectorAll(".option");
buttons.forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add("correct");else if(n===i)b.classList.add("wrong");});
const correct=i===q[2];if(correct){score++;xp+=10;eyebrow.textContent="Nice work!";}else{eyebrow.textContent="Keep going!";}
xpEl.textContent="⭐ "+xp+" XP";feedback.hidden=false;feedback.className="feedback "+(correct?"good":"bad");feedback.textContent=(correct?"Correct! ":"Not quite. ")+q[3];
next.disabled=false;next.textContent=index===questions.length-1?"See results →":"Next question →";
}
function finish(){
ended=true;updateProgress(100);counter.textContent="Challenge complete";eyebrow.textContent="Your results";feedback.hidden=true;content.replaceChildren();
const title=document.createElement("h2");title.className="result-title";title.textContent="Simplest Form complete!";
const scoreEl=document.createElement("div");scoreEl.className="score";scoreEl.textContent=score+"/"+questions.length;
const msg=document.createElement("p");msg.className="result-note";msg.textContent=Math.round(score/questions.length*100)+"% correct · "+xp+" XP earned";
const link=document.createElement("a");link.href="maths-home.html?v=20261012-simplest-form-quiz-v1";link.className="result-link";link.textContent="← Return to Maths Path";
content.append(title,scoreEl,msg,link);next.textContent="Try again ↻";next.disabled=false;
}
next.addEventListener("click",()=>{if(ended){index=0;score=0;xp=0;ended=false;xpEl.textContent="⭐ 0 XP";render();return;}if(!chosen)return;if(index<questions.length-1){index++;render();}else finish();});
render();
})();
</script>
