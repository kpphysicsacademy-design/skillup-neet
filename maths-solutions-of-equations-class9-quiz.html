<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"Which ordered pair is a solution of x+y=5?","o":["(1,1)","(2,3)","(4,2)","(0,4)"],"a":1,"why":"Substitute x=2 and y=3: 2+3=5."},{"d":"BASIC","q":"Which equation is satisfied by (x,y)=(1,4)?","o":["x+y=5","x−y=5","2x+y=3","x+y=4"],"a":0,"why":"For (1,4), x+y=1+4=5."},{"d":"BASIC","q":"Is (2,1) a solution of 2x+y=5?","o":["Yes, because 2(2)+1=5","No, because 2+1=3","Yes, because 2+1=5","No, because 2(1)+2=4"],"a":0,"why":"Substitution gives 2×2+1=5, so it is a solution."},{"d":"BASIC","q":"Which pair satisfies x−y=2?","o":["(2,2)","(3,1)","(1,3)","(0,2)"],"a":1,"why":"For (3,1), x−y=3−1=2."},{"d":"BASIC","q":"If x=0 in x+y=7, what is y?","o":["0","−7","7","1"],"a":2,"why":"Substitute x=0: 0+y=7, so y=7."},{"d":"BASIC","q":"If y=0 in 3x+y=12, what is x?","o":["3","4","12","0"],"a":1,"why":"3x=12, hence x=4."},{"d":"BASIC","q":"Which is a solution of x=2?","o":["(1,2)","(2,−3)","(0,2)","(−2,2)"],"a":1,"why":"A solution pair must have first coordinate x=2; (2,−3) does."},{"d":"BASIC","q":"How many ordered pairs are solutions of y=3x in the real number plane?","o":["Exactly one","Exactly two","None","Infinitely many"],"a":3,"why":"Every real x gives a corresponding y=3x, so there are infinitely many solutions."},{"d":"BASIC","q":"Which pair satisfies x+y=0?","o":["(2,−2)","(2,2)","(0,2)","(−1,2)"],"a":0,"why":"For (2,−2), the sum is zero."},{"d":"BASIC","q":"Which statement is true about a solution of a two-variable equation?","o":["It must have x=y","It must make the equation true when substituted","It must contain zero","It must have positive coordinates"],"a":1,"why":"A solution is an ordered pair that makes the equation true."},{"d":"MEDIUM","q":"Which ordered pair is a solution of 2x+3y=12?","o":["(3,2)","(2,3)","(1,2)","(0,3)"],"a":0,"why":"For (3,2), 2(3)+3(2)=6+6=12."},{"d":"MEDIUM","q":"Find y if (4,y) satisfies x+2y=10.","o":["2","3","4","5"],"a":1,"why":"4+2y=10 gives 2y=6, so y=3."},{"d":"MEDIUM","q":"Which pair satisfies 3x−y=7?","o":["(2,−1)","(2,1)","(1,−4)","(0,7)"],"a":0,"why":"For (2,−1), 3(2)−(−1)=6+1=7."},{"d":"MEDIUM","q":"If (a,2) is a solution of 2x+y=11, what is a?","o":["3","4","4.5","5"],"a":2,"why":"2a+2=11 gives 2a=9, so a=4.5."},{"d":"MEDIUM","q":"Which pair is NOT a solution of x+y=6?","o":["(1,5)","(2,4)","(3,3)","(4,3)"],"a":3,"why":"For (4,3), the sum is 7, not 6."},{"d":"MEDIUM","q":"If x=−2 satisfies x−y=1, what is y?","o":["−3","3","−1","1"],"a":0,"why":"−2−y=1 gives −y=3, so y=−3."},{"d":"MEDIUM","q":"How many solutions does x+y=4 have among these pairs?","o":["(0,4), (1,3), (2,2) all work","Only (0,4) works","Only (2,2) works","None work"],"a":0,"why":"Each listed pair has coordinates whose sum is 4."},{"d":"MEDIUM","q":"For y=2x+1, what is y when x=−3?","o":["−5","−7","5","7"],"a":0,"why":"y=2(−3)+1=−6+1=−5."},{"d":"MEDIUM","q":"Which equation is satisfied by (−1,2)?","o":["2x+y=0","x−y=3","x+y=3","3x+y=0"],"a":0,"why":"2(−1)+2=0."},{"d":"MEDIUM","q":"If (x,−1) satisfies 4x+y=11, find x.","o":["2","3","4","5"],"a":1,"why":"4x−1=11, so 4x=12 and x=3."},{"d":"HARD","q":"For x+2y=8, which ordered pair is a solution with x=2?","o":["(2,2)","(2,3)","(2,4)","(2,5)"],"a":1,"why":"2+2y=8 gives y=3, so (2,3)."},{"d":"HARD","q":"If (k, k) satisfies 3x+y=16, what is k?","o":["2","3","4","5"],"a":2,"why":"Substitute x=y=k: 3k+k=16, so k=4."},{"d":"HARD","q":"Which pair satisfies both x+y=7 and x−y=1?","o":["(3,4)","(4,3)","(5,2)","(2,5)"],"a":1,"why":"Adding the equations gives 2x=8, x=4, and then y=3."},{"d":"HARD","q":"A taxi fare model is f=50+10d, where d is distance and f is fare. Which pair (d,f) satisfies it?","o":["(2,70)","(3,70)","(4,80)","(5,90)"],"a":0,"why":"For d=2, f=50+10(2)=70, so (2,70) satisfies the model."},{"d":"HARD","q":"For 2x−3y=12, if x=0, what is y?","o":["−4","4","−3","3"],"a":0,"why":"−3y=12, so y=−4."},{"d":"HARD","q":"Which point lies on y=−x?","o":["(2,−2)","(2,2)","(−2,−2)","(0,1)"],"a":0,"why":"For (2,−2), y=−2=−x."},{"d":"HARD","q":"If (3,m) satisfies 5x−2y=7, what is m?","o":["2","4","5","7"],"a":1,"why":"15−2m=7 gives −2m=−8, so m=4."},{"d":"HARD","q":"For x+y=9, x and y are positive integers. Which pair is NOT a solution?","o":["(1,8)","(4,5)","(7,2)","(9,1)"],"a":3,"why":"The pair (9,1) sums to 10, not 9."},{"d":"HARD","q":"Which ordered pair satisfies 2x+y=−1 and x=−2?","o":["(−2,3)","(−2,−3)","(2,−3)","(−1,−2)"],"a":0,"why":"2(−2)+y=−1 gives −4+y=−1, so y=3 and the pair is (−2,3)."},{"d":"HARD","q":"If y=3x−4, what is y when x=5?","o":["7","11","15","19"],"a":1,"why":"y=3(5)−4=15−4=11."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Solutions of Equations Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
