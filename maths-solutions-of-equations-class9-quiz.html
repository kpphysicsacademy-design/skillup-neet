<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Which ordered pair is a solution of x+y=5?","o":["(1,1)","(2,3)","(4,2)","(0,4)"],"a":1,"e":"Substitute x=2 and y=3: 2+3=5."},{"d":"BASIC","q":"Which equation is satisfied by (x,y)=(1,4)?","o":["x+y=5","x−y=5","2x+y=3","x+y=4"],"a":0,"e":"For (1,4), x+y=1+4=5."},{"d":"BASIC","q":"Is (2,1) a solution of 2x+y=5?","o":["Yes, because 2(2)+1=5","No, because 2+1=3","Yes, because 2+1=5","No, because 2(1)+2=4"],"a":0,"e":"Substitution gives 2×2+1=5, so it is a solution."},{"d":"BASIC","q":"Which pair satisfies x−y=2?","o":["(2,2)","(3,1)","(1,3)","(0,2)"],"a":1,"e":"For (3,1), x−y=3−1=2."},{"d":"BASIC","q":"If x=0 in x+y=7, what is y?","o":["0","−7","7","1"],"a":2,"e":"Substitute x=0: 0+y=7, so y=7."},{"d":"BASIC","q":"If y=0 in 3x+y=12, what is x?","o":["3","4","12","0"],"a":1,"e":"3x=12, hence x=4."},{"d":"BASIC","q":"Which is a solution of x=2?","o":["(1,2)","(2,−3)","(0,2)","(−2,2)"],"a":1,"e":"A solution pair must have first coordinate x=2; (2,−3) does."},{"d":"BASIC","q":"How many ordered pairs are solutions of y=3x in the real number plane?","o":["Exactly one","Exactly two","None","Infinitely many"],"a":3,"e":"Every real x gives a corresponding y=3x, so there are infinitely many solutions."},{"d":"BASIC","q":"Which pair satisfies x+y=0?","o":["(2,−2)","(2,2)","(0,2)","(−1,2)"],"a":0,"e":"For (2,−2), the sum is zero."},{"d":"BASIC","q":"Which statement is true about a solution of a two-variable equation?","o":["It must have x=y","It must make the equation true when substituted","It must contain zero","It must have positive coordinates"],"a":1,"e":"A solution is an ordered pair that makes the equation true."},{"d":"MEDIUM","q":"Which ordered pair is a solution of 2x+3y=12?","o":["(3,2)","(2,3)","(1,2)","(0,3)"],"a":0,"e":"For (3,2), 2(3)+3(2)=6+6=12."},{"d":"MEDIUM","q":"Find y if (4,y) satisfies x+2y=10.","o":["2","3","4","5"],"a":1,"e":"4+2y=10 gives 2y=6, so y=3."},{"d":"MEDIUM","q":"Which pair satisfies 3x−y=7?","o":["(2,−1)","(2,1)","(1,−4)","(0,7)"],"a":0,"e":"For (2,−1), 3(2)−(−1)=6+1=7."},{"d":"MEDIUM","q":"If (a,2) is a solution of 2x+y=11, what is a?","o":["3","4","4.5","5"],"a":2,"e":"2a+2=11 gives 2a=9, so a=4.5."},{"d":"MEDIUM","q":"Which pair is NOT a solution of x+y=6?","o":["(1,5)","(2,4)","(3,3)","(4,3)"],"a":3,"e":"For (4,3), the sum is 7, not 6."},{"d":"MEDIUM","q":"If x=−2 satisfies x−y=1, what is y?","o":["−3","3","−1","1"],"a":0,"e":"−2−y=1 gives −y=3, so y=−3."},{"d":"MEDIUM","q":"How many solutions does x+y=4 have among these pairs?","o":["(0,4), (1,3), (2,2) all work","Only (0,4) works","Only (2,2) works","None work"],"a":0,"e":"Each listed pair has coordinates whose sum is 4."},{"d":"MEDIUM","q":"For y=2x+1, what is y when x=−3?","o":["−5","−7","5","7"],"a":0,"e":"y=2(−3)+1=−6+1=−5."},{"d":"MEDIUM","q":"Which equation is satisfied by (−1,2)?","o":["2x+y=0","x−y=3","x+y=3","3x+y=0"],"a":0,"e":"2(−1)+2=0."},{"d":"MEDIUM","q":"If (x,−1) satisfies 4x+y=11, find x.","o":["2","3","4","5"],"a":1,"e":"4x−1=11, so 4x=12 and x=3."},{"d":"HARD","q":"For x+2y=8, which ordered pair is a solution with x=2?","o":["(2,2)","(2,3)","(2,4)","(2,5)"],"a":1,"e":"2+2y=8 gives y=3, so (2,3)."},{"d":"HARD","q":"If (k, k) satisfies 3x+y=16, what is k?","o":["2","3","4","5"],"a":2,"e":"Substitute x=y=k: 3k+k=16, so k=4."},{"d":"HARD","q":"Which pair satisfies both x+y=7 and x−y=1?","o":["(3,4)","(4,3)","(5,2)","(2,5)"],"a":1,"e":"Adding the equations gives 2x=8, x=4, and then y=3."},{"d":"HARD","q":"A taxi fare model is f=50+10d, where d is distance and f is fare. Which pair (d,f) satisfies it?","o":["(2,70)","(3,70)","(4,80)","(5,90)"],"a":0,"e":"For d=2, f=50+10(2)=70, so (2,70) satisfies the model."},{"d":"HARD","q":"For 2x−3y=12, if x=0, what is y?","o":["−4","4","−3","3"],"a":0,"e":"−3y=12, so y=−4."},{"d":"HARD","q":"Which point lies on y=−x?","o":["(2,−2)","(2,2)","(−2,−2)","(0,1)"],"a":0,"e":"For (2,−2), y=−2=−x."},{"d":"HARD","q":"If (3,m) satisfies 5x−2y=7, what is m?","o":["2","4","5","7"],"a":1,"e":"15−2m=7 gives −2m=−8, so m=4."},{"d":"HARD","q":"For x+y=9, x and y are positive integers. Which pair is NOT a solution?","o":["(1,8)","(4,5)","(7,2)","(9,1)"],"a":3,"e":"The pair (9,1) sums to 10, not 9."},{"d":"HARD","q":"Which ordered pair satisfies 2x+y=−1 and x=−2?","o":["(−2,3)","(−2,−3)","(2,−3)","(−1,−2)"],"a":0,"e":"2(−2)+y=−1 gives −4+y=−1, so y=3 and the pair is (−2,3)."},{"d":"HARD","q":"If y=3x−4, what is y when x=5?","o":["7","11","15","19"],"a":1,"e":"y=3(5)−4=15−4=11."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Master equation solutions</strong><small>Test ordered pairs by substitution</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Solve for missing coordinates</strong><small>Check linear equations</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Use equations in context</strong><small>Solve multi-step equation problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
