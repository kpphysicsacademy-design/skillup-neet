],"a":3,"e":"Multiply by 6: 2x − 4 + 3x + 3 = 30, so 5x − 1 = 30 and x = 31/5.","v":"solving-equations"},{"d":"HARD","q":"Solve 0.5x + 3 = 9.","o":["x = 6","x = 3","x = 18","x = 12"],"a":3,"e":"Subtract 3 and divide by 0.5.","v":"solving-equations"},{"d":"HARD","q":"A number increased by 9 is 23. What is the number?","o":["32","12","−14","14"],"a":3,"e":"Represent the number by x and solve x + 9 = 23.","v":"solving-equations"},{"d":"HARD","q":"Three times a number minus 8 equals 19. Find the number.","o":["11","3","27","9"],"a":3,"e":"Write 3x − 8 = 19 and solve.","v":"solving-equations"},{"d":"HARD","q":"The perimeter of a square is 36 cm. What is the length of each side?","o":["9 cm","8 cm","12 cm","6 cm"],"a":0,"e":"A square has four equal sides. Divide the perimeter by 4: 36 ÷ 4 = 9 cm.","v":"solving-equations"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Solve one-variable equations</strong><small>Apply inverse operations and simplify expressions</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Isolate variables on both sides</strong><small>Use brackets and fractional coefficients</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Check solutions by substitution</strong><small>Translate word problems into equations</small></div></div></div></div>';
