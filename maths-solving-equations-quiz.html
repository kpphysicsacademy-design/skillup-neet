<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261013-solving-equations-duolingo-v1"><title>Solving Equations | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Nets of solids</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Solve x + 5 = 12.","o":["x = 7","x = 17","x = 5","x = −7"],"a":0,"e":"Subtract 5 from both sides to isolate x.","v":"solving-equations"},{"d":"BASIC","q":"Solve x − 4 = 9.","o":["x = 13","x = 5","x = −13","x = 36"],"a":0,"e":"Add 4 to both sides.","v":"solving-equations"},{"d":"BASIC","q":"Solve 3x = 21.","o":["x = 7","x = 18","x = 24","x = 3"],"a":0,"e":"Divide both sides by 3.","v":"solving-equations"},{"d":"BASIC","q":"Solve x/5 = 6.","o":["x = 30","x = 11","x = 1","x = 6/5"],"a":0,"e":"Multiply both sides by 5.","v":"solving-equations"},{"d":"BASIC","q":"Solve x + 8 = 8.","o":["x = 0","x = 8","x = −8","x = 16"],"a":0,"e":"Subtract 8 from both sides.","v":"solving-equations"},{"d":"BASIC","q":"Solve 2x + 1 = 11.","o":["x = 5","x = 6","x = 4","x = 10"],"a":0,"e":"Subtract 1, then divide by 2.","v":"solving-equations"},{"d":"BASIC","q":"Solve 4x − 3 = 13.","o":["x = 4","x = 2.5","x = 10","x = −4"],"a":0,"e":"Add 3 to both sides and divide by 4.","v":"solving-equations"},{"d":"BASIC","q":"Solve x/3 + 2 = 7.","o":["x = 15","x = 5","x = 21","x = 9"],"a":0,"e":"Subtract 2 first, then multiply by 3.","v":"solving-equations"},{"d":"BASIC","q":"Solve 5x = −20.","o":["x = 4","x = −4","x = −15","x = −25"],"a":1,"e":"Divide both sides by positive 5.","v":"solving-equations"},{"d":"BASIC","q":"Solve x − 6 = −2.","o":["x = −8","x = 4","x = −4","x = 8"],"a":1,"e":"Add 6 to both sides.","v":"solving-equations"},{"d":"MEDIUM","q":"Solve 3x + 7 = 25.","o":["x = 8","x = 6","x = 4","x = 11"],"a":1,"e":"Subtract 7, then divide by 3.","v":"solving-equations"},{"d":"MEDIUM","q":"Solve 5x − 9 = 2x + 6.","o":["x = −5","x = 5","x = 3","x = 15"],"a":1,"e":"Subtract 2x from both sides, then solve the resulting equation.","v":"solving-equations"},{"d":"MEDIUM","q":"Solve 4(x − 2) = 20.","o":["x = 3","x = 7","x = 5","x = 9"],"a":1,"e":"Divide by 4, then add 2.","v":"solving-equations"},{"d":"MEDIUM","q":"Solve 2x + 3 = 3x − 4.","o":["x = −7","x = 7","x = 1","x = −1"],"a":1,"e":"Subtract 2x and add 4 to isolate the variable.","v":"solving-equations"},{"d":"MEDIUM","q":"Solve (x + 5)/2 = 8.","o":["x = 21","x = 11","x = 13","x = 16"],"a":1,"e":"Multiply by 2, then subtract 5.","v":"solving-equations"},{"d":"MEDIUM","q":"Solve 7 − 2x = 15.","o":["x = 4","x = −4","x = −11","x = 11"],"a":1,"e":"Subtract 7, then divide by −2.","v":"solving-equations"},{"d":"MEDIUM","q":"Solve 3(x + 2) = 2x + 11.","o":["x = 17","x = 1","x = 5","x = 7"],"a":2,"e":"Expand the left side, then collect variable terms.","v":"solving-equations"},{"d":"MEDIUM","q":"Solve 6x + 4 = 2(2x + 7).","o":["x = 3","x = 9","x = 5","x = −5"],"a":2,"e":"Expand the right side and solve the linear equation.","v":"solving-equations"},{"d":"MEDIUM","q":"Solve x/4 − 3 = 2.","o":["x = 8","x = 5","x = 20","x = −20"],"a":2,"e":"Add 3, then multiply both sides by 4.","v":"solving-equations"},{"d":"MEDIUM","q":"Solve 9 − (x − 1) = 4.","o":["x = 4","x = 14","x = 6","x = −6"],"a":2,"e":"Remove the parentheses carefully: 9 − x + 1 = 4.","v":"solving-equations"},{"d":"HARD","q":"Solve 2(3x − 4) = 4x + 10.","o":["x = 1","x = 7","x = 9","x = −9"],"a":2,"e":"Expand, subtract 4x, then solve for x.","v":"solving-equations"},{"d":"HARD","q":"Solve (2x − 3)/5 = 3.","o":["x = 6","x = 12","x = 9","x = 7.5"],"a":2,"e":"Multiply by 5, then add 3 and divide by 2.","v":"solving-equations"},{"d":"HARD","q":"Solve 3x/2 + 4 = 10.","o":["x = 9","x = 6","x = 4","x = 8"],"a":2,"e":"Subtract 4 and multiply by 2/3.","v":"solving-equations"},{"d":"HARD","q":"Solve 5(x − 1) − 2x = 16.","o":["x = 3","x = 11","x = −7","x = 7"],"a":3,"e":"Expand and combine like terms before isolating x.","v":"solving-equations"},{"d":"HARD","q":"Solve 4 − 3(x + 2) = −11.","o":["x = −2","x = 5","x = 4","x = 3"],"a":3,"e":"Expand 4 − 3(x + 2) to get −3x − 2 = −11, then solve for x.","v":"solving-equations"},{"d":"HARD","q":"Solve (x − 2)/3 + (x + 1)/2 = 5.","o":["x = 5","x = 8","x = 9","x = 31/5"],"a":3,"e":"Multiply by 6: 2x − 4 + 3x + 3 = 30, so 5x − 1 = 30 and x = 31/5.","v":"solving-equations"},{"d":"HARD","q":"Solve 0.5x + 3 = 9.","o":["x = 6","x = 3","x = 18","x = 12"],"a":3,"e":"Subtract 3 and divide by 0.5.","v":"solving-equations"},{"d":"HARD","q":"A number increased by 9 is 23. What is the number?","o":["32","12","−14","14"],"a":3,"e":"Represent the number by x and solve x + 9 = 23.","v":"solving-equations"},{"d":"HARD","q":"Three times a number minus 8 equals 19. Find the number.","o":["11","3","27","9"],"a":3,"e":"Write 3x − 8 = 19 and solve.","v":"solving-equations"},{"d":"HARD","q":"The perimeter of a square is 36 cm. If each side is x cm, which equation gives x?","o":["x + 4 = 36","2x = 36","x/4 = 36","4x = 36"],"a":3,"e":"A square has four equal sides, so its perimeter is four times one side.","v":"solving-equations"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Solve one-variable equations</strong><small>Apply inverse operations and simplify expressions</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Isolate variables on both sides</strong><small>Use brackets and fractional coefficients</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Check solutions by substitution</strong><small>Translate word problems into equations</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script></body></html>
