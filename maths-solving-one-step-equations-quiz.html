 .skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}.skills-result{margin-top:14px;text-align:left}.skills-result h3{margin:0 0 8px;font-size:1rem}.skills-result .skill-item{margin-top:7px}.skill-item.unlocked{border-color:var(--green);color:var(--green2);background:#174b42} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}.diagram .accent{stroke:#58d6a3}.diagram .blue{stroke:#91b7ff}.diagram .gold{stroke:#ffd27a} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><mai <script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Solve: x + 4 = 11","o":["7","5","15","4"],"a":0,"e":"Subtract 4 from both sides: x = 11 − 4 = 7.","v":"solving-one-step-equations"},{"d":"BASIC","q":"Solve: y − 6 = 9","o":["54","15","−3","3"],"a":1,"e":"Add 6 to both sides: y = 9 + 6 = 15.","v":"solving-one-step-equations"},{"d":"BASIC","q":"Solve: 3a = 21","o":["63","18","7","24"],"a":2,"e":"Divide both sides by 3: a = 21 ÷ 3 = 7.","v":"solving-one-step-equations"},{"d":"BASIC","q":"Solve: m ÷ 5 = 4","o":["9","1","25","20"],"a":3,"e":"Multiply both sides by 5: m = 4 × 5 = 20.","v":"solving-one-step-equations"},{"d":"BASIC","q":"Solve: p + 8 = 20","o":["12","2","160","28"],"a":0,"e":"Subtract 8 from both sides: p = 20 − 8 = 12.","v":"solving-one-step-equations"},{"d":"BASIC","q":"Solve: t − 7 = 5","o":["7","12","−2","35"],"a":1,"e":"Add 7 to both sides: t = 5 + 7 = 12.","v":"solving-one-step-equations"},{"d":"BASIC","q":"Solve: 6n = 42","o":["36","8","7","252"],"a":2,"e":"Divide both sides by 6: n = 42 ÷ 6 = 7.","v":"solving-one-step-equations"},{"d":"BASIC","q":"Solve: k ÷ 3 = 6","o":["9","3","2","18"],"a":3,"e":"Multiply both sides by 3: k = 6 × 3 = 18.","v":"solving-one-step-equations"},{"d":"BASIC","q":"Solve: b + 13 = 19","o":["6","−6","32","7"],"a":0,"e":"Subtract 13 from both sides: b = 19 − 13 = 6.","v":"solving-one-step-equations"},{"d":"BASIC","q":"Solve: r − 12 = 4","o":["8","16","48","−8"],"a":1,"e":"Add 12 to both sides: r = 4 + 12 = 16.","v":"solving-one-step-equations"},{"d":"MEDIUM","q":"Solve: 4x + 3 = 23","o":["6","8","5","4"],"a":2,"e":"Subtract 3 to get 4x = 20; divide by 4, so x = 5.","v":"solving-one-step-equations"},{"d":"MEDIUM","q":"Solve: 5y − 7 = 28","o":["35","5","9","7"],"a":3,"e":"Add 7 to get 5y = 35; divide by 5, so y = 7.","v":"solving-one-step-equations"},{"d":"MEDIUM","q":"Solve: (a ÷ 4) + 2 = 8","o":["24","6","40","10"],"a":0,"e":"Subtract 2 to get a ÷ 4 = 6; multiply by 4, so a = 24.","v":"solving-one-step-equations"},{"d":"MEDIUM","q":"Solve: 3m − 8 = 16","o":["6","8","72","24"],"a":1,"e":"Add 8 to get 3m = 24; divide by 3, so m = 8.","v":"solving-one-step-equations"},{"d":"MEDIUM","q":"Solve: (n + 5) ÷ 3 = 7","o":["2","21","16","26"],"a":2,"e":"Multiply by 3 to get n + 5 = 21; subtract 5, so n = 16.","v":"solving-one-step-equations"},{"d":"MEDIUM","q":"Solve: 2p + 9 = 31","o":["20","13","40","11"],"a":3,"e":"Subtract 9 to get 2p = 22; divide by 2, so p = 11.","v":"solving-one-step-equations"},{"d":"MEDIUM","q":"Solve: 7q + 1 = 50","o":["7","8","9","49"],"a":0,"e":"Subtract 1 to get 7q = 49; divide by 7, so q = 7.","v":"solving-one-step-equations"},{"d":"MEDIUM","q":"Solve: (r − 4) ÷ 2 = 9","o":["5","22","14","18"],"a":1,"e":"Multiply by 2 to get r − 4 = 18; add 4, so r = 22.","v":"solving-one-step-equations"},{"d":"MEDIUM","q":"Solve: 9s − 15 = 30","o":["3","45","5","15"],"a":2,"e":"Add 15 to get 9s = 45; divide by 9, so s = 5.","v":"solving-one-step-equations"},{"d":"MEDIUM","q":"Solve: 6t + 4 = 40","o":["8","44","7","6"],"a":3,"e":"Subtract 4 to get 6t = 36; divide by 6, so t = 6.","v":"solving-one-step-equations"},{"d":"HARD","q":"Solve: 5x + 12 = 47","o":["7","12","5","11"],"a":0,"e":"Subtract 12 to get 5x = 35; divide by 5, so x = 7.","v":"solving-one-step-equations"},{"d":"HARD","q":"Solve: (3y − 6) ÷ 3 = 8","o":["6","10","18","26"],"a":1,"e":"Multiply by 3 to get 3y − 6 = 24; add 6 and divide by 3, giving y = 10.","v":"solving-one-step-equations"},{"d":"HARD","q":"Solve: 8a − 17 = 39","o":["8","9","7","5"],"a":2,"e":"Add 17 to get 8a = 56; divide by 8, so a = 7.","v":"solving-one-step-equations"},{"d":"HARD","q":"Solve: (m + 9) ÷ 4 = 6","o":["3","24","33","15"],"a":3,"e":"Multiply by 4 to get m + 9 = 24; subtract 9, so m = 15.","v":"solving-one-step-equations"},{"d":"HARD","q":"Solve: 7p + 5 = 68","o":["9","7","11","63"],"a":0,"e":"Subtract 5 to get 7p = 63; divide by 7, so p = 9.","v":"solving-one-step-equations"},{"d":"HARD","q":"Solve: (2q + 4) ÷ 2 = 13","o":["13","11","22","9"],"a":1,"e":"Multiply by 2 to get 2q + 4 = 26; subtract 4 and divide by 2, giving q = 11.","v":"solving-one-step-equations"},{"d":"HARD","q":"Solve: 9r − 8 = 73","o":["10","7","9","8"],"a":2,"e":"Add 8 to get 9r = 81; divide by 9, so r = 9.","v":"solving-one-step-equations"},{"d":"HARD","q":"Solve: (s − 7) ÷ 5 = 6","o":["23","30","35","37"],"a":3,"e":"Multiply by 5 to get s − 7 = 30; add 7, so s = 37.","v":"solving-one-step-equations"},{"d":"HARD","q":"Solve: 4t + 19 = 71","o":["13","18","23","11"],"a":0,"e":"Subtract 19 to get 4t = 52; divide by 4, so t = 13.","v":"solving-one-step-equations"},{"d":"HARD","q":"Solve: (3u + 9) ÷ 6 = 7","o":["17","11","9","13"],"a":1,"e":"Multiply by 6 to get 3u + 9 = 42; subtract 9 and divide by 3, so u = 11.","v":"solving-one-step-equations"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}const visuals={
balance:'',
blocks:'',
bars:'',
picture:''
};function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🔢</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+'<div class="skill-item '+(correct>=8?'unlocked':'')+'">'+(correct>=8?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Translate words into equations</div>'+'<div class="skill-item '+(correct>=18?'unlocked':'')+'">'+(correct>=18?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Solve one-step and multi-step equations</div>'+'<div class="skill-item '+(correct>=24?'unlocked':'')+'">'+(correct>=24?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Model real-life problems</div>'+'</div></div>' ;$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script></body></html>
