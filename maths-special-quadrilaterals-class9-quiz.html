<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Which statement is true for every rectangle?","o":["All four sides are equal","All angles are 90°","Diagonals are always perpendicular","Only one pair of sides is parallel"],"a":1,"e":"A rectangle has four right angles; opposite sides are equal and parallel."},{"d":"BASIC","q":"Which statement is true for every rhombus?","o":["All four sides are equal","All angles are 90°","Diagonals are equal in length","It has no parallel sides"],"a":0,"e":"A rhombus has four equal sides; its angles need not be right angles."},{"d":"BASIC","q":"A square has:","o":["Only opposite sides equal","Four equal sides and four right angles","Four unequal sides","No parallel sides"],"a":1,"e":"A square combines the properties of a rectangle and a rhombus."},{"d":"BASIC","q":"The diagonals of a rectangle are:","o":["Equal and bisect each other","Always perpendicular","Unequal in every case","Never bisect each other"],"a":0,"e":"Rectangle diagonals are equal and bisect each other."},{"d":"BASIC","q":"The diagonals of a rhombus are:","o":["Always equal","Perpendicular bisectors of each other","Never intersect","Parallel to each other"],"a":1,"e":"Rhombus diagonals bisect each other at right angles."},{"d":"BASIC","q":"Which shape is both a rectangle and a rhombus?","o":["Any parallelogram","A kite","A square","Any trapezium"],"a":2,"e":"A square has all sides equal and all angles right angles."},{"d":"BASIC","q":"In a rectangle, each interior angle is:","o":["45°","60°","90°","180°"],"a":2,"e":"All four angles of a rectangle are right angles."},{"d":"BASIC","q":"A rhombus has side length 6 cm. Its perimeter is:","o":["12 cm","18 cm","24 cm","36 cm"],"a":2,"e":"Perimeter of a rhombus is 4×side = 4×6 = 24 cm."},{"d":"BASIC","q":"Which property is shared by squares and rectangles?","o":["All sides are necessarily equal","All angles are right angles","Diagonals are always perpendicular","No opposite sides are parallel"],"a":1,"e":"Both squares and rectangles have four right angles."},{"d":"BASIC","q":"Which property is shared by squares and rhombuses?","o":["All four sides are equal","All angles are right angles","Diagonals are always equal","All have unequal sides"],"a":0,"e":"Both shapes have four equal sides."},{"d":"MEDIUM","q":"A rectangle has length 12 cm and width 5 cm. Its diagonal is:","o":["7 cm","13 cm","17 cm","60 cm"],"a":1,"e":"By Pythagoras, diagonal = √(12²+5²)=√169=13 cm."},{"d":"MEDIUM","q":"A square has side 8 cm. Its perimeter is:","o":["16 cm","24 cm","32 cm","64 cm"],"a":2,"e":"The perimeter is 4×8=32 cm."},{"d":"MEDIUM","q":"The diagonals of a rhombus are 16 cm and 12 cm. Its side length is:","o":["8 cm","10 cm","12 cm","14 cm"],"a":1,"e":"Diagonals bisect at right angles: side=√(8²+6²)=√100=10 cm."},{"d":"MEDIUM","q":"A rectangle has perimeter 30 cm and length 9 cm. Its width is:","o":["3 cm","6 cm","9 cm","12 cm"],"a":1,"e":"2(l+w)=30, so l+w=15 and w=6 cm."},{"d":"MEDIUM","q":"A quadrilateral is a rectangle if it is a parallelogram with:","o":["One pair of adjacent sides equal","Equal diagonals","Perpendicular diagonals only","All sides unequal"],"a":1,"e":"A parallelogram with equal diagonals is a rectangle."},{"d":"MEDIUM","q":"A parallelogram is a rhombus if its diagonals are:","o":["Equal only","Perpendicular","Parallel","Absent"],"a":1,"e":"Perpendicular diagonals in a parallelogram imply all sides are equal."},{"d":"MEDIUM","q":"In a square, the diagonals are:","o":["Equal, perpendicular and bisect each other","Equal but never intersect","Perpendicular but do not bisect","Unequal and parallel"],"a":0,"e":"Square diagonals are equal, perpendicular, and bisect each other."},{"d":"MEDIUM","q":"A rhombus has perimeter 52 cm. Each side is:","o":["4 cm","13 cm","26 cm","52 cm"],"a":1,"e":"Each of four equal sides is 52÷4=13 cm."},{"d":"MEDIUM","q":"Which statement is NOT always true for a rhombus?","o":["Opposite angles are equal","Diagonals bisect each other","Diagonals are equal","All sides are equal"],"a":2,"e":"Rhombus diagonals are not generally equal; they are equal in a square."},{"d":"MEDIUM","q":"A rectangle's diagonals intersect at O. If one diagonal is 14 cm, then the distance from O to either endpoint on that diagonal is:","o":["3.5 cm","7 cm","14 cm","28 cm"],"a":1,"e":"Diagonals bisect each other, so each half is 14÷2=7 cm."},{"d":"HARD","q":"A rhombus has diagonals 10 cm and 24 cm. What is its perimeter?","o":["26 cm","48 cm","52 cm","60 cm"],"a":2,"e":"Half-diagonals are 5 and 12, so side=13 cm. Perimeter=4×13=52 cm."},{"d":"HARD","q":"A rectangle has diagonal 17 cm and one side 8 cm. The other side is:","o":["9 cm","12 cm","15 cm","25 cm"],"a":2,"e":"By Pythagoras, other side=√(17²−8²)=√225=15 cm."},{"d":"HARD","q":"A square's diagonal is 10√2 cm. Its side length is:","o":["5 cm","10 cm","20 cm","100 cm"],"a":1,"e":"For a square, diagonal=side×√2, so side=10 cm."},{"d":"HARD","q":"A rhombus has one interior angle of 70°. An adjacent angle is:","o":["70°","90°","110°","140°"],"a":2,"e":"Adjacent angles in a parallelogram, including a rhombus, add to 180°."},{"d":"HARD","q":"A parallelogram has equal diagonals. Which special shape must it be?","o":["Rhombus only","Rectangle (possibly a square)","Kite only","Trapezium only"],"a":1,"e":"A parallelogram with equal diagonals is a rectangle; a square is a special rectangle."},{"d":"HARD","q":"A parallelogram has perpendicular diagonals. Which special shape must it be?","o":["Rectangle only","Rhombus (possibly a square)","Any trapezium","Circle"],"a":1,"e":"A parallelogram with perpendicular diagonals is a rhombus; a square is a special rhombus."},{"d":"HARD","q":"Which condition alone guarantees a quadrilateral is a square?","o":["Four equal sides only","Four right angles only","It is both a rectangle and a rhombus","Diagonals bisect each other only"],"a":2,"e":"A figure that is both a rectangle and a rhombus has right angles and all sides equal."},{"d":"HARD","q":"A rectangle has sides 7 cm and 24 cm. Its diagonal is:","o":["17 cm","25 cm","31 cm","168 cm"],"a":1,"e":"Diagonal=√(7²+24²)=√625=25 cm."},{"d":"HARD","q":"A rhombus has side 13 cm and one diagonal 10 cm. The other diagonal is:","o":["12 cm","20 cm","24 cm","26 cm"],"a":2,"e":"Half of the 10 cm diagonal is 5. Other half=√(13²−5²)=12 cm, so full diagonal=24 cm."},{"d":"HARD","q":"A square has perimeter 48 cm. Its diagonal is:","o":["12 cm","12√2 cm","24 cm","48√2 cm"],"a":1,"e":"Side=48÷4=12 cm, so diagonal=12√2 cm."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Master special quadrilaterals</strong><small>Compare rectangles, rhombuses and squares</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Explore diagonal properties</strong><small>Identify special quadrilaterals</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve geometry calculations</strong><small>Use side, angle and diagonal relationships</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
