<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261015-class8-special-quadrilaterals-v2"><title>Special Quadrilaterals | Class 8 Maths | SkillUp</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Special quadrilaterals</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Which quadrilateral has four equal sides and four right angles?","o":["Square","Rhombus that is not a square","Rectangle that is not a square","Kite"],"a":0,"e":"A square has four equal sides and four right angles.","v":"special-quadrilaterals"},{"d":"BASIC","q":"Which shape has four equal sides but does not require right angles?","o":["Rectangle","Rhombus","Isosceles trapezium","General kite"],"a":1,"e":"A rhombus has four equal sides; its angles need not be 90°.","v":"special-quadrilaterals"},{"d":"BASIC","q":"Which quadrilateral always has four right angles?","o":["Rhombus","Kite","Rectangle","Trapezium"],"a":2,"e":"Every rectangle has four right angles.","v":"special-quadrilaterals"},{"d":"BASIC","q":"Which quadrilateral has two pairs of adjacent equal sides?","o":["Rectangle","Parallelogram with unequal sides","Isosceles trapezium","Kite"],"a":3,"e":"A kite has two pairs of adjacent equal sides.","v":"special-quadrilaterals"},{"d":"BASIC","q":"The diagonals of a square are:","o":["Equal and perpendicular","Unequal and perpendicular","Equal but never bisect each other","Parallel"],"a":0,"e":"Square diagonals are equal, perpendicular, and bisect each other.","v":"special-quadrilaterals"},{"d":"BASIC","q":"The diagonals of a rectangle are always:","o":["Perpendicular in every rectangle","Equal and bisect each other","Unequal","Parallel"],"a":1,"e":"Rectangle diagonals have equal lengths and bisect each other.","v":"special-quadrilaterals"},{"d":"BASIC","q":"Which special quadrilateral has diagonals that bisect each other at right angles, but are not necessarily equal?","o":["Rectangle","Isosceles trapezium","Rhombus","General parallelogram"],"a":2,"e":"A rhombus has perpendicular bisecting diagonals, which need not be equal.","v":"special-quadrilaterals"},{"d":"BASIC","q":"Which shape is both a rectangle and a rhombus?","o":["Kite","Trapezium","General parallelogram","Square"],"a":3,"e":"A square satisfies the defining properties of a rectangle and a rhombus.","v":"special-quadrilaterals"},{"d":"BASIC","q":"In a kite, which statement is always true?","o":["One diagonal perpendicularly bisects the other","Both diagonals are equal","Both diagonals bisect each other","All angles are equal"],"a":0,"e":"A kite's symmetry diagonal perpendicularly bisects the other diagonal.","v":"special-quadrilaterals"},{"d":"BASIC","q":"An isosceles trapezium has:","o":["Four equal sides","Equal non-parallel sides","Four right angles always","Both pairs of opposite sides parallel"],"a":1,"e":"Its two non-parallel sides, called legs, are equal.","v":"special-quadrilaterals"},{"d":"MEDIUM","q":"A square has side 9 cm. What is its perimeter?","o":["18 cm","81 cm","36 cm","27 cm"],"a":2,"e":"Perimeter = 4 × 9 = 36 cm.","v":"special-quadrilaterals"},{"d":"MEDIUM","q":"A rectangle has length 12 cm and width 5 cm. What is its perimeter?","o":["60 cm","17 cm","24 cm","34 cm"],"a":3,"e":"Perimeter = 2(12 + 5) = 34 cm.","v":"special-quadrilaterals"},{"d":"MEDIUM","q":"A rhombus has side length 7.5 cm. What is its perimeter?","o":["30 cm","15 cm","28 cm","56.25 cm"],"a":0,"e":"All four sides are equal, so perimeter = 4 × 7.5 = 30 cm.","v":"special-quadrilaterals"},{"d":"MEDIUM","q":"A square has perimeter 52 cm. Find its side length.","o":["26 cm","13 cm","12 cm","10 cm"],"a":1,"e":"Each side is 52 ÷ 4 = 13 cm.","v":"special-quadrilaterals"},{"d":"MEDIUM","q":"A rectangle has perimeter 50 cm and length 15 cm. Find its width.","o":["20 cm","25 cm","10 cm","5 cm"],"a":2,"e":"2(L + W) = 50, so L + W = 25 and W = 10 cm.","v":"special-quadrilaterals"},{"d":"MEDIUM","q":"One angle of a rhombus is 64°. What is an adjacent angle?","o":["64°","90°","128°","116°"],"a":3,"e":"Adjacent angles are supplementary, so 180° − 64° = 116°.","v":"special-quadrilaterals"},{"d":"MEDIUM","q":"A rectangle has diagonals AC and BD intersecting at O. If AC = 18 cm, what is AO?","o":["9 cm","18 cm","6 cm","36 cm"],"a":0,"e":"The diagonals bisect each other, so AO is half of AC: 9 cm.","v":"special-quadrilaterals"},{"d":"MEDIUM","q":"Which extra condition makes a rhombus a square?","o":["One side is longer than another","One angle is 90°","Exactly one pair of parallel sides","Diagonals are unequal"],"a":1,"e":"A rhombus with one right angle has four right angles and is a square.","v":"special-quadrilaterals"},{"d":"MEDIUM","q":"Which statement is always true for an isosceles trapezium?","o":["All four sides are equal","Its diagonals are perpendicular","Its base angles are equal","Both pairs of opposite sides are parallel"],"a":2,"e":"The angles adjacent to each base of an isosceles trapezium are equal.","v":"special-quadrilaterals"},{"d":"MEDIUM","q":"A kite has side lengths 5 cm, 5 cm, 8 cm and 8 cm. What is its perimeter?","o":["18 cm","40 cm","21 cm","26 cm"],"a":3,"e":"Add all four sides: 5 + 5 + 8 + 8 = 26 cm.","v":"special-quadrilaterals"},{"d":"HARD","q":"A square has diagonal length 10√2 cm. Find its side length.","o":["10 cm","5√2 cm","20 cm","10√2 cm"],"a":0,"e":"For a square, diagonal = side × √2, so side = 10√2 ÷ √2 = 10 cm.","v":"special-quadrilaterals"},{"d":"HARD","q":"A rectangle's diagonal is 13 cm and one side is 5 cm. Find the other side.","o":["8 cm","12 cm","10 cm","18 cm"],"a":1,"e":"By Pythagoras, the other side is √(13² − 5²) = √144 = 12 cm.","v":"special-quadrilaterals"},{"d":"HARD","q":"A square and a rhombus both have side length 6 cm. Which statement must be true?","o":["Their areas are equal in every orientation","Their diagonals are equal","Their perimeters are equal","Their angles are all equal"],"a":2,"e":"Both have four sides of length 6 cm, so each perimeter is 24 cm.","v":"special-quadrilaterals"},{"d":"HARD","q":"A rectangle has sides (x + 3) cm and (2x − 1) cm. If its perimeter is 46 cm, find x.","o":["6","8","5","7"],"a":3,"e":"2[(x + 3) + (2x − 1)] = 46 gives 6x + 4 = 46, so x = 7.","v":"special-quadrilaterals"},{"d":"HARD","q":"A rhombus has diagonals 16 cm and 30 cm. Find its side length.","o":["17 cm","23 cm","15 cm","32 cm"],"a":0,"e":"The diagonals bisect at right angles: side = √(8² + 15²) = √289 = 17 cm.","v":"special-quadrilaterals"},{"d":"HARD","q":"A square has area 144 cm². What is its diagonal length?","o":["12 cm","12√2 cm","24 cm","144√2 cm"],"a":1,"e":"Its side is √144 = 12 cm, so diagonal = 12√2 cm.","v":"special-quadrilaterals"},{"d":"HARD","q":"A rectangle has perimeter 64 cm. Its length is 4 cm more than its width. Find the width.","o":["16 cm","12 cm","14 cm","18 cm"],"a":2,"e":"L + W = 32 and L = W + 4, so 2W + 4 = 32 and W = 14 cm.","v":"special-quadrilaterals"},{"d":"HARD","q":"An isosceles trapezium has equal legs of 10 cm, and its two bases are 8 cm and 18 cm. What is its perimeter?","o":["36 cm","54 cm","28 cm","46 cm"],"a":3,"e":"Perimeter = 10 + 10 + 8 + 18 = 46 cm.","v":"special-quadrilaterals"},{"d":"HARD","q":"A square has side length 8 cm. What is the area of the square?","o":["64 cm²","32 cm²","16 cm²","256 cm²"],"a":0,"e":"Area = side² = 8² = 64 cm².","v":"special-quadrilaterals"},{"d":"HARD","q":"A rectangle has area 96 cm² and length 12 cm. What is its perimeter?","o":["32 cm","40 cm","48 cm","56 cm"],"a":1,"e":"Width = 96 ÷ 12 = 8 cm; perimeter = 2(12 + 8) = 40 cm.","v":"special-quadrilaterals"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Compare squares, rectangles, rhombi, kites and trapeziums</strong><small>Defining properties of special quadrilaterals</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Perimeters, diagonals and areas</strong><small>Use special-shape properties to solve problems</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Connect side counts, angles and diagonals</strong><small>Solve equations reducible to linear form</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
