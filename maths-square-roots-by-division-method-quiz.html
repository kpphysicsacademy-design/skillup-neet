(function(){'use strict';const questions=[{"d":"BASIC","q":"Find √625.","o":["25","20","15","35"],"a":0,"e":"25 × 25 = 625.","v":"square-roots-by-division-method"},{"d":"BASIC","q":"What is √784?","o":["26","28","24","32"],"a":1,"e":"28 × 28 = 784.","v":"square-roots-by-division-method"},{"d":"BASIC","q":"What is √529?","o":["21","25","23","27"],"a":2,"e":"23 × 23 = 529.","v":"square-roots-by-division-method"},{"d":"BASIC","q":"Find √1024.","o":["28","30","34","32"],"a":3,"e":"32 × 32 = 1024.","v":"square-roots-by-division-method"},{"d":"BASIC","q":"What is √1225?","o":["35","30","40","45"],"a":0,"e":"35 × 35 = 1225.","v":"square-roots-by-division-method"},{"d":"BASIC","q":"Find √324.","o":["16","18","20","22"],"a":1,"e":"18 × 18 = 324.","v":"square-roots-by-division-method"},{"d":"BASIC","q":"What is √441?","o":["19","20","21","22"],"a":2,"e":"21 × 21 = 441.","v":"square-roots-by-division-method"},{"d":"BASIC","q":"What is √900?","o":["20","25","35","30"],"a":3,"e":"30 × 30 = 900.","v":"square-roots-by-division-method"},{"d":"BASIC","q":"In the long-division square-root method, how are digits grouped?","o":["Pairs from the decimal point outward","Groups of three from the left","Pairs only after the decimal point","All digits together"],"a":0,"e":"Group digits in pairs moving left and right from the decimal point.","v":"square-roots-by-division-method"},{"d":"BASIC","q":"What is √1600?","o":["20","40","30","50"],"a":1,"e":"40 × 40 = 1600.","v":"square-roots-by-division-method"},{"d":"MEDIUM","q":"Find √2304.","o":["46","52","48","54"],"a":2,"e":"48² = 2304.","v":"square-roots-by-division-method"},{"d":"MEDIUM","q":"What is √3481?","o":["57","63","61","59"],"a":3,"e":"59² = (60 − 1)² = 3481.","v":"square-roots-by-division-method"},{"d":"MEDIUM","q":"Find √4761.","o":["69","67","71","73"],"a":0,"e":"69² = (70 − 1)² = 4761.","v":"square-roots-by-division-method"},{"d":"MEDIUM","q":"What is √5929?","o":["73","77","75","79"],"a":1,"e":"77² = 5929.","v":"square-roots-by-division-method"},{"d":"MEDIUM","q":"Find √6561.","o":["79","83","81","85"],"a":2,"e":"81² = 6561.","v":"square-roots-by-division-method"},{"d":"MEDIUM","q":"What is √9409?","o":["93","95","99","97"],"a":3,"e":"97² = 9409.","v":"square-roots-by-division-method"},{"d":"MEDIUM","q":"In the long-division method, how is the next trial divisor formed?","o":["Double the current root, then append a trial digit","Add the current root to the remainder","Square the remainder","Divide the current root by two"],"a":0,"e":"The current root is doubled; a trial digit is appended to test a product against the current dividend.","v":"square-roots-by-division-method"},{"d":"MEDIUM","q":"Find √3136.","o":["54","56","58","62"],"a":1,"e":"56² = 3136.","v":"square-roots-by-division-method"},{"d":"MEDIUM","q":"What is √8281?","o":["89","93","91","95"],"a":2,"e":"91² = 8281.","v":"square-roots-by-division-method"},{"d":"MEDIUM","q":"Find √2025.","o":["35","40","55","45"],"a":3,"e":"45² = 2025.","v":"square-roots-by-division-method"},{"d":"HARD","q":"Find √12321.","o":["111","109","113","121"],"a":0,"e":"111² = 12321.","v":"square-roots-by-division-method"},{"d":"HARD","q":"What is √15129?","o":["121","123","125","127"],"a":1,"e":"123² = 15129.","v":"square-roots-by-division-method"},{"d":"HARD","q":"Find √18769.","o":["127","129","137","139"],"a":2,"e":"137² = 18769.","v":"square-roots-by-division-method"},{"d":"HARD","q":"What is √23409?","o":["151","157","155","153"],"a":3,"e":"153² = 23409.","v":"square-roots-by-division-method"},{"d":"HARD","q":"Find √28561.","o":["169","167","171","173"],"a":0,"e":"169² = 28561.","v":"square-roots-by-division-method"},{"d":"HARD","q":"What is √38809?","o":["193","197","195","199"],"a":1,"e":"197² = 38809.","v":"square-roots-by-division-method"},{"d":"HARD","q":"The square root of 0.0009 is:","o":["0.3","0.003","0.03","0.0003"],"a":2,"e":"0.03 × 0.03 = 0.0009.","v":"square-roots-by-division-method"},{"d":"HARD","q":"Find √2.25.","o":["0.15","2.5","15"," b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Find square roots using the long-division method</strong><small>Long-division steps and square-root estimation</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Apply the long-division method to perfect squares</strong><small>Solve larger and decimal square-root problems</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply prime factorisation and square-number patterns</strong><small>Reason about perfect squares and nearest squares</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
