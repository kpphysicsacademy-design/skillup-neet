<style>

ce-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Find √36 using prime factorisation.","o":["6","5","7","8"],"a":0,"e":"36 = 2² × 3², so √36 = 2 × 3 = 6.","v":"square-roots-by-factorisation"},{"d":"BASIC","q":"What is √144?","o":["11","12","13","14"],"a":1,"e":"144 = 2⁴ × 3², so its square root is 2² × 3 = 12.","v":"square-roots-by-factorisation"},{"d":"BASIC","q":"Which prime factorisation represents 100?","o":["2² × 5","2 × 5²","2² × 5²","2³ × 5²"],"a":2,"e":"100 = 4 × 25 = 2² × 5².","v":"square-roots-by-factorisation"},{"d":"BASIC","q":"Using prime factors, √49 equals:","o":["6","8","9","7"],"a":3,"e":"49 = 7², so its square root is 7.","v":"square-roots-by-factorisation"},{"d":"BASIC","q":"What is √225?","o":["15","14","12","25"],"a":0,"e":"225 = 3² × 5², so √225 = 3 × 5 = 15.","v":"square-roots-by-factorisation"},{"d":"BASIC","q":"Which pair of equal factors gives 64?","o":["6 × 6","8 × 8","9 × 9","7 × 7"],"a":1,"e":"8 × 8 = 64, so √64 = 8.","v":"square-roots-by-factorisation"},{"d":"BASIC","q":"What is √81 by prime factorisation?","o":["7","8","9","6"],"a":2,"e":"81 = 3⁴, so √81 = 3² = 9.","v":"square-roots-by-factorisation"},{"d":"BASIC","q":"What is the square root of 196?","o":["12","18","16","14"],"a":3,"e":"196 = 2² × 7², so √196 = 2 × 7 = 14.","v":"square-roots-by-factorisation"},{"d":"BASIC","q":"Simplify √(4 × 25).","o":["10","20","5","15"],"a":0,"e":"4 × 25 = 100 and √100 = 10.","v":"square-roots-by-factorisation"},{"d":"BASIC","q":"What is √400?","o":["10","20","25","15"],"a":1,"e":"400 = 2⁴ × 5², so √400 = 2² × 5 = 20.","v":"square-roots-by-factorisation"},{"d":"MEDIUM","q":"Find √576 using prime factorisation.","o":["26","22","24","28"],"a":2,"e":"576 = 2⁶ × 3², so √576 = 2³ × 3 = 24.","v":"square-roots-by-factorisation"},{"d":"MEDIUM","q":"What is √(2² × 3⁴)?","o":["24","36","12","18"],"a":3,"e":"Taking half of each even exponent gives 2 × 3² = 18.","v":"square-roots-by-factorisation"},{"d":"MEDIUM","q":"The prime factorisation of 900 is 2² × 3² × 5². What is √900?","o":["30","25","20","45"],"a":0,"e":"√900 = 2 × 3 × 5 = 30.","v":"square-roots-by-factorisation"},{"d":"MEDIUM","q":"Which expression equals √(16 × 49)?","o":["8 × 7 = 56","4 × 7 = 28","4 × 14 = 56","16 × 7 = 112"],"a":1,"e":"√(16 × 49) = √16 × √49 = 4 × 7 = 28.","v":"square-roots-by-factorisation"},{"d":"MEDIUM","q":"Find √2025.","o":["35","40","45","55"],"a":2,"e":"2025 = 45², so its square root is 45.","v":"square-roots-by-factorisation"},{"d":"MEDIUM","q":"If N = 2² × 3² × 7², what is √N?","o":["21","294","84","42"],"a":3,"e":"√N = 2 × 3 × 7 = 42.","v":"square-roots-by-factorisation"},{"d":"MEDIUM","q":"What is √(2⁴ × 5²)?","o":["20","10","40","50"],"a":0,"e":"√(2⁴ × 5²) = 2² × 5 = 20.","v":"square-roots-by-factorisation"},{"d":"MEDIUM","q":"Find √(144 × 25).","o":["30","60","50","600"],"a":1,"e":"√144 × √25 = 12 × 5 = 60.","v":"square-roots-by-factorisation"},{"d":"MEDIUM","q":"Which number has prime factorisation 2⁴ × 3² and square root 12?","o":["576","288","144","72"],"a":2,"e":"2⁴ × 3² = 16 × 9 = 144, and √144 = 12.","v":"square-roots-by-factorisation"},{"d":"MEDIUM","q":"What is √(36 × 64)?","o":["60","36","24","48"],"a":3,"e":"√36 × √64 = 6 × 8 = 48.","v":"square-roots-by-factorisation"},{"d":"HARD","q":"What is the smallest integer whose product with 180 is a perfect square?","o":["5","3","2","10"],"a":0,"e":"180 = 2² × 3² × 5; multiply by 5 to make every prime exponent even.","v":"square-roots-by-factorisation"},{"d":"HARD","q":"What is the least integer by which 432 must be divided to leave a perfect-square quotient?","o":["2","3","6","12"],"a":1,"e":"432 = 2⁴ × 3³; divide by 3 to get 2⁴ × 3² = 144.","v":"square-roots-by-factorisation"},{"d":"HARD","q":"Find √1764 by prime factorisation.","o":["38","40","42","44"],"a":2,"e":"1764 = 2² × 3² × 7², so √1764 = 2 × 3 × 7 = 42.","v":"square-roots-by-factorisation"},{"d":"HARD","q":"If √N = 18 and N is a positive integer, what is N?","o":["648","36","162","324"],"a":3,"e":"N = 18² = 324.","v":"square-roots-by-factorisation"},{"d":"HARD","q":"Simplify √(2⁶ × 3² × 5⁴).","o":["600","300","120","900"],"a":0,"e":"The square root is 2³ × 3 × 5² = 8 × 3 × 25 = 600.","v":"square-roots-by-factorisation"},{"d":"HARD","q":"What is the least number to multiply 540 by to make it a perfect square?","o":["5","15","6","30"],"a":1,"e":"540 = 2² × 3³ × 5. Multiply by 3 × 5 = 15 to make all exponents even.","v":"square-roots-by-factorisation"},{"d":"HARD","q":"A square number has prime factorisation 2ᵃ × 3⁴ × 7². Which value of a is possible?","o":["3","5","6","7"],"a":2,"e":"In a perfect square, each prime exponent is even; 6 is even.","v":"square-roots-by-factorisation"},{"d":"HARD","q":"Find √(3600 ÷ 9).","o":["10","15","30","20"],"a":3,"e":"3600 ÷ 9 = 400 and √400 = 20.","v":"square-roots-by-factorisation"},{"d":"HARD","q":"If N = 2⁵ × 3², what is the smallest positive integer m such that √(Nm) is an integer?","o":["2","3","6","12"],"a":0,"e":"Only exponent 5 is odd; multiply by 2 to get N m = 2⁶ × 3².","v":"square-roots-by-factorisation"},{"d":"HARD","q":"Which is √(2⁴ × 3² × 5²)?","o":["30","60","120","300"],"a":1,"e":"The square root is 2² × 3 × 5 = 60.","v":"square-roots-by-factorisation"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Use prime factorisation to find square roots</strong><small>Prime factor pairs and square roots</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Simplify square roots using prime factorisation</strong><small>Apply prime exponents to square-root problems</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply prime factorisation and square-number patterns</strong><small>Reason about perfect squares and nearest squares</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>\n<script src="/shared-nav.js?v=20261013-universal-nav-v1"></script>\n</body></html>
