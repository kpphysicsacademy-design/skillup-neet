<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Which identity is correct for (a + b)²?","o":["a² + b²","a² + 2ab + b²","a² − 2ab + b²","a² − b²"],"a":1,"e":"Squaring a sum gives a² + 2ab + b².","v":"standard-identities"},{"d":"BASIC","q":"Expand (x − y)².","o":["x² − y²","x² + 2xy + y²","x² − 2xy + y²","x² − xy + y²"],"a":2,"e":"(x − y)² = x² − 2xy + y².","v":"standard-identities"},{"d":"BASIC","q":"Which expression equals a² − b²?","o":["(a − b)²","(a + b)²","(a − b)(a + b)","(a + b)(a + b)"],"a":2,"e":"Difference of squares factors as (a − b)(a + b).","v":"standard-identities"},{"d":"BASIC","q":"Expand (x + 3)².","o":["x² + 9","x² + 6x + 9","x² + 3x + 9","x² − 6x + 9"],"a":1,"e":"Use (x + a)² = x² + 2ax + a².","v":"standard-identities"},{"d":"BASIC","q":"Expand (m − 5)².","o":["m² − 10m + 25","m² − 25","m² + 10m + 25","m² − 5m + 25"],"a":0,"e":"(m − 5)² = m² − 10m + 25.","v":"standard-identities"},{"d":"BASIC","q":"Simplify (p + q)(p − q).","o":["p² + 2pq + q²","p² − q²","p² + q²","p² − 2pq + q²"],"a":1,"e":"The middle terms cancel, leaving p² − q².","v":"standard-identities"},{"d":"BASIC","q":"Evaluate 51² using an identity.","o":["2501","2601","2401","2551"],"a":1,"e":"51² = (50 + 1)² = 2500 + 100 + 1 = 2601.","v":"standard-identities"},{"d":"BASIC","q":"Evaluate 99² using an identity.","o":["9801","9901","9701","9999"],"a":0,"e":"99² = (100 − 1)² = 10000 − 200 + 1 = 9801.","v":"standard-identities"},{"d":"BASIC","q":"Expand (2x + 3)².","o":["4x² + 9","4x² + 12x + 9","4x² + 6x + 9","2x² + 12x + 9"],"a":1,"e":"(2x + 3)² = (2x)² + 2(2x)(3) + 3².","v":"standard-identities"},{"d":"BASIC","q":"Expand (3a − 2)².","o":["9a² − 12a + 4","9a² − 4","9a² + 12a + 4","3a² − 12a + 4"],"a":0,"e":"Square the first term, subtract twice the product, then add the square of 2.","v":"standard-identities"},{"d":"MEDIUM","q":"Which is the expansion of (a + b + c)²?","o":["a² + b² + c²","a² + b² + c² + 2ab + 2bc + 2ca","a² + b² + c² + ab + bc + ca","a² − b² − c²"],"a":1,"e":"Each squared term appears once and each pairwise product appears twice.","v":"standard-identities"},{"d":"MEDIUM","q":"Factorise x² − 16.","o":["(x − 4)²","(x + 4)²","(x − 4)(x + 4)","(x − 8)(x + 2)"],"a":2,"e":"x² − 16 = x² − 4² = (x − 4)(x + 4).","v":"standard-identities"},{"d":"MEDIUM","q":"Simplify (x + 7)² − x².","o":["14x + 49","7x + 49","14x + 7","x² + 14x + 49"],"a":0,"e":"Expand to x² + 14x + 49, then subtract x².","v":"standard-identities"},{"d":"MEDIUM","q":"If a + b = 10 and ab = 21, find a² + b².","o":["58","100","79","42"],"a":0,"e":"a² + b² = (a + b)² − 2ab = 100 − 42 = 58.","v":"standard-identities"},{"d":"MEDIUM","q":"If a − b = 6 and ab = 4, find a² + b².","o":["28","36","20","44"],"a":3,"e":"a² + b² = (a − b)² + 2ab = 36 + 8 = 44.","v":"standard-identities"},{"d":"MEDIUM","q":"Find 103 × 97 using an identity.","o":["9991","9999","10001","9700"],"a":0,"e":"(100 + 3)(100 − 3) = 100² − 3² = 9991.","v":"standard-identities"},{"d":"MEDIUM","q":"Which identity expands (x + a)(x + b)?","o":["x² + (a + b)x + ab","x² + ab","x² + (a − b)x − ab","x² + (a + b) + ab"],"a":0,"e":"Multiplying gives x² + bx + ax + ab = x² + (a + b)x + ab.","v":"standard-identities"},{"d":"MEDIUM","q":"Expand (x + 4)(x + 6).","o":["x² + 10x + 24","x² + 24x + 10","x² + 2x + 24","x² + 10x − 24"],"a":0,"e":"The middle coefficient is 4 + 6 = 10 and the constant is 4 × 6 = 24.","v":"standard-identities"},{"d":"MEDIUM","q":"Expand (y − 2)(y + 5).","o":["y² + 3y − 10","y² − 7y + 10","y² + 7y − 10","y² + 3y + 10"],"a":0,"e":"Multiply to get y² + 5y − 2y − 10 = y² + 3y − 10.","v":"standard-identities"},{"d":"MEDIUM","q":"Simplify (a + b)² − (a − b)².","o":["2a² + 2b²","4ab","2ab","4a²"],"a":1,"e":"Subtracting the expansions cancels a² and b², leaving 4ab.","v":"standard-identities"},{"d":"HARD","q":"Which is equal to 4x² − 25?","o":["(2x − 5)²","(2x − 5)(2x + 5)","(4x − 5)(x + 5)","(2x + 5)²"],"a":1,"e":"4x² − 25 = (2x)² − 5², a difference of squares.","v":"standard-identities"},{"d":"HARD","q":"Expand (2m − 1)(2m + 1).","o":["4m² − 1","4m² + 1","4m² − 4m + 1","2m² − 1"],"a":0,"e":"Use (A − B)(A + B) = A² − B².","v":"standard-identities"},{"d":"HARD","q":"Evaluate 48 × 52 using an identity.","o":["2496","2500","2400","2600"],"a":0,"e":"(50 − 2)(50 + 2) = 50² − 2² = 2496.","v":"standard-identities"},{"d":"HARD","q":"If x + y = 8 and xy = 12, find (x − y)².","o":["16","40","64","28"],"a":0,"e":"(x − y)² = (x + y)² − 4xy = 64 − 48 = 16.","v":"standard-identities"},{"d":"HARD","q":"Simplify (2a + b)².","o":["4a² + 4ab + b²","4a² + 2ab + b²","2a² + 4ab + b²","4a² + b²"],"a":0,"e":"(2a + b)² = 4a² + 4ab + b².","v":"standard-identities"},{"d":"HARD","q":"Expand (5x − 2y)².","o":["25x² − 20xy + 4y²","25x² − 4y²","25x² + 20xy + 4y²","5x² − 20xy + 4y²"],"a":0,"e":"The middle term is −2(5x)(2y) = −20xy.","v":"standard-identities"},{"d":"HARD","q":"Factorise 9a² − 4b².","o":["(3a − 2b)(3a + 2b)","(3a − 2b)²","(9a − 4b)(a + b)","(3a + 2b)²"],"a":0,"e":"This is (3a)² − (2b)².","v":"standard-identities"},{"d":"HARD","q":"If x − 3 = 7, find x² − 6x + 9.","o":["49","16","25","100"],"a":0,"e":"x² − 6x + 9 = (x − 3)² = 7² = 49.","v":"standard-identities"},{"d":"HARD","q":"Simplify (x + 2)² + (x − 2)².","o":["2x² + 8","2x² + 4","x² + 8","2x² − 8"],"a":0,"e":"Add expansions x² + 4x + 4 and x² − 4x + 4 to get 2x² + 8.","v":"standard-identities"},{"d":"HARD","q":"Which identity is useful for calculating 1002² mentally?","o":["(a − b)²","(a + b)²","a² − b²","(a + b)(a − b)"],"a":1,"e":"1002² = (1000 + 2)², so the square-of-a-sum identity applies.","v":"standard-identities"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Apply standard algebraic identities</strong><small>Expand squares of sums and differences</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Use the difference-of-squares identity</strong><small>Recognise and simplify equivalent algebraic forms</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply identities accurately to expressions</strong><small>Reason about perfect squares and nearest squares</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
