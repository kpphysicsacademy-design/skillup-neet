<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Find the mean of 4, 6 and 8.","o":["4","6","8","18"],"a":1,"e":"Mean=(4+6+8)/3=18/3=6."},{"d":"BASIC","q":"Find the median of 3, 7, 9.","o":["3","7","9","19/3"],"a":1,"e":"The values are already ordered; the middle value is 7."},{"d":"BASIC","q":"Find the mode of 2, 3, 3, 5, 7.","o":["2","3","5","7"],"a":1,"e":"The mode is the value occurring most often; 3 appears twice."},{"d":"BASIC","q":"What is the range of 4, 9, 2, 11, 6?","o":["5","7","9","13"],"a":2,"e":"Range=maximum−minimum=11−2=9."},{"d":"BASIC","q":"The frequency of a value tells us:","o":["Its size","How often it occurs","The total range","The mean"],"a":1,"e":"Frequency is the number of times a value or class occurs."},{"d":"BASIC","q":"Find the class mark of the interval 10–20.","o":["10","15","20","30"],"a":1,"e":"Class mark=(lower limit+upper limit)/2=(10+20)/2=15."},{"d":"BASIC","q":"Which graph is commonly used to represent grouped continuous data with adjacent bars?","o":["Pie chart","Histogram","Pictograph","Line segment only"],"a":1,"e":"A histogram represents grouped continuous data using adjoining rectangles."},{"d":"BASIC","q":"Find the mean of 5, 5, 5, 5.","o":["0","4","5","20"],"a":2,"e":"Mean=20/4=5."},{"d":"BASIC","q":"Find the median of 2, 4, 6, 8.","o":["4","5","6","10"],"a":1,"e":"For four values, median is the average of the two middle values: (4+6)/2=5."},{"d":"BASIC","q":"If every observation in a data set is increased by 3, the mean:","o":["Decreases by 3","Stays the same","Increases by 3","Doubles"],"a":2,"e":"Adding the same constant to every observation increases the mean by that constant."},{"d":"MEDIUM","q":"Find the mean of 6, 8, 10, 12, 14.","o":["8","9","10","12"],"a":2,"e":"Sum=50; mean=50/5=10."},{"d":"MEDIUM","q":"Find the median of 4, 11, 7, 2, 9.","o":["4","7","9","11"],"a":1,"e":"Ordered data: 2, 4, 7, 9, 11. The middle value is 7."},{"d":"MEDIUM","q":"Find the mode of 6, 8, 6, 9, 8, 6, 10.","o":["6","8","9","10"],"a":0,"e":"6 occurs three times, more than any other value."},{"d":"MEDIUM","q":"A data set has values 1, 2, 3 with frequencies 2, 3, 5 respectively. How many observations are there?","o":["5","8","10","15"],"a":2,"e":"Total observations=2+3+5=10."},{"d":"MEDIUM","q":"Values 1, 2, 3 have frequencies 2, 3, 5. Find the mean.","o":["2","2.3","2.5","3"],"a":1,"e":"Mean=(1×2+2×3+3×5)/(2+3+5)=23/10=2.3."},{"d":"MEDIUM","q":"Find the class mark of 30–40.","o":["30","35","40","70"],"a":1,"e":"Class mark=(30+40)/2=35."},{"d":"MEDIUM","q":"In a histogram, the bars usually touch because:","o":["The classes represent continuous intervals","All frequencies are equal","The data are categories only","The bars show percentages only"],"a":0,"e":"Adjacent bars indicate continuous class intervals with no gaps between them."},{"d":"MEDIUM","q":"Find the range of 18, 12, 25, 9, 21.","o":["12","14","16","34"],"a":2,"e":"Range=25−9=16."},{"d":"MEDIUM","q":"The mean of 5 numbers is 12. What is their total sum?","o":["17","24","60","72"],"a":2,"e":"Sum=mean×number of observations=12×5=60."},{"d":"MEDIUM","q":"Find the median of 3, 5, 8, 10, 12, 15.","o":["8","9","10","11"],"a":1,"e":"There are six values; median=(8+10)/2=9."},{"d":"HARD","q":"The mean of 8 observations is 15. Seven observations sum to 98. Find the eighth observation.","o":["18","20","22","24"],"a":2,"e":"Total sum=8×15=120; missing value=120−98=22. Correct option is 22."},{"d":"HARD","q":"The mean of 10, 12, x and 18 is 14. Find x.","o":["12","14","16","18"],"a":2,"e":"Total needed=4×14=56; x=56−(10+12+18)=16."},{"d":"HARD","q":"The data 4, 6, 6, 7, 9, x have median 6.5, where x is greater than 9. Find x.","o":["10","11","12","Cannot be determined"],"a":3,"e":"With six ordered values and x>9, the middle two are 6 and 7, so median is 6.5 for any x>9; x cannot be uniquely determined."},{"d":"HARD","q":"A frequency table has values 2, 4, 6 with frequencies 3, 2, 5. Find the mean.","o":["4.0","4.2","4.4","4.6"],"a":2,"e":"Mean=(2×3+4×2+6×5)/(3+2+5)=44/10=4.4."},{"d":"HARD","q":"The mean of 6 numbers is 9. If one value 4 is replaced by 16, what is the new mean?","o":["9","10","11","12"],"a":2,"e":"The total increases by 12; new mean=(6×9+12)/6=11."},{"d":"HARD","q":"A grouped class interval is 20–30 with frequency 8. What is the class mark?","o":["8","20","25","30"],"a":2,"e":"Class mark is the midpoint: (20+30)/2=25; frequency does not affect it."},{"d":"HARD","q":"In a data set, each of the values 2, 4, 6, 8 occurs once. Which statement is correct?","o":["Mean=4 and median=5","Mean=5 and median=5","Mean=5 and median=6","Mode=5"],"a":1,"e":"Mean=(2+4+6+8)/4=5; median=(4+6)/2=5. There is no mode because each occurs once."},{"d":"HARD","q":"The frequencies for scores 0, 1, 2, 3 are 2, 4, 3, 1. Find the mean score.","o":["1.0","1.3","1.5","2.0"],"a":1,"e":"Mean=(0×2+1×4+2×3+3×1)/10=13/10=1.3."},{"d":"HARD","q":"A data set has mean 20. Each observation is multiplied by 3. What is the new mean?","o":["20","23","40","60"],"a":3,"e":"Multiplying every observation by 3 multiplies the mean by 3: 60."},{"d":"HARD","q":"The mean of 4 numbers is 7.5. Three numbers are 6, 8 and 10. Find the fourth number.","o":["4","5","6","8"],"a":2,"e":"Total=4×7.5=30; fourth number=30−(6+8+10)=6. Correct option is 6."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Calculate mean, median and mode</strong><small>Organise frequency data</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Interpret histograms and class marks</strong><small>Analyse numerical data</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve statistics problems</strong><small>Use frequency-weighted calculations</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
