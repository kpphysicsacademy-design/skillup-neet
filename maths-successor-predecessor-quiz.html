<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What is the successor of 8?","o":["7","8","9","10"],"a":2,"e":"The successor is one more: 8 + 1 = 9."},{"d":"BASIC","q":"What is the predecessor of 12?","o":["10","11","12","13"],"a":1,"e":"The predecessor is one less: 12 − 1 = 11."},{"d":"BASIC","q":"Which operation finds the successor of a whole number?","o":["Subtract 1","Add 1","Multiply by 2","Divide by 2"],"a":1,"e":"Add 1 to find the next whole number."},{"d":"BASIC","q":"Which operation finds the predecessor of 25?","o":["Add 1","Subtract 1","Add 2","Multiply by 1"],"a":1,"e":"Subtract 1 to find the previous whole number."},{"d":"BASIC","q":"What is the successor of 0?","o":["0","−1","1","2"],"a":2,"e":"The whole number after 0 is 1."},{"d":"BASIC","q":"Which whole number has no whole-number predecessor?","o":["1","2","10","0"],"a":3,"e":"Zero is the smallest whole number, so no whole number comes before it."},{"d":"BASIC","q":"The predecessor of 40 is …","o":["39","40","41","42"],"a":0,"e":"40 − 1 = 39."},{"d":"BASIC","q":"The successor of 99 is …","o":["98","99","100","101"],"a":2,"e":"99 + 1 = 100."},{"d":"BASIC","q":"Which pair is correct?","o":["Successor of 14 = 13","Predecessor of 14 = 15","Successor of 14 = 15","Predecessor of 14 = 14"],"a":2,"e":"The successor of 14 is 15."},{"d":"BASIC","q":"What is the predecessor of 1,000?","o":["999","1,000","1,001","990"],"a":0,"e":"1,000 − 1 = 999."},{"d":"MEDIUM","q":"A whole number has successor 76. What is the number?","o":["74","75","76","77"],"a":1,"e":"The number before 76 is 75."},{"d":"MEDIUM","q":"A number has predecessor 58. What is the number?","o":["57","58","59","60"],"a":2,"e":"If its predecessor is 58, the number is 58 + 1 = 59."},{"d":"MEDIUM","q":"What is the successor of the successor of 19?","o":["20","21","22","18"],"a":1,"e":"19 → 20 → 21."},{"d":"MEDIUM","q":"What is the predecessor of the predecessor of 32?","o":["29","30","31","33"],"a":1,"e":"32 → 31 → 30."},{"d":"MEDIUM","q":"Find the sum of the successor of 9 and the predecessor of 9.","o":["16","17","18","19"],"a":2,"e":"The successor is 10 and the predecessor is 8; 10 + 8 = 18."},{"d":"MEDIUM","q":"Which number lies between the predecessor and successor of 50?","o":["49","50","51","52"],"a":1,"e":"The predecessor is 49 and the successor is 51, so 50 lies between them."},{"d":"MEDIUM","q":"The successor of a number is 301. What is its predecessor?","o":["299","300","301","302"],"a":0,"e":"The number is 300, so its predecessor is 299."},{"d":"MEDIUM","q":"What is the difference between the successor and predecessor of 125?","o":["1","2","124","126"],"a":1,"e":"They are 126 and 124; 126 − 124 = 2."},{"d":"MEDIUM","q":"A counter shows 499. What will it show after one increase?","o":["498","499","500","501"],"a":2,"e":"Increasing by one gives 500."},{"d":"MEDIUM","q":"Which statement is true for every positive whole number n?","o":["Successor = n − 1","Predecessor = n + 1","Successor = n + 1","Successor = predecessor"],"a":2,"e":"For n greater than zero, successor is n + 1."},{"d":"HARD","q":"A number is 4,999. What is the successor of its predecessor?","o":["4,998","4,999","5,000","5,001"],"a":1,"e":"The predecessor of 4,999 is 4,998; its successor is 4,999."},{"d":"HARD","q":"The sum of a number and its successor is 41. What is the number?","o":["19","20","21","22"],"a":1,"e":"Let n be the number: n + (n + 1) = 41, so 2n = 40 and n = 20."},{"d":"HARD","q":"The difference between a number and its predecessor is 1. If the number is 10,000, what is its predecessor?","o":["9,999","10,000","10,001","9,990"],"a":0,"e":"10,000 − 1 = 9,999."},{"d":"HARD","q":"A number's predecessor is 10 less than 50. What is the number?","o":["39","40","41","50"],"a":2,"e":"The predecessor is 40, so the number is 41."},{"d":"HARD","q":"What is the sum of the successor of 999 and the predecessor of 1,001?","o":["1,998","1,999","2,000","2,001"],"a":2,"e":"The successor of 999 is 1,000 and predecessor of 1,001 is 1,000; sum = 2,000."},{"d":"HARD","q":"Three consecutive whole numbers add up to 72. What is the middle number?","o":["22","23","24","25"],"a":2,"e":"Three consecutive numbers centred at 24 are 23, 24, and 25; their sum is 72."},{"d":"HARD","q":"The successor of 10 times a number is 71. What is the number?","o":["6","7","8","9"],"a":1,"e":"10n + 1 = 71, so 10n = 70 and n = 7."},{"d":"HARD","q":"A number's predecessor is 78. What is the number?","o":["79","80","81","77"],"a":0,"e":"A number is one more than its predecessor: 78 + 1 = 79."},{"d":"HARD","q":"If the successor of n is 1,001, what is the predecessor of n?","o":["998","999","1,000","1,001"],"a":1,"e":"n = 1,000, so the predecessor of n is 999."},{"d":"HARD","q":"The successor of a whole number is 0. Is this possible?","o":["Yes, the number is 0","Yes, the number is 1","No, no whole number has successor 0","No, because 0 is not a whole number"],"a":2,"e":"Every whole number is at least 0, so its successor is at least 1."}];const originalQuestions=questions.slice();let index=0,selected=-1,locked=false,xp=0,correct=0;const mistakes=[];const $=id=>document.getElementById(id);function progress(){const p=Math.round(index/questions.length*100);$('fill').style.width=p+'%';$('percent').textContent=p+'%';$('progressText').textContent='Question '+Math.min(index+1,questions.length)+' of '+questions.length;document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',p)}
function render(){const q=questions[index];selected=-1;locked=false;$('qmeta').textContent='QUESTION '+(index+1)+' · '+q.d;$('question').textContent=q.q;$('options').innerHTML=q.o.map((v,i)=>'<button class="option" type="button" data-i="'+i+'"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+v+'</span></button>').join('');$('options').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('options').querySelectorAll('.option').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('check').disabled=false}));$('feedback').className='feedback';$('feedback').textContent='';$('check').style.display='block';$('check').disabled=true;$('continue').className='btn continue';progress()}
function check(){if(selected<0||locked)return;locked=true;const q=questions[index],good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent=xp}else mistakes.push({q:q.q,chosen:q.o[selected],answer:q.o[q.a],why:q.e});$('options').querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong')});$('feedback').textContent=(good?'✓ Correct! ':'Review this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('check').style.display='none';$('continue').className='btn continue show';$('continue').textContent=index===questions.length-1?'See results →':'Continue →'}
function finish(){progress();$('quiz').style.display='none';const slot=$('finishSlot');slot.innerHTML='<section class="finish"><div class="trophy">🏆</div><h2>'+(correct>=25?'Excellent work!':correct>=18?'Good progress!':'Keep practising!')+'</h2><div class="score">'+correct+' / '+questions.length+'</div><p class="muted">You answered '+correct+' correctly and earned '+xp+' XP.</p><p><b>'+Math.round(correct/questions.length*100)+'%</b> accuracy</p><div class="review">'+(mistakes.length?'<h3>Review your mistakes ('+mistakes.length+')</h3>':'<h3>Perfect round!</h3>')+mistakes.map((m,i)=>'<div class="review-item"><b>'+(i+1)+'. '+m.q+'</b><p class="your-answer">Your answer: '+m.chosen+'</p><p class="correct-answer">Correct answer: '+m.answer+'</p><p>'+m.why+'</p></div>').join('')+'</div><div class="review-actions"><button class="btn" id="retryWrong" '+(mistakes.length?'':'disabled')+'>Retry mistakes</button><button class="btn" id="retryAll">Retry all</button></div></section>';$('retryWrong').addEventListener('click',()=>restart(true));$('retryAll').addEventListener('click',()=>restart(false))}
function restart(wrongOnly){const next=wrongOnly?originalQuestions.filter(q=>mistakes.some(m=>m.q===q.q)):originalQuestions.slice();questions.splice(0,questions.length,...next);index=0;selected=-1;locked=false;xp=0;correct=0;mistakes.length=0;$('xp').textContent='0';$('quiz').style.display='block';$('finishSlot').innerHTML='';render()}
$('check').addEventListener('click',check);$('continue').addEventListener('click',()=>{index++;if(index<questions.length)render();else finish()});render()})();
</script></body></html>
