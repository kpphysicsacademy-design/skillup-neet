<script>(function(){'use strict';const originalQuestions=[{"d":"BASIC","q":"A cuboid has length 5 cm, breadth 3 cm and height 2 cm. What is its total surface area?","o":["31 cm²","62 cm²","30 cm²","60 cm²"],"a":1,"why":"TSA = 2(lb + bh + hl) = 2(15 + 6 + 10) = 62 cm²."},{"d":"BASIC","q":"The total surface area of a cuboid is given by:","o":["lb + bh + hl","2(lb + bh + hl)","l × b × h","2h(l + b)"],"a":1,"why":"A cuboid has three pairs of equal rectangular faces, so TSA = 2(lb + bh + hl)."},{"d":"BASIC","q":"The curved surface area of a cylinder is:","o":["πr²","2πrh","2πr(r + h)","πr²h"],"a":1,"why":"CSA = circumference of base × height = 2πr × h."},{"d":"BASIC","q":"The total surface area of a closed cylinder is:","o":["2πrh","πr(r + h)","2πr(r + h)","πr²h"],"a":2,"why":"TSA = curved area + two circular ends = 2πrh + 2πr² = 2πr(r + h)."},{"d":"BASIC","q":"A cuboid has dimensions 4 cm × 3 cm × 2 cm. Its lateral surface area is:","o":["24 cm²","28 cm²","52 cm²","48 cm²"],"a":1,"why":"LSA = 2h(l + b) = 2 × 2 × (4 + 3) = 28 cm²."},{"d":"BASIC","q":"A cylinder has radius 7 cm and height 10 cm. Its curved surface area using π = 22/7 is:","o":["220 cm²","440 cm²","616 cm²","748 cm²"],"a":1,"why":"CSA = 2πrh = 2 × 22/7 × 7 × 10 = 440 cm²."},{"d":"BASIC","q":"A cylinder has radius 3 cm. The area of one circular base is:","o":["3π cm²","6π cm²","9π cm²","12π cm²"],"a":2,"why":"Base area = πr² = π × 3² = 9π cm²."},{"d":"BASIC","q":"Which measurement is needed to calculate the TSA of a cuboid?","o":["Only length","Only height","Length, breadth and height","Only diagonal"],"a":2,"why":"TSA = 2(lb + bh + hl), so all three dimensions are needed."},{"d":"BASIC","q":"A cylinder is open at the top. Its surface area consists of:","o":["CSA only","CSA + one base","CSA + two bases","Two bases only"],"a":1,"why":"An open-top cylinder has one circular base and the curved surface."},{"d":"BASIC","q":"Surface area is measured in:","o":["cm","cm²","cm³","litres"],"a":1,"why":"Surface area is a two-dimensional measure and is expressed in square units."},{"d":"MEDIUM","q":"Find the TSA of a cuboid measuring 8 cm × 5 cm × 3 cm.","o":["79 cm²","158 cm²","120 cm²","240 cm²"],"a":1,"why":"TSA = 2(8×5 + 5×3 + 8×3) = 2(40 + 15 + 24) = 158 cm²."},{"d":"MEDIUM","q":"Find the LSA of a cuboid with length 9 cm, breadth 4 cm and height 6 cm.","o":["78 cm²","108 cm²","156 cm²","216 cm²"],"a":2,"why":"LSA = 2h(l + b) = 2×6×(9 + 4) = 156 cm². Correct answer is 156 cm²."},{"d":"MEDIUM","q":"A cylinder has radius 3.5 cm and height 8 cm. Find its CSA using π = 22/7.","o":["88 cm²","176 cm²","264 cm²","352 cm²"],"a":1,"why":"CSA = 2×22/7×3.5×8 = 176 cm²."},{"d":"MEDIUM","q":"A cylinder has radius 7 cm and height 5 cm. Find its TSA using π = 22/7.","o":["440 cm²","528 cm²","616 cm²","748 cm²"],"a":1,"why":"TSA = 2πr(r+h) = 2×22/7×7×12 = 528 cm²."},{"d":"MEDIUM","q":"A cuboid has TSA 94 cm², length 5 cm and breadth 4 cm. Find its height.","o":["2 cm","3 cm","4 cm","5 cm"],"a":1,"why":"94 = 2(20 + 4h + 5h) = 40 + 18h, so h = 3 cm."},{"d":"MEDIUM","q":"The diameter of a cylinder is 14 cm and its height is 12 cm. Its CSA using π = 22/7 is:","o":["264 cm²","440 cm²","528 cm²","616 cm²"],"a":2,"why":"Radius = 7 cm. CSA = 2×22/7×7×12 = 528 cm²."},{"d":"MEDIUM","q":"A cuboid has dimensions 10 cm, 6 cm and 4 cm. What is its LSA if the base is 10 cm × 6 cm?","o":["64 cm²","128 cm²","248 cm²","296 cm²"],"a":1,"why":"LSA = perimeter of base × height = 2(10+6)×4 = 128 cm²."},{"d":"MEDIUM","q":"A closed cylinder has radius 5 cm and height 10 cm. Its TSA is:","o":["100π cm²","125π cm²","150π cm²","200π cm²"],"a":2,"why":"TSA = 2πr(r+h) = 2π×5×15 = 150π cm²."},{"d":"MEDIUM","q":"If the radius of a cylinder is doubled and height stays the same, its curved surface area:","o":["Remains same","Doubles","Becomes four times","Becomes eight times"],"a":1,"why":"CSA = 2πrh; it is directly proportional to radius when h is fixed."},{"d":"MEDIUM","q":"A cuboid has length 12 cm, breadth 8 cm and height 5 cm. Find its TSA.","o":["296 cm²","392 cm²","480 cm²","520 cm²"],"a":1,"why":"TSA = 2(96 + 40 + 60) = 392 cm²."},{"d":"HARD","q":"A cuboid has TSA 236 cm². Its length is 8 cm, breadth is 5 cm. Find its height.","o":["3 cm","4 cm","5 cm","6 cm"],"a":3,"why":"236 = 2(40 + 5h + 8h) = 80 + 26h; 26h = 156, so h = 6 cm."},{"d":"HARD","q":"A closed cylinder has radius 7 cm and height 13 cm. Find its TSA using π = 22/7.","o":["616 cm²","770 cm²","880 cm²","1,100 cm²"],"a":2,"why":"TSA = 2×22/7×7×(7+13) = 880 cm²."},{"d":"HARD","q":"A cuboid is 15 cm long, 10 cm wide and 6 cm high. It is painted on all outside faces. Find the painted area.","o":["300 cm²","480 cm²","600 cm²","660 cm²"],"a":2,"why":"TSA = 2(15×10 + 10×6 + 15×6) = 2(150+60+90) = 600 cm²."},{"d":"HARD","q":"A cylindrical label covers only the curved surface of a can of radius 3.5 cm and height 20 cm. Find the label area using π = 22/7.","o":["220 cm²","330 cm²","440 cm²","550 cm²"],"a":2,"why":"Label area = CSA = 2×22/7×3.5×20 = 440 cm²."},{"d":"HARD","q":"A cylinder has TSA 704 cm² and radius 7 cm. Using π = 22/7, find its height.","o":["7 cm","8 cm","9 cm","10 cm"],"a":2,"why":"704 = 44(7+h); 7+h=16, so h=9 cm."},{"d":"HARD","q":"A cuboid has dimensions 12 cm × 9 cm × 4 cm. Find the difference between TSA and LSA.","o":["108 cm²","216 cm²","240 cm²","288 cm²"],"a":1,"why":"TSA − LSA = 2lb = 2×12×9 = 216 cm² (the two base faces)."},{"d":"HARD","q":"A cylindrical tank has radius 14 cm and height 30 cm. Find its curved surface area using π = 22/7.","o":["1,320 cm²","2,640 cm²","3,080 cm²","3,520 cm²"],"a":1,"why":"CSA = 2×22/7×14×30 = 2,640 cm²."},{"d":"HARD","q":"A cuboid has TSA 376 cm², length 10 cm and breadth 8 cm. Find its height.","o":["4 cm","5 cm","6 cm","7 cm"],"a":2,"why":"376 = 2(80 + 8h + 10h) = 160 + 36h, so h = 6 cm."},{"d":"HARD","q":"The radius of a cylinder is reduced to half while its height is doubled. Its CSA becomes:","o":["Same as before","Half","Double","Four times"],"a":0,"why":"CSA is proportional to r×h. New product = (r/2)×(2h) = rh, so CSA is unchanged."},{"d":"HARD","q":"A cuboid has length 7 cm, breadth 5 cm and height 3 cm. Find its TSA.","o":["121 cm²","142 cm²","151 cm²","162 cm²"],"a":1,"why":"TSA = 2(35 + 15 + 21) = 142 cm²."}];let questions=originalQuestions.slice(),index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];const $=id=>document.getElementById(id);
function render(){chosen=null;locked=false;const item=questions[index];$('progressText').textContent='Question '+(index+1)+' of '+questions.length;$('percent').textContent=Math.round(index/questions.length*100)+'%';$('fill').style.width=(index/questions.length*100)+'%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));$('qmeta').textContent=item.d+' · QUESTION '+(index+1);$('question').textContent=item.q;$('feedback').className='feedback';$('feedback').textContent='';$('check').style.display='block';$('check').disabled=true;$('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';$('options').replaceChildren();item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});}
$('check').addEventListener('click',()=>{if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});const feedback=$('feedback');if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}$('check').style.display='none';$('continue').className='btn continue show';});
$('continue').addEventListener('click',()=>{if(!locked)return;index++;if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}$('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';card.innerHTML='<div class="trophy">🏆</div><h2>Surface Area Practice Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+score*10+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button>';const review=card.querySelector('#wrongReview');if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}$('finishSlot').replaceChildren(card);function reset(onlyWrong){if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}else questions.splice(0,questions.length,...originalQuestions);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});}$('retry').addEventListener('click',()=>reset(false));$('retryWrong').addEventListener('click',()=>reset(true));});
