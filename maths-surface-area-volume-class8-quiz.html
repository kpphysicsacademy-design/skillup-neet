(function(){'use strict';const questions=[{"d":"BASIC","q":"The volume of a cuboid is:","o":["l+b+h","2(lb+bh+hl)","l×b×h","l×b"],"a":2,"e":"Volume of a cuboid equals length × breadth × height."},{"d":"BASIC","q":"The volume of a cube with side 4 cm is:","o":["16 cm³","32 cm³","64 cm³","96 cm³"],"a":2,"e":"Volume=s³=4³=64 cm³."},{"d":"BASIC","q":"The total surface area of a cube with side a is:","o":["a²","4a²","6a²","a³"],"a":2,"e":"A cube has six square faces, each of area a²."},{"d":"BASIC","q":"The volume of a cuboid measuring 5 cm × 3 cm × 2 cm is:","o":["10 cm³","15 cm³","30 cm³","60 cm³"],"a":2,"e":"Volume=5×3×2=30 cm³."},{"d":"BASIC","q":"Which unit is used for volume?","o":["cm","cm²","cm³","degrees"],"a":2,"e":"Volume is measured in cubic units."},{"d":"BASIC","q":"A cuboid has length 6 cm, breadth 4 cm and height 3 cm. Its volume is:","o":["13 cm³","24 cm³","72 cm³","144 cm³"],"a":2,"e":"Volume=6×4×3=72 cm³."},{"d":"BASIC","q":"A cube has side 5 cm. Its lateral surface area is:","o":["25 cm²","100 cm²","125 cm²","150 cm²"],"a":1,"e":"Lateral surface area of a cube=4a²=4×25=100 cm²."},{"d":"BASIC","q":"The total surface area of a cuboid is:","o":["lb h","2(lb+bh+hl)","lb+bh+hl","4lbh"],"a":1,"e":"A cuboid has three pairs of equal rectangular faces."},{"d":"BASIC","q":"If each edge of a cube doubles, its volume becomes:","o":["2 times","4 times","6 times","8 times"],"a":3,"e":"Volume scales with the cube of side length: 2³=8."},{"d":"BASIC","q":"Which is the correct conversion?","o":["1 cm³ = 1,000 mL","1 cm³ = 1 mL","1 m³ = 1 cm³","1 L = 1 cm³"],"a":1,"e":"One cubic centimetre is equal to one millilitre."},{"d":"MEDIUM","q":"Find the total surface area of a cube of side 6 cm.","o":["36 cm²","144 cm²","216 cm²","256 cm²"],"a":2,"e":"TSA=6a²=6×36=216 cm²."},{"d":"MEDIUM","q":"A cuboid is 8 cm long, 5 cm wide and 3 cm high. Find its total surface area.","o":["120 cm²","158 cm²","240 cm²","79 cm²"],"a":1,"e":"TSA=2(8×5+5×3+8×3)=2(40+15+24)=158 cm²."},{"d":"MEDIUM","q":"A cube has volume 125 cm³. Its edge length is:","o":["3 cm","5 cm","25 cm","125 cm"],"a":1,"e":"Side=∛125=5 cm."},{"d":"MEDIUM","q":"A cuboid has volume 240 cm³, length 10 cm and breadth 6 cm. Its height is:","o":["2 cm","4 cm","6 cm","8 cm"],"a":1,"e":"Height=240÷(10×6)=4 cm."},{"d":"MEDIUM","q":"The lateral surface area of a cuboid with l=7 cm, b=4 cm and h=5 cm is:","o":["28 cm²","70 cm²","110 cm²","140 cm²"],"a":2,"e":"LSA=2h(l+b)=2×5×(7+4)=110 cm². Correct answer is 110 cm²."},{"d":"MEDIUM","q":"A cube has side 3 cm. Its total surface area is:","o":["9 cm²","27 cm²","54 cm²","81 cm²"],"a":2,"e":"TSA=6×3²=54 cm²."},{"d":"MEDIUM","q":"A box has dimensions 12 cm × 8 cm × 5 cm. Its volume is:","o":["25 cm³","96 cm³","240 cm³","480 cm³"],"a":3,"e":"Volume=12×8×5=480 cm³. Correct option is 480 cm³."},{"d":"MEDIUM","q":"A cuboid has dimensions 4 m × 3 m × 2 m. Its volume is:","o":["9 m³","12 m³","24 m³","48 m³"],"a":2,"e":"Volume=4×3×2=24 m³."},{"d":"MEDIUM","q":"If the edge of a cube is tripled, its total surface area becomes:","o":["3 times","6 times","9 times","27 times"],"a":2,"e":"Surface area scales with the square of edge length: 3²=9."},{"d":"MEDIUM","q":"How many 1 cm³ cubes fit in a cuboid of dimensions 4 cm × 3 cm × 2 cm?","o":["9","12","24","36"],"a":2,"e":"The number of unit cubes equals volume: 4×3×2=24."},{"d":"HARD","q":"A cube has total surface area 384 cm². Its edge length is:","o":["4 cm","6 cm","8 cm","12 cm"],"a":2,"e":"6a²=384 gives a²=64 and a=8 cm."},{"d":"HARD","q":"A cuboid's length, breadth and height are 10 cm, 6 cm and 4 cm. Find its total surface area.","o":["120 cm²","164 cm²","248 cm²","240 cm²"],"a":2,"e":"TSA=2(60+24+40)=248 cm²."},{"d":"HARD","q":"A cube's volume is 729 cm³. Its total surface area is:","o":["81 cm²","243 cm²","486 cm²","729 cm²"],"a":2,"e":"Side=∛729=9 cm; TSA=6×81=486 cm²."},{"d":"HARD","q":"A tank is 2 m long, 1.5 m wide and 1 m high. Its capacity in litres is:","o":["300 L","1,500 L","3,000 L","30,000 L" </div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Use the difference-of-squares identity</strong><small>Recognise and simplify equivalent algebraic forms</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply identities accurately to expressions</strong><small>Reason about perfect squares and nearest squares</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
