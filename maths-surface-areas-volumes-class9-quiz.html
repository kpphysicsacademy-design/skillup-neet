<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"The volume of a cuboid with length l, breadth b and height h is:","o":["lb+bh+hl","lbh","2(lb+bh+hl)","2(l+b)h"],"a":1,"e":"Volume of a cuboid = length × breadth × height."},{"d":"BASIC","q":"Find the volume of a cube of side 4 cm.","o":["16 cm³","32 cm³","64 cm³","96 cm³"],"a":2,"e":"Volume = a³ = 4³ = 64 cm³."},{"d":"BASIC","q":"The total surface area of a cube of side a is:","o":["a³","4a²","6a²","12a"],"a":2,"e":"A cube has six equal square faces, each of area a²."},{"d":"BASIC","q":"The curved surface area of a cylinder is:","o":["πr²h","2πrh","2πr(r+h)","πrh²"],"a":1,"e":"Curved surface area of a cylinder = 2πrh."},{"d":"BASIC","q":"The volume of a cylinder of radius r and height h is:","o":["2πrh","πr²h","2πr(r+h)","πrh"],"a":1,"e":"Volume = area of circular base × height = πr²h."},{"d":"BASIC","q":"A cuboid measures 5 cm × 3 cm × 2 cm. Its volume is:","o":["10 cm³","15 cm³","30 cm³","60 cm³"],"a":2,"e":"Volume=5×3×2=30 cm³."},{"d":"BASIC","q":"The volume of a sphere of radius r is:","o":["4πr²","πr²h","(4/3)πr³","2πr"],"a":2,"e":"Sphere volume = (4/3)πr³."},{"d":"BASIC","q":"The total surface area of a sphere of radius r is:","o":["4πr²","(4/3)πr³","πr²","2πr²"],"a":0,"e":"Sphere surface area = 4πr²."},{"d":"BASIC","q":"The volume of a cone with radius r and height h is:","o":["πr²h","(1/3)πr²h","2πrh","πrl"],"a":1,"e":"Cone volume is one-third of the volume of a cylinder with the same base and height."},{"d":"BASIC","q":"Which unit is appropriate for volume?","o":["cm","cm²","cm³","cm/s"],"a":2,"e":"Volume is measured in cubic units."},{"d":"MEDIUM","q":"Find the total surface area of a cube of side 5 cm.","o":["25 cm²","100 cm²","125 cm²","150 cm²"],"a":3,"e":"TSA=6a²=6×25=150 cm²."},{"d":"MEDIUM","q":"A cuboid has length 8 cm, breadth 5 cm and height 3 cm. Find its total surface area.","o":["120 cm²","158 cm²","184 cm²","240 cm²"],"a":1,"e":"TSA=2(lb+bh+hl)=2(40+15+24)=158 cm²."},{"d":"MEDIUM","q":"A cylinder has radius 7 cm and height 10 cm. Find its volume using π=22/7.","o":["440 cm³","1,540 cm³","2,200 cm³","3,080 cm³"],"a":1,"e":"V=πr²h=(22/7)×49×10=1,540 cm³."},{"d":"MEDIUM","q":"Find the curved surface area of a cylinder with radius 3 cm and height 7 cm.","o":["21π cm²","42π cm²","63π cm²","84π cm²"],"a":1,"e":"CSA=2πrh=2π×3×7=42π cm²."},{"d":"MEDIUM","q":"A cone has radius 3 cm and height 4 cm. Its volume is:","o":["12π cm³","16π cm³","24π cm³","36π cm³"],"a":0,"e":"V=(1/3)π×3²×4=12π cm³. Correct option is 12π cm³."},{"d":"MEDIUM","q":"A sphere has radius 3 cm. Its surface area is:","o":["9π cm²","18π cm²","36π cm²","108π cm²"],"a":2,"e":"SA=4πr²=4π×9=36π cm²."},{"d":"MEDIUM","q":"A cube has volume 216 cm³. Find its side length.","o":["4 cm","5 cm","6 cm","8 cm"],"a":2,"e":"Side³=216, so side=6 cm."},{"d":"MEDIUM","q":"A cuboid has dimensions 10 cm, 4 cm and 2 cm. Find its volume.","o":["16 cm³","40 cm³","80 cm³","160 cm³"],"a":2,"e":"Volume=10×4×2=80 cm³."},{"d":"MEDIUM","q":"A cylinder has diameter 14 cm and height 5 cm. Its volume using π=22/7 is:","o":["770 cm³","1,100 cm³","1,540 cm³","2,200 cm³"],"a":0,"e":"r=7 cm; V=(22/7)×49×5=770 cm³."},{"d":"MEDIUM","q":"A cone and a cylinder have the same base radius and height. The cone's volume is what fraction of the cylinder's volume?","o":["1/2","1/3","2/3","3"],"a":1,"e":"Cone volume=(1/3)πr²h, while cylinder volume=πr²h."},{"d":"HARD","q":"A cylinder has radius 7 cm and height 12 cm. Find its total surface area using π=22/7.","o":["528 cm²","616 cm²","836 cm²","968 cm²"],"a":2,"e":"TSA=2πr(r+h)=2×22/7×7×19=836 cm²."},{"d":"HARD","q":"A cuboid has total surface area 214 cm², length 7 cm and breadth 5 cm. Find its height.","o":["3 cm","4 cm","5 cm","6 cm"],"a":3,"e":"214=2(35+5h+7h)=70+24h, so h=6 cm. Correct option is 6 cm."},{"d":"HARD","q":"A sphere has volume 288π cm³. Find its radius.","o":["4 cm","5 cm","6 cm","8 cm"],"a":2,"e":"(4/3)πr³=288π, so r³=216 and r=6 cm."},{"d":"HARD","q":"A cone has radius 6 cm and height 8 cm. Find its volume.","o":["48π cm³","72π cm³","96π cm³","288π cm³"],"a":2,"e":"V=(1/3)π×36×8=96π cm³."},{"d":"HARD","q":"A cylinder's radius is doubled while its height stays the same. Its volume becomes:","o":["2 times","3 times","4 times","8 times"],"a":2,"e":"Volume depends on r²; doubling radius multiplies volume by 2²=4."},{"d":"HARD","q":"A cuboid is 12 cm long, 8 cm wide and 5 cm high. Find its total surface area.","o":["296 cm²","392 cm²","480 cm²","520 cm²"],"a":0,"e":"TSA=2(96+40+60)=392 cm². Correct option is 392 cm²."},{"d":"HARD","q":"A solid sphere has radius 7 cm. Find its volume using π=22/7.","o":["296 cm²","392 cm²","480 cm²","520 cm²"],"a":1,"e":"V=(4/3)×(22/7)×343=1,437⅓ cm³."},{"d":"HARD","q":"A cylindrical tank has radius 3 m and height 4 m. What is its capacity in cubic metres?","o":["12π m³","24π m³","36π m³","48π m³"],"a":2,"e":"V=π×3²×4=36π m³."},{"d":"HARD","q":"A cone has volume 100π cm³ and base radius 5 cm. Find its height.","o":["4 cm","8 cm","10 cm","12 cm"],"a":3,"e":"100π=(1/3)π×25×h, so h=12 cm. Correct option is 12 cm."},{"d":"HARD","q":"A cube's side length increases from 2 cm to 4 cm. By what factor does its volume increase?","o":["2","4","6","8"],"a":3,"e":"Volume scales with the cube of side length; doubling side multiplies volume by 2³=8."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Calculate solid volumes</strong><small>Use solid geometry formulas</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Calculate surface areas</strong><small>Work with cylinders, cones and spheres</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve mensuration problems</strong><small>Convert dimensions into formula values</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
