<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261013-tax-and-bills-duolingo-v1"><title>Tax and Bills | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"A notebook costs ₹100 before 5% sales tax. How much tax is added?","o":["₹5","₹10","₹15","₹95"],"a":0,"e":"Tax = 5% of ₹100 = ₹5.","v":"tax-and-bills"},{"d":"BASIC","q":"A toy costs ₹400 before 10% tax. What is the final bill?","o":["₹410","₹440","₹400","₹480"],"a":1,"e":"10% of ₹400 is ₹40, so total = ₹440.","v":"tax-and-bills"},{"d":"BASIC","q":"A meal bill is ₹800 before 5% tax. Find the total including tax.","o":["₹820","₹805","₹840","₹880"],"a":2,"e":"Tax = ₹40; total bill = ₹800 + ₹40 = ₹840.","v":"tax-and-bills"},{"d":"BASIC","q":"A bill shows ₹60 tax on a taxable amount of ₹600. What is the tax rate?","o":["15%","6%","12%","10%"],"a":3,"e":"(₹60 ÷ ₹600) × 100 = 10%.","v":"tax-and-bills"},{"d":"BASIC","q":"A pen costs ₹50 and a ruler costs ₹30. What is their total before tax?","o":["₹80","₹70","₹90","₹100"],"a":0,"e":"₹50 + ₹30 = ₹80.","v":"tax-and-bills"},{"d":"BASIC","q":"A ₹200 item has 18% tax. How much is the total price?","o":["₹218","₹236","₹230","₹240"],"a":1,"e":"Tax = 0.18 × ₹200 = ₹36; total = ₹236.","v":"tax-and-bills"},{"d":"BASIC","q":"A bill is ₹1,000 before tax. The tax is 0%. What is the total?","o":["₹1,100","₹0","₹1,000","₹900"],"a":2,"e":"With a 0% tax, no extra amount is added.","v":"tax-and-bills"},{"d":"BASIC","q":"Three items cost ₹25 each. What is the subtotal before tax?","o":["₹100","₹50","₹65","₹75"],"a":3,"e":"3 × ₹25 = ₹75.","v":"tax-and-bills"},{"d":"BASIC","q":"A service costs ₹500 before 12% tax. What is the tax amount?","o":["₹60","₹50","₹72","₹112"],"a":0,"e":"12% of ₹500 = ₹60.","v":"tax-and-bills"},{"d":"BASIC","q":"A customer pays ₹550 for an item priced ₹500 before tax. What amount of tax was paid?","o":["₹55","₹50","₹45","₹100"],"a":1,"e":"Tax paid = total − pre-tax price = ₹550 − ₹500 = ₹50.","v":"tax-and-bills"},{"d":"MEDIUM","q":"A bill has items costing ₹250 and ₹350. If 8% tax applies to the whole subtotal, what is the total?","o":["₹640","₹600","₹648","₹658"],"a":2,"e":"Subtotal = ₹600; tax = ₹48; total = ₹648.","v":"tax-and-bills"},{"d":"MEDIUM","q":"A taxable purchase totals ₹1,200 before tax. At 7.5% tax, what is the tax amount?","o":["₹120","₹75","₹80","₹90"],"a":3,"e":"0.075 × ₹1,200 = ₹90.","v":"tax-and-bills"},{"d":"MEDIUM","q":"A bill is ₹1,770 including 18% tax. What was the price before tax?","o":["₹1,500","₹1,450","₹1,600","₹1,550"],"a":0,"e":"Including 18% tax means total = 1.18 × base; ₹1,770 ÷ 1.18 = ₹1,500.","v":"tax-and-bills"},{"d":"MEDIUM","q":"An invoice lists goods at ₹900 and delivery at ₹100. Tax of 10% applies to both. Find the total bill.","o":["₹1,000","₹1,100","₹1,090","₹1,200"],"a":1,"e":"Taxable subtotal = ₹1,000; tax = ₹100; total = ₹1,100.","v":"tax-and-bills"},{"d":"MEDIUM","q":"A restaurant bill is ₹1,250 before 5% tax. The customer pays ₹1,400. How much more than the bill was paid?","o":["₹75","₹62.50","₹87.50","₹100"],"a":2,"e":"Bill including tax = ₹1,312.50; extra paid = ₹1,400 − ₹1,312.50 = ₹87.50.","v":"tax-and-bills"},{"d":"MEDIUM","q":"A bill total is ₹2,240 after adding 12% tax. What was the tax amount?","o":["₹200","₹224","₹268.80","₹240"],"a":3,"e":"Base = ₹2,240 ÷ 1.12 = ₹2,000; tax = ₹240.","v":"tax-and-bills"},{"d":"MEDIUM","q":"A family buys groceries for ₹1,800 and household supplies for ₹700. Tax at 4% applies to the full amount. Find the total.","o":["₹2,600","₹2,500","₹2,580","₹2,700"],"a":0,"e":"Subtotal = ₹2,500; tax = ₹100; total = ₹2,600.","v":"tax-and-bills"},{"d":"MEDIUM","q":"A bill has ₹400 taxed at 5% and ₹600 taxed at 10%. What is the total tax?","o":["₹100","₹80","₹60","₹50"],"a":1,"e":"Tax amounts are ₹20 and ₹60; combined tax = ₹80.","v":"tax-and-bills"},{"d":"MEDIUM","q":"An item costs ₹2,360 including 18% tax. How much tax is included?","o":["₹300","₹424.80","₹360","₹400"],"a":2,"e":"Pre-tax price = ₹2,360 ÷ 1.18 = ₹2,000; tax = ₹360.","v":"tax-and-bills"},{"d":"MEDIUM","q":"A bill subtotal is ₹750. A coupon reduces it by ₹50 before 10% tax. What is the amount payable?","o":["₹825","₹775","₹700","₹770"],"a":3,"e":"Taxable amount = ₹700; tax = ₹70; payable = ₹770.","v":"tax-and-bills"},{"d":"HARD","q":"An invoice has ₹1,500 taxed at 5% and ₹2,000 taxed at 18%. What is the total including both taxes?","o":["₹3,935","₹3,900","₹4,050","₹4,100"],"a":0,"e":"Taxes are ₹75 and ₹360; total = ₹1,500 + ₹2,000 + ₹75 + ₹360 = ₹3,935.","v":"tax-and-bills"},{"d":"HARD","q":"A total bill of ₹2,360 includes 18% tax. What is the price before tax?","o":["₹1,950","₹2,000","₹2,100","₹2,120"],"a":1,"e":"₹2,360 ÷ 1.18 = ₹2,000.","v":"tax-and-bills"},{"d":"HARD","q":"A store bill has ₹2,400 of taxable goods and ₹300 of non-taxable goods. Tax is 5% on taxable goods only. Find the total.","o":["₹2,700","₹2,835","₹2,820","₹2,850"],"a":2,"e":"Tax = 5% of ₹2,400 = ₹120; total = ₹2,400 + ₹300 + ₹120 = ₹2,820.","v":"tax-and-bills"},{"d":"HARD","q":"A bill has a subtotal of ₹3,000. A 10% discount is applied first, then 18% tax on the discounted amount. What is the final bill?","o":["₹3,186.50","₹3,240","₹3,000","₹3,186"],"a":3,"e":"Discounted subtotal = ₹2,700; tax = ₹486; total = ₹3,186.","v":"tax-and-bills"},{"d":"HARD","q":"A customer pays ₹1,416 for goods after 18% tax. If all goods are taxed at that rate, what was the pre-tax subtotal?","o":["₹1,200","₹1,250","₹1,300","₹1,180"],"a":0,"e":"Pre-tax subtotal = ₹1,416 ÷ 1.18 = ₹1,200.","v":"tax-and-bills"},{"d":"HARD","q":"A bill has 3 items at ₹450 each and 2 items at ₹275 each. Tax of 8% applies to all items. Find the total.","o":["₹2,300","₹2,052","₹2,460","₹2,500"],"a":1,"e":"Subtotal = ₹1,350 + ₹550 = ₹1,900; tax = ₹152; total = ₹2,052.","v":"tax-and-bills"},{"d":"HARD","q":"An invoice total is ₹5,600 including 12% tax. Find the tax amount included in the total.","o":["₹560","₹672","₹600","₹500"],"a":2,"e":"Base = ₹5,600 ÷ 1.12 = ₹5,000; tax = ₹600.","v":"tax-and-bills"},{"d":"HARD","q":"A taxable subtotal is ₹4,800. A 5% tax is charged, and then a fixed delivery fee of ₹120 is added. What is the payable total?","o":["₹5,120","₹5,040","₹5,280","₹5,160"],"a":3,"e":"Tax = ₹240; total = ₹4,800 + ₹240 + ₹120 = ₹5,160.","v":"tax-and-bills"},{"d":"HARD","q":"A bill shows ₹180 tax at a rate of 6%. What is the taxable subtotal?","o":["₹3,000","₹2,800","₹3,200","₹2,500"],"a":0,"e":"Subtotal = ₹180 ÷ 0.06 = ₹3,000.","v":"tax-and-bills"},{"d":"HARD","q":"A store sells goods worth ₹2,500 before tax. It applies a 20% discount, then 5% tax. What is the final amount?","o":["₹2,000","₹2,100","₹2,125","₹2,250"],"a":1,"e":"After discount: ₹2,000; 5% tax is ₹100; final amount = ₹2,100.","v":"tax-and-bills"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Calculate tax and bills</strong><small>Tax rates and bill calculations</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Subtotal, tax and final price</strong><small>Multi-step invoice and tax applications</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply percentages to real-life situations</strong><small>Reason about perfect squares and nearest squares</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
