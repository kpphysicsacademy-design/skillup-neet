<div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div>

<script>
(function(){
'use strict';
const questions=[{"q":"A notebook costs ₹100 before 5% sales tax. How much tax is added?","o":["₹5","₹10","₹15","₹95"],"a":0,"why":"Tax = 5% of ₹100 = ₹5."},{"q":"A toy costs ₹400 before 10% tax. What is the final bill?","o":["₹410","₹440","₹400","₹480"],"a":1,"why":"10% of ₹400 is ₹40, so total = ₹440."},{"q":"A meal bill is ₹800 before 5% tax. Find the total including tax.","o":["₹820","₹805","₹840","₹880"],"a":2,"why":"Tax = ₹40; total bill = ₹800 + ₹40 = ₹840."},{"q":"A bill shows ₹60 tax on a taxable amount of ₹600. What is the tax rate?","o":["15%","6%","12%","10%"],"a":3,"why":"(₹60 ÷ ₹600) × 100 = 10%."},{"q":"A pen costs ₹50 and a ruler costs ₹30. What is their total before tax?","o":["₹80","₹70","₹90","₹100"],"a":0,"why":"₹50 + ₹30 = ₹80."},{"q":"A ₹200 item has 18% tax. How much is the total price?","o":["₹218","₹236","₹230","₹240"],"a":1,"why":"Tax = 0.18 × ₹200 = ₹36; total = ₹236."},{"q":"A bill is ₹1,000 before tax. The tax is 0%. What is the total?","o":["₹1,100","₹0","₹1,000","₹900"],"a":2,"why":"With a 0% tax, no extra amount is added."},{"q":"Three items cost ₹25 each. What is the subtotal before tax?","o":["₹100","₹50","₹65","₹75"],"a":3,"why":"3 × ₹25 = ₹75."},{"q":"A service costs ₹500 before 12% tax. What is the tax amount?","o":["₹60","₹50","₹72","₹112"],"a":0,"why":"12% of ₹500 = ₹60."},{"q":"A customer pays ₹550 for an item priced ₹500 before tax. What amount of tax was paid?","o":["₹55","₹50","₹45","₹100"],"a":1,"why":"Tax paid = total − pre-tax price = ₹550 − ₹500 = ₹50."},{"q":"A bill has items costing ₹250 and ₹350. If 8% tax applies to the whole subtotal, what is the total?","o":["₹640","₹600","₹648","₹658"],"a":2,"why":"Subtotal = ₹600; tax = ₹48; total = ₹648."},{"q":"A taxable purchase totals ₹1,200 before tax. At 7.5% tax, what is the tax amount?","o":["₹120","₹75","₹80","₹90"],"a":3,"why":"0.075 × ₹1,200 = ₹90."},{"q":"A bill is ₹1,770 including 18% tax. What was the price before tax?","o":["₹1,500","₹1,450","₹1,600","₹1,550"],"a":0,"why":"Including 18% tax means total = 1.18 × base; ₹1,770 ÷ 1.18 = ₹1,500."},{"q":"An invoice lists goods at ₹900 and delivery at ₹100. Tax of 10% applies to both. Find the total bill.","o":["₹1,000","₹1,100","₹1,090","₹1,200"],"a":1,"why":"Taxable subtotal = ₹1,000; tax = ₹100; total = ₹1,100."},{"q":"A restaurant bill is ₹1,250 before 5% tax. The customer pays ₹1,400. How much more than the bill was paid?","o":["₹75","₹62.50","₹87.50","₹100"],"a":2,"why":"Bill including tax = ₹1,312.50; extra paid = ₹1,400 − ₹1,312.50 = ₹87.50."},{"q":"A bill total is ₹2,240 after adding 12% tax. What was the tax amount?","o":["₹200","₹224","₹268.80","₹240"],"a":3,"why":"Base = ₹2,240 ÷ 1.12 = ₹2,000; tax = ₹240."},{"q":"A family buys groceries for ₹1,800 and household supplies for ₹700. Tax at 4% applies to the full amount. Find the total.","o":["₹2,600","₹2,500","₹2,580","₹2,700"],"a":0,"why":"Subtotal = ₹2,500; tax = ₹100; total = ₹2,600."},{"q":"A bill has ₹400 taxed at 5% and ₹600 taxed at 10%. What is the total tax?","o":["₹100","₹80","₹60","₹50"],"a":1,"why":"Tax amounts are ₹20 and ₹60; combined tax = ₹80."},{"q":"An item costs ₹2,360 including 18% tax. How much tax is included?","o":["₹300","₹424.80","₹360","₹400"],"a":2,"why":"Pre-tax price = ₹2,360 ÷ 1.18 = ₹2,000; tax = ₹360."},{"q":"A bill subtotal is ₹750. A coupon reduces it by ₹50 before 10% tax. What is the amount payable?","o":["₹825","₹775","₹700","₹770"],"a":3,"why":"Taxable amount = ₹700; tax = ₹70; payable = ₹770."},{"q":"An invoice has ₹1,500 taxed at 5% and ₹2,000 taxed at 18%. What is the total including both taxes?","o":["₹3,935","₹3,900","₹4,050","₹4,100"],"a":0,"why":"Taxes are ₹75 and ₹360; total = ₹1,500 + ₹2,000 + ₹75 + ₹360 = ₹3,935."},{"q":"A total bill of ₹2,360 includes 18% tax. What is the price before tax?","o":["₹1,950","₹2,000","₹2,100","₹2,120"],"a":1,"why":"₹2,360 ÷ 1.18 = ₹2,000."},{"q":"A store bill has ₹2,400 of taxable goods and ₹300 of non-taxable goods. Tax is 5% on taxable goods only. Find the total.","o":["₹2,700","₹2,835","₹2,820","₹2,850"],"a":2,"why":"Tax = 5% of ₹2,400 = ₹120; total = ₹2,400 + ₹300 + ₹120 = ₹2,820."},{"q":"A bill has a subtotal of ₹3,000. A 10% discount is applied first, then 18% tax on the discounted amount. What is the final bill?","o":["₹3,186.50","₹3,240","₹3,000","₹3,186"],"a":3,"why":"Discounted subtotal = ₹2,700; tax = ₹486; total = ₹3,186."},{"q":"A customer pays ₹1,416 for goods after 18% tax. If all goods are taxed at that rate, what was the pre-tax subtotal?","o":["₹1,200","₹1,250","₹1,300","₹1,180"],"a":0,"why":"Pre-tax subtotal = ₹1,416 ÷ 1.18 = ₹1,200."},{"q":"A bill has 3 items at ₹450 each and 2 items at ₹275 each. Tax of 8% applies to all items. Find the total.","o":["₹2,300","₹2,052","₹2,460","₹2,500"],"a":1,"why":"Subtotal = ₹1,350 + ₹550 = ₹1,900; tax = ₹152; total = ₹2,052."},{"q":"An invoice total is ₹5,600 including 12% tax. Find the tax amount included in the total.","o":["₹560","₹672","₹600","₹500"],"a":2,"why":"Base = ₹5,600 ÷ 1.12 = ₹5,000; tax = ₹600."},{"q":"A taxable subtotal is ₹4,800. A 5% tax is charged, and then a fixed delivery fee of ₹120 is added. What is the payable total?","o":["₹5,120","₹5,040","₹5,280","₹5,160"],"a":3,"why":"Tax = ₹240; total = ₹4,800 + ₹240 + ₹120 = ₹5,160."},{"q":"A bill shows ₹180 tax at a rate of 6%. What is the taxable subtotal?","o":["₹3,000","₹2,800","₹3,200","₹2,500"],"a":0,"why":"Subtotal = ₹180 ÷ 0.06 = ₹3,000."},{"q":"A store sells goods worth ₹2,500 before tax. It applies a 20% discount, then 5% tax. What is the final amount?","o":["₹2,000","₹2,100","₹2,125","₹2,250"],"a":1,"why":"After discount: ₹2,000; 5% tax is ₹100; final amount = ₹2,100."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Tax and Bills Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-tax-and-bills-large-numbers-layout-v1" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
