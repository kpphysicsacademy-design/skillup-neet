<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1f8ff"><meta name="skillup-no-standard-menu" content="true"><meta name="skillup-release" content="20261119-tax-and-bills-simulator-v1"><title>Tax and Bills Calculator | SkillUp Maths</title><style>:root{--blue:#168ac0;--green:#58a900;--ink:#263b58;--muted:#718096;--line:#dce6f0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#f1fbff,#f6f8ff 60%,#f3fbf1);color:var(--ink);font-family:Nunito,system-ui,sans-serif}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}.nav{width:min(100% - 24px,760px);min-height:58px;margin:auto;display:flex;align-items:center;gap:10px;padding:8px 0}.back{display:grid;place-items:center;width:36px;height:36px;border:2px solid var(--line);border-bottom-width:3px;border-radius:11px;color:var(--blue);text-decoration:none;font-size:20px;font-weight:900}.brand{flex:1;font-size:16px;font-weight:950}.brand span{color:var(--blue)}.tag{font-size:11px;font-weight:900;color:#52616c;background:#f5f8fa;padding:6px 9px;border-radius:10px}main{width:min(100% - 24px,740px);margin:auto;padding:18px 4px 36px}.hero,.card{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:clamp(15px,4vw,22px);margin-bottom:13px}.eyebrow{font-size:11px;font-weight:950;letter-spacing:.08em;color:#278100}.hero h1{font-size:clamp(24px,5vw,32px);margin:7px 0}.muted{color:var(--muted);font-size:14px;line-height:1.65;margin:0}.formula{margin:13px 0;padding:14px;border-radius:13px;background:#eff9ff;text-align:center;color:#126d99;font-size:clamp(18px,4vw,24px);font-weight:950}.steps{padding-left:20px;line-height:1.8;font-size:14px}.note{padding:12px;border-radius:12px;background:#f1faeb;color:#365f26;font-size:13px;line-height:1.6}.links{display:grid;grid-template-columns:1fr 1fr;gap:9px}.links a{display:flex;align-items:center;justify-content:center;min-height:48px;padding:9px;border:2px solid #b9e4f6;border-bottom-width:4px;border-radius:13px;background:#f0faff;color:#0877a8;text-decoration:none;text-align:center;font-size:13px;font-weight:950}.links a:last-child{border-color:#d3e9c7;background:#f2fbea;color:#347b18}@media(max-width:520px){main{width:100%;padding:13px 10px 28px}.hero,.card{padding:15px}.links{grid-template-columns:1fr}}.control{display:grid;gap:6px;margin-top:12px}.control label{font-size:13px;font-weight:850}.control input,.control select{width:100%;padding:11px;border:2px solid var(--line);border-radius:11px;font:800 16px system-ui;color:var(--ink);background:white}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{margin-top:13px;padding:15px;border-radius:14px;background:#eff9ff;text-align:center}.result b{display:block;font-size:clamp(24px,5vw,34px);color:#126d99}.result span{font-size:12px;color:var(--muted);font-weight:800}.explain{font-size:13px;line-height:1.6;color:#52616c;margin-top:10px}@media(max-width:520px){.grid2{grid-template-columns:1fr}}</style></head><body><header><div class="nav"><a class="back" href="maths-tax-and-bills-quiz.html?v=20261119-tax-and-bills-duolingo-v2">←</a><div class="brand">SkillUp <span>Maths</span></div><span class="tag">🔢 Simulator</span></div></header><main>
<section class="hero"><div class="eyebrow">INTERACTIVE BILLING LAB</div><h1>Tax and Bills Calculator</h1><p class="muted">Calculate item subtotals, tax amounts, tax-inclusive prices and complete bills using the rate you enter.</p></section>
<section class="card"><h2>1. Choose calculation</h2><div class="control"><label for="mode">Operation</label><select id="mode"><option value="bill">Bill subtotal + tax</option><option value="tax">Find tax amount</option><option value="inclusive">Find tax inside total</option><option value="rate">Find tax rate</option></select></div><div class="grid2"><div class="control"><label id="labelA" for="a">Subtotal / taxable value (₹)</label><input id="a" type="number" min="0" step="any" value="800"></div><div class="control"><label id="labelB" for="b">Tax rate (%)</label><input id="b" type="number" min="0" step="any" value="5"></div></div><div class="grid2" id="itemsRow"><div class="control"><label for="qty">Quantity</label><input id="qty" type="number" min="1" step="1" value="1"></div><div class="control"><label for="unit">Unit price (₹)</label><input id="unit" type="number" min="0" step="any" value="800"></div></div><div class="result"><b id="answer">₹840</b><span id="caption">Final bill total</span></div><p class="explain" id="steps">Tax = ₹40; total = ₹840.</p></section>
<div class="links"><a href="maths-tax-and-bills-learn.html?v=20261119-tax-and-bills-learn-v1">📘 Learn</a><a href="maths-tax-and-bills-quiz.html?v=20261119-tax-and-bills-duolingo-v2">📝 Practice quiz</a></div></main>
<script>(function(){const $=id=>document.getElementById(id),mode=$('mode');function fmt(x){return Number.isFinite(x)?Number(x.toFixed(2)).toString():'—'}function money(x){return Number.isFinite(x)?'₹'+fmt(x):'—'}function update(){const m=mode.value,a=Number($('a').value),b=Number($('b').value),qty=Number($('qty').value),unit=Number($('unit').value),validA=$('a').value!==''&&Number.isFinite(a)&&a>=0,validB=$('b').value!==''&&Number.isFinite(b)&&b>=0,validQty=$('qty').value!==''&&Number.isInteger(qty)&&qty>=1,validUnit=$('unit').value!==''&&Number.isFinite(unit)&&unit>=0;$('itemsRow').hidden=m!=='bill';$('labelA').textContent=m==='rate'?'Tax amount (₹)':'Taxable value / total (₹)';$('labelB').textContent=m==='rate'?'Taxable value (₹)':'Tax rate (%)';let ans,caption,steps;if(!validA||!validB){ans=NaN;caption='Enter valid non-negative values';steps='Enter both values to calculate.'}else if(m==='bill'){if(!validQty||!validUnit){ans=NaN;caption='Enter a valid quantity and unit price';steps='Quantity must be a positive whole number.'}else{const subtotal=qty*unit,tax=subtotal*b/100;ans=subtotal+tax;caption='Final bill including tax';steps='Subtotal = '+qty+' × '+money(unit)+' = '+money(subtotal)+'. Tax = '+money(subtotal)+' × '+fmt(b)+'% = '+money(tax)+'. Total = '+money(ans)+'.'}}else if(m==='tax'){ans=a*b/100;caption='Tax amount';steps='Tax = taxable value × rate / 100 = '+money(a)+' × '+fmt(b)+' / 100 = '+money(ans)+'.'}else if(m==='inclusive'){const base=a/(1+b/100);ans=a-base;caption='Tax included in total';steps='Pre-tax value = '+money(a)+' / (1 + '+fmt(b)+'/100) = '+money(base)+'. Included tax = '+money(ans)+'.'}else{ans=b===0?NaN:a/b*100;caption='Tax rate';steps='Rate = (tax amount / taxable value) × 100 = ('+money(a)+' / '+money(b)+') × 100 = '+fmt(ans)+'%.'}$('answer').textContent=(m==='rate'?fmt(ans)+'%':money(ans));$('caption').textContent=caption;$('steps').textContent=steps}mode.addEventListener('change',update);['a','b','qty','unit'].forEach(id=>$(id).addEventListener('input',update));update()})();</script><script src="/shared-nav.js?v=20261125-central-design-system-v2"></script>
</body></html>
