(function(){
'use strict';
const questions=[{"d":"BASIC","q":"What is the sum of the three interior angles of any triangle?","o":["90°","180°","270°","360°"],"a":1,"why":"The interior angles of every Euclidean triangle add up to 180°."},{"d":"BASIC","q":"A triangle has angles 50° and 60°. What is its third angle?","o":["60°","70°","80°","90°"],"a":1,"why":"The third angle is 180° − 50° − 60° = 70°."},{"d":"BASIC","q":"The exterior angle of a triangle equals:","o":["The sum of the two opposite interior angles","The difference of the two opposite interior angles","The adjacent interior angle only","Half the sum of all interior angles"],"a":0,"why":"By the exterior angle theorem, an exterior angle equals the sum of the two remote interior angles."},{"d":"BASIC","q":"Each interior angle of an equilateral triangle measures:","o":["30°","45°","60°","90°"],"a":2,"why":"All three angles are equal and total 180°, so each is 180° ÷ 3 = 60°."},{"d":"BASIC","q":"In an isosceles triangle, the angles opposite the equal sides are:","o":["Unequal","Equal","Always 90°","Always 60°"],"a":1,"why":"The base angles opposite the two equal sides of an isosceles triangle are equal."},{"d":"BASIC","q":"A right triangle has one acute angle of 35°. Find its other acute angle.","o":["45°","55°","65°","75°"],"a":1,"why":"The two acute angles in a right triangle add to 90°, so the other is 55°."},{"d":"BASIC","q":"An exterior angle and its adjacent interior angle at a triangle vertex form:","o":["A right angle","A complete angle","A linear pair","Vertically opposite angles"],"a":2,"why":"The exterior angle and adjacent interior angle lie on a straight line and add to 180°."},{"d":"BASIC","q":"Two angles of a triangle are 90° and 40°. What is the third angle?","o":["40°","50°","60°","70°"],"a":1,"why":"180° − 90° − 40° = 50°."},{"d":"BASIC","q":"A triangle with one interior angle greater than 90° is called:","o":["Acute-angled","Right-angled","Obtuse-angled","Equilateral"],"a":2,"why":"An obtuse-angled triangle has one angle greater than 90°."},{"d":"BASIC","q":"Which set of angles can form a triangle?","o":["40°, 60°, 80°","50°, 60°, 80°","90°, 50°, 50°","30°, 70°, 90°"],"a":0,"why":"40° + 60° + 80° = 180°, which satisfies the triangle angle-sum property."},{"d":"MEDIUM","q":"The angles of a triangle are in the ratio 2:3:4. Find the largest angle.","o":["40°","60°","80°","90°"],"a":2,"why":"Nine parts equal 180°, so one part is 20°. The largest angle is 4 × 20° = 80°."},{"d":"MEDIUM","q":"An isosceles triangle has a vertex angle of 40°. Find each base angle.","o":["60°","70°","80°","140°"],"a":1,"why":"The two equal base angles share 180° − 40° = 140°, so each is 70°."},{"d":"MEDIUM","q":"The two remote interior angles of a triangle are 45° and 65°. Find the exterior angle.","o":["90°","100°","110°","120°"],"a":2,"why":"The exterior angle is the sum of the remote interior angles: 45° + 65° = 110°."},{"d":"MEDIUM","q":"The angles of a triangle are 2x°, 3x° and 4x°. Find the largest angle.","o":["40°","60°","80°","100°"],"a":2,"why":"9x = 180°, so x = 20°. The largest angle is 4x = 80°."},{"d":"MEDIUM","q":"Two angles of a triangle are 35° and 75°. Find the third angle.","o":["60°","70°","80°","90°"],"a":1,"why":"The third angle is 180° − 35° − 75° = 70°."},{"d":"MEDIUM","q":"A triangle has an exterior angle of 130°. One remote interior angle is 55°. Find the other remote interior angle.","o":["65°","70°","75°","85°"],"a":2,"why":"The remote interior angles sum to the exterior angle, so the missing angle is 130° − 55° = 75°."},{"d":"MEDIUM","q":"An isosceles triangle has base angles (x + 10)° each and vertex angle 2x°. Find x.","o":["30","35","40","45"],"a":2,"why":"2(x + 10) + 2x = 180 gives 4x + 20 = 180, so x = 40."},{"d":"MEDIUM","q":"The angles of a triangle are x°, (x + 20)° and (x + 40)°. Find the largest angle.","o":["60°","70°","80°","90°"],"a":2,"why":"3x + 60 = 180 gives x = 40°. The largest angle is x + 40 = 80°."},{"d":"MEDIUM","q":"The two acute angles of a right triangle are in the ratio 2:3. Find the larger acute angle.","o":["36°","45°","54°","60°"],"a":2,"why":"The acute angles total 90°. Five parts equal 90°, so one part is 18° and the larger is 54°."},{"d":"MEDIUM","q":"An exterior angle is (4x + 10)°. Its two remote interior angles are (2x + 20)° and (x + 20)°. Find x.","o":["20","25","30","35"],"a":2,"why":"4x + 10 = (2x + 20) + (x + 20), so x = 30."},{"d":"HARD","q":"The angles of a triangle are (2x + 10)°, (3x − 5)° and (x + 25)°. Find the largest angle.","o":["60°","70°","80°","90°"],"a":1,"why":"6x + 30 = 180 gives x = 25°. The angles are 60°, 70° and 50°; the largest is 70°."},{"d":"HARD","q":"An isosceles triangle has a vertex angle of 36°. Find each base angle.","o":["62°","72°","82°","144°"],"a":1,"why":"The equal base angles share 180° − 36° = 144°, so each is 72°."},{"d":"HARD","q":"An exterior angle of a triangle is 125°. Its two remote interior angles are in the ratio 2:3. Find the larger remote angle.","o":["50°","65°","75°","85°"],"a":2,"why":"Five parts equal 125°, so one part is 25°. The larger angle is 3 × 25° = 75°."},{"d":"HARD","q":"A right triangle has acute angles 2x° and (x + 15)°. Find the larger acute angle.","o":["40°","45°","50°","55°"],"a":2,"why":"2x + (x + 15) = 90 gives x = 25°. The acute angles are 50° and 40°, so the larger is 50°."},{"d":"HARD","q":"An isosceles triangle has base angles (3x + 5)° each and vertex angle (2x + 10)°. Find each base angle.","o":["55°","60°","65°","70°"],"a":2,"why":"2(3x + 5) + 2x + 10 = 180 gives x = 20°. Each base angle is 65°."},{"d":"HARD","q":"An exterior angle is 140°. Its remote interior angles are (3x + 10)° and (2x + 20)°. Find the larger remote angle.","o":["64°","70°","76°","84°"],"a":2,"why":"5x + 30 = 140 gives x = 22°. The remote angles are 76° and 64°, so the larger is 76°."},{"d":"HARD","q":"The angles of a triangle are in the ratio 3:4:5. Find the largest angle.","o":["60°","70°","75°","90°"],"a":2,"why":"Twelve parts equal 180°, so one part is 15°. The largest angle is 5 × 15° = 75°."},{"d":"HARD","q":"An exterior angle of a triangle is 4x°. Its remote interior angles are (2x + 10)° and (3x − 20)°. Find the exterior angle.","o":["40°","60°","80°","100°"],"a":0,"why":"4x = (2x + 10) + (3x − 20) gives x = 10°, so the exterior angle is 4x = 40°."},{"d":"HARD","q":"The vertex angle of an isosceles triangle is four times each base angle. Find the vertex angle.","o":["90°","100°","120°","140°"],"a":2,"why":"If each base angle is x, then 4x + x + x = 180°, so x = 30° and the vertex angle is 120°."},{"d":"HARD","q":"An exterior angle is 120°. Its remote interior angles are (2x + 10)° and (x + 20)°. Find the adjacent interior angle.","o":["40°","50°","60°","70°"],"a":2,"why":"3x + 30 = 120 gives x = 30°. The adjacent interior angle is supplementary to 120°, so it is 60°."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Triangle Angle Properties Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
