<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Which set of lengths can form a triangle?","o":["2 cm, 3 cm, 6 cm","3 cm, 4 cm, 5 cm","1 cm, 2 cm, 3 cm","2 cm, 2 cm, 5 cm"],"a":1,"e":"The sum of any two sides must be greater than the third; 3+4>5."},{"d":"BASIC","q":"For sides a, b and c of a triangle, which must be true?","o":["a+b<c","a+b=c always","a+b>c","a=b=c"],"a":2,"e":"The sum of any two sides of a triangle is greater than the third side."},{"d":"BASIC","q":"Two sides of a triangle are 5 cm and 7 cm. Which could be the third side?","o":["2 cm","12 cm","10 cm","13 cm"],"a":2,"e":"The third side x must satisfy 7−5<x<7+5, so 2<x<12."},{"d":"BASIC","q":"Two sides are 4 cm and 6 cm. Which value cannot be the third side?","o":["3 cm","5 cm","9 cm","10 cm"],"a":3,"e":"The third side must be strictly less than 4+6=10 cm."},{"d":"BASIC","q":"In a triangle, the longest side is opposite the:","o":["Smallest angle","Largest angle","Right angle always","Equal angle always"],"a":1,"e":"The greater side lies opposite the greater angle."},{"d":"BASIC","q":"In a triangle, if ∠A>∠B, then:","o":["Side BC>side AC","Side BC<side AC","AB=AC always","No side comparison is possible"],"a":0,"e":"Side BC is opposite ∠A and AC is opposite ∠B, so BC>AC."},{"d":"BASIC","q":"Can 6 cm, 8 cm and 10 cm be the sides of a triangle?","o":["Yes","No, sum of two equals third","Only an equilateral triangle","Only an isosceles triangle"],"a":0,"e":"6+8>10, 6+10>8 and 8+10>6, so they form a triangle."},{"d":"BASIC","q":"A triangle has sides 5 cm, 5 cm and 8 cm. The largest angle is opposite:","o":["A 5 cm side","The other 5 cm side","The 8 cm side","No side"],"a":2,"e":"The largest side is opposite the largest angle."},{"d":"BASIC","q":"If two sides of a triangle are 8 cm and 11 cm, the third side x must satisfy:","o":["x<3","3<x<19","x>19","3≤x≤19"],"a":1,"e":"Triangle inequality gives |11−8|<x<11+8, hence 3<x<19."},{"d":"BASIC","q":"Which statement about triangle sides is correct?","o":["A side may equal the sum of the other two","A side is greater than the sum of the other two","Each side is less than the sum of the other two","All sides must be equal"],"a":2,"e":"Each side must be strictly smaller than the sum of the other two."},{"d":"MEDIUM","q":"Two sides are 9 cm and 4 cm. Which is a possible integer length for the third side?","o":["5 cm","13 cm","6 cm","14 cm"],"a":2,"e":"The third side x must satisfy 5<x<13; 6 cm works."},{"d":"MEDIUM","q":"Two sides are 7 cm and 12 cm. How many integer values can the third side have?","o":["10","11","13","15"],"a":3,"e":"5<x<19, so integer values are 6 through 18, which gives 13 possible lengths."},{"d":"MEDIUM","q":"The sides are 3 cm, 4 cm and x cm, where x is an integer. How many values of x form a triangle?","o":["3","4","5","6"],"a":2,"e":"Triangle inequality gives 1<x<7; integer values are 2, 3, 4, 5 and 6: five values."},{"d":"MEDIUM","q":"In triangle ABC, AB=7 cm, AC=9 cm and BC=11 cm. Which angle is largest?","o":["∠A","∠B","∠C","All equal"],"a":0,"e":"BC=11 cm is the longest side, opposite ∠A."},{"d":"MEDIUM","q":"If ∠A=50° and ∠B=60° in triangle ABC, which side is longest?","o":["AB","BC","AC","AB and AC equal"],"a":0,"e":"∠C=70° is the largest angle, and its opposite side AB is longest."},{"d":"MEDIUM","q":"Two sides of a triangle are 10 cm and 15 cm. Which cannot be the third side?","o":["6 cm","10 cm","20 cm","25 cm"],"a":3,"e":"The third side must be less than 10+15=25 cm, so 25 cm cannot form a triangle."},{"d":"MEDIUM","q":"In a triangle, sides are x, x+2 and 8. If x=5, is this possible?","o":["Yes","No, because 5+7<8","No, because 5+8=7","Only if right-angled"],"a":0,"e":"Sides 5, 7 and 8 satisfy all three triangle inequalities."},{"d":"MEDIUM","q":"If sides of a triangle are 4 cm, 7 cm and x cm, and x is an integer, which is the smallest possible x?","o":["2 cm","3 cm","4 cm","11 cm"],"a":2,"e":"3<x<11, so the smallest integer x is 4."},{"d":"MEDIUM","q":"In triangle ABC, ∠A=∠B and AC=6 cm. What is BC?","o":["3 cm","6 cm","12 cm","Cannot be determined"],"a":1,"e":"Equal angles have equal opposite sides; BC is opposite ∠A and AC opposite ∠B."},{"d":"MEDIUM","q":"A triangle has sides 5 cm, 12 cm and 13 cm. Which angle is greatest?","o":["Opposite 5 cm","Opposite 12 cm","Opposite 13 cm","All angles equal"],"a":2,"e":"The greatest angle is opposite the longest side, 13 cm."},{"d":"HARD","q":"Two sides of a triangle are 13 cm and 8 cm. If the third side is an integer, how many lengths are possible?","o":["14","15","16","17"],"a":1,"e":"5<x<21, so integers 6 through 20 give 15 possible lengths."},{"d":"HARD","q":"Sides of a triangle are 2x, 3x and 4x, where x>0. Which is true?","o":["They form a triangle for every x>0","They never form a triangle","Only x=1 works","Only x>4 works"],"a":0,"e":"2x+3x>4x because 5x>4x for all x>0; the other inequalities also hold."},{"d":"HARD","q":"A triangle has sides 7 cm, 10 cm and x cm. If x is an even integer, how many possible values can x have?","o":["4","5","6","7"],"a":2,"e":"3<x<17; even integers are 4, 6, 8, 10, 12, 14, giving 6 values."},{"d":"HARD","q":"In triangle ABC, AB=AC and ∠B=3x°, ∠C=(x+40)°. Find x.","o":["10°","15°","20°","25°"],"a":2,"e":"AB=AC implies opposite angles C and B are equal: 3x=x+40, so x=20°."},{"d":"HARD","q":"The sides of a triangle are x+1, x+3 and 10 cm. For positive integer x, what is the smallest possible x?","o":["10°","15°","20°","25°"],"a":2,"e":"AB=AC means ∠C=∠B, so 3x=x+40 and x=20°."},{"d":"HARD","q":"In triangle ABC, ∠A=40° and ∠B=65°. Compare AC and BC.","o":["2","3","4","5"],"a":2,"e":"(x+1)+(x+3)>10 gives 2x+4>10, so x>3; the smallest positive integer is 4."},{"d":"HARD","q":"Two sides are 6 cm and 14 cm. If the third side is an integer, what is the greatest possible length?","o":["19 cm","20 cm","21 cm","22 cm"],"a":0,"e":"The third side x must be less than 6+14=20, so the greatest integer is 19 cm."},{"d":"HARD","q":"A triangle has sides 8 cm, 8 cm and x cm, where x is a positive integer. Which range is valid?","o":["0<x<16","x>16","x≥16","x=16 only"],"a":0,"e":"Triangle inequality requires x<8+8=16 and x>0."},{"d":"HARD","q":"If sides of a triangle are 4 cm, 9 cm and x cm, and x is a multiple of 3, which values are possible?","o":["3, 6, 9, 12","6, 9, 12","6, 9, 12, 15","3, 6, 9, 12, 15"],"a":1,"e":"5<x<13, so the multiples of 3 possible are 6, 9 and 12."},{"d":"HARD","q":"In a triangle, sides are 5 cm, 7 cm and 9 cm. Which angle is smallest?","o":["Opposite 5 cm","Opposite 7 cm","Opposite 9 cm","Cannot determine"],"a":0,"e":"The smallest side is opposite the smallest angle."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand triangle inequalities</strong><small>Use the triangle inequality theorem</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Compare sides and angles</strong><small>Check possible side lengths</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve triangle inequality problems</strong><small>Apply side-angle comparisons</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
