<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"Which set of lengths can form a triangle?","o":["2 cm, 3 cm, 6 cm","3 cm, 4 cm, 5 cm","1 cm, 2 cm, 3 cm","2 cm, 2 cm, 5 cm"],"a":1,"why":"The sum of any two sides must be greater than the third: 3 + 4 > 5."},{"d":"BASIC","q":"For sides a, b and c of a triangle, which condition must hold?","o":["a + b < c","a + b = c always","a + b > c","a = b = c"],"a":2,"why":"The sum of any two sides of a triangle is strictly greater than the third side."},{"d":"BASIC","q":"Two sides of a triangle are 5 cm and 7 cm. Which could be the third side?","o":["2 cm","12 cm","10 cm","13 cm"],"a":2,"why":"The third side x must satisfy 7 − 5 < x < 7 + 5, so 2 < x < 12."},{"d":"BASIC","q":"Two sides are 4 cm and 6 cm. Which value cannot be the third side?","o":["3 cm","5 cm","9 cm","10 cm"],"a":3,"why":"The third side must be strictly less than 4 + 6 = 10 cm."},{"d":"BASIC","q":"In a triangle, the longest side is opposite the:","o":["Smallest angle","Largest angle","Right angle always","Equal angle always"],"a":1,"why":"The greater side of a triangle lies opposite the greater angle."},{"d":"BASIC","q":"In triangle ABC, if ∠A > ∠B, which comparison is true?","o":["BC > AC","BC < AC","AB = AC always","No side comparison is possible"],"a":0,"why":"BC is opposite ∠A and AC is opposite ∠B. The side opposite the greater angle is longer."},{"d":"BASIC","q":"Can 6 cm, 8 cm and 10 cm be the sides of a triangle?","o":["Yes","No, a sum equals the third side","Only an equilateral triangle","Only an isosceles triangle"],"a":0,"why":"6 + 8 > 10, 6 + 10 > 8 and 8 + 10 > 6, so all three conditions hold."},{"d":"BASIC","q":"A triangle has sides 5 cm, 5 cm and 8 cm. The largest angle is opposite:","o":["One of the 5 cm sides","The other 5 cm side","The 8 cm side","No side"],"a":2,"why":"The longest side, 8 cm, is opposite the largest angle."},{"d":"BASIC","q":"If two sides of a triangle are 8 cm and 11 cm, the third side x must satisfy:","o":["x < 3","3 < x < 19","x > 19","3 ≤ x ≤ 19"],"a":1,"why":"Triangle inequality gives |11 − 8| < x < 11 + 8, hence 3 < x < 19."},{"d":"BASIC","q":"Which statement about the sides of a triangle is correct?","o":["A side may equal the sum of the other two","A side is greater than the sum of the other two","Each side is less than the sum of the other two","All sides must be equal"],"a":2,"why":"Each side must be strictly smaller than the sum of the other two sides."},{"d":"MEDIUM","q":"Two sides are 9 cm and 4 cm. Which is a possible integer length for the third side?","o":["5 cm","13 cm","6 cm","14 cm"],"a":2,"why":"The third side x must satisfy 5 < x < 13. Therefore, 6 cm is possible."},{"d":"MEDIUM","q":"Two sides of a triangle are 7 cm and 12 cm. How many integer values can the third side have?","o":["12","13","14","15"],"a":1,"why":"5 < x < 19, so the integer values are 6 through 18: 13 values."},{"d":"MEDIUM","q":"The sides are 3 cm, 4 cm and x cm, where x is an integer. How many values of x form a triangle?","o":["3","4","5","6"],"a":2,"why":"1 < x < 7, so x can be 2, 3, 4, 5 or 6: five values."},{"d":"MEDIUM","q":"In triangle ABC, AB = 7 cm, AC = 9 cm and BC = 11 cm. Which angle is largest?","o":["∠A","∠B","∠C","All angles are equal"],"a":0,"why":"BC = 11 cm is the longest side, and it is opposite ∠A."},{"d":"MEDIUM","q":"In triangle ABC, ∠A = 50° and ∠B = 60°. Which side is the longest?","o":["AB","BC","AC","AB and AC are equal"],"a":0,"why":"∠C = 70° is the largest angle, and its opposite side AB is the longest."},{"d":"MEDIUM","q":"Two sides of a triangle are 10 cm and 15 cm. Which cannot be the third side?","o":["6 cm","10 cm","20 cm","25 cm"],"a":3,"why":"The third side must be strictly less than 10 + 15 = 25 cm."},{"d":"MEDIUM","q":"A triangle has side lengths 5 cm, 7 cm and 8 cm. Is this possible?","o":["Yes","No, because 5 + 7 < 8","No, because 5 + 8 = 7","Only if it is right-angled"],"a":0,"why":"5 + 7 > 8, 5 + 8 > 7 and 7 + 8 > 5. All triangle inequalities hold."},{"d":"MEDIUM","q":"Two sides of a triangle are 4 cm and 7 cm. If the third side x is an integer, what is its smallest possible value?","o":["2 cm","3 cm","4 cm","11 cm"],"a":2,"why":"3 < x < 11. The smallest integer greater than 3 is 4."},{"d":"MEDIUM","q":"In triangle ABC, ∠A = ∠B and AC = 6 cm. What is BC?","o":["3 cm","6 cm","12 cm","Cannot be determined"],"a":1,"why":"Equal angles have equal opposite sides. BC is opposite ∠A and AC is opposite ∠B."},{"d":"MEDIUM","q":"A triangle has sides 5 cm, 12 cm and 13 cm. Which angle is greatest?","o":["Opposite 5 cm","Opposite 12 cm","Opposite 13 cm","All angles are equal"],"a":2,"why":"The greatest angle is opposite the longest side, 13 cm."},{"d":"HARD","q":"Two sides of a triangle are 13 cm and 8 cm. If the third side is an integer, how many lengths are possible?","o":["14","15","16","17"],"a":1,"why":"5 < x < 21, so the integers are 6 through 20: 15 possible lengths."},{"d":"HARD","q":"The sides of a triangle are 2x, 3x and 4x, where x > 0. Which statement is true?","o":["They form a triangle for every x > 0","They never form a triangle","Only x = 1 works","Only x > 4 works"],"a":0,"why":"2x + 3x > 4x because 5x > 4x for every x > 0; the other two inequalities also hold."},{"d":"HARD","q":"A triangle has sides 7 cm, 10 cm and x cm. If x is an even integer, how many values are possible?","o":["4","5","6","7"],"a":2,"why":"3 < x < 17. The even integers are 4, 6, 8, 10, 12 and 14: six values."},{"d":"HARD","q":"In triangle ABC, AB = AC, ∠B = 3x° and ∠C = (x + 40)°. Find x.","o":["10°","15°","20°","25°"],"a":2,"why":"AB = AC means the opposite angles C and B are equal: 3x = x + 40, so x = 20°."},{"d":"HARD","q":"A triangle has side lengths (x + 1) cm, (x + 3) cm and 10 cm. For positive integer x, what is the smallest possible value of x?","o":["2","3","4","5"],"a":2,"why":"The key condition is (x + 1) + (x + 3) > 10, giving x > 3. The smallest positive integer is 4."},{"d":"HARD","q":"In triangle ABC, ∠A = 40° and ∠B = 65°. Which comparison is correct?","o":["AC > BC","AC < BC","AC = BC","Cannot be determined"],"a":0,"why":"AC is opposite 65° and BC is opposite 40°. The side opposite the greater angle is longer."},{"d":"HARD","q":"Two sides of a triangle are 6 cm and 9 cm. If the third side is an odd integer, how many values are possible?","o":["4","5","6","7"],"a":1,"why":"3 < x < 15. The odd integers are 5, 7, 9, 11 and 13: five values."},{"d":"HARD","q":"Two sides of a triangle are 6 cm and 14 cm. If the third side is an integer, what is its greatest possible length?","o":["19 cm","20 cm","21 cm","22 cm"],"a":0,"why":"The third side x must be less than 6 + 14 = 20, so the greatest integer is 19 cm."},{"d":"HARD","q":"A triangle has sides 8 cm, 8 cm and x cm, where x is positive. Which range is valid?","o":["0 < x < 16","x > 16","x ≥ 16","x = 16 only"],"a":0,"why":"The inequalities require x > 0 and x < 8 + 8 = 16."},{"d":"HARD","q":"Two sides of a triangle are 4 cm and 9 cm. If the third side is a multiple of 3, which values are possible?","o":["3, 6, 9, 12","6, 9, 12","6, 9, 12, 15","3, 6, 9, 12, 15"],"a":1,"why":"5 < x < 13, so the multiples of 3 that work are 6, 9 and 12."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Triangle Inequalities Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
