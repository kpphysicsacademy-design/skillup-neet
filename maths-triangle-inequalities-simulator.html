<script>(function(){const $=id=>document.getElementById(id),a=$('sideA'),b=$('sideB'),c=$('sideC');function update(){const A=+a.value,B=+b.value,C=+c.value;$('sideAOut').textContent=A.toFixed(1)+' cm';$('sideBOut').textContent=B.toFixed(1)+' cm';$('sideCOut').textContent=C.toFixed(1)+' cm';const ok=A+B>C+1e-9&&A+C>B+1e-9&&B+C>A+1e-9;const tests=[[A,B,C],[B,C,A],[C,A,B]];$('condition').textContent=tests.map(t=>t[0].toFixed(1)+' + '+t[1].toFixed(1)+(t[0]+t[1]>t[2]?' > ':' ≤ ')+t[2].toFixed(1)).join('  |  ');$('status').textContent=ok?'✓ These three side lengths form a triangle.':'✕ These lengths cannot form a triangle. Change the sliders until all three inequalities hold.';$('status').style.borderLeftColor=ok?'#48b516':'#d94b4b';$('status').style.background=ok?'#f0faeb':'#fff2f2';if(ok){const radicand=Math.max(0,B*B-Math.pow((B*B+C*C-A*A)/(2*C),2)),height=Math.sqrt(radicand),scale=Math.min(225/C,150/Math.max(1,height)),base=C*scale,h=height*scale,x=(B*B+C*C-A*A)/(2*C)*scale,left=(360-base)/2,y=215-h;$('shape').setAttribute('d','M '+left+' 215 L '+(left+base)+' 215 L '+(left+x)+' '+y+' Z');$('C').setAttribute('x',left+x);$('C').setAttribute('y',Math.max(20,y-12));$('A').setAttribute('x',left-15);$('B').setAttribute('x',left+base+5);$('ab').setAttribute('x',left+base/2);$('ab').setAttribute('y',232);$('ab').textContent='c = '+C.toFixed(1);$('ac').setAttribute('x',left+x/2-20);$('ac').setAttribute('y',(215+y)/2);$('ac').textContent='b = '+B.toFixed(1);$('bc').setAttribute('x',left+(base+x)/2+5);$('bc').setAttribute('y',(215+y)/2);$('bc').textContent='a = '+A.toFixed(1);}else{$('shape').setAttribute('d','M55 210 L305 210 L180 45 Z');$('C').setAttribute('x',180);$('C').setAttribute('y',32);$('A').setAttribute('x',40);$('B').setAttribute('x',310);$('ab').setAttribute('x',180);$('ab').setAttribute('y',232);$('ab').textContent='c = '+C.toFixed(1);$('ac').setAttribute('x',92);$('ac').setAttribute('y',115);$('ac').textContent='b = '+B.toFixed(1);$('bc').setAttribute('x',260);$('bc').setAttribute('y',115);$('bc').textContent='a = '+A.toFixed(1);}}[a,b,c].forEach(el=>el.addEventListener('input',update));update();})();</script><script src="/shared-nav.js?v=20261107-maths-header-v6"></script></body></html>
