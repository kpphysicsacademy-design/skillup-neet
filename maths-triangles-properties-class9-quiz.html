<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"What is the sum of the three interior angles of a triangle?","o":["90°","180°","270°","360°"],"a":1,"e":"The interior angles of every triangle add up to 180°."},{"d":"BASIC","q":"A triangle has angles 50° and 60°. What is the third angle?","o":["60°","70°","80°","90°"],"a":1,"e":"The third angle is 180°−50°−60°=70°."},{"d":"BASIC","q":"A triangle with all three sides equal is called:","o":["Scalene","Isosceles","Equilateral","Right-angled"],"a":2,"e":"An equilateral triangle has three equal sides."},{"d":"BASIC","q":"A triangle with exactly two equal sides is called:","o":["Equilateral","Isosceles","Scalene","Obtuse"],"a":1,"e":"An isosceles triangle has two equal sides."},{"d":"BASIC","q":"A triangle with all sides of different lengths is:","o":["Equilateral","Isosceles","Scalene","Right-angled"],"a":2,"e":"A scalene triangle has three unequal sides."},{"d":"BASIC","q":"In an isosceles triangle, the angles opposite the equal sides are:","o":["Unequal","Equal","Always 90°","Always 60°"],"a":1,"e":"Equal sides in a triangle have equal opposite angles."},{"d":"BASIC","q":"Which set of lengths can form a triangle?","o":["1, 2, 4","2, 3, 4","1, 3, 5","2, 2, 5"],"a":1,"e":"For 2, 3, 4 each pair sums to more than the remaining side."},{"d":"BASIC","q":"The largest angle in a triangle lies opposite the:","o":["Shortest side","Longest side","Equal side only","Median"],"a":1,"e":"The largest angle is opposite the longest side."},{"d":"BASIC","q":"An exterior angle of a triangle equals the sum of:","o":["All three interior angles","The two opposite interior angles","The adjacent interior angle only","Two exterior angles"],"a":1,"e":"An exterior angle equals the sum of the two remote interior angles."},{"d":"BASIC","q":"Can a triangle have two right angles?","o":["Yes, always","Yes, sometimes","No","Only if equilateral"],"a":2,"e":"Two right angles already total 180°, leaving no angle for a triangle's third angle."},{"d":"MEDIUM","q":"Two angles of a triangle are 35° and 85°. Find the third angle.","o":["50°","60°","70°","80°"],"a":1,"e":"180°−35°−85°=60°."},{"d":"MEDIUM","q":"An exterior angle is 125° and one opposite interior angle is 55°. Find the other opposite interior angle.","o":["60°","70°","80°","90°"],"a":1,"e":"The remote interior angles sum to the exterior angle: 125°−55°=70°."},{"d":"MEDIUM","q":"Two sides of a triangle are 5 cm and 8 cm. Which could be the third side?","o":["2 cm","3 cm","4 cm","13 cm"],"a":2,"e":"The third side must be greater than 8−5=3 and less than 8+5=13; 4 cm works."},{"d":"MEDIUM","q":"An isosceles triangle has vertex angle 40°. What is each base angle?","o":["40°","60°","70°","80°"],"a":2,"e":"The base angles are equal: (180°−40°)/2=70°."},{"d":"MEDIUM","q":"A triangle has sides 6 cm, 6 cm, and 9 cm. Which angle is largest?","o":["Opposite a 6 cm side","Opposite the 9 cm side","All angles equal","Cannot determine"],"a":1,"e":"The longest side is 9 cm, so its opposite angle is largest."},{"d":"MEDIUM","q":"Two angles of a triangle are equal and the third is 40°. What is each equal angle?","o":["40°","60°","70°","80°"],"a":2,"e":"The equal angles total 180°−40°=140°, so each is 70°."},{"d":"MEDIUM","q":"An exterior angle is 110°. One remote interior angle is 45°. Find the other.","o":["55°","60°","65°","70°"],"a":2,"e":"110°−45°=65°."},{"d":"MEDIUM","q":"Which lengths cannot form a triangle?","o":["4, 5, 6","3, 4, 6","2, 3, 5","5, 5, 7"],"a":2,"e":"The sum of 2 and 3 equals 5, not greater than the third side."},{"d":"MEDIUM","q":"In triangle ABC, AB=AC and angle B=52°. Find angle A.","o":["52°","64°","76°","128°"],"a":2,"e":"AB=AC means angles B and C are equal, so angle A=180°−52°−52°=76°."},{"d":"MEDIUM","q":"The sides of a triangle are 7 cm, 9 cm, and 12 cm. Which angle is smallest?","o":["Opposite 7 cm","Opposite 9 cm","Opposite 12 cm","All equal"],"a":0,"e":"The shortest side is 7 cm, so its opposite angle is smallest."},{"d":"HARD","q":"Two angles of a triangle are (2x+10)° and (3x−20)°. The third angle is 40°. Find x.","o":["20","25","30","35"],"a":2,"e":"The angles sum to 180: 5x+30=180, so x=30."},{"d":"HARD","q":"An exterior angle is 3x°; the two remote interior angles are (x+20)° and (x+40)°. Find x.","o":["20","25","30","40"],"a":2,"e":"3x=2x+60, so x=60? Correctly: 3x=(x+20)+(x+40)=2x+60, so x=60."},{"d":"HARD","q":"An isosceles triangle has equal sides of 10 cm and a base of 12 cm. Which statement is true?","o":["The base angles are equal","The vertex angle is 90°","All angles are equal","The base angles are unequal"],"a":0,"e":"The two equal sides have equal opposite base angles."},{"d":"HARD","q":"A triangle has angles in ratio 2:3:4. What is the largest angle?","o":["40°","60°","80°","90°"],"a":2,"e":"Nine parts equal 180°, each is 20°; the largest is 4×20°=80°."},{"d":"HARD","q":"Two sides are 8 cm and 13 cm. Which value could be the integer length of the third side?","o":["4 cm","5 cm","20 cm","21 cm"],"a":2,"e":"The third side must be greater than 5 and less than 21; 20 cm works."},{"d":"HARD","q":"In triangle PQR, angle P=2x°, angle Q=3x°, and angle R=4x°. Find angle Q.","o":["20°","40°","60°","80°"],"a":2,"e":"9x=180 gives x=20°, so angle Q=3x=60°."},{"d":"HARD","q":"An exterior angle of a triangle is 140°. Its two remote interior angles are in ratio 3:4. Find the larger remote angle.","o":["60°","70°","80°","90°"],"a":2,"e":"Seven parts equal 140°, one part is 20°, and the larger is 4×20°=80°."},{"d":"HARD","q":"A triangle has sides 4 cm, 7 cm, and x cm, where x is an integer. Which is the smallest possible x?","o":["2","3","4","11"],"a":2,"e":"The third side must be greater than 3, so the smallest integer is 4 cm."},{"d":"HARD","q":"In an isosceles triangle, the vertex angle is twice each base angle. Find the vertex angle.","o":["45°","60°","90°","120°"],"a":2,"e":"Let each base angle be x; 2x+x+x=180 gives x=45°, so vertex angle=90°."},{"d":"HARD","q":"A triangle has angles (x+10)°, (2x−5)°, and (3x+1)°. Find the largest angle.","o":["39°","53°","88°","73°"],"a":2,"e":"6x+6=180 gives x=29; the angles are 39°, 53°, and 88°."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Master triangle properties</strong><small>Use the triangle angle-sum property</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Apply the exterior-angle theorem</strong><small>Test triangle inequalities</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Compare sides and angles</strong><small>Solve multi-step triangle problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
