<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"What is the sum of the three interior angles of a triangle?","o":["90°","180°","270°","360°"],"a":1,"why":"The interior angles of every triangle add up to 180°."},{"d":"BASIC","q":"A triangle has angles 50° and 60°. What is the third angle?","o":["60°","70°","80°","90°"],"a":1,"why":"The third angle is 180°−50°−60°=70°."},{"d":"BASIC","q":"A triangle with all three sides equal is called:","o":["Scalene","Isosceles","Equilateral","Right-angled"],"a":2,"why":"An equilateral triangle has three equal sides."},{"d":"BASIC","q":"A triangle with exactly two equal sides is called:","o":["Equilateral","Isosceles","Scalene","Obtuse"],"a":1,"why":"An isosceles triangle has two equal sides."},{"d":"BASIC","q":"A triangle with all sides of different lengths is:","o":["Equilateral","Isosceles","Scalene","Right-angled"],"a":2,"why":"A scalene triangle has three unequal sides."},{"d":"BASIC","q":"In an isosceles triangle, the angles opposite the equal sides are:","o":["Unequal","Equal","Always 90°","Always 60°"],"a":1,"why":"Equal sides in a triangle have equal opposite angles."},{"d":"BASIC","q":"Which set of lengths can form a triangle?","o":["1, 2, 4","2, 3, 4","1, 3, 5","2, 2, 5"],"a":1,"why":"For 2, 3, 4 each pair sums to more than the remaining side."},{"d":"BASIC","q":"The largest angle in a triangle lies opposite the:","o":["Shortest side","Longest side","Equal side only","Median"],"a":1,"why":"The largest angle is opposite the longest side."},{"d":"BASIC","q":"An exterior angle of a triangle equals the sum of:","o":["All three interior angles","The two opposite interior angles","The adjacent interior angle only","Two exterior angles"],"a":1,"why":"An exterior angle equals the sum of the two remote interior angles."},{"d":"BASIC","q":"Can a triangle have two right angles?","o":["Yes, always","Yes, sometimes","No","Only if equilateral"],"a":2,"why":"Two right angles already total 180°, leaving no angle for a triangle's third angle."},{"d":"MEDIUM","q":"Two angles of a triangle are 35° and 85°. Find the third angle.","o":["50°","60°","70°","80°"],"a":1,"why":"180°−35°−85°=60°."},{"d":"MEDIUM","q":"An exterior angle is 125° and one opposite interior angle is 55°. Find the other opposite interior angle.","o":["60°","70°","80°","90°"],"a":1,"why":"The remote interior angles sum to the exterior angle: 125°−55°=70°."},{"d":"MEDIUM","q":"Two sides of a triangle are 5 cm and 8 cm. Which could be the third side?","o":["2 cm","3 cm","4 cm","13 cm"],"a":2,"why":"The third side must be greater than 8−5=3 and less than 8+5=13; 4 cm works."},{"d":"MEDIUM","q":"An isosceles triangle has vertex angle 40°. What is each base angle?","o":["40°","60°","70°","80°"],"a":2,"why":"The base angles are equal: (180°−40°)/2=70°."},{"d":"MEDIUM","q":"A triangle has sides 6 cm, 6 cm, and 9 cm. Which angle is largest?","o":["Opposite a 6 cm side","Opposite the 9 cm side","All angles equal","Cannot determine"],"a":1,"why":"The longest side is 9 cm, so its opposite angle is largest."},{"d":"MEDIUM","q":"Two angles of a triangle are equal and the third is 40°. What is each equal angle?","o":["40°","60°","70°","80°"],"a":2,"why":"The equal angles total 180°−40°=140°, so each is 70°."},{"d":"MEDIUM","q":"An exterior angle is 110°. One remote interior angle is 45°. Find the other.","o":["55°","60°","65°","70°"],"a":2,"why":"110°−45°=65°."},{"d":"MEDIUM","q":"Which lengths cannot form a triangle?","o":["4, 5, 6","3, 4, 6","2, 3, 5","5, 5, 7"],"a":2,"why":"The sum of 2 and 3 equals 5, not greater than the third side."},{"d":"MEDIUM","q":"In triangle ABC, AB=AC and angle B=52°. Find angle A.","o":["52°","64°","76°","128°"],"a":2,"why":"AB=AC means angles B and C are equal, so angle A=180°−52°−52°=76°."},{"d":"MEDIUM","q":"The sides of a triangle are 7 cm, 9 cm, and 12 cm. Which angle is smallest?","o":["Opposite 7 cm","Opposite 9 cm","Opposite 12 cm","All equal"],"a":0,"why":"The shortest side is 7 cm, so its opposite angle is smallest."},{"d":"HARD","q":"Two angles of a triangle are (2x+10)° and (3x−20)°. The third angle is 40°. Find x.","o":["20","25","30","35"],"a":2,"why":"The angles sum to 180: 5x+30=180, so x=30."},{"d":"HARD","q":"An exterior angle is 3x°; the two remote interior angles are (x+20)° and (x+40)°. Find x.","o":["20","25","40","60"],"a":3,"why":"3x=(x+20)+(x+40)=2x+60, so x=60."},{"d":"HARD","q":"An isosceles triangle has equal sides of 10 cm and a base of 12 cm. Which statement is true?","o":["The base angles are equal","The vertex angle is 90°","All angles are equal","The base angles are unequal"],"a":0,"why":"The two equal sides have equal opposite base angles."},{"d":"HARD","q":"A triangle has angles in ratio 2:3:4. What is the largest angle?","o":["40°","60°","80°","90°"],"a":2,"why":"Nine parts equal 180°, each is 20°; the largest is 4×20°=80°."},{"d":"HARD","q":"Two sides are 8 cm and 13 cm. Which value could be the integer length of the third side?","o":["4 cm","5 cm","20 cm","21 cm"],"a":2,"why":"The third side must be greater than 5 and less than 21; 20 cm works."},{"d":"HARD","q":"In triangle PQR, angle P=2x°, angle Q=3x°, and angle R=4x°. Find angle Q.","o":["20°","40°","60°","80°"],"a":2,"why":"9x=180 gives x=20°, so angle Q=3x=60°."},{"d":"HARD","q":"An exterior angle of a triangle is 140°. Its two remote interior angles are in ratio 3:4. Find the larger remote angle.","o":["60°","70°","80°","90°"],"a":2,"why":"Seven parts equal 140°, one part is 20°, and the larger is 4×20°=80°."},{"d":"HARD","q":"A triangle has sides 4 cm, 7 cm, and x cm, where x is an integer. Which is the smallest possible x?","o":["2","3","4","11"],"a":2,"why":"The third side must be greater than 3, so the smallest integer is 4 cm."},{"d":"HARD","q":"In an isosceles triangle, the vertex angle is twice each base angle. Find the vertex angle.","o":["45°","60°","90°","120°"],"a":2,"why":"Let each base angle be x; 2x+x+x=180 gives x=45°, so vertex angle=90°."},{"d":"HARD","q":"A triangle has angles (x+10)°, (2x−5)°, and (3x+1)°. Find the largest angle.","o":["39°","53°","88°","73°"],"a":2,"why":"6x+6=180 gives x=29; the angles are 39°, 53°, and 88°."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Triangles and Their Properties Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
