<script>(function(){'use strict';const originalQuestions=[{"id":"b01","d":"BASIC","q":"How many sides does a triangle have?","o":["2","3","4","5"],"a":1,"e":"A triangle is a polygon with three sides."},{"id":"b02","d":"BASIC","q":"How many vertices does a quadrilateral have?","o":["2","3","4","6"],"a":2,"e":"A quadrilateral has four vertices and four sides."},{"id":"b03","d":"BASIC","q":"Which shape has exactly three sides?","o":["Triangle","Pentagon","Rectangle","Hexagon"],"a":0,"e":"A triangle has three straight sides."},{"id":"b04","d":"BASIC","q":"A square has…","o":["4 equal sides and 4 right angles","Only 2 equal sides","3 right angles","No equal sides"],"a":0,"e":"All four sides of a square are equal and all its angles are 90°."},{"id":"b05","d":"BASIC","q":"Which quadrilateral has opposite sides equal and four right angles?","o":["Kite","Rectangle","Trapezium","Any triangle"],"a":1,"e":"A rectangle has four right angles and equal opposite sides."},{"id":"b06","d":"BASIC","q":"How many sides does a pentagon have?","o":["4","5","6","8"],"a":1,"e":"Penta means five; a pentagon has five sides."},{"id":"b07","d":"BASIC","q":"Which triangle has all three sides equal?","o":["Scalene","Isosceles","Equilateral","Right-angled"],"a":2,"e":"An equilateral triangle has three equal sides."},{"id":"b08","d":"BASIC","q":"Which shape has four equal sides and four right angles?","o":["Rectangle","Square","Rhombus only","Trapezium"],"a":1,"e":"A square combines equal sides with four right angles."},{"id":"b09","d":"BASIC","q":"How many diagonals does a quadrilateral have?","o":["1","2","3","4"],"a":1,"e":"Joining opposite vertices gives two diagonals."},{"id":"b10","d":"BASIC","q":"Which is NOT a quadrilateral?","o":["Square","Rhombus","Triangle","Rectangle"],"a":2,"e":"A triangle has three sides, not four."},{"id":"m11","d":"MEDIUM","q":"A triangle has angles 50° and 60°. Find the third angle.","o":["60°","70°","80°","90°"],"a":1,"e":"Angles in a triangle total 180°: 180 − 50 − 60 = 70°."},{"id":"m12","d":"MEDIUM","q":"A triangle with sides 5 cm, 5 cm and 8 cm is…","o":["Equilateral","Isosceles","Scalene","Not a triangle"],"a":1,"e":"Two sides are equal, so it is isosceles."},{"id":"m13","d":"MEDIUM","q":"Which set could be the side lengths of a triangle?","o":["2, 3, 6","3, 4, 5","1, 2, 4","2, 2, 5"],"a":1,"e":"The sum of any two sides must be greater than the third; 3 + 4 > 5."},{"id":"m14","d":"MEDIUM","q":"One angle of a rectangle is 90°. What are its other angles?","o":["All 90°","All 45°","Two are 90°","Cannot be known"],"a":0,"e":"Every rectangle has four right angles."},{"id":"m15","d":"MEDIUM","q":"A quadrilateral has sides 4 cm, 4 cm, 7 cm and 7 cm in opposite equal pairs. Which is a possible description?","o":["Opposite sides equal","All sides equal","Three sides only","All angles must be 60°"],"a":0,"e":"Opposite equal sides are a defining property of a parallelogram and rectangle."},{"id":"m16","d":"MEDIUM","q":"How many triangles can be made by drawing one diagonal in a quadrilateral?","o":["1","2","3","4"],"a":1,"e":"One diagonal divides a quadrilateral into two triangles."},{"id":"m17","d":"MEDIUM","q":"A triangle has one angle of 90°. The other two angles together equal…","o":["45°","90°","180°","270°"],"a":1,"e":"The triangle total is 180°; 180° − 90° = 90°."},{"id":"m18","d":"MEDIUM","q":"Which quadrilateral has all four sides equal but does not necessarily have right angles?","o":["Rectangle","Rhombus","Trapezium","Parallelogram only"],"a":1,"e":"A rhombus has four equal sides; its angles need not be right angles."},{"id":"m19","d":"MEDIUM","q":"A square has perimeter 28 cm. What is the length of one side?","o":["6 cm","7 cm","8 cm","14 cm"],"a":1,"e":"Perimeter = 4 × side, so side = 28 ÷ 4 = 7 cm."},{"id":"m20","d":"MEDIUM","q":"Which triangle has all angles less than 90°?","o":["Acute-angled triangle","Right-angled triangle","Obtuse-angled triangle","Straight triangle"],"a":0,"e":"An acute-angled triangle has three angles below 90°."},{"id":"h21","d":"HARD","q":"Two angles of a triangle are 2x° and 3x°. The third angle is 30°. Find x.","o":["20°","25°","30°","35°"],"a":2,"e":"2x + 3x + 30 = 180, so 5x = 150 and x = 30°."},{"id":"h22","d":"HARD","q":"A triangle has angles x°, (x + 20)° and (2x)°. Find x.","o":["30°","35°","40°","45°"],"a":2,"e":"x + (x + 20) + 2x = 180, so 4x = 160 and x = 40°."},{"id":"h23","d":"HARD","q":"A square has side 9 cm. What is its perimeter?","o":["18 cm","27 cm","36 cm","81 cm"],"a":2,"e":"Perimeter = 4 × 9 = 36 cm."},{"id":"h24","d":"HARD","q":"A rectangle is 12 cm long and 5 cm wide. What is its perimeter?","o":["17 cm","34 cm","60 cm","24 cm"],"a":1,"e":"Perimeter = 2(12 + 5) = 34 cm."},{"id":"h25","d":"HARD","q":"Three angles of a quadrilateral are 85°, 95° and 110°. Find the fourth.","o":["60°","70°","80°","90°"],"a":1,"e":"A quadrilateral totals 360°; 360 − (85 + 95 + 110) = 70°."},{"id":"h26","d":"HARD","q":"A triangle has sides 7 cm, 10 cm and x cm, where x is a whole number. Which is a possible value of x?","o":["2","4","17","18"],"a":1,"e":"Triangle inequality requires x > 3 and x < 17; 4 is possible."},{"id":"h27","d":"HARD","q":"The perimeter of an equilateral triangle is 33 cm. Find one side.","o":["9 cm","10 cm","11 cm","12 cm"],"a":2,"e":"All three sides are equal: 33 ÷ 3 = 11 cm."},{"id":"h28","d":"HARD","q":"A rectangle has perimeter 50 cm and length 15 cm. Find its width.","o":["5 cm","10 cm","15 cm","20 cm"],"a":1,"e":"2(L + W) = 50, so L + W = 25 and W = 10 cm."},{"id":"h29","d":"HARD","q":"A quadrilateral has angles 90°, 90°, 90° and x°. Find x.","o":["60°","90°","180°","270°"],"a":1,"e":"The angle sum is 360°; x = 360 − 270 = 90°."},{"id":"h30","d":"HARD","q":"A triangle has equal sides of 8 cm and a third side of 5 cm. What is its perimeter?","o":["13 cm","16 cm","21 cm","24 cm"],"a":2,"e":"Perimeter = 8 + 8 + 5 = 21 cm."}];let questions=originalQuestions.slice(),index=0,selected=-1,locked=false,xp=0,correct=0,streak=0,bestS
