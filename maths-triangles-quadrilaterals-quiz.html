 .skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}.skills-result{margin-top:14px;text-align:left}.skills-result h3{margin:0 0 8px;font-size:1rem}.skills-result .skill-item{margin-top:7px}.skill-item.unlocked{border-color:var(--green);color:var(--green2);background:#174b42} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}.diagram .accent{stroke:#58d6a3}.diagram .blue{stroke:#91b7ff}.diagram .gold{stroke:#ffd27a}.skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}.skills-result{margin-top:14px;text-align:left}.skills-result h3{margin:0 0 8px;font-size:1rem}.skills-result .skill-item{margin-top:7px}.skill-item.unlocked{border-color:var(--green);color:var(--green2);background:#174b42}</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Triangles and quadrilaterals</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Triangles and quadrilaterals skills"><div class="skill-title">🎯 Shape Skills</div><div class="skill-list"><div class="skill-item">Identify triangles by sides and angles</div><div class="skill-item">Recognise properties of squares, rectangles and rhombuses</div><div class="skill-item">Use triangle and quadrilateral angle sums</div></div></section></div><script>(function(){'use strict';const questions=[{"d":"BASIC","q":"How many sides does a triangle have?","o":["2","3","4","5"],"a":1,"e":"A triangle is a polygon with three sides."},{"d":"BASIC","q":"How many vertices does a quadrilateral have?","o":["2","3","4","6"],"a":2,"e":"A quadrilateral has four vertices and four sides."},{"d":"BASIC","q":"Which shape has exactly three sides?","o":["Triangle","Pentagon","Rectangle","Hexagon"],"a":0,"e":"A triangle has three straight sides."},{"d":"BASIC","q":"A square has…","o":["4 equal sides and 4 right angles","Only 2 equal sides","3 right angles","No equal sides"],"a":0,"e":"All four sides of a square are equal and all its angles are 90°."},{"d":"BASIC","q":"Which quadrilateral has opposite sides equal and four right angles?","o":["Kite","Rectangle","Trapezium","Any triangle"],"a":1,"e":"A rectangle has four right angles and equal opposite sides."},{"d":"BASIC","q":"How many sides does a pentagon have?","o":["4","5","6","8"],"a":1,"e":"Penta means five; a pentagon has five sides."},{"d":"BASIC","q":"Which triangle has all three sides equal?","o":["Scalene","Isosceles","Equilateral","Right-angled"],"a":2,"e":"An equilateral triangle has three equal sides."},{"d":"BASIC","q":"Which shape has four equal sides and four right angles?","o":["Rectangle","Square","Rhombus only","Trapezium"],"a":1,"e":"A square combines equal sides with four right angles."},{"d":"BASIC","q":"How many diagonals does a quadrilateral have?","o":["1","2","3","4"],"a":1,"e":"Joining opposite vertices gives two diagonals."},{"d":"BASIC","q":"Which is NOT a quadrilateral?","o":["Square","Rhombus","Triangle","Rectangle"],"a":2,"e":"A triangle has three sides, not four."},{"d":"MEDIUM","q":"A triangle has angles 50° and 60°. Find the third angle.","o":["60°","70°","80°","90°"],"a":1,"e":"Angles in a triangle total 180°: 180 − 50 − 60 = 70°."},{"d":"MEDIUM","q":"A triangle with sides 5 cm, 5 cm and 8 cm is…","o":["Equilateral","Isosceles","Scalene","Not a triangle"],"a":1,"e":"Two sides are equal, so it is isosceles."},{"d":"MEDIUM","q":"Which set could be the side lengths of a triangle?","o":["2, 3, 6","3, 4, 5","1, 2, 4","2, 2, 5"],"a":1,"e":"The sum of any two sides must be greater than the third; 3 + 4 > 5."},{"d":"MEDIUM","q":"One angle of a rectangle is 90°. What are its other angles?","o":["All 90°","All 45°","Two are 90°","Cannot be known"],"a":0,"e":"Every rectangle has four right angles."},{"d":"MEDIUM","q":"A quadrilateral has sides 4 cm, 4 cm, 7 cm and 7 cm in opposite equal pairs. Which is a possible description?","o":["Opposite sides equal","All sides equal","Three sides only","All angles must be 60°"],"a":0,"e":"Opposite equal sides are a defining property of a parallelogram and rectangle."},{"d":"MEDIUM","q":"How many triangles can be made by drawing one diagonal in a quadrilateral?","o":["1","2","3","4"],"a":1,"e":"One diagonal divides a quadrilateral into two triangles."},{"d":"MEDIUM","q":"A triangle has one angle of 90°. The other two angles together equal…","o":["45°","90°","180°","270°"],"a":1,"e":"The triangle total is 180°; 180° − 90° = 90°."},{"d":"MEDIUM","q":"Which quadrilateral has all four sides equal but does not necessarily have right angles?","o":["Rectangle","Rhombus","Trapezium","Parallelogram only"],"a":1,"e":"A rhombus has four equal sides; its angles need not be right angles."},{"d":"MEDIUM","q":"A square has perimeter 28 cm. What is the length of one side?","o":["6 cm","7 cm","8 cm","14 cm"],"a":1,"e":"Perimeter = 4 × side, so side = 28 ÷ 4 = 7 cm."},{"d":"MEDIUM","q":"Which triangle has all angles less than 90°?","o":["Acute-angled triangle","Right-angled triangle","Obtuse-angled triangle","Straight triangle"],"a":0,"e":"An acute-angled triangle has three angles below 90°."},{"d":"HARD","q":"Two angles of a triangle are 2x° and 3x°. The third angle is 30°. Find x.","o":["20°","25°","30°","35°"],"a":2,"e":"2x + 3x + 30 = 180, so 5x = 150 and x = 30°."},{"d":"HARD","q":"A triangle has angles x°, (x + 20)° and (2x)°. Find x.","o":["30°","35°","40°","45°"],"a":2,"e":"x + (x + 20) + 2x = 180, so 4x = 160 and x = 40°."},{"d":"HARD","q":"A square has side 9 cm. What is its perimeter?","o":["18 cm","27 cm","36 cm","81 cm"],"a":2,"e":"Perimeter = 4 × 9 = 36 cm."},{"d":"HARD","q":"A rectangle is 12 cm long and 5 cm wide. What is its perimeter?","o":["17 cm","34 cm","60 cm","24 cm"],"a":1,"e":"Perimeter = 2(12 + 5) = 34 cm."},{"d":"HARD","q":"Three angles of a quadrilateral are 85°, 95° and 110°. Find the fourth.","o":["60°","70°","80°","90°"],"a":1,"e":"A quadrilateral totals 360°; 360 − (85 + 95 + 110) = 70°."},{"d":"HARD","q":"A triangle has sides 7 cm, 10 cm and x cm, where x is a whole number. Which is a possible value of x?","o":["2","4","17","18"],"a":1,"e":"Triangle inequality requires x > 3 and x < 17; 4 is possible."},{"d":"HARD","q":"The perimeter of an equilateral triangle is 33 cm. Find one side.","o":["9 cm","10 cm","11 cm","12 cm"],"a":2,"e":"All three sides are equal: 33 ÷ 3 = 11 cm."},{"d":"HARD","q":"A rectangle has perimeter 50 cm and length 15 cm. Find its width.","o":["5 cm","10 cm","15 cm","20 cm"],"a":1,"e":"2(L + W) = 50, so L + W = 25 and W = 10 cm."},{"d":"HARD","q":"A quadrilateral has angles 90°, 90°, 90° and x°. Find x.","o":["60°","90°","180°","270°"],"a":1,"e":"The angle sum is 360°; x = 360 − 270 = 90°."},{"d":"HARD","q":"A triangle has equal sides of 8 cm and a third side of 5 cm. What is its perimeter?","o":["13 cm","16 cm","21 cm","24 cm"],"a":2,"e":"Perimeter = 8 + 8 + 5 = 21 cm."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');const visuals={
acute:'',
right:'',
obtuse:'',
straight:'',
reflex:'',
full:'',
compare:'',
protractor:''
};function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const skills=[['Classify acute, right, obtuse and reflex angles',8],['Measure angles using a protractor',18],['Solve complementary and supplementary angle problems',24]];$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">📏</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+skills.map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script>
