d var(--line);border-radius:12px;text-align:left;font:700 14px/1.4 system-ui;cursor:pointer}.choice:before{content:attr(data-letter);display:grid;place-items:center;flex:0 0 26px;height:26px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:11px;font-weight:850}.choice.selected{border-color:#8bc8e7;background:#f0f9ff}.choice.correct{background:#efffe7;border-color:var(--green)}.choice.wrong{background:#fff0f0;border-color:#ff4b4b}.choice:disabled{opacity:1}.feedback{display:none;margin:10px 0;padding:11px;border-radius:12px;font-size:13px}.feedback.show{display:block}.feedback.good{background:#efffe7;color:#286b00}.feedback.bad{background:#fff0f0;color:#9f2525}.actions{display:flex;align-items:center;gap:10px;margin-top:14px}.hint{flex:1;color:var(--muted);font-size:12px}button.primary{min-width:150px;min-height:46px;padding:11px 15px;border:0;border-bottom:4px solid #46a302;border-radius:12px;background:#58cc02;color:#fff;font-weight:850;text-transform:uppercase}button.primary:disabled{opacity:.45}.end{text-align:center}.score{font-size:2.2rem;font-weight:900}.summary{padding:12px;background:#f7f9fa;border:1px solid var(--line);border-radius:12px;margin:12px 0}.skills-result{text-align:left}.skill-item{margin-top:7px;padding:10px;border:1px solid var(--line);border-radius:10px;color:var(--muted)}.skill-item.unlocked{background:#efffe7;border-color:var(--green);color:#286b00}@media(max-width:520px){.nav{width:100%;padding:6px 10px;gap:6px}.pill{font-size:10px;padding:5px 6px}main{width:100%;padding:10px 10px 28px}.card{padding:14px}.question{font-size:19px}.actions button.primary{min-width:140px}}
</style></head><body><header><div class="nav"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="pill">⭐ <span id="xp">0</span> XP</div><div class="pill">🔥 <span id="streak">0</span> streak</div></div></header><main><section class="hero"><h1>📐 Types of Angles</h1><p class="muted">Acute · Right · Obtuse · Straight · Reflex · Full turn</p><div class="simulator-link"><a href="maths-types-of-angles-simulator.html?v=20261111-types-of-angles-simulator-v1">🧪 Explore the Angle Simulator</a></div><div class="progress-row"><span id="counter">Question 1 of 30</span><span id="percent">0%</span></div><div class="progress"><div class="bar" id="bar"></div></div></section><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Types of angles</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><script>(()=>{'use strict';const questions=[{"d":"BASIC","q":"An angle smaller than 90° is called what?","o":["Acute angle","Right angle","Obtuse angle","Straight angle"],"a":0,"e":"An acute angle measures more than 0° and less than 90°.","v":"acute"},{"d":"BASIC","q":"An angle measuring exactly 90° is a…","o":["Straight angle","Right angle","Reflex angle","Acute angle"],"a":1,"e":"A right angle measures exactly 90°.","v":"right"},{"d":"BASIC","q":"An angle measuring 120° is…","o":["Acute","Right","Obtuse","Straight"],"a":2,"e":"An obtuse angle is greater than 90° and less than 180°.","v":"obtuse"},{"d":"BASIC","q":"What is the measure of a straight angle?","o":["90°","180°","270°","360°"],"a":1,"e":"A straight angle forms a straight line and measures 180°.","v":"straight"},{"d":"BASIC","q":"Which angle is smaller than a right angle?","o":["125°","90°","45°","180°"],"a":2,"e":"45° is less than 90°, so it is acute.","v":"compare"},{"d":"BASIC","q":"Which angle is greater than 90° but less than 180°?","o":["75°","90°","145°","180°"],"a":2,"e":"145° lies between 90° and 180°, making it obtuse.","v":"obtuse"},{"d":"BASIC","q":"A full turn measures…","o":["90°","180°","270°","360°"],"a":3,"e":"One complete turn is 360°.","v":"full"},{"d":"BASIC","q":"Which tool is commonly used to measure an angle in degrees?","o":["Ruler","Protractor","Compass only","Set square only"],"a":1,"e":"A protractor is marked in degrees to measure angles.","v":"protractor"},{"d":"BASIC","q":"An angle of 30° is classified as…","o":["Acute","Right","Obtuse","Reflex"],"a":0,"e":"30° is between 0° and 90°, so it is acute.","v":"acute"},{"d":"BASIC","q":"Which angle is a reflex angle?","o":["60°","90°","175°","220°"],"a":3,"e":"A reflex angle is greater than 180° and less than 360°.","v":"reflex"},{"d":"MEDIUM","q":"An angle is 15° more than a right angle. What is its measure?","o":["75°","105°","115°","165°"],"a":1,"e":"90° + 15° = 105°, which is obtuse.","v":"compare"},{"d":"MEDIUM","q":"An angle is 35° less than a straight angle. Find it.","o":["145°","155°","135°","125°"],"a":0,"e":"180° − 35° = 145°.","v":"straight"},{"d":"MEDIUM","q":"Two angles together form a right angle. One is 28°. What is the other?","o":["62°","72°","118°","152°"],"a":0,"e":"Angles forming a right angle total 90°; 90° − 28° = 62°.","v":"right"},{"d":"MEDIUM","q":"Two adjacent angles form a straight angle. One is 113°. Find the other.","o":["67°","77°","113°","293°"],"a":0,"e":"Angles on a straight line total 180°; 180° − 113° = 67°.","v":"straight"},{"d":"MEDIUM","q":"Which is the smallest angle?","o":["0.5 right angle","90°","100°","1.5 right angles"],"a":0,"e":"Half a right angle is 45°, smaller than 90°, 100° and 135°.","v":"compare"},{"d":"MEDIUM","q":"What is the reflex angle corresponding to a smaller angle of 80° around a point?","o":["100°","180°","280°","360°"],"a":2,"e":"A full turn is 360°; 360° − 80° = 280°.","v":"reflex"},{"d":"MEDIUM","q":"A protractor shows 0° at one arm and 65° at the other. What is the angle?","o":["25°","65°","115°","180°"],"a":1,"e":"Read the scale that begins at 0° on the first arm: 65°.","v":"protractor"},{"d":"MEDIUM","q":"Which statement about a right angle is true?","o":["It is half of 180°","It is twice 90°","It is greater than 180°","It is one quarter of 180°"],"a":0,"e":"90° is half of 180°, the straight angle.","v":"right"},{"d":"MEDIUM","q":"Three equal angles together make a right angle. What is each angle?","o":["20°","30°","45°","60°"],"a":1,"e":"90° ÷ 3 = 30° for each equal angle.","v":"compare"},{"d":"MEDIUM","q":"An angle measures 178°. Which classification fits it?","o":["Acute","Right","Obtuse","Reflex"],"a":2,"e":"178° is greater than 90° and less than 180°, so it is obtuse.","v":"obtuse"},{"d":"HARD","q":"Two angles on a straight line are (x + 20)° and 2x°. Find x.","o":["40","50","53⅓","80"],"a":2,"e":"(x + 20) + 2x = 180, so 3x = 160 and x = 53⅓.","v":"straight"},{"d":"HARD","q":"An angle is 4 times another angle. Together they form a right angle. Find the smaller angle.","o":["18°","22.5°","30°","72°"],"a":0,"e":"Let the smaller angle be x: x + 4x = 90°, so x = 18°.","v":"right"},{"d":"HARD","q":"The reflex angle around a point is 245°. What is the smaller angle between the same arms?","o":["105°","115°","125°","135°"],"a":1,"e":"360° − 245° = 115°.","v":"reflex"},{"d":"HARD","q":"An angle is 24° less than twice 72°. Find its measure.","o":["96°","120°","144°","168°"],"a":1,"e":"2 × 72° − 24° = 120°.","v":"compare"},{"d":"HARD","q":"Two complementary angles are in the ratio 2:3. Find the larger angle.","o":["36°","45°","54°","60°"],"a":2,"e":"There are 5 equal parts in 90°; each is 18°, so the larger is 3 × 18° = 54°.","v":"right"},{"d":"HARD","q":"Two supplementary angles are in the ratio 4:5. Find the smaller angle.","o":["60°","80°","90°","100°"],"a":1,"e":"Nine equal parts total 180°; each is 20°, so the smaller is 4 × 20° = 80°.","v":"straight"},{"d":"HARD","q":"An angle of 3x° and an angle of (x + 20)° form a right angle. Find x.","o":["15","17.5","20","25"],"a":1,"e":"3x + x + 20 = 90; 4x = 70, so x = 17.5.","v":"right"},{"d":"HARD","q":"A reflex angle is 3 times its smaller angle around the same point. What is the smaller angle?","o":["60°","75°","90°","120°"],"a":2,"e":"Let the smaller angle be x: x + 3x = 360°, so x = 90°.","v":"reflex"},{"d":"HARD","q":"A straight angle is divided into three angles: 2x°, 3x° and 4x°. Find the largest angle.","o":["40°","60°","80°","100°"],"a":2,"e":"9x = 180°, so x = 20° and the largest angle is 4x = 80°.","v":"straight"},{"d":"HARD","q":"One angle is 38°. What is the reflex angle formed by the same two arms?","o":["142°","218°","322°","360°"],"a":2,"e":"The reflex angle is 360° − 38° = 322°.","v":"reflex"}];let index=0,selected=-1,locked=false,finished=false,xp=0,streak=0,best=0,correct=0;const $=id=>document.getElementById(id);function diagram(kind){const cfg={acute:[25,65,65,'Acute angle'],right:[90,90,90,'Right angle'],obtuse:[25,125,125,'Obtuse angle'],straight:[0,180,180,'Straight angle'],reflex:[25,250,250,'Reflex angle'],full:[0,360,360,'Full turn']}[kind]||[25,90,90,'Angle'];const [start,deg]=cfg;const rad=deg*Math.PI/180,x=165+105*Math.cos(rad),y=90-105*Math.sin(rad);return '<div class="diagram"><svg viewBox="0 0 330 150" role="img" aria-label="'+cfg[3]+' illustration"><path d="M35 90 H295" stroke="#cbd8df" stroke-width="1" stroke-dasharray="4 4"/><path d="M165 90 L275 90 M165 90 L'+x.toFixed(1)+' '+y.toFixed(1)+'" stroke="#248ac0" stroke-width="4" stroke-linecap="round"/><path d="M205 90 A40 40 0 0 '+(deg>180?1:0)+' '+(165+40*Math.cos(rad))+' '+(90-40*Math.sin(rad))+'" fill="none" stroke="#48b516" stroke-width="3"/><circle cx="165" cy="90" r="4" fill="#263746"/><text x="175" y="108" fill="#263746" font-size="12">Vertex</text></svg><b>'+cfg[3]+'</b></div>'}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='Question '+(index+1)+' of '+questions.length;$('percent').textContent=Math.round(index/questions.length*100)+'%';$('bar').style.width=index/questions.length*100+'%';$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('content').innerHTML=(q.v?diagram(q.v):'')+'<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-letter="'+String.fromCharCode(65+i)+'" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=+b.dataset.i;$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false}));$('action').textContent='Check answer';$('action').disabled=true}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;streak++;best=Math.max(best,streak)}else streak=0;$('xp').textContent=xp;$('streak').textContent=streak;$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong')});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return}if(index<questions.length-1){index++;render();return}results()}function results(){finished=true;$('bar').style.width='100%';$('percent').textContent='100%';$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('content').innerHTML='<div class="end"><div style="font-size:3rem">📐</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>🔥 Best streak: '+best+'</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+[['Identify acute and right angles',8],['Classify obtuse and straight angles',18],['Recognise reflex and full-turn angles',24]].map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;streak=0;best=0;correct=0;$('xp').textContent=0;$('streak').textContent=0;render()}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return}act()});render()})();</script><script src="/shared-nav.js?v=20261017-duolingo-standard-v1"></script></body></html>
