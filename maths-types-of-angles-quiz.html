<script>(function(){'use strict';const originalQuestions=[{"id":"b01","d":"BASIC","q":"An angle smaller than 90° is called what?","o":["Acute angle","Right angle","Obtuse angle","Straight angle"],"a":0,"e":"An acute angle measures more than 0° and less than 90°.","v":"acute"},{"id":"b02","d":"BASIC","q":"An angle measuring exactly 90° is a…","o":["Straight angle","Right angle","Reflex angle","Acute angle"],"a":1,"e":"A right angle measures exactly 90°.","v":"right"},{"id":"b03","d":"BASIC","q":"An angle measuring 120° is…","o":["Acute","Right","Obtuse","Straight"],"a":2,"e":"An obtuse angle is greater than 90° and less than 180°.","v":"obtuse"},{"id":"b04","d":"BASIC","q":"What is the measure of a straight angle?","o":["90°","180°","270°","360°"],"a":1,"e":"A straight angle forms a straight line and measures 180°.","v":"straight"},{"id":"b05","d":"BASIC","q":"Which angle is smaller than a right angle?","o":["125°","90°","45°","180°"],"a":2,"e":"45° is less than 90°, so it is acute.","v":"compare"},{"id":"b06","d":"BASIC","q":"Which angle is greater than 90° but less than 180°?","o":["75°","90°","145°","180°"],"a":2,"e":"145° lies between 90° and 180°, making it obtuse.","v":"obtuse"},{"id":"b07","d":"BASIC","q":"A full turn measures…","o":["90°","180°","270°","360°"],"a":3,"e":"One complete turn is 360°.","v":"full"},{"id":"b08","d":"BASIC","q":"Which tool is commonly used to measure an angle in degrees?","o":["Ruler","Protractor","Compass only","Set square only"],"a":1,"e":"A protractor is marked in degrees to measure angles.","v":"protractor"},{"id":"b09","d":"BASIC","q":"An angle of 30° is classified as…","o":["Acute","Right","Obtuse","Reflex"],"a":0,"e":"30° is between 0° and 90°, so it is acute.","v":"acute"},{"id":"b10","d":"BASIC","q":"Which angle is a reflex angle?","o":["60°","90°","175°","220°"],"a":3,"e":"A reflex angle is greater than 180° and less than 360°.","v":"reflex"},{"id":"m11","d":"MEDIUM","q":"An angle is 15° more than a right angle. What is its measure?","o":["75°","105°","115°","165°"],"a":1,"e":"90° + 15° = 105°, which is obtuse.","v":"compare"},{"id":"m12","d":"MEDIUM","q":"An angle is 35° less than a straight angle. Find it.","o":["145°","155°","135°","125°"],"a":0,"e":"180° − 35° = 145°.","v":"straight"},{"id":"m13","d":"MEDIUM","q":"Two angles together form a right angle. One is 28°. What is the other?","o":["62°","72°","118°","152°"],"a":0,"e":"Angles forming a right angle total 90°; 90° − 28° = 62°.","v":"right"},{"id":"m14","d":"MEDIUM","q":"Two adjacent angles form a straight angle. One is 113°. Find the other.","o":["67°","77°","113°","293°"],"a":0,"e":"Angles on a straight line total 180°; 180° − 113° = 67°.","v":"straight"},{"id":"m15","d":"MEDIUM","q":"Which is the smallest angle?","o":["0.5 right angle","90°","100°","1.5 right angles"],"a":0,"e":"Half a right angle is 45°, smaller than 90°, 100° and 135°.","v":"compare"},{"id":"m16","d":"MEDIUM","q":"What is the reflex angle corresponding to a smaller angle of 80° around a point?","o":["100°","180°","280°","360°"],"a":2,"e":"A full turn is 360°; 360° − 80° = 280°.","v":"reflex"},{"id":"m17","d":"MEDIUM","q":"A protractor shows 0° at one arm and 65° at the other. What is the angle?","o":["25°","65°","115°","180°"],"a":1,"e":"Read the scale that begins at 0° on the first arm: 65°.","v":"protractor"},{"id":"m18","d":"MEDIUM","q":"Which statement about a right angle is true?","o":["It is half of 180°","It is twice 90°","It is greater than 180°","It is one quarter of 180°"],"a":0,"e":"90° is half of 180°, the straight angle.","v":"right"},{"id":"m19","d":"MEDIUM","q":"Three equal angles together make a right angle. What is each angle?","o":["20°","30°","45°","60°"],"a":1,"e":"90° ÷ 3 = 30° for each equal angle.","v":"compare"},{"id":"m20","d":"MEDIUM","q":"An angle measures 178°. Which classification fits it?","o":["Acute","Right","Obtuse","Reflex"],"a":2,"e":"178° is greater than 90° and less than 180°, so it is obtuse.","v":"obtuse"},{"id":"h ;$('feedback').className='feedback show '+(ok?'good':'bad');$('check').style.display='none';$('continue').className='btn continue show';$('continue').textContent=index===questions.length-1?'See results →':'Continue →'}function restart(wrongOnly){questions=wrongOnly?originalQuestions.filter(q=>mistakes.some(m=>m.id===q.id)):originalQuestions.slice();index=0;selected=-1;locked=false;xp=0;correct=0;streak=0;bestStreak=0;mistakes=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render()}function finish(){progress();$('quiz').style.display='none';const card=el('section','finish'),review=el('div','review');card.append(el('div','trophy','📐'),el('h2','',correct>=25?'Excellent work!':correct>=18?'Good progress!':'Keep practising!'),el('a','topic-link','🧪 Explore Types of Angles Simulator →'));card.querySelector('a').href='maths-types-of-angles-simulator.html?v=20261111-types-of-angles-simulator-v1';card.append(el('div','score',correct+' / '+questions.length),el('p','muted','You answered '+correct+' correctly and earned '+xp+' XP.'),el('p','',Math.round(correct/questions.length*100)+'% accuracy · Best streak: '+bestStreak));review.append(el('h3','',mistakes.length?'Review your mistakes ('+mistakes.length+')':'Perfect round!'));mistakes.forEach((m,i)=>{const item=el('div','review-item');item.append(el('b','',(i+1)+'. '+m.question),el('p','your-answer','Your answer: '+m.chosen),el('p','correct-answer','Correct answer: '+m.answer),el('p','',m.explanation));review.append(item)});card.append(review);const actions=el('div','review-actions'),wrong=el('button','btn secondary','Retry mistakes'),all=el('button','btn primary','Retry all');wrong.type=all.type='button';wrong.disabled=!mistakes.length;wrong.addEventListener('click',()=>restart(true));all.addEventListener('click',()=>restart(false));actions.append(wrong,all);card.append(actions);$('finishSlot').replaceChildren(card)}$('check').addEventListener('click',c
