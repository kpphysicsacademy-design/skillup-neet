it obtuse.","v":"obtuse"},{"d":"BASIC","q":"A full turn measures…","o":["90°","180°","270°","360°"],"a":3,"e":"One complete turn is 360°.","v":"full"},{"d":"BASIC","q":"Which tool is commonly used to measure an angle in degrees?","o":["Ruler","Protractor","Compass only","Set square only"],"a":1,"e":"A protractor is marked in degrees to measure angles.","v":"protractor"},{"d":"BASIC","q":"An angle of 30° is classified as…","o":["Acute","Right","Obtuse","Reflex"],"a":0,"e":"30° is between 0° and 90°, so it is acute.","v":"acute"},{"d":"BASIC","q":"Which angle is a reflex angle?","o":["60°","90°","175°","220°"],"a":3,"e":"A reflex angle is greater than 180° and less than 360°.","v":"reflex"},{"d":"MEDIUM","q":"An angle is 15° more than a right angle. What is its measure?","o":["75°","105°","115°","165°"],"a":1,"e":"90° + 15° = 105°, which is obtuse.","v":"compare"},{"d":"MEDIUM","q":"An angle is 35° less than a straight angle. Find it.","o":["145°","155°","135°","125°"],"a":0,"e":"180° − 35° = 145°.","v":"straight"},{"d":"MEDIUM","q":"Two angles together form a right angle. One is 28°. What is the other?","o":["62°","72°","118°","152°"],"a":0,"e":"Angles forming a right angle total 90°; 90° − 28° = 62°.","v":"right"},{"d":"MEDIUM","q":"Two adjacent angles form a straight angle. One is 113°. Find the other.","o":["67°","77°","113°","293°"],"a":0,"e":"Angles on a straight line total 180°; 180° − 113° = 67°.","v":"straight"},{"d":"MEDIUM","q":"Which is the smallest angle?","o":["0.5 right angle","90°","100°","1.5 right angles"],"a":0,"e":"Half a right angle is 45°, smaller than 90°, 100° and 135°.","v":"compare"},{"d":"MEDIUM","q":"What is the reflex angle corresponding to a smaller angle of 80° around a point?","o":["100°","180°","280°","360°"],"a":2,"e":"A full turn is 360°; 360° − 80° = 280°.","v":"reflex"},{"d":"MEDIUM","q":"A protractor shows 0° at one arm and 65° at the other. What is the angle?","o":["25°","65°","115°","180°"],"a":1,"e":"Read the scale that begins at 0° on the first arm: 65°.","v":"protractor"},{"d":"MEDIUM","q":"Which statement about a right angle is true?","o":["It is half of 180°","It is twice 90°","It is greater than 180°","It is one quarter of 180°"],"a":0,"e":"90° is half of 180°, the straight angle.","v":"right"},{"d":"MEDIUM","q":"Three equal angles together make a right angle. What is each angle?","o":["20°","30°","45°","60°"],"a":1,"e":"90° ÷ 3 = 30° for each equal angle.","v":"compare"},{"d":"MEDIUM","q":"An angle measures 178°. Which classification fits it?","o":["Acute","Right","Obtuse","Reflex"],"a":2,"e":"178° is greater than 90° and less than 180°, so it is obtuse.","v":"obtuse"},{"d":"HARD","q":"Two angles on a straight line are (x + 20)° and 2x°. Find x.","o":["40","50","53⅓","80"],"a":2,"e":"(x + 20) + 2x = 180, so 3x = 160 and x = 53⅓.","v":"straight"},{"d":"HARD","q":"An angle is 4 times another angle. Together they form a right angle. Find the smaller angle.","o":["18°","22.5°","30°","72°"],"a":0,"e":"Let the smaller angle be x: x + 4x = 90°, so x = 18°.","v":"right"},{"d":"HARD","q":"The reflex angle around a point is 245°. What is the smaller angle between the same arms?","o":["105°","115°","125°","135°"],"a":1,"e":"360° − 245° = 115°.","v":"reflex"},{"d":"HARD","q":"An angle is 24° less than twice 72°. Find its measure.","o":["96°","120°","144°","168°"],"a":1,"e":"2 × 72° − 24° = 120°.","v":"compare"},{"d":"HARD","q":"Two complementary angles are in the ratio 2:3. Find the larger angle.","o":["36°","45°","54°","60°"],"a":2,"e":"There are 5 equal parts in 90°; each is 18°, so the larger is 3 × 18° = 54°.","v":"right"},{"d":"HARD","q":"Two supplementary angles are in the ratio 4:5. Find the smaller angle.","o":["60°","80°","90°","100°"],"a":1,"e":"Nine equal parts total 180°; each is 20°, so the smaller is 4 × 20° = 80°.","v":"straight"},{"d":"HARD","q":"An angle of 3x° and an angle of (x + 20)° form a right angle. Find x.","o":["15","17.5","20","25"],"a":1,"e":"3x + x + 20 = 90; 4x = 70, so x = 17.5.","v":"right"},{"d":"HARD","q":"A reflex angle is 3 times its smaller angle around the same point. What is the smaller angle?","o":["60°","75°","90°","120°"],"a":2,"e":"Let the smaller angle be x: x + 3x = 360°, so x = 90°.","v":"reflex"},{"d":"HARD","q":"A straight angle is divided into three angles: 2x°, 3x° and 4x°. Find the largest angle.","o":["40°","60°","80°","100°"],"a":2,"e":"9x = 180°, so x = 20° and the largest angle is 4x = 80°.","v":"straight"},{"d":"HARD","q":"One angle is 38°. What is the reflex angle formed by the same two arms?","o":["142°","218°","322°","360°"],"a":2,"e":"The reflex angle is 360° − 38° = 322°.","v":"reflex"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');const visuals={
acute:'',
right:'',
obtuse:'',
straight:'',
reflex:'',
full:'',
compare:'',
protractor:''
};function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-letter="'+String.fromCharCode(65+i)+'" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';const skills=[['Classify acute, right, obtuse and reflex angles',8],['Measure angles using a protractor',18],['Solve complementary and supplementary angle problems',24]];$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">📏</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+skills.map(s=>'<div class="skill-item '+(correct>=s[1]?'unlocked':'')+'">'+(correct>=s[1]?'✓ Skill unlocked · ':'🔒 Keep practising · ')+s[0]+'</div>').join('')+'</div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script>
