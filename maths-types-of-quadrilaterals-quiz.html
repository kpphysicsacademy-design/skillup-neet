<style>

ce-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"A quadrilateral has how many sides?","o":["4","3","5","6"],"a":0,"e":"A quadrilateral is a polygon with four sides.","v":"types-of-quadrilaterals"},{"d":"BASIC","q":"Which quadrilateral has four equal sides and four right angles?","o":["Rhombus that is not a square","Square","Rectangle that is not a square","Kite"],"a":1,"e":"A square combines four equal sides with four right angles.","v":"types-of-quadrilaterals"},{"d":"BASIC","q":"Which quadrilateral always has four right angles?","o":["Rhombus","Kite","Rectangle","General trapezium"],"a":2,"e":"Every rectangle has four right angles.","v":"types-of-quadrilaterals"},{"d":"BASIC","q":"Which quadrilateral has all four sides equal, but its angles need not be right angles?","o":["Rectangle","Isosceles trapezium","Kite with unequal adjacent pairs","Rhombus"],"a":3,"e":"A rhombus has four equal sides; right angles are not required.","v":"types-of-quadrilaterals"},{"d":"BASIC","q":"In a parallelogram, opposite sides are:","o":["Parallel and equal","Perpendicular and unequal","Always perpendicular","All four necessarily unequal"],"a":0,"e":"Both pairs of opposite sides in a parallelogram are parallel and equal.","v":"types-of-quadrilaterals"},{"d":"BASIC","q":"Which quadrilateral has exactly one pair of parallel sides under the usual school definition?","o":["Parallelogram","Trapezium","Rectangle","Rhombus"],"a":1,"e":"A trapezium has one pair of parallel sides in the usual school definition.","v":"types-of-quadrilaterals"},{"d":"BASIC","q":"Which quadrilateral has two pairs of adjacent equal sides?","o":["Rectangle","Parallelogram with unequal sides","Kite","Isosceles trapezium"],"a":2,"e":"A kite has two pairs of equal adjacent sides.","v":"types-of-quadrilaterals"},{"d":"BASIC","q":"What is the sum of the interior angles of every quadrilateral?","o":["180°","270°","540°","360°"],"a":3,"e":"Every quadrilateral's interior-angle sum is 360°.","v":"types-of-quadrilaterals"},{"d":"BASIC","q":"Which shape has opposite sides equal and four right angles?","o":["Rectangle","Kite","Trapezium","General quadrilateral"],"a":0,"e":"A rectangle has equal opposite sides and four right angles.","v":"types-of-quadrilaterals"},{"d":"BASIC","q":"A square is also a special type of:","o":["Kite only","Rectangle and rhombus","Trapezium only","Pentagon"],"a":1,"e":"A square meets the definitions of both rectangle and rhombus.","v":"types-of-quadrilaterals"},{"d":"MEDIUM","q":"A parallelogram has one angle of 70°. What is the adjacent angle?","o":["70°","90°","110°","140°"],"a":2,"e":"Adjacent angles in a parallelogram are supplementary: 180° − 70° = 110°.","v":"types-of-quadrilaterals"},{"d":"MEDIUM","q":"One angle of a parallelogram is 125°. What is its opposite angle?","o":["55°","90°","35°","125°"],"a":3,"e":"Opposite angles in a parallelogram are equal.","v":"types-of-quadrilaterals"},{"d":"MEDIUM","q":"Which property is always true for a rhombus?","o":["All four sides are equal","All four angles are right angles","Diagonals are equal in every rhombus","Only one pair of sides is parallel"],"a":0,"e":"All four sides of a rhombus have equal length.","v":"types-of-quadrilaterals"},{"d":"MEDIUM","q":"Which property distinguishes a rectangle from a general parallelogram?","o":["All four sides are equal","Every angle is 90°","Diagonals are perpendicular in every case","Only one pair of sides is parallel"],"a":1,"e":"A rectangle has four right angles; a general parallelogram need not.","v":"types-of-quadrilaterals"},{"d":"MEDIUM","q":"A quadrilateral has both pairs of opposite sides parallel. What must it be?","o":["Kite","Trapezium with exactly one parallel pair","Parallelogram","Irregular pentagon"],"a":2,"e":"Having both pairs of opposite sides parallel defines a parallelogram.","v":"types-of-quadrilaterals"},{"d":"MEDIUM","q":"In a rhombus, the diagonals are always:","o":["Equal in length in every case","Parallel to each other","Never intersecting","Perpendicular bisectors of each other"],"a":3,"e":"A rhombus's diagonals bisect each other at right angles.","v":"types-of-quadrilaterals"},{"d":"MEDIUM","q":"Which statement about a square's diagonals is true?","o":["They are equal and perpendicular","They are unequal and perpendicular","They are equal but do not bisect each other","They are parallel"],"a":0,"e":"A square's diagonals are equal, perpendicular, and bisect each other.","v":"types-of-quadrilaterals"},{"d":"MEDIUM","q":"A quadrilateral has exactly one pair of parallel sides and equal non-parallel sides. Which is it?","o":["Rhombus","Isosceles trapezium","Rectangle","Parallelogram"],"a":1,"e":"An isosceles trapezium has one parallel pair and equal legs.","v":"types-of-quadrilaterals"},{"d":"MEDIUM","q":"Which quadrilateral has diagonals that are equal and bisect each other, but are not necessarily perpendicular?","o":["General rhombus","Kite","Rectangle","General trapezium"],"a":2,"e":"A rectangle's diagonals are equal and bisect each other, but need not meet at 90°.","v":"types-of-quadrilaterals"},{"d":"MEDIUM","q":"If all four sides of a quadrilateral are equal, which classification is guaranteed?","o":["Rectangle","Square","Isosceles trapezium","Rhombus"],"a":3,"e":"Four equal sides guarantee a rhombus; right angles are not guaranteed.","v":"types-of-quadrilaterals"},{"d":"HARD","q":"A parallelogram has adjacent angles (3x)° and (2x)°. Find x.","o":["36","30","45","60"],"a":0,"e":"Adjacent angles sum to 180°: 3x + 2x = 180, so x = 36.","v":"types-of-quadrilaterals"},{"d":"HARD","q":"A parallelogram has opposite angles (4x + 10)° and (6x − 30)°. Find x.","o":["10","20","15","25"],"a":1,"e":"Opposite angles are equal: 4x + 10 = 6x − 30, so 2x = 40 and x = 20.","v":"types-of-quadrilaterals"},{"d":"HARD","q":"A rectangle has diagonals of lengths (3x + 2) cm and (5x − 10) cm. Find x.","o":["4","8","6","10"],"a":2,"e":"Rectangle diagonals are equal: 3x + 2 = 5x − 10, giving x = 6.","v":"types-of-quadrilaterals"},{"d":"HARD","q":"A rhombus has one interior angle of 68°. What is an adjacent angle?","o":["68°","90°","136°","112°"],"a":3,"e":"Adjacent angles in a rhombus are supplementary, so 180° − 68° = 112°.","v":"types-of-quadrilaterals"},{"d":"HARD","q":"Which condition is sufficient to prove a quadrilateral is a parallelogram?","o":["Both pairs of opposite sides are equal","Exactly one pair of opposite sides is parallel","All angles are acute","Only one pair of adjacent sides is equal"],"a":0,"e":"If both pairs of opposite sides are equal, the quadrilateral is a parallelogram.","v":"types-of-quadrilaterals"},{"d":"HARD","q":"A quadrilateral's diagonals bisect each other. What conclusion follows?","o":["It must be a square","It is a parallelogram","Its diagonals must be perpendicular","All four sides must be equal"],"a":1,"e":"A quadrilateral whose diagonals bisect each other is a parallelogram.","v":"types-of-quadrilaterals"},{"d":"HARD","q":"A quadrilateral has four equal sides and one right angle. Which shape must it be?","o":["Non-square rhombus","Rectangle with unequal adjacent sides","Square","Kite only"],"a":2,"e":"In a rhombus, if one angle is 90°, all angles are 90°, making it a square.","v":"types-of-quadrilaterals"},{"d":"HARD","q":"In a kite, which diagonal property is always true?","o":["Both diagonals are always equal","Both diagonals always bisect each other","Both diagonals are always parallel","One diagonal bisects the other at right angles"],"a":3,"e":"A kite's symmetry diagonal perpendicularly bisects the other diagonal.","v":"types-of-quadrilaterals"},{"d":"HARD","q":"A quadrilateral has diagonals that are equal and bisect each other. Which conclusion is guaranteed?","o":["It is a rectangle, possibly a square","It must be a rhombus but not a square","It must be a kite but not a square","It has exactly one pair of parallel sides"],"a":0,"e":"A parallelogram with equal diagonals is a rectangle; a square is included.","v":"types-of-quadrilaterals"},{"d":"HARD","q":"A parallelogram has adjacent sides 7 cm and 11 cm. What is its perimeter?","o":["18 cm","36 cm","77 cm","28 cm"],"a":1,"e":"Opposite sides match, so perimeter = 2(7 + 11) = 36 cm.","v":"types-of-quadrilaterals"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Classify quadrilaterals and compare their properties</strong><small>Sides, angles and parallel pairs</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Rectangles, squares, rhombi and kites</strong><small>Use defining properties to identify shapes</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Connect side counts, angles and diagonals</strong><small>Solve equations reducible to linear form</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
