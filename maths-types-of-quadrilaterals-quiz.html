<script>
(function(){
'use strict';
const questions=[{"q":"A quadrilateral has how many sides?","o":["4","3","5","6"],"a":0,"why":"A quadrilateral is a polygon with four sides."},{"q":"Which quadrilateral has four equal sides and four right angles?","o":["Rhombus that is not a square","Square","Rectangle that is not a square","Kite"],"a":1,"why":"A square combines four equal sides with four right angles."},{"q":"Which quadrilateral always has four right angles?","o":["Rhombus","Kite","Rectangle","General trapezium"],"a":2,"why":"Every rectangle has four right angles."},{"q":"Which quadrilateral has all four sides equal, but its angles need not be right angles?","o":["Rectangle","Isosceles trapezium","Kite with unequal adjacent pairs","Rhombus"],"a":3,"why":"A rhombus has four equal sides; right angles are not required."},{"q":"In a parallelogram, opposite sides are:","o":["Parallel and equal","Perpendicular and unequal","Always perpendicular","All four necessarily unequal"],"a":0,"why":"Both pairs of opposite sides in a parallelogram are parallel and equal."},{"q":"Which quadrilateral has exactly one pair of parallel sides under the usual school definition?","o":["Parallelogram","Trapezium","Rectangle","Rhombus"],"a":1,"why":"A trapezium has one pair of parallel sides in the usual school definition."},{"q":"Which quadrilateral has two pairs of adjacent equal sides?","o":["Rectangle","Parallelogram with unequal sides","Kite","Isosceles trapezium"],"a":2,"why":"A kite has two pairs of equal adjacent sides."},{"q":"What is the sum of the interior angles of every quadrilateral?","o":["180°","270°","540°","360°"],"a":3,"why":"Every quadrilateral's interior-angle sum is 360°."},{"q":"Which shape has opposite sides equal and four right angles?","o":["Rectangle","Kite","Trapezium","General quadrilateral"],"a":0,"why":"A rectangle has equal opposite sides and four right angles."},{"q":"A square is also a special type of:","o":["Kite only","Rectangle and rhombus","Trapezium only","Pentagon"],"a":1,"why":"A square meets the definitions of both rectangle and rhombus."},{"q":"A parallelogram has one angle of 70°. What is the adjacent angle?","o":["70°","90°","110°","140°"],"a":2,"why":"Adjacent angles in a parallelogram are supplementary: 180° − 70° = 110°."},{"q":"One angle of a parallelogram is 125°. What is its opposite angle?","o":["55°","90°","35°","125°"],"a":3,"why":"Opposite angles in a parallelogram are equal."},{"q":"Which property is always true for a rhombus?","o":["All four sides are equal","All four angles are right angles","Diagonals are equal in every rhombus","Only one pair of sides is parallel"],"a":0,"why":"All four sides of a rhombus have equal length."},{"q":"Which property distinguishes a rectangle from a general parallelogram?","o":["All four sides are equal","Every angle is 90°","Diagonals are perpendicular in every case","Only one pair of sides is parallel"],"a":1,"why":"A rectangle has four right angles; a general parallelogram need not."},{"q":"A quadrilateral has both pairs of opposite sides parallel. What must it be?","o":["Kite","Trapezium with exactly one parallel pair","Parallelogram","Irregular pentagon"],"a":2,"why":"Having both pairs of opposite sides parallel defines a parallelogram."},{"q":"In a rhombus, the diagonals are always:","o":["Equal in length in every case","Parallel to each other","Never intersecting","Perpendicular bisectors of each other"],"a":3,"why":"A rhombus's diagonals bisect each other at right angles."},{"q":"Which statement about a square's diagonals is true?","o":["They are equal and perpendicular","They are unequal and perpendicular","They are equal but do not bisect each other","They are parallel"],"a":0,"why":"A square's diagonals are equal, perpendicular, and bisect each other."},{"q":"A quadrilateral has exactly one pair of parallel sides and equal non-parallel sides. Which is it?","o":["Rhombus","Isosceles trapezium","Rectangle","Parallelogram"],"a":1,"why":"An isosceles trapezium has one parallel pair and equal legs."},{"q":"Which quadrilateral has diagonals that are equal and bisect each other, but are not necessarily perpendicular?","o":["General rhombus","Kite","Rectangle","General trapezium"],"a":2,"why":"A rectangle's diagonals are equal and bisect each other, but need not meet at 90°."},{"q":"If all four sides of a quadrilateral are equal, which classification is guaranteed?","o":["Rectangle","Square","Isosceles trapezium","Rhombus"],"a":3,"why":"Four equal sides guarantee a rhombus; right angles are not guaranteed."},{"q":"A parallelogram has adjacent angles (3x)° and (2x)°. Find x.","o":["36","30","45","60"],"a":0,"why":"Adjacent angles sum to 180°: 3x + 2x = 180, so x = 36."},{"q":"A parallelogram has opposite angles (4x + 10)° and (6x − 30)°. Find x.","o":["10","20","15","25"],"a":1,"why":"Opposite angles are equal: 4x + 10 = 6x − 30, so 2x = 40 and x = 20."},{"q":"A rectangle has diagonals of lengths (3x + 2) cm and (5x − 10) cm. Find x.","o":["4","8","6","10"],"a":2,"why":"Rectangle diagonals are equal: 3x + 2 = 5x − 10, giving x = 6."},{"q":"A rhombus has one interior angle of 68°. What is an adjacent angle?","o":["68°","90°","136°","112°"],"a":3,"why":"Adjacent angles in a rhombus are supplementary, so 180° − 68° = 112°."},{"q":"Which condition is sufficient to prove a quadrilateral is a parallelogram?","o":["Both pairs of opposite sides are equal","Exactly one pair of opposite sides is parallel","All angles are acute","Only one pair of adjacent sides is equal"],"a":0,"why":"If both pairs of opposite sides are equal, the quadrilateral is a parallelogram."},{"q":"A quadrilateral's diagonals bisect each other. What conclusion follows?","o":["It must be a square","It is a parallelogram","Its diagonals must be perpendicular","All four sides must be equal"],"a":1,"why":"A quadrilateral whose diagonals bisect each other is a parallelogram."},{"q":"A quadrilateral has four equal sides and one right angle. Which shape must it be?","o":["Non-square rhombus","Rectangle with unequal adjacent sides","Square","Kite only"],"a":2,"why":"In a rhombus, if one angle is 90°, all angles are 90°, making it a square."},{"q":"In a kite, which diagonal property is always true?","o":["Both diagonals are always equal","Both diagonals always bisect each other","Both diagonals are always parallel","One diagonal bisects the other at right angles"],"a":3,"why":"A kite's symmetry diagonal perpendicularly bisects the other diagonal."},{"q":"A quadrilateral has diagonals that are equal and bisect each other. Which conclusion is guaranteed?","o":["It is a rectangle, possibly a square","It must be a rhombus but not a square","It must be a kite but not a square","It has exactly one pair of parallel sides"],"a":0,"why":"A parallelogram with equal diagonals is a rectangle; a square is included."},{"q":"A parallelogram has adjacent sides 7 cm and 11 cm. What is its perimeter?","o":["18 cm","36 cm","77 cm","28 cm"],"a":1,"why":"Opposite sides match, so perimeter = 2(7 + 11) = 36 cm."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Types of Quadrilaterals Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-types-of-quadrilaterals-large-numbers-layout-v1" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
