<script>
(function(){
'use strict';
const questions=[{"q":"A triangle has three equal sides. What type is it?","o":["Equilateral","Isosceles","Scalene","Right-angled"],"a":0,"why":"An equilateral triangle has all three sides equal."},{"q":"A triangle has exactly two equal sides. What type is it?","o":["Scalene","Isosceles","Equilateral","Obtuse"],"a":1,"why":"An isosceles triangle has at least two equal sides; here exactly two are equal."},{"q":"A triangle has side lengths 4 cm, 5 cm and 6 cm. Classify it by sides.","o":["Equilateral","Isosceles","Scalene","Right-angled"],"a":2,"why":"All three side lengths differ, so it is scalene."},{"q":"Which triangle has one angle equal to 90°?","o":["Acute-angled","Obtuse-angled","Right-angled","Equilateral"],"a":2,"why":"A right-angled triangle has one right angle."},{"q":"A triangle has angles 50°, 60° and 70°. How is it classified by angles?","o":["Acute-angled","Right-angled","Obtuse-angled","Equilateral by sides"],"a":0,"why":"All three angles are less than 90°, so it is acute-angled."},{"q":"A triangle has an angle of 110°. What type is it by angles?","o":["Acute-angled","Right-angled","Obtuse-angled","Equilateral"],"a":2,"why":"A triangle with one angle greater than 90° is obtuse-angled."},{"q":"Which set of side lengths describes an equilateral triangle?","o":["3 cm, 4 cm, 5 cm","6 cm, 6 cm, 6 cm","5 cm, 5 cm, 8 cm","4 cm, 4 cm, 7 cm"],"a":1,"why":"All three sides of an equilateral triangle are equal."},{"q":"A triangle has two angles of 45° each. What is its third angle?","o":["45°","60°","90°","100°"],"a":2,"why":"The angles sum to 180°: 180° − 45° − 45° = 90°."},{"q":"Which set can be the angles of a triangle?","o":["60°, 60°, 60°","90°, 60°, 40°","100°, 50°, 40°","80°, 80°, 30°"],"a":0,"why":"The three angles must total 180°; 60° + 60° + 60° = 180°."},{"q":"A triangle has side lengths 7 cm, 7 cm and 10 cm. Classify it by sides.","o":["Scalene","Equilateral","Isosceles","Right-angled only"],"a":2,"why":"Two sides are equal, so it is isosceles."},{"q":"Two angles of a triangle are 35° and 85°. Find the third angle.","o":["50°","60°","70°","80°"],"a":1,"why":"180° − 35° − 85° = 60°."},{"q":"An isosceles triangle has a vertex angle of 40°. Find each base angle.","o":["40°","60°","70°","80°"],"a":2,"why":"The base angles are equal and total 180° − 40° = 140°, so each is 70°."},{"q":"An equilateral triangle has perimeter 27 cm. Find one side.","o":["6 cm","8 cm","9 cm","12 cm"],"a":2,"why":"All three sides are equal, so each is 27 ÷ 3 = 9 cm."},{"q":"Which side lengths cannot form a triangle?","o":["4, 5, 6","3, 4, 5","2, 3, 6","5, 5, 7"],"a":2,"why":"The sum of the two shorter sides must exceed the longest: 2 + 3 is less than 6."},{"q":"An isosceles triangle has equal sides 8 cm each and base 5 cm. Find its perimeter.","o":["13 cm","16 cm","21 cm","24 cm"],"a":2,"why":"Perimeter = 8 + 8 + 5 = 21 cm."},{"q":"A triangle's angles are x°, 2x° and 3x°. Find the largest angle.","o":["30°","60°","90°","120°"],"a":2,"why":"6x = 180°, so x = 30° and the largest angle is 3x = 90°."},{"q":"A triangle has angles 90° and 35°. What is the third angle and classification?","o":["55°, right-angled","65°, acute-angled triangle","55°, obtuse-angled","45°, right-angled"],"a":0,"why":"The third angle is 180° − 90° − 35° = 55°; one angle is 90°."},{"q":"The angles of a triangle are in the ratio 2:3:4. Find the largest angle.","o":["40°","60°","80°","90°"],"a":2,"why":"Nine parts equal 180°, so one part is 20° and the largest angle is 4 × 20° = 80°."},{"q":"A triangle has side lengths 9 cm, 9 cm and 9 cm. Each angle is:","o":["45°","60°","90°","120°"],"a":1,"why":"An equilateral triangle is equiangular; each angle is 180° ÷ 3 = 60°."},{"q":"Two sides of a triangle are 6 cm and 10 cm. Which could be the integer length of the third side?","o":["3 cm","4 cm","5 cm","16 cm"],"a":2,"why":"The third side must be greater than 10 − 6 = 4 and less than 10 + 6 = 16; 5 cm satisfies both limits."},{"q":"An isosceles triangle has a base angle of 3x° and vertex angle of 4x°. Find x.","o":["18°","20°","24°","30°"],"a":0,"why":"3x + 3x + 4x = 180°, so 10x = 180° and x = 18°. "},{"q":"The angles of a triangle are (x + 10)°, (2x + 5)° and (3x − 15)°. Find the largest angle.","o":["55°","65°","75°","85°"],"a":2,"why":"6x = 180°, so x = 30°; angles are 40°, 65° and 75°."},{"q":"A triangle has side lengths 7 cm, 10 cm and n cm, where n is an integer. What is the smallest possible n?","o":["2 cm","3 cm","4 cm","17 cm"],"a":2,"why":"Triangle inequality requires n + 7 > 10, so n > 3; the smallest integer is 4."},{"q":"An isosceles triangle has perimeter 32 cm and base 12 cm. Find each equal side.","o":["8 cm","10 cm","12 cm","16 cm"],"a":1,"why":"The equal sides total 32 − 12 = 20 cm, so each is 10 cm."},{"q":"A triangle's angles are in the ratio 1:2:3. Which classification is correct?","o":["Acute-angled","Right-angled","Obtuse-angled","Equilateral"],"a":1,"why":"Six parts equal 180°, giving angles 30°, 60° and 90°."},{"q":"Two angles of a triangle are equal and the third is 100°. What is the triangle's angle classification?","o":["Acute-angled","Right-angled","Obtuse-angled","Equilateral"],"a":2,"why":"The remaining angles are 40° each, and the 100° angle makes it obtuse-angled."},{"q":"A triangle has sides 5 cm, 12 cm and 13 cm. Which classification is true?","o":["Equilateral","Isosceles","Scalene and right-angled","Scalene and obtuse-angled"],"a":2,"why":"All sides differ, and 5² + 12² = 25 + 144 = 169 = 13², so it is a scalene right triangle."},{"q":"The largest angle in a triangle is 95°. Which statement must be true?","o":["The triangle is acute-angled","The triangle is right-angled","The triangle is obtuse-angled","The triangle is equilateral"],"a":2,"why":"A triangle with an angle greater than 90° is obtuse-angled."},{"q":"A triangle has side lengths 2x, 3x and 4x cm. If its perimeter is 36 cm, find the longest side.","o":["8 cm","12 cm","16 cm","18 cm"],"a":2,"why":"9x = 36 gives x = 4; the longest side is 4x = 16 cm."},{"q":"An isosceles triangle has equal sides of 13 cm and base 10 cm. If the base is increased to 26 cm, what happens?","o":["It remains a valid triangle","It becomes equilateral","It cannot form a triangle","It becomes right-angled"],"a":2,"why":"The sum of the two 13 cm sides is 26 cm, equal to the base; triangle side sums must be strictly greater."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Types of Triangles Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261104-physics-path-layout-v2" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
