<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
 .skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}.skills-result{margin-top:14px;text-align:left}.skills-result h3{margin:0 0 8px;font-size:1rem}.skills-result .skill-item{margin-top:7px}.skill-item.unlocked{border-color:var(--green);color:var(--green2);background:#174b42} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}.diagram .accent{stroke:#58d6a3}.diagram .blue{stroke:#91b7ff}.diagram .gold{stroke:#ffd27a} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Triangle Types</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Triangle Skills"><div class="skill-title">🎯 Triangle Skills</div><div class="skill-list"><div class="skill-item">Classify triangles by sides and angles</div><div class="skill-item">Use angle sums to classify triangles</div><div class="skill-item">Solve triangle classification and side-length problems</div></div></section></div>
<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"A triangle has three equal sides. What type is it?","o":["Equilateral","Isosceles","Scalene","Right-angled"],"a":0,"e":"An equilateral triangle has all three sides equal.","v":"types-of-triangles"},{"d":"BASIC","q":"A triangle has exactly two equal sides. What type is it?","o":["Scalene","Isosceles","Equilateral","Obtuse"],"a":1,"e":"An isosceles triangle has at least two equal sides; here exactly two are equal.","v":"types-of-triangles"},{"d":"BASIC","q":"A triangle has side lengths 4 cm, 5 cm and 6 cm. Classify it by sides.","o":["Equilateral","Isosceles","Scalene","Right-angled"],"a":2,"e":"All three side lengths differ, so it is scalene.","v":"types-of-triangles"},{"d":"BASIC","q":"Which triangle has one angle equal to 90°?","o":["Acute-angled","Obtuse-angled","Right-angled","Equilateral"],"a":2,"e":"A right-angled triangle has one right angle.","v":"types-of-triangles"},{"d":"BASIC","q":"A triangle has angles 50°, 60° and 70°. How is it classified by angles?","o":["Acute-angled","Right-angled","Obtuse-angled","Equilateral by sides"],"a":0,"e":"All three angles are less than 90°, so it is acute-angled.","v":"types-of-triangles"},{"d":"BASIC","q":"A triangle has an angle of 110°. What type is it by angles?","o":["Acute-angled","Right-angled","Obtuse-angled","Equilateral"],"a":2,"e":"A triangle with one angle greater than 90° is obtuse-angled.","v":"types-of-triangles"},{"d":"BASIC","q":"Which set of side lengths describes an equilateral triangle?","o":["3 cm, 4 cm, 5 cm","6 cm, 6 cm, 6 cm","5 cm, 5 cm, 8 cm","4 cm, 4 cm, 7 cm"],"a":1,"e":"All three sides of an equilateral triangle are equal.","v":"types-of-triangles"},{"d":"BASIC","q":"A triangle has two angles of 45° each. What is its third angle?","o":["45°","60°","90°","100°"],"a":2,"e":"The angles sum to 180°: 180° − 45° − 45° = 90°.","v":"types-of-triangles"},{"d":"BASIC","q":"Which set can be the angles of a triangle?","o":["60°, 60°, 60°","90°, 60°, 40°","100°, 50°, 40°","80°, 80°, 30°"],"a":0,"e":"The three angles must total 180°; 60° + 60° + 60° = 180°.","v":"types-of-triangles"},{"d":"BASIC","q":"A triangle has side lengths 7 cm, 7 cm and 10 cm. Classify it by sides.","o":["Scalene","Equilateral","Isosceles","Right-angled only"],"a":2,"e":"Two sides are equal, so it is isosceles.","v":"types-of-triangles"},{"d":"MEDIUM","q":"Two angles of a triangle are 35° and 85°. Find the third angle.","o":["50°","60°","70°","80°"],"a":1,"e":"180° − 35° − 85° = 60°.","v":"types-of-triangles"},{"d":"MEDIUM","q":"An isosceles triangle has a vertex angle of 40°. Find each base angle.","o":["40°","60°","70°","80°"],"a":2,"e":"The base angles are equal and total 180° − 40° = 140°, so each is 70°.","v":"types-of-triangles"},{"d":"MEDIUM","q":"An equilateral triangle has perimeter 27 cm. Find one side.","o":["6 cm","8 cm","9 cm","12 cm"],"a":2,"e":"All three sides are equal, so each is 27 ÷ 3 = 9 cm.","v":"types-of-triangles"},{"d":"MEDIUM","q":"Which side lengths cannot form a triangle?","o":["4, 5, 6","3, 4, 5","2, 3, 6","5, 5, 7"],"a":2,"e":"The sum of the two shorter sides must exceed the longest: 2 + 3 is less than 6.","v":"types-of-triangles"},{"d":"MEDIUM","q":"An isosceles triangle has equal sides 8 cm each and base 5 cm. Find its perimeter.","o":["13 cm","16 cm","21 cm","24 cm"],"a":2,"e":"Perimeter = 8 + 8 + 5 = 21 cm.","v":"types-of-triangles"},{"d":"MEDIUM","q":"A triangle's angles are x°, 2x° and 3x°. Find the largest angle.","o":["30°","60°","90°","120°"],"a":2,"e":"6x = 180°, so x = 30° and the largest angle is 3x = 90°.","v":"types-of-triangles"},{"d":"MEDIUM","q":"A triangle has angles 90° and 35°. What is the third angle and classification?","o":["55°, right-angled","65°, acute-angled triangle","55°, obtuse-angled","45°, right-angled"],"a":0,"e":"The third angle is 180° − 90° − 35° = 55°; one angle is 90°.","v":"types-of-triangles"},{"d":"MEDIUM","q":"The angles of a triangle are in the ratio 2:3:4. Find the largest angle.","o":["40°","60°","80°","90°"],"a":2,"e":"Nine parts equal 180°, so one part is 20° and the largest angle is 4 × 20° = 80°.","v":"types-of-triangles"},{"d":"MEDIUM","q":"A triangle has side lengths 9 cm, 9 cm and 9 cm. Each angle is:","o":["45°","60°","90°","120°"],"a":1,"e":"An equilateral triangle is equiangular; each angle is 180° ÷ 3 = 60°.","v":"types-of-triangles"},{"d":"MEDIUM","q":"Two sides of a triangle are 6 cm and 10 cm. Which could be the integer length of the third side?","o":["3 cm","4 cm","5 cm","16 cm"],"a":2,"e":"The third side must be greater than 10 − 6 = 4 and less than 10 + 6 = 16; 5 cm satisfies both limits.","v":"types-of-triangles"},{"d":"HARD","q":"An isosceles triangle has a base angle of 3x° and vertex angle of 4x°. Find x.","o":["18°","20°","24°","30°"],"a":0,"e":"3x + 3x + 4x = 180°, so 10x = 180° and x = 18°. ","v":"types-of-triangles"},{"d":"HARD","q":"The angles of a triangle are (x + 10)°, (2x + 5)° and (3x − 15)°. Find the largest angle.","o":["55°","65°","75°","85°"],"a":2,"e":"6x = 180°, so x = 30°; angles are 40°, 65° and 75°.","v":"types-of-triangles"},{"d":"HARD","q":"A triangle has side lengths 7 cm, 10 cm and n cm, where n is an integer. What is the smallest possible n?","o":["2 cm","3 cm","4 cm","17 cm"],"a":2,"e":"Triangle inequality requires n + 7 > 10, so n > 3; the smallest integer is 4.","v":"types-of-triangles"},{"d":"HARD","q":"An isosceles triangle has perimeter 32 cm and base 12 cm. Find each equal side.","o":["8 cm","10 cm","12 cm","16 cm"],"a":1,"e":"The equal sides total 32 − 12 = 20 cm, so each is 10 cm.","v":"types-of-triangles"},{"d":"HARD","q":"A triangle's angles are in the ratio 1:2:3. Which classification is correct?","o":["Acute-angled","Right-angled","Obtuse-angled","Equilateral"],"a":1,"e":"Six parts equal 180°, giving angles 30°, 60° and 90°.","v":"types-of-triangles"},{"d":"HARD","q":"Two angles of a triangle are equal and the third is 100°. What is the triangle's angle classification?","o":["Acute-angled","Right-angled","Obtuse-angled","Equilateral"],"a":2,"e":"The remaining angles are 40° each, and the 100° angle makes it obtuse-angled.","v":"types-of-triangles"},{"d":"HARD","q":"A triangle has sides 5 cm, 12 cm and 13 cm. Which classification is true?","o":["Equilateral","Isosceles","Scalene and right-angled","Scalene and obtuse-angled"],"a":2,"e":"All sides differ, and 5² + 12² = 25 + 144 = 169 = 13², so it is a scalene right triangle.","v":"types-of-triangles"},{"d":"HARD","q":"The largest angle in a triangle is 95°. Which statement must be true?","o":["The triangle is acute-angled","The triangle is right-angled","The triangle is obtuse-angled","The triangle is equilateral"],"a":2,"e":"A triangle with an angle greater than 90° is obtuse-angled.","v":"types-of-triangles"},{"d":"HARD","q":"A triangle has side lengths 2x, 3x and 4x cm. If its perimeter is 36 cm, find the longest side.","o":["8 cm","12 cm","16 cm","18 cm"],"a":2,"e":"9x = 36 gives x = 4; the longest side is 4x = 16 cm.","v":"types-of-triangles"},{"d":"HARD","q":"An isosceles triangle has equal sides of 13 cm and base 10 cm. If the base is increased to 26 cm, what happens?","o":["It remains a valid triangle","It becomes equilateral","It cannot form a triangle","It becomes right-angled"],"a":2,"e":"The sum of the two 13 cm sides is 26 cm, equal to the base; triangle side sums must be strictly greater.","v":"types-of-triangles"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}const visuals={
balance:'',
blocks:'',
bars:'',
picture:''
};function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🔢</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+'<div class="skill-item '+(correct>=8?'unlocked':'')+'">'+(correct>=8?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Classify triangles by sides and angles</div>'+'<div class="skill-item '+(correct>=18?'unlocked':'')+'">'+(correct>=18?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Use angle sums to classify triangles</div>'+'<div class="skill-item '+(correct>=24?'unlocked':'')+'">'+(correct>=24?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Apply triangle inequality and perimeter</div>'+'</div></div>' ;$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script>\n<script src="/shared-nav.js?v=20261013-universal-nav-v1"></script>\n</body></html>
