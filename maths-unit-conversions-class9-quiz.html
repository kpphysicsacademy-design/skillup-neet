x;min-height:48px;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);text-align:left;font:700 14px/1.4 inherit;cursor:pointer}.choice.selected{border-color:var(--blue);background:#f0f7ff}.choice.correct{border-color:#8dce70;background:#f0fae9}.choice.wrong{border-color:#efa5ad;background:#fff1f2}.choice:disabled{opacity:1}.letter{display:grid;place-items:center;flex:0 0 26px;height:26px;border:1px solid var(--line);border-radius:8px;font-size:11px;color:var(--muted)}.feedback{display:none;margin-top:14px;padding:12px;border-radius:11px;font-size:13px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#eff9e9;color:#286b19}.feedback.bad{background:#fff1f2;color:#9b3030}.action{width:100%;min-height:46px;margin-top:16px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:14px;font-weight:900;cursor:pointer}.action:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:38px;font-weight:950;margin:8px}.end p{color:var(--muted)}@media(max-width:520px){main{width:100%;padding:10px 10px 28px}.top{padding:8px 10px}.hero{padding:18px 16px;border-radius:17px}.card{padding:15px;border-radius:15px}.question{font-size:19px}.choice{min-height:44px;font-size:13px}}

<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"How many centimetres are there in 1 metre?","o":["10 cm","100 cm","1,000 cm","0.1 cm"],"a":1,"e":"1 metre = 100 centimetres."},{"d":"BASIC","q":"Convert 3.5 km into metres.","o":["35 m","350 m","3,500 m","35,000 m"],"a":2,"e":"1 km = 1,000 m, so 3.5 × 1,000 = 3,500 m."},{"d":"BASIC","q":"Which unit is suitable for measuring the volume of a water tank?","o":["cm","cm²","cm³","kg"],"a":2,"e":"Volume is measured in cubic units such as cm³ or m³."},{"d":"BASIC","q":"Convert 2 litres into millilitres.","o":["20 mL","200 mL","2,000 mL","20,000 mL"],"a":2,"e":"1 litre = 1,000 millilitres; 2 L = 2,000 mL."},{"d":"BASIC","q":"How many square centimetres are in 1 square metre?","o":["100 cm²","1,000 cm²","10,000 cm²","100,000 cm²"],"a":2,"e":"1 m = 100 cm, so 1 m² = 100 × 100 = 10,000 cm²."},{"d":"MEDIUM","q":"Convert 450 cm into metres.","o":["0.45 m","4.5 m","45 m","450 m"],"a":1,"e":"450 ÷ 100 = 4.5 m."},{"d":"MEDIUM","q":"A cuboid has a volume of 2 m³. What is this volume in cm³?","o":["2,000 cm³","20,000 cm³","200,000 cm³","2,000,000 cm³"],"a":3,"e":"1 m³ = 100³ cm³ = 1,000,000 cm³; therefore 2 m³ = 2,000,000 cm³."},{"d":"MEDIUM","q":"Convert 7,500 mm into metres.","o":["0.75 m","7.5 m","75 m","750 m"],"a":1,"e":"1 m = 1,000 mm; 7,500 ÷ 1,000 = 7.5 m."},{"d":"MEDIUM","q":"A rectangular floor has area 3.2 m². Express this area in cm².","o":["320 cm²","3,200 cm²","32,000 cm²","320,000 cm²"],"a":1,"e":"1 m² = 10,000 cm²; 3.2 × 10,000 = 32,000 cm²."},{"d":"MEDIUM","q":"Convert 0.06 m³ into litres. (1 m³ = 1,000 L)","o":["0.6 L","6 L","60 L","600 L"],"a":2,"e":"0.06 × 1,000 = 60 litres."},{"d":"MEDIUM","q":"A metal rod is 2 m 35 cm long. What is its length in centimetres?","o":["205 cm","230 cm","235 cm","2,350 cm"],"a":2,"e":"2 m = 200 cm; 200 + 35 = 235 cm."},{"d":"MEDIUM","q":"Convert 48,000 cm³ into litres. (1,000 cm³ = 1 L)","o":["4.8 L","48 L","480 L","4,800 L"],"a":1,"e":"48,000 ÷ 1,000 = 48 litres."},{"d":"MEDIUM","q":"A square sheet has side 40 cm. What is its area in m²?","o":["0.016 m²","0.16 m²","1.6 m²","16 m²"],"a":1,"e":"40 cm = 0.4 m; area = 0.4 × 0.4 = 0.16 m²."},{"d":"HARD","q":"A tank measures 2.5 m × 1.2 m × 0.8 m. Find its capacity in litres.","o":["240 L","2,400 L","24,000 L","240,000 L"],"a":1,"e":"Volume = 2.5 × 1.2 × 0.8 = 2.4 m³ = 2,400 L."},{"d":"HARD","q":"A rectangular plot is 25 m long and 16 m wide. Express its area in hectares. (1 hectare = 10,000 m²)","o":["0.004 ha","0.04 ha","0.4 ha","4 ha"],"a":1,"e":"Area = 25 × 16 = 400 m²; 400 ÷ 10,000 = 0.04 ha."},{"d":"HARD","q":"A cube has side 50 cm. What is its volume in cubic metres?","o":["0.0125 m³","0.125 m³","1.25 m³","12.5 m³"],"a":1,"e":"50 cm = 0.5 m; volume = 0.5³ = 0.125 m³."},{"d":"HARD","q":"A cylindrical vessel contains 3.5 litres of water. What is this volume in cm³?","o":["350 cm³","3,050 cm³","3,500 cm³","35,000 cm³"],"a":2,"e":"1 L = 1,000 cm³; 3.5 L = 3,500 cm³."},{"d":"HARD","q":"A room is 5 m long, 4 m wide and 3 m high. What is its volume in cm³?","o":["6,000 cm³","60,000 cm³","600,000 cm³","60,000,000 cm³"],"a":3,"e":"Volume = 5 × 4 × 3 = 60 m³ = 60 × 1,000,000 = 60,000,000 cm³."},{"d":"HARD","q":"A rectangular sheet has dimensions 1.5 m by 80 cm. Find its area in cm².","o":["1,200 cm²","12,000 cm²","120,000 cm²","1,200,000 cm²"],"a":1,"e":"1.5 m = 150 cm; area = 150 × 80 = 12,000 cm²."},{"d":"HARD","q":"A water tank holds 0.75 m³. How many 5-litre buckets can fill it completely?","o":["15","75","150","1,500"],"a":2,"e":"0.75 m³ = 750 L; 750 ÷ 5 = 150 buckets."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';$('percent').textContent=Math.round(p)+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('meta').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('feedback').className='feedback';$('feedback').textContent='';$('content').replaceChildren();const stem=document.createElement('div');stem.className='question';stem.textContent=q.q;$('content').append(stem);const choices=document.createElement('div');choices.className='choices';q.o.forEach((v,i)=>{const b=document.createElement('button');b.type='button';b.className='choice';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+i);const label=document.createElement('span');label.textContent=v;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;selected=i;choices.querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===i));$('action').disabled=false;});choices.append(b);});$('content').append(choices);$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function results(){finished=true;bar.style.width='100%';$('percent').textContent='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('meta').textContent='PRACTICE COMPLETE';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3rem">🏆</div><h2>'+(correct>=16?'Excellent work!':correct>=10?'Good progress!':'Keep practising!')+'</h2><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly and earned '+xp+' XP.</p></div>';$('action').textContent='Try again ↻';$('action').disabled=false;}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Review: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();</script></body></html>
