<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7ed"><meta name="skillup-release" content="20261106-unitary-method-daily-life-v2"><title>Unitary Method in Daily Life | SkillUp Maths</title>
<style>
:root{color-scheme:light;--bg:#f7f7ed;--panel:#fff;--line:#dfe5d8;--ink:#29352c;--muted:#69766b;--green:#718b6b;--green-dark:#586f53;--green-soft:#e8f0e4;--red:#b94b50;--blue:#6c9fc4;--blue-soft:#e8f2f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}
.wrap{max-width:550px;margin:auto;padding:16px}
.top{display:grid;grid-template-columns:auto auto minmax(35px,1fr) auto auto;align-items:center;gap:9px;margin:4px 0 20px}
.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}
.progress{height:10px;border-radius:20px;background:#e5e9df;overflow:hidden;min-width:35px}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}
.pill{background:#edf1e9;padding:5px 8px;border-radius:12px;font-size:.8rem;font-weight:850;white-space:nowrap;color:var(--ink)}.xp{color:var(--green-dark)}
.meta{display:flex;justify-content:flex-start;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column;box-shadow:0 2px 8px #35452b0a}
.eyebrow{color:var(--green-dark);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:.7px}
.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}
.choice{width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:13px;color:var(--ink);padding:13px 15px;font:inherit;font-weight:700;min-height:52px;cursor:pointer}
.choice:hover{border-color:#a9b99f;background:#fbfcf8}.choice.selected{border-color:var(--blue);background:var(--blue-soft)}
.choice.correct{border-color:var(--green);background:var(--green-soft);color:#38543a}.choice.wrong{border-color:#d88c8c;background:#fae9e9;color:#87383d}.choice:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:12px;border-radius:12px;background:#f2f5ef;color:var(--muted)}.feedback.show{display:block}
.feedback.good{border:1px solid #a8c39e;color:#38543a}.feedback.bad{border:1px solid #e0b1b1}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}
.hint{color:var(--muted);font-size:.8rem}
button.primary{font:inherit;font-weight:850;cursor:pointer;border:0;border-radius:12px;background:var(--green);color:#fff;padding:12px 20px;min-width:140px}
button.primary:hover{background:var(--green-dark)}button.primary:disabled{opacity:.45;cursor:not-allowed}
.end{text-align:center}.score{font-size:2.5rem;color:var(--green-dark);font-weight:950}
.summary{background:#f2f5ef;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}
.skills{display:grid;gap:9px;text-align:left;margin:14px 0}
.skill{display:flex;align-items:center;gap:12px;background:#fbfcf8;border:1px solid var(--line);border-radius:12px;padding:12px}
.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green-dark)}.skill small{color:var(--muted)}
button:focus-visible,.choice:focus-visible,.back:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
@media(max-width:420px){.wrap{padding:11px}.top{gap:6px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.72rem;padding:5px 6px}.actions button{flex:1}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}

0","₹735","₹770","₹840"],"a":2,"e":"₹70 per metre; 11 m costs ₹770.","v":"unitary-method"},{"d":"MEDIUM","q":"5 L paint covers 20 m². Area covered by 8 L?","o":["28 m²","30 m²","32 m²","40 m²"],"a":2,"e":"1 L covers 4 m²; 8 L cover 32 m².","v":"unitary-method"},{"d":"MEDIUM","q":"4 machines make 240 bottles/hour. Output of 7 machines?","o":["360","400","420","480"],"a":2,"e":"One machine makes 60; 7 make 420.","v":"unitary-method"},{"d":"MEDIUM","q":"9 workers earn ₹8,100 equally. One worker's earning?","o":["₹800","₹850","₹900","₹950"],"a":2,"e":"₹8,100 ÷ 9 = ₹900.","v":"unitary-method"},{"d":"MEDIUM","q":"A train travels 240 km in 4 hours. Distance in 7 hours?","o":["360 km","390 km","420 km","480 km"],"a":2,"e":"Speed is 60 km/h; distance is 420 km.","v":"unitary-method"},{"d":"MEDIUM","q":"15 bottles hold 12 L equally. How much do 20 bottles hold?","o":["14 L","15 L","16 L","18 L"],"a":2,"e":"Each holds 0.8 L; 20 hold 16 L.","v":"unitary-method"},{"d":"MEDIUM","q":"A copier makes 18 copies in 3 minutes. Copies in 10 minutes?","o":["45","50","60","72"],"a":2,"e":"6 copies/minute; 10 minutes gives 60.","v":"unitary-method"},{"d":"MEDIUM","q":"6 bags contain 150 kg grain. Weight in 9 bags?","o":["200 kg","215 kg","225 kg","250 kg"],"a":2,"e":"Each bag is 25 kg; 9 bags are 225 kg.","v":"unitary-method"},{"d":"HARD","q":"12 workers pack 360 boxes. How many can 17 workers pack at the same rate?","o":["450","480","510","540"],"a":2,"e":"Each worker packs 30; 17 pack 510.","v":"unitary-method"},{"d":"HARD","q":"8 m wire costs ₹680. Cost of 13 m?","o":["₹1,020","₹1,060","₹1,105","₹1,160"],"a":2,"e":"₹85 per metre; 13 m costs ₹1,105.","v":"unitary-method"},{"d":"HARD","q":"A van travels 240 km on 15 L fuel. Distance on 22 L?","o":["320 km","330 km","352 km","360 km"],"a":2,"e":"16 km/L × 22 = 352 km.","v":"unitary-method"},{"d":"HARD","q":"6 workers finish a job in 12 days. Time for 8 workers?","o":["8 days","9 days","10 days","12 days"],"a":1,"e":"72 worker-days ÷ 8 = 9 days.","v":"unitary-method"},{"d":"HARD","q":"16 students need 4 L juice. Juice for 27 students?","o":["5.5 L","6 L","6.75 L","7.5 L"],"a":2,"e":"0.25 L per student; 27 need 6.75 L.","v":"unitary-method"},{"d":"HARD","q":"18 notebooks cost ₹540. Cost of 25 notebooks?","o":["₹650","₹700","₹750","₹800"],"a":2,"e":"Each costs ₹30; 25 cost ₹750.","v":"unitary-method"},{"d":"HARD","q":"2.5 kg sugar costs ₹160. Cost of 4.25 kg?","o":["₹256","₹264","₹272","₹288"],"a":2,"e":"₹64/kg × 4.25 = ₹272.","v":"unitary-method"},{"d":"HARD","q":"14 m fabric makes 8 curtains. How many curtains from 21 m?","o":["10","11","12","14"],"a":2,"e":"Each uses 1.75 m; 21 m makes 12.","v":"unitary-method"},{"d":"HARD","q":"4 taps fill a tank in 6 hours. Time for 3 identical taps?","o":["4.5 hours","6 hours","8 hours","10 hours"],"a":2,"e":"24 tap-hours ÷ 3 = 8 hours.","v":"unitary-method"},{"d":"HARD","q":"A machine prints 250 pages in 5 minutes. Pages in 18 minutes?","o":["750","800","900","1,000"],"a":2,"e":"50 pages/minute × 18 = 900.","v":"unitary-method"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Find the value of one unit</strong><small>Calculate unit prices, wages and rates</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Use direct proportion in daily life</strong><small>Scale costs, ingredients, distances and production</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply inverse proportion</strong><small>Solve worker, tap and time problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>

<script>
/* Safe visible fallback: keeps the first question usable if the main quiz script fails to initialize. */
(function(){
  var root=document.querySelector('[data-render-fallback="true"]');
  if(!root)return;
  var chosen=-1, locked=false, buttons=root.querySelectorAll('.choice');
  var action=document.getElementById('action'), feedback=document.getElementById('feedback'), hint=document.getElementById('hint');
  buttons.forEach(function(button){
    button.addEventListener('click',function(){
      if(locked)return;
      chosen=Number(button.getAttribute('data-i'));
      buttons.forEach(function(item,index){item.classList.toggle('selected',index===chosen);});
      action.disabled=false;
    });
  });
  action.addEventListener('click',function(){
    if(locked||chosen<0)return;
    locked=true;
    buttons.forEach(function(button,index){
      button.disabled=true;
      if(index===2)button.classList.add('correct');
      else if(index===chosen)button.classList.add('wrong');
    });
    var correct=chosen===2;
    feedback.textContent=correct?'Correct! ₹48 ÷ 4 = ₹12. Reload the page to continue the full quiz.':'₹48 ÷ 4 = ₹12. Reload the page to continue the full quiz.';
    feedback.className='feedback show '+(correct?'good':'bad');
    hint.textContent=correct?'+10 XP':'Keep practising';
    action.textContent='Reload quiz ↻';
    action.disabled=false;
    action.onclick=function(){location.reload();};
  });
})();
</script>
