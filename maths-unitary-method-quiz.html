<main><div class="eyebrow">Maths · Ratio and Proportion</div><h1>Unitary Method in Daily Life</h1><p class="intro">Find the value of one unit first, then use it to calculate the value of any number of units in everyday situations.</p>

<div class="pr"><span id="counter">QUESTION 1 OF 30</span><span id="pct">0% complete</span></div><div class="track" id="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="bar"></div></div>

<script>
(()=>{'use strict';const questions=[{"d":"BASIC","q":"4 pens cost ₹48. Cost of 1 pen?","o":["₹8","₹10","₹12","₹16"],"a":2,"e":"₹48 ÷ 4 = ₹12.","v":"unitary-method"},{"d":"BASIC","q":"6 bananas cost ₹36. Cost of 10 bananas?","o":["₹50","₹54","₹60","₹66"],"a":2,"e":"One banana costs ₹6; 10 cost ₹60.","v":"unitary-method"},{"d":"BASIC","q":"5 notebooks cost ₹150. Cost of 3 notebooks?","o":["₹60","₹75","₹90","₹100"],"a":2,"e":"One notebook costs ₹30; 3 cost ₹90.","v":"unitary-method"},{"d":"BASIC","q":"3 L of milk cost ₹180. Cost of 2 L?","o":["₹60","₹90","₹120","₹150"],"a":2,"e":"One litre costs ₹60; 2 litres cost ₹120.","v":"unitary-method"},{"d":"BASIC","q":"8 equal tickets cost ₹400. Price of one ticket?","o":["₹40","₹45","₹50","₹80"],"a":2,"e":"₹400 ÷ 8 = ₹50.","v":"unitary-method"},{"d":"BASIC","q":"4 workers earn ₹2,400 equally. One worker earns?","o":["₹400","₹500","₹600","₹800"],"a":2,"e":"₹2,400 ÷ 4 = ₹600.","v":"unitary-method"},{"d":"BASIC","q":"A car travels 150 km in 3 hours. Distance in 1 hour?","o":["30 km","40 km","50 km","60 km"],"a":2,"e":"150 ÷ 3 = 50 km.","v":"unitary-method"},{"d":"BASIC","q":"2 kg rice cost ₹120. Cost of 5 kg?","o":["₹240","₹280","₹300","₹360"],"a":2,"e":"1 kg costs ₹60; 5 kg costs ₹300.","v":"unitary-method"},{"d":"BASIC","q":"A printer prints 12 pages in 4 minutes. Pages per minute?","o":["2","3","4","6"],"a":1,"e":"12 ÷ 4 = 3 pages per minute.","v":"unitary-method"},{"d":"BASIC","q":"5 packets contain 40 biscuits equally. Biscuits in 8 packets?","o":["56","60","64","72"],"a":2,"e":"Each packet has 8 biscuits; 8 packets have 64.","v":"unitary-method"},{"d":"MEDIUM","q":"7 pens cost ₹84. Cost of 12 pens?","o":["₹124","₹132","₹144","₹156"],"a":2,"e":"One pen costs ₹12; 12 cost ₹144.","v":"unitary-method"},{"d":"MEDIUM","q":"3 kg apples cost ₹240. Cost of 5 kg?","o":["₹320","₹360","₹400","₹420"],"a":2,"e":"1 kg costs ₹80; 5 kg costs ₹400.","v":"unitary-method"},{"d":"MEDIUM","q":"8 m cloth costs ₹560. Cost of 11 m?","o":["₹700","₹735","₹770","₹840"],"a":2,"e":"₹70 per metre; 11 m costs ₹770.","v":"unitary-method"},{"d":"MEDIUM","q":"5 L paint covers 20 m². Area covered by 8 L?","o":["28 m²","30 m²","32 m²","40 m²"],"a":2,"e":"1 L covers 4 m²; 8 L cover 32 m².","v":"unitary-method"},{"d":"MEDIUM","q":"4 machines make 240 bottles/hour. Output of 7 machines?","o":["360","400","420","480"],"a":2,"e":"One machine makes 60; 7 make 420.","v":"unitary-method"},{"d":"MEDIUM","q":"9 workers earn ₹8,100 equally. One worker's earning?","o":["₹800","₹850","₹900","₹950"],"a":2,"e":"₹8,100 ÷ 9 = ₹900.","v":"unitary-method"},{"d":"MEDIUM","q":"A train travels 240 km in 4 hours. Distance in 7 hours?","o":["360 km","390 km","420 km","480 km"],"a":2,"e":"Speed is 60 km/h; distance is 420 km.","v":"unitary-method"},{"d":"MEDIUM","q":"15 bottles hold 12 L equally. How much do 20 bottles hold?","o":["14 L","15 L","16 L","18 L"],"a":2,"e":"Each holds 0.8 L; 20 hold 16 L.","v":"unitary-method"},{"d":"MEDIUM","q":"A copier makes 18 copies in 3 minutes. Copies in 10 minutes?","o":["45","50","60","72"],"a":2,"e":"6 copies/minute; 10 minutes gives 60.","v":"unitary-method"},{"d":"MEDIUM","q":"6 bags contain 150 kg grain. Weight in 9 bags?","o":["200 kg","215 kg","225 kg","250 kg"],"a":2,"e":"Each bag is 25 kg; 9 bags are 225 kg.","v":"unitary-method"},{"d":"HARD","q":"12 workers pack 360 boxes. How many can 17 workers pack at the same rate?","o":["450","480","510","540"],"a":2,"e":"Each worker packs 30; 17 pack 510.","v":"unitary-method"},{"d":"HARD","q":"8 m wire costs ₹680. Cost of 13 m?","o":["₹1,020","₹1,060","₹1,105","₹1,160"],"a":2,"e":"₹85 per metre; 13 m costs ₹1,105.","v":"unitary-method"},{"d":"HARD","q":"A van travels 240 km on 15 L fuel. Distance on 22 L?","o":["320 km","330 km","352 km","360 km"],"a":2,"e":"16 km/L × 22 = 352 km.","v":"unitary-method"},{"d":"HARD","q":"6 workers finish a job in 12 days. Time for 8 workers?","o":["8 days","9 days","10 days","12 days"],"a":1,"e":"72 worker-days ÷ 8 = 9 days.","v":"unitary-method"},{"d":"HARD","q":"16 students need 4 L juice. Juice for 27 students?","o":["5.5 L","6 L","6.75 L","7.5 L"],"a":2,"e":"0.25 L per student; 27 need 6.75 L.","v":"unitary-method"},{"d":"HARD","q":"18 notebooks cost ₹540. Cost of 25 notebooks?","o":["₹650","₹700","₹750","₹800"],"a":2,"e":"Each costs ₹30; 25 cost ₹750.","v":"unitary-method"},{"d":"HARD","q":"2.5 kg sugar costs ₹160. Cost of 4.25 kg?","o":["₹256","₹264","₹272","₹288"],"a":2,"e":"₹64/kg × 4.25 = ₹272.","v":"unitary-method"},{"d":"HARD","q":"14 m fabric makes 8 curtains. How many curtains from 21 m?","o":["10","11","12","14"],"a":2,"e":"Each uses 1.75 m; 21 m makes 12.","v":"unitary-method"},{"d":"HARD","q":"4 taps fill a tank in 6 hours. Time for 3 identical taps?","o":["4.5 hours","6 hours","8 hours","10 hours"],"a":2,"e":"24 tap-hours ÷ 3 = 8 hours.","v":"unitary-method"},{"d":"HARD","q":"A machine prints 250 pages in 5 minutes. Pages in 18 minutes?","o":["750","800","900","1,000"],"a":2,"e":"50 pages/minute × 18 = 900.","v":"unitary-method"}];const $=id=>document.getElementById(id);let i=0,sel=-1,locked=false,done=false,xp=0,correct=0,streak=0;const letters=['A','B','C','D'];
function progress(){const p=Math.round(i/questions.length*100);$('bar').style.width=p+'%';$('progress').setAttribute('aria-valuenow',p);$('pct').textContent=p+'% complete';}
function render(){const q=questions[i];sel=-1;locked=false;$('quiz').hidden=false;$('finish').hidden=true;$('counter').textContent='QUESTION '+(i+1)+' OF '+questions.length;$('meta').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(i+1);$('question').textContent=q.q;$('options').innerHTML='';q.o.forEach((v,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.innerHTML='<span class="letter">'+letters[j]+'</span><span></span>';b.querySelector('span:last-child').textContent=v;b.onclick=()=>{if(locked)return;sel=j;[...$('options').children].forEach((x,k)=>x.classList.toggle('selected',k===j));$('action').disabled=false;};$('options').appendChild(b);});$('feedback').className='feedback';$('feedback').textContent='';$('hint').textContent='30 questions · Select one answer';$('action').textContent='Check answer';$('action').disabled=true;progress();}
function act(){if(done){restart();return;}const q=questions[i];if(!locked){if(sel<0)return;locked=true;const ok=sel===q.a;if(ok){correct++;xp+=10;streak++;}else streak=0;$('xp').textContent='⭐ '+xp+' XP';$('streak').textContent='🔥 '+streak;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===sel)b.classList.add('wrong');});$('feedback').textContent=(ok?'✨ Correct! ':'💡 Review: ')+q.e;$('feedback').className='feedback show '+(ok?'good':'bad');$('hint').textContent=ok?'+10 XP':'Keep practising';$('action').textContent=i===questions.length-1?'View results →':'Continue →';return;}if(i<questions.length-1){i++;render();}else results();}
function results(){done=true;$('quiz').hidden=true;$('finish').hidden=false;$('counter').textContent='QUIZ COMPLETE';$('bar').style.width='100%';$('progress').setAttribute('aria-valuenow','100');$('pct').textContent='100% complete';$('finish').innerHTML='<div style="font-size:46px">🏆</div><h2>'+(correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!')+'</h2><div class="score">'+correct+' / '+questions.length+'</div><p>'+Math.round(correct/questions.length*100)+'% accuracy · '+xp+' XP earned</p><div class="skill"><strong>🔢 Compare decimal values</strong><small>Use place value to compare decimals accurately.</small></div><div class="skill"><strong>↔️ Order decimal numbers</strong><small>Compare decimals with different numbers of digits.</small></div><div class="skill"><strong>🧠 Apply comparison strategies</strong><small>Use equivalent trailing zeros and aligned place values.</small></div><button class="btn" id="retry">Try again ↻</button>';$('retry').onclick=restart;}
function restart(){i=0;sel=-1;locked=false;done=false;xp=0;correct=0;streak=0;$('xp').textContent='⭐ 0 XP';$('streak').textContent='🔥 0';render();}
$('action').onclick=act;render();})();
