<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261012-unitary-method-quiz-v1"><title>Unitary Method | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Unitary method</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Which ratio is equivalent to 2:5?","o":["4:10","4:5","2:10","5:2"],"a":0,"e":"Multiply both terms by 2: 2:5 = 4:10.","v":"unitary-method"},{"d":"BASIC","q":"Simplify the ratio 9:12.","o":["3:4","4:3","2:3","9:4"],"a":0,"e":"Divide both terms by 3 to get 3:4.","v":"unitary-method"},{"d":"BASIC","q":"If 3 notebooks cost ₹30, what is the cost of 1 notebook?","o":["₹5","₹10","₹15","₹90"],"a":1,"e":"₹30 ÷ 3 = ₹10 per notebook.","v":"unitary-method"},{"d":"BASIC","q":"Four identical pencils cost ₹20. What is the cost of 2 pencils?","o":["₹5","₹10","₹15","₹40"],"a":1,"e":"One pencil costs ₹20 ÷ 4 = ₹5, so 2 cost ₹10.","v":"unitary-method"},{"d":"BASIC","q":"If 5 oranges cost ₹25, how much does 1 orange cost?","o":["₹2","₹5","₹10","₹20"],"a":1,"e":"₹25 ÷ 5 = ₹5 per orange.","v":"unitary-method"},{"d":"BASIC","q":"A car travels 120 km in 2 hours at a constant speed. How far does it travel in 1 hour?","o":["30 km","40 km","60 km","240 km"],"a":2,"e":"120 km ÷ 2 = 60 km per hour.","v":"unitary-method"},{"d":"BASIC","q":"If 6 identical pens cost ₹48, what is the cost per pen?","o":["₹6","₹7","₹8","₹9"],"a":2,"e":"₹48 ÷ 6 = ₹8 per pen.","v":"unitary-method"},{"d":"BASIC","q":"A recipe uses 4 cups of flour for 8 cakes. How much flour is needed for 4 cakes?","o":["1 cup","2 cups","4 cups","8 cups"],"a":1,"e":"Four cakes are half of eight, so use half of 4 cups: 2 cups.","v":"unitary-method"},{"d":"BASIC","q":"If 2 kg of apples cost ₹100, what is the cost of 1 kg?","o":["₹25","₹50","₹100","₹200"],"a":1,"e":"₹100 ÷ 2 = ₹50 per kg.","v":"unitary-method"},{"d":"BASIC","q":"A printer prints 30 pages in 3 minutes. At the same rate, how many pages does it print in 1 minute?","o":["5","10","15","90"],"a":1,"e":"30 ÷ 3 = 10 pages per minute.","v":"unitary-method"},{"d":"MEDIUM","q":"If 5 pens cost ₹35, how much do 8 pens cost at the same rate?","o":["₹48","₹52","₹56","₹60"],"a":2,"e":"One pen costs ₹35 ÷ 5 = ₹7; 8 cost ₹56.","v":"unitary-method"},{"d":"MEDIUM","q":"A cyclist travels 45 km in 3 hours. How far will the cyclist travel in 5 hours at the same speed?","o":["60 km","65 km","75 km","90 km"],"a":2,"e":"Speed is 45 ÷ 3 = 15 km/h; in 5 hours, 75 km.","v":"unitary-method"},{"d":"MEDIUM","q":"Six workers complete a task in 4 days. If the total work is shared equally, how many worker-days is that?","o":["10","12","18","24"],"a":3,"e":"6 workers × 4 days = 24 worker-days.","v":"unitary-method"},{"d":"MEDIUM","q":"A recipe for 4 people needs 300 g of rice. How much rice is needed for 8 people?","o":["450 g","500 g","600 g","800 g"],"a":2,"e":"Eight is twice four, so double 300 g to get 600 g.","v":"unitary-method"},{"d":"MEDIUM","q":"If 12 metres of cloth cost ₹900, what is the cost of 5 metres?","o":["₹300","₹325","₹375","₹450"],"a":2,"e":"Cost per metre = ₹900 ÷ 12 = ₹75; 5 m costs ₹375.","v":"unitary-method"},{"d":"MEDIUM","q":"A tap fills 24 litres in 6 minutes. How much water does it deliver in 10 minutes at the same rate?","o":["30 L","36 L","40 L","60 L"],"a":2,"e":"Rate = 24 ÷ 6 = 4 L/min; in 10 minutes, 40 L.","v":"unitary-method"},{"d":"MEDIUM","q":"If 7 identical toys cost ₹140, how much do 3 toys cost?","o":["₹40","₹50","₹60","₹70"],"a":2,"e":"Each toy costs ₹20, so 3 cost ₹60.","v":"unitary-method"},{"d":"MEDIUM","q":"A train covers 150 km in 2.5 hours. At the same speed, how far does it travel in 4 hours?","o":["200 km","220 km","240 km","300 km"],"a":2,"e":"Speed = 150 ÷ 2.5 = 60 km/h; in 4 hours, 240 km.","v":"unitary-method"},{"d":"MEDIUM","q":"A machine makes 84 parts in 7 minutes. How many parts can it make in 12 minutes at the same rate?","o":["120","132","144","168"],"a":2,"e":"Rate = 84 ÷ 7 = 12 parts/min; 12 minutes gives 144.","v":"unitary-method"},{"d":"MEDIUM","q":"Four packets contain 28 biscuits equally. How many biscuits are in 9 such packets?","o":["54","56","63","72"],"a":2,"e":"Each packet has 7 biscuits; 9 packets have 63.","v":"unitary-method"},{"d":"HARD","q":"If 8 notebooks cost ₹120, what is the cost of 15 notebooks at the same rate?","o":["₹180","₹200","₹225","₹240"],"a":2,"e":"One notebook costs ₹15; 15 notebooks cost ₹225.","v":"unitary-method"},{"d":"HARD","q":"A map distance of 3 cm represents 18 km. What actual distance does 7 cm represent?","o":["36 km","42 km","48 km","54 km"],"a":1,"e":"Each centimetre represents 6 km; 7 cm represents 42 km.","v":"unitary-method"},{"d":"HARD","q":"A car uses 6 litres of fuel for 90 km. How much fuel is needed for 240 km at the same rate?","o":["12 L","14 L","16 L","18 L"],"a":2,"e":"Fuel rate is 6/90 = 1/15 L per km; 240 ÷ 15 = 16 L.","v":"unitary-method"},{"d":"HARD","q":"A baker uses 750 g of flour to make 15 rolls. How much flour is needed for 24 rolls?","o":["1 kg","1.1 kg","1.2 kg","1.5 kg"],"a":2,"e":"Each roll uses 50 g; 24 rolls need 1,200 g = 1.2 kg.","v":"unitary-method"},{"d":"HARD","q":"If 9 metres of wire cost ₹315, what is the cost of 14 metres?","o":["₹420","₹455","₹490","₹525"],"a":2,"e":"Cost per metre = ₹35; 14 metres cost ₹490.","v":"unitary-method"},{"d":"HARD","q":"A pump fills 180 litres in 12 minutes. How long will it take to fill 450 litres at the same rate?","o":["20 min","25 min","30 min","36 min"],"a":2,"e":"Rate = 15 L/min; 450 ÷ 15 = 30 minutes.","v":"unitary-method"},{"d":"HARD","q":"A group of 5 people needs 2.5 litres of juice. How much juice is needed for 18 people?","o":["7 L","8 L","9 L","10 L"],"a":2,"e":"Each person needs 0.5 L; 18 people need 9 L.","v":"unitary-method"},{"d":"HARD","q":"A photocopier makes 210 copies in 6 minutes. How many copies will it make in 14 minutes at the same rate?","o":["420","450","490","520"],"a":2,"e":"Rate = 35 copies/min; 35 × 14 = 490.","v":"unitary-method"},{"d":"HARD","q":"A 16 m long cloth roll costs ₹1,280. What is the cost of 22 m at the same rate?","o":["₹1,600","₹1,680","₹1,760","₹1,920"],"a":2,"e":"Cost per metre = ₹80; 22 m costs ₹1,760.","v":"unitary-method"},{"d":"HARD","q":"A bus travels 96 km using 8 litres of fuel. At the same rate, how far can it travel using 15 litres?","o":["150 km","160 km","180 km","192 km"],"a":2,"e":"The bus travels 12 km per litre; 15 litres gives 180 km.","v":"unitary-method"}]let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Solve problems by finding the value of one unit</strong><small>Find unit cost and unit rate</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Scale quantities proportionally</strong><small>Apply the unitary method step by step</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve real-life cost, distance and quantity problems</strong><small>Apply rectangle area in real life</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
