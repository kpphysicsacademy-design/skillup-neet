<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Which tool is used to draw a straight line through two marked points?","o":["Compass","Ruler","Protractor","Divider"],"a":1,"e":"A ruler guides a straight line through marked points.","v":"using-ruler-compass"},{"d":"BASIC","q":"What does a compass draw when its point stays fixed and the pencil moves around?","o":["A circle or arc","A straight segment","A right angle only","A parallel line"],"a":0,"e":"The pencil traces points at a fixed distance from the compass point.","v":"using-ruler-compass"},{"d":"BASIC","q":"To copy a 4 cm segment, set the compass opening to...","o":["2 cm","4 cm","8 cm","4 degrees"],"a":1,"e":"The opening should match the segment's length.","v":"using-ruler-compass"},{"d":"BASIC","q":"Which tool is needed to measure an angle in degrees, but not for a basic ruler-and-compass angle copy?","o":["Protractor","Compass","Ruler","Pencil"],"a":0,"e":"A protractor measures degrees; copying can be done with ruler and compass.","v":"using-ruler-compass"},{"d":"BASIC","q":"If a compass opening is 5 cm, what is the radius of the arc it draws?","o":["2.5 cm","5 cm","10 cm","It has no radius"],"a":1,"e":"The compass opening is the radius.","v":"using-ruler-compass"},{"d":"BASIC","q":"To draw a circle of radius 2.5 cm, place the compass needle at...","o":["The centre of the circle","The circle's edge and keep moving","A random point outside","The ruler's zero mark"],"a":0,"e":"The needle remains at the intended centre.","v":"using-ruler-compass"},{"d":"BASIC","q":"Which action transfers a measured length without reading the ruler again?","o":["Keep a compass opening fixed and move it","Change the compass opening freely","Rotate the ruler","Measure an angle"],"a":0,"e":"The fixed opening preserves the length.","v":"using-ruler-compass"},{"d":"BASIC","q":"When drawing a segment 7 cm long with a ruler, the endpoints should be...","o":["7 cm apart","7 degrees apart","7 cm from the paper edge","At the same point"],"a":0,"e":"Segment length is the distance between its endpoints.","v":"using-ruler-compass"},{"d":"BASIC","q":"Which construction tool uses a pointed leg and a pencil leg?","o":["Compass","Protractor","Straight ruler","Set square"],"a":0,"e":"A compass has a needle point and a pencil or lead point.","v":"using-ruler-compass"},{"d":"BASIC","q":"Why should the compass needle be pressed gently but firmly at the centre?","o":["To prevent the centre from slipping","To make the radius change","To draw a thicker line","To measure the angle"],"a":0,"e":"A stable centre helps produce an accurate circle or arc.","v":"using-ruler-compass"},{"d":"MEDIUM","q":"To construct the perpendicular bisector of AB, arcs are drawn from...","o":["A and B with the same radius","A only","The midpoint only","Two unrelated points"],"a":0,"e":"Equal-radius arcs from both endpoints provide intersections equidistant from A and B.","v":"using-ruler-compass"},{"d":"MEDIUM","q":"For equal arcs from endpoints of a 10 cm segment to intersect on both sides, choose a radius...","o":["4 cm","5 cm exactly","6 cm","2 cm"],"a":2,"e":"A common radius greater than 5 cm lets the arcs cross on both sides.","v":"using-ruler-compass"},{"d":"MEDIUM","q":"A perpendicular bisector crosses a segment at what angle?","o":["30°","45°","60°","90°"],"a":3,"e":"Perpendicular lines meet at 90 degrees.","v":"using-ruler-compass"},{"d":"MEDIUM","q":"A perpendicular bisector of a 14 cm segment meets it how far from either endpoint?","o":["3.5 cm","7 cm","10 cm","14 cm"],"a":1,"e":"It passes through the midpoint, half of 14 cm.","v":"using-ruler-compass"},{"d":"MEDIUM","q":"To begin copying an angle with a compass, draw an arc centred at...","o":["The original angle's vertex","The ruler's midpoint","An endpoint of the paper","The new angle's farthest point"],"a":0,"e":"An arc centred at the vertex intersects both arms.","v":"using-ruler-compass"},{"d":"MEDIUM","q":"When copying an angle, what must match between the original and the new angle's first arcs?","o":["The compass radius","The page size","The line colour","The ruler length"],"a":0,"e":"Using the same radius lets the arc transfer the angle's geometry.","v":"using-ruler-compass"},{"d":"MEDIUM","q":"An angle bisector divides 86° into two angles of...","o":["36° each","43° each","46° each","86° each"],"a":1,"e":"Half of 86 degrees is 43 degrees.","v":"using-ruler-compass"},{"d":"MEDIUM","q":"To construct an angle bisector, after an arc cuts both arms, draw matching arcs from...","o":["The two points on the arms","The paper corners","The ruler's ends","Two random points"],"a":0,"e":"Equal-radius arcs from the arm-intersection points meet inside the angle.","v":"using-ruler-compass"},{"d":"MEDIUM","q":"Which statement about a compass opening is true during a single arc?","o":["It should remain fixed","It must widen continuously","It must close halfway","It measures degrees directly"],"a":0,"e":"A constant opening keeps the traced points at the same radius.","v":"using-ruler-compass"},{"d":"MEDIUM","q":"Which is the best way to check a copied segment?","o":["Compare its length with the original using the same compass opening","Compare their colours","Count pencil strokes","Check the paper margins"],"a":0,"e":"The same compass setting tests whether the lengths match.","v":"using-ruler-compass"},{"d":"HARD","q":"A segment is 9 cm long. Its perpendicular bisector divides it into...","o":["3 cm and 6 cm","4 cm and 5 cm","4.5 cm and 4.5 cm","9 cm and 0 cm"],"a":2,"e":"A bisector splits the segment into two equal 4.5 cm halves.","v":"using-ruler-compass"},{"d":"HARD","q":"A compass radius of 3 cm is used from centres 8 cm apart. Will the two circles intersect?","o":["Yes, at two points","Yes, at one point","No, because 3 + 3 is less than 8","They are the same circle"],"a":2,"e":"Two circles intersect only if the centre distance is no greater than the sum of their radii; 8 is greater than 6.","v":"using-ruler-compass"},{"d":"HARD","q":"Two circles each have radius 5 cm and centres 8 cm apart. How many intersection points do they have?","o":["0","1","2","Infinitely many"],"a":2,"e":"The centre distance is less than 10 cm and greater than 0, so the circles cross at two points.","v":"using-ruler-compass"},{"d":"HARD","q":"If a compass opening changes while drawing a circle, what happens?","o":["The radius may vary, so it may not be a true circle","The centre automatically moves","The circle becomes a straight line","The ruler measures the radius"],"a":0,"e":"A circle requires every point on its circumference to be the same distance from the centre.","v":"using-ruler-compass"},{"d":"HARD","q":"Which construction gives a point equally distant from endpoints A and B?","o":["A point on the perpendicular bisector of AB","Any point on AB","Any point outside the segment","A point on a parallel line"],"a":0,"e":"Every point on the perpendicular bisector is equally distant from A and B.","v":"using-ruler-compass"},{"d":"HARD","q":"To copy a segment of length 6.2 cm with a compass, first...","o":["Set the opening to 6.2 cm using the ruler","Set the opening to 6.2 degrees","Draw a circle of diameter 6.2 cm","Fold the ruler"],"a":0,"e":"Measure the length, then transfer the same opening to the new starting point.","v":"using-ruler-compass"},{"d":"HARD","q":"Which action is essential when drawing an arc from a marked centre?","o":["Keep the compass needle at that centre","Slide the needle along the paper","Use the ruler as the needle","Change the radius at every point"],"a":0,"e":"The fixed centre is what makes the arc part of a circle.","v":"using-ruler-compass"},{"d":"HARD","q":"An angle measures 118°. Its bisector creates two angles measuring...","o":["49°","59°","69°","118°"],"a":1,"e":"118 divided by 2 equals 59 degrees.","v":"using-ruler-compass"},{"d":"HARD","q":"Why do equal-radius arcs from the endpoints of a segment help construct a perpendicular bisector?","o":["Their intersection points are equally distant from both endpoints","They always make a 45° angle","They mark the segment's length twice","They make the segment parallel to itself"],"a":0,"e":"At an arc intersection, distances to both endpoints equal the shared radius.","v":"using-ruler-compass"},{"d":"HARD","q":"A ruler-and-compass construction leaves arcs visible. What do these arcs show?","o":["How key points were located geometrically","The measured mass of the paper","The exact colour of the pencil","The scale of the page"],"a":0,"e":"Construction arcs document the intersections used to locate points.","v":"using-ruler-compass"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Transfer lengths with ruler and compass</strong><small>Copy lengths and construct bisectors</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Copy and bisect angles accurately</strong><small>Understand radii, arcs and intersections</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply ruler-and-compass reasoning</strong><small>Use accurate ruler-and-compass methods</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
