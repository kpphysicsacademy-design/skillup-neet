(function(){'use strict';const questions=[{"d":"BASIC","q":"Solve 2x + 3 = x + 8.","o":["x = 5","x = 11","x = −5","x = 3"],"a":0,"e":"Subtract x from both sides, then subtract 3.","v":"equations-with-variables-on-both-sides"},{"d":"BASIC","q":"Solve 4x = 2x + 10.","o":["x = 5","x = 2","x = 6","x = −5"],"a":0,"e":"Subtract 2x from both sides and divide by 2.","v":"equations-with-variables-on-both-sides"},{"d":"BASIC","q":"Solve 7x − 4 = 5x + 8.","o":["x = 6","x = 4","x = 2","x = −6"],"a":0,"e":"Move the variable terms to one side and constants to the other.","v":"equations-with-variables-on-both-sides"},{"d":"BASIC","q":"Solve 3x + 1 = x + 9.","o":["x = 4","x = 5","x = 8","x = −4"],"a":0,"e":"Subtract x and then subtract 1 from both sides.","v":"equations-with-variables-on-both-sides"},{"d":"BASIC","q":"Solve 6x − 5 = 4x + 7.","o":["x = 6","x = 1","x = 12","x = −6"],"a":0,"e":"Subtract 4x, then add 5.","v":"equations-with-variables-on-both-sides"},{"d":"BASIC","q":"Solve 5x + 2 = 3x + 12.","o":["x = 5","x = 7","x = 10","x = −5"],"a":0,"e":"Subtract 3x and subtract 2.","v":"equations-with-variables-on-both-sides"},{"d":"BASIC","q":"Solve 9x = 6x + 15.","o":["x = 5","x = 3","x = 9","x = −5"],"a":0,"e":"Subtract 6x, then divide by 3.","v":"equations-with-variables-on-both-sides"},{"d":"BASIC","q":"Solve 8x + 1 = 5x + 16.","o":["x = 5","x = 15","x = 3","x = −5"],"a":0,"e":"Subtract 5x and then subtract 1.","v":"equations-with-variables-on-both-sides"},{"d":"BASIC","q":"Solve 2x − 7 = x + 2.","o":["x = −9","x = 9","x = 5","x = 7"],"a":1,"e":"Subtract x from both sides and add 7.","v":"equations-with-variables-on-both-sides"},{"d":"BASIC","q":"Solve 10x − 6 = 8x + 4.","o":["x = 2","x = 5","x = −5","x = 10"],"a":1,"e":"Subtract 8x and add 6.","v":"equations-with-variables-on-both-sides"},{"d":"MEDIUM","q":"Solve 3(x + 2) = 2x + 11.","o":["x = 17","x = 5","x = 3","x = −5"],"a":1,"e":"Expand the brackets before collecting variable terms.","v":"equations-with-variables-on-both-sides"},{"d":"MEDIUM","q":"Solve 4(x − 1) = 2x + 10.","o":["x = 3","x = 7","x = 6","x = −7"],"a":1,"e":"Expand 4(x − 1), then subtract 2x.","v":"equations-with-variables-on-both-sides"},{"d":"MEDIUM","q":"Solve 5(x + 1) = 3x + 17.","o":["x = 11","x = 6","x = 4","x = −6"],"a":1,"e":"Expand the left side, then isolate x.","v":"equations-with-variables-on-both-sides"},{"d":"MEDIUM","q":"Solve 2(2x + 3) = 3x + 13.","o":["x = 5","x = 7","x = 13","x = −7"],"a":1,"e":"Expand the left side and subtract 3x.","v":"equations-with-variables-on-both-sides"},{"d":"MEDIUM","q":"Solve 7(x − 2) = 5x + 4.","o":["x = 5","x = 9","x = 11","x = −9"],"a":1,"e":"Expand and collect x terms on one side.","v":"equations-with-variables-on-both-sides"},{"d":"MEDIUM","q":"Solve 3x + 5 = 2(x + 6).","o":["x = 17","x = 7","x = 5","x = −7"],"a":1,"e":"Expand the right side and subtract 2x.","v":"equations-with-variables-on-both-sides"},{"d":"MEDIUM","q":"Solve 4x − 3 = 2(x + 5).","o":["x = 4","x = 13","x = 13/2","x = −13/2"],"a":2,"e":"Expand the right side, then solve 2x − 3 = 10.","v":"equations-with-variables-on-both-sides"},{"d":"MEDIUM","q":"Solve 6(x + 1) = 4x + 18.","o":["x = 12","x = 5","x = 6","x = −6"],"a":2,"e":"Expand and subtract 4x, then subtract 6.","v":"equations-with-variables-on-both-sides"},{"d":"MEDIUM","q":"Solve 5x − 2 = 3(x + 4).","o":["x = 5","x = 10","x = 7","x = −7"],"a":2,"e":"Expand the right side and collect terms.","v":"equations-with-variables-on-both-sides"},{"d":"MEDIUM","q":"Solve 2(x − 5) + 3 = x + 1.","o":["x = 4","x = 6","x = 8","x = −8"],"a":2,"e":"Simplify the left side first, then isolate x.","v":"equations-with-variables-on-both-sides"},{"d":"HARD","q":"Solve 3(2x − 1) = 4x + 11.","o":["x = 4","x = 6","x = 7","x = −7"],"a":2,"e":"Expand the bracket, subtract 4x, then add 3.","v":"equations-with-variables-on-both-sides"},{"d":"HARD","q":"Solve 2(3x + 4) − 5 = 4x + 9.","o":["x = 2","x = 5","x = 3","x = −3"],"a":2,"e":"Expand and simplify before moving the variable terms.","v":"equations-with-variables-on-both-sides"},{"d":"HARD","q":"Solve 5(x − 2) + 3x = 2(x + 7) + 12.","o":["x = 7","x = 9","x = 6","x = −7"],"a":2,"e":"Expanding gives 8x − 10 = 2x + 26, so 6x = 36 and x = 6.","v":"equations-with-variables-on-both-sides"},{"d":"HARD","q":"Solve 4(x + 3) − 2x = 3(x + 5) + 1.","o":["x = 5","x = 7","x = 4","x = −4"],"a":3,"e":"Expanding gives 2x + 12 = 3x + 16, so subtracting 2x and 16 gives x = −4.","v":"equations-with-variables-on-both-sides"},{"d":"HARD","q":"Solve 7 − 2(x − 3) = x + 1.","o":["x = 2","x = 5","x = −4","x = 4"],"a":3,"e":"Distribute the negative sign through the parentheses.","v":"equations-with-variables-on-both-sides"},{"d":"HARD","q":"Solve (x + 4)/2 = x − 1.","o":["x = 2","x = 4","x = −6","x = 6"],"a":3,"e":"Multiply both sides by 2, then collect x terms.","v":"equations-with-variables-on-both-sides"},{"d":"HARD","q":"Solve (3x − 2)/4 = (x + 6)/2.","o":["x = 10","x = 8","x = −14","x = 14"],"a":3,"e":"Multiply both sides by 4 to remove denominators.","v":"equations-with-variables-on-both-sides"},{"d":"HARD","q":"Solve 0.4x + 3 = 0.2x + 7.","o":["x = 10","x = 2","x = −20","x = 20"],"a":3,"e":"Subtract 0.2x and subtract 3, then divide by 0.2.","v":"equations-with-variables-on-both-sides"},{"d":"HARD","q":"Solve 2(x + 3) + 3(x − 1) = 4x + 13.","o":["x = 5","x = 7","x = −10","x = 10"],"a":3,"e":"Expand both brackets, combine terms and isolate x.","v":"equations-with-variables-on-both-sides"},{"d":"HARD","q":"Solve 3(x − 4) + 2 = 2(x + 1) − 5.","o":["x = 3","x = 9","x = −7","x = 7"],"a":3,"e":"Expand each side and collect variable terms.","v":"equations-with-variables-on-both-sides"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Solve equations with variables on both sides</strong><small>Expand brackets and collect like terms</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Move variable terms and constants</strong><small>Solve equations with brackets and fractions</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Check solutions by substitution</strong><small>Solve multi-step linear equations</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
