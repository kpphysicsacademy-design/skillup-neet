<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261012-variables-quiz-v2"><title>Variables | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Variables</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"In the expression 5x + 2, which symbol is the variable?","o":["5","x","2","+ "],"a":1,"e":"The letter x represents a number that may vary.","v":"variables"},{"d":"BASIC","q":"If a = 4, what is the value of a + 7?","o":["3","11","28","47"],"a":1,"e":"Substitute 4 for a: 4 + 7 = 11.","v":"variables"},{"d":"BASIC","q":"Which expression means “a number n plus 9”?","o":["9n","n − 9","n + 9","9 − n"],"a":2,"e":"Adding 9 to n is written n + 9.","v":"variables"},{"d":"BASIC","q":"Which expression means “6 times p”?","o":["p + 6","p − 6","6p","p/6"],"a":2,"e":"Multiplication of 6 and p is written 6p.","v":"variables"},{"d":"BASIC","q":"If x = 3, evaluate 4x.","o":["7","12","43","1"],"a":1,"e":"4x means 4 × x; 4 × 3 = 12.","v":"variables"},{"d":"BASIC","q":"Which expression represents 12 less than y?","o":["12 − y","y − 12","12y","y + 12"],"a":1,"e":"“12 less than y” means subtract 12 from y.","v":"variables"},{"d":"BASIC","q":"If m = 10, what is m − 6?","o":["4","6","16","60"],"a":0,"e":"Substitute 10: 10 − 6 = 4.","v":"variables"},{"d":"BASIC","q":"Which is a variable in the expression 3b − 8?","o":["3","b","8","−"],"a":1,"e":"The letter b represents the variable.","v":"variables"},{"d":"BASIC","q":"Which expression means “the sum of k and 5”?","o":["5k","k − 5","k + 5","5 − k"],"a":2,"e":"A sum is found by addition: k + 5.","v":"variables"},{"d":"BASIC","q":"If t = 2, evaluate t + t + t.","o":["5","6","8","23"],"a":1,"e":"Substitute 2 for each t: 2 + 2 + 2 = 6.","v":"variables"},{"d":"MEDIUM","q":"If x = 5, evaluate 3x + 4.","o":["19","17","27","15"],"a":0,"e":"3 × 5 + 4 = 15 + 4 = 19.","v":"variables"},{"d":"MEDIUM","q":"Which expression represents twice a number r, then add 7?","o":["2(r + 7)","2r + 7","r + 14","7r + 2"],"a":1,"e":"Twice r is 2r; then adding 7 gives 2r + 7.","v":"variables"},{"d":"MEDIUM","q":"If p = 6, evaluate 2p − 5.","o":["7","12","17","1"],"a":0,"e":"2 × 6 − 5 = 12 − 5 = 7.","v":"variables"},{"d":"MEDIUM","q":"A pencil costs c rupees. What is the cost of 8 pencils?","o":["c + 8","8 + c","8c","c/8"],"a":2,"e":"Eight pencils at c rupees each cost 8c rupees.","v":"variables"},{"d":"MEDIUM","q":"If y = 4, evaluate 5(y + 2).","o":["22","30","26","14"],"a":1,"e":"First calculate 4 + 2 = 6; then 5 × 6 = 30.","v":"variables"},{"d":"MEDIUM","q":"Which expression means “divide x by 3, then add 2”?","o":["x/(3 + 2)","x/3 + 2","3/x + 2","x/3 − 2"],"a":1,"e":"Divide x by 3 first, then add 2: x/3 + 2.","v":"variables"},{"d":"MEDIUM","q":"If a = 7 and b = 3, evaluate a − 2b.","o":["1","8","10","14"],"a":0,"e":"7 − 2 × 3 = 7 − 6 = 1.","v":"variables"},{"d":"MEDIUM","q":"A rectangle has length l and width w. Which expression gives its perimeter?","o":["lw","l + w","2(l + w)","2lw"],"a":2,"e":"Add length and width, then double the sum.","v":"variables"},{"d":"MEDIUM","q":"If n = 9, evaluate n/3 + 8.","o":["3","11","17","27"],"a":1,"e":"9 ÷ 3 + 8 = 3 + 8 = 11.","v":"variables"},{"d":"MEDIUM","q":"Which expression represents 4 more than the product of 7 and x?","o":["7(x + 4)","7x + 4","4x + 7","7x − 4"],"a":1,"e":"The product is 7x; four more is 7x + 4.","v":"variables"},{"d":"HARD","q":"If x = 4, evaluate 2x² − 3.","o":["13","29","5","32"],"a":1,"e":"x² = 16; 2 × 16 − 3 = 32 − 3 = 29.","v":"variables"},{"d":"HARD","q":"Which expression represents the total cost of n notebooks at ₹p each and one ₹20 pen?","o":["20np","np + 20","n(p + 20)","20 − np"],"a":1,"e":"The notebooks cost np rupees; add ₹20 for the pen.","v":"variables"},{"d":"HARD","q":"If a = 3 and b = 5, evaluate 2a + 3b.","o":["21","24","16","30"],"a":0,"e":"2 × 3 + 3 × 5 = 6 + 15 = 21.","v":"variables"},{"d":"HARD","q":"A number x is multiplied by 5, then 8 is subtracted. Which expression describes it?","o":["5(x − 8)","5x − 8","8 − 5x","x − 40"],"a":1,"e":"Multiplying first gives 5x; subtracting 8 gives 5x − 8.","v":"variables"},{"d":"HARD","q":"If m = 8, evaluate 3(m − 2) + 1.","o":["19","25","21","17"],"a":0,"e":"3 × (8 − 2) + 1 = 18 + 1 = 19.","v":"variables"},{"d":"HARD","q":"A bus has s seats. How many seats are there in 4 such buses and 7 extra seats?","o":["4(s + 7)","s + 11","4s + 7","7s + 4"],"a":2,"e":"Four buses have 4s seats; add 7 extra seats: 4s + 7.","v":"variables"},{"d":"HARD","q":"If x = 6, evaluate (x + 4)/2.","o":["5","8","10","12"],"a":0,"e":"(6 + 4) ÷ 2 = 10 ÷ 2 = 5.","v":"variables"},{"d":"HARD","q":"Which expression represents the difference between y and one-third of y?","o":["y + y/3","y/3 − y","y − y/3","3y − 1"],"a":2,"e":"The difference is y − y/3.","v":"variables"},{"d":"HARD","q":"If p = 4 and q = 2, evaluate p² + 3q.","o":["22","28","14","10"],"a":0,"e":"4² + 3 × 2 = 16 + 6 = 22.","v":"variables"},{"d":"HARD","q":"A number n is divided by 4 and then 7 is subtracted. Which expression represents the result?","o":["n ÷ (4 − 7)","4n − 7","n/4 − 7","n/(4 − 7)"],"a":2,"e":"Divide n by 4 first, then subtract 7: n/4 − 7.","v":"variables"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand and evaluate variables</strong><small>Substitute values into expressions</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Translate words into algebraic expressions</strong><small>Combine like terms and evaluate expressions</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply variables to everyday situations</strong><small>Apply rectangle area in real life</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
