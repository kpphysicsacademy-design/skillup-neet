<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261012-variables-quiz-v1"><title>Variables | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Variables</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"In an expression, what is a variable?","o":["A number that never changes","A letter or symbol representing a number","An operation sign","A unit of measurement"],"a":1,"e":"A variable is a letter or symbol that stands for a number.","v":"variables"},{"d":"BASIC","q":"Which of these is a variable?","o":["7","+","x","="],"a":2,"e":"The letter x can represent an unknown or changing number.","v":"variables"},{"d":"BASIC","q":"If x = 4, what is x + 3?","o":["7","12","1","43"],"a":0,"e":"Substitute 4 for x: 4 + 3 = 7.","v":"variables"},{"d":"BASIC","q":"If a = 6, find 2a.","o":["8","12","26","36"],"a":1,"e":"2a means 2 × a, so 2 × 6 = 12.","v":"variables"},{"d":"BASIC","q":"Which expression means 'a number n plus 5'?","o":["5n","n − 5","n + 5","n ÷ 5"],"a":2,"e":"Plus means addition, so the expression is n + 5.","v":"variables"},{"d":"BASIC","q":"Which expression means '7 less than y'?","o":["7 − y","y − 7","7y","y + 7"],"a":1,"e":"Seven less than y means subtract 7 from y.","v":"variables"},{"d":"BASIC","q":"If p = 9, what is p − 4?","o":["13","5","36","4"],"a":1,"e":"Substitute p = 9: 9 − 4 = 5.","v":"variables"},{"d":"BASIC","q":"Which expression represents 3 groups of m?","o":["m + 3","m − 3","3m","m ÷ 3"],"a":2,"e":"Three groups of m means 3 × m, written as 3m.","v":"variables"},{"d":"BASIC","q":"If b = 5, find b + b.","o":["b²","10","25","5"],"a":1,"e":"5 + 5 = 10.","v":"variables"},{"d":"BASIC","q":"Which expression means 'twice a number t'?","o":["t + 2","2t","t − 2","t ÷ 2"],"a":1,"e":"Twice t means 2 multiplied by t.","v":"variables"},{"d":"MEDIUM","q":"If x = 7, find 3x + 2.","o":["23","17","27","9"],"a":0,"e":"3 × 7 + 2 = 21 + 2 = 23.","v":"variables"},{"d":"MEDIUM","q":"If n = 10, evaluate 2n − 6.","o":["14","26","8","4"],"a":0,"e":"2 × 10 − 6 = 20 − 6 = 14.","v":"variables"},{"d":"MEDIUM","q":"Simplify: 4a + 3a.","o":["7","7a","12a","a"],"a":1,"e":"Like terms combine: 4a + 3a = 7a.","v":"variables"},{"d":"MEDIUM","q":"Simplify: 9x − 2x.","o":["7","7x","11x","18x"],"a":1,"e":"Subtract the coefficients: 9x − 2x = 7x.","v":"variables"},{"d":"MEDIUM","q":"Which pair are like terms?","o":["3a and 3b","5x and 2x","x and x²","4p and 4"],"a":1,"e":"Both 5x and 2x have the same variable x to the same power.","v":"variables"},{"d":"MEDIUM","q":"If y = 4, evaluate y².","o":["8","16","6","4"],"a":1,"e":"y² means y × y, so 4 × 4 = 16.","v":"variables"},{"d":"MEDIUM","q":"A pencil costs ₹x. What is the cost of 6 pencils?","o":["x + 6","6 + x","6x","x ÷ 6"],"a":2,"e":"Six pencils at ₹x each cost ₹6x.","v":"variables"},{"d":"MEDIUM","q":"Which expression represents the perimeter of a square with side s?","o":["s + 4","2s","4s","s²"],"a":2,"e":"A square has four equal sides, so its perimeter is 4s.","v":"variables"},{"d":"MEDIUM","q":"If a = 3 and b = 8, find a + 2b.","o":["22","19","14","11"],"a":1,"e":"3 + 2 × 8 = 3 + 16 = 19.","v":"variables"},{"d":"MEDIUM","q":"The phrase '5 more than twice x' is written as:","o":["2(x + 5)","5x + 2","2x + 5","x + 10"],"a":2,"e":"Twice x is 2x; five more gives 2x + 5.","v":"variables"},{"d":"HARD","q":"If x = 4, evaluate 2(x + 3).","o":["14","11","20","8"],"a":0,"e":"First calculate x + 3 = 7; then 2 × 7 = 14.","v":"variables"},{"d":"HARD","q":"Simplify: 3a + 5 + 2a + 4.","o":["5a + 9","5a + 1","6a + 9","5a + 20"],"a":0,"e":"Combine like terms: 3a + 2a = 5a and 5 + 4 = 9.","v":"variables"},{"d":"HARD","q":"If m = 6, find 4m − (m + 2).","o":["16","22","20","12"],"a":0,"e":"4 × 6 − (6 + 2) = 24 − 8 = 16.","v":"variables"},{"d":"HARD","q":"A number x is multiplied by 5 and then 3 is added. Which expression shows this?","o":["5(x + 3)","5x + 3","x + 15","3x + 5"],"a":1,"e":"Multiply x by 5 first, then add 3: 5x + 3.","v":"variables"},{"d":"HARD","q":"If x = 2 and y = 5, evaluate 3x + 2y.","o":["16","13","21","10"],"a":0,"e":"3 × 2 + 2 × 5 = 6 + 10 = 16.","v":"variables"},{"d":"HARD","q":"The length of a rectangle is l and its width is w. Which expression gives its area?","o":["2l + 2w","l + w","lw","l − w"],"a":2,"e":"Area of a rectangle is length × width, or lw.","v":"variables"},{"d":"HARD","q":"A taxi charges ₹50 fixed fare and ₹12 per kilometre k. Which expression gives the total fare?","o":["50k + 12","12k + 50","62k","50 + k"],"a":1,"e":"The fare is the fixed ₹50 plus ₹12 for each kilometre: 12k + 50.","v":"variables"},{"d":"HARD","q":"If p = 3, evaluate 2p².","o":["36","18","12","6"],"a":1,"e":"2p² = 2 × 3 × 3 = 18.","v":"variables"},{"d":"HARD","q":"Simplify: 6x + 2y − 4x + 5y.","o":["2x + 7y","10x + 7y","2x − 3y","7xy"],"a":0,"e":"Combine like terms: 6x − 4x = 2x and 2y + 5y = 7y.","v":"variables"},{"d":"HARD","q":"A number n is divided by 4 and then 7 is subtracted. Which expression represents the result?","o":["n ÷ (4 − 7)","4n − 7","n/4 − 7","n/(4 − 7)"],"a":2,"e":"Divide n by 4 first, then subtract 7: n/4 − 7.","v":"variables"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand and evaluate variables</strong><small>Substitute values into expressions</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Translate words into algebraic expressions</strong><small>Combine like terms and evaluate expressions</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply variables to everyday situations</strong><small>Apply rectangle area in real life</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script></body></html>
