<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"In the expression 5x + 2, which symbol is the variable?","o":["5","x","2","+ "],"a":1,"e":"The letter x represents a number that may vary.","v":"variables"},{"d":"BASIC","q":"If a = 4, what is the value of a + 7?","o":["3","11","28","47"],"a":1,"e":"Substitute 4 for a: 4 + 7 = 11.","v":"variables"},{"d":"BASIC","q":"Which expression means “a number n plus 9”?","o":["9n","n − 9","n + 9","9 − n"],"a":2,"e":"Adding 9 to n is written n + 9.","v":"variables"},{"d":"BASIC","q":"Which expression means “6 times p”?","o":["p + 6","p − 6","6p","p/6"],"a":2,"e":"Multiplication of 6 and p is written 6p.","v":"variables"},{"d":"BASIC","q":"If x = 3, evaluate 4x.","o":["7","12","43","1"],"a":1,"e":"4x means 4 × x; 4 × 3 = 12.","v":"variables"},{"d":"BASIC","q":"Which expression represents 12 less than y?","o":["12 − y","y − 12","12y","y + 12"],"a":1,"e":"“12 less than y” means subtract 12 from y.","v":"variables"},{"d":"BASIC","q":"If m = 10, what is m − 6?","o":["4","6","16","60"],"a":0,"e":"Substitute 10: 10 − 6 = 4.","v":"variables"},{"d":"BASIC","q":"Which is a variable in the expression 3b − 8?","o":["3","b","8","−"],"a":1,"e":"The letter b represents the variable.","v":"variables"},{"d":"BASIC","q":"Which expression means “the sum of k and 5”?","o":["5k","k − 5","k + 5","5 − k"],"a":2,"e":"A sum is found by addition: k + 5.","v":"variables"},{"d":"BASIC","q":"If t = 2, evaluate t + t + t.","o":["5","6","8","23"],"a":1,"e":"Substitute 2 for each t: 2 + 2 + 2 = 6.","v":"variables"},{"d":"MEDIUM","q":"If x = 5, evaluate 3x + 4.","o":["19","17","27","15"],"a":0,"e":"3 × 5 + 4 = 15 + 4 = 19.","v":"variables"},{"d":"MEDIUM","q":"Which expression represents twice a number r, then add 7?","o":["2(r + 7)","2r + 7","r + 14","7r + 2"],"a":1,"e":"Twice r is 2r; then adding 7 gives 2r + 7.","v":"variables"},{"d":"MEDIUM","q":"If p = 6, evaluate 2p − 5.","o":["7","12","17","1"],"a":0,"e":"2 × 6 − 5 = 12 − 5 = 7.","v":"variables"},{"d":"MEDIUM","q":"A pencil costs c rupees. What is the cost of 8 pencils?","o":["c + 8","8 + c","8c","c/8"],"a":2,"e":"Eight pencils at c rupees each cost 8c rupees.","v":"variables"},{"d":"MEDIUM","q":"If y = 4, evaluate 5(y + 2).","o":["22","30","26","14"],"a":1,"e":"First calculate 4 + 2 = 6; then 5 × 6 = 30.","v":"variables"},{"d":"MEDIUM","q":"Which expression means “divide x by 3, then add 2”?","o":["x/(3 + 2)","x/3 + 2","3/x + 2","x/3 − 2"],"a":1,"e":"Divide x by 3 first, then add 2: x/3 + 2.","v":"variables"},{"d":"MEDIUM","q":"If a = 7 and b = 3, evaluate a − 2b.","o":["1","8","10","14"],"a":0,"e":"7 − 2 × 3 = 7 − 6 = 1.","v":"variables"},{"d":"MEDIUM","q":"A rectangle has length l and width w. Which expression gives its perimeter?","o":["lw","l + w","2(l + w)","2lw"],"a":2,"e":"Add length and width, then double the sum.","v":"variables"},{"d":"MEDIUM","q":"If n = 9, evaluate n/3 + 8.","o":["3","11","17","27"],"a":1,"e":"9 ÷ 3 + 8 = 3 + 8 = 11.","v":"variables"},{"d":"MEDIUM","q":"Which expression represents 4 more than the product of 7 and x?","o":["7(x + 4)","7x + 4","4x + 7","7x − 4"],"a":1,"e":"The product is 7x; four more is 7x + 4.","v":"variables"},{"d":"HARD","q":"If x = 4, evaluate 2x² − 3.","o":["13","29","5","32"],"a":1,"e":"x² = 16; 2 × 16 − 3 = 32 − 3 = 29.","v":"variables"},{"d":"HARD","q":"Which expression represents the total cost of n notebooks at ₹p each and one ₹20 pen?","o":["20np","np + 20","n(p + 20)","20 − np"],"a":1,"e":"The notebooks cost np rupees; add ₹20 for the pen.","v":"variables"},{"d":"HARD","q":"If a = 3 and b = 5, evaluate 2a + 3b.","o":["21","24","16","30"],"a":0,"e":"2 × 3 + 3 × 5 = 6 + 15 = 21.","v":"variables"},{"d":"HARD","q":"A number x is multiplied by 5, then 8 is subtracted. Which expression describes it?","o":["5(x − 8)","5x − 8","8 − 5x","x − 40"],"a":1,"e":"Multiplying first gives 5x; subtracting 8 gives 5x − 8.","v":"variables"},{"d":"HARD","q":"If m = 8, evaluate 3(m − 2) + 1.","o":["19","25","21","17"],"a":0,"e":"3 × (8 − 2) + 1 = 18 + 1 = 19.","v":"variables"},{"d":"HARD","q":"A bus has s seats. How many seats are there in 4 such buses and 7 extra seats?","o":["4(s + 7)","s + 11","4s + 7","7s + 4"],"a":2,"e":"Four buses have 4s seats; add 7 extra seats: 4s + 7.","v":"variables"},{"d":"HARD","q":"If x = 6, evaluate (x + 4)/2.","o":["5","8","10","12"],"a":0,"e":"(6 + 4) ÷ 2 = 10 ÷ 2 = 5.","v":"variables"},{"d":"HARD","q":"Which expression represents the difference between y and one-third of y?","o":["y + y/3","y/3 − y","y − y/3","3y − 1"],"a":2,"e":"The difference is y − y/3.","v":"variables"},{"d":"HARD","q":"If p = 4 and q = 2, evaluate p² + 3q.","o":["22","28","14","10"],"a":0,"e":"4² + 3 × 2 = 16 + 6 = 22.","v":"variables"},{"d":"HARD","q":"A number n is divided by 4 and then 7 is subtracted. Which expression represents the result?","o":["n ÷ (4 − 7)","4n − 7","n/4 − 7","n/(4 − 7)"],"a":2,"e":"Divide n by 4 first, then subtract 7: n/4 − 7.","v":"variables"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;if(window.skillupCelebrate)window.skillupCelebrate();xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand and evaluate variables</strong><small>Substitute values into expressions</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Translate words into algebraic expressions</strong><small>Combine like terms and evaluate expressions</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply variables to everyday situations</strong><small>Apply rectangle area in real life</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
