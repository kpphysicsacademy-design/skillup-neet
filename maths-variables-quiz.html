<style>
:root{color-scheme:light;--bg:#f7f7ed;--panel:#fff;--line:#dfe5d8;--ink:#29352c;--muted:#69766b;--green:#718b6b;--green-dark:#586f53;--green-soft:#e8f0e4;--red:#b94b50;--blue:#6c9fc4;--blue-soft:#e8f2f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}
.wrap{max-width:550px;margin:auto;padding:16px}
.top{display:grid;grid-template-columns:auto auto minmax(35px,1fr) auto auto;align-items:center;gap:9px;margin:4px 0 20px}
.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}
.progress{height:10px;border-radius:20px;background:#e5e9df;overflow:hidden;min-width:35px}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}
.pill{background:#edf1e9;padding:5px 8px;border-radius:12px;font-size:.8rem;font-weight:850;white-space:nowrap;color:var(--ink)}.xp{color:var(--green-dark)}
.meta{display:flex;justify-content:flex-start;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column;box-shadow:0 2px 8px #35452b0a}

.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}
.choice{width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:13px;color:var(--ink);padding:13px 15px;font:inherit;font-weight:700;min-height:52px;cursor:pointer}
.choice:hover{border-color:#a9b99f;background:#fbfcf8}.choice.selected{border-color:var(--blue);background:var(--blue-soft)}
.choice.correct{border-color:var(--green);background:var(--green-soft);color:#38543a}.choice.wrong{border-color:#d88c8f;background:#fae9e9;color:#87383d}.choice:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:12px;border-radius:12px;background:#f2f5ef;color:var(--muted)}.feedback.show{display:block}
.feedback.good{border:1px solid #a8c39e;color:#38543a}.feedback.bad{border:1px solid #e0b1b1}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}
.hint{color:var(--muted);font-size:.8rem}
button.primary{font:inherit;font-weight:850;cursor:pointer;border:0;border-radius:12px;background:var(--green);color:#fff;padding:12px 20px;min-width:140px}
button.primary:hover{background:var(--green-dark)}button.primary:disabled{opacity:.45;cursor:not-allowed}

.summary{background:#f2f5ef;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}

.skill{display:flex;align-items:center;gap:12px;background:#fbfcf8;border:1px solid var(--line);border-radius:12px;padding:12px}
.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green-dark)}.skill small{color:var(--muted)}
button:focus-visible,.choice:focus-visible,.back:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
@media(max-width:420px){.wrap{padding:11px}.top{gap:6px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.72rem;padding:5px 6px}.actions button{flex:1}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>

@media(max-width:520px){header .nav,header.top{width:100%!important;padding:6px 10px!important;gap:6px!important}.pill{font-size:10px!important;padding:5px 6px!important}main{width:100%!important;padding:10px 10px 28px!important}.quiz,.finish{padding:14px!important}.question{font-size:19px!important}}
</style>

<script>(function(){function celebrate(){if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;let layer=document.querySelector('.confetti-layer');if(!layer){layer=document.createElement('div');layer.className='confetti-layer';layer.setAttribute('aria-hidden','true');document.body.appendChild(layer);}const colours=['#58cc02','#1cb0f6','#ffbd2e','#ff6b9a','#b78bfa','#00c9a7'];for(let i=0;i<34;i++){const p=document.createElement('i');p.className='confetti-piece';p.style.left=(Math.random()*100)+'%';p.style.background=colours[i%colours.length];p.style.animationDelay=(Math.random()*.22)+'s';p.style.setProperty('--drift',((Math.random()-.5)*180)+'px');layer.appendChild(p);setTimeout(()=>p.remove(),2100);}}window.skillupCelebrate=celebrate;})();</script>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"In the expression 5x + 2, which symbol is the variable?","o":["2","5","+ ","x"],"a":3,"e":"The letter x represents a number that may vary."},{"d":"BASIC","q":"If a = 4, what is the value of a + 7?","o":["11","47","3","28"],"a":0,"e":"Substitute 4 for a: 4 + 7 = 11."},{"d":"BASIC","q":"Which expression means “a number n plus 9”?","o":["9 − n","n − 9","n + 9","9n"],"a":2,"e":"Adding 9 to n is written n + 9."},{"d":"BASIC","q":"Which expression means “6 times p”?","o":["p + 6","6p","p − 6","p/6"],"a":1,"e":"Multiplication of 6 and p is written 6p."},{"d":"BASIC","q":"If x = 3, evaluate 4x.","o":["43","1","12","7"],"a":2,"e":"4x means 4 × x; 4 × 3 = 12."},{"d":"BASIC","q":"Which expression represents 12 less than y?","o":["y − 12","12 − y","y + 12","12y"],"a":0,"e":"“12 less than y” means subtract 12 from y."},{"d":"BASIC","q":"If m = 10, what is m − 6?","o":["16","4","60","6"],"a":1,"e":"Substitute 10: 10 − 6 = 4."},{"d":"BASIC","q":"Which is a variable in the expression 3b − 8?","o":["b","−","3","8"],"a":0,"e":"The letter b represents the variable."},{"d":"BASIC","q":"Which expression means “the sum of k and 5”?","o":["5 − k","k − 5","k + 5","5k"],"a":2,"e":"A sum is found by addition: k + 5."},{"d":"BASIC","q":"If t = 2, evaluate t + t + t.","o":["5","8","6","23"],"a":2,"e":"Substitute 2 for each t: 2 + 2 + 2 = 6."},{"d":"MEDIUM","q":"If x = 5, evaluate 3x + 4.","o":["27","15","17","19"],"a":3,"e":"3 × 5 + 4 = 15 + 4 = 19."},{"d":"MEDIUM","q":"Which expression represents twice a number r, then add 7?","o":["2r + 7","2(r + 7)","7r + 2","r + 14"],"a":0,"e":"Twice r is 2r; then adding 7 gives 2r + 7."},{"d":"MEDIUM","q":"If p = 6, evaluate 2p − 5.","o":["17","7","1","12"],"a":1,"e":"2 × 6 − 5 = 12 − 5 = 7."},{"d":"MEDIUM","q":"A pencil costs c rupees. What is the cost of 8 pencils?","o":["8 + c","c/8","c + 8","8c"],"a":3,"e":"Eight pencils at c rupees each cost 8c rupees."},{"d":"MEDIUM","q":"If y = 4, evaluate 5(y + 2).","o":["14","30","26","22"],"a":1,"e":"First calculate 4 + 2 = 6; then 5 × 6 = 30."},{"d":"MEDIUM","q":"Which expression means “divide x by 3, then add 2”?","o":["x/(3 + 2)","3/x + 2","x/3 + 2","x/3 − 2"],"a":2,"e":"Divide x by 3 first, then add 2: x/3 + 2."},{"d":"MEDIUM","q":"If a = 7 and b = 3, evaluate a − 2b.","o":["10","14","8","1"],"a":3,"e":"7 − 2 × 3 = 7 − 6 = 1."},{"d":"MEDIUM","q":"A rectangle has length l and width w. Which expression gives its perimeter?","o":["l + w","lw","2lw","2(l + w)"],"a":3,"e":"Add length and width, then double the sum."},{"d":"MEDIUM","q":"If n = 9, evaluate n/3 + 8.","o":["17","3","27","11"],"a":3,"e":"9 ÷ 3 + 8 = 3 + 8 = 11."},{"d":"MEDIUM","q":"Which expression represents 4 more than the product of 7 and x?","o":["7x + 4","7x − 4","7(x + 4)","4x + 7"],"a":0,"e":"The product is 7x; four more is 7x + 4."},{"d":"HARD","q":"If x = 4, evaluate 2x² − 3.","o":["32","29","5","13"],"a":1,"e":"x² = 16; 2 × 16 − 3 = 32 − 3 = 29."},{"d":"HARD","q":"Which expression represents the total cost of n notebooks at ₹p each and one ₹20 pen?","o":["20np","n(p + 20)","np + 20","20 − np"],"a":2,"e":"The notebooks cost np rupees; add ₹20 for the pen."},{"d":"HARD","q":"If a = 3 and b = 5, evaluate 2a + 3b.","o":["16","30","24","21"],"a":3,"e":"2 × 3 + 3 × 5 = 6 + 15 = 21."},{"d":"HARD","q":"A number x is multiplied by 5, then 8 is subtracted. Which expression describes it?","o":["5x − 8","5(x − 8)","x − 40","8 − 5x"],"a":0,"e":"Multiplying first gives 5x; subtracting 8 gives 5x − 8."},{"d":"HARD","q":"If m = 8, evaluate 3(m − 2) + 1.","o":["21","19","17","25"],"a":1,"e":"3 × (8 − 2) + 1 = 18 + 1 = 19."},{"d":"HARD","q":"A bus has s seats. How many seats are there in 4 such buses and 7 extra seats?","o":["s + 11","7s + 4","4(s + 7)","4s + 7"],"a":3,"e":"Four buses have 4s seats; add 7 extra seats: 4s + 7."},{"d":"HARD","q":"If x = 6, evaluate (x + 4)/2.","o":["12","8","10","5"],"a":3,"e":"(6 + 4) ÷ 2 = 10 ÷ 2 = 5."},{"d":"HARD","q":"Which expression represents the difference between y and one-third of y?","o":["y + y/3","y − y/3","y/3 − y","3y − 1"],"a":1,"e":"The difference is y − y/3."},{"d":"HARD","q":"If p = 4 and q = 2, evaluate p² + 3q.","o":["14","10","28","22"],"a":3,"e":"4² + 3 × 2 = 16 + 6 = 22."},{"d":"HARD","q":"A number n is divided by 4 and then 7 is subtracted. Which expression represents the result?","o":["4n − 7","n ÷ (4 − 7)","n/(4 − 7)","n/4 − 7"],"a":3,"e":"Divide n by 4 first, then subtract 7: n/4 − 7."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;if(window.skillupCelebrate)window.skillupCelebrate();xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Understand and evaluate variables</strong><small>Substitute values into expressions</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Translate words into algebraic expressions</strong><small>Combine like terms and evaluate expressions</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Apply variables to everyday situations</strong><small>Apply rectangle area in real life</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
