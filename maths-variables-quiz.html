ar(--line);border-radius:12px;background:#fff;color:var(--ink);text-align:left;font:700 14px system-ui;cursor:pointer}.option .letter{display:grid;place-items:center;flex:0 0 27px;height:27px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:11px;font-weight:900}.option.selected{border:2px solid #79bfdf;background:#f0f9ff;padding:8px 10px}.option.correct{border:2px solid #8fc77c;background:var(--good);padding:8px 10px}.option.wrong{border:2px solid #e0a094;background:var(--bad);padding:8px 10px}.option:disabled{opacity:1}.feedback{display:none;margin-top:12px;padding:11px 12px;border-radius:11px;font-size:13px}.feedback.show{display:block}.feedback.good{background:var(--good);color:#365b2e}.feedback.bad{background:var(--bad);color:#85473d}.actions{display:grid;gap:8px;margin-top:14px}.btn{width:100%;min-height:47px;border:0;border-radius:11px;background:var(--blue);color:#fff;font:850 14px system-ui;cursor:pointer}.btn:disabled{background:#dce5e9;color:#89959b;cursor:not-allowed}.hint{text-align:center;color:var(--muted);font-size:11px}.finish{text-align:center}.score{font-size:42px;font-weight:950;color:var(--blue)}.finish p{color:var(--muted)}.skill{margin:8px 0;padding:10px;text-align:left;border:1px solid var(--line);border-radius:10px;background:#f8fafb}.skill strong{display:block}.skill small{color:var(--muted)}@media(max-width:420px){.nav{padding:7px 10px}.pill{font-size:10px}main{width:100%;padding:12px 10px 28px}.quiz,.finish{padding:14px}.question{font-size:19px}}

<main><div class="eyebrow">Maths · Algebra</div><h1>Variables</h1><p class="intro">Understand variables, translate words into algebraic expressions, substitute values and solve everyday problems using letters as numbers.</p>
<a class="sim" href="maths-variables-simulator.html?v=20261112-variables-simulator-v5">🧮 Explore the Variables Simulator</a>
<div class="pr"><span id="counter">QUESTION 1 OF 30</span><span id="pct">0% complete</span></div><div class="track" id="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="bar"></div></div>
<section class="quiz" id="quiz" aria-live="polite"><div class="meta" id="meta"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><div class="hint" id="hint">30 questions · Select one answer</div><button class="btn" id="action" disabled>Check answer</button></div></section><section class="finish" id="finish" hidden></section></main>
<script>
(()=>{'use strict';const questions=[{"d":"BASIC","q":"In the expression 5x + 2, which symbol is the variable?","o":["2","5","+ ","x"],"a":3,"e":"The letter x represents a number that may vary."},{"d":"BASIC","q":"If a = 4, what is the value of a + 7?","o":["11","47","3","28"],"a":0,"e":"Substitute 4 for a: 4 + 7 = 11."},{"d":"BASIC","q":"Which expression means “a number n plus 9”?","o":["9 − n","n − 9","n + 9","9n"],"a":2,"e":"Adding 9 to n is written n + 9."},{"d":"BASIC","q":"Which expression means “6 times p”?","o":["p + 6","6p","p − 6","p/6"],"a":1,"e":"Multiplication of 6 and p is written 6p."},{"d":"BASIC","q":"If x = 3, evaluate 4x.","o":["43","1","12","7"],"a":2,"e":"4x means 4 × x; 4 × 3 = 12."},{"d":"BASIC","q":"Which expression represents 12 less than y?","o":["y − 12","12 − y","y + 12","12y"],"a":0,"e":"“12 less than y” means subtract 12 from y."},{"d":"BASIC","q":"If m = 10, what is m − 6?","o":["16","4","60","6"],"a":1,"e":"Substitute 10: 10 − 6 = 4."},{"d":"BASIC","q":"Which is a variable in the expression 3b − 8?","o":["b","−","3","8"],"a":0,"e":"The letter b represents the variable."},{"d":"BASIC","q":"Which expression means “the sum of k and 5”?","o":["5 − k","k − 5","k + 5","5k"],"a":2,"e":"A sum is found by addition: k + 5."},{"d":"BASIC","q":"If t = 2, evaluate t + t + t.","o":["5","8","6","23"],"a":2,"e":"Substitute 2 for each t: 2 + 2 + 2 = 6."},{"d":"MEDIUM","q":"If x = 5, evaluate 3x + 4.","o":["27","15","17","19"],"a":3,"e":"3 × 5 + 4 = 15 + 4 = 19."},{"d":"MEDIUM","q":"Which expression represents twice a number r, then add 7?","o":["2r + 7","2(r + 7)","7r + 2","r + 14"],"a":0,"e":"Twice r is 2r; then adding 7 gives 2r + 7."},{"d":"MEDIUM","q":"If p = 6, evaluate 2p − 5.","o":["17","7","1","12"],"a":1,"e":"2 × 6 − 5 = 12 − 5 = 7."},{"d":"MEDIUM","q":"A pencil costs c rupees. What is the cost of 8 pencils?","o":["8 + c","c/8","c + 8","8c"],"a":3,"e":"Eight pencils at c rupees each cost 8c rupees."},{"d":"MEDIUM","q":"If y = 4, evaluate 5(y + 2).","o":["14","30","26","22"],"a":1,"e":"First calculate 4 + 2 = 6; then 5 × 6 = 30."},{"d":"MEDIUM","q":"Which expression means “divide x by 3, then add 2”?","o":["x/(3 + 2)","3/x + 2","x/3 + 2","x/3 − 2"],"a":2,"e":"Divide x by 3 first, then add 2: x/3 + 2."},{"d":"MEDIUM","q":"If a = 7 and b = 3, evaluate a − 2b.","o":["10","14","8","1"],"a":3,"e":"7 − 2 × 3 = 7 − 6 = 1."},{"d":"MEDIUM","q":"A rectangle has length l and width w. Which expression gives its perimeter?","o":["l + w","lw","2lw","2(l + w)"],"a":3,"e":"Add length and width, then double the sum."},{"d":"MEDIUM","q":"If n = 9, evaluate n/3 + 8.","o":["17","3","27","11"],"a":3,"e":"9 ÷ 3 + 8 = 3 + 8 = 11."},{"d":"MEDIUM","q":"Which expression represents 4 more than the product of 7 and x?","o":["7x + 4","7x − 4","7(x + 4)","4x + 7"],"a":0,"e":"The product is 7x; four more is 7x + 4."},{"d":"HARD","q":"If x = 4, evaluate 2x² − 3.","o":["32","29","5","13"],"a":1,"e":"x² = 16; 2 × 16 − 3 = 32 − 3 = 29."},{"d":"HARD","q":"Which expression represents the total cost of n notebooks at ₹p each and one ₹20 pen?","o":["20np","n(p + 20)","np + 20","20 − np"],"a":2,"e":"The notebooks cost np rupees; add ₹20 for the pen."},{"d":"HARD","q":"If a = 3 and b = 5, evaluate 2a + 3b.","o":["16","30","24","21"],"a":3,"e":"2 × 3 + 3 × 5 = 6 + 15 = 21."},{"d":"HARD","q":"A number x is multiplied by 5, then 8 is subtracted. Which expression describes it?","o":["5x − 8","5(x − 8)","x − 40","8 − 5x"],"a":0,"e":"Multiplying first gives 5x; subtracting 8 gives 5x − 8."},{"d":"HARD","q":"If m = 8, evaluate 3(m − 2) + 1.","o":["21","19","17","25"],"a":1,"e":"3 × (8 − 2) + 1 = 18 + 1 = 19."},{"d":"HARD","q":"A bus has s seats. How many seats are there in 4 such buses and 7 extra seats?","o":["s + 11","7s + 4","4(s + 7)","4s + 7"],"a":3,"e":"Four buses have 4s seats; add 7 extra seats: 4s + 7."},{"d":"HARD","q":"If x = 6, evaluate (x + 4)/2.","o":["12","8","10","5"],"a":3,"e":"(6 + 4) ÷ 2 = 10 ÷ 2 = 5."},{"d":"HARD","q":"Which expression represents the difference between y and one-third of y?","o":["y + y/3","y − y/3","y/3 − y","3y − 1"],"a":1,"e":"The difference is y − y/3."},{"d":"HARD","q":"If p = 4 and q = 2, evaluate p² + 3q.","o":["14","10","28","22"],"a":3,"e":"4² + 3 × 2 = 16 + 6 = 22."},{"d":"HARD","q":"A number n is divided by 4 and then 7 is subtracted. Which expression represents the result?","o":["4n − 7","n ÷ (4 − 7)","n/(4 − 7)","n/4 − 7"],"a":3,"e":"Divide n by 4 first, then subtract 7: n/4 − 7."}];const $=id=>document.getElementById(id);let i=0,sel=-1,locked=false,done=false,xp=0,correct=0,streak=0;const letters=['A','B','C','D'];
function progress(){const p=Math.round(i/questions.length*100);$('bar').style.width=p+'%';$('progress').setAttribute('aria-valuenow',p);$('pct').textContent=p+'% complete';}
function render(){const q=questions[i];sel=-1;locked=false;$('quiz').hidden=false;$('finish').hidden=true;$('counter').textContent='QUESTION '+(i+1)+' OF '+questions.length;$('meta').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(i+1);$('question').textContent=q.q;$('options').innerHTML='';q.o.forEach((v,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.innerHTML='<span class="letter">'+letters[j]+'</span><span></span>';b.querySelector('span:last-child').textContent=v;b.onclick=()=>{if(locked)return;sel=j;[...$('options').children].forEach((x,k)=>x.classList.toggle('selected',k===j));$('action').disabled=false;};$('options').appendChild(b);});$('feedback').className='feedback';$('feedback').textContent='';$('hint').textContent='30 questions · Select one answer';$('action').textContent='Check answer';$('action').disabled=true;progress();}
function act(){if(done){restart();return;}const q=questions[i];if(!locked){if(sel<0)return;locked=true;const ok=sel===q.a;if(ok){correct++;xp+=10;streak++;}else streak=0;$('xp').textContent='⭐ '+xp+' XP';$('streak').textContent='🔥 '+streak;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===sel)b.classList.add('wrong');});$('feedback').textContent=(ok?'✨ Correct! ':'💡 Review: ')+q.e;$('feedback').className='feedback show '+(ok?'good':'bad');$('hint').textContent=ok?'+10 XP':'Keep practising';$('action').textContent=i===questions.length-1?'View results →':'Continue →';return;}if(i<questions.length-1){i++;render();}else results();}
function results(){done=true;$('quiz').hidden=true;$('finish').hidden=false;$('counter').textContent='QUIZ COMPLETE';$('bar').style.width='100%';$('progress').setAttribute('aria-valuenow','100');$('pct').textContent='100% complete';$('finish').innerHTML='<div style="font-size:46px">🏆</div><h2>'+(correct>=24?'Excellent work!':correct>=15?'Good progress!':'Keep practising!')+'</h2><div class="score">'+correct+' / '+questions.length+'</div><p>'+Math.round(correct/questions.length*100)+'% accuracy · '+xp+' XP earned</p><div class="skill"><strong>🔢 Compare decimal values</strong><small>Use place value to compare decimals accurately.</small></div><div class="skill"><strong>↔️ Order decimal numbers</strong><small>Compare decimals with different numbers of digits.</small></div><div class="skill"><strong>🧠 Apply comparison strategies</strong><small>Use equivalent trailing zeros and aligned place values.</small></div><button class="btn" id="retry">Try again ↻</button>';$('retry').onclick=restart;}
function restart(){i=0;sel=-1;locked=false;done=false;xp=0;correct=0;streak=0;$('xp').textContent='⭐ 0 XP';$('streak').textContent='🔥 0';render();}
$('action').onclick=act;render();})();
</script><script src="/shared-nav.js?v=20261017-duolingo-standard-v1"></script></body></html>
