<style>

 .skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}.skills-result{margin-top:14px;text-align:left}.skills-result h3{margin:0 0 8px;font-size:1rem}.skills-result .skill-item{margin-top:7px}.skill-item.unlocked{border-color:var(--green);color:var(--green2);background:#174b42} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}.diagram .accent{stroke:#58d6a3}.diagram .blue{stroke:#91b7ff}.diagram .gold{stroke:#ffd27a} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Equations</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Equation Skills"><div class="skill-title">🎯 Angle Skills</div><div class="skill-list"><div class="skill-item">Recognise vertically opposite angles</div><div class="skill-item">Use equal opposite angles</div><div class="skill-item">Solve intersecting-line angle problems</div></div></section></div>
<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"Two straight lines intersect. If one angle is 48°, what is the vertically opposite angle?","o":["48°","42°","132°","142°"],"a":0,"e":"Vertically opposite angles are equal, so the opposite angle is 48°.","v":"vertically-opposite-angles"},{"d":"BASIC","q":"Two lines intersect. One angle is 115°. Find the angle vertically opposite to it.","o":["65°","115°","75°","180°"],"a":1,"e":"Vertically opposite angles have equal measures.","v":"vertically-opposite-angles"},{"d":"BASIC","q":"When two straight lines intersect, vertically opposite angles are…","o":["Always complementary","Always adjacent","Always equal","Always 90°"],"a":2,"e":"Each pair of vertically opposite angles has equal measures.","v":"vertically-opposite-angles"},{"d":"BASIC","q":"Two intersecting lines create an angle of 70°. What is either adjacent angle?","o":["70°","90°","140°","110°"],"a":3,"e":"Adjacent angles on intersecting straight lines form a linear pair: 180° − 70° = 110°.","v":"vertically-opposite-angles"},{"d":"BASIC","q":"If one angle formed by intersecting lines is 90°, what is its vertically opposite angle?","o":["90°","45°","180°","270°"],"a":0,"e":"Vertically opposite angles are equal; the opposite angle is also 90°.","v":"vertically-opposite-angles"},{"d":"BASIC","q":"Two vertically opposite angles are labelled (3x)° and 75°. Find x.","o":["15","25","20","30"],"a":1,"e":"3x = 75, so x = 25.","v":"vertically-opposite-angles"},{"d":"BASIC","q":"Two lines intersect. If one angle is 135°, what is the smaller angle adjacent to it?","o":["35°","55°","45°","135°"],"a":2,"e":"Adjacent angles in a linear pair total 180°; 180° − 135° = 45°.","v":"vertically-opposite-angles"},{"d":"BASIC","q":"Which pair of angles is vertically opposite?","o":["Two angles sharing a side","Two angles adding to 90°","Two angles on the same straight line","The angles directly opposite each other when two lines cross"],"a":3,"e":"Vertically opposite angles lie opposite each other at the intersection of two lines.","v":"vertically-opposite-angles"},{"d":"BASIC","q":"If one of four angles at an intersection is 82°, what is the angle directly opposite it?","o":["82°","8°","98°","108°"],"a":0,"e":"The directly opposite angle is vertically opposite and equal to 82°.","v":"vertically-opposite-angles"},{"d":"BASIC","q":"Two intersecting lines form one angle of 40°. What is the angle adjacent to it?","o":["40°","140°","50°","160°"],"a":1,"e":"Adjacent angles on a straight line sum to 180°; 180° − 40° = 140°.","v":"vertically-opposite-angles"},{"d":"MEDIUM","q":"Vertically opposite angles measure (2x + 15)° and 75°. Find x.","o":["20","25","30","35"],"a":2,"e":"2x + 15 = 75 gives 2x = 60 and x = 30.","v":"vertically-opposite-angles"},{"d":"MEDIUM","q":"Two vertically opposite angles are (4x − 10)° and (2x + 30)°. Find x.","o":["10","15","25","20"],"a":3,"e":"4x − 10 = 2x + 30 gives 2x = 40, so x = 20.","v":"vertically-opposite-angles"},{"d":"MEDIUM","q":"An angle is 68°. Find the angle adjacent to it at the intersection of two straight lines.","o":["112°","68°","102°","122°"],"a":0,"e":"Adjacent angles in a linear pair total 180°; 180° − 68° = 112°.","v":"vertically-opposite-angles"},{"d":"MEDIUM","q":"Vertically opposite angles are (5x − 20)° and (3x + 30)°. Find their common measure.","o":["75°","105°","90°","120°"],"a":1,"e":"5x − 20 = 3x + 30 gives x = 25; each angle is 105°.","v":"vertically-opposite-angles"},{"d":"MEDIUM","q":"Two intersecting lines create four angles. One is (x + 25)° and its adjacent angle is (2x + 5)°. Find x.","o":["30","40","50","60"],"a":2,"e":"x + 25 + 2x + 5 = 180 gives 3x = 150, so x = 50.","v":"vertically-opposite-angles"},{"d":"MEDIUM","q":"A pair of vertically opposite angles are (3x − 5)° and (x + 35)°. Find the angle measure.","o":["45°","65°","75°","55°"],"a":3,"e":"3x − 5 = x + 35 gives x = 20; each angle is 55°.","v":"vertically-opposite-angles"},{"d":"MEDIUM","q":"One angle at an intersection is twice its adjacent angle. Find the larger angle.","o":["120°","60°","90°","150°"],"a":0,"e":"Let smaller be x and larger 2x; x + 2x = 180 gives larger = 120°.","v":"vertically-opposite-angles"},{"d":"MEDIUM","q":"Vertically opposite angles are (6x)° and (4x + 30)°. Find x.","o":["10","15","20","25"],"a":1,"e":"6x = 4x + 30 gives x = 15.","v":"vertically-opposite-angles"},{"d":"MEDIUM","q":"An angle and its adjacent angle at an intersection differ by 40°. Find the larger angle.","o":["70°","90°","110°","120°"],"a":2,"e":"Let larger L and smaller S: L + S = 180 and L − S = 40, so L = 110°.","v":"vertically-opposite-angles"},{"d":"MEDIUM","q":"Two vertically opposite angles are (x + 45)° and (2x + 15)°. Find x.","o":["15","20","25","30"],"a":3,"e":"x + 45 = 2x + 15 gives x = 30.","v":"vertically-opposite-angles"},{"d":"HARD","q":"Vertically opposite angles are (7x − 15)° and (4x + 30)°. Find their measure.","o":["90°","75°","105°","120°"],"a":0,"e":"7x − 15 = 4x + 30 gives x = 15; the angle is 90°.","v":"vertically-opposite-angles"},{"d":"HARD","q":"Two intersecting lines form adjacent angles (3x + 12)° and (5x − 4)°. Find the larger angle.","o":["63°","103.5°","76.5°","116°"],"a":1,"e":"3x + 12 + 5x − 4 = 180 gives x = 21.5; the angles are 76.5° and 103.5°, so the larger is 103.5°.","v":"vertically-opposite-angles"},{"d":"HARD","q":"Vertically opposite angles are (2x + 40)° and (5x − 20)°. Find x.","o":["10","15","20","25"],"a":2,"e":"2x + 40 = 5x − 20 gives 3x = 60, so x = 20.","v":"vertically-opposite-angles"},{"d":"HARD","q":"One angle at an intersection is 4 times its adjacent angle. Find the smaller angle.","o":["30°","45°","60°","36°"],"a":3,"e":"Let smaller be x and larger 4x; 5x = 180 gives x = 36°.","v":"vertically-opposite-angles"},{"d":"HARD","q":"Two vertically opposite angles are (8x − 25)° and (5x + 20)°. Find the common angle.","o":["95°","100°","105°","110°"],"a":0,"e":"8x − 25 = 5x + 20 gives x = 15; each angle is 95°.","v":"vertically-opposite-angles"},{"d":"HARD","q":"An angle and its adjacent angle differ by 72°. Find the smaller angle.","o":["44°","54°","64°","72°"],"a":1,"e":"Let smaller S and larger L: S + L = 180 and L − S = 72, so S = 54°.","v":"vertically-opposite-angles"},{"d":"HARD","q":"Vertically opposite angles are (3x + 18)° and (5x − 22)°. Find the angle measure.","o":["72°","84°","78°","90°"],"a":2,"e":"3x + 18 = 5x − 22 gives x = 20; each angle is 78°.","v":"vertically-opposite-angles"},{"d":"HARD","q":"Three angles around an intersection are 55°, 125° and x°. Find x.","o":["90°","125°","180°","55°"],"a":3,"e":"The fourth angle is vertically opposite 55° or supplementary to 125°, so x = 55°.","v":"vertically-opposite-angles"},{"d":"HARD","q":"An angle at an intersection is (3x + 15)°. Its adjacent angle is (5x − 11)°. Find the vertically opposite angle to the first.","o":["81°","84°","102°","117°"],"a":0,"e":"3x + 15 + 5x − 11 = 180 gives x = 22; the first angle is 81°, and its vertically opposite angle is also 81°.","v":"vertically-opposite-angles"},{"d":"HARD","q":"Two vertically opposite angles are (9x − 12)° and (6x + 24)°. Find the common angle.","o":["84°","96°","108°","120°"],"a":1,"e":"9x − 12 = 6x + 24 gives x = 12; each angle is 96°.","v":"vertically-opposite-angles"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}const visuals={
balance:'',
blocks:'',
bars:'',
picture:''
};function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🔢</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+'<div class="skill-item '+(correct>=8?'unlocked':'')+'">'+(correct>=8?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Identify vertically opposite angles</div>'+'<div class="skill-item '+(correct>=18?'unlocked':'')+'">'+(correct>=18?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Calculate missing angle measures</div>'+'<div class="skill-item '+(correct>=24?'unlocked':'')+'">'+(correct>=24?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Solve multi-step angle problems</div>'+'</div></div>' ;$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script></body></html>
