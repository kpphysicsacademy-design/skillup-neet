<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261013-views-3d-objects-duolingo-v1"><title>Views of 3D Objects | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}.skills{display:grid;gap:9px;text-align:left;margin:14px 0}.skill{display:flex;align-items:center;gap:12px;background:#182942;border:1px solid var(--line);border-radius:14px;padding:12px}.skill-icon{font-size:1.5rem}.skill strong{display:block;color:var(--green2)}.skill small{color:var(--muted)}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Views of 3D objects</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main></div>
<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"A view of a solid from directly above is called the...","o":["top view","front view","side view","bottom edge"],"a":0,"e":"The top view shows the outline seen when looking straight down.","v":"views-of-3d-objects"},{"d":"BASIC","q":"Looking directly at the front of a cube, what 2D shape do you see?","o":["Circle","Square","Triangle","Pentagon"],"a":1,"e":"A cube's front face is a square.","v":"views-of-3d-objects"},{"d":"BASIC","q":"Looking directly at the front of a cylinder standing upright, what outline do you usually see?","o":["Triangle","Hexagon","Rectangle","Pentagon"],"a":2,"e":"From the side, an upright cylinder's outline is rectangular.","v":"views-of-3d-objects"},{"d":"BASIC","q":"Looking straight down at an upright cylinder, what shape do you see?","o":["Rectangle","Triangle","Square","Circle"],"a":3,"e":"The top face of an upright cylinder is circular.","v":"views-of-3d-objects"},{"d":"BASIC","q":"A cuboid is 6 cm long, 3 cm wide, and 2 cm high. What are the dimensions of its top view?","o":["6 cm by 3 cm","6 cm by 2 cm","3 cm by 2 cm","2 cm by 2 cm"],"a":0,"e":"The top view shows length and width; height is not visible in that view.","v":"views-of-3d-objects"},{"d":"BASIC","q":"A cube is made from unit cubes in a single straight row of 4 cubes. What is the front view if the row runs left to right?","o":["A 2×2 square","A row of 4 squares","A row of 4 circles","A triangle"],"a":1,"e":"Each cube contributes one square to the front outline of the row.","v":"views-of-3d-objects"},{"d":"BASIC","q":"Which view shows the height and width of a cuboid?","o":["Top view","Bottom view","Front view","Plan view only"],"a":2,"e":"The front view shows the front face, whose dimensions are width and height.","v":"views-of-3d-objects"},{"d":"BASIC","q":"A solid has a circular top view and a triangular side view. Which solid could it be?","o":["A cube","A cuboid","A triangular prism","A cone"],"a":3,"e":"An upright cone looks circular from above and triangular from the side.","v":"views-of-3d-objects"},{"d":"BASIC","q":"What does a top view of a square-based pyramid look like if its apex is above the centre?","o":["A square, often with lines from the centre to corners","A circle only","A rectangle only","A triangle only"],"a":0,"e":"The base outline is square, and edges from the apex project toward the base corners.","v":"views-of-3d-objects"},{"d":"BASIC","q":"A sphere viewed from the front has what outline?","o":["Square","Circle","Triangle","Rectangle"],"a":1,"e":"Every direct orthographic view of a sphere has a circular outline.","v":"views-of-3d-objects"},{"d":"MEDIUM","q":"A cuboid measures 8 cm × 5 cm × 3 cm. What are the front-view dimensions if 8 cm is its width and 3 cm is its height?","o":["8 cm by 5 cm","5 cm by 3 cm","8 cm by 3 cm","5 cm by 8 cm"],"a":2,"e":"The front view uses width and height, so it measures 8 cm by 3 cm.","v":"views-of-3d-objects"},{"d":"MEDIUM","q":"A cuboid measures 8 cm × 5 cm × 3 cm. What are the side-view dimensions if the depth is 5 cm and height is 3 cm?","o":["8 cm by 5 cm","8 cm by 3 cm","3 cm by 3 cm","5 cm by 3 cm"],"a":3,"e":"The side view shows depth and height.","v":"views-of-3d-objects"},{"d":"MEDIUM","q":"A stack has 3 unit cubes along the front and 2 cubes in depth, all only one cube high. What is the top view?","o":["A 3 by 2 rectangle of 6 squares","A row of 3 squares","A 2 by 2 square","A single square"],"a":0,"e":"The footprint covers 3 positions across and 2 positions deep, making 6 squares.","v":"views-of-3d-objects"},{"d":"MEDIUM","q":"A solid is one cube wide, one cube deep, and 3 cubes high. What is its front view?","o":["A 3 by 3 square","A vertical rectangle 1 square wide and 3 squares high","A row of 3 squares","A single square"],"a":1,"e":"The front outline is one cube across and three cubes tall.","v":"views-of-3d-objects"},{"d":"MEDIUM","q":"A building's plan is an L-shaped arrangement of 5 equal square floor tiles. What does the plan represent?","o":["Its height viewed from the front","Its underside only","The footprint viewed from above","Its side length in perspective"],"a":2,"e":"A plan is a top view showing the footprint or layout.","v":"views-of-3d-objects"},{"d":"MEDIUM","q":"A cube has side length 4 cm. What is the area of its front view?","o":["12 cm²","8 cm²","64 cm²","16 cm²"],"a":3,"e":"The front view is a square with area 4 × 4 = 16 cm².","v":"views-of-3d-objects"},{"d":"MEDIUM","q":"A rectangular box is 10 cm long, 4 cm wide, and 6 cm high. What is the area of its top-view rectangle?","o":["40 cm²","24 cm²","60 cm²","20 cm²"],"a":0,"e":"Top area = length × width = 10 × 4 = 40 cm².","v":"views-of-3d-objects"},{"d":"MEDIUM","q":"A cone stands on its circular base. Which pair of views is correct?","o":["Top: triangle; front: circle","Top: circle; front: triangle","Top: square; front: rectangle","Top: rectangle; front: square"],"a":1,"e":"The base is circular from above; the upright cone's side outline is triangular.","v":"views-of-3d-objects"},{"d":"MEDIUM","q":"A triangular prism is positioned so its triangular end faces the viewer. What is the front view?","o":["Circle","Square","Triangle","Pentagon"],"a":2,"e":"The visible end face is triangular.","v":"views-of-3d-objects"},{"d":"MEDIUM","q":"A row of 5 equal cubes is viewed from above. How many unit squares appear in the top view?","o":["1","4","10","5"],"a":3,"e":"Each cube occupies one square in the top view, so there are five.","v":"views-of-3d-objects"},{"d":"HARD","q":"A stack of cubes has 3 cubes in the bottom row and 2 cubes stacked above the leftmost bottom cube. What is the maximum height shown in the front view?","o":["3 cubes","1 cube","2 cubes","5 cubes"],"a":0,"e":"The leftmost column is one bottom cube plus two above it, for height 3.","v":"views-of-3d-objects"},{"d":"HARD","q":"A solid is built with bottom layer 2×3 cubes and a second layer of 2 cubes directly above two bottom cubes. How many squares are in its top-view footprint?","o":["2","6","8","12"],"a":1,"e":"The top view records occupied positions, not stack height: the footprint is 2×3 = 6 positions.","v":"views-of-3d-objects"},{"d":"HARD","q":"A cuboid is 9 cm long, 4 cm deep, and 7 cm high. What is the total area of its front and top views combined?","o":["63 cm²","36 cm²","99 cm²","127 cm²"],"a":2,"e":"Front area = 9×7 = 63 cm²; top area = 9×4 = 36 cm²; total = 99 cm².","v":"views-of-3d-objects"},{"d":"HARD","q":"A stack of cubes has a front view that is 3 squares wide and 2 squares high. What is the minimum number of cubes needed to create that front view?","o":["3","5","9","6"],"a":3,"e":"At least one cube is needed in each of the 3×2 visible positions, so the minimum is 6.","v":"views-of-3d-objects"},{"d":"HARD","q":"A rectangular block measures 12 cm × 5 cm × 4 cm. Which view has the greatest area?","o":["Top view","Front view","Side view","All three views have equal area"],"a":0,"e":"Top area = 12×5 = 60 cm²; front = 12×4 = 48 cm²; side = 5×4 = 20 cm².","v":"views-of-3d-objects"},{"d":"HARD","q":"A solid has a top view of a 2×2 square footprint. Its four columns have heights 1, 2, 2, and 3 cubes. How many cubes are in the solid?","o":["4","8","6","12"],"a":1,"e":"Add the four column heights: 1 + 2 + 2 + 3 = 8 cubes.","v":"views-of-3d-objects"},{"d":"HARD","q":"A cuboid has dimensions 6 cm × 4 cm × 3 cm. What is the perimeter of its top view?","o":["18 cm","24 cm","20 cm","13 cm"],"a":2,"e":"Top view is 6 cm by 4 cm; perimeter = 2(6+4) = 20 cm.","v":"views-of-3d-objects"},{"d":"HARD","q":"A cube tower is 4 cubes high and one cube wide. What are the front-view area and top-view area, respectively, in unit squares?","o":["4 and 4","1 and 4","8 and 1","4 and 1"],"a":3,"e":"The front shows four stacked squares; the top shows only one square footprint.","v":"views-of-3d-objects"},{"d":"HARD","q":"A cuboid has length 7 cm, width 4 cm, and height 2 cm. What is the area of its side view?","o":["8 cm²","14 cm²","28 cm²","11 cm²"],"a":0,"e":"The side view uses width and height: 4 × 2 = 8 cm².","v":"views-of-3d-objects"},{"d":"HARD","q":"A solid has a front view of a 4×2 rectangle and a top view of a 4×3 rectangle. If it is a cuboid, what are its dimensions (length × depth × height)?","o":["4 × 2 × 3","4 × 3 × 2","3 × 4 × 2","2 × 3 × 4"],"a":1,"e":"The front gives length 4 and height 2; the top gives length 4 and depth 3.","v":"views-of-3d-objects"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Read views of 3D objects</strong><small>Connect top, front and side views</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Interpret cube stacks and solid dimensions</strong><small>Calculate view areas and footprints</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve spatial reasoning problems</strong><small>Connect 2D views to 3D structures</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>\n<script src="/shared-nav.js?v=20261013-universal-nav-v1"></script>\n</body></html>
