<script>
(function(){'use strict';const questions=[{"d":"BASIC","q":"Find the volume of a cube with side 4 cm.","o":["16 cm³","48 cm³","64 cm³","96 cm³"],"a":2,"e":"Volume = side³ = 4³ = 64 cm³.","v":"volume-cube-cuboid"},{"d":"BASIC","q":"A cuboid measures 8 cm × 5 cm × 3 cm. Find its volume.","o":["40 cm³","120 cm³","128 cm³","240 cm³"],"a":1,"e":"Volume = length × breadth × height = 8 × 5 × 3 = 120 cm³.","v":"volume-cube-cuboid"},{"d":"BASIC","q":"The volume of a cube is 343 cm³. Find its side.","o":["6 cm","7 cm","8 cm","9 cm"],"a":1,"e":"The cube root of 343 is 7, so its side is 7 cm.","v":"volume-cube-cuboid"},{"d":"BASIC","q":"A cuboid has volume 180 cm³, length 10 cm and breadth 6 cm. Find its height.","o":["2 cm","3 cm","4 cm","5 cm"],"a":1,"e":"Height = 180 ÷ (10 × 6) = 3 cm.","v":"volume-cube-cuboid"},{"d":"BASIC","q":"Find the volume of a cuboid 12 m long, 4 m wide and 2 m high.","o":["18 m³","48 m³","96 m³","192 m³"],"a":2,"e":"Volume = 12 × 4 × 2 = 96 m³.","v":"volume-cube-cuboid"},{"d":"BASIC","q":"A cube has side 9 cm. What is its volume?","o":["27 cm³","81 cm³","243 cm³","729 cm³"],"a":3,"e":"Volume = 9³ = 729 cm³.","v":"volume-cube-cuboid"},{"d":"BASIC","q":"A box is 7 cm long, 4 cm wide and 5 cm high. Find its capacity in cubic centimetres.","o":["16 cm³","35 cm³","140 cm³","280 cm³"],"a":2,"e":"Capacity equals the volume: 7 × 4 × 5 = 140 cm³.","v":"volume-cube-cuboid"},{"d":"BASIC","q":"How many 1 cm³ cubes fit into a cuboid of dimensions 6 cm × 3 cm × 2 cm?","o":["11","18","36","72"],"a":2,"e":"The cuboid holds 6 × 3 × 2 = 36 unit cubes.","v":"volume-cube-cuboid"},{"d":"BASIC","q":"If the side of a cube doubles, its volume becomes:","o":["2 times","4 times","6 times","8 times"],"a":3,"e":"Volume depends on the cube of the side; doubling gives 2³ = 8 times.","v":"volume-cube-cuboid"},{"d":"BASIC","q":"If all three dimensions of a cuboid are doubled, its volume becomes:","o":["2 times","4 times","6 times","8 times"],"a":3,"e":"The new volume is 2 × 2 × 2 = 8 times the original.","v":"volume-cube-cuboid"},{"d":"MEDIUM","q":"A cube has volume 1000 cm³. Find its side.","o":["10 cm","20 cm","100 cm","5 cm"],"a":0,"e":"The cube root of 1000 is 10.","v":"volume-cube-cuboid"},{"d":"MEDIUM","q":"Find the volume of a cube with side 2.5 cm.","o":["6.25 cm³","12.5 cm³","15.625 cm³","25 cm³"],"a":2,"e":"Volume = 2.5³ = 15.625 cm³.","v":"volume-cube-cuboid"},{"d":"MEDIUM","q":"A cuboid has volume 240 cm³ and base area 40 cm². Find its height.","o":["4 cm","5 cm","6 cm","8 cm"],"a":2,"e":"Height = volume ÷ base area = 240 ÷ 40 = 6 cm.","v":"volume-cube-cuboid"},{"d":"MEDIUM","q":"A tank is 2 m long, 1.5 m wide and 1 m deep. What is its volume?","o":["3 m³","4.5 m³","5 m³","6 m³"],"a":0,"e":"Volume = 2 × 1.5 × 1 = 3 m³.","v":"volume-cube-cuboid"},{"d":"MEDIUM","q":"Convert 2 m³ to cm³.","o":["2,000 cm³","20,000 cm³","200,000 cm³","2,000,000 cm³"],"a":3,"e":"1 m³ = 100³ cm³ = 1,000,000 cm³, so 2 m³ = 2,000,000 cm³.","v":"volume-cube-cuboid"},{"d":"MEDIUM","q":"Convert 5000 cm³ to litres.","o":["0.5 L","5 L","50 L","500 L"],"a":1,"e":"1000 cm³ = 1 L, so 5000 cm³ = 5 L.","v":"volume-cube-cuboid"},{"d":"MEDIUM","q":"A cube has volume 512 cm³. Find its side.","o":["6 cm","7 cm","8 cm","9 cm"],"a":2,"e":"8³ = 512, so the side is 8 cm.","v":"volume-cube-cuboid"},{"d":"MEDIUM","q":"The volume of a cuboid is 360 cm³. If its length is 12 cm and height is 5 cm, find its breadth.","o":["4 cm","5 cm","6 cm","8 cm"],"a":2,"e":"Breadth = 360 ÷ (12 × 5) = 6 cm.","v":"volume-cube-cuboid"},{"d":"MEDIUM","q":"A rectangular room is 5 m long, 4 m wide and 3 m high. Find its volume.","o":["12 m³","20 m³","60 m³","120 m³"],"a":2,"e":"Volume = 5 × 4 × 3 = 60 m³.","v":"volume-cube-cuboid"},{"d":"MEDIUM","q":"A cube has side 6 cm. What is the volume of 3 such cubes altogether?","o":["108 cm³","216 cm³","648 cm³","729 cm³"],"a":2,"e":"One cube has volume 6³ = 216 cm³; three have 3 × 216 = 648 cm³.","v":"volume-cube-cuboid"},{"d":"HARD","q":"A cuboid has dimensions 9 cm × 4 cm × 4 cm. Find its volume.","o":["17 cm³","36 cm³","144 cm³","288 cm³"],"a":2,"e":"Volume = 9 × 4 × 4 = 144 cm³.","v":"volume-cube-cuboid"},{"d":"HARD","q":"The volume of a cube is 729 cm³. What is its side length?","o":["7 cm","8 cm","9 cm","10 cm"],"a":2,"e":"9³ = 729, so the side length is 9 cm.","v":"volume-cube-cuboid"},{"d":"HARD","q":"A cuboid has base dimensions 8 cm × 6 cm and volume 336 cm³. Find its height.","o":["5 cm","6 cm","7 cm","8 cm"],"a":2,"e":"Base area = 48 cm²; height = 336 ÷ 48 = 7 cm.","v":"volume-cube-cuboid"},{"d":"HARD","q":"A cube of side 3 cm is made from smaller cubes of side 1 cm. How many small cubes are needed?","o":["9","18","27","36"],"a":2,"e":"The number is the volume ratio: 3³ ÷ 1³ = 27.","v":"volume-cube-cuboid"},{"d":"HARD","q":"Find the volume of a cuboid with length 2.5 m, breadth 2 m and height 1.2 m.","o":["5 m³","6 m³","7.2 m³","12 m³"],"a":1,"e":"Volume = 2.5 × 2 × 1.2 = 6 m³.","v":"volume-cube-cuboid"},{"d":"HARD","q":"A cube's side increases from 2 cm to 4 cm. How much does its volume increase by?","o":["8 cm³","16 cm³","32 cm³","56 cm³"],"a":3,"e":"Old volume = 8 cm³; new volume = 64 cm³; increase = 64 − 8 = 56 cm³.","v":"volume-cube-cuboid"},{"d":"HARD","q":"A cuboid has volume 1 m³. How many litres can it hold?","o":["10 L","100 L","1000 L","10,000 L"],"a":2,"e":"1 m³ = 1000 litres.","v":"volume-cube-cuboid"},{"d":"HARD","q":"A water tank is 100 cm long, 50 cm wide and 40 cm high. Find its volume in litres.","o":["20 L","100 L","200 L","2000 L"],"a":2,"e":"Volume = 100 × 50 × 40 = 200,000 cm³ = 200 L.","v":"volume-cube-cuboid"},{"d":"HARD","q":"A cuboid's volume is 504 cm³. Its length and breadth are 9 cm and 7 cm. Find its height.","o":["6 cm","7 cm","8 cm","9 cm"],"a":2,"e":"Height = 504 ÷ (9 × 7) = 8 cm.","v":"volume-cube-cuboid"},{"d":"HARD","q":"A cube has side 11 cm. Find its volume.","o":["121 cm³","331 cm³","1331 cm³","1464 cm³"],"a":2,"e":"Volume = 11³ = 1331 cm³.","v":"volume-cube-cuboid"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Calculate volumes of cubes and cuboids</strong><small>Use length × breadth × height and side³</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Work backwards from volume to dimensions</strong><small>Convert cubic units and litres</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Solve practical volume problems</strong><small>Apply volume formulas accurately</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
