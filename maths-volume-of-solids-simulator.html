<!doctype html><html lang="en"><head>
    <meta name="description" content="Explore the volume of three-dimensional solids interactively by changing dimensions and observing how capacity and volume change."><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="skillup-release" content="20261107-volume-solids-simulator-v1"><title>Volume of Solids · Simulator | SkillUp Maths</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f9fa;color:#263746;font:15px/1.5 system-ui}header{background:#fff;border-bottom:1px solid #e3e9ed}.nav,main{width:min(100% - 24px,680px);margin:auto}.nav{height:50px;display:flex;align-items:center;gap:12px}.nav a{color:#248ac0;text-decoration:none;font-weight:800}.nav b{flex:1}main{padding:18px 6px 40px}h1{font-size:26px;margin:4px 0}.muted{color:#71808d;font-size:13px}.card{background:#fff;border:1px solid #e3e9ed;border-radius:16px;padding:16px;margin:12px 0}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.tabs button{border:1px solid #dce5eb;background:#fff;border-radius:10px;padding:11px;font-weight:800;color:#263746}.tabs button.active{background:#eaf5fb;border-color:#248ac0;color:#236b91}.control{margin:14px 0}.control label{display:flex;justify-content:space-between;font-weight:750;font-size:13px}.control input{width:100%;accent-color:#48b516}.outputs{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.out{background:#f0f8fc;border:1px solid #d8eaf4;border-radius:12px;padding:12px}.out small{display:block;color:#71808d}.out strong{font-size:18px}.formula{background:#f5f8fa;padding:12px;border-radius:10px;margin-top:12px;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.actions a{padding:10px 13px;border-radius:10px;background:#48b516;color:#17350b;text-decoration:none;font-weight:800;font-size:12px}.actions a.secondary{background:#eaf5fb;color:#236b91}</style></head><body><header><div class="nav"><a href="maths-home.html">← Maths</a><b>SkillUp · Simulator</b><a href="maths-volume-of-solids-class9-quiz.html?v=20261107-volume-solids-quiz-v1">Quiz</a></div></header><main><div class="muted">INTERACTIVE MATHS LAB · CLASS 9</div><h1>Volume of Solids</h1><p class="muted">Choose a solid and change its dimensions to see the volume update instantly.</p><section class="card"><div class="tabs" id="tabs"><button data-shape="cube" class="active">Cube</button><button data-shape="cuboid">Cuboid</button><button data-shape="cylinder">Cylinder</button><button data-shape="cone">Cone</button><button data-shape="sphere">Sphere</button></div><div id="controls"></div><div class="outputs"><div class="out"><small>Volume</small><strong id="volume">27 cm³</strong></div><div class="out"><small>Dimensions</small><strong id="dims">3 cm</strong></div></div><div class="formula" id="formula">V = a³</div></section><div class="actions"><a href="maths-volume-of-solids-learn.html?v=20261107-volume-solids-brief-learn-v1">📘 Brief Learn</a><a class="secondary" href="maths-volume-of-solids-class9-quiz.html?v=20261107-volume-solids-quiz-v1">📝 Practise Quiz</a></div></main><script>
const specs={cube:[["Side a",1,20,3]],cuboid:[["Length l",1,20,5],["Breadth b",1,20,4],["Height h",1,20,3]],cylinder:[["Radius r",1,15,3],["Height h",1,30,5]],cone:[["Radius r",1,15,3],["Height h",1,30,8]],sphere:[["Radius r",1,15,3]]};let shape="cube";const $=id=>document.getElementById(id);function build(){const s=specs[shape];$("controls").innerHTML=s.map((x,i)=>'<div class="control"><label><span>'+x[0]+'</span><b id="v'+i+'">'+x[3]+' cm</b></label><input type="range" min="'+x[1]+'" max="'+x[2]+'" value="'+x[3]+'" id="r'+i+'"></div>').join("");s.forEach((x,i)=>$("r"+i).addEventListener("input",calc));calc()}function calc(){const v=specs[shape].map((x,i)=>{const n=+$("r"+i).value;$("v"+i).textContent=n+" cm";return n});let volume,formula,dims=v.join(" × ")+" cm";if(shape==="cube"){volume=v[0]**3;formula="V = a³"}if(shape==="cuboid"){volume=v[0]*v[1]*v[2];formula="V = l × b × h"}if(shape==="cylinder"){volume=Math.PI*v[0]**2*v[1];formula="V = πr²h"}if(shape==="cone"){volume=Math.PI*v[0]**2*v[1]/3;formula="V = ⅓πr²h"}if(shape==="sphere"){volume=4*Math.PI*v[0]**3/3;formula="V = ⁴⁄₃πr³"}$("volume").textContent=volume.toFixed(2)+" cm³";$("dims").textContent=dims;$("formula").textContent=formula+"  ·  π ≈ "+Math.PI.toFixed(4)}$("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-shape]");if(!b)return;shape=b.dataset.shape;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active",x===b));build()});build();</script><script src="/shared-nav.js?v=20261107-maths-quiz-visibility-fix-v1"></script></body></html>
