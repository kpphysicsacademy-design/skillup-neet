<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14233b"><meta name="skillup-release" content="20261012-word-problems-equations-quiz-v2"><title>Word Problems Using Equations | SkillUp Maths</title>
<style>
:root{color-scheme:dark;--bg:#14233b;--panel:#1d304c;--line:#405776;--ink:#f5f8ff;--muted:#b9c9df;--green:#58d6a3;--green2:#a0f1ce;--red:#ff8e9b;--blue:#91b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}.back{color:var(--muted);text-decoration:none;font-size:1.25rem}.brand{font-weight:900;white-space:nowrap}.brand span{color:var(--green)}.progress{height:12px;border-radius:20px;background:#3a4b64;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);border-radius:20px;transition:width .2s}.pill{background:#30445f;padding:5px 9px;border-radius:12px;font-size:.82rem;font-weight:850;white-space:nowrap}.xp{color:var(--green2)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem;margin:0 2px 12px}.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,25px);min-height:410px;display:flex;flex-direction:column}.eyebrow{color:var(--green2);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}.question{font-size:1.2rem;font-weight:800;margin:14px 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#182942;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);padding:13px 15px;font-weight:750;min-height:52px}.choice.selected{border-color:var(--blue);background:#29415f}.choice.correct{border-color:var(--green);background:#174b42}.choice.wrong{border-color:var(--red);background:#512c3b}.choice:disabled{cursor:default}.feedback{display:none;margin-top:14px;padding:12px;border-radius:13px;background:#142139;color:var(--muted)}.feedback.show{display:block}.feedback.good{border:1px solid var(--green);color:var(--green2)}.feedback.bad{border:1px solid var(--red)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:22px}.hint{color:var(--muted);font-size:.8rem}button.primary{font:inherit;font-weight:900;cursor:pointer;border:0;border-bottom:4px solid #29996e;border-radius:14px;background:var(--green);color:#10263a;padding:12px 20px;min-width:140px}button.primary:disabled{opacity:.45;cursor:not-allowed}.end{text-align:center}.score{font-size:2.5rem;color:var(--green2);font-weight:950}.summary{background:#142139;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0}@media(max-width:420px){.wrap{padding:11px}.card{min-height:400px;padding:16px}.brand{font-size:.9rem}.pill{font-size:.74rem;padding:5px 7px}.actions button{flex:1}}
 .skill-panel{margin:14px 0 22px;padding:15px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.skill-title{font-weight:900;margin-bottom:10px}.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.skill-item{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#13223a;color:var(--muted);font-size:.9rem}.skill-item:before{content:"✦";color:var(--green);margin-right:8px}.skills-result{margin-top:14px;text-align:left}.skills-result h3{margin:0 0 8px;font-size:1rem}.skills-result .skill-item{margin-top:7px}.skill-item.unlocked{border-color:var(--green);color:var(--green2);background:#174b42} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}.diagram .accent{stroke:#58d6a3}.diagram .blue{stroke:#91b7ff}.diagram .gold{stroke:#ffd27a} .diagram{margin:4px 0 16px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#13223a;display:flex;justify-content:center;align-items:center;min-height:120px}.diagram svg{width:100%;max-width:330px;height:auto;max-height:180px}.diagram text{font-family:system-ui,sans-serif;font-size:13px;fill:#f5f8ff}</style></head><body><div class="wrap"><header class="top"><a class="back" href="maths-home.html?v=20261012-iit-foundation-path-v1" aria-label="Back to Maths path">←</a><div class="brand">SkillUp <span>Maths</span></div><div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar" id="bar"></div></div><div class="pill" id="hearts">❤️ 5</div><div class="pill xp" id="xp">⭐ 0 XP</div></header><div class="meta"><span id="counter">QUESTION 1 OF 30</span><span>🟢 Basic → 🟡 Medium → 🔴 Hard</span></div><main><section class="card" aria-live="polite"><div class="eyebrow" id="eyebrow">Equations</div><div id="content"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="hint" id="hint">30 questions · One at a time</span><button class="primary" id="action" type="button">Check answer</button></div></section></main><section class="skill-panel" aria-label="Equation Skills"><div class="skill-title">🎯 Word Problem Skills</div><div class="skill-list"><div class="skill-item">Translate words into equations</div><div class="skill-item">Solve one-step and multi-step equations</div><div class="skill-item">Model real-life problems</div></div></section></div>
<script>(function(){'use strict';const questions=[{"d":"BASIC","q":"A number plus 7 equals 19. Find the number.","o":["10","12","26","7"],"a":1,"e":"x + 7 = 19, so x = 12.","v":"word-problems-equations"},{"d":"BASIC","q":"Ravi has x marbles and gets 5 more. He now has 14. Which equation fits?","o":["x − 5 = 14","5x = 14","x + 5 = 14","x ÷ 5 = 14"],"a":2,"e":"Getting 5 more means x + 5 = 14.","v":"word-problems-equations"},{"d":"BASIC","q":"Three pencils cost ₹30. What is the cost of one pencil?","o":["₹3","₹10","₹27","₹90"],"a":1,"e":"3x = 30, so x = ₹10.","v":"word-problems-equations"},{"d":"BASIC","q":"A number decreased by 8 is 15. Find the number.","o":["7","23","120","17"],"a":1,"e":"x − 8 = 15, so x = 23.","v":"word-problems-equations"},{"d":"BASIC","q":"Four equal packets contain 28 biscuits. How many per packet?","o":["6","7","24","32"],"a":1,"e":"4x = 28, so x = 7.","v":"word-problems-equations"},{"d":"BASIC","q":"A number divided by 6 gives 4. Find the number.","o":["10","2","24","36"],"a":2,"e":"x ÷ 6 = 4, so x = 24.","v":"word-problems-equations"},{"d":"BASIC","q":"Maya will be 15 in 3 years. How old is she now?","o":["12","18","5","3"],"a":0,"e":"x + 3 = 15, so x = 12.","v":"word-problems-equations"},{"d":"BASIC","q":"An item is paid for with ₹50 and ₹12 change is returned. What did it cost?","o":["₹12","₹38","₹50","₹62"],"a":1,"e":"50 − x = 12, so x = ₹38.","v":"word-problems-equations"},{"d":"BASIC","q":"Two notebooks and a ₹10 pen cost ₹50. What is one notebook's price?","o":["₹10","₹20","₹30","₹40"],"a":1,"e":"2x + 10 = 50, so x = ₹20.","v":"word-problems-equations"},{"d":"BASIC","q":"A rope is cut by 4 m and 9 m remains. How long was it?","o":["5 m","13 m","36 m","9 m"],"a":1,"e":"x − 4 = 9, so x = 13 m.","v":"word-problems-equations"},{"d":"MEDIUM","q":"A number doubled and increased by 6 equals 24. Find it.","o":["6","9","15","18"],"a":1,"e":"2x + 6 = 24, so x = 9.","v":"word-problems-equations"},{"d":"MEDIUM","q":"Three toys and a ₹5 fee cost ₹41. What is one toy's cost?","o":["₹10","₹12","₹15","₹18"],"a":1,"e":"3x + 5 = 41, so x = ₹12.","v":"word-problems-equations"},{"d":"MEDIUM","q":"A taxi charges ₹40 plus ₹12 per kilometre. Fare is ₹100. How far?","o":["3 km","5 km","6 km","8 km"],"a":1,"e":"40 + 12x = 100, so x = 5 km.","v":"word-problems-equations"},{"d":"MEDIUM","q":"Two consecutive integers sum to 31. What is the smaller?","o":["14","15","16","17"],"a":1,"e":"x + (x + 1) = 31, so x = 15.","v":"word-problems-equations"},{"d":"MEDIUM","q":"A rectangle is 4 cm longer than its width. Perimeter is 28 cm. Find width.","o":["4 cm","5 cm","6 cm","10 cm"],"a":1,"e":"2w + 2(w + 4) = 28, so w = 5 cm.","v":"word-problems-equations"},{"d":"MEDIUM","q":"One-third of a number plus 5 equals 11. Find it.","o":["2","18","33","48"],"a":1,"e":"x/3 + 5 = 11, so x = 18.","v":"word-problems-equations"},{"d":"MEDIUM","q":"Seven equal boxes weigh 35 kg. What is each box's mass?","o":["5 kg","7 kg","28 kg","42 kg"],"a":0,"e":"7x = 35, so each weighs 5 kg.","v":"word-problems-equations"},{"d":"MEDIUM","q":"After spending ₹75, Anil has ₹125 left. How much did he start with?","o":["₹50","₹200","₹125","₹300"],"a":1,"e":"x − 75 = 125, so x = ₹200.","v":"word-problems-equations"},{"d":"MEDIUM","q":"There are 6 more girls than boys in a class of 30. How many boys?","o":["12","18","24","6"],"a":0,"e":"b + (b + 6) = 30, so b = 12.","v":"word-problems-equations"},{"d":"MEDIUM","q":"Five times a number is 17 more than three times it. Find it.","o":["7","8.5","17","34"],"a":1,"e":"5x = 3x + 17, so x = 8.5.","v":"word-problems-equations"},{"d":"HARD","q":"A mother is three times her child's age. Their ages sum to 48. Child's age?","o":["12","16","24","36"],"a":0,"e":"x + 3x = 48, so x = 12.","v":"word-problems-equations"},{"d":"HARD","q":"A bag costs ₹20 less after a discount. Customer pays ₹180. Original price?","o":["₹160","₹180","₹200","₹360"],"a":2,"e":"x − 20 = 180, so x = ₹200.","v":"word-problems-equations"},{"d":"HARD","q":"A square's perimeter is 52 cm. Find one side.","o":["12 cm","13 cm","26 cm","208 cm"],"a":1,"e":"4x = 52, so x = 13 cm.","v":"word-problems-equations"},{"d":"HARD","q":"Three consecutive integers total 72. Find the middle integer.","o":["22","23","24","25"],"a":2,"e":"(n−1) + n + (n+1) = 72, so n = 24.","v":"word-problems-equations"},{"d":"HARD","q":"A tank holds 65 L after 18 L is added. How much was in it first?","o":["47 L","83 L","53 L","18 L"],"a":0,"e":"x + 18 = 65, so x = 47 L.","v":"word-problems-equations"},{"d":"HARD","q":"Four pens cost ₹88 altogether. What is the cost per pen?","o":["₹18","₹22","₹25","₹28"],"a":1,"e":"4x = 88, so x = ₹22.","v":"word-problems-equations"},{"d":"HARD","q":"Four times a number minus 9 equals 31. Find it.","o":["5","8","10","40"],"a":2,"e":"4x − 9 = 31, so x = 10.","v":"word-problems-equations"},{"d":"HARD","q":"A child ticket costs x. Two adult tickets cost x + ₹200 each. Total is ₹550. Child ticket price?","o":["₹50","₹100","₹150","₹250"],"a":0,"e":"2(x + 200) + x = 550, so x = ₹50.","v":"word-problems-equations"},{"d":"HARD","q":"A number plus half itself equals 45. Find the number.","o":["15","30","40","90"],"a":1,"e":"x + x/2 = 45, so x = 30.","v":"word-problems-equations"},{"d":"HARD","q":"A cyclist covers 45 km in 3 hours at a constant speed. Find the speed.","o":["12 km/h","15 km/h","18 km/h","135 km/h"],"a":1,"e":"3x = 45, so x = 15 km/h.","v":"word-problems-equations"}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}const visuals={
balance:'',
blocks:'',
bars:'',
picture:''
};function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div>'+(q.v&&visuals[q.v]?'':'')+'<div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🔢</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><div class="skills-result"><h3>🎯 Skills unlocked</h3>'+'<div class="skill-item '+(correct>=8?'unlocked':'')+'">'+(correct>=8?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Translate words into equations</div>'+'<div class="skill-item '+(correct>=18?'unlocked':'')+'">'+(correct>=18?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Solve one-step and multi-step equations</div>'+'<div class="skill-item '+(correct>=24?'unlocked':'')+'">'+(correct>=24?'✓ Skill unlocked · ':'🔒 Keep practising · ')+'Model real-life problems</div>'+'</div></div>' ;$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){index=0;selected=-1;locked=false;finished=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished||index>=questions.length){restart();return;}act();});render();})();</script></body></html>
