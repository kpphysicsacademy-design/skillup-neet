<script>
(function(){
'use strict';
const questions=[{"d":"BASIC","q":"What is a zero of a polynomial p(x)?","o":["A value of x for which p(x)=0","The leading coefficient","The degree of p(x)","The constant term only"],"a":0,"why":"A zero is an input value that makes the polynomial's value equal to zero."},{"d":"BASIC","q":"If p(x)=x−4, what is its zero?","o":["−4","0","4","1"],"a":2,"why":"Set x−4=0, so x=4."},{"d":"BASIC","q":"Which number is a zero of p(x)=x+3?","o":["3","−3","0","1"],"a":1,"why":"Solve x+3=0 to get x=−3."},{"d":"BASIC","q":"Is x=2 a zero of p(x)=x²−4?","o":["Yes","No","Only if x=−2","Cannot tell"],"a":0,"why":"p(2)=2²−4=0, so 2 is a zero."},{"d":"BASIC","q":"For p(x)=x²−9, which is a zero?","o":["1","2","3","4"],"a":2,"why":"p(3)=9−9=0, so 3 is a zero. (−3 is also a zero.)"},{"d":"BASIC","q":"What is p(0) for p(x)=2x+5?","o":["0","2","5","7"],"a":2,"why":"Substituting x=0 gives p(0)=5."},{"d":"BASIC","q":"Which expression equals zero when x=1?","o":["x+1","x−1","x+2","2x+1"],"a":1,"why":"At x=1, x−1=0."},{"d":"BASIC","q":"If p(3)=0, what can we say about 3?","o":["3 is the degree","3 is a zero of p(x)","The constant term is 3","p(x) has no zeros"],"a":1,"why":"A value c with p(c)=0 is called a zero of the polynomial."},{"d":"BASIC","q":"How many distinct real zeros does p(x)=x−7 have?","o":["0","1","2","3"],"a":1,"why":"A non-constant linear polynomial has exactly one real zero."},{"d":"BASIC","q":"Which is a zero of p(x)=x²−1?","o":["0","1","2","3"],"a":1,"why":"p(1)=1−1=0; −1 is also a zero."},{"d":"MEDIUM","q":"Find the zero of p(x)=3x−12.","o":["−4","0","3","4"],"a":3,"why":"Set 3x−12=0, so x=4."},{"d":"MEDIUM","q":"Which are the zeros of p(x)=x²−5x+6?","o":["1 and 6","2 and 3","−2 and −3","0 and 6"],"a":1,"why":"Factor x²−5x+6=(x−2)(x−3), so the zeros are 2 and 3."},{"d":"MEDIUM","q":"If p(x)=x²+2x, what are its zeros?","o":["0 and −2","0 and 2","1 and −2","2 and 2"],"a":0,"why":"Factor p(x)=x(x+2), giving zeros 0 and −2."},{"d":"MEDIUM","q":"Find p(−2) for p(x)=x²−3x+1.","o":["−1","3","11","7"],"a":2,"why":"p(−2)=4+6+1=11."},{"d":"MEDIUM","q":"If x=−1 is a zero of p(x)=x²+kx−2, find k.","o":["−4","−1","−3","3"],"a":1,"why":"Substitute −1: 1−k−2=0, so −k−1=0 and k=−1."},{"d":"MEDIUM","q":"Which polynomial has zero x=5?","o":["x+5","x−5","5x+1","x²+5"],"a":1,"why":"Substituting x=5 into x−5 gives zero."},{"d":"MEDIUM","q":"For p(x)=2x²−8, which values are zeros?","o":["0 and 2","−2 and 2","−4 and 4","1 and 8"],"a":1,"why":"2x²−8=0 gives x²=4, so x=±2."},{"d":"MEDIUM","q":"If p(x)=x²−4x+4, what is its zero?","o":["−2 only","2 only","−2 and 2","4 only"],"a":1,"why":"p(x)=(x−2)², so the repeated zero is 2."},{"d":"MEDIUM","q":"If p(x)=x²−9, what is p(−3)?","o":["−18","0","9","18"],"a":1,"why":"p(−3)=9−9=0."},{"d":"MEDIUM","q":"Which value is NOT a zero of p(x)=x²−4?","o":["−2","2","4","Both −2 and 2 are zeros"],"a":2,"why":"p(4)=16−4=12, not zero."},{"d":"HARD","q":"Find the zeros of p(x)=2x²−7x+3.","o":["3 and 1/2","−3 and −1/2","1 and 3","2 and 3"],"a":0,"why":"Factor 2x²−7x+3=(2x−1)(x−3), giving 1/2 and 3."},{"d":"HARD","q":"If p(x)=x²−kx+12 has zero 3, find k.","o":["4","5","7","9"],"a":2,"why":"p(3)=9−3k+12=0 gives 21=3k, so k=7."},{"d":"HARD","q":"If p(x)=x²+ax+6 has zero −2, find a.","o":["−5","−1","1","5"],"a":3,"why":"p(−2)=4−2a+6=0 gives 10=2a, so a=5."},{"d":"HARD","q":"The zeros of p(x)=x²−2x−8 are:","o":["−4 and 2","4 and −2","−2 and −4","2 and 4"],"a":1,"why":"Factor as (x−4)(x+2), so zeros are 4 and −2."},{"d":"HARD","q":"If 2 is a zero of p(x)=x²−5x+c, find c.","o":["2","4","6","8"],"a":2,"why":"p(2)=4−10+c=0, so c=6."},{"d":"HARD","q":"How many distinct real zeros does p(x)=(x−1)² have?","o":["0","1","2","3"],"a":1,"why":"The only distinct zero is x=1, though it is repeated."},{"d":"HARD","q":"If p(x)=x²−1, what is p(−1)+p(1)?","o":["−2","0","1","2"],"a":1,"why":"Both p(−1) and p(1) equal zero, so the sum is zero."},{"d":"HARD","q":"A polynomial p(x) satisfies p(0)=0. Which statement must be true?","o":["Its degree is zero","0 is a zero of p(x)","Its leading coefficient is zero","It has exactly two zeros"],"a":1,"why":"By definition, p(0)=0 means x=0 is a zero."},{"d":"HARD","q":"For p(x)=x²−6x+9, what is p(3)?","o":["0","3","9","18"],"a":0,"why":"p(3)=9−18+9=0."},{"d":"HARD","q":"If p(x)=x²−4x+3, which pair are its zeros?","o":["−1 and −3","1 and 3","−1 and 3","0 and 3"],"a":1,"why":"Factor x²−4x+3=(x−1)(x−3), so the zeros are 1 and 3."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',String(Math.round(index/questions.length*100)));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=text;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.why;}
 else{streak=0;$('streak').textContent='0';wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.why});buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.why+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow','100');
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Zeros of Polynomials Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry">Practice all questions again</button><br><a href="maths-home.html?v=20261106-maths-header-v6" style="display:inline-block;margin-top:18px;color:#087eb8;font-weight:850">← Back to Maths Path</a>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
  review.innerHTML='<h3>🧠 Review your mistakes</h3>';
  wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your-answer';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-answer';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No mistakes to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function reset(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>reset(false));
 $('retryWrong').addEventListener('click',()=>reset(true));
});
render();
})();
</script>
