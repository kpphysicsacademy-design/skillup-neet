(function(){'use strict';const questions=[{"d":"BASIC","q":"What is a zero of a polynomial p(x)?","o":["A value of x for which p(x)=0","The leading coefficient","The degree of p(x)","The constant term only"],"a":0,"e":"A zero is an input value that makes the polynomial's value equal to zero."},{"d":"BASIC","q":"If p(x)=x−4, what is its zero?","o":["−4","0","4","1"],"a":2,"e":"Set x−4=0, so x=4."},{"d":"BASIC","q":"Which number is a zero of p(x)=x+3?","o":["3","−3","0","1"],"a":1,"e":"Solve x+3=0 to get x=−3."},{"d":"BASIC","q":"Is x=2 a zero of p(x)=x²−4?","o":["Yes","No","Only if x=−2","Cannot tell"],"a":0,"e":"p(2)=2²−4=0, so 2 is a zero."},{"d":"BASIC","q":"For p(x)=x²−9, which is a zero?","o":["1","2","3","4"],"a":2,"e":"p(3)=9−9=0, so 3 is a zero. (−3 is also a zero.)"},{"d":"BASIC","q":"What is p(0) for p(x)=2x+5?","o":["0","2","5","7"],"a":2,"e":"Substituting x=0 gives p(0)=5."},{"d":"BASIC","q":"Which expression equals zero when x=1?","o":["x+1","x−1","x+2","2x+1"],"a":1,"e":"At x=1, x−1=0."},{"d":"BASIC","q":"If p(3)=0, what can we say about 3?","o":["3 is the degree","3 is a zero of p(x)","The constant term is 3","p(x) has no zeros"],"a":1,"e":"A value c with p(c)=0 is called a zero of the polynomial."},{"d":"BASIC","q":"How many distinct real zeros does p(x)=x−7 have?","o":["0","1","2","3"],"a":1,"e":"A non-constant linear polynomial has exactly one real zero."},{"d":"BASIC","q":"Which is a zero of p(x)=x²−1?","o":["0","1","2","3"],"a":1,"e":"p(1)=1−1=0; −1 is also a zero."},{"d":"MEDIUM","q":"Find the zero of p(x)=3x−12.","o":["−4","0","3","4"],"a":3,"e":"Set 3x−12=0, so x=4."},{"d":"MEDIUM","q":"Which are the zeros of p(x)=x²−5x+6?","o":["1 and 6","2 and 3","−2 and −3","0 and 6"],"a":1,"e":"Factor x²−5x+6=(x−2)(x−3), so the zeros are 2 and 3."},{"d":"MEDIUM","q":"If p(x)=x²+2x, what are its zeros?","o":["0 and −2","0 and 2","1 and −2","2 and 2"],"a":0,"e":"Factor p(x)=x(x+2), giving zeros 0 and −2."},{"d":"MEDIUM","q":"Find p(−2) for p(x)=x²−3x+1.","o":["−1","3","11","7"],"a":2,"e":"p(−2)=4+6+1=11."},{"d":"MEDIUM","q":"If x=−1 is a zero of p(x)=x²+kx−2, find k.","o":["−4","−1","−3","3"],"a":1,"e":"Substitute −1: 1−k−2=0, so −k−1=0 and k=−1."},{"d":"MEDIUM","q":"Which polynomial has zero x=5?","o":["x+5","x−5","5x+1","x²+5"],"a":1,"e":"Substituting x=5 into x−5 gives zero."},{"d":"MEDIUM","q":"For p(x)=2x²−8, which values are zeros?","o":["0 and 2","−2 and 2","−4 and 4","1 and 8"],"a":1,"e":"2x²−8=0 gives x²=4, so x=±2."},{"d":"MEDIUM","q":"If p(x)=x²−4x+4, what is its zero?","o":["−2 only","2 only","−2 and 2","4 only"],"a":1,"e":"p(x)=(x−2)², so the repeated zero is 2."},{"d":"MEDIUM","q":"If p(x)=x²−9, what is p(−3)?","o":["−18","0","9","18"],"a":1,"e":"p(−3)=9−9=0."},{"d":"MEDIUM","q":"Which value is NOT a zero of p(x)=x²−4?","o":["−2","2","4","Both −2 and 2 are zeros"],"a":2,"e":"p(4)=16−4=12, not zero."},{"d":"HARD","q":"Find the zeros of p(x)=2x²−7x+3.","o":["3 and 1/2","−3 and −1/2","1 and 3","2 and 3"],"a":0,"e":"Factor 2x²−7x+3=(2x−1)(x−3), giving 1/2 and 3."},{"d":"HARD","q":"If p(x)=x²−kx+12 has zero 3, find k.","o":["4","5","7","9"],"a":2,"e":"p(3)=9−3k+12=0 gives 21=3k, so k=7."},{"d":"HARD","q":"If p(x)=x²+ax+6 has zero −2, find a.","o":["−5","−1","1","5"],"a":3,"e":"p(−2)=4−2a+6=0 gives 10=2a, so a=5."},{"d":"HARD","q":"The zeros of p(x)=x²−2x−8 are:","o":["−4 and 2","4 and −2","−2 and −4","2 and 4"],"a":1,"e":"Factor as (x−4)(x+2), so zeros are 4 and −2."},{"d":"HARD","q":"If 2 is a zero of p(x)=x²−5x+c, find c.","o":["2","4","6","8"],"a":2,"e":"p(2)=4−10+c=0, so c=6."},{"d":"HARD","q":"How many distinct real zeros does p(x)=(x−1)² have?","o":["0","1","2","3"],"a":1,"e":"The only distinct zero is x=1, though it is repeated."},{"d":"HARD","q":"If p(x)=x²−1, what is p(−1)+p(1)?","o":["−2","0","1","2"],"a":1,"e":"Both p(−1) and p(1) equal zero, so the sum is zero."},{"d":"HARD","q":"A polynomial p(x) satisfies p(0)=0. Which statement must be true?","o":["Its degree is zero","0 is a zero of p(x)","Its leading coefficient is zero","It has exactly two zeros"],"a":1,"e":"By definition, p(0)=0 means x=0 is a zero."},{"d":"HARD","q":"For p(x)=x²−6x+9, what is p(3)?","o":["0","3","9","18"],"a":0,"e":"p(3)=9−18+9=0."},{"d":"HARD","q":"If p(x)=x²−4x+3, which pair are its zeros?","o":["−1 and −3","1 and 3","−1 and 3","0 and 3"],"a":1,"e":"Factor x²−4x+3=(x−1)(x−3), so the zeros are 1 and 3."}];let index=0,selected=-1,locked=false,finished=false,xp=0,hearts=5,correct=0;const $=id=>document.getElementById(id),bar=$('bar'),progress=document.querySelector('[role="progressbar"]');function updateProgress(){const p=index/questions.length*100;bar.style.width=p+'%';progress.setAttribute('aria-valuenow',String(Math.round(p)));}function render(){const q=questions[index];selected=-1;locked=false;$('counter').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('eyebrow').textContent=(q.d==='BASIC'?'🟢 BASIC':q.d==='MEDIUM'?'🟡 MEDIUM':'🔴 HARD')+' · QUESTION '+(index+1);$('hint').textContent='Choose one answer';$('feedback').className='feedback';$('feedback').textContent='';$('content').innerHTML='<div class="question">'+q.q+'</div><div class="choices">'+q.o.map((v,i)=>'<button type="button" class="choice" data-i="'+i+'">'+v+'</button>').join('')+'</div>';$('content').querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected=Number(b.dataset.i);$('content').querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('selected',j===selected));$('action').disabled=false;}));$('action').textContent='Check answer';$('action').disabled=true;updateProgress();}function act(){const q=questions[index];if(!locked){if(selected<0)return;locked=true;const good=selected===q.a;if(good){correct++;xp+=10;$('xp').textContent='⭐ '+xp+' XP';}else{hearts=Math.max(0,hearts-1);$('hearts').textContent='❤️ '+hearts;}$('content').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===selected)b.classList.add('wrong');});$('feedback').textContent=(good?'✨ Correct! ':'💡 Learn from this: ')+q.e;$('feedback').className='feedback show '+(good?'good':'bad');$('hint').textContent=good?'+10 XP':'Keep practising';$('action').textContent=index===questions.length-1?'See results →':'Continue →';return;}if(index<questions.length-1){index++;render();return;}results();}function results(){finished=true;$('bar').style.width='100%';progress.setAttribute('aria-valuenow','100');$('counter').textContent='QUIZ COMPLETE';$('eyebrow').textContent='Practice complete';$('hint').textContent='You can retry anytime';$('feedback').className='feedback';$('content').innerHTML='<div class="end"><div style="font-size:3.2rem">🏆</div><h1>'+(correct>=24?'Amazing work!':correct>=15?'Nice progress!':'Keep practising!')+'</h1><div class="score">'+correct+' / '+questions.length+'</div><p>You answered '+correct+' questions correctly.</p><div class="summary">⭐ '+xp+' XP earned<br>❤️ '+hearts+' hearts remaining</div><h2>Skills practised</h2><div class="skills"><div class="skill"><span class="skill-icon">🔢</span><div><strong>Find zeros of polynomials</strong><small>Evaluate polynomials and test zeros</small></div></div><div class="skill"><span class="skill-icon">↔️</span><div><strong>Solve linear and quadratic polynomial equations</strong><small>Factor polynomials to find zeros</small></div></div><div class="skill"><span class="skill-icon">➕</span><div><strong>Use substitution to test zeros</strong><small>Solve polynomial zero problems</small></div></div></div></div>';$('action').textContent='Try again ↻';$('action').disabled=false;index=questions.length;}function restart(){finished=false;index=0;selected=-1;locked=false;xp=0;hearts=5;correct=0;$('xp').textContent='⭐ 0 XP';$('hearts').textContent='❤️ 5';render();}$('action').addEventListener('click',()=>{if(finished){restart();return;}act();});render();})();
</script>
