    <meta name="description" content="Explore polynomial zeros with an interactive tool that helps investigate roots and the points where polynomial graphs meet the x-axis."><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="skillup-release" content="20261107-zeros-of-polynomials-simulator-v1"><title>Zeros of Polynomials — Interactive Simulator | SkillUp Maths</title><style>:root{--blue:#1686b8;--green:#4cae19;--ink:#253746;--line:#e1e9ed}*{box-sizing:border-box}body{margin:0;background:#f7f9fb;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:white;border-bottom:1px solid var(--line);position:sticky;top:0}.top,main{max-width:660px;margin:auto}.top{padding:12px 14px;display:flex;gap:10px;align-items:center}.top a{color:var(--blue);text-decoration:none;font-weight:750}.top strong{flex:1}main{padding:18px 13px 36px}h1{font-size:25px;margin:0 0 6px}h2{font-size:18px;margin:0 0 10px}p{line-height:1.55}.muted{color:#667987;font-size:14px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;margin:14px 0}.formula{background:#eff8ff;border-radius:9px;padding:12px;font-weight:750;overflow-wrap:anywhere}.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.links a{display:block;text-align:center;text-decoration:none;background:#eaf7ff;color:#116b96;padding:12px 4px;border-radius:10px;font-weight:800;font-size:13px;border:1px solid #b8deed}label{display:block;font-weight:750;margin:12px 0 5px}input{width:100%;accent-color:var(--blue)}button{background:var(--green);color:white;border:0;border-radius:9px;padding:11px 14px;font-weight:800;margin:4px}.result{background:#eef8eb;border:1px solid #cce7bf;border-radius:10px;padding:13px;margin-top:14px;line-height:1.6}svg{width:100%;height:auto;background:#fbfdff;border:1px solid var(--line);border-radius:12px}ul,ol{padding-left:21px;line-height:1.65}@media(max-width:420px){h1{font-size:22px}.card{padding:14px}}</style></head><body><header><div class="top"><a href="maths-zeros-of-polynomials-quiz.html?v=20261107-zeros-of-polynomials-connected-v2">← Quiz</a><strong>SkillUp Maths</strong><span>Class 9</span></div></header><main><h1>Zeros of Polynomials Simulator</h1><p class="muted">Adjust a quadratic, inspect its graph, and test candidate zeros.</p><div class="links"><a href="maths-zeros-of-polynomials-learn.html?v=20261107-zeros-of-polynomials-brief-learn-v1">📘 Brief Learn</a><a href="maths-zeros-of-polynomials-quiz.html?v=20261107-zeros-of-polynomials-connected-v2">📝 Practice Quiz</a></div><section class="card"><h2>Polynomial controls</h2><p class="muted">p(x) = ax² + bx + c</p><label for="a">Coefficient a: <span id="av"></span></label><input id="a" type="range" min="-4" max="4" value="1"><label for="b">Coefficient b: <span id="bv"></span></label><input id="b" type="range" min="-12" max="12" value="-5"><label for="c">Constant c: <span id="cv"></span></label><input id="c" type="range" min="-12" max="12" value="6"><label for="t">Test value t: <span id="tv"></span></label><input id="t" type="range" min="-12" max="12" value="2"><div class="result" id="result" aria-live="polite"></div></section><section class="card"><h2>Graph y = p(x)</h2><svg viewBox="0 0 580 300" role="img" aria-label="Quadratic graph and test point"><line x1="20" y1="150" x2="560" y2="150" stroke="#9baeba"/><line x1="290" y1="10" x2="290" y2="290" stroke="#9baeba"/><path id="curve" fill="none" stroke="#1686b8" stroke-width="3"/><line id="testLine" y1="10" y2="290" stroke="#e05c38" stroke-dasharray="5 4"/><circle id="testPoint" r="6" fill="#e05c38"/><text id="graphLabel" x="10" y="18" font-size="13" fill="#263746"></text></svg><p class="muted">Real zeros are the x-axis intersections.</p></section><section class="card"><h2>Presets</h2><button id="preset1" type="button">Two real zeros</button><button id="preset2" type="button">Repeated zero</button><button id="preset3" type="button">No real zeros</button></section><script>(function(){const ids=['a','b','c','t'],e=Object.fromEntries(ids.map(k=>[k,document.getElementById(k)]));const f=(x,v)=>v.a*x*x+v.b*x+v.c;function update(){const v=Object.fromEntries(ids.map(k=>[k,Number(e[k].value)]));ids.forEach(k=>document.getElementById(k+'v').textContent=v[k]);const val=f(v.t,v),disc=v.b*v.b-4*v.a*v.c;let roots;if(v.a===0)roots=v.b===0?(v.c===0?'Every x is a zero.':'No zeros.'):'One zero: '+(-v.c/v.b).toFixed(3);else if(disc<0)roots='No real zeros (discriminant '+disc+').';else if(disc===0)roots='One repeated zero: '+(-v.b/(2*v.a)).toFixed(3);else roots='Two real zeros: '+((-v.b-Math.sqrt(disc))/(2*v.a)).toFixed(3)+' and '+((-v.b+Math.sqrt(disc))/(2*v.a)).toFixed(3);document.getElementById('result').innerHTML='<b>p(x) = '+v.a+'x² + ('+v.b+')x + ('+v.c+')</b><br>p('+v.t+') = '+val+'<br><b>'+(Math.abs(val)<1e-9?'✓ '+v.t+' is a zero.':'✕ '+v.t+' is not a zero.')+'</b><br>'+roots;const vals=[];for(let i=0;i<=240;i++)vals.push(f(-6+i/20,v));const scale=Math.max(1,...vals.map(Math.abs)),y=z=>150-125*z/scale;document.getElementById('curve').setAttribute('d',vals.map((z,i)=>(i?'L':'M')+(20+i*2.25).toFixed(2)+' '+y(z).toFixed(2)).join(' '));const px=290+v.t*45;const line=document.getElementById('testLine');line.setAttribute('x1',px);line.setAttribute('x2',px);document.getElementById('testPoint').setAttribute('cx',px);document.getElementById('testPoint').setAttribute('cy',y(val));document.getElementById('graphLabel').textContent='p('+v.t+') = '+val}ids.forEach(k=>e[k].addEventListener('input',update));function preset(v){ids.forEach((k,i)=>e[k].value=v[i]);update()}document.getElementById('preset1').onclick=()=>preset([1,-5,6,2]);document.getElementById('preset2').onclick=()=>preset([1,-4,4,2]);document.getElementById('preset3').onclick=()=>preset([1,0,4,0]);update()})();</script></main><script src="/shared-nav.js?v=20261106-maths-header-v6"></script></body></html>
