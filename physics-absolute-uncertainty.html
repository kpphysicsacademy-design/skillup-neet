<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Absolute Uncertainty</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;line-height:1.45}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.opt:disabled{cursor:default}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{font-weight:700;color:#e08a00;text-align:center;min-height:24px;line-height:1.5}.explanation{margin-top:14px;padding:12px 14px;border-radius:12px;background:#f1f6ff;font-size:14px;line-height:1.5}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>📏 Absolute Uncertainty</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['What is absolute uncertainty?','The uncertainty expressed in the same units as the measured quantity','The ratio of uncertainty to measured value','The exact value','The instrument range',0,'Absolute uncertainty is expressed in the same unit as the measured quantity.'],['For 5.20 ± 0.05 cm, the absolute uncertainty is:','0.05 cm','5.20 cm','0.01 cm','5.25 cm',0,'The ± value gives the absolute uncertainty.'],['Absolute uncertainty is commonly represented by:','Δx','x/Δx','x²','1/x',0,'Δx denotes the absolute uncertainty in x.'],['For x = 10.0 ± 0.2 m, the central measured value is:','0.2 m','10.0 m','10.2 m','9.8 m',1,'10.0 m is the measured value; 0.2 m is its absolute uncertainty.'],['For 10.0 ± 0.2 m, the measurement range is:','9.8 to 10.2 m','9.0 to 11.0 m','10.0 m only','9.2 to 10.8 m',0,'The range is x − Δx to x + Δx: 9.8 to 10.2 m.'],['If an instrument has least count 1 mm, a simple estimate of absolute uncertainty may be:','1 mm','0.1 mm','25 mm','26 mm',0,'When no other convention is specified, the least count may be used as a simple uncertainty estimate.'],['Absolute uncertainty in a measured length has dimensions of:','Length','No dimensions','Time','Mass',0,'Absolute uncertainty has the same dimensions as the measured quantity.'],['For 2.50 ± 0.02 s, the absolute uncertainty is:','0.02 s','2.50 s','0.01 s','2.52 s',0,'The ± term is the absolute uncertainty.'],['Which measurement has the smaller absolute uncertainty?','20.0 ± 0.5 cm','20.0 ± 0.1 cm','Both','Cannot compare',1,'0.1 cm is smaller than 0.5 cm.'],['In 8.4 ± 0.3 kg, the absolute uncertainty is:','0.3 kg','8.4 kg','0.3','8.7 kg',0,'Absolute uncertainty carries the same unit, kg.'],['For z = A + B, the maximum absolute uncertainty is:','ΔA + ΔB','ΔA − ΔB','ΔAΔB','ΔA/ΔB',0,'For addition, maximum absolute uncertainties are added.'],['For z = A − B, the maximum absolute uncertainty is:','|ΔA − ΔB|','ΔA + ΔB','ΔAΔB','ΔA/ΔB',1,'For subtraction, maximum absolute uncertainties also add.'],['If A = 5.0 ± 0.1 and B = 2.0 ± 0.2, uncertainty in A + B is:','0.1','0.2','0.3','7.0',2,'Δ(A+B) = ΔA + ΔB = 0.1 + 0.2 = 0.3.'],['For a product z = AB, the maximum-error method combines:','Relative/fractional uncertainties','Only absolute values','Only SI units','Only decimal places',0,'For products, fractional uncertainties are added: Δz/z = ΔA/A + ΔB/B.'],['Which best distinguishes absolute and relative uncertainty?','Absolute uncertainty has the same unit as the measurement; relative uncertainty is dimensionless','Both have the same unit','Absolute uncertainty is always a percentage','Relative uncertainty is measured in metres',0,'Absolute uncertainty has units; relative uncertainty is a dimensionless ratio.']];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;$('xp').textContent='';const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide')}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').innerHTML=ok?'✨ Correct! +1 XP':'❌ Incorrect';$('xp').insertAdjacentHTML('beforeend',`<div class="explanation"><b>Correct answer:</b> ${q[q[5]+1]}<br>💡 ${q[6]}</div>`);if(ok)score++;$('score').textContent=`XP ${score}`;$('fill').style.width=`${(i+1)/15*100}%`;$('next').classList.remove('hide')}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><p style="text-align:center">XP earned: <b>${score}</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('next').onclick=next;render();</script></body></html>
