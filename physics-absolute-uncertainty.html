<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Absolute Uncertainty</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.xp{font-weight:800}.card{background:white;border-radius:22px;padding:24px;margin-top:18px;box-shadow:0 5px 20px #00000012}.bar{height:10px;background:#e8eaf0;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.3s}.q{font-size:1.3rem;font-weight:750;line-height:1.45}.opts{display:grid;gap:10px;margin-top:18px}.opts button{padding:15px;border:2px solid #e2e5eb;border-radius:14px;background:white;text-align:left;font-size:1rem;cursor:pointer;transition:.2s}.opts button:hover{border-color:#58cc02;transform:translateY(-1px)}.opts button.selected{border-color:#58cc02;background:#f3fff0}.opts button.correct{border-color:#58cc02;background:#eaffef}.opts button.wrong{border-color:#e5484d;background:#fff0f0}.feedback{font-weight:700;margin-top:16px;min-height:24px}.btn{margin-top:18px;padding:13px 22px;border:0;border-radius:14px;background:#58cc02;color:white;font-weight:800;cursor:pointer;transition:.2s;box-shadow:0 4px 0 #45a800}.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #45a800}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #45a800}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}.back{display:inline-flex;align-items:center;gap:7px;margin-top:20px;padding:12px 18px;border:2px solid #5146a5;border-radius:14px;background:white;color:#5146a5;font-weight:800;text-decoration:none;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,background .2s,color .2s}.back:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#eeeaff,transparent);transform:translateX(-120%);transition:transform .5s}.back:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 6px 18px #5146a533;background:#faf9ff;color:#40378d}.back:hover:before{transform:translateX(120%)}.back:active{transform:translateY(1px) scale(.99);box-shadow:0 2px 8px #5146a522}.back:focus-visible{outline:3px solid #c9c3ff;outline-offset:3px}@media(max-width:600px){.wrap{padding:18px 12px}.card{padding:18px}.q{font-size:1.15rem}.top{align-items:flex-start}.back{width:max-content}}</style></head><body><main class="wrap"><div class="top"><h1>📏 Absolute Uncertainty</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></div><p>Master absolute uncertainty, measurement ranges and uncertainty propagation with 15 NEET-style questions.</p><section class="card"><div><strong>🎯 Skill Mastery</strong> <span id="masteryText">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div id="count"></div><p id="question" class="q"></p><div id="options" class="opts"></div><button id="check" class="btn" disabled>Check Answer</button><button id="next" class="btn" disabled>Continue →</button><div id="feedback" class="feedback"></div><p>💡 <span id="hint">Choose the best answer.</span></p><div id="result" style="display:none;text-align:center"><h2>🎉 Absolute Uncertainty mastered!</h2><p id="score"></p><button id="retry" class="btn">Retry Skill</button></div></section><a class="back" href="physics-home.html" aria-label="Back to Physics Path">← <span>Back to Physics Path</span></a></main><script>const qs=[['What is absolute uncertainty?',['The uncertainty expressed in the same units as the measured quantity','The ratio of uncertainty to measured value','The exact value','The instrument range'],0,'Absolute uncertainty has the same unit as the measured quantity.'],['For 5.20 ± 0.05 cm, the absolute uncertainty is:',['0.05 cm','5.20 cm','0.01 cm','5.25 cm'],0,'The ± term is the absolute uncertainty.'],['Absolute uncertainty is commonly represented by:',['Δx','x/Δx','x²','1/x'],0,'Δx denotes absolute uncertainty in x.'],['For x = 10.0 ± 0.2 m, the central measured value is:',['0.2 m','10.0 m','10.2 m','9.8 m'],1,'10.0 m is the measured value; 0.2 m is its uncertainty.'],['For 10.0 ± 0.2 m, the approximate range is:',['9.8 to 10.2 m','9.0 to 11.0 m','10.0 m only','9.2 to 10.8 m'],0,'Subtract and add the absolute uncertainty.'],['If an instrument has least count 1 mm, a basic estimate of absolute uncertainty may be:',['1 mm','0.1 mm','25 mm','26 mm'],0,'When no other convention is specified, least count can be used as a simple uncertainty estimate.'],['Absolute uncertainty in a length has dimensions of:',['Length','No dimensions','Time','Mass'],0,'Absolute uncertainty has the same dimensions as the measured quantity.'],['For 2.50 ± 0.02 s, the absolute uncertainty is:',['0.02 s','2.50 s','0.01 s','2.52 s'],0,'The ± value gives the absolute uncertainty.'],['Which has smaller absolute uncertainty?',['20.0 ± 0.5 cm','20.0 ± 0.1 cm','Both','Cannot compare'],1,'0.1 cm is smaller than 0.5 cm.'],['In 8.4 ± 0.3 kg, the absolute uncertainty is:',['0.3 kg','8.4 kg','0.3','8.7 kg'],0,'Absolute uncertainty carries the same unit, kg.'],['For z = A + B, the maximum absolute uncertainty is:',['ΔA + ΔB','ΔA − ΔB','ΔAΔB','ΔA/ΔB'],0,'For addition, maximum absolute uncertainties are added.'],['For z = A − B, the maximum absolute uncertainty is:',['|ΔA − ΔB|','ΔA + ΔB','ΔAΔB','ΔA/ΔB'],1,'For subtraction, maximum absolute uncertainties also add.'],['If A = 5.0 ± 0.1 and B = 2.0 ± 0.2, uncertainty in A+B is:',['0.1','0.2','0.3','7.0'],2,'0.1 + 0.2 = 0.3.'],['For a product z = AB, the maximum-error method combines:',['Relative/fractional uncertainties','Only absolute values','Only SI units','Only decimal places'],0,'For products, fractional uncertainties are added.'],['Which best distinguishes absolute and relative uncertainty?',['Absolute uncertainty has the same unit as the measurement; relative uncertainty is dimensionless','Both have the same unit','Absolute uncertainty is always a percentage','Relative uncertainty is measured in metres'],0,'Absolute uncertainty has units; relative uncertainty is a ratio.']];let i=0,selected=-1,score=0,answered=0;const $=id=>document.getElementById(id);function updateProgress(){answered=Math.max(answered,i);$('masteryText').textContent=answered+' / '+qs.length;$('fill').style.width=(answered*100/qs.length)+'%'}function render(){const a=qs[i];selected=-1;$('count').textContent=`Question ${i+1} of ${qs.length}`;$('question').textContent=a[0];$('options').innerHTML='';$('feedback').textContent='';$('hint').textContent='Choose the best answer.';$('check').disabled=true;$('next').disabled=true;a[1].forEach((t,j)=>{const b=document.createElement('button');b.textContent=`${String.fromCharCode(65+j)}. ${t}`;b.onclick=()=>{selected=j;[...$('options').children].forEach((x,k)=>x.classList.toggle('selected',k===j));$('check').disabled=false};$('options').appendChild(b)})}function checkAnswer(){if(selected<0)return;const a=qs[i],ok=selected===a[2];[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=ok?'✅ Correct! +10 XP — '+a[3]:'❌ Not quite. Correct answer: '+a[1][a[2]]+' — '+a[3];if(ok){score++;$('xp').textContent=score*10}answered=Math.max(answered,i+1);updateProgress();$('check').disabled=true;$('next').disabled=false}function finish(){$('question').textContent='🎉 Skill complete!';$('options').innerHTML='';$('check').style.display='none';$('next').style.display='none';$('feedback').textContent=`You scored ${score} / ${qs.length} • ${score*10} XP`;$('hint').textContent=score===15?'Excellent! Perfect absolute uncertainty mastery.':'Keep practicing and try again to improve your score.';answered=15;updateProgress();$('result').style.display='block';$('score').textContent=`${score} / ${qs.length} correct`;$('fill').style.width='100%'}$('check').onclick=checkAnswer;$('next').onclick=()=>{if(i<qs.length-1){i++;render()}else finish()};$('retry').onclick=()=>{i=0;selected=-1;score=0;answered=0;$('xp').textContent='0';$('result').style.display='none';$('check').style.display='inline-block';$('next').style.display='inline-block';updateProgress();render()};updateProgress();render();</script></body></html>
