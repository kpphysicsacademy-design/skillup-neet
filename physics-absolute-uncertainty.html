<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Absolute Uncertainty</title><style>body{margin:0;font-family:system-ui;background:#eef7ff;color:#173b62}.wrap{max-width:1050px;margin:auto;padding:20px}.hero,.quiz,.panel,.mastery{background:#fff;border-radius:20px;padding:22px;margin:12px 0;box-shadow:0 6px 18px #123b7015}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #dbe7f1;border-radius:15px;background:#fff;text-align:left;font-weight:700;cursor:pointer}.option.selected{border-color:#1677ff;background:#eef6ff}.option.correct{border-color:#2db84d;background:#eaffef}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{padding:12px 18px;border:0;border-radius:13px;font-weight:900;cursor:pointer;margin:8px 6px 0 0}.check{background:#2db84d;color:#fff}.next{background:#dcecff;color:#145b9e}.feedback{margin-top:14px;padding:13px;border-radius:14px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.bar{height:13px;background:#dce8f2;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#42c95a}@media(max-width:750px){.layout{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="physics-home.html">← Back to Physics Path</a><section class="hero"><div>PHYSICS • NEET 2026</div><h1>Absolute uncertainty</h1><p>LEARN → PRACTICE → MASTER • 15 focused NEET-style MCQs</p></section><section class="mastery"><b>🎯 Skill Mastery <span id="mt">0 / 15</span></b><div class="bar"><div id="fill" class="fill"></div></div><p>⚡ <span id="xp">0</span> XP &nbsp; 🏆 <span id="pct">0%</span></p></section><div class="layout"><aside class="panel"><h3 id="count">Question 1 of 15</h3><div>Absolute uncertainty</div><div>⚡ +10 XP each</div></aside><section class="quiz"><b id="badge">Q1</b><h2 id="q"></h2><div id="opts" class="options"></div><button id="check" class="btn check">Check Answer</button><button id="next" class="btn next" disabled>Next Question →</button><div id="fb" class="feedback"></div><p>💡 Choose the best answer.</p></section></div></main><script>(function(){const quiz=[['What is absolute uncertainty?',['The uncertainty expressed in the same units as the measured quantity','The ratio of uncertainty to measured value','The exact value','The instrument range'],0,'Absolute uncertainty has the same unit as the measured quantity.'],['For 5.20 ± 0.05 cm, the absolute uncertainty is:',['0.05 cm','5.20 cm','0.01 cm','5.25 cm'],0,'The ± term is the absolute uncertainty.'],['Absolute uncertainty is commonly represented by:',['Δx','x/Δx','x²','1/x'],0,'Δx denotes absolute uncertainty in x.'],['For x = 10.0 ± 0.2 m, the central measured value is:',['0.2 m','10.0 m','10.2 m','9.8 m'],1,'10.0 m is the measured value; 0.2 m is its uncertainty.'],['For 10.0 ± 0.2 m, the approximate range is:',['9.8 to 10.2 m','9.0 to 11.0 m','10.0 m only','9.2 to 10.8 m'],0,'Subtract and add the absolute uncertainty.'],['If an instrument has least count 1 mm, a basic estimate of absolute uncertainty may be:',['1 mm','0.1 mm','25 mm','26 mm'],0,'When no other convention is specified, least count can be used as a simple uncertainty estimate.'],['Absolute uncertainty in a length has dimensions of:',['Length','No dimensions','Time','Mass'],0,'Absolute uncertainty has the same dimensions as the measured quantity.'],['For 2.50 ± 0.02 s, the absolute uncertainty is:',['0.02 s','2.50 s','0.01 s','2.52 s'],0,'The ± value gives the absolute uncertainty.'],['Which has smaller absolute uncertainty?',['20.0 ± 0.5 cm','20.0 ± 0.1 cm','Both','Cannot compare'],1,'0.1 cm is smaller than 0.5 cm.'],['In 8.4 ± 0.3 kg, the absolute uncertainty is:',['0.3 kg','8.4 kg','0.3','8.7 kg'],0,'Absolute uncertainty carries the same unit, kg.'],['For z = A + B, the maximum absolute uncertainty is:',['ΔA + ΔB','ΔA − ΔB','ΔAΔB','ΔA/ΔB'],0,'For addition, maximum absolute uncertainties are added.'],['For z = A − B, the maximum absolute uncertainty is:',['|ΔA − ΔB|','ΔA + ΔB','ΔAΔB','ΔA/ΔB'],1,'For subtraction, maximum absolute uncertainties also add.'],['If A = 5.0 ± 0.1 and B = 2.0 ± 0.2, uncertainty in A+B is:',['0.1','0.2','0.3','7.0'],2,'0.1 + 0.2 = 0.3.'],['For a product z = AB, the maximum-error method combines:',['Relative/fractional uncertainties','Only absolute values','Only SI units','Only decimal places'],0,'For products, fractional uncertainties are added.'],['Which best distinguishes absolute and relative uncertainty?',['Absolute uncertainty has the same unit as the measurement; relative uncertainty is dimensionless','Both have the same unit','Absolute uncertainty is always a percentage','Relative uncertainty is measured in metres'],0,'Absolute uncertainty has units; relative uncertainty is a ratio.']];let i=0,sel=-1,score=0;const q=document.getElementById('q'),opts=document.getElementById('opts'),fb=document.getElementById('fb'),check=document.getElementById('check'),next=document.getElementById('next');function render(){let a=quiz[i];sel=-1;q.textContent=a[0];document.getElementById('badge').textContent='Q'+(i+1);document.getElementById('count').textContent='Question '+(i+1)+' of 15';opts.innerHTML='';fb.textContent='';fb.className='feedback';check.disabled=false;next.disabled=true;a[1].forEach((v,j)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+v;b.onclick=()=>{sel=j;[...opts.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};opts.appendChild(b)})}check.onclick=()=>{if(sel<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}let a=quiz[i];[...opts.children].forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===sel&&j!==a[2])b.classList.add('wrong')});if(sel===a[2]){score++;fb.className='feedback good';fb.textContent='🎯 Correct! +10 XP — '+a[3]}else{fb.className='feedback bad';fb.textContent='Not quite. Correct answer: '+a[1][a[2]]+' — '+a[3]}document.getElementById('xp').textContent=score*10;document.getElementById('mt').textContent=score+' / 15';document.getElementById('pct').textContent=Math.round(score/15*100)+'%';document.getElementById('fill').style.width=(score/15*100)+'%';check.disabled=true;next.disabled=false;if(i===14)next.textContent='Finish Skill →'};next.onclick=()=>{if(i<14){i++;next.textContent='Next Question →';render()}else{q.textContent='🏆 Absolute uncertainty Complete!';opts.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+score+' / 15 correct • '+score*10+' XP'}};render()})();</script></body></html>
