<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | AC Current</title><meta name="description" content="SkillUp Physics AC Current interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">〰️</span><h1>AC Current</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["An alternating current changes its direction periodically with time. A sinusoidal current is written as:",["i=I₀sinωt","i=V/R only","i=Q/t only","i=Pt"],0,"A sinusoidal AC current can be written as i=I₀sin(ωt+φ)."],["The maximum value of AC current is called:",["RMS current","Peak current","Average current","Mean current"],1,"The maximum or peak current is I₀."],["For i=I₀sinωt, the RMS current is:",["I₀","I₀/2","I₀/√2","√2I₀"],2,"For a sinusoidal current, Iᵣₘₛ=I₀/√2."],["The RMS value of AC current gives the same heating effect as an equal DC current in a:",["Capacitor","Resistor","Transformer only","Diode only"],1,"RMS current is the DC-equivalent current for resistive heating."],["If peak current is 10 A, the RMS current is approximately:",["5 A","7.07 A","10 A","14.14 A"],1,"Iᵣₘₛ=10/√2≈7.07 A."],["The average value of a pure sinusoidal AC current over one complete cycle is:",["I₀","I₀/√2","Zero","2I₀"],2,"Positive and negative half cycles cancel over a complete cycle."],["The frequency of AC current represents:",["Maximum current","Cycles per second","Resistance","Power factor only"],1,"Frequency is the number of complete cycles per second."],["The SI unit of frequency is:",["Ampere","Hertz","Volt","Henry"],1,"Frequency is measured in hertz (Hz)."],["A 50 Hz AC current has a period of:",["0.02 s","0.05 s","20 s","50 s"],0,"T=1/f=1/50=0.02 s."],["The angular frequency corresponding to frequency f is:",["ω=f/2π","ω=2πf","ω=π/f","ω=1/f"],1,"Angular frequency is ω=2πf."],["In a purely resistive AC circuit, current and voltage are:",["90° out of phase","In phase","180° out of phase","Unrelated"],1,"For a pure resistor, voltage and current reach corresponding maxima together."],["The instantaneous AC current is zero when sin(ωt) is:",["0","1","−1","All nonzero values"],0,"If i=I₀sinωt, i=0 when sinωt=0."],["If RMS current is 5 A, its peak value is:",["2.5 A","5 A","7.07 A","10 A"],2,"I₀=√2 Iᵣₘₛ≈7.07 A."],["The direction of AC current:",["Never changes","Changes periodically","Changes only once","Is always zero"],1,"Alternating current periodically reverses direction."],["A 220 V RMS sinusoidal supply has peak voltage approximately:",["110 V","220 V","311 V","440 V"],2,"V₀=√2×220≈311 V."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="✓ Correct — "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="✗ Not quite — "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;i++;if(i<qs.length)render();else{$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`;$("fill").style.width="100%"}}function restart(){i=0;score=0;xp=0;$("quiz").hidden=false;$("result").hidden=true;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
