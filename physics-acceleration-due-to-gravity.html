<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🌎 Acceleration Due to Gravity</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"Acceleration due to gravity at a planet's surface is:",o:["g = GM/R²","g = GMR²","g = GM/R","g = GR²/M"],a:0,e:"Equating gravitational force GMm/R² to weight mg gives g = GM/R²."},
{q:"The SI unit of acceleration due to gravity is:",o:["m/s²","N/kg²","J/kg","kg m/s"],a:0,e:"Acceleration is measured in metres per second squared."},
{q:"The approximate value of g at Earth's mean sea level is:",o:["9.8 m/s²","6.67 m/s²","3.0 m/s²","98 m/s²"],a:0,e:"The standard approximate surface value is 9.8 m/s²."},
{q:"Acceleration due to gravity near a planet's surface does not depend on the:",o:["Mass of the falling object","Mass of the planet","Radius of the planet","Gravitational constant"],a:0,e:"The falling object's mass cancels when F = mg is equated to gravitational force."},
{q:"The dimensions of g are:",o:["LT⁻²","L²T⁻²","MLT⁻²","M⁻¹L³T⁻²"],a:0,e:"Acceleration has dimensions length divided by time squared."},
{q:"If a planet's mass doubles while its radius stays the same, surface g:",o:["Doubles","Halves","Becomes four times","Stays the same"],a:0,e:"Since g = GM/R², it is directly proportional to M at fixed R."},
{q:"If a planet's radius doubles with mass unchanged, surface g becomes:",o:["One-fourth","One-half","Twice","Four times"],a:0,e:"g is inversely proportional to the square of the radius."},
{q:"At height h above Earth's surface, exact gravity is:",o:["gₕ = g[R/(R+h)]²","gₕ = g(1−h/R)","gₕ = g(R+h)²/R²","gₕ = gR/(R+h)"],a:0,e:"The distance from Earth's centre is R+h, so gₕ = GM/(R+h)²."},
{q:"At a height equal to Earth's radius (h = R), gravity is:",o:["g/4","g/2","2g","g"],a:0,e:"gₕ/g = R²/(2R)² = 1/4."},
{q:"For h much smaller than Earth's radius, gravity at height h is approximately:",o:["g(1−2h/R)","g(1−h/2R)","g(1−h/R)² exactly","g(1+2h/R)"],a:0,e:"Using the first-order binomial approximation gives gₕ ≈ g(1−2h/R)."},
{q:"At depth d below Earth's surface, assuming uniform density, gravity is:",o:["g_d = g(1−d/R)","g_d = g(1−2d/R)","g_d = gR/d","g_d = g(1+d/R)"],a:0,e:"Under the uniform-density model, g decreases linearly with depth."},
{q:"At Earth's centre, the acceleration due to gravity is:",o:["Zero","9.8 m/s²","Infinite","Maximum"],a:0,e:"Symmetry makes the net gravitational field zero at the centre."},
{q:"At depth R/2 inside Earth, using the uniform-density model, g is:",o:["g/2","g/4","2g","Zero"],a:0,e:"g_d = g(1−d/R) = g(1−1/2) = g/2."},
{q:"Gravity at Earth's surface is greatest approximately at the:",o:["Poles","Equator","Same at every latitude","Centre"],a:0,e:"Earth's rotation and its oblate shape make effective g greater at the poles than at the equator."},
{q:"Effective gravity is smallest approximately at the:",o:["Equator","Poles","Earth's centre only","Everywhere equally"],a:0,e:"Earth's rotation reduces effective gravity most at the equator."},
{q:"The universal gravitational constant G is approximately:",o:["6.67 × 10⁻¹¹ N m²/kg²","9.8 m/s²","6.67 × 10¹¹ N/kg","3.0 × 10⁸ m/s"],a:0,e:"G ≈ 6.67 × 10⁻¹¹ N m² kg⁻²."},
{q:"A planet has M = 6 × 10²⁴ kg and R = 6 × 10⁶ m. Which expression gives g?",o:["GM/R²","GMR²","GR²/M","GM/R"],a:0,e:"Substitute the planet's mass and radius into g = GM/R²."},
{q:"If gravity is g on a planet and a body's mass is m, its weight is:",o:["mg","m/g","g/m","m+g"],a:0,e:"Weight is the gravitational force W = mg."},
{q:"An object's mass is 5 kg and g = 10 m/s². Its weight is:",o:["50 N","2 N","15 N","5 N"],a:0,e:"W = mg = 5 × 10 = 50 N."},
{q:"If g decreases, an object's mass:",o:["Remains unchanged","Decreases in the same ratio","Becomes zero","Doubles"],a:0,e:"Mass is intrinsic; weight changes with local g."},
{q:"At altitude h = R, if surface gravity is 9.8 m/s², gₕ is:",o:["2.45 m/s²","4.9 m/s²","9.8 m/s²","39.2 m/s²"],a:0,e:"At h = R, gₕ = g/4 = 9.8/4 = 2.45 m/s²."},
{q:"At a height h ≪ R, the approximate fractional decrease in g is:",o:["2h/R","h/R","R/2h","(h/R)²"],a:0,e:"From gₕ ≈ g(1−2h/R), the fractional decrease is about 2h/R."},
{q:"At depth d = R/4, gravity under the uniform-density model is:",o:["3g/4","g/4","g/2","Zero"],a:0,e:"g_d = g(1−1/4) = 3g/4."},
{q:"As distance r from a spherical planet increases outside it, gravity magnitude:",o:["Decreases as 1/r²","Decreases as 1/r","Increases as r²","Stays constant"],a:0,e:"Outside a spherical body, g = GM/r²."},
{q:"The gravitational acceleration vector near Earth's surface points:",o:["Toward Earth's centre","Away from Earth's centre","Horizontally everywhere","Along the object's velocity"],a:0,e:"Gravity points toward the attracting body's centre."},
{q:"If both planet mass and radius are doubled, surface gravity:",o:["Halves","Doubles","Stays the same","Becomes four times"],a:0,e:"g' = G(2M)/(2R)² = g/2."},
{q:"A body's weight on the Moon is less than on Earth mainly because:",o:["The Moon's surface gravity is smaller","Its mass changes on the Moon","G is smaller on the Moon","Time runs slower on the Moon"],a:0,e:"Weight changes with local gravity; the body's mass remains the same."},
{q:"If a body's mass is 2 kg and g = 9.8 m/s², its weight is:",o:["19.6 N","4.9 N","9.8 N","2 N"],a:0,e:"W = mg = 2 × 9.8 = 19.6 N."},
{q:"For small height h above Earth's surface, the approximation gₕ ≈ g(1−2h/R) is valid when:",o:["h ≪ R","h = R","h ≫ R","R = 0"],a:0,e:"The approximation uses a first-order expansion and requires h/R to be small."},
{q:"Which statement correctly distinguishes G and g?",o:["G is universal; g varies with location","G varies daily; g is universal","Both are always 9.8","Both depend on the falling body's mass"],a:0,e:"G is universal, while g depends on the planet and location."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Acceleration Due to Gravity Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
