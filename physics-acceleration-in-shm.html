<section class="hero"><h1>🔥 Acceleration in SHM</h1><p class="muted">Explore SHM oscillator properties with 30 questions and concise explanations.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>

<script>
(function(){
'use strict';
const questions = [
  {q:"In simple harmonic motion, acceleration is related to displacement by:",o:["a = ωx","a = −ω²x","a = ω²/x","a = −ωx²"],a:1,e:"For SHM, acceleration is proportional to displacement and directed toward the mean position: a = −ω²x."},
  {q:"The acceleration of an SHM particle at the mean position is:",o:["maximum","zero","−ω²A","ωA"],a:1,e:"At the mean position x = 0, so a = −ω²x = 0."},
  {q:"At the extreme position x = +A, acceleration is:",o:["zero","+ω²A","−ω²A","ωA"],a:2,e:"At x = +A, a = −ω²A, directed toward equilibrium."},
  {q:"The maximum magnitude of acceleration in SHM is:",o:["Aω","Aω²","A/ω²","ω²/A"],a:1,e:"Since |a| = ω²|x|, the maximum occurs at |x| = A: a_max = Aω²."},
  {q:"The SI unit of acceleration is:",o:["m/s","m/s²","rad/s","hertz"],a:1,e:"Acceleration is the rate of change of velocity and is measured in metres per second squared."},
  {q:"A particle has amplitude 0.2 m and angular frequency 3 rad/s. Its maximum acceleration is:",o:["0.6 m/s²","1.8 m/s²","3.0 m/s²","0.2 m/s²"],a:1,e:"a_max = Aω² = 0.2 × 9 = 1.8 m/s²."},
  {q:"If angular frequency doubles at fixed amplitude, maximum acceleration becomes:",o:["twice","four times","half","unchanged"],a:1,e:"a_max = Aω², so doubling ω multiplies a_max by four."},
  {q:"If amplitude doubles while angular frequency remains constant, maximum acceleration:",o:["halves","doubles","quadruples","remains unchanged"],a:1,e:"a_max is directly proportional to amplitude."},
  {q:"For x = A cos(ωt), acceleration is:",o:["Aω sin(ωt)","−Aω² cos(ωt)","Aω² sin(ωt)","−Aω cos(ωt)"],a:1,e:"Differentiating twice gives a = −Aω² cos(ωt) = −ω²x."},
  {q:"For x = A sin(ωt), acceleration is:",o:["−Aω² sin(ωt)","Aω² cos(ωt)","−Aω cos(ωt)","Aω sin(ωt)"],a:0,e:"For x = A sin(ωt), a = d²x/dt² = −Aω² sin(ωt)."},
  {q:"The negative sign in a = −ω²x indicates that acceleration is directed:",o:["away from the mean position","toward the mean position","along velocity always","perpendicular to displacement"],a:1,e:"The restoring acceleration points opposite to displacement, toward equilibrium."},
  {q:"At which position is acceleration magnitude maximum in SHM?",o:["mean position","x = A/2 only","either extreme","all positions equally"],a:2,e:"Acceleration magnitude is ω²|x|, greatest at x = ±A."},
  {q:"A particle has ω = 5 rad/s and displacement x = 0.04 m. Its acceleration is:",o:["+1 m/s²","−1 m/s²","−0.2 m/s²","+0.2 m/s²"],a:1,e:"a = −ω²x = −25 × 0.04 = −1 m/s²."},
  {q:"At x = −0.1 m with ω = 4 rad/s, acceleration is:",o:["−1.6 m/s²","+1.6 m/s²","+0.4 m/s²","−0.4 m/s²"],a:1,e:"a = −ω²x = −16(−0.1) = +1.6 m/s²."},
  {q:"The ratio of maximum acceleration to maximum speed in SHM is:",o:["ω","ω²","Aω","A/ω"],a:0,e:"a_max/v_max = Aω²/(Aω) = ω."},
  {q:"The ratio of maximum acceleration to amplitude is:",o:["ω","ω²","1/ω²","Aω²"],a:1,e:"a_max/A = Aω²/A = ω²."},
  {q:"Acceleration and displacement in SHM are separated in phase by:",o:["0°","90°","180°","270°"],a:2,e:"Since a = −ω²x, acceleration is opposite in phase to displacement."},
  {q:"If the period of SHM is T, maximum acceleration is:",o:["4π²A/T²","2πA/T","A/T²","4πA/T²"],a:0,e:"ω = 2π/T, so a_max = Aω² = 4π²A/T²."},
  {q:"A particle has period 2 s and amplitude 0.1 m. Its maximum acceleration is approximately:",o:["0.10 m/s²","0.99 m/s²","1.97 m/s²","4.0 m/s²"],a:1,e:"ω = π rad/s; a_max = 0.1π² ≈ 0.99 m/s²."},
  {q:"If displacement is half the amplitude, acceleration magnitude is:",o:["a_max","a_max/2","a_max/4","zero"],a:1,e:"Since |a| = ω²|x|, at |x| = A/2 it equals half the maximum."},
  {q:"When an SHM particle crosses the mean position, its acceleration is zero but its speed is:",o:["zero","maximum","minimum nonzero","always negative"],a:1,e:"At x = 0, acceleration vanishes and speed is maximum."},
  {q:"At the positive extreme of SHM, the acceleration direction is:",o:["positive","negative, toward equilibrium","zero","undefined"],a:1,e:"At x = +A, acceleration is negative, toward the mean position."},
  {q:"At the negative extreme of SHM, the acceleration direction is:",o:["negative","positive, toward equilibrium","zero","away from equilibrium"],a:1,e:"At x = −A, a = +ω²A, toward the mean position."},
  {q:"If a = −16x in SI units, the angular frequency is:",o:["4 rad/s","8 rad/s","16 rad/s","256 rad/s"],a:0,e:"Comparing with a = −ω²x gives ω² = 16, so ω = 4 rad/s."},
  {q:"For a particle with ω = 10 rad/s and x = −0.02 m, acceleration is:",o:["−2 m/s²","+2 m/s²","−0.2 m/s²","+0.2 m/s²"],a:1,e:"a = −100(−0.02) = +2 m/s²."},
  {q:"In ideal SHM, if displacement is tripled but remains within the amplitude, acceleration magnitude:",o:["becomes one-third","triples","becomes nine times","does not change"],a:1,e:"For fixed ω, |a| = ω²|x|, so tripling |x| triples acceleration magnitude."},
  {q:"Which graph is a straight line through the origin for acceleration a versus displacement x in SHM?",o:["positive slope ω²","negative slope −ω²","horizontal at a = A","vertical line"],a:1,e:"The relation a = −ω²x is linear with slope −ω²."},
  {q:"The restoring acceleration of a simple harmonic oscillator is zero when:",o:["x = A","x = −A","x = 0","speed is zero only"],a:2,e:"a = −ω²x becomes zero at the equilibrium position x = 0."},
  {q:"A spring oscillator has mass m and spring constant k. Its acceleration is:",o:["a = −(k/m)x","a = +(k/m)x","a = −(m/k)x","a = kx²/m"],a:0,e:"From Hooke's law F = −kx and a = F/m, so a = −(k/m)x."},
  {q:"For an SHM particle, which statement is correct?",o:["Acceleration is always in direction of motion","Acceleration is always zero","Acceleration is proportional to displacement and opposite in direction","Acceleration is independent of displacement"],a:2,e:"The defining acceleration relation for SHM is a = −ω²x."}
];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Acceleration in SHM Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
