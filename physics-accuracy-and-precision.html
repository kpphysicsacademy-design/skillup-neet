<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Accuracy and Precision</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f6f8fb;color:#13233b}.wrap{max-width:760px;margin:auto;padding:28px 18px 40px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #00000012}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{margin:0;font-size:28px}.xp{font-weight:800}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:99px;overflow:hidden;margin:12px 0 24px}.fill{height:100%;width:0;background:#58cc02;transition:.3s}.q{font-size:21px;font-weight:800;line-height:1.45;margin:0 0 18px}.opts{display:grid;gap:10px}.opt{display:block;width:100%;text-align:left;padding:15px 16px;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer;transition:.16s}.opt:hover{background:#f1f6ff}.opt.selected{border-color:#5146a5;background:#f4f1ff}.opt.correct{border-color:#39a852!important;background:#e9f8ed!important}.opt.wrong{border-color:#e05252!important;background:#fff0f0!important}.opt:disabled{cursor:default}.actions{display:flex;gap:10px;margin-top:18px}.btn{padding:13px 20px;border:0;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer}.check{background:#58cc02;color:#fff}.next{background:#2563eb;color:#fff}.check:disabled,.next:disabled{opacity:.45;cursor:not-allowed}.feedback{min-height:28px;margin-top:15px;font-weight:700;line-height:1.5}.explain{font-weight:500;color:#40536a}.result{display:none;text-align:center;padding:12px 0}.retry{background:#2563eb;color:#fff}.back{display:block;width:100%;text-align:center;text-decoration:none;background:#172033;color:#fff;border-radius:14px;padding:14px;margin-top:16px;font-size:16px;font-weight:800}@media(max-width:600px){.wrap{padding:20px 12px}.card{padding:20px}.top h1{font-size:24px}.q{font-size:19px}.opt{font-size:15px}.actions{flex-direction:column}.btn{width:100%}}</style></head><body><main class="wrap"><section class="card"><div class="top"><h1>🎯 Accuracy and Precision</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></div><div class="meta"><span id="count">Question 1/15</span><span id="mastery">Skill Mastery 0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div><div id="quiz"></div><div class="feedback" id="feedback"></div><div class="actions"><button id="check" class="btn check" disabled>Check Answer</button><button id="next" class="btn next" disabled>Next Question →</button></div><div id="result" class="result"><h2>🎉 Skill Complete!</h2><p id="resultText"></p><button id="retry" class="btn retry">Retry Quiz ↻</button></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></section></main><script>const qs=[['What is accuracy?',['Closeness of a measured value to the true value','Closeness of repeated values to each other','Smallest scale division','Number of significant figures'],0,'Accuracy describes closeness to the true value.'],['What is precision?',['Closeness to the true value','Closeness of repeated measurements to one another','Absence of all systematic error','Size of the instrument'],1,'Precision describes repeatability.'],['Readings close to one another but far from the true value are:',['Accurate and precise','Precise but not accurate','Accurate but not precise','Neither'],1,'The readings are consistent but biased.'],['Readings scattered around the true value are:',['Accurate on average but not precise','Precise but inaccurate','Both precise and inaccurate','Neither'],0,'The average may be accurate while the spread is large.'],['Which error mainly shifts all readings in one direction?',['Random error','Systematic error','Resolution','Rounding error'],1,'Systematic error introduces a consistent bias.'],['Random error mainly affects:',['Precision','The SI unit','Dimensions','Instrument colour'],0,'Random fluctuations increase the spread.'],['A balance repeatedly reads 100.8 g for an object whose accepted mass is 100.0 g. The readings are:',['Precise but not accurate','Accurate but not precise','Both accurate and precise','Neither'],0,'They are repeatable but biased.'],['A good measuring instrument should ideally have:',['High accuracy and high precision','Low accuracy and low precision','High error and low resolution','Only a large least count'],0,'Good measurement aims for both.'],['Which statement is correct?',['Accuracy and precision are identical','A measurement can be precise without being accurate','A measurement can never be accurate without being precise','Precision removes systematic error'],1,'A biased instrument can be precise but inaccurate.'],['Readings 5.21, 5.20, 5.21 and 5.20 cm are compared with accepted value 5.80 cm. They are:',['Precise but inaccurate','Accurate but imprecise','Both accurate and precise','Random and exact'],0,'They are tightly clustered but far from the accepted value.'],['A useful way to reduce random error is to:',['Take repeated measurements and use an appropriate average','Change the unit','Ignore readings','Increase systematic bias'],0,'Repeated measurements reduce random fluctuations.'],['A systematic error can be detected by:',['Comparing with a calibrated standard','Taking only one reading','Using fewer observations','Rounding every reading'],0,'A calibrated reference can reveal bias.'],['Values close to the accepted value but widely scattered are:',['Accurate on average but not precise','Precise but inaccurate','Both highly precise and inaccurate','Always exact'],0,'Closeness and spread are different properties.'],['High precision implies that:',['Repeated measurements are closely grouped','Every measurement equals the true value','There is no uncertainty','Zero error is impossible'],0,'High precision means low spread, not necessarily accuracy.'],['Which statement best distinguishes accuracy and precision?',['Accuracy concerns closeness to true value; precision concerns repeatability','Accuracy means more decimal places; precision means fewer','Both depend only on the SI unit','Neither matters in experiments'],0,'This distinction is fundamental in experimental physics.']];let i=0,xp=0,correct=0,selected=-1,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;selected=-1;const a=qs[i];$('count').textContent=`Question ${i+1}/${qs.length}`;$('mastery').textContent=`Skill Mastery ${correct} / ${qs.length}`;$('xp').textContent=xp;$('quiz').innerHTML=`<div class="q">${a[0]}</div>`+a[1].map((o,j)=>`<button type="button" class="opt" data-n="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false});$('feedback').textContent='';$('check').disabled=true;$('next').disabled=true;$('next').textContent=i===qs.length-1?'Finish →':'Next Question →';$('fill').style.width=`${correct/qs.length*100}%`}function grade(){if(selected<0)return;answered=true;const a=qs[i],ok=selected===a[2];document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===selected&&!ok)b.classList.add('wrong')});if(ok){correct++;xp+=10;$('feedback').innerHTML='✨ <b>Correct!</b> +10 XP<br><span class="explain">'+a[3]+'</span>'}else{$('feedback').innerHTML='❌ <b>Incorrect.</b> Correct answer: '+a[1][a[2]]+'<br><span class="explain">'+a[3]+'</span>'}$('xp').textContent=xp;$('mastery').textContent=`Skill Mastery ${correct} / ${qs.length}`;$('fill').style.width=`${correct/qs.length*100}%`;$('check').disabled=true;$('next').disabled=false}function advance(){if(i<qs.length-1){i++;render();window.scrollTo({top:0,behavior:'smooth'})}else finish()}function finish(){$('fill').style.width='100%';$('count').textContent='Complete!';$('mastery').textContent=`Skill Mastery ${correct} / ${qs.length}`;$('quiz').innerHTML='';$('feedback').textContent='';$('check').style.display='none';$('next').style.display='none';$('result').style.display='block';$('resultText').textContent=`You answered ${correct} of ${qs.length} correctly and earned ${xp} XP.`}$('check').onclick=grade;$('next').onclick=advance;$('retry').onclick=()=>{i=0;xp=0;correct=0;$('check').style.display='';$('next').style.display='';$('result').style.display='none';render();window.scrollTo({top:0,behavior:'smooth'})};render();</script></body></html>
