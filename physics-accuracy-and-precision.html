<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Accuracy and Precision</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.xp{font-weight:800}.card{background:white;border-radius:22px;padding:24px;margin-top:18px;box-shadow:0 5px 20px #00000012}.bar{height:10px;background:#e8eaf0;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.3s}.q{font-size:1.3rem;font-weight:750;line-height:1.45}.opts{display:grid;gap:10px;margin-top:18px}.opts button{padding:15px;border:2px solid #e2e5eb;border-radius:14px;background:white;text-align:left;font-size:1rem;cursor:pointer}.opts button:hover{border-color:#58cc02}.opts button.selected{border-color:#58cc02;background:#f3fff0}.opts button.correct{border-color:#58cc02;background:#eaffef}.opts button.wrong{border-color:#e5484d;background:#fff0f0}.feedback{font-weight:700;margin-top:16px;min-height:24px}.next{margin-top:18px;padding:13px 22px;border:0;border-radius:14px;background:#58cc02;color:white;font-weight:800;cursor:pointer}.next:disabled{opacity:.45}.check{margin-top:18px;padding:13px 22px;border:0;border-radius:14px;background:#58cc02;color:white;font-weight:800;cursor:pointer}.check:disabled{opacity:.45}.back{display:inline-block;margin-top:18px;color:#5146a5;font-weight:700}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.badge{padding:7px 10px;border-radius:12px;background:#f2f7fb;border:2px solid #e2e5eb;font-weight:800}.badge.active{background:#fff6cf;border-color:#ffd45a}@media(max-width:600px){.wrap{padding:18px 12px}.card{padding:18px}.top{align-items:flex-start}.q{font-size:1.15rem}}</style></head><body><main class="wrap"><div class="top"><h1>🎯 Accuracy and Precision</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></div><p>Master accuracy, precision, errors and measurement quality with 15 NEET-style questions.</p><div class="bar"><div id="fill" class="fill"></div></div><section class="card"><div id="count"></div><p id="question" class="q"></p><div id="options" class="opts"></div><button id="check" class="check" disabled>Check Answer</button><button id="next" class="next" disabled>Continue →</button><div id="feedback" class="feedback"></div><p>💡 <span id="hint">Choose the best answer.</span></p><div id="result" style="display:none;text-align:center"><h2>🎉 Accuracy & Precision mastered!</h2><p id="score"></p><button id="retry" class="next">Retry Skill</button></div></section><a class="back" href="physics-home.html">← Back to Physics Path</a></main><script>const qs=[['What is accuracy?',['Closeness of a measured value to the true value','Closeness of repeated values to each other','Smallest scale division','Number of significant figures'],0,'Accuracy describes closeness to the accepted or true value.'],['What is precision?',['Closeness to the true value','Closeness of repeated measurements to one another','Absence of all systematic error','Size of the instrument'],1,'Precision describes repeatability or consistency.'],['Readings close to one another but far from the true value are:',['Accurate and precise','Precise but not accurate','Accurate but not precise','Neither'],1,'The readings are tightly grouped but biased.'],['Readings scattered around the true value are:',['Accurate on average but not precise','Precise but inaccurate','Both precise and inaccurate','Always exact'],0,'Their average can be close to the true value, but the scatter indicates poor precision.'],['Which error mainly shifts all readings in one direction?',['Random error','Systematic error','Resolution','Rounding error'],1,'Systematic error introduces a consistent bias.'],['Random error mainly affects:',['Precision','The SI unit','Dimensions','Instrument colour'],0,'Random fluctuations increase the spread of repeated readings.'],['A balance repeatedly reads 100.8 g for an object whose accepted mass is 100.0 g. The readings are:',['Precise but not accurate','Accurate but not precise','Both accurate and precise','Neither'],0,'Repeated identical readings are precise, but the bias makes them inaccurate.'],['A good measuring instrument should ideally have:',['High accuracy and high precision','Low accuracy and low precision','High error and low resolution','Only a large least count'],0,'Good measurement aims for both accuracy and precision.'],['Which statement is correct?',['Accuracy and precision are identical','A measurement can be precise without being accurate','A measurement can never be accurate without being precise','Precision removes systematic error'],1,'A systematic bias can produce precise but inaccurate readings.'],['Repeated readings are 5.21, 5.20, 5.21 and 5.20 cm, while the accepted value is 5.80 cm. They are:',['Precise but inaccurate','Accurate but imprecise','Both accurate and precise','Random and exact'],0,'The readings are tightly clustered but far from the accepted value.'],['A useful way to reduce random error is to:',['Take repeated measurements and use an appropriate average','Change the unit','Ignore readings','Increase systematic bias'],0,'Repeated observations help reduce the effect of random fluctuations.'],['A systematic error can be detected by:',['Comparing with a calibrated standard','Taking only one reading','Using fewer observations','Rounding every reading'],0,'A calibrated reference can reveal a consistent offset.'],['Values very close to the accepted value but widely scattered are:',['Accurate on average but not precise','Precise but inaccurate','Both highly precise and inaccurate','Always exact'],0,'Accuracy and precision measure different aspects of measurement quality.'],['High precision implies that:',['Repeated measurements are closely grouped','Every measurement equals the true value','There is no uncertainty','Zero error is impossible'],0,'High precision means low spread; it does not guarantee accuracy.'],['Which statement best distinguishes accuracy and precision?',['Accuracy concerns closeness to true value; precision concerns repeatability','Accuracy means more decimal places; precision means fewer','Both depend only on the SI unit','Neither matters in experiments'],0,'This distinction is fundamental in experimental physics.']];let i=0,selected=-1,score=0;const $=id=>document.getElementById(id);function render(){const a=qs[i];selected=-1;$('count').textContent=`Question ${i+1} of ${qs.length}`;$('question').textContent=a[0];$('options').innerHTML='';$('feedback').textContent='';$('feedback').className='feedback';$('hint').textContent='Choose the best answer.';$('check').disabled=true;$('next').disabled=true;$('next').style.display='inline-block';a[1].forEach((text,j)=>{const b=document.createElement('button');b.textContent=`${String.fromCharCode(65+j)}. ${text}`;b.onclick=()=>{selected=j;[...$('options').children].forEach((x,k)=>x.classList.toggle('selected',k===j));$('check').disabled=false};$('options').appendChild(b)});$('fill').style.width=`${i/qs.length*100}%`}$('check').onclick=()=>{if(selected<0)return;const a=qs[i],ok=selected===a[2];[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===selected&&!ok)b.classList.add('wrong')});if(ok){score++;$('xp').textContent=score*10;$('feedback').className='feedback';$('feedback').textContent='✅ Correct! +10 XP — '+a[3]}else{$('feedback').className='feedback';$('feedback').textContent='❌ Not quite. Correct answer: '+a[1][a[2]]+' — '+a[3]}$('check').disabled=true;$('next').disabled=false;$('fill').style.width=`${(i+1)/qs.length*100}%`};$('next').onclick=()=>{if(i<qs.length-1){i++;render()}else{$('question').textContent='🎉 Skill complete!';$('options').innerHTML='';$('check').style.display='none';$('next').style.display='none';$('feedback').textContent=`You scored ${score} / ${qs.length} • ${score*10} XP`;$('result').style.display='block';$('score').textContent=`${score} / ${qs.length} correct`;$('fill').style.width='100%'}};$('retry').onclick=()=>{i=0;score=0;$('xp').textContent='0';$('result').style.display='none';$('check').style.display='inline-block';render()};render();</script></body></html>
