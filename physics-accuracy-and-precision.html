<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Accuracy and Precision</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.xp{font-weight:800}.card{background:white;border-radius:22px;padding:24px;margin-top:18px;box-shadow:0 5px 20px #00000012}.bar{height:10px;background:#e8eaf0;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.3s}.q{font-size:1.3rem;font-weight:750;line-height:1.45}.opts{display:grid;gap:10px;margin-top:18px}.opts button{padding:15px;border:2px solid #e2e5eb;border-radius:14px;background:white;text-align:left;font-size:1rem;cursor:pointer;transition:.2s}.opts button:hover{border-color:#58cc02;transform:translateY(-1px)}.opts button.selected{border-color:#58cc02;background:#f3fff0}.opts button.correct{border-color:#58cc02;background:#eaffef}.opts button.wrong{border-color:#e5484d;background:#fff0f0}.feedback{font-weight:700;margin-top:16px;min-height:24px}.btn{margin-top:18px;padding:13px 22px;border:0;border-radius:14px;background:#58cc02;color:white;font-weight:800;cursor:pointer;transition:.2s;box-shadow:0 4px 0 #45a800}.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #45a800}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #45a800}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}.back{display:inline-flex;align-items:center;gap:7px;margin-top:20px;padding:12px 18px;border:2px solid #5146a5;border-radius:14px;background:white;color:#5146a5;font-weight:800;text-decoration:none;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,background .2s,color .2s}.back:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#eeeaff,transparent);transform:translateX(-120%);transition:transform .5s}.back:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 6px 18px #5146a533;background:#faf9ff;color:#40378d}.back:hover:before{transform:translateX(120%)}.back:active{transform:translateY(1px) scale(.99);box-shadow:0 2px 8px #5146a522}.back:focus-visible{outline:3px solid #c9c3ff;outline-offset:3px}@media(max-width:600px){.wrap{padding:18px 12px}.card{padding:18px}.q{font-size:1.15rem}.top{align-items:flex-start}.back{width:max-content}}</style></head><body><main class="wrap"><div class="top"><h1>🎯 Accuracy and Precision</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></div><p>Master accuracy, precision, errors and measurement quality with 15 NEET-style questions.</p><section class="card"><div><strong>🎯 Skill Mastery</strong> <span id="masteryText">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div id="count"></div><p id="question" class="q"></p><div id="options" class="opts"></div><button id="check" class="btn" disabled>Check Answer</button><button id="next" class="btn" disabled>Continue →</button><div id="feedback" class="feedback"></div><p>💡 <span id="hint">Choose the best answer.</span></p><div id="result" style="display:none;text-align:center"><h2>🎉 Accuracy &amp; Precision mastered!</h2><p id="score"></p><button id="retry" class="btn">Retry Skill</button></div></section><a class="back" href="physics-home.html" aria-label="Back to Physics Path">← <span>Back to Physics Path</span></a></main><script>const qs=[['What is accuracy?',['Closeness of a measured value to the true value','Closeness of repeated values to each other','Smallest scale division','Number of significant figures'],0,'Accuracy describes closeness to the true value.'],['What is precision?',['Closeness to the true value','Closeness of repeated measurements to one another','Absence of all systematic error','Size of the instrument'],1,'Precision describes repeatability.'],['Readings close to one another but far from the true value are:',['Accurate and precise','Precise but not accurate','Accurate but not precise','Neither'],1,'The readings are consistent but biased.'],['Readings scattered around the true value are:',['Accurate on average but not precise','Precise but inaccurate','Both precise and inaccurate','Neither'],0,'The average may be accurate while the spread is large.'],['Which error mainly shifts all readings in one direction?',['Random error','Systematic error','Resolution','Rounding error'],1,'Systematic error introduces a consistent bias.'],['Random error mainly affects:',['Precision','The SI unit','Dimensions','Instrument colour'],0,'Random fluctuations increase the spread.'],['A balance repeatedly reads 100.8 g for an object whose accepted mass is 100.0 g. The readings are:',['Precise but not accurate','Accurate but not precise','Both accurate and precise','Neither'],0,'They are repeatable but biased.'],['A good measuring instrument should ideally have:',['High accuracy and high precision','Low accuracy and low precision','High error and low resolution','Only a large least count'],0,'Good measurement aims for both.'],['Which statement is correct?',['Accuracy and precision are identical','A measurement can be precise without being accurate','A measurement can never be accurate without being precise','Precision removes systematic error'],1,'A biased instrument can be precise but inaccurate.'],['Readings 5.21, 5.20, 5.21 and 5.20 cm are compared with accepted value 5.80 cm. They are:',['Precise but inaccurate','Accurate but imprecise','Both accurate and precise','Random and exact'],0,'They are tightly clustered but far from the accepted value.'],['A useful way to reduce random error is to:',['Take repeated measurements and use an appropriate average','Change the unit','Ignore readings','Increase systematic bias'],0,'Repeated measurements reduce random fluctuations.'],['A systematic error can be detected by:',['Comparing with a calibrated standard','Taking only one reading','Using fewer observations','Rounding every reading'],0,'A calibrated reference can reveal bias.'],['Values close to the accepted value but widely scattered are:',['Accurate on average but not precise','Precise but inaccurate','Both highly precise and inaccurate','Always exact'],0,'Closeness and spread are different properties.'],['High precision implies that:',['Repeated measurements are closely grouped','Every measurement equals the true value','There is no uncertainty','Zero error is impossible'],0,'High precision means low spread, not necessarily accuracy.'],['Which statement best distinguishes accuracy and precision?',['Accuracy concerns closeness to true value; precision concerns repeatability','Accuracy means more decimal places; precision means fewer','Both depend only on the SI unit','Neither matters in experiments'],0,'This distinction is fundamental in experimental physics.']];let i=0,selected=-1,score=0,answered=0;const $=id=>document.getElementById(id);function updateProgress(){answered=Math.max(answered,i);$('masteryText').textContent=answered+' / '+qs.length;$('fill').style.width=(answered*100/qs.length)+'%'}function render(){const a=qs[i];selected=-1;$('count').textContent=`Question ${i+1} of ${qs.length}`;$('question').textContent=a[0];$('options').innerHTML='';$('feedback').textContent='';$('hint').textContent='Choose the best answer.';$('check').disabled=true;$('next').disabled=true;a[1].forEach((t,j)=>{const b=document.createElement('button');b.textContent=`${String.fromCharCode(65+j)}. ${t}`;b.onclick=()=>{selected=j;[...$('options').children].forEach((x,k)=>x.classList.toggle('selected',k===j));$('check').disabled=false};$('options').appendChild(b)})}function checkAnswer(){if(selected<0)return;const a=qs[i],ok=selected===a[2];[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=ok?'✅ Correct! +10 XP — '+a[3]:'❌ Not quite. Correct answer: '+a[1][a[2]]+' — '+a[3];if(ok){score++;$('xp').textContent=score*10}answered=Math.max(answered,i+1);updateProgress();$('check').disabled=true;$('next').disabled=false}function finish(){$('question').textContent='🎉 Skill complete!';$('options').innerHTML='';$('check').style.display='none';$('next').style.display='none';$('feedback').textContent=`You scored ${score} / ${qs.length} • ${score*10} XP`;$('hint').textContent=score===15?'Excellent! Perfect accuracy and precision mastery.':'Keep practicing and try again to improve your score.';answered=15;updateProgress();$('result').style.display='block';$('score').textContent=`${score} / ${qs.length} correct`;$('fill').style.width='100%'}$('check').onclick=checkAnswer;$('next').onclick=()=>{if(i<qs.length-1){i++;render()}else finish()};$('retry').onclick=()=>{i=0;selected=-1;score=0;answered=0;$('xp').textContent='0';$('result').style.display='none';$('check').style.display='inline-block';$('next').style.display='inline-block';updateProgress();render()};updateProgress();render();</script></body></html>
