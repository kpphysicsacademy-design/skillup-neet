<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Adiabatic Process — 15 MCQ Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#203040;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:22px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:#123b70}.xp{font-weight:950;color:#1677ff}.hero{margin-top:14px;background:linear-gradient(135deg,#123b70,#1677ff);color:#fff;border-radius:24px;padding:22px}.hero h1{margin:5px 0 7px;font-size:clamp(28px,6vw,40px)}.hero p{margin:0;line-height:1.5;font-size:13px}.card{background:#fff;border:1px solid #d9e5f2;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 7px 20px rgba(18,59,112,.07)}.bar{height:10px;background:#e5edf6;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;width:0;background:#1677ff;transition:.3s}.qno{font-size:12px;color:#6b7280;font-weight:900}.q{font-size:20px;font-weight:900;line-height:1.4;margin:9px 0 16px}button.opt{display:block;width:100%;text-align:left;background:#fff;color:#203040;border:2px solid #dfe8f1;border-radius:14px;padding:14px;margin:10px 0;font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}button.opt.selected{border-color:#1677ff;background:#eef6ff;color:#123b70}button.opt.correct{border-color:#16803a;background:#eaf8ef;color:#145c2e}button.opt.wrong{border-color:#d64545;background:#fff0f0;color:#8f2020}button.continue{border:0;border-radius:13px;padding:12px 20px;background:#1677ff;color:#fff;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #0d5bbf}button.continue:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}.actions{display:flex;justify-content:flex-end;margin-top:15px}.feedback{min-height:25px;margin-top:13px;font-weight:800}.explain{margin-top:6px;color:#596774;font-weight:600}.back{display:block;width:max-content;margin:18px auto 0;padding:10px 15px;border:2px solid #d9e5f2;border-radius:12px;background:#fff;color:#1264d6;text-decoration:none;font-weight:900}.result{text-align:center}.score{font-size:34px;font-weight:950;color:#123b70}@media(max-width:520px){.wrap{padding:15px 10px 50px}.q{font-size:18px}button.opt{font-size:14px;padding:13px}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div class="brand">⚛️ SkillUp Physics<br><small>NEET 2026 • 15 MCQ QUIZ</small></div><div class="xp" id="xp">XP: 0</div></div>
<section class="hero"><div>🔥 THERMODYNAMICS</div><h1>Adiabatic Process</h1><p>15-question MCQ quiz. Test your understanding of zero heat exchange, work, internal energy and adiabatic relations for ideal gases.</p></section>
<section class="card"><strong>🏆 Quiz Progress <span id="mastery">0 / 15</span></strong><div class="bar"><div class="fill" id="fill"></div></div></section>
<section class="card" id="quiz"><div class="qno" id="qno"></div><div class="q" id="question"></div><div id="opts"></div><div class="actions"><button class="continue" id="continue" type="button" disabled>Check Answer →</button></div><div class="feedback" id="feedback"></div></section>
<section class="card result" id="result" hidden></section>
<a class="back" href="physics-home-fast.html">← 📚 Back to Physics Path</a>
</main>
<script>
const questions=[
{q:'In an adiabatic process, the heat exchanged by the system is',o:['maximum','zero','equal to work','always negative'],a:1,e:'For an adiabatic process, Q = 0. There is no heat exchange with the surroundings.'},
{q:'For a reversible adiabatic process of an ideal gas, which relation is correct?',o:['PV = constant','PV^γ = constant','P/T = constant','V/T = constant'],a:1,e:'For a reversible adiabatic process, PV^γ = constant, where γ = Cp/Cv.'},
{q:'During adiabatic expansion of an ideal gas, its temperature generally',o:['increases','decreases','remains constant','becomes infinite'],a:1,e:'The gas does work without receiving heat, so its internal energy and temperature decrease.'},
{q:'During adiabatic compression of an ideal gas, its temperature generally',o:['decreases','increases','remains zero','cannot change'],a:1,e:'Work is done on the gas, increasing its internal energy and temperature.'},
{q:'For an adiabatic process, the first law with the convention Q = ΔU + W gives',o:['ΔU = W','Q = W','Q = 0 and ΔU = −W','ΔU = 0'],a:2,e:'Since Q = 0, 0 = ΔU + W, so ΔU = −W.'},
{q:'The value of γ for a monatomic ideal gas is',o:['7/5','5/3','4/3','3/2'],a:1,e:'For a monatomic ideal gas, Cv = 3R/2 and Cp = 5R/2, giving γ = 5/3.'},
{q:'The value of γ for a diatomic ideal gas at ordinary temperatures is approximately',o:['5/3','7/5','4/3','9/5'],a:1,e:'For a diatomic gas with five active degrees of freedom, γ = 7/5.'},
{q:'For a reversible adiabatic expansion, the work done by the gas comes primarily from',o:['heat absorbed','decrease in internal energy','increase in mass','increase in pressure'],a:1,e:'Because Q = 0, the energy needed for work comes from the gas internal energy, so ΔU is negative.'},
{q:'For a reversible adiabatic process, another useful relation is',o:['TV^(γ−1) = constant','T/V = constant','TP = constant','T + V = constant'],a:0,e:'For an ideal gas undergoing a reversible adiabatic process, TV^(γ−1) remains constant.'},
{q:'Compared with an isothermal expansion between the same initial and final volumes, an adiabatic expansion curve on a P–V diagram is',o:['less steep','steeper','horizontal','vertical'],a:1,e:'The adiabatic curve P ∝ V^−γ is steeper than the isothermal curve P ∝ V^−1 because γ > 1.'},
{q:'In an adiabatic expansion of an ideal gas, the pressure',o:['increases','decreases','must remain constant','becomes exactly zero'],a:1,e:'Both pressure and temperature fall as the gas expands adiabatically.'},
{q:'If an ideal gas is compressed adiabatically and work is done on it, its internal energy',o:['increases','decreases','remains constant','becomes zero'],a:0,e:'With Q = 0, work done on the gas increases its internal energy.'},
{q:'For a reversible adiabatic process, γ is defined as',o:['Cv/Cp','Cp/Cv','Cp + Cv','Cp − Cv'],a:1,e:'The adiabatic index is γ = Cp/Cv.'},
{q:'A process can be approximately adiabatic when',o:['heat exchange is negligible during the process','temperature is always constant','pressure is constant','the gas is at rest forever'],a:0,e:'A rapid process or good thermal insulation can make heat transfer negligible compared with the energy change.'},
{q:'For a reversible adiabatic process of an ideal gas, if volume increases, which pair changes in the same direction?',o:['Pressure and temperature both decrease','Pressure increases and temperature decreases','Pressure decreases and temperature increases','Pressure and temperature both increase'],a:0,e:'During reversible adiabatic expansion, both P and T decrease as V increases.'}
];
let i=0,selected=null,checked=false,score=0;const $=id=>document.getElementById(id);
function render(){selected=null;checked=false;$('feedback').textContent='';$('continue').disabled=true;$('continue').textContent=i===14?'Finish Quiz →':'Check Answer →';$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=questions[i].q;$('opts').innerHTML='';questions[i].o.forEach((text,n)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+n)+'. '+text;b.onclick=()=>{if(checked)return;selected=n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('continue').disabled=false};b.dataset.index=n;$('opts').appendChild(b)});$('mastery').textContent=`${i} / 15`;$('fill').style.width=`${i/15*100}%`;$('xp').textContent=`XP: ${score*10}`}
function next(){if(selected===null)return;if(!checked){checked=true;const item=questions[i],ok=selected===item.a;if(ok)score++;document.querySelectorAll('.opt').forEach(b=>{const n=+b.dataset.index;b.disabled=true;if(n===item.a)b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+`<div class="explain">${item.e}</div>`;$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=`${(i+1)/15*100}%`;$('xp').textContent=`XP: ${score*10}`}else if(i<14){i++;render()}else finish()}
function finish(){$('quiz').hidden=true;$('result').hidden=false;const pct=Math.round(score/15*100);$('result').innerHTML=`<h2>🎉 Adiabatic Process Complete!</h2><div class="score">${score} / 15</div><p><strong>${pct}%</strong> accuracy</p><p>🏆 You earned <strong>${score*10} XP</strong>.</p><p>${score>=12?'🔥 Excellent NEET readiness!':score>=9?'💪 Good work. Revise and retry for mastery.':'📚 Revise adiabatic processes and try again.'}</p><button class="continue" type="button" onclick="location.reload()">Retry 15 MCQs</button>`}
$('continue').onclick=next;render();
</script>
</body>
</html>
