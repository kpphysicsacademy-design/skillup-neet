<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Ampere's Law</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>⚡ Ampere's Law</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['Ampere’s circuital law for steady currents is expressed as','∮B·dl=μ₀I_enclosed','∮B·dl=0 always','B=μ₀I/r²','∮E·dl=μ₀I',0,'Ampere’s law states that the closed line integral of magnetic field is μ₀ times the enclosed current.'],['The SI unit of μ₀ is','T m/A','A/T m','N/C','J/C',0,'The permeability of free space has unit T·m/A, equivalently N/A².'],['For an infinitely long straight current-carrying wire, Ampere’s law gives','B=μ₀I/(2πr)','B=μ₀Ir/(2π)','B=μ₀I/r²','B=2πμ₀Ir',0,'Using a circular Amperian loop, B(2πr)=μ₀I, hence B=μ₀I/(2πr).'],['For a long straight wire, magnetic field varies with distance r as','r','1/r','r²','1/r²',1,'B=μ₀I/(2πr), so B is inversely proportional to r.'],['If current in a long straight wire is doubled, the magnetic field at fixed r','halves','doubles','becomes four times','is unchanged',1,'For fixed r, B is directly proportional to current I.'],['Ampere’s law is especially useful when the current distribution has','high symmetry','no symmetry','zero current only','changing charge only',0,'The law is always valid for steady currents, but symmetry makes it convenient for calculating B.'],['The Amperian loop for an infinitely long straight wire is usually chosen as','a circle centered on the wire','a square far away','a line parallel to wire','a random curve',0,'Circular symmetry makes B constant on a circular path centered on the wire.'],['For a long solenoid with n turns per unit length carrying current I, the magnetic field inside is','μ₀nI','μ₀I/n','μ₀n/I','nI/μ₀',0,'For an ideal long solenoid, B=μ₀nI inside.'],['The magnetic field inside an ideal long solenoid is approximately','uniform and parallel to its axis','zero everywhere','radial and nonuniform','perpendicular to its axis everywhere',0,'For an ideal long solenoid, the internal field is nearly uniform and axial.'],['For an ideal toroid with N turns carrying current I, field at radius r inside its core is','μ₀NI/(2πr)','μ₀Ir/(2πN)','2πμ₀r/(NI)','μ₀N/(2πIr)',0,'Ampere’s law gives B(2πr)=μ₀NI, so B=μ₀NI/(2πr).'],['Outside an ideal toroid, the magnetic field is approximately','zero','maximum','μ₀NI/(2πr)','always uniform',0,'For an ideal toroid, the net enclosed current is zero outside the toroid, giving negligible external field.'],['A circular Amperian path encloses twice the current. Compared with enclosing current I, the value of ∮B·dl is','unchanged','doubled','halved','four times',1,'The circulation equals μ₀I_enclosed, so doubling enclosed current doubles the circulation.'],['A 10 A current passes through a surface. The circulation ∮B·dl in vacuum is approximately','1.26×10⁻⁵ T·m','1.26×10⁻⁶ T·m','1.26×10⁻⁴ T·m','1.26×10⁻³ T·m',0,'μ₀I=4π×10⁻⁷×10≈1.26×10⁻⁵ T·m.'],['For a long solenoid, increasing turns per unit length while keeping I fixed makes B','increase','decrease','unchanged','zero',0,'B=μ₀nI, so the field increases with turns per unit length n.'],['Ampere’s law in magnetostatics relates the circulation of B to','enclosed steady current','electric potential only','mass enclosed','temperature',0,'For steady currents, ∮B·dl=μ₀I_enclosed.']];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent=''}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});if(ok){score++;$('xp').textContent='✨ Correct! +1 XP'}else $('xp').textContent='❌ Incorrect. '+q[6];$('score').textContent=`XP ${score}`;$('next').classList.remove('hide')}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('next').onclick=next;render();</script></body></html>
