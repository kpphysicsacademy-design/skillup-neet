<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Amplitude</title><style>body{font-family:Arial,sans-serif;background:#f3f7ff;margin:0;color:#1e293b}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(30,41,59,.10);border:1px solid #e2e8f0}h1{text-align:center;color:#334155}.meta{display:flex;justify-content:space-between;font-weight:700;color:#475569}.bar{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#22c55e;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;color:#172033}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe4f0;border-radius:14px;background:#fff;color:#1e293b;font-size:16px;cursor:pointer;transition:.2s}.opt:hover{background:#eef5ff;border-color:#93c5fd;transform:translateY(-1px)}.opt:focus-visible{outline:3px solid #bfdbfe;outline-offset:2px}.correct{border-color:#16a34a!important;background:#ecfdf3!important;color:#166534!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important;color:#991b1b!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s}.next,.retry{background:#4f46e5;color:#fff}.next:hover,.retry:hover{background:#4338ca}.back{background:#334155;color:#fff}.back:hover{background:#1e293b}.hide{display:none}.xp{text-align:center;font-weight:700;color:#d97706;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>📏 Amplitude</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['In SHM, amplitude is defined as the','maximum displacement from the mean position','minimum displacement','average displacement','distance travelled in one second',0,'Amplitude A is the maximum magnitude of displacement from the mean or equilibrium position.'],
['The SI unit of amplitude of displacement is','second','hertz','metre','radian',2,'When amplitude represents displacement, its SI unit is metre (m).'],
['For x = A cos(ωt + φ), A represents the','angular frequency','amplitude','phase','time period',1,'In the standard SHM equation, A is the amplitude.'],
['If a particle oscillates between x = −4 cm and x = +4 cm, its amplitude is','2 cm','4 cm','8 cm','16 cm',1,'Amplitude is the maximum displacement from equilibrium, so A = 4 cm.'],
['The total range of displacement in SHM from one extreme to the other is','A','2A','A/2','4A',1,'The particle moves from −A to +A, giving a total displacement range of 2A.'],
['At the mean position of SHM, the displacement is','A','−A','0','2A',2,'The mean or equilibrium position is x = 0.'],
['At either extreme position, the magnitude of displacement is','0','A/2','A','2A',2,'The extreme positions correspond to x = +A and x = −A.'],
['If the amplitude of an SHM is doubled while frequency remains unchanged, its maximum displacement becomes','half','unchanged','double','four times',2,'Maximum displacement magnitude equals amplitude, so doubling A doubles it.'],
['If x = 6 sin(ωt) cm, the amplitude is','3 cm','6 cm','12 cm','36 cm',1,'The coefficient of the sine function is the amplitude: A = 6 cm.'],
['A particle has amplitude 0.20 m. Its maximum displacement magnitude from equilibrium is','0.10 m','0.20 m','0.40 m','2.0 m',1,'Maximum displacement magnitude is equal to amplitude.'],
['Which statement about amplitude in ideal SHM is correct?','It changes randomly with time','It remains constant for an ideal undamped oscillator','It is always zero','It equals the frequency',1,'For ideal undamped SHM, amplitude remains constant.'],
['If the maximum and minimum positions are +10 cm and −10 cm, the amplitude is','5 cm','10 cm','20 cm','100 cm',1,'The mean position is midway at zero, so the maximum distance from mean is 10 cm.'],
['For x = A cos(ωt), the maximum possible value of x is','−A','0','A','2A',2,'Since cos(ωt) ranges from −1 to +1, maximum x is +A.'],
['For x = A cos(ωt), the minimum possible value of x is','−A','0','A','2A',0,'The minimum occurs when cos(ωt) = −1, giving x = −A.'],
['If the amplitude is 5 cm, the maximum speed in SHM is proportional to','5 cm only','ωA','A/ω','1/A',1,'For SHM, maximum speed is v_max = ωA, so it is proportional to ωA.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
