<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Angular Acceleration</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-size:1.6rem;font-weight:900}.subtitle{color:#5f6b7a;margin:0 0 18px}.xp,.card{background:#fff;border-radius:20px;box-shadow:0 6px 20px #17203312}.xp{padding:10px 15px;font-weight:850}.card{padding:20px;margin:12px 0}.ph{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:11px;background:#dfe8f1;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.25s}.qnum{font-weight:800;color:#35516f;margin-bottom:11px}.question{font-size:1.27rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#58cc02;background:#f7fff1;transform:translateY(-1px)}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;background:#2db84d;color:#fff;font-weight:850;cursor:pointer;box-shadow:0 4px 0 #21863a;transition:.12s}.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #21863a}.feedback{margin-top:14px;padding:12px;border-radius:13px;font-weight:700;min-height:18px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:10px;padding:10px 13px;border:2px solid #d9d4f5;border-radius:13px;color:#5146a5;font-weight:800;text-decoration:none;transition:.12s}.back:hover{background:#f0edff;transform:translateX(-2px)}.back:focus{outline:3px solid #c9c2ff;outline-offset:2px}.back:active{transform:translateY(1px)}@media(max-width:600px){.wrap{padding:20px 14px}.title{font-size:1.4rem}.question{font-size:1.12rem}}</style></head><body><main class="wrap"><div class="top"><div class="title">🔄 Angular Acceleration</div><div class="xp">⚡ <span id="xp">0</span> XP</div></div><p class="subtitle">Physics • NEET 2026 · Learn → Practice → Master</p><section class="card"><div class="ph"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><button class="btn" id="continue">Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const quiz=[['Angular acceleration is the rate of change of:', ['angular velocity','angular displacement','linear velocity','angular momentum'],0,'Angular acceleration is α = Δω/Δt.'],['The SI unit of angular acceleration is:', ['rad s⁻²','rad s⁻¹','m s⁻²','N m⁻¹'],0,'The SI unit is radian per second squared.'],['The average angular acceleration is given by:', ['(ω₂−ω₁)/Δt','(ω₂+ω₁)Δt','Δt/(ω₂−ω₁)','ω₂ω₁/Δt'],0,'Angular acceleration equals change in angular velocity divided by time.'],['A wheel changes its angular velocity from 2 to 8 rad s⁻¹ in 3 s. Its angular acceleration is:', ['2 rad s⁻²','6 rad s⁻²','10 rad s⁻²','18 rad s⁻²'],0,'α = (8−2)/3 = 2 rad s⁻².'],['If angular velocity is constant, angular acceleration is:', ['zero','maximum','negative always','infinite'],0,'No change in angular velocity means α = 0.'],['For constant angular acceleration, the angular velocity is:', ['ω = ω₀ + αt','ω = ω₀ − α/t','ω = α/t','ω = ω₀t²'],0,'This is the rotational analogue of v = u + at.'],['For constant angular acceleration, angular displacement is:', ['θ = ω₀t + ½αt²','θ = ω₀/t + αt','θ = αt/2','θ = ω₀ + αt²'],0,'The standard equation is θ = ω₀t + ½αt².'],['The rotational equation analogous to v² = u² + 2as is:', ['ω² = ω₀² + 2αθ','ω = ω₀² + 2αθ','ω² = ω₀² + αθ','ω² = 2αt'],0,'For constant α, ω² = ω₀² + 2αθ.'],['A body starts from rest with angular acceleration 4 rad s⁻². Its angular velocity after 5 s is:', ['20 rad s⁻¹','9 rad s⁻¹','1.25 rad s⁻¹','40 rad s⁻¹'],0,'ω = 0 + 4×5 = 20 rad s⁻¹.'],['A rotating body has ω = 10 rad s⁻¹ and α = 2 rad s⁻². Its angular velocity after 4 s is:', ['18 rad s⁻¹','12 rad s⁻¹','8 rad s⁻¹','40 rad s⁻¹'],0,'ω = 10 + 2×4 = 18 rad s⁻¹.'],['If angular velocity decreases uniformly with time, angular acceleration is:', ['negative','positive','zero','undefined'],0,'With the usual positive direction, a decreasing angular velocity gives negative α.'],['The tangential acceleration of a particle at radius r is related to angular acceleration by:', ['aₜ = rα','aₜ = α/r','aₜ = r/α','aₜ = rα²'],0,'Tangential acceleration is aₜ = rα.'],['A disc has angular acceleration 3 rad s⁻² and radius 0.5 m. Tangential acceleration at its rim is:', ['1.5 m s⁻²','6 m s⁻²','0.167 m s⁻²','3.5 m s⁻²'],0,'aₜ = rα = 0.5×3 = 1.5 m s⁻².'],['Angular acceleration is a vector quantity whose direction is along the:', ['rotation axis','tangent only','radial line only','velocity vector always'],0,'Angular acceleration is directed along the rotation axis according to the sign/direction of change of angular velocity.'],['A body changes angular velocity from 12 rad s⁻¹ to 0 in 6 s. Its angular acceleration is:', ['−2 rad s⁻²','+2 rad s⁻²','−12 rad s⁻²','0.5 rad s⁻²'],0,'α = (0−12)/6 = −2 rad s⁻².']];let i=0,selected=-1,checked=false,score=0;const $=id=>document.getElementById(id),o=$("options"),b=$("continue"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;$("count").textContent='Question '+(i+1)+' of 15';$("question").textContent=a[0];o.innerHTML='';f.className='feedback';f.textContent='';b.style.display='inline-block';b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const el=document.createElement('button');el.className='option';el.textContent=String.fromCharCode(65+j)+'. '+item.text;el.dataset.index=item.index;el.onclick=()=>{selected=item.index;[...o.children].forEach(z=>z.classList.remove('selected'));el.classList.add('selected')};o.appendChild(el)})}b.onclick=()=>{if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(el=>{const n=Number(el.dataset.index);el.disabled=true;if(n===a[2])el.classList.add('correct');if(n===selected&&!ok)el.classList.add('wrong')});if(ok)score++;f.className=ok?'feedback good':'feedback bad';f.textContent=(ok?'🎯 Correct! +10 XP — ':'✗ Review — Correct answer: '+a[1][a[2]]+'. ')+a[3];$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$("question").textContent='🏆 Angular Acceleration Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script><
