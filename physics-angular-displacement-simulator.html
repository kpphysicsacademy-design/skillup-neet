<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Interactive angular displacement simulator. Rotate a pointer and explore degrees and radians."><title>Angular Displacement Simulator | SkillUp Physics</title><style>:root{--ink:#243447;--muted:#64748b;--line:#dce6ef;--bg:#f3f9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#fff;border-bottom:1px solid var(--line)}.nav{max-width:760px;margin:auto;padding:13px 16px;font-weight:900;color:#174a78}main{max-width:760px;margin:auto;padding:18px 14px 45px}.card{background:#fff;border:1.5px solid #e2edf7;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 0 #dce8f3}h1{margin:0 0 6px;color:#174a78;font-size:clamp(24px,5vw,32px)}.muted{color:var(--muted);font-size:14px;line-height:1.5}.dial{width:min(100%,340px);display:block;margin:8px auto}.controls{display:grid;gap:12px}.controls label{font-weight:800}.controls input{width:100%;accent-color:#58cc02}.readings{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.reading{background:#f0f8ff;border-radius:13px;padding:13px}.reading small{display:block;color:#64748b;font-weight:750}.reading strong{font-size:21px;color:#174a78}.btn{border:0;border-radius:11px;background:#58cc02;color:#fff;padding:11px 16px;font-weight:850;cursor:pointer}@media(max-width:480px){main{padding:12px 10px}.card{padding:15px}}</style><style>.page-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 16px}.page-tab{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:8px 6px;border:1.5px solid #dbe7d4;border-radius:12px;background:#fff;color:#365b38;text-decoration:none;font-size:13px;font-weight:750;box-shadow:0 2px 0 #e5eddf;white-space:nowrap}.tab-icon{width:19px;height:19px;flex:0 0 19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.page-tab.active{background:#dff8b8;border-color:#8bcf45;color:#245b18;box-shadow:0 2px 0 #acd977}</style></head><body><header><div class="nav">SkillUp Physics</div></header><main><nav class="page-tabs" aria-label="Angular displacement pages"><a class="page-tab " href="physics-angular-displacement.html" ><svg class="tab-icon" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 0 4 22zM4 5.5v14A2.5 2.5 0 0 1 6.5 17H20M8 7h8"/></svg><span>Learn</span></a><a class="page-tab active" href="physics-angular-displacement-simulator.html" aria-current="page"><svg class="tab-icon" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M7 15l4-5 3 2 5-7M16 5h3v3"/></svg><span>Simulate</span></a><a class="page-tab " href="physics-angular-displacement-practice.html" ><svg class="tab-icon" viewBox="0 0 24 24"><path d="M9 5h11M9 12h11M9 19h11M3 5l1.5 1.5L7 4M3 12l1.5 1.5L7 11M3 19l1.5 1.5L7 18"/></svg><span>Practice</span></a></nav><section class="card"><h1>Angular Displacement Simulator</h1><p class="muted">Rotate the pointer to see angular position, direction and radian conversion update live.</p></section><section class="card"><svg class="dial" viewBox="0 0 320 320" role="img" aria-label="Circular angle dial"><circle cx="160" cy="160" r="118" fill="#f5fbff" stroke="#b8cad9" stroke-width="2"/><path d="M160 25V295M25 160H295" stroke="#d6e2eb" stroke-dasharray="4 5"/><path id="arc" d="" fill="none" stroke="#58cc02" stroke-width="8" stroke-linecap="round"/><line id="pointer" x1="160" y1="160" x2="278" y2="160" stroke="#174a78" stroke-width="5" stroke-linecap="round"/><circle cx="160" cy="160" r="7" fill="#174a78"/><text x="160" y="15" text-anchor="middle" font-size="12" fill="#64748b">90°</text><text x="306" y="164" text-anchor="end" font-size="12" fill="#64748b">0°</text><text x="160" y="314" text-anchor="middle" font-size="12" fill="#64748b">270°</text></svg><div class="controls"><label for="angle">Final angular position: <output id="deg">90°</output></label><input id="angle" type="range" min="-360" max="720" value="90" step="1"><label for="initial">Initial angular position: <output id="initialValue">0°</output></label><input id="initial" type="range" min="-360" max="360" value="0" step="1"></div></section><section class="card"><div class="readings"><div class="reading"><small>Angular displacement</small><strong id="delta">+90°</strong></div><div class="reading"><small>In radians</small><strong id="rad">π/2</strong></div><div class="reading"><small>Direction</small><strong id="direction">Anticlockwise</strong></div><div class="reading"><small>Revolutions</small><strong id="turns">0.250</strong></div></div><p class="muted" id="working">Δθ = 90° − 0° = +90°</p><button class="btn" id="reset">Reset simulation</button></section></main><script>(()=>{const $=id=>document.getElementById(id),a=$('angle'),i=$('initial');function gcd(x,y){return y?gcd(y,x%y):Math.abs(x)}function radText(d){if(!d)return'0';const g=gcd(Math.abs(d),180),p=d/g,q=180/g;return(p>0?'+':'−')+(Math.abs(p)===1?'π':Math.abs(p)+'π')+'/'+q}function update(){const end=+a.value,start=+i.value,d=end-start,t=end*Math.PI/180,x=160+118*Math.cos(t),y=160-118*Math.sin(t);$('pointer').setAttribute('x2',x);$('pointer').setAttribute('y2',y);$('deg').textContent=end+'°';$('initialValue').textContent=start+'°';$('delta').textContent=(d>0?'+':'')+d+'°';$('rad').textContent=radText(d);$('direction').textContent=d>0?'Anticlockwise':d<0?'Clockwise':'No rotation';$('turns').textContent=(Math.abs(d)/360).toFixed(3);$('working').textContent='Δθ = '+end+'° − ('+start+'°) = '+(d>0?'+':'')+d+'°';const r=48,ex=160+r*Math.cos(t),ey=160-r*Math.sin(t),large=Math.abs(d%360)>180?1:0,sweep=d>=0?0:1;$('arc').setAttribute('d','M 208 160 A 48 48 0 '+large+' '+sweep+' '+ex+' '+ey)}a.addEventListener('input',update);i.addEventListener('input',update);$('reset').addEventListener('click',()=>{a.value=90;i.value=0;update()});update()})();</script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="central-config.js"></script><script src="central-auth.js"></script><script>(async function(){if(window.SkillUpAuth){await window.SkillUpAuth.requireAuth(location.href);}})();</script><script src="/skillup-eye-shield.js?v=20261013-eye-shield-v1"></script><script src="/shared-nav.js?v=20261013-no-bottom-nav-v1"></script></body></html>
