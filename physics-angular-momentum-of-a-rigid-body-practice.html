<script>
(function(){
"use strict";
const questions=[{"q":"For a rigid body rotating about a fixed symmetry axis, angular momentum magnitude is:","o":["L = Iω","L = Iα","L = τω","L = mv"],"a":0,"e":"For fixed-axis rotation about a symmetry axis, L = Iω, with I measured about that same axis."},{"q":"What is the SI unit of angular momentum?","o":["kg m/s","kg m²/s","N m","kg m²"],"a":1,"e":"Angular momentum has dimensions ML²/T and SI unit kg m²/s (equivalently J s)."},{"q":"Angular momentum is a:","o":["Scalar quantity","Vector quantity","Unitless quantity","Base SI unit"],"a":1,"e":"Angular momentum has magnitude and direction; its direction follows the cross product or right-hand rule."},{"q":"For a particle about a chosen origin, angular momentum is:","o":["r × p","r · p","m/r","p/r"],"a":0,"e":"The vector definition is L = r × p."},{"q":"The magnitude of particle angular momentum is:","o":["rp cosθ","rp sinθ","r/p","p/r"],"a":1,"e":"The magnitude of r × p is rp sinθ, where θ is the angle between r and p."},{"q":"A rigid body has I = 3 kg m² and ω = 4 rad/s about its fixed axis. Its angular momentum magnitude is:","o":["7 kg m²/s","12 kg m²/s","24 kg m²/s","1.33 kg m²/s"],"a":1,"e":"L = Iω = 3 × 4 = 12 kg m²/s."},{"q":"If I = 2 kg m² and angular momentum is 10 kg m²/s, angular speed is:","o":["2 rad/s","5 rad/s","10 rad/s","20 rad/s"],"a":1,"e":"ω = L/I = 10/2 = 5 rad/s."},{"q":"If a rigid body's angular speed doubles while its moment of inertia stays constant, its angular momentum:","o":["Halves","Doubles","Quadruples","Stays unchanged"],"a":1,"e":"With fixed I, L = Iω is directly proportional to ω."},{"q":"If the moment of inertia doubles while angular speed stays constant, angular momentum:","o":["Halves","Doubles","Quadruples","Stays unchanged"],"a":1,"e":"With fixed ω, L is directly proportional to I."},{"q":"For a fixed-axis rigid body with constant I, the torque-angular momentum relation is:","o":["τ = dL/dt","τ = L/t²","τ = I/L","τ = Lω"],"a":0,"e":"Net external torque about the axis equals the time rate of change of angular momentum."},{"q":"When is a system's angular momentum conserved about a chosen point or axis?","o":["When its mass is zero","When net external torque about that point or axis is zero","When kinetic energy is always zero","When all internal forces vanish"],"a":1,"e":"Angular momentum is conserved if the net external torque about the chosen point or axis is zero."},{"q":"A skater pulls their arms inward while spinning with negligible external torque. Their angular speed generally:","o":["Decreases","Increases","Becomes zero","Cannot change"],"a":1,"e":"Pulling the arms inward reduces moment of inertia; conservation of angular momentum makes angular speed increase."},{"q":"A spinning system has initial I = 4 kg m² and ω = 3 rad/s. If I becomes 2 kg m² with no external torque, final ω is:","o":["1.5 rad/s","3 rad/s","6 rad/s","12 rad/s"],"a":2,"e":"Conservation gives I₁ω₁ = I₂ω₂, so ω₂ = (4 × 3)/2 = 6 rad/s."},{"q":"A disc has I = ½MR² and rotates at angular speed ω. Its angular momentum magnitude is:","o":["½MR²ω","MRω","½MRω²","MR²/ω"],"a":0,"e":"Substitute the disc's central-axis moment of inertia into L = Iω."},{"q":"A thin ring of mass M and radius R spins about its central perpendicular axis at ω. Its angular momentum magnitude is:","o":["½MR²ω","MR²ω","2MR²ω","MRω²"],"a":1,"e":"For a thin ring about this axis, I = MR², so L = MR²ω."},{"q":"A uniform solid sphere has I = 2/5 MR² about a diameter. Its spin angular momentum magnitude is:","o":["2/5 MR²ω","½MR²ω","2/3 MR²ω","MR²ω"],"a":0,"e":"For a uniform solid sphere, L = Iω = 2/5 MR²ω."},{"q":"What is the direction of angular momentum for a symmetric body spinning about a fixed symmetry axis?","o":["Always opposite to ω","Along the rotation axis, following the right-hand rule","Always vertically downward","Always perpendicular to the axis"],"a":1,"e":"For fixed-axis rotation about a symmetry axis, L is parallel or antiparallel to ω depending on sign."},{"q":"A particle moves directly toward the origin along a straight line passing through it. Its angular momentum about the origin is:","o":["Maximum","Zero","Infinite","Equal to its mass"],"a":1,"e":"Here r is parallel or antiparallel to p, so r × p = 0."},{"q":"A particle has momentum p = 6 kg m/s perpendicular to a position vector r = 2 m. Its angular momentum magnitude is:","o":["3 kg m²/s","8 kg m²/s","12 kg m²/s","18 kg m²/s"],"a":2,"e":"L = rp sin90° = 2 × 6 = 12 kg m²/s."},{"q":"A particle has r = 3 m, p = 4 kg m/s, and angle θ = 30° between them. Angular momentum magnitude is:","o":["6 kg m²/s","12 kg m²/s","2 kg m²/s","3√3 kg m²/s"],"a":0,"e":"L = rp sinθ = 3 × 4 × ½ = 6 kg m²/s."},{"q":"For a fixed axis and constant moment of inertia, net torque is also equal to:","o":["Iα","I/α","ω/I","Lα"],"a":0,"e":"Since L = Iω for constant I, τ = dL/dt = Iα."},{"q":"A body has angular momentum 15 kg m²/s. If its angular speed is 5 rad/s and the fixed-axis relation applies, its moment of inertia is:","o":["3 kg m²","10 kg m²","20 kg m²","75 kg m²"],"a":0,"e":"I = L/ω = 15/5 = 3 kg m²."},{"q":"The rotational analogue of linear momentum p = mv for fixed-axis rotation is:","o":["L = Iω","τ = Iα","K = ½Iω²","W = τθ"],"a":0,"e":"Moment of inertia plays the analogous role to mass, and angular velocity to linear velocity."},{"q":"Can angular momentum be conserved while rotational kinetic energy changes?","o":["No, never","Yes, if I changes while external torque is zero","Only if the body is at rest","Only when I is infinite"],"a":1,"e":"With L conserved, changing I changes ω; since K = L²/(2I), rotational kinetic energy can change."},{"q":"A rotating disc and a ring are coaxial. The ring is gently placed on the disc and they rotate together. If external torque is negligible, which quantity is conserved during the interaction?","o":["Angular momentum","Angular speed","Moment of inertia","Rotational kinetic energy always"],"a":0,"e":"Negligible external torque means total angular momentum is conserved, though rotational kinetic energy may decrease."},{"q":"For a rigid body with I = 5 kg m² and angular acceleration 2 rad/s² about a fixed axis, net torque is:","o":["2.5 N m","7 N m","10 N m","25 N m"],"a":2,"e":"τ = Iα = 5 × 2 = 10 N m."},{"q":"The dimensions of angular momentum are:","o":["MLT⁻¹","ML²T⁻¹","ML²T⁻²","M⁰L⁰T⁰"],"a":1,"e":"From L = r × p, dimensions are L × (ML/T) = ML²/T."},{"q":"If a system experiences a constant net external torque for time Δt, the change in angular momentum about that axis is:","o":["ΔL = τΔt","ΔL = τ/Δt","ΔL = I/τ","ΔL = τ²Δt"],"a":0,"e":"For constant torque, integrating τ = dL/dt gives ΔL = τΔt."},{"q":"A constant torque of 4 N m acts for 3 s. The angular momentum change about the axis is:","o":["7 kg m²/s","12 kg m²/s","1.33 kg m²/s","24 kg m²/s"],"a":1,"e":"ΔL = τΔt = 4 × 3 = 12 kg m²/s."},{"q":"Which statement is most accurate about L = Iω for a rigid body?","o":["It is a universal vector identity for every axis and shape","It applies directly for rotation about a fixed symmetry/principal axis with I about that axis","It means angular momentum has no direction","It applies only to translating bodies"],"a":1,"e":"For general three-dimensional rotation, L and ω need not be parallel; the simple scalar relation applies for a fixed symmetry/principal axis."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,selected=null,locked=false,wrong=[];
const el=id=>document.getElementById(id);
function render(){
 selected=null;locked=false;const q=questions[index];
 el("progressText").textContent="Question "+(index+1)+" of "+questions.length;
 el("percent").textContent=Math.round(index/questions.length*100)+"%";
 el("bar").style.width=(index/questions.length*100)+"%";
 el("qNumber").textContent="QUESTION "+String(index+1).padStart(2,"0");
 el("question").textContent=q.q;el("feedback").className="feedback";el("feedback").textContent="";
 el("check").hidden=false;el("check").disabled=true;el("next").className="btn next";el("next").textContent=index===questions.length-1?"View result →":"Continue →";
 const holder=el("options");holder.replaceChildren();
 q.o.forEach((label,i)=>{const b=document.createElement("button");b.type="button";b.className="option";
 const key=document.createElement("span");key.className="letter";key.textContent=String.fromCharCode(65+i);
 const text=document.createElement("span");text.textContent=label;b.append(key,text);
 b.addEventListener("click",()=>{if(locked)return;selected=i;holder.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");el("check").disabled=false;});holder.append(b);});
}
function finish(){
 el("quiz").hidden=true;el("bar").style.width="100%";el("progressText").textContent="Quiz completed";el("percent").textContent="100%";
 const pct=Math.round(score/questions.length*100),r=el("result");r.hidden=false;r.replaceChildren();
 const medal=document.createElement("div");medal.className="medal";medal.textContent=pct>=85?"🏆":pct>=60?"🌟":"💪";
 const h=document.createElement("h2");h.textContent="Practice complete!";
 const s=document.createElement("div");s.className="score";s.textContent=score+" / "+questions.length;
 const p=document.createElement("p");p.className="sub";p.textContent=pct+"% correct • "+score*10+" XP earned";
 r.append(medal,h,s,p);
 const review=document.createElement("div");review.style.marginTop="18px";
 if(wrong.length){const rh=document.createElement("h3");rh.textContent="Review your mistakes";review.append(rh);
 wrong.forEach((item,i)=>{const box=document.createElement("article");box.className="review-item";
 const q=document.createElement("p");q.style.fontWeight="850";q.textContent=(i+1)+". "+item.q;
 const a=document.createElement("p");a.className="wrong-text";a.textContent="Your answer: "+item.chosen;
 const c=document.createElement("p");c.className="right-text";c.textContent="Correct answer: "+item.answer;
 const e=document.createElement("p");e.className="sub";e.textContent=item.explanation;box.append(q,a,c,e);review.append(box);});
 }else{const perfect=document.createElement("p");perfect.textContent="Perfect score! You answered every question correctly.";review.append(perfect);}
 r.append(review);
 const actions=document.createElement("div");actions.className="result-actions";
 const retry=document.createElement("button");retry.className="btn primary";retry.textContent="Practice all 30 again";retry.addEventListener("click",()=>reset(false));actions.append(retry);
 if(wrong.length){const retryWrong=document.createElement("button");retryWrong.className="btn secondary";retryWrong.textContent="Retry mistakes ("+wrong.length+")";retryWrong.addEventListener("click",()=>reset(true));actions.append(retryWrong);}
 r.append(actions);
}
function reset(onlyWrong){
 const nextSet=onlyWrong?wrong.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean):originalQuestions.slice();
 questions.splice(0,questions.length,...nextSet);index=0;score=0;streak=0;wrong=[];el("xp").textContent="0";el("streak").textContent="0";el("result").hidden=true;el("quiz").hidden=false;render();window.scrollTo({top:0,behavior:"smooth"});
}
el("check").addEventListener("click",()=>{
 if(selected===null||locked)return;locked=true;const q=questions[index],buttons=[...el("options").querySelectorAll(".option")];
 buttons.forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add("correct");});
 const fb=el("feedback");
 if(selected===q.a){score++;streak++;el("xp").textContent=String(score*10);el("streak").textContent=String(streak);fb.className="feedback show good";fb.textContent="✓ Correct! "+q.e;}
 else{streak=0;el("streak").textContent="0";buttons[selected].classList.add("wrong");wrong.push({q:q.q,chosen:q.o[selected],answer:q.o[q.a],explanation:q.e});fb.className="feedback show bad";fb.textContent="Not quite. "+q.e+" Correct answer: "+q.o[q.a]+".";}
 el("check").hidden=true;el("next").className="btn next show";
});
el("next").addEventListener("click",()=>{if(!locked)return;index++;if(index<questions.length){render();window.scrollTo({top:0,behavior:"smooth"});}else finish();});
render();
})();
