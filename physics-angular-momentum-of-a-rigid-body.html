<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Angular Momentum of a Rigid Body</title><style>body{margin:0;background:#f5f7fa;font-family:Arial,sans-serif;color:#172033}.wrap{max-width:760px;margin:auto;padding:24px 16px 50px}.head{display:flex;justify-content:space-between;align-items:center}.title{font-size:27px;font-weight:800}.xp{font-weight:700;color:#168447}.sub{color:#667085;margin:8px 0 18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #0000000b}.mastery{font-weight:700}.bar{height:10px;background:#e7ebf0;border-radius:10px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#22a06b;transition:.3s}.qno{font-size:14px;color:#667085}.q{font-size:20px;font-weight:750;line-height:1.4;margin:10px 0 18px}.opt{display:block;width:100%;text-align:left;padding:14px;margin:9px 0;border:2px solid #d9dee7;background:#fff;border-radius:12px;cursor:pointer;font-size:16px;transition:.15s}.opt:hover{transform:translateY(-1px);border-color:#7b8798}.opt.sel{border-color:#3578e5;background:#eef5ff}.opt.correct{border-color:#20a464;background:#eaf8f0}.opt.wrong{border-color:#d64545;background:#fff0f0}.btn{border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:750;cursor:pointer;background:#22a06b;color:white}.btn:disabled{opacity:.5;cursor:not-allowed}.back{display:inline-block;text-decoration:none;color:#344054;border:2px solid #d9dee7;border-radius:12px;padding:12px 18px;font-weight:700;background:#fff}.feedback{min-height:24px;font-weight:700;margin-top:14px}.done{text-align:center;font-size:22px;font-weight:800}@media(max-width:600px){.title{font-size:22px}.q{font-size:18px}}</style></head><body><main class="wrap"><div class="head"><div class="title">🔄 Angular Momentum of a Rigid Body</div><div class="xp">+10 XP</div></div><div class="sub">Angular momentum, moment of inertia, angular velocity and rotational dynamics.</div><section class="card"><div class="mastery">🎯 Skill Mastery <span id="score">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card" id="quizCard"><div class="qno" id="qno"></div><div class="q" id="q"></div><div id="opts"></div><button class="btn" id="continue" disabled>Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>const quiz=[['For a rigid body rotating about a fixed axis, angular momentum about that axis is:', ['L=Iω','L=I/ω','L=ω/I','L=I+ω'],0],['The SI unit of angular momentum is:', ['kg m² s⁻¹','kg m s⁻¹','N m⁻¹','J s⁻¹'],0],['Angular momentum of a particle about an origin is given by:', ['r×p','r+p','r·p','p/r'],0],['If a rigid body has moment of inertia I and angular speed ω, its rotational kinetic energy is:', ['1/2 Iω²','Iω²','1/2 Iω','I/ω²'],0],['Torque and angular momentum are related by:', ['τ=dL/dt','τ=L/t²','τ=L×t','τ=dL/dr'],0],['If net external torque on a system is zero, its angular momentum:', ['remains conserved','always becomes zero','doubles','depends only on mass'],0],['For a particle moving in a circle of radius r with momentum p perpendicular to r, angular momentum magnitude is:', ['rp','p/r','r/p','r+p'],0],['If angular speed is doubled while I remains constant, angular momentum becomes:', ['double','half','four times','unchanged'],0],['If mass distribution of a rigid body moves farther from its rotation axis, its moment of inertia generally:', ['increases','decreases','becomes zero','is unchanged always'],0],['For pure rotation about a fixed axis, the angular momentum vector is parallel to angular velocity when:', ['the body rotates about a principal axis','the body has zero mass','there is no rotation','the radius is zero'],0],['A rotating disc has I=2 kg m² and ω=3 rad/s. Its angular momentum is:', ['6 kg m²/s','1.5 kg m²/s','5 kg m²/s','9 kg m²/s'],0],['A constant torque of 4 N m acts for 3 s on a body initially at rest. The change in angular momentum is:', ['12 kg m²/s','7 kg m²/s','1.33 kg m²/s','48 kg m²/s'],0],['Angular momentum is a:', ['vector quantity','scalar quantity','dimensionless quantity','tensor only in all cases'],0],['The dimensions of angular momentum are:', ['ML²T⁻¹','MLT⁻¹','ML²T⁻²','MLT⁻²'],0],['When a skater pulls arms inward while spinning, angular speed increases mainly because:', ['moment of inertia decreases while angular momentum is approximately conserved','mass increases','torque necessarily becomes infinite','angular momentum becomes zero'],0]];let i=0,correct=0,selected=null,checked=false;function $(x){return document.getElementById(x)}function shuffle(a){for(let k=a.length-1;k>0;k--){let r=Math.floor(Math.random()*(k+1));[a[k],a[r]]=[a[r],a[k]]}return a}function render(){selected=null;checked=false;$('continue').disabled=true;$('continue').textContent='Continue →';$('feedback').textContent='';$('qno').textContent=`Question ${i+1} of 15`;$('q').textContent=quiz[i][0];$('opts').innerHTML='';const order=quiz[i][1].map((text,index)=>({text,index}));shuffle(order).forEach((x,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{selected=x.index;document.querySelectorAll('.opt').forEach(z=>z.classList.remove('sel'));b.classList.add('sel');$('continue').disabled=false};$('opts').appendChild(b)});$('score').textContent=`${correct} / 15`;$('fill').style.width=`${(i/15)*100}%`}$('continue').onclick=()=>{if(selected===null)return;if(!checked){checked=true;const ok=selected===quiz[i][2];if(ok)correct++;document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const n=Number(b.dataset.index);if(n===quiz[i][2])b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=ok?'🎉 Correct! +10 XP':'💡 Review the highlighted correct answer.';$('score').textContent=`${correct} / 15`;$('fill').style.width=`${((i+1)/15)*100}%`;$('continue').textContent=i===14?'Finish Skill →':'Continue →';return}if(i<14){i++;render()}else{$('quizCard').innerHTML=`<div class="done">🏆 Skill Complete!</div><p>You scored ${correct} / 15.</p><button class="btn" onclick="location.reload()">Retry →</button>`}};$('back').onclick=function(){const s=sessionStorage.getItem('skillupLastPhysicsPath');if(s){try{const u=new URL(s,location.href);if(u.origin===location.origin){location.href=s;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();</script></body></html>
