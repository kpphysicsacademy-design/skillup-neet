<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Angular Velocity</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-size:1.6rem;font-weight:900}.subtitle{color:#5f6b7a;margin:0 0 18px}.xp,.card{background:#fff;border-radius:20px;box-shadow:0 6px 20px #17203312}.xp{padding:10px 15px;font-weight:850}.card{padding:20px;margin:12px 0}.ph{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:11px;background:#dfe8f1;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.25s}.qnum{font-weight:800;color:#35516f;margin-bottom:11px}.question{font-size:1.27rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#58cc02;background:#f7fff1;transform:translateY(-1px)}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;background:#2db84d;color:#fff;font-weight:850;cursor:pointer;box-shadow:0 4px 0 #21863a;transition:.12s}.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #21863a}.feedback{margin-top:14px;padding:12px;border-radius:13px;font-weight:700;min-height:18px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:10px;padding:10px 13px;border:2px solid #d9d4f5;border-radius:13px;color:#5146a5;font-weight:800;text-decoration:none;transition:.12s}.back:hover{background:#f0edff;transform:translateX(-2px)}.back:focus{outline:3px solid #c9c2ff;outline-offset:2px}.back:active{transform:translateY(1px)}@media(max-width:600px){.wrap{padding:20px 14px}.title{font-size:1.4rem}.question{font-size:1.12rem}}</style></head><body><main class="wrap"><div class="top"><div class="title">🌀 Angular Velocity</div><div class="xp">⚡ <span id="xp">0</span> XP</div></div><p class="subtitle">Physics • NEET 2026 · Learn → Practice → Master</p><section class="card"><div class="ph"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><button class="btn" id="continue">Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const quiz=[['Angular velocity is defined as the rate of change of:', ['angular displacement','linear displacement','mass','force'],0,'Angular velocity is ω = Δθ/Δt.'],['The SI unit of angular velocity is:', ['rad s⁻¹','m s⁻¹','rad s','N m'],0,'The SI unit is radian per second.'],['The angular velocity of a body completing one revolution in time T is:', ['2π/T','T/2π','πT','2πT'],0,'One revolution is 2π rad, so ω = 2π/T.'],['A wheel makes 60 revolutions per minute. Its angular velocity is:', ['2π rad s⁻¹','π rad s⁻¹','60π rad s⁻¹','1 rad s⁻¹'],0,'60 rpm = 1 revolution per second, hence ω = 2π rad s⁻¹.'],['Angular velocity for uniform circular motion is:', ['constant in magnitude','always zero','increasing linearly','constant in direction as a vector'],0,'In uniform circular motion its magnitude is constant, although the vector direction continuously changes.'],['The relation between linear speed v and angular speed ω is:', ['v = rω','v = ω/r','v = r/ω','v = ωr²'],0,'For circular motion, v = rω.'],['If the radius is doubled while angular velocity remains constant, linear speed becomes:', ['twice','half','four times','unchanged'],0,'Since v = rω, doubling r doubles v.'],['For anticlockwise rotation in the standard sign convention, angular velocity is:', ['positive','negative','zero','undefined'],0,'Anticlockwise rotation is taken as positive.'],['For clockwise rotation in the standard sign convention, angular velocity is:', ['negative','positive','zero','always infinite'],0,'Clockwise rotation is negative by convention.'],['A body changes angular velocity from 4 rad s⁻¹ to 10 rad s⁻¹ in 3 s. Its angular acceleration is:', ['2 rad s⁻²','6 rad s⁻²','14 rad s⁻²','3 rad s⁻²'],0,'α = (10 − 4)/3 = 2 rad s⁻².'],['If a wheel has angular speed 5 rad s⁻¹, its period is:', ['2π/5 s','5/2π s','10π s','π/5 s'],0,'T = 2π/ω = 2π/5 s.'],['Frequency f and angular velocity ω are related by:', ['ω = 2πf','ω = f/2π','ω = 2π/f','ω = f²'],0,'One cycle is 2π rad, so ω = 2πf.'],['A particle rotates through 12 rad in 4 s at uniform angular velocity. Its angular velocity is:', ['3 rad s⁻¹','48 rad s⁻¹','8 rad s⁻¹','0.33 rad s⁻¹'],0,'ω = Δθ/Δt = 12/4 = 3 rad s⁻¹.'],['If angular velocity is zero, the angular position is:', ['instantaneously constant','necessarily increasing','necessarily decreasing','undefined'],0,'Zero angular velocity means there is no instantaneous change in angular position.'],['The direction of angular velocity for a rotating body is determined using the:', ['right-hand rule','left-hand rule only','law of reflection','parallelogram law of forces'],0,'The right-hand rule gives the direction of the angular velocity vector along the rotation axis.']];let i=0,selected=-1,checked=false,score=0;const $=id=>document.getElementById(id),o=$("options"),b=$("continue"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;$("count").textContent='Question '+(i+1)+' of 15';$("question").textContent=a[0];o.innerHTML='';f.className='feedback';f.textContent='';b.style.display='inline-block';b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const el=document.createElement('button');el.className='option';el.textContent=String.fromCharCode(65+j)+'. '+item.text;el.dataset.index=item.index;el.onclick=()=>{selected=item.index;[...o.children].forEach(z=>z.classList.remove('selected'));el.classList.add('selected')};o.appendChild(el)})}b.onclick=()=>{if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(el=>{const n=Number(el.dataset.index);el.disabled=true;if(n===a[2])el.classList.add('correct');if(n===selected&&!ok)el.classList.add('wrong')});if(ok)score++;f.className=ok?'feedback good':'feedback bad';f.textContent=(ok?'🎯 Correct! +10 XP — ':'✗ Review — Correct answer: '+a[1][a[2]]+'. ')+a[3];$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$("question").textContent='🏆 Angular Velocity Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
