<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>💧 Anomalous Expansion of Water</h1><p class="muted">Learn why water is densest at 4°C, how it expands near freezing and why this matters for lakes and ice.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"What is anomalous expansion of water?",o:["Water expands when cooled from 4°C to 0°C","Water always contracts on cooling","Water boils at 4°C","Water has no density"],a:0,e:"Water behaves unusually between 4°C and 0°C: it expands as it cools."},
{q:"At what temperature does pure water have maximum density near normal atmospheric pressure?",o:["0°C","4°C","100°C","−4°C"],a:1,e:"Water's density is maximum at about 4°C."},
{q:"When water is cooled from 10°C to 4°C, its volume generally:",o:["Increases","Stays exactly constant","Decreases","Becomes zero"],a:2,e:"From 10°C down to 4°C, water contracts and its density increases."},
{q:"When water is cooled from 4°C to 0°C, its volume:",o:["Decreases","Remains constant","Becomes zero","Increases"],a:3,e:"Below 4°C, water expands as it cools toward freezing."},
{q:"As water cools from 4°C to 0°C, its density generally:",o:["Decreases","Increases continuously","Becomes infinite","Does not change"],a:0,e:"Expansion below 4°C means the density decreases as water cools."},
{q:"Why can lakes freeze from the top while water below remains liquid?",o:["Ice sinks immediately","Water near 4°C is denser and sinks","Water at 0°C is densest","Water stops transferring heat"],a:1,e:"Water near 4°C sinks, while colder, less-dense water stays near the surface and can freeze."},
{q:"Ice floats on liquid water because ice is:",o:["Hotter in every situation","Denser than liquid water","Less dense than liquid water","Made of a different element"],a:2,e:"The open crystal structure of ordinary ice makes it less dense than liquid water."},
{q:"At 0°C, compared with the same mass of liquid water near 4°C, ice occupies:",o:["Less volume","Exactly zero volume","No measurable volume","More volume"],a:3,e:"Ice is less dense than liquid water, so the same mass occupies more volume."},
{q:"Which graph behaviour is expected for water density between 0°C and 4°C as temperature rises?",o:["Density increases","Density decreases continuously","Density is always zero","Density is unchanged in all cases"],a:0,e:"Density rises as water warms from 0°C to 4°C, reaching its maximum near 4°C."},
{q:"A bottle completely filled with water and sealed may crack in a freezer because water:",o:["Contracts on freezing","Expands as it freezes","Loses all mass","Stops occupying space"],a:1,e:"Water expands on freezing, which can create large pressure in a sealed container."},
{q:"The anomalous behaviour of water is important for:",o:["Making water heavier than lead","Preventing all ice formation","Survival of aquatic life in cold climates","Stopping evaporation"],a:2,e:"Surface ice insulates the water below, helping aquatic organisms survive."},
{q:"Which temperature interval shows the unusual expansion on cooling?",o:["20°C to 10°C","100°C to 90°C","10°C to 4°C","4°C to 0°C"],a:3,e:"The anomalous expansion occurs as water cools from about 4°C toward 0°C."},
{q:"If a fixed mass of water expands as it cools below 4°C, its density:",o:["Decreases","Increases","Must double","Becomes infinite"],a:0,e:"Density equals mass divided by volume; with fixed mass and greater volume, density decreases."},
{q:"At approximately what temperature does water reach its minimum volume under normal conditions?",o:["0°C","4°C","100°C","−273°C"],a:1,e:"Maximum density corresponds to minimum volume for a fixed mass, around 4°C."},
{q:"What happens to water's density when it cools from 4°C to 2°C?",o:["It increases","It remains at maximum without change","It decreases","It becomes zero"],a:2,e:"Cooling below 4°C causes water to expand, lowering its density."},
{q:"Why does a pond often freeze first at the surface?",o:["Cold water is always denser than warm water","Ice is denser than water","The bottom loses all heat first","Water near 0°C is less dense than water near 4°C"],a:3,e:"Water colder than 4°C is less dense, so it remains near the surface and can freeze."},
{q:"Which statement is correct about water at 4°C?",o:["It has maximum density","It has minimum density","It is necessarily boiling","It has zero volume"],a:0,e:"At normal pressure, liquid water has its maximum density near 4°C."},
{q:"For a fixed mass of liquid water, the volume is approximately smallest at:",o:["0°C","4°C","50°C","100°C"],a:1,e:"The volume is smallest where density is maximum, near 4°C."},
{q:"The anomalous expansion of water is unusual because most liquids:",o:["Have maximum density at 4°C","Expand on cooling at all temperatures","Contract when cooled over ordinary ranges","Never change volume"],a:2,e:"Most liquids contract when cooled; water expands between 4°C and 0°C."},
{q:"Which substance is most directly responsible for the special density behaviour described in this topic?",o:["Mercury","Oil","Ethanol","Water"],a:3,e:"The phenomenon refers specifically to water's unusual behaviour near freezing."},
{q:"When water at 0°C is warmed toward 4°C, its volume generally:",o:["Decreases","Increases","Remains fixed always","Becomes infinite"],a:0,e:"Water contracts as it warms from 0°C to 4°C."},
{q:"When water at 4°C is warmed to 8°C, its volume generally:",o:["Decreases","Increases","Becomes zero","Does not change"],a:1,e:"Above 4°C, water behaves more typically: it expands as temperature rises."},
{q:"Which condition best describes water's density at 0°C compared with at 4°C?",o:["Higher at 0°C","Exactly equal in all cases","Lower at 0°C","Zero at 0°C"],a:2,e:"The density at 0°C is lower than the maximum density near 4°C."},
{q:"A sealed glass bottle full of water is placed in a freezer. The main risk is that:",o:["Water evaporates instantly","The bottle becomes weightless","Water loses its mass","Expanding water can break the bottle"],a:3,e:"Freezing water expands and may exert enough pressure to crack the container."},
{q:"Which layer helps insulate a frozen lake?",o:["The ice layer at the surface","The densest water at the surface","A layer of boiling water","A layer with no molecules"],a:0,e:"Surface ice reduces heat loss from the liquid water below."},
{q:"A water sample has fixed mass. If its volume increases below 4°C, its density must:",o:["Increase","Decrease","Remain unchanged","Become negative"],a:1,e:"With fixed mass, density is inversely proportional to volume."},
{q:"The term 'anomalous' in anomalous expansion means the behaviour is:",o:["Impossible to measure","A chemical reaction","Different from the usual trend","Only seen in gases"],a:2,e:"Water's expansion on cooling below 4°C differs from the usual contraction of liquids."},
{q:"At normal pressure, which statement best compares 4°C water and 0°C water?",o:["0°C water is denser","Both have zero density","They must have identical volume for any mass","4°C water is denser"],a:3,e:"Water reaches maximum density near 4°C, so 0°C liquid water is less dense."},
{q:"Why does ice generally remain on the surface of a lake?",o:["It is less dense than liquid water","It is denser than liquid water","It has no mass","It is always warmer than water"],a:0,e:"Ice floats because its density is lower than liquid water's."},
{q:"Which summary is correct?",o:["Water contracts continuously as it cools from 100°C to 0°C","Water has maximum density near 4°C and expands when cooled below it","Water is densest at 0°C","Water cannot freeze"],a:1,e:"Water contracts as it cools to 4°C, then expands as it cools from 4°C to 0°C."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Pascal&#39;s Law Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
