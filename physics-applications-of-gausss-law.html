<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Applications of Gauss's Law</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>⚡ Applications of Gauss's Law</h1>
<div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="quiz"></div><div class="xp" id="xp"></div>
<button class="next hide" id="next">Next Question →</button>
<div id="result" class="hide"></div>
<a class="back" href="physics-home-fast.html">← Back to Physics Path</a>
</div></div>
<script>
const qs=[
['Gauss’s law is particularly useful for finding electric fields when the charge distribution has','no symmetry','high symmetry','random symmetry','zero charge',1,'Spherical, cylindrical and planar symmetry make the electric field constant or simple on a suitable Gaussian surface.'],
['For an isolated point charge Q, the electric field at distance r is','kQ/r','kQ/r²','kQr²','kQ/r³',1,'Using a spherical Gaussian surface gives E(4πr²)=Q/ε₀, hence E=kQ/r².'],
['For a uniformly charged spherical shell, the electric field at a point inside the shell is','kQ/r²','kQ/R²','zero','σ/ε₀',2,'A Gaussian surface inside the shell encloses no charge, so the net electric flux and field are zero.'],
['For a uniformly charged spherical shell of radius R and total charge Q, at a point outside the shell (r>R), the field is','zero','kQ/R²','kQ/r²','kQr²',2,'Outside a spherically symmetric charge distribution, the field is the same as that of a point charge Q at the centre.'],
['For a uniformly charged solid nonconducting sphere, the electric field at its centre is','maximum','zero','kQ/R²','σ/ε₀',1,'By symmetry the field at the centre is zero; a Gaussian surface of vanishing radius encloses vanishing charge.'],
['Inside a uniformly charged solid sphere of radius R, the electric field at distance r<R varies as','1/r²','1/r','r','constant',2,'For uniform volume charge density, enclosed charge is proportional to r³, so Gauss’s law gives E∝r.'],
['For an infinitely long uniformly charged wire with linear charge density λ, the electric field at distance r is','λ/(4πε₀r²)','λ/(2πε₀r)','λr/(2πε₀)','2πε₀λr',1,'A cylindrical Gaussian surface gives E(2πrl)=λl/ε₀, hence E=λ/(2πε₀r).'],
['For an infinite plane sheet with surface charge density σ, the electric field magnitude on either side is','σ/ε₀','σ/(2ε₀)','2σ/ε₀','zero',1,'A pillbox Gaussian surface has two faces, giving 2EA=σA/ε₀ and E=σ/(2ε₀).'],
['For two large oppositely charged parallel sheets with equal surface charge densities ±σ, the electric field between them is','zero','σ/(2ε₀)','σ/ε₀','2σ/ε₀',2,'The fields from the two sheets add between the sheets, giving E=σ/ε₀.'],
['For two large oppositely charged parallel sheets with equal surface charge densities ±σ, the ideal electric field outside the sheets is','σ/ε₀','σ/(2ε₀)','zero','2σ/ε₀',2,'Outside the pair, the fields produced by the two sheets are equal and opposite, so they cancel.'],
['The electric field just outside a conductor in electrostatic equilibrium is','σ/ε₀ and normal to the surface','σ/(2ε₀) and tangential','zero everywhere','2σε₀',0,'A Gaussian pillbox at the conductor surface gives E=σ/ε₀. The tangential field is zero in electrostatic equilibrium.'],
['A spherical Gaussian surface encloses charge 4ε₀. The total electric flux through it is','ε₀','4','1/4','zero',1,'Gauss’s law gives Φ=Q/ε₀=(4ε₀)/ε₀=4 N·m²/C when the charge is expressed consistently in SI units.'],
['A long straight wire has λ=2×10⁻⁶ C/m. Taking ε₀=8.85×10⁻¹² C²/(N·m²), the field at r=1 m is approximately','1.80×10⁴ N/C','3.60×10⁴ N/C','7.20×10⁴ N/C','9.00×10³ N/C',1,'E=λ/(2πε₀r)≈2×10⁻⁶/(2π×8.85×10⁻¹²)≈3.60×10⁴ N/C.'],
['A conducting spherical shell has net charge Q. The electric field at any point within the conducting material in electrostatic equilibrium is','kQ/r²','σ/ε₀','zero','constant and nonzero',2,'In electrostatic equilibrium the electric field inside the conducting material is zero. Excess charge resides on the surface.'],
['Which Gaussian surface is most suitable for calculating the field of an infinitely long straight uniformly charged wire?','A sphere','A cylinder coaxial with the wire','A cube','A cone',1,'A coaxial cylindrical Gaussian surface matches the cylindrical symmetry and makes E constant over the curved surface.']
];
let i=0,score=0,answered=false;
const $=x=>document.getElementById(x);
function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}
function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}
function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}
$('next').onclick=next;render();
</script>
</body>
</html>
