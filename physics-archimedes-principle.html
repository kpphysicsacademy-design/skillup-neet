<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Archimedes’ Principle — 15 MCQ Quiz</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#203040;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:22px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:#123b70}.xp{font-weight:950;color:#1677ff}.hero{margin-top:14px;background:linear-gradient(135deg,#123b70,#1677ff);color:#fff;border-radius:24px;padding:22px}.hero h1{margin:5px 0 7px;font-size:clamp(28px,6vw,40px)}.hero p{margin:0;font-size:13px;line-height:1.5}.card{background:#fff;border:1px solid #d9e5f2;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 7px 20px rgba(18,59,112,.07)}.master{font-weight:900}.bar{height:10px;background:#e5edf6;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;width:0;background:#1677ff;transition:.3s}.qno{font-size:12px;color:#6b7280;font-weight:900}.q{font-size:20px;font-weight:900;line-height:1.4;margin:9px 0 16px}button.opt{display:block;width:100%;text-align:left;background:#fff;color:#203040;border:2px solid #dfe8f1;border-radius:14px;padding:14px;margin:10px 0;font-size:15px;font-weight:750;line-height:1.35;cursor:pointer;appearance:none}button.opt:hover{border-color:#9bc3ed;background:#f8fbff}button.opt.selected{border-color:#1677ff;background:#eef6ff;color:#123b70}button.opt.correct{border-color:#16803a;background:#eaf8ef;color:#145c2e}button.opt.wrong{border-color:#d64545;background:#fff0f0;color:#8f2020}.actions{display:flex;justify-content:flex-end;margin-top:15px}button.continue{border:0;border-radius:13px;padding:12px 20px;background:#1677ff;color:#fff;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #0d5bbf}button.continue:disabled{opacity:.5;box-shadow:none;cursor:not-allowed}.feedback{min-height:25 {q:'Archimedes’ principle states that the buoyant force on an immersed body equals the',o:['weight of fluid displaced','weight of the body','mass of the body','volume of the body'],a:0,e:'The upward buoyant force equals the weight of the fluid displaced by the body.'},
{q:'The SI unit of buoyant force is',o:['pascal','newton','joule','kg m⁻³'],a:1,e:'Buoyant force is a force, so its SI unit is newton (N).'},
{q:'The buoyant force on an immersed body acts',o:['vertically downward','horizontally','vertically upward','along the surface'],a:2,e:'The pressure difference between the lower and upper surfaces produces an upward resultant force.'},

{q:'A body sinks in a liquid when its average density is',o:['less than the liquid density','equal to the liquid density','greater than the liquid density','zero'],a:2,e:'If average body density exceeds liquid density, its weight exceeds the maximum buoyant force available while fully submerged.'},
{q:'A body is neutrally buoyant when its average density is',o:['greater than fluid density','less than fluid density','equal to fluid density','zero'],a:2,e:'Neutral buoyancy occurs when body density equals fluid density, so weight and buoyant force balance when submerged.'},

];let i=0,selected=null,checked=false,score=0;const $=id=>document.getElementById(id);function render(){selected=null;checked=false;$('feedback').textContent='';$('continue').disabled=true;$('continue').textContent=i===14?'Finish Quiz →':'Check Answer →';$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=questions[i].q;$('opts').innerHTML='';questions[i].o.forEach((text,index)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+index)+'. '+text;b.dataset.index=index;b.onclick=()=>{if(checked)return;selected=index;document.querySelectorAll('button.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('continue').disabled=false};$('opts').appendChild(b)});$('mastery').textContent=`${i} / 15`;$('fill').style.width=`${i/15*100}%`;$('xp').textContent=`XP: ${score*10}`}function next(){if(selected===null)return;if(!checked){checked=true;const item=questions[i],ok=selected===item.a;if(ok)score++;document.querySelectorAll('button.opt').forEach(b=>{const n=Number(b.dataset.index);b.disabled=true;if(n===item.a)b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+`<div class="explain">${item.e}</div>`;$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=`${(i+1)/15*100}%`;$('xp').textContent=`XP: ${score*10}`}else if(i<14){i++;render()}else finish()}function finish(){$('quiz').hidden=true;$('result').hidden=false;const pct=Math.round(score/15*100);$('result').innerHTML=`<h2>🎉 Archimedes’ Principle Complete!</h2><div class="score">${score} / 15</div><p><strong>${pct}%</strong> accuracy</p><p>🏆 You earned <strong>${score*10} XP</strong>.</p><p>${score>=12?'🔥 Excellent NEET readiness!':score>=9?'💪 Good work. Revise and retry for mastery.':'📚 Revise Archimedes’ principle and try again.'}</p><button class="continue" type="button" onclick="location.reload()">Retry 15 MCQs</button>`}$('continue').onclick=next;render();</script></body></html>
