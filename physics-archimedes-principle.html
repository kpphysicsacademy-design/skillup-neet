<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}

.hero,.quiz,.finish{background:#fff;border:2px solid #e2edf7;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 #dce8f3}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#174a78}.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}
.progress-row{display:flex;justify-content:space-between;gap:10px;margin:16px 0 7px;font-size:12px;font-weight:900;color:var(--muted)}
.track{height:11px;border-radius:99px;background:#e2edf7;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}
.qmeta{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.4px}
.question{font-size:clamp(20px,4.5vw,26px);line-height:1.35;margin:12px 0 18px;font-weight:850}
.options{display:grid;gap:10px}.option{display:flex;gap:11px;align-items:center;width:100%;min-height:51px;padding:12px;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}
.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🛠️ Archimedes’ Principle</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"Archimedes’ principle states that buoyant force equals the:",o:["Weight of displaced fluid","Mass of the object","Volume of the object","Pressure at the surface"],a:0,e:"The buoyant force equals the weight of fluid displaced."},
{q:"The SI unit of buoyant force is:",o:["Pascal","Kilogram","Newton","Cubic metre"],a:2,e:"Buoyant force is a force, measured in newtons (N)."},
{q:"Buoyant force acts mainly:",o:["Vertically upward","Vertically downward","Horizontally only","Along the object's motion"],a:0,e:"Fluid pressure is greater at the bottom than at the top, giving a net upward force."},
{q:"Which formula gives buoyant force?",o:["ρVg","m/V","F/A","ρ/gV"],a:0,e:"For displaced fluid, buoyant force is Fᵦ = ρfluid Vdisplaced g."},
{q:"A body floats at rest when its weight is:",o:["Greater than buoyant force","Equal to buoyant force","Zero","Always less than half the buoyant force"],a:1,e:"For a floating body in equilibrium, buoyant force balances its weight."},
{q:"A completely submerged object displaces fluid equal in volume to the:",o:["Container","Object","Object's mass","Fluid's weight"],a:1,e:"When fully submerged, the displaced fluid volume equals the object's volume."},
{q:"If displaced volume doubles and other factors stay constant, buoyant force:",o:["Halves","Doubles","Becomes zero","Stays unchanged"],a:1,e:"Buoyant force is directly proportional to displaced volume."},
{q:"If fluid density increases, with displaced volume unchanged, buoyant force:",o:["Increases","Decreases","Must become zero","Cannot be affected"],a:0,e:"Fᵦ = ρVg, so a denser fluid gives a greater buoyant force."},
{q:"An object generally sinks in a liquid if its average density is:",o:["Less than the liquid's density","Equal to zero","Greater than the liquid's density","Always unrelated to density"],a:2,e:"An object denser than the fluid generally sinks."},
{q:"An object less dense than water will generally:",o:["Float partly submerged","Sink immediately","Have no weight","Experience no buoyancy"],a:0,e:"It can displace enough water for buoyancy to balance its weight before it is fully submerged."},
{q:"Why can a steel ship float although steel is denser than water?",o:["Gravity does not act on it","Its hollow shape makes its average density low and lets it displace much water","Steel has no mass at sea","Water has no density"],a:1,e:"A ship's hollow structure lowers its average density and allows large water displacement."},
{q:"A body has volume 0.003 m³ and is fully submerged in water (ρ = 1000 kg/m³, g = 10 m/s²). Its buoyant force is:",o:["3 N","30 N","300 N","3000 N"],a:1,e:"Fᵦ = 1000 × 0.003 × 10 = 30 N."},
{q:"A body weighs 40 N in air and experiences 12 N buoyant force in water. Its apparent weight is:",o:["52 N","40 N","28 N","12 N"],a:2,e:"Apparent weight = true weight − buoyant force = 40 − 12 = 28 N."},
{q:"The apparent loss of weight of an immersed body equals the:",o:["Weight of displaced fluid","Weight of the container","Volume of the body","Density of the body"],a:0,e:"The apparent weight loss equals the buoyant force, which is the weight of displaced fluid."},
{q:"For a fully submerged object in a uniform-density liquid, buoyant force does not depend on:",o:["Fluid density","Object's submerged volume","Gravity","Depth"],a:3,e:"At constant density and volume, Fᵦ = ρVg is independent of depth."},
{q:"A hydrometer measures liquid density by using:",o:["Archimedes’ principle alone","Archimedes' principle","Newton's law of cooling","Ohm's law"],a:1,e:"A hydrometer floats at different depths depending on liquid density."},
{q:"A floating object is pushed deeper into a liquid. Before it becomes fully submerged, buoyant force generally:",o:["Increases","Decreases to zero","Never changes","Acts downward"],a:0,e:"Pushing it deeper increases displaced volume, increasing buoyant force."},
{q:"An object is suspended motionless inside a liquid without touching the container. Its density is approximately:",o:["Zero","Equal to the liquid density","Twice the liquid density","Always less than half the liquid density"],a:1,e:"Neutral buoyancy occurs when object density matches fluid density and forces balance."},
{q:"If g is doubled while fluid density and displaced volume remain constant, buoyant force:",o:["Halves","Doubles","Stays the same","Becomes zero"],a:1,e:"Buoyant force is proportional to gravitational acceleration."},
{q:"A block displaces 0.0005 m³ of water. Take ρ = 1000 kg/m³ and g = 10 m/s². Buoyant force is:",o:["0.5 N","5 N","50 N","500 N"],a:1,e:"Fᵦ = 1000 × 0.0005 × 10 = 5 N."},
{q:"A floating wooden block has weight 8 N. The buoyant force on it is:",o:["Less than 8 N","8 N","Greater than 8 N at rest","Zero"],a:1,e:"At rest, the upward buoyant force equals the block's weight."},
{q:"Which change can increase buoyant force on a fully submerged rigid object?",o:["Increase the displaced volume","Decrease fluid density","Set gravity to zero","Reduce displaced volume"],a:0,e:"A larger displaced volume increases buoyant force if fluid density and g stay constant."},
{q:"A body is fully immersed in oil and then fully immersed in denser water. Its buoyant force in water is generally:",o:["Smaller","Greater","Always zero","Exactly equal in all cases"],a:1,e:"For the same displaced volume and g, denser water produces greater buoyant force."},
{q:"The net upward buoyant force originates mainly because fluid pressure:",o:["Is greater at greater depth","Is identical at every depth","Acts only sideways","Does not act on objects"],a:0,e:"The bottom surface experiences greater pressure than the top surface."},
{q:"A body has weight 25 N and buoyant force 30 N when released in a liquid. It will initially:",o:["Accelerate upward","Accelerate downward","Remain in the same place","Lose its mass"],a:0,e:"Since buoyancy exceeds weight, the net force is upward."},
{q:"A body has weight 60 N and buoyant force 45 N while submerged. The net force is:",o:["15 N upward","15 N downward","45 N upward","105 N downward"],a:1,e:"The downward net force is 60 − 45 = 15 N."},
{q:"The fraction of a floating object's volume submerged is equal to:",o:["Object density divided by fluid density","Fluid density divided by gravity","Object mass multiplied by volume","Buoyant force divided by volume"],a:0,e:"For a floating body, Vsub/Vobject = ρobject/ρfluid."},
{q:"Which statement about buoyancy is correct?",o:["Only floating objects experience buoyancy","Sinking objects also experience an upward buoyant force","Buoyant force acts only in water","Buoyant force always exceeds weight"],a:1,e:"Any object immersed partly or fully in a fluid experiences buoyant force, even if it sinks."},
{q:"A body displaces 0.002 m³ of oil of density 800 kg/m³. If g = 10 m/s², the buoyant force is:",o:["8 N","16 N","80 N","160 N"],a:1,e:"Fᵦ = ρVg = 800 × 0.002 × 10 = 16 N."},
{q:"A body weighs 50 N in air and 35 N when immersed. Its buoyant force is:",o:["15 N","35 N","50 N","85 N"],a:0,e:"Buoyant force equals the loss of apparent weight: 50 − 35 = 15 N."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Archimedes’ Principle Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
