<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1f1e5"><title>SkillUp Physics | Area Expansion — Simulator</title>
<link rel="stylesheet" href="physics-duolingo-quiz.css?v=20261122-area-expansion-tabs-v1">
<style>
:root{--bg:#f1f1e5;--ink:#27372e;--muted:#68766a;--line:#dce5d7}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
header{background:#fbfbf3;border-bottom:1px solid var(--line)}.nav{width:min(100% - 24px,720px);margin:auto;min-height:68px;display:flex;align-items:center;gap:10px}
.back{width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--line);border-radius:14px;background:#f2f9ff;color:#174a78;text-decoration:none;font-size:20px}
.brand{font-weight:950;font-size:19px}.brand small{display:block;font-size:9px;color:var(--muted);letter-spacing:.8px}
main{width:min(100% - 24px,720px);margin:16px auto 40px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tab{min-height:46px;display:grid;place-items:center;border:2px solid #dce8f3;border-radius:14px;background:#fff;color:#245273;text-decoration:none;font-size:13px;font-weight:900;box-shadow:0 3px 0 #dce8f3}
.tab.active{background:#e8f8dc;border-color:#8ed65b;color:#286c12;box-shadow:0 3px 0 #b9e69c}
.page-progress{padding:10px;margin-bottom:14px;border:1px solid #d7eaf8;border-radius:13px;background:#eef8ff;text-align:center;color:#245273;font-weight:850}
.card{background:#fff;border:2px solid #e2e9df;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 5px 0 #dce8f3}
h1,h2{color:#254b37}.muted{line-height:1.55;color:#5f6f61}
.field{margin:18px 0}.field label{display:flex;justify-content:space-between;gap:8px;font-weight:850;margin-bottom:8px}.field output{color:#176e9e}
input{width:100%;accent-color:#58cc02}input[type=number]{height:46px;padding:0 12px;border:2px solid #d6ddce;border-radius:12px;background:#fbfbf3;color:#27372e;font-size:16px}
.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}
.result{padding:14px;border-radius:14px;background:#efffe7;border:1px solid #c8f0b2;text-align:center}.result strong{display:block;font-size:20px;color:#286c12}.result span{font-size:12px;color:#52734a;font-weight:800}
.formula{padding:14px;background:#efffe7;border:1px solid #c8f0b2;border-radius:14px;text-align:center;font-size:20px;font-weight:900;color:#315b24}
button{min-height:44px;padding:10px 16px;border:0;border-radius:13px;background:#58cc02;color:white;font-weight:900}
</style></head><body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div></div></header>
<main>
<nav class="tabs" aria-label="Area Expansion pages"><a class="tab" href="physics-area-expansion-learn.html">📘 Learn</a><a class="tab active" href="physics-area-expansion-simulator.html" aria-current="page">🎮 Simulator</a><a class="tab" href="physics-area-expansion.html">🧠 Practice</a></nav>
<div class="page-progress" id="pageProgress">Progress: 2/3 pages completed</div>
<section class="card"><h1>📐 Area Expansion Simulator</h1><p class="muted">Change the initial area, expansion coefficient and temperature to calculate the change in area.</p>
<div class="field"><label for="area">Initial area (A₀) <output id="areaOut">2 m²</output></label><input id="area" type="range" min="0.1" max="20" step="0.1" value="2"></div>
<div class="field"><label for="gamma">Area coefficient (γ) <output id="gammaOut">0.00002 K⁻¹</output></label><input id="gamma" type="number" min="0" step="0.000001" value="0.00002"></div>
<div class="field"><label for="temp">Temperature change (ΔT) <output id="tempOut">10 K</output></label><input id="temp" type="range" min="-100" max="200" step="1" value="10"></div>
<div class="formula">ΔA = γA₀ΔT</div>
<div class="results"><div class="result"><strong id="delta">0.0004 m²</strong><span>Change in area</span></div><div class="result"><strong id="final">2.0004 m²</strong><span>Final area</span></div></div>
<p class="muted" id="working" aria-live="polite">ΔA = 0.00002 × 2 × 10</p><button id="reset" type="button">Reset values</button></section>
</main>
<script>
(function(){const $=id=>document.getElementById(id),a=$('area'),g=$('gamma'),t=$('temp');const fmt=n=>Number(n.toPrecision(7)).toString();function update(){const A=Number(a.value),G=Number(g.value),T=Number(t.value),d=G*A*T;$('areaOut').textContent=fmt(A)+' m²';$('gammaOut').textContent=fmt(G)+' K⁻¹';$('tempOut').textContent=fmt(T)+' K';$('delta').textContent=fmt(d)+' m²';$('final').textContent=fmt(A+d)+' m²';$('working').textContent='ΔA = '+fmt(G)+' × '+fmt(A)+' × '+fmt(T)+' = '+fmt(d)+' m²';} [a,g,t].forEach(x=>x.addEventListener('input',update));$('reset').addEventListener('click',()=>{a.value=2;g.value=.00002;t.value=10;update()});update();const key='skillup-physics-area-expansion-pages-v1';let s={learn:false,sim:false,practice:false};try{s=Object.assign(s,JSON.parse(localStorage.getItem(key)||'{}'));}catch(e){}s.sim=true;try{localStorage.setItem(key,JSON.stringify(s));}catch(e){}$('pageProgress').textContent='Progress: '+Object.values(s).filter(Boolean).length+'/3 pages completed';})();
</script><script src="shared-nav.js?v=20261125-unified-botany-theme-v1"></script></body></html>
