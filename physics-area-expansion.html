<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Area Expansion — 15 MCQ Quiz</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#203040;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:22px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:#123b70}.xp{font-weight:950;color:#1677ff}.hero{margin-top:14px;background:linear-gradient(135deg,#123b70,#1677ff);color:#fff;border-radius:24px;padding:22px}.hero h1{margin:5px 0 7px;font-size:clamp(28px,6vw,40px)}.hero p{margin:0;line-height:1.5;font-size:13px}.card{background:#fff;border:1px solid #d9e5f2;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 7px 20px rgba(18,59,112,.07)}.bar{height:10px;background:#e5edf6;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;width:0;background:#1677ff;transition:.3s}.qno{font-size:12px;color:#6b7280;font-weight:900}.q{font-size:20px;font-weight:900;line-height:1.4;margin:9px 0 16px}button.opt{display:block;width:100%;text-align:left;background:#fff;color:#203040;border:2px solid #dfe8f1;border-radius:14px;padding:14px;margin:10px 0;font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}button.opt.selected{border-color:#1677ff;background:#eef6ff;color:#123b70}button.opt.correct{border-color:#16803a;background:#eaf8ef;color:#145c2e}button.opt.wrong{border-color:#d64545;background:#fff0f0;color:#8f2020}button.continue{border:0;border-radius:13px;padding:12px 20px;background:#1677ff;color:#fff;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #0d5bbf}button.continue:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}.actions{display:flex;justify-content:flex-end;margin-top:15px}.feedback{min-height:25px;margin-top:13px;font-weight:800}.explain{margin-top:6px;color:#596774;font-weight:600}.back{display:b {q:'Area expansion of a solid is the change in its',o:['surface area','mass','temperature only','volume only'],a:0,e:'Area or superficial expansion is the change in surface area caused by a temperature change.'},
{q:'The coefficient of superficial expansion β is defined as',o:['ΔA/(AΔT)','A/(ΔAΔT)','ΔT/(AΔA)','ΔAΔT/A'],a:0,e:'β = ΔA/(AΔT), where A is the original area.'},
{q:'The SI unit of coefficient of superficial expansion is',o:['K','K⁻¹','m² K⁻¹','m⁻²'],a:1,e:'It is fractional area change per kelvin, so the unit is K⁻¹.'},
{q:'For small temperature changes, the area increase is given by',o:['ΔA = βAΔT','ΔA = βΔT/A','ΔA = A/(βΔT)','ΔA = βA/ΔT'],a:0,e:'The relation is ΔA = βAΔT.'},
{q:'For an isotropic solid, β is approximately',o:['α/2','α','2α','3α'],a:2,e:'Since each linear dimension changes by αΔT, area changes approximately by 2αΔT; hence β ≈ 2α.'},
{q:'A square metal plate has side 1 m and α = 2×10⁻⁵ K⁻¹. For a 100 K rise, its approximate increase in area is',o:['2×10⁻³ m²','4×10⁻³ m²','2×10⁻⁵ m²','4×10⁻⁵ m²'],a:1,e:'β≈2α=4×10⁻⁵ K⁻¹, so ΔA=βAΔT=4×10⁻³ m².'},
{q:'If the original area is doubled while β and ΔT stay fixed, ΔA becomes',o:['half','unchanged','double','four times'],a:2,e:'From ΔA = βAΔT, area increase is directly proportional to original area.'},
{q:'If the temperature rise is doubled while A and β stay fixed, ΔA becomes',o:['half','unchanged','double','four times'],a:2,e:'Area expansion is directly proportional to ΔT.'},
{q:'A plate is heated from 30°C to 90°C. The temperature difference is',o:['30 K','60 K','90 K','120 K'],a:1,e:'ΔT = 90 − 30 = 60 K.'},
{q:'For a uniformly heated isotropic square plate, each side increases by',o:['αLΔT','2αLΔT','βLΔT','L/(αΔT)'],a:0,e:'Each linear dimension follows ΔL = αLΔT.'},
{q:'A circular hole in a metal plate is heated uniformly. The diameter of the hole',o:['decreases','increases','remains exactly unchanged','becomes zero'],a:1,e:'A hole expands as though it were made of the same material; its diameter increases on heating.'},
{q:'For a small temperature change, the fractional area increase ΔA/A is approximately',o:['αΔT','2αΔT','3αΔT','ΔT/α'],a:1,e:'For isotropic material, ΔA/A ≈ 2αΔT.'},
{q:'If α = 1.2×10⁻⁵ K⁻¹, the approximate superficial expansion coefficient is',o:['0.6×10⁻⁵ K⁻¹','1.2×10⁻⁵ K⁻¹','2.4×10⁻⁵ K⁻¹','3.6×10⁻⁵ K⁻¹'],a:2,e:'β≈2α = 2.4×10⁻⁵ K⁻¹.'},
{q:'When a metal sheet is heated uniformly, its area increases mainly because',o:['its dimensions increase','its mass increases greatly','its temperature decreases','its density becomes zero'],a:0,e:'Thermal expansion increases the linear dimensions, producing an increase in area.'},
{q:'If the linear dimensions of a plate each increase by 1% for a small expansion, its area increases by approximately',o:['0.5%','1%','2%','4%'],a:2,e:'For small strains, fractional area change is approximately the sum of the two fractional linear changes: 1% + 1% = 2%.'}
];let i=0,selected=null,checked=false,score=0;const $=id=>document.getElementById(id);function render(){selected=null;checked=false;$('feedback').textContent='';$('continue').disabled=true;$('continue').textContent=i===14?'Finish Quiz →':'Check Answer →';$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=questions[i].q;$('opts').innerHTML='';questions[i].o.forEach((text,n)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+n)+'. '+text;b.dataset.index=n;b.onclick=()=>{if(checked)return;selected=n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('continue').disabled=false};$('opts').appendChild(b)});$('mastery').textContent=`${i} / 15`;$('fill').style.width=`${i/15*100}%`;$('xp').textContent=`XP: ${score*10}`}function next(){if(selected===null)return;if(!checked){checked=true;const item=questions[i],ok=selected===item.a;if(ok)score++;document.querySelectorAll('.opt').forEach(b=>{const n=+b.dataset.index;b.disabled=true;if(n===item.a)b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+`<div class="explain">${item.e}</div>`;$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=`${(i+1)/15*100}%`;$('xp').textContent=`XP: ${score*10}`}else if(i<14){i++;render()}else finish()}function finish(){$('quiz').hidden=true;$('result').hidden=false;const pct=Math.round(score/15*100);$('result').innerHTML=`<h2>🎉 Area Expansion Complete!</h2><div class="score">${score} / 15</div><p><strong>${pct}%</strong> accuracy</p><p>🏆 You earned <strong>${score*10} XP</strong>.</p><p>${score>=12?'🔥 Excellent NEET readiness!':score>=9?'💪 Good work. Revise and retry for mastery.':'📚 Revise Area Expansion and try again.'}</p><button class="continue" type="button" onclick="location.reload()">Retry 15 MCQs</button>`}$('continue').onclick=next;render();</script></body><
