<style>

.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}

.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>📐 Area Expansion</h1><p class="muted">Learn the area expansion formula, coefficient relationships and quick numerical problems.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"Area expansion describes the change in an object's:",o:["Surface area","Mass","Chemical formula","Electric charge"],a:0,e:"Area expansion is the change in surface area caused by a temperature change."},
{q:"The formula for area expansion is approximately:",o:["ΔA = αLΔT","ΔA = γA₀ΔT","Q = mL","F = ma"],a:1,e:"ΔA = γA₀ΔT, where γ is the coefficient of area expansion."},
{q:"In ΔA = γA₀ΔT, γ is the coefficient of:",o:["Linear expansion","Volume expansion","Area (superficial) expansion","Friction"],a:2,e:"The area expansion coefficient relates fractional area change to temperature change."},
{q:"The SI unit of area expansion coefficient is:",o:["m²","K","m²/K","K⁻¹"],a:3,e:"The coefficient is fractional area change per kelvin, so its unit is K⁻¹."},
{q:"For a small temperature change, area expansion is proportional to:",o:["Initial area, coefficient and temperature change","Only the object's mass","Only the object's colour","The square of its speed"],a:0,e:"The relation is ΔA = γA₀ΔT."},
{q:"For an isotropic solid, the area expansion coefficient γ is approximately:",o:["α/2","2α","3α","α²"],a:1,e:"For small changes, the area coefficient is approximately twice the linear coefficient."},
{q:"A square sheet has initial area 2 m², γ = 2×10⁻⁵ K⁻¹ and warms by 10 K. Its area increase is:",o:["0.4 m²","0.004 m²","0.0004 m²","0.00004 m²"],a:2,e:"ΔA = 2×10⁻⁵ × 2 × 10 = 4×10⁻⁴ m² = 0.0004 m²."},
{q:"If the initial area doubles while γ and ΔT remain fixed, the area increase:",o:["Halves","Does not change","Becomes four times larger","Doubles"],a:3,e:"Area increase is directly proportional to initial area."},
{q:"When an isotropic metal plate is heated uniformly, its circular hole generally:",o:["Expands","Shrinks","Disappears","Keeps exactly the same area"],a:0,e:"A hole expands as if the material occupying it expanded with the plate."},
{q:"A plate cools uniformly without changing state. Its area generally:",o:["Increases","Decreases","Becomes infinite","Must remain unchanged"],a:1,e:"Most solids contract when cooled."},
{q:"Which coefficient describes fractional area change per kelvin?",o:["Linear coefficient","Volume coefficient","Area expansion coefficient","Thermal conductivity"],a:2,e:"The area coefficient describes ΔA/A₀ per degree of temperature change."},
{q:"A metal lid becomes easier to remove from a glass jar after warming because the lid:",o:["Loses mass","Contracts","Becomes magnetic","Expands"],a:3,e:"Heating causes the metal lid to expand slightly, loosening it."},
{q:"A plate of area 1 m² with γ = 3×10⁻⁵ K⁻¹ warms by 20 K. Its area increase is:",o:["6×10⁻⁴ m²","6×10⁻⁵ m²","3×10⁻⁴ m²","1.5×10⁻⁴ m²"],a:0,e:"ΔA = 3×10⁻⁵ × 1 × 20 = 6×10⁻⁴ m²."},
{q:"For an isotropic solid, if α = 1.2×10⁻⁵ K⁻¹, γ is approximately:",o:["0.6×10⁻⁵ K⁻¹","2.4×10⁻⁵ K⁻¹","3.6×10⁻⁵ K⁻¹","1.44×10⁻¹⁰ K⁻²"],a:1,e:"γ ≈ 2α = 2.4×10⁻⁵ K⁻¹."},
{q:"If the temperature change is zero, the simple area-expansion formula predicts:",o:["Infinite area change","Area halves","No thermal area change","Area doubles"],a:2,e:"ΔT = 0 gives ΔA = γA₀ΔT = 0."},
{q:"A 0.5 m² plate increases in area by 0.0002 m² when heated by 20 K. Its γ is:",o:["2×10⁻⁴ K⁻¹","4×10⁻⁵ K⁻¹","1×10⁻⁵ K⁻¹","2×10⁻⁵ K⁻¹"],a:3,e:"γ = ΔA/(A₀ΔT) = 0.0002/(0.5×20) = 2×10⁻⁵ K⁻¹."},
{q:"Which quantity is not directly included in ΔA = γA₀ΔT?",o:["Mass","Initial area","Expansion coefficient","Temperature change"],a:0,e:"Mass does not appear directly in the area-expansion relation."},
{q:"If γ is larger, for the same initial area and temperature rise, the area change is:",o:["Smaller","Larger","Always zero","Independent of γ"],a:1,e:"Area change is directly proportional to γ."},
{q:"A bimetallic sheet may bend when heated because its metals have different:",o:["Masses only","Colours only","Thermal expansion coefficients","Electrical charges"],a:2,e:"Different expansion rates cause the bonded layers to curve."},
{q:"Area expansion is also known as:",o:["Linear strain","Volume compression","Thermal resistance","Superficial expansion"],a:3,e:"Superficial expansion is another term for area expansion."},
{q:"A plate has area 3 m² and γ = 1×10⁻⁵ K⁻¹. If heated by 40 K, ΔA is:",o:["0.0012 m²","0.012 m²","0.00012 m²","0.12 m²"],a:0,e:"ΔA = 1×10⁻⁵ × 3 × 40 = 0.0012 m²."},
{q:"For a square plate, if each side expands slightly, its area change depends on:",o:["Only its colour","Expansion of both dimensions","Only its mass","Only the surrounding air pressure"],a:1,e:"Area depends on both length dimensions, so both contribute to area expansion."},
{q:"The approximate relation γ ≈ 2α is most suitable for:",o:["Large phase changes","Liquids only","Small expansions of isotropic solids","Any material under any condition"],a:2,e:"The relation follows from small-strain expansion in isotropic solids."},
{q:"Why should a precision metal plate be allowed to expand freely when heated?",o:["To increase its density","To prevent all heat transfer","To make it lose mass","To reduce thermal stress and distortion"],a:3,e:"Restraining thermal expansion can create stress and warping."},
{q:"A plate's area rises from 1.000 m² to 1.001 m² for a 25 K rise. Approximate γ is:",o:["4×10⁻⁵ K⁻¹","1×10⁻³ K⁻¹","2.5×10⁻⁵ K⁻¹","1×10⁻⁵ K⁻¹"],a:0,e:"γ ≈ ΔA/(A₀ΔT) = 0.001/(1×25) = 4×10⁻⁵ K⁻¹."},
{q:"If the initial area is tripled and other variables stay fixed, ΔA becomes:",o:["One-third","Three times as large","Nine times as large","Unchanged"],a:1,e:"The area increase is directly proportional to initial area."},
{q:"A hole in a uniformly heated metal plate follows approximately the same area expansion coefficient as:",o:["The air only","A different unrelated material","The plate material","Water"],a:2,e:"The hole's dimensions change as if it were made of the plate material."},
{q:"Which formula gives the area expansion coefficient?",o:["γ = A₀/(ΔAΔT)","γ = ΔT/ΔA","γ = ΔA×A₀×ΔT","γ = ΔA/(A₀ΔT)"],a:3,e:"Rearranging ΔA = γA₀ΔT gives γ = ΔA/(A₀ΔT)."},
{q:"A 2 m² sheet with γ = 1.5×10⁻⁵ K⁻¹ warms by 30 K. Its area increase is:",o:["9×10⁻⁴ m²","9×10⁻³ m²","4.5×10⁻⁴ m²","1.5×10⁻⁴ m²"],a:0,e:"ΔA = 1.5×10⁻⁵ × 2 × 30 = 9×10⁻⁴ m²."},
{q:"Which statement about area expansion is correct?",o:["It changes chemical identity","It is a temperature-related change in surface area","It applies only to gases","It always decreases on heating"],a:1,e:"Area expansion describes surface-area change with temperature."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Pascal&#39;s Law Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
