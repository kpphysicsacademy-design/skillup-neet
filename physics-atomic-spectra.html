<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Atomic Spectra</title><meta name="description" content="SkillUp Physics Atomic Spectra interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🌈</span><h1>Atomic Spectra</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["An atomic spectrum is produced when atoms:",["Emit or absorb electromagnetic radiation at specific frequencies","Emit only sound waves","Reflect all visible light continuously","Stop all electron motion"],0,"Atomic spectra arise from transitions between quantised atomic energy levels, producing characteristic radiation frequencies."] ,["The spectrum of an isolated atom is generally:",["Line spectrum","Continuous spectrum only","A mechanical spectrum","A thermal spectrum only"],0,"Isolated atoms have discrete energy levels, so their emitted or absorbed radiation appears at discrete spectral lines."] ,["A bright-line spectrum is also called an:",["Emission spectrum","Absorption spectrum","Blackbody spectrum","Reflection spectrum"],0,"Bright spectral lines are produced when excited atoms emit photons at characteristic frequencies."] ,["An absorption spectrum is produced when:",["Atoms absorb selected wavelengths from a continuous spectrum","Atoms emit every wavelength equally","A mirror reflects white light","Electrons leave the nucleus"],0,"Cooler atoms in front of a continuous source can absorb particular wavelengths, producing dark lines."] ,["Atomic spectral lines are characteristic of an element because:",["Each element has a unique set of quantised energy levels","All elements have identical nuclei","All atoms emit the same frequencies","Spectral lines depend only on temperature"],0,"The allowed energy-level spacings differ among elements, giving characteristic spectral fingerprints."] ,["When an electron moves from a higher energy level to a lower level, the atom:",["Emits a photon","Absorbs a photon","Loses its nucleus","Becomes electrically neutral in every case"],0,"A downward transition releases energy as a photon with E=hν equal to the energy difference."] ,["For a transition between energy levels E2 and E1, the emitted photon energy is:",["hν=E2−E1","hν=E1+E2","hν=E1−E2 only for emission","hν=0"],0,"For downward emission from E2 to E1, photon energy is E2−E1=hν."] ,["The frequency of a spectral line is related to the energy difference ΔE by:",["ν=ΔE/h","ν=hΔE","ν=ΔE·h","ν=1/(hΔE)"],0,"Planck's relation gives ΔE=hν, so ν=ΔE/h."] ,["The wavelength of emitted radiation is related to frequency by:",["λ=c/ν","λ=cν","λ=ν/c²","λ=hν"],0,"For electromagnetic radiation in vacuum, c=νλ, hence λ=c/ν."] ,["In the hydrogen atom, the visible series of spectral lines is called the:",["Balmer series","Lyman series","Paschen series","Brackett series"],0,"The Balmer series consists of hydrogen transitions ending at n=2 and lies in the visible/near-UV region, with visible lines prominent."] ,["Hydrogen transitions ending at n=1 form the:",["Lyman series","Balmer series","Paschen series","Pfund series"],0,"The Lyman series corresponds to transitions from higher levels to n=1 and lies in the ultraviolet region."] ,["Hydrogen transitions ending at n=3 form the:",["Paschen series","Lyman series","Balmer series","Brackett series"],0,"The Paschen series corresponds to transitions ending at n=3 and lies mainly in the infrared region."] ,["The spectral line formula for hydrogen is represented by the Rydberg relation:",["1/λ=R(1/n1²−1/n2²), with n2>n1","λ=R(n1+n2)","1/λ=R(n1²+n2²)","λ=R/n1n2"],0,"The Rydberg relation describes hydrogen spectral wavelengths using the initial and final principal quantum numbers."] ,["If a photon has greater frequency, its energy is:",["Greater","Smaller","Always zero","Independent of frequency"],0,"Because E=hν, photon energy increases directly with frequency."] ,["Atomic spectra provide evidence that atomic energy levels are:",["Quantised or discrete","Completely continuous","Independent of the atom","Always equally spaced"],0,"Discrete spectral lines show that atoms exchange energy in definite amounts corresponding to discrete energy differences."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
