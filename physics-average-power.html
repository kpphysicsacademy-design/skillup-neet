<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Average Power</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:flex-end;margin-bottom:20px}.xp{background:#fff;padding:12px 18px;border-radius:18px;box-shadow:0 5px 18px #17203314;font-weight:800}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff;border-radius:22px;padding:26px 20px;margin-bottom:12px;box-shadow:0 8px 22px #12539d25}.hero small{font-size:.82rem}.hero h1{margin:9px 0 10px;font-size:1.9rem}.hero p{margin:0}.card{background:#fff;border-radius:22px;padding:20px;margin:12px 0;box-shadow:0 6px 20px #17203312}.progress-head{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:12px;background:#dfe8f1;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;border-radius:999px;transition:width .3s}.qnum{font-size:.9rem;font-weight:800;color:#35516f;margin-bottom:12px}.question{font-size:1.28rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{width:100%;padding:14px 15px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#58cc02;background:#f7fff1;transform:translateY(-1px)}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.actions{margin-top:16px}.btn{padding:12px 20px;border:0;border-radius:13px;font-weight:850;cursor:pointer;background:#2db84d;color:#fff;box-shadow:0 4px 0 #21863a;transition:.12s}.btn:hover:not(:disabled){transform:translateY(-1px)}.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #21863a}.feedback{margin-top:14px;padding:13px;border-radius:14px;font-weight:700;min-height:20px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:8px;color:#5146a5;font-weight:800;text-decoration:none;padding:9px 12px;border-radius:12px}.back:hover{background:#f0edff;transform:translateX(-2px)}@media(max-width:600px){.wrap{padding:20px 14px 34px}.hero h1{font-size:1.55rem}.question{font-size:1.15rem}.card{padding:17px}}</style></head><body><main class="wrap"><div class="top"><div class="xp">⚡ <span id="xp">0</span> XP</div></div><section class="hero"><small>PHYSICS • NEET 2026</small><h1>⚡ Average Power</h1><p>LEARN → PRACTICE → MASTER • 15 focused NEET-style MCQs</p></section><section class="card"><div class="progress-head"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count">Question 1 of 15</div><h2 class="question" id="question"></h2><div id="options" class="options"></div><div class="actions"><button id="continue" class="btn">Continue →</button></div><div id="feedback" class="feedback"></div></section><a href="physics-home.html" id="back" class="back">← Back to Physics Path</a></main><script>(function(){const quiz=[['Average power is defined as:',['total work divided by total time','instantaneous work divided by distance','force divided by time','energy multiplied by time'],0,'Average power is P_avg=W/Δt.'],['The SI unit of power is:',['watt','joule','newton','pascal'],0,'The SI unit of power is watt (W), equal to J/s.'],['A machine does 600 J of work in 20 s. Its average power is:',['30 W','12 W','120 W','300 W'],0,'P_avg=W/t=600/20=30 W.'],['A 100 W bulb operates for 10 s. The energy supplied is:',['1000 J','100 J','10 J','0.1 J'],0,'E=Pt=100×10=1000 J.'],['If the same work is done in half the time, average power becomes:',['twice','half','four times','unchanged'],0,'For fixed work, P_avg is inversely proportional to time.'],['A person does 1200 J of work in 60 s. Average power is:',['20 W','72 W','120 W','720 W'],0,'P_avg=1200/60=20 W.'],['Which expression gives average power in terms of energy transferred?',['E/Δt','EΔt','Δt/E','E+Δt'],0,'Power is the rate of energy transfer: P_avg=E/Δt.'],['A motor lifts a load doing 5000 J of work in 25 s. Its average power is:',['200 W','125 W','500 W','1000 W'],0,'P_avg=5000/25=200 W.'],['One horsepower is approximately:',['746 W','100 W','1000 W','74.6 W'],0,'1 hp is approximately 746 W.'],['If a machine has useful output energy 800 J in 4 s, its useful average power is:',['200 W','804 W','3200 W','196 W'],0,'P_avg=800/4=200 W.'],['Average power can be zero over an interval when:',['net work done is zero','force is always maximum','time is zero','energy is infinite'],0,'If net work or net energy transfer over the interval is zero, average power is zero.'],['A 2 kW motor runs for 5 s. Energy delivered is:',['10 kJ','2.5 kJ','400 J','100 kJ'],0,'E=Pt=2000×5=10000 J=10 kJ.'],['For constant force parallel to velocity, power is:',['Fv','F/v','v/F','F+v'],0,'Instantaneous power P=F·v=Fv for parallel force and velocity.'],['A force of 50 N moves an object at 4 m/s in its direction. The power is:',['200 W','12.5 W','46 W','250 W'],0,'P=Fv=50×4=200 W.'],['Which statement about average and instantaneous power is correct?',['Average power is measured over a time interval','They are always equal','Average power has no unit','Instantaneous power is work only'],0,'Average power describes the rate over a finite interval; instantaneous power is the limiting rate at an instant.']];let i=0,selected=-1,score=0,checked=false;const $=id=>document.getElementById(id),q=$("question"),o=$("options"),b=$("continue"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;q.textContent=a[0];$("count").textContent='Question '+(i+1)+' of 15';o.innerHTML='';f.className='feedback';f.textContent='';b.disabled=false;b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const x=document.createElement('button');x.className='option';x.textContent=String.fromCharCode(65+j)+'. '+item.text;x.dataset.index=item.index;x.onclick=()=>{selected=item.index;[...o.children].forEach(z=>z.classList.remove('selected'));x.classList.add('selected')};o.appendChild(x)})}b.onclick=function(){if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(x=>{const idx=Number(x.dataset.index);x.disabled=true;if(idx===a[2])x.classList.add('correct');if(idx===selected&&!ok)x.classList.add('wrong')});if(ok){score++;f.className='feedback good';f.textContent='🎯 Correct! +10 XP — '+a[3]}else{f.className='feedback bad';f.textContent='✗ Review — Correct answer: '+a[1][a[2]]+'. '+a[3]}$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';return}if(i<14){i++;render();window.scrollTo({top:0,behavior:'smooth'})}else{q.textContent='🏆 Average Power Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.';localStorage.setItem('skillupPhysicsAveragePowerScore',score)}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
