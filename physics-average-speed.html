<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Average Speed</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🏃 Average Speed</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['Average speed is defined as','total displacement divided by total time','total distance travelled divided by total time taken','maximum speed divided by minimum speed','distance travelled multiplied by time',1,'Average speed is total distance travelled divided by the total time taken.'],
['A car travels 60 km in 2 h. Its average speed is','20 km/h','30 km/h','60 km/h','120 km/h',1,'Average speed = total distance/total time = 60/2 = 30 km/h.'],
['A body travels 10 m in the first 2 s and 20 m in the next 3 s. Its average speed is','5 m/s','6 m/s','7 m/s','10 m/s',1,'Total distance = 30 m and total time = 5 s, so average speed = 30/5 = 6 m/s.'],
['A runner completes one full 400 m lap in 50 s. The average speed is','4 m/s','8 m/s','20 m/s','450 m/s',1,'Average speed = 400/50 = 8 m/s.'],
['If a body covers equal distances with speeds v and 2v, its average speed is','3v/2','4v/3','2v','v/2',1,'For equal distances, average speed is the harmonic mean: 2v(2v)/(v+2v) = 4v/3.'],
['If a body travels for equal time intervals with speeds v and 2v, its average speed is','v/2','2v/3','3v/2','2v',2,'For equal time intervals, average speed is the arithmetic mean: (v+2v)/2 = 3v/2.'],
['A car travels 30 km at 30 km/h and another 30 km at 60 km/h. Its average speed is','30 km/h','40 km/h','45 km/h','60 km/h',1,'Total distance = 60 km; total time = 1 h + 0.5 h = 1.5 h. Average speed = 60/1.5 = 40 km/h.'],
['A person walks 5 m east and then 5 m west in 10 s. The average speed is','0 m/s','0.5 m/s','1 m/s','10 m/s',2,'Total distance is 10 m and total time is 10 s, so average speed = 1 m/s.'],
['For any motion, average speed is always','less than or equal to the magnitude of average velocity','greater than the magnitude of average velocity','equal to average velocity','zero',0,'Average speed uses total distance, while average velocity uses displacement. Since distance is at least the magnitude of displacement, average speed is at least the magnitude of average velocity.'],
['A particle covers 100 m in 10 s and 50 m in 5 s. Its average speed is','5 m/s','10 m/s','15 m/s','20 m/s',1,'Total distance = 150 m and total time = 15 s. Average speed = 150/15 = 10 m/s.'],
['If total distance travelled is doubled while total time remains unchanged, average speed','becomes half','remains unchanged','doubles','becomes four times',2,'Average speed = distance/time, so doubling distance at the same time doubles average speed.'],
['If both total distance and total time are doubled, average speed','doubles','becomes half','remains unchanged','becomes four times',2,'The factor of 2 cancels: (2d)/(2t) = d/t.'],
['A vehicle covers half of a journey at 20 m/s and the other half at 30 m/s. Its average speed is','24 m/s','25 m/s','26 m/s','50 m/s',0,'For equal distances, average speed = 2v1v2/(v1+v2) = 2×20×30/50 = 24 m/s.'],
['The SI unit of average speed is','km/h','m/s','m','s',1,'Speed is distance divided by time, so its SI unit is metre per second (m/s).'],
['A body moves 100 m in 5 s, stops for 5 s, and then moves another 100 m in 10 s. Its average speed for the whole interval is','10 m/s','12 m/s','13.33 m/s','20 m/s',1,'Total distance = 200 m and total elapsed time including the stop = 20 s. Average speed = 200/20 = 10 m/s.'],
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
