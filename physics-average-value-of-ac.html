<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Average Value of AC</title><meta name="description" content="SkillUp Physics Average Value of AC interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">〰️</span><h1>Average Value of AC</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["For a sinusoidal AC voltage v=V₀sinωt, the average value over one complete cycle is:",["V₀","V₀/2","V₀/√2","Zero"],3,"Positive and negative half cycles cancel over a complete cycle."],["The average value of a sinusoidal AC voltage is usually calculated over:",["A complete cycle only","A positive half-cycle","An arbitrary instant","One quarter cycle only"],1,"For a symmetric sinusoid, the useful average magnitude is commonly taken over one half-cycle."],["The average value of a sinusoidal voltage over a positive half-cycle is:",["V₀/2","2V₀/π","V₀/√2","πV₀/2"],1,"Average value over a positive half-cycle is Vavg=2V₀/π≈0.637V₀."],["For a sinusoidal current with peak value I₀, its average magnitude over a half-cycle is:",["I₀/2","2I₀/π","I₀/√2","πI₀/2"],1,"Iavg=2I₀/π for a half-cycle."],["The average value of a pure sine wave over a complete cycle is zero because:",["Its peak is zero","Positive and negative areas cancel","Its RMS is zero","Its frequency is zero"],1,"The positive and negative half-cycle contributions are equal and opposite."],["If the peak voltage is 100 V, the average value over a positive half-cycle is approximately:",["31.8 V","50 V","63.7 V","70.7 V"],2,"Vavg=2×100/π≈63.7 V."],["If the average value over a positive half-cycle is 127.3 V, the peak voltage is approximately:",["100 V","150 V","200 V","254.6 V"],2,"V₀=πVavg/2≈200 V."],["The ratio of average value to peak value for a sine wave over a half-cycle is:",["1/2","2/π","1/√2","π/2"],1,"Vavg/V₀=2/π≈0.637."],["For a sinusoidal waveform, RMS value divided by peak value is:",["2/π","1/2","1/√2","π/2"],2,"Vᵣₘₛ/V₀=1/√2≈0.707."],["Which value is zero for a pure sinusoidal AC voltage when averaged over a complete cycle?",["Peak value","RMS value","Average value","Amplitude"],2,"The algebraic average over a complete symmetric cycle is zero."],["A sine wave has equal positive and negative half-cycles. Its average over one cycle is therefore:",["Positive","Negative","Zero","Maximum"],2,"Equal positive and negative contributions give zero net average."],["The average value over a positive half-cycle is sometimes called the:",["Mean value","Peak value","RMS value","Instantaneous value"],0,"The mean or average value of a rectified/positive half-cycle is 2V₀/π."],["For a full-wave rectified sine wave, the average output is:",["Zero","2V₀/π","V₀/√2","V₀"],1,"Full-wave rectification makes both half-cycles positive, giving average 2V₀/π."],["If V₀=314 V, the average value over a positive half-cycle is approximately:",["100 V","141.4 V","200 V","314 V"],2,"2×314/π≈200 V."],["For a sinusoidal AC voltage, which quantity is most directly related to heating effect in a resistor?",["Average value over a complete cycle","RMS value","Peak value only","Phase angle only"],1,"RMS value determines the equivalent DC heating effect in a resistor."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="✓ Correct — "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="✗ Not quite — "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;i++;if(i<qs.length)render();else{$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`;$("fill").style.width="100%"}}function restart(){i=0;score=0;xp=0;$("quiz").hidden=false;$("result").hidden=true;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
