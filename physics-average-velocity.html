<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Average Velocity</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eef7ff;color:#173b62}.wrap{max-width:1050px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.xp{background:#fff;border:2px solid #dbe7f1;border-radius:14px;padding:7px 11px;font-weight:900}.hero,.card{background:#fff;border-radius:20px;padding:22px;margin:12px 0;box-shadow:0 6px 18px #123b7015}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #dbe7f1;border-radius:15px;background:#fff;text-align:left;font-weight:700;cursor:pointer}.option.selected{border-color:#1677ff;background:#eef6ff}.option.correct{border-color:#2db84d;background:#eaffef}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{padding:12px 18px;border:0;border-radius:13px;font-weight:900;cursor:pointer;margin:8px 6px 0 0}.check{background:#2db84d;color:#fff}.next{background:#dcecff;color:#145b9e}.next:disabled{opacity:.45}.feedback{margin-top:14px;padding:13px;border-radius:14px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.bar{height:13px;background:#dce8f2;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#42c95a}@media(max-width:750px){.layout{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><a href="physics-home.html">← Back to Physics Path</a><span class="xp">⚡ <span id="xp">0</span> XP</span></div><section class="hero"><div>PHYSICS • NEET 2026</div><h1>Average Velocity</h1><p>LEARN → PRACTICE → MASTER • <span>15 focused NEET-style MCQs</span></p></section><section class="card"><b>🎯 Skill Mastery <span id="mt">0 / 15</span></b><div class="bar"><div id="fill" class="fill"></div></div></section><div class="layout"><aside class="card"><h3 id="count">Question 1 of 15</h3><div id="pct">7%</div><div>Average Velocity</div><div>⚡ +10 XP each</div><div>🦉 Learn → Practice → Master</div></aside><section class="card"><b id="badge">Q1</b><h2 id="q"></h2><div id="opts" class="options"></div><button id="check" class="btn check">Check Answer</button><button id="next" class="btn next" disabled>Next Question →</button><div id="fb" class="feedback"></div><p>💡 Choose the best answer.</p></section></div></main><script>(function(){const quiz=[['Average velocity is defined as:',['Total distance divided by total time','Total displacement divided by total time','Change in speed divided by time','Total time divided by displacement'],1],['Average velocity is a:',['Scalar quantity','Vector quantity','Dimensionless quantity','Unit only'],1],['The SI unit of average velocity is:',['m','m/s','m/s²','km/h only'],1],['A particle has displacement 40 m east in 8 s. Its average velocity is:',['5 m/s east','320 m/s east','0.2 m/s east','48 m/s east'],0],['A body travels 60 m east and then 20 m west in 10 s. Its average velocity is:',['8 m/s east','4 m/s east','6 m/s east','2 m/s west'],1],['A runner completes one full 400 m lap and returns to the start in 80 s. Average velocity is:',['5 m/s','0 m/s','400 m/s','80 m/s'],1],['If total displacement is zero for a journey of nonzero duration, average velocity is:',['Zero','Infinite','Equal to average speed','Always negative'],0],['For a given time interval, average velocity depends on:',['Total distance only','Net displacement','Path length only','Speed at the final instant only'],1],['A car moves 30 m north in 5 s and then 10 m south in 5 s. Its average velocity for the whole journey is:',['4 m/s north','2 m/s north','8 m/s north','4 m/s south'],0],['If displacement is negative in a chosen coordinate system, average velocity for positive time is:',['Negative','Always positive','Zero necessarily','Undefined'],0],['A particle moves from x = 2 m to x = 14 m in 3 s. Average velocity is:',['4 m/s','12 m/s','16 m/s','3 m/s'],0],['A particle moves from x = 10 m to x = 4 m in 2 s. Its average velocity is:',['3 m/s','-3 m/s','7 m/s','-7 m/s'],1],['Can average velocity be zero while average speed is nonzero?',['Yes, when the body returns to its starting point','No, never','Only when the body is at rest','Only in uniform motion'],0],['For one-dimensional motion, average velocity over an interval is zero when:',['Initial and final positions are the same','Distance travelled is zero only','Acceleration is zero','Speed is constant'],0],['Which statement is correct?',['Average velocity uses displacement, whereas average speed uses distance','Average velocity and average speed are always equal','Average velocity is always positive','Average velocity cannot be zero'],0]];let i=0,sel=-1,score=0,q=document.getElementById('q'),o=document.getElementById('opts'),fb=document.getElementById('fb'),check=document.getElementById('check'),next=document.getElementById('next');function render(){let a=quiz[i];sel=-1;q.textContent=a[0];document.getElementById('badge').textContent='Q'+(i+1);document.getElementById('count').textContent='Question '+(i+1)+' of '+quiz.length;document.getElementById('pct').textContent=Math.round((i+1)/quiz.length*100)+'%';o.innerHTML='';fb.textContent='';fb.className='feedback';check.disabled=false;next.disabled=true;a[1].forEach((v,j)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+v;b.onclick=()=>{sel=j;[...o.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)})}check.onclick=()=>{if(sel<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}let a=quiz[i];[...o.children].forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===sel&&j!==a[2])b.classList.add('wrong')});if(sel===a[2]){score++;fb.className='feedback good';fb.textContent='🎯 Correct! +10 XP'}else{fb.className='feedback bad';fb.textContent='Not quite. Correct answer: '+a[1][a[2]]}document.getElementById('xp').textContent=score*10;document.getElementById('mt').textContent=score+' / '+quiz.length;document.getElementById('fill').style.width=(score/quiz.length*100)+'%';check.disabled=true;next.disabled=false;if(i===quiz.length-1)next.textContent='Finish Skill →'};next.onclick=()=>{if(i<quiz.length-1){i++;next.textContent='Next Question →';render()}else{q.textContent='🏆 Average Velocity Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+score+' / '+quiz.length+' correct • '+score*10+' XP'}};render()})();</script></body></html>
