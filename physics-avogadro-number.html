<script>
(function(){
'use strict';
const questions = [{"q":"Avogadro constant represents the number of specified entities in…","o":["1 kilogram","1 mole","1 litre","1 gram"],"a":1,"e":"One mole contains Avogadro's number of specified entities."},{"q":"The accepted approximate value of Avogadro constant is…","o":["6.022 × 10²³ mol⁻¹","6.022 × 10²² mol⁻¹","3.011 × 10²³ mol⁻¹","1.602 × 10⁻¹⁹ mol⁻¹"],"a":0,"e":"Avogadro constant is approximately 6.022 × 10²³ per mole."},{"q":"The SI unit for Avogadro constant is…","o":["mol","mol⁻¹","kg mol⁻¹","m³ mol⁻¹"],"a":1,"e":"It counts entities per mole, so its unit is mol⁻¹."},{"q":"How many molecules are present in 2 mol of a molecular substance?","o":["Nₐ","2Nₐ","Nₐ/2","4Nₐ"],"a":1,"e":"Number of entities equals amount in moles multiplied by Nₐ."},{"q":"How many moles correspond to Nₐ atoms?","o":["0.5 mol","1 mol","2 mol","Nₐ mol"],"a":1,"e":"Avogadro constant atoms represent one mole of atoms."},{"q":"How many particles are in 0.5 mol?","o":["3.011 × 10²³","6.022 × 10²³","1.2044 × 10²⁴","3.011 × 10²²"],"a":0,"e":"N = nNₐ = 0.5 × 6.022 × 10²³ = 3.011 × 10²³."},{"q":"How many particles are in 3 mol?","o":["2.007 × 10²³","6.022 × 10²³","1.8066 × 10²⁴","3.011 × 10²⁴"],"a":2,"e":"N = 3 × 6.022 × 10²³ = 1.8066 × 10²⁴."},{"q":"The number of moles in 1.2044 × 10²⁴ particles is…","o":["0.5 mol","1 mol","2 mol","4 mol"],"a":2,"e":"n = N/Nₐ = 1.2044 × 10²⁴ / 6.022 × 10²³ = 2 mol."},{"q":"How many atoms are present in 1 mol of helium?","o":["6.022 × 10²³","1.2044 × 10²⁴","3.011 × 10²³","2"],"a":0,"e":"Helium is monatomic; one mole contains Nₐ atoms."},{"q":"How many atoms are present in 1 mol of O₂ molecules?","o":["Nₐ","2Nₐ","Nₐ/2","4Nₐ"],"a":1,"e":"Each O₂ molecule has two atoms, so one mole of molecules contains 2Nₐ atoms."},{"q":"How many molecules are in 1 mol of H₂O?","o":["Nₐ","2Nₐ","3Nₐ","Nₐ/3"],"a":0,"e":"One mole of water contains Nₐ water molecules."},{"q":"How many total atoms are present in 1 mol of H₂O molecules?","o":["Nₐ","2Nₐ","3Nₐ","4Nₐ"],"a":2,"e":"Each water molecule contains three atoms; total atoms = 3Nₐ."},{"q":"How many oxygen atoms are present in 2 mol of CO₂?","o":["2Nₐ","4Nₐ","Nₐ","6Nₐ"],"a":1,"e":"Each CO₂ molecule contains two oxygen atoms, so there are 2 × 2Nₐ oxygen atoms."},{"q":"How many molecules are in 0.25 mol of a gas?","o":["Nₐ/4","Nₐ/2","Nₐ","4Nₐ"],"a":0,"e":"N = 0.25Nₐ = Nₐ/4."},{"q":"A sample contains 1.8066 × 10²³ particles. Its amount is approximately…","o":["0.03 mol","0.3 mol","3 mol","30 mol"],"a":1,"e":"Divide by 6.022 × 10²³: the amount is 0.3 mol."},{"q":"How many moles are present in 12.044 × 10²³ particles?","o":["0.2 mol","1 mol","2 mol","20 mol"],"a":2,"e":"12.044 × 10²³ divided by 6.022 × 10²³ equals 2 mol."},{"q":"Avogadro constant is used to convert between…","o":["Pressure and temperature","Moles and number of entities","Mass and volume only","Speed and kinetic energy"],"a":1,"e":"Multiplying or dividing by Nₐ connects amount of substance to entity count."},{"q":"Which entity count is meant by one mole?","o":["Always atoms only","Always molecules only","A specified number of elementary entities","Exactly one gram of any substance"],"a":2,"e":"The specified entity may be atoms, molecules, ions, or other defined particles."},{"q":"The number of molecules in 1 mol of N₂ is…","o":["Nₐ","2Nₐ","Nₐ/2","14Nₐ"],"a":0,"e":"One mole of N₂ contains Nₐ molecules; each molecule has two atoms."},{"q":"How many nitrogen atoms are present in 1 mol of N₂?","o":["Nₐ/2","Nₐ","2Nₐ","4Nₐ"],"a":2,"e":"Each N₂ molecule has two nitrogen atoms, giving 2Nₐ atoms per mole of molecules."},{"q":"A sample has 6.022 × 10²² molecules. Its amount is…","o":["0.01 mol","0.1 mol","1 mol","10 mol"],"a":1,"e":"6.022 × 10²² is one-tenth of Nₐ, so the amount is 0.1 mol."},{"q":"How many molecules are in 4 mol of a gas?","o":["Nₐ","2Nₐ","4Nₐ","8Nₐ"],"a":2,"e":"Entity count is nNₐ, so 4 mol contains 4Nₐ molecules."},{"q":"If the number of moles doubles, with the substance unchanged, the number of entities…","o":["Halves","Doubles","Stays fixed","Becomes four times larger"],"a":1,"e":"N = nNₐ, so particle count is directly proportional to amount in moles."},{"q":"Which expression gives the amount of substance n from particle count N?","o":["n = NNₐ","n = N/Nₐ","n = Nₐ/N","n = N + Nₐ"],"a":1,"e":"Rearranging N = nNₐ gives n = N/Nₐ."},{"q":"Which expression gives particle count from amount n?","o":["N = n/Nₐ","N = Nₐ/n","N = nNₐ","N = n + Nₐ"],"a":2,"e":"Multiplying moles by entities per mole gives the total entity count."},{"q":"How many atoms are in 0.5 mol of monatomic argon?","o":["0.5Nₐ","Nₐ","2Nₐ","3Nₐ"],"a":0,"e":"Argon is monatomic, so 0.5 mol contains 0.5Nₐ atoms."},{"q":"How many total atoms are in 0.5 mol of O₂ molecules?","o":["0.5Nₐ","Nₐ","1.5Nₐ","2Nₐ"],"a":1,"e":"0.5 mol contains 0.5Nₐ molecules; two atoms per molecule gives Nₐ atoms."},{"q":"How many ions are present in 1 mol of Na⁺ ions?","o":["Nₐ","2Nₐ","Nₐ/2","Nₐ/6"],"a":0,"e":"One mole of ions contains Nₐ ions, regardless of their charge."},{"q":"A sample contains 3Nₐ molecules. Its amount is…","o":["1 mol","2 mol","3 mol","6 mol"],"a":2,"e":"n = N/Nₐ = 3Nₐ/Nₐ = 3 mol."},{"q":"The numerical value of Avogadro constant is associated with…","o":["The number of entities per mole","The mass of one electron in kilograms","The speed of light","The charge on one proton"],"a":0,"e":"Avogadro constant specifies the number of elementary entities per mole."}]
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Avogadro Number Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
