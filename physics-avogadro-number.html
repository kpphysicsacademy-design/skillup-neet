<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Avogadro Number</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🔢 Avogadro Number</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['The Avogadro constant is approximately','6.022 × 10²¹ mol⁻¹','6.022 × 10²³ mol⁻¹','9.81 × 10²³ mol⁻¹','3.00 × 10⁸ mol⁻¹',1,'The Avogadro constant is approximately 6.022 × 10²³ per mole.'],
['The symbol commonly used for Avogadro constant is','N_A','N_B','R_A','A_N',0,'N_A denotes the Avogadro constant.'],
['One mole of any substance contains approximately','6.022 × 10²³ entities','6.022 × 10²⁰ entities','3.011 × 10²³ entities','1.602 × 10⁻¹⁹ entities',0,'One mole contains approximately 6.022 × 10²³ specified entities.'],
['The SI unit of Avogadro constant is','mol','mol⁻¹','kg mol⁻¹','molecule mol',1,'Since N_A is the number of entities per mole, its SI unit is mol⁻¹.'],
['The number of particles N in n moles is given by','N = n/N_A','N = n + N_A','N = nN_A','N = N_A/n',2,'The number of particles is N = nN_A.'],
['How many molecules are present in 2 mol of a molecular substance?','3.011 × 10²³','6.022 × 10²³','1.2044 × 10²⁴','2.000 × 10²³',2,'N = nN_A = 2 × 6.022 × 10²³ = 1.2044 × 10²⁴ molecules.'],
['Approximately how many atoms are present in 0.5 mol of helium?','3.011 × 10²³','6.022 × 10²³','1.2044 × 10²⁴','5.00 × 10²²',0,'For 0.5 mol, N = 0.5 × 6.022 × 10²³ = 3.011 × 10²³ atoms.'],
['One mole of sodium atoms contains','one atom','one gram of sodium only','6.022 × 10²³ sodium atoms','6.022 × 10²³ sodium molecules',2,'A mole of sodium contains Avogadro number of sodium atoms.'],
['One mole of oxygen gas O₂ contains','6.022 × 10²³ oxygen atoms only','6.022 × 10²³ O₂ molecules','3.011 × 10²³ O₂ molecules','2 oxygen molecules',1,'One mole of O₂ contains N_A O₂ molecules, while the number of oxygen atoms is 2N_A.'],
['One mole of O₂ contains how many oxygen atoms?','N_A/2','N_A','2N_A','4N_A',2,'Each O₂ molecule has two oxygen atoms, so one mole contains 2N_A atoms.'],
['The number of moles in 3.011 × 10²³ particles is','0.25 mol','0.5 mol','1 mol','2 mol',1,'n = N/N_A = (3.011 × 10²³)/(6.022 × 10²³) = 0.5 mol.'],
['Avogadro constant connects the number of microscopic entities with','mass only','temperature only','amount of substance in moles','volume only',2,'N_A provides the number of specified entities contained in one mole.'],
['If a sample contains 6.022 × 10²⁴ molecules, its amount of substance is','0.1 mol','1 mol','10 mol','100 mol',2,'n = N/N_A = 6.022 × 10²⁴ / 6.022 × 10²³ = 10 mol.'],
['Which statement about Avogadro constant is correct?','It is the same as the gas constant R','It gives the number of specified entities per mole','It has no unit','It depends on the substance used',1,'N_A gives the number of specified elementary entities per mole and is a universal constant.'],
['The mass of one molecule of a substance with molar mass M is','MN_A','M/N_A','N_A/M','M + N_A',1,'For molar mass M, the mass of one molecule is M/N_A when M is expressed consistently in kg mol⁻¹.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
