<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🛠️ Bernoulli’s Theorem</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"Bernoulli’s theorem is based on conservation of:",o:["Electric charge","Mechanical energy","Nuclear mass","Temperature only"],a:1,e:"It relates pressure, kinetic and gravitational potential energy per unit volume."},
{q:"The standard Bernoulli equation is:",o:["p + ½ρv² + ρgh = constant","p + ρv = constant","pρgh = constant","p − ½ρv = 0"],a:0,e:"For ideal steady incompressible flow, p + ½ρv² + ρgh stays constant along a streamline."},
{q:"In Bernoulli’s equation, ½ρv² represents:",o:["Pressure head","Dynamic pressure","Hydrostatic pressure","Viscosity"],a:1,e:"½ρv² is the kinetic energy per unit volume, called dynamic pressure."},
{q:"Which is an assumption of the usual Bernoulli theorem?",o:["Highly viscous flow","Steady flow","Strong turbulence","Large heat addition"],a:1,e:"The standard form assumes steady, incompressible flow with negligible viscosity and no added energy."},
{q:"At the same height, if fluid speed increases, static pressure generally:",o:["Increases","Decreases","Stays zero","Must double"],a:1,e:"At equal height, increased kinetic energy per unit volume corresponds to lower static pressure."},
{q:"The SI unit of each term p, ½ρv² and ρgh is:",o:["N","J","Pa","kg"],a:2,e:"Each term is energy per unit volume, equivalent to pascals."},
{q:"Water flows horizontally from a wide pipe to a narrow section. In the narrow section, speed is:",o:["Lower","Higher","Always zero","Unchanged in all cases"],a:1,e:"Continuity requires greater speed in the smaller area for incompressible steady flow."},
{q:"For a horizontal pipe, Bernoulli’s equation becomes:",o:["p + ½ρv² = constant","p + ρgh = 0","p/v = constant","p − ρv² = constant"],a:0,e:"At the same height, the ρgh term cancels between points."},
{q:"A fluid has density 1000 kg/m³ and speed 2 m/s. Its dynamic pressure is:",o:["1000 Pa","2000 Pa","4000 Pa","500 Pa"],a:0,e:"½ρv² = 0.5 × 1000 × 2² = 2000 Pa."},
{q:"If fluid speed doubles, its dynamic pressure becomes:",o:["Double","Four times","Half","Eight times"],a:1,e:"Dynamic pressure is proportional to v², so doubling speed makes it four times larger."},
{q:"The pressure head in Bernoulli’s equation is:",o:["p/(ρg)","v²/(2g)","ρgh","pρg"],a:0,e:"Pressure head is pressure divided by ρg and has units of length."},
{q:"The velocity head is:",o:["p/(ρg)","v²/(2g)","gh²","ρv"],a:1,e:"Velocity head is the kinetic-energy term per unit weight."},
{q:"The elevation head is represented by:",o:["p/ρg","v²/2g","h","ρgh²"],a:2,e:"Elevation head is the height z or h above a chosen reference level."},
{q:"For ideal flow between two points, the Bernoulli constant is conserved:",o:["Along a streamline","Only at pipe entrances","Only in a stationary fluid","Across every streamline in all cases"],a:0,e:"The usual derivation guarantees the constant along a streamline."},
{q:"A venturimeter uses Bernoulli’s theorem to estimate:",o:["Fluid flow rate","Fluid colour","Temperature only","Electrical resistance"],a:0,e:"Pressure differences in a constricted section help determine flow speed and rate."},
{q:"A Pitot tube is commonly used to measure:",o:["Fluid speed","Fluid mass only","Pipe length","Viscosity directly"],a:0,e:"A Pitot tube uses the difference between stagnation and static pressure to determine speed."},
{q:"The pressure energy per unit volume in a flowing fluid is:",o:["p","ρv²","½ρv²","ρgh²"],a:0,e:"Pressure itself has units of energy per unit volume."},
{q:"For a fluid at rest, Bernoulli’s equation reduces to the hydrostatic relation:",o:["p + ρgh = constant","p + ½ρv² = 0","ρv = constant","p/h = 0"],a:0,e:"With v = 0, the kinetic term vanishes, leaving p + ρgh constant."},
{q:"Air moves faster over a region of an airfoil. In the simplified Bernoulli model, the static pressure there is:",o:["Higher","Lower","Always atmospheric","Always zero"],a:1,e:"At approximately equal height, faster airflow corresponds to lower static pressure."},
{q:"Which situation violates a key assumption of the standard Bernoulli equation?",o:["Steady ideal flow","Incompressible liquid flow","Large viscous energy loss","Flow along a streamline"],a:2,e:"Significant viscous losses require an energy-loss term beyond the simple Bernoulli equation."},
{q:"If p = 1.0 × 10⁵ Pa, ρ = 1000 kg/m³ and v = 4 m/s at a fixed height, p + ½ρv² equals:",o:["1.08 × 10⁵ Pa","1.04 × 10⁵ Pa","1.16 × 10⁵ Pa","1.80 × 10⁵ Pa"],a:0,e:"½ρv² = 8000 Pa, so the sum is 108000 Pa."},
{q:"At a point, p = 2.0 × 10⁵ Pa, ρ = 1000 kg/m³, v = 3 m/s and h = 2 m. Taking g = 10 m/s², total Bernoulli term is:",o:["2.045 × 10⁵ Pa","2.30 × 10⁵ Pa","2.65 × 10⁵ Pa","3.00 × 10⁵ Pa"],a:2,e:"p + ½ρv² + ρgh = 200000 + 4500 + 20000 = 224500 Pa."},
{q:"For horizontal ideal flow, p₁ = 80 kPa, v₁ = 2 m/s, v₂ = 6 m/s and ρ = 1000 kg/m³. p₂ is:",o:["64 kPa","72 kPa","80 kPa","96 kPa"],a:0,e:"p₂ = p₁ + ½ρ(v₁² − v₂²) = 80 kPa − 16 kPa = 64 kPa."},
{q:"A fluid’s speed at a horizontal point is zero (stagnation point). Its pressure is ideally:",o:["Stagnation pressure, the maximum along that streamline","Always zero","Lower than static pressure","Independent of speed"],a:0,e:"At a stagnation point, kinetic energy converts into pressure energy."},
{q:"Bernoulli’s theorem connects pressure with:",o:["Speed and height","Colour and odour","Charge and current","Only temperature"],a:0,e:"The total combines pressure, kinetic and gravitational potential energy terms."},
{q:"Which quantity is constant in ideal steady flow along a streamline?",o:["p + ½ρv² + ρgh","p alone always","v alone always","h alone always"],a:0,e:"The individual terms can change, but their sum remains constant."},
{q:"If height increases while speed stays constant, ideal-flow pressure generally:",o:["Increases","Decreases","Remains the same","Becomes zero"],a:1,e:"With speed unchanged, the increase in ρgh is balanced by a decrease in pressure."},
{q:"The term ρgh has the same units as:",o:["Pressure","Speed","Density","Acceleration"],a:0,e:"Density × gravity × height has units kg/(m·s²), equivalent to pascals."},
{q:"Bernoulli’s theorem is most directly applied to:",o:["Ideal fluid flow","Highly viscous turbulent flow with large losses","Solid rods under tension","Static electric fields"],a:0,e:"The standard form models steady incompressible flow with negligible viscous effects."},
{q:"In a horizontal constriction, the pressure drop is explained by conversion into:",o:["Greater kinetic energy per unit volume","Greater elevation energy","Electrical energy","Chemical energy"],a:0,e:"The increase in kinetic-energy term is balanced by a decrease in pressure term."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Bernoulli’s Theorem Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
