<script>
const questions=[
{q:'Bernoulli’s theorem is based primarily on conservation of',o:['mass only','energy','charge','temperature'],a:1,e:'Bernoulli’s equation expresses conservation of mechanical energy along a streamline for ideal steady flow.'},
{q:'For steady, incompressible, non-viscous flow along a streamline, Bernoulli’s equation is',o:['P + ρv²/2 + ρgh = constant','P + ρv + ρgh = constant','P/ρ + v² + gh = constant','P + ρv² + ρg/h = constant'],a:0,e:'The standard form is P + ½ρv² + ρgh = constant.'},
{q:'The term ½ρv² in Bernoulli’s equation represents',o:['pressure energy per unit volume','kinetic energy per unit volume','potential energy per unit mass','heat energy'],a:1,e:'½ρv² is the kinetic-energy density, or kinetic energy per unit volume.'},
{q:'The term ρgh represents',o:['kinetic energy per unit volume','gravitational potential energy per unit volume','pressure only','viscous loss'],a:1,e:'ρgh is gravitational potential energy per unit volume.'},
{q:'In a horizontal pipe with ideal fluid flow, where speed increases, static pressure generally',o:['increases','decreases','remains necessarily zero','becomes equal to density'],a:1,e:'At the same height, P + ½ρv² is constant, so higher speed corresponds to lower static pressure.'},
{q:'The SI unit of pressure in Bernoulli’s equation is',o:['J','Pa','N','W'],a:1,e:'Pressure is measured in pascals (Pa), equivalent to J m⁻³.'},
{q:'A fluid flows through a horizontal pipe. If its speed doubles, the dynamic pressure term ½ρv² becomes',o:['half','double','four times','unchanged'],a:2,e:'The dynamic pressure is proportional to v², so doubling speed makes it four times larger.'},
{q:'Bernoulli’s theorem in its elementary form applies to',o:['steady ideal flow along a streamline','all turbulent flows without conditions','solids only','static gases only'],a:0,e:'The usual elementary equation assumes steady, incompressible, non-viscous flow along a streamline.'},
{q:'A Venturi meter works primarily by relating pressure changes to fluid speed using',o:['Bernoulli’s theorem','Hooke’s law','Coulomb’s law','Ohm’s law'],a:0,e:'A constriction changes speed and pressure; Bernoulli’s equation is used with continuity to determine flow rate.'},
{q:'When an ideal fluid rises to a higher elevation with unchanged speed, its pressure generally',o:['increases','decreases','must become zero','always doubles'],a:1,e:'If speed is unchanged, the increase in ρgh must be balanced by a decrease in pressure P.'},
{q:'Water flows horizontally from a wide section into a narrow section of a pipe. In the narrow section, the speed is',o:['lower','higher','always zero','independent of area'],a:1,e:'Continuity gives Av = constant for incompressible flow, so smaller area means higher speed.'},
{q:'The pressure energy per unit volume of a fluid is represented by',o:['P','ρv²/2','ρgh','mg'],a:0,e:'Pressure P has units of energy per unit volume and is the pressure-energy term in Bernoulli’s equation.'},
{q:'A fluid of density 1000 kg m⁻³ flows at 4 m/s. Its dynamic pressure is',o:['2000 Pa','4000 Pa','8000 Pa','16000 Pa'],a:2,e:'½ρv² = ½ × 1000 × 16 = 8000 Pa.'},
{q:'If the pressure and speed at two points are equal, Bernoulli’s equation implies their elevations are',o:['equal','always different','zero','infinite'],a:0,e:'With the same pressure, speed and fluid density, the gravitational term requires equal heights.'},
{q:'The atomizer or perfume sprayer operates mainly because fast-moving air produces',o:['higher pressure that pushes liquid down','lower pressure that helps draw liquid upward','zero pressure everywhere','greater fluid viscosity'],a:1,e:'Fast air over the tube lowers pressure, allowing atmospheric pressure to push the liquid upward.'}

$('continue').onclick=next;
$('back').onclick=function(){const s=sessionStorage.getItem('skillupLastPhysicsPath');if(s){try{const u=new URL(s,location.href);if(u.origin===location.origin){location.href=s;return false}}catch(e){}}location.href='physics-home-fast.html';return false};
