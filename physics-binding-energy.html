<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Binding Energy</title><meta name="description" content="SkillUp Physics Binding Energy interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">⚛️</span><h1>Binding Energy</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["Nuclear binding energy is the energy required to:",["Completely separate a nucleus into free nucleons","Remove all electrons from an atom","Separate an atom into electrons only","Increase the atomic number"],0,"Binding energy is the energy needed to disassemble a nucleus into its free protons and neutrons."] ,["The binding energy of a nucleus is related to its mass defect by:",["B=Δmc²","B=Δm/c²","B=Δmc","B=mc/Δm"],0,"Mass-energy equivalence gives B=Δmc²."] ,["A nucleus with a larger binding energy per nucleon is generally:",["More tightly bound","Less tightly bound","Electron-free","Unstable in every case"],0,"Binding energy per nucleon measures the average strength of nuclear binding."] ,["Binding energy per nucleon is obtained by:",["Dividing total binding energy by mass number A","Multiplying binding energy by A","Dividing A by binding energy","Dividing binding energy by Z only"],0,"The average binding energy per nucleon is B/A."] ,["If the mass defect of a nucleus is 0.020 u, its binding energy is approximately:",["18.63 MeV","1.863 MeV","186.3 MeV","0.1863 MeV"],0,"Using 1 u≈931.5 MeV/c², 0.020 u corresponds to about 18.63 MeV."] ,["The binding energy curve generally reaches a maximum binding energy per nucleon near:",["Iron and neighbouring nuclei","Hydrogen only","Very heavy uranium nuclei","The electron shell"],0,"Nuclei near iron and nickel have among the highest binding energies per nucleon."] ,["A nucleus can release energy through fission when:",["A very heavy nucleus splits into more tightly bound nuclei","A proton becomes an electron","Electrons change shells","Its mass number becomes zero"],0,"Fission can release energy because the products can have greater binding energy per nucleon."] ,["Energy can be released in nuclear fusion because:",["Light nuclei combine to form a more tightly bound nucleus","All mass disappears","Electrons are removed","Atomic number becomes zero"],0,"Fusion of suitable light nuclei increases the binding per nucleon of the products and releases energy."] ,["For a nucleus with total binding energy 160 MeV and A=20, binding energy per nucleon is:",["8 MeV","80 MeV","180 MeV","0.125 MeV"],0,"B/A=160/20=8 MeV per nucleon."] ,["If a nucleus has binding energy per nucleon 7.5 MeV and A=40, its total binding energy is:",["300 MeV","47.5 MeV","5.33 MeV","3000 MeV"],0,"Total binding energy B=(B/A)A=7.5×40=300 MeV."] ,["A bound nucleus has less mass than its separated nucleons because:",["Binding energy has been released during formation","Protons lose electric charge","Neutrons disappear","Electrons become photons"],0,"The released binding energy corresponds to a mass decrease Δm through E=Δmc²."] ,["The unit MeV is commonly used for nuclear binding energy because:",["Nuclear energy scales are conveniently expressed in mega-electron-volts","MeV measures atomic number","MeV is a unit of mass number","MeV measures nuclear radius"],0,"Nuclear energy differences are typically much larger than ordinary chemical energies, so MeV is convenient."] ,["Which quantity is especially useful for comparing the average stability of nuclei of different mass numbers?",["Binding energy per nucleon","Mass number alone","Atomic number alone","Nuclear radius alone"],0,"B/A allows comparison of average nuclear binding across nuclei of different sizes."] ,["If a nuclear reaction produces products with greater total binding energy than the reactants, the reaction can:",["Release energy","Always absorb energy","Destroy charge conservation","Have no energy change"],0,"An increase in total binding energy corresponds to release of energy to the surroundings."] ,["The mass defect and binding energy demonstrate the nuclear importance of:",["Mass-energy equivalence","Only classical mechanics","Chemical valency","Gravitational attraction"],0,"The relation B=Δmc² connects the missing mass of a bound nucleus with its binding energy."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
