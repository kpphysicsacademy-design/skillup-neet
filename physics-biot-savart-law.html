<script>
const questions=[["The Biot–Savart law is used to calculate the magnetic field produced by",["a moving charge only","a steady current element","a stationary electric charge","a changing electric flux"],1,"It gives the magnetic field contribution due to a current element in steady-current conditions."],["The magnitude of the magnetic field contribution dB from a current element is",["(μ₀/4π)(I dl sin θ/r²)","(μ₀/4π)(I dl r²)","(μ₀/4π)(I/r)","(μ₀/4π)(I dl cos θ/r)"],0,"The magnitude form is dB = (μ₀/4π) I dl sin θ/r²."],["In the Biot–Savart law, θ is the angle between",["B and the wire","the current element dl and displacement vector r","the magnetic field and the current","the wire and the magnetic field"],1,"θ is measured between dl and the displacement vector from the element to the observation point."],["The direction of dB is determined by",["dl · r̂","dl × r̂","r̂ × r̂","the scalar distance alone"],1,"The cross product dl × r̂ sets the direction of the magnetic field element."],["For a fixed current element and observation distance, dB is maximum when θ equals",["0°","30°","90°","180°"],2,"Since dB ∝ sin θ, it is maximum at 90°."],["For a fixed current element, dB is zero when θ is",["90° only","45° only","0° or 180°","30° or 150°"],2,"The sine factor vanishes when the current element and displacement vector are parallel or antiparallel."],["If the current through a small element is doubled, its dB at the same point becomes",["half","double","four times","unchanged"],1,"The Biot–Savart field is directly proportional to current I."],["If the distance from a current element is doubled, its field contribution becomes",["twice","half","one-fourth","four times"],2,"The contribution varies as 1/r², so doubling r reduces it to one-fourth."],["The SI unit of magnetic field B is",["tesla","weber","henry","ampere"],0,"Magnetic flux density is measured in tesla (T)."],["The SI unit of permeability μ₀ is",["T m A⁻¹","T A m⁻¹","A T m⁻¹","T m² A⁻¹"],0,"From B = μ₀I/(2πr), permeability has units T·m/A."],["The magnetic field at perpendicular distance r from an infinitely long straight wire carrying current I is",["μ₀I/(2πr)","μ₀I/(4πr²)","μ₀Ir/(2π)","μ₀I/(2r²)"],0,"Integrating the Biot–Savart law along an infinitely long straight wire gives B = μ₀I/(2πr)."],["For a long straight wire, if distance from the wire is tripled, B becomes",["three times","one-third","one-ninth","nine times"],1,"For an infinite straight wire B ∝ 1/r."],["A long straight wire carries 5 A. The field at 0.1 m in vacuum is",["1 × 10⁻⁵ T","1 × 10⁻⁶ T","5 × 10⁻⁶ T","2 × 10⁻⁵ T"],0,"B = μ₀I/(2πr) = (4π×10⁻⁷×5)/(2π×0.1) = 1×10⁻⁵ T."],["The magnetic field at the centre of a single circular loop of radius R carrying current I is",["μ₀I/(2R)","μ₀I/(2πR)","μ₀I/R²","μ₀IR/2"],0,"At the centre of a circular loop, B = μ₀I/(2R)."],["For a circular coil of N turns, the field at its centre is",["μ₀NI/(2R)","μ₀I/(2NR)","μ₀NR/(2I)","μ₀NI/(2πR²)"],0,"The fields due to all N turns add: B = μ₀NI/(2R)."],["At the centre of a circular loop, the magnetic field is directly proportional to",["radius R","current I","1/current","radius squared"],1,"B = μ₀I/(2R), so for fixed radius the field is proportional to current."],["A circular loop's radius is doubled while current remains constant. Its central magnetic field becomes",["double","half","four times","unchanged"],1,"The central field varies inversely with radius: B ∝ 1/R."],["A 20-turn circular coil of radius 0.2 m carries 2 A. Its field at the centre is",["1.26 × 10⁻⁴ T","2.51 × 10⁻⁵ T","6.28 × 10⁻⁴ T","1.26 × 10⁻³ T"],0,"B = μ₀NI/(2R) = (4π×10⁻⁷×20×2)/(0.4) ≈ 1.26×10⁻⁴ T."],["At a point on the axis of a circular loop, at distance x from its centre, the field magnitude is",["μ₀IR²/[2(R²+x²)^(3/2)]","μ₀Ix/[2(R²+x²)]","μ₀I/(2πx)","μ₀IR/[2(R+x)]"],0,"The axial field of a circular loop is B = μ₀IR²/[2(R²+x²)^(3/2)]."],["At the centre of a circular loop, the axial-field expression reduces to the central field when",["x = R","x = 0","x = 2R","x tends to infinity"],1,"Putting x = 0 gives B = μ₀IR²/(2R³) = μ₀I/(2R)."],["The magnetic field at the centre of a semicircular wire of radius R carrying current I is",["μ₀I/(4R)","μ₀I/(2R)","μ₀I/(4πR)","μ₀I/(2πR)"],0,"A semicircle subtends half the angle of a full loop, so its field is half of μ₀I/(2R)."],["The magnetic field at the centre due to a quarter-circular arc of radius R is",["μ₀I/(8R)","μ₀I/(4R)","μ₀I/(2R)","μ₀I/(8πR)"],0,"For an arc subtending angle φ, B = μ₀Iφ/(4πR). With φ = π/2, B = μ₀I/(8R)."],["A radial straight segment of a current-carrying circular-arc circuit produces zero field at the centre because",["its current is zero","dl is parallel to r̂ at every element","the centre is infinitely far away","μ₀ is zero"],1,"For a radial segment, dl and r̂ are parallel, so dl × r̂ = 0."],["The magnetic field at the centre of a complete circular loop is perpendicular to",["the plane of the loop","the circumference at every point","the current direction at all points","the radius in the plane"],0,"The resultant field at the centre lies along the axis, normal to the plane of the loop."],["The direction of the field at the centre of a circular loop is found using",["right-hand grip rule","Fleming's left-hand rule","Lenz's law only","Coulomb's law"],0,"Curl the fingers of the right hand in the direction of current; the thumb gives the field direction through the loop."],["Two long parallel wires carry currents in the same direction. The wires",["attract","repel","exert no force","always rotate"],0,"Parallel currents in the same direction attract; opposite currents repel."],["The magnetic field produced by a long straight wire is circular around the wire and its direction is given by",["right-hand thumb rule","Fleming's right-hand rule","Faraday's law","Gauss's law"],0,"The curled fingers of the right hand show the magnetic field direction when the thumb points along conventional current."],["The Biot–Savart law is most directly analogous in role to which electrostatic law?",["Coulomb's law","Ohm's law","Kirchhoff's law","Gauss's law for gravity"],0,"Both laws describe field contributions from source elements, with inverse-square dependence and a source-direction factor."],["For a current element, changing θ from 30° to 90° while r and I dl stay fixed makes dB",["double","half","√3 times","unchanged"],0,"The sine factor changes from sin30° = 1/2 to sin90° = 1, so dB doubles."],["A long wire carries 3 A. At what distance is the field 6 × 10⁻⁶ T in vacuum?",["0.01 m","0.05 m","0.10 m","0.20 m"],2,"r = μ₀I/(2πB) = (4π×10⁻⁷×3)/(2π×6×10⁻⁶) = 0.10 m."]];
let activeQuestions=questions.slice();
let index=0,chosen=null,locked=false,xp=0,streak=0,bestStreak=0,correctCount=0,wrong=[];
const $=id=>document.getElementById(id);
function render(){chosen=null;locked=false;$('count').textContent='Question '+(index+1)+' of '+activeQuestions.length;$('qnum').textContent='QUESTION '+(index+1);$('percent').textContent=Math.round(index/activeQuestions.length*100)+'%';$('fill').style.width=(index/activeQuestions.length*100)+'%';$('xp').textContent=xp;$('streak').textContent=streak;$('question').textContent=activeQuestions[index][0];$('options').innerHTML='';activeQuestions[index][1].forEach((value,n)=>{const b=document.createElement('button');b.type='button';b.className='option';b.innerHTML='<span class="letter">'+String.fromCharCode(65+n)+'</span><span></span>';b.lastElementChild.textContent=value;b.addEventListener('click',()=>{if(locked)return;chosen=n;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b)});$('check').classList.remove('hidden');$('check').disabled=true;$('feedback').className='feedback';$('feedback').textContent='';$('continue').classList.add('hidden');if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();}
function check(){if(chosen===null||locked)return;locked=true;const q=activeQuestions[index],ok=chosen===q[2];document.querySelectorAll('.option').forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add('correct');if(n===chosen&&!ok)b.classList.add('wrong')});if(ok){xp+=10;streak++;bestStreak=Math.max(bestStreak,streak);correctCount++;$('feedback').className='feedback show';$('feedback').innerHTML='<strong>✅ Correct! +10 XP</strong>'+q[3]}else{streak=0;wrong.push({index,chosen,correct:q[2]});$('feedback').className='feedback show bad';$('feedback').innerHTML='<strong>Not quite.</strong>'+q[3]}$('xp').textContent=xp;$('streak').textContent=streak;$('check').classList.add('hidden');$('continue').classList.remove('hidden');if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();}
function next(){if(index<activeQuestions.length-1){index++;render()}else finish()}
function resetQuiz(onlyWrong){const previous=activeQuestions.slice();activeQuestions=onlyWrong?wrong.map(w=>previous[w.index]).filter(Boolean):questions.slice();index=0;chosen=null;locked=false;xp=0;streak=0;bestStreak=0;correctCount=0;wrong=[];$('xp').textContent='0';$('streak').textContent='0';$('quizcard').classList.remove('hidden');$('result').classList.add('hidden');render();}
function finish(){$('quizcard').classList.add('hidden');$('percent').textContent='100%';$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hidden');let review=wrong.length?'<div class="review"><h3>Review your mistakes</h3>'+wrong.map(w=>{const q=activeQuestions[w.index];return '<div class="review-item"><b>Q'+(w.index+1)+'. '+q[0]+'</b><p class="small">Your answer: '+String.fromCharCode(65+w.chosen)+'. '+q[1][w.chosen]+'</p><p><b>Correct:</b> '+String.fromCharCode(65+q[2])+'. '+q[1][q[2]]+'</p><p>'+q[3]+'</p></div>'}).join('')+'</div>':'<p>Perfect run — no incorrect answers to review!</p>';$('result').innerHTML='<h2>🎉 Biot–Savart Law Complete!</h2><p class="scorebig">'+correctCount+' / '+activeQuestions.length+' correct</p><p>You earned <b>'+xp+' XP</b> · Best streak this run: <b>'+bestStreak+'</b></p>'+review+(wrong.length?'<button class="primary" id="retryWrong">Retry wrong answers ('+wrong.length+') ↻</button>':'')+'<button class="primary" id="retry">Practice all questions again</button>';$('retry').onclick=()=>resetQuiz(false);const rw=$('retryWrong');if(rw)rw.onclick=()=>resetQuiz(true);if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();}
$('check').addEventListener('click',check);$('continue').addEventListener('click',next);render();
</script><script src="/skillup-eye-shield.js?v=20261013-eye-shield-v1"></script><script src="/shared-nav.js?v=20261013-no-bottom-nav-v1"></script></body></html>
