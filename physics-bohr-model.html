<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Bohr Model</title><meta name="description" content="SkillUp Physics Bohr Model interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">⚛️</span><h1>Bohr Model</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["Bohr proposed his atomic model mainly to explain:",["Atomic stability and hydrogen spectrum","The composition of the neutron","Radioactive decay only","The wave nature of light only"],0,"Bohr introduced quantised stationary orbits to explain atomic stability and the observed hydrogen spectrum."] ,["According to Bohr, electrons can move only in:",["Certain permitted stationary orbits","Any orbit at any radius","The nucleus itself","A continuous cloud with no allowed states"],0,"Only specific stationary states are allowed in the Bohr model."] ,["While an electron remains in a stationary orbit, it:",["Does not radiate energy","Continuously radiates energy","Falls into the nucleus","Has zero kinetic energy"],0,"Bohr postulated that an electron in a stationary state does not emit radiation."] ,["The angular momentum of an electron in the nth Bohr orbit is:",["nh/(2π)","nh","h/n","2πnh"],0,"Bohr's angular-momentum quantisation condition is mvr=nh/(2π)=nℏ."] ,["The principal quantum number of the ground state is:",["n=1","n=0","n=2","n=∞"],0,"The ground state is the lowest allowed state, n=1."] ,["The energy of an electron in the ground state of hydrogen is:",["−13.6 eV","+13.6 eV","−3.4 eV","0 eV"],0,"For hydrogen, the n=1 energy is −13.6 eV relative to the ionisation limit at 0 eV."] ,["The energy of the nth orbit of hydrogen is proportional to:",["−1/n²","−n²","1/n","n"],0,"For hydrogen-like atoms, En is proportional to −1/n²."] ,["The radius of the nth Bohr orbit in hydrogen is proportional to:",["n²","n","1/n","1/n²"],0,"The Bohr radius varies as rn∝n² for hydrogen."] ,["If a hydrogen electron moves from n=1 to n=2, it:",["Absorbs energy","Emits energy","Has no energy change","Leaves the atom automatically"],0,"An upward transition requires absorption of a photon whose energy equals the difference between the two levels."] ,["When an electron falls from a higher orbit to a lower orbit, the atom:",["Emits a photon","Absorbs a photon","Stops the electron","Creates a neutron"],0,"A downward transition releases the energy difference as electromagnetic radiation."] ,["The photon frequency for a transition between energies Ei and Ef is determined by:",["hν=Ei−Ef for emission from Ei>Ef","hν=Ei+Ef","hν=Ef−Ei for every transition","ν=h(Ei−Ef)"],0,"For a downward transition, the emitted photon has energy ΔE=Ei−Ef=hν."] ,["The ionisation energy of hydrogen from its ground state is:",["13.6 eV","3.4 eV","10.2 eV","1.51 eV"],0,"13.6 eV is required to take the electron from n=1 to the ionisation limit n=∞."] ,["For a hydrogen-like atom, the Bohr orbit speed varies with n approximately as:",["1/n","n","n²","1/n²"],0,"In the Bohr model, electron speed is proportional to 1/n for a hydrogen-like species."] ,["The Bohr model successfully explains the line spectrum of:",["Hydrogen and hydrogen-like ions","All multi-electron atoms exactly","Only solid metals","Only neutrons"],0,"The model gives the correct spectral structure for one-electron systems such as H, He+ and Li2+."] ,["A major limitation of the Bohr model is that it:",["Cannot fully explain spectra of multi-electron atoms","Cannot explain hydrogen at all","Predicts no energy levels","Requires no quantisation"],0,"Bohr's model is limited mainly to one-electron systems and does not provide the full quantum-mechanical description of atoms."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
