{q:'Bulk modulus is the ratio of',o:['volumetric stress to volumetric strain','longitudinal stress to longitudinal strain','shear stress to shear strain','force to area only'],a:0,e:'Bulk modulus K is the ratio of hydrostatic pressure change to fractional change in volume, with a negative sign for compression.'},
