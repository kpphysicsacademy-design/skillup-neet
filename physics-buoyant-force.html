<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp | Buoyant Force</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(180deg,#f5fbff,#eef5ff);color:#203040}main{max-width:760px;margin:auto;padding:20px 16px 50px}.top{background:#fff;border:1px solid #dce7f2;border-radius:22px;padding:18px;box-shadow:0 8px 24px #20304012;margin-bottom:16px}.brand{font-weight:900;color:#1264d6;font-size:20px}.sub{font-size:13px;color:#718096;margin-top:3px}.bar{height:10px;background:#e7eef6;border-radius:99px;overflow:hidden;margin-top:14px}.fill{height:100%;width:0;background:#2d9cdb;transition:width .35s}.stats{display:flex;justify-content:space-between;margin-top:10px;font-weight:800;font-size:14px}.card{background:#fff;border:1px solid #dce7f2;border-radius:24px;padding:22px;box-shadow:0 10px 30px #20304012}.qnum{font-size:13px;font-weight:900;color:#1264d6;margin-bottom:10px}.question{font-size:22px;line-height:1.35;font-weight:900;margin-bottom:20px}.options{display:grid;gap:12px}button.opt{width:100%;text-align:left;background:#fff;color:#203040;border:2px solid #dfe8f1;border-radius:16px;padding:15px 16px;font-size:16px;font-weight:750;cursor:pointer;transition:.18s}button.opt:hover{border-color:#75aee8;transform:translateY(-1px)}button.opt.selected{background:#eaf4ff;border-color:#3788d8;color:#123b70}button.opt.correct{background:#e8f8ee;border-color:#35a66b;color:#145b36}button.opt.wrong{background:#fff0f0;border-color:#df5a5a;color:#7d2222}.feedback{margin-top:16px;border-radius:16px;padding:14px 16px;display:none;line-height:1.45}.feedback.show{display:block}.feedback.good{background:#e8f8ee;color:#145b36}.feedback.bad{background:#fff0f0;color:#7d2222}.actions{display:flex;justify-content:flex-end;margin-top:18px}.actions button{border:0;border-radius:14px;padding:13px 20px;background:#1264d6;color:#fff;font-weight:900;cursor:pointer}.actions button:disabled{opacity:.45;cursor:not-allowed}.result{text-align:center;display:none}.result.show{display:block}.score{font-size:52px;font-weight:950;color:#1264d6}.badge{font-size:46px;margin:8px}.restart{margin-top:18px;border:0;border-radius:14px;padding:14px 22px;background:#1264d6;color:#fff;font-weight:900;cursor:pointer}@media(max-width:560px){.question{font-size:19px}main{padding:12px}.card{padding:17px}button.opt{font-size:15px}}
</style>
</head>
<body><main>
<section class="top"><div class="brand">⚡ SkillUp Physics NEET 2026</div><div class="sub">Buoyant Force • 15 MCQ Challenge</div><div class="bar"><div class="fill" id="fill"></div></div><div class="stats"><span id="progress">Question 1 of 15</span><span id="xp">⭐ 0 XP</span></div></section>
<section class="card" id="quizCard"><div class="qnum" id="qnum">QUESTION 1</div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="actions"><button id="next" type="button" disabled>Continue →</button></div></section>
<section class="card result" id="result"><div class="badge">🏆</div><h2>Buoyant Force Complete!</h2><div class="score" id="score">0/15</div><p id="resultText"></p><button class="restart" type="button" onclick="restart()">↻ Retry Quiz</button></section>
</main>
<script>
const quiz=[
['According to Archimedes’ principle, the buoyant force on an immersed body equals:', ['Weight of the displaced fluid','Weight of the body','Mass of the body','Volume of the body'],0,'Buoyant force equals the weight of the fluid displaced by the immersed body.'],
['The SI unit of buoyant force is:', ['Pascal','Newton','Joule','kg m⁻³'],1,'Force is measured in newtons (N).'],
['The buoyant force on a body immersed in a liquid acts:', ['Vertically downward','Horizontally','Vertically upward','Along the surface'],2,'The pressure difference in the fluid produces an upward resultant force.'],
['The buoyant force mainly depends on the:', ['Colour of the body','Volume of displaced fluid and fluid density','Shape only','Mass of the container'],1,'Fᵦ = ρfluid Vdisplaced g.'],
['A body floats in equilibrium when its weight is:', ['Greater than buoyant force','Less than buoyant force','Equal to buoyant force','Zero'],2,'For a floating body at rest, upward buoyant force equals downward weight.'],
['If the density of a liquid increases while displaced volume remains constant, buoyant force:', ['Decreases','Increases','Becomes zero','Remains necessarily unchanged'],1,'Since Fᵦ = ρVg, increasing density increases buoyant force.'],
['A completely submerged body displaces a volume of liquid equal to the:', ['Volume of the body','Mass of the body','Density of the body','Weight of the body'],0,'A fully immersed body displaces fluid equal in volume to its own volume.'],
['If an object is less dense than a liquid, it will generally:', ['Sink','Float','Have zero mass','Lose all weight'],1,'A less-dense object floats because it can displace enough liquid for buoyancy to balance its weight.'],
['The apparent loss of weight of a body immersed in a liquid is equal to its:', ['Density','Buoyant force','Volume','Mass'],1,'Apparent weight = true weight − buoyant force.'],
['A body of volume 0.002 m³ is fully immersed in water (ρ = 1000 kg m⁻³, g = 10 m s⁻²). Buoyant force is:', ['2 N','10 N','20 N','200 N'],2,'Fᵦ = 1000 × 0.002 × 10 = 20 N.'],
['If the volume of displaced fluid is doubled, with density and g unchanged, buoyant force becomes:', ['Half','Double','One-fourth','Unchanged'],1,'Buoyant force is directly proportional to displaced volume.'],
['A ship made of steel can float mainly because:', ['Steel has no weight','Its average density with hollow spaces is less than water','Water has no pressure','Gravity does not act on ships'],1,'The hollow design increases displaced volume and lowers the ship’s average density.'],
['For a body fully submerged in the same liquid, buoyant force is independent of the body’s:', ['Volume','Fluid density','Acceleration due to gravity','Depth, when fluid density is uniform'],3,'In an ideal uniform-density liquid, Fᵦ = ρVg and does not depend on depth.'],
['A hydrometer works primarily using the principle of:', ['Conservation of momentum','Archimedes’ principle','Pascal’s law only','Newton’s third law only'],1,'A hydrometer floats at a depth determined by liquid density, using buoyancy.'],
['When a floating body is pushed slightly deeper into a liquid, the buoyant force initially:', ['Decreases','Increases','Becomes zero','Cannot change'],1,'More fluid is displaced, so buoyant force increases until equilibrium is restored.']
];
let i=0,score=0,selected=null,checked=false;
const $=id=>document.getElementById(id);
function render(){selected=null;checked=false;$('feedback').className='feedback';$('feedback').textContent='';$('next').disabled=true;$('next').textContent=i===14?'Finish ✓':'Continue →';$('qnum').textContent='QUESTION '+(i+1);$('progress').textContent='Question '+(i+1)+' of '+quiz.length;$('fill').style.width=(i/quiz.length*100)+'%';$('xp').textContent='⭐ '+(score*10)+' XP';$('question').textContent=quiz[i][0];const box=$('options');box.innerHTML='';quiz[i][1].forEach((text,idx)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+idx)+'. '+text;b.onclick=()=>choose(idx);box.appendChild(b)});}
function choose(idx){if(checked)return;selected=idx;document.querySelectorAll('button.opt').forEach((b,n)=>b.classList.toggle('selected',n===idx));$('next').disabled=false}
function check(){if(selected===null)return;checked=true;const q=quiz[i],ok=selected===q[2];if(ok)score++;document.querySelectorAll('button.opt').forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add('correct');if(n===selected&&n!==q[2])b.classList.add('wrong')});const f=$('feedback');f.className='feedback show '+(ok?'good':'bad');f.innerHTML=(ok?'✅ Correct! ':'❌ Not quite. ')+q[3];$('xp').textContent='⭐ '+(score*10)+' XP';$('fill').style.width=((i+1)/quiz.length*100)+'%'}
$('next').onclick=()=>{if(!checked){check();return}if(i<quiz.length-1){i++;render()}else finish()};
function finish(){$('quizCard').style.display='none';$('result').classList.add('show');$('score').textContent=score+'/'+quiz.length;$('resultText').textContent='You earned '+(score*10)+' XP. '+(score>=12?'Excellent work! 💪':score>=9?'Good job—keep revising! 📚':'Keep practising and try again! 🔁')}
function restart(){i=0;score=0;$('result').classList.remove('show');$('quizCard').style.display='block';render()}
render();
</script></body></html>
