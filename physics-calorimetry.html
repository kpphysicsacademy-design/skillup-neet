<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Calorimetry — 15 MCQ Quiz</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#203040;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:22px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:#123b70}.xp{font-weight:950;color:#1677ff}.hero{margin-top:14px;background:linear-gradient(135deg,#123b70,#1677ff);color:#fff;border-radius:24px;padding:22px}.hero h1{margin:5px 0 7px;font-size:clamp(28px,6vw,40px)}.hero p{margin:0;line-height:1.5;font-size:13px}.card{background:#fff;border:1px solid #d9e5f2;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 7px 20px rgba(18,59,112,.07)}.master{font-weight:900}.bar{height:10px;background:#e5edf6;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;width:0;background:#1677ff;transition:.3s}.qno{font-size:12px;color:#6b7280;font-weight:900}.q{font-size:20px;font-weight:900;line-height:1.4;margin:9px 0 16px}button.opt{display:block;width:100%;text-align:left;background:#fff;color:#203040;border:2px solid #dfe8f1;border-radius:14px;padding:14px;margin:10px 0;font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}button.opt.selected{border-color:#1677ff;background:#eef6ff;color:#123b70}button.opt.correct{border-color:#16803a;background:#eaf8ef;color:#145c2e}button.opt.wrong{border-color:#d64545;background:#fff0f0;color:#8f2020}button.continue{border:0;border-radius:13px;padding:12px 20px;background:#1677ff;color:#fff;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #0d5bbf}button.continue:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}.actions{display:flex;justify-content:flex-end;margin-top:15px}.feedback{min-height:25px;margin-top:13px;font-weight:800}.explain{margin-top:6px;color:#596774;font-weight:600}.back{display:block;width:max-content;margin:18px auto 0;padding:10px 15px;border:2px solid #d9e5f2;border-radius:12px;background:#fff;color:#1264d6;text-decoration:none;font-weight:900}.result{text-align:center}.score{font-size:34px;font-weight:950;color:#123b70}@media(max-width:520px){.wrap{padding:15px 10px 50px}.q{font-size:18px}button.opt{font-size:14px;padding:13px}}</style></head><body><main class="wrap"><div class="top"><div class="brand">⚛️ SkillUp Physics<br><small>NEET 2026 • 15 MCQ QUIZ</small></div><div class="xp" id="xp">XP: 0</div></div><section class="hero"><div>🌡️ NEET PRACTICE</div><h1>Calorimetry</h1><p>15-question MCQ quiz. Select one answer, check instantly, and build mastery.</p></section><section class="card"><div class="master">🏆 Quiz Progress <span id="mastery">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card" id="quiz"><div class="qno" id="qno"></div><div class="q" id="question"></div><div id="opts"></div><div class="actions"><button class="continue" id="continue" type="button" disabled>Check Answer →</button></div><div class="feedback" id="feedback"></div></section><section class="card result" id="result" hidden></section><a class="back" href="physics-home-fast.html">← 📚 Back to Physics Path</a></main><script>const questions=[
{q:'Calorimetry is based mainly on the principle of conservation of',o:['mass','electric charge','energy','momentum'],a:2,e:'In an ideal calorimeter, heat lost by one body equals heat gained by another, expressing energy conservation.'},
{q:'The basic calorimetry equation for an isolated mixture is',o:['heat lost = heat gained','heat lost > heat gained','heat gained > heat lost always','heat lost = mass'],a:0,e:'When heat exchange with surroundings is negligible, total heat lost equals total heat gained.'},
{q:'Heat capacity of a body is defined as heat required to raise its temperature by',o:['1 K','10 K','100 K','any fixed value only'],a:0,e:'Heat capacity C = Q/ΔT, so it is heat required for a unit temperature rise.'},
{q:'The SI unit of heat capacity is',o:['J K⁻¹','J kg⁻¹ K⁻¹','W K⁻¹','cal g⁻¹'],a:0,e:'Heat capacity is energy per unit temperature change, so its SI unit is J K⁻¹.'},
{q:'A calorimeter is designed to',o:['minimize heat exchange with surroundings','increase evaporation','measure pressure only','produce heat'],a:0,e:'A well-designed calorimeter is thermally insulated to reduce heat exchange with the surroundings.'},
{q:'If 100 g water at 80°C is mixed with 100 g water at 20°C in an ideal calorimeter, final temperature is',o:['20°C','40°C','50°C','80°C'],a:2,e:'Equal masses of the same substance exchange equal heat for equal and opposite temperature changes, giving 50°C.'},
{q:'When equal masses of the same substance at temperatures T₁ and T₂ are mixed without heat loss, final temperature is',o:['T₁−T₂','(T₁+T₂)/2','T₁T₂','T₁+T₂'],a:1,e:'For equal masses and equal specific heat, energy balance gives the arithmetic mean.'},
{q:'The heat required to change temperature of mass m by ΔT when specific heat is c is',o:['Q=mcΔT','Q=mΔT/c','Q=cΔT/m','Q=mc/ΔT'],a:0,e:'The standard sensible-heat relation is Q = mcΔT.'},
{q:'If a hot metal is placed in cooler water in an insulated calorimeter, at equilibrium both have',o:['different temperatures','the same temperature','zero temperature','the same mass'],a:1,e:'Thermal equilibrium requires equal temperatures between bodies in contact.'},
{q:'A phase change such as melting at constant pressure primarily involves',o:['latent heat','only sensible heat','zero heat','negative mass'],a:0,e:'During a phase change, energy is absorbed or released as latent heat without necessarily changing temperature.'},
{q:'The principle used to determine an unknown specific heat by mixing hot and cold bodies is',o:['calorimetry','Ohm’s law','Archimedes’ principle','Bernoulli’s theorem'],a:0,e:'Calorimetry uses measured heat exchanges to determine unknown thermal properties.'},
{q:'A 2 kg body has specific heat 500 J kg⁻¹ K⁻¹. Its heat capacity is',o:['250 J K⁻¹','500 J K⁻¹','1000 J K⁻¹','2500 J K⁻¹'],a:2,e:'Heat capacity C = mc = 2 × 500 = 1000 J K⁻¹.'},
{q:'If no heat is lost to the environment, the algebraic sum of heat exchanged by all bodies is',o:['zero','positive always','negative always','infinite'],a:0,e:'Energy conservation gives ΣQ = 0 for an isolated calorimetric system.'},
{q:'A material with larger specific heat capacity needs, for the same mass and temperature rise',o:['less heat','more heat','the same heat always','no heat'],a:1,e:'Q = mcΔT, so heat required is directly proportional to specific heat capacity.'},
{q:'In an ideal calorimetry experiment, the final equilibrium temperature lies generally between the initial temperatures when',o:['bodies exchange heat and no phase change dominates','both bodies are identical temperature','there is no contact','all heat is lost'],a:0,e:'For ordinary mixing without phase-change complications, the final temperature is between the initial temperatures because energy flows from hotter to colder.'}
];let i=0,selected=null,checked=false,score=0;const $=id=>document.getElementById(id);function render(){selected=null;checked=false;$('feedback').textContent='';$('continue').disabled=true;$('continue').textContent=i===14?'Finish Quiz →':'Check Answer →';$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=questions[i].q;$('opts').innerHTML='';questions[i].o.forEach((text,n)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+n)+'. '+text;b.dataset.index=n;b.onclick=()=>{if(checked)return;selected=n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('continue').disabled=false};$('opts').appendChild(b)});$('mastery').textContent=`${i} / 15`;$('fill').style.width=`${i/15*100}%`;$('xp').textContent=`XP: ${score*10}`}function next(){if(selected===null)return;if(!checked){checked=true;const item=questions[i],ok=selected===item.a;if(ok)score++;document.querySelectorAll('.opt').forEach(b=>{const n=+b.dataset.index;b.disabled=true;if(n===item.a)b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+`<div class="explain">${item.e}</div>`;$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=`${(i+1)/15*100}%`;$('xp').textContent=`${score*10}`}else if(i<14){i++;render()}else finish()}function finish(){$('quiz').hidden=true;$('result').hidden=false;const pct=Math.round(score/15*100);$('result').innerHTML=`<h2>🎉 Calorimetry Complete!</h2><div class="score">${score} / 15</div><p><strong>${pct}%</strong> accuracy</p><p>🏆 You earned <strong>${score*10} XP</strong>.</p><p>${score>=12?'🔥 Excellent NEET readiness!':score>=9?'💪 Good work. Revise and retry for mastery.':'📚 Revise Calorimetry and try again.'}</p><button class="continue" type="button" onclick="location.reload()">Retry 15 MCQs</button>`}$('continue').onclick=next;render();</script></body></html>
