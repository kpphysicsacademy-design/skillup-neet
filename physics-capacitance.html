<script>
(function(){
'use strict';
let index=0, chosen=null, locked=false, score=0, streak=0;
const questions = [{"q":"Capacitance of a conductor is defined as…","o":["Q/V","V/Q","QV","Q+V"],"a":0,"e":"Capacitance is the ratio of charge to potential difference: C = Q/V."},{"q":"The SI unit of capacitance is…","o":["Coulomb","Volt","Farad","Ohm"],"a":2,"e":"The SI unit of capacitance is the farad (F)."},{"q":"The dimensional formula of capacitance is…","o":["[M⁻¹L⁻²T⁴I²]","[ML²T⁻³I⁻¹]","[M⁻¹L⁻²T²I]","[ML⁻²T⁴I²]"],"a":0,"e":"Since C = Q/V, its dimensions are [M⁻¹L⁻²T⁴I²]."},{"q":"For an isolated spherical conductor of radius R in vacuum, capacitance is…","o":["4πε₀R","4πε₀/R","ε₀/(4πR)","R/(4πε₀)"],"a":0,"e":"The capacitance of an isolated sphere is C = 4πε₀R."},{"q":"For a parallel-plate capacitor in vacuum, capacitance is…","o":["ε₀A/d","ε₀d/A","d/(ε₀A)","A/(ε₀d)"],"a":0,"e":"For parallel plates, C = ε₀A/d, neglecting edge effects."},{"q":"If the plate area is doubled and separation stays fixed, capacitance…","o":["Halves","Doubles","Becomes four times","Remains unchanged"],"a":1,"e":"C is directly proportional to plate area A."},{"q":"If the separation between parallel plates is doubled, capacitance…","o":["Doubles","Halves","Becomes four times","Remains unchanged"],"a":1,"e":"C is inversely proportional to separation d."},{"q":"A dielectric with relative permittivity K completely fills a capacitor. Its capacitance becomes…","o":["C₀/K","KC₀","C₀ + K","C₀ − K"],"a":1,"e":"With a dielectric filling the gap, C = KC₀."},{"q":"Two capacitors C₁ and C₂ connected in parallel have equivalent capacitance…","o":["C₁ + C₂","C₁C₂/(C₁ + C₂)","1/C₁ + 1/C₂","C₁ − C₂"],"a":0,"e":"In parallel, capacitances add directly."},{"q":"Two capacitors C₁ and C₂ connected in series have equivalent capacitance…","o":["C₁ + C₂","C₁C₂/(C₁ + C₂)","C₁/C₂","C₁ − C₂"],"a":1,"e":"For two capacitors in series, Cₑq = C₁C₂/(C₁ + C₂)."},{"q":"A 5 μF capacitor is connected across 20 V. The charge stored is…","o":["25 μC","100 μC","4 μC","0.25 μC"],"a":1,"e":"Q = CV = 5 μF × 20 V = 100 μC."},{"q":"A 6 μC charge is stored at 3 V. The capacitance is…","o":["2 μF","18 μF","0.5 μF","9 μF"],"a":0,"e":"C = Q/V = 6 μC / 3 V = 2 μF."},{"q":"The energy stored in a capacitor is…","o":["½CV²","CV²","2CV²","Q/V"],"a":0,"e":"U = ½CV² = ½QV = Q²/(2C)."},{"q":"A 4 μF capacitor is charged to 5 V. Its stored energy is…","o":["10 μJ","25 μJ","50 μJ","100 μJ"],"a":2,"e":"U = ½CV² = ½ × 4 μF × 25 V² = 50 μJ."},{"q":"For an isolated charged capacitor, if plate separation increases, its charge…","o":["Remains constant","Doubles","Halves","Becomes zero"],"a":0,"e":"No charge flows onto or off an isolated capacitor, so Q remains constant."},{"q":"The potential difference across an ideal capacitor connected to a battery remains…","o":["Zero","Fixed by the battery","Always increasing","Inversely proportional to capacitance"],"a":1,"e":"The ideal battery maintains its terminal voltage."},{"q":"For capacitors connected in series, each capacitor has the same magnitude of…","o":["Voltage","Charge","Capacitance","Energy in every case"],"a":1,"e":"In a series chain, each capacitor carries equal-magnitude charge."},{"q":"For capacitors connected in parallel, each capacitor has the same…","o":["Charge in all cases","Potential difference","Capacitance","Stored energy in all cases"],"a":1,"e":"Parallel branches share the same two nodes, so their voltage is equal."},{"q":"Two 3 μF capacitors are connected in parallel. Equivalent capacitance is…","o":["1.5 μF","3 μF","6 μF","9 μF"],"a":2,"e":"Parallel capacitances add: 3 + 3 = 6 μF."},{"q":"Two 3 μF capacitors are connected in series. Equivalent capacitance is…","o":["1.5 μF","3 μF","6 μF","9 μF"],"a":0,"e":"Two identical capacitors in series have Cₑq = C/2 = 1.5 μF."},{"q":"A 2 μF capacitor connected across 12 V stores charge…","o":["6 μC","10 μC","24 μC","14 μC"],"a":2,"e":"Q = CV = 2 μF × 12 V = 24 μC."},{"q":"If the potential difference across a fixed capacitor doubles, stored charge…","o":["Halves","Doubles","Becomes four times","Is unchanged"],"a":1,"e":"For fixed C, Q = CV, so doubling V doubles Q."},{"q":"If the voltage across a fixed capacitor doubles, its stored energy…","o":["Doubles","Halves","Becomes four times","Is unchanged"],"a":2,"e":"U = ½CV², so doubling V quadruples the energy."},{"q":"The capacitance of an isolated spherical conductor is proportional to its…","o":["Radius","Surface area squared","Mass","Charge only"],"a":0,"e":"C = 4πε₀R, so capacitance is proportional to radius."},{"q":"The reciprocal relation for capacitors in series is…","o":["Cₑq = ΣCᵢ","1/Cₑq = Σ(1/Cᵢ)","Cₑq = C₁C₂ only","Cₑq = 0"],"a":1,"e":"For series combinations, reciprocals add."},{"q":"The equivalent capacitance of a parallel combination is…","o":["Less than the smallest capacitor","The sum of capacitances","The reciprocal sum","Always equal to one capacitor"],"a":1,"e":"For parallel capacitors, Cₑq = C₁ + C₂ + … ."},{"q":"A capacitor stores 40 μC at 8 V. Its capacitance is…","o":["5 μF","32 μF","48 μF","0.2 μF"],"a":0,"e":"C = Q/V = 40 μC / 8 V = 5 μF."},{"q":"The energy density of an electric field in vacuum is…","o":["ε₀E²","½ε₀E²","2ε₀E","E/(2ε₀)"],"a":1,"e":"Electric-field energy density in vacuum is u = ½ε₀E²."},{"q":"A dielectric is inserted while a capacitor stays connected to a battery. Its stored charge generally…","o":["Decreases","Increases","Remains fixed","Becomes zero"],"a":1,"e":"The battery fixes V and the dielectric increases C, so Q = CV increases."},{"q":"A dielectric is inserted after a charged capacitor is disconnected from the battery. Its free charge…","o":["Increases","Decreases","Remains constant","Reverses sign"],"a":2,"e":"For an isolated capacitor, free charge on the plates remains constant."},{"q":"A 10 μF capacitor is charged to 12 V. The stored energy is…","o":["0.72 mJ","7.2 mJ","72 mJ","720 mJ"],"a":0,"e":"U = ½ × 10 μF × 12² = 720 μJ = 0.72 mJ."}]
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function typesetMath(){if(window.MathJax?.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options'),$('feedback')].filter(Boolean)).catch(()=>{});}}
window.addEventListener('load',typesetMath);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
 typesetMath();
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Capacitance Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
   if(window.MathJax?.typesetPromise) window.MathJax.typesetPromise([review]).catch(()=>{});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
