<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Capacitance</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>⚡ Capacitance</h1>
<div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div>
<a class="back" href="physics-home-fast.html">← Back to Physics Path</a>
</div></div>
<script>
const qs=[
['Capacitance of a conductor is defined as','Q/V','V/Q','QV','Q+V',0,'Capacitance is the ratio of charge to potential: C=Q/V.'],
['The SI unit of capacitance is','coulomb','volt','farad','ohm',2,'The SI unit of capacitance is the farad (F).'],
['The dimensional formula of capacitance is','[M⁻¹L⁻²T⁴I²]','[ML²T⁻³I⁻¹]','[M⁻¹L⁻²T²I]','[ML⁻²T⁴I²]',0,'Since C=Q/V, the dimensional formula is [M⁻¹L⁻²T⁴I²].'],
['For an isolated spherical conductor of radius R in vacuum, capacitance is','4πε₀R','4πε₀/R','ε₀/(4πR)','R/(4πε₀)',0,'The capacitance of an isolated sphere is C=4πε₀R.'],
['For a parallel-plate capacitor in vacuum, capacitance is','ε₀A/d','ε₀d/A','d/(ε₀A)','A/(ε₀d)',0,'For parallel plates, C=ε₀A/d.'],
['If the plate area of a parallel-plate capacitor is doubled, capacitance','halves','doubles','becomes four times','remains unchanged',1,'Because C is directly proportional to plate area A.'],
['If the separation between parallel plates is doubled, capacitance','doubles','halves','becomes four times','remains unchanged',1,'Because C is inversely proportional to separation d.'],
['A dielectric of relative permittivity K completely fills a capacitor. Its capacitance becomes','C/K','KC','C+K','C−K',1,'A completely inserted dielectric changes the capacitance from C₀ to KC₀.'],
['Two capacitors C₁ and C₂ connected in parallel have equivalent capacitance','C₁+C₂','C₁C₂/(C₁+C₂)','1/C₁+1/C₂','C₁−C₂',0,'In parallel, capacitances add directly.'],
['Two capacitors C₁ and C₂ connected in series have equivalent capacitance','C₁+C₂','C₁C₂/(C₁+C₂)','C₁/C₂','C₁−C₂',1,'For two capacitors in series, C_eq=C₁C₂/(C₁+C₂).'],
['A 5 μF capacitor is connected across 20 V. The charge stored is','25 μC','100 μC','4 μC','0.25 μC',1,'Q=CV=(5 μF)(20 V)=100 μC.'],
['A 6 μC charge is stored on a capacitor at 3 V. Its capacitance is','2 μF','18 μF','0.5 μF','9 μF',0,'C=Q/V=6 μC/3 V=2 μF.'],
['The energy stored in a capacitor is','½CV²','CV²','2CV²','Q/V',0,'The electrostatic energy is U=½CV²=½QV=Q²/(2C).'],
['A 4 μF capacitor is charged to 5 V. The energy stored is','10 μJ','25 μJ','50 μJ','100 μJ',2,'U=½CV²=½(4×10⁻⁶)(5²)=50 μJ.'],
['If an isolated charged capacitor has its plate separation increased, its charge','remains constant','doubles','halves','becomes zero',0,'For an isolated capacitor, no charge can flow, so Q remains constant while V changes.']
];
let i=0,score=0,answered=false;const $=x=>document.getElementById(x);
function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}
function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});if(ok){score++;$('xp').textContent='✨ Correct! +1 XP'}else{$('xp').textContent='❌ Incorrect. '+q[6]}$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}
function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();
</script></body></html>
