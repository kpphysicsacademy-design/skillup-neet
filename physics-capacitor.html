.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}

<section class="hero"><h1>🔋 Capacitor</h1><p class="muted">Practise charge storage, capacitance, parallel-plate capacitors, dielectrics, combinations and stored energy.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>

<script>
(function(){
'use strict';
const questions = [{"q":"A capacitor is primarily used to store…","o":["Electric charge and electrical energy","Mechanical momentum","Magnetic poles permanently","Heat only"],"a":0,"e":"A capacitor stores separated electric charges and energy in its electric field."},{"q":"The SI unit of capacitance is…","o":["Coulomb","Volt","Farad","Ohm"],"a":2,"e":"Capacitance is measured in farads (F), where 1 F = 1 C/V."},{"q":"Capacitance is defined as…","o":["Q/V","V/Q","QV","Q+V"],"a":0,"e":"Capacitance is the magnitude of charge on either plate divided by the potential difference: C = Q/V."},{"q":"If a capacitor stores charge 12 μC at 3 V, its capacitance is…","o":["4 μF","9 μF","36 μF","0.25 μF"],"a":0,"e":"C = Q/V = 12 μC / 3 V = 4 μF."},{"q":"For an ideal parallel-plate capacitor in vacuum, capacitance is…","o":["C = ε₀A/d","C = ε₀d/A","C = Ad/ε₀","C = d/(ε₀A)"],"a":0,"e":"For parallel plates neglecting edge effects, C = ε₀A/d."},{"q":"If the area of the plates is doubled while separation stays constant, capacitance…","o":["Halves","Doubles","Becomes four times","Does not change"],"a":1,"e":"Since C is proportional to plate area A, doubling A doubles C."},{"q":"If the separation between parallel plates is doubled with plate area unchanged, capacitance…","o":["Doubles","Halves","Becomes four times","Remains the same"],"a":1,"e":"Since C is inversely proportional to separation d, doubling d halves C."},{"q":"A dielectric completely filling a capacitor gap has relative permittivity K. The new capacitance is…","o":["C₀/K","KC₀","C₀ + K","C₀ − K"],"a":1,"e":"For the same geometry with a dielectric filling the gap, C = K C₀."},{"q":"Two capacitors of 2 μF and 3 μF are connected in parallel. Their equivalent capacitance is…","o":["1.2 μF","2.5 μF","5 μF","6 μF"],"a":2,"e":"For parallel capacitors, capacitances add: Cₑq = 2 + 3 = 5 μF."},{"q":"Two capacitors of 2 μF and 3 μF are connected in series. Their equivalent capacitance is…","o":["5 μF","1.2 μF","2.5 μF","6 μF"],"a":1,"e":"For series capacitors, 1/Cₑq = 1/2 + 1/3, so Cₑq = 6/5 = 1.2 μF."},{"q":"The charge stored by a 5 μF capacitor connected across 4 V is…","o":["1.25 μC","9 μC","20 μC","0.8 μC"],"a":2,"e":"Q = CV = 5 μF × 4 V = 20 μC."},{"q":"The energy stored in a capacitor is given by…","o":["U = CV²","U = ½CV²","U = QV²","U = C/V"],"a":1,"e":"The stored energy is U = ½CV² = ½QV = Q²/(2C)."},{"q":"A 2 μF capacitor is charged to 10 V. The energy stored is…","o":["10 μJ","20 μJ","100 μJ","200 μJ"],"a":2,"e":"U = ½CV² = ½ × 2 μF × (10 V)² = 100 μJ."},{"q":"The electric field between large parallel plates with potential difference V and separation d is approximately…","o":["E = Vd","E = V/d","E = d/V","E = CV"],"a":1,"e":"For a uniform field, the magnitude E = V/d."},{"q":"When a charged capacitor is disconnected from the battery and plate separation increases, its charge ideally…","o":["Remains constant","Increases proportionally","Becomes zero","Always halves"],"a":0,"e":"An isolated capacitor has no conducting path for charge to leave, so Q remains constant."},{"q":"When a capacitor remains connected to an ideal battery and its plate separation increases, its potential difference…","o":["Increases","Decreases","Remains fixed","Becomes zero"],"a":2,"e":"The ideal battery maintains a fixed potential difference across the capacitor."},{"q":"For an isolated charged parallel-plate capacitor, increasing plate separation causes the potential difference to…","o":["Decrease","Increase","Remain constant","Become negative necessarily"],"a":1,"e":"With Q fixed and C decreasing, V = Q/C increases."},{"q":"The magnitude of charge on the two plates of a charged capacitor is…","o":["Equal and opposite","Equal and same sign","Always unequal","Zero on both plates"],"a":0,"e":"A charged capacitor has equal-magnitude charges +Q and −Q on its plates."},{"q":"Which statement about capacitance of a given isolated conductor arrangement is correct?","o":["It depends on charge stored only","It depends on potential only","It is determined by geometry and dielectric surroundings","It is always 1 farad"],"a":2,"e":"For a linear capacitor, capacitance is set by geometry and the dielectric medium, not by Q or V separately."},{"q":"A 4 μF capacitor connected to 6 V stores charge…","o":["24 μC","10 μC","2/3 μC","1.5 μC"],"a":0,"e":"Q = CV = 4 × 6 = 24 μC."},{"q":"The energy density in an electric field in vacuum is…","o":["ε₀E²","½ε₀E²","2ε₀E","E/(2ε₀)"],"a":1,"e":"The energy per unit volume of an electric field in vacuum is u = ½ε₀E²."},{"q":"A dielectric inserted into a capacitor while it remains connected to a battery generally causes the stored charge to…","o":["Decrease","Increase","Remain unchanged always","Become zero"],"a":1,"e":"The battery fixes V; dielectric insertion increases C, so Q = CV increases."},{"q":"A dielectric is inserted into a charged capacitor after it has been disconnected from the battery. Ideally, the charge…","o":["Increases","Decreases","Remains constant","Reverses sign"],"a":2,"e":"With the capacitor isolated, free charge cannot flow on or off the plates, so Q remains constant."},{"q":"The equivalent capacitance of capacitors connected in parallel is…","o":["The sum of their capacitances","Always less than the smallest","The reciprocal sum","Always zero"],"a":0,"e":"For parallel capacitors, Cₑq = C₁ + C₂ + … ."},{"q":"For capacitors in series, each capacitor carries the same magnitude of…","o":["Potential difference","Charge","Capacitance","Stored energy in all cases"],"a":1,"e":"In a series chain, the charge magnitude on each capacitor is equal."},{"q":"Two identical capacitors, each C, are connected in series. Their equivalent capacitance is…","o":["2C","C","C/2","C/4"],"a":2,"e":"Two equal capacitors in series give Cₑq = C/2."},{"q":"Two identical capacitors, each C, are connected in parallel. Their equivalent capacitance is…","o":["C/2","C","2C","4C"],"a":2,"e":"Two capacitors in parallel give Cₑq = C + C = 2C."},{"q":"A 10 μF capacitor charged to 12 V stores energy…","o":["0.72 mJ","7.2 mJ","72 mJ","720 mJ"],"a":0,"e":"U = ½ × 10 × 10⁻⁶ × 12² = 720 × 10⁻⁶ J = 0.72 mJ."},{"q":"The capacitance of a parallel-plate capacitor increases when…","o":["Plate separation increases","Plate area decreases","A dielectric of relative permittivity greater than one fills the gap","The applied voltage increases with geometry fixed"],"a":0,"e":"U = ½ × 10 μF × (12 V)² = 720 μJ = 0.72 mJ."},{"q":"A capacitor is charged to 20 V and has capacitance 3 μF. Its stored energy is…","o":["0.6 mJ","1.2 mJ","6 mJ","12 mJ"],"a":0,"e":"U = ½ × 3 μF × (20 V)² = 600 μJ = 0.6 mJ."}];
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function typesetMath(){if(window.MathJax?.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options'),$('feedback')].filter(Boolean)).catch(()=>{});}}
window.addEventListener('load',typesetMath);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
 typesetMath();
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Capacitor Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
   if(window.MathJax?.typesetPromise) window.MathJax.typesetPromise([review]).catch(()=>{});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
