<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Carnot Engine</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}</style></head><body><div class="wrap"><div class="card"><h1>🔥 Carnot Engine</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['A Carnot engine is an ideal heat engine operating through a','reversible cycle','free-expansion cycle','single isochoric process','single adiabatic process',0,'The Carnot cycle is a completely reversible cycle consisting of two isothermal and two adiabatic processes.'],
['A Carnot engine operates between','one reservoir','two reservoirs at different temperatures','two reservoirs at the same temperature','no reservoirs',1,'A heat engine operates between a hot reservoir and a cold reservoir.'],
['The four processes in a Carnot cycle are','two isothermal and two adiabatic','two isobaric and two isochoric','four isothermal','four adiabatic',0,'The Carnot cycle contains two reversible isothermal and two reversible adiabatic processes.'],
['During isothermal expansion of a Carnot engine, heat is','rejected to the sink','absorbed from the hot reservoir','zero','converted entirely into internal energy',1,'At the hot temperature, the working substance absorbs heat and performs work.'],
['During isothermal compression of a Carnot engine, heat is','absorbed from the hot reservoir','rejected to the cold reservoir','always zero','converted into mass',1,'During cold isothermal compression, heat is rejected to the sink.'],
['The efficiency of a Carnot engine operating between TH and TC is','1 − TC/TH','1 − TH/TC','TC/TH','TH/TC',0,'For absolute temperatures, η = 1 − TC/TH, where TH > TC.'],
['In the Carnot efficiency formula, temperature must be measured in','Celsius','Fahrenheit','kelvin','any temperature scale',2,'Absolute thermodynamic temperature in kelvin must be used.'],
['A Carnot engine works between 600 K and 300 K. Its efficiency is','25%','40%','50%','75%',2,'η = 1 − 300/600 = 0.50 = 50%.'],
['If the sink temperature is fixed and source temperature is increased, Carnot efficiency','decreases','increases','becomes zero','remains 50%',1,'η = 1 − TC/TH, so increasing TH increases efficiency when TC is fixed.'],
['If source and sink temperatures become equal, Carnot efficiency is','100%','50%','0%','infinity',2,'When TH = TC, η = 1 − TC/TH = 0.'],
['For a reversible Carnot cycle, total entropy change of the universe is','positive','negative','zero','infinite',2,'A completely reversible cycle has zero entropy generation.'],
['For a reversible Carnot cycle, entropy gained from the hot reservoir is','greater than entropy lost to the sink','equal to entropy lost to the sink','always zero','unrelated to heat transfer',1,'For reversibility, QH/TH = QC/TC, so the entropy magnitudes are equal.'],
['Carnot theorem states that no engine between the same two temperatures can have efficiency','equal to a Carnot engine','greater than a reversible Carnot engine','less than zero','dependent on its mass',1,'A reversible Carnot engine gives the limiting efficiency between two fixed temperatures.'],
['A Carnot engine absorbs 1000 J from the hot reservoir and has 40% efficiency. Work output is','200 J','400 J','600 J','1400 J',1,'W = ηQH = 0.40 × 1000 = 400 J.'],
['A Carnot engine has 40% efficiency and absorbs 1000 J. Heat rejected to the sink is','200 J','400 J','600 J','1000 J',2,'W = 400 J, so QC = QH − W = 1000 − 400 = 600 J.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
