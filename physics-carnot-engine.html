const questions=[
{q:'A Carnot engine is an ideal heat engine operating through a',o:['reversible cycle','free-expansion cycle','single isochoric process','single adiabatic process'],a:0,e:'The Carnot cycle is a completely reversible cycle consisting of two isothermal and two adiabatic processes.'},
{q:'A Carnot engine operates between',o:['one reservoir','two reservoirs at different temperatures','two reservoirs at the same temperature','no reservoirs'],a:1,e:'A heat engine needs a hot reservoir and a cold reservoir; the Carnot engine operates reversibly between them.'},
{q:'The four processes in a Carnot cycle are',o:['two isothermal and two adiabatic','two isobaric and two isochoric','four isothermal','four adiabatic'],a:0,e:'The Carnot cycle contains two reversible isothermal processes and two reversible adiabatic processes.'},
{q:'During the isothermal expansion of a Carnot engine, heat is',o:['rejected to the sink','absorbed from the hot reservoir','zero','converted entirely into internal energy'],a:1,e:'During isothermal expansion at the hot temperature, the working substance absorbs heat from the hot reservoir and does work.'},
{q:'During the isothermal compression of a Carnot engine, heat is',o:['absorbed from the hot reservoir','rejected to the cold reservoir','always zero','converted into mass'],a:1,e:'The working substance is compressed isothermally at the cold temperature and rejects heat to the cold reservoir.'},
{q:'The efficiency of a Carnot engine operating between TH and TC is',o:['1 − TC/TH','1 − TH/TC','TC/TH','TH/TC'],a:0,e:'For absolute temperatures, Carnot efficiency is η = 1 − TC/TH, where TH > TC.'},
{q:'In the Carnot efficiency formula, temperature must be measured in',o:['Celsius','Fahrenheit','kelvin','any temperature scale'],a:2,e:'Absolute thermodynamic temperature in kelvin must be used in the efficiency expression.'},
{q:'A Carnot engine works between 600 K and 300 K. Its efficiency is',o:['25%','40%','50%','75%'],a:2,e:'η = 1 − 300/600 = 0.50 = 50%.'},
{q:'If the sink temperature is kept fixed and the source temperature is increased, Carnot efficiency',o:['decreases','increases','becomes zero','always remains 50%'],a:1,e:'η = 1 − TC/TH, so increasing TH while keeping TC fixed increases efficiency.'},
{q:'If the source and sink temperatures of a Carnot engine become equal, its efficiency approaches',o:['100%','50%','0%','infinity'],a:2,e:'When TH = TC, the temperature difference vanishes and η = 1 − TC/TH = 0.'},
{q:'A Carnot engine is reversible, so the total entropy change of the universe over one complete cycle is',o:['positive','negative','zero','infinite'],a:2,e:'A completely reversible cycle has zero total entropy generation; the entropy change of the universe is zero.'},
{q:'For a reversible Carnot cycle, the entropy gained from the hot reservoir is',o:['greater than entropy lost to the cold reservoir','equal to entropy lost to the cold reservoir','always zero','unrelated to heat transfer'],a:1,e:'For a reversible cycle, QH/TH = QC/TC, so the entropy gained and rejected have equal magnitudes.'},
{q:'The Carnot theorem states that no engine operating between the same two temperatures can have efficiency',o:['equal to a Carnot engine','greater than a reversible Carnot engine','less than zero','dependent on temperature'],a:1,e:'Carnot theorem establishes the maximum possible efficiency for an engine operating between two fixed temperatures.'},
{q:'If a Carnot engine absorbs 1000 J from the hot reservoir and has 40% efficiency, its work output is',o:['200 J','400 J','600 J','1400 J'],a:1,e:'W = ηQH = 0.40 × 1000 = 400 J.'},
{q:'For a Carnot engine with 40% efficiency and heat input 1000 J, the heat rejected to the sink is',o:['200 J','400 J','600 J','1000 J'],a:2,e:'W = 400 J, so QC = QH − W = 1000 − 400 = 600 J.'}
];let i=0,selected=null,checked=false,score=0;const $=id=>document.getElementById(id);

function next(){if(selected===null)return;if(!checked){checked=true;const item=questions[i],ok=selected===item.a;if(ok)score++;document.querySelectorAll('.opt').forEach(b=>{const n=+b.dataset.index;b.disabled=true;if(n===item.a)b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+`<div class="explain">${item.e}</div>`;$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=`${(i+1)/15*100}%`;$('xp').textContent=`XP: ${score*10}`}else if(i<14){i++;render()}else finish()}
function finish(){$('quiz').hidden=true;$('result').hidden=false;const pct=Math.round(score/15*100);$('result').innerHTML=`<h2>🎉 Carnot Engine Complete!</h2><div class="score">${score} / 15</div><p><strong>${pct}%</strong> accuracy</p><p>🏆 You earned <strong>${score*10} XP</strong>.</p><p>${score>=12?'🔥 Excellent NEET readiness!':score>=9?'💪 Good work. Revise and retry for mastery.':'📚 Revise the Carnot cycle and try again.'}</p><button class="continue" type="button" onclick="location.reload()">Retry 15 MCQs</button>`}$('continue').onclick=next;render();
</script></body></html>
