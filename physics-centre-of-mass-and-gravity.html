<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🌍 Centre of Mass and Gravity</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
  {
    "q": "What is the centre of mass of a system?",
    "o": [
      "Always the geometric centre",
      "Always the point of maximum gravity",
      "Always outside the system",
      "The mass-weighted average position of its parts"
    ],
    "a": 3,
    "e": "The centre of mass is the mass-weighted mean position of the system's mass."
  },
  {
    "q": "For a uniform sphere, the centre of mass is located:",
    "o": [
      "At its geometric centre",
      "At its surface",
      "At its top point",
      "Outside the sphere"
    ],
    "a": 0,
    "e": "Spherical symmetry places the centre of mass at the geometric centre."
  },
  {
    "q": "In a uniform gravitational field, the centre of gravity of a rigid body:",
    "o": [
      "Changes with the body's orientation only",
      "Coincides with its centre of mass",
      "Must be at its lowest point",
      "Must be outside the body"
    ],
    "a": 1,
    "e": "In a uniform gravitational field, weight acts as if concentrated at the centre of mass, so the centre of gravity coincides with it."
  },
  {
    "q": "The centre of gravity is the point through which the resultant:",
    "o": [
      "Air resistance always acts",
      "Elastic force always acts",
      "Gravitational force (weight) acts",
      "Magnetic force always acts"
    ],
    "a": 2,
    "e": "The centre of gravity is the effective point of application of the body's total weight."
  },
  {
    "q": "When can centre of mass and centre of gravity differ?",
    "o": [
      "Only for a uniform rod",
      "Never under any condition",
      "Only when mass is zero",
      "In a non-uniform gravitational field"
    ],
    "a": 3,
    "e": "If gravity varies significantly across a body, the resultant weight's point of application need not coincide with the centre of mass."
  },
  {
    "q": "A uniform straight rod has its centre of mass at:",
    "o": [
      "Its midpoint",
      "One end",
      "One-quarter of its length from an end",
      "Outside the rod"
    ],
    "a": 0,
    "e": "Uniform linear mass distribution makes the rod's midpoint its centre of mass."
  },
  {
    "q": "Two equal point masses are placed at x = −2 m and x = +6 m. Their centre of mass is:",
    "o": [
      "6 m",
      "−2 m",
      "0 m",
      "2 m"
    ],
    "a": 3,
    "e": "For equal masses, xcm = (−2 + 6)/2 = 2 m."
  },
  {
    "q": "A 2 kg mass at x = 0 m and a 6 kg mass at x = 4 m have centre of mass:",
    "o": [
      "3 m",
      "4 m",
      "1 m",
      "2 m"
    ],
    "a": 0,
    "e": "xcm = (2×0 + 6×4)/(2+6) = 3 m."
  },
  {
    "q": "The centre of mass of a uniform circular ring is:",
    "o": [
      "On its circumference",
      "At any point on the ring",
      "Outside the ring's plane",
      "At the centre of the circle"
    ],
    "a": 3,
    "e": "Rotational symmetry puts the centre of mass at the circle's centre, even though that point is empty."
  },
  {
    "q": "For a uniform triangular lamina, the centre of mass is at the:",
    "o": [
      "Centroid where the medians meet",
      "Longest vertex only",
      "Midpoint of the longest side",
      "Circumference"
    ],
    "a": 0,
    "e": "A uniform triangle's centre of mass is its centroid, located at the intersection of its medians."
  },
  {
    "q": "The centre of mass of a system of particles depends on:",
    "o": [
      "Only external force",
      "Their masses and positions",
      "Only their velocities",
      "Only the system's colour"
    ],
    "a": 1,
    "e": "Mass and position determine the mass-weighted average location."
  },
  {
    "q": "If all particles of a system are translated by the same vector, the centre of mass:",
    "o": [
      "Moves twice as far",
      "Moves to the origin",
      "Translates by the same vector",
      "Stays fixed"
    ],
    "a": 2,
    "e": "A common translation shifts the centre of mass by exactly the same displacement."
  },
  {
    "q": "Can the centre of mass lie outside the material of a body?",
    "o": [
      "No, never",
      "Only if the body is moving",
      "Only if gravity is absent",
      "Yes, for example at the centre of a ring"
    ],
    "a": 3,
    "e": "A ring's centre of mass lies in the empty central region."
  },
  {
    "q": "In a uniform gravitational field, the total weight of a body is:",
    "o": [
      "Mg",
      "M/g",
      "g/M",
      "M + g"
    ],
    "a": 0,
    "e": "Weight W = Mg, where M is mass and g is gravitational acceleration."
  },
  {
    "q": "The SI unit of weight is:",
    "o": [
      "Metre",
      "Newton",
      "Kilogram",
      "Joule per second"
    ],
    "a": 1,
    "e": "Weight is a force, so it is measured in newtons (N)."
  },
  {
    "q": "A body is in stable equilibrium when a small displacement produces a tendency to:",
    "o": [
      "Remain at a higher potential energy",
      "Lose all mass",
      "Return to its original position",
      "Move farther from its original position"
    ],
    "a": 2,
    "e": "Stable equilibrium has a restoring tendency after a small displacement."
  },
  {
    "q": "For a body to be in equilibrium under gravity, the line of action of its weight must:",
    "o": [
      "Always pass outside its base",
      "Be parallel to the ground",
      "Pass through its highest point",
      "Fall within its base of support for stable standing"
    ],
    "a": 3,
    "e": "If the vertical line through the centre of gravity falls outside the support base, the body tends to topple."
  },
  {
    "q": "A body is more stable when it has:",
    "o": [
      "A lower centre of gravity and a wider base",
      "A higher centre of gravity and a narrow base",
      "A smaller mass in all cases",
      "A centre of gravity outside its base"
    ],
    "a": 0,
    "e": "A lower centre of gravity and wider base make tipping less likely."
  },
  {
    "q": "If a body's centre of gravity is directly above the edge of its support base, it is:",
    "o": [
      "Weightless",
      "At the tipping threshold",
      "Always maximally stable",
      "In free fall"
    ],
    "a": 1,
    "e": "At the edge, a small further tilt can move the line of action outside the base and cause toppling."
  },
  {
    "q": "The centre of mass of two masses m and 3m separated by distance d lies from the mass m toward 3m at distance:",
    "o": [
      "3d/4",
      "d",
      "d/4",
      "d/2"
    ],
    "a": 0,
    "e": "Measured from m, xcm = (3m·d)/(4m) = 3d/4."
  },
  {
    "q": "A 4 kg object has centre of mass at x = 2 m. A 2 kg object at x = 8 m is attached. The new centre of mass is:",
    "o": [
      "4 m",
      "5 m",
      "6 m",
      "3 m"
    ],
    "a": 0,
    "e": "xcm = (4×2 + 2×8)/6 = 24/6 = 4 m. Correction: this calculation gives 4 m, so option B is correct."
  },
  {
    "q": "For a uniform body with a centre of symmetry, the centre of mass is:",
    "o": [
      "At the centre of symmetry",
      "Always at its lowest point",
      "At the nearest edge",
      "At an arbitrary point"
    ],
    "a": 0,
    "e": "A symmetric uniform mass distribution balances about its centre of symmetry."
  },
  {
    "q": "What is the gravitational acceleration near Earth's surface approximately?",
    "o": [
      "98 kg",
      "9.8 m/s²",
      "9.8 m/s",
      "9.8 N"
    ],
    "a": 1,
    "e": "Near Earth's surface, g is approximately 9.8 m/s²."
  },
  {
    "q": "The centre of gravity of a body is the point where its total:",
    "o": [
      "Temperature is highest",
      "Velocity becomes zero",
      "Weight can be considered to act",
      "Volume is always concentrated"
    ],
    "a": 2,
    "e": "It is the effective point of application of the resultant gravitational force."
  },
  {
    "q": "If gravitational field is uniform, moving a rigid body without changing its mass distribution relative to itself:",
    "o": [
      "Separates the two points necessarily",
      "Makes its mass change",
      "Makes its weight zero",
      "Keeps centre of mass and centre of gravity coincident"
    ],
    "a": 3,
    "e": "In a uniform field, the resultant weight acts through the centre of mass regardless of the body's location."
  },
  {
    "q": "A uniform square lamina has its centre of mass at:",
    "o": [
      "The intersection of its diagonals",
      "One corner",
      "The midpoint of one edge",
      "Outside the square"
    ],
    "a": 0,
    "e": "The square's symmetry puts its centre of mass at the intersection of its diagonals."
  },
  {
    "q": "The x-coordinate of centre of mass for point particles is:",
    "o": [
      "Σmᵢxᵢ only",
      "Σmᵢxᵢ/Σmᵢ",
      "Σxᵢ/Σmᵢ",
      "Σmᵢ/Σxᵢ"
    ],
    "a": 1,
    "e": "Each x-coordinate is weighted by its particle's mass and divided by total mass."
  },
  {
    "q": "Why can a tall object with a narrow base topple easily?",
    "o": [
      "Its centre of mass must be at the base",
      "Gravity acts horizontally",
      "Its line of weight can move outside the small support base",
      "Its mass disappears"
    ],
    "a": 2,
    "e": "A narrow base gives a smaller range of tilt before the weight's line of action passes outside it."
  },
  {
    "q": "A 2 kg mass at x = −3 m and a 4 kg mass at x = 3 m have centre of mass:",
    "o": [
      "0 m",
      "1 m",
      "2 m",
      "−1 m"
    ],
    "a": 1,
    "e": "xcm = (2×−3 + 4×3)/6 = 1 m."
  },
  {
    "q": "Which statement correctly distinguishes centre of mass and centre of gravity?",
    "o": [
      "Centre of mass depends on mass distribution; centre of gravity describes the resultant weight's action point",
      "They always refer to unrelated points",
      "Centre of gravity depends only on colour",
      "Centre of mass exists only in a gravitational field"
    ],
    "a": 0,
    "e": "The centre of mass is defined by mass distribution; the centre of gravity is defined by the gravitational force distribution."
  }
];
let index=0,score=0,streak=0,chosen=null,locked=false;
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Nice work!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><button class="btn" id="retry">Practice again</button>';
 $('finishSlot').replaceChildren(card);$('retry').addEventListener('click',()=>{index=0;score=0;streak=0;$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
