<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Centre of Mass and Gravity</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:1.55rem;font-weight:900}.xp,.card{background:#fff;border-radius:20px;box-shadow:0 6px 20px #17203312}.xp{padding:10px 15px;font-weight:850}.subtitle{color:#5f6b7a;margin:8px 0 18px}.card{padding:20px;margin:12px 0}.ph{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:11px;background:#dfe8f1;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.25s}.qnum{font-weight:800;color:#35516f;margin-bottom:11px}.question{font-size:1.25rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#58cc02;background:#f7fff1;transform:translateY(-1px)}.selected{border-color:#1685e8!important;background:#eef7ff!important}.correct{border-color:#58cc02!important;background:#eaffdf!important}.wrong{border-color:#e5484d!important;background:#fff0f0!important}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;background:#2db84d;color:#fff;font-weight:850;cursor:pointer;box-shadow:0 4px 0 #21863a}.feedback{margin-top:14px;padding:12px;border-radius:13px;font-weight:700}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:10px;padding:10px 13px;border:2px solid #d9d4f5;border-radius:13px;color:#5146a5;font-weight:800;text-decoration:none}.back:hover{background:#f0edff}@media(max-width:600px){.wrap{padding:20px 14px}.title{font-size:1.35rem}.question{font-size:1.12rem}}</style></head><body><main class="wrap"><div class="top"><div class="title">🎯 Centre of Mass & Gravity</div><div class="xp">⚡ <span id="xp">0</span> XP</div></div><p class="subtitle">Physics • NEET 2026 · Learn → Practice → Master</p><section class="card"><div class="ph"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><button class="btn" id="continue">Continue →</button><div id="feedback" class="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const q=[['The centre of mass of a system is the point where:', ['the whole mass may be considered concentrated for translational motion','gravity is always zero','all particles stop','density is maximum'],0,'The CM represents the mass-weighted average position.'],['For two masses m₁ and m₂ at x₁ and x₂, xCM equals:', ['(m₁x₁+m₂x₂)/(m₁+m₂)','x₁+x₂','m₁x₁+m₂x₂','(x₁+x₂)/(m₁m₂)'],0,'The centre of mass is the mass-weighted mean position.'],['The centre of gravity is the point through which:', ['the resultant weight acts','all forces act','velocity acts','mass disappears'],0,'The resultant gravitational force acts through the centre of gravity.'],['In a uniform gravitational field, centre of mass and centre of gravity:', ['coincide','are always at opposite ends','never exist','must be outside the body'],0,'In a uniform gravitational field, CG coincides with CM.'],['For a uniform rod in a uniform gravitational field, its centre of gravity is at:', ['its geometric centre','one end','twice its length','any point'],0,'Uniform density and uniform gravity place CG at the midpoint.'],['The centre of mass of a symmetric uniform body lies:', ['on its symmetry axis','outside the body necessarily','at the heaviest point','at infinity'],0,'Symmetry constrains the CM to the symmetry axis.'],['If the gravitational field is non-uniform, centre of gravity:', ['need not coincide with centre of mass','must always equal CM','does not exist','is always at the geometric centre'],0,'A varying gravitational field can shift the resultant weight location.'],['The motion of the centre of mass of an isolated system is determined by:', ['external forces','internal forces only','shape only','temperature only'],0,'Internal forces cancel in the total momentum equation.'],['If no external force acts on a system, its centre of mass:', ['moves with constant velocity','must remain at rest','accelerates uniformly','moves in a circle'],0,'With zero net external force, CM velocity remains constant.'],['The centre of gravity of a body is related to:', ['the resultant gravitational force','only its volume','only its surface area','electric charge only'],0,'CG is defined from the distribution of gravitational weight.'],['For a body in uniform gravity, total weight can be treated as acting:', ['at the centre of mass','at every point equally as a single force','only at the boundary','at the origin'],0,'Uniform gravity makes the resultant weight pass through the CM.'],['Adding mass to one side of a body generally shifts its centre of mass:', ['toward the added mass','away from it always','to the opposite side','nowhere'],0,'The mass-weighted position shifts toward added mass.'],['For two equal masses separated symmetrically about x=0, the x-coordinate of CM is:', ['0','1','-1','their separation'],0,'Equal symmetric contributions cancel.'],['The centre of mass is useful because a complex system can often be treated as:', ['a single point for translational motion','a point with no mass','a body with no momentum','a force only'],0,'Translational motion of the system is described by its CM.'],['Which statement is correct?', ['CG and CM coincide in a uniform gravitational field','CG is always outside the body','CM depends only on gravity','CG never depends on mass distribution'],0,'Uniform gravity makes the gravitational resultant pass through the CM.']];let i=0,s=-1,checked=false,score=0;const $=x=>document.getElementById(x),opts=$("options"),btn=$("continue"),fb=$("feedback");function render(){let a=q[i];s=-1;checked=false;$("count").textContent='Question '+(i+1)+' of 15';$("question").textContent=a[0];opts.innerHTML='';fb.className='feedback';fb.textContent='';btn.textContent=i===14?'Finish Skill →':'Continue →';let ar=a[1].map((text,index)=>({text,index}));for(let k=ar.length-1;k>0;k--){let r=Math.floor(Math.random()*(k+1));[ar[k],ar[r]]=[ar[r],ar[k]]}ar.forEach((x,j)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{s=x.index;[...opts.children].forEach(z=>z.classList.remove('selected'));b.classList.add('selected')};opts.appendChild(b)})}btn.onclick=()=>{if(!checked){if(s<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}checked=true;let a=q[i],ok=s===a[2];[...opts.children].forEach(b=>{let n=+b.dataset.index;b.disabled=true;if(n===a[2])b.classList.add('correct');if(n===s&&!ok)b.classList.add('wrong')});if(ok)score++;fb.className='feedback '+(ok?'good':'bad');fb.textContent=(ok?'🎯 Correct! +10 XP — ':'✗ Review — Correct answer: '+a[1][a[2]]+'. ')+a[3];$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=score/15*100+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$("question").textContent='🏆 Centre of Mass & Gravity Complete!';opts.innerHTML='';btn.style.display='none';fb.className='feedback good';fb.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};$("back").onclick=function(){let saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{let u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{let u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
