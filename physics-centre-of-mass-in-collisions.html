<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>💥 Centre of Mass in Collisions</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
  {
    "q": "For an isolated system of colliding bodies, total linear momentum is:",
    "o": [
      "Always zero",
      "Always doubled",
      "Not related to mass",
      "Conserved"
    ],
    "a": 3,
    "e": "If net external force is zero, total momentum before and after the collision is the same."
  },
  {
    "q": "During a collision, internal forces can change the motion of individual bodies, but the system's centre-of-mass velocity:",
    "o": [
      "Remains constant if net external force is zero",
      "Must become zero",
      "Always reverses",
      "Depends only on collision time"
    ],
    "a": 0,
    "e": "The centre of mass obeys M a_cm = F_external; with zero net external force, its velocity is constant."
  },
  {
    "q": "The centre-of-mass velocity of two bodies is:",
    "o": [
      "m₁ + m₂",
      "(m₁v₁ + m₂v₂)/(m₁ + m₂)",
      "v₁ + v₂",
      "(v₁ − v₂)/2 always"
    ],
    "a": 1,
    "e": "It is the total momentum divided by the total mass, using signed velocities along the chosen axis."
  },
  {
    "q": "A 2 kg body moves right at 4 m/s and a 2 kg body moves left at 2 m/s. Their centre-of-mass velocity is:",
    "o": [
      "3 m/s left",
      "0 m/s",
      "1 m/s right",
      "2 m/s right"
    ],
    "a": 2,
    "e": "Taking right positive: v_cm = (2×4 + 2×(−2))/4 = 1 m/s right."
  },
  {
    "q": "Two bodies of total mass M have total momentum P. Their centre-of-mass velocity is:",
    "o": [
      "PM",
      "M/P",
      "P + M",
      "P/M"
    ],
    "a": 3,
    "e": "By definition, v_cm = P_total/M_total."
  },
  {
    "q": "If the net external force during a collision is negligible, the centre of mass moves with:",
    "o": [
      "Constant velocity",
      "Constant acceleration of any value",
      "Increasing speed always",
      "Zero velocity always"
    ],
    "a": 0,
    "e": "With negligible external force, the system's total momentum and centre-of-mass velocity remain constant."
  },
  {
    "q": "A 1 kg ball at 6 m/s collides with a stationary 2 kg ball. The system's centre-of-mass speed before impact is:",
    "o": [
      "6 m/s",
      "1 m/s",
      "2 m/s",
      "3 m/s"
    ],
    "a": 2,
    "e": "v_cm = (1×6 + 2×0)/(1+2) = 2 m/s."
  },
  {
    "q": "In a perfectly inelastic collision, the colliding bodies:",
    "o": [
      "Lose all momentum",
      "Must have equal masses",
      "Stick together after collision",
      "Always rebound with equal speeds"
    ],
    "a": 2,
    "e": "In a perfectly inelastic collision, the bodies move together after impact; momentum is conserved if external impulse is negligible."
  },
  {
    "q": "Two equal masses move toward each other at equal speeds. The centre-of-mass velocity is:",
    "o": [
      "Equal to either speed",
      "Twice either speed",
      "Always positive",
      "Zero"
    ],
    "a": 3,
    "e": "Equal and opposite momenta sum to zero, so v_cm = 0."
  },
  {
    "q": "A 3 kg object moves at 2 m/s and a 1 kg object moves at 6 m/s in the same direction. Their centre-of-mass velocity is:",
    "o": [
      "2 m/s",
      "3 m/s",
      "4 m/s",
      "6 m/s"
    ],
    "a": 1,
    "e": "v_cm = (3×2 + 1×6)/4 = 12/4 = 3 m/s. Correction: this equals 3 m/s, so option B is correct."
  },
  {
    "q": "A collision occurs on a frictionless horizontal surface. Which external force can still act on the system?",
    "o": [
      "Only the internal spring force",
      "Gravity and the normal force",
      "Only the collision force between the bodies",
      "No forces at all"
    ],
    "a": 1,
    "e": "Gravity and the surface normal act externally; their vertical effects may cancel, while horizontal external impulse can be negligible."
  },
  {
    "q": "Why can momentum be conserved even though kinetic energy is not conserved?",
    "o": [
      "Momentum depends only on speed",
      "Energy loss creates extra momentum",
      "Momentum conservation follows from negligible net external impulse; kinetic energy may transform into other forms",
      "Kinetic energy is always conserved in every collision"
    ],
    "a": 2,
    "e": "In inelastic collisions, kinetic energy can convert into heat, sound or deformation while total momentum remains conserved."
  },
  {
    "q": "A 2 kg cart at 3 m/s collides and sticks to a 1 kg cart at rest. Their shared final speed is:",
    "o": [
      "2 m/s",
      "3 m/s",
      "6 m/s",
      "1 m/s"
    ],
    "a": 0,
    "e": "Momentum conservation gives v = (2×3 + 1×0)/(2+1) = 2 m/s."
  },
  {
    "q": "Two bodies have masses 1 kg and 3 kg and velocities +8 m/s and 0 m/s. The centre-of-mass velocity is:",
    "o": [
      "+2 m/s",
      "+4 m/s",
      "+6 m/s",
      "+8 m/s"
    ],
    "a": 0,
    "e": "v_cm = (1×8 + 3×0)/4 = +2 m/s. Correction: the answer is +2 m/s, option A."
  },
  {
    "q": "If a collision is viewed in the centre-of-mass frame, the total momentum of the system is:",
    "o": [
      "Equal to kinetic energy",
      "Zero",
      "Always positive",
      "Equal to total mass"
    ],
    "a": 1,
    "e": "By definition, the centre-of-mass frame moves with v_cm, making the system's total momentum zero in that frame."
  },
  {
    "q": "A 4 kg body moves at 5 m/s and a 6 kg body at 0 m/s. Find v_cm.",
    "o": [
      "3 m/s",
      "5 m/s",
      "1 m/s",
      "2 m/s"
    ],
    "a": 3,
    "e": "v_cm = (4×5 + 6×0)/10 = 2 m/s."
  },
  {
    "q": "During a short collision, why is external impulse often neglected?",
    "o": [
      "External forces do not exist",
      "Mass becomes zero",
      "Gravity reverses direction",
      "The collision forces are usually much larger over the short contact time"
    ],
    "a": 3,
    "e": "The external impulse over the short collision interval is often small compared with the internal collision impulse."
  },
  {
    "q": "Two equal masses collide head-on with velocities +5 m/s and −1 m/s. Their centre-of-mass velocity is:",
    "o": [
      "−3 m/s",
      "−2 m/s",
      "+2 m/s",
      "+3 m/s"
    ],
    "a": 2,
    "e": "For equal masses, v_cm = (5 + (−1))/2 = 2 m/s."
  },
  {
    "q": "A 2 kg object moving at 5 m/s collides with a 3 kg object moving at −1 m/s. Find v_cm.",
    "o": [
      "3.0 m/s",
      "0.2 m/s",
      "1.4 m/s",
      "2.0 m/s"
    ],
    "a": 2,
    "e": "v_cm = (2×5 + 3×(−1))/5 = 7/5 = 1.4 m/s."
  },
  {
    "q": "Which quantity determines the centre-of-mass velocity?",
    "o": [
      "Only the heaviest object's velocity",
      "Only the relative speed",
      "Total momentum divided by total mass",
      "Total kinetic energy divided by mass"
    ],
    "a": 2,
    "e": "The centre-of-mass velocity is P_total/M_total."
  },
  {
    "q": "In an isolated two-body collision, the centre of mass may:",
    "o": [
      "Stop whenever the bodies collide",
      "Accelerate due to internal forces alone",
      "Move only if kinetic energy is conserved",
      "Continue moving uniformly while the bodies change velocities"
    ],
    "a": 3,
    "e": "Internal forces cancel in pairs for the whole system, leaving the centre-of-mass motion unchanged when external force is zero."
  },
  {
    "q": "A 1 kg body at +4 m/s collides with a 3 kg body at −2 m/s. Find v_cm.",
    "o": [
      "−0.5 m/s",
      "−1 m/s",
      "+0.5 m/s",
      "+1 m/s"
    ],
    "a": 0,
    "e": "v_cm = (1×4 + 3×(−2))/4 = −2/4 = −0.5 m/s."
  },
  {
    "q": "If the centre-of-mass velocity is zero, the system's total momentum is:",
    "o": [
      "Always nonzero",
      "Zero",
      "Maximum",
      "Equal to total mass"
    ],
    "a": 1,
    "e": "P_total = M_total v_cm, so if v_cm = 0, total momentum is zero."
  },
  {
    "q": "A 2 kg body moves at 1 m/s and a 6 kg body moves at 3 m/s in the same direction. Find v_cm.",
    "o": [
      "2.5 m/s",
      "3 m/s",
      "1.5 m/s",
      "2 m/s"
    ],
    "a": 0,
    "e": "v_cm = (2×1 + 6×3)/8 = 20/8 = 2.5 m/s."
  },
  {
    "q": "Which statement is true for an isolated collision?",
    "o": [
      "Each body's velocity is unchanged",
      "Kinetic energy must be conserved",
      "The bodies must stick together",
      "The centre-of-mass velocity is unchanged by the collision"
    ],
    "a": 3,
    "e": "With no net external impulse, total momentum and centre-of-mass velocity are conserved regardless of collision type."
  },
  {
    "q": "A 5 kg cart at 2 m/s and a 5 kg cart at rest stick together. Their final speed is:",
    "o": [
      "0.5 m/s",
      "1 m/s",
      "1.5 m/s",
      "2 m/s"
    ],
    "a": 1,
    "e": "v = (5×2 + 5×0)/10 = 1 m/s."
  },
  {
    "q": "A 1 kg ball at 10 m/s hits a 1 kg ball at rest and they move together. What is the shared speed?",
    "o": [
      "20 m/s",
      "2.5 m/s",
      "5 m/s",
      "10 m/s"
    ],
    "a": 2,
    "e": "Momentum conservation: v = (1×10)/(1+1) = 5 m/s."
  },
  {
    "q": "In one dimension, why must velocities be assigned signs in centre-of-mass calculations?",
    "o": [
      "Because masses can be negative",
      "To remove the total mass",
      "Opposite directions must contribute opposite momentum",
      "To make all velocities positive"
    ],
    "a": 2,
    "e": "Choose a positive direction and give velocities signs according to direction."
  },
  {
    "q": "If an external impulse changes total momentum by ΔP, the centre-of-mass velocity changes by:",
    "o": [
      "MΔP",
      "ΔP × M²",
      "No amount",
      "ΔP/M for constant total mass M"
    ],
    "a": 3,
    "e": "Since P = Mv_cm, for constant total mass Δv_cm = ΔP/M."
  },
  {
    "q": "A 2 kg body at +4 m/s and a 2 kg body at −4 m/s collide. The centre-of-mass velocity before collision is:",
    "o": [
      "0 m/s",
      "2 m/s",
      "4 m/s",
      "−4 m/s"
    ],
    "a": 0,
    "e": "Their equal and opposite momenta cancel, so the centre of mass is at rest."
  }
];
let index=0,score=0,streak=0,chosen=null,locked=false;
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Nice work!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><button class="btn" id="retry">Practice again</button>';
 $('finishSlot').replaceChildren(card);$('retry').addEventListener('click',()=>{index=0;score=0;streak=0;$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
