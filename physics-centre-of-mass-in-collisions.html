<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Centre of Mass in Collisions</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-size:1.55rem;font-weight:900}.subtitle{color:#5f6b7a;margin:0 0 18px}.xp,.card{background:#fff;border-radius:20px;box-shadow:0 6px 20px #17203312}.xp{padding:10px 15px;font-weight:850}.card{padding:20px;margin:12px 0}.ph{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:11px;background:#dfe8f1;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.25s}.qnum{font-weight:800;color:#35516f;margin-bottom:11px}.question{font-size:1.25rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#58cc02;background:#f7fff1;transform:translateY(-1px)}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;background:#2db84d;color:#fff;font-weight:850;cursor:pointer;box-shadow:0 4px 0 #21863a;transition:.12s}.btn:hover{transform:translateY(-2px)}.feedback{margin-top:14px;padding:12px;border-radius:13px;font-weight:700;min-height:18px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:10px;padding:10px 13px;border:2px solid #d9d4f5;border-radius:13px;color:#5146a5;font-weight:800;text-decoration:none}.back:hover{background:#f0edff;transform:translateX(-2px)}@media(max-width:600px){.wrap{padding:20px 14px}.title{font-size:1.35rem}.question{font-size:1.1rem}}</style></head><body><main class="wrap"><div class="top"><div class="title">🎯 Centre of Mass in Collisions</div><div class="xp">⚡ <span id="xp">0</span> XP</div></div><p class="subtitle">Physics • NEET 2026 · Learn → Practice → Master</p><section class="card"><div class="ph"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><button class="btn" id="continue">Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const quiz=[['In an isolated collision, the centre of mass moves with:', ['constant velocity','constant acceleration always','zero velocity always','increasing velocity always'],0,'With no external force, total momentum is constant, so the centre of mass moves uniformly.'],['During a collision between two particles, the centre-of-mass velocity is:', ['total momentum divided by total mass','relative velocity only','kinetic energy divided by mass','determined by the larger mass only'],0,'V_CM = total momentum / total mass.'],['If net external force on a colliding system is zero, the centre of mass:', ['continues uniform motion','must stop','must accelerate','moves in a circle'],0,'Zero external force implies constant centre-of-mass velocity.'],['For two particles initially at rest, the centre of mass during their mutual collision:', ['remains at rest','moves toward the faster particle','moves with one particle','accelerates indefinitely'],0,'Internal forces cannot change the motion of the centre of mass.'],['In a head-on collision, internal forces between particles:', ['do not change centre-of-mass motion','always accelerate the centre of mass','change total momentum','act as external forces'],0,'Internal forces cancel in the total-system momentum balance.'],['If total momentum is P and total mass is M, then centre-of-mass velocity is:', ['P/M','PM','M/P','P+M'],0,'The centre-of-mass velocity is P/M.'],['On a frictionless horizontal surface with no horizontal external force, the horizontal CM:', ['moves with constant velocity','must remain at the origin','must stop after collision','changes direction due to internal forces'],0,'With zero horizontal external force, horizontal CM velocity is conserved.'],['If the centre of mass is initially at rest in an isolated collision, after collision it:', ['remains at rest','moves toward the lighter body','moves toward the heavier body','has maximum speed'],0,'No external force means an initially zero CM velocity stays zero.'],['An explosion can change individual velocities while the isolated system CM:', ['keeps its uniform motion','always accelerates','loses momentum','moves to the explosion point'],0,'Internal interactions redistribute momentum but do not change isolated-system CM motion.'],['If m₁v₁ + m₂v₂ = 0, the centre-of-mass velocity is:', ['zero','v₁+v₂','m₁+m₂','infinite'],0,'Zero total momentum gives V_CM = 0.'],['During a perfectly inelastic collision, the centre of mass of an isolated system:', ['continues with constant velocity','stops because bodies stick','moves with relative velocity','loses mass'],0,'Sticking changes kinetic energy but not total momentum or CM velocity.'],['A force exerted by one colliding body on another is:', ['internal for the two-body system','always external','zero','necessarily gravitational'],0,'Forces between members of the chosen system are internal.'],['If an external impulse acts on a colliding system, its CM velocity:', ['can change','must remain unchanged','must become zero','is unrelated to impulse'],0,'External impulse changes total momentum and therefore CM velocity.'],['In the centre-of-mass frame of a two-body collision:', ['total momentum is zero','kinetic energy is always conserved','all forces vanish','the masses become equal'],0,'By definition, total momentum is zero in the centre-of-mass frame.'],['The motion of the centre of mass during an isolated collision is independent of:', ['the details of internal collision forces','total mass','total momentum','initial CM velocity'],0,'Internal force details affect relative motion, not isolated-system CM motion.']];let i=0,selected=-1,checked=false,score=0;const $=id=>document.getElementById(id),o=$("options"),b=$("continue"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;$("count").textContent='Question '+(i+1)+' of 15';$("question").textContent=a[0];o.innerHTML='';f.className='feedback';f.textContent='';b.style.display='inline-block';b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const el=document.createElement('button');el.className='option';el.textContent=String.fromCharCode(65+j)+'. '+item.text;el.dataset.index=item.index;el.onclick=()=>{selected=item.index;[...o.children].forEach(z=>z.classList.remove('selected'));el.classList.add('selected')};o.appendChild(el)})}b.onclick=()=>{if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(el=>{const n=Number(el.dataset.index);el.disabled=true;if(n===a[2])el.classList.add('correct');if(n===selected&&!ok)el.classList.add('wrong')});if(ok)score++;f.className=ok?'feedback good':'feedback bad';f.textContent=(ok?'🎯 Correct! +10 XP — ':'✗ Review — Correct answer: '+a[1][a[2]]+'. ')+a[3];$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$("question").textContent='🏆 Centre of Mass in Collisions Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
