<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Centre of Mass Problem Solving</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-size:1.6rem;font-weight:900}.subtitle{color:#5f6b7a;margin:0 0 18px}.xp,.card{background:#fff;border-radius:20px;box-shadow:0 6px 20px #17203312}.xp{padding:10px 15px;font-weight:850}.card{padding:20px;margin:12px 0}.ph{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:11px;background:#dfe8f1;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.25s}.qnum{font-weight:800;color:#35516f;margin-bottom:11px}.question{font-size:1.27rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#58cc02;background:#f7fff1;transform:translateY(-1px)}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;background:#2db84d;color:#fff;font-weight:850;cursor:pointer;box-shadow:0 4px 0 #21863a;transition:.12s}.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #21863a}.feedback{margin-top:14px;padding:12px;border-radius:13px;font-weight:700;min-height:18px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:10px;padding:10px 13px;border:2px solid #d9d4f5;border-radius:13px;color:#5146a5;font-weight:800;text-decoration:none;transition:.12s}.back:hover{background:#f0edff;transform:translateX(-2px)}.back:focus{outline:3px solid #c9c2ff;outline-offset:2px}.back:active{transform:translateY(1px)}@media(max-width:600px){.wrap{padding:20px 14px}.title{font-size:1.4rem}.question{font-size:1.12rem}}</style></head><body><main class="wrap"><div class="top"><div class="title">⚖️ Centre of Mass Problem Solving</div><div class="xp">⚡ <span id="xp">0</span> XP</div></div><p class="subtitle">Physics • NEET 2026 · Learn → Practice → Master</p><section class="card"><div class="ph"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><button class="btn" id="continue">Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const quiz=[['The centre of mass of two particles of masses m and 2m separated by distance d lies from the mass m at:', ['2d/3','d/3','d/2','d'],0,'The centre of mass is closer to the heavier mass: x=(2m)d/(3m)=2d/3 from the mass m.'],['Two equal masses are placed at x=0 and x=10 m. Their centre of mass is:', ['5 m','10 m','2.5 m','0 m'],0,'For equal masses, the centre of mass is the midpoint: x_CM=(0+10)/2=5 m.'],['A particle of mass 2 kg is at x=3 m and another of mass 1 kg is at x=9 m. The x-coordinate of their centre of mass is:', ['5 m','6 m','4 m','7 m'],0,'x_CM=(2×3+1×9)/(2+1)=15/3=5 m.'],['For a continuous body with uniform density and geometrical symmetry, its centre of mass is generally located:', ['at the centre of symmetry','always at an end','always outside the body','at the highest point'],0,'For a uniform symmetric body, the centre of mass coincides with its geometrical centre.'],['The centre of mass of a uniform circular ring is located:', ['at its centre','on its circumference','halfway between centre and rim','outside the ring'],0,'Rotational symmetry places the centre of mass at the geometric centre.'],['A uniform rod of length L has its centre of mass at:', ['L/2 from either end','L/3 from one end','L from one end','L/4 from either end'],0,'A uniform rod has equal mass distribution, so its centre of mass is at its midpoint L/2.'],['If no external force acts on an isolated system, the centre of mass:', ['moves with constant velocity','must remain at rest','always accelerates','moves in a circle'],0,'With zero net external force, M a_CM=0, so the centre of mass has constant velocity.'],['A system has total mass 4 kg and its centre of mass accelerates at 3 m/s². The net external force is:', ['12 N','7 N','1.33 N','16 N'],0,'F_ext=M a_CM=4×3=12 N.'],['A 3 kg mass moves at 4 m/s and a 1 kg mass moves at 8 m/s in the same direction. The centre-of-mass speed is:', ['5 m/s','6 m/s','4 m/s','8 m/s'],0,'V_CM=(3×4+1×8)/4=20/4=5 m/s.'],['A 2 kg body moving at 6 m/s right and a 4 kg body moving at 3 m/s left have centre-of-mass velocity:', ['0 m/s','1 m/s right','2 m/s left','4 m/s right'],0,'Taking right positive: V_CM=(2×6+4×(-3))/6=0.'],['A person walks inside a boat on still water. Neglecting external horizontal force, the centre of mass of person-boat system:', ['remains fixed horizontally','moves with the person','moves with the boat only','accelerates continuously'],0,'No external horizontal force means the horizontal centre of mass remains stationary.'],['An explosion breaks an object into fragments in free space. The centre of mass of all fragments:', ['continues along its original trajectory','jumps to one fragment','stops immediately','moves toward the heaviest fragment'],0,'Internal explosion forces cancel for the complete system, so the centre of mass follows the pre-explosion motion.'],['For two particles, the centre of mass divides the line joining them:', ['inversely in the ratio of their masses','in the direct ratio of their masses','always equally','at the heavier particle'],0,'The distances from the centre of mass are inversely proportional to the masses: m1 r1=m2 r2.'],['A 5 kg object has centre-of-mass position x=2 m. A 5 kg object is added at x=6 m. The new centre of mass is:', ['4 m','3 m','5 m','8 m'],0,'x_CM=(5×2+5×6)/10=4 m.'],['Which equation correctly gives the centre of mass coordinate for discrete particles along x?', ['x_CM=Σm_i x_i/Σm_i','x_CM=Σx_i/Σm_i','x_CM=Σm_i/Σx_i','x_CM=Σm_i x_i'],0,'The mass-weighted average position is x_CM=Σm_i x_i/Σm_i.']];let i=0,selected=-1,checked=false,score=0;const $=id=>document.getElementById(id),o=$("options"),b=$("continue"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;$("count").textContent='Question '+(i+1)+' of 15';$("question").textContent=a[0];o.innerHTML='';f.className='feedback';f.textContent='';b.style.display='inline-block';b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const el=document.createElement('button');el.className='option';el.textContent=String.fromCharCode(65+j)+'. '+item.text;el.dataset.index=item.index;el.onclick=()=>{selected=item.index;[...o.children].forEach(z=>z.classList.remove('selected'));el.classList.add('selected')};o.appendChild(el)})}b.onclick=()=>{if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(el=>{const n=Number(el.dataset.index);el.disabled=true;if(n===a[2])el.classList.add('correct');if(n===selected&&!ok)el.classList.add('wrong')});if(ok)score++;f.className=ok?'feedback good':'feedback bad';f.textContent=(ok?'🎯 Correct! +10 XP — ':'✗ Review — Correct answer: '+a[1][a[2]]+'. ')+a[3];$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$("question").textContent='🏆 Centre of Mass Problem Solving Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
