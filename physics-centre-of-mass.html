<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Centre of Mass</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f8;color:#202124;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 16px 40px}.head{display:flex;justify-content:space-between;align-items:center}.head h1{font-size:26px;margin:0}.xp{font-weight:700;color:#159447}.sub{color:#667085;margin:8px 0 18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 2px 8px #00000008}.master{padding:16px}.row{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e7eb;border-radius:99px;margin-top:10px;overflow:hidden}.fill{height:100%;width:0;background:#22c55e;transition:.25s}.qno{font-size:14px;color:#667085}.question{font-size:20px;font-weight:700;line-height:1.45;margin:10px 0 18px}.opts{display:grid;gap:10px}.opts button{width:100%;padding:14px;text-align:left;border:2px solid #d9dee5;background:#fff;border-radius:12px;font-size:16px;cursor:pointer}.opts button:hover{transform:translateY(-1px);border-color:#8fd3aa}.opts button.selected{border-color:#159447;background:#f0fbf4}.opts button.correct{border-color:#22a65a;background:#e9f9ef}.opts button.wrong{border-color:#e05252;background:#fff0f0}.btn{width:100%;margin-top:18px;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700;background:#20a653;color:#fff;cursor:pointer}.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}.feedback{min-height:24px;margin-top:14px;font-weight:700}.result{text-align:center}.result h2{font-size:28px}.back{display:block;width:100%;padding:13px;border:2px solid #d9dee5;border-radius:12px;background:#fff;color:#333;font-weight:700;cursor:pointer}.back:hover{background:#f1f5f3;border-color:#159447}@media(max-width:520px){.wrap{padding:18px 12px}.question{font-size:18px}}</style></head><body><main class="wrap"><div class="head"><h1>⚖️ Centre of Mass</h1><div class="xp">XP <span id="xp">0</span></div></div><div class="sub">Master centre of mass with 15 NEET-style questions.</div><section class="card master"><div class="row"><span>🎯 Skill Mastery</span><span><span id="mastery">0</span> / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qno" id="qno"></div><div class="question" id="question"></div><div class="opts" id="opts"></div><button class="btn" id="continue">Continue →</button><div class="feedback" id="feedback"></div></section><div id="result"></div><button class="back" id="back">← Back to Physics Path</button></main><script>const quiz=[['For a system of particles, the position of its centre of mass is defined using:',['Vector sum of positions weighted by masses','Arithmetic mean of velocities','Product of all masses','Sum of accelerations'],0],['For two equal masses placed at x=0 and x=4 m, the centre of mass is at:',['0 m','1 m','2 m','4 m'],2],['The centre of mass of a uniform rod lies at its:',['One end','Geometrical centre','Quarter point','Outside the rod'],1],['If all particles of a system are translated by the same vector, its centre of mass:',['Remains fixed','Translates by the same vector','Moves twice as far','Moves opposite'],1],['For an isolated system, the centre of mass moves with constant:',['Acceleration','Momentum only','Velocity','Force'],2],['The velocity of centre of mass of a system is equal to:',['Total momentum divided by total mass','Total force divided by mass squared','Sum of positions','Average acceleration only'],0],['If the net external force on a system is zero, its centre of mass:',['Must be at origin','Has zero velocity always','Moves with constant velocity','Must remain inside one particle'],2],['For a symmetric uniform lamina, the centre of mass lies at the:',['Point of symmetry','Boundary only','Highest point','Lowest point'],0],['A man walks inside a boat floating freely on water. Neglecting external horizontal force, the centre of mass of man-boat system:',['Remains fixed horizontally','Moves with the man only','Moves with the boat only','Accelerates continuously'],0],['The centre of mass of a uniform circular ring is at its:',['Circumference','Centre','Any point on diameter','Quarter point'],1],['Two masses 2 kg and 3 kg are at x=0 m and x=5 m. Their centre of mass is:',['2 m','3 m','4 m','5 m'],1],['Internal forces between particles of a system can change the motion of the centre of mass:',['Always','Never, by themselves','Only in vacuum','Only for equal masses'],1],['The centre of mass of a uniform triangular lamina is located at the intersection of its:',['Three medians','Three altitudes only','Three sides','Diagonals'],0],['When a projectile explodes in mid-air into fragments, ignoring air resistance, the centre of mass follows:',['A straight horizontal line','The same trajectory the projectile would have followed','A random path','A vertical line'],1],['The acceleration of the centre of mass is determined by:',['Net external force divided by total mass','Internal force divided by one mass','Total kinetic energy','Number of particles only'],0]];let i=0,selected=null,score=0,checked=false;const $=id=>document.getElementById(id);function render(){checked=false;selected=null;$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=quiz[i][0];$('feedback').textContent='';$('continue').textContent='Continue →';$('opts').innerHTML='';const order=quiz[i][1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{if(checked)return;selected=item.index;[...$('opts').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('opts').appendChild(b)})}function check(){if(selected===null){$('feedback').textContent='Please select an answer first.';return}checked=true;const a=quiz[i],ok=selected===a[2];if(ok){score++;$('xp').textContent=score*10}$('mastery').textContent=score;$('fill').style.width=score/15*100+'%';[...$('opts').children].forEach(b=>{const n=Number(b.dataset.index);b.disabled=true;if(n===a[2])b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=ok?'✅ Correct! +10 XP':'❌ Not quite. Review the concept and continue.';$('continue').textContent=i===14?'Finish Skill →':'Continue →'}$('continue').onclick=()=>{if(!checked){check();return}if(i<14){i++;render()}else{document.querySelector('.card').style.display='none';$('result').innerHTML=`<section class="card result"><h2>🎉 Skill Complete!</h2><p>You scored <b>${score} / 15</b></p><p>XP earned: <b>${score*10}</b></p><button class="btn" onclick="location.reload()">Retry Skill</button></section>`}};$('back').onclick=()=>{const s=sessionStorage.getItem('skillupLastPhysicsPath');if(s){try{const u=new URL(s,location.href);if(u.origin===location.origin){location.href=s;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();</script></body></html>
