solid #d9e5f2;border-radius:12px;background:#fff;color:#1264d6;text-decoration:none;font-weight:900}.result{text-align:center}.score{font-size:34px;font-weight:950;color:#123b70}@media(max-width:520px){.wrap{padding:15px 10px 50px}.q{font-size:18px}button.opt{font-size:14px;padding:13px}}</style></head><body><main class="wrap"><div class="top"><div class="brand">⚛️ SkillUp Physics<br><small>NEET 2026 • 15 MCQ QUIZ</small></div><div class="xp" id="xp">XP: 0</div></div><section class="hero"><div>🌡️ NEET PRACTICE</div><h1>Change of State</h1><p>15-question MCQ quiz. Select one answer, check instantly, and build mastery.</p></section><section class="card"><strong>🏆 Quiz Progress <span id="mastery">0 / 15</span></strong><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card" id="quiz"><div class="qno" id="qno"></div><div class="q" id="question"></div><div id="opts"></div><div class="actions"><button class="continue" id="continue" disabled>Check Answer →</button></div><div class="feedback" id="feedback"></div></section><section class="card result" id="result" hidden></section><a class="back" href="physics-home-fast.html">← 📚 Back to Physics Path</a></main><script>const questions=[
{q:'A change from solid directly to gas is called',o:['fusion','sublimation','condensation','freezing'],a:1,e:'Sublimation is the direct transition from solid to vapour without passing through the liquid state.'},
{q:'The change from gas to liquid is called',o:['vaporization','fusion','condensation','sublimation'],a:2,e:'Condensation changes a vapour or gas into a liquid.'},
{q:'The change from liquid to solid is called',o:['freezing or solidification','melting','boiling','sublimation'],a:0,e:'Freezing is the liquid-to-solid phase transition.'},
{q:'The change from solid to liquid is called',o:['fusion','condensation','deposition','vaporization'],a:0,e:'Fusion means melting, the transition from solid to liquid.'},
{q:'During a phase change of a pure substance at constant pressure, temperature generally',o:['remains constant','doubles','becomes zero','increases indefinitely'],a:0,e:'At the phase-transition temperature, supplied or released latent heat changes the phase rather than temperature in the ideal case.'},
{q:'Which process occurs at the surface of a liquid and can occur below its boiling point?',o:['boiling','evaporation','freezing','condensation only'],a:1,e:'Evaporation is a surface phenomenon and can occur at temperatures below the boiling point.'},
{q:'Boiling differs from evaporation because boiling',o:['occurs throughout the liquid at its boiling condition','occurs only at the surface','needs no heat','always occurs below room temperature'],a:0,e:'Boiling is a bulk phenomenon involving vapour formation throughout the liquid at the boiling condition.'},
{q:'In an ordinary heating curve, a horizontal portion indicates',o:['a phase change','zero energy supply','decreasing mass only','constant pressure necessarily'],a:0,e:'A plateau indicates that energy is being used for a phase change rather than raising temperature.'},
{q:'When a gas changes directly into a solid, the process is called',o:['deposition','fusion','vaporization','melting'],a:0,e:'Deposition is the direct gas-to-solid transition.'},
{q:'Which change releases latent heat to the surroundings?',o:['melting','vaporization','condensation','sublimation'],a:2,e:'Condensation releases the latent heat previously absorbed during vaporization.'},
{q:'Which change requires absorption of latent heat?',o:['freezing','condensation','vaporization','deposition'],a:2,e:'Vaporization requires energy input to separate molecules into the gas phase.'},
{q:'If a substance is heated while changing from liquid to gas at constant pressure, its temperature ideally',o:['remains constant during the transition','always falls','becomes 0 K','increases without limit'],a:0,e:'At the boiling point, added heat is latent heat of vaporization and temperature stays constant until the phase change is complete.'},
{q:'The reverse process of sublimation is',o:['deposition','fusion','evaporation','boiling'],a:0,e:'Deposition changes gas directly into solid and is the reverse of sublimation.'},
{q:'The state of matter with fixed volume but no fixed shape is',o:['solid','liquid','gas','plasma only'],a:1,e:'A liquid retains a nearly fixed volume but takes the shape of its container.'},
{q:'The state of matter with neither fixed shape nor fixed volume is',o:['solid','liquid','gas','crystal'],a:2,e:'A gas expands to fill its container, so it has neither a fixed shape nor fixed volume.'}
];let i=0,selected=null,checked=false,score=0;const $=id=>document.getElementById(id);function render(){selected=null;checked=false;$('feedback').textContent='';$('continue').disabled=true;$('continue').textContent=i===14?'Finish Quiz →':'Check Answer →';$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=questions[i].q;$('opts').innerHTML='';questions[i].o.forEach((text,n)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+n)+'. '+text;b.onclick=()=>{if(checked)return;selected=n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('continue').disabled=false};$('opts').appendChild(b)});$('mastery').textContent=`${i} / 15`;$('fill').style.width=`${i/15*100}%`;$('xp').textContent=`XP: ${score*10}`}function next(){if(selected===null)return;if(!checked){checked=true;const item=questions[i],ok=selected===item.a;if(ok)score++;document.querySelectorAll('.opt').forEach(b=>{const n=[...document.querySelectorAll('.opt')].indexOf(b);b.disabled=true;if(n===item.a)b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+`<div class="explain">${item.e}</div>`;$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=`${(i+1)/15*100}%`;$('xp').textContent=`XP: ${score*10}`}else if(i<14){i++;render()}else finish()}function finish(){$('quiz').hidden=true;$('result').hidden=false;const pct=Math.round(score/15*100);$('result').innerHTML=`<h2>🎉 Change of State Complete!</h2><div class="score">${score} / 15</div><p><strong>${pct}%</strong> accuracy</p><p>🏆 You earned <strong>${score*10} XP</strong>.</p><button class="continue" type="button" onclick="location.reload()">Retry 15 MCQs</button>`}$('continue').onclick=next;render();</script></body></html>
