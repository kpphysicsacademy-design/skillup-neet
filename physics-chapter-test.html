<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics Chapter Test</title><style>:root{--bg:#f6f8fb;--card:#fff;--text:#172033;--muted:#667085;--brand:#315efb;--ok:#087f5b;--bad:#c92a2a;--border:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:18px 14px 50px}header,.q{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}h1{margin:0 0 5px}.meta{color:var(--muted)}.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin:9px 0;border:1px solid var(--border);border-radius:10px;background:#fff;color:inherit;font:inherit;cursor:pointer}.result{margin-top:12px;padding:12px;border-radius:10px;background:#f8f9fa}.correct{color:var(--ok);font-weight:700}.wrong{color:var(--bad);font-weight:700}.btn{display:inline-block;border:0;border-radius:10px;padding:12px 16px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}.secondary{background:#e9edf5;color:var(--text)}.hidden{display:none}</style></head><body><div class="wrap"><header><h1 id="title">Physics Chapter Test</h1><div class="meta" id="meta"></div></header><div id="questions"></div><header id="score" class="hidden"></header><a class="btn secondary" href="full-physics-path.html">Back to Physics Path</a></div><script>window.SKILLUP_UNIFIED_MCQ=true;const p=new URLSearchParams(location.search),chapter=p.get('chapter')||'Physics and Measurement';document.getElementById('title').textContent=chapter;document.getElementById('meta').textContent='NEET MCQ chapter test';const host=document.getElementById('questions');const aliases={'Scalar and Vector Products':'scalar and vector products'};function script(src){return new Promise(r=>{const s=document.createElement('script');s.src=src;s.onload=()=>r(true);s.onerror=()=>r(false);document.head.appendChild(s)})}async function load(){if(chapter==='Vector Addition and Subtraction'){host.innerHTML='<section class="q"><h2>Vector Addition and Subtraction</h2><p>Verified 50-MCQ NEET bank.</p><a class="btn" href="vector-addition-and-subtraction-question-bank.html">Open 50 MCQs</a></section>';return}if(chapter==='Resolution of a Vector'){location.href='resolution-of-a-vector-question-bank.html?topic='+encodeURIComponent(chapter);return}if(chapter==='Scalar and Vector Products'){await script('scalar-and-vector-products-question-bank.js');const b=window.SkillUpMCQBanks&&window.SkillUpMCQBanks[aliases[chapter]];if(Array.isArray(b)){render(b);return}}host.innerHTML='<section class="q"><strong>MCQ bank integration pending.</strong><p>The chapter route is preserved; this chapter does not currently have a verifiable standalone MCQ bank file in the repository.</p></section>'}function render(raw){const qs=raw.map(x=>({q:x.q||x.question,o:x.o||x.options,a:Number.isInteger(x.a)?x.a:Number.isInteger(x.answer)?x.answer:0,e:x.e||x.explanation||''})).filter(x=>x.q&&Array.isArray(x.o));let score=0;host.innerHTML='';qs.forEach((x,i)=>{const el=document.createElement('section');el.className='q';el.innerHTML='<strong>Question '+(i+1)+' / '+qs.length+'</strong><p>'+x.q+'</p>'+x.o.map((o,j)=>'<button class="opt" data-j="'+j+'">'+String.fromCharCode(65+j)+'. '+o+'</button>').join('')+'<div class="result hidden"></div>';host.appendChild(el);el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{el.querySelectorAll('.opt').forEach(z=>z.disabled=true);const j=+b.dataset.j,r=el.querySelector('.result');if(j===x.a){score++;r.innerHTML='<span class="correct">Correct.</span> '+x.e}else r.innerHTML='<span class="wrong">Incorrect.</span> Correct answer: '+String.fromCharCode(65+x.a)+'. '+x.o[x.a]+' — '+x.e;r.classList.remove('hidden');if(i===qs.length-1){const s=document.getElementById('score');s.classList.remove('hidden');s.innerHTML='<strong>Score: '+score+'/'+qs.length+'</strong>'}})})}load();</script></body></html>
