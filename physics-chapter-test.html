<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics Chapter Test</title>
<style>:root{--bg:#f6f8fb;--card:#fff;--text:#172033;--muted:#667085;--brand:#315efb;--ok:#087f5b;--bad:#c92a2a;--border:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:18px 14px 50px}header,.q{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}h1{font-size:clamp(24px,6vw,36px);margin:0 0 5px}.meta{color:var(--muted)}.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin:9px 0;border:1px solid var(--border);border-radius:10px;background:#fff;color:inherit;font:inherit;cursor:pointer}.opt.selected{border-color:var(--brand)}.result{margin-top:12px;padding:12px;border-radius:10px;background:#f8f9fa}.correct{color:var(--ok);font-weight:700}.wrong{color:var(--bad);font-weight:700}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#e9edf5;color:var(--text)}.hidden{display:none}</style></head>
<body><div class="wrap"><header><h1 id="title">Physics Chapter Test</h1><div class="meta" id="meta"></div></header><div id="questions"></div><div class="actions"><button class="btn" id="submit">Submit Test</button><button class="btn secondary" onclick="location.href='full-physics-path.html'">Back to Physics Path</button></div><header id="score" class="hidden"></header></div>
<script src="central-auth.js"></script><script src="unified-mcq-router.js"></script>
<script>
const params=new URLSearchParams(location.search);const chapter=params.get('chapter')||'Physics and Measurement';
const canonical={
 'Physical World & Measurement':'Physics and Measurement','Work, Energy & Power':'Work, Energy and Power','Motion of System of Particles & Rigid Body':'System of Particles and Rotational Motion','Magnetic Effects of Current & Magnetism':'Magnetic Effects of Current and Magnetism','Electromagnetic Induction & Alternating Currents':'Electromagnetic Induction and Alternating Currents','Dual Nature of Matter & Radiation':'Dual Nature of Matter and Radiation','Atoms & Nuclei':'Atoms and Nuclei'
};
const topic=canonical[chapter]||chapter;
const directBanks={
 'Vector Addition and Subtraction':{src:'vector-addition-and-subtraction-question-bank.js',global:null},
 'Scalar and Vector Products':{src:'scalar-and-vector-products-question-bank.js',global:null},
 'Resolution of a Vector':{src:'resolution-of-a-vector-question-bank.js',global:null}
};

document.getElementById('title').textContent=chapter;document.getElementById('meta').textContent='NEET MCQ chapter test';
const host=document.getElementById('questions');
function normBank(x){if(!Array.isArray(x))return null;return x.map(q=>({q:q.q||q.question,o:q.o||q.options,a:Number.isInteger(q.a)?q.a:Number.isInteger(q.answer)?q.answer:0,e:q.e||q.explanation||''})).filter(q=>q.q&&Array.isArray(q.o)&&q.o.length>=2)}
function render(qs){
 if(!qs||!qs.length){host.innerHTML='<section class="q"><strong>MCQ bank not connected yet.</strong><p>This chapter has no registered bank in the unified route. Existing dedicated banks remain preserved.</p></section>';return;}
 qs=qs.slice(0,50);const answers=[];
 host.innerHTML='';qs.forEach((x,qi)=>{const el=document.createElement('section');el.className='q';el.innerHTML=`<strong>Question ${qi+1}</strong><p>${x.q}</p>`+x.o.map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')+'<div class="result hidden"></div>';host.appendChild(el);answers.push(null);el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{el.querySelectorAll('.opt').forEach(z=>z.classList.remove('selected'));b.classList.add('selected');answers[qi]=+b.dataset.i})});
 document.getElementById('submit').onclick=()=>{let score=0;qs.forEach((x,i)=>{const el=host.children[i],r=el.querySelector('.result');if(answers[i]===x.a){score++;r.innerHTML='<span class="correct">Correct.</span> '+x.e}else{r.innerHTML='<span class="wrong">Incorrect.</span> Correct answer: '+String.fromCharCode(65+x.a)+'. '+x.o[x.a]+' — '+x.e}r.classList.remove('hidden')});const s=document.getElementById('score');s.classList.remove('hidden');s.innerHTML=`<strong>Score: ${score}/${qs.length}</strong><div class="meta">${score===qs.length?'Excellent — complete.':'Review the explanations and retry.'}</div>`;if(window.SkillUpAuth&&SkillUpAuth.saveProgress){SkillUpAuth.saveProgress({subject:'physics',topic:chapter,answered:qs.length,correct:score,xp:score}).catch(()=>{});}window.scrollTo({top:0,behavior:'smooth'})};
}
function loadScript(src,done){const s=document.createElement('script');s.src=src;s.onload=()=>setTimeout(done,0);s.onerror=()=>done();document.head.appendChild(s)}
if(directBanks[topic]){
 const before=new Set(Object.keys(window));loadScript(directBanks[topic].src,()=>{
   const candidates=['questions','mcqs','questionBank','skillUpQuestions','skillUpPhysicsQuestions'];let found=null;
   for(const k of candidates){if(normBank(window[k])){found=normBank(window[k]);break}}
   if(!found&&window.skillUpPhysicsQuestions)found=normBank(window.skillUpPhysicsQuestions);
   if(!found&&topic==='Vector Addition and Subtraction'){
     const scriptText='';
     // The legacy vector bank renders itself; use its dedicated page for the full legacy renderer.
     host.innerHTML='<section class="q"><strong>Vector MCQ bank detected.</strong><p>Open the full 50-question NEET bank.</p><a class="btn" href="vector-addition-and-subtraction-question-bank.html">Open Vector Addition and Subtraction — 50 MCQs</a></section>';
   } else render(found);
 });
}else{
 const known={
  'Physics and Measurement':'physics-and-measurement-question-bank.js','Systems of Units':'systems-of-units-question-bank.js','Significant Figures':'significant-figures-question-bank.js','Dimensions and Dimensional Formulae':'dimensions-and-dimensional-formulae-question-bank.js','Dimensional Analysis and Applications':'dimensional-analysis-and-applications-question-bank.js'
 };
 const src=known[topic];
 if(src) loadScript(src,()=>{let found=null;for(const k of ['questions','mcqs','questionBank','skillUpQuestions','skillUpPhysicsQuestions']){const b=normBank(window[k]);if(b){found=b;break}}render(found)});else render(null);
}
</script></body></html>
