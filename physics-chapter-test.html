<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics Chapter Test</title><style>:root{--bg:#f6f8fb;--card:#fff;--text:#172033;--muted:#667085;--brand:#315efb;--ok:#087f5b;--bad:#c92a2a;--border:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:18px 14px 50px}header,.q{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}h1{margin:0 0 5px}.meta{color:var(--muted)}.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin:9px 0;border:1px solid var(--border);border-radius:10px;background:#fff;color:inherit;font:inherit;cursor:pointer}.result{margin-top:12px;padding:12px;border-radius:10px;background:#f8f9fa}.correct{color:var(--ok);font-weight:700}.wrong{color:var(--bad);font-weight:700}.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}.secondary{background:#e9edf5;color:var(--text)}.hidden{display:none}</style></head><body><div class="wrap"><header><h1 id="title">Physics Chapter Test</h1><div class="meta" id="meta"></div></header><div id="questions"></div><header id="score" class="hidden"></header><button class="btn secondary" onclick="location.href='full-physics-path.html'">Back to Physics Path</button></div><script src="central-auth.js"></script><script>
const p=new URLSearchParams(location.search),chapter=p.get('chapter')||'Physics and Measurement';document.getElementById('title').textContent=chapter;document.getElementById('meta').textContent='NEET MCQ chapter test';const host=document.getElementById('questions');
const files={'Vector Addition and Subtraction':'vector-addition-and-subtraction-question-bank.js','Scalar and Vector Products':'scalar-and-vector-products-question-bank.js','Resolution of a Vector':'resolution-of-a-vector-question-bank.js','Physics and Measurement':'physics-and-measurement-question-bank.js','Systems of Units':'systems-of-units-question-bank.js','Significant Figures':'significant-figures-question-bank.js','Dimensions and Dimensional Formulae':'dimensions-and-dimensional-formulae-question-bank.js','Dimensional Analysis and Applications':'dimensional-analysis-and-applications-question-bank.js'};
function script(src){return new Promise(r=>{const s=document.createElement('script');s.src=src;s.onload=()=>r(true);s.onerror=()=>r(false);document.head.appendChild(s)})}function getBank(){for(const k of ['questions','mcqs','questionBank','skillUpQuestions','skillUpPhysicsQuestions'])if(Array.isArray(window[k]))return window[k];return null}
async function load(){if(chapter==='Vector Addition and Subtraction'){host.innerHTML='<section class="q"><h2>Vector Addition and Subtraction</h2><p>The verified 50-MCQ bank is available in its dedicated page.</p><a class="btn" href="vector-addition-and-subtraction-question-bank.html">Open 50 MCQs</a></section>';return}if(chapter==='Scalar and Vector Products'){await script(files[chapter]);const b=getBank();if(b){render(b);return}}if(chapter==='Resolution of a Vector'){location.href='resolution-of-a-vector-question-bank.html?topic='+encodeURIComponent(chapter);return}const src=files[chapter];if(src&&await script(src)){const b=getBank();if(b){render(b);return}}host.innerHTML='<section class="q"><strong>MCQ bank not connected yet.</strong><p>This chapter remains in the path, but no compatible bank was found.</p></section>'}
function render(raw){const qs=raw.map(x=>({q:x.q||x.question,o:x.o||x.options,a:Number.isInteger(x.a)?x.a:Number.isInteger(x.answer)?x.answer:0,e:x.e||x.explanation||''})).filter(x=>x.q&&x.o).slice(0,50);if(!qs.length){host.innerHTML='<section class="q"><strong>No compatible MCQs found.</strong></section>';return}let score=0;host.innerHTML='';qs.forEach((x,i)=>{const el=document.createElement('section');el.className='q';el.innerHTML='<strong>Question '+(i+1)+' / '+qs.length+'</strong><p>'+x.q+'</p>'+x.o.map((o,j)=>'<button class="opt" data-j="'+j+'">'+String.fromCharCode(65+j)+'. '+o+'</button>').join('')+'<div class="result hidden"></div>';host.appendChild(el);el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{el.querySelectorAll('.opt').forEach(z=>z.disabled=true);const j=+b.dataset.j,r=el.querySelector('.result');if(j===x.a){score++;r.innerHTML='<span class="correct">Correct.</span> '+x.e}else r.innerHTML='<span class="wrong">Incorrect.</span> Correct answer: '+String.fromCharCode(65+x.a)+'. '+x.o[x.a]+' — '+x.e;r.classList.remove('hidden');if(i===qs.length-1){const s=document.getElementById('score');s.classList.remove('hidden');s.innerHTML='<strong>Score: '+score+'/'+qs.length+'</strong>'}})});}
load();</script></body></html>
