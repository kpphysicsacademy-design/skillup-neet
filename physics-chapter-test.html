<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics Chapter Test</title>
<style>:root{--bg:#f6f8fb;--card:#fff;--text:#172033;--muted:#667085;--brand:#315efb;--ok:#087f5b;--bad:#c92a2a;--border:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:18px 14px 50px}header,.q{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}h1{font-size:clamp(24px,6vw,36px);margin:0 0 5px}.meta{color:var(--muted)}.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin:9px 0;border:1px solid var(--border);border-radius:10px;background:#fff;color:inherit;font:inherit;cursor:pointer}.opt:hover{border-color:var(--brand)}.opt.selected{border-color:var(--brand)}.result{margin-top:12px;padding:12px;border-radius:10px;background:#f8f9fa}.correct{color:var(--ok);font-weight:700}.wrong{color:var(--bad);font-weight:700}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#e9edf5;color:var(--text)}.hidden{display:none}</style></head>
<body><div class="wrap"><header><h1 id="title">Physics Chapter Test</h1><div class="meta" id="meta"></div></header><div id="questions"></div><div class="actions"><button class="btn" id="submit">Submit Test</button><button class="btn secondary" onclick="location.href='full-physics-path.html'">Back to Physics Path</button></div><header id="score" class="hidden"></header></div>
<script>
const bank={
'Physical World & Measurement':[['A physical quantity is expressed by','numerical value and unit','unit only','dimension only','error only'],0,'A physical quantity requires both a numerical magnitude and a unit.'],
'Kinematics':[['The slope of a displacement-time graph represents','velocity','acceleration','force','momentum'],0,'Velocity is the rate of change of displacement, so it equals the slope of a displacement-time graph.'],
'Laws of Motion':[['Newton’s second law gives the relation','F = ma','F = mv','F = m/a','F = a/m'],0,'For constant mass, Newton’s second law gives force as mass multiplied by acceleration.'],
'Work, Energy & Power':[['The SI unit of work is','joule','watt','newton','pascal'],0,'Work is measured in joules in the SI system.'],
'Motion of System of Particles & Rigid Body':[['The centre of mass of a two-particle system lies on the line joining the particles at a position determined by their','masses','charges only','temperatures','velocities only'],0,'The centre of mass position is weighted by the masses of the particles.'],
'Gravitation':[['The acceleration due to gravity near Earth’s surface is approximately','9.8 m/s²','98 m/s²','0.98 m/s²','980 m/s²'],0,'Near Earth’s surface, g is approximately 9.8 m/s².'],
'Properties of Bulk Matter':[['Pressure is defined as','force per unit area','force times area','energy per unit volume','mass per unit volume'],0,'Pressure is normal force distributed over unit area.'],
'Thermodynamics':[['The first law of thermodynamics expresses conservation of','energy','momentum','charge','mass only'],0,'The first law applies conservation of energy to thermodynamic systems.'],
'Kinetic Theory':[['For an ideal gas, the average translational kinetic energy of molecules is proportional to','absolute temperature','pressure only','volume only','molar mass only'],0,'Average translational kinetic energy is proportional to absolute temperature.'],
'Oscillations':[['In simple harmonic motion, acceleration is','proportional to displacement and opposite in direction','constant','proportional to velocity','always zero'],0,'In SHM, acceleration is a = −ω²x, opposite to displacement.'],
'Waves':[['The wave speed is related to frequency and wavelength by','v = fλ','v = f/λ','v = λ/f','v = f + λ'],0,'Wave speed equals frequency multiplied by wavelength.'],
'Electrostatics':[['The SI unit of electric charge is','coulomb','volt','ohm','farad'],0,'Electric charge is measured in coulombs.'],
'Current Electricity':[['Ohm’s law for an ohmic conductor is','V = IR','V = I/R','I = VR','R = VI'],0,'For an ohmic conductor at constant physical conditions, V is proportional to I: V = IR.'],
'Magnetic Effects of Current & Magnetism':[['The SI unit of magnetic field is','tesla','weber','henry','ampere'],0,'Magnetic flux density or magnetic field B is measured in tesla.'],
'Electromagnetic Induction & Alternating Currents':[['Faraday’s law relates induced emf to the rate of change of','magnetic flux','electric charge','resistance','mass'],0,'The induced emf is proportional to the negative rate of change of magnetic flux.'],
'Electromagnetic Waves':[['Electromagnetic waves can propagate through','vacuum','only solids','only liquids','only conductors'],0,'Electromagnetic waves do not require a material medium and can travel through vacuum.'],
'Optics':[['The SI unit of focal length is','metre','dioptre','radian','candela'],0,'Focal length is a length and is measured in metres in SI.'],
'Dual Nature of Matter & Radiation':[['The de Broglie wavelength of a particle is','h/p','hp','p/h','h+p'],0,'The de Broglie relation is λ = h/p.'],
'Atoms & Nuclei':[['The nucleus of an atom contains','protons and neutrons','electrons only','protons only','neutrons only'],0,'The atomic nucleus contains positively charged protons and neutral neutrons.'],
'Electronic Devices':[['A semiconductor diode primarily allows current to flow','preferentially in one direction','equally in both directions','only in vacuum','only at zero voltage'],0,'A p-n junction diode conducts strongly in forward bias and has very small reverse current under normal conditions.'],
'Experimental Skills':[['A vernier calipers is primarily used to measure','small lengths and diameters','electric current','temperature only','mass only'],0,'Vernier calipers measures small dimensions such as internal/external diameter and depth.']
};
const params=new URLSearchParams(location.search);const chapter=params.get('chapter')||'Physical World & Measurement';const data=bank[chapter]||bank['Physical World & Measurement'];
const qs=[];for(let i=0;i<3;i++){const d=data;qs.push({q:d[0][0],opts:d[0].slice(1),ans:d[1],exp:d[2]});if(i===1){qs[i]={q:data[0][0],opts:data[0].slice(1),ans:data[1],exp:data[2]}}if(i===2){qs[i]={q:data[0][0]+' (concept check)',opts:data[0].slice(1),ans:data[1],exp:data[2]}}
}
document.getElementById('title').textContent=chapter;document.getElementById('meta').textContent='3-question chapter test';
const container=document.getElementById('questions');const answers=[];qs.forEach((x,qi)=>{const el=document.createElement('section');el.className='q';el.innerHTML=`<strong>Question ${qi+1}</strong><p>${x.q}</p>`+x.opts.map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')+'<div class="result hidden"></div>';container.appendChild(el);answers.push(null);el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{el.querySelectorAll('.opt').forEach(z=>z.classList.remove('selected'));b.classList.add('selected');answers[qi]=+b.dataset.i})});
document.getElementById('submit').onclick=()=>{let score=0;qs.forEach((x,i)=>{const el=container.children[i],r=el.querySelector('.result');if(answers[i]===x.ans){score++;r.innerHTML='<span class="correct">Correct.</span> '+x.exp}else{r.innerHTML='<span class="wrong">Incorrect.</span> Correct answer: '+String.fromCharCode(65+x.ans)+'. '+x.opts[x.ans]+' — '+x.exp}r.classList.remove('hidden')});const s=document.getElementById('score');s.classList.remove('hidden');s.innerHTML=`<strong>Score: ${score}/${qs.length}</strong><div class="meta">Review the explanations for each question before retaking the test.</div>`;window.scrollTo({top:0,behavior:'smooth'})};
</script></body></html>
