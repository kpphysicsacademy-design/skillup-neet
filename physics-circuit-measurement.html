<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SkillUp Physics | Circuit Measurement</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.opt.selected{border-color:#5146a5;background:#f4f1ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.opt:disabled{cursor:default}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🔌 Circuit Measurement</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="action">CHECK</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['An ammeter is used to measure:',['Voltage','Current','Resistance','Power'],1,'An ammeter measures electric current in a circuit.'],['A voltmeter is used to measure:',['Current','Charge only','Potential difference','Resistance only'],2,'A voltmeter measures potential difference (voltage) between two points.'],['An ammeter should be connected in:',['Parallel','Series','Either way','Across the battery only'],1,'An ammeter is connected in series so the circuit current passes through it.'],['A voltmeter should be connected in:',['Series','Parallel','Only at the switch','Only with an ammeter'],1,'A voltmeter is connected in parallel across the component whose potential difference is measured.'],['The resistance of a component is related by Ohm’s law as:',['R=VI','R=V/I','R=I/V','R=V+I'],1,'Ohm’s law gives R=V/I when the resistance is defined from voltage and current.'],['If V=12 V and I=3 A, the resistance is:',['4 Ω','9 Ω','15 Ω','36 Ω'],0,'R=V/I=12/3=4 Ω.'],['If a 6 Ω resistor carries 2 A, the potential difference is:',['3 V','8 V','12 V','18 V'],2,'V=IR=2×6=12 V.'],['The SI unit of electric current is:',['Volt','Ampere','Ohm','Watt'],1,'Electric current is measured in amperes (A).'],['The SI unit of potential difference is:',['Ampere','Ohm','Volt','Coulomb'],2,'Potential difference is measured in volts (V).'],['The SI unit of resistance is:',['Watt','Volt','Ohm','Ampere'],2,'Electrical resistance is measured in ohms (Ω).'],['A digital multimeter can commonly measure:',['Only mass','Voltage, current and resistance depending on its setting','Only temperature','Only time'],1,'A multimeter can measure electrical quantities such as voltage, current and resistance using the appropriate mode.'],['Before measuring resistance with an ohmmeter, the component should normally be:',['Connected to an active power supply','Isolated from the powered circuit','Shorted across the battery','Heated strongly'],1,'Resistance measurements should be made with the circuit powered off and the component appropriately isolated.'],['A good voltmeter has:',['Very low resistance','Very high resistance','Zero resistance','Negative resistance'],1,'A voltmeter is designed with high internal resistance to draw very little current from the circuit.'],['A good ammeter has:',['Very high resistance','Very low resistance','Infinite resistance','No terminals'],1,'An ammeter is designed with very low internal resistance so it minimally affects circuit current.'],['Why should the measurement range of an instrument be selected appropriately?',['To obtain a useful readable measurement while avoiding overload','To remove all uncertainty','To change the physical quantity','To make units unnecessary'],0,'An appropriate range gives a readable result and helps protect the instrument from excessive input.']];let i=0,score=0,answered=false,selected=-1;const $=x=>document.getElementById(x);function render(){answered=false;selected=-1;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q[1].map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('action').classList.remove('hide');$('action').textContent='CHECK'});$('xp').textContent='';$('action').classList.add('hide');$('action').disabled=false;}$('action').onclick=()=>{if(selected<0)return;if(!answered){answered=true;const q=qs[i],ok=selected===q[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===selected&&!ok)b.classList.add('wrong')});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[3];if(ok)score++;$('score').textContent=`XP ${score}`;$('fill').style.width=`${(i+1)/15*100}%`;$('action').textContent=i===14?'FINISH':'Next Question →';return;}if(i<14){i++;render()}else{$('quiz').innerHTML='';$('action').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}};render();</script></body></html>
