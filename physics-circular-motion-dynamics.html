<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Circular Motion Dynamics</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px 42px}.card{background:#fff;border-radius:22px;padding:28px;box-shadow:0 6px 20px #17203312}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.tag{font-weight:800;font-size:.9rem}.xp{font-weight:850}.bar{height:10px;background:#e8e8f1;border-radius:999px;overflow:hidden;margin:12px 0 24px}.fill{height:100%;width:0;background:#5b50c8;transition:width .25s ease}.q{font-size:1.22rem;font-weight:800;line-height:1.45;margin:20px 0}.opts{display:grid;gap:12px}.opt{width:100%;text-align:left;border:2px solid #e3e3ed;background:#fafafd;border-radius:15px;padding:14px 16px;font:inherit;cursor:pointer;transition:transform .12s,background .12s,border-color .12s,box-shadow .12s}.opt:hover{transform:translateY(-2px);border-color:#aaa4df;box-shadow:0 4px 12px #17203310}.opt:focus{outline:3px solid #c9c3ff;outline-offset:2px}.opt.selected{border-color:#5b50c8;background:#f0edff}.opt.correct{border-color:#2d9b68;background:#eaf8f1}.opt.wrong{border-color:#d45555;background:#fff0f0}.feedback{min-height:72px;margin-top:18px;padding:14px 16px;border-radius:15px;background:#f4f3fb;line-height:1.5}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:13px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer;background:#5b50c8;color:white}.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}.btn:focus{outline:3px solid #c9c3ff;outline-offset:2px}.btn:active{transform:translateY(1px)}.back{display:inline-block;margin-top:30px;color:#5146a5;font-weight:800;text-decoration:none;padding:11px 14px;border-radius:13px}.back:hover{background:#f0edff;transform:translateY(-1px)}.back:focus{outline:3px solid #c9c3ff;outline-offset:2px}.back:active{transform:translateY(1px)}.result{font-size:1.2rem;font-weight:750;line-height:1.6}
</style></head><body><main class="wrap"><section class="card"><div class="top"><div class="tag">🌀 Circular Motion Dynamics</div><div class="xp">+10 XP</div></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></section></main><script>
const qs=[
['The centripetal acceleration of a body moving in a circle of radius r with speed v is:', ['v²/r','v/r²','r/v²','vr'],0,'Centripetal acceleration is directed toward the centre and has magnitude v²/r.'],
['The centripetal force required for circular motion is:', ['mv²/r','mr/v²','mv/r²','mvr'],0,'Using F = ma with a = v²/r gives F = mv²/r.'],
['For uniform circular motion, the speed of the particle is:', ['constant','zero','continuously increasing','continuously decreasing'],0,'Uniform circular motion means constant speed, although velocity changes direction.'],
['In uniform circular motion, the instantaneous velocity is directed:', ['tangent to the circle','toward the centre','away from the centre','along the radius outward'],0,'Velocity is tangent to the path at every instant.'],
['The centripetal acceleration is directed:', ['toward the centre','tangent to the path','away from the centre','vertically upward'],0,'The acceleration responsible for changing the direction of velocity points inward.'],
['If the speed of a particle in a circle is doubled while radius remains unchanged, centripetal force becomes:', ['four times','two times','half','unchanged'],0,'F = mv²/r, so doubling v makes F four times.'],
['If the radius of circular motion is doubled at constant speed, centripetal acceleration becomes:', ['half','double','four times','unchanged'],0,'a = v²/r, so doubling r halves a.'],
['For a vehicle taking a level circular turn, the force that can provide centripetal force is mainly:', ['friction between tyres and road','weight alone','normal reaction alone','engine power alone'],0,'On a level road, static friction supplies the required horizontal centripetal force.'],
['The angular speed ω and linear speed v are related by:', ['v = rω','v = ω/r','v = r/ω','v = r²ω'],0,'For circular motion, v = rω.'],
['The centripetal force does work on a particle in uniform circular motion:', ['zero work','positive work continuously','negative work continuously','maximum work'],0,'Centripetal force is perpendicular to instantaneous displacement, so its work is zero.'],
['A 2 kg body moves at 4 m/s in a circle of radius 2 m. Its centripetal force is:', ['16 N','8 N','4 N','32 N'],0,'F = mv²/r = 2×16/2 = 16 N.'],
['A particle moves in a circle of radius 5 m at 10 m/s. Its centripetal acceleration is:', ['20 m/s²','2 m/s²','50 m/s²','25 m/s²'],0,'a = v²/r = 100/5 = 20 m/s².'],
['For a particle moving with angular speed ω, the centripetal acceleration is:', ['ω²r','ωr²','ω/r','r/ω²'],0,'Since v = rω, a = v²/r = ω²r.'],
['If no inward force acts on a body moving in a circle, it tends to move:', ['along the tangent to the circle','toward the centre','along the radius inward','in a smaller circle'],0,'By inertia, the body continues in the instantaneous tangential direction.'],
['For safe banking of a road, the banking is designed so that:', ['a component of the normal reaction can provide centripetal force','weight becomes zero','friction must always be maximum','speed becomes independent of radius'],0,'On a banked road, the normal reaction can have a horizontal component toward the centre.']
];
let i=0,selected=null,score=0;const $=id=>document.getElementById(id);
function render(){selected=null;const a=qs[i];$('fill').style.width=(i/qs.length*100)+'%';$('quiz').innerHTML='<div class="q">'+(i+1)+'. '+a[0]+'</div><div class="opts" id="opts"></div><div class="feedback" id="feedback">Choose an answer, then check it.</div><div class="actions"><button class="btn" id="check">Check</button></div>';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{selected=item.index;[...$('opts').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('opts').appendChild(b)});$('check').onclick=check}
function check(){if(selected===null){$('feedback').textContent='Please choose an answer first.';return}const a=qs[i],ok=selected===a[2];if(ok)score++;[...$('opts').children].forEach(b=>{const oi=Number(b.dataset.index);b.disabled=true;if(oi===a[2])b.classList.add('correct');if(oi===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+'<br>'+a[3];if(i<qs.length-1){$('check').textContent='Next';$('check').onclick=()=>{i++;render()}}else{$('fill').style.width='100%';const pct=Math.round(score/qs.length*100);$('quiz').innerHTML='<div class="result">🏆 Quiz complete!<br>Score: '+score+'/15 ('+pct+'%)<br>XP earned: '+(score*10)+' XP</div><div class="actions"><button class="btn" onclick="i=0;score=0;render()">Retry</button></div>';localStorage.setItem('skillupPhysicsCircularMotionDynamicsScore',String(score))}}
function rememberPath(){try{const ref=document.referrer;if(ref){const u=new URL(ref);if(u.origin===location.origin&&(/(?:physics|full-physics)[^/]*path[^/]*\.html$/i.test(u.pathname)||/\/physics-home\.html$/i.test(u.pathname)))sessionStorage.setItem('skillupLastPhysicsPath',u.href)}}catch(e){}}
rememberPath();$('back').onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();
</script></body></html>
