<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Coefficient of Restitution</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:flex-end;margin-bottom:20px}.xp{background:#fff;padding:12px 18px;border-radius:18px;box-shadow:0 5px 18px #17203314;font-weight:800}.hero{background:linear-gradient(135deg,#2563eb,#38bdf8);color:#fff;border-radius:22px;padding:26px 20px;margin-bottom:12px;box-shadow:0 8px 22px #2563eb25}.hero h1{margin:9px 0 10px;font-size:1.9rem}.hero p{margin:0}.card{background:#fff;border-radius:22px;padding:20px;margin:12px 0;box-shadow:0 6px 20px #17203312}.progress-head{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:12px;background:#e4e8f0;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;border-radius:999px;transition:width .3s}.qnum{font-size:.9rem;font-weight:800;color:#52627a;margin-bottom:12px}.question{font-size:1.28rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{width:100%;padding:14px 15px;border:2px solid #d9e0ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer}.option:hover{border-color:#2563eb;background:#f3f7ff}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;font-weight:850;cursor:pointer;background:#2db84d;color:#fff;box-shadow:0 4px 0 #21863a}.feedback{margin-top:14px;padding:13px;border-radius:14px;font-weight:700}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:8px;color:#3155a4;font-weight:800;text-decoration:none;padding:9px 12px;border-radius:12px}.back:hover{background:#edf3ff}</style></head><body><main class="wrap"><div class="top"><div class="xp">⚡ <span id="xp">0</span> XP</div></div><section class="hero"><h1>🔄 Coefficient of Restitution</h1><p>LEARN → PRACTICE → MASTER • 15 NEET-style MCQs</p></section><section class="card"><div class="progress-head"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count">Question 1 of 15</div><h2 id="question" class="question"></h2><div id="options" class="options"></div><button id="continue" class="btn">Continue →</button><div id="feedback" class="feedback"></div></section><a id="back" class="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const quiz=[['The coefficient of restitution e is defined as the ratio of:',['relative speed of separation to relative speed of approach','relative speed of approach to relative speed of separation','momentum after to momentum before','kinetic energy after to kinetic energy before'],0],['For a perfectly elastic collision, the value of e is:',['1','0','between 0 and 1 only','greater than 1 always'],0],['For a perfectly inelastic collision, the value of e is:',['0','1','2','infinite'],0],['The coefficient of restitution is:',['dimensionless','measured in m/s','measured in N','measured in joule'],0],['If two bodies approach each other with relative speed 10 m/s and e=0.5, their relative speed of separation is:',['5 m/s','20 m/s','10 m/s','2 m/s'],0],['For a one-dimensional collision, e can be written as:',['(v2−v1)/(u1−u2)','(u1−u2)/(v2−v1)','v1+v2','u1u2'],0],['If e=0.8, the relative speed of separation is:',['0.8 times the relative speed of approach','1.25 times the approach speed','equal to the approach speed','zero'],0],['For ordinary passive collisions between bodies, the coefficient of restitution generally lies:',['between 0 and 1','below 0 only','above 1 only','at exactly 2'],0],['A collision has approach speed 12 m/s and separation speed 9 m/s. Its coefficient of restitution is:',['0.75','1.33','3','0.25'],0],['If e=1, the relative speed of separation is:',['equal to relative speed of approach','zero','half the approach speed','twice the approach speed'],0],['If e=0, after collision the relative velocity of the bodies is:',['zero','maximum','unchanged','infinite'],0],['Coefficient of restitution mainly describes the:',['elasticity of a collision','mass of a body','force of gravity','duration of free fall'],0],['For a collision with coefficient of restitution 0.25 and approach speed 16 m/s, separation speed is:',['4 m/s','8 m/s','12 m/s','64 m/s'],0],['Which collision has the greatest coefficient of restitution among these?',['e=1','e=0.2','e=0.5','e=0.8'],0],['A value of e greater than 1 would imply:',['separation speed greater than approach speed, requiring energy input or an active/explosive interaction','a perfectly inelastic collision','zero relative speed','momentum is not conserved'],0]];let i=0,s=-1,score=0,checked=false;const $=x=>document.getElementById(x);function render(){let a=quiz[i];s=-1;checked=false;$('count').textContent='Question '+(i+1)+' of 15';$('question').textContent=a[0];$('options').innerHTML='';$('feedback').textContent='';$('feedback').className='feedback';$('continue').style.display='inline-block';$('continue').textContent=i===14?'Finish Skill →':'Continue →';let order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k;k--){let r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((x,j)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{s=x.index;[...$('options').children].forEach(z=>z.classList.remove('selected'));b.classList.add('selected')};$('options').appendChild(b)})}$('continue').onclick=()=>{if(!checked){if(s<0){$('feedback').className='feedback bad';$('feedback').textContent='Choose an answer first 👆';return}checked=true;let a=quiz[i],ok=s===a[2];[...$('options').children].forEach(b=>{let x=+b.dataset.index;b.disabled=true;if(x===a[2])b.classList.add('correct');if(x===s&&!ok)b.classList.add('wrong')});if(ok){score++;$('feedback').className='feedback good';$('feedback').textContent='🎯 Correct! +10 XP'}else{$('feedback').className='feedback bad';$('feedback').textContent='✗ Correct answer: '+a[1][a[2]]}$('xp').textContent=score*10;$('mastery').textContent=score+' / 15';$('fill').style.width=score/15*100+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$('question').textContent='🏆 Coefficient of Restitution Complete!';$('options').innerHTML='';$('continue').style.display='none';$('feedback').className='feedback good';$('feedback').textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};$('back').onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
