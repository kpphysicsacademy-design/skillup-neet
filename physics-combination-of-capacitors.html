const questions = [{"q":"For capacitors connected in parallel, the equivalent capacitance is…","o":["C₁+C₂+…","1/C₁+1/C₂","C₁C₂/(C₁+C₂) always","the smallest capacitance"],"a":0,"e":"In parallel, all capacitors share the same voltage and charges add, so Cₑq = ΣCᵢ."},{"q":"For capacitors connected in series, the correct relation is…","o":["Cₑq=ΣCᵢ","1/Cₑq=Σ(1/Cᵢ)","Cₑq=Σ(1/Cᵢ)","Cₑq=largest C"],"a":1,"e":"In series, reciprocal capacitances add: 1/Cₑq = 1/C₁ + 1/C₂ + … ."},{"q":"Two capacitors of 3 μF and 6 μF are connected in parallel. Their equivalent capacitance is…","o":["2 μF","3 μF","9 μF","18 μF"],"a":2,"e":"Parallel capacitances add: 3 + 6 = 9 μF."},{"q":"Two capacitors of 3 μF and 6 μF are connected in series. Their equivalent capacitance is…","o":["9 μF","2 μF","4.5 μF","3 μF"],"a":1,"e":"Cₑq = C₁C₂/(C₁+C₂) = 18/9 = 2 μF."},{"q":"Three identical capacitors, each C, are connected in series. Equivalent capacitance is…","o":["3C","C","C/3","C/9"],"a":2,"e":"For n identical capacitors in series, Cₑq = C/n."},{"q":"Three identical capacitors, each C, are connected in parallel. Equivalent capacitance is…","o":["C/3","C","2C","3C"],"a":3,"e":"For n identical capacitors in parallel, Cₑq = nC."},{"q":"A 2 μF and 4 μF capacitor are in series across 9 V. The charge on each is…","o":["12 μC","18 μC","24 μC","6 μC"],"a":0,"e":"Cₑq = 4/3 μF; Q = CₑqV = (4/3)×9 = 12 μC. Series capacitors carry equal charge."},{"q":"In a series combination, which quantity is the same for each capacitor?","o":["Potential difference","Charge magnitude","Capacitance","Stored energy always"],"a":1,"e":"The charge magnitude is the same on each capacitor in a series chain."},{"q":"In a parallel combination, which quantity is the same for each capacitor?","o":["Charge","Potential difference","Energy","Capacitance"],"a":1,"e":"Every capacitor in parallel is connected across the same two nodes, so the voltage is equal."},{"q":"Two capacitors 2 μF and 4 μF are connected in parallel across 6 V. Total charge supplied is…","o":["12 μC","24 μC","36 μC","6 μC"],"a":2,"e":"Cₑq = 2+4 = 6 μF, so Qtotal = CₑqV = 36 μC."},{"q":"Two 4 μF capacitors are in series. Their equivalent capacitance is…","o":["8 μF","4 μF","2 μF","1 μF"],"a":2,"e":"Two equal capacitors in series give Cₑq = C/2 = 2 μF."},{"q":"Two 4 μF capacitors are in parallel. Their equivalent capacitance is…","o":["2 μF","4 μF","8 μF","16 μF"],"a":2,"e":"Parallel capacitances add: 4+4 = 8 μF."},{"q":"A 2 μF capacitor and a 6 μF capacitor are in series across 16 V. Voltage across the 2 μF capacitor is…","o":["4 V","8 V","12 V","16 V"],"a":2,"e":"Cₑq = 1.5 μF, Q = 24 μC; V₂μF = Q/C = 12 V."},{"q":"A 2 μF capacitor and a 6 μF capacitor are in parallel across 10 V. Charge on the 6 μF capacitor is…","o":["20 μC","30 μC","60 μC","80 μC"],"a":2,"e":"In parallel each has 10 V, so Q = CV = 6×10 = 60 μC."},{"q":"For two capacitors C₁ and C₂ in series, equivalent capacitance is…","o":["C₁+C₂","(C₁+C₂)/(C₁C₂)","C₁C₂/(C₁+C₂)","C₁−C₂"],"a":2,"e":"Combining the reciprocal relation gives Cₑq = C₁C₂/(C₁+C₂)."},{"q":"A 3 μF capacitor is in parallel with a series pair of 3 μF and 6 μF. The total capacitance is…","o":["2 μF","3 μF","5 μF","9 μF"],"a":2,"e":"The series pair is 2 μF; in parallel with 3 μF gives 5 μF."},{"q":"A 6 μF capacitor is in series with a parallel pair of 2 μF and 4 μF. Total capacitance is…","o":["2 μF","3 μF","6 μF","12 μF"],"a":1,"e":"The parallel pair is 6 μF; two 6 μF capacitors in series give 3 μF."},{"q":"A 4 μF and 12 μF capacitor are in series across 8 V. Charge on the combination is…","o":["8 μC","16 μC","24 μC","32 μC"],"a":2,"e":"Cₑq = (4×12)/(4+12) = 3 μF, so Q = 3×8 = 24 μC."},{"q":"For a series combination, the equivalent capacitance is always…","o":["greater than the largest capacitor","equal to the sum","less than the smallest individual capacitance","equal to the largest"],"a":2,"e":"The reciprocal sum makes Cₑq smaller than the smallest capacitance in the series chain."},{"q":"For a parallel combination, equivalent capacitance is…","o":["less than the smallest capacitor","between the two values only","greater than any individual capacitance (for positive capacitors)","always zero"],"a":2,"e":"Parallel capacitances add, so the equivalent exceeds any one positive capacitor."},{"q":"Four identical capacitors of 8 μF are connected in series. Equivalent capacitance is…","o":["32 μF","8 μF","4 μF","2 μF"],"a":3,"e":"Cₑq = C/n = 8/4 = 2 μF."},{"q":"Four identical capacitors of 8 μF are connected in parallel. Equivalent capacitance is…","o":["2 μF","8 μF","16 μF","32 μF"],"a":3,"e":"Cₑq = nC = 4×8 = 32 μF."},{"q":"Two capacitors in series have equivalent capacitance 2 μF. If one is 3 μF, the other is…","o":["1 μF","2 μF","3 μF","6 μF"],"a":3,"e":"2 = (3C)/(3+C); solving gives 6+2C=3C, so C=6 μF."},{"q":"Two capacitors 2 μF and 3 μF are in parallel across 12 V. Total stored charge is…","o":["24 μC","36 μC","60 μC","72 μC"],"a":2,"e":"Cₑq = 5 μF, Qtotal = 5×12 = 60 μC."},{"q":"A 2 μF and 3 μF capacitor are in series across 10 V. The voltage across 3 μF is…","o":["4 V","5 V","6 V","8 V"],"a":0,"e":"Cₑq = 1.2 μF, Q = 12 μC; V across 3 μF = 12/3 = 4 V."},{"q":"A 5 μF capacitor is connected in parallel with a 10 μF capacitor. If the combination is connected to 4 V, total charge is…","o":["20 μC","40 μC","60 μC","80 μC"],"a":2,"e":"Cₑq = 15 μF; total charge = 15×4 = 60 μC."},{"q":"A 2 μF capacitor in series with a 2 μF capacitor is then connected in parallel with 3 μF. Equivalent capacitance is…","o":["1 μF","3 μF","4 μF","5 μF"],"a":2,"e":"The equal series pair gives 1 μF; in parallel with 3 μF gives 4 μF."},{"q":"If a capacitor is added in parallel to an existing combination, the equivalent capacitance…","o":["decreases","increases","remains unchanged always","becomes negative"],"a":1,"e":"A parallel capacitor adds its positive capacitance to the total."},{"q":"If a capacitor is added in series to an existing combination, the equivalent capacitance…","o":["increases above all components","increases by exactly C","decreases","always doubles"],"a":2,"e":"Adding a positive term to the reciprocal sum reduces the series equivalent capacitance."},{"q":"A series pair has capacitances 4 μF and 12 μF. If placed across 12 V, the voltage across 4 μF is…","o":["3 V","6 V","9 V","12 V"],"a":2,"e":"Cₑq = 3 μF, Q = 36 μC; voltage across 4 μF is Q/C = 9 V."}]
