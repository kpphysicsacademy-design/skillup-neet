<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Combination of Springs</title><style>body{font-family:Arial,sans-serif;background:#f3f7ff;margin:0;color:#1e293b}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(30,41,59,.10);border:1px solid #e2e8f0}h1{text-align:center;color:#334155}.meta{display:flex;justify-content:space-between;font-weight:700;color:#475569}.bar{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#22c55e;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;color:#172033}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe4f0;border-radius:14px;background:#fff;color:#1e293b;font-size:16px;cursor:pointer;transition:.2s}.opt:hover{background:#eef5ff;border-color:#93c5fd;transform:translateY(-1px)}.opt:focus-visible{outline:3px solid #bfdbfe;outline-offset:2px}.correct{border-color:#16a34a!important;background:#ecfdf3!important;color:#166534!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important;color:#991b1b!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s}.next,.retry{background:#4f46e5;color:#fff}.next:hover,.retry:hover{background:#4338ca}.back{background:#334155;color:#fff}.back:hover{background:#1e293b}.hide{display:none}.xp{text-align:center;font-weight:700;color:#d97706;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🔗 Combination of Springs</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['For two springs connected in parallel, the equivalent spring constant is','k_eq=k1+k2','1/k_eq=1/k1+1/k2','k_eq=k1−k2','k_eq=k1k2',0,'In parallel, both springs undergo the same displacement and their forces add, so k_eq=k1+k2.'],
['For two springs connected in series, the equivalent spring constant satisfies','k_eq=k1+k2','1/k_eq=1/k1+1/k2','k_eq=k1k2','k_eq=k1/k2',1,'In series, the same force acts through both springs and extensions add, giving 1/k_eq=1/k1+1/k2.'],
['Two identical springs, each of spring constant k, are connected in parallel. Their equivalent constant is','k/2','k','2k','4k',2,'For equal springs in parallel, k_eq=k+k=2k.'],
['Two identical springs, each of spring constant k, are connected in series. Their equivalent constant is','2k','k','k/2','k/4',2,'For equal springs in series, 1/k_eq=2/k, hence k_eq=k/2.'],
['Three identical springs, each of constant k, are connected in parallel. The equivalent constant is','k/3','k','2k','3k',3,'For n identical springs in parallel, k_eq=nk, so here k_eq=3k.'],
['Three identical springs, each of constant k, are connected in series. The equivalent constant is','3k','k','k/3','k/9',2,'For n identical springs in series, k_eq=k/n, so here k_eq=k/3.'],
['Two springs of 100 N/m and 200 N/m are connected in parallel. Their equivalent constant is','50 N/m','100 N/m','200 N/m','300 N/m',3,'Parallel constants add: k_eq=100+200=300 N/m.'],
['Two springs of 100 N/m and 200 N/m are connected in series. Their equivalent constant is','66.7 N/m','150 N/m','300 N/m','50 N/m',0,'k_eq=k1k2/(k1+k2)=100×200/300≈66.7 N/m.'],
['When springs are connected in parallel, the equivalent spring constant is generally','greater than each individual constant','less than every individual constant','always zero','equal to the smaller constant',0,'Because the individual restoring forces add, the parallel equivalent constant is greater than each positive individual constant.'],
['When springs are connected in series, the equivalent spring constant is generally','greater than both','equal to the sum','less than each individual constant','always infinite',2,'For positive spring constants in series, 1/k_eq is the sum of reciprocals, so k_eq is less than each individual constant.'],
['A spring of constant k is cut into two equal parts. The spring constant of each half is','k/2','k','2k','4k',2,'For a uniform spring, spring constant is inversely proportional to length. Halving the length doubles k.'],
['A spring of constant k is cut into three equal parts. The spring constant of each part is','k/3','k','2k','3k',3,'Since k is inversely proportional to length, one-third the length gives three times the spring constant.'],
['Two identical springs of constant k are connected in parallel and support a mass m. Their angular frequency is','√(k/m)','√(2k/m)','√(m/2k)','2√(k/m)',1,'The equivalent constant is 2k, so ω=√(k_eq/m)=√(2k/m).'],
['Two identical springs of constant k are connected in series with a mass m. Their angular frequency is','√(2k/m)','√(k/m)','√(k/2m)','2√(k/m)',2,'The equivalent constant is k/2, so ω=√(k/(2m)).'],
['A 100 N/m spring and a 100 N/m spring are connected in parallel. A force of 20 N is applied to the combination. The extension is','0.05 m','0.10 m','0.20 m','0.40 m',0,'k_eq=200 N/m, so x=F/k_eq=20/200=0.05 m.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
