<script>
(function(){
'use strict';
const questions = [{"q":"For two ideal springs connected in parallel, the equivalent spring constant is:","o":["k₁ + k₂","1/k₁ + 1/k₂","k₁k₂/(k₁+k₂)","(k₁+k₂)/(k₁k₂)"],"a":0,"e":"In parallel, both springs have the same extension and their forces add, so keq = k₁ + k₂."},{"q":"For two ideal springs connected in series, the equivalent spring constant satisfies:","o":["1/keq = 1/k₁ + 1/k₂","keq = k₁ + k₂","keq = k₁k₂","keq = k₁ − k₂"],"a":0,"e":"In series, the same force acts through each spring and their extensions add; therefore reciprocals add."},{"q":"Two springs of 2 N/m and 3 N/m are connected in parallel. Their equivalent spring constant is:","o":["5 N/m","1.2 N/m","6 N/m","0.5 N/m"],"a":0,"e":"For parallel springs, keq = 2 + 3 = 5 N/m."},{"q":"Two springs of 2 N/m and 3 N/m are connected in series. Their equivalent spring constant is:","o":["1.2 N/m","5 N/m","6 N/m","2.5 N/m"],"a":0,"e":"keq = k₁k₂/(k₁+k₂) = (2×3)/(2+3) = 1.2 N/m."},{"q":"Two identical springs, each of constant k, are connected in parallel. The equivalent constant is:","o":["2k","k/2","k","4k"],"a":0,"e":"Parallel spring constants add: keq = k + k = 2k."},{"q":"Two identical springs, each of constant k, are connected in series. The equivalent constant is:","o":["k/2","2k","k","4k"],"a":0,"e":"1/keq = 1/k + 1/k = 2/k, so keq = k/2."},{"q":"Compared with each individual spring, a series combination has an equivalent spring constant that is:","o":["Smaller than the smallest individual constant","Greater than the largest individual constant","Always equal to the larger constant","Always zero"],"a":0,"e":"For positive spring constants, reciprocal addition makes the series equivalent softer than either spring."},{"q":"Compared with each individual spring, a parallel combination has an equivalent spring constant that is:","o":["Greater than either individual constant","Smaller than the smallest individual constant","Always zero","Equal to the smaller constant"],"a":0,"e":"Parallel spring constants add, making the combination stiffer than either individual spring."},{"q":"For springs connected in parallel and displaced together, each spring has the same:","o":["Extension","Force for all spring constants","Spring constant","Stored energy for all spring constants"],"a":0,"e":"The connected ends move together, so each spring experiences the same displacement."},{"q":"For ideal springs connected in series under a static load, each spring experiences the same magnitude of:","o":["Force","Extension in every case","Spring constant","Potential energy in every case"],"a":0,"e":"The force transmitted through springs in series is the same; the extensions can differ."},{"q":"Two springs with k₁ = 4 N/m and k₂ = 4 N/m are in parallel. keq is:","o":["8 N/m","2 N/m","4 N/m","16 N/m"],"a":0,"e":"keq = 4 + 4 = 8 N/m."},{"q":"Two springs with k₁ = 4 N/m and k₂ = 4 N/m are in series. keq is:","o":["2 N/m","8 N/m","4 N/m","16 N/m"],"a":0,"e":"For identical springs in series, keq = k/2 = 2 N/m."},{"q":"A 12 N/m spring is connected in series with a 4 N/m spring. The equivalent constant is:","o":["3 N/m","16 N/m","8 N/m","48 N/m"],"a":0,"e":"keq = (12×4)/(12+4) = 48/16 = 3 N/m."},{"q":"A 12 N/m spring is connected in parallel with a 4 N/m spring. The equivalent constant is:","o":["16 N/m","3 N/m","48 N/m","8 N/m"],"a":0,"e":"keq = 12 + 4 = 16 N/m."},{"q":"Three springs of constants k, 2k, and 3k are in parallel. The equivalent constant is:","o":["6k","k","(11/6)k","k/6"],"a":0,"e":"For parallel springs, keq = k + 2k + 3k = 6k."},{"q":"Three identical springs of constant k are connected in series. Their equivalent constant is:","o":["k/3","3k","k","k/9"],"a":0,"e":"For n identical springs in series, keq = k/n; with n = 3, keq = k/3."},{"q":"Three identical springs of constant k are connected in parallel. Their equivalent constant is:","o":["3k","k/3","k","9k"],"a":0,"e":"For n identical parallel springs, keq = nk = 3k."},{"q":"A spring combination has keq = 10 N/m and is stretched by 0.2 m. The magnitude of the restoring force is:","o":["2 N","0.5 N","10.2 N","50 N"],"a":0,"e":"Hooke's law gives |F| = keq x = 10 × 0.2 = 2 N."},{"q":"A mass m oscillates on an equivalent spring constant keq. Its period is:","o":["2π√(m/keq)","2π√(keq/m)","√(m keq)","2πm/keq"],"a":0,"e":"The equivalent spring behaves like a single spring, so T = 2π√(m/keq)."},{"q":"Two identical springs of constant k are in parallel and support mass m. The oscillation period is:","o":["2π√(m/(2k))","2π√(2m/k)","2π√(m/k)","π√(m/k)"],"a":0,"e":"The parallel equivalent is 2k, so T = 2π√(m/(2k))."},{"q":"Two identical springs of constant k are in series and support mass m. The oscillation period is:","o":["2π√(2m/k)","2π√(m/(2k))","2π√(m/k)","π√(m/k)"],"a":0,"e":"The series equivalent is k/2, so T = 2π√(m/(k/2)) = 2π√(2m/k)."},{"q":"For a series pair with k₁ = 6 N/m and k₂ = 3 N/m, keq is:","o":["2 N/m","9 N/m","3 N/m","18 N/m"],"a":0,"e":"keq = (6×3)/(6+3) = 18/9 = 2 N/m."},{"q":"For a parallel pair with k₁ = 6 N/m and k₂ = 3 N/m, keq is:","o":["9 N/m","2 N/m","18 N/m","3 N/m"],"a":0,"e":"keq = 6 + 3 = 9 N/m."},{"q":"For two springs in series, the total extension is:","o":["The sum of the individual extensions","The same as the extension of each spring in every case","Always zero","The difference of the individual extensions"],"a":0,"e":"The end-to-end extension equals x₁ + x₂."},{"q":"For two springs in parallel, the total restoring force magnitude at common extension x is:","o":["(k₁ + k₂)x","(k₁k₂)x","(k₁ + k₂)/x","x/(k₁ + k₂)"],"a":0,"e":"The spring forces add: Ftotal = k₁x + k₂x = (k₁+k₂)x."},{"q":"Two springs in series have constants 8 N/m and 8 N/m. If the same force stretches each, their individual extensions are:","o":["Equal","In a 2:1 ratio","In an 8:1 ratio","Always zero"],"a":0,"e":"For equal spring constants under the same force, x = F/k is equal for both."},{"q":"A parallel combination contains springs of constants 5 N/m and 7 N/m. If each extends 0.1 m, the total restoring force magnitude is:","o":["1.2 N","0.6 N","0.7 N","12 N"],"a":0,"e":"Ftotal = (5+7) × 0.1 = 1.2 N."},{"q":"A series combination has equivalent constant 2 N/m. A force of 6 N causes total extension:","o":["3 m","12 m","0.33 m","8 m"],"a":0,"e":"For the equivalent spring, x = F/keq = 6/2 = 3 m."},{"q":"If both spring constants in a two-spring parallel combination are doubled, its equivalent constant:","o":["Doubles","Halves","Becomes four times larger","Remains unchanged"],"a":0,"e":"keq = k₁ + k₂; doubling both terms doubles their sum."},{"q":"A 6 N/m and 3 N/m spring pair is connected in parallel, then that equivalent combination is connected in series with a 6 N/m spring. The final equivalent constant is:","o":["3.6 N/m","15 N/m","1.5 N/m","9 N/m"],"a":0,"e":"First parallel: 6 + 3 = 9 N/m. Then series with 6: keq = (9×6)/(9+6) = 54/15 = 3.6 N/m."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Combination of Springs Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
