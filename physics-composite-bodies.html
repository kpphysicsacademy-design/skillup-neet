<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Composite Bodies</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-size:1.6rem;font-weight:900}.subtitle{color:#5f6b7a;margin:0 0 18px}.xp,.card{background:#fff;border-radius:20px;box-shadow:0 6px 20px #17203312}.xp{padding:10px 15px;font-weight:850}.card{padding:20px;margin:12px 0}.ph{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:11px;background:#dfe8f1;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.25s}.qnum{font-weight:800;color:#35516f;margin-bottom:11px}.question{font-size:1.27rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#58cc02;background:#f7fff1;transform:translateY(-1px)}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;background:#2db84d;color:#fff;font-weight:850;cursor:pointer;box-shadow:0 4px 0 #21863a;transition:.12s}.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #21863a}.feedback{margin-top:14px;padding:12px;border-radius:13px;font-weight:700;min-height:18px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:10px;padding:10px 13px;border:2px solid #d9d4f5;border-radius:13px;color:#5146a5;font-weight:800;text-decoration:none;transition:.12s}.back:hover{background:#f0edff;transform:translateX(-2px)}@media(max-width:600px){.wrap{padding:20px 14px}.title{font-size:1.4rem}.question{font-size:1.12rem}}</style></head><body><main class="wrap"><div class="top"><div class="title">🧩 Composite Bodies</div><div class="xp">⚡ <span id="xp">0</span> XP</div></div><p class="subtitle">Physics • NEET 2026 · Learn → Practice → Master</p><section class="card"><div class="ph"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><button class="btn" id="continue">Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const quiz=[['The centre of mass of a composite body is found by treating its parts as:', ['separate masses and taking their mass-weighted average positions','equal masses regardless of their masses','only the largest part','only the outer boundary'],0,'A composite body can be divided into parts and its CM found from their mass-weighted positions.'],['For two component bodies of masses m₁ and m₂ at x₁ and x₂, the CM coordinate is:', ['(m₁x₁+m₂x₂)/(m₁+m₂)','(x₁+x₂)/(m₁+m₂)','m₁x₁+m₂x₂','(m₁+m₂)/(x₁+x₂)'],0,'The centre of mass is the mass-weighted average of the component positions.'],['If two composite parts have equal masses, the centre of mass lies:', ['at the midpoint of their centres of mass','always at the origin','at the heavier part','outside the system'],0,'Equal masses give equal weighting, so the CM is midway between their individual CMs.'],['A symmetric composite body with uniform density has its centre of mass:', ['on the symmetry axis or at the symmetry centre as appropriate','always at an edge','always outside the body','at a random point'],0,'Symmetry constrains the CM to the symmetry location.'],['A composite plate is made by joining two equal-area uniform pieces of the same material. Their masses are:', ['equal','always unequal','zero','proportional to their perimeter only'],0,'Same material and equal area give equal mass.'],['A uniform disc has a smaller circular portion removed symmetrically about a diameter. The CM of the remaining body lies:', ['on that symmetry axis','necessarily at the removed circle','outside the plate','at any arbitrary point'],0,'The remaining shape retains the relevant symmetry, constraining its CM to the axis.'],['When using the negative-mass method for a body with a hole, the removed portion is represented by:', ['negative mass at its own centre of mass','positive mass at the origin','zero mass at the edge','negative volume with positive mass'],0,'A removed region can be treated algebraically as a negative mass located at its original CM.'],['A composite body consists of masses 2 kg at x=0 m and 6 kg at x=4 m. Its centre of mass is:', ['3 m','2 m','4 m','1 m'],0,'x_CM=(2×0+6×4)/(2+6)=3 m.'],['If a small heavy component is added to a composite body, the centre of mass shifts toward:', ['the added heavy component','the opposite side always','the original geometric centre','the origin necessarily'],0,'Adding mass pulls the mass-weighted average toward that mass.'],['For a composite body made of uniform parts, the CM of each part should be taken at:', ['the individual part’s own centre of mass','the outermost corner always','the total body’s centre only','the nearest boundary'],0,'Each component contributes according to its own mass and CM position.'],['A T-shaped uniform lamina is best analysed by:', ['dividing it into simple shapes and combining their CMs','assuming the CM is at the corner','using only its total area','ignoring one of the arms'],0,'Composite laminae are conveniently decomposed into rectangles or other simple shapes.'],['For thin uniform plates of the same material, mass is proportional to:', ['area','perimeter only','thickness squared only','distance from the origin'],0,'With constant density and thickness, mass is proportional to area.'],['If a composite system is translated rigidly by a vector d, its centre of mass:', ['also translates by d','remains fixed','moves by 2d','moves opposite to d'],0,'A rigid translation moves every point, including the CM, by the same vector.'],['A composite body has total mass M and component masses mᵢ. The vector position of its CM is:', ['Σmᵢrᵢ/M','Σrᵢ/M','MΣrᵢ','Σmᵢrᵢ'],0,'The vector CM formula is r_CM = Σmᵢrᵢ / M.'],['For a composite body in a uniform gravitational field, its total weight acts effectively through:', ['the centre of mass','the geometric boundary','the lightest component','an arbitrary point'],0,'In a uniform gravitational field, the resultant weight acts through the centre of mass.']];let i=0,selected=-1,checked=false,score=0;const $=id=>document.getElementById(id),o=$("options"),b=$("continue"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;$("count").textContent='Question '+(i+1)+' of 15';$("question").textContent=a[0];o.innerHTML='';f.className='feedback';f.textContent='';b.style.display='inline-block';b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const el=document.createElement('button');el.className='option';el.textContent=String.fromCharCode(65+j)+'. '+item.text;el.dataset.index=item.index;el.onclick=()=>{selected=item.index;[...o.children].forEach(z=>z.classList.remove('selected'));el.classList.add('selected')};o.appendChild(el)})}b.onclick=()=>{if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(el=>{const n=Number(el.dataset.index);el.disabled=true;if(n===a[2])el.classList.add('correct');if(n===selected&&!ok)el.classList.add('wrong')});if(ok)score++;f.className=ok?'feedback good':'feedback bad';f.textContent=(ok?'🎯 Correct! +10 XP — ':'✗ Review — Correct answer: '+a[1][a[2]]+'. ')+a[3];$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$("question").textContent='🏆 Composite Bodies Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
