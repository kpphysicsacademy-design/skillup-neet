<script>
const data={
'physics-and-measurement':{title:'Physics and Measurement',icon:'📏',intro:'Physics describes nature using measurable physical quantities, standard units, precision, errors and dimensions.',points:[
['Units of Measurement','A unit is an agreed standard used to measure a physical quantity. A numerical value together with its unit gives a complete measurement.'],
['System of Units and SI Units','The SI system is the internationally accepted system of units. Its seven base units provide the foundation for scientific measurement.'],
['Fundamental and Derived Units','Fundamental units are independent base units. Derived units are obtained by combining base units, such as m/s for velocity and kg·m/s² for force.'],
['Least Count','Least count is the smallest value that an instrument can reliably measure. Smaller least count generally means finer measurement.'],
['Significant Figures','Significant figures are the meaningful digits in a measured value and indicate its precision. For example, 12.30 has four significant figures.'],
['Errors in Measurements','Error is the difference between a measured value and the true or accepted value. Errors may be systematic, random or gross. Percentage error = (absolute error/value) × 100.'],
['Dimensions of Physical Quantities','Dimensions express a quantity in terms of fundamental quantities such as mass, length and time. Velocity is [LT⁻¹] and force is [MLT⁻²].'],
['Dimensional Analysis and Applications','Dimensions can test equations, derive relationships and convert units. In s = ut + ½at², every term has dimensions of length.']],example:'Use units and dimensions at every stage of numerical work. A physically correct equation must be dimensionally homogeneous.'},
'kinematics':{title:'Kinematics',icon:'🏃',intro:'Kinematics describes motion without discussing the forces that cause it.',points:[['Frame of Reference','Position and motion are described relative to a chosen reference frame.'],['Motion in a Straight Line','One-dimensional motion is described using position, displacement, velocity and acceleration.'],['Graphs of Motion','Slope of a position-time graph gives velocity; slope of a velocity-time graph gives acceleration.'],['Uniformly Accelerated Motion','For constant acceleration, v = u + at, s = ut + ½at² and v² = u² + 2as.'],['Scalars and Vectors','Scalars have magnitude only; vectors have both magnitude and direction.'],['Projectile Motion','A projectile has independent horizontal and vertical motions under gravity.'],['Relative Velocity','Relative velocity describes how fast one object appears to move with respect to another.'],['Uniform Circular Motion','An object moving at constant speed around a circle has centripetal acceleration toward the centre.']],example:'For a body starting from rest with constant acceleration a, its displacement after time t is s = ½at².',formula:'v = u + at\ns = ut + ½at²\nv² = u² + 2as'},
'laws-of-motion':{title:'Laws of Motion',icon:'⚖️',intro:'Newtonian mechanics relates forces to changes in motion and explains momentum, friction and equilibrium.',points:[['Force and Inertia','Force can change the state of motion. Inertia is the tendency of a body to resist changes in its state.'],['Newton’s Laws','The first law defines inertia, the second gives F = ma, and the third states that interaction forces occur in equal and opposite pairs.'],['Momentum and Impulse','Momentum is p = mv. Impulse equals the change in momentum and is useful for collisions.'],['Conservation of Linear Momentum','For an isolated system, total linear momentum remains constant.'],['Friction','Static friction prevents relative motion up to a limiting value; kinetic friction acts during sliding.'],['Equilibrium','A body is in translational equilibrium when the vector sum of external forces is zero.'],['Centripetal Force','Circular motion requires a net inward force directed toward the centre.'],['Banking of Roads','Banking helps provide the required centripetal force for vehicles on curved roads.']],example:'Always draw a free-body diagram before applying Newton’s second law.',formula:'F = ma\np = mv\nImpulse = Δp'},
'work-energy-and-power':{title:'Work, Energy, and Power',icon:'🔋',intro:'This topic connects force and displacement with energy transfer and the rate of doing work.',points:[['Work Done by a Force','For a constant force, work is W = Fs cosθ. Work is positive, negative or zero depending on the angle.'],['Kinetic Energy','Kinetic energy is the energy of motion: K = ½mv².'],['Potential Energy','Potential energy is stored due to position or configuration. Near Earth, gravitational potential energy is mgh.'],['Work-Energy Theorem','Net work done on a particle equals its change in kinetic energy.'],['Power','Power is the rate at which work is done: P = W/t. Instantaneous power is F·v.'],['Conservation of Mechanical Energy','When only conservative forces do work, kinetic plus potential energy remains constant.'],['Springs','An ideal spring stores elastic potential energy ½kx².'],['Collisions','Momentum is conserved in an isolated collision; kinetic energy is conserved only in an elastic collision.']],example:'A force parallel to displacement does maximum positive work; a perpendicular force does zero work.',formula:'W = Fs cosθ\nK = ½mv²\nP = W/t'},
'rotational-motion':{title:'Rotational Motion',icon:'🔄',intro:'Rotational motion describes bodies turning about an axis using angular variables, torque and rotational inertia.',points:[['Angular Variables','Angular displacement, angular velocity and angular acceleration describe rotational motion.'],['Torque','Torque is the turning effect of a force: τ = r × F.'],['Angular Momentum','For a particle L = r × p; for a rigid body rotating about a fixed axis, L = Iω.'],['Moment of Inertia','Moment of inertia measures resistance to angular acceleration and depends on mass distribution.'],['Radius of Gyration','The radius of gyration k is defined by I = Mk².'],['Parallel and Perpendicular Axis Theorems','These theorems relate moments of inertia about different axes.'],['Rigid Body Equilibrium','A rigid body is in equilibrium when both net force and net torque are zero.'],['Rotational Dynamics','The rotational analogue of F = ma is τ = Iα.']],example:'A skater pulling in their arms reduces moment of inertia and increases angular speed when angular momentum is conserved.',formula:'τ = Iα\nL = Iω\nKrot = ½Iω²'},
'gravitation':{title:'Gravitation',icon:'🪐',intro:'Gravitation describes the universal attraction between masses and the motion of planets and satellites.',points:[['Universal Law of Gravitation','Every two masses attract each other with force proportional to their masses and inversely proportional to the square of separation.'],['Acceleration Due to Gravity','Near a spherical Earth, g = GM/R² at the surface.'],['Variation of g','The value of g changes with altitude and depth and is approximately zero at the Earth’s centre.'],['Kepler’s Laws','Planetary motion follows laws describing elliptical orbits, equal areas in equal times and the relation T² ∝ a³.'],['Gravitational Potential Energy','For two masses, U = −GMm/r when zero energy is chosen at infinity.'],['Escape Velocity','It is the minimum speed required to escape a celestial body without further propulsion.'],['Orbital Velocity','A satellite in a circular orbit has speed determined by the planet’s mass and orbital radius.'],['Satellite Energy','The total mechanical energy of a bound circular satellite is negative.']],example:'A satellite remains in orbit because gravity supplies the required centripetal acceleration.',formula:'F = GMm/r²\nvₑ = √(2GM/R)\nvₒ = √(GM/r)'},
'properties-of-solids-and-liquids':{title:'Properties of Solids and Liquids',icon:'💧',intro:'This unit covers elasticity, fluid pressure and flow, viscosity, surface tension and thermal properties of matter.',points:[['Elasticity','Elasticity is the ability of a material to regain its original shape after deforming forces are removed.'],['Stress and Strain','Stress is force per unit area; strain is the corresponding fractional deformation.'],['Elastic Moduli','Young’s, bulk and rigidity moduli quantify resistance to different types of deformation.'],['Fluid Pressure','Pressure in a fluid at rest increases with depth: P = P₀ + ρgh.'],['Pascal’s Law','An applied pressure to an enclosed fluid is transmitted undiminished throughout the fluid.'],['Viscosity','Viscosity measures internal resistance to fluid flow. Stokes’ law gives drag on a small sphere at low speed.'],['Bernoulli’s Principle','For steady ideal flow, pressure, kinetic and potential energy per unit volume remain related along a streamline.'],['Surface Tension and Capillarity','Surface tension arises from molecular forces at a liquid surface and can produce capillary rise.'],['Heat and Temperature','Temperature measures thermal state, while heat is energy transferred because of a temperature difference.'],['Calorimetry and Heat Transfer','Calorimetry uses heat balance; heat is transferred by conduction, convection and radiation.']],example:'In a narrow capillary tube, surface tension can pull a liquid upward against gravity.',formula:'P = P₀ + ρgh\nY = stress/strain\nQ = mcΔT'},
'thermodynamics':{title:'Thermodynamics',icon:'🌡️',intro:'Thermodynamics studies heat, work, temperature and internal energy through macroscopic laws.',points:[['Thermal Equilibrium','Two systems are in thermal equilibrium when there is no net heat flow between them.'],['Zeroth Law','If A is in thermal equilibrium with B and B with C, then A is in thermal equilibrium with C.'],['First Law','Energy is conserved: heat supplied changes internal energy and/or does work.'],['Internal Energy','Internal energy is the total microscopic energy associated with a system’s state.'],['Thermodynamic Processes','Isothermal, adiabatic, isobaric and isochoric processes keep different variables fixed.'],['Work Done by a Gas','For expansion, work is represented by the area under the P-V curve.'],['Second Law','Natural processes have a preferred direction and heat cannot be completely converted into work in a cyclic heat engine.'],['Heat Engines and Refrigerators','A heat engine converts part of supplied heat into work; a refrigerator transfers heat from cold to hot using work.']],example:'For an ideal gas in an isothermal expansion, internal energy remains constant while the gas does work.',formula:'ΔQ = ΔU + ΔW'},
'kinetic-theory':{title:'Kinetic Theory of Gases',icon:'💨',intro:'Kinetic theory connects microscopic molecular motion with macroscopic pressure and temperature.',points:[['Molecular Model','An ideal gas consists of a very large number of molecules in random motion with negligible intermolecular forces except during collisions.'],['Gas Pressure','Pressure arises from molecular impacts on container walls.'],['Temperature and Kinetic Energy','Absolute temperature is proportional to average translational kinetic energy per molecule.'],['Degrees of Freedom','Degrees of freedom describe independent ways in which a molecule can store energy.'],['Equipartition of Energy','In thermal equilibrium, energy is distributed among active quadratic degrees of freedom.'],['Mean Free Path','Mean free path is the average distance travelled between successive molecular collisions.'],['Ideal Gas Equation','The macroscopic state is related by PV = nRT.'],['Specific Heats','The values of molar specific heats depend on molecular degrees of freedom.']],example:'Heating an ideal gas raises the average kinetic energy of its molecules and therefore its temperature.',formula:'PV = nRT\nAverage K.E. per molecule = 3kT/2'},
'oscillations-and-waves':{title:'Oscillations and Waves',icon:'〰️',intro:'Periodic motion and wave propagation describe systems that repeat in time and transfer energy through space.',points:[['Simple Harmonic Motion','In SHM, restoring acceleration is proportional to displacement and directed toward equilibrium.'],['Amplitude and Period','Amplitude is maximum displacement; period is time for one complete oscillation.'],['Spring-Mass System','For an ideal spring-mass oscillator, T = 2π√(m/k).'],['Simple Pendulum','For small angular oscillations, T = 2π√(l/g).'],['Wave Motion','A wave transfers energy and information without requiring bulk transport of matter.'],['Wave Parameters','Wavelength, frequency, speed and amplitude characterize a wave.'],['Superposition','When waves overlap, the resultant displacement is the algebraic sum of individual displacements.'],['Standing Waves','Interference of opposite travelling waves can create nodes and antinodes.']],example:'In a transverse wave, particles oscillate perpendicular to the direction in which the wave travels.',formula:'x = A sin(ωt + φ)\nv = fλ'},
'electrostatics':{title:'Electrostatics',icon:'⚡',intro:'Electrostatics studies electric charges at rest, electric fields, potential, capacitance and stored energy.',points:[['Electric Charge','Charge is a conserved physical quantity that occurs in positive and negative forms.'],['Coulomb’s Law','The electrostatic force between point charges varies as q₁q₂/r².'],['Electric Field','Electric field is force per unit positive test charge: E = F/q.'],['Electric Flux and Gauss’s Law','Electric flux measures field passing through a surface; Gauss’s law relates total flux to enclosed charge.'],['Electric Potential','Potential is potential energy per unit charge.'],['Potential Energy','For two point charges, electrostatic potential energy is proportional to q₁q₂/r.'],['Capacitance','Capacitance is charge stored per unit potential difference: C = Q/V.'],['Energy in a Capacitor','A charged capacitor stores electrostatic energy equal to ½CV².']],example:'For a parallel-plate capacitor, increasing plate area increases capacitance while increasing separation decreases it.',formula:'F = kq₁q₂/r²\nE = F/q\nU = ½CV²'},
'current-electricity':{title:'Current Electricity',icon:'🔌',intro:'Current electricity explains charge flow, resistance, circuits, electrical power and measuring instruments.',points:[['Electric Current','Current is the rate of flow of electric charge: I = Q/t.'],['Drift of Electrons','In a conductor, an applied electric field gives charge carriers a small average drift velocity.'],['Ohm’s Law','For an ohmic conductor under fixed physical conditions, V is proportional to I.'],['Resistance and Resistivity','Resistance depends on geometry and material: R = ρL/A.'],['Series and Parallel','Series elements carry the same current; parallel branches have the same potential difference.'],['Kirchhoff’s Rules','Junction and loop rules provide systematic equations for complex circuits.'],['Electrical Power','Power supplied or consumed is P = VI = I²R = V²/R.'],['Cells and Internal Resistance','A real cell has internal resistance, so terminal voltage differs from its emf when current flows.']],example:'For resistors in series, equivalent resistance is the sum of individual resistances.',formula:'V = IR\nR = ρL/A\nP = VI'},
'magnetic-effects-of-current':{title:'Magnetic Effects of Current',icon:'🧲',intro:'Moving charges and currents produce magnetic fields and experience magnetic forces.',points:[['Magnetic Field','A magnetic field describes the force environment produced by magnets and moving charges.'],['Biot-Savart Law','It relates the magnetic field contribution of a current element to current, distance and orientation.'],['Ampere’s Law','For suitable symmetric situations, the circulation of magnetic field is related to enclosed current.'],['Force on a Current','A current-carrying conductor in a magnetic field experiences F = I L × B.'],['Lorentz Force','A charged particle moving in electric and magnetic fields experiences q(E + v × B).'],['Motion in a Magnetic Field','A charged particle moving perpendicular to a uniform B follows circular motion.'],['Current Loop and Magnetic Moment','A current loop behaves like a magnetic dipole with magnetic moment IA.'],['Galvanometer','A moving-coil galvanometer detects small currents and can be converted into an ammeter or voltmeter.']],example:'A charged particle entering a uniform magnetic field perpendicular to the field follows a circular path.',formula:'F = qvB sinθ\nF = ILB sinθ'},
'electromagnetic-induction-and-alternating-current':{title:'Electromagnetic Induction and Alternating Current',icon:'🔄',intro:'Changing magnetic flux produces emf, while alternating current varies periodically with time.',points:[['Magnetic Flux','Flux through a surface is Φ = BA cosθ for a uniform magnetic field.'],['Faraday’s Law','Induced emf equals the negative rate of change of magnetic flux.'],['Lenz’s Law','The induced current opposes the change in magnetic flux that produces it.'],['Motional EMF','A conductor moving through a magnetic field can develop an emf due to magnetic forces on charges.'],['Self and Mutual Induction','Changing current can induce emf in the same coil or a nearby coupled coil.'],['Alternating Current','AC voltage and current vary sinusoidally and are commonly described using RMS values.'],['AC Circuits','Resistors, inductors and capacitors have different phase relationships and reactances.'],['Transformer','A transformer transfers AC energy between coils using mutual induction and can step voltage up or down.']],example:'A generator converts mechanical energy into electrical energy using electromagnetic induction.',formula:'ε = −dΦ/dt\nXₗ = ωL\nXc = 1/(ωC)'},
'electromagnetic-waves':{title:'Electromagnetic Waves',icon:'📡',intro:'Electromagnetic waves are self-propagating oscillations of electric and magnetic fields.',points:[['Nature of EM Waves','Electric and magnetic fields oscillate perpendicular to each other and to the direction of propagation.'],['Speed of Light','In vacuum, electromagnetic waves travel at c ≈ 3 × 10⁸ m/s.'],['No Material Medium','Electromagnetic waves can propagate through vacuum.'],['Spectrum','Radio waves, microwaves, infrared, visible, ultraviolet, X-rays and gamma rays form the electromagnetic spectrum.'],['Energy and Momentum','Electromagnetic radiation carries energy and momentum and can exert radiation pressure.'],['Polarization','Polarization is evidence of the transverse nature of electromagnetic waves.'],['Communication','Different frequency bands are used for communication, sensing and imaging.'],['Photon Connection','Electromagnetic radiation also has quantum behavior with photon energy E = hf.']],example:'Visible light is only a small portion of the electromagnetic spectrum.',formula:'c = fλ\nE = hf'},
'optics':{title:'Optics',icon:'🔭',intro:'Optics studies reflection, refraction, image formation, optical instruments and wave phenomena of light.',points:[['Reflection','The angle of incidence equals the angle of reflection for a plane reflecting surface.'],['Refraction','Light changes direction when it enters a medium with a different refractive index.'],['Lens Formula','For a thin lens, object distance, image distance and focal length are related by the lens equation.'],['Magnification','Magnification compares image size with object size and depends on image and object distances.'],['Total Internal Reflection','When light travels from denser to rarer medium beyond the critical angle, it can be totally internally reflected.'],['Optical Instruments','Microscopes and telescopes use combinations of lenses or mirrors to produce magnified images.'],['Wave Optics','Interference, diffraction and polarization reveal the wave nature of light.'],['Young’s Double Slit Experiment','Coherent sources produce alternate bright and dark fringes due to interference.']],example:'Optical fibres guide light mainly through repeated total internal reflection.',formula:'1/f = 1/v − 1/u\nβ = λD/d'},
'dual-nature-of-matter-and-radiation':{title:'Dual Nature of Matter and Radiation',icon:'🌊',intro:'Light and matter exhibit both wave-like and particle-like behavior.',points:[['Photoelectric Effect','Electrons are emitted from a material when incident light has sufficient frequency.'],['Photon Energy','Light energy is quantized in packets called photons with E = hf.'],['Work Function','The work function is the minimum energy needed to remove an electron from a surface.'],['Einstein’s Photoelectric Equation','Maximum photoelectron kinetic energy equals photon energy minus work function.'],['Matter Waves','Particles have associated de Broglie wavelengths: λ = h/p.'],['Wave-Particle Duality','The observed behavior depends on the experiment and demonstrates quantum duality.'],['Electron Diffraction','Diffraction of electrons provides evidence for their wave nature.'],['Threshold Frequency','Photoelectric emission requires incident frequency above a material-specific threshold.']],example:'Increasing light intensity above threshold mainly increases photoelectric current, while frequency changes the maximum electron energy.',formula:'Kmax = hf − φ\nλ = h/p'},
'atoms-and-nuclei':{title:'Atoms and Nuclei',icon:'⚛️',intro:'This topic covers atomic models, quantized energy levels, nuclear structure, radioactivity and nuclear energy.',points:[['Rutherford Model','The atom has a tiny dense positive nucleus with electrons occupying the surrounding region.'],['Bohr Model','Electrons in hydrogen occupy quantized stationary orbits and emit or absorb photons during transitions.'],['Atomic Spectra','Spectral lines arise from transitions between discrete energy levels.'],['Nuclear Size and Composition','Nuclei contain protons and neutrons and have characteristic sizes related to mass number.'],['Radioactive Decay','Unstable nuclei transform spontaneously by alpha, beta or gamma emission.'],['Half-Life','Half-life is the time required for half of a radioactive sample to decay.'],['Binding Energy','Nuclear binding energy measures the energy required to separate a nucleus into free nucleons.'],['Fission and Fusion','Fission splits heavy nuclei; fusion combines light nuclei. Both can release energy when the final binding energy per nucleon is greater.']],example:'A hydrogen atom emits a photon when an electron moves from a higher energy level to a lower one.',formula:'E = hf\nN = N₀e^(−λt)'},
'electronic-devices':{title:'Electronic Devices',icon:'💻',intro:'Electronic devices use semiconductor properties to control and process electric current.',points:[['Semiconductors','Semiconductors have conductivity between conductors and insulators and their conductivity can be controlled.'],['Intrinsic and Extrinsic Semiconductors','Pure semiconductors are intrinsic; doping creates n-type or p-type extrinsic semiconductors.'],['p-n Junction','A p-n junction forms a depletion region and shows rectifying behavior.'],['Diode','A diode conducts strongly in forward bias and offers high resistance in reverse bias under normal conditions.'],['Rectifier','Diodes can convert alternating voltage into pulsating direct voltage.'],['Zener Diode','A Zener diode operates in controlled reverse breakdown and can be used for voltage regulation.'],['Transistor','A transistor can act as an amplifier or electronic switch.'],['Logic Gates','Digital gates perform Boolean operations such as AND, OR and NOT.']],example:'A diode allows current primarily in one direction, making it useful in rectifier circuits.',formula:'Diode: forward bias → low resistance\nreverse bias → high resistance'},
'experimental-skills':{title:'Experimental Skills',icon:'🧪',intro:'Experimental skills focus on measurement, instruments, uncertainty, graphs, dimensions and safe interpretation of physical data.',points:[['Measurement Instruments','Know the working principle, range, least count and common sources of error of standard instruments.'],['Vernier and Screw Gauge','Read main-scale and auxiliary-scale information carefully and apply zero correction when needed.'],['Significant Figures','Report measured results with precision justified by the instrument and calculation rules.'],['Error Analysis','Distinguish absolute, relative and percentage errors and combine uncertainties appropriately.'],['Graphical Analysis','Use axes, units, scales, slopes and intercepts correctly to extract physical quantities.'],['Dimensional Checks','Use dimensions to test formulas and detect inconsistent expressions.'],['Data Interpretation','Compare experimental values with expected values and identify systematic trends or outliers.'],['Laboratory Practice','Follow correct setup, observation, recording and safety procedures when performing experiments.']],example:'A graph of displacement versus time should include labelled axes and units; its slope represents velocity.'}
};
function slug(s){return String(s).toLowerCase().replace(/[–—]/g,'-').replace(/&/g,'and').replace(/['’]/g,'').replace(/[\s_]+/g,'-').replace(/[^a-z0-9-]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')}
const p=new URLSearchParams(location.search);const key=slug(p.get('topic')||p.get('concept')||'physics-and-measurement');const c=data[key]||data['physics-and-measurement'];
document.title='SkillUp | '+c.title;document.getElementById('title').textContent=c.title;document.getElementById('intro').textContent=c.intro;
let html='<article class="topic"><div class="topic-head"><div class="topic-icon">'+c.icon+'</div><div><h2>'+c.title+'</h2><p class="intro">'+c.intro+'</p></div></div><div class="points">';
c.points.forEach(x=>html+='<section class="point"><h3>'+x[0]+'</h3><p>'+x[1]+'</p></section>');
html+='</div>'+(c.example?'<div class="example"><b>🎯 NEET focus / example</b><br>'+c.example+(c.formula?'<div class="formula">'+c.formula+'</div>':'')+'</div>':'')+'<a class="practice" href="question-bank.html?subject=physics&topic='+encodeURIComponent(c.title)+'">⚡ Practice '+c.title+' →</a></article>';
document.getElementById('content').innerHTML=html;document.getElementById('practice').href='question-bank.html?subject=physics&topic='+encodeURIComponent(c.title);document.getElementById('practice').textContent='⚡ Practice this topic →';
</script>
