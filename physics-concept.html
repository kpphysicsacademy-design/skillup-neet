</body></html>\n<script>/* SKILLUP LEAST COUNT QUIZ V1 */\n(function(){\nconst quiz=[\n['What is the least count of a measuring instrument?',['The largest quantity the instrument can measure','The smallest measurement that can be measured reliably by the instrument','The average of all readings','The total range of the instrument'],1,'Least count is the smallest value that an instrument can measure reliably.'],\n['The least count of a metre scale commonly marked in millimetres is:',['1 cm','1 mm','0.1 mm','10 mm'],1,'The smallest division is 1 mm, so the least count is 1 mm.'],\n['For a standard metre scale, 1 cm is divided into:',['2 equal parts','5 equal parts','10 equal parts','100 equal parts'],2,'Each centimetre is normally divided into 10 millimetres.'],\n['A smaller least count generally means:',['Lower measurement resolution','Greater measurement resolution','Larger zero error','No uncertainty'],1,'A smaller least count allows finer measurements.'],\n['The least count of a Vernier calipers is commonly calculated as:',['1 MSD + 1 VSD','1 MSD − 1 VSD','1 MSD × 1 VSD','1 MSD ÷ 1 VSD'],1,'For the usual direct Vernier, least count = 1 MSD − 1 VSD.'],\n['If 10 Vernier scale divisions equal 9 main scale divisions and 1 MSD = 1 mm, the least count is:',['0.01 mm','0.1 mm','1.0 mm','1.9 mm'],1,'1 VSD = 9/10 mm = 0.9 mm, so LC = 1.0 − 0.9 = 0.1 mm.'],\n['The least count of a screw gauge is calculated using:',['Pitch × number of divisions','Pitch ÷ number of circular scale divisions','Pitch + circular scale divisions','Pitch − circular scale divisions'],1,'Screw gauge least count = pitch divided by the number of circular scale divisions.'],\n['A screw gauge has pitch 1 mm and 100 circular scale divisions. Its least count is:',['0.1 mm','0.01 mm','1 mm','100 mm'],1,'LC = 1/100 mm = 0.01 mm.'],\n['If an instrument has a least count of 0.01 cm, the smallest reliable reading is:',['1 cm','0.1 cm','0.01 cm','0.001 cm'],2,'The least count itself represents the smallest readable increment.'],\n['Which instrument normally provides finer length measurement?',['Metre scale with 1 mm divisions','Vernier calipers with 0.1 mm least count','A ruler with 1 cm divisions','A scale with 10 mm divisions'],1,'A smaller least count gives finer resolution.'],\n['The least count is mainly related to an instrument’s:',['Resolution','Mass','Colour','Temperature'],0,'Least count describes the instrument resolution.'],\n['If the smallest division on a scale is 2 mm, its least count is:',['0.2 mm','1 mm','2 mm','20 mm'],2,'The smallest marked division determines the least count for a simple scale.'],\n['Two instruments have least counts 0.1 mm and 0.01 mm. Which has better resolution?',['0.1 mm instrument','0.01 mm instrument','Both are identical','Cannot be compared'],1,'0.01 mm is the smaller least count, so it gives better resolution.'],\n['Can an instrument normally measure a value much smaller than its least count reliably?',['Yes, always','No, not reliably','Only if the unit is changed','Only for temperature'],1,'A value below the instrument’s resolution cannot normally be read reliably.'],\n['Which statement about least count is correct?',['It is always equal to zero error','It determines the smallest reliable increment an instrument can resolve','It is the same as percentage error','It changes the physical quantity being measured'],1,'Least count characterizes measurement resolution and does not itself change the physical quantity.']\n];\nfunction run(){\nconst key=(new URLSearchParams(location.search).get('concept')||'').trim().toLowerCase();\nif(key!=='least count')return;\nconst q=document.getElementById('question'),o=document.getElementById('options'),c=document.getElementById('check'),n=document.getElementById('next'),f=document.getElementById('feedback'),h=document.getElementById('hint'),ct=document.getElementById('count'),pct=document.getElementById('pct'),qt=document.getElementById('qbadge'),mt=document.getElementById('masteryText'),fill=document.getElementById('fill'),xp=document.getElementById('xp'),m=document.getElementById('mastery'),topic=document.getElementById('topic'),res=document.getElementById('result'),score=document.getElementById('score'),retry=document.getElementById('retry');\nif(!q||!o||!c||!n)return;\nlet i=0,sel=-1,done=0,points=0;\ntopic.textContent='Least Count';\nfunction render(){const a=quiz[i];sel=-1;q.textContent=a[0];qt.textContent='Q'+(i+1);ct.textContent='Question '+(i+1)+' of '+quiz.length;pct.textContent=Math.round((i+1)/quiz.length*100)+'%';mt.textContent=done+' / '+quiz.length;fill.style.width=(done/quiz.length*100)+'%';h.textContent='Read the smallest reliable division carefully.';f.className='feedback';f.innerHTML='';n.disabled=true;c.disabled=false;o.innerHTML='';a[1].forEach((v,j)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+v;b.onclick=()=>{if(c.disabled)return;sel=j;Array.from(o.children).forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)});}\nfunction check(){if(sel<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}const a=quiz[i],bs=Array.from(o.children);bs.forEach((b,j)=>{b.classList.remove('correct','wrong');if(j===a[2])b.classList.add('correct');else if(j===sel)b.classList.add('wrong')});const ok=sel===a[2];if(ok){done++;points+=10;xp.textContent=points;m.textContent=Math.round(done/quiz.length*100)+'%';f.className='feedback good';f.textContent='✓ Correct — '+a[3]}else{f.className='feedback bad';f.textContent='✗ Review — '+a[3]}c.disabled=true;n.disabled=false;mt.textContent=done+' / '+quiz.length;if(i===quiz.length-1)n.textContent='Finish Skill →';}\nfunction next(){if(!c.disabled)return;if(i<quiz.length-1){i++;n.textContent='Next Question →';render()}else{q.textContent='🏆 Least Count Complete!';o.innerHTML='';c.style.display='none';n.style.display='none';h.textContent='';f.className='feedback good';f.textContent='Skill complete. '+points+' XP earned.';res.style.display='block';score.textContent=done+' / '+quiz.length+' correct • '+points+' XP'}}\nc.onclick=check;n.onclick=next;if(retry)retry.onclick=()=>{i=0;sel=-1;done=0;points=0;xp.textContent='0';m.textContent='0%';res.style.display='none';c.style.display='';n.style.display='';render()};render();\n}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(run,60));else setTimeout(run,60);\n})();\n</script>
