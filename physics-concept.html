ertainty in measurement':'physics-absolute-uncertainty.html','accuracy and precision':'physics-accuracy-and-precision.html','accuracy & precision':'physics-accuracy-and-precision.html','significant figures':'physics-significant-figures.html','significant figure':'physics-significant-figures.html','dimensional analysis':'physics-dimensional-analysis.html?concept=Dimensional%20analysis','dimensional formulae':'physics-dimensional-formulae.html?concept=Dimensional%20formulae','dimensions':'physics-dimensions.html?concept=Dimensions','dimensional equations':'physics-dimensional-equations.html?concept=Dimensional%20equations','principle of homogeneity':'physics-principle-of-homogeneity.html?concept=Principle%20of%20homogeneity','principle of dimensional homogeneity':'physics-principle-of-homogeneity.html?concept=Principle%20of%20homogeneity','errors in measurement':'physics-errors-in-measurement.html?concept=Errors%20in%20Measurement','least count':'physics-least-count.html?concept=Least%20count'};if(routes[key]){location.replace(routes[key]);return}const quiz=[['What is the main idea of this physics concept?',['It describes a measurable physical principle','It is only a unit symbol','It is unrelated to measurement','It is only a mathematical constant'],0],['Which approach is best for a NEET physics question?',['Identify the concept and relevant relation','Guess the longest option','Ignore units','Skip the data'],0],['Why are units important in physics?',['They communicate the magnitude of a physical quantity','They replace equations','They remove dimensions','They are optional'],0]];let i=0,sel=-1,score=0,q=document.getElementById('q'),o=document.getElementById('opts'),fb=document.getElementById('fb'),check=document.getElementById('check'),next=document.getElementById('next');document.getElementById('title').textContent=wanted;document.getElementById('topic').textContent=wanted;function render(){const a=quiz[i];sel=-1;q.textContent=a[0];document.getElementById('badge').
