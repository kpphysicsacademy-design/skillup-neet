?',['The largest quantity the instrument can measure','The smallest measurement that can be measured reliably by the instrument','The average of all readings','The total range of the instrument'],1,'Least count is the smallest value that an instrument can measure reliably.'],\n['The least count of a metre scale commonly marked in millimetres is:',['1 cm','1 mm','0.1 mm','10 mm'],1,'The smallest division is 1 mm, so the least count is 1 mm.'],\n['For a standard metre scale, 1 cm is divided into:',['2 equal parts','5 equal parts','10 equal parts','100 equal parts'],2,'Each centimetre is normally divided into 10 millimetres.'],\n['A smaller least count generally means:',['Lower measurement resolution','Greater measurement resolution','Larger zero error','No uncertainty'],1,'A smaller least count allows finer measurements.'],\n['The least count of a Vernier calipers is commonly calculated as:',['1 MSD + 1 VSD','1 MSD − 1 VSD','1 MSD × 1 VSD','1 MSD ÷ 1 VSD'],1,'For the usual direct Vernier, least count = 1 MSD − 1 VSD.'],\n['If 10 Vernier scale divisions equal 9 main scale divisions and 1 MSD = 1 mm, the least count is:',['0.01 mm','0.1 mm','1.0 mm','1.9 mm'],1,'1 VSD = 9/10 mm = 0.9 mm, so LC = 1.0 − 0.9 = 0.1 mm.'],\n['The least count of a screw gauge is calculated using:',['Pitch × number of divisions','Pitch ÷ number of circular scale divisions','Pitch + circular scale divisions','Pitch − circular scale divisions'],1,'Screw gauge least count = pitch divided by the number of circular scale divisions.'],\n['A screw gauge has pitch 1 mm and 100 circular scale divisions. Its least count is:',['0.1 mm','0.01 mm','1 mm','100 mm'],1,'LC = 1/100 mm = 0.01 mm.'],\n['If an instrument has a least count of 0.01 cm, the smallest reliable reading is:',['1 cm','0.1 cm','0.01 cm','0.001 cm'],2,'The least count itself represents the smallest readable increment.'],\n['Which instrument normally provides finer length measurement?',['Metre scale with 1 mm divisions','Vernier calipers with 0.1 mm least count','A ruler with 1 cm divisions','A scale with 10 mm divisions'],1,'A smaller least count gives finer resolution.'],\n['The least count is mainly related to an instrument’s:',['Resolution','Mass','Colour','Temperature'],0,'Least count describes the instrument resolution.'],\n['If the smallest division on a scale is 2 mm, its least count is:',['0.2 mm','1 mm','2 mm','20 mm'],2,'The smallest marked division determines the least count for a simple scale.'],\n['Two instruments have least counts 0.1 mm and 0.01 mm. Which has better resolution?',['0.1 mm instrument','0.01 mm instrument','Both are identical','Cannot be compared'],1,'0.01 mm is the smaller least count, so it gives better resolution.'],\n['Can an instrument normally measure a value much smaller than its least count reliably?',['Yes, always','No, not reliably','Only if the unit is changed','Only for temperature'],1,'A value below the instrument’s resolution cannot normally be read reliably.'],\n['Which statement about least count is correct?',['It is always equal to zero error','It determines the smallest reliable increment an instrument can resolve','It is the same as percentage error','It changes the physical quantity being measured'],1,'Least count characterizes measurement resolution and does not itself change the physical quantity.']\n];\nfunction run(){\nconst key=(new URLSearchParams(location.search).get('concept')||'').trim().toLowerCase();\nif(key!=='least count')return;\nconst q=document.getElementById('question'),o=document.getElementById('options'),c=document.getElementById('check'),n=document.getElementById('next'),f=document.getElementById('feedback'),h=document.getElementById('hint'),ct=document.getElementById('count'),pct=document.getElementById('pct'),qt=document.getElementById('qbadge'),mt=document.getElementById('masteryText'),fill=document.getElementById('fill'),xp=document.getElementById('xp'),m=document.getElementById('mastery'),topic=document.getElementById('topic'),
