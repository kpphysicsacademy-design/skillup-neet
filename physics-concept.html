<script>
const concepts={
'units-of-measurement':{title:'Units of Measurement',text:'A unit is a fixed, agreed standard used to measure a physical quantity. A numerical measurement tells us how many times the chosen unit is contained in the quantity.',example:'For example, if a table is 2 metres long, 2 is the numerical value and metre (m) is the unit.'},
'system-of-units-and-si-units':{title:'System of Units and SI Units',text:'A system of units is an organized set of standard units. The SI system is the internationally accepted system based on seven base units.',example:'Length is measured in metre (m), mass in kilogram (kg), and time in second (s).'},
'fundamental-and-derived-units':{title:'Fundamental and Derived Units',text:'Fundamental units are independent base units. Derived units are formed by combining fundamental units according to physical relationships.',example:'Velocity has unit m/s, while force has unit kg·m/s², called newton (N).'},
'least-count':{title:'Least Count',text:'Least count is the smallest measurement that an instrument can reliably read. A smaller least count generally allows finer measurement.',example:'If the smallest division on a ruler is 1 mm, its least count is 1 mm.'},
'significant-figures':{title:'Significant Figures',text:'Significant figures are the meaningful digits in a measured value that indicate its precision. They include certain digits and the first uncertain digit.',example:'12.30 cm contains four significant figures.'},
'errors-in-measurements':{title:'Errors in Measurements',text:'Measurement error is the difference between a measured value and the true or accepted value. Errors may be systematic, random, or gross.',example:'Percentage error is calculated as (absolute error ÷ measured value) × 100.'},
'dimensions-of-physical-quantities':{title:'Dimensions of Physical Quantities',text:'Dimensions describe how a physical quantity depends on fundamental quantities such as mass, length, and time.',example:'Velocity has dimensions [LT⁻¹], while force has dimensions [MLT⁻²].'},
'dimensional-analysis-and-applications':{title:'Dimensional Analysis and Applications',text:'Dimensional analysis uses dimensions to check physical equations, derive relationships, and convert units between systems.',example:'In s = ut + ½at², every term has dimensions of length, so the equation is dimensionally consistent.'}
};
function slug(s){return String(s).toLowerCase().replace(/[–—]/g,'-').replace(/&/g,'and').replace(/[\s_]+/g,'-').replace(/[^a-z0-9-]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')}
const p=new URLSearchParams(location.search),key=slug(p.get('concept')||'units-of-measurement'),c=concepts[key]||concepts['units-of-measurement'];
document.title='SkillUp | '+c.title;document.getElementById('title').textContent=c.title;document.getElementById('intro').textContent=c.text;document.getElementById('content').innerHTML='<article class="concept"><h2>Definition</h2><p>'+c.text+'</p><div class="example"><b>Example</b><br>'+c.example+'</div></article>';
document.getElementById('practice').href='question-bank.html?subject=physics&topic='+encodeURIComponent(c.title);
