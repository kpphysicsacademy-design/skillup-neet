*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}

h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#174a78}.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}
.progress-row{display:flex;justify-content:space-between;gap:10px;margin:16px 0 7px;font-size:12px;font-weight:900;color:var(--muted)}
.track{height:11px;border-radius:99px;background:#e2edf7;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}

.options{display:grid;gap:10px}.option{display:flex;gap:11px;align-items:center;width:100%;min-height:51px;padding:12px;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}
.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🔥 Conduction</h1><p class="muted">Learn heat conduction, thermal conductivity, Fourier’s law and quick numerical problems.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"What is heat conduction?",o:["Transfer of heat through a material without bulk movement of the material","Transfer of matter from hot to cold","A change in chemical identity","Heat transfer only by light"],a:0,e:"Conduction transfers energy through interactions between neighbouring particles without bulk flow."},
{q:"Which material is generally a good conductor of heat?",o:["Wood","Copper","Air","Rubber"],a:1,e:"Metals such as copper conduct heat well because mobile electrons help transfer energy."},
{q:"Which material is generally a thermal insulator?",o:["Silver","Aluminium","Wood","Copper"],a:2,e:"Wood is a relatively poor thermal conductor compared with metals."},
{q:"In a metal, heat is transferred efficiently partly by:",o:["Sound waves only","Bulk fluid motion","Evaporation only","Mobile electrons and lattice vibrations"],a:3,e:"Mobile electrons carry energy through the metal, alongside lattice vibrations."},
{q:"The SI unit of thermal conductivity is:",o:["W m⁻¹ K⁻¹","J kg⁻¹","W/K²","N m"],a:0,e:"Thermal conductivity is measured in watts per metre per kelvin."},
{q:"For a flat slab, the conduction rate is proportional to:",o:["Thickness only","Area and temperature difference","Only its mass","The square of time"],a:1,e:"At steady state, heat flow rate increases with area and temperature difference."},
{q:"For a slab of thickness L, the conduction rate is inversely proportional to:",o:["Surface area","Temperature difference","Thickness","Thermal conductivity"],a:2,e:"A thicker slab provides a longer path for heat transfer and lowers the rate."},
{q:"The steady conduction rate through a slab is given by:",o:["Q = mL","P = IV","F = ma","dQ/dt = kAΔT/L"],a:3,e:"For a uniform slab, the heat-transfer rate is kA times the temperature difference divided by thickness."},
{q:"In the conduction formula, k represents:",o:["Thermal conductivity","Kinetic energy","Specific latent heat","Density"],a:0,e:"Thermal conductivity measures a material's ability to conduct heat."},
{q:"Why does a metal spoon become hot when left in hot tea?",o:["The spoon produces heat chemically","Heat conducts along the spoon","The spoon absorbs no energy","The spoon melts instantly"],a:1,e:"Energy moves from the immersed end toward the cooler handle by conduction."},
{q:"Why are saucepan handles often made of plastic or wood?",o:["They have very high thermal conductivity","They increase boiling temperature","They are poor conductors of heat","They stop all heat from reaching the pan"],a:2,e:"Insulating handles reduce the rate of heat conduction to the hand."},
{q:"At steady state through a uniform slab, the temperature profile is approximately linear when:",o:["The slab is changing phase","Thermal conductivity varies wildly","No heat is flowing","Conductivity is constant and there is no internal heat generation"],a:3,e:"Under these assumptions, a constant heat flux produces a linear temperature gradient."},
{q:"If slab area doubles while other factors stay constant, heat conduction rate:",o:["Doubles","Halves","Becomes zero","Is unchanged"],a:0,e:"The rate is directly proportional to area."},
{q:"If slab thickness doubles while other factors stay constant, heat conduction rate:",o:["Doubles","Halves","Becomes four times larger","Is unchanged"],a:1,e:"The rate is inversely proportional to thickness."},
{q:"If the temperature difference across a slab doubles, the steady heat-transfer rate generally:",o:["Halves","Becomes zero","Doubles","Becomes four times larger"],a:2,e:"The rate is directly proportional to the temperature difference."},
{q:"A slab has k = 0.5 W m⁻¹ K⁻¹, area 2 m², ΔT = 10 K and thickness 0.1 m. Heat-transfer rate is:",o:["10 W","50 W","100 W","1000 W"],a:3,e:"Rate = kAΔT/L = 0.5×2×10/0.1 = 100 W."},
{q:"Which condition best reduces heat conduction through a wall?",o:["Use a low-conductivity material and increase thickness","Use a highly conductive metal","Make the wall thinner","Increase the temperature difference"],a:0,e:"Low conductivity and greater thickness reduce steady conduction rate."},
{q:"Heat conduction in gases is generally less effective than in metals because gases:",o:["Have more mobile electrons","Have widely spaced particles and lack abundant free electrons","Are always colder","Cannot contain internal energy"],a:1,e:"Gas molecules are farther apart and typically conduct heat less efficiently than metals."},
{q:"The direction of spontaneous heat conduction is from:",o:["Cold to hot only","Low pressure to high pressure only","Higher temperature to lower temperature","Lower mass to higher mass"],a:2,e:"Net heat transfer by conduction proceeds down a temperature gradient."},
{q:"Thermal resistance of a flat slab is proportional to:",o:["Area","Temperature alone","Thermal conductivity","Thickness and inversely to conductivity and area"],a:3,e:"For a slab, thermal resistance R = L/(kA)."},
{q:"Two slabs are in series. At steady state with no heat loss between them, the heat rate through each is:",o:["The same","Zero in the second slab","Always larger in the second","Determined only by mass"],a:0,e:"Energy conservation requires the same steady heat rate through series layers."},
{q:"Which statement about conduction in a vacuum is correct?",o:["It is the main mode in a vacuum","Conduction by ordinary particle collisions cannot occur through a perfect vacuum","It always happens faster than in copper","Vacuum has infinite thermal conductivity"],a:1,e:"Without material particles, ordinary conduction cannot transfer heat across a perfect vacuum."},
{q:"A good thermal conductor usually has:",o:["Very high thermal resistance","No particles","High thermal conductivity","Zero heat capacity"],a:2,e:"High thermal conductivity corresponds to efficient heat transfer."},
{q:"Why does a woollen blanket help keep a person warm?",o:["Wool creates heat from nothing","Wool increases the body's temperature by reaction","Wool conducts heat rapidly away","Trapped air reduces heat transfer"],a:3,e:"Air trapped between fibres is a poor conductor, reducing heat loss."},
{q:"If k doubles while area, temperature difference and thickness stay constant, heat rate:",o:["Doubles","Halves","Becomes zero","Stays the same"],a:0,e:"The conduction rate is directly proportional to thermal conductivity."},
{q:"A slab carries 40 W through 2 m² area and 0.2 m thickness with a 20 K difference. Its k is:",o:["0.1 W m⁻¹ K⁻¹","0.2 W m⁻¹ K⁻¹","2 W m⁻¹ K⁻¹","4 W m⁻¹ K⁻¹"],a:1,e:"k = rate×L/(AΔT) = 40×0.2/(2×20) = 0.2 W m⁻¹ K⁻¹."},
{q:"A temperature gradient describes change in temperature with:",o:["Mass","Pressure only","Distance","Time only"],a:2,e:"Temperature gradient is the temperature change per unit distance."},
{q:"Fourier's law states that heat flux is proportional to the negative:",o:["Density","Specific heat","Volume","Temperature gradient"],a:3,e:"Fourier's law expresses heat flux as q = −k dT/dx; the negative sign indicates flow toward lower temperature."},
{q:"Why do metals often feel colder than wood at the same room temperature?",o:["Metal conducts heat away from the hand faster","Metal is always below room temperature","Wood has no thermal energy","Metal has no mass"],a:0,e:"Metal's higher conductivity removes heat from the skin more rapidly."},
{q:"Which statement correctly distinguishes conduction from convection?",o:["Conduction requires bulk fluid flow","Conduction transfers energy without bulk movement of the material","Conduction occurs only in liquids","Conduction is identical to radiation"],a:1,e:"Conduction occurs through microscopic interactions; convection involves bulk fluid motion."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Pascal&#39;s Law Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
