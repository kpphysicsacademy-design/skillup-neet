<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1f1e5"><title>SkillUp Physics | Connected Bodies — Simulator</title><link rel="stylesheet" href="physics-duolingo-quiz.css?v=20261122-all-topics-v1"><style>body{margin:0;background:#f1f1e5;color:#27372e;font-family:system-ui,sans-serif}header{background:#fbfbf3;border-bottom:1px solid #dce1d4}.nav{width:min(100% - 24px,720px);min-height:68px;margin:auto;display:flex;align-items:center;gap:10px}.back{width:42px;height:42px;display:grid;place-items:center;border:2px solid #dce5d7;border-radius:14px;background:#f2f9ff;color:#174a78;text-decoration:none}.brand{font-weight:950}.brand small{display:block;font-size:9px;color:#68766a;letter-spacing:.8px}main{width:min(100% - 24px,720px);margin:16px auto 40px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.tab{min-height:46px;display:grid;place-items:center;border:2px solid #dce8f3;border-radius:14px;background:#fff;color:#245273;text-decoration:none;font-size:13px;font-weight:900}.tab.active{background:#e8f8dc;border-color:#8ed65b;color:#286c12}.progress{padding:10px;margin-bottom:14px;border:1px solid #d7eaf8;border-radius:13px;background:#eef8ff;text-align:center;color:#245273;font-weight:850}.card{background:#fff;border:2px solid #e2e9df;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 5px 0 #dce8f3}.hero{background:#e9eddf}h1,h2{color:#254b37}.muted{line-height:1.6;color:#5f6f61}.field{margin:18px 0}.field label{display:flex;justify-content:space-between;gap:10px;font-weight:850;margin-bottom:8px}.field output{color:#176e9e}.field input{width:100%;accent-color:#58cc02}.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.result{padding:13px;border:1px solid #ccefb9;border-radius:14px;background:#efffe7;text-align:center}.result b{display:block;color:#286c12;font-size:18px}.result span{font-size:11px;color:#52734a}.formula{padding:14px;background:#efffe7;border:1px solid #c8f0b2;border-radius:14px;text-align:center;font-size:20px;font-weight:900;color:#315b24}@media(max-width:400px){.tab{font-size:11px}}</style></head><body><header><div class="nav"><a class="back" href="physics-home-fast.html">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div></div></header><main><nav class="tabs" aria-label="Connected Bodies pages"><a class="tab" href="physics-connected-bodies-learn.html">📘 Learn</a><a class="tab active" href="physics-connected-bodies-simulator.html" aria-current="page">🎮 Simulator</a><a class="tab" href="physics-connected-bodies-practice.html">🧠 Practice</a></nav><div class="progress">Progress: 2/3 pages completed</div><section class="card hero"><h1>⚖️ Connected Bodies Simulator</h1><p class="muted">Model two masses connected by a light string over an ideal pulley (Atwood machine).</p></section><section class="card"><div class="formula">a = |m₂ − m₁|g / (m₁ + m₂)</div><div class="field"><label for="m1">Mass 1 (kg)<output id="m1Out">2</output></label><input id="m1" type="range" min="0.1" max="20" step="0.1" value="2"></div><div class="field"><label for="m2">Mass 2 (kg)<output id="m2Out">5</output></label><input id="m2" type="range" min="0.1" max="20" step="0.1" value="5"></div><div class="field"><label for="g">Gravitational acceleration (m/s²)<output id="gOut">9.8</output></label><input id="g" type="range" min="1" max="15" step="0.1" value="9.8"></div><div class="results" id="results"></div><p class="muted" id="note" aria-live="polite">Change any value to explore the relationship.</p><button id="reset" type="button">Reset values</button></section></main><script>(function(){const ids=["m1","m2","g"],defaults={"m1":2,"m2":5,"g":9.8},$=id=>document.getElementById(id),fmt=n=>Number(n.toPrecision(6)).toString();function update(){const v={};ids.forEach(id=>{v[id]=+$(id).value;$(id+'Out').textContent=fmt(v[id]);});const m1=+v.m1,m2=+v.m2,g=+v.g;const rows=(const a=Math.abs(m2-m1)*g/(m1+m2),T=2*m1*m2*g/(m1+m2);return [['Acceleration',fmt(a)+' m/s²'],['String tension',fmt(T)+' N'],['Direction',m2>m1?'Mass 2 moves down':m1>m2?'Mass 1 moves down':'Balanced']];);$('results').innerHTML=rows.map(([k,val])=>'<div class="result"><b>'+k+'</b><span>'+val+'</span></div>').join('');}ids.forEach(id=>$(id).addEventListener('input',update));$('reset').addEventListener('click',()=>{ids.forEach(id=>$(id).value=defaults[id]);update();});update();})();</script><script src="shared-nav.js?v=20261122-all-topics-v1"></script></body></html>
