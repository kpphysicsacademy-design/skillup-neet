<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Connected Bodies</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px 42px}.card{background:#fff;border-radius:22px;padding:28px;box-shadow:0 6px 20px #17203312}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.tag{font-weight:800;font-size:.9rem}.xp{font-weight:850}.bar{height:10px;background:#e8e8f1;border-radius:999px;overflow:hidden;margin:12px 0 24px}.fill{height:100%;width:0;background:#5b50c8;transition:width .25s ease}.q{font-size:1.22rem;font-weight:800;line-height:1.45;margin:20px 0}.opts{display:grid;gap:12px}.opt{width:100%;text-align:left;border:2px solid #e3e3ed;background:#fafafd;border-radius:15px;padding:14px 16px;font:inherit;cursor:pointer;transition:transform .12s,background .12s,border-color .12s,box-shadow .12s}.opt:hover{transform:translateY(-2px);border-color:#aaa4df;box-shadow:0 4px 12px #17203310}.opt:focus{outline:3px solid #c9c3ff;outline-offset:2px}.opt.selected{border-color:#5b50c8;background:#f0edff}.opt.correct{border-color:#2d9b68;background:#eaf8f1}.opt.wrong{border-color:#d45555;background:#fff0f0}.feedback{min-height:72px;margin-top:18px;padding:14px 16px;border-radius:15px;background:#f4f3fb;line-height:1.5}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:13px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer;background:#5b50c8;color:white}.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}.btn:focus{outline:3px solid #c9c3ff;outline-offset:2px}.btn:active{transform:translateY(1px)}.back{display:inline-block;margin-top:30px;color:#5146a5;font-weight:800;text-decoration:none;padding:11px 14px;border-radius:13px}.back:hover{background:#f0edff;transform:translateY(-1px)}.back:focus{outline:3px solid #c9c3ff;outline-offset:2px}.back:active{transform:translateY(1px)}.result{font-size:1.2rem;font-weight:750;line-height:1.6}
</style></head><body><main class="wrap"><section class="card"><div class="top"><div class="tag">🔗 Connected Bodies</div><div class="xp">+10 XP</div></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></section></main><script>
const qs=[
['Two bodies connected by a light inextensible string over a smooth pulley have:', ['the same magnitude of acceleration','different accelerations in all cases','zero acceleration always','independent motions'],0,'An inextensible string keeps the connected bodies moving with equal acceleration magnitude.'],
['For an ideal light string passing over a smooth pulley, the tension is:', ['the same throughout the string','zero at the pulley','different on the two sides','equal to the heavier body’s weight always'],0,'A massless string and frictionless pulley give the same tension throughout the string.'],
['In an Atwood machine with masses m1 and m2, m2 > m1, the heavier mass moves:', ['downward','upward','horizontally','with zero acceleration'],0,'The larger weight produces a net downward force on m2.'],
['For an ideal Atwood machine, the magnitude of acceleration is:', ['(m2−m1)g/(m1+m2)','(m1+m2)g/(m2−m1)','g(m1+m2)','g(m2−m1)'],0,'Applying Newton’s second law to both masses gives a = (m2−m1)g/(m1+m2).'],
['If two equal masses are connected over an ideal pulley, the acceleration is:', ['zero','g','g/2','2g'],0,'Equal weights balance, so the net driving force is zero.'],
['In a connected-body system, the tension in the string is an:', ['internal force between the connected bodies','external force on the whole system only','frictional force','gravitational force'],0,'Tension acts between parts of the chosen system and is internal if both bodies are included.'],
['For two bodies on a smooth horizontal surface connected by a string and pulled by force F, the acceleration of the system is:', ['F/(m1+m2)','F/(m1−m2)','F m1 m2','(m1+m2)/F'],0,'Treating both bodies as one system gives F = (m1+m2)a.'],
['For the same horizontal system, the tension can be found by applying Newton’s second law to:', ['either individual body','neither body','the pulley only','gravity alone'],0,'Isolating one body lets its equation determine the string tension.'],
['If the connecting string is inextensible, the displacement magnitudes of two connected bodies are:', ['equal along the string','always unequal','both zero','unrelated'],0,'An inextensible string imposes a fixed length constraint.'],
['A 2 kg mass and a 3 kg mass form an ideal Atwood machine. Taking g = 10 m/s², the acceleration is:', ['2 m/s²','5 m/s²','10 m/s²','1 m/s²'],0,'a = (3−2)10/(3+2) = 2 m/s².'],
['For the 2 kg and 3 kg Atwood machine, the string tension is:', ['24 N','20 N','30 N','6 N'],0,'For the 2 kg mass moving up: T−20 = 2×2, so T = 24 N.'],
['If the pulley has significant mass and rotational inertia, the tensions on its two sides are generally:', ['different','always equal','both zero','equal to the weights'],0,'A massive pulley requires a torque difference, so the two tensions need not be equal.'],
['In a two-body system connected by a string, the direction of friction on a body is:', ['opposite its relative motion or tendency of motion','always toward the pulley','always downward','always upward'],0,'Friction opposes relative motion or the tendency of relative motion at the contact.'],
['When solving connected-body problems, a free-body diagram should show:', ['all forces acting on each isolated body','only the tension','only gravity','the acceleration instead of forces'],0,'A correct free-body diagram identifies every external force on the isolated body.'],
['For ideal connected bodies, the acceleration constraint is primarily determined by the:', ['string constraint and Newton’s laws','colour of the string','size of the pulley alone','shape of the bodies'],0,'The inextensible-string constraint links the motions, while Newton’s laws determine the acceleration.']
];
let i=0,selected=null,score=0;const $=id=>document.getElementById(id);
function render(){selected=null;const a=qs[i];$('fill').style.width=(i/qs.length*100)+'%';$('quiz').innerHTML='<div class="q">'+(i+1)+'. '+a[0]+'</div><div class="opts" id="opts"></div><div class="feedback" id="feedback">Choose an answer, then check it.</div><div class="actions"><button class="btn" id="check">Check</button></div>';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{selected=item.index;[...$('opts').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('opts').appendChild(b)});$('check').onclick=check}
function check(){if(selected===null){$('feedback').textContent='Please choose an answer first.';return}const a=qs[i],ok=selected===a[2];if(ok)score++;[...$('opts').children].forEach(b=>{const oi=Number(b.dataset.index);b.disabled=true;if(oi===a[2])b.classList.add('correct');if(oi===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+'<br>'+a[3];if(i<qs.length-1){$('check').textContent='Next';$('check').onclick=()=>{i++;render()}}else{$('fill').style.width='100%';const pct=Math.round(score/qs.length*100);$('quiz').innerHTML='<div class="result">🏆 Quiz complete!<br>Score: '+score+'/15 ('+pct+'%)<br>XP earned: '+(score*10)+' XP</div><div class="actions"><button class="btn" onclick="i=0;score=0;render()">Retry</button></div>';localStorage.setItem('skillupPhysicsConnectedBodiesScore',String(score))}}
function rememberPath(){try{const ref=document.referrer;if(ref){const u=new URL(ref);if(u.origin===location.origin&&(/(?:physics|full-physics)[^/]*path[^/]*\.html$/i.test(u.pathname)||/\/physics-home\.html$/i.test(u.pathname)))sessionStorage.setItem('skillupLastPhysicsPath',u.href)}}catch(e){}}
rememberPath();$('back').onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();
</script></body></html>
