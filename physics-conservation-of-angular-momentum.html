<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>📏 Conservation of Angular Momentum</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [{"q":"Angular momentum is conserved when the net external torque is:","o":["Zero","Maximum","Always positive","Equal to angular velocity"],"a":0,"e":"With zero net external torque, total angular momentum remains constant."},{"q":"For a rotating rigid body about a fixed axis, angular momentum is:","o":["L = Iω","L = Iα","L = τt²","L = I/ω"],"a":0,"e":"For fixed-axis rotation, L = Iω."},{"q":"A skater pulls in their arms, reducing moment of inertia. With negligible external torque, angular speed:","o":["Increases","Decreases","Remains constant","Becomes zero"],"a":0,"e":"Iω remains constant, so a smaller I means a larger ω."},{"q":"A system has I = 4 kg m² and ω = 3 rad s⁻¹. Its angular momentum is:","o":["12 kg m² s⁻¹","7 kg m² s⁻¹","1.33 kg m² s⁻¹","24 kg m² s⁻¹"],"a":0,"e":"L = Iω = 4×3 = 12 kg m² s⁻¹."},{"q":"A rotating body has initial I = 6 kg m² and ω = 2 rad s⁻¹. If I becomes 3 kg m², final ω is:","o":["4 rad s⁻¹","1 rad s⁻¹","2 rad s⁻¹","6 rad s⁻¹"],"a":0,"e":"I₁ω₁ = I₂ω₂, so ω₂ = (6×2)/3 = 4 rad s⁻¹."},{"q":"Which is the external cause of change in total angular momentum?","o":["Net external torque","Internal forces alone","Mass alone","Angular displacement alone"],"a":0,"e":"The net external torque controls the change in total angular momentum."},{"q":"The SI unit of angular momentum is:","o":["kg m² s⁻¹","N m","kg m s⁻¹","J"],"a":0,"e":"Angular momentum has units kg m²/s."},{"q":"A dancer spins at 2 rad s⁻¹ with I = 5 kg m². If I drops to 2 kg m², new angular speed?","o":["5 rad s⁻¹","2.5 rad s⁻¹","0.8 rad s⁻¹","10 rad s⁻¹"],"a":0,"e":"ω₂ = I₁ω₁/I₂ = 5×2/2 = 5 rad s⁻¹."},{"q":"A planet's angular momentum about the Sun remains constant because the gravitational force is:","o":["A central force with zero torque about the Sun","Always zero","Always perpendicular to velocity","Constant in magnitude"],"a":0,"e":"The force acts along the radius, so its torque about the Sun is zero."},{"q":"For a particle, angular momentum about a point is:","o":["L = r × p","L = r + p","L = mv²","L = F/r"],"a":0,"e":"Angular momentum is the cross product of position and linear momentum."},{"q":"If external torque is zero, angular momentum before and after an interaction is:","o":["Equal","Always zero","Opposite in every case","Unrelated"],"a":0,"e":"Conservation means the total initial and final angular momentum are equal."},{"q":"A wheel has L = 24 kg m² s⁻¹ and I = 6 kg m². Its angular speed is:","o":["4 rad s⁻¹","18 rad s⁻¹","30 rad s⁻¹","0.25 rad s⁻¹"],"a":0,"e":"ω = L/I = 24/6 = 4 rad s⁻¹."},{"q":"If moment of inertia is tripled and angular momentum conserved, angular velocity becomes:","o":["One-third","Three times","Unchanged","Nine times"],"a":0,"e":"With Iω constant, tripling I reduces ω to one-third."},{"q":"A rotating stool and person have I = 8 kg m² at 1.5 rad s⁻¹. Angular momentum is:","o":["12 kg m² s⁻¹","5.33 kg m² s⁻¹","9.5 kg m² s⁻¹","16 kg m² s⁻¹"],"a":0,"e":"L = 8×1.5 = 12 kg m² s⁻¹."},{"q":"A body changes I from 10 to 5 kg m² while spinning with initial ω = 3 rad s⁻¹. If no external torque, final ω:","o":["6 rad s⁻¹","1.5 rad s⁻¹","3 rad s⁻¹","15 rad s⁻¹"],"a":0,"e":"ω₂ = 10×3/5 = 6 rad s⁻¹."},{"q":"The conservation of angular momentum follows from:","o":["Zero net external torque","Constant kinetic energy in all cases","Zero internal forces","Constant moment of inertia"],"a":0,"e":"Zero net external torque makes dL/dt = 0."},{"q":"A torque of 4 N m acts for 3 s. The change in angular momentum is:","o":["12 kg m² s⁻¹","7 kg m² s⁻¹","1.33 kg m² s⁻¹","4 kg m² s⁻¹"],"a":0,"e":"For constant torque, ΔL = τΔt = 4×3 = 12."},{"q":"When a diver tucks into a smaller shape while airborne, angular speed increases mainly because:","o":["Moment of inertia decreases while angular momentum is conserved","Gravity creates a large torque about the centre of mass","Mass increases","Angular momentum disappears"],"a":0,"e":"Tucking redistributes mass closer to the axis, reducing I."},{"q":"Which quantity is conserved for an isolated rotating system even if its rotational kinetic energy changes?","o":["Angular momentum","Angular speed","Moment of inertia","Angular acceleration"],"a":0,"e":"Angular momentum is conserved; kinetic energy can change as internal work is done."},{"q":"A system has I = 2 kg m² and ω = 12 rad s⁻¹. If I becomes 8 kg m², final ω is:","o":["3 rad s⁻¹","6 rad s⁻¹","24 rad s⁻¹","48 rad s⁻¹"],"a":0,"e":"ω₂ = I₁ω₁/I₂ = 2×12/8 = 3 rad s⁻¹."},{"q":"The angular momentum vector of a fixed-axis rotor points:","o":["Along the rotation axis according to the right-hand rule","Always vertically upward","Along the tangential velocity","Toward the centre"],"a":0,"e":"Its direction follows the right-hand rule for the chosen rotation direction."},{"q":"A system's angular momentum is 15 kg m² s⁻¹. If external torque is zero for 5 s, its final angular momentum is:","o":["15 kg m² s⁻¹","3 kg m² s⁻¹","75 kg m² s⁻¹","Zero"],"a":0,"e":"With zero external torque, angular momentum remains 15 kg m² s⁻¹."},{"q":"A rotating body speeds up as its radius of mass distribution decreases. Which principle explains this?","o":["Conservation of angular momentum","Conservation of charge","Hooke's law","Archimedes' principle"],"a":0,"e":"Reducing I requires ω to rise when angular momentum is conserved."},{"q":"Two objects rotate with the same angular velocity. Which has larger angular momentum?","o":["The object with greater moment of inertia","The object with smaller moment of inertia","Both always have zero","Cannot depend on I"],"a":0,"e":"At the same ω, L = Iω is larger for greater I."},{"q":"A rotating system has L = 30 kg m² s⁻¹. If I = 10 kg m², its ω is:","o":["3 rad s⁻¹","300 rad s⁻¹","20 rad s⁻¹","0.33 rad s⁻¹"],"a":0,"e":"ω = L/I = 30/10 = 3 rad s⁻¹."},{"q":"A spinning person extends their arms, increasing moment of inertia. With negligible external torque, spin rate:","o":["Decreases","Increases","Remains exactly the same","Must become zero"],"a":0,"e":"Increasing I requires decreasing ω to keep Iω constant."},{"q":"The dimensional formula of angular momentum is:","o":["ML²T⁻¹","ML²T⁻²","MLT⁻¹","MLT⁻²"],"a":0,"e":"Angular momentum = moment of inertia × angular velocity."},{"q":"A particle moves radially toward a point. Its angular momentum about that point is:","o":["Zero","Maximum","Equal to its linear momentum","Infinite"],"a":0,"e":"Position and momentum are parallel, so r × p = 0."},{"q":"If net external torque is nonzero, total angular momentum generally:","o":["Changes with time","Must remain constant","Must be zero","Cannot be measured"],"a":0,"e":"A nonzero net external torque changes total angular momentum."},{"q":"A skater's I decreases from 4 to 1.6 kg m². Initial ω is 2 rad s⁻¹. Find final ω if angular momentum is conserved.","o":["5 rad s⁻¹","3.2 rad s⁻¹","0.8 rad s⁻¹","2.5 rad s⁻¹"],"a":0,"e":"ω₂ = (4×2)/1.6 = 5 rad s⁻¹."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Conservation of Angular Momentum Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
