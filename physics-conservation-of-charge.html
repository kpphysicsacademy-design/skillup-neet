C of charge by transfer from another body, the other body’s charge changes by…","o":["+3 C","−3 C","0 C","+6 C"],"a":1,"e":"Charge transfer is equal and opposite: the donor loses the charge gained by the recipient."},{"q":"A conductor with charge −4 μC is connected to an identical neutral conductor. After contact and separation, each has…","o":["−4 μC","−2 μC","+2 μC","0 μC"],"a":1,"e":"Total charge −4 μC is shared equally, giving −2 μC on each sphere."},{"q":"A system starts with total charge zero. If one part ends with +9 μC, the remaining part must have total charge…","o":["+9 μC","−9 μC","0 μC","+18 μC"],"a":1,"e":"The total remains zero, so the other part must carry −9 μC."},{"q":"Which process illustrates conservation of charge?","o":["Creating net charge from nothing","Transferring electrons between two bodies","Destroying all charge in a closed system","Changing a proton into energy by rubbing"],"a":1,"e":"Electron transfer redistributes charge without changing the total charge."},{"q":"Two identical spheres carry +10 nC and −4 nC. They touch and separate. Charge on each is…","o":["+7 nC","+6 nC","+3 nC","−3 nC"],"a":2,"e":"Total charge is +6 nC; identical spheres share it equally, so each has +3 nC."},{"q":"A body gains \\(2\\times10^{12}\\) electrons. Its charge change is approximately…","o":["\\(+3.2\\times10^{-7}\\,\\text{C}\\)","\\(-3.2\\times10^{-7}\\,\\text{C}\\)","\\(-3.2\\times10^{-19}\\,\\text{C}\\)","\\(+1.6\\times10^{-7}\\,\\text{C}\\)"],"a":1,"e":"\\(\\Delta Q=-ne=-(2\\times10^{12})(1.6\\times10^{-19})=-3.2\\times10^{-7}\\,\\text{C}\\)."},{"q":"A body loses \\(5\\times10^{10}\\) electrons. Its charge change is approximately…","o":["\\(-8.0\\times10^{-9}\\,\\text{C}\\)","\\(+8.0\\times10^{-9}\\,\\text{C}\\)","\\(+5.0\\times10^{-10}\\,\\text{C}\\)","Zero"],"a":1,"e":"Losing electrons makes the body positive: \\(\\Delta Q=(5\\times10^{10})(1.6\\times10^{-19})=+8.0\\times10^{-9}\\,\\text{C}\\)."},{"q":"In an isolated system, a positive charge can be neutralized only if…","o":["Opposite charge is brought or transferred to it","Charge conservation stops applying","The positive charge disappears without a trace","The object becomes heavier"],"a":0,"e":"Neutralization occurs by transfer or redistribution of opposite charge, preserving total charge."},{"q":"A neutral atom becomes a positive ion by…","o":["Gaining electrons","Losing electrons","Gaining neutrons only","Losing protons in ordinary ionization"],"a":1,"e":"A positive ion forms when an atom loses one or more electrons."},{"q":"A neutral atom becomes a negative ion by…","o":["Losing electrons","Gaining electrons","Losing neutrons","Gaining protons only"],"a":1,"e":"A negative ion forms when an atom gains one or more electrons."},{"q":"Two objects exchange electrons in an isolated setup. The sum of their charge changes is…","o":["Positive","Negative","Zero","Always twice the electron charge"],"a":2,"e":"One object loses the electrons the other gains, so the charge changes sum to zero."},{"q":"A system has initial charge −12 μC. Internal rearrangement moves charge between its parts. Its final total charge is…","o":["+12 μC","0 μC","−12 μC","Depends on shape"],"a":2,"e":"Internal redistribution does not change the system's total charge."},{"q":"Which statement is correct for charge conservation?","o":["Each object’s charge must stay fixed","Total charge stays constant in an isolated system","Positive charge is always conserved but negative charge is not","Charge is conserved only in conductors"],"a":1,"e":"Individual objects can gain or lose charge, but the total of an isolated system is constant."},{"q":"A +2 μC body and a −2 μC body are placed together in an isolated system. The system’s net charge is…","o":["+4 μC","+2 μC","0 μC","−4 μC"],"a":2,"e":"Equal and opposite charges sum to zero."},{"q":"A body has charge +4e and receives 6 electrons. Its final charge is…","o":["+10e","−2e","−6e","−2e"],"a":1,"e":"Each electron changes charge by −e, so \\(Q_f=+4e-6e=-2e\\)."},{"q":"A body has charge −3e and loses 5 electrons. Its final charge is…","o":["+2e","−8e","+8e","−2e"],"a":0,"e":"Losing five electrons adds +5e: \\(Q_f=-3e+5e=+2e\\)."},{"q":"A charged rod attracts a neutral pith ball. This necessarily means charge was created in the pith ball?","o":["Yes, attraction creates charge","No, charge can redistribute by polarization","Yes, the rod transfers protons instantly","No, because neutral objects cannot be attracted"],"a":1,"e":"Polarization separates existing charges slightly; the net charge of the pith ball can remain zero."},{"q":"A +12 nC sphere touches an identical −2 nC sphere. The final charge on each is…","o":["+10 nC","+5 nC","+7 nC","−5 nC"],"a":1,"e":"Total charge is +10 nC, shared equally: +5 nC on each sphere."},{"q":"A system has three objects with charges +2 C, +3 C, and −1 C. If charge is transferred internally, the total remains…","o":["+4 C","+6 C","−4 C","0 C"],"a":0,"e":"The initial algebraic total is \\(2+3-1=+4\\,\\text{C}\\), which remains constant."},{"q":"Which situation violates charge conservation for an isolated system?","o":["A neutral pair separates into +q and −q","Electrons move from one object to another","The total charge changes from +3 C to +5 C without external transfer","Two identical charged spheres share charge on contact"],"a":2,"e":"Without external charge entering or leaving, the total charge cannot change from +3 C to +5 C."},{"q":"When a charged capacitor is discharged through a wire, the net charge of the complete isolated capacitor-wire system…","o":["Must increase","Must decrease","Remains conserved","Becomes positive"],"a":2,"e":"Charge flows between parts of the system; the total charge of the complete isolated system is conserved."}];
