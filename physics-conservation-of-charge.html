<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Conservation of Charge</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>⚡ Conservation of Charge</h1>
<div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="quiz"></div><div class="xp" id="xp"></div>
<button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div>
<a class="back" href="physics-home-fast.html">← Back to Physics Path</a>
</div></div>
<script>
const qs=[
['The law of conservation of electric charge states that the total charge of an isolated system','always increases','always decreases','remains constant','is always zero',2,'Electric charge can be transferred between bodies, but the algebraic sum of charge in an isolated system remains constant.'],
['Electric charge can be','created from nothing in an isolated system','destroyed completely in an isolated system','transferred from one body to another','changed into mass without restriction',2,'Charge is conserved, so it can be transferred between bodies but cannot be created or destroyed in an isolated system.'],
['If a neutral body gains electrons, its net charge becomes','positive','negative','zero always','infinite',1,'Electrons carry negative charge, so gaining electrons gives the body a net negative charge.'],
['If a neutral body loses electrons, its net charge becomes','positive','negative','zero always','unchanged',0,'Removing negatively charged electrons leaves an excess of positive charge, so the body becomes positively charged.'],
['A positively charged body has','an excess of electrons','a deficit of electrons','equal numbers of electrons and protons only','no protons',1,'A positive charge results when a body has fewer electrons than protons.'],
['Two bodies have charges +5 μC and −2 μC. Their total charge is','+7 μC','+3 μC','−3 μC','−7 μC',1,'The algebraic sum is (+5)+(−2)=+3 μC.'],
['A system initially has total charge +8 μC. If no charge enters or leaves the isolated system, the final total charge is','0 μC','+4 μC','+8 μC','−8 μC',2,'For an isolated system, total charge remains unchanged.'],
['A body has charge −3.2×10⁻¹⁹ C. The number of excess electrons is','1','2','3','4',1,'n=|q|/e=(3.2×10⁻¹⁹)/(1.6×10⁻¹⁹)=2 excess electrons.'],
['When two charged bodies are brought into contact, charge generally','disappears','is redistributed between the bodies','is created from nothing','always becomes zero',1,'Charge may flow between the bodies until an appropriate charge distribution is established; total charge is conserved.'],
['Two identical conducting spheres carry +6 μC and −2 μC. They are touched and then separated. The charge on each sphere is','+2 μC','+4 μC','−2 μC','+8 μC',0,'Total charge is +4 μC. Identical spheres share it equally, giving +2 μC on each sphere.'],
['A charged capacitor is connected to another initially uncharged isolated capacitor. Ignoring external leakage, the total charge of the two-capacitor system','is conserved','becomes zero','doubles','is destroyed',0,'Charge redistributes between the capacitors, but the total charge of the isolated system remains conserved.'],
['Which process demonstrates transfer rather than creation of electric charge?','Charging by friction','Creating electrons from nothing','Destroying all electrons','Changing a neutral object into energy only',0,'Charging by friction transfers electrons from one material to another; the total charge remains conserved.'],
['If a system contains charges +4 C, −7 C and +5 C, its net charge is','+2 C','−2 C','+16 C','−16 C',0,'Net charge=(+4)+(−7)+(+5)=+2 C.'],
['During electrostatic induction in an isolated conductor, the total charge of the conductor','changes automatically','remains unchanged while charges redistribute','always becomes positive','always becomes negative',1,'Induction causes redistribution of existing charges inside the conductor without changing its net charge when the conductor is isolated.'],
['In any interaction involving electric charges, the most fundamental charge-conservation statement is','charge may be created without limit','charge may be destroyed without limit','the algebraic sum of charge is conserved','only positive charge is conserved',2,'The total algebraic electric charge is conserved in an isolated system.']
];
let i=0,score=0,answered=false;const $=x=>document.getElementById(x);
function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}
function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}
function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();
</script>
</body>
</html>
