<style>

.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>📏 Conservation of Mechanical Energy</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
  {
    "q": "Mechanical energy is the sum of:",
    "o": [
      "Kinetic and potential energies",
      "Force and momentum",
      "Power and work",
      "Mass and acceleration"
    ],
    "a": 0,
    "e": "Mechanical energy E = K + U."
  },
  {
    "q": "When only conservative forces do work in an isolated system, total mechanical energy:",
    "o": [
      "Always increases",
      "Always decreases",
      "Remains constant",
      "Becomes zero"
    ],
    "a": 2,
    "e": "Kinetic and potential energy exchange while their sum stays constant."
  },
  {
    "q": "A 2 kg object moves at 3 m/s and is 4 m above the reference level. Take g = 10 m/s². Its mechanical energy is:",
    "o": [
      "9 J",
      "40 J",
      "49 J",
      "89 J"
    ],
    "a": 3,
    "e": "K = 9 J and U = 80 J, so E = 89 J."
  },
  {
    "q": "A body falls freely from rest, neglecting air resistance. As it falls, its gravitational potential energy:",
    "o": [
      "Changes into kinetic energy",
      "Changes into mass",
      "Remains fixed while speed rises",
      "Is destroyed"
    ],
    "a": 0,
    "e": "The decrease in gravitational potential energy becomes kinetic energy."
  },
  {
    "q": "At the highest point of a ball thrown vertically upward, its kinetic energy is:",
    "o": [
      "Maximum",
      "Zero",
      "Equal to initial kinetic energy",
      "Negative"
    ],
    "a": 1,
    "e": "At the instant v = 0, K = ½mv² = 0."
  },
  {
    "q": "A 1 kg object is dropped from 20 m. Neglect air resistance and use g = 10 m/s². Its speed just before reaching the ground is:",
    "o": [
      "10 m/s",
      "14.1 m/s",
      "20 m/s",
      "200 m/s"
    ],
    "a": 2,
    "e": "mgh = ½mv², so v = √(2gh) = 20 m/s."
  },
  {
    "q": "A roller coaster descends without friction. Which quantity remains constant?",
    "o": [
      "Speed",
      "Height",
      "Kinetic energy alone",
      "Total mechanical energy"
    ],
    "a": 3,
    "e": "Without friction, total mechanical energy is conserved."
  },
  {
    "q": "A 0.5 kg ball moving at 4 m/s has kinetic energy:",
    "o": [
      "2 J",
      "4 J",
      "8 J",
      "16 J"
    ],
    "a": 1,
    "e": "K = ½ × 0.5 × 4² = 4 J."
  },
  {
    "q": "A spring-loaded block moves on a frictionless surface. During release, spring potential energy is converted mainly into:",
    "o": [
      "Kinetic energy",
      "Thermal energy only",
      "Chemical energy",
      "Gravitational field strength"
    ],
    "a": 0,
    "e": "Ideal spring energy converts into kinetic energy."
  },
  {
    "q": "If non-conservative forces do net work on a system, the change in mechanical energy equals:",
    "o": [
      "The net work of non-conservative forces",
      "Always zero",
      "The change in mass",
      "The negative of total kinetic energy"
    ],
    "a": 0,
    "e": "Δ(K + U) = W of non-conservative forces."
  },
  {
    "q": "A 2 kg object is raised 5 m at constant speed. Use g = 10 m/s². Its increase in potential energy is:",
    "o": [
      "10 J",
      "25 J",
      "100 J",
      "200 J"
    ],
    "a": 2,
    "e": "ΔU = mgh = 100 J."
  },
  {
    "q": "A body has 50 J of mechanical energy and 18 J of potential energy. Its kinetic energy is:",
    "o": [
      "18 J",
      "32 J",
      "50 J",
      "68 J"
    ],
    "a": 1,
    "e": "K = E − U = 32 J."
  },
  {
    "q": "A 1 kg stone is released from 5 m. At a height of 2 m, its speed is (g = 10 m/s²):",
    "o": [
      "√10 m/s",
      "√30 m/s",
      "2√15 m/s",
      "10 m/s"
    ],
    "a": 2,
    "e": "It falls 3 m, so v = √(2 × 10 × 3) = 2√15 m/s."
  },
  {
    "q": "At which position does an ideal simple pendulum have maximum kinetic energy?",
    "o": [
      "At either extreme",
      "At the lowest point",
      "At every point equally",
      "At rest position above the pivot"
    ],
    "a": 1,
    "e": "Speed is maximum at the lowest point."
  },
  {
    "q": "A 3 kg object moving at 2 m/s is at a height of 1 m. With g = 10 m/s², its mechanical energy is:",
    "o": [
      "6 J",
      "30 J",
      "36 J",
      "66 J"
    ],
    "a": 2,
    "e": "K = 6 J and U = 30 J, giving 36 J."
  },
  {
    "q": "An object slides down a frictionless incline. The normal force does no work because it is:",
    "o": [
      "Always zero",
      "Perpendicular to displacement",
      "Equal to gravity",
      "Opposite to velocity"
    ],
    "a": 1,
    "e": "Work is zero when force is perpendicular to displacement."
  },
  {
    "q": "A 2 kg object falls 3 m. Neglect air resistance and take g = 10 m/s². The decrease in potential energy is:",
    "o": [
      "6 J",
      "15 J",
      "30 J",
      "60 J"
    ],
    "a": 3,
    "e": "mgΔh = 2 × 10 × 3 = 60 J."
  },
  {
    "q": "For an ideal mass-spring oscillator, total mechanical energy is:",
    "o": [
      "½kA²",
      "kA²",
      "½mv² at all times",
      "Zero at equilibrium"
    ],
    "a": 0,
    "e": "At amplitude A, E = ½kA² and remains constant."
  },
  {
    "q": "At the equilibrium position of an ideal spring-mass oscillator, spring potential energy (zero at natural length) is:",
    "o": [
      "Maximum",
      "Zero",
      "Equal to total energy",
      "Negative"
    ],
    "a": 1,
    "e": "At x = 0, U = ½kx² = 0."
  },
  {
    "q": "A 4 kg object has kinetic energy 72 J. Its speed is:",
    "o": [
      "3 m/s",
      "4 m/s",
      "6 m/s",
      "9 m/s"
    ],
    "a": 2,
    "e": "v = √(2K/m) = √36 = 6 m/s."
  },
  {
    "q": "A body is dropped from rest and reaches the ground at 20 m/s. Neglecting air resistance, its initial height is (g = 10 m/s²):",
    "o": [
      "10 m",
      "20 m",
      "40 m",
      "200 m"
    ],
    "a": 1,
    "e": "h = v²/(2g) = 20 m."
  },
  {
    "q": "A 1 kg object has 100 J of mechanical energy and 40 J of kinetic energy. Its potential energy is:",
    "o": [
      "40 J",
      "60 J",
      "100 J",
      "140 J"
    ],
    "a": 1,
    "e": "U = E − K = 60 J."
  },
  {
    "q": "Which force is non-conservative in ordinary sliding motion?",
    "o": [
      "Gravity",
      "Ideal spring force",
      "Kinetic friction",
      "Electrostatic force in a static field"
    ],
    "a": 2,
    "e": "Kinetic friction converts mechanical energy into thermal energy."
  },
  {
    "q": "A 2 kg object moving at 5 m/s slides to rest due to friction. The work done by friction is:",
    "o": [
      "+25 J",
      "−25 J",
      "+50 J",
      "−50 J"
    ],
    "a": 1,
    "e": "W = ΔK = 0 − 25 = −25 J."
  },
  {
    "q": "A 10 kg object is lifted 2 m. With g = 9.8 m/s², the gain in potential energy is:",
    "o": [
      "19.6 J",
      "49 J",
      "98 J",
      "196 J"
    ],
    "a": 3,
    "e": "ΔU = 10 × 9.8 × 2 = 196 J."
  },
  {
    "q": "In a system with friction, total mechanical energy usually:",
    "o": [
      "Is conserved exactly",
      "Decreases as some energy becomes thermal",
      "Increases without energy input",
      "Equals potential energy only"
    ],
    "a": 1,
    "e": "Friction commonly converts mechanical energy into thermal energy."
  },
  {
    "q": "A 2 kg block starts from rest at height 5 m and slides frictionlessly to height 1 m. Its speed at 1 m is (g = 10 m/s²):",
    "o": [
      "2√5 m/s",
      "4√5 m/s",
      "8 m/s",
      "10 m/s"
    ],
    "a": 1,
    "e": "v = √(2gΔh) = √80 = 4√5 m/s."
  },
  {
    "q": "A ball is launched upward with kinetic energy 100 J. At its highest point, neglecting air resistance, its gain in gravitational potential energy is:",
    "o": [
      "0 J",
      "50 J",
      "100 J",
      "200 J"
    ],
    "a": 2,
    "e": "Initial kinetic energy converts to gravitational potential energy."
  },
  {
    "q": "A 1 kg object falls from rest through 10 m with no air resistance. Its kinetic energy just before impact is:",
    "o": [
      "10 J",
      "50 J",
      "100 J",
      "200 J"
    ],
    "a": 2,
    "e": "The lost potential energy mgh = 100 J becomes kinetic energy."
  },
  {
    "q": "A 2 kg object at height 6 m has speed 4 m/s. With g = 10 m/s², its total mechanical energy is:",
    "o": [
      "80 J",
      "104 J",
      "120 J",
      "136 J"
    ],
    "a": 3,
    "e": "U = 120 J and K = 16 J, so E = 136 J."
  }
];
let index=0,score=0,streak=0,chosen=null,locked=false;
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Nice work!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><button class="btn" id="retry">Practice again</button>';
 $('finishSlot').replaceChildren(card);$('retry').addEventListener('click',()=>{index=0;score=0;streak=0;$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
