<main>
<section class="hero"><h1>📏 Conservation of Momentum</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>

<script>
(function(){
'use strict';
const questions = [{"q":"The law of conservation of momentum states that total momentum of an isolated system:","o":["Remains constant","Always increases","Always decreases","Becomes zero after collision"],"a":0,"e":"If net external force is zero, total momentum of the system remains constant."},{"q":"Momentum is conserved when the net external force on the system is:","o":["Zero","Maximum","Always downward","Equal to internal force"],"a":0,"e":"Momentum conservation applies to an isolated system with zero net external force."},{"q":"Two objects interact in an isolated system. Their total momentum before interaction is 12 kg·m/s. After interaction it is:","o":["12 kg·m/s","0 kg·m/s always","24 kg·m/s always","Impossible to determine at all"],"a":0,"e":"Internal forces can redistribute momentum, but the total remains 12 kg·m/s."},{"q":"A 2 kg cart moves at 4 m/s and collides with a stationary 2 kg cart. They stick together. Their final velocity is:","o":["2 m/s","4 m/s","1 m/s","8 m/s"],"a":0,"e":"Conservation gives v = (2×4 + 2×0)/(2+2) = 2 m/s."},{"q":"A 1 kg trolley moving at 6 m/s couples with a stationary 2 kg trolley. Final speed is:","o":["2 m/s","3 m/s","6 m/s","1 m/s"],"a":0,"e":"Final velocity = initial momentum/total mass = 6/(1+2) = 2 m/s."},{"q":"A 3 kg body moving at 2 m/s collides and sticks to a 1 kg body at rest. Their final speed is:","o":["1.5 m/s","2 m/s","3 m/s","6 m/s"],"a":0,"e":"v = (3×2 + 1×0)/(3+1) = 6/4 = 1.5 m/s."},{"q":"A 2 kg object moves right at 5 m/s and a 3 kg object moves left at 2 m/s. Taking right as positive, total momentum is:","o":["4 kg·m/s","16 kg·m/s","−4 kg·m/s","0 kg·m/s"],"a":0,"e":"p_total = 2(5) + 3(−2) = 10 − 6 = 4 kg·m/s to the right."},{"q":"A gun fires a bullet forward. The gun recoils backward because:","o":["Total momentum is conserved","The bullet has no momentum","Gravity acts only on the gun","Energy must be destroyed"],"a":0,"e":"The bullet gains forward momentum and the gun gains equal opposite momentum, assuming negligible external impulse."},{"q":"A 0.02 kg bullet moves at 300 m/s. Its momentum is:","o":["6 kg·m/s","15 kg·m/s","0.06 kg·m/s","300 kg·m/s"],"a":0,"e":"p = mv = 0.02 × 300 = 6 kg·m/s."},{"q":"A 4 kg object at rest explodes into two pieces. One 1 kg piece moves right at 8 m/s. The 3 kg piece moves:","o":["Left at 8/3 m/s","Right at 8/3 m/s","Left at 8 m/s","Right at 8 m/s"],"a":0,"e":"Initial momentum is zero: 1(8) + 3v = 0, so v = −8/3 m/s."},{"q":"Two skaters initially at rest push apart on frictionless ice. Their total momentum after pushing is:","o":["Zero","Positive","Negative","Twice their combined mass"],"a":0,"e":"They acquire equal and opposite momenta, so total momentum remains zero."},{"q":"A 2 kg body moving at 3 m/s collides with a 1 kg body at rest. If they stick together, final velocity is:","o":["2 m/s","1 m/s","3 m/s","6 m/s"],"a":0,"e":"v = (2×3)/(2+1) = 2 m/s."},{"q":"A 1 kg object moving at 4 m/s collides elastically head-on with an identical stationary object. For an ideal one-dimensional elastic collision, the first object ends with velocity:","o":["0 m/s","2 m/s","4 m/s","−4 m/s"],"a":0,"e":"For equal masses in a one-dimensional elastic collision, velocities exchange; the first object stops."},{"q":"In a perfectly inelastic collision, the objects:","o":["Stick together after collision","Must rebound with the same speed","Have no momentum after collision","Always conserve kinetic energy"],"a":0,"e":"In a perfectly inelastic collision, the objects stick together; momentum is conserved, but kinetic energy is not generally conserved."},{"q":"In an isolated collision, which quantity is always conserved?","o":["Total momentum","Kinetic energy in every collision","Speed of each object","Each object's momentum separately"],"a":0,"e":"Total momentum is conserved in isolated collisions; kinetic energy is conserved only in elastic collisions."},{"q":"A 2 kg object moving at 6 m/s collides with a stationary 4 kg object and they stick. Their final speed is:","o":["2 m/s","3 m/s","6 m/s","1 m/s"],"a":0,"e":"v = (2×6)/(2+4) = 12/6 = 2 m/s."},{"q":"An object of mass 5 kg moves at 2 m/s. Its momentum is:","o":["10 kg·m/s","7 kg·m/s","2.5 kg·m/s","25 kg·m/s"],"a":0,"e":"p = mv = 5 × 2 = 10 kg·m/s."},{"q":"A 2 kg object has momentum 10 kg·m/s. Its velocity is:","o":["5 m/s","20 m/s","8 m/s","12 m/s"],"a":0,"e":"v = p/m = 10/2 = 5 m/s."},{"q":"If total initial momentum of an isolated system is +8 kg·m/s, total final momentum is:","o":["+8 kg·m/s","−8 kg·m/s","0 kg·m/s","+16 kg·m/s"],"a":0,"e":"The total momentum remains +8 kg·m/s in the absence of net external force."},{"q":"A 0.5 kg ball moving right at 10 m/s hits a wall and rebounds left at 6 m/s. Taking right as positive, its momentum change is:","o":["−8 kg·m/s","+2 kg·m/s","−2 kg·m/s","+8 kg·m/s"],"a":0,"e":"Δp = m(v − u) = 0.5(−6 − 10) = −8 kg·m/s."},{"q":"A 1 kg object moving right at 3 m/s and a 2 kg object moving left at 1 m/s stick together. Their final velocity is:","o":["1/3 m/s to the right","1 m/s to the left","5/3 m/s to the right","0 m/s"],"a":0,"e":"p = 1(3) + 2(−1) = 1; total mass = 3 kg, so v = 1/3 m/s right."},{"q":"A 2 kg body moving at 4 m/s collides with a 2 kg body moving at 2 m/s in the same direction. If they stick together, final speed is:","o":["3 m/s","2 m/s","4 m/s","6 m/s"],"a":0,"e":"v = (2×4 + 2×2)/(2+2) = 12/4 = 3 m/s."},{"q":"A 3 kg object moving right at 4 m/s collides with a 1 kg object moving left at 2 m/s and they stick. Final velocity is:","o":["2.5 m/s right","1 m/s left","3.5 m/s right","2 m/s left"],"a":0,"e":"p = 3(4) + 1(−2) = 10; total mass 4 kg, so v = 2.5 m/s right."},{"q":"A 2 kg object at rest explodes into two equal 1 kg pieces. One moves right at 5 m/s. The other moves:","o":["Left at 5 m/s","Right at 5 m/s","Left at 2.5 m/s","At rest"],"a":0,"e":"Initial momentum is zero; equal masses must have equal and opposite velocities."},{"q":"The impulse of an external force on a system equals the change in its:","o":["Total momentum","Total mass","Total position","Number of objects"],"a":0,"e":"External impulse changes the system's total momentum: J_external = ΔP_total."},{"q":"A 2 kg cart moving at 3 m/s experiences an external impulse of +4 N·s in the same direction. Its final velocity is:","o":["5 m/s","1 m/s","2 m/s","7 m/s"],"a":0,"e":"Initial p = 6; final p = 6 + 4 = 10 kg·m/s, so v = 10/2 = 5 m/s."},{"q":"A 1 kg object moving at 8 m/s collides and sticks to a 3 kg object moving at 0 m/s. The fraction of initial kinetic energy lost is:","o":["3/4","1/2","1/4","0"],"a":0,"e":"Initial K = ½×1×64 = 32 J. Final speed = 2 m/s; final K = ½×4×4 = 8 J. Lost fraction = (32−8)/32 = 3/4."},{"q":"A 2 kg object moving at 4 m/s collides elastically head-on with a 2 kg object at rest. After collision, the first object's velocity is:","o":["0 m/s","2 m/s","4 m/s","−4 m/s"],"a":0,"e":"For equal masses in a one-dimensional elastic collision, velocities exchange, so the first object stops."},{"q":"Two bodies have momenta +6 kg·m/s and −6 kg·m/s. Their total momentum is:","o":["0 kg·m/s","12 kg·m/s","−12 kg·m/s","6 kg·m/s"],"a":0,"e":"Opposite signed momenta of equal magnitude add to zero."},{"q":"A 4 kg object moving at 3 m/s sticks to a 2 kg object moving at 0 m/s. Their final speed is:","o":["2 m/s","1 m/s","3 m/s","6 m/s"],"a":0,"e":"v = (4×3)/(4+2) = 12/6 = 2 m/s."},{"q":"Why can kinetic energy decrease during a perfectly inelastic collision even though momentum is conserved?","o":["Some kinetic energy converts to heat, sound or deformation","Momentum conservation requires kinetic energy to vanish","The total mass decreases","The collision creates external momentum"],"a":0,"e":"Momentum remains conserved in an isolated system, while some kinetic energy converts into other forms."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Nice work!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><button class="btn" id="retry">Practice again</button>';
 $('finishSlot').replaceChildren(card);$('retry').addEventListener('click',()=>{index=0;score=0;streak=0;$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
