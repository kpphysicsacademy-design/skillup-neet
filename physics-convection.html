.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}

.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🌬️ Convection</h1><p class="muted">Learn natural and forced convection, convection currents, sea breezes and everyday applications.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"What is convection?",o:["Heat transfer by bulk movement of a fluid","Heat transfer only through solids","Heat transfer by electromagnetic waves only","No transfer of energy"],a:0,e:"Convection transfers heat through the motion of a liquid or gas."},
{q:"Convection occurs mainly in:",o:["Vacuum","Liquids and gases","Rigid solids only","Perfectly empty space"],a:1,e:"Fluids can move in bulk, enabling convection."},
{q:"When a fluid is heated, it often rises because it:",o:["Becomes heavier at the same volume","Stops moving","Expands, becomes less dense and rises","Loses all internal energy"],a:2,e:"Heating often lowers fluid density, so warmer fluid rises in a gravitational field."},
{q:"The circulation of warm and cool fluid caused by density differences is called:",o:["Conduction","Radiation","Sublimation","A convection current"],a:3,e:"Convection currents are driven by buoyancy and density differences."},
{q:"Sea breeze during the day develops mainly because:",o:["Land heats faster than sea, causing air to rise over land","Sea heats faster than land in every case","Air stops moving over the coast","The Sun directly pulls air inland"],a:0,e:"Land warms faster, warm air rises over land and cooler sea air moves inland."},
{q:"Land breeze is most common at night because:",o:["Sea cools faster than land","Land cools faster than sea, so air moves from land toward sea","Air has no density","The ocean stops transferring heat"],a:1,e:"Land loses heat faster at night; cooler air over land flows toward relatively warmer sea air."},
{q:"Which example is mainly convection?",o:["A metal rod heating along its length","Sunlight warming the Earth","Warm air circulating in a room","A spoon conducting heat"],a:2,e:"Bulk motion of air carries thermal energy through the room."},
{q:"Why are heaters often placed near the floor?",o:["Hot air always sinks","To prevent air movement","Because convection cannot occur above them","Warm air rises and helps circulate heat through the room"],a:3,e:"Air warmed near the floor rises, promoting circulation."},
{q:"Why are air vents for hot air often placed near the ceiling?",o:["Warm air rises and accumulates higher up","Cold air always rises","Heat can move only upward by conduction","Vents generate heat"],a:0,e:"Warm air tends to rise, so high vents can allow it to escape."},
{q:"Convection cannot transfer heat across a perfect vacuum because:",o:["Vacuum is too dense","There is no fluid to move","Gravity is absent everywhere","Temperature cannot exist in space"],a:1,e:"Convection requires a moving fluid; a perfect vacuum contains no fluid."},
{q:"A convection current is often initiated by:",o:["A colour change","A chemical change only","A temperature-caused density difference","The absence of gravity in every case"],a:2,e:"Density differences create buoyancy forces that drive fluid circulation."},
{q:"Which is an example of natural convection?",o:["A fan forcing air through a duct","A pump circulating coolant","A mechanical stirrer mixing liquid","Warm water rising above cooler water in a pot"],a:3,e:"Natural convection occurs when buoyancy drives fluid motion without a fan or pump."},
{q:"Forced convection occurs when fluid motion is produced by:",o:["A fan or pump","Density differences alone","No external influence at all","A vacuum"],a:0,e:"Fans and pumps mechanically drive fluid flow in forced convection."},
{q:"In a room, a ceiling fan cools people mainly by:",o:["Lowering room temperature instantly","Increasing air movement and evaporation from skin","Removing all heat from the room","Stopping convection"],a:1,e:"Air movement increases convective and evaporative heat loss from skin."},
{q:"Why does boiling water circulate in a pot?",o:["The bottom water becomes denser and sinks","Water stops transferring heat","Heated water rises while cooler water sinks","Only radiation moves water"],a:2,e:"Buoyancy creates circulation as warmer, less-dense water rises."},
{q:"The main driving force for natural convection in a fluid is:",o:["Magnetism","Surface colour","Electrical resistance","Buoyancy due to density differences in gravity"],a:3,e:"Density differences in a gravitational field produce buoyancy-driven flow."},
{q:"Which statement distinguishes convection from conduction?",o:["Convection involves bulk fluid movement","Convection happens only in solids","Conduction requires fluid circulation","They are exactly identical"],a:0,e:"Convection relies on fluid motion, unlike conduction through microscopic interactions."},
{q:"Hot air balloons rise because heated air inside the balloon is:",o:["More dense than surrounding air","Less dense than surrounding air","Without mass","Always colder"],a:1,e:"The lower density of the heated air creates net buoyancy."},
{q:"In a coastal region, a sea breeze generally blows:",o:["From land to sea during daytime","Vertically downward only","From sea toward land during daytime","Only during winter nights"],a:2,e:"Daytime heating of land encourages cooler sea air to move inland."},
{q:"Why does convection occur less effectively in microgravity?",o:["Fluids cannot contain heat","All molecules stop moving","The fluid becomes a solid","Buoyancy-driven circulation is greatly reduced"],a:3,e:"Without a strong gravitational field, density differences produce much weaker buoyancy currents."},
{q:"A radiator warms a room mainly by:",o:["Warming nearby air, which circulates by convection","Cooling all air immediately","Creating a vacuum","Removing air molecules"],a:0,e:"Air warmed near the radiator rises and cooler air replaces it."},
{q:"Which situation is an example of forced convection?",o:["Warm air rising over a hot road","A pump moving hot water through pipes","Warm water rising in a pan without stirring","Sea breeze due to land heating"],a:1,e:"A pump imposes fluid motion, making the heat transfer forced convection."},
{q:"The fluid that rises in a natural convection current is usually:",o:["The coolest and densest fluid","The fluid with no thermal energy","Warmer and less dense fluid","Always the fluid at the bottom by definition"],a:2,e:"Heating often makes fluid less dense, so it rises under buoyancy."},
{q:"Why can a convection current transfer heat over a distance?",o:["The fluid is chemically consumed","The fluid has no mass","Only light travels with it","Moving fluid carries internal energy from place to place"],a:3,e:"Bulk fluid motion transports thermal energy through the fluid."},
{q:"Which is not a typical requirement for natural convection?",o:["A fluid and a driving density difference","A perfect vacuum with no matter","A temperature difference","Gravity or another body force that enables buoyancy"],a:0,e:"Natural convection needs fluid motion; a perfect vacuum has no fluid to circulate."},
{q:"A fan-assisted oven cooks food more evenly because the fan:",o:["Stops all heat transfer","Moves hot air around the food","Makes air a solid","Removes the oven's thermal energy"],a:1,e:"Forced circulation reduces temperature differences within the oven."},
{q:"Which process explains large-scale circulation in the Earth's atmosphere?",o:["Conduction through solid rock only","Nuclear fusion in clouds","Convection driven by uneven heating","Sound waves alone"],a:2,e:"Uneven solar heating creates temperature and density differences that drive atmospheric circulation."},
{q:"A chimney draws smoke upward partly because:",o:["Smoke is always colder than air","Gravity pushes all gases upward","There is no pressure difference","Hot gases rise and create a buoyancy-driven flow"],a:3,e:"Hot, less-dense gases rise through the chimney, helping draw in replacement air."},
{q:"Why does warm fluid rise in ordinary natural convection?",o:["Its density becomes lower than the surrounding cooler fluid","Its mass becomes zero","It stops interacting with gravity","Its pressure must be zero"],a:0,e:"For the same pressure, heating usually lowers density, creating buoyancy."},
{q:"Which summary is correct?",o:["Convection transfers heat only through solids","Convection transfers heat by movement of fluids","Convection requires no matter in every case","Convection and radiation are identical"],a:1,e:"Convection involves fluid motion; radiation can travel through a vacuum."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Pascal&#39;s Law Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
