const questions = [{"q":"Coulomb’s law gives the electrostatic force between…","o":["Two point charges","Two neutral objects only","Two magnets only","Two masses only"],"a":0,"e":"Coulomb’s law describes the electrostatic force between point charges at rest."},{"q":"The magnitude of the electrostatic force between point charges is…","o":["\\(F=k\\frac{|q_1q_2|}{r^2}\\)","\\(F=k\\frac{|q_1q_2|}{r}\\)","\\(F=kr^2|q_1q_2|\\)","\\(F=k\\frac{r^2}{|q_1q_2|}\\)"],"a":0,"e":"The force magnitude follows the inverse-square law: \\(F=k|q_1q_2|/r^2\\)."},{"q":"In vacuum, Coulomb’s constant k is approximately…","o":["\\(8.99\\times10^9\\,\\text{N m}^2/\\text{C}^2\\)","\\(9.8\\,\\text{m/s}^2\\)","\\(6.67\\times10^{-11}\\)","\\(1.6\\times10^{-19}\\)"],"a":0,"e":"\\(k=1/(4\\pi\\varepsilon_0)\\approx8.99\\times10^9\\,\\text{N m}^2/\\text{C}^2\\)."},{"q":"If the distance between two charges doubles, the force becomes…","o":["Twice as large","Half as large","One-fourth as large","Four times as large"],"a":2,"e":"Because \\(F\\propto1/r^2\\), doubling r reduces force to \\(1/4\\)."},{"q":"If the distance between two charges is halved, the force becomes…","o":["Half","Double","Four times","One-fourth"],"a":2,"e":"Halving distance increases force by \\(1/(1/2)^2=4\\)."},{"q":"If one charge is doubled and all else stays fixed, the force magnitude…","o":["Halves","Doubles","Quadruples","Stays unchanged"],"a":1,"e":"Coulomb force is directly proportional to each charge magnitude."},{"q":"If both charge magnitudes are doubled, the force becomes…","o":["Twice","Four times","Half","Unchanged"],"a":1,"e":"The product \\(|q_1q_2|\\) becomes four times larger."},{"q":"Like point charges exert a force that is…","o":["Attractive","Repulsive","Always zero","Only gravitational"],"a":1,"e":"Charges with the same sign repel one another."},{"q":"Unlike point charges exert a force that is…","o":["Repulsive","Attractive","Always zero","Independent of sign"],"a":1,"e":"Charges with opposite signs attract one another."},{"q":"The SI unit of electric force is…","o":["Coulomb","Newton","Volt","Farad"],"a":1,"e":"Force is measured in newtons (N)."},{"q":"Two charges each have magnitude \\(1\\,\\mu\\text{C}\\) and are 1 m apart in vacuum. The force magnitude is approximately…","o":["\\(9\\times10^{-3}\\,\\text{N}\\)","\\(9\\times10^{-6}\\,\\text{N}\\)","\\(9\\,\\text{N}\\)","\\(9\\times10^3\\,\\text{N}\\)"],"a":0,"e":"\\(F=9\\times10^9(10^{-6})^2/1^2=9\\times10^{-3}\\,\\text{N}\\)."},{"q":"Two charges of \\(2\\,\\mu\\text{C}\\) and \\(3\\,\\mu\\text{C}\\) are 3 m apart. The force magnitude is…","o":["\\(6\\times10^{-3}\\,\\text{N}\\)","\\(6\\times10^{-6}\\,\\text{N}\\)","\\(2\\times10^{-3}\\,\\text{N}\\)","\\(18\\times10^{-3}\\,\\text{N}\\)"],"a":0,"e":"\\(F=9\\times10^9(2\\times10^{-6})(3\\times10^{-6})/9=6\\times10^{-3}\\,\\text{N}\\)."},{"q":"If the medium’s permittivity increases while charges and distance remain fixed, the electrostatic force generally…","o":["Increases","Decreases","Remains unchanged","Changes sign automatically"],"a":1,"e":"For a uniform medium, \\(F\\propto1/\\varepsilon\\); higher permittivity reduces the force."},{"q":"In a medium of relative permittivity \\(\\varepsilon_r\\), the force compared with vacuum is…","o":["\\(F_0\\varepsilon_r\\)","\\(F_0/\\varepsilon_r\\)","\\(\\varepsilon_r/F_0\\)","\\(F_0\\) always"],"a":1,"e":"For the same charges and separation, \\(F=F_0/\\varepsilon_r\\)."},{"q":"The electrostatic forces between two point charges form an action-reaction pair with…","o":["Equal magnitudes and opposite directions","Equal directions","Unequal magnitudes always","No relation"],"a":0,"e":"The two charges exert equal and opposite forces on each other."},{"q":"Coulomb’s law is most directly applied to…","o":["Point charges or spherically symmetric charge distributions externally","Any extended irregular body without approximation","Only neutral objects","Only moving charges at relativistic speeds"],"a":0,"e":"The point-charge model applies to point charges and to spherical distributions outside them, under appropriate conditions."},{"q":"The electrostatic force acts along the…","o":["Line joining the two charges","Perpendicular bisector only","Circular tangent","Direction of Earth's magnetic field"],"a":0,"e":"The Coulomb force is directed along the line joining the two charges."},{"q":"If the distance is tripled, the force becomes…","o":["One-third","One-sixth","One-ninth","Nine times"],"a":2,"e":"The inverse-square dependence gives \\(F'=F/3^2=F/9\\)."},{"q":"If one charge is reduced to one-third while separation remains fixed, the force becomes…","o":["One-third","Three times","One-ninth","Unchanged"],"a":0,"e":"Force is directly proportional to each charge, so it becomes one-third."},{"q":"Two equal positive charges are placed near each other. The force on each is…","o":["Toward the other charge","Away from the other charge","Zero","Always upward"],"a":1,"e":"Like charges repel, so each force points away from the other charge."},{"q":"Two opposite charges are separated by distance r. Their force is directed…","o":["Away from each other","Toward each other","Perpendicular to their line","Always upward"],"a":1,"e":"Opposite charges attract along the line joining them."},{"q":"The dimensional formula of Coulomb’s constant k is…","o":["\\([ML^3T^{-4}A^{-2}]\\)","\\([MLT^{-2}]\\)","\\([M^0L^0T^0]\\)","\\([ML^2T^{-2}]\\)"],"a":0,"e":"From \\(F=kq^2/r^2\\), \\([k]=[F][r]^2/[q]^2=[ML^3T^{-4}A^{-2}]\\)."},{"q":"Two charges exert force F at separation r. At separation 2r, force is…","o":["\\(F/2\\)","\\(F/4\\)","\\(2F\\)","\\(4F\\)"],"a":1,"e":"Inverse-square dependence gives \\(F'=F/(2^2)=F/4\\)."},{"q":"If charge magnitudes are both tripled and distance doubles, the force becomes…","o":["\\(9F/4\\)","\\(9F\\)","\\(3F/2\\)","\\(F/4\\)"],"a":0,"e":"The charge product increases by 9 and the distance-squared factor by 4, so \\(F'=9F/4\\)."},{"q":"Two charges of \\(4\\,\\mu\\text{C}\\) and \\(2\\,\\mu\\text{C}\\) are 2 m apart. The force is approximately…","o":["\\(9\\times10^{-3}\\,\\text{N}\\)","\\(18\\times10^{-3}\\,\\text{N}\\)","\\(36\\times10^{-3}\\,\\text{N}\\)","\\(72\\times10^{-3}\\,\\text{N}\\)"],"a":1,"e":"\\(F=9\\times10^9(4\\times10^{-6})(2\\times10^{-6})/2^2=18\\times10^{-3}\\,\\text{N}\\)."},{"q":"The net force on a charge due to several other charges is found using…","o":["Scalar addition only","Vector superposition","Multiplication of all forces","The largest force only"],"a":1,"e":"For multiple charges, the individual force vectors are added according to superposition."},{"q":"If the net electrostatic force between two charges is attractive, the charges must be…","o":["Both positive","Both negative","Opposite in sign","Equal in magnitude"],"a":2,"e":"Attraction between point charges indicates opposite signs."},{"q":"Coulomb force is a…","o":["Scalar quantity","Vector quantity","Dimensionless quantity","Temperature"],"a":1,"e":"Force has magnitude and direction, so it is a vector."},{"q":"If both charges and separation remain unchanged but the medium changes, the force can change because…","o":["Permittivity changes","Mass changes","Time changes","Gravity stops"],"a":0,"e":"The force depends on the medium's permittivity as well as charges and separation."},{"q":"Two point charges are separated by 0.5 m. If the separation is increased to 1.5 m, the force becomes…","o":["\\(F/3\\)","\\(F/6\\)","\\(F/9\\)","\\(3F\\)"],"a":2,"e":"Distance triples, so the force becomes \\(1/3^2=1/9\\) of its original value."}];
let index=0,score=0,streak=0,chosen=null,locked=false;

let wrongAttempts=[];
const $=id=>document.getElementById(id);
function typesetMath(){if(window.MathJax?.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options'),$('feedback')].filter(Boolean)).catch(()=>{});}}

function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';

 item.o.forEach((text,j)=>{

 });
 typesetMath();

$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});

 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
