than critical damping in the standard model"],"a":0,"e":"Overdamping prevents oscillation but gives a slower return than critical damping."},{"q":"Which system exhibits oscillations while its amplitude decays?","o":["Underdamped","Critically damped","Overdamped","Undamped only"],"a":0,"e":"An underdamped oscillator continues crossing equilibrium while losing amplitude."},{"q":"Which damping case is preferred when a door should close quickly without repeatedly swinging?","o":["Critical damping","Very weak damping","Underdamping","No damping"],"a":0,"e":"Critical damping minimizes settling time without repeated oscillation."},{"q":"A car shock absorber is designed primarily to:","o":["Dissipate energy and reduce repeated bouncing","Increase the suspension's oscillation amplitude","Supply energy to the wheels continuously","Remove the spring force"],"a":0,"e":"Shock absorbers dissipate energy so the vehicle does not continue bouncing after a bump."},{"q":"For a mass–spring system with damping coefficient b, mass m and spring constant k, the free-motion equation is:","o":["mẍ + bẋ + kx = 0","mẍ − bx − kx = 0","mẋ + kx = b","bẍ + mx + k = 0"],"a":0,"e":"Newton's law with spring force −kx and damping force −bẋ gives mẍ + bẋ + kx = 0."},{"q":"The damping coefficient b in F_d = −bv has SI units of:","o":["N·s/m (equivalently kg/s)","N/m","J/s","kg·m/s"],"a":0,"e":"Since b = force/velocity, its units are N/(m/s) = N·s/m = kg/s."},{"q":"In a lightly damped oscillator, the amplitude envelope commonly follows:","o":["An exponential decay","A linear increase without bound","A constant value forever","A step function only"],"a":0,"e":"For linear viscous damping, the underdamped amplitude envelope decays exponentially."},{"q":"If the amplitude of a lightly damped oscillator becomes half its initial value, the oscillation has:","o":["A smaller amplitude but may still be continuing","Stopped instantaneously by definition","Gained mechanical energy","Become necessarily overdamped"],"a":0,"e":"Damping reduces amplitude gradually; a halved amplitude does not mean motion has stopped."},{"q":"For an ideal linear spring oscillator without damping, mechanical energy is:","o":["Constant","Always decreasing","Always increasing","Zero at every turning point"],"a":0,"e":"Without dissipative forces, kinetic and potential energy exchange while total mechanical energy stays constant."},{"q":"For a free damped oscillator with no external driving, total mechanical energy generally:","o":["Decreases with time","Increases with time","Remains constant in all cases","Instantly becomes infinite"],"a":0,"e":"Resistive forces transfer mechanical energy into thermal energy and other forms."},{"q":"The undamped natural angular frequency of a mass m on a spring k is:","o":["ω₀ = √(k/m)","ω₀ = √(m/k)","ω₀ = k/m²","ω₀ = 2π√(k/m)"],"a":0,"e":"For the undamped oscillator, ω₀² = k/m."},{"q":"For viscous damping described by mẍ + bẋ + kx = 0, the critical damping coefficient is:","o":["b_c = 2√(mk)","b_c = √(mk)/2","b_c = k/m","b_c = 2mk"],"a":0,"e":"Critical damping occurs at b² = 4mk, hence b_c = 2√(mk)."},{"q":"If b < 2√(mk) in the linear viscous model, the oscillator is:","o":["Underdamped","Critically damped","Overdamped","Undamped regardless of b"],"a":0,"e":"Damping below the critical value produces underdamped oscillatory motion."},{"q":"If b = 2√(mk), the oscillator is:","o":["Critically damped","Underdamped","Overdamped","Driven at resonance"],"a":0,"e":"Equality with the critical coefficient marks critical damping."},{"q":"If b > 2√(mk), the oscillator is:","o":["Overdamped","Underdamped","Critically damped","Undamped"],"a":0,"e":"Damping above the critical value gives a non-oscillatory overdamped response."},{"q":"The damping ratio ζ is defined for a linear mass–spring–damper system as:","o":["b/(2√(mk))","2√(mk)/b","bk/m","k/(bm)"],"a":0,"e":"The damping ratio compares actual damping b with the critical value 2√(mk)."},{"q":"An oscillator has m = 1 kg and k = 25 N/m. Its critical damping coefficient is:","o":["10 N·s/m","5 N·s/m","25 N·s/m","50 N·s/m"],"a":0,"e":"b_c = 2√(mk) = 2√25 = 10 N·s/m."},{"q":"For m = 1 kg, k = 25 N/m and b = 4 N·s/m, the oscillator is:","o":["Underdamped","Critically damped","Overdamped","Not subject to damping"],"a":0,"e":"The critical value is 10 N·s/m; since 4 < 10, the system is underdamped."},{"q":"The damped angular frequency for an underdamped viscous oscillator is:","o":["ω_d = √(ω₀² − (b/2m)²)","ω_d = √(ω₀² + (b/2m)²)","ω_d = ω₀² + b","ω_d = b/2m only"],"a":0,"e":"For underdamping, ω_d² = ω₀² − (b/2m)²."},{"q":"For weak damping, the damped oscillation frequency compared with the undamped natural frequency is:","o":["Slightly lower","Always exactly double","Always zero","Always higher by a factor of ten"],"a":0,"e":"For linear viscous damping, ω_d = √(ω₀² − (b/2m)²), which is below ω₀."},{"q":"At a turning point of an underdamped oscillator, the instantaneous velocity is:","o":["Zero","Maximum in magnitude","Always equal to the damping coefficient","Always equal to the natural frequency"],"a":0,"e":"At a turning point, displacement is momentarily extreme and velocity is zero."},{"q":"When a damped oscillator is released and not driven, it eventually settles because:","o":["Mechanical energy is dissipated","The spring constant necessarily becomes zero","Its mass vanishes","The equilibrium position continually accelerates"],"a":0,"e":"Without energy input, dissipative forces gradually remove the oscillator's mechanical energy."},{"q":"Which statement about critical damping is correct?","o":["It avoids repeated oscillation and gives the fastest standard return to equilibrium","It produces the largest sustained oscillations","It means the damping force is always zero","It requires the spring constant to be zero"],"a":0,"e":"Critical damping is the boundary between underdamped oscillation and overdamped non-oscillatory return."},{"q":"A pendulum's swing dies away in air after being released because air resistance and pivot friction:","o":["Dissipate mechanical energy","Increase its total mechanical energy","Keep its amplitude constant","Act only at the turning points"],"a":0,"e":"Air resistance and friction reduce the energy available for continued oscillation."}];
