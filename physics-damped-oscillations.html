<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Damped Oscillations</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f7ff;margin:0;color:#1e293b}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(30,41,59,.10);border:1px solid #e2e8f0}h1{text-align:center;color:#334155}.meta{display:flex;justify-content:space-between;font-weight:700;color:#475569}.bar{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#22c55e;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;color:#172033}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe4f0;border-radius:14px;background:#fff;color:#1e293b;font-size:16px;cursor:pointer;transition:.2s}.opt:hover{background:#eef5ff;border-color:#93c5fd;transform:translateY(-1px)}.opt:focus-visible{outline:3px solid #bfdbfe;outline-offset:2px}.correct{border-color:#16a34a!important;background:#ecfdf3!important;color:#166534!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important;color:#991b1b!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s}.next,.retry{background:#4f46e5;color:#fff}.next:hover,.retry:hover{background:#4338ca}.back{background:#334155;color:#fff}.back:hover{background:#1e293b}.hide{display:none}.xp{text-align:center;font-weight:700;color:#d97706;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>🌊 Damped Oscillations</h1>
<div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="quiz"></div><div class="xp" id="xp"></div>
<button class="next hide" id="next">Next Question →</button>
<div id="result" class="hide"></div>
<a class="back" href="physics-home-fast.html">← Back to Physics Path</a>
</div></div>
<script>
const qs=[
['Damped oscillations are oscillations in which the amplitude','remains constant','gradually decreases with time','always increases','becomes infinite',1,'Damping causes the amplitude of an oscillator to decrease with time because mechanical energy is dissipated.'],
['The main cause of damping in a practical oscillator is','absence of inertia','resistive forces','gravity only','elasticity only',1,'Friction, air resistance, and other resistive forces remove mechanical energy and produce damping.'],
['In a damped oscillator, the mechanical energy generally','increases with time','remains constant','decreases with time','is always zero',2,'Because resistive forces dissipate energy, the mechanical energy decreases with time.'],
['A common example of a damped oscillator is','an ideal frictionless spring','a mass-spring system moving through a resistive medium','a stationary object','a uniform straight-line motion',1,'A mass-spring system moving through a resistive medium experiences resistance and therefore damping.'],
['For viscous damping proportional to velocity, the resistive force is commonly written as','F=+bv','F=−bv','F=ma','F=−kx²',1,'The damping force opposes motion, so for a linear viscous damper F_d=−bv.'],
['In the equation m x'' + b x' + kx = 0, the coefficient b represents','mass','damping coefficient','spring displacement','angular displacement',1,'The parameter b is the viscous damping coefficient and has units of N·s/m.'],
['For an underdamped oscillator, the motion is','oscillatory with decreasing amplitude','non-oscillatory and instantly at rest','always uniform','oscillatory with increasing amplitude',0,'An underdamped system continues to oscillate while its amplitude gradually decreases.'],
['In the absence of damping, the amplitude of ideal SHM','decreases exponentially','remains constant','becomes zero','changes randomly',1,'With no resistive force, mechanical energy is conserved and the amplitude remains constant.'],
['For a lightly damped oscillator, the oscillation frequency is generally','much greater than the undamped frequency','slightly less than the undamped frequency','always zero','independent of the system',1,'For an underdamped oscillator, the damped angular frequency is less than the natural angular frequency.'],
['The damped angular frequency for an underdamped oscillator is','ω_d=√(ω₀²−(b/2m)²)','ω_d=ω₀+b/2m','ω_d=ω₀²+b²','ω_d=b/2m',0,'For m x''+b x'+kx=0, ω_d=√(ω₀²−(b/2m)²), where ω₀=√(k/m).'],
['If damping is increased in an underdamped system, the amplitude decay generally','becomes faster','becomes slower','stops completely','becomes infinite',0,'Greater damping causes energy and amplitude to decay more rapidly.'],
['Critical damping corresponds to a system that','oscillates forever','returns to equilibrium in the shortest time without oscillating','never returns to equilibrium','has zero damping',1,'Critical damping gives the fastest return to equilibrium without oscillation.'],
['An overdamped system returns to equilibrium','with sustained oscillations','without oscillation, more slowly than a critically damped system','instantaneously','with increasing amplitude',1,'An overdamped system does not oscillate but returns more slowly than the critically damped case.'],
['For x=Ae^(−bt/2m)cos(ω_dt+φ), the factor controlling exponential amplitude decay is','A only','e^(−bt/2m)','cos(ω_dt+φ)','ω_dt',1,'The envelope amplitude is proportional to e^(−bt/2m), showing exponential decay.'],
['When damping is present, the quality factor Q of a lightly damped oscillator is associated with','energy loss per cycle','mass only','displacement only','gravity only',0,'The quality factor measures how weakly damped a resonant oscillator is and is related to energy loss per cycle.']
];
let i=0,score=0,answered=false;const $=x=>document.getElementById(x);
function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}
function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}
function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}
$('next').onclick=next;render();
</script>
</body></html>
