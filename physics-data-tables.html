<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SkillUp Physics | Data Tables</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.opt.selected{border-color:#5146a5;background:#f4f1ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.opt:disabled{cursor:default}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>📊 Data Tables</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="action">CHECK</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['A data table in a physics experiment is mainly used to:',['Hide measurements','Organize measured and calculated values clearly','Remove units','Replace the experiment'],1,'Data tables organize observations and calculated quantities so they can be analysed clearly.'],['Each measured quantity in a data table should normally have its:',['Unit identified','Colour only','Graph only','No heading'],0,'Every physical quantity should have a clear heading and appropriate unit.'],['A good table heading should identify:',['Only the number','The physical quantity and, where appropriate, its unit','Only the experiment name','Only the answer'],1,'A heading such as Time (s) identifies both the quantity and its unit.'],['If time is measured in seconds, a suitable heading is:',['Time','Time (s)','Seconds only','t without context'],1,'Writing Time (s) makes the quantity and unit explicit.'],['Repeated measurements are useful because they can help:',['Increase random error','Assess consistency and obtain a representative value','Remove all systematic error','Avoid recording data'],1,'Repeated measurements help assess scatter and calculate a representative value such as a mean.'],['The mean of 2.0, 2.2 and 1.8 is:',['1.8','2.0','2.2','6.0'],1,'Mean=(2.0+2.2+1.8)/3=6.0/3=2.0.'],['When recording measured values, the number of decimal places should:',['Be random','Reflect the instrument precision','Always be zero','Always use ten places'],1,'Recorded precision should be consistent with the resolution or least count of the instrument.'],['If a ruler has a millimetre scale, a length may reasonably be recorded in:',['km','m with no indication of precision','cm or mm with appropriate precision','years'],2,'The unit and number of digits should match the ruler resolution.'],['A calculated column in a data table should be:',['Clearly labelled with its quantity and unit','Left blank','Mixed with unrelated data','Unlabelled'],0,'Calculated quantities should have clear labels and units so the results can be interpreted.'],['Why should units be consistent when comparing data?',['To make calculations and comparisons meaningful','To make numbers larger','To hide errors','To avoid measurements'],0,'Consistent units prevent incorrect comparisons and calculations.'],['If distance is in metres and time in seconds, speed is expressed in:',['m/s','s/m','m·s','m²/s'],0,'Speed is distance divided by time, giving metres per second (m/s).'],['A table contains mass in grams and volume in cm³. Density is calculated as:',['m×V','m/V','V/m','m+V'],1,'Density is mass divided by volume: ρ=m/V.'],['If a measured value is 5.20 cm, the final zero indicates:',['Nothing about precision','A recorded precision of two decimal places','The value is exactly 5 cm','The unit is metres'],1,'The trailing zero is significant and communicates the recorded precision.'],['Which practice improves readability of an experimental data table?',['Clear headings, units, aligned values and consistent precision','Random spacing','Missing units','Unlabelled columns'],0,'Clear headings, units and consistent formatting make data easier to inspect and analyse.'],['Why should raw measurements be preserved before calculations?',['They provide the original experimental record for checking and analysis','They are never useful','They eliminate uncertainty','They replace the final result'],0,'Keeping raw data allows calculations to be checked and supports later analysis of experimental results.']];let i=0,score=0,answered=false,selected=-1;const $=x=>document.getElementById(x);function render(){answered=false;selected=-1;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q[1].map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('action').classList.remove('hide');$('action').textContent='CHECK'});$('xp').textContent='';$('action').classList.add('hide');$('action').disabled=false;}$('action').onclick=()=>{if(selected<0)return;if(!answered){answered=true;const q=qs[i],ok=selected===q[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===selected&&!ok)b.classList.add('wrong')});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[3];if(ok)score++;$('score').textContent=`XP ${score}`;$('fill').style.width=`${(i+1)/15*100}%`;$('action').textContent=i===14?'FINISH':'Next Question →';return;}if(i<14){i++;render()}else{$('quiz').innerHTML='';$('action').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}};render();</script></body></html>
