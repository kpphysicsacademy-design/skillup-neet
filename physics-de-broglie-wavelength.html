<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | de Broglie Wavelength</title><meta name="description" content="SkillUp Physics de Broglie Wavelength interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🌊</span><h1>de Broglie Wavelength</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["The de Broglie wavelength of a particle having momentum p is:",["λ=h/p","λ=p/h","λ=hp","λ=h+p"],0,"De Broglie proposed λ=h/p, where h is Planck's constant and p is momentum."] ,["For a non-relativistic particle of mass m moving with speed v, the wavelength is:",["λ=h/(mv)","λ=hmv","λ=mv/h","λ=h+mv"],0,"Using p=mv, the de Broglie relation becomes λ=h/(mv)."],["The SI unit of de Broglie wavelength is:",["metre","joule","newton","watt"],0,"Wavelength is a length, so its SI unit is metre (m)."],["If the momentum of a particle is doubled, its de Broglie wavelength becomes:",["Half","Double","Four times","Unchanged"],0,"Since λ is inversely proportional to p, doubling momentum halves the wavelength."],["If a particle's momentum is reduced to one-fourth, its de Broglie wavelength becomes:",["Four times","One-fourth","Half","Unchanged"],0,"λ∝1/p, so reducing p to p/4 makes λ equal to 4λ."] ,["For a fixed mass, if the speed of a non-relativistic particle is doubled, its de Broglie wavelength:",["Becomes half","Doubles","Becomes four times","Remains unchanged"],0,"For fixed mass, λ=h/(mv), so wavelength is inversely proportional to speed."] ,["For a particle of kinetic energy K in the non-relativistic limit, the de Broglie wavelength is:",["λ=h/√(2mK)","λ=h√(2mK)","λ=2mK/h","λ=h/(mK)"],0,"Since K=p²/(2m), p=√(2mK), giving λ=h/√(2mK)."] ,["For a charged particle accelerated through a potential difference V, its non-relativistic de Broglie wavelength varies as:",["1/√V","√V","V","1/V"],0,"The kinetic energy qV gives p∝√V, so λ=h/p∝1/√V."] ,["An electron and a proton have the same momentum. Their de Broglie wavelengths are:",["Equal","Different because their masses differ","Zero for the proton","Infinite for the electron"],0,"Because λ=h/p, equal momenta correspond to equal de Broglie wavelengths regardless of mass."] ,["An electron and a proton have the same kinetic energy, non-relativistically. Which has the longer wavelength?",["Electron","Proton","Both equal","Neither"],0,"For fixed K, λ=h/√(2mK); the electron has smaller mass and therefore longer wavelength."] ,["The de Broglie wavelength of a macroscopic body is usually extremely small because its:",["Momentum is large","Charge is always zero","Temperature is low","Density is small"],0,"Macroscopic objects usually have large momentum, making λ=h/p extremely small."] ,["A particle has momentum 6.63×10^-24 kg m/s. Taking h=6.63×10^-34 J s, its de Broglie wavelength is:",["1×10^-10 m","1×10^-8 m","1×10^-12 m","1×10^-14 m"],0,"λ=h/p=(6.63×10^-34)/(6.63×10^-24)=1×10^-10 m."] ,["Which experiment confirmed the wave nature of electrons through diffraction?",["Davisson-Germer experiment","Millikan experiment","Rutherford experiment","Compton experiment"],0,"Davisson and Germer observed electron diffraction, confirming the wave nature of electrons."] ,["Matter waves are associated with:",["Material particles with momentum","Only photons","Only charged particles","Only stationary objects"],0,"De Broglie waves are associated with material particles; wavelength is determined by their momentum."] ,["The de Broglie relation is important because it connects particle momentum with:",["Wavelength","Temperature","Electric charge","Rest mass only"],0,"The relation λ=h/p connects the particle property momentum with the wave property wavelength."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
