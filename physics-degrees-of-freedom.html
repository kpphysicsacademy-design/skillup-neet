<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Degrees of Freedom</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🧩 Degrees of Freedom</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['The number of independent ways in which a molecule can move or store energy is called its','mean free path','degree of freedom','collision frequency','pressure',1,'A degree of freedom is an independent mode of motion or energy storage available to a molecule.'],
['For a monatomic ideal gas, the number of translational degrees of freedom is','1','2','3','6',2,'A monatomic molecule can translate independently along the x, y and z directions, giving 3 translational degrees of freedom.'],
['A monatomic ideal gas has, in the classical translational model, total degrees of freedom equal to','2','3','5','6',1,'For a monatomic ideal gas, only three translational degrees of freedom are considered, so f = 3.'],
['A diatomic molecule has how many translational degrees of freedom?','1','2','3','5',2,'Translation of the centre of mass occurs independently along three mutually perpendicular directions.'],
['A linear diatomic molecule has how many rotational degrees of freedom at ordinary temperatures when rotational motion is active?','1','2','3','4',1,'A linear molecule can rotate about two axes perpendicular to its molecular axis, giving 2 rotational degrees of freedom.'],
['For an ordinary rigid diatomic molecule at temperatures where vibration is neglected, the total number of active degrees of freedom is','3','5','6','7',1,'The molecule has 3 translational and 2 rotational degrees of freedom, giving f = 5 when vibrational modes are neglected.'],
['For a nonlinear triatomic molecule, the number of rotational degrees of freedom is','1','2','3','4',2,'A nonlinear molecule can rotate independently about three mutually perpendicular axes, so it has 3 rotational degrees of freedom.'],
['A nonlinear molecule has how many translational degrees of freedom?','2','3','4','6',1,'Every molecule can translate along x, y and z directions, giving 3 translational degrees of freedom.'],
['In the classical model, each active quadratic degree of freedom contributes an average energy of','kT','kT/2','2kT','3kT/2',1,'By the equipartition theorem, each active quadratic degree of freedom contributes kT/2 per molecule.'],
['For an ideal gas with f active degrees of freedom, the average energy per molecule is','fkT','f kT/2','2fkT','kT/(2f)',1,'The equipartition theorem gives average energy per molecule U/N = f kT/2.'],
['The molar internal energy of an ideal gas with f active degrees of freedom is','fRT','fRT/2','2fRT','RT/(2f)',1,'For one mole, the average molecular energy f kT/2 becomes molar energy fRT/2.'],
['For a monatomic ideal gas with f = 3, the molar internal energy is','RT/2','RT','3RT/2','5RT/2',2,'Using U = fRT/2 with f = 3 gives U = 3RT/2 per mole.'],
['For a rigid diatomic ideal gas with f = 5, the molar internal energy is','3RT/2','5RT/2','5RT','7RT/2',1,'With five active degrees of freedom, U = 5RT/2 per mole.'],
['If the number of active degrees of freedom increases while temperature remains fixed, the average energy per molecule according to equipartition','decreases','remains unchanged','increases','becomes zero',2,'Since E = f kT/2, increasing f at fixed T increases the average energy.'],
['At sufficiently high temperature, vibrational modes of a molecule may become active. This generally causes its effective number of degrees of freedom to','decrease','increase','become negative','remain exactly zero',1,'Vibrational modes add additional independent energy-storage modes, so the effective degrees of freedom can increase.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
