<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}

h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#174a78}.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}

.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}

.nav{display:flex;align-items:center;gap:10px;min-height:72px;padding:10px 14px}

}

<section class="hero"><h1>⚛️ Degrees of Freedom</h1><p class="muted">Explore monatomic ideal-gas properties with 30 questions and concise explanations.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>

<script>
(function(){
'use strict';
const questions = [{"q":"In kinetic theory, a degree of freedom is…","o":["An independent way a molecule can store energy","The number of molecules in a gas","The volume occupied by one molecule","The speed of sound in a gas"],"a":0,"e":"A degree of freedom represents an independent mode of motion or energy storage."},{"q":"A molecule moving freely in three-dimensional space has how many translational degrees of freedom?","o":["1","2","3","6"],"a":2,"e":"Translation can occur independently along x, y and z."},{"q":"For a monatomic ideal gas at ordinary temperatures, the active degrees of freedom are usually…","o":["1","2","3","5"],"a":2,"e":"A monatomic gas has three translational degrees of freedom in the usual model."},{"q":"A rigid diatomic molecule at ordinary temperatures is commonly modeled with how many active degrees of freedom?","o":["3","5","6","7"],"a":1,"e":"The usual model counts three translational and two rotational modes; vibration is neglected."},{"q":"A nonlinear rigid molecule has how many rotational degrees of freedom?","o":["1","2","3","5"],"a":2,"e":"A nonlinear molecule can rotate about three independent axes."},{"q":"A linear rigid molecule has how many rotational degrees of freedom?","o":["1","2","3","4"],"a":1,"e":"Rotation about the molecular axis contributes negligibly in the usual rigid-rotor model, leaving two."},{"q":"For f active quadratic degrees of freedom, the equipartition theorem assigns average energy per molecule of…","o":["fkBT","(f/2)kBT","(2/f)kBT","(f/3)kBT"],"a":1,"e":"Each active quadratic degree contributes one-half kBT on average."},{"q":"For n moles of an ideal gas with f active degrees of freedom, internal energy is…","o":["U = fnRT","U = (f/2)nRT","U = (2/f)nRT","U = nRT/f"],"a":1,"e":"Multiplying (f/2)kBT per molecule by the number of molecules gives U = (f/2)nRT."},{"q":"For an ideal gas with f active degrees of freedom, its molar heat capacity at constant volume is…","o":["fR","(f/2)R","(f+1)R","R/f"],"a":1,"e":"At constant volume, Cv = (∂U/∂T)n = (f/2)R."},{"q":"For an ideal gas, Mayer’s relation is…","o":["Cp − Cv = R","Cp + Cv = R","Cv − Cp = R","Cp/Cv = R"],"a":0,"e":"For one mole of an ideal gas, Cp − Cv equals the gas constant R."},{"q":"If f = 3, the molar heat capacity Cv is…","o":["R/2","R","3R/2","5R/2"],"a":2,"e":"Cv = (f/2)R = 3R/2."},{"q":"If f = 5, the molar heat capacity Cv is…","o":["3R/2","2R","5R/2","7R/2"],"a":2,"e":"Substituting f = 5 into Cv = (f/2)R gives 5R/2."},{"q":"For an ideal gas with f = 3, Cp equals…","o":["R","3R/2","2R","5R/2"],"a":3,"e":"Cp = Cv + R = 3R/2 + R = 5R/2."},{"q":"For an ideal gas with f = 5, Cp equals…","o":["5R/2","3R","7R/2","4R"],"a":2,"e":"Cp = Cv + R = 5R/2 + R = 7R/2."},{"q":"The heat-capacity ratio γ for an ideal gas with f active degrees of freedom is…","o":["f/2","1 + 2/f","2/f","f + 1"],"a":1,"e":"γ = Cp/Cv = (f/2 + 1)/(f/2) = 1 + 2/f."},{"q":"For f = 3, the heat-capacity ratio γ is…","o":["4/3","5/3","7/5","2"],"a":1,"e":"γ = 1 + 2/3 = 5/3."},{"q":"For f = 5, the heat-capacity ratio γ is…","o":["5/3","7/5","9/7","4/3"],"a":1,"e":"γ = 1 + 2/5 = 7/5."},{"q":"At the same temperature, the average energy per molecule for f = 6 is…","o":["2kBT","3kBT","(3/2)kBT","6kBT"],"a":1,"e":"Equipartition gives (f/2)kBT = 3kBT for f = 6."},{"q":"When a vibrational mode becomes active in the classical equipartition model, it contributes how much energy per molecule?","o":["(1/2)kBT","kBT","(3/2)kBT","2kBT"],"a":1,"e":"A harmonic vibrational mode has kinetic and potential quadratic terms, each contributing (1/2)kBT."},{"q":"Why can a gas’s effective degrees of freedom increase as temperature rises?","o":["More molecular modes can become thermally accessible","Molecules gain additional atoms","The gas constant changes","The number of spatial dimensions increases"],"a":0,"e":"Higher temperatures can activate rotational or vibrational modes previously not excited."},{"q":"Which motion contributes to translational degrees of freedom?","o":["Motion of the molecule’s center of mass","Rotation about its own axis","Stretching of a chemical bond","Bending of a molecular bond"],"a":0,"e":"Translation describes movement of the center of mass through space."},{"q":"For a rigid diatomic molecule in the usual high-enough temperature model where vibration remains inactive, f equals…","o":["2","3","5","7"],"a":2,"e":"Three translations plus two rotations give f = 5."},{"q":"If a molecule has 3 translational and 3 rotational degrees of freedom, and vibration is inactive, total f is…","o":["3","5","6","9"],"a":2,"e":"The active independent modes add: 3 + 3 = 6."},{"q":"A model gas has f = 4 active quadratic degrees of freedom. Its molar Cv is…","o":["R","2R","(5/2)R","3R"],"a":1,"e":"Cv = (f/2)R = 2R."},{"q":"For f = 4, the ideal-gas heat-capacity ratio γ equals…","o":["3/2","4/3","5/4","7/4"],"a":0,"e":"γ = 1 + 2/f = 1 + 2/4 = 3/2."},{"q":"A gas has γ = 7/5 under the equipartition model. Its active degrees of freedom are…","o":["3","4","5","6"],"a":2,"e":"From γ = 1 + 2/f, 7/5 − 1 = 2/5, so f = 5."},{"q":"A gas has Cv = 3R. In the equipartition model, its active degrees of freedom f are…","o":["3","5","6","7"],"a":2,"e":"Cv = (f/2)R = 3R gives f = 6."},{"q":"If the active degrees of freedom double at fixed temperature, the model’s average energy per molecule…","o":["Halves","Doubles","Remains unchanged","Becomes zero"],"a":1,"e":"Average energy is proportional to f at fixed temperature: (f/2)kBT."},{"q":"Degrees of freedom in the equipartition model are counted as…","o":["Independent active quadratic energy terms","Only the number of atoms","Only the rotational axes in all cases","The number of collisions per second"],"a":0,"e":"Equipartition applies to independent quadratic terms in the energy."},{"q":"A gas has f = 5 and contains 2 moles at temperature T. Its internal energy is…","o":["3RT","4RT","2RT","5RT"],"a":3,"e":"U = (f/2)nRT = (5/2)(2)RT = 5RT."}];const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Degrees of Freedom Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
