*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}

.hero,.quiz,.finish{background:#fff;border:2px solid #e2edf7;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 #dce8f3}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#174a78}.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}
.progress-row{display:flex;justify-content:space-between;gap:10px;margin:16px 0 7px;font-size:12px;font-weight:900;color:var(--muted)}
.track{height:11px;border-radius:99px;background:#e2edf7;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}
.qmeta{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.4px}
.question{font-size:clamp(20px,4.5vw,26px);line-height:1.35;margin:12px 0 18px;font-weight:850}
.options{display:grid;gap:10px}.option{display:flex;gap:11px;align-items:center;width:100%;min-height:51px;padding:12px;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}
.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.nav{display:flex;align-items:center;gap:10px;min-height:72px;padding:10px 14px}

}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🌡️ Degrees of Freedom</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[{"q":"What do degrees of freedom describe for a molecule?","o":["Independent ways it can store energy","The number of molecules in a mole","Its pressure unit","Its molecular colour"],"a":0,"e":"Degrees of freedom count independent modes of motion or energy storage."},{"q":"How many translational degrees of freedom does a molecule have in three-dimensional space?","o":["1","2","3","6"],"a":2,"e":"Translation can occur independently along the x, y and z directions."},{"q":"A monatomic ideal gas molecule has how many active translational degrees of freedom?","o":["1","2","3","5"],"a":2,"e":"A monatomic molecule has three translational degrees of freedom."},{"q":"At ordinary temperatures, a rigid diatomic molecule is often modelled with how many active degrees of freedom?","o":["2","3","5","7"],"a":2,"e":"It has three translational and two rotational degrees of freedom; vibration is usually neglected."},{"q":"Each active quadratic degree of freedom contributes what average energy per molecule?","o":["kT/2","kT","3kT/2","2kT"],"a":0,"e":"By equipartition, each quadratic degree of freedom contributes kT/2."},{"q":"For a molecule with f active quadratic degrees of freedom, its average energy is…","o":["fkT/2","2fkT","kT/f","fT/(2k)"],"a":0,"e":"Equipartition gives average energy per molecule of fkT/2."},{"q":"For an ideal gas with f degrees of freedom, the molar internal energy is…","o":["fRT/2","RT/f","fR/T","2RT/f"],"a":0,"e":"For n moles, U = (f/2)nRT when f is constant."},{"q":"For a monatomic ideal gas, the molar internal energy is…","o":["RT/2","3RT/2","5RT/2","3RT"],"a":1,"e":"A monatomic gas has f = 3, so Um = 3RT/2."},{"q":"For a diatomic ideal gas at ordinary temperature, the approximate molar internal energy is…","o":["3RT/2","5RT/2","7RT/2","RT/2"],"a":1,"e":"With three translational and two rotational modes, f ≈ 5 and Um ≈ 5RT/2."},{"q":"Which motion accounts for three translational degrees of freedom?","o":["Motion along three perpendicular axes","Rotation around one axis only","Vibration of a bond only","Movement in one direction only"],"a":0,"e":"Three independent spatial directions provide three translational degrees of freedom."},{"q":"A rigid linear molecule has how many rotational degrees of freedom in the usual model?","o":["1","2","3","5"],"a":1,"e":"Rotation about the molecular axis contributes negligibly in the rigid linear model, leaving two rotational modes."},{"q":"A non-linear rigid molecule has how many rotational degrees of freedom?","o":["1","2","3","6"],"a":2,"e":"A non-linear rigid molecule can rotate independently about three axes."},{"q":"Vibrational motion of a diatomic molecule involves how many quadratic energy contributions per vibrational mode?","o":["One","Two","Three","Five"],"a":1,"e":"A vibrational mode has kinetic and potential quadratic contributions, each averaging kT/2 when active."},{"q":"Why are vibrational degrees of freedom often ignored for diatomic gases at room temperature?","o":["Vibrational modes may not be thermally excited significantly","Molecules cannot vibrate","Temperature has no effect on vibration","Vibration violates energy conservation"],"a":0,"e":"Quantum energy spacing can leave vibrational modes largely unexcited at ordinary temperatures."},{"q":"The equipartition theorem applies most directly when a mode is…","o":["Thermally active and described by a quadratic energy term","Always frozen out","Independent of energy","Only chemical"],"a":0,"e":"Equipartition assigns kT/2 to each active quadratic term under its classical assumptions."},{"q":"If a molecule has f = 6 active quadratic degrees of freedom, its mean energy is…","o":["kT","2kT","3kT","6kT"],"a":2,"e":"Mean energy = fkT/2 = 6kT/2 = 3kT."},{"q":"If the temperature doubles while f remains constant, the average molecular energy…","o":["Doubles","Halves","Quadruples","Does not change"],"a":0,"e":"The equipartition energy is proportional to absolute temperature."},{"q":"For an ideal gas with f active degrees of freedom, the molar heat capacity at constant volume is…","o":["fR/2","(f + 2)R/2","R/f","2fR"],"a":0,"e":"Cv,m = (∂Um/∂T)V = fR/2 for constant f."},{"q":"For a monatomic ideal gas, the molar heat capacity at constant volume is…","o":["R/2","R","3R/2","5R/2"],"a":2,"e":"A monatomic gas has f = 3, so Cv,m = 3R/2."},{"q":"For a diatomic ideal gas with f = 5, Cv,m is…","o":["R/2","3R/2","5R/2","7R/2"],"a":2,"e":"Cv,m = fR/2 = 5R/2."},{"q":"For an ideal gas, the Mayer relation between molar heat capacities is…","o":["Cp − Cv = R","Cp + Cv = R","Cv − Cp = R","Cp/Cv = R"],"a":0,"e":"For one mole of an ideal gas, Cp − Cv = R."},{"q":"For a monatomic ideal gas, the ratio Cp/Cv is…","o":["4/3","5/3","7/5","2"],"a":1,"e":"Cp = 5R/2 and Cv = 3R/2, so γ = 5/3."},{"q":"For a diatomic ideal gas with f = 5, Cp/Cv is…","o":["5/3","7/5","9/7","2"],"a":1,"e":"Cp = Cv + R = 7R/2; therefore γ = (7/2)/(5/2) = 7/5."},{"q":"Which gas generally has the larger molar Cv at ordinary temperature: monatomic or diatomic?","o":["Diatomic","Monatomic","They must be equal","Neither has heat capacity"],"a":0,"e":"A diatomic gas typically has five active degrees of freedom versus three for a monatomic gas."},{"q":"Degrees of freedom can change with temperature because…","o":["Additional rotational or vibrational modes may become active","Molecular mass changes continuously","The gas constant changes for each gas","Temperature changes the number of spatial dimensions"],"a":0,"e":"As temperature rises, some modes that were quantum-mechanically frozen can become active."},{"q":"What does the symbol k represent in the molecular equipartition formula?","o":["Boltzmann constant","Spring constant only","Thermal conductivity","Wave number"],"a":0,"e":"Boltzmann's constant relates molecular energy scale to absolute temperature."},{"q":"What does R represent in molar internal-energy formulas?","o":["Universal gas constant","Radius of the molecule","Rate of cooling","Resistance"],"a":0,"e":"R is the universal gas constant, approximately 8.314 J mol⁻¹ K⁻¹."},{"q":"A gas has f = 3 and temperature T. Its mean energy per molecule is…","o":["kT/2","kT","3kT/2","5kT/2"],"a":2,"e":"Using fkT/2 with f = 3 gives 3kT/2."},{"q":"Why does a monatomic ideal gas have no molecular rotational contribution in the simplest model?","o":["A single atom is modelled as a point particle without internal molecular axes","It has infinite rotational energy","It has no translational motion","Its temperature is always zero"],"a":0,"e":"The simple monatomic model treats the atom as a point particle; its thermal energy is translational."},{"q":"Which statement about degrees of freedom is correct?","o":["They help determine the energy stored and heat capacity of a gas","They always equal the number of atoms","They depend only on container shape","They are the same as pressure"],"a":0,"e":"The number of active degrees of freedom influences ideal-gas internal energy and heat capacity."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Degrees of Freedom Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
