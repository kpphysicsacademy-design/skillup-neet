k{display:none;margin-top:12px;padding:12px;border-radius:12px;font-size:12px;line-height:1.5}.feedback.show{display:block}.ok{background:#efffe5;border:1px solid #b7e892}.no{background:#ffe5e5;border:1px solid #ffb3b3}.next{display:none;width:100%;border:0;border-radius:13px;padding:13px;margin-top:12px;background:var(--b);color:#fff;font-weight:900;cursor:pointer}.next.show{display:block}.score{text-align:center;font-size:44px;font-weight:950;color:var(--n)}.warn{color:#8a5b00;background:#fff7df;border:1px solid #efdca3;border-radius:12px;padding:11px;font-size:11px;margin-top:10px}
/* SkillUp Duolingo mobile structure — aligned with SI Base Units */
html,body{width:100%;max-width:100%;overflow-x:hidden}
:root{--green:#58cc02;--green-dark:#46a302;--blue:#1cb0f6;--ink:#243447;--muted:#64748b;--line:#dce6ef;--bg:#f3f9ff;--red:#ff4b4b}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.nav{width:100%;max-width:720px;min-height:68px;height:auto;margin:auto;padding:9px 12px;display:flex;align-items:center;gap:9px}
.nav .back{display:grid;place-items:center;flex:0 0 40px;width:40px;height:40px;border:2px solid var(--line);border-radius:13px;background:#f2f9ff;color:#174a78;text-decoration:none;font-size:20px}
.nav .brand{flex:1;min-width:0;font-weight:950;color:#174a78;font-size:18px;line-height:1.1}
.nav .brand small{display:block;margin-top:4px;font-size:9px;letter-spacing:.7px;color:var(--muted)}
.nav .xp{margin-left:auto;background:#fff4cf;border:1px solid #f4df9a;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;white-space:nowrap}
.nav .streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 9px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}
.hero{border-top:5px solid var(--green)!important}
.brand{color:#58cc02!important}
.progress{background:#e2edf7!important}
.progress i{background:#58cc02!important}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:#1cb0f6;background:#f0faff;outline:none}
.opt:active:not(:disabled){transform:translateY(2px)}
.next{background:#58cc02!important;box-shadow:0 4px 0 #46a302!important}
.next:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}
.qnum{color:#58a700!important}
.answer-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.answer-stat{flex:1;min-width:90px;border-radius:13px;padding:9px 11px;font-size:12px;font-weight:900}
.answer-stat.right{background:#efffe7;color:#32810c;border:1px solid #c8f0b2}
.answer-stat.wrong{background:#fff0f0;color:#c92d2d;border:1px solid #ffcaca}
.answer-stat.accuracy{background:#e8f7ff;color:#0877a9;border:1px solid #b9e8fb}
.review-list{margin-top:14px;text-align:left}
.review-item{padding:12px;margin-top:9px;background:#fff7f7;border:1px solid #ffcaca;border-radius:13px;line-height:1.45}
.review-item b{display:block;margin-bottom:5px}

@media(max-width:480px){.nav .xp,.nav .streak{padding:6px 7px;font-size:10px}.nav{gap:6px}.nav .brand{font-size:16px}}
.wrap{width:100%;max-width:720px;min-width:0;margin:0 auto;padding:18px 13px 36px}
.hero,.result,.status{width:100%;max-width:100%;min-width:0;box-sizing:border-box;background:#fff;border:2px solid #e2edf7;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 #dce8f3;overflow-wrap:anywhere}
h1{margin:0 0 6px;color:#174a78;font-size:clamp(24px,5vw,32px);line-height:1.2}
.muted{color:var(--muted);font-size:13px;line-height:1.5}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.pill{background:#eef8ff;color:#23618a;border-radius:99px;padding:6px 10px;font-size:11px;font-weight:850}
.progress{height:11px;background:#e2edf7;border-radius:99px;overflow:hidden;margin-top:14px}
.progress i{display:block;height:100%;width:0;background:var(--green);transition:width .2s}
#content{width:100%;max-width:100%;min-width:0}
#content .q{width:100%;max-width:100%;min-width:0;box-sizing:border-box;background:#fff;border:2px solid #e2edf7;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 #dce8f3;overflow-wrap:anywhere}
.qnum{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.4px}
.q h2{font-size:clamp(20px,4.5vw,26px);line-height:1.4;margin:10px 0 18px;color:var(--ink);overflow-wrap:anywhere}
.options{display:grid;gap:10px}
.opt{display:block;width:100%;max-width:100%;min-width:0;min-height:54px;box-sizing:border-box;text-align:left;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;padding:12px;background:#fff;color:var(--ink);cursor:pointer;font-weight:750;font-size:15px;line-height:1.4;white-space:normal;overflow-wrap:anywhere}
.opt.correct{border-color:var(--green);background:#efffe7}
.opt.wrong{border-color:var(--red);background:#fff0f0}
.opt:disabled{cursor:default;opacity:1}
.feedback{display:none;width:100%;max-width:100%;min-width:0;box-sizing:border-box;margin-top:14px;padding:12px;border-radius:14px;font-size:13px;font-weight:700;line-height:1.5;white-space:normal;overflow-wrap:anywhere;word-break:normal;overflow:hidden}
.feedback.show{display:block}
.feedback.ok{background:#efffe7;border:2px solid #c8f0b2;color:#315b2a}
.feedback.no{background:#fff0f0;border:2px solid #ffcaca;color:#7d2929}
.next{display:none;width:100%;max-width:100%;min-height:48px;box-sizing:border-box;border:0;border-radius:14px;padding:12px 16px;margin-top:14px;background:var(--green);color:#fff;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--green-dark)}
.next.show{display:block}
.score{text-align:center;font-size:42px;font-weight:950;color:#174a78}
@media(max-width:480px){.wrap{padding:12px 10px 28px}.hero,.result,.status,#content .q{padding:15px;border-radius:18px}.opt{font-size:14px;padding:11px}.nav{gap:7px;padding:9px 10px}.nav .brand{font-size:17px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
