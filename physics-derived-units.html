<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Derived Units</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🧮 Derived Units</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['Which of the following is an SI derived unit?','metre','second','kilogram','newton',3,'Newton is an SI derived unit formed from kilogram, metre and second.'],
['The SI unit of force is:','joule','newton','pascal','watt',1,'Force is measured in newtons (N).'],
['One newton is equal to:','kg m s⁻²','kg m² s⁻¹','kg s⁻²','m s⁻²',0,'From F = ma, 1 N = 1 kg m s⁻².'],
['The SI unit of work is:','watt','joule','newton','pascal',1,'Work is measured in joules (J).'],
['One joule is equal to:','N m','N/m','kg/m','W/s',0,'Work = force × displacement, so 1 J = 1 N m.'],
['The SI unit of power is:','joule','watt','newton','coulomb',1,'Power is the rate of doing work and is measured in watts.'],
['One watt is equal to:','J s','J/s','N/s','kg m',1,'Power = work/time, so 1 W = 1 J s⁻¹.'],
['The SI unit of pressure is:','pascal','joule','watt','newton',0,'Pressure is measured in pascals (Pa).'],
['One pascal is equal to:','N m','N/m²','kg m/s','J m',1,'Pressure = force/area, so 1 Pa = 1 N m⁻².'],
['The SI unit of electric charge is:','ampere','volt','coulomb','ohm',2,'Electric charge is measured in coulombs (C).'],
['The SI unit of potential difference is:','volt','coulomb','farad','tesla',0,'Potential difference is measured in volts (V).'],
['The SI unit of frequency is:','hertz','radian','second','watt',0,'Frequency is measured in hertz (Hz), equivalent to s⁻¹.'],
['Work and energy have the same SI unit because both represent:','Force only','Energy transferred or work done','Time interval','Electric current',1,'Both work and energy are measured in joules.'],
['Which pair contains only SI derived units?','metre and second','newton and joule','kilogram and kelvin','ampere and mole',1,'Newton and joule are both SI derived units.'],
['Which statement about SI derived units is correct?','They are formed from SI base units','They never have special names','They cannot be written in base units','They are all dimensionless',0,'SI derived units are formed by combining SI base units according to physical relationships.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
