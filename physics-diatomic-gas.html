<script>
(function(){
'use strict';
const questions = [{"q":"A diatomic gas molecule contains how many atoms?","o":["Two","One","Three","Four"],"a":0,"e":"A diatomic molecule consists of two atoms, such as N₂ or O₂."},{"q":"At ordinary temperatures, a rigid diatomic gas typically has how many active degrees of freedom?","o":["5","3","6","7"],"a":0,"e":"Three translational and two rotational degrees of freedom are active."},{"q":"For a rigid diatomic ideal gas at ordinary temperatures, molar internal energy is…","o":["\\(U=\\frac52nRT\\)","\\(U=\\frac32nRT\\)","\\(U=3nRT\\)","\\(U=nRT\\)"],"a":0,"e":"Five active quadratic degrees of freedom give \\(U=(5/2)nRT\\)."},{"q":"What is the molar heat capacity at constant volume for this model?","o":["\\(C_V=\\frac52R\\)","\\(C_V=\\frac32R\\)","\\(C_V=\\frac72R\\)","\\(C_V=R\\)"],"a":0,"e":"For f = 5, \\(C_V=(f/2)R=5R/2\\)."},{"q":"Mayer's relation for an ideal gas is…","o":["\\(C_P-C_V=R\\)","\\(C_P+C_V=R\\)","\\(C_V-C_P=R\\)","\\(C_P/C_V=R\\)"],"a":0,"e":"For one mole of ideal gas, \\(C_P-C_V=R\\)."},{"q":"For a rigid diatomic gas, molar heat capacity at constant pressure is…","o":["\\(C_P=\\frac72R\\)","\\(C_P=\\frac52R\\)","\\(C_P=\\frac32R\\)","\\(C_P=2R\\)"],"a":0,"e":"Using \\(C_P=C_V+R\\), we get \\(C_P=7R/2\\)."},{"q":"The heat-capacity ratio for a rigid diatomic gas is…","o":["\\(7/5\\)","\\(5/3\\)","\\(4/3\\)","\\(3/2\\)"],"a":0,"e":"For f = 5, \\(\\gamma=C_P/C_V=7/5\\)."},{"q":"Which rotational modes are active for a linear diatomic molecule at ordinary temperatures?","o":["Two rotations perpendicular to its molecular axis","Three rotations equally","No rotations","Only rotation along its axis"],"a":0,"e":"Two perpendicular rotational modes are active; axial rotation is usually negligible."},{"q":"How many translational degrees of freedom exist in three-dimensional space?","o":["3","2","5","6"],"a":0,"e":"Translation along x, y and z gives three degrees of freedom."},{"q":"At sufficiently high temperature, vibrational modes can become…","o":["Thermally active","Impossible","Equivalent only to translation","Independent of temperature forever"],"a":0,"e":"Higher temperatures can make vibrational energy levels accessible."},{"q":"Average energy per diatomic molecule when vibration is neglected is…","o":["\\(\\frac52k_BT\\)","\\(\\frac32k_BT\\)","\\(\\frac72k_BT\\)","\\(k_BT\\)"],"a":0,"e":"Five active quadratic degrees contribute \\(k_BT/2\\) each."},{"q":"For n moles, rigid-diatomic internal energy is…","o":["\\(\\frac52nRT\\)","\\(\\frac32nRT\\)","\\(\\frac72nRT\\)","\\(nRT/2\\)"],"a":0,"e":"Translation and two rotations give \\(U=(5/2)nRT\\)."},{"q":"At constant volume, heat supplied for a temperature rise ΔT is…","o":["\\(Q=\\frac52nR\\Delta T\\)","\\(Q=\\frac72nR\\Delta T\\)","\\(Q=nR\\Delta T\\)","\\(Q=\\frac32nR\\Delta T\\)"],"a":0,"e":"At constant volume, \\(Q=nC_V\\Delta T\\), with \\(C_V=5R/2\\)."},{"q":"At constant pressure, heat supplied is…","o":["\\(Q=\\frac72nR\\Delta T\\)","\\(Q=\\frac52nR\\Delta T\\)","\\(Q=\\frac32nR\\Delta T\\)","\\(Q=nR\\Delta T\\)"],"a":0,"e":"At constant pressure, \\(Q=nC_P\\Delta T\\), where \\(C_P=7R/2\\)."},{"q":"What is the approximate value of γ for a rigid diatomic gas?","o":["1.4","1.67","1.33","1.0"],"a":0,"e":"\\(\\gamma=7/5=1.4\\)."},{"q":"For an ideal gas, internal energy depends only on…","o":["Temperature","Pressure only","Volume only","It is always zero"],"a":0,"e":"Ideal-gas internal energy is a function of temperature alone."},{"q":"How many active degrees of freedom are assumed in the ordinary-temperature rigid-diatomic model?","o":["5","3","6","7"],"a":0,"e":"There are three translational and two rotational modes."},{"q":"Equipartition assigns what average energy to each active quadratic degree of freedom per molecule?","o":["\\(\\frac12k_BT\\)","\\(k_BT\\)","\\(2k_BT\\)","\\(\\frac32k_BT\\)"],"a":0,"e":"Each active quadratic degree contributes \\(k_BT/2\\) on average."},{"q":"A diatomic gas has 2 mol at 300 K. Its internal energy (vibration inactive) is…","o":["\\(\\frac52(2)R(300)\\)","\\(\\frac32(2)R(300)\\)","\\(\\frac72(2)R(300)\\)","\\((2)R(300)\\)"],"a":0,"e":"Use \\(U=(5/2)nRT\\)."},{"q":"Why can diatomic-gas heat capacities change with temperature?","o":["Additional rotational or vibrational modes may become active","The gas constant changes","Atoms stop moving","Molecules lose mass"],"a":0,"e":"More energy modes can become accessible as temperature rises."},{"q":"For fixed f = 5, internal energy is proportional to…","o":["\\(T\\)","\\(T^2\\)","\\(1/T\\)","\\(\\sqrt T\\)"],"a":0,"e":"\\(U=(f/2)nRT\\), so it is linear in absolute temperature."},{"q":"At equal temperature and amount, which has greater internal energy: monatomic f=3 or rigid diatomic f=5?","o":["Rigid diatomic gas","Monatomic gas","Always equal","Cannot compare"],"a":0,"e":"The rigid diatomic gas has \\((5/2)nRT\\), versus \\((3/2)nRT\\) for monatomic gas."},{"q":"For f = 5, what is the heat-capacity ratio?","o":["\\(7/5\\)","\\(5/3\\)","\\(5/2\\)","\\(2/7\\)"],"a":0,"e":"\\(\\gamma=1+2/f=7/5\\)."},{"q":"Which is a common diatomic gas at room temperature?","o":["Nitrogen (N₂)","Helium (He)","Argon (Ar)","Neon (Ne)"],"a":0,"e":"Nitrogen gas consists of diatomic N₂ molecules."},{"q":"At fixed volume, if pressure doubles, absolute temperature…","o":["Doubles","Halves","Quadruples","Stays unchanged"],"a":0,"e":"The ideal-gas law gives \\(P\\propto T\\) at fixed volume and amount."},{"q":"Change in internal energy for a rigid diatomic gas is…","o":["\\(\\Delta U=\\frac52nR\\Delta T\\)","\\(\\Delta U=\\frac32nR\\Delta T\\)","\\(\\Delta U=\\frac72nR\\Delta T\\)","\\(\\Delta U=nR\\Delta T\\)"],"a":0,"e":"Since \\(C_V=5R/2\\), \\(\\Delta U=nC_V\\Delta T\\)."},{"q":"If a diatomic gas has \\(C_V=5R/2\\), its molar \\(C_P\\) is…","o":["\\(7R/2\\)","\\(3R/2\\)","\\(5R/2\\)","\\(R/2\\)"],"a":0,"e":"Mayer's relation gives \\(C_P=C_V+R=7R/2\\)."},{"q":"For an ideal gas, γ generally becomes larger when there are…","o":["Fewer active degrees of freedom","More active degrees of freedom","No translational motion","Infinite heat capacity"],"a":0,"e":"For f degrees, \\(\\gamma=1+2/f\\); fewer active degrees gives a larger ratio."},{"q":"Which description best fits the ordinary-temperature rigid-diatomic model?","o":["Three translational and two rotational modes active; vibration mostly inactive","Only translation active","All vibration modes fully active","No degrees of freedom"],"a":0,"e":"This model includes translation and two rotations but neglects vibration at ordinary temperatures."},{"q":"A rigid diatomic gas has γ = 1.4. Which values of molar heat capacities are consistent?","o":["\\(C_V=\\frac52R,\\ C_P=\\frac72R\\)","\\(C_V=\\frac32R,\\ C_P=\\frac52R\\)","\\(C_V=R,\\ C_P=2R\\)","\\(C_V=\\frac72R,\\ C_P=\\frac52R\\)"],"a":0,"e":"The rigid-diatomic model gives \\(C_V=5R/2\\) and \\(C_P=7R/2\\), with ratio 1.4."}];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;\n if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';\n if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Diatomic Gas Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
