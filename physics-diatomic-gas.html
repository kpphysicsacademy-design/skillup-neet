<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}

h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#174a78}.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}
.progress-row{display:flex;justify-content:space-between;gap:10px;margin:16px 0 7px;font-size:12px;font-weight:900;color:var(--muted)}

.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>⚛️ Diatomic Gas</h1><p class="muted">Practice degrees of freedom, internal energy, and heat capacities with 30 questions.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"A diatomic gas molecule contains",o:["one atom","two atoms","three atoms","four atoms"],a:1,e:"Diatomic means each molecule contains two atoms."},
{q:"Which of the following is a diatomic gas under ordinary conditions?",o:["He","Ne","N₂","Ar"],a:2,e:"Nitrogen exists naturally as diatomic N₂ molecules."},
{q:"At ordinary temperatures, a rigid diatomic molecule has how many active degrees of freedom?",o:["3","4","5","7"],a:2,e:"A rigid linear diatomic molecule has three translational and two rotational degrees of freedom, giving f = 5."},
{q:"For a diatomic ideal gas at ordinary temperatures, neglecting vibration, the internal energy of n moles is",o:["\\\\(\\frac{3}{2}nRT\\\\)","2nRT","\\\\(\\frac{5}{2}nRT\\\\)","\\\\(\\frac{7}{2}nRT\\\\)"],a:2,e:"With five active degrees of freedom, U = \\\\(\\frac{5}{2}nRT\\\\)."},
{q:"The molar heat capacity at constant volume of a rigid diatomic ideal gas is",o:["3R/2","2R","5R/2","7R/2"],a:2,e:"\\\\(C_v=\\frac{f}{2}R=\\frac{5R}{2}\\\\) for five active degrees of freedom."},
{q:"The molar heat capacity at constant pressure of a rigid diatomic ideal gas is",o:["3R/2","5R/2","7R/2","9R/2"],a:2,e:"\\\\(C_p=C_v+R=\\frac{5R}{2}+R=\\frac{7R}{2}\\\\)."},
{q:"The ratio γ = \\\\(C_p/C_v\\\\) for a rigid diatomic ideal gas is",o:["4/3","5/3","7/5","9/7"],a:2,e:"For f = 5, \\\\(\\gamma=\\frac{f+2}{f}=\\frac{7}{5}\\\\)."},
{q:"The average translational kinetic energy per molecule of a diatomic ideal gas at temperature T is",o:["kBT","(1/2)kBT","\\\\(\\frac{3}{2}k_BT\\\\)","\\\\(\\frac{5}{2}k_BT\\\\)"],a:2,e:"Translational motion has three degrees of freedom, so the average translational kinetic energy is \\\\(\\frac{3}{2}k_BT\\\\)."},
{q:"For a rigid diatomic ideal gas, the average energy including translation and rotation per molecule is",o:["\\\\(\\frac{3}{2}k_BT\\\\)","\\\\(\\frac{5}{2}k_BT\\\\)","(7/2)kBT","5kBT"],a:1,e:"Five active quadratic degrees of freedom give average molecular energy \\\\(\\frac{5}{2}k_BT\\\\) when vibration is neglected."},
{q:"If vibrational modes become active at high temperature, the heat capacity of a diatomic gas generally",o:["decreases","increases","becomes zero","is independent of temperature"],a:1,e:"Activation of vibrational degrees of freedom adds energy storage modes and increases heat capacity."},
{q:"For a fixed amount of a diatomic ideal gas with inactive vibration, doubling absolute temperature makes its internal energy",o:["half","unchanged","double","four times"],a:2,e:"U = \\\\(\\frac{5}{2}nRT\\\\), so for fixed n, U is proportional to absolute temperature."},
{q:"During an isothermal process of an ideal diatomic gas, the change in internal energy is",o:["positive","negative","zero","always infinite"],a:2,e:"For an ideal gas, internal energy depends only on temperature, so constant T gives \\\\(\\Delta U=0\\\\)."},
{q:"For a rigid diatomic ideal gas, the change in internal energy for temperature change ΔT is",o:["(3/2)nRΔT","2nRΔT","\\\\(\\frac{5}{2}nR\\Delta T\\\\)","(7/2)nRΔT"],a:2,e:"With Cᵥ = 5R/2 per mole, ΔU = \\\\(\\frac{5}{2}nR\\Delta T\\\\)."},
{q:"Which pair consists of common diatomic gases?",o:["He and Ne","N₂ and O₂","Ar and He","CO₂ and CH₄"],a:1,e:"Nitrogen and oxygen are commonly found as diatomic molecules, N₂ and O₂."},
{q:"For a rigid diatomic ideal gas, the relation between U and PV is",o:["U = PV","U = (3/2)PV","\\\\(U=\\frac{5}{2}PV\\\\)","U = (7/2)PV"],a:2,e:"Since PV = nRT and U = \\\\(\\frac{5}{2}nRT\\\\), \\\\(U=\\frac{5}{2}PV\\\\) when vibration is neglected."},
{q:"For a rigid diatomic ideal gas at ordinary temperatures, Cv is",o:["R","3R/2","5R/2","7R/2"],a:2,e:"With five active degrees of freedom, Cv = (5/2)R."},
{q:"For the same gas, Cp is",o:["3R/2","5R/2","7R/2","4R"],a:2,e:"Using Cp = Cv + R gives Cp = (7/2)R."},
{q:"The heat-capacity ratio for a rigid diatomic ideal gas is",o:["5/3","7/5","4/3","9/7"],a:1,e:"Gamma = Cp/Cv = (7/2 R)/(5/2 R) = 7/5."},
{q:"A rigid diatomic molecule has how many rotational degrees of freedom?",o:["1","2","3","5"],a:1,e:"A linear rigid diatomic molecule has two independent rotational degrees of freedom."},
{q:"At ordinary temperatures, the vibrational contribution is often neglected because",o:["vibrational modes are not easily excited","molecules do not move","temperature is exactly zero","rotation is impossible"],a:0,e:"Many vibrational modes require more energy to excite than rotational modes."},
{q:"The internal energy of a rigid diatomic ideal gas is proportional to",o:["absolute temperature","pressure only","volume only","square of temperature"],a:0,e:"With vibration neglected, U = (5/2)nRT, so U is proportional to T for fixed n."},
{q:"If the absolute temperature doubles, the internal energy of a fixed amount of rigid diatomic ideal gas",o:["halves","doubles","quadruples","does not change"],a:1,e:"For fixed n, internal energy is directly proportional to absolute temperature."},
{q:"During an isothermal process, the internal energy change of an ideal diatomic gas is",o:["positive","negative","zero","always infinite"],a:2,e:"Ideal-gas internal energy depends on temperature; in an isothermal process ΔT = 0."},
{q:"For a rigid diatomic ideal gas, Cp − Cv equals",o:["R","2R","(5/2)R","zero"],a:0,e:"Mayer's relation gives Cp − Cv = R for an ideal gas."},
{q:"The average energy per molecule for five active quadratic degrees of freedom is",o:["kBT","(3/2)kBT","(5/2)kBT","(7/2)kBT"],a:2,e:"Equipartition gives (1/2)kBT per quadratic degree of freedom, for total (5/2)kBT."},
{q:"For n moles of a rigid diatomic ideal gas, U is",o:["nRT","(3/2)nRT","(5/2)nRT","(7/2)nRT"],a:2,e:"Neglecting vibration, U = (5/2)nRT."},
{q:"For a diatomic ideal gas, the ratio Cp/Cv is greater than one because",o:["Cp = Cv + R","Cp = Cv − R","Cv is zero","pressure is zero"],a:0,e:"At constant pressure, heat is also used for expansion work, so Cp exceeds Cv by R."},
{q:"Which gas is diatomic?",o:["Argon","Helium","Hydrogen","Neon"],a:2,e:"Hydrogen gas exists as H₂ molecules under ordinary conditions."},
{q:"At the same temperature, the mean translational kinetic energy per molecule of a diatomic gas compared with a monatomic gas is",o:["always greater","always smaller","the same","zero"],a:2,e:"Mean translational kinetic energy per molecule is (3/2)kBT for any ideal gas at temperature T."},
{q:"If vibrational modes become active, the effective heat capacity of a diatomic gas generally",o:["decreases","increases","becomes zero","cannot change"],a:1,e:"Excited vibrational modes add energy-storage degrees of freedom and increase heat capacity."}
]
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Diatomic Gas Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
