<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Diatomic Gas</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>⚛️ Diatomic Gas</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['A diatomic gas molecule contains','one atom','two atoms','three atoms','four atoms',1,'Diatomic means each molecule contains two atoms.'],
['Which of the following is a diatomic gas under ordinary conditions?','He','Ne','N₂','Ar',2,'Nitrogen exists naturally as diatomic N₂ molecules.'],
['At ordinary temperatures, a rigid diatomic molecule has how many active degrees of freedom?','3','4','5','7',2,'A rigid linear diatomic molecule has three translational and two rotational degrees of freedom, giving f = 5.'],
['For a diatomic ideal gas at ordinary temperatures, neglecting vibration, the internal energy of n moles is','(3/2)nRT','2nRT','(5/2)nRT','(7/2)nRT',2,'With five active degrees of freedom, U = (5/2)nRT.'],
['The molar heat capacity at constant volume of a rigid diatomic ideal gas is','3R/2','2R','5R/2','7R/2',2,'Cᵥ = (f/2)R = 5R/2 for five active degrees of freedom.'],
['The molar heat capacity at constant pressure of a rigid diatomic ideal gas is','3R/2','5R/2','7R/2','9R/2',2,'Cₚ = Cᵥ + R = 5R/2 + R = 7R/2.'],
['The ratio γ = Cₚ/Cᵥ for a rigid diatomic ideal gas is','4/3','5/3','7/5','9/7',2,'For f = 5, γ = (f+2)/f = 7/5.'],
['The average translational kinetic energy per molecule of a diatomic ideal gas at temperature T is','kBT','(1/2)kBT','(3/2)kBT','(5/2)kBT',2,'Translational motion has three degrees of freedom, so the average translational kinetic energy is (3/2)kBT.'],
['For a rigid diatomic ideal gas, the average energy including translation and rotation per molecule is','(3/2)kBT','(5/2)kBT','(7/2)kBT','5kBT',1,'Five active quadratic degrees of freedom give average molecular energy (5/2)kBT when vibration is neglected.'],
['If vibrational modes become active at high temperature, the heat capacity of a diatomic gas generally','decreases','increases','becomes zero','is independent of temperature',1,'Activation of vibrational degrees of freedom adds energy storage modes and increases heat capacity.'],
['For a fixed amount of a diatomic ideal gas with inactive vibration, doubling absolute temperature makes its internal energy','half','unchanged','double','four times',2,'U = (5/2)nRT, so for fixed n, U is proportional to absolute temperature.'],
['During an isothermal process of an ideal diatomic gas, the change in internal energy is','positive','negative','zero','always infinite',2,'For an ideal gas, internal energy depends only on temperature, so constant T gives ΔU = 0.'],
['For a rigid diatomic ideal gas, the change in internal energy for temperature change ΔT is','(3/2)nRΔT','2nRΔT','(5/2)nRΔT','(7/2)nRΔT',2,'With Cᵥ = 5R/2 per mole, ΔU = (5/2)nRΔT.'],
['Which pair consists of common diatomic gases?','He and Ne','N₂ and O₂','Ar and He','CO₂ and CH₄',1,'Nitrogen and oxygen are commonly found as diatomic molecules, N₂ and O₂.'],
['For a rigid diatomic ideal gas, the relation between U and PV is','U = PV','U = (3/2)PV','U = (5/2)PV','U = (7/2)PV',2,'Since PV = nRT and U = (5/2)nRT, U = (5/2)PV when vibration is neglected.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
