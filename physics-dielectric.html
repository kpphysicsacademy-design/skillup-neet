<section class="hero"><h1>⚡ Dielectric</h1><p class="muted">Practise polarisation, relative permittivity, susceptibility, dielectric strength, capacitor behaviour and dielectric insertion.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>

<script>
(function(){
'use strict';
let index=0, chosen=null, locked=false, score=0, streak=0;
const questions = [{"q":"A dielectric is a material that…","o":["Conducts current freely","Polarises in an electric field","Always produces magnetic fields","Contains no bound charges"],"a":1,"e":"A dielectric is an insulator whose bound charges shift slightly under an electric field, causing polarisation."},{"q":"The relative permittivity (dielectric constant) K is defined as…","o":["ε/ε₀","ε₀/ε","ε + ε₀","εε₀"],"a":0,"e":"Relative permittivity is K = ε/ε₀."},{"q":"For a linear dielectric, electric susceptibility χₑ and relative permittivity are related by…","o":["K = χₑ","K = 1 + χₑ","K = 1 − χₑ","K = χₑ − 1/K"],"a":1,"e":"In SI, K = 1 + χₑ for a linear isotropic dielectric."},{"q":"A dielectric placed in an external electric field becomes polarised because…","o":["Free electrons flow through it without resistance","Bound charges shift slightly in opposite directions","All atoms become ions permanently","The electric field must vanish everywhere"],"a":1,"e":"The applied field slightly displaces bound positive and negative charges, creating dipoles."},{"q":"For a capacitor completely filled with a dielectric of relative permittivity K, the capacitance is…","o":["C₀/K","KC₀","C₀ + K","C₀ − K"],"a":1,"e":"For fixed geometry, C = K C₀ when the dielectric completely fills the gap."},{"q":"A capacitor has vacuum capacitance 4 μF. Filling it completely with K = 3 gives…","o":["1.33 μF","4 μF","7 μF","12 μF"],"a":3,"e":"C = KC₀ = 3 × 4 μF = 12 μF."},{"q":"The SI unit of electric susceptibility is…","o":["Farad","Coulomb","Dimensionless","Volt per metre"],"a":2,"e":"Electric susceptibility χₑ is dimensionless."},{"q":"In a dielectric, the induced dipole moment per unit volume is called…","o":["Electric flux","Polarisation","Permittivity only","Capacitance"],"a":1,"e":"Polarisation P is the electric dipole moment per unit volume."},{"q":"For a linear isotropic dielectric, polarisation P is related to field E by…","o":["P = ε₀χₑE","P = E/(ε₀χₑ)","P = ε₀E/χₑ","P = χₑ/E"],"a":0,"e":"In SI, P = ε₀χₑE for a linear isotropic dielectric."},{"q":"The electric field inside an ideal conductor in electrostatic equilibrium is…","o":["Nonzero everywhere","Zero","Equal to the external field","Always infinite"],"a":1,"e":"Free charges redistribute until the electrostatic field inside the conducting material is zero."},{"q":"A dielectric slab is inserted fully into a capacitor connected to a battery. Which quantity stays fixed ideally?","o":["Charge on plates","Potential difference","Capacitance","Stored charge density in every case"],"a":1,"e":"The battery maintains a fixed potential difference."},{"q":"When a dielectric is inserted into a battery-connected capacitor, its capacitance…","o":["Decreases","Increases","Stays unchanged","Becomes zero"],"a":1,"e":"The dielectric increases capacitance by the factor K for full filling."},{"q":"When a dielectric is inserted into a battery-connected capacitor, its charge generally…","o":["Increases","Decreases","Remains fixed","Becomes zero"],"a":0,"e":"Since Q = CV and V is fixed while C increases, Q increases."},{"q":"When a dielectric is inserted into an isolated charged capacitor, its free charge…","o":["Increases by K","Decreases by K","Remains constant","Changes sign"],"a":2,"e":"An isolated capacitor has no path for free charge to flow on or off its plates."},{"q":"For an isolated charged capacitor, a dielectric is inserted fully. Its potential difference becomes…","o":["KV₀","V₀/K","V₀","Zero in all cases"],"a":1,"e":"With Q fixed and C increasing to KC₀, V = Q/C decreases to V₀/K."},{"q":"For an isolated charged capacitor, a dielectric is inserted fully. Its stored energy becomes…","o":["KU₀","U₀/K","U₀","K²U₀"],"a":1,"e":"With Q fixed, U = Q²/(2C); increasing C by K reduces energy to U₀/K."},{"q":"For a capacitor connected to a battery, a dielectric is inserted fully. Its stored energy becomes…","o":["U₀/K","KU₀","U₀","Zero"],"a":1,"e":"With V fixed, U = ½CV²; capacitance increases by K, so energy increases by K."},{"q":"The dielectric strength of a material is…","o":["Its relative permittivity only","The maximum electric field it can withstand before breakdown","Its capacitance in farads","The speed of light in it"],"a":1,"e":"Dielectric strength is the maximum field before electrical breakdown occurs."},{"q":"Electrical breakdown of a dielectric occurs when…","o":["Its field exceeds its dielectric strength","Its capacitance is finite","It is placed in vacuum","Its polarisation is zero"],"a":0,"e":"Above the breakdown field, the material may become conducting and fail as an insulator."},{"q":"A dielectric reduces the Coulomb force between fixed charges by a factor K in a uniform medium. The force becomes…","o":["KF₀","F₀/K","F₀/K²","F₀"],"a":1,"e":"In a homogeneous dielectric, F = F₀/K for the same charges and separation."},{"q":"If K = 5 and vacuum electric field for a given configuration is E₀, the field in the ideal dielectric is…","o":["5E₀","E₀/5","E₀","E₀/25"],"a":1,"e":"For the same free-charge configuration in a uniform dielectric, the field is reduced by K in the idealised comparison."},{"q":"Which material property most directly measures how strongly a dielectric polarises in response to an electric field?","o":["Electric susceptibility","Resistance","Mass density","Magnetic permeability only"],"a":0,"e":"Electric susceptibility quantifies the linear response of polarisation to the applied field."},{"q":"For a vacuum-filled parallel-plate capacitor, C₀ = ε₀A/d. With a dielectric fully inserted, C is…","o":["ε₀A/(Kd)","Kε₀A/d","ε₀d/(KA)","A/(Kε₀d)"],"a":1,"e":"The dielectric permittivity is ε = Kε₀, giving C = Kε₀A/d."},{"q":"A 2 μF capacitor is fully filled with a dielectric K = 4. The new capacitance is…","o":["0.5 μF","2 μF","6 μF","8 μF"],"a":3,"e":"C = KC₀ = 4 × 2 μF = 8 μF."},{"q":"The relative permittivity of vacuum is…","o":["0","1","ε₀","Infinite"],"a":1,"e":"Vacuum is the reference medium, so its relative permittivity is 1."},{"q":"A dielectric is inserted between capacitor plates mainly to…","o":["Reduce capacitance","Increase capacitance and modify the field","Make the plates conductively join","Eliminate all stored charge in every case"],"a":1,"e":"A dielectric increases capacitance and polarisation changes the electric field response."},{"q":"For a linear dielectric, electric displacement D is…","o":["εE","E/ε","ε + E","ε₀/E"],"a":0,"e":"For a linear homogeneous dielectric, D = εE."},{"q":"The SI unit of electric displacement D is…","o":["C/m²","N/C","F/m","J/C"],"a":0,"e":"Electric displacement has units of charge per area, C m⁻²."},{"q":"A dielectric is a good insulator mainly because…","o":["It has abundant freely moving charges","Its charges are mostly bound and cannot move freely through the material","Its permittivity is always zero","It cannot be polarised"],"a":1,"e":"Bound charges can shift locally, but generally cannot travel freely through the dielectric as conduction charges."},{"q":"A 6 μF capacitor is connected to a 10 V battery. A dielectric K = 2 fully fills the gap. The final charge is…","o":["30 μC","60 μC","120 μC","3 μC"],"a":2,"e":"C = 12 μF and Q = CV = 12 μF × 10 V = 120 μC."}];
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function typesetMath(){if(window.MathJax?.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options'),$('feedback')].filter(Boolean)).catch(()=>{});}}
window.addEventListener('load',typesetMath);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
 typesetMath();
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Capacitor Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
   if(window.MathJax?.typesetPromise) window.MathJax.typesetPromise([review]).catch(()=>{});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
