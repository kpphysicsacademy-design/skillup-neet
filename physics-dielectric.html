<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Dielectric</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}
</style></head>
<body><div class="wrap"><div class="card"><h1>⚡ Dielectric</h1>
<div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a>
</div></div>
<script>
const qs=[
['A dielectric is a material that is generally','a good conductor of electric current','an insulating material that polarises in an electric field','a permanent magnet','a source of free electrons only',1,'A dielectric is an electrical insulator whose bound charges can shift slightly under an electric field, producing polarisation.'],
['The main effect of placing a dielectric in an electric field is','polarisation','ionisation of all atoms','complete removal of charges','creation of a magnetic monopole',0,'The bound charges in a dielectric undergo small displacements, producing electric polarisation.'],
['The relative permittivity (dielectric constant) K is defined as','ε₀/ε','ε/ε₀','ε+ε₀','ε−ε₀',1,'Relative permittivity is K=ε/ε₀.'],
['For a dielectric medium, the permittivity is','ε=Kε₀','ε=ε₀/K','ε=K/ε₀','ε=ε₀−K',0,'The absolute permittivity of a dielectric is ε=Kε₀.'],
['If a dielectric of constant K completely fills a parallel-plate capacitor, its capacitance becomes','C₀/K','KC₀','C₀+K','C₀−K',1,'For complete filling, C=K C₀.'],
['A dielectric reduces the electric field inside a capacitor, compared with vacuum, by a factor of','K','1/K','K²','2K',1,'For a fixed free charge on the plates, E=E₀/K when the dielectric completely fills the gap.'],
['Polarisation vector P represents','magnetic moment per unit volume','electric dipole moment per unit volume','charge per unit area only','electric field per unit charge',1,'Polarisation P is electric dipole moment per unit volume.'],
['The SI unit of polarisation P is','C/m²','C/m³','C·m','N/C',0,'Since P is dipole moment per unit volume, its SI unit is C/m².'],
['For a linear isotropic dielectric, polarisation is related to electric field by','P=ε₀χₑE','P=χₑE','P=E/χₑ','P=ε₀E/χₑ',0,'For a linear dielectric, P=ε₀χₑE, where χₑ is electric susceptibility.'],
['For a linear dielectric, relative permittivity and electric susceptibility are related by','K=χₑ','K=1+χₑ','K=1−χₑ','K=χₑ−1',1,'The relation is K=1+χₑ.'],
['A capacitor has vacuum capacitance 2 μF. A dielectric of K=5 completely fills the gap. New capacitance is','0.4 μF','2.5 μF','10 μF','25 μF',2,'C=KC₀=5×2 μF=10 μF.'],
['A capacitor remains connected to a battery while a dielectric is inserted completely. The potential difference','increases K times','decreases K times','remains constant','becomes zero',2,'Because the battery fixes the potential difference across the capacitor.'],
['A charged capacitor is disconnected from its battery before a dielectric is inserted. The free charge on its plates','remains constant','increases K times','decreases K times','becomes zero',0,'With the capacitor isolated, charge cannot flow to or from the plates, so Q remains constant.'],
['For an isolated charged capacitor, insertion of a dielectric completely between the plates makes the potential difference','K times larger','K times smaller','unchanged','zero only if K=1',1,'With Q constant and C increasing K times, V=Q/C decreases by a factor K.'],
['The force between free charges embedded in a homogeneous dielectric, compared with vacuum, is generally','K times larger','K times smaller','unchanged','zero',1,'For the same charges and separation, Coulomb force in a homogeneous dielectric is reduced by the factor K.']
];
let i=0,score=0,answered=false;const $=x=>document.getElementById(x);
function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}
function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});if(ok){score++;$('xp').textContent='✨ Correct! +1 XP'}else $('xp').textContent='❌ Incorrect. '+q[6];$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}
function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();
</script></body></html>
