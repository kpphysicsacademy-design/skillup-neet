<script>
(()=>{const Q=[
["What is the main use of dimensional analysis?",["To check physical equations","To measure mass directly","To remove units","To find temperature"],0],
["What is the dimension of velocity?",["[LT⁻¹]","[LT⁻²]","[MLT⁻¹]","[L²T⁻¹]"],0],
["What is the dimension of acceleration?",["[LT⁻¹]","[LT⁻²]","[MLT⁻²]","[L²T⁻²]"],1],
["What is the dimension of force?",["[MLT⁻¹]","[MLT⁻²]","[ML²T⁻²]","[M⁻¹LT²]"],1],
["What is the dimension of work?",["[MLT⁻²]","[ML²T⁻²]","[ML²T⁻³]","[ML⁻¹T⁻²]"],1],
["What is the dimension of power?",["[ML²T⁻²]","[ML²T⁻³]","[MLT⁻²]","[ML⁻¹T⁻²]"],1],
["What is the dimension of pressure?",["[MLT⁻²]","[ML²T⁻²]","[ML⁻¹T⁻²]","[ML⁻³]"],2],
["What is the dimension of density?",["[ML⁻³]","[ML³]","[M⁻¹L³]","[ML⁻¹]"],0],
["What is the dimension of momentum?",["[MLT⁻¹]","[MLT⁻²]","[ML²T⁻¹]","[M⁻¹LT⁻¹]"],0],
["Strain is:",["Dimensionless","[L]","[LT⁻¹]","[ML⁻¹]"],0],
["What is the dimension of gravitational constant G?",["[ML⁻¹T⁻²]","[M⁻¹L³T⁻²]","[ML³T⁻²]","[M⁻¹L²T⁻¹]"],1],
["What is the dimension of Planck constant h?",["[ML²T⁻¹]","[ML²T⁻²]","[MLT⁻¹]","[M⁻¹L²T⁻¹]"],0],
["What is the dimension of frequency?",["[T]","[T⁻¹]","[LT⁻¹]","[MLT⁻¹]"],1],
["Work and energy have:",["Different dimensions","The same dimensions","No dimensions","Only mass dimensions"],1],
["A dimensionally correct equation must have:",["Same dimensions on both sides","Only equal numerical values","No units","A larger left-hand side"],0]
];let index=0,selected=-1,score=0,answered=0;const el=id=>document.getElementById(id);function render(){const q=Q[index];selected=-1;el('counter').textContent='Question '+(index+1)+' of '+Q.length;el('question').textContent=q[0];el('options').innerHTML='';q[1].forEach((answer,j)=>{const b=document.createElement('button');b.type='button';b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+answer;b.addEventListener('click',()=>{if(el('check').disabled)return;selected=j;[...el('options').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});el('options').appendChild(b)});el('feedback').hidden=true;el('check').disabled=false;el('next').disabled=true;el('next').textContent=index===Q.length-1?'See result':'Next →'}function check(){if(selected<0){el('feedback').hidden=false;el('feedback').className='feedback bad';el('feedback').textContent='Select an answer first.';return}const q=Q[index],correct=selected===q[2];if(correct)score++;answered++;[...el('options').children].forEach((b,j)=>{if(j===q[2])b.classList.add('correct');else if(j===selected)b.classList.add('wrong')});el('feedback').hidden=false;el('feedback').className='feedback '+(correct?'good':'bad');el('feedback').textContent=correct?'Correct! +10 XP':'Correct answer: '+q[1][q[2]];el('progressText').textContent=answered+' / '+Q.length+' completed';el('fill').style.width=(answered/Q.length*100)+'%';el('check').disabled=true;el('next').disabled=false}function next(){if(index<Q.length-1){index++;render()}else{el('question').textContent='Practice complete!';el('options').innerHTML='';el('counter').textContent='Your score';el('feedback').hidden=false;el('feedback').className='feedback good';el('feedback').textContent=score+' / '+Q.length+' correct';el('check').style.display='none';el('next').style.display='none'}}el('check').addEventListener('click',check);el('next').addEventListener('click',next);render()})();
</script>
