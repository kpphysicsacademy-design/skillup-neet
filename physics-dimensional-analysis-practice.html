,["ML⁻¹T⁻²","MLT⁻²","ML²T⁻²","ML⁻³"],0,"Pressure = force/area."],["Density has dimensions:",["ML³","M⁻¹L³","ML⁻³","ML⁻¹"],2,"Density = mass/volume."],["Momentum has dimensions:",["MLT⁻¹","MLT⁻²","ML²T⁻¹","M⁻¹LT⁻¹"],0,"Momentum = mass × velocity."],["Frequency has dimensions:",["T","T⁻¹","LT⁻¹","MLT⁻¹"],1,"Frequency is cycles per time."],["Strain is:",["[L]","[LT⁻¹]","Dimensionless","[ML⁻¹]"],2,"It is a ratio of lengths."],["Gravitational constant G:",["ML⁻¹T⁻²","M⁻¹L³T⁻²","ML³T⁻²","M⁻¹L²T⁻¹"],1,"Use F = Gm₁m₂/r²."],["Planck constant h:",["ML²T⁻¹","ML²T⁻²","MLT⁻¹","M⁻¹L²T⁻¹"],0,"From E = hν."],["Same dimensions are found in:",["Work and torque","Force and pressure","Power and energy","Momentum and force"],0,"Both are ML²T⁻²."],["Homogeneity requires:",["Equal numerical values","Same dimensions on both sides","No units","Only dimensionless terms"],1,"Both sides must have equal dimensions."],["Which is dimensionless?",["Pressure","Impulse","Relative density","Power"],2,"Relative density is a ratio."],["Impulse dimensions:",["MLT⁻¹","MLT⁻²","ML²T⁻²","MT⁻¹"],0,"Impulse = force × time."],["Angular velocity:",["T","T⁻¹","LT⁻¹","MLT⁻¹"],1,"Angle is dimensionless."],["Surface tension:",["MT⁻²","MLT⁻²","ML²T⁻²","ML⁻¹T⁻²"],0,"Force per unit length."],["Dynamic viscosity:",["ML⁻¹T⁻¹","MLT⁻²","ML²T⁻¹","M⁻¹LT⁻¹"],0,"Viscosity = pressure × time."],["A limitation of dimensional analysis:",["Checks consistency","Derives relations","Finds exact numerical constants","Converts units"],2,"It cannot determine pure numerical constants."],["If x = at², dimension of a:",["LT⁻²","LT⁻¹","L²T⁻²","T⁻²"],0,"a = x/t²."],["For E = mc², E has:",["MLT⁻²","ML²T⁻²","ML²T⁻³","ML⁻¹T⁻²"],1,"Energy = mass × velocity squared."],["Spring constant k in F=kx:",["MT⁻²","MLT⁻²","ML⁻¹T⁻²","M⁻¹T²"],0,"k = force/displacement."],["Valid displacement equation:",["u+at","ut+½at²","u/t+at","u²+at"],1,"Both terms have dimension L."],["Argument of sin(ωt):",["Length","Time","Dimensionless","Force"],2,"Trigonometric arguments are dimensionless."],["Charge dimensions:",["IT","I/T","MLT⁻¹","IT⁻¹"],0,"Charge = current × time."],["Potential difference:",["ML²T⁻³I⁻¹","ML²T⁻²I⁻¹","MLT⁻²I⁻¹","ML⁻¹T⁻²"],0,"Potential = work/charge."],["[ML⁻¹T⁻²] represents:",["Energy","Pressure","Momentum","Frequency"],1,"This is pressure."],["Dimensional correctness is:",["Sufficient proof","Never useful","Necessary but not sufficient","A way to find constants"],2,"A valid equation may still contain wrong signs or constants."],["Dimensional analysis cannot find:",["Force dimensions","Energy dimensions","Numerical factor 1/2","Pressure dimensions"],2,"Pure numerical constants cannot be determined."]];let order=Q.map((_,i)=>i),pos=0,sel=-1,ans={},locked=false;const $=id=>document.getElementById(id);function render(){let q=Q[order[pos]];sel=-1;locked=false;$('meta').textContent='QUESTION '+(pos+1)+' OF '+order.length+' · +10 XP';$('question').textContent=q[0];$('options').innerHTML='';q[1].forEach((v,j)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+v;b.onclick=()=>{if(locked)return;sel=j;[...$('options').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('options').append(b)});$('feedback').className='feedback';$('feedback').textContent='';$('check').hidden=false;$('next').disabled=true;$('next').textContent=pos===order.length-1?'Finish':'Next →';$('count').textContent=Object.keys(ans).length}function finish(){try{let k='skillup-physics-dimensional-analysis-pages-v2',s={learn:false,sim:false,practice:false};s={...s,...JSON.parse(localStorage.getItem(k)||'{}')};s.practice=true;localStorage.setItem(k,JSON.stringify(s));let e=document.getElementById('pageProgress');if(e)e.textContent='Progress: '+['learn','sim','practice'].filter(x=>s[x]).length+'/3 pages completed'}catch(e){}let good=order.filter(i=>ans[i]===Q[i][2]).length,miss=order.filter(i=>ans[i]!==Q[i][2]);$('quiz').hidden=true;$('finish').hidden=false;$('score').textContent=good+'/'+order.length;$('summary').textContent='You earned '+good*10+' XP. '+miss.length+' questions for revision.';$('retry').hidden=!miss.length;$('review').innerHTML='';miss.forEach(i=>{let d=document.createElement('div');d.className='review';d.textContent=Q[i][0]+' Correct: '+Q[i][1][Q[i][2]]+'. '+Q[i][3];$('review').append(d)})}$('check').onclick=()=>{if(sel<0){$('feedback').className='feedback show bad';$('feedback').textContent='Choose an answer first.';return}let i=order[pos],q=Q[i],ok=sel===q[2];ans[i]=sel;locked=true;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');else if(j===sel)b.classList.add('wrong')});$('feedback').className='feedback show '+(ok?'good':'bad');$('feedback').textContent=(ok?'Correct! +10 XP. ':'Incorrect. Correct answer: '+q[1][q[2]]+'. ')+q[3];$('check').hidden=true;$('next').disabled=false;$('count').textContent=Object.keys(ans).length};$('next').onclick=()=>{if(pos<order.length-1){pos++;render()}else finish()};$('retry').onclick=()=>{order=order.filter(i=>ans[i]!==Q[i][2]);pos=0;ans={};$('finish').hidden=true;$('quiz').hidden=false;render()};render();</script></main><script>(()=>{let k='skillup-physics-dimensional-analysis-pages-v2',s={learn:false,sim:false,practice:false};try{s={...s,...JSON.parse(localStorage.getItem(k)||'{}')}}catch(e){}let el=document.getElementById('pageProgress'),draw=()=>{if(el)el.textContent='Progress: '+['learn','sim','practice'].filter(x=>s[x]).length+'/3 pages completed'},save=()=>{try{localStorage.setItem(k,JSON.stringify(s))}catch(e){}draw()};document.getElementById('finish')?.addEventListener('click',()=>{s.practice=true;save()});draw()})();</script><script src="/skillup-eye-shield.js?v=20261013-eye-shield-v1"></script><script src="/shared-nav.js?v=20261013-no-bottom-nav-v1"></script></body></html>
