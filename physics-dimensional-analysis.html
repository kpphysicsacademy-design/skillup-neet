<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp | Dimensional Analysis</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;margin:0;color:#172033}
.wrap{max-width:850px;margin:auto;padding:28px 18px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.xp{font-weight:800}
.card{background:white;border-radius:22px;padding:24px;margin-top:18px;box-shadow:0 5px 20px #00000012}
.mastery{font-weight:800;margin-top:18px}
.bar{height:10px;background:#e8eaf0;border-radius:99px;overflow:hidden;margin-top:10px}
.fill{height:100%;width:0;background:#58cc02;transition:.3s}
.q{font-size:1.3rem;font-weight:750;line-height:1.45}
.opts{display:grid;gap:10px;margin-top:18px}
.opts button{padding:15px;border:2px solid #e2e5eb;border-radius:14px;background:white;text-align:left;font-size:1rem;cursor:pointer}
.opts button:hover{border-color:#58cc02}
.opts button:disabled{cursor:default}
.opts button.correct{border-color:#58cc02;background:#effbea}
.opts button.wrong{border-color:#e5484d;background:#fff0f0}
.feedback{font-weight:700;margin-top:16px;min-height:24px;line-height:1.5}
.next{margin-top:18px;padding:13px 22px;border:0;border-radius:14px;background:#58cc02;color:white;font-weight:800;cursor:pointer}
.next:disabled{opacity:.45;cursor:not-allowed}
.back{display:inline-block;margin-top:18px;padding:12px 18px;border:2px solid #5146a5;border-radius:14px;color:#5146a5;text-decoration:none;font-weight:800;transition:.2s}
.back:hover{background:#5146a5;color:white;transform:translateY(-1px)}
.back:active{transform:scale(.97)}
.meta{font-size:.95rem;color:#4b5563}
@media(max-width:600px){.wrap{padding:20px 14px}.top h1{font-size:1.55rem}.card{padding:20px}.q{font-size:1.18rem}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><h1>📐 Dimensional Analysis</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></div>
<p>Master dimensions, dimensional formulae and applications with 15 NEET-style questions.</p>
<div class="mastery">🎯 Skill Mastery <span id="mastery">0 / 15</span></div>
<div class="bar"><div id="fill" class="fill"></div></div>
<section class="card">
<div id="count" class="meta">Question 1 of 15</div>
<p id="question" class="q"></p>
<div id="options" class="opts"></div>
<div id="feedback" class="feedback"></div>
<button id="next" class="next" disabled>Continue →</button>
</section>
<a class="back" href="physics-home.html">← Back to Physics Path</a>
</main>
<script>
const qs=[
['What is the main purpose of dimensional analysis?',['Analyze physical quantities using dimensions','Change the physical quantity','Remove all units','Measure temperature'],0,'Dimensional analysis uses dimensions of physical quantities to test relations, derive formulae and convert units.'],
['What is the dimension of velocity?',['[LT⁻¹]','[LT⁻²]','[MLT⁻¹]','[L²T⁻¹]'],0,'Velocity = displacement/time, so its dimension is [LT⁻¹].'],
['What is the dimension of acceleration?',['[LT⁻¹]','[LT⁻²]','[MLT⁻²]','[L²T⁻²]'],1,'Acceleration = velocity/time, giving [LT⁻²].'],
['What is the dimension of force?',['[MLT⁻¹]','[MLT⁻²]','[ML²T⁻²]','[M⁻¹LT²]'],1,'From F = ma, force has dimension [MLT⁻²].'],
['What is the dimension of work?',['[MLT⁻²]','[ML²T⁻²]','[ML²T⁻³]','[ML⁻¹T⁻²]'],1,'Work = force × displacement, so its dimension is [ML²T⁻²].'],
['What is the dimension of power?',['[ML²T⁻²]','[ML²T⁻³]','[MLT⁻²]','[ML⁻¹T⁻²]'],1,'Power = work/time, so its dimension is [ML²T⁻³].'],
['What is the dimension of pressure?',['[MLT⁻²]','[ML²T⁻²]','[ML⁻¹T⁻²]','[ML⁻³]'],2,'Pressure = force/area, giving [ML⁻¹T⁻²].'],
['What is the dimension of density?',['[ML⁻³]','[ML³]','[M⁻¹L³]','[ML⁻¹]'],0,'Density = mass/volume, so its dimension is [ML⁻³].'],
['What is the dimension of momentum?',['[MLT⁻¹]','[MLT⁻²]','[ML²T⁻¹]','[M⁻¹LT⁻¹]'],0,'Momentum = mass × velocity, giving [MLT⁻¹].'],
['Strain is:',['Dimensionless','[L]','[LT⁻¹]','[ML⁻¹]'],0,'Strain is a ratio of two lengths, so it is dimensionless.'],
['What is the dimension of the universal gravitational constant G?',['[ML⁻¹T⁻²]','[M⁻¹L³T⁻²]','[ML³T⁻²]','[M⁻¹L²T⁻¹]'],1,'From F = Gm₁m₂/r², G has dimension [M⁻¹L³T⁻²].'],
['What is the dimension of Planck constant h?',['[ML²T⁻¹]','[ML²T⁻²]','[MLT⁻¹]','[M⁻¹L²T⁻¹]'],0,'Since E = hν, h = E/ν and its dimension is [ML²T⁻¹].'],
['What is the dimension of frequency?',['[T]','[T⁻¹]','[LT⁻¹]','[MLT⁻¹]'],1,'Frequency is the number of cycles per unit time, so its dimension is [T⁻¹].'],
['Work and energy have:',['Different dimensions','The same dimensions','No dimensions','Only mass dimensions'],1,'Work and energy have the same dimension [ML²T⁻²].'],
['A valid dimensional equation requires:',['Both sides have the same dimensions','Only numbers match','Units are absent','Left side has larger dimensions'],0,'The principle of dimensional homogeneity requires every term in a valid physical equation to have the same dimensions.']
];
let i=0,xp=0,answered=false;
const $=id=>document.getElementById(id);
function render(){answered=false;$('count').textContent=`Question ${i+1} of ${qs.length}`;$('question').textContent=qs[i][0];$('options').innerHTML='';$('feedback').textContent='';$('next').disabled=true;qs[i][1].forEach((o,j)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+j)+'. '+o;b.onclick=()=>answer(j);$('options').appendChild(b)});$('fill').style.width=`${i/qs.length*100}%`}
function answer(j){if(answered)return;answered=true;const a=qs[i],ok=j===a[2];if(ok){xp+=10;$('xp').textContent=xp;$('feedback').textContent='✅ Correct! +10 XP — '+a[3]}else{$('feedback').textContent='❌ Not quite. Correct answer: '+a[1][a[2]]+' — '+a[3]}[...$('options').children].forEach((b,k)=>{b.disabled=true;if(k===a[2])b.classList.add('correct');if(k===j&&k!==a[2])b.classList.add('wrong')});$('mastery').textContent=Math.round((i+(ok?1:0))/qs.length*100)+'%';$('next').disabled=false}
$('next').onclick=()=>{if(i<qs.length-1){i++;render()}else{$('fill').style.width='100%';$('mastery').textContent='100%';$('question').textContent=`🎉 Dimensional Analysis mastered! You scored ${xp} XP out of ${qs.length*10} XP.`;$('options').innerHTML='';$('feedback').textContent='Excellent work — keep building your Physics path!';$('next').style.display='none'}};
render();
</script>
</body>
</html>
