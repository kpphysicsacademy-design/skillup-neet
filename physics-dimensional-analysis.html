<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Dimensional Analysis</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.xp{font-weight:800}.card{background:white;border-radius:22px;padding:24px;margin-top:18px;box-shadow:0 5px 20px #00000012}.bar{height:10px;background:#e8eaf0;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.3s}.q{font-size:1.3rem;font-weight:750;line-height:1.45}.opts{display:grid;gap:10px;margin-top:18px}.opts button{padding:15px;border:2px solid #e2e5eb;border-radius:14px;background:white;text-align:left;font-size:1rem;cursor:pointer;transition:.2s}.opts button:hover{border-color:#58cc02;transform:translateY(-1px)}.opts button.selected{border-color:#58cc02;background:#f3fff0}.opts button.correct{border-color:#58cc02;background:#eaffef}.opts button.wrong{border-color:#e5484d;background:#fff0f0}.feedback{font-weight:700;margin-top:16px;min-height:24px}.btn{margin-top:18px;padding:13px 22px;border:0;border-radius:14px;background:#58cc02;color:white;font-weight:800;cursor:pointer;transition:.2s;box-shadow:0 4px 0 #45a800}.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #45a800}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #45a800}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}.back{display:inline-flex;align-items:center;gap:7px;margin-top:20px;padding:12px 18px;border:2px solid #5146a5;border-radius:14px;background:white;color:#5146a5;font-weight:800;text-decoration:none;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,background .2s,color .2s}.back:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#eeeaff,transparent);transform:translateX(-120%);transition:transform .5s}.back:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 6px 18px #5146a533;background:#faf9ff;color:#40378d}.back:hover:before{transform:translateX(120%)}.back:active{transform:translateY(1px) scale(.99);box-shadow:0 2px 8px #5146a522}.back:focus-visible{outline:3px solid #c9c3ff;outline-offset:3px}@media(max-width:600px){.wrap{padding:18px 12px}.card{padding:18px}.q{font-size:1.15rem}.top{align-items:flex-start}.back{width:max-content}}</style></head><body><main class="wrap"><div class="top"><h1>📐 Dimensional Analysis</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></div><p>Master dimensions, dimensional formulae, dimensional equations and applications with 15 NEET-style questions.</p><section class="card"><div><strong>🎯 Skill Mastery</strong> <span id="masteryText">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div id="count"></div><p id="question" class="q"></p><div id="options" class="opts"></div><button id="check" class="btn" disabled>Check Answer</button><button id="next" class="btn" disabled>Continue →</button><div id="feedback" class="feedback"></div><p>💡 <span id="hint">Choose the best answer.</span></p><div id="result" style="display:none;text-align:center"><h2>🎉 Dimensional Analysis mastered!</h2><p id="score"></p><button id="retry" class="btn">Retry Skill</button></div></section><a class="back" href="physics-home.html" aria-label="Back to Physics Path">← <span>Back to Physics Path</span></a></main><script>const qs=[['What is the main purpose of dimensional analysis?',['To analyze physical quantities through their dimensions','To determine the colour of an instrument','To remove all units from a measurement','To measure temperature directly'],0,'Dimensional analysis uses the fundamental dimensions M, L and T to study physical relations.'],['The dimensional formula of velocity is:',['[LT⁻¹]','[LT⁻²]','[MLT⁻¹]','[L²T⁻¹]'],0,'Velocity is displacement divided by time, so [L]/[T] = [LT⁻¹].'],['The dimensional formula of acceleration is:',['[LT⁻¹]','[LT⁻²]','[MLT⁻²]','[L²T⁻²]'],1,'Acceleration is velocity per unit time, giving [LT⁻²].'],['The dimensional formula of force is:',['[MLT⁻¹]','[MLT⁻²]','[ML²T⁻²]','[M⁻¹LT²]'],1,'From F = ma, force has dimensions [M][LT⁻²] = [MLT⁻²].'],['The dimensional formula of work is:',['[MLT⁻²]','[ML²T⁻²]','[ML²T⁻³]','[ML⁻¹T⁻²]'],1,'Work = force × displacement, so [MLT⁻²][L] = [ML²T⁻²].'],['The dimensional formula of power is:',['[ML²T⁻²]','[ML²T⁻³]','[MLT⁻²]','[ML⁻¹T⁻²]'],1,'Power = work/time, so [ML²T⁻²]/[T] = [ML²T⁻³].'],['The dimensional formula of pressure is:',['[MLT⁻²]','[ML²T⁻²]','[ML⁻¹T⁻²]','[ML⁻³]'],2,'Pressure = force/area, giving [MLT⁻²]/[L²] = [ML⁻¹T⁻²].'],['The dimensional formula of density is:',['[ML⁻³]','[ML³]','[M⁻¹L³]','[ML⁻¹]'],0,'Density = mass/volume, so its dimensions are [ML⁻³].'],['The dimensional formula of momentum is:',['[MLT⁻¹]','[MLT⁻²]','[ML²T⁻¹]','[M⁻¹LT⁻¹]'],0,'Momentum = mass × velocity, giving [MLT⁻¹].'],['Strain is:',['Dimensionless','[L]','[LT⁻¹]','[ML⁻¹]'],0,'Strain is a ratio of two lengths, so its dimensions cancel and it is dimensionless.'],['The dimensional formula of the gravitational constant G is:',['[ML⁻¹T⁻²]','[M⁻¹L³T⁻²]','[ML³T⁻²]','[M⁻¹L²T⁻¹]'],1,'From F = Gm₁m₂/r², G = Fr²/(m₁m₂) = [M⁻¹L³T⁻²].'],['The dimensional formula of Planck constant h is:',['[ML²T⁻¹]','[ML²T⁻²]','[MLT⁻¹]','[M⁻¹L²T⁻¹]'],0,'From E = hν, h = E/ν = [ML²T⁻²]/[T⁻¹] = [ML²T⁻¹].'],['The dimensional formula of frequency is:',['[T]','[T⁻¹]','[LT⁻¹]','[MLT⁻¹]'],1,'Frequency is the number of cycles per unit time, so its dimension is [T⁻¹].'],['Work and energy have:',['Different dimensions','The same dimensions','No dimensions','Only mass dimensions'],1,'Work and energy are both measured in joules and have dimensions [ML²T⁻²].'],['A valid dimensional equation must have:',['The same dimensions on both sides','Only the same numerical value','No units on either side','A larger dimension on the left side'],0,'The principle of dimensional homogeneity requires every term in a physical equation to have the same dimensions.']];let i=0,selected=-1,score=0,answered=0;const $=id=>document.getElementById(id);function updateProgress(){answered=Math.max(answered,i);$('masteryText').textContent=answered+' / '+qs.length;$('fill').style.width=(answered*100/qs.length)+'%'}function render(){const a=qs[i];selected=-1;$('count').textContent=`Question ${i+1} of ${qs.length}`;$('question').textContent=a[0];$('options').innerHTML='';$('feedback').textContent='';$('hint').textContent='Choose the best answer.';$('check').disabled=true;$('next').disabled=true;a[1].forEach((t,j)=>{const b=document.createElement('button');b.textContent=`${String.fromCharCode(65+j)}. ${t}`;b.onclick=()=>{selected=j;[...$('options').children].forEach((x,k)=>x.classList.toggle('selected',k===j));$('check').disabled=false};$('options').appendChild(b)})}function checkAnswer(){if(selected<0)return;const a=qs[i],ok=selected===a[2];[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=ok?'✅ Correct! +10 XP — '+a[3]:'❌ Not quite. Correct answer: '+a[1][a[2]]+' — '+a[3];if(ok){score++;$('xp').textContent=score*10}answered=Math.max(answered,i+1);updateProgress();$('check').disabled=true;$('next').disabled=false}function finish(){$('question').textContent='🎉 Skill complete!';$('options').innerHTML='';$('check').style.display='none';$('next').style.display='none';$('feedback').textContent=`You scored ${score} / ${qs.length} • ${score*10} XP`;$('hint').textContent=score===15?'Excellent! Perfect dimensional analysis mastery.':'Keep practicing and try again to improve your score.';answered=15;updateProgress();$('result').style.display='block';$('score').textContent=`${score} / ${qs.length} correct`;$('fill').style.width='100%'}$('check').onclick=checkAnswer;$('next').onclick=()=>{if(i<qs.length-1){i++;render()}else finish()};$('retry').onclick=()=>{i=0;selected=-1;score=0;answered=0;$('xp').textContent='0';$('result').style.display='none';$('check').style.display='inline-block';$('next').style.display='inline-block';updateProgress();render()};updateProgress();render();</script></body></html>
