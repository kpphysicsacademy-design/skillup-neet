<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Dimensional Analysis</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>📐 Dimensional Analysis</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['Dimensional analysis is primarily used to:','Check dimensional consistency of equations','Measure the numerical value of every quantity','Convert every quantity into SI units','Determine the colour of an object',0,'Dimensional analysis checks relationships among physical quantities through their dimensions, especially the dimensional consistency of equations.'],
['The dimensions of velocity are:','[L T⁻¹]','[L T⁻²]','[M L T⁻¹]','[L² T⁻¹]',0,'Velocity is displacement divided by time, giving [L T⁻¹].'],
['The dimensions of acceleration are:','[L T⁻¹]','[L T⁻²]','[M L T⁻²]','[L² T⁻²]',1,'Acceleration is the change of velocity per unit time, giving [L T⁻²].'],
['The dimensions of force are:','[M L T⁻¹]','[M L T⁻²]','[M L² T⁻²]','[M⁻¹ L T⁻²]',1,'Force = mass × acceleration, so its dimensions are [M L T⁻²].'],
['The dimensions of work are:','[M L T⁻²]','[M L² T⁻²]','[M L² T⁻³]','[M L⁻¹ T⁻²]',1,'Work = force × displacement, giving [M L² T⁻²].'],
['The dimensions of power are:','[M L² T⁻²]','[M L² T⁻³]','[M L T⁻²]','[M L⁻¹ T⁻²]',1,'Power is work done per unit time, so its dimensions are [M L² T⁻³].'],
['The dimensions of pressure are:','[M L T⁻²]','[M L² T⁻²]','[M L⁻¹ T⁻²]','[M L⁻³]',2,'Pressure = force/area, so its dimensions are [M L⁻¹ T⁻²].'],
['The dimensions of density are:','[M L⁻³]','[M L⁻²]','[M L³]','[M⁻¹ L³]',0,'Density = mass/volume, giving [M L⁻³].'],
['The dimensions of momentum are:','[M L T⁻¹]','[M L T⁻²]','[M L² T⁻¹]','[M⁻¹ L T⁻¹]',0,'Momentum = mass × velocity, giving [M L T⁻¹].'],
['The dimensions of strain are:','[L]','[T⁻¹]','[M L T⁻²]','[1]',3,'Strain is a ratio of two lengths, so the dimensions cancel and it is dimensionless.'],
['The dimensions of gravitational constant G are:','[M L⁻¹ T⁻²]','[M⁻¹ L³ T⁻²]','[M L³ T⁻²]','[M⁻¹ L² T⁻¹]',1,'From F = Gm₁m₂/r², G has dimensions [M⁻¹ L³ T⁻²].'],
['The dimensions of Planck constant h are:','[M L T⁻¹]','[M L² T⁻¹]','[M L² T⁻²]','[M⁻¹ L³ T⁻²]',1,'Planck constant has dimensions of energy × time, giving [M L² T⁻¹].'],
['Which quantity is dimensionless?','Force','Pressure','Relative density','Momentum',2,'Relative density is a ratio of two densities, so it has no dimensions.'],
['Which pair has the same dimensions?','Force and pressure','Work and energy','Power and energy','Momentum and force',1,'Work and energy both have dimensions [M L² T⁻²].'],
['A dimensionally correct equation must have:','Different dimensions on its two sides','The same dimensions on both sides','Only the same numerical values','No physical quantities',1,'The principle of dimensional homogeneity requires both sides of a valid physical equation to have the same dimensions.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
