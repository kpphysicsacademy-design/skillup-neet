<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Dimensional Analysis</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eef7ff;color:#173b62}.wrap{max-width:1050px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.skill{background:#fff;border:2px solid #dbe7f1;border-radius:14px;padding:7px 11px;font-weight:900}.hero,.mastery,.quiz,.panel{background:#fff;border-radius:20px;padding:22px;margin:12px 0;box-shadow:0 6px 18px #123b7015}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff;position:relative}.hero:after{content:'⚡ ⭐ 🦉';position:absolute;right:25px;top:24px;font-size:32px}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #dbe7f1;border-radius:15px;background:#fff;text-align:left;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #dbe7f1}.option.selected{border-color:#1677ff;background:#eef6ff}.option.correct{border-color:#2db84d;background:#eaffef}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{padding:12px 18px;border:0;border-radius:13px;font-weight:900;cursor:pointer;margin:8px 6px 0 0}.check{background:#2db84d;color:#fff}.next{background:#dcecff;color:#145b9e}.next:disabled{opacity:.45}.feedback{margin-top:14px;padding:13px;border-radius:14px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.bar{height:13px;background:#dce8f2;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#42c95a}@media(max-width:750px){.layout{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><a href="physics-home.html">← Back to Physics Path</a><span class="skill">⚡ <span id="xp">0</span> XP</span></div><section class="hero"><div>PHYSICS • NEET 2026</div><h1>Dimensional Analysis</h1><p>LEARN → PRACTICE → MASTER • 15 focused NEET-style MCQs</p></section><section class="mastery"><b>🎯 Skill Mastery</b> <span id="mt">0 / 15</span><div class="bar"><div id="fill" class="fill"></div></div></section><div class="layout"><aside class="panel"><h3 id="count">Question 1 of 15</h3><div id="pct">7%</div><div>⚡ +10 XP each</div><div>🦉 Learn → Practice → Master</div></aside><section class="quiz"><b id="badge">Q1</b><h2 id="question"></h2><div id="options" class="options"></div><button id="check" class="btn check">Check Answer</button><button id="next" class="btn next" disabled>Next Question →</button><div id="feedback"></div><p>💡 <span id="hint">Use base dimensions M, L and T.</span></p></section></div></main><script>(function(){var quiz=[['What is the main purpose of dimensional analysis?',['To study the dimensions of physical quantities and check relations between them','To change a physical quantity into a different quantity','To remove all units from physics','To measure temperature directly'],0,'Dimensional analysis uses dimensions such as M, L and T to examine physical relations.'],['The dimensional formula of velocity is:',['[LT^-1]','[LT^-2]','[MLT^-1]','[L^2T^-1]'],0,'Velocity = displacement/time, so [L][T^-1] = [LT^-1].'],['The dimensional formula of acceleration is:',['[LT^-1]','[LT^-2]','[MLT^-2]','[L^2T^-2]'],1,'Acceleration = velocity/time, giving [LT^-2].'],['The dimensional formula of force is:',['[MLT^-1]','[MLT^-2]','[ML^2T^-2]','[M^-1LT^2]'],1,'Force = mass × acceleration = [MLT^-2].'],['The dimensional formula of work is:',['[MLT^-2]','[ML^2T^-1]','[ML^2T^-2]','[M^2LT^-2]'],2,'Work = force × displacement = [ML^2T^-2].'],['The dimensional formula of power is:',['[ML^2T^-2]','[ML^2T^-3]','[MLT^-2]','[ML^-1T^-2]'],1,'Power = work/time = [ML^2T^-3].'],['The dimensional formula of pressure is:',['[MLT^-2]','[ML^-1T^-2]','[ML^2T^-2]','[M^-1LT^-2]'],1,'Pressure = force/area = [ML^-1T^-2].'],['The dimensional formula of density is:',['[ML^-3]','[ML^3]','[M^-1L^3]','[ML^-2]'],0,'Density = mass/volume = [ML^-3].'],['The dimensional formula of momentum is:',['[MLT^-2]','[MLT^-1]','[ML^2T^-1]','[M^-1LT^-1]'],1,'Momentum = mass × velocity = [MLT^-1].'],['Which quantity is dimensionless?',['Force','Strain','Pressure','Momentum'],1,'Strain is a ratio of two lengths, so it has no dimensions.'],['The dimensional formula of gravitational constant G is:',['[ML^2T^-2]','[M^-1L^3T^-2]','[ML^-1T^-2]','[M^-1LT^-2]'],1,'From F = Gm1m2/r^2, G = Fr^2/(m1m2) = [M^-1L^3T^-2].'],['The dimensional formula of Planck constant h is:',['[ML^2T^-1]','[ML^2T^-2]','[MLT^-1]','[M^-1L^2T^-1]'],0,'From E = hν, h = E/ν = [ML^2T^-1].'],['The dimensional formula of frequency is:',['[T]','[T^-1]','[LT^-1]','[ML^-1T^-1]'],1,'Frequency is cycles per unit time, so its dimension is [T^-1].'],['Which pair has the same dimensions?',['Work and energy','Force and pressure','Power and energy','Momentum and force'],0,'Work and energy both have dimensions [ML^2T^-2].'],['For a dimensionally correct physical equation:',['Both sides must have the same dimensions','Both sides must have different dimensions','Only the numerical values must match','Units are irrelevant'],0,'The principle of dimensional homogeneity requires identical dimensions on both sides.']];var i=0,sel=-1,done=0,points=0,q=document.getElementById('question'),o=document.getElementById('options'),c=document.getElementById('check'),n=document.getElementById('next'),f=document.getElementById('feedback'),ct=document.getElementById('count'),pct=document.getElementById('pct'),b=document.getElementById('badge'),mt=document.getElementById('mt'),fill=document.getElementById('fill'),xp=document.getElementById('xp');function render(){var a=quiz[i];sel=-1;q.textContent=a[0];b.textContent='Q'+(i+1);ct.textContent='Question '+(i+1)+' of '+quiz.length;pct.textContent=Math.round((i+1)/quiz.length*100)+'%';mt.textContent=done+' / '+quiz.length;fill.style.width=(done/quiz.length*100)+'%';f.className='feedback';f.textContent='';n.disabled=true;c.disabled=false;o.innerHTML='';a[1].forEach(function(v,j){var x=document.createElement('button');x.className='option';x.textContent=String.fromCharCode(65+j)+'. '+v;x.onclick=function(){sel=j;Array.from(o.children).forEach(function(y){y.classList.remove('selected')});x.classList.add('selected')};o.appendChild(x)})}function grade(){if(sel<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}var a=quiz[i];Array.from(o.children).forEach(function(x,j){if(j===a[2])x.classList.add('correct');else if(j===sel)x.classList.add('wrong')});if(sel===a[2]){done++;points+=10;f.className='feedback good';f.textContent='🎯 Correct! +10 XP — '+a[3]}else{f.className='feedback bad';f.textContent='Not quite. Correct answer: '+a[1][a[2]]+' — '+a[3]}c.disabled=true;n.disabled=false;xp.textContent=points;mt.textContent=done+' / '+quiz.length;if(i===quiz.length-1)n.textContent='Finish Skill →'}function advance(){if(i<quiz.length-1){i++;n.textContent='Next Question →';render()}else{q.textContent='🏆 Dimensional Analysis Complete!';o.innerHTML='';c.style.display='none';n.style.display='none';f.className='feedback good';f.textContent='Skill complete. '+done+' / '+quiz.length+' correct • '+points+' XP';}}c.onclick=grade;n.onclick=advance;render()})();</script></body></html>
