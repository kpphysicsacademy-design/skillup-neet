<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SkillUp Physics | Dimensional Checking</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.opt.selected{border-color:#5146a5;background:#f4f1ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.opt:disabled{cursor:default}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>📐 Dimensional Checking</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="action">CHECK</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['Dimensional analysis is mainly used to check the:',['Dimensions and dimensional consistency of physical equations','Colour of an instrument','Exact numerical value only','Mass of an object'],0,'Dimensional analysis checks whether the dimensions on both sides of a physical equation are consistent.'],['The dimensions of velocity are:',['[L T⁻¹]','[L T]','[M L T⁻¹]','[L² T⁻¹]'],0,'Velocity is distance/time, so its dimensions are [L T⁻¹].'],['The dimensions of acceleration are:',['[L T⁻¹]','[L T⁻²]','[L² T⁻²]','[M L T⁻²]'],1,'Acceleration is velocity/time, giving [L T⁻²].'],['The dimensions of force are:',['[M L T⁻²]','[M L² T⁻¹]','[L T⁻²]','[M T⁻²]'],0,'From F=ma, force has dimensions [M L T⁻²].'],['The dimensions of work are:',['[M L T⁻²]','[M L² T⁻²]','[M L T⁻¹]','[L² T⁻²]'],1,'Work=force×distance, so [M L T⁻²]×[L]=[M L² T⁻²].'],['The dimensions of power are:',['[M L² T⁻²]','[M L² T⁻³]','[M L T⁻²]','[L² T⁻¹]'],1,'Power is work/time, giving [M L² T⁻³].'],['Which pair can be added directly in a physical equation?',['Two quantities with the same dimensions','Any two numerical values','Mass and velocity','Force and time'],0,'Only quantities with the same dimensions can be added or subtracted meaningfully.'],['Is the equation v=u+at dimensionally consistent?',['Yes','No','Only when t=0','Only in CGS units'],0,'u and at both have dimensions of velocity, so the equation is dimensionally consistent.'],['The dimensional formula of pressure is:',['[M L⁻¹ T⁻²]','[M L T⁻²]','[M L² T⁻²]','[L T⁻²]'],0,'Pressure=force/area=[M L T⁻²]/[L²]=[M L⁻¹ T⁻²].'],['The dimensions of density are:',['[M L⁻³]','[M L³]','[M L⁻²]','[L³ M⁻¹]'],0,'Density=mass/volume, so its dimensions are [M L⁻³].'],['Which quantity is dimensionless?',['Strain','Force','Velocity','Pressure'],0,'Strain is a ratio of two lengths, so its dimensions cancel and it is dimensionless.'],['The dimensions of the gravitational constant G are:',['[M⁻¹ L³ T⁻²]','[M L³ T⁻²]','[M⁻¹ L² T⁻¹]','[M L⁻² T⁻²]'],0,'From F=Gm₁m₂/r², G=Fr²/(m₁m₂), giving [M⁻¹ L³ T⁻²].'],['If an equation has different dimensions on its two sides, it is:',['Dimensionally inconsistent','Always numerically correct','Dimensionless','Valid only in SI'],0,'Different dimensions on the two sides indicate that the equation cannot be physically correct as written.'],['Dimensional analysis can be used to:',['Check equations and derive relationships between physical quantities','Determine exact numerical constants such as 2π in every case','Measure temperature directly','Remove all experimental errors'],0,'Dimensional analysis is useful for checking equations and obtaining dimensional forms of relationships, but not exact dimensionless constants.'],['Which statement about dimensional analysis is correct?',['It cannot distinguish quantities having identical dimensions','It always proves an equation is completely correct','It replaces every experiment','It determines all dimensionless constants'],0,'Different physical quantities can share the same dimensions, so dimensional consistency is necessary but not sufficient for complete correctness.']];let i=0,score=0,answered=false,selected=-1;const $=x=>document.getElementById(x);function render(){answered=false;selected=-1;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q[1].map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('action').classList.remove('hide');$('action').textContent='CHECK'});$('xp').textContent='';$('action').classList.add('hide');$('action').disabled=false;}$('action').onclick=()=>{if(selected<0)return;if(!answered){answered=true;const q=qs[i],ok=selected===q[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===selected&&!ok)b.classList.add('wrong')});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[3];if(ok)score++;$('score').textContent=`XP ${score}`;$('fill').style.width=`${(i+1)/15*100}%`;$('action').textContent=i===14?'FINISH':'Next Question →';return;}if(i<14){i++;render()}else{$('quiz').innerHTML='';$('action').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}};render();</script></body></html>
