</head><body><main class="wrap"><section class="head"><a href="physics-dimensional-constants.html">← Back to Learn</a><h1>Dimensional Constants Quiz</h1><div>30 questions • Instant feedback • Score & review</div><nav class="page-links" aria-label="Dimensional constants pages"><a href="physics-dimensional-constants.html">Learn concepts</a><a href="physics-dimensional-constants-simulator.html">Open simulator</a></nav></section><section class="quiz" id="quiz"><div class="stats"><span id="counter">Question 1 of 30</span><span id="score">XP: 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="q" id="question"></div><div id="options"></div><div id="feedback" class="feedback hide" aria-live="polite"></div><p class="hint" id="hint">Hint: derive the dimensions from the defining equation.</p><div class="actions"><button id="check">Check answer</button><button id="next" class="secondary hide">Next question →</button></div></section><section class="quiz result hide" id="finish"></section></main><script>
const bank=[["The dimensional formula of the universal gravitational constant G is","M⁻¹L³T⁻²"],["The dimensional formula of Planck constant h is","ML²T⁻¹"],["The dimensions of speed of light c are","LT⁻¹"],["The dimensional formula of Boltzmann constant kB is","ML²T⁻²Θ⁻¹"],["The dimensions of elementary charge e are","IT"],["The dimensions of permittivity ε₀ are","M⁻¹L⁻³T⁴I²"],["The dimensions of permeability μ₀ are","MLT⁻²I⁻²"],["The dimensions of universal gas constant R are","ML²T⁻²Θ⁻¹mol⁻¹"],["The dimensions of Stefan–Boltzmann constant σ are","MT⁻³Θ⁻⁴"],["The dimensions of frequency are","T⁻¹"],["From E = hν, the dimensions of h are","ML²T⁻¹"],["From F = Gm₁m₂/r², G equals","Fr²/(m₁m₂)"],["Which base dimension represents electric current?","I"],["Which base dimension represents thermodynamic temperature?","Θ"],["A pure numerical factor such as 4π is","Dimensionless"],["The dimensions of force are","MLT⁻²"],["The dimensions of energy are","ML²T⁻²"],["The dimensions of power are","ML²T⁻³"],["The dimensions of pressure are","ML⁻¹T⁻²"],["The dimensions of electric charge are","IT"],["In Coulomb's law, ε₀ can be isolated as","q²/(4πFr²)"],["From P/A = σT⁴, σ equals","(P/A)/T⁴"],["The Faraday constant represents charge per","Mole"],["The dimensional formula of the gravitational constant contains mass power","−1"],["The dimensional formula of Planck constant contains time power","−1"],["The dimensional formula of speed of light contains length power","+1"],["The dimensional formula of Boltzmann constant contains temperature power","−1"],["The dimensions of μ₀ can be derived using","B = μ₀I/(2πr)"],["Which is dimensionless?","π"],["A dimensional constant has","A definite dimensional formula"]];
let order=bank.map((_,i)=>i),index=0,score=0,chosen=-1,locked=false,wrong=[];
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function choices(i){let correct=bank[i][1],pool=bank.map(x=>x[1]).filter((v,n)=>v!==correct&&bank.findIndex(y=>y[1]===v)===n);let opts=shuffle([correct,...shuffle(pool).slice(0,3)]);return shuffle(opts)}
let currentOptions=[];
function render(){locked=false;chosen=-1;let id=order[index];currentOptions=choices(id);document.getElementById('counter').textContent='Question '+(index+1)+' of '+order.length;document.getElementById('score').textContent='XP: '+score;document.getElementById('fill').style.width=(index/order.length*100)+'%';document.getElementById('question').textContent=bank[id][0];document.getElementById('feedback').classList.add('hide');document.getElementById('next').classList.add('hide');document.getElementById('check').disabled=false;document.getElementById('check').textContent='Check answer';document.getElementById('options').innerHTML='';currentOptions.forEach((v,n)=>{let b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>{if(locked)return;chosen=n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};document.getElementById('options').appendChild(b)})}
function check(){if(locked||chosen<0)return;locked=true;let id=order[index],correct=bank[id][1],ok=currentOptions[chosen]===correct;if(ok)score+=10;else wrong.push(id);document.querySelectorAll('.opt').forEach((b,n)=>{b.disabled=true;if(currentOptions[n]===correct)b.classList.add('good');else if(n===chosen)b.classList.add('bad')});let fb=document.getElementById('feedback');fb.textContent=ok?'Great work! +10 XP. The correct answer is '+correct+'.':'Not quite. Correct answer: '+correct+'. Review the defining equation and substitute the dimensions step by step.';fb.classList.remove('hide');document.getElementById('score').textContent='XP: '+score;document.getElementById('check').disabled=true;document.getElementById('next').classList.remove('hide');document.getElementById('next').textContent=index===order.length-1?'See results':'Next question →'}
function next(){if(!locked)return;if(index<order.length-1){index++;render()}else finish()}
function finish(){document.getElementById('quiz').classList.add('hide');let f=document.getElementById('finish');f.classList.remove('hide');f.innerHTML='<h2>Practice complete!</h2><strong>'+score+' / '+(order.length*10)+' XP</strong><p>You answered '+(order.length-wrong.length)+' of '+order.length+' questions correctly on the first attempt.</p><p>Questions to revise: '+wrong.length+'</p><div class="actions" style="justify-content:center"><button onclick="restart()">Retry all 30</button><button class="secondary" onclick="retryWrong()">Retry mistakes</button></div>'}
function restart(){order=bank.map((_,i)=>i);index=0;score=0;wrong=[];document.getElementById('finish').classList.add('hide');document.getElementById('quiz').classList.remove('hide');render()}
function retryWrong(){if(!wrong.length){restart();return}order=[...new Set(wrong)];index=0;score=0;wrong=[];document.getElementById('finish').classList.add('hide');document.getElementById('quiz').classList.remove('hide');render()}
document.getElementById('check').addEventListener('click',check);document.getElementById('next').addEventListener('click',next);render();
