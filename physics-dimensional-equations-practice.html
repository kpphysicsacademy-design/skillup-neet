(function(){'use strict';
const questionsRaw=[
["The dimensions of a physical quantity express:",["Its unit symbol","Dependence on fundamental quantities","Its numerical value only","Its measuring instrument"],1,"Dimensions show how a quantity depends on fundamental quantities."],
["The dimensional formula of velocity is:",["[LT⁻¹]","[LT⁻²]","[MLT⁻¹]","[ML²T⁻²]"],0,"Velocity = displacement/time = LT⁻¹."],
["The dimensional formula of acceleration is:",["[LT⁻¹]","[LT⁻²]","[MLT⁻²]","[ML²T⁻²]"],1,"Acceleration = velocity/time = LT⁻²."],
["The dimensional formula of force is:",["[MLT⁻¹]","[MLT⁻²]","[ML²T⁻²]","[ML⁻¹T⁻²]"],1,"Force = mass × acceleration = MLT⁻²."],
["The dimensional formula of momentum is:",["[MLT⁻¹]","[MLT⁻²]","[ML²T⁻²]","[M⁻¹LT⁻¹]"],0,"Momentum = mass × velocity = MLT⁻¹."],
["The dimensional formula of work is:",["[MLT⁻²]","[ML²T⁻²]","[ML²T⁻³]","[ML⁻¹T⁻²]"],1,"Work = force × displacement = ML²T⁻²."],
["The dimensional formula of power is:",["[ML²T⁻²]","[ML²T⁻³]","[MLT⁻²]","[ML⁻¹T⁻²]"],1,"Power = work/time = ML²T⁻³."],
["The dimensional formula of pressure is:",["[MLT⁻²]","[ML⁻¹T⁻²]","[ML²T⁻²]","[ML⁻³]"],1,"Pressure = force/area = ML⁻¹T⁻²."],
["The dimensional formula of density is:",["[ML⁻³]","[ML³]","[M⁻¹L³]","[ML⁻²]"],0,"Density = mass/volume = ML⁻³."],
["The dimensional formula of frequency is:",["[T]","[T⁻¹]","[LT⁻¹]","[MLT⁻²]"],1,"Frequency is inverse of time."],
["The dimensional formula of area is:",["[L]","[L²]","[L³]","[LT⁻¹]"],1,"Area = length × breadth = L²."],
["The dimensional formula of volume is:",["[L]","[L²]","[L³]","[ML⁻³]"],2,"Volume is the product of three lengths."],
["The dimensional formula of gravitational constant G is:",["[ML⁻¹T⁻²]","[M⁻¹L³T⁻²]","[ML³T⁻²]","[M⁻¹L²T⁻¹]"],1,"From F = Gm₁m₂/r², G = [M⁻¹L³T⁻²]."],

["Which equation is dimensionally homogeneous?",["s = ut + ½at²","s = u + at²","v = u + at²","F = mv"],0,"Each term in s = ut + ½at² has dimensions of length."],
["In v² = u² + 2as, the dimensions of every term are:",["[LT⁻¹]","[L²T⁻²]","[MLT⁻²]","[L²T⁻¹]"],1,"Velocity squared and acceleration × distance both have L²T⁻²."],
["Which is dimensionless?",["Velocity","Strain","Force","Momentum"],1,"Strain is a ratio of two lengths and is dimensionless."],
["The dimensional formula of strain is:",["[L]","[L²]","[M⁰L⁰T⁰]","[T⁻¹]"],2,"Strain = change in length/original length, so it is dimensionless."],
["The dimensional formula of angular velocity is:",["[T⁻¹]","[LT⁻¹]","[T]","[MLT⁻²]"],0,"Angle is dimensionless; angular velocity has dimension T⁻¹."],
["The dimensional formula of surface tension is:",["[MT⁻²]","[MLT⁻²]","[ML⁻¹T⁻²]","[ML²T⁻²]"],0,"Surface tension = force/length = MT⁻²."],
["The dimensional formula of coefficient of viscosity is:",["[ML⁻¹T⁻¹]","[MLT⁻¹]","[ML⁻¹T⁻²]","[M⁰LT⁻¹]"],0,"Dynamic viscosity has dimensions ML⁻¹T⁻¹."],
["The dimensional formula of electric charge is:",["[IT]","[I/T]","[MLT⁻²]","[T⁻¹]"],0,"Charge = current × time = IT."],
["The dimensional formula of energy per unit volume is:",["[ML⁻¹T⁻²]","[ML²T⁻²]","[MLT⁻²]","[ML⁻³]"],0,"Energy density = energy/volume = ML⁻¹T⁻², same as pressure."],
["If x = at² and x is length, the dimensions of a are:",["[LT⁻²]","[LT²]","[L⁻¹T²]","[T⁻²]"],0,"a = x/t², so its dimensions are LT⁻²."],
["Dimensional analysis can determine:",["The value of π","A dimensionless numerical constant","Powers in a possible proportional relation","Whether a vector direction is correct"],2,"It can determine exponents in a power-law relation, not dimensionless constants."],
["A dimensionally correct equation is:",["Always physically correct","Never physically correct","Not necessarily physically correct","Always a vector equation"],2,"Dimensional consistency is necessary but not sufficient for correctness."],
["Which quantity cannot be distinguished from work by dimensions alone?",["Power","Torque","Pressure","Momentum"],1,"Torque and work share dimensions ML²T⁻² despite different physical meanings."],
["The principle of dimensional homogeneity requires:",["All terms in an equation to have the same dimensions","All terms to have the same units numerically","Every quantity to be dimensionless","Only the left side to contain dimensions"],0,"Terms added or equated in a physical equation must have matching dimensions."],

];
const original=questionsRaw.map(([q,o,a,e],i)=>({id:i+1,q,o,a,e}));
let questions=original.slice(),index=0,score=0,streak=0,chosen=null,locked=false,wrong=[];
const $=id=>document.getElementById(id);
function render(){const item=questions[index];if(!item)throw new Error('Question bank is empty');chosen=null;locked=false;$('progressText').textContent='Question '+(index+1)+' of '+questions.length;$('percent').textContent=Math.round(index/questions.length*100)+'%';$('fill').style.width=(index/questions.length*100)+'%';$('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;$('feedback').className='feedback';$('feedback').textContent='';$('check').style.display='block';$('check').disabled=true;$('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results':'Continue';$('options').innerHTML='';item.o.forEach((choice,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const l=document.createElement('span');l.className='letter';l.textContent=String.fromCharCode(65+j);const t=document.createElement('span');t.textContent=choice;b.append(l,t);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('#options .option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});}
function reset(onlyWrong){questions=onlyWrong&&wrong.length?wrong.map(w=>original.find(q=>q.q===w.q)).filter(Boolean):original.slice();index=0;score=0;streak=0;wrong=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').innerHTML='';render();window.scrollTo({top:0,behavior:'smooth'});}
function finish(){ $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';const card=document.createElement('section');card.className='panel finish';const h=document.createElement('h2');h.textContent='Dimensional Equations Complete';const s=document.createElement('div');s.className='score';s.textContent=score+' / '+questions.length;const p=document.createElement('p');p.className='muted';p.textContent=Math.round(score/questions.length*100)+'% correct • '+score*10+' XP earned';const review=document.createElement('div');review.style.textAlign='left';if(wrong.length){const title=document.createElement('h3');title.textContent='Review your mistakes';review.append(title);wrong.forEach((w,n)=>{const row=document.createElement('p');row.textContent=(n+1)+'. '+w.q+' — Correct: '+w.answer+'. '+w.explanation;review.append(row);});}else{review.textContent='Perfect score. All answers correct.';}const again=document.createElement('button');again.className='btn primary';again.textContent='Practise all questions again';again.addEventListener('click',()=>reset(false));card.append(h,s,p,review,again);if(wrong.length){const retry=document.createElement('button');retry.className='btn';retry.textContent='Retry wrong answers ('+wrong.length+')';retry.addEventListener('click',()=>reset(true));card.append(retry);}$('finishSlot').innerHTML='';$('finishSlot').appendChild(card);const key='skillup-physics-dimensional-equations-pages-v1';try{const state=Object.assign({learn:false,sim:false,practice:false},JSON.parse(localStorage.getItem(key)||'{}'));state.practice=true;localStorage.setItem(key,JSON.stringify(state));$('pageProgress').textContent='Progress: '+Object.values(state).filter(Boolean).length+'/3 pages completed';}catch(e){}}
$('check').addEventListener('click',()=>{if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});const f=$('feedback');if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='Correct. '+item.e;}else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrong.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}$('check').style.display='none';$('continue').className='btn continue show';});
$('continue').addEventListener('click',()=>{if(!locked)return;index++;if(index<questions.length)render();else finish();});
try{render();}catch(err){$('question').textContent='Unable to load the question. Please refresh the page.';$('options').replaceChildren();$('feedback').className='feedback show bad';$('feedback').textContent='Quiz loading error: '+err.message;console.error(err);}
})();
</script>
