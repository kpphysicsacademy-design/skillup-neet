<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Dimensional Equations</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;line-height:1.45}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{font-weight:700;text-align:center;color:#e08a00;min-height:24px;line-height:1.5}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>📐 Dimensional Equations</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['What is the principle of dimensional homogeneity?','Both sides of a physical equation must have the same dimensions','Both sides must have the same numerical value only','Every quantity must be dimensionless','Only SI units may be used',0,'A physically meaningful equation must have identical dimensions on both sides.'],
['Which equation is dimensionally correct?','v = u + at','v = u + a/t','v = u + at²','v = u² + at',0,'u, v and at all have dimensions LT⁻¹.'],
['Which equation is dimensionally correct?','s = ut + ½at²','s = ut + ½at','s = u/t + at²','s = u + at²',0,'Both ut and at² have dimensions of length.'],
['The equation F = ma is dimensionally valid because both sides have dimensions:','MLT⁻²','ML²T⁻²','MLT⁻¹','MT⁻²',0,'Force has dimensions MLT⁻² and ma gives the same dimensions.'],
['In the equation x = A + Bt, if x is length, the dimensions of A are:','L','LT⁻¹','LT','1',0,'A is added directly to x, so A must have the same dimensions as x: L.'],
['In the equation x = A + Bt, if x is length and t is time, the dimensions of B are:','L','LT⁻¹','T⁻¹','LT',1,'Bt must have dimensions L, so B has dimensions LT⁻¹.'],
['In the equation y = a sin(ωt), the quantity ωt must be:','Dimensionless','A length','A force','A velocity',0,'The argument of a sine function must be dimensionless, so ωt has no dimensions.'],
['Which statement about the argument of log x is correct in physics?','x must be dimensionless','x must have dimensions of length','x must have dimensions of time','x must be a force',0,'The argument of a logarithm must be dimensionless.'],
['If E = A + B, where E is energy, then A and B must have:','The same dimensions as energy','Different dimensions','Zero dimensions','Only the same units, not dimensions',0,'Only quantities with the same dimensions can be added or subtracted.'],
['For the equation P = ρgh, the dimensions of P are:','ML⁻¹T⁻²','MLT⁻²','ML²T⁻²','ML⁻³',0,'ρgh = (ML⁻³)(LT⁻²)(L) = ML⁻¹T⁻², the dimensions of pressure.'],
['Suppose T = C l^a g^b for a simple pendulum. Dimensional analysis gives a and b as:','a = 1/2, b = −1/2','a = 1, b = −1','a = −1/2, b = 1/2','a = 1/2, b = 1/2',0,'Dimensional matching gives a = 1/2 and b = −1/2.'],
['A physical equation can be dimensionally correct but still be wrong because dimensional analysis cannot determine:','The numerical dimensionless constant','Whether units are consistent','Dimensions of derived quantities','The powers of base quantities in a term',0,'Dimensional analysis cannot determine pure numerical constants such as 2, π or 1/2.'],
['Which expression can be added to another length?','2 m','3 s','4 m/s','5 kg',0,'Only a quantity with dimensions of length can be added to a length.'],
['If Q = ab and [a] = L²T⁻¹ while [b] = T⁻¹, then [Q] is:','L²T⁻²','L²','LT⁻²','L²T',0,'Multiplying dimensions gives L²T⁻¹ × T⁻¹ = L²T⁻².'],
['Which operation is allowed between quantities with different dimensions?','Multiplication','Addition','Subtraction','Equating them directly',0,'Quantities with different dimensions may be multiplied or divided, but not added or subtracted.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
