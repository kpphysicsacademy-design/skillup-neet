<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Dimensional Formulae</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{ text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>📐 Dimensional Formulae</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['What is a dimensional formula?','A unit symbol only','An expression showing a physical quantity in terms of powers of base dimensions','A numerical value only','A measurement error',1,'A dimensional formula expresses a quantity using powers of base dimensions such as M, L and T.'],
['The dimensional formula of velocity is:','L⁻¹T','LT⁻¹','L²T⁻¹','LT',1,'Velocity = displacement/time, so its dimensions are L T⁻¹.'],
['The dimensional formula of acceleration is:','LT⁻¹','LT⁻²','L²T⁻²','MLT⁻¹',1,'Acceleration = velocity/time, giving L T⁻².'],
['The dimensional formula of force is:','MLT⁻¹','MLT⁻²','ML²T⁻²','M⁻¹LT⁻²',1,'Force = mass × acceleration, giving M L T⁻².'],
['The dimensional formula of work is:','MLT⁻²','ML²T⁻²','ML²T⁻³','ML⁻¹T⁻²',1,'Work = force × displacement, giving M L² T⁻².'],
['The dimensional formula of power is:','ML²T⁻²','ML²T⁻³','MLT⁻²','ML⁻¹T⁻²',1,'Power = work/time, giving M L² T⁻³.'],
['The dimensional formula of pressure is:','MLT⁻²','ML²T⁻²','ML⁻¹T⁻²','ML⁻³',2,'Pressure = force/area, giving M L⁻¹ T⁻².'],
['The dimensional formula of density is:','ML⁻³','ML⁻²','ML³','ML⁻¹',0,'Density = mass/volume, giving M L⁻³.'],
['The dimensional formula of momentum is:','MLT⁻¹','MLT⁻²','ML²T⁻¹','M⁻¹L³T⁻²',0,'Momentum = mass × velocity, giving M L T⁻¹.'],
['The dimensional formula of strain is:','L','T⁻¹','1 (dimensionless)','MLT⁻²',2,'Strain is a ratio of two lengths, so all dimensions cancel.'],
['The dimensional formula of gravitational constant G is:','MLT⁻²','M⁻¹L³T⁻²','ML²T⁻¹','ML²T⁻³',1,'From F = Gm₁m₂/r², G has dimensions M⁻¹ L³ T⁻².'],
['The dimensional formula of Planck constant h is:','MLT⁻¹','ML²T⁻¹','ML²T⁻²','M⁻¹L³T⁻²',1,'Since h = energy/frequency, h has dimensions M L² T⁻¹.'],
['The dimensional formula of frequency is:','T','T⁻¹','LT⁻¹','MLT⁻²',1,'Frequency is the reciprocal of time, so its dimensions are T⁻¹.'],
['Which pair has the same dimensional formula?','Force and pressure','Power and energy','Work and energy','Momentum and force',2,'Work and energy both have dimensions M L² T⁻².'],
['For a physically valid equation, the dimensions of both sides must be:','Different','The same','Zero','Undefined',1,'Dimensional homogeneity requires both sides of an equation to have identical dimensions.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
