<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Dimensional Formulae</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eef7ff;color:#173b62}.wrap{max-width:1050px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.back{color:#6b35a8;font-weight:900}.skill{background:#fff;border:2px solid #dbe7f1;border-radius:14px;padding:7px 11px;font-weight:900}.hero,.mastery,.quiz,.panel{background:#fff;border-radius:20px;padding:22px;margin:12px 0;box-shadow:0 6px 18px #123b7015}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff;position:relative}.hero:after{content:'📐 ⚡ ⭐';position:absolute;right:25px;top:25px;font-size:30px}.hero h1{margin:10px 0}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}.bar{height:13px;background:#dce8f2;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#42c95a}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #dbe7f1;border-radius:15px;background:#fff;text-align:left;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #dbe7f1}.option.selected{border-color:#1677ff;background:#eef6ff}.option.correct{border-color:#2db84d;background:#eaffef}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{padding:12px 18px;border:0;border-radius:13px;font-weight:900;cursor:pointer;margin:8px 6px 0 0}.check{background:#2db84d;color:#fff}.next{background:#dcecff;color:#145b9e}.next:disabled{opacity:.45}.feedback{margin-top:14px;padding:13px;border-radius:14px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}@media(max-width:750px){.layout{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="physics-home.html">← Back to Physics Path</a><span class="skill">⚡ 0 XP</span></div><section class="hero"><div>PHYSICS • NEET 2026</div><h1>Dimensional Formulae</h1><p><b>LEARN</b> → PRACTICE → MASTER • 15 focused NEET-style MCQs</p></section><section class="mastery"><div><b>🎯 Skill Mastery</b> <span id="mt">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><div class="layout"><aside class="panel"><h3 id="count">Question 1 of 15</h3><div id="pct">7%</div><div>Dimensional Formulae</div><div>⚡ +10 XP each</div><div>📐 Learn → Practice → Master</div></aside><section class="quiz"><b id="badge">Q1</b><h2 id="q"></h2><div id="opts" class="options"></div><button id="check" class="btn check">Check Answer</button><button id="next" class="btn next" disabled>Next Question →</button><div id="fb"></div><p id="hint">💡 Use M, L, T and other base dimensions.</p><div id="result" style="display:none"><h2>🏆 Skill Complete!</h2><p id="score"></p><button id="retry" class="btn check">Retry Skill</button></div></section></div></main><script>var quiz=[{"q":"What is a dimensional formula?","o":["A. A unit symbol only","B. An expression showing a physical quantity in terms of powers of base dimensions","C. A numerical value only","D. A measurement error"],"a":"B","e":"A dimensional formula expresses a quantity using powers of base dimensions such as M, L and T."},{"q":"The dimensional formula of velocity is:","o":["A. L^-1T","B. LT^-1","C. L^2T^-1","D. LT"],"a":"B","e":"Velocity = displacement/time, so its dimensions are L T^-1."},{"q":"The dimensional formula of acceleration is:","o":["A. LT^-1","B. LT^-2","C. L^2T^-2","D. MLT^-1"],"a":"B","e":"Acceleration = velocity/time, giving L T^-2."},{"q":"The dimensional formula of force is:","o":["A. MLT^-1","B. MLT^-2","C. ML^2T^-2","D. M^-1LT^-2"],"a":"B","e":"Force = mass \u00d7 acceleration, giving M L T^-2."},{"q":"The dimensional formula of work is:","o":["A. MLT^-2","B. ML^2T^-2","C. ML^2T^-3","D. ML^-1T^-2"],"a":"B","e":"Work = force \u00d7 displacement, giving M L^2 T^-2."},{"q":"The dimensional formula of power is:","o":["A. ML^2T^-2","B. ML^2T^-3","C. MLT^-2","D. ML^-1T^-2"],"a":"B","e":"Power = work/time, giving M L^2 T^-3."},{"q":"The dimensional formula of pressure is:","o":["A. MLT^-2","B. ML^2T^-2","C. ML^-1T^-2","D. ML^-3"],"a":"C","e":"Pressure = force/area, giving M L^-1 T^-2."},{"q":"The dimensional formula of density is:","o":["A. ML^-3","B. ML^-2","C. ML^3","D. ML^-1"],"a":"A","e":"Density = mass/volume, giving M L^-3."},{"q":"The dimensional formula of momentum is:","o":["A. MLT^-1","B. MLT^-2","C. ML^2T^-1","D. M^-1L^3T^-2"],"a":"A","e":"Momentum = mass \u00d7 velocity, giving M L T^-1."},{"q":"The dimensional formula of strain is:","o":["A. L","B. T^-1","C. 1 (dimensionless)","D. MLT^-2"],"a":"C","e":"Strain is a ratio of two lengths, so all dimensions cancel."},{"q":"The dimensional formula of gravitational constant G is:","o":["A. MLT^-2","B. M^-1L^3T^-2","C. ML^2T^-1","D. ML^2T^-3"],"a":"B","e":"From F = Gm1m2/r^2, G has dimensions M^-1 L^3 T^-2."},{"q":"The dimensional formula of Planck constant h is:","o":["A. MLT^-1","B. ML^2T^-1","C. ML^2T^-2","D. M^-1L^3T^-2"],"a":"B","e":"Since h = energy/frequency, h has dimensions M L^2 T^-1."},{"q":"The dimensional formula of frequency is:","o":["A. T","B. T^-1","C. LT^-1","D. MLT^-2"],"a":"B","e":"Frequency is the reciprocal of time, so its dimensions are T^-1."},{"q":"Which pair has the same dimensional formula?","o":["A. Force and pressure","B. Power and energy","C. Work and energy","D. Momentum and force"],"a":"C","e":"Work and energy both have dimensions M L^2 T^-2."},{"q":"For a physically valid equation, the dimensions of both sides must be:","o":["A. Different","B. The same","C. Zero","D. Undefined"],"a":"B","e":"Dimensional homogeneity requires both sides of an equation to have identical dimensions."}];var i=0,sel=-1,done=0,points=0,q=document.getElementById('q'),opts=document.getElementById('opts'),check=document.getElementById('check'),next=document.getElementById('next'),fb=document.getElementById('fb'),count=document.getElementById('count'),pct=document.getElementById('pct'),badge=document.getElementById('badge'),mt=document.getElementById('mt'),fill=document.getElementById('fill'),result=document.getElementById('result'),score=document.getElementById('score');function render(){var a=quiz[i];sel=-1;q.textContent=a.q;badge.textContent='Q'+(i+1);count.textContent='Question '+(i+1)+' of '+quiz.length;pct.textContent=Math.round((i+1)/quiz.length*100)+'%';mt.textContent=done+' / '+quiz.length;fill.style.width=(done/quiz.length*100)+'%';fb.className='feedback';fb.textContent='';check.disabled=false;next.disabled=true;opts.innerHTML='';a.o.forEach(function(v,j){var b=document.createElement('button');b.className='option';b.textContent=v;b.onclick=function(){sel=j;Array.from(opts.children).forEach(function(x){x.classList.remove('selected')});b.classList.add('selected')};opts.appendChild(b)})}function grade(){if(sel<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}var a=quiz[i],ans='ABCD'.indexOf(a.a);Array.from(opts.children).forEach(function(b,j){if(j===ans)b.classList.add('correct');else if(j===sel)b.classList.add('wrong')});if(sel===ans){done++;points+=10;fb.className='feedback good';fb.textContent='🎯 Correct! +10 XP — '+a.e}else{fb.className='feedback bad';fb.textContent='Not quite. Correct answer: '+a.o[ans]+' — '+a.e}check.disabled=true;next.disabled=false;mt.textContent=done+' / '+quiz.length;if(i===quiz.length-1)next.textContent='Finish Skill →'}function advance(){if(i<quiz.length-1){i++;next.textContent='Next Question →';render()}else{q.textContent='🏆 Dimensional Formulae Complete!';opts.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+done+' / '+quiz.length+' correct • '+points+' XP';result.style.display='block';score.textContent=done+' / '+quiz.length+' correct • '+points+' XP'}}check.onclick=grade;next.onclick=advance;document.getElementById('retry').onclick=function(){i=0;sel=-1;done=0;points=0;result.style.display='none';check.style.display='';next.style.display='';next.textContent='Next Question →';render()};render();</script></body></html>
