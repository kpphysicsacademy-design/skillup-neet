<script>
(function(){
'use strict';
let index=0, chosen=null, locked=false, score=0, streak=0;
const questions = [{"q":"A charged capacitor is allowed to discharge through a resistor. Its charge with time is…","o":["Q=Q₀e^(−t/RC)","Q=Q₀(1−e^(−t/RC))","Q=Q₀e^(t/RC)","Q=Q₀+t/RC"],"a":0,"e":"During discharge, charge decays exponentially: Q(t)=Q₀e^(−t/RC)."},{"q":"The time constant of a simple RC discharging circuit is…","o":["R/C","RC","1/RC","R+C"],"a":1,"e":"The time constant is τ=RC, measured in seconds."},{"q":"The capacitor voltage during discharge is…","o":["V₀e^(−t/RC)","V₀(1−e^(−t/RC))","V₀+t/RC","Constant at V₀"],"a":0,"e":"Since V=Q/C, voltage follows the same exponential decay as charge."},{"q":"At the instant discharge begins, the magnitude of current is…","o":["Zero","V₀/R","V₀C","Infinite"],"a":1,"e":"Initially the resistor has the full capacitor voltage V₀, so |I₀|=V₀/R."},{"q":"After a very long time, the charge remaining on the capacitor approaches…","o":["Q₀","Q₀/2","Zero","Infinity"],"a":2,"e":"As t→∞, e^(−t/RC)→0, so the capacitor becomes discharged."},{"q":"After one time constant, the remaining charge is approximately…","o":["63.2% of Q₀","36.8% of Q₀","50% of Q₀","10% of Q₀"],"a":1,"e":"Q/Q₀=e⁻¹≈0.368, so about 36.8% remains."},{"q":"After one time constant, the capacitor has lost approximately…","o":["36.8% of its initial charge","50% of its initial charge","63.2% of its initial charge","99% of its initial charge"],"a":2,"e":"The lost fraction is 1−e⁻¹≈0.632, or 63.2%."},{"q":"The magnitude of the discharge current at time t is…","o":["I₀e^(−t/RC)","I₀(1−e^(−t/RC))","I₀e^(t/RC)","Constant I₀"],"a":0,"e":"The current magnitude decays as |I|=I₀e^(−t/RC). Its signed direction depends on the chosen convention."},{"q":"If R is doubled and C stays constant, the time constant…","o":["Halves","Doubles","Is unchanged","Becomes four times"],"a":1,"e":"τ=RC, so doubling R doubles the time constant."},{"q":"If C is doubled while R stays constant, the time constant…","o":["Halves","Doubles","Is unchanged","Becomes zero"],"a":1,"e":"τ is directly proportional to capacitance."},{"q":"A 4 μF capacitor discharges through a 500 kΩ resistor. The time constant is…","o":["0.2 s","2 s","20 s","200 s"],"a":1,"e":"τ=RC=(500×10³)(4×10⁻⁶)=2 s."},{"q":"A 10 μF capacitor discharges through 100 kΩ. Its time constant is…","o":["0.01 s","0.1 s","1 s","10 s"],"a":2,"e":"τ=(100×10³)(10×10⁻⁶)=1 s."},{"q":"A 6 μF capacitor initially charged to 12 V has initial charge…","o":["0.5 μC","18 μC","72 μC","720 μC"],"a":2,"e":"Q₀=CV₀=6 μF×12 V=72 μC."},{"q":"A capacitor has initial voltage 10 V. After one time constant, its voltage is about…","o":["1.0 V","3.68 V","6.32 V","10 V"],"a":1,"e":"V=V₀e⁻¹≈0.368×10 V=3.68 V."},{"q":"If the initial current magnitude is 20 mA, after one time constant it is approximately…","o":["7.36 mA","12.64 mA","10 mA","20 mA"],"a":0,"e":"I=I₀e⁻¹≈0.368×20 mA=7.36 mA."},{"q":"After three time constants, the remaining charge is approximately…","o":["95%","50%","36.8%","5.0%"],"a":3,"e":"e⁻³≈0.0498, so about 5% of the initial charge remains."},{"q":"After five time constants, the remaining charge is approximately…","o":["36.8%","13.5%","0.67%","5%"],"a":2,"e":"e⁻⁵≈0.0067, or about 0.67%."},{"q":"The energy stored in a capacitor during discharge varies as…","o":["e^(−t/RC)","e^(−2t/RC)","e^(t/RC)","A constant"],"a":1,"e":"U=Q²/(2C); since Q∝e^(−t/RC), energy U∝e^(−2t/RC)."},{"q":"If the initial stored energy is 8 J, the energy after one time constant is approximately…","o":["2.94 J","1.08 J","4.00 J","5.06 J"],"a":1,"e":"U/U₀=e⁻²≈0.1353, so U≈8×0.1353=1.08 J."},{"q":"The SI unit of the RC time constant is…","o":["Farad","Ohm","Second","Coulomb"],"a":2,"e":"Ω·F=(V/A)(C/V)=C/A=s."},{"q":"Which graph best represents charge versus time during ideal RC discharge?","o":["A straight line to zero","An exponential decay approaching zero","A rising exponential","A constant horizontal line"],"a":1,"e":"Charge falls rapidly at first and then more slowly, following Q=Q₀e^(−t/RC)."},{"q":"During discharge, the magnitude of current decreases because…","o":["The resistor gets larger continuously","The capacitor voltage and charge decrease","The capacitance continuously increases","The capacitor gains charge"],"a":1,"e":"The driving voltage decreases as the capacitor loses charge, so current magnitude also decreases."},{"q":"A 2 mF capacitor discharges through a 3 kΩ resistor. The time constant is…","o":["0.006 s","0.6 s","6 s","6000 s"],"a":2,"e":"τ=3000×0.002=6 s."},{"q":"A capacitor starts with 100 μC. How much charge remains after one time constant approximately?","o":["63.2 μC","50 μC","36.8 μC","10 μC"],"a":2,"e":"Q=100e⁻¹ μC≈36.8 μC."},{"q":"For Q=Q₀e^(−t/RC), at t=0 the charge is…","o":["Zero","Q₀","Q₀/e","Infinite"],"a":1,"e":"At t=0, the exponential factor is e⁰=1, so Q=Q₀."},{"q":"For Q=Q₀e^(−t/RC), what happens as t→∞?","o":["Q→Q₀","Q→Q₀/e","Q→0","Q→∞"],"a":2,"e":"The exponential factor approaches zero at long times."},{"q":"If the resistance is reduced to half while C stays fixed, discharge becomes…","o":["Slower, with doubled τ","Faster, with halved τ","Unchanged","Impossible"],"a":1,"e":"Halving R halves τ=RC, so the capacitor discharges faster."},{"q":"A 5 μF capacitor is initially at 20 V and discharges through 2 MΩ. The initial current magnitude is…","o":["10 μA","100 μA","1 mA","4 μA"],"a":0,"e":"I₀=V₀/R=20/(2×10⁶)=10 μA."},{"q":"A 3 μF capacitor initially holds 30 μC. Its initial voltage is…","o":["0.1 V","10 V","90 V","30 V"],"a":1,"e":"V₀=Q₀/C=30 μC/3 μF=10 V."},{"q":"In a discharging RC circuit, after each equal time interval of one time constant, the remaining charge is multiplied by…","o":["e","1−e⁻¹","e⁻¹","2"],"a":2,"e":"Each interval τ multiplies the remaining charge by e⁻¹≈0.368."}];
const originalQuestions=questions.slice();
let wrongAttempts=[];

function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);

 $('feedback').className='feedback';$('feedback').textContent='';

 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
 typesetMath();

$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Capacitance Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
   if(window.MathJax?.typesetPromise) window.MathJax.typesetPromise([review]).catch(()=>{});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
