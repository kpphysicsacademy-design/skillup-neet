.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🌀</span><h1>Displacement Current</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[
["The concept of displacement current was introduced by:",["Maxwell","Faraday","Ampere","Gauss"],0,"Maxwell introduced displacement current to make Ampere's circuital law consistent with charge conservation."],
["Displacement current is associated with:",["A changing electric field","Only a steady magnetic field","A stationary charge only","Constant resistance"],0,"A time-varying electric field gives rise to displacement current."],
["The displacement current density is given by:",["Jd=ε₀ ∂E/∂t","Jd=σE","Jd=E/ε₀","Jd=ρv"],0,"In vacuum, displacement current density is Jd=ε₀ ∂E/∂t."],
["For a capacitor being charged, displacement current exists:",["Between the capacitor plates","Only inside the battery","Only in the connecting wire","Nowhere"],0,"The changing electric field between the plates produces displacement current."],
["The SI unit of displacement current is:",["Ampere","Volt","Coulomb","Tesla"],0,"Displacement current has the same SI unit as ordinary electric current: ampere."],
["Maxwell added displacement current to Ampere's law because it explains the magnetic field produced by:",["A changing electric field","Only a permanent magnet","A stationary electric field","A neutral object"],0,"The added term accounts for the magnetic field associated with a changing electric field."],
["The displacement current through a surface is defined as:",["Id=ε₀ dΦE/dt","Id=ε₀ ΦE","Id=ΦE/ε₀","Id=qd"],0,"In vacuum, displacement current is Id=ε₀ dΦE/dt."],
["The electric flux through a capacitor gap is changing when the capacitor is:",["Being charged or discharged","Fully isolated with constant charge","Disconnected and unchanging","At absolute zero"],0,"Charging or discharging changes the electric field and hence the electric flux between the plates."],
["For an ideal charging capacitor, the displacement current between the plates is:",["Equal to the conduction current in the wires","Always zero","Twice the conduction current","Independent of the circuit current"],0,"The displacement current equals the conduction current in the external circuit for an ideal capacitor."],

["In a dielectric medium, the displacement field D is related to polarization and electric field by:",["D=ε₀E+P","D=ε₀/E","D=P−ε₀E","D=E/P"],0,"The electric displacement is D=ε₀E+P, where P is polarization."],
["If the electric field between capacitor plates increases with time, the displacement current:",["Has a nonzero value","Must be zero","Becomes negative in every case","Depends only on resistance"],0,"A time-varying electric field produces a nonzero displacement current density."],

];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
