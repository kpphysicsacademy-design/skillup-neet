<script>
(function(){
'use strict';
const questions = [{"q":"For SHM, displacement is measured from the…","o":["extreme position","equilibrium position","center of the Earth","starting time"],"a":1,"e":"Displacement x is measured relative to the equilibrium position."},{"q":"The standard displacement equation for SHM can be written as…","o":["x = A cos(ωt + φ)","x = A + ωt","x = ω²t","x = A/t"],"a":0,"e":"A common SHM form is x = A cos(ωt + φ)."},{"q":"In x = A cos(ωt + φ), A represents…","o":["frequency","amplitude","phase constant","time period"],"a":1,"e":"A is the maximum magnitude of displacement."},{"q":"The possible displacement values in SHM range from…","o":["0 to A","−A to +A","−2A to +2A","A to infinity"],"a":1,"e":"The oscillator remains between x = −A and x = +A."},{"q":"At the equilibrium position, displacement x is…","o":["A","−A","zero","A/2"],"a":2,"e":"Equilibrium is defined as x = 0."},{"q":"At the positive extreme of SHM, displacement is…","o":["−A","0","+A","+2A"],"a":2,"e":"The positive extreme corresponds to x = +A."},{"q":"At the negative extreme of SHM, displacement is…","o":["−A","0","+A","−2A"],"a":0,"e":"The negative extreme corresponds to x = −A."},{"q":"For x = A cos(ωt), the displacement at t = 0 is…","o":["0","A","−A","A/2"],"a":1,"e":"cos 0 = 1, therefore x(0) = A."},{"q":"For x = A sin(ωt), the displacement at t = 0 is…","o":["A","−A","0","2A"],"a":2,"e":"sin 0 = 0, therefore x(0) = 0."},{"q":"The phase in x = A cos(ωt + φ) is…","o":["A","ωt + φ","Aω","t/A"],"a":1,"e":"The instantaneous phase is ωt + φ."},{"q":"The phase constant φ determines the oscillator's…","o":["mass","initial phase and starting state","spring length only","total energy only"],"a":1,"e":"The phase constant sets the initial displacement and velocity."},{"q":"Displacement in SHM is maximum in magnitude at…","o":["equilibrium","the extreme positions","all points","the midpoint between equilibrium and extreme only"],"a":1,"e":"Maximum displacement magnitude is A at x = ±A."},{"q":"When the oscillator passes through equilibrium, its displacement changes sign…","o":["never","as it crosses to the other side","only after two cycles","only if amplitude is zero"],"a":1,"e":"Crossing equilibrium takes the oscillator from positive to negative displacement or vice versa."},{"q":"The SI unit of displacement is…","o":["hertz","second","metre","radian per second"],"a":2,"e":"Displacement is a length and is measured in metres."},{"q":"If amplitude is 5 cm, the maximum magnitude of displacement is…","o":["2.5 cm","5 cm","10 cm","25 cm"],"a":1,"e":"Maximum displacement magnitude equals the amplitude."},{"q":"If amplitude is 0.12 m, the minimum displacement in SHM is…","o":["0 m","−0.06 m","−0.12 m","+0.12 m"],"a":2,"e":"The displacement varies from −A to +A, so the minimum is −0.12 m."},{"q":"For x = A cos(ωt), at t = T/4 the displacement is…","o":["A","0","−A","A/2"],"a":1,"e":"At T/4, ωt = 2π(T/4)/T = π/2, and cos(π/2) = 0."},{"q":"For x = A cos(ωt), at t = T/2 the displacement is…","o":["A","0","−A","A/2"],"a":2,"e":"At T/2, the phase is π and cos π = −1."},{"q":"For x = A cos(ωt), at t = T the displacement is…","o":["A","0","−A","2A"],"a":0,"e":"After one period the phase increases by 2π, returning displacement to A."},{"q":"For x = A sin(ωt), at t = T/4 the displacement is…","o":["A","0","−A","A/2"],"a":0,"e":"At T/4, the phase is π/2 and sin(π/2) = 1."},{"q":"For x = A sin(ωt), at t = T/2 the displacement is…","o":["A","0","−A","A/2"],"a":1,"e":"At T/2, the phase is π and sin π = 0."},{"q":"A displacement of x = −A/2 means the oscillator is…","o":["half the amplitude on the negative side","at positive extreme","at equilibrium","outside its range"],"a":0,"e":"Negative displacement indicates the negative side of equilibrium."},{"q":"If x = 0.04 cos(ωt) metres, the amplitude is…","o":["0.02 m","0.04 m","0.08 m","ω m"],"a":1,"e":"The coefficient of the cosine function is the amplitude."},{"q":"If x = 3 sin(ωt + φ) cm, the amplitude is…","o":["φ cm","ω cm","3 cm","6 cm"],"a":2,"e":"The amplitude is the magnitude of the coefficient, 3 cm."},{"q":"If the amplitude doubles, the maximum displacement magnitude…","o":["halves","doubles","quadruples","stays unchanged"],"a":1,"e":"Maximum displacement magnitude is equal to amplitude."},{"q":"The displacement of a particle in SHM is periodic because…","o":["it increases forever","the motion repeats after each period","it is always zero","the frequency changes continuously"],"a":1,"e":"SHM repeats its displacement pattern every time period."},{"q":"Which displacement-time function describes ideal SHM?","o":["x = A cos(ωt + φ)","x = A + t²","x = ωt²","x = A e^t"],"a":0,"e":"Sinusoidal displacement as a function of time is characteristic of SHM."},{"q":"At the two extreme positions, displacement values are…","o":["both zero","equal in magnitude and opposite in sign","both positive","unrelated to amplitude"],"a":1,"e":"The extremes are +A and −A."},{"q":"If x = A cos(ωt + φ) and φ = 0, the initial displacement is…","o":["0","A","−A","A/2"],"a":1,"e":"At t = 0, x = A cos 0 = A."},{"q":"If x = A cos(ωt + π), the displacement at t = 0 is…","o":["A","0","−A","A/2"],"a":2,"e":"At t = 0, x = A cos π = −A."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
const wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Displacement in SHM Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
