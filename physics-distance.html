<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Distance</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.back{color:#5146a5;font-weight:800;text-decoration:none;padding:9px 12px;border-radius:12px;transition:transform .15s,background .15s,box-shadow .15s}.back:hover{background:#eeeaff;transform:translateX(-2px)}.back:focus-visible{outline:3px solid #b9b0ff;outline-offset:2px}.back:active{transform:translateX(-1px) scale(.98)}.xp{background:#fff;border:1px solid #dfe3ea;border-radius:14px;padding:7px 11px;font-weight:850;white-space:nowrap}.intro{margin:24px 0 18px}.intro h1{margin:0 0 8px;font-size:2rem;line-height:1.15}.intro p{margin:0;color:#596273;line-height:1.55}.progress{height:12px;background:#e4e7ed;border-radius:99px;overflow:hidden;margin:20px 0}.fill{height:100%;width:0;background:#58cc02;transition:width .25s ease}.card{background:#fff;border-radius:22px;padding:26px;box-shadow:0 8px 24px rgba(23,32,51,.08)}.meta{font-size:.95rem;font-weight:800;color:#596273;margin-bottom:12px}.q{font-size:1.3rem;font-weight:750;line-height:1.45;margin:0 0 20px}.options{display:grid;gap:10px}.option{padding:15px 16px;border:2px solid #dfe3ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;color:#172033;cursor:pointer;transition:border-color .15s,background .15s,transform .1s,box-shadow .15s}.option:hover:not(:disabled){border-color:#58cc02;background:#f5fff0;transform:translateY(-1px);box-shadow:0 3px 0 #dfe3ea}.option.selected{border-color:#5146a5;background:#f1efff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#ff4b4b;background:#fff0f0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{padding:12px 18px;border:0;border-radius:13px;font:inherit;font-weight:850;cursor:pointer}.check{background:#58cc02;color:#fff}.next{background:#5146a5;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:16px;min-height:24px;font-weight:750;line-height:1.5}.good{color:#177b2f}.bad{color:#b02a37}.hint{margin:18px 0 0;color:#596273;font-size:.95rem}.result{display:none;text-align:center;margin-top:20px;padding-top:18px;border-top:1px solid #e5e7eb}.result h2{margin:0 0 8px}.retry{background:#58cc02;color:#fff}@media(max-width:600px){.wrap{padding:20px 14px}.intro h1{font-size:1.65rem}.card{padding:20px}.q{font-size:1.15rem}.top{align-items:flex-start}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="#" onclick="return goBackToPhysicsPath()">← Back to Physics Path</a><span class="xp">⚡ <span id="xp">0</span> XP</span></div><section class="intro"><h1>📏 Distance</h1><p>Master path length, scalar distance and its relation to displacement with 15 focused NEET-style MCQs.</p></section><div class="progress" aria-label="Quiz progress"><div id="fill" class="fill"></div></div><section class="card"><div class="meta"><span id="count">Question 1 of 15</span> • <span id="pct">7%</span></div><h2 id="q" class="q"></h2><div id="opts" class="options"></div><div class="actions"><button id="check" class="btn check" type="button">Check Answer</button><button id="next" class="btn next" type="button" disabled>Next Question →</button></div><div id="fb" class="feedback" aria-live="polite"></div><p class="hint">💡 <span id="hint">Choose the best answer.</span></p><div id="result" class="result"><h2>🏆 Skill Complete!</h2><p id="score"></p><button id="retry" class="btn retry" type="button">Retry Skill</button></div></section></main><script>(function(){const KEY='skillupLastPhysicsPath';function rememberPath(){try{const r=document.referrer;if(!r)return;const u=new URL(r);if(u.origin!==location.origin)return;if(/(?:physics|full-physics)[^/]*path[^/]*\.html$/i.test(u.pathname)||/\/physics-home\.html$/i.test(u.pathname))sessionStorage.setItem(KEY,u.href)}catch(e){}}function goBackToPhysicsPath(){try{const saved=sessionStorage.getItem(KEY);if(saved){const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}}catch(e){}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false}window.goBackToPhysicsPath=goBackToPhysicsPath;rememberPath();const Q=[['What is distance?',['The total length of the actual path travelled by an object','The shortest directed path between two points','The change in position with direction','The final coordinate only'],0,'Distance is the total length of the actual path travelled.'],['Distance is a:',['Scalar quantity','Vector quantity','Tensor quantity','Dimensionless quantity'],0,'Distance has magnitude only, so it is a scalar quantity.'],['The SI unit of distance is:',['metre (m)','second (s)','metre per second (m/s)','newton (N)'],0,'The SI base unit of length and hence distance is metre.'],['Can distance ever be negative?',['No','Yes, when motion is westward','Yes, when displacement is negative','Only in a rotating frame'],0,'Distance is a path length and cannot be negative.'],['An object travels 5 m east and then 3 m west. Its total distance is:',['8 m','2 m','5 m','3 m'],0,'Distance adds the lengths of both parts: 5 + 3 = 8 m.'],['For motion along a straight line without changing direction, distance is equal to:',['Magnitude of displacement','Twice the displacement','Zero','Always greater than displacement'],0,'When direction does not reverse, path length equals the magnitude of displacement.'],['A runner completes one full 400 m lap and returns to the starting point. The distance travelled is:',['400 m','0 m','200 m','800 m'],0,'The runner has travelled 400 m of actual path.'],['For the same one-lap motion, the displacement is:',['0 m','400 m','200 m','−400 m'],0,'Initial and final positions are the same, so displacement is zero.'],['A car moves 10 m east, 10 m west and 5 m east. Its total distance is:',['25 m','5 m','15 m','0 m'],0,'Distance = 10 + 10 + 5 = 25 m.'],['Which relation is always true for distance d and displacement magnitude |Δr|?',['d ≥ |Δr|','d < |Δr|','d = |Δr| for every motion','d = 0 always'],0,'The actual path cannot be shorter than the straight-line separation.'],['A particle moves from A to B along a curved path of length 12 m. The straight-line separation is 7 m. Its distance travelled is:',['12 m','7 m','5 m','19 m'],0,'Distance follows the actual curved path, so it is 12 m.'],['If an object remains at rest at one position, the distance travelled is:',['0 m','Equal to its position','1 m','Undefined'],0,'No motion means no path is travelled.'],['A cyclist travels 3 km north and then 4 km east. The total distance is:',['7 km','5 km','1 km','12 km'],0,'Distance is the sum of path segments: 3 + 4 = 7 km.'],['Which statement best distinguishes distance from displacement?',['Distance depends on the actual path, while displacement depends only on initial and final positions','Distance is always a vector','Displacement is always larger than distance','Distance can be negative'],0,'Distance is path-dependent; displacement is the directed change from initial to final position.'],['A person walks 6 m forward and 6 m backward. The total distance travelled is:',['12 m','0 m','6 m','36 m'],0,'The person covers 6 m in each direction, giving 12 m total distance.']];let i=0,sel=-1,done=0,points=0,locked=false;const $=id=>document.getElementById(id),q=$('q'),o=$('opts'),f=$('fb'),c=$('check'),n=$('next'),xp=$('xp'),fill=$('fill'),count=$('count'),pct=$('pct');function render(){const a=Q[i];sel=-1;locked=false;q.textContent=a[0];count.textContent='Question '+(i+1)+' of 15';pct.textContent=Math.round((i+1)/15*100)+'%';fill.style.width=(done/15*100)+'%';f.className='feedback';f.textContent='';c.disabled=false;n.disabled=true;o.innerHTML='';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{if(locked)return;sel=item.index;Array.from(o.children).forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)})}function grade(){if(sel<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}locked=true;const a=Q[i],ok=sel===a[2];Array.from(o.children).forEach(b=>{const originalIndex=Number(b.dataset.index);b.disabled=true;if(originalIndex===a[2])b.classList.add('correct');if(originalIndex===sel&&!ok)b.classList.add('wrong')});if(ok){done++;points+=10;f.className='feedback good';f.textContent='🎯 Correct! +10 XP — '+a[3]}else{f.className='feedback bad';f.textContent='Not quite. Correct answer: '+a[1][a[2]]+' — '+a[3]}xp.textContent=points;fill.style.width=(done/15*100)+'%';c.disabled=true;n.disabled=false;if(i===14)n.textContent='Finish Skill →'}function advance(){if(i<14){i++;render()}else{q.textContent='🏆 Distance Complete!';o.innerHTML='';c.style.display='none';n.style.display='none';f.className='feedback good';f.textContent='Skill complete. '+done+' / 15 correct • '+points+' XP';$('result').style.display='block';$('score').textContent=done+' / 15 correct • '+points+' XP'}}c.onclick=grade;n.onclick=advance;$('retry').onclick=()=>{i=0;sel=-1;done=0;points=0;locked=false;xp.textContent='0';$('result').style.display='none';c.style.display='';n.style.display='';n.textContent='Next Question →';render()};render()})();</script></body></html>
