<script>
(function(){
'use strict';
const questions = [{"q":"The Doppler effect is the apparent change in a wave's…","o":["Amplitude due only to distance","Frequency due to relative motion of source and observer","Speed caused by loudness","Wavelength due only to temperature"],"a":1,"e":"The Doppler effect is the apparent change in observed frequency caused by relative motion between source and observer."},{"q":"When a sound source approaches a stationary observer, the observed frequency is generally…","o":["Higher than emitted","Lower than emitted","Always zero","Unchanged in every case"],"a":0,"e":"Approaching motion brings wavefronts closer together, increasing the observed frequency."},{"q":"When a sound source moves away from a stationary observer, the observed frequency is generally…","o":["Higher","Lower","Infinite","Always unchanged"],"a":1,"e":"Receding motion spreads wavefronts farther apart, lowering the observed frequency."},{"q":"For a stationary source and observer moving toward the source, the observed frequency is…","o":["\\(f'=f\\frac{v-v_o}{v}\\)","\\(f'=f\\frac{v+v_o}{v}\\)","\\(f'=f\\frac{v}{v+v_o}\\)","\\(f'=f\\) always"],"a":1,"e":"An observer moving toward incoming sound encounters wavefronts faster: \\(f'=f(v+v_o)/v\\)."},{"q":"For a stationary source and observer moving away from it, the observed frequency is…","o":["\\(f'=f\\frac{v+v_o}{v}\\)","\\(f'=f\\frac{v-v_o}{v}\\)","\\(f'=f\\frac{v}{v-v_o}\\)","\\(f'=2f\\)"],"a":1,"e":"Moving away reduces the rate of encountering wavefronts: \\(f'=f(v-v_o)/v\\)."},{"q":"For a stationary observer and source approaching at speed \\(v_s\\), the observed frequency is…","o":["\\(f'=f\\frac{v}{v-v_s}\\)","\\(f'=f\\frac{v}{v+v_s}\\)","\\(f'=f\\frac{v-v_s}{v}\\)","\\(f'=f\\)"],"a":0,"e":"An approaching source compresses wavefronts ahead of it, giving \\(f'=fv/(v-v_s)\\)."},{"q":"For a stationary observer and source receding at speed \\(v_s\\), the observed frequency is…","o":["\\(f'=f\\frac{v}{v-v_s}\\)","\\(f'=f\\frac{v}{v+v_s}\\)","\\(f'=f\\frac{v+v_s}{v}\\)","\\(f'=2f\\)"],"a":1,"e":"A receding source stretches the wavefront spacing, giving \\(f'=fv/(v+v_s)\\)."},{"q":"In Doppler formulas for sound, v usually represents…","o":["Source speed only","Observer speed only","Sound speed in the medium","Observed frequency"],"a":2,"e":"The symbol v commonly denotes the speed of sound relative to the medium."},{"q":"A siren emits 500 Hz and approaches a stationary observer at 20 m/s. Take sound speed as 340 m/s. Observed frequency is approximately…","o":["472 Hz","500 Hz","531 Hz","560 Hz"],"a":2,"e":"\\(f'=500\\times340/(340-20)=531.25\\,\\text{Hz}\\), approximately 531 Hz."},{"q":"A 600 Hz source moves away from a stationary observer at 20 m/s. Take v = 340 m/s. The observed frequency is approximately…","o":["566.7 Hz","600 Hz","635.3 Hz","660 Hz"],"a":0,"e":"\\(f'=600\\times340/(340+20)=566.7\\,\\text{Hz}\\)."},{"q":"A stationary source emits 680 Hz. An observer approaches at 10 m/s; sound speed is 340 m/s. Observed frequency is…","o":["660 Hz","680 Hz","700 Hz","720 Hz"],"a":2,"e":"\\(f'=680(340+10)/340=700\\,\\text{Hz}\\)."},{"q":"A stationary source emits 680 Hz. An observer moves away at 10 m/s; sound speed is 340 m/s. Observed frequency is…","o":["660 Hz","680 Hz","700 Hz","720 Hz"],"a":0,"e":"\\(f'=680(340-10)/340=660\\,\\text{Hz}\\)."},{"q":"When source and observer move toward each other, the observed sound frequency generally…","o":["Increases","Decreases","Becomes zero","Cannot be predicted"],"a":0,"e":"Both motions increase the rate at which the observer encounters wavefronts."},{"q":"When source and observer move away from each other, the observed sound frequency generally…","o":["Increases","Decreases","Doubles","Becomes infinite"],"a":1,"e":"Their separation grows, so the observed frequency is lower."},{"q":"The Doppler effect for sound depends on relative motion with respect to…","o":["The medium","Only the Sun","The source's amplitude","The observer's mass"],"a":0,"e":"For sound, source and observer speeds are considered relative to the medium through which sound travels."},{"q":"If source and observer are stationary relative to the medium, observed frequency is…","o":["Zero","Half the emitted frequency","Equal to emitted frequency","Twice emitted frequency"],"a":2,"e":"With no relative motion, there is no Doppler shift: \\(f'=f\\)."},{"q":"A 400 Hz source and observer approach each other, with observer speed 10 m/s, source speed 15 m/s, and sound speed 340 m/s. Observed frequency is approximately…","o":["370 Hz","400 Hz","431 Hz","450 Hz"],"a":2,"e":"\\(f'=f(v+v_o)/(v-v_s)=400(350)/(325)\\approx430.8\\,\\text{Hz}\\)."},{"q":"A 400 Hz source and observer move away from each other at 10 m/s and 15 m/s respectively. With v = 340 m/s, observed frequency is approximately…","o":["342 Hz","371 Hz","400 Hz","430 Hz"],"a":1,"e":"\\(f'=400(340-15)/(340+10)=371.4\\,\\text{Hz}\\)."},{"q":"The observed pitch of an approaching ambulance siren rises mainly because…","o":["The siren emits a higher frequency as it approaches","Wavefronts reach the observer more frequently","Sound speed becomes infinite","Amplitude always increases"],"a":1,"e":"The apparent pitch rises because the wavefronts are compressed in front of the moving source."},{"q":"The change in observed frequency due to Doppler effect requires…","o":["Relative motion between source and observer","A change in source mass","A vacuum","A change in amplitude only"],"a":0,"e":"Relative motion is required for a Doppler shift in this basic sound-wave model."},{"q":"A source emits 1000 Hz and moves toward a stationary observer at 34 m/s. With sound speed 340 m/s, observed frequency is…","o":["900 Hz","1000 Hz","1100 Hz","1200 Hz"],"a":2,"e":"\\(f'=1000(340)/(340-34)=1111\\,\\text{Hz}\\), closest to about 1100 Hz."},{"q":"A 1000 Hz source moves away at 34 m/s. With v = 340 m/s, observed frequency is approximately…","o":["909 Hz","1000 Hz","1111 Hz","1200 Hz"],"a":0,"e":"\\(f'=1000(340)/(340+34)=909.1\\,\\text{Hz}\\)."},{"q":"If an observer moves toward a stationary source at speed \\(v_o\\), the frequency shift is caused by…","o":["A change in wave speed in the air","The observer encountering wavefronts more rapidly","The source wavelength changing","The source stopping oscillation"],"a":1,"e":"The wave speed in air remains the same; the moving observer meets wavefronts at a higher rate."},{"q":"For a moving source, the wavelength in front of the source is…","o":["Shorter when it approaches","Longer when it approaches","Always unchanged","Zero"],"a":0,"e":"An approaching source emits successive wavefronts from closer positions, shortening the wavelength ahead."},{"q":"For a moving source, the wavelength behind it is…","o":["Shorter","Longer","Always zero","Independent of source motion"],"a":1,"e":"As the source moves away from previously emitted wavefronts, the spacing behind it increases."},{"q":"A stationary observer hears 510 Hz from a source that emits 500 Hz. Assuming v = 340 m/s and source approaches, its speed is approximately…","o":["3.3 m/s","6.7 m/s","13.3 m/s","20 m/s"],"a":1,"e":"From \\(510=500(340)/(340-v_s)\\), \\(v_s=340(1-500/510)\\approx6.67\\,\\text{m/s}\\)."},{"q":"A stationary observer hears 450 Hz from a source emitting 500 Hz and moving away. If v = 340 m/s, source speed is approximately…","o":["17.8 m/s","37.8 m/s","50 m/s","75.6 m/s"],"a":1,"e":"From \\(450=500(340)/(340+v_s)\\), \\(v_s=340(500/450-1)\\approx37.8\\,\\text{m/s}\\)."},{"q":"A moving observer measures a lower frequency from a stationary source when the observer moves…","o":["Toward the source","Away from the source","At right angles while approaching","At rest"],"a":1,"e":"Moving away reduces the rate at which the observer encounters sound wavefronts."},{"q":"Which statement about the Doppler effect is correct?","o":["It changes the actual source frequency automatically","It is an apparent change in observed frequency due to relative motion","It occurs only for light","It requires amplitude to change"],"a":1,"e":"The Doppler effect changes the observed frequency; it does not mean the source's emitted frequency has changed."},{"q":"A sound source and observer move together at the same velocity relative to the air, maintaining constant separation. The observed frequency is…","o":["Higher than emitted","Lower than emitted","Equal to emitted","Always zero"],"a":2,"e":"They have no relative motion with respect to each other along the line of sight; with equal co-moving velocities, the observed wavefront rate matches the emitted frequency."}];

function render(){
 chosen=null;locked=false;

 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
