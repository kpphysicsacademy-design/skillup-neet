<section class="hero"><h1>⚡ Drift Velocity</h1><p class="muted">Practise the meaning, units and dimensions of drift velocity, isolated conductors, capacitor combinations, dielectrics, charge and stored energy.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>

<script>
(function(){
'use strict';
let index=0, chosen=null, locked=false, score=0, streak=0;
const questions = [{"q":"Drift velocity is the average velocity acquired by charge carriers due to…","o":["Gravity","An applied electric field","Magnetic shielding only","Thermal expansion"],"a":1,"e":"An electric field produces a small average drift of charge carriers."},{"q":"The SI unit of drift velocity is…","o":["m/s","m/s²","A/m²","C/s"],"a":0,"e":"Drift velocity is a velocity, so its SI unit is m s⁻¹."},{"q":"In a metal, electron drift velocity is directed…","o":["Along the electric field","Opposite to the electric field","Perpendicular to the field","Always vertically downward"],"a":1,"e":"Electrons are negatively charged, so their drift is opposite to the electric field."},{"q":"For electrons, the magnitude of drift speed is related to current by…","o":["v_d = neA/I","v_d = I/(neA)","v_d = IA/(ne)","v_d = neI/A"],"a":1,"e":"From I = neAv_d, rearrange to v_d = I/(neA)."},{"q":"In I = neAv_d, n represents…","o":["Resistance per unit length","Number of charge carriers per unit volume","Number of wires","Electric field"],"a":1,"e":"n is the carrier number density, measured in m⁻³."},{"q":"A wire carries steady current I. If its cross-sectional area doubles while n stays constant, drift speed becomes…","o":["Twice","Half","Four times","Unchanged"],"a":1,"e":"For fixed I and n, v_d = I/(neA), so doubling A halves drift speed."},{"q":"At fixed current, drift speed is inversely proportional to…","o":["Carrier density and cross-sectional area","Electric charge only","Wire length only","Voltage only"],"a":0,"e":"v_d = I/(neA), so at fixed I it varies inversely with n and A."},{"q":"The magnitude of electron drift speed is given by v_d = …","o":["eEτ/m","mE/(eτ)","eτ/(mE)","Eτ/(em)"],"a":0,"e":"In the Drude model, the magnitude is v_d = eEτ/m."},{"q":"In the expression v_d = eEτ/m, τ is…","o":["Time period of AC","Relaxation time","Wave period of light","Transit time across the whole wire"],"a":1,"e":"Relaxation time is the average time between successive collisions."},{"q":"For fixed relaxation time, drift speed is directly proportional to…","o":["Mass of electron","Electric field magnitude","Wire area","Wire resistance only"],"a":1,"e":"v_d = eEτ/m, so v_d ∝ E when τ is fixed."},{"q":"If the electric field doubles and relaxation time stays constant, drift speed…","o":["Halves","Doubles","Is unchanged","Becomes four times"],"a":1,"e":"The formula v_d = eEτ/m gives a linear dependence on E."},{"q":"The SI unit of relaxation time is…","o":["Second","Metre","Volt per metre","Coulomb"],"a":0,"e":"Relaxation time is a time interval measured in seconds."},{"q":"A wire carries 2 A; n = 8 × 10²⁸ m⁻³, A = 1 × 10⁻⁶ m² and e = 1.6 × 10⁻¹⁹ C. Drift speed is approximately…","o":["1.56 × 10⁻⁴ m/s","1.56 × 10⁴ m/s","1.0 × 10⁻⁶ m/s","2.56 × 10⁻¹⁹ m/s"],"a":0,"e":"v_d = 2/(8×10²⁸ × 1.6×10⁻¹⁹ × 10⁻⁶) ≈ 1.56×10⁻⁴ m/s."},{"q":"A wire's radius is doubled while the same steady current flows. The drift speed becomes…","o":["Four times","Twice","One-half","One-quarter"],"a":3,"e":"Area is proportional to radius squared; doubling radius makes area four times larger, so v_d becomes one-quarter."},{"q":"The random thermal motion of electrons in a metal…","o":["Is absent","Is much faster than their net drift","Always produces a net current by itself","Is the same as drift velocity"],"a":1,"e":"Random velocities largely cancel on average; drift is the small net average caused by the field."},{"q":"A bulb lights nearly immediately after a switch is closed mainly because…","o":["Electrons from the switch reach the bulb instantly","The electric field is established rapidly throughout the circuit","Drift speed equals speed of light","The wire has no electrons before switching"],"a":1,"e":"The field propagates rapidly and initiates drift throughout the circuit; individual electrons drift slowly."},{"q":"For a given conductor and temperature, mobility μ is related to drift speed and field by…","o":["μ = E/v_d","μ = v_d/E","μ = v_dE","μ = E + v_d"],"a":1,"e":"Mobility is drift-speed magnitude per unit electric-field magnitude."},{"q":"The SI unit of mobility is…","o":["m² V⁻¹ s⁻¹","V m⁻¹","A m⁻²","m s⁻²"],"a":0,"e":"μ = (m/s)/(V/m) = m² V⁻¹ s⁻¹."},{"q":"If mobility is 4 × 10⁻⁴ m² V⁻¹ s⁻¹ and E = 5 V/m, drift-speed magnitude is…","o":["2 × 10⁻³ m/s","8 × 10⁻⁵ m/s","1.25 × 10⁴ m/s","2 × 10⁻⁵ m/s"],"a":0,"e":"v_d = μE = 4×10⁻⁴ × 5 = 2×10⁻³ m/s."},{"q":"In a uniform wire carrying steady current, if the carrier density is halved with the same I and A, drift speed…","o":["Halves","Doubles","Remains the same","Becomes zero"],"a":1,"e":"v_d = I/(neA); halving n doubles v_d."},{"q":"For a wire of varying cross-section carrying steady current, drift speed is greater in the…","o":["Thicker region","Thinner region","Region with zero field only","Both regions always equal"],"a":1,"e":"At steady current, v_d = I/(neA), so the smaller area has greater drift speed if n is the same."},{"q":"The direction of conventional current in a metal is…","o":["Same as electron drift","Opposite to electron drift","Always opposite to electric field","Undefined"],"a":1,"e":"Conventional current direction is opposite to electron motion in a metal."},{"q":"If I = 1.6 A, n = 10²⁹ m⁻³, A = 10⁻⁶ m² and e = 1.6 × 10⁻¹⁹ C, v_d equals…","o":["10⁻⁴ m/s","10⁴ m/s","10⁻¹⁹ m/s","1.6 m/s"],"a":0,"e":"v_d = 1.6/(10²⁹×10⁻⁶×1.6×10⁻¹⁹) = 10⁻⁴ m/s."},{"q":"The current density magnitude for one carrier type is related to drift speed by…","o":["J = ne v_d","J = nAev_d","J = e/(nv_d)","J = v_d/(ne)"],"a":0,"e":"Dividing I = neAv_d by A gives J = ne v_d."},{"q":"If drift speed is 3 × 10⁻⁴ m/s and mobility is 1.5 × 10⁻⁴ m² V⁻¹ s⁻¹, field magnitude is…","o":["0.5 V/m","2 V/m","4.5 × 10⁻⁸ V/m","20 V/m"],"a":1,"e":"E = v_d/μ = 3×10⁻⁴ / 1.5×10⁻⁴ = 2 V/m."},{"q":"The drift velocity in the Drude model is proportional to relaxation time when E is fixed because…","o":["v_d = eEτ/m","v_d = mE/(eτ)","v_d = E/(eτm)","v_d = τ/(eEm)"],"a":0,"e":"The magnitude formula is v_d = eEτ/m."},{"q":"A conductor's current is 4 A. If its carrier density and cross-sectional area both double, drift speed becomes…","o":["Four times","Twice","Half","One-quarter"],"a":3,"e":"Since v_d ∝ 1/(nA), doubling both makes the product four times larger, so drift speed is one-quarter."},{"q":"Which statement about drift velocity is correct?","o":["It equals the speed of the electrical signal","It is a small average velocity superimposed on random motion","It exists only in vacuum","It is independent of electric field in the Drude model"],"a":1,"e":"Drift velocity is the small net average motion of carriers; it is not the signal propagation speed."},{"q":"For electrons, the vector drift velocity is opposite to E, while its magnitude is…","o":["Negative by definition","A non-negative scalar speed","Always zero","Measured in amperes"],"a":1,"e":"Speed is a magnitude; the direction is represented separately by the drift-velocity vector."}];
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function typesetMath(){if(window.MathJax?.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options'),$('feedback')].filter(Boolean)).catch(()=>{});}}
window.addEventListener('load',typesetMath);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
 typesetMath();
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Drift Velocity Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
   if(window.MathJax?.typesetPromise) window.MathJax.typesetPromise([review]).catch(()=>{});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
