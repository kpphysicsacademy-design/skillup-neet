<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Effect of Dielectric</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}
</style></head>
<body><div class="wrap"><div class="card"><h1>⚡ Effect of Dielectric</h1>
<div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a>
</div></div>
<script>
const qs=[
['When a dielectric is inserted completely between the plates of a capacitor, its capacitance generally','decreases','increases','becomes zero','remains exactly unchanged',1,'For a dielectric of relative permittivity K, the capacitance becomes KC₀.'],
['If the vacuum capacitance of a capacitor is C₀ and a dielectric of constant K completely fills the gap, the new capacitance is','C₀/K','KC₀','C₀+K','C₀−K',1,'The capacitance with a completely filling dielectric is C=KC₀.'],
['A capacitor is disconnected from its battery before a dielectric is inserted. Which quantity remains constant?','Potential difference V','Capacitance C','Free charge Q','Stored energy U',2,'After disconnection, there is no conducting path for charge to enter or leave, so Q remains constant.'],
['An isolated charged capacitor has a dielectric of constant K inserted completely. Its potential difference becomes','KV₀','V₀/K','V₀','K²V₀',1,'Since Q is constant and C increases K times, V=Q/C decreases to V₀/K.'],
['For the same isolated charged capacitor, the electric field between the plates after complete dielectric insertion becomes','KE₀','E₀/K','E₀','K²E₀',1,'For fixed free charge, the field in a completely filled dielectric is reduced to E₀/K.'],
['A capacitor remains connected to a battery while a dielectric is inserted completely. The potential difference across it','increases K times','decreases K times','remains constant','becomes zero',2,'The ideal battery maintains a fixed potential difference across the capacitor.'],
['For a battery-connected capacitor, inserting a dielectric of constant K completely makes the capacitance','C₀/K','KC₀','C₀','C₀+K only',1,'The dielectric increases capacitance by the factor K.'],
['For a battery-connected capacitor, after complete dielectric insertion the charge on the plates becomes','Q₀/K','KQ₀','Q₀','zero',1,'Since V is fixed and C becomes KC₀, Q=CV increases to KQ₀.'],
['For a battery-connected capacitor, the stored electrostatic energy after complete insertion of dielectric becomes','U₀/K','KU₀','U₀','K²U₀',1,'With V constant, U=½CV², so increasing C by K increases U by K.'],
['For an isolated charged capacitor, complete insertion of dielectric of constant K makes the stored energy','KU₀','U₀/K','U₀','K²U₀',1,'With Q constant, U=Q²/(2C). Since C increases K times, U decreases to U₀/K.'],
['A capacitor has capacitance 4 μF at 10 V. A dielectric of K=3 is inserted while it remains connected to the battery. The new charge is','40 μC','120 μC','13.3 μC','30 μC',1,'Initial C₀=4 μF. New C=12 μF and V=10 V, so Q=CV=120 μC.'],
['A 5 μF capacitor is charged to 20 V and then disconnected. A dielectric of K=2 is inserted completely. The new potential difference is','40 V','20 V','10 V','5 V',2,'The capacitor is isolated, so Q is constant. Therefore V decreases by K: 20/2=10 V.'],
['A capacitor of vacuum capacitance 2 μF is connected to a 12 V battery. A dielectric of K=4 is inserted completely. The new stored energy is','144 μJ','576 μJ','288 μJ','72 μJ',1,'New C=8 μF. Thus U=½CV²=½×8×10⁻⁶×144=576 μJ.'],
['A charged isolated capacitor has initial energy U₀. A dielectric of constant 5 is inserted completely. The new energy is','5U₀','U₀/5','U₀','25U₀',1,'For an isolated capacitor Q is constant, so U=Q²/(2C). Since C becomes 5C₀, U becomes U₀/5.'],
['The attractive force between the plates of an ideal parallel-plate capacitor, with the free charge fixed and dielectric completely filling the gap, changes approximately to','K times the original force','1/K times the original force','1/K² times the original force','unchanged',1,'For fixed Q, F=Q²/(2εA). With ε=Kε₀, the force becomes F₀/K.']
];
let i=0,score=0,answered=false;const $=x=>document.getElementById(x);
function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}
function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});if(ok){score++;$('xp').textContent='✨ Correct! +1 XP'}else $('xp').textContent='❌ Incorrect. '+q[6];$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}
function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();
</script></body></html>
