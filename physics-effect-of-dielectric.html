<section class="hero"><h1>⚡ Effect of Dielectric</h1><p class="muted">Practise charge storage, capacitance, parallel-plate capacitors, dielectrics, combinations and stored energy.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>

<script>
(function(){
'use strict';
let index=0, chosen=null, locked=false, score=0, streak=0;
const questions = [{"q":"A dielectric completely fills the space between capacitor plates. The capacitance becomes…","o":["C₀/K","KC₀","C₀/K²","Unchanged"],"a":1,"e":"For a completely filled gap, C = K C₀, where K is the relative permittivity."},{"q":"Why does inserting a dielectric increase capacitance?","o":["It increases plate area","It reduces the effective field for a given free charge, lowering V for the same Q","It removes all charge from the plates","It increases plate separation"],"a":1,"e":"Polarisation creates an opposing field. For fixed free charge, the potential difference decreases, so C = Q/V increases."},{"q":"A capacitor is disconnected from its battery before a dielectric is inserted. Which quantity remains constant?","o":["Potential difference","Capacitance","Free charge","Stored energy"],"a":2,"e":"The isolated plates have no conducting path for charge to flow on or off, so Q remains constant."},{"q":"An isolated charged capacitor has initial voltage V₀. A dielectric of constant K fills the gap. The new voltage is…","o":["KV₀","V₀/K","V₀","V₀/K²"],"a":1,"e":"With Q fixed and C increasing to KC₀, V = Q/C becomes V₀/K."},{"q":"For an isolated charged parallel-plate capacitor, complete dielectric insertion changes the electric field to…","o":["KE₀","E₀/K","E₀","K²E₀"],"a":1,"e":"For fixed free charge, the field in a fully filled linear dielectric is E₀/K."},{"q":"A capacitor remains connected to an ideal battery while a dielectric is inserted. Its potential difference…","o":["Increases K-fold","Decreases by K","Remains constant","Becomes zero"],"a":2,"e":"The ideal battery fixes the potential difference at its terminal voltage."},{"q":"For a battery-connected capacitor, complete dielectric insertion changes capacitance from C₀ to…","o":["C₀/K","KC₀","C₀","C₀+K"],"a":1,"e":"The geometry is unchanged and the dielectric fills the gap, so C = KC₀."},{"q":"A battery-connected capacitor receives a dielectric of constant K. Its plate charge becomes…","o":["Q₀/K","KQ₀","Q₀","Zero"],"a":1,"e":"Since V stays fixed and C becomes KC₀, Q = CV increases to KQ₀."},{"q":"For a battery-connected capacitor, the stored energy after dielectric insertion is…","o":["U₀/K","KU₀","U₀","K²U₀"],"a":1,"e":"At constant V, U = ½CV². Capacitance increases by K, so energy becomes KU₀."},{"q":"For an isolated charged capacitor, the stored energy after full dielectric insertion is…","o":["KU₀","U₀/K","U₀","K²U₀"],"a":1,"e":"At constant Q, U = Q²/(2C). Since C increases by K, energy falls to U₀/K."},{"q":"A 4 μF capacitor is connected to a 10 V battery. K = 3 dielectric fills the gap. What is the new charge?","o":["40 μC","120 μC","13.3 μC","30 μC"],"a":1,"e":"C = 3 × 4 = 12 μF. With V = 10 V, Q = CV = 120 μC."},{"q":"A 5 μF capacitor is charged to 20 V, then disconnected. K = 2 fills the gap. What is the new voltage?","o":["40 V","20 V","10 V","5 V"],"a":2,"e":"The capacitor is isolated, so Q is fixed and voltage halves: V = 20/2 = 10 V."},{"q":"A 2 μF capacitor remains connected to a 12 V battery. K = 4 fills the gap. What is the new stored energy?","o":["144 μJ","576 μJ","288 μJ","72 μJ"],"a":1,"e":"New C = 8 μF. U = ½CV² = ½ × 8 μF × 144 = 576 μJ."},{"q":"A charged isolated capacitor has initial energy U₀. If K = 5 fills the gap, the new energy is…","o":["5U₀","U₀/5","U₀","25U₀"],"a":1,"e":"With Q fixed, U = Q²/(2C), and C becomes 5C₀; therefore U = U₀/5."},{"q":"A battery-connected parallel-plate capacitor has fixed plate spacing. When dielectric is inserted, its electric field approximately…","o":["Becomes KE₀","Becomes E₀/K","Remains E₀","Becomes zero"],"a":2,"e":"The battery holds V constant and the plate spacing d is unchanged, so E = V/d remains constant."},{"q":"A dielectric of relative permittivity K = 6 increases a capacitor's capacitance from 3 μF to…","o":["0.5 μF","9 μF","18 μF","36 μF"],"a":2,"e":"C = KC₀ = 6 × 3 μF = 18 μF."},{"q":"A capacitor's capacitance is 8 μF without dielectric and 40 μF when filled. The dielectric constant is…","o":["2","5","8","32"],"a":1,"e":"K = C/C₀ = 40/8 = 5."},{"q":"For a dielectric with relative permittivity K, the permittivity of the material is…","o":["ε₀/K","Kε₀","ε₀ + K","K/ε₀"],"a":1,"e":"Relative permittivity K = ε/ε₀, so ε = Kε₀."},{"q":"The SI unit of relative permittivity (dielectric constant) is…","o":["Farad","Coulomb","Volt per metre","It has no unit"],"a":3,"e":"Relative permittivity is a ratio of two permittivities, so it is dimensionless."},{"q":"The polarisation of a dielectric in an electric field generally produces a field that…","o":["Reinforces the original field inside the material","Opposes the applied field inside the dielectric","Is always zero","Is perpendicular in every case"],"a":1,"e":"Bound charges polarise so their induced field opposes the applied field within a linear dielectric."},{"q":"For a fully filled dielectric between parallel plates, the capacitance is C = …","o":["ε₀A/d","Kε₀A/d","ε₀d/(KA)","Kd/(ε₀A)"],"a":1,"e":"The permittivity is ε = Kε₀, giving C = εA/d = Kε₀A/d."},{"q":"An isolated capacitor has charge Q₀ before dielectric insertion. After insertion, its charge is…","o":["KQ₀","Q₀/K","Q₀","Zero"],"a":2,"e":"Insertion changes capacitance and voltage, but not the free charge on an isolated capacitor."},{"q":"A battery-connected capacitor initially has charge 30 μC. A dielectric with K = 2 is inserted fully. The new charge is…","o":["15 μC","30 μC","60 μC","90 μC"],"a":2,"e":"At constant voltage, charge scales with capacitance, so Q = KQ₀ = 60 μC."},{"q":"An isolated capacitor initially has voltage 18 V. If K = 3 fills the gap, the new voltage is…","o":["54 V","18 V","9 V","6 V"],"a":3,"e":"For fixed charge, V = V₀/K = 18/3 = 6 V."},{"q":"For an isolated capacitor with fixed Q, dielectric insertion reduces energy because…","o":["Charge becomes zero","Capacitance increases in U = Q²/(2C)","Voltage increases K-fold","Plate area decreases"],"a":1,"e":"At constant Q, increasing C makes U = Q²/(2C) smaller."},{"q":"For a capacitor held at constant voltage, which expression gives stored energy?","o":["U = Q²/(2C) only","U = ½CV²","U = CV","U = V²/(2C)"],"a":1,"e":"The energy is U = ½CV². With fixed V, energy rises in proportion to C."},{"q":"A 6 μF capacitor at 5 V is isolated. A dielectric of K = 2 is inserted fully. What is the final energy?","o":["150 μJ","75 μJ","300 μJ","37.5 μJ"],"a":3,"e":"Initial energy U₀ = ½ × 6 μF × 25 = 75 μJ. At fixed Q, U = U₀/K = 37.5 μJ."},{"q":"A 6 μF capacitor at 5 V is connected to its battery. A dielectric of K = 2 is inserted fully. What is the final energy?","o":["37.5 μJ","75 μJ","150 μJ","300 μJ"],"a":2,"e":"Initial U₀ = 75 μJ. At fixed V, C doubles and U = KU₀ = 150 μJ."},{"q":"A dielectric slab is pulled into a capacitor because the system's electrostatic interaction tends to…","o":["Expel every dielectric","Pull the dielectric into the region of stronger capacitance","Make capacitance zero","Reverse the battery polarity"],"a":1,"e":"A dielectric is generally attracted into the capacitor because inserting it increases capacitance and lowers the appropriate system energy when the full source-mechanical system is considered."},{"q":"Which comparison is correct when a dielectric fully fills the gap?","o":["Battery connected: Q constant; isolated: V constant","Battery connected: V constant; isolated: Q constant","Both cases: Q and V constant","Both cases: energy always decreases"],"a":1,"e":"The battery-connected case holds V fixed; the disconnected isolated case holds Q fixed. This distinction determines the other changes."}];
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function typesetMath(){if(window.MathJax?.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options'),$('feedback')].filter(Boolean)).catch(()=>{});}}
window.addEventListener('load',typesetMath);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
 typesetMath();
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Effect of Dielectric Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
   if(window.MathJax?.typesetPromise) window.MathJax.typesetPromise([review]).catch(()=>{});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
