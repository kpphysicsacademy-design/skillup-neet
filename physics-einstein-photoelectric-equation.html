<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Einstein Photoelectric Equation</title><meta name="description" content="SkillUp Physics Einstein Photoelectric Equation interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">⚡</span><h1>Einstein Photoelectric Equation</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["Einstein's photoelectric equation is:",["K_max=hν−φ","K_max=hν+φ","K_max=φ−hν for emission","K_max=h/ν"],0,"Einstein proposed that photon energy hν is used partly to overcome the work function φ and the remainder appears as maximum kinetic energy."],["In K_max=hν−φ, h represents:",["Planck's constant","Electron charge","Work function","Stopping potential"],0,"h is Planck's constant, relating photon energy to frequency."],["In K_max=hν−φ, ν represents the:",["Frequency of incident radiation","Threshold wavelength only","Electron speed","Metal temperature"],0,"ν is the frequency of the incident electromagnetic radiation."],["The work function φ is the minimum energy required to:",["Liberate an electron from the metal surface","Accelerate an electron to light speed","Create a proton","Heat the metal to boiling"],0,"The work function is the minimum energy needed to remove an electron from a material surface."],["At threshold frequency ν₀, the maximum kinetic energy of emitted electrons is:",["Zero","hν₀","φ²","Infinite"],0,"At threshold, the photon energy exactly equals the work function, so K_max=0."],["Therefore, the work function and threshold frequency are related by:",["φ=hν₀","φ=h/ν₀","φ=ν₀/h","φ=0"],0,"Putting K_max=0 in Einstein's equation gives φ=hν₀."],["The maximum kinetic energy of photoelectrons depends directly on:",["Frequency of incident light","Intensity alone","Metal area alone","Source distance alone"],0,"For a fixed metal, K_max=hν−φ, so it varies linearly with frequency."],["If the intensity is increased while frequency remains above threshold, the maximum kinetic energy:",["Remains unchanged","Always doubles","Becomes zero","Depends only on intensity"],0,"At fixed frequency, increasing intensity increases the number of emitted electrons and current, not K_max."],["The stopping potential V₀ is related to maximum kinetic energy by:",["eV₀=K_max","V₀=eK_max","e/V₀=K_max","V₀=K_max/e²"],0,"The stopping potential removes the fastest photoelectrons, so eV₀=K_max."],["Combining Einstein's equation with stopping potential gives:",["eV₀=hν−φ","eV₀=hν+φ","eV₀=φ−hν always","V₀=hφ"],0,"Since eV₀=K_max and K_max=hν−φ, eV₀=hν−φ."],["A graph of K_max versus frequency ν is a straight line with slope:",["h","1/h","e/h","φ"],0,"K_max=hν−φ, so the slope of K_max versus ν is h."],["A graph of stopping potential V₀ versus frequency ν has slope:",["h/e","e/h","h","φ/e²"],0,"From eV₀=hν−φ, V₀=(h/e)ν−φ/e, so the slope is h/e."],["If photon energy is 6 eV and the metal work function is 2 eV, K_max is:",["4 eV","8 eV","3 eV","2 eV"],0,"K_max=6−2=4 eV."],["If a photon has energy exactly equal to the work function, photoemission can occur with:",["Zero maximum kinetic energy","Maximum kinetic energy equal to the work function","Infinite kinetic energy","No photon energy"],0,"At hν=φ, the electron is just liberated and has zero maximum kinetic energy."],["Einstein's explanation of the photoelectric effect supports the:",["Particle nature of electromagnetic radiation","Purely mechanical nature of light","Idea that light has no energy","Idea that intensity determines photon energy"],0,"Einstein treated light as photons, each carrying energy hν, providing a particle description of radiation."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
