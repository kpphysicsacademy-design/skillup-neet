*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}

.hero,.quiz,.finish{background:#fff;border:2px solid #e2edf7;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 #dce8f3}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#174a78}.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}
.progress-row{display:flex;justify-content:space-between;gap:10px;margin:16px 0 7px;font-size:12px;font-weight:900;color:var(--muted)}
.track{height:11px;border-radius:99px;background:#e2edf7;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}
.qmeta{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.4px}
.question{font-size:clamp(20px,4.5vw,26px);line-height:1.35;margin:12px 0 18px;font-weight:850}
.options{display:grid;gap:10px}.option{display:flex;gap:11px;align-items:center;width:100%;min-height:51px;padding:12px;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}
.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🧱 Elastic Limit</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"The elastic limit is the maximum stress a material can withstand without:",o:["Permanent deformation","Any force acting","Any strain at all","Changing temperature"],a:0,e:"Beyond the elastic limit, a material may not return fully to its original shape after unloading."},
{q:"Below the elastic limit, a material generally returns to its original shape when:",o:["The load is removed","The load is doubled","It is heated until melting","It is broken"],a:0,e:"Elastic deformation is reversible when the deforming load is removed."},
{q:"The elastic limit and proportional limit are:",o:["Always exactly identical","Related but not necessarily identical","Both units of pressure","Measures of mass"],a:1,e:"The proportional limit marks the end of linear stress–strain behaviour; elastic behaviour may continue beyond it."},
{q:"Beyond the proportional limit but below the elastic limit, a material may deform:",o:["Elastically but nonlinearly","Only plastically","Without any strain","Only by fracture"],a:0,e:"Stress and strain are no longer proportional, but deformation can still be reversible."},
{q:"Plastic deformation is best described as:",o:["Permanent deformation after unloading","A fully reversible change","Zero strain under load","A change in temperature only"],a:0,e:"Plastic deformation leaves a permanent change in shape or size."},
{q:"On a typical stress–strain curve, the elastic limit marks the start of:",o:["Plastic behaviour","Zero stress","Zero length","The proportional region"],a:0,e:"Beyond the elastic limit, permanent deformation begins."},
{q:"The SI unit of elastic-limit stress is:",o:["Pascal","Metre","Joule","Kilogram"],a:0,e:"Stress is force per unit area, measured in pascals (Pa)."},
{q:"Stress is calculated by:",o:["Force ÷ area","Area ÷ force","Force × area","Length ÷ force"],a:0,e:"Stress = F/A for a force distributed over cross-sectional area A."},
{q:"Strain is:",o:["A dimensionless ratio","Measured in pascals","Measured in newtons","Always greater than 1"],a:0,e:"Strain is a relative change, such as change in length divided by original length."},
{q:"Hooke’s law applies while stress is proportional to:",o:["Strain","Mass","Temperature","Density"],a:0,e:"Within the proportional region, stress increases linearly with strain."},
{q:"A material is loaded past its elastic limit and then unloaded. It will often:",o:["Retain some permanent deformation","Return perfectly to original dimensions","Have zero mass","Lose all stress forever while loaded"],a:0,e:"Plastic deformation remains after the load is removed."},
{q:"Which point is generally reached first as stress increases in a typical material?",o:["Proportional limit","Fracture point","Final break after plastic flow","Zero-load point after unloading"],a:0,e:"The proportional limit is typically reached before the elastic limit and fracture."},
{q:"A stress–strain graph is a straight line through the origin in the:",o:["Linear proportional region","Plastic region only","Fracture region","Unloaded permanent-strain region only"],a:0,e:"A straight line indicates stress is proportional to strain."},
{q:"If stress is 3 × 10⁶ Pa and strain is 0.001 in the linear region, Young’s modulus is:",o:["3 × 10⁹ Pa","3 × 10³ Pa","3 × 10⁶ Pa","3 × 10⁻⁹ Pa"],a:0,e:"Y = stress/strain = 3 × 10⁶ / 10⁻³ = 3 × 10⁹ Pa."},
{q:"A wire has original length 2 m and extends by 2 mm. Its longitudinal strain is:",o:["0.001","0.01","1","1000"],a:0,e:"Strain = 0.002 m / 2 m = 0.001."},
{q:"Which statement about elastic limit is correct?",o:["It depends on the material and conditions","It is identical for every material","It is measured in metres","It is the same as mass"],a:0,e:"Different materials have different elastic limits, which may also depend on conditions."},
{q:"Which outcome indicates that a sample exceeded its elastic limit?",o:["It remains partly deformed after unloading","It returns fully to its original shape","It has no measurable strain under load","Its mass doubles"],a:0,e:"Residual deformation after unloading is evidence of plastic behaviour."},
{q:"A material has an elastic limit of 250 MPa. A stress of 200 MPa is applied. Under ideal conditions, this stress is:",o:["Below the elastic limit","Above the elastic limit","Equal to the breaking stress necessarily","A strain value"],a:0,e:"200 MPa is less than 250 MPa, so it is below the stated elastic limit."},
{q:"A material’s proportional limit is 100 MPa and elastic limit is 150 MPa. At 125 MPa, behaviour may be:",o:["Elastic but nonlinear","Definitely plastic","Already fractured","Necessarily stress-free"],a:0,e:"125 MPa is above the proportional limit but below the elastic limit."},
{q:"When a material is loaded and unloaded within its elastic range, the deformation is generally:",o:["Reversible","Permanent","Always fractured","Independent of load"],a:0,e:"Elastic-range deformation is recovered when the load is removed."},
{q:"The area under a stress–strain curve represents energy stored per unit:",o:["Volume","Mass","Length","Time"],a:0,e:"The area under the curve corresponds to work done per unit volume of material."},
{q:"Which term describes the ability to recover original shape after unloading?",o:["Elasticity","Plasticity","Fracture","Density"],a:0,e:"Elasticity is the tendency to recover original shape and size after the load is removed."},
{q:"A ductile material is taken beyond its elastic limit. It may undergo:",o:["Plastic deformation before fracture","Only perfectly reversible deformation","No deformation","A decrease in its original mass by definition"],a:0,e:"Ductile materials can sustain significant plastic deformation before breaking."},
{q:"Which is not a mechanical stress?",o:["Temperature","Tensile stress","Shear stress","Bulk stress"],a:0,e:"Temperature is a physical quantity, not a type of mechanical stress."},
{q:"If force doubles while cross-sectional area stays constant, stress:",o:["Doubles","Halves","Remains constant","Becomes zero"],a:0,e:"Stress = F/A, so doubling F doubles stress when A is fixed."},
{q:"The elastic limit is important because it helps predict whether deformation will be:",o:["Recoverable or permanent","Measured in seconds or hours","A scalar or vector","Hot or cold only"],a:0,e:"It distinguishes elastic recovery from the onset of permanent deformation."},
{q:"A sample returns to its original length but not its original shape after unloading. This suggests:",o:["Some permanent deformation remains","Perfect elastic recovery in every dimension","No deformation occurred","Stress had no effect"],a:0,e:"Recovery in one dimension does not rule out permanent deformation in another."},
{q:"Which limit specifically marks where stress stops being proportional to strain?",o:["Proportional limit","Elastic limit","Fracture point","Melting point"],a:0,e:"The proportional limit is the end of the linear stress–strain relationship."},
{q:"Which statement correctly compares elastic and plastic deformation?",o:["Elastic deformation is recoverable; plastic deformation is permanent","Both are always permanent","Plastic deformation always returns fully","Elastic deformation means fracture"],a:0,e:"Elastic changes recover on unloading, while plastic changes leave a permanent set."},
{q:"A stress–strain curve shows a nonlinear segment that still unloads to the original shape. This segment can be:",o:["Elastic but non-proportional","Necessarily plastic","The fracture point","A zero-stress condition only"],a:0,e:"Nonlinear behaviour can remain elastic between the proportional limit and elastic limit."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Elastic Limit Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
