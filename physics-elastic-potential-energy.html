<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Elastic Potential Energy</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:flex-end;margin-bottom:20px}.xp{background:#fff;padding:12px 18px;border-radius:18px;box-shadow:0 5px 18px #17203314;font-weight:800}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff;border-radius:22px;padding:26px 20px;margin-bottom:12px;box-shadow:0 8px 22px #12539d25}.hero small{font-size:.82rem}.hero h1{margin:9px 0 10px;font-size:1.9rem}.hero p{margin:0}.card{background:#fff;border-radius:22px;padding:20px;margin:12px 0;box-shadow:0 6px 20px #17203312}.progress-head{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:12px;background:#dfe8f1;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;border-radius:999px;transition:width .3s}.qnum{font-size:.9rem;font-weight:800;color:#35516f;margin-bottom:12px}.question{font-size:1.28rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{width:100%;padding:14px 15px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#58cc02;background:#f7fff1;transform:translateY(-1px)}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.actions{margin-top:16px}.btn{padding:12px 20px;border:0;border-radius:13px;font-weight:850;cursor:pointer;background:#2db84d;color:#fff;box-shadow:0 4px 0 #21863a;transition:.12s}.btn:hover:not(:disabled){transform:translateY(-1px)}.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #21863a}.feedback{margin-top:14px;padding:13px;border-radius:14px;font-weight:700;min-height:20px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:8px;color:#5146a5;font-weight:800;text-decoration:none;padding:9px 12px;border-radius:12px}.back:hover{background:#f0edff;transform:translateX(-2px)}@media(max-width:600px){.wrap{padding:20px 14px 34px}.hero h1{font-size:1.55rem}.question{font-size:1.15rem}.card{padding:17px}}</style></head><body><main class="wrap"><div class="top"><div class="xp">⚡ <span id="xp">0</span> XP</div></div><section class="hero"><small>PHYSICS • NEET 2026</small><h1>🪀 Elastic Potential Energy</h1><p>LEARN → PRACTICE → MASTER • 15 focused NEET-style MCQs</p></section><section class="card"><div class="progress-head"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count">Question 1 of 15</div><h2 class="question" id="question"></h2><div id="options" class="options"></div><div class="actions"><button id="continue" class="btn">Continue →</button></div><div id="feedback" class="feedback"></div></section><a href="physics-home.html" id="back" class="back">← Back to Physics Path</a></main><script>(function(){const quiz=[['Elastic potential energy is stored in a spring when it is:',['stretched or compressed','moving uniformly','heated only','kept at its natural length'],0,'Deforming an elastic spring stores elastic potential energy.'],['The elastic potential energy stored in an ideal spring is:',['½kx²','kx','½mv²','mgh'],0,'For an ideal spring, U=½kx².'],['The SI unit of spring constant k is:',['N/m','N·m','J/m','kg/m'],0,'From F=kx, k has units N/m.'],['If the extension of a spring is doubled, its elastic potential energy becomes:',['four times','twice','half','unchanged'],0,'U is proportional to x², so doubling x makes U four times.'],['If the spring constant is doubled for the same extension, stored energy becomes:',['double','four times','half','unchanged'],0,'U=½kx², so U is directly proportional to k for fixed x.'],['A spring has k=200 N/m and extension 0.1 m. Its stored energy is:',['1 J','2 J','10 J','20 J'],0,'U=½×200×0.1²=1 J.'],['A spring stores 4 J at an extension x. At extension 2x it stores:',['16 J','8 J','4 J','2 J'],0,'Because U is proportional to x², it becomes 4×4=16 J.'],['The restoring force of an ideal spring is given by:',['F=−kx','F=k/x','F=½kx²','F=mgx'],0,'Hooke’s law gives F=−kx; the minus sign indicates the restoring direction.'],['The negative sign in F=−kx indicates that spring force is:',['opposite to displacement','always negative in magnitude','zero at all times','independent of displacement'],0,'The restoring force acts opposite to the displacement from equilibrium.'],['When a stretched ideal spring is released, its elastic potential energy can be converted mainly into:',['kinetic energy','mass','charge','temperature only'],0,'The stored elastic energy can transform into kinetic energy.'],['A spring is compressed by 0.2 m with k=100 N/m. Its elastic potential energy is:',['2 J','4 J','10 J','20 J'],0,'U=½×100×0.2²=2 J.'],['For an ideal spring, the potential-energy versus extension relation is:',['quadratic','linear','constant','inversely proportional'],0,'U=½kx², so the dependence on extension is quadratic.'],['At the natural length of an ideal spring, its elastic potential energy is:',['zero','maximum','negative infinity','equal to k'],0,'Taking the natural length as zero deformation, U=½kx²=0.'],['A spring with larger k is described as:',['stiffer','softer','massless','more extensible for the same force'],0,'A larger spring constant means greater force is required for a given extension.'],['Which statement is correct for an ideal spring within Hooke’s-law range?',['Energy stored is ½kx²','Energy stored is kx²','Energy stored is ½mv²','Energy stored is mgh regardless of deformation'],0,'Within the elastic limit, the spring stores U=½kx².']];let i=0,selected=-1,score=0,checked=false;const $=id=>document.getElementById(id),q=$("question"),o=$("options"),b=$("continue"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;q.textContent=a[0];$("count").textContent='Question '+(i+1)+' of 15';o.innerHTML='';f.className='feedback';f.textContent='';b.disabled=false;b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const x=document.createElement('button');x.className='option';x.textContent=String.fromCharCode(65+j)+'. '+item.text;x.dataset.index=item.index;x.onclick=()=>{selected=item.index;[...o.children].forEach(z=>z.classList.remove('selected'));x.classList.add('selected')};o.appendChild(x)})}b.onclick=function(){if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(x=>{const idx=Number(x.dataset.index);x.disabled=true;if(idx===a[2])x.classList.add('correct');if(idx===selected&&!ok)x.classList.add('wrong')});if(ok){score++;f.className='feedback good';f.textContent='🎯 Correct! +10 XP — '+a[3]}else{f.className='feedback bad';f.textContent='✗ Review — Correct answer: '+a[1][a[2]]+'. '+a[3]}$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';return}if(i<14){i++;render();window.scrollTo({top:0,behavior:'smooth'})}else{q.textContent='🏆 Elastic Potential Energy Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.';localStorage.setItem('skillupPhysicsElasticPotentialEnergyScore',score)}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
