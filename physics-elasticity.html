<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Elasticity</title><style>body{margin:0;background:#f5f7f8;font-family:Arial,sans-serif;color:#17202a}.wrap{max-width:760px;margin:auto;padding:24px 16px 40px}.head{display:flex;justify-content:space-between;align-items:center}.head h1{font-size:28px;margin:0}.xp{font-weight:700}.sub{color:#65727e;margin:8px 0 18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 14px #0000000d}.bar{height:10px;background:#e8ecef;border-radius:10px;overflow:hidden}.fill{height:100%;width:0;background:#58b86b;transition:.3s}.qno{font-size:14px;color:#697680}.q{font-size:20px;font-weight:700;line-height:1.45}.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #dfe5e8;border-radius:12px;padding:13px 15px;margin:10px 0;font-size:16px;cursor:pointer;transition:.15s}.opt:hover{transform:translateY(-1px);border-color:#58b86b}.opt.selected{border-color:#58b86b;background:#f0fbf2}.opt.correct{border-color:#58b86b;background:#e9f8eb}.opt.wrong{border-color:#e26b6b;background:#fff0f0}.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:700;font-size:16px;cursor:pointer;background:#58b86b;color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.back{display:block;text-align:center;margin-top:18px;background:#fff;color:#35434d;border:2px solid #dfe5e8}.back:hover{border-color:#58b86b;transform:translateY(-1px)}#feedback{min-height:24px;font-weight:700}.done{text-align:center}.score{font-size:28px;font-weight:800}</style></head><body><main class="wrap"><div class="head"><h1>🧱 Elasticity</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></div><p class="sub">Stress, strain, Hooke's law, elastic moduli and elastic behaviour of materials.</p><section class="card"><b>🎯 Skill Mastery <span id="mastery">0 / 15</span></b><div class="bar"><div id="fill" class="fill"></div></div></section><section id="quiz" class="card"><div class="qno" id="qno"></div><p class="q" id="question"></p><div id="opts"></div><button id="continue" class="btn">Continue →</button><p id="feedback"></p></section><section id="done" class="card done" hidden><div class="score" id="score"></div><p>Great work! Your Elasticity skill has been practiced.</p><button class="btn" onclick="location.reload()">Retry 🔄</button></section><button id="back" class="btn back">← Back to Physics Path</button></main><script>const quiz=[['The ratio of longitudinal stress to longitudinal strain within elastic limit is called',['Young modulus','Bulk modulus','Shear modulus','Poisson ratio'],0,'Y=longitudinal stress/longitudinal strain.'],['The SI unit of stress is',['N m','N/m','N/m²','m/N'],2,'Stress is force per unit area, so its unit is pascal (N/m²).'],['Strain is',['dimensionless','measured in pascal','measured in newton','always greater than 1'],0,'Strain is a ratio of two lengths and has no dimensions.'],['Hooke’s law states that, within elastic limit, stress is proportional to',['strain','area','volume','density'],0,'Stress ∝ strain within the elastic limit.'],['Bulk modulus is the ratio of normal stress to',['volumetric strain','linear strain','shear strain','lateral strain'],0,'K=normal stress/volume strain.'],['Shear modulus relates shear stress to',['shear strain','volume strain','density','temperature'],0,'Shear modulus G=shear stress/shear strain.'],['A material that regains its original shape after removal of deforming force is',['elastic','plastic','brittle','viscous'],0,'Elastic materials recover their original dimensions.'],['If force is doubled while area remains constant, stress becomes',['half','double','four times','unchanged'],1,'Stress=F/A, so doubling F doubles stress.'],['If the length of a wire doubles but extension remains the same, its strain becomes',['double','half','four times','unchanged'],1,'Strain=extension/original length; doubling original length halves strain.'],['The dimensional formula of Young modulus is',['ML⁻¹T⁻²','MLT⁻²','ML²T⁻²','M⁻¹LT⁻²'],0,'Young modulus has the same dimensions as stress: ML⁻¹T⁻².'],['Poisson ratio is the ratio of',['lateral strain to longitudinal strain','stress to strain','longitudinal stress to lateral stress','volume to area'],0,'Poisson ratio is lateral strain divided by longitudinal strain in magnitude.'],['The elastic energy stored in a stretched wire is equal to',['area under force-extension graph','slope of force-extension graph','force/extension','extension/force'],0,'Elastic energy equals the work done, represented by area under the F-x graph.'],['For a wire, Young modulus increases when the material becomes',['stiffer','more ductile','longer','thinner'],0,'A larger Young modulus indicates greater stiffness.'],['Which material is generally more elastic in the physics sense?',['Steel','Rubber','Clay','Plasticine'],0,'Steel undergoes less strain for a given stress, so it is considered more elastic.'],['If Young modulus is very large, the material undergoes for a given stress',['large strain','small strain','zero stress','infinite extension'],1,'Y=stress/strain; larger Y means smaller strain for the same stress.']];let i=0,selected=null,score=0,checked=false;const $=id=>document.getElementById(id);function render(){selected=null;checked=false;$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=quiz[i][0];$('feedback').textContent='';$('continue').disabled=false;$('continue').textContent='Continue →';$('opts').innerHTML='';const order=quiz[i][1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((x,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{if(checked)return;selected=x.index;document.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));b.classList.add('selected')};$('opts').appendChild(b)})}function check(){if(selected===null){$('feedback').textContent='Choose an answer first.';return}checked=true;const a=quiz[i],ok=selected===a[2];if(ok){score++;$('xp').textContent=score*10}document.querySelectorAll('.opt').forEach(b=>{const n=Number(b.dataset.index);b.disabled=true;if(n===a[2])b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=(ok?'🎉 Correct! +10 XP — ':'💡 Not quite — ')+a[3];$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=((i+1)/15*100)+'%';$('continue').textContent=i===14?'Finish Skill →':'Continue →'}$('continue').onclick=()=>{if(!checked){check();return}if(i===14){$('quiz').hidden=true;$('done').hidden=false;$('score').textContent=`${score} / 15 • ${score*10} XP`}else{i++;render()}};$('back').onclick=()=>{const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html'};render();</script></body></html>
