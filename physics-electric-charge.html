<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Electric Charge</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>⚡ Electric Charge</h1>
<div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="quiz"></div><div class="xp" id="xp"></div>
<button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div>
<a class="back" href="physics-home-fast.html">← Back to Physics Path</a>
</div></div>
<script>
const qs=[
['Electric charge is a','scalar quantity','vector quantity','dimensionless vector','unitless quantity',0,'Electric charge has magnitude but no direction, so it is a scalar quantity.'],
['The SI unit of electric charge is','ampere','volt','coulomb','ohm',2,'The SI unit of electric charge is the coulomb (C).'],
['The charge on an electron is','+1.6×10⁻¹⁹ C','−1.6×10⁻¹⁹ C','+1 C','−1 C',1,'An electron carries charge −1.6×10⁻¹⁹ C.'],
['The charge on a proton is','−1.6×10⁻¹⁹ C','+1.6×10⁻¹⁹ C','0 C','+1 C',1,'A proton carries the positive elementary charge +1.6×10⁻¹⁹ C.'],
['According to quantisation of charge, charge on an isolated body is','q=ne','q=n/e','q=e/n²','q=n+e',0,'Charge is quantised: q=ne, where n is an integer and e is the elementary charge.'],
['The principle of conservation of charge states that total charge of an isolated system','can be created freely','can be destroyed freely','remains constant','is always zero',2,'Electric charge can be transferred but the total charge of an isolated system remains constant.'],
['Like electric charges','attract each other','repel each other','have no force','always neutralise',1,'Like charges repel each other, while unlike charges attract.'],
['Unlike electric charges','repel each other','attract each other','have zero interaction','cannot exist',1,'Unlike charges exert an attractive electrostatic force on each other.'],
['The magnitude of electrostatic force between two point charges is given by','F=kq₁q₂/r','F=kq₁q₂/r²','F=k(q₁+q₂)/r²','F=q₁q₂/(kr²)',1,'Coulomb’s law gives F=k|q₁q₂|/r² for the magnitude of the force.'],
['If the distance between two point charges is doubled, the electrostatic force becomes','four times','two times','one-fourth','unchanged',2,'Since F∝1/r², doubling r reduces the force to one-fourth.'],
['If one of two charges is doubled while distance remains unchanged, the electrostatic force becomes','half','double','four times','unchanged',1,'Coulomb force is directly proportional to each charge, so doubling one charge doubles the force.'],
['The value of elementary charge is approximately','1.6×10⁻¹⁹ C','9×10⁹ C','6.67×10⁻¹¹ C','3×10⁸ C',0,'The magnitude of elementary charge e is approximately 1.6×10⁻¹⁹ C.'],
['A body has charge +3.2×10⁻¹⁹ C. The number of missing electrons is','1','2','3','4',1,'n=q/e=(3.2×10⁻¹⁹)/(1.6×10⁻¹⁹)=2. A positive charge means electrons are missing.'],
['Two charges +2 μC and +3 μC are separated by 1 m in vacuum. Taking k=9×10⁹ N m²/C², the force is','0.018 N','0.054 N','0.09 N','0.54 N',1,'F=kq₁q₂/r²=9×10⁹×2×10⁻⁶×3×10⁻⁶=0.054 N.'],
['The electrostatic force between two charges in vacuum acts along','a line perpendicular to the charges','the line joining the two charges','a circular path','any random direction',1,'For point charges, the electrostatic force acts along the line joining their centres.']
];
let i=0,score=0,answered=false;const $=x=>document.getElementById(x);
function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}
function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}
function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();
</script>
</body>
</html>
