<script>
(function(){
'use strict';
const questions = [{"q":"Electric charge is a property of matter responsible for…","o":["Gravitational attraction only","Electric interactions","Nuclear mass only","Temperature"],"a":1,"e":"Electric charge is the property that causes matter to experience electric forces and interact electromagnetically."},{"q":"The SI unit of electric charge is the…","o":["Ampere","Volt","Coulomb","Ohm"],"a":2,"e":"Electric charge is measured in coulombs (C)."},{"q":"The two types of electric charge are called…","o":["Heavy and light","Positive and negative","North and south","Static and dynamic"],"a":1,"e":"Electric charge occurs in two types: positive and negative."},{"q":"Like charges…","o":["Attract each other","Repel each other","Always cancel","Have no force"],"a":1,"e":"Charges of the same sign repel, while opposite charges attract."},{"q":"Unlike charges…","o":["Repel each other","Attract each other","Always remain neutral","Have infinite separation"],"a":1,"e":"Positive and negative charges attract each other."},{"q":"The charge on an electron is…","o":["\\(+1.6\\times10^{-19}\\,\\text{C}\\)","\\(-1.6\\times10^{-19}\\,\\text{C}\\)","\\(0\\,\\text{C}\\)","\\(-1.6\\times10^{-9}\\,\\text{C}\\)"],"a":1,"e":"An electron carries charge \\(-e=-1.602\\times10^{-19}\\,\\text{C}\\), approximately."},{"q":"The charge on a proton is…","o":["Negative","Positive","Zero","Variable in ordinary conditions"],"a":1,"e":"A proton carries the positive elementary charge \\(+e\\)."},{"q":"The magnitude of the elementary charge is approximately…","o":["\\(1.6\\times10^{-19}\\,\\text{C}\\)","\\(1.6\\times10^{-9}\\,\\text{C}\\)","\\(9.1\\times10^{-31}\\,\\text{C}\\)","\\(6.02\\times10^{23}\\,\\text{C}\\)"],"a":0,"e":"The elementary charge magnitude is \\(e\\approx1.602\\times10^{-19}\\,\\text{C}\\)."},{"q":"The charge of an isolated body is quantized, meaning it is…","o":["Any real number","An integer multiple of e","Always positive","Always equal to zero"],"a":1,"e":"Charge quantization is expressed as \\(q=ne\\), where n is an integer."},{"q":"A body has an excess of electrons. It is electrically…","o":["Positive","Negative","Neutral","Uncharged but polarized only"],"a":1,"e":"Excess electrons give a net negative charge."},{"q":"A body loses electrons. Its net charge becomes…","o":["Negative","Positive","Always zero","Unchanged in every case"],"a":1,"e":"Losing negatively charged electrons leaves the body with a net positive charge."},{"q":"A neutral atom has…","o":["No protons","Equal numbers of protons and electrons","Only neutrons","More electrons than protons always"],"a":1,"e":"A neutral atom has equal total positive proton charge and negative electron charge."},{"q":"The charge of a neutron is…","o":["\\(+e\\)","\\(-e\\)","Zero","\\(+2e\\)"],"a":2,"e":"A neutron has zero net electric charge."},{"q":"A body carries charge \\(+3.2\\times10^{-19}\\,\\text{C}\\). How many elementary charges is this?","o":["1","2","3","4"],"a":1,"e":"\\(n=q/e=(3.2\\times10^{-19})/(1.6\\times10^{-19})=2\\)."},{"q":"A body has charge \\(-4.8\\times10^{-19}\\,\\text{C}\\). The number of excess electrons is…","o":["1","2","3","4"],"a":2,"e":"The magnitude gives \\(n=|q|/e=4.8/1.6=3\\) excess electrons."},{"q":"The principle of conservation of charge states that total charge in an isolated system…","o":["Can be created freely","Can be destroyed freely","Remains constant","Always becomes positive"],"a":2,"e":"Charge may transfer between objects, but total charge of an isolated system remains constant."},{"q":"Charging by friction generally involves transfer of…","o":["Protons between nuclei","Electrons between materials","Neutrons between atoms","Entire atoms only"],"a":1,"e":"In ordinary frictional charging, electrons are transferred from one material to another."},{"q":"A positively charged object has…","o":["An excess of electrons","A deficit of electrons","No protons","Only positive neutrons"],"a":1,"e":"A positive net charge usually means fewer electrons than protons."},{"q":"A negatively charged object has…","o":["A deficit of electrons","An excess of electrons","No electrons","Only neutrons"],"a":1,"e":"A negative net charge indicates excess electrons."},{"q":"The charge of a system containing \\(5\\) protons and \\(3\\) electrons is…","o":["\\(+2e\\)","\\(-2e\\)","\\(+8e\\)","Zero"],"a":0,"e":"Net charge is \\((5-3)e=+2e\\)."},{"q":"An object gains \\(10^{12}\\) electrons. Its charge becomes…","o":["\\(+1.6\\times10^{-7}\\,\\text{C}\\)","\\(-1.6\\times10^{-7}\\,\\text{C}\\)","\\(-1.6\\times10^{-19}\\,\\text{C}\\)","\\(+1.6\\times10^{-19}\\,\\text{C}\\)"],"a":1,"e":"\\(q=-ne=-(10^{12})(1.6\\times10^{-19})=-1.6\\times10^{-7}\\,\\text{C}\\)."},{"q":"An object loses \\(2\\times10^{10}\\) electrons. Its charge is…","o":["\\(-3.2\\times10^{-9}\\,\\text{C}\\)","\\(+3.2\\times10^{-9}\\,\\text{C}\\)","\\(+1.6\\times10^{-19}\\,\\text{C}\\)","Zero"],"a":1,"e":"Losing electrons leaves positive charge: \\(q=(2\\times10^{10})(1.6\\times10^{-19})=+3.2\\times10^{-9}\\,\\text{C}\\)."},{"q":"Which particle has the smallest magnitude of charge among these?","o":["Proton","Electron","Neutron","Proton and electron have equal magnitude"],"a":2,"e":"The neutron's net charge is zero; proton and electron charges have equal magnitude."},{"q":"When a charged rod attracts a neutral light object, one possible explanation is…","o":["The neutral object has no charges at all","Charge redistribution (polarization) in the neutral object","Charge conservation is violated","Gravity must be the only force"],"a":1,"e":"A charged object can induce polarization in a neutral object, leading to net attraction."},{"q":"A glass rod rubbed with silk is conventionally described as becoming…","o":["Negatively charged","Positively charged","Always neutral","A magnetic pole"],"a":1,"e":"In the conventional example, glass rubbed with silk loses electrons and becomes positively charged."},{"q":"If two identical conducting spheres carry charges \\(+6\\,\\text{C}\\) and \\(-2\\,\\text{C}\\), then touch and separate, each sphere has…","o":["\\(+2\\,\\text{C}\\)","\\(+4\\,\\text{C}\\)","\\(-2\\,\\text{C}\\)","\\(+8\\,\\text{C}\\)"],"a":0,"e":"Total charge is +4 C. Identical spheres share it equally, so each ends with +2 C."},{"q":"A body has charge \\(q=ne\\). If \\(n=-5\\), its charge is…","o":["\\(+5e\\)","\\(-5e\\)","\\(+e/5\\)","Zero"],"a":1,"e":"A negative n means the body's net charge is \\(-5e\\), corresponding to excess electrons."},{"q":"Which statement about electric charge is correct?","o":["Charge is a scalar quantity","Charge is always positive","Neutrons carry +e","Charge is measured in volts"],"a":0,"e":"Electric charge is a scalar quantity and is measured in coulombs."},{"q":"Two identical bodies have charges +8 C and 0 C. After touching and separating, each has…","o":["+8 C","+4 C","0 C","−4 C"],"a":1,"e":"Total charge +8 C is shared equally by identical conducting bodies, giving +4 C each."},{"q":"An object has net charge zero. This means it…","o":["Contains no charged particles","Has equal total positive and negative charge","Contains only neutrons","Cannot be attracted by a charged object"],"a":1,"e":"Neutrality means positive and negative charges balance; a neutral object can still be polarized and attracted."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function typesetMath(){if(window.MathJax?.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options'),$('feedback')].filter(Boolean)).catch(()=>{});}}
window.addEventListener('load',typesetMath);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
 typesetMath();
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Electric Charge Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
