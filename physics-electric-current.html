.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}

<section class="hero"><h1>⚡ Electric Current</h1><p class="muted">Practise the meaning, units and dimensions of electric current, isolated conductors, capacitor combinations, dielectrics, charge and stored energy.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>

<script>
(function(){
'use strict';
let index=0, chosen=null, locked=false, score=0, streak=0;
const questions = [{"q":"Electric current is defined as the rate of flow of…","o":["Energy","Charge","Resistance","Potential"],"a":1,"e":"Electric current is charge flowing per unit time: I = Q/t."},{"q":"The SI unit of electric current is…","o":["Coulomb","Volt","Ampere","Ohm"],"a":2,"e":"Current is measured in amperes (A)."},{"q":"A current of 2 A flows for 5 s. How much charge passes?","o":["2.5 C","7 C","10 C","25 C"],"a":2,"e":"Q = It = 2 × 5 = 10 C."},{"q":"If 30 C of charge passes in 10 s, the current is…","o":["0.3 A","3 A","20 A","300 A"],"a":1,"e":"I = Q/t = 30/10 = 3 A."},{"q":"One ampere is equal to…","o":["One joule per coulomb","One coulomb per second","One volt per second","One ohm per volt"],"a":1,"e":"1 A = 1 C s⁻¹."},{"q":"Conventional current in a metallic wire is directed…","o":["Along electron drift","Opposite to electron drift","Perpendicular to electron drift","Randomly"],"a":1,"e":"Conventional current is defined in the direction positive charges would move, opposite to electron drift in metals."},{"q":"Electrons in a metal conductor drift, on average, from…","o":["Higher to lower potential","Positive to negative terminal","Negative to positive terminal","Earth to the wire only"],"a":2,"e":"Electrons drift from the negative terminal toward the positive terminal in an operating circuit."},{"q":"Which instrument measures current?","o":["Voltmeter","Ammeter","Potentiometer only","Ohmmeter only"],"a":1,"e":"An ammeter measures current and is connected in series."},{"q":"An ideal ammeter has resistance…","o":["Very high","Infinite","Zero","Equal to the load"],"a":2,"e":"An ideal ammeter should not change the circuit current, so its resistance is zero."},{"q":"An ammeter is connected in a circuit…","o":["In parallel with the component","In series with the component","Across the battery only","Without a closed path"],"a":1,"e":"The same current passes through series-connected components."},{"q":"A charge of 600 C flows in 2 minutes. Find the current.","o":["3 A","5 A","10 A","300 A"],"a":1,"e":"2 minutes = 120 s; I = 600/120 = 5 A."},{"q":"A wire carries 0.5 A for 4 minutes. Charge transferred is…","o":["2 C","30 C","120 C","240 C"],"a":3,"e":"Q = It = 0.5 × 240 = 120 C."},{"q":"If the charge passing a cross-section doubles in the same time, current…","o":["Halves","Doubles","Remains zero","Becomes four times"],"a":1,"e":"I = Q/t, so doubling Q for the same t doubles I."},{"q":"For a steady current, the charge passing in time t is…","o":["Q = I/t","Q = It","Q = t/I","Q = I + t"],"a":1,"e":"Rearranging I = Q/t gives Q = It."},{"q":"The conventional current direction corresponds to the motion of…","o":["Negative charges only","Positive charges","Neutrons","Photons"],"a":1,"e":"By convention, current points in the direction of positive charge motion."},{"q":"If 4 × 10¹⁸ electrons pass a cross-section each second, the current magnitude is approximately…","o":["0.064 A","0.64 A","6.4 A","64 A"],"a":1,"e":"I = Ne per second = 4 × 10¹⁸ × 1.6 × 10⁻¹⁹ C/s = 0.64 A."},{"q":"The magnitude of the charge on one electron is approximately…","o":["1.6 × 10⁻¹⁹ C","1.6 × 10⁻¹⁶ C","9.1 × 10⁻³¹ C","1.6 × 10⁻¹⁹ A"],"a":0,"e":"The elementary charge magnitude is 1.602 × 10⁻¹⁹ C."},{"q":"Current through a conductor is 3 A. How much charge flows in 20 s?","o":["15 C","23 C","60 C","600 C"],"a":2,"e":"Q = It = 3 × 20 = 60 C."},{"q":"If 12 C flows in 3 s and then 12 C flows in 6 s, the currents are…","o":["4 A and 2 A","2 A and 4 A","36 A and 72 A","4 A and 4 A"],"a":0,"e":"I₁ = 12/3 = 4 A; I₂ = 12/6 = 2 A."},{"q":"In a series circuit, the current through each ideal component is…","o":["Always different","The same","Always zero","Proportional to resistance"],"a":1,"e":"A single path means the same current passes through every series element."},{"q":"At a junction, 5 A enters and 2 A leaves through one branch. If there are only two outgoing branches, the other outgoing current is…","o":["2 A","3 A","5 A","7 A"],"a":1,"e":"Charge conservation gives total outgoing current 5 A; the remaining branch carries 3 A."},{"q":"Current density is defined as current per unit…","o":["Length","Volume","Cross-sectional area","Resistance"],"a":2,"e":"For uniform current density, J = I/A."},{"q":"The SI unit of current density is…","o":["A m⁻¹","A m⁻²","C m⁻²","A m²"],"a":1,"e":"Current density is measured in amperes per square metre."},{"q":"For a uniform current density J through area A, current is…","o":["I = J/A","I = JA","I = J + A","I = A/J"],"a":1,"e":"For uniform flow, I = JA."},{"q":"If the same current flows through a wire whose cross-sectional area is halved, current density…","o":["Halves","Doubles","Stays unchanged","Becomes zero"],"a":1,"e":"J = I/A; halving A while keeping I fixed doubles J."},{"q":"Which expression relates current to carrier density n, area A, charge magnitude e and drift speed vd for one carrier type?","o":["I = n e A vd","I = n e vd/A","I = A/(n e vd)","I = nA/(e vd)"],"a":0,"e":"The drift-current relation is I = n e A v_d for the magnitude."},{"q":"A current of 1 A means approximately how many elementary charges pass each second?","o":["6.25 × 10¹⁸","1.6 × 10⁻¹⁹","6.25 × 10⁻¹⁹","1.0 × 10¹⁰"],"a":0,"e":"Number per second = I/e ≈ 1/(1.6 × 10⁻¹⁹) = 6.25 × 10¹⁸."},{"q":"Which statement about electric current in a steady series circuit is correct?","o":["Current is used up by each resistor","Charge accumulates continuously in every resistor","The same current passes each point in the series path","Current is largest after a resistor"],"a":2,"e":"In steady state, charge conservation means current is the same throughout a single series path."},{"q":"A conductor carries 250 mA. This equals…","o":["0.025 A","0.25 A","2.5 A","25 A"],"a":1,"e":"1 mA = 10⁻³ A, so 250 mA = 0.250 A."},{"q":"A current of 0.02 A flows for 50 s. The total charge is…","o":["0.001 C","0.4 C","1 C","2.5 C"],"a":2,"e":"Q = It = 0.02 × 50 = 1 C."}];
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function typesetMath(){if(window.MathJax?.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options'),$('feedback')].filter(Boolean)).catch(()=>{});}}
window.addEventListener('load',typesetMath);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
 typesetMath();
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Electric Current Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
   if(window.MathJax?.typesetPromise) window.MathJax.typesetPromise([review]).catch(()=>{});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
