<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Electric Dipole</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}
</style></head><body>
<div class="wrap"><div class="card"><h1>⚡ Electric Dipole</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div>
<script>
const qs=[
['An electric dipole consists of','two equal charges of the same sign','two equal and opposite charges separated by a small distance','two unequal positive charges only','a single isolated charge',1,'An electric dipole is a pair of equal and opposite charges separated by a finite distance.'],
['The electric dipole moment is defined as','p=q/d','p=qd','p=q/d²','p=d/q',1,'For charges +q and −q separated by distance d, the dipole moment magnitude is p=qd.'],
['The SI unit of electric dipole moment is','C/m','C·m','N/C','J/C',1,'The SI unit of p=q d is coulomb-metre (C·m).'],
['The direction of electric dipole moment is from','positive charge to negative charge','negative charge to positive charge','the midpoint toward negative charge','the larger charge toward the smaller charge',1,'By convention, the dipole moment vector points from the negative charge toward the positive charge.'],
['For a dipole made of charges ±q separated by distance 2a, its dipole moment magnitude is','qa','2qa','q/2a','4qa',1,'Using p=qd and d=2a gives p=2qa.'],
['The torque on an electric dipole of moment p in a uniform electric field E at angle θ is','pE cosθ','pE sinθ','p/E','E/p',1,'The torque magnitude is τ=pE sinθ.'],
['The torque on an electric dipole is maximum when the angle between p and E is','0°','30°','90°','180°',2,'Since τ=pE sinθ, the maximum occurs when sinθ=1, i.e. θ=90°.'],
['The torque on an electric dipole is zero when the dipole is oriented','only at 90° to the field','parallel or antiparallel to the field','at 45° to the field','at every angle',1,'τ=pE sinθ is zero for θ=0° and 180°.'],
['The potential energy of an electric dipole in a uniform electric field is','U=pE sinθ','U=−pE cosθ','U=pE cosθ','U=−pE sinθ',1,'The dipole potential energy is U=−p·E=−pE cosθ.'],
['The stable equilibrium orientation of an electric dipole in a uniform electric field is when','p is perpendicular to E','p is parallel to E','p is antiparallel to E','p is zero',1,'U is minimum at θ=0°, so the dipole moment aligns parallel to the field.'],
['For a short electric dipole, the electric field on its axial line at a far point varies as','1/r','1/r²','1/r³','1/r⁴',2,'For r much larger than the dipole size, axial dipole field varies as 1/r³.'],
['For a short electric dipole, the electric field on its equatorial line at a far point varies as','1/r','1/r²','1/r³','r³',2,'The far-field equatorial dipole field also varies as 1/r³.'],
['At the same large distance from a short dipole, the axial electric field magnitude is','equal to the equatorial field','twice the equatorial field','half the equatorial field','four times the equatorial field',1,'For a short dipole, E_axial≈2kp/r³ while E_equatorial≈kp/r³, so the axial field is twice as large.'],
['A dipole has charges ±2 μC separated by 5 cm. Its dipole moment magnitude is','1×10⁻⁸ C·m','1×10⁻⁷ C·m','1×10⁻⁶ C·m','1×10⁻⁵ C·m',1,'p=qd=(2×10⁻⁶)(0.05)=1×10⁻⁷ C·m.'],
['An electric dipole placed in a uniform electric field experiences','a net force always equal to pE','zero net force but generally a torque','zero force and zero torque at every orientation','only a force on the negative charge',1,'In a uniform field the forces on the two charges are equal and opposite, giving zero net force but generally a torque.']
];
let i=0,score=0,answered=false;const $=x=>document.getElementById(x);
function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}
function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}
function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();
</script></body></html>
