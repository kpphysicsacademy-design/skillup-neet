)","\\(-pE\\sin\\theta\\)"],"a":1,"e":"\\(U=-\\vec p\\cdot\\vec E=-pE\\cos\\theta\\)."},{"q":"The stable equilibrium orientation of a dipole is when p is…","o":["Perpendicular to E","Parallel to E","Antiparallel to E","Always zero"],"a":1,"e":"The potential energy is minimum at θ=0°, with p parallel to E."},{"q":"For a short dipole far away, the axial field varies with distance r as…","o":["\\(1/r\\)","\\(1/r^2\\)","\\(1/r^3\\)","\\(r^3\\)"],"a":2,"e":"The far-field dipole field magnitude varies as \\(1/r^3\\)."},{"q":"For a short dipole far away, the equatorial field magnitude varies as…","o":["\\(1/r\\)","\\(1/r^2\\)","\\(1/r^3\\)","\\(r^2\\)"],"a":2,"e":"The equatorial dipole field also varies as \\(1/r^3\\)."},{"q":"At the same far distance from a short dipole, the axial field magnitude is approximately…","o":["Equal to the equatorial field","Twice the equatorial field","Half the equatorial field","Four times the equatorial field"],"a":1,"e":"\\(E_{axial}=2kp/r^3\\), while \\(E_{equatorial}=kp/r^3\\)."},{"q":"Charges ±2 μC are separated by 5 cm. Dipole moment magnitude is…","o":["\\(1\\times10^{-8}\\,\\text{C m}\\)","\\(1\\times10^{-7}\\,\\text{C m}\\)","\\(1\\times10^{-6}\\,\\text{C m}\\)","\\(1\\times10^{-5}\\,\\text{C m}\\)"],"a":1,"e":"\\(p=qd=(2\\times10^{-6})(0.05)=1\\times10^{-7}\\,\\text{C m}\\)."},{"q":"A dipole in a uniform electric field experiences…","o":["Always a net force pE","Zero net force but generally a torque","Zero torque at all orientations","A force only on the negative charge"],"a":1,"e":"For a uniform field, forces on the two charges cancel but may form a couple."},{"q":"A dipole in a non-uniform electric field can experience…","o":["No force under any condition","A net force","Only zero torque","No interaction with the field"],"a":1,"e":"Unequal field strengths at the two charges can produce a nonzero net force."},{"q":"A dipole has p = 4×10⁻⁸ C m in a 3×10⁴ N/C field at 90°. Torque is…","o":["\\(0\\)","\\(1.2\\times10^{-3}\\,\\text{N m}\\)","\\(1.2\\times10^{-4}\\,\\text{N m}\\)","\\(7.5\\times10^{11}\\,\\text{N m}\\)"],"a":2,"e":"\\(\\tau=pE\\sin90^\\circ=(4\\times10^{-8})(3\\times10^4)=1.2\\times10^{-3}\\,\\text{N m}\\)."},{"q":"For the preceding relation, the correct torque calculation is…","o":["\\(1.2\\times10^{-3}\\,\\text{N m}\\)","\\(1.2\\times10^{-4}\\,\\text{N m}\\)","\\(1.2\\times10^{-5}\\,\\text{N m}\\)","\\(0\\)"],"a":0,"e":"\\(4\\times3\\times10^{-8+4}=12\\times10^{-4}=1.2\\times10^{-3}\\,\\text{N m}\\)."},{"q":"At θ = 0°, the dipole potential energy is…","o":["\\(+pE\\)","\\(-pE\\)","Zero","Undefined"],"a":1,"e":"\\(U=-pE\\cos0=-pE\\), the minimum potential energy."},{"q":"At θ = 180°, the dipole potential energy is…","o":["\\(-pE\\)","\\(+pE\\)","Zero","\\(-p/E\\)"],"a":1,"e":"\\(U=-pE\\cos180=+pE\\), the maximum potential energy."},{"q":"A dipole moment of 2×10⁻⁶ C m is in a 5×10³ N/C field at 30°. Torque is…","o":["\\(5\\times10^{-3}\\,\\text{N m}\\)","\\(1\\times10^{-2}\\,\\text{N m}\\)","\\(2.5\\times10^{-3}\\,\\text{N m}\\)","\\(0\\)"],"a":0,"e":"\\(\\tau=pE\\sin30=(2\\times10^{-6})(5\\times10^3)(0.5)=5\\times10^{-3}\\,\\text{N m}\\)."},{"q":"If dipole moment doubles while field and angle stay fixed, torque…","o":["Halves","Doubles","Quadruples","Is unchanged"],"a":1,"e":"\\(\\tau\\propto p\\) when E and θ are fixed."},{"q":"If field strength doubles while p and angle stay fixed, torque…","o":["Halves","Doubles","Quadruples","Is unchanged"],"a":1,"e":"\\(\\tau\\propto E\\) for fixed p and θ."},{"q":"A dipole is aligned antiparallel to E. Its torque magnitude is…","o":["\\(pE\\)","\\(pE/2\\)","Zero","Infinite"],"a":2,"e":"At 180°, \\(\\sin180=0\\), so torque is zero, though this equilibrium is unstable."},{"q":"Which expression gives dipole potential energy in vector form?","o":["\\(\\vec p\\times\\vec E\\)","\\(-\\vec p\\cdot\\vec E\\)","\\(\\vec p+\\vec E\\)","\\(p/E\\)"],"a":1,"e":"The scalar potential energy is the negative dot product \\(-\\vec p\\cdot\\vec E\\)."},{"q":"For a short dipole, doubling the observation distance reduces the far-field magnitude to…","o":["\\(E/2\\)","\\(E/4\\)","\\(E/8\\)","\\(E/16\\)"],"a":2,"e":"Because \\(E\\propto1/r^3\\), doubling r reduces the field to E/8."},{"q":"The net charge of an ideal electric dipole is…","o":["\\(+q\\)","\\(-q\\)","\\(2q\\)","Zero"],"a":3,"e":"The charges +q and −q sum to zero net charge."},{"q":"A dipole moment has dimensions of…","o":["Charge × length","Force × length","Energy × time","Charge per unit area"],"a":0,"e":"From p=qd, its dimensions are charge multiplied by length."},{"q":"The electric field of a dipole at a far axial point is directed…","o":["Along the dipole moment vector","Opposite to the dipole moment vector","Always perpendicular to p","Always zero"],"a":0,"e":"On the axial line outside the dipole, the far-field direction is along p."},{"q":"For a dipole in a uniform field, the torque tends to rotate p toward…","o":["The direction opposite to E","Alignment with E","A perpendicular direction only","A random direction"],"a":1,"e":"The torque tends to align the dipole moment with the electric field, minimizing potential energy."}];
