<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Electric Field Intensity</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}
</style></head><body>
<div class="wrap"><div class="card"><h1>⚡ Electric Field Intensity</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div>
<script>
const qs=[
['Electric field intensity at a point is defined as the','force acting on a unit positive test charge','force acting on any charge','electric potential at the point','charge per unit area',0,'Electric field intensity is force per unit positive test charge: E=F/q.'],
['The SI unit of electric field intensity is','N/C','C/N','N·m²/C','J·C',0,'The SI unit is newton per coulomb (N/C), equivalent to volt per metre (V/m).'],
['The dimensional formula of electric field intensity is','[MLT⁻²Q⁻¹]','[ML²T⁻²Q⁻¹]','[MLT⁻¹Q⁻¹]','[M⁻¹LT²Q]',0,'Since E=F/q, its dimensions are [MLT⁻²Q⁻¹].'],
['The electric field intensity due to a point charge q at distance r in vacuum is','kq/r','kq/r²','kqr²','q/(kr)',1,'For a point charge, E=k|q|/r².'],
['If the distance from a point charge is tripled, its electric field intensity becomes','3E','E/3','E/6','E/9',3,'Because E is proportional to 1/r², tripling r reduces E to E/9.'],
['If the source charge is doubled while the distance remains unchanged, electric field intensity becomes','E/4','E/2','2E','4E',2,'Electric field intensity is directly proportional to the source charge.'],
['The electric field intensity at the midpoint between two identical positive charges is','zero','kq/r²','2kq/r²','infinite',0,'The two equal electric fields at the midpoint are opposite in direction and cancel.'],
['The electric field intensity at the midpoint between equal and opposite charges is','zero','non-zero and directed from positive to negative charge','always infinite','undefined',1,'At the midpoint, the field due to the positive charge points away from +q and the field due to −q points toward −q; both point in the same direction.'],
['A charge of 4 μC experiences a force of 0.8 N in an electric field. The field intensity is','2×10⁴ N/C','2×10⁵ N/C','3.2×10⁵ N/C','5×10⁵ N/C',1,'E=F/q=0.8/(4×10⁻⁶)=2×10⁵ N/C.'],
['A 2 μC point charge produces an electric field at 3 m in vacuum. Taking k=9×10⁹ N m²/C², E is','1000 N/C','2000 N/C','4000 N/C','6000 N/C',1,'E=kq/r²=(9×10⁹)(2×10⁻⁶)/9=2000 N/C.'],
['The electric field intensity at a point due to several charges is obtained by','adding charge magnitudes only','adding electric field vectors','multiplying all electric fields','using only the largest charge',1,'Electric fields obey the superposition principle, so the individual field vectors are added.'],
['Electric field intensity is a','scalar quantity','vector quantity','dimensionless quantity','tensor only',1,'Electric field has both magnitude and direction, so it is a vector quantity.'],
['For a positive point charge, the electric field intensity is directed','toward the charge','radially outward from the charge','in a circular direction','opposite to the force on a positive test charge',1,'A positive source charge produces a radially outward electric field.'],
['For a negative point charge, the electric field intensity is directed','radially outward','radially inward toward the charge','perpendicular to the radial direction','zero at every point',1,'A negative point charge produces a radially inward electric field.'],
['If the same test charge is placed in a region where electric field intensity doubles, the electric force on it','becomes half','remains unchanged','doubles','becomes four times',2,'From F=qE, for a fixed test charge, doubling E doubles the force.']
];
let i=0,score=0,answered=false;const $=x=>document.getElementById(x);
function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}
function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}
function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();
</script></body></html>
