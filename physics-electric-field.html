<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Electric Field</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}
</style></head><body>
<div class="wrap"><div class="card"><h1>⚡ Electric Field</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div>
<script>
const qs=[
['The electric field at a point is defined as the','force on a unit positive test charge','force on any charge','charge per unit volume','potential energy per unit charge',0,'Electric field E is the force experienced by a unit positive test charge: E=F/q.'],
['The SI unit of electric field is','N/C','C/N','J/C','N·m',0,'Electric field has SI unit newton per coulomb (N/C), equivalently V/m.'],
['The electric field due to a point charge q at distance r in vacuum is','kq/r','kq/r²','kr/q','q/(kr²)',1,'For a point charge, E=k|q|/r².'],
['The direction of the electric field due to a positive point charge is','toward the charge','radially outward','perpendicular to every radius','random',1,'Electric field lines emerge radially outward from a positive charge.'],
['The direction of the electric field due to a negative point charge is','radially outward','radially inward toward the charge','always upward','zero everywhere',1,'Electric field lines point toward a negative charge.'],
['If the distance from a point charge is doubled, the electric field magnitude becomes','2E','E','E/2','E/4',3,'Since E is proportional to 1/r², doubling r makes the field one-fourth.'],
['If the source charge is doubled while distance remains unchanged, the electric field becomes','E/4','E/2','2E','4E',2,'Since E is directly proportional to source charge q, doubling q doubles E.'],
['The electric field inside an ideal conductor in electrostatic equilibrium is','maximum','zero','equal to surface charge density','infinite',1,'In electrostatic equilibrium, the electric field within the conducting material is zero.'],
['Electric field lines','can intersect at a point','never intersect each other','always form closed loops','have no direction',1,'At an intersection a field would have two directions, which is impossible at a single point.'],
['The electric field at the midpoint between two identical positive charges is','zero','kq/r²','2kq/r²','infinite',0,'The two equal fields at the midpoint are opposite in direction and cancel.'],
['A charge of 2 μC experiences a force of 0.6 N in an electric field. The field magnitude is','0.3×10⁶ N/C','3×10⁵ N/C','1.2×10⁶ N/C','3×10⁶ N/C',1,'E=F/q=0.6/(2×10⁻⁶)=3×10⁵ N/C.'],
['A point charge of 1 μC produces an electric field at 3 m in vacuum. Taking k=9×10⁹, its magnitude is','100 N/C','1000 N/C','3000 N/C','9000 N/C',1,'E=kq/r²=(9×10⁹)(10⁻⁶)/9=1000 N/C.'],
['For a uniformly charged spherical shell, the electric field at any point inside the shell is','zero','maximum','kQ/r² using the interior r','always equal to surface field',0,'By Gauss law, the electric field inside an ideal uniformly charged spherical shell is zero.'],
['The electric field due to several point charges at a point is obtained by','adding their charges only','adding the electric field vectors','multiplying all field magnitudes','using only the nearest charge',1,'Electric fields obey the superposition principle, so individual field vectors are added.'],
['A test charge used to define electric field should ideally be','large and negative','small and positive','large and positive','neutral only',1,'A small positive test charge is used so it does not significantly disturb the source-charge configuration.']
];
let i=0,score=0,answered=false;const $=x=>document.getElementById(x);
function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}
function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}
function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();
</script></body></html>
