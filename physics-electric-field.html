<script>
(function(){
'use strict';
const questions = [{"q":"Electric field at a point is defined as the…","o":["Force on a unit positive test charge","Charge per unit volume","Energy per unit time","Force multiplied by charge"],"a":0,"e":"Electric field is force per unit positive test charge: \\(\\vec E=\\vec F/q_0\\)."},{"q":"The SI unit of electric field is…","o":["\\(\\text{N/C}\\)","\\(\\text{C/N}\\)","\\(\\text{J}\\)","\\(\\text{C}\\)"],"a":0,"e":"The SI unit is newton per coulomb (N/C), equivalent to volt per metre (V/m)."},{"q":"The magnitude of the electric field due to a point charge in vacuum is…","o":["\\(k|q|/r\\)","\\(k|q|/r^2\\)","\\(kr^2/|q|\\)","\\(|q|/(kr^2)\\)"],"a":1,"e":"For a point charge, \\(E=k|q|/r^2\\)."},{"q":"The electric field direction around a positive point charge is…","o":["Radially inward","Radially outward","Circular around the charge","Zero in every direction"],"a":1,"e":"A positive test charge is repelled by a positive source charge, so the field points outward."},{"q":"The electric field direction around a negative point charge is…","o":["Radially outward","Radially inward","Always upward","Always zero"],"a":1,"e":"A positive test charge is attracted to a negative source charge, so the field points inward."},{"q":"If the distance from a point charge doubles, the field magnitude becomes…","o":["\\(2E\\)","\\(E/2\\)","\\(E/4\\)","\\(4E\\)"],"a":2,"e":"Since \\(E\\propto1/r^2\\), doubling distance reduces the field to one-fourth."},{"q":"If the magnitude of the source charge doubles while distance stays fixed, the field magnitude…","o":["Halves","Doubles","Quadruples","Does not change"],"a":1,"e":"The field is directly proportional to the source-charge magnitude."},{"q":"The electric field inside the material of an ideal conductor in electrostatic equilibrium is…","o":["Zero","Constant but non-zero","Infinite","Always equal to the outside field"],"a":0,"e":"Free charges redistribute until the electric field within the conducting material is zero."},{"q":"Two electric field lines can intersect…","o":["At every positive charge","Only at a negative charge","Never","Only in a uniform field"],"a":2,"e":"An intersection would imply two field directions at one point, which is impossible."},{"q":"At the midpoint between two identical positive charges placed symmetrically, the net electric field is…","o":["Zero","\\(kq/r^2\\)","\\(2kq/r^2\\)","Infinite"],"a":0,"e":"The two equal fields at the midpoint point in opposite directions and cancel."},{"q":"A charge of \\(2\\,\\mu\\text{C}\\) experiences a force of 0.6 N. The field magnitude is…","o":["\\(3\\times10^4\\,\\text{N/C}\\)","\\(3\\times10^5\\,\\text{N/C}\\)","\\(1.2\\times10^6\\,\\text{N/C}\\)","\\(3\\times10^6\\,\\text{N/C}\\)"],"a":1,"e":"\\(E=F/q=0.6/(2\\times10^{-6})=3\\times10^5\\,\\text{N/C}\\)."},{"q":"A \\(1\\,\\mu\\text{C}\\) point charge produces a field at 3 m in vacuum. Take \\(k=9\\times10^9\\). The field is…","o":["100 N/C","1000 N/C","3000 N/C","9000 N/C"],"a":1,"e":"\\(E=kq/r^2=(9\\times10^9)(10^{-6})/9=1000\\,\\text{N/C}\\)."},{"q":"For an ideal uniformly charged spherical shell, the electric field inside the shell is…","o":["Zero","\\(kQ/r^2\\) at all interior points","Maximum at the center","Infinite at the center"],"a":0,"e":"Gauss's law gives zero electric field everywhere inside an ideal uniformly charged spherical shell."},{"q":"The net electric field due to several point charges is found by…","o":["Adding the charge magnitudes only","Adding the electric-field vectors","Multiplying field magnitudes","Using only the nearest charge"],"a":1,"e":"Electric fields obey superposition, so each contribution is added vectorially."},{"q":"An ideal test charge used to define an electric field is taken to be…","o":["Small and positive","Large and negative","Large and positive","Neutral and extended"],"a":0,"e":"A small positive test charge defines the field direction while minimizing disturbance to the source configuration."},{"q":"The electric field is a…","o":["Scalar quantity","Vector quantity","Dimensionless quantity","Unit of charge"],"a":1,"e":"Electric field has both magnitude and direction."},{"q":"A positive charge placed in an electric field experiences force…","o":["Opposite to the field direction","Along the field direction","Always perpendicular to the field","Independent of the field"],"a":1,"e":"For positive q, \\(\\vec F=q\\vec E\\), so force and field point in the same direction."},{"q":"A negative charge placed in an electric field experiences force…","o":["Along the field direction","Opposite to the field direction","Always zero","Always upward"],"a":1,"e":"For negative q, \\(\\vec F=q\\vec E\\) points opposite to the field."},{"q":"The relation between electric field and force on a test charge is…","o":["\\(\\vec E=q\\vec F\\)","\\(\\vec E=\\vec F/q\\)","\\(\\vec E=\\vec F+q\\)","\\(\\vec E=q/\\vec F\\)"],"a":1,"e":"Electric field is force per unit test charge: \\(\\vec E=\\vec F/q\\)."},{"q":"At a fixed point in vacuum, if the source charge is tripled, the field magnitude becomes…","o":["\\(E/3\\)","\\(E\\)","\\(3E\\)","\\(9E\\)"],"a":2,"e":"The field magnitude is directly proportional to the source charge."},{"q":"If the distance from a point charge is tripled, the field magnitude becomes…","o":["\\(E/3\\)","\\(E/6\\)","\\(E/9\\)","\\(9E\\)"],"a":2,"e":"Inverse-square dependence gives \\(E'=E/3^2=E/9\\)."},{"q":"The electric field at a point is zero. Which statement is necessarily true?","o":["No source charges exist anywhere","The vector sum of all field contributions is zero at that point","Every individual field contribution is zero","The electric potential must be zero"],"a":1,"e":"Different field contributions can cancel; zero field does not require zero potential or no charges."},{"q":"The electric field at a distance r from a point charge depends on…","o":["Only the test charge","Source-charge magnitude and distance","Only the mass of the test charge","The color of the source"],"a":1,"e":"In vacuum, \\(E=k|q|/r^2\\), so it depends on source charge and distance."},{"q":"A field of \\(200\\,\\text{N/C}\\) acts on a \\(3\\,\\text{C}\\) positive charge. The force magnitude is…","o":["\\(\\frac{200}{3}\\,\\text{N}\\)","\\(203\\,\\text{N}\\)","\\(600\\,\\text{N}\\)","\\(0.015\\,\\text{N}\\)"],"a":2,"e":"\\(F=qE=3\\times200=600\\,\\text{N}\\)."},{"q":"A point charge of \\(+4\\,\\mu\\text{C}\\) creates a field at 2 m in vacuum. With \\(k=9\\times10^9\\), its magnitude is…","o":["\\(450\\,\\text{N/C}\\)","\\(900\\,\\text{N/C}\\)","\\(9000\\,\\text{N/C}\\)","\\(18000\\,\\text{N/C}\\)"],"a":2,"e":"\\(E=kq/r^2=(9\\times10^9)(4\\times10^{-6})/4=9\\times10^3\\,\\text{N/C}\\)."},{"q":"Electric field lines are drawn so that the tangent at a point gives the…","o":["Magnitude of charge","Direction of the electric field","Electric potential only","Mass of a test charge"],"a":1,"e":"The tangent to a field line gives the local electric-field direction."},{"q":"Where electric field lines are closer together, the field is generally…","o":["Weaker","Stronger","Always zero","Negative by definition"],"a":1,"e":"Field-line density represents relative field strength; closer lines indicate a stronger field."},{"q":"The electric field due to a point charge at an infinite distance approaches…","o":["Infinity","Zero","A fixed non-zero value","The charge itself"],"a":1,"e":"As \\(r\\to\\infty\\), \\(E=k|q|/r^2\\to0\\)."},{"q":"For a uniform electric field, the field vectors at different points have…","o":["Different magnitudes and directions everywhere","The same magnitude and direction","Zero magnitude","Directions that must be radial"],"a":1,"e":"A uniform field has constant magnitude and direction throughout the region."},{"q":"A \\(2\\,\\mu\\text{C}\\) positive test charge is in a field of \\(5\\times10^3\\,\\text{N/C}\\). The force magnitude is…","o":["\\(10^{-3}\\,\\text{N}\\)","\\(10^{-2}\\,\\text{N}\\)","\\(10\\,\\text{N}\\)","\\(2.5\\times10^9\\,\\text{N}\\)"],"a":0,"e":"\\(F=qE=(2\\times10^{-6})(5\\times10^3)=10^{-2}\\,\\text{N}\\)."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function typesetMath(){if(window.MathJax?.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options'),$('feedback')].filter(Boolean)).catch(()=>{});}}
window.addEventListener('load',typesetMath);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
 typesetMath();
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Electric Field Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
   if(window.MathJax?.typesetPromise) window.MathJax.typesetPromise([review]).catch(()=>{});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
