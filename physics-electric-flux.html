<script>
(function(){
'use strict';
const questions = [{"q":"Electric flux in a uniform field is…","o":["\\(EA\\sin\\theta\\)","\\(EA\\cos\\theta\\)","\\(E/A\\)","\\(E+A\\)"],"a":1,"e":"Flux is the dot product \\(\\vec E\\cdot\\vec A=EA\\cos\\theta\\)."},{"q":"The SI unit of electric flux is…","o":["N m²/C","N/C","C/m²","N m/C"],"a":0,"e":"Electric field multiplied by area gives N m²/C."},{"q":"The area vector is directed…","o":["Along surface","Normal to surface","Along field always","Toward charge"],"a":1,"e":"The area vector is perpendicular to the surface."},{"q":"If the field is parallel to the surface plane, flux is…","o":["EA","Zero","EA/2","Infinite"],"a":1,"e":"The field is at 90° to the area vector, so flux is zero."},{"q":"For a field normal to the surface, flux magnitude is…","o":["Zero","E/A","EA","A/E"],"a":2,"e":"The field aligns with the area vector, giving EA."},{"q":"E = 200 N/C, A = 0.5 m² and θ = 60° to area vector. Flux is…","o":["100 N m²/C","50 N m²/C","200 N m²/C","25 N m²/C"],"a":1,"e":"\\(\\Phi=200\\times0.5\\times\\cos60^\\circ=50\\) N m²/C."},{"q":"At θ = 0° between field and area vector, flux is…","o":["Maximum positive","Zero","Maximum negative","Undefined"],"a":0,"e":"Cosine is 1, so flux is EA."},{"q":"At θ = 180° between field and area vector, flux is…","o":["Maximum positive","Zero","Maximum negative","EA/2"],"a":2,"e":"Cosine is −1, so flux is −EA."},{"q":"Flux magnitude is half its maximum at angle…","o":["0°","30°","60°","90°"],"a":2,"e":"\\(|\\cos60^\\circ|=1/2\\)."},{"q":"Electric flux is a…","o":["Vector","Scalar","Tensor","Dimensionless quantity"],"a":1,"e":"A dot product is a scalar."},{"q":"Flux sign depends on…","o":["Area alone","Field magnitude alone","Field direction relative to area vector","Source mass"],"a":2,"e":"The dot product may be positive, zero, or negative."},{"q":"E = 500 N/C, A = 2 m² and θ = 90°. Flux is…","o":["1000 N m²/C","500 N m²/C","Zero","−1000 N m²/C"],"a":2,"e":"\\(EA\\cos90^\\circ=0\\)."},{"q":"For a nonuniform field, flux is calculated using…","o":["EA always","\\(\\int\\vec E\\cdot d\\vec A\\)","E/A","\\(\\int E dt\\)"],"a":1,"e":"Integrate the local dot product over the surface."},{"q":"For a closed surface, the area vector points…","o":["Inward","Outward","Tangentially","To origin"],"a":1,"e":"The conventional normal is outward."},{"q":"A positive charge enclosed by a closed surface gives net flux…","o":["Negative","Zero","Positive","Shape-dependent"],"a":2,"e":"Gauss's law gives flux equal to enclosed charge divided by ε₀."},{"q":"A negative charge enclosed by a closed surface gives net flux…","o":["Positive","Negative","Zero always","Infinite"],"a":1,"e":"Negative enclosed charge produces negative net flux."},{"q":"If net enclosed charge is zero, total flux is…","o":["Zero","Positive","Negative","Equal to area"],"a":0,"e":"Gauss's law gives zero net flux."},{"q":"An external charge can cause…","o":["No field on surface","Field present but zero net flux contribution","Nonzero net flux alone","Change in enclosed charge"],"a":1,"e":"Its field lines enter and leave the closed surface equally."},{"q":"A closed surface encloses charge q = 2 × 8.85 × 10⁻¹² C. Take ε₀ = 8.85 × 10⁻¹² C²/(N m²). The net flux is…","o":["2 N m²/C","1 N m²/C","2ε₀ N m²/C","0 N m²/C"],"a":0,"e":"By Gauss’s law, \\(\\Phi=q/\\varepsilon_0=(2\\times8.85\\times10^{-12})/(8.85\\times10^{-12})=2\\) N m²/C."},{"q":"q = 8.85×10⁻¹² C and ε₀ = 8.85×10⁻¹² C²/(N m²). Flux is…","o":["0.1 N m²/C","1 N m²/C","8.85 N m²/C","78.3 N m²/C"],"a":1,"e":"\\(\\Phi=q/\\varepsilon_0=1\\) N m²/C."},{"q":"If enclosed net charge doubles, net flux…","o":["Halves","Doubles","Unchanged","Becomes zero"],"a":1,"e":"Net flux is proportional to enclosed charge."},{"q":"Moving a charge inside a closed surface without crossing it changes net flux how?","o":["It changes","It remains unchanged","It becomes zero","It doubles"],"a":1,"e":"Flux depends on enclosed charge, not its position."},{"q":"Net flux through a closed surface depends on…","o":["Enclosed net charge","Shape only","Area only","Centre location"],"a":0,"e":"Gauss's law links net flux to enclosed net charge."},{"q":"A cube in a uniform field encloses no charge. Its total flux is…","o":["EA","6EA","Zero","Always negative"],"a":2,"e":"Entering and leaving flux cancel."},{"q":"Net flux is the algebraic sum of…","o":["Field magnitudes","Flux through all surface elements","External charges","Surface areas"],"a":1,"e":"Integrate \\(\\vec E\\cdot d\\vec A\\) over the closed surface."},{"q":"If area doubles with field and angle fixed, flux magnitude…","o":["Halves","Doubles","Unchanged","Quadruples"],"a":1,"e":"Flux is proportional to area."},{"q":"If field strength doubles with area and angle fixed, flux magnitude…","o":["Halves","Doubles","Unchanged","Zero"],"a":1,"e":"Flux is proportional to field strength."},{"q":"E = 4 N/C, A = 3 m² and θ = 60°. Flux is…","o":["12 N m²/C","6 N m²/C","3 N m²/C","2 N m²/C"],"a":1,"e":"\\(4\\times3\\times\\cos60^\\circ=6\\) N m²/C."},{"q":"Zero net flux through a closed surface means…","o":["Field zero everywhere","No nearby charge","Net enclosed charge zero","No individual charge enclosed"],"a":2,"e":"Individual charges may be enclosed, but their algebraic sum is zero."},{"q":"The magnitude of electric flux through a flat surface is greatest when the electric field is…","o":["Parallel to the surface","At 45° to the area vector","Parallel or antiparallel to the area vector","Perpendicular to the area vector"],"a":2,"e":"\\(|\\Phi|=EA|\\cos\\theta|\\) is greatest when the field aligns with or opposes the area vector (\\(\\theta=0^\\circ\\) or \\(180^\\circ\\))."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function typesetMath(){if(window.MathJax?.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options'),$('feedback')].filter(Boolean)).catch(()=>{});}}
window.addEventListener('load',typesetMath);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
 typesetMath();
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Electric Flux Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
   if(window.MathJax?.typesetPromise) window.MathJax.typesetPromise([review]).catch(()=>{});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
