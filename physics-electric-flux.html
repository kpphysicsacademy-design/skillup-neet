<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Electric Flux</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>⚡ Electric Flux</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>
const qs=[
['Electric flux through a plane surface in a uniform electric field is given by','Φ=EA sinθ','Φ=EA cosθ','Φ=E/A','Φ=A/E',1,'Electric flux is Φ=E·A=EA cosθ, where θ is the angle between E and the area vector.'],
['The SI unit of electric flux is','N/C','C/N','N·m²/C','C·m²/N',2,'Since E has unit N/C and area has m², flux has unit N·m²/C.'],
['The electric flux through a surface depends on the angle between the electric field and the','surface itself only','area vector (normal)','charge only','perimeter',1,'The angle in Φ=EA cosθ is measured between E and the area vector normal to the surface.'],
['If the electric field is perpendicular to a plane surface, the electric flux through it is','zero','EA','E/A','A/E',1,'When E is perpendicular to the surface, it is parallel to the area vector, so θ=0° and Φ=EA.'],
['If the electric field is parallel to a plane surface, the electric flux through it is','EA','EA/2','zero','E+A',2,'For a field parallel to the surface, θ=90° with the area vector, so Φ=EA cos90°=0.'],
['The electric flux through a closed surface is related to enclosed charge by','Φ=qε₀','Φ=q/ε₀','Φ=ε₀/q','Φ=0 for every charge',1,'Gauss law states that the net flux through a closed surface is Φ=q_enclosed/ε₀.'],
['A closed surface encloses charge q. If its size is increased without changing the enclosed charge, the net electric flux','increases','decreases','remains unchanged','becomes zero',2,'By Gauss law, total flux depends only on enclosed charge, not the size or shape of the closed surface.'],
['The net electric flux through a closed surface containing no net charge is','q/ε₀','ε₀q','zero','infinite',2,'Gauss law gives Φ=q_enclosed/ε₀. If q_enclosed=0, net flux is zero.'],
['A point charge q is placed at the centre of a spherical surface. The total flux through the sphere is','q/(4πε₀r²)','q/ε₀','4πq/ε₀','zero',1,'The total flux through any closed surface enclosing q is q/ε₀.'],
['A uniform electric field E passes normally through a flat area A. The flux is','EA','E/A','A/E','zero',0,'For normal incidence, θ=0°, so Φ=EA.'],
['A uniform field of 200 N/C passes through an area of 0.5 m² with the field normal to the surface. The flux is','50 N·m²/C','100 N·m²/C','200 N·m²/C','400 N·m²/C',1,'Φ=EA=(200)(0.5)=100 N·m²/C.'],
['A field of 100 N/C makes an angle of 60° with the area vector of a 2 m² surface. The flux is','50 N·m²/C','100 N·m²/C','200 N·m²/C','400 N·m²/C',1,'Φ=EA cos60°=(100)(2)(1/2)=100 N·m²/C.'],
['For a closed Gaussian surface, electric flux is positive when the electric field lines are, in the net sense,','entering the surface','leaving the surface','parallel to the surface','absent everywhere',1,'Outward flux is taken as positive; field lines leaving the closed surface contribute positive flux.'],
['The area vector of a closed surface is conventionally directed','inward everywhere','outward everywhere','randomly','toward the nearest charge',1,'For a closed surface, the area vector is conventionally normal and outward.'],
['A charge of 8.85×10⁻¹² C is enclosed by a closed surface. Taking ε₀=8.85×10⁻¹² C²/(N·m²), the net flux is','0.1 N·m²/C','1 N·m²/C','8.85 N·m²/C','78.3 N·m²/C',1,'Φ=q/ε₀=(8.85×10⁻¹²)/(8.85×10⁻¹²)=1 N·m²/C.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
