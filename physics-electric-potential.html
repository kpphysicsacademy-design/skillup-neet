<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Electric Potential</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>⚡ Electric Potential</h1>
<div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="quiz"></div><div class="xp" id="xp"></div>
<button class="next hide" id="next">Next Question →</button>
<div id="result" class="hide"></div>
<a class="back" href="physics-home-fast.html">← Back to Physics Path</a>
</div></div>
<script>
const qs=[
['Electric potential at a point is defined as the','force per unit charge','work done per unit positive test charge in bringing it from infinity','electric field per unit charge','charge per unit work',1,'Electric potential V is work done per unit positive test charge in bringing the charge from infinity to the point.'],
['The SI unit of electric potential is','newton','coulomb','volt','joule',2,'The SI unit of potential is volt (V), equal to joule per coulomb.'],
['The potential due to a point charge q at distance r in vacuum is','kq/r','kq/r²','kr/q','kq²/r',0,'For a point charge, V=kq/r, where k=1/(4πε₀).'],
['Electric potential is a','vector quantity','scalar quantity','tensor quantity','dimensionless quantity',1,'Electric potential is scalar because potentials from multiple charges add algebraically.'],
['The electric potential due to a positive point charge is','always negative','always zero','positive','imaginary',2,'For q>0, V=kq/r is positive relative to the zero potential at infinity.'],
['If the distance from a point charge is doubled, its electric potential becomes','double','half','four times','one-fourth',1,'Since V∝1/r, doubling r makes the potential half.'],
['If the charge producing a potential is doubled while distance remains unchanged, the potential','becomes half','remains unchanged','doubles','becomes four times',2,'Since V∝q, doubling the source charge doubles the potential.'],
['The electric potential difference between two points is related to electric field by','E=Vd','ΔV=Ed for any direction','ΔV=−∫E·dl','ΔV=qE',2,'The potential difference is ΔV=−∫ E·dl along the path.'],
['In a uniform electric field, the potential decreases in the direction','opposite to the electric field','of the electric field','perpendicular to the electric field only','of increasing charge',1,'Because E=−dV/dx, potential decreases in the direction of the electric field.'],
['The work done in moving a charge along an equipotential surface is','maximum','minimum but nonzero','zero','infinite',2,'No potential difference exists along an equipotential surface, so W=qΔV=0.'],
['Equipotential surfaces are always','parallel to electric field lines','perpendicular to electric field lines','parallel to charge motion','inside conductors only',1,'The electric field is normal to an equipotential surface.'],
['The electric potential at a point 2 m from a charge of 2 μC in vacuum, taking k=9×10⁹ N·m²/C², is','9×10³ V','9×10² V','18×10³ V','4.5×10³ V',0,'V=kq/r=(9×10⁹)(2×10⁻⁶)/2=9×10³ V.'],
['Two point charges +2 μC and −2 μC are placed symmetrically about the origin. The electric potential at the midpoint is','positive','negative','zero','infinite',2,'The scalar potentials due to equal and opposite charges at the midpoint cancel.'],
['The electric potential energy of two point charges q₁ and q₂ separated by r is','kq₁q₂/r','kq₁q₂/r²','k(q₁+q₂)/r','q₁q₂/(kr)',0,'For two point charges, U=kq₁q₂/r, taking zero potential energy at infinite separation.'],
['A charge of 3 μC is moved through a potential difference of 20 V. The magnitude of work done is','6 μJ','60 μJ','0.15 μJ','6 mJ',1,'W=qΔV=(3×10⁻⁶)(20)=60×10⁻⁶ J=60 μJ.']
];
let i=0,score=0,answered=false;
const $=x=>document.getElementById(x);
function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}
function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}
function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}
$('next').onclick=next;render();
</script>
</body>
</html>
