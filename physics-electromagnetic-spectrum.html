<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Electromagnetic Spectrum</title><meta name="description" content="SkillUp Physics Electromagnetic Spectrum interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🌈</span><h1>Electromagnetic Spectrum</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["Which electromagnetic wave has the longest wavelength?",["Gamma rays","X-rays","Radio waves","Ultraviolet"],2,"Radio waves occupy the longest-wavelength, lowest-frequency end of the spectrum."],["Which electromagnetic wave has the highest frequency?",["Radio waves","Microwaves","Infrared","Gamma rays"],3,"Gamma rays have the highest frequencies in the electromagnetic spectrum."],["The correct order from lowest to highest frequency is:",["Radio → Microwave → Infrared → Visible → UV → X-ray → Gamma","Gamma → X-ray → UV → Visible → Infrared → Microwave → Radio","Radio → Infrared → Microwave → Visible → UV → Gamma → X-ray","Visible → Radio → Microwave → Gamma → UV → X-ray → Infrared"],0,"Frequency increases from radio waves through microwaves, infrared, visible, ultraviolet, X-rays and gamma rays."],["In vacuum, all electromagnetic waves travel with:",["Different speeds","The same speed c","Zero speed","Speed proportional to wavelength"],1,"All electromagnetic waves travel at c≈3×10⁸ m/s in vacuum."],["Which radiation is commonly used in remote controls?",["Infrared","Gamma rays","X-rays","Ultraviolet"],0,"Infrared radiation is widely used in TV and appliance remote controls."],["Which radiation is used for medical radiography?",["Radio waves","X-rays","Microwaves","Infrared"],1,"X-rays have sufficient photon energy to produce medical radiographic images."],["Which electromagnetic radiation is commonly used for satellite communication?",["Microwaves","Ultraviolet","Gamma rays","Visible light only"],0,"Microwaves can pass through the atmosphere effectively and are widely used in satellite links."],["Which region of the spectrum is detected by the human eye?",["Ultraviolet","Visible light","Infrared","Microwaves"],1,"Human vision responds to the visible portion of the electromagnetic spectrum."],["Ultraviolet radiation has a frequency:",["Lower than visible light","Higher than visible light","Equal to radio waves","Zero"],1,"Ultraviolet lies above visible light in frequency and below X-rays."],["Which electromagnetic radiation is strongly associated with thermal emission from warm objects?",["Infrared","Gamma rays","X-rays","Radio waves only"],0,"Warm objects emit substantial infrared radiation, which is associated with thermal radiation."],["The relation among speed c, frequency f and wavelength λ in vacuum is:",["c=fλ","c=f/λ","c=λ/f","c=f+λ"],0,"For electromagnetic waves in vacuum, c=fλ."],["If frequency increases while wave speed remains constant, wavelength:",["Increases","Decreases","Remains unchanged","Becomes infinite"],1,"From λ=c/f, wavelength decreases when frequency increases at constant speed."],["Which electromagnetic radiation has photon energy closest to visible light but higher than visible?",["Ultraviolet","Radio waves","Microwaves","Infrared"],0,"Ultraviolet has higher frequency and photon energy than visible light."],["Which region generally has the lowest photon energy?",["Gamma rays","X-rays","Radio waves","Ultraviolet"],2,"Photon energy E=hf, so the lowest-frequency radio waves have the lowest photon energies."],["Which statement about the electromagnetic spectrum is correct?",["All regions are mechanical waves","Frequency and photon energy increase together","All regions require a medium","Wavelength always increases with frequency"],1,"Because E=hf, photon energy increases directly with frequency."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
