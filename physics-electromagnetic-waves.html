<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Electromagnetic Waves</title><meta name="description" content="SkillUp Physics Electromagnetic Waves interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">〰️</span><h1>Electromagnetic Waves</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["Electromagnetic waves were predicted theoretically by:",["Maxwell","Newton","Bohr","Rutherford"],0,"Maxwell's equations predict the existence of electromagnetic waves."],["Electromagnetic waves can propagate through:",["Vacuum","Only solids","Only liquids","Only gases"],0,"Electromagnetic waves do not require a material medium and can travel through vacuum."],["The speed of electromagnetic waves in vacuum is approximately:",["3×10⁸ m/s","3×10⁶ m/s","3×10⁴ m/s","3×10¹⁰ m/s"],0,"In vacuum, electromagnetic waves travel at c≈3×10⁸ m/s."],["In an electromagnetic wave, the electric and magnetic fields are:",["Parallel to each other","Perpendicular to each other and to the direction of propagation","Always zero","Opposite and parallel to propagation"],1,"The electric field, magnetic field, and propagation direction are mutually perpendicular."],["The relation between electric-field amplitude E₀ and magnetic-field amplitude B₀ in vacuum is:",["E₀=cB₀","E₀=B₀/c","E₀=c/B₀","E₀=B₀"],0,"For an electromagnetic wave in vacuum, E₀=cB₀."],["Which electromagnetic radiation has the shortest wavelength?",["Radio waves","Microwaves","Visible light","Gamma rays"],3,"Gamma rays occupy the shortest-wavelength, highest-frequency end of the electromagnetic spectrum."],["Which electromagnetic radiation has the lowest frequency?",["Gamma rays","X-rays","Ultraviolet","Radio waves"],3,"Radio waves have the lowest frequencies in the electromagnetic spectrum."],["In vacuum, if the frequency of an electromagnetic wave increases, its wavelength:",["Increases","Decreases","Remains fixed","Becomes zero"],1,"Since c=fλ in vacuum, wavelength decreases when frequency increases."],["The energy of a photon is given by:",["E=hf","E=h/f","E=f/h","E=mc"],0,"Photon energy is E=hf, where h is Planck's constant."],["Which property is common to all electromagnetic waves in vacuum?",["Same frequency","Same wavelength","Same speed","Same energy"],2,"All electromagnetic waves travel at the same speed c in vacuum."],["Visible light lies approximately in the wavelength range:",["400–700 nm","1–10 m","10–100 m","1–10 mm"],0,"Visible light is commonly approximated as about 400–700 nm in wavelength."],["A radio antenna emits electromagnetic radiation primarily because:",["Accelerating charges produce changing electric and magnetic fields","Stationary charges disappear","Gravity creates photons","Resistance becomes zero"],0,"Accelerating charges can generate electromagnetic radiation."],["The direction of propagation of an electromagnetic wave is along:",["E×B","E+B","E−B","E/B"],0,"The propagation direction is along the vector E×B, the Poynting-vector direction."],["If an electromagnetic wave has frequency 6×10¹⁴ Hz in vacuum, its wavelength is approximately:",["5×10⁻⁷ m","5×10⁻⁵ m","5×10⁻³ m","5 m"],0,"Using λ=c/f=(3×10⁸)/(6×10¹⁴)=5×10⁻⁷ m."],["The momentum carried by electromagnetic radiation is associated with its:",["Energy","Rest mass only","Temperature only","Charge"],0,"Electromagnetic radiation carries momentum related to its energy; for a photon p=E/c."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$('quiz').hidden=true;$('result').hidden=false;$('score').textContent=`Score: ${score} / ${qs.length}`;$('earned').textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$('result').hidden=true;$('quiz').hidden=false;render()}$('next').onclick=next;$('restart').onclick=restart;render();</script></body></html>
