<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Electrostatic Shielding</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>⚡ Electrostatic Shielding</h1>
<div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="quiz"></div><div class="xp" id="xp"></div>
<button class="next hide" id="next">Next Question →</button>
<div id="result" class="hide"></div>
<a class="back" href="physics-home-fast.html">← Back to Physics Path</a>
</div></div>
<script>
const qs=[
['Electrostatic shielding is the process of protecting a region from','gravitational fields','external electrostatic fields','sound waves','thermal radiation',1,'A conducting enclosure can protect an enclosed region from external electrostatic fields.'],
['The basic principle behind electrostatic shielding is that in electrostatic equilibrium the electric field inside a conductor is','zero','maximum','infinite','always non-uniform',0,'Free charges redistribute until the net electric field inside the conducting material is zero.'],
['A charge-free cavity completely enclosed by a conductor is shielded from external electrostatic fields. The electric field in the cavity is','zero','infinite','equal to the outside field','always 1 N/C',0,'For a charge-free cavity in an electrostatic conductor, the electric field inside the cavity is zero, independent of the external electrostatic field.'],
['When an external electric field is applied to a conductor, its free charges','remain fixed','redistribute on the surface','disappear','become neutral particles',1,'Mobile charges in a conductor redistribute until electrostatic equilibrium is reached.'],
['A Faraday cage is an example of','electrostatic shielding','magnetic induction only','radioactive shielding','thermal insulation',0,'A conducting enclosure used to reduce the effect of external electric fields is called a Faraday cage or shield.'],
['For a closed conducting shell in electrostatic equilibrium, excess charge resides','only at the centre','on its surfaces','uniformly throughout its volume','only inside the cavity',1,'Excess electrostatic charge resides on conductor surfaces in equilibrium.'],
['A sensitive electrostatic instrument can be protected from external electric fields by placing it inside','a wooden box only','a conducting enclosure','an open plastic sheet','a vacuum pump',1,'A closed conducting enclosure provides electrostatic shielding.'],
['If a charge is placed inside a cavity of a neutral conductor, the induced charge on the inner cavity surface is','equal to +q','equal to −q','always zero','equal to +2q',1,'Gauss’s law requires the induced charge on the inner surface to be −q for an enclosed charge q.'],
['If a neutral isolated conducting shell contains a charge +q inside its cavity, the total induced charge on the outer surface is','−q','+q','zero always','+2q',1,'The neutral shell has −q on the inner surface, so charge conservation requires +q on the outer surface.'],
['Grounding a conducting shield provides a path for','mass to enter the conductor','charge to flow to or from Earth','light to enter the cavity','sound to escape',1,'Grounding connects the conductor electrically to Earth, allowing charge exchange with the Earth.'],
['Which material is generally used for effective electrostatic shielding because it has mobile charge carriers?','Good conductor','Perfect insulator','Dry glass only','Rubber only',0,'Conductors have mobile charges that can redistribute and cancel the electrostatic field in equilibrium.'],
['The electric field just inside the material of an electrostatic conductor in equilibrium is','zero','σ/ε₀ always','infinite','equal to the external field',0,'Electrostatic equilibrium requires E=0 within the conducting material.'],
['A metal box surrounding a sensitive circuit can reduce the effect of external static electric fields because','the metal absorbs all charge permanently','charges redistribute on the conductor to cancel the field inside','the circuit creates gravity','the box has no electrons',1,'Surface charge redistribution produces a field that cancels the external electrostatic field in the shielded region.'],
['Which statement about an empty cavity inside a conductor is correct?','Its field depends directly on the outside charge','Its electrostatic field is zero','Its potential must be zero','It must contain charge',1,'A charge-free cavity in an electrostatic conductor is shielded from external electrostatic influence, so E=0.'],
['Electrostatic shielding is especially useful for protecting','sensitive electrical and measuring instruments','objects from gravity','objects from all forms of radiation','objects from mechanical vibration only',0,'Conducting shields are used to reduce external electrostatic interference affecting sensitive instruments and circuits.']
];
let i=0,score=0,answered=false;
const $=x=>document.getElementById(x);
function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}
function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}
function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}
$('next').onclick=next;render();
</script>
</body>
</html>
