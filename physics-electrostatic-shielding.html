<script>
(function(){

let index=0, chosen=null, locked=false, score=0, streak=0;
const questions = [{"q":"Electrostatic shielding protects a region mainly from…","o":["External electrostatic fields","Gravity","All sound waves","All magnetic fields"],"a":0,"e":"A conducting enclosure redistributes its free charges to oppose external electrostatic fields."},{"q":"In electrostatic equilibrium, the electric field within the conducting material is…","o":["Infinite","Zero","Always equal to the outside field","Always changing"],"a":1,"e":"Free charges move until the net electric field inside the conductor is zero."},{"q":"A closed conducting enclosure used for shielding is commonly called a…","o":["Capillary tube","Faraday cage","Prism","Calorimeter"],"a":1,"e":"A Faraday cage is a conducting enclosure that reduces external electric-field influence."},{"q":"When an external electric field is applied to a conductor, its free charges…","o":["Redistribute","Vanish","Stop existing","Turn into neutrons"],"a":0,"e":"Charges move and redistribute on the conductor's surfaces until electrostatic equilibrium is reached."},{"q":"For a charge-free cavity completely enclosed by a conductor in electrostatic equilibrium, the electric field in the cavity due only to external sources is…","o":["Zero","Infinite","Always 1 N/C","Equal to the external field"],"a":0,"e":"A closed conductor shields a charge-free cavity from external electrostatic fields."},{"q":"Excess charge on a conductor in electrostatic equilibrium resides on its…","o":["Surfaces","Geometric centre only","Entire volume uniformly in every case","Nuclei only"],"a":0,"e":"In electrostatic equilibrium, excess charge resides on the conductor's surface or surfaces."},{"q":"Which object is best suited to shield a sensitive circuit from static electric fields?","o":["A closed metal enclosure","A paper bag","An open wooden frame","A cotton cloth"],"a":0,"e":"A conducting enclosure allows charges to redistribute and reduce the field within the protected region."},{"q":"The key requirement for electrostatic shielding is generally a…","o":["Conducting enclosure","Transparent material","Permanent magnet","High-temperature surface"],"a":0,"e":"Conductors contain mobile charges that respond to external electrostatic fields."},{"q":"A charge +q is placed inside a cavity of a conducting shell. The induced charge on the inner cavity surface is…","o":["+q","−q","Zero in all cases","+2q"],"a":1,"e":"The electric field within the conductor must be zero; Gauss's law gives induced inner charge −q."},{"q":"A neutral isolated conducting shell contains a charge +q in its cavity. The net charge induced on the outer surface is…","o":["−q","+q","Zero always","+2q"],"a":1,"e":"The inner surface carries −q, so neutrality of the shell requires +q on its outer surface."},{"q":"Grounding a conducting shield connects it electrically to…","o":["Earth","A vacuum only","An insulator","A light source"],"a":0,"e":"Grounding allows charge to flow between the conductor and Earth."},{"q":"Why does a metal car body provide some protection against lightning electric effects?","o":["Charges redistribute over the outer conducting body","Metal absorbs all energy without current","The tyres cancel every electric field","The cabin becomes a perfect vacuum"],"a":0,"e":"The conducting body tends to carry charge and current on its exterior, helping shield the interior; lightning safety still depends on conditions."},{"q":"A person inside a closed metal enclosure is protected from an external static electric field because…","o":["The field inside the enclosure is greatly reduced ideally to zero","The metal destroys electric charge","The person has no atoms","The field becomes gravitational"],"a":0,"e":"In electrostatic equilibrium, charge redistribution cancels the external field within the conducting shield's interior."},{"q":"Which statement about the electric field inside conducting material at electrostatic equilibrium is correct?","o":["It is zero","It is always parallel to the surface","It depends only on colour","It is necessarily infinite"],"a":0,"e":"A nonzero internal field would drive free charges, so equilibrium requires E = 0 in the conductor."},{"q":"At electrostatic equilibrium, the electric field immediately outside a conductor's surface has no…","o":["Tangential component","Normal component","Magnitude","Direction"],"a":0,"e":"The field at the surface is perpendicular to it; a tangential component would move surface charges."},{"q":"An ideal closed conducting shell shields its interior from an external electrostatic field even if the field changes direction, because…","o":["Surface charges rearrange to maintain equilibrium","The shell blocks all matter","The field is converted into sound","The shell becomes an insulator"],"a":0,"e":"The induced surface-charge distribution responds to the applied field, cancelling the field inside under electrostatic conditions."},{"q":"Which is a practical use of electrostatic shielding?","o":["Reducing static electrical interference in instruments","Increasing gravitational force","Stopping every type of radiation","Preventing all heat transfer"],"a":0,"e":"Conducting enclosures are used to reduce unwanted electrostatic interference in sensitive equipment."},{"q":"A hollow conductor is placed in an external electrostatic field. If there is no charge inside its cavity, the field inside the cavity is ideally…","o":["Zero","Equal to the outside field","Infinite","Always uniform and nonzero"],"a":0,"e":"A charge-free cavity enclosed by a conductor is electrostatically shielded from external fields."},{"q":"The phenomenon of electrostatic shielding is explained primarily by…","o":["Redistribution of mobile charges","Nuclear fusion","Thermal expansion","Diffraction of light"],"a":0,"e":"Mobile electrons and other charge carriers rearrange to establish electrostatic equilibrium."},{"q":"Which statement about a conducting shield with an opening is most accurate?","o":["Shielding may be less effective near the opening","It always gives perfect shielding everywhere","An opening improves shielding without limit","Conductivity no longer matters"],"a":0,"e":"Openings can allow fields to penetrate, especially near the aperture; shielding effectiveness depends on geometry and field conditions."},{"q":"A metal enclosure is most effective as an electrostatic shield when it is…","o":["Conducting and forms a closed enclosure","Made of dry paper","Broken into isolated pieces","Only painted with metal-coloured paint"],"a":0,"e":"A continuous conducting enclosure gives the charges a path to redistribute around the protected region."},{"q":"If the external electric field is switched on around a conducting shield, the charges move until…","o":["Electrostatic equilibrium is established","All electrons leave the metal","The conductor melts","The field inside the metal becomes infinite"],"a":0,"e":"Charge motion stops macroscopically once the conductor reaches electrostatic equilibrium."},{"q":"The electric potential throughout a connected conductor in electrostatic equilibrium is…","o":["Constant","Different at every point","Always zero","Infinite"],"a":0,"e":"Because the electric field inside the conductor is zero, the conductor is an equipotential body."},{"q":"A conducting shield is placed between an external charged object and a sensitive device. The main shielding mechanism is…","o":["Induced surface charge creates an opposing field","The device absorbs the charge","The shield converts charge to mass","The field is blocked by its colour"],"a":0,"e":"The induced charge distribution produces an electric field that cancels the external field in the shielded region."},{"q":"Which material is generally unsuitable for electrostatic shielding by charge redistribution?","o":["A good electrical insulator","Copper","Aluminium","Steel"],"a":0,"e":"Insulators lack freely mobile charge carriers comparable to conductors, so they do not provide the same shielding mechanism."},{"q":"A neutral conducting shell is placed in a uniform external electric field without touching any charged object. Its net charge remains…","o":["Zero, although charges redistribute","Positive","Negative","Infinite"],"a":0,"e":"Induction separates charge across the shell, but the shell's total charge remains zero if it is isolated and uncharged."},{"q":"For a conductor in electrostatic equilibrium, the electric field at its surface is directed…","o":["Perpendicular to the surface","Along the surface","At every possible angle","Always vertically upward"],"a":0,"e":"The tangential field component must vanish at equilibrium, leaving the field normal to the surface."},{"q":"Why is a closed metal box generally better than a single flat metal sheet for shielding a region?","o":["It encloses the region and reduces field penetration from multiple directions","It has no electrons","It creates a stronger external field by design","It is always electrically neutral at every point"],"a":0,"e":"An enclosure surrounds the protected space; a single sheet cannot shield from fields arriving around its edges."},{"q":"Does electrostatic shielding guarantee protection against every kind of electromagnetic radiation?","o":["No; effectiveness depends on frequency, enclosure and openings","Yes, all radiation is blocked perfectly","Yes, because metal stops gravity","No, because conductors cannot redistribute charge"],"a":0,"e":"Electrostatic shielding concerns static electric fields; high-frequency electromagnetic waves require separate consideration of material, thickness and enclosure design."},{"q":"A sensitive instrument is placed inside a properly closed conducting shell. An external stationary charge is moved outside. Ideally, the electric field in the charge-free cavity…","o":["Remains zero","Must equal the field outside","Must become infinite","Depends on the instrument's colour"],"a":0,"e":"For a charge-free cavity enclosed by a conductor in electrostatic equilibrium, external static charges do not create an electric field inside."}];

   if(window.MathJax?.typesetPromise) window.MathJax.typesetPromise([review]).catch(()=>{});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);

});
