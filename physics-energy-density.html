.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}

<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>

<section class="hero"><h1>🔋 Energy Density</h1><p class="muted">Practise charge storage, capacitance, parallel-plate energy-density concepts, dielectrics, combinations and stored energy.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>

<script>
(function(){
'use strict';
let index=0, chosen=null, locked=false, score=0, streak=0;
const questions = [{"q":"Electric-field energy density is the energy stored per unit…","o":["charge","volume","area","electric field"],"a":1,"e":"Energy density is field energy divided by the volume occupied by the field."},{"q":"In vacuum, electric-field energy density is…","o":["ε₀E²","½ε₀E²","E²/(2ε₀)","2ε₀E"],"a":1,"e":"For a vacuum electric field, u = ½ε₀E²."},{"q":"The SI unit of energy density is…","o":["J","J m⁻²","J m⁻³","W m⁻¹"],"a":2,"e":"Energy per volume has units joules per cubic metre (J/m³)."},{"q":"The dimensional formula of energy density is…","o":["[ML⁻¹T⁻²]","[ML²T⁻²]","[ML⁻³T⁻²]","[M⁰L⁰T⁰]"],"a":0,"e":"Energy/volume = [ML²T⁻²]/[L³] = [ML⁻¹T⁻²]."},{"q":"For a linear dielectric with permittivity ε and electric field E, the energy density is…","o":["½εE²","εE²","½E²/ε","2εE"],"a":0,"e":"For a linear medium, u = ½εE²."},{"q":"If the electric field doubles in the same medium, energy density becomes…","o":["2u","u/2","4u","u/4"],"a":2,"e":"Energy density is proportional to E², so doubling E gives four times the density."},{"q":"If electric field magnitude is reduced to one-third, energy density becomes…","o":["u/3","u/9","3u","9u"],"a":1,"e":"Since u ∝ E², reducing E to E/3 reduces u to u/9."},{"q":"The total energy U in a uniform field filling volume V is…","o":["u/V","u+V","uV","V/u"],"a":2,"e":"Multiplying energy per unit volume by volume gives total energy: U = uV."},{"q":"The approximate field volume between parallel plates of area A and separation d is…","o":["A+d","Ad","A/d","d/A"],"a":1,"e":"Ignoring edge effects, the space between the plates has volume Ad."},{"q":"For a vacuum field E = 1.0×10⁶ V/m, take ε₀ = 8.85×10⁻¹² F/m. The energy density is…","o":["4.43 J/m³","8.85 J/m³","17.7 J/m³","0.443 J/m³"],"a":0,"e":"u = ½ε₀E² = ½×8.85×10⁻¹²×10¹² = 4.425 J/m³."},{"q":"For E = 2×10⁶ V/m in vacuum, the energy density is approximately…","o":["8.85 J/m³","17.7 J/m³","35.4 J/m³","70.8 J/m³"],"a":1,"e":"u = ½×8.85×10⁻¹²×(2×10⁶)² ≈ 17.7 J/m³."},{"q":"If u = 10 J/m³ uniformly fills 0.2 m³, total energy is…","o":["2 J","10.2 J","50 J","0.02 J"],"a":0,"e":"U = uV = 10×0.2 = 2 J."},{"q":"For a linear dielectric with relative permittivity K, ε equals…","o":["ε₀/K","Kε₀","ε₀+K","K/ε₀"],"a":1,"e":"Relative permittivity K = ε/ε₀, so ε = Kε₀."},{"q":"At fixed electric field E, inserting a dielectric with permittivity Kε₀ changes u from vacuum value to…","o":["u/K","Ku","K²u","u"],"a":1,"e":"At fixed E, u = ½εE² = K(½ε₀E²), hence it is K times the vacuum value."},{"q":"In the expression u = ½ε₀E², ε₀ represents…","o":["magnetic permeability","vacuum permittivity","relative permittivity","electric susceptibility"],"a":1,"e":"ε₀ is the permittivity of free space."},{"q":"Which quantity directly determines electric-field energy density in a fixed linear medium?","o":["Plate area only","Electric field magnitude","Capacitor mass","Wire length"],"a":1,"e":"For a linear medium, u = ½εE²; at fixed ε, the density depends on E²."},{"q":"If the electric field is zero in a region, its electrostatic field energy density in vacuum is…","o":["infinite","ε₀/2","zero","dependent on volume"],"a":2,"e":"Substituting E = 0 into u = ½ε₀E² gives zero."},{"q":"A capacitor has field energy 6 mJ uniformly distributed through 3×10⁻⁴ m³. Its energy density is…","o":["2 J/m³","20 J/m³","200 J/m³","2000 J/m³"],"a":1,"e":"u = U/V = 6×10⁻³/(3×10⁻⁴) = 20 J/m³."},{"q":"For a parallel-plate capacitor in vacuum, E = V/d. Substitution into u = ½ε₀E² gives…","o":["½ε₀V²/d²","½ε₀Vd","ε₀d²/(2V²)","2ε₀V/d"],"a":0,"e":"Using E = V/d gives u = ½ε₀(V/d)²."},{"q":"If the field energy density is quadrupled in the same medium, the field magnitude becomes…","o":["four times","twice","half","one-quarter"],"a":1,"e":"Since u ∝ E², a fourfold increase in u means E increases by √4 = 2."},{"q":"For a vacuum electric field, energy density is proportional to…","o":["E","E²","1/E","√E"],"a":1,"e":"The relation u = ½ε₀E² shows quadratic dependence on field magnitude."},{"q":"Which is equivalent to 1 J/m³ in SI base units?","o":["1 kg m⁻¹ s⁻²","1 kg m s⁻²","1 kg m² s⁻²","1 kg m⁻³ s⁻²"],"a":0,"e":"J/m³ = (kg m² s⁻²)/m³ = kg m⁻¹ s⁻²."},{"q":"The electric field energy of a capacitor is physically associated with…","o":["only the battery","the electric field in the space around/between conductors","only the metal's rest mass","the connecting switch"],"a":1,"e":"In the field description, electrostatic energy is stored in the electric field."},{"q":"For fixed volume, if energy density changes from 5 J/m³ to 15 J/m³, stored energy…","o":["becomes one-third","triples","increases by 5 times","does not change"],"a":1,"e":"U = uV for fixed V, so tripling u triples total energy."},{"q":"A uniform vacuum field of 3×10⁶ V/m has energy density approximately… (ε₀ = 8.85×10⁻¹² F/m)","o":["13.3 J/m³","39.8 J/m³","79.7 J/m³","119 J/m³"],"a":1,"e":"u = ½×8.85×10⁻¹²×9×10¹² ≈ 39.8 J/m³."},{"q":"If permittivity and field both double, energy density changes by a factor of…","o":["2","4","6","8"],"a":3,"e":"u = ½εE²; doubling ε gives ×2 and doubling E gives ×4, overall ×8."},{"q":"The energy density of an electric field has the same dimensions as…","o":["pressure","charge","potential difference","capacitance"],"a":0,"e":"Both energy density and pressure have dimensions [ML⁻¹T⁻²]."},{"q":"For u = ½ε₀E², if u = 4.425 J/m³ and ε₀ = 8.85×10⁻¹² F/m, E is…","o":["5×10⁵ V/m","1×10⁶ V/m","2×10⁶ V/m","4×10⁶ V/m"],"a":1,"e":"E² = 2u/ε₀ = 8.85/(8.85×10⁻¹²) = 10¹², so E = 10⁶ V/m."},{"q":"Energy density is a scalar because it describes…","o":["energy per unit volume","the direction of electric field","charge flow rate","force direction"],"a":0,"e":"Energy per unit volume has magnitude but no direction, so it is a scalar."},{"q":"Which formula gives electric-field energy density in a linear medium?","o":["u = εE","u = ½εE²","u = ½E/ε","u = ε/E²"],"a":1,"e":"The correct linear-medium expression is u = ½εE²."}];
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function typesetMath(){if(window.MathJax?.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options'),$('feedback')].filter(Boolean)).catch(()=>{});}}
window.addEventListener('load',typesetMath);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
 typesetMath();
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Energy Density Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
   if(window.MathJax?.typesetPromise) window.MathJax.typesetPromise([review]).catch(()=>{});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
