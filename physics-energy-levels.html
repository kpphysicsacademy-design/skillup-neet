<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Energy Levels</title><meta name="description" content="SkillUp Physics Energy Levels interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">📊</span><h1>Energy Levels</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["In the hydrogen atom, allowed electron energies are:",["Quantised or discrete","Completely continuous","Always positive","Independent of quantum number"],0,"The Bohr model assigns electrons only to discrete stationary energy levels."] ,["The ground state of hydrogen corresponds to:",["n=1","n=0","n=2","n=∞"],0,"The lowest allowed energy state is the ground state, n=1."] ,["The ground-state energy of hydrogen is:",["−13.6 eV","+13.6 eV","−3.4 eV","0 eV"],0,"For hydrogen, E1=−13.6 eV relative to the ionisation limit at 0 eV."] ,["The energy of the nth hydrogen level is:",["En=−13.6/n² eV","En=−13.6n² eV","En=13.6/n eV","En=13.6n eV"],0,"For hydrogen in the Bohr model, En=−13.6/n² eV."] ,["The energy of the first excited state of hydrogen (n=2) is:",["−3.4 eV","−13.6 eV","−1.51 eV","0 eV"],0,"Putting n=2 into En=−13.6/n² gives −3.4 eV."] ,["The energy required to excite hydrogen from n=1 to n=2 is:",["10.2 eV","3.4 eV","13.6 eV","1.51 eV"],0,"The required energy is E2−E1=−3.4−(−13.6)=10.2 eV."] ,["As the principal quantum number n increases, hydrogen energy levels:",["Become closer together","Become equally spaced","Move to more negative energies","Disappear"],0,"The levels converge toward 0 eV as n increases."] ,["At n=∞, the energy of the hydrogen electron is:",["0 eV","−13.6 eV","−3.4 eV","13.6 eV"],0,"n=∞ represents the ionisation limit, E=0 eV."] ,["Ionisation energy of ground-state hydrogen is:",["13.6 eV","10.2 eV","3.4 eV","1.51 eV"],0,"13.6 eV raises the electron from n=1 to the ionisation limit."] ,["When an electron moves from a lower level to a higher level, it:",["Absorbs energy","Emits energy","Loses its charge","Has zero kinetic energy"],0,"An upward transition requires absorption of energy equal to the level difference."] ,["When an electron moves from a higher level to a lower level, it:",["Emits a photon","Absorbs a photon","Becomes a proton","Stops moving"],0,"A downward transition releases the energy difference as a photon."] ,["For a transition between two levels, photon energy is related to the level difference by:",["hν=|Ei−Ef|","hν=Ei+Ef","hν=EiEf","hν=0"],0,"The magnitude of the energy difference is carried by the photon: ΔE=hν."] ,["If a hydrogen atom absorbs 10.2 eV from its ground state, the electron reaches:",["n=2","n=3","n=∞","n=1"],0,"The n=1 to n=2 energy difference is 10.2 eV."] ,["The energy needed to ionise hydrogen from n=2 is:",["3.4 eV","13.6 eV","10.2 eV","1.51 eV"],0,"From n=2, the energy rises from −3.4 eV to 0 eV, requiring 3.4 eV."] ,["Energy-level diagrams are evidence that atoms can exchange energy:",["In definite quantised amounts","Only continuously","Only as mechanical energy","Without changing state"],0,"Discrete atomic levels mean transitions involve definite energy differences, producing characteristic photons."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
