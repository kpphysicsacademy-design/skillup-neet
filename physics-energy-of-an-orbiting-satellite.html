<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🛰️ Energy of an Orbiting Satellite</h1><p class="muted">Practice satellite kinetic energy, gravitational potential energy, total energy, and energy changes between orbits.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"For mass m in a circular orbit of radius r around mass M, orbital speed is:",o:["GM/r","√(GMr)","GM/r²","√(GM/r)"],a:3,e:"Set gravitational force equal to centripetal force to obtain v = √(GM/r)."},
{q:"The kinetic energy of a satellite in a circular orbit is:",o:["−GMm/r","GMm/(2r)","GMm/r","−GMm/(2r)"],a:1,e:"K = ½mv² = GMm/(2r)."},
{q:"With potential energy zero at infinity, gravitational potential energy at radius r is:",o:["GMm/(2r)","GMm/r","−GMm/(2r)","−GMm/r"],a:3,e:"Gravitational potential energy is U = −GMm/r."},
{q:"Total mechanical energy in a circular orbit is:",o:["−GMm/r","−GMm/(2r)","0","GMm/(2r)"],a:1,e:"E = K + U = −GMm/(2r)."},
{q:"A satellite in a bound gravitational orbit has total energy that is:",o:["negative","infinite","positive","zero in every orbit"],a:0,e:"A bound orbit has negative total mechanical energy when zero is defined at infinity."},
{q:"If circular orbital radius doubles, kinetic energy becomes:",o:["double","half","four times","one-fourth"],a:1,e:"K = GMm/(2r), so doubling r halves kinetic energy."},
{q:"If orbital radius doubles, the magnitude of gravitational potential energy becomes:",o:["unchanged","double","half","four times"],a:2,e:"|U| = GMm/r, so its magnitude is halved."},
{q:"Moving a satellite to a higher circular orbit makes its total energy:",o:["less negative","exactly zero","unchanged","more negative"],a:0,e:"E = −GMm/(2r); increasing r makes total energy less negative."},
{q:"For a circular orbit, the magnitude of potential energy is:",o:["twice the kinetic energy","four times the kinetic energy","equal to kinetic energy","half the kinetic energy"],a:0,e:"|U| = GMm/r and K = GMm/(2r), hence |U| = 2K."},
{q:"To transfer a satellite from a lower circular orbit to a higher one, net orbital energy must be:",o:["decreased","increased","unchanged","converted entirely to heat"],a:1,e:"A higher circular orbit has a greater (less negative) total energy."},
{q:"As distance from a planet tends to infinity, gravitational potential energy tends to:",o:["a fixed positive value","positive infinity","zero from below","negative infinity"],a:2,e:"U = −GMm/r approaches zero from below as r grows."},
{q:"Circular orbital speed varies with orbital radius as:",o:["r²","r⁻¹ᐟ²","r⁻²","r"],a:1,e:"v = √(GM/r), so v is proportional to 1/√r."},
{q:"For a circular orbit, total energy in terms of orbital speed v is:",o:["−mv²","+mv²","+½mv²","−½mv²"],a:3,e:"Since U = −2K, total energy E = K + U = −K = −½mv²."},
{q:"A satellite moves from a lower to a higher circular orbit. Its orbital speed generally:",o:["increases","decreases","remains the same","becomes zero"],a:1,e:"Circular orbital speed decreases with increasing orbital radius."},
{q:"Which statement is correct for a circular satellite orbit?",o:["Total energy equals kinetic energy","Potential energy is positive","Kinetic energy is negative","Total energy is negative"],a:3,e:"Kinetic energy is positive, while potential and total energy are negative."},
{q:"If satellite mass doubles at the same circular orbit, its kinetic energy:",o:["doubles","stays unchanged","becomes negative","halves"],a:0,e:"K = GMm/(2r) is proportional to satellite mass."},
{q:"If satellite mass doubles at the same radius, its total mechanical energy:",o:["becomes positive","becomes zero","does not change","doubles in magnitude"],a:3,e:"E = −GMm/(2r), so energy is proportional to satellite mass."},
{q:"For a circular orbit, the relation between total energy E and potential energy U is:",o:["E = 2U","E = U/2","E = −U","E = 0"],a:1,e:"Since K = −U/2, E = K + U = U/2."},
{q:"For a circular orbit, total energy E compared with kinetic energy K is:",o:["E = 0","E = K","E = 2K","E = −K"],a:3,e:"The virial relation for a circular gravitational orbit gives E = −K."},
{q:"A satellite's gravitational potential energy is negative because:",o:["the zero is defined at infinity and gravity is attractive","the satellite has negative mass","its kinetic energy is negative","gravity repels the satellite"],a:0,e:"With U = 0 at infinity, an attractive gravitational interaction has negative potential energy at finite distance."},
{q:"If circular orbital radius becomes four times as large, kinetic energy becomes:",o:["one-fourth","twice","four times","one-half"],a:0,e:"K varies as 1/r, so quadrupling r reduces K to one-fourth."},
{q:"If circular orbital radius becomes four times as large, total energy becomes:",o:["four times as negative","one-half as negative","one-fourth as negative","positive"],a:2,e:"E = −GMm/(2r), so its magnitude falls to one-fourth."},
{q:"The work needed to move a satellite between two ideal circular orbits is related to the change in:",o:["radio frequency","satellite colour","total mechanical energy","planet's mass only"],a:2,e:"The net energy supplied changes the satellite's total orbital energy."},
{q:"At the same orbital radius, which satellite has greater kinetic energy?",o:["The more massive satellite","Both have zero kinetic energy","Mass has no effect on kinetic energy","The less massive satellite"],a:0,e:"At fixed radius, K = GMm/(2r) is proportional to satellite mass."},
{q:"For an elliptical bound orbit, the total orbital energy depends on:",o:["the satellite's colour","the direction it faces","the satellite's instantaneous speed alone","the semi-major axis"],a:3,e:"For a Keplerian ellipse, E = −GMm/(2a), where a is the semi-major axis."},
{q:"At perigee in an elliptical Earth orbit, satellite speed is generally:",o:["less than at apogee","greater than at apogee","always zero","exactly equal to escape speed"],a:1,e:"A satellite moves faster when closer to Earth in an elliptical orbit."},
{q:"For a satellite in a circular orbit, if its speed is v, its kinetic energy is:",o:["mv","mv²","½mv²","−½mv²"],a:2,e:"Kinetic energy is defined as K = ½mv²."},
{q:"A satellite is placed in a higher orbit and its total energy increases. This means its energy becomes:",o:["less negative","more negative and larger in magnitude","necessarily positive","more negative"],a:0,e:"Bound circular orbits have negative energy; higher orbits have values closer to zero."},
{q:"If the orbital radius tends to infinity for a bound circular-orbit energy expression, E tends to:",o:["negative infinity","a fixed negative value","positive infinity","zero from below"],a:3,e:"E = −GMm/(2r) approaches zero from below as r increases."},
{q:"Which equation summarizes the total energy of a satellite in a circular orbit?",o:["E = GMm/r","E = −GMm/(2r)","E = +GMm/(2r)","E = −GMm/r²"],a:1,e:"The circular-orbit total mechanical energy is −GMm/(2r)."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Energy of an Orbiting Satellite Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
