<section class="hero"><h1>⚡ Energy Stored in a Capacitor</h1><p class="muted">Practise charge storage, capacitance, parallel-plate capacitors, dielectrics, combinations and stored energy.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>

<script>
(function(){
'use strict';
let index=0, chosen=null, locked=false, score=0, streak=0;
const questions = [{"q":"The electrostatic energy stored in a capacitor is…","o":["QV","½QV","2QV","Q/V"],"a":1,"e":"The stored energy is U = ½QV = ½CV² = Q²/(2C)."},{"q":"Which expression gives capacitor energy in terms of capacitance C and voltage V?","o":["CV²","½CV²","2CV²","½C/V²"],"a":1,"e":"Using Q = CV in U = ½QV gives U = ½CV²."},{"q":"A 4 μF capacitor is charged to 10 V. Its stored energy is…","o":["20 μJ","100 μJ","200 μJ","400 μJ"],"a":2,"e":"U = ½CV² = ½ × 4 μF × 100 = 200 μJ."},{"q":"A capacitor stores charge 60 μC at 12 V. How much energy is stored?","o":["180 μJ","360 μJ","720 μJ","60 μJ"],"a":1,"e":"U = ½QV = ½ × 60 μC × 12 V = 360 μJ."},{"q":"The energy stored in a capacitor is stored mainly in its…","o":["Metal plates as heat","Electric field","Battery chemistry only","Connecting wires"],"a":1,"e":"The energy is associated with the electric field between and around the capacitor conductors."},{"q":"The energy density of an electric field in vacuum is…","o":["ε₀E²","½ε₀E²","2ε₀E","E²/(2ε₀)"],"a":1,"e":"In vacuum, u = ½ε₀E²."},{"q":"For a parallel-plate capacitor with gap volume Ad, energy density is…","o":["UAd","U/(Ad)","Ad/U","U/A"],"a":1,"e":"Energy density is energy per unit volume, u = U/(Ad)."},{"q":"A 2 μF capacitor is charged to 20 V. Its stored energy is…","o":["40 μJ","200 μJ","400 μJ","800 μJ"],"a":2,"e":"U = ½ × 2 μF × (20 V)² = 400 μJ."},{"q":"If the voltage across a fixed capacitor doubles, its stored energy becomes…","o":["2 times","4 times","Half","Unchanged"],"a":1,"e":"At fixed C, U = ½CV², so doubling V quadruples U."},{"q":"If capacitance doubles while voltage remains fixed, stored energy becomes…","o":["Half","Double","Four times","Unchanged"],"a":1,"e":"At fixed V, U is proportional to C."},{"q":"If charge doubles while capacitance remains fixed, stored energy becomes…","o":["2 times","4 times","Half","Unchanged"],"a":1,"e":"At fixed C, U = Q²/(2C), so doubling Q quadruples energy."},{"q":"A capacitor is charged to 8 V and stores 64 μJ. What is its capacitance?","o":["1 μF","2 μF","4 μF","8 μF"],"a":1,"e":"C = 2U/V² = 128 μJ/64 V² = 2 μF."},{"q":"A 10 μF capacitor stores 5 mJ. What is the approximate voltage across it?","o":["10 V","20 V","30 V","40 V"],"a":2,"e":"V = √(2U/C) = √(0.01/10⁻⁵) ≈ 31.6 V, closest to 30 V."},{"q":"A capacitor has Q = 4 mC and V = 50 V. Its energy is…","o":["0.01 J","0.1 J","0.2 J","2 J"],"a":1,"e":"U = ½QV = ½ × 0.004 × 50 = 0.1 J."},{"q":"During charging, the work needed to transfer a small charge dq onto a capacitor at potential V is…","o":["dW = V dq","dW = Q/V","dW = C dq","dW = V/C"],"a":0,"e":"The incremental work is dW = V dq. Since V = q/C, integration gives U = Q²/(2C)."},{"q":"The work required to charge a capacitor from zero to final charge Q is…","o":["QV","Q²/C","Q²/(2C)","2Q²/C"],"a":2,"e":"Integrating dW = (q/C)dq from q = 0 to Q gives W = Q²/(2C)."},{"q":"A 5 μF capacitor connected to 12 V stores energy…","o":["180 μJ","360 μJ","720 μJ","60 μJ"],"a":1,"e":"U = ½ × 5 μF × 144 = 360 μJ."},{"q":"If the charge is fixed and capacitance doubles, energy changes to…","o":["2U","U/2","4U","U"],"a":1,"e":"For fixed Q, U = Q²/(2C), so doubling C halves the energy."},{"q":"If the capacitor is held at fixed voltage and capacitance doubles, energy changes to…","o":["U/2","2U","4U","U"],"a":1,"e":"For fixed V, U = ½CV², so energy doubles when C doubles."},{"q":"Two identical capacitors C are connected in parallel across the same voltage V. Total stored energy is…","o":["½CV²","CV²","¼CV²","2CV²"],"a":1,"e":"Equivalent capacitance is 2C, so Utotal = ½(2C)V² = CV²."},{"q":"A 2 μF capacitor charged to 100 V stores…","o":["1 mJ","10 mJ","20 mJ","100 mJ"],"a":1,"e":"U = ½ × 2 × 10⁻⁶ × 100² = 0.01 J = 10 mJ."},{"q":"Energy density in a uniform field can also be written as…","o":["½ε₀(V/d)²","ε₀Vd","½ε₀Vd","V/(2ε₀d)"],"a":0,"e":"Since E = V/d, u = ½ε₀E² = ½ε₀(V/d)²."},{"q":"For a fixed parallel-plate capacitor in vacuum, energy density is proportional to…","o":["E","E²","1/E","√E"],"a":1,"e":"The relation u = ½ε₀E² shows energy density is proportional to E²."},{"q":"A 3 μF capacitor at 4 V is connected to an identical uncharged capacitor in parallel. Assuming final voltage is 2 V, final total energy is…","o":["6 μJ","12 μJ","24 μJ","48 μJ"],"a":1,"e":"Two capacitors give Ctotal = 6 μF; Ufinal = ½ × 6 μF × (2 V)² = 12 μJ."},{"q":"A capacitor of 8 μF stores 1 mJ. Its charge is approximately…","o":["40 μC","80 μC","126 μC","250 μC"],"a":2,"e":"Q = √(2CU) = √(2 × 8×10⁻⁶ × 10⁻³) ≈ 126 μC."},{"q":"For an isolated capacitor, a dielectric of constant K is inserted fully. Its stored energy becomes…","o":["KU₀","U₀/K","U₀","K²U₀"],"a":1,"e":"The free charge remains fixed and C becomes KC₀, so U = Q²/(2C) falls to U₀/K."},{"q":"For a capacitor connected to a battery, a dielectric of constant K is inserted fully. Its stored energy becomes…","o":["U₀/K","KU₀","U₀","K²U₀"],"a":1,"e":"The battery keeps V constant while C increases by K; U = ½CV² therefore becomes KU₀."},{"q":"Why is the stored energy not QV?","o":["Because Q is always zero","Because the voltage rises from zero to its final value while charging","Because capacitance is negative","Because energy is measured in coulombs"],"a":1,"e":"During charging, the capacitor voltage rises from zero to V, so the average voltage during transfer is V/2; thus U = ½QV."},{"q":"The dimensions of electrostatic energy are the same as…","o":["Charge","Potential difference","Work","Capacitance"],"a":2,"e":"Energy is measured in joules, the SI unit of work."},{"q":"A 6 μF capacitor is charged to 5 V. Its energy is…","o":["15 μJ","30 μJ","75 μJ","150 μJ"],"a":2,"e":"U = ½ × 6 μF × 25 = 75 μJ."}];
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function typesetMath(){if(window.MathJax?.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options'),$('feedback')].filter(Boolean)).catch(()=>{});}}
window.addEventListener('load',typesetMath);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
 typesetMath();
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Energy Stored in a Capacitor Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
   if(window.MathJax?.typesetPromise) window.MathJax.typesetPromise([review]).catch(()=>{});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
