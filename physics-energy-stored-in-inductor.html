<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Energy Stored in Inductor</title><meta name="description" content="SkillUp Physics Energy Stored in Inductor interactive lesson with 15 MCQs.">
<style>
:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}
</style></head><body><main class="card"><header><span class="icon">⚡</span><h1>Energy Stored in Inductor</h1></header>
<section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section>
<section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main>
<script>
const qs=[
["The energy stored in an inductor carrying current I is:",["LI","LI²","½LI²","2LI²"],2,"The magnetic energy stored is U = ½LI²."],
["An inductor of 2 H carries a current of 3 A. Its stored energy is:",["3 J","6 J","9 J","18 J"],2,"U = ½LI² = ½×2×3² = 9 J."],
["Energy in an ideal inductor is stored in its:",["Electric field","Magnetic field","Gravitational field","Thermal field"],1,"An inductor stores energy in the magnetic field produced by its current."],
["If the current through an inductor is doubled, its stored energy becomes:",["2 times","4 times","Half","Unchanged"],1,"Because U ∝ I², doubling current makes energy four times larger."],
["For an inductor of inductance L, energy density depends on the magnetic field as:",["B","B²","1/B","√B"],1,"Magnetic energy density in a linear medium is proportional to B²."],
["The work done in establishing current in an inductor is stored as:",["Heat","Magnetic energy","Chemical energy","Sound"],1,"The source does work against back emf, storing energy in the magnetic field."],
["If L = 4 H and I = 2 A, the stored energy is:",["4 J","8 J","16 J","32 J"],1,"U = ½×4×2² = 8 J."],
["The energy stored in an inductor is zero when:",["Current is maximum","Current is zero","Inductance is large","Voltage is applied"],1,"U = ½LI², so zero current gives zero stored energy."],
["For the same current, stored energy increases when inductance:",["Decreases","Increases","Becomes zero","Changes sign"],1,"At fixed I, U is directly proportional to L."],
["The dimensional formula of inductance is:",["ML²T⁻²A⁻²","ML²T⁻²A⁻¹","MLT⁻²A⁻²","ML²T⁻¹A⁻²"],0,"Since U = ½LI² and energy has dimensions ML²T⁻², L has ML²T⁻²A⁻²."],
["A 5 H inductor carries 2 A. Its energy is:",["5 J","10 J","20 J","25 J"],1,"U = ½×5×2² = 10 J."],
["When current decreases in an ideal inductor, the stored magnetic energy:",["Increases","Decreases","Remains always zero","Becomes charge"],1,"Since U = ½LI², decreasing I decreases stored energy."],
["The rate at which energy is supplied to an inductor is related to:",["VI","V/I","I/V","V+I"],0,"Power p = VI; for an ideal inductor v = L di/dt."],
["A 3 H inductor stores 24 J. Its current is:",["2 A","4 A","6 A","8 A"],1,"24 = ½×3×I², so I² = 16 and I = 4 A."],
["For a linear inductor, the energy-current graph is:",["Linear in I","Proportional to I²","Independent of I","Proportional to 1/I"],1,"U = ½LI², so energy varies quadratically with current."]
];
let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);
function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true}
function answer(n){if(answered)return;answered=true;const q=qs[i], buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="✓ Correct — "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="✗ Not quite — "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}
function next(){if(!answered)return;i++;if(i<qs.length)render();else{$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`;$("fill").style.width="100%"}}
function restart(){i=0;score=0;xp=0;$("quiz").hidden=false;$("result").hidden=true;render()}
$("next").onclick=next;$("restart").onclick=restart;render();
</script></body></html>
