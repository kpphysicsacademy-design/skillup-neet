</main><script>
const questions=[
{q:'The equation of continuity for steady flow of an incompressible fluid is',o:['A₁v₁ = A₂v₂','A₁/v₁ = A₂/v₂','A₁+A₂=v₁+v₂','A₁v₂=A₂v₁'],a:0,e:'For an incompressible fluid in steady flow, volume flow rate is constant: Av = constant.'},
{q:'The equation of continuity is based on conservation of',o:['energy','mass','momentum only','temperature'],a:1,e:'Continuity follows from conservation of mass: the mass flow rate remains constant in steady flow.'},
{q:'For incompressible steady flow, the volume flow rate is',o:['Av','A/v','v/A','A+v'],a:0,e:'Volume flow rate Q equals cross-sectional area A multiplied by fluid speed v.'},
{q:'If the cross-sectional area of a pipe decreases, the speed of an incompressible fluid generally',o:['decreases','increases','becomes zero','remains necessarily unchanged'],a:1,e:'Since Av is constant, a smaller area requires a larger speed.'},
{q:'Water flows through a pipe of area 4 cm² at 2 m/s. If the area becomes 2 cm², the speed is',o:['1 m/s','2 m/s','4 m/s','8 m/s'],a:2,e:'A₁v₁=A₂v₂, so v₂=(4/2)×2=4 m/s.'},
{q:'The SI unit of volume flow rate is',o:['m³/s','m/s','m²/s','kg/s'],a:0,e:'Volume flow rate is volume per time, so its SI unit is m³ s⁻¹.'},
{q:'For a fluid of constant density, mass flow rate through a section is',o:['ρAv','ρA/v','Av/ρ','ρv/A'],a:0,e:'Mass flow rate ṁ = density × volume flow rate = ρAv.'},
{q:'If A₁=3A₂ in an incompressible fluid, then v₂ is',o:['v₁/3','3v₁','v₁','9v₁'],a:1,e:'A₁v₁=A₂v₂, so 3A₂v₁=A₂v₂ and v₂=3v₁.'},
{q:'A pipe has diameter reduced from 4 cm to 2 cm. For incompressible flow, the speed becomes',o:['half','double','four times','one-fourth'],a:2,e:'Area is proportional to diameter squared. Halving diameter makes area one-fourth, so speed becomes four times.'},
{q:'Which condition is most directly associated with the simple form Av = constant?',o:['Steady incompressible flow','Any unsteady compressible flow','Solid-body motion','Static fluid only'],a:0,e:'The simple Av=constant form assumes steady flow of an incompressible fluid.'},
{q:'If water flows at 5 m/s through an area of 0.01 m², the volume flow rate is',o:['0.002 m³/s','0.05 m³/s','0.5 m³/s','5 m³/s'],a:1,e:'Q=Av=0.01×5=0.05 m³/s.'},
{q:'In a narrowing pipe carrying an incompressible fluid, the product of area and speed',o:['increases','decreases','remains constant','becomes zero'],a:2,e:'The continuity equation gives Av=constant for steady incompressible flow.'},
{q:'If density changes significantly along a steady flow, the general continuity relation is',o:['ρAv = constant','Avρ = 0','A/v = constant','ρA/v = constant'],a:0,e:'For steady flow with possible density variation, mass conservation gives ρAv=constant along a stream tube.'},
{q:'A nozzle is used to increase fluid speed mainly by',o:['increasing its cross-sectional area','decreasing its cross-sectional area','stopping the flow','increasing fluid mass'],a:1,e:'Reducing area increases speed for an incompressible steady flow because Av remains constant.'},
{q:'Two sections of a horizontal pipe have areas 6 cm² and 3 cm². If speed at the larger section is 2 m/s, speed at the smaller section is',o:['1 m/s','2 m/s','4 m/s','6 m/s'],a:2,e:'6×2=3×v₂, so v₂=4 m/s.'}
];
let i=0,selected=null,checked=false,score=0;const $=id=>document.getElementById(id);
function render(){selected=null;checked=false;$('feedback').textContent='';$('continue').disabled=true;$('continue').textContent=i===14?'Finish Skill →':'Check Answer →';$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=questions[i].q;$('opts').innerHTML='';const c=questions[i].o.map((text,index)=>({text,index}));for(let k=c.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[c[k],c[r]]=[c[r],c[k]]}c.forEach((x,j)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{if(checked)return;selected=x.index;document.querySelectorAll('button.opt').forEach(z=>z.classList.remove('selected'));b.classList.add('selected');$('continue').disabled=false};$('opts').appendChild(b)});$('mastery').textContent=`${i} / 15`;$('fill').style.width=`${i/15*100}%`}
function next(){if(selected===null)return;if(!checked){checked=true;const item=questions[i],ok=selected===item.a;if(ok){score++;$('xp').textContent=`XP: ${score*10}`}document.querySelectorAll('button.opt').forEach(b=>{const n=Number(b.dataset.index);b.disabled=true;if(n===item.a)b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+`<div class="explain">${item.e}</div>`;$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=`${(i+1)/15*100}%`}else if(i<14){i++;render()}else finish()}
function finish(){$('quiz').hidden=true;$('result').hidden=false;const pct=Math.round(score/15*100);$('result').innerHTML=`<h2>🎉 Quiz Complete!</h2><div class="score">${score} / 15</div><p><strong>${pct}%</strong> accuracy</p><p>🏆 You earned <strong>${score*10} XP</strong>.</p><p>${score>=12?'🔥 Excellent NEET readiness!':score>=9?'💪 Good work. Revise and retry.':'📚 Revise Equation of Continuity and try again.'}</p><button class="continue" type="button" onclick="location.reload()">Retry 15 MCQs</button>`}$('continue').onclick=next;render();
</script></body></html>
