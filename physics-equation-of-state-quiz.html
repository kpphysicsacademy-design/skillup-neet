<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equation of State Quiz | SkillUp Physics</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--accent:#635bff;--ok:#16a34a;--bad:#dc2626;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:850px;margin:auto;padding:18px}.hero{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 8px 30px #0000000b}.tag{display:inline-block;padding:7px 12px;border-radius:999px;background:#eeecff;color:#4b43c8;font-weight:800;font-size:13px}.hero h1{margin:14px 0 6px;font-size:clamp(28px,5vw,40px)}.hero p{color:var(--muted);line-height:1.6}.formula{text-align:center;font-size:30px;font-weight:900;padding:16px;border-radius:18px;background:#f0f4ff;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;text-align:center}.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:var(--muted)}.bar{height:10px;background:#e8edf5;border-radius:99px;overflow:hidden;margin:10px 0 18px}.fill{height:100%;width:0;background:var(--accent);transition:.25s}.q{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0}.q h2{font-size:18px;line-height:1.5;margin:0 0 15px}.options{display:grid;gap:10px}.option{border:1px solid #dfe4ec;border-radius:14px;background:#fff;color:#000;padding:14px;text-align:left;font-size:15px;font-weight:600;cursor:pointer}.option:hover{border-color:#aaa4ff;transform:translateY(-1px)}.option:disabled{color:#000;opacity:1}.option.correct{background:#ecfdf3;border-color:var(--ok);color:#000}.option.wrong{background:#fef2f2;border-color:var(--bad);color:#000}.feedback{display:none;margin-top:12px;padding:12px;border-radius:12px;background:#f8fafc;color:#475467;line-height:1.55}.q.done .feedback{display:block}.hint{margin-top:12px}.hint summary{cursor:pointer;color:#4b43c8;font-weight:700}.result{display:none;background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;text-align:center;margin-top:18px}.result h2{margin-top:0}.big{font-size:38px;font-weight:900}.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;margin-top:12px;font-weight:800;cursor:pointer}.retry{background:#111827;color:#fff}.back{background:#172033;color:#fff;text-decoration:none}.hidden{display:none}@media(max-width:600px){.wrap{padding:10px}.hero,.q,.result{padding:16px;border-radius:18px}.stats{gap:6px}.stat{padding:10px 4px}.q h2{font-size:16px}.option{padding:13px}.formula{font-size:25px}}</style></head><body><main class="wrap"><section class="hero"><span class="tag">⚛️ MOLECULAR NATURE → EQUATION OF STATE</span><h1>Equation of State Quiz</h1><p>Master the molecular basis of pressure and temperature, kinetic-theory derivation, ideal-gas equation and gas-law applications.</p><div class="formula">PV = nRT</div></section><div class="stats"><div class="stat"><b id="score">0</b><span>Correct</span></div><div class="stat"><b id="xp">0</b><span>XP</span></div><div class="stat"><b id="done">0/15</b><span>Progress</span></div></div><div class="bar"><div class="fill" id="fill"></div></div><section id="quiz"></section><section class="result" id="result"><h2>🎉 Quiz Complete!</h2><div class="big" id="final">0/15</div><p id="message"></p><button class="btn retry" onclick="location.reload()">↻ Retry Quiz</button><a class="btn back" href="physics-equation-of-state.html">← Back to Equation of State</a></section></main><script>const qs=[
['The ideal-gas equation of state is:', ['PV = nRT','P = nVRT','PT = nRV','PV = RT/n'],0,'PV = nRT relates pressure, volume, temperature and amount of gas.','Start with the standard macroscopic relation for an ideal gas.'],
['According to kinetic theory, gas pressure is produced primarily by:', ['Molecular collisions with container walls','Gravitational attraction of the walls','The colour of the gas','The mass of the container'],0,'Molecular collisions transfer momentum to the walls, producing pressure.','Think about what changes the momentum of the container wall.'],
['For an ideal gas, absolute temperature is proportional to the average:', ['Translational kinetic energy of molecules','Mass of each molecule','Volume of each molecule','Potential energy of the container'],0,'Temperature is proportional to the average translational kinetic energy of the gas molecules.','Temperature describes a microscopic energy property.'],
['Kinetic theory gives which pressure relation?', ['P = ⅓ρc²','P = 3ρc²','P = ρ/c²','P = c/ρ'],0,'The kinetic-theory relation is P = ⅓ρc², where ρ is density and c² is mean square speed.','Recall the factor one-third in the kinetic-theory pressure relation.'],
['Using molecular kinetic energy with kinetic theory gives:', ['PV = NkT','PV = N/kT','PV = Nk/T','PV = kT/N'],0,'Combining the kinetic-theory pressure relation with average molecular kinetic energy gives PV = NkT.','The microscopic form uses the number of molecules N and Boltzmann constant k.'],
['If N = nNₐ and R = Nₐk, the microscopic equation becomes:', ['PV = nRT','PV = n/kT','PV = RT/n','P = nVRT'],0,'Substituting N = nNₐ and R = Nₐk into PV = NkT gives PV = nRT.','Convert from number of molecules to number of moles.'],
['At fixed n and T, if V doubles, the pressure becomes:', ['Half','Double','Four times','Unchanged'],0,'PV is constant when n and T are fixed, so doubling V halves P.','Use the inverse P–V relationship at constant temperature.'],
['At fixed P and n, if absolute temperature doubles, volume becomes:', ['Double','Half','Four times','Unchanged'],0,'At constant pressure, V is directly proportional to absolute temperature.','Think about Charles law using Kelvin temperature.'],
['At fixed P and T, if the amount of gas doubles, volume becomes:', ['Double','Half','Four times','Unchanged'],0,'From V = nRT/P, volume is directly proportional to the number of moles.','Look at the factor n in the equation of state.'],
['Which is an ideal-gas molecular assumption?', ['Molecular volume is negligible compared with container volume','Molecules are always at rest','Intermolecular forces dominate everywhere','Every collision is perfectly inelastic'],0,'The ideal-gas model treats molecules as point-like with negligible individual volume relative to the container.','Think about the simplifications made by the ideal-gas model.'],
['For ideal gases at the same temperature, average translational kinetic energy is:', ['The same for all molecular species','Greater for heavier molecules','Zero for lighter molecules','Determined only by pressure'],0,'At the same temperature, average translational kinetic energy depends on temperature rather than molecular species.','Compare molecules using temperature, not molecular mass.'],
['Which temperature scale is required directly in PV = nRT?', ['Kelvin','Celsius','Fahrenheit','Any temperature scale'],0,'Kelvin is the absolute temperature scale used directly in the ideal-gas equation.','The gas equation requires an absolute temperature scale.'],
['The SI unit of the universal gas constant R is:', ['J mol⁻¹ K⁻¹','J K mol','N mol⁻¹','Pa mol K'],0,'R is measured in J mol⁻¹ K⁻¹, equivalently Pa m³ mol⁻¹ K⁻¹.','Check the dimensions of energy per mole per kelvin.'],
['Real gases behave most nearly ideally under which conditions?', ['High temperature and low pressure','Low temperature and high pressure','Low temperature and low pressure','High pressure only'],0,'High temperature and low pressure reduce the relative importance of intermolecular attractions and molecular volume.','Ideal behaviour is approached when molecules are relatively far apart and energetic.'],
['Which statement best links Molecular Nature of Matter to the equation of state?', ['Macroscopic P, V and T describe collective molecular behaviour','Pressure exists without molecular motion','Temperature is unrelated to molecular motion','PV = nRT applies exactly to every substance'],0,'Molecular theory explains pressure and temperature microscopically, while PV = nRT summarizes ideal-gas behaviour macroscopically.','Look for the option connecting microscopic particles with measurable bulk variables.']
];let score=0,xp=0,done=0;function render(){const root=document.getElementById('quiz');root.innerHTML=qs.map((q,i)=>`<article class="q" id="q${i}"><h2>${i+1}. ${q[0]}</h2><div class="options">${q[1].map((o,j)=>`<button class="option" data-i="${i}" data-j="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div><div class="feedback" id="f${i}"></div><details class="hint"><summary>💡 Hint</summary><div>${q[5]}</div></details></article>`).join('');document.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.i,+b.dataset.j,b.closest('.q'))))}function answer(i,j,box){if(box.classList.contains('done'))return;const q=qs[i],buttons=box.querySelectorAll('.option');buttons.forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===j&&j!==q[2])b.classList.add('wrong')});box.classList.add('done');done++;if(j===q[2]){score++;xp+=10}else xp+=3;document.getElementById('score').textContent=score;document.getElementById('xp').textContent=xp;document.getElementById('done').textContent=done+'/15';document.getElementById('fill').style.width=(done/15*100)+'%';document.getElementById('f'+i).innerHTML='💡 '+q[4];if(done===15){document.getElementById('result').style.display='block';document.getElementById('final').textContent=score+'/15';document.getElementById('message').textContent=score===15?'Excellent! Molecular theory and the equation of state are well connected.':score>=12?'Strong performance! Revise the missed concepts once more.':score>=8?'Good progress. Revisit kinetic theory and gas-law relationships.':'Keep practising. Review the molecular basis of pressure, temperature and PV = nRT.';document.getElementById('result').scrollIntoView({behavior:'smooth'})}}render();</script></body></html>
