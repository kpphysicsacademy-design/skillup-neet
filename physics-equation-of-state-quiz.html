<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Equation of State</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center;margin:0 0 22px}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;line-height:1.45}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.opt:disabled{cursor:default}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px;margin-top:10px;line-height:1.5}.result{text-align:center}.result h2{margin:8px 0}.result p{font-size:20px}.result .retry{margin-top:18px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px;padding:14px}h1{font-size:25px}}</style></head><body><div class="wrap"><div class="card"><h1>⚛️ Equation of State</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['The ideal-gas equation of state is:','PV = nRT','P = nVRT','PT = nRV','PV = RT/n',0,'PV = nRT relates pressure, volume, temperature and amount of gas.'],
['According to kinetic theory, gas pressure is produced primarily by:','Molecular collisions with container walls','Gravitational attraction of the walls','The colour of the gas','The mass of the container',0,'Molecular collisions transfer momentum to the walls, producing pressure.'],
['For an ideal gas, absolute temperature is proportional to the average:','Translational kinetic energy of molecules','Mass of each molecule','Volume of each molecule','Potential energy of the container',0,'Temperature is proportional to the average translational kinetic energy of the gas molecules.'],
['Kinetic theory gives which pressure relation?','P = ⅓ρc²','P = 3ρc²','P = ρ/c²','P = c/ρ',0,'The kinetic-theory pressure relation is P = ⅓ρc², where ρ is density and c² is mean square speed.'],
['Using molecular kinetic energy with kinetic theory gives:','PV = NkT','PV = N/kT','PV = Nk/T','PV = kT/N',0,'Combining the kinetic-theory pressure relation with average molecular kinetic energy gives PV = NkT.'],
['If N = nNₐ and R = Nₐk, the microscopic equation becomes:','PV = nRT','PV = n/kT','PV = RT/n','P = nVRT',0,'Substituting N = nNₐ and R = Nₐk into PV = NkT gives PV = nRT.'],
['At fixed n and T, if V doubles, the pressure becomes:','Half','Double','Four times','Unchanged',0,'PV is constant when n and T are fixed, so doubling V halves P.'],
['At fixed P and n, if absolute temperature doubles, volume becomes:','Double','Half','Four times','Unchanged',0,'At constant pressure, V is directly proportional to absolute temperature.'],
['At fixed P and T, if the amount of gas doubles, volume becomes:','Double','Half','Four times','Unchanged',0,'From V = nRT/P, volume is directly proportional to the number of moles.'],
['Which is an ideal-gas molecular assumption?','Molecular volume is negligible compared with container volume','Molecules are always at rest','Intermolecular forces dominate everywhere','Every collision is perfectly inelastic',0,'The ideal-gas model treats molecules as point-like with negligible individual volume relative to the container.'],
['For ideal gases at the same temperature, average translational kinetic energy is:','The same for all molecular species','Greater for heavier molecules','Zero for lighter molecules','Determined only by pressure',0,'At the same temperature, average translational kinetic energy depends on temperature rather than molecular species.'],
['Which temperature scale is required directly in PV = nRT?','Kelvin','Celsius','Fahrenheit','Any temperature scale',0,'Kelvin is the absolute temperature scale used directly in the ideal-gas equation.'],
['The SI unit of the universal gas constant R is:','J mol⁻¹ K⁻¹','J K mol','N mol⁻¹','Pa mol K',0,'R is measured in J mol⁻¹ K⁻¹, equivalently Pa m³ mol⁻¹ K⁻¹.'],
['Real gases behave most nearly ideally under which conditions?','High temperature and low pressure','Low temperature and high pressure','Low temperature and low pressure','High pressure only',0,'High temperature and low pressure reduce the relative importance of intermolecular attractions and molecular volume.'],
['Which statement best links Molecular Nature of Matter to the equation of state?','Macroscopic P, V and T describe collective molecular behaviour','Pressure exists without molecular motion','Temperature is unrelated to molecular motion','PV = nRT applies exactly to every substance',0,'Molecular theory explains pressure and temperature microscopically, while PV = nRT summarizes ideal-gas behaviour macroscopically.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2>🎉 Quiz Complete</h2><p>Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
