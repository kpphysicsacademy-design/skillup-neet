<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Equation of State | SkillUp Physics</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--accent:#635bff;--ok:#16a34a;--bad:#dc2626;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:900px;margin:auto;padding:20px}.hero{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 8px 30px #0000000b}.tag{display:inline-block;padding:7px 12px;border-radius:999px;background:#eeecff;color:#4b43c8;font-weight:700;font-size:13px}.hero h1{margin:14px 0 8px;font-size:clamp(28px,5vw,42px)}.hero p{color:var(--muted);line-height:1.6}.formula{margin-top:16px;padding:18px;border-radius:18px;background:#f0f4ff;font-size:clamp(20px,4vw,30px);font-weight:800;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
.bar{height:10px;background:#e9edf5;border-radius:99px;overflow:hidden;margin:10px 0 22px}.fill{height:100%;width:0;background:var(--accent);transition:.25s}
.q{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0}.q h3{margin:0 0 16px;font-size:18px;line-height:1.5}.opts{display:grid;gap:10px}.opt{border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:#fff;text-align:left;font-size:15px;transition:.18s}.opt:hover{transform:translateY(-1px);border-color:#b9b5ff}.opt.correct{border-color:var(--ok);background:#ecfdf3}.opt.wrong{border-color:var(--bad);background:#fef2f2}.exp{display:none;margin-top:13px;padding:13px;border-radius:13px;background:#f8fafc;color:#475467;line-height:1.55}.q.done .exp{display:block}.next{margin-top:22px;width:100%;border:0;border-radius:16px;padding:15px;background:var(--accent);color:white;font-weight:800;font-size:16px;cursor:pointer}.result{display:none;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px;margin-top:18px}.xp{font-size:34px;font-weight:900;margin:8px}.small{color:var(--muted);font-size:13px}.restart{border:0;border-radius:14px;padding:13px 18px;background:#111827;color:white;font-weight:700;cursor:pointer}
@media(max-width:600px){.wrap{padding:12px}.hero,.q,.result{border-radius:18px;padding:16px}.stats{gap:7px}.stat{padding:11px 5px}.q h3{font-size:16px}.opt{padding:13px}}
</style></head>
<body><main class="wrap">
<section class="hero"><span class="tag">⚛️ NEET PHYSICS • THERMODYNAMICS</span><h1>Equation of State</h1><p>Master the relationship between pressure, volume, temperature and amount of gas. Practice 15 NEET-style questions with instant feedback.</p><div class="formula">PV = nRT</div></section>
<div class="stats"><div class="stat"><b id="score">0</b><span>Correct</span></div><div class="stat"><b id="xp">0</b><span>XP</span></div><div class="stat"><b id="count">0/15</b><span>Progress</span></div></div><div class="bar"><div class="fill" id="fill"></div></div><section id="quiz"></section><section class="result" id="result"><div>🎉 Quiz Complete!</div><div class="xp" id="finalXp">0 XP</div><p id="finalText"></p><button class="restart" onclick="location.reload()">↻ Retry Quiz</button></section>
</main>
<script>
const qs=[
['For an ideal gas, the equation of state is:', ['PV=nRT','P=nVRT','PT=nRV','PV=RT/n'],0,'The ideal-gas equation is PV=nRT, where n is the number of moles and R is the gas constant.'],
['At constant n and T, if the volume of an ideal gas is doubled, its pressure becomes:', ['Double','Half','Four times','Unchanged'],1,'From PV=constant at constant T and n, P is inversely proportional to V.'],
['The SI unit of the universal gas constant R is:', ['J mol⁻¹ K⁻¹','Pa mol K','J K mol','N mol⁻¹'],0,'R has SI unit J mol⁻¹ K⁻¹ (equivalently Pa m³ mol⁻¹ K⁻¹).'],
['One mole of an ideal gas at STP occupies approximately:', ['2.24 L','22.4 L','224 L','0.224 L'],1,'Using the conventional NEET STP value, one mole occupies about 22.4 L.'],
['If absolute temperature is doubled at constant pressure and amount of gas, volume:', ['Halves','Doubles','Becomes four times','Does not change'],1,'Charles law gives V/T=constant at constant P and n.'],
['Which temperature scale must be used directly in PV=nRT?', ['Celsius','Fahrenheit','Kelvin','Any scale'],2,'Absolute temperature in kelvin is required because the equation uses T measured from absolute zero.'],
['For a fixed amount of ideal gas, which combination remains constant?', ['PV/T','PVT','P/(VT)','PT/V'],0,'PV=nRT, so for fixed n, PV/T=nR is constant.'],
['A gas has P=2 atm, V=5 L and T=300 K. If T becomes 600 K at constant V, pressure is:', ['1 atm','2 atm','4 atm','6 atm'],2,'At constant V and n, P/T is constant; doubling T doubles P to 4 atm.'],
['The dimensions of R are equivalent to:', ['ML²T⁻²K⁻¹mol⁻¹','MLT⁻¹','ML²T⁻³','M⁰L⁰T⁰'],0,'R has energy per mole per kelvin dimensions: ML²T⁻²K⁻¹mol⁻¹.'],
['For a real gas, PV=nRT is most accurate when:', ['Low T and high P','High T and low P','Low T and low P','High P only'],1,'Real gases approach ideal behavior at low pressure and high temperature.'],
['If the number of moles is doubled while P and T remain constant, volume:', ['Halves','Doubles','Quadruples','Remains same'],1,'From V=nRT/P, V is directly proportional to n at fixed P and T.'],
['Which variable is NOT an independent state variable in the simple ideal-gas equation when n is fixed?', ['P','V','T','R'],3,'R is a universal constant, while P, V and T describe the gas state.'],
['A gas occupies 10 L at 300 K. At constant P, its volume at 450 K is:', ['7.5 L','12.5 L','15 L','20 L'],2,'V₂=V₁(T₂/T₁)=10×450/300=15 L.'],
['If pressure is expressed in pascals and volume in m³, the product PV has the unit:', ['joule','watt','kelvin','mole'],0,'1 Pa·m³ = 1 N/m²·m³ = 1 N·m = 1 J.'],
['Which statement follows directly from PV=nRT?', ['P is always constant','V is independent of T','P, V and T are related for a fixed n','R changes with pressure'],2,'For fixed n, changing any one of P, V or T requires a corresponding change in another to satisfy the equation.']
];
let correct=0,xp=0,done=0;
function render(){const root=document.getElementById('quiz');root.innerHTML='';qs.forEach((q,i)=>{const box=document.createElement('article');box.className='q';box.innerHTML=`<h3>${i+1}. ${q[0]}</h3><div class="opts"></div><div class="exp">💡 <b>Explanation:</b> ${q[4]}</div>`;const opts=box.querySelector('.opts');q[1].forEach((o,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+o;b.onclick=()=>answer(box,i,j);opts.appendChild(b)});root.appendChild(box)})}
function answer(box,i,j){if(box.classList.contains('done'))return;const buttons=box.querySelectorAll('.opt');buttons.forEach((b,k)=>{b.disabled=true;if(k===qs[i][2])b.classList.add('correct');if(k===j&&j!==qs[i][2])b.classList.add('wrong')});box.classList.add('done');done++;if(j===qs[i][2]){correct++;xp+=10}else xp+=3;document.getElementById('score').textContent=correct;document.getElementById('xp').textContent=xp;document.getElementById('count').textContent=done+'/15';document.getElementById('fill').style.width=(done/15*100)+'%';if(done===15){document.getElementById('result').style.display='block';document.getElementById('finalXp').textContent=xp+' XP';document.getElementById('finalText').textContent=`You answered ${correct} of 15 correctly. Keep practising to improve your score!`}}render();
</script></body></html>
