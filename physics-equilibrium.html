<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Equilibrium</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.top h1{font-size:1.8rem;margin:0}.xp{font-weight:800;color:#5146a5}.hero{background:#5865f2;color:#fff;border-radius:22px;padding:24px;margin-bottom:18px}.hero h2{margin:0 0 8px;font-size:1.45rem}.hero p{margin:0;opacity:.95;line-height:1.5}.progress-card,.quiz-card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 6px 20px #17203312}.progress-card{margin-bottom:18px}.progress-row{display:flex;justify-content:space-between;font-weight:750;margin-bottom:10px}.track{height:12px;background:#e8e8ef;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:width .25s ease}.quiz-card{min-height:360px}.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#626b7d;font-weight:750;margin-bottom:18px}.badge{background:#eef0ff;color:#5146a5;padding:6px 10px;border-radius:999px}.question{font-size:1.3rem;font-weight:750;line-height:1.45;margin-bottom:18px}.options{display:grid;gap:11px}.option{width:100%;text-align:left;background:#fff;border:2px solid #d8dbe5;border-radius:14px;padding:15px;font:inherit;color:inherit;cursor:pointer;transition:transform .12s ease,border-color .12s ease,background .12s ease}.option:hover{border-color:#58cc02;background:#f7fff2;transform:translateY(-1px)}.option.selected{border-color:#5146a5;background:#f0edff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#ff4b4b;background:#fff0f0}.option:disabled{cursor:default}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button.action{border:0;border-radius:14px;padding:13px 18px;font:inherit;font-weight:800;cursor:pointer;transition:transform .12s ease,filter .12s ease}#check{background:#58cc02;color:#fff}#next{background:#5146a5;color:#fff}button.action:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.05)}button.action:disabled{opacity:.5;cursor:not-allowed}.feedback{margin-top:16px;min-height:28px;font-weight:750;line-height:1.5}.feedback.good{color:#2d8a00}.feedback.bad{color:#c53030}.hint{margin-top:10px;color:#687184;font-size:.95rem}.result{display:none;margin-top:18px;padding:18px;border-radius:16px;background:#f3f0ff;font-weight:800}.retry{margin-top:14px;background:#5146a5;color:#fff;border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.back{display:inline-block;margin-top:22px;color:#5146a5;font-weight:800;text-decoration:underline;padding:10px 14px;border-radius:12px;transition:transform .12s ease,background .12s ease,box-shadow .12s ease}.back:hover{background:#f0edff;transform:translateY(-1px);box-shadow:0 4px 12px #5146a522}.back:focus-visible{outline:3px solid #9b94e8;outline-offset:2px;background:#f0edff}.back:active{transform:translateY(1px);box-shadow:none}@media(max-width:600px){.wrap{padding:20px 14px 34px}.top{align-items:flex-start}.top h1{font-size:1.5rem}.hero,.progress-card,.quiz-card{padding:20px;border-radius:18px}.question{font-size:1.15rem}}</style></head><body><main class="wrap"><div class="top"><h1>Physics • Equilibrium</h1><div class="xp">⚡ <span id="xp">0</span> XP</div></div><section class="hero"><h2>Equilibrium</h2><p>Master the conditions for translational equilibrium and apply balanced-force ideas to NEET problems.</p></section><section class="progress-card"><div class="progress-row"><span>Mastery</span><span id="mastery">0%</span></div><div class="track"><div id="fill" class="fill"></div></div></section><section class="quiz-card"><div class="meta"><span id="count">Question 1 of 15</span><span id="pct" class="badge">7%</span></div><div id="question" class="question"></div><div id="options" class="options"></div><div class="actions"><button id="check" class="action">Check Answer</button><button id="next" class="action" disabled>Next Question →</button></div><div id="feedback" class="feedback"></div><div id="hint" class="hint"></div><div id="result" class="result"><div id="score"></div><button id="retry" class="retry">Retry Skill</button></div></section><a id="back" class="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const quiz=[['What is the condition for translational equilibrium of a particle?',['The vector sum of all forces is zero','The particle must be moving','Only the gravitational force must be zero','The particle must have maximum speed'],0,'Translational equilibrium requires ΣF = 0, so acceleration is zero.'],['An object in equilibrium can be:',['At rest or moving with constant velocity','Only at rest','Only moving in a circle','Only accelerating uniformly'],0,'Zero net force means zero acceleration, which permits rest or constant velocity.'],['For a body in translational equilibrium, its acceleration is:',['Zero','Maximum','Always upward','Always equal to g'],0,'From Newton’s second law, ΣF = ma; if ΣF = 0 then a = 0.'],['A book rests on a horizontal table. Which pair of forces balances vertically?',['Weight and normal reaction','Weight and friction','Normal reaction and tension','Friction and weight only'],0,'The downward weight is balanced by the upward normal reaction.'],['If two horizontal forces of 10 N and 6 N act in opposite directions, the third force needed for equilibrium is:',['4 N in the direction of the 6 N force','4 N in the direction of the 10 N force','16 N in either direction','6 N vertically upward'],0,'The resultant of 10 N and 6 N is 4 N toward the 10 N force, so 4 N opposite it is required.'],['Three forces act on a particle in equilibrium. Their vector sum must be:',['Zero','Equal to the largest force','Equal to the smallest force','Greater than zero'],0,'Equilibrium means the resultant vector force is zero.'],['A 5 kg block is pulled horizontally by 20 N and remains at rest. The frictional force is:',['20 N opposite the pull','20 N in the same direction','5 N opposite the pull','Zero'],0,'Static friction adjusts to balance the applied force up to its limiting value.'],['If the net force on a moving object is zero, the object:',['Continues with constant velocity','Must stop immediately','Must accelerate','Must move in a circle'],0,'Zero net force means velocity remains constant.'],['Which equation represents translational equilibrium?',['ΣFx = 0 and ΣFy = 0','ΣFx = ma only','ΣFy = mg only','ΣF = maximum'],0,'In two dimensions, both independent force components must sum to zero.'],['A lamp hangs motionless from a vertical string. The tension in the string is equal to:',['The weight of the lamp','Zero','Twice the weight','Half the weight'],0,'For a motionless hanging lamp with one vertical string, T = W.'],['A 2 kg object is acted on by 12 N east and 12 N west. Its acceleration is:',['0 m/s²','6 m/s² east','12 m/s² west','24 m/s² east'],0,'Equal opposite forces give zero resultant force and hence zero acceleration.'],['Static friction acts in equilibrium to:',['Oppose the tendency of relative motion as needed','Always equal μN','Always point in the direction of motion','Act only on airborne objects'],0,'Static friction takes whatever value is needed, up to its limiting value, to prevent slipping.'],['If a body has zero net force but nonzero velocity, its motion is:',['Uniform straight-line motion','Uniform circular motion','Accelerated motion','Random motion'],0,'With zero acceleration, a nonzero velocity remains constant in magnitude and direction.'],['A horizontal force of 30 N acts on a block and friction is 30 N opposite to it. The block has:',['Zero net horizontal force','30 N net force','60 N net force','90 N net force'],0,'The equal and opposite horizontal forces cancel, giving zero net horizontal force.'],['Which statement is true for a particle in mechanical equilibrium?',['The resultant force acting on it is zero','No force can act on it','Its velocity must be zero','Its mass must be zero'],0,'Mechanical equilibrium requires zero resultant force; individual forces may still act.']];const $=id=>document.getElementById(id);let i=0,selected=-1,correct=0,xp=0,checked=false;function render(){const a=quiz[i];selected=-1;checked=false;$('question').textContent=a[0];$('count').textContent='Question '+(i+1)+' of '+quiz.length;$('pct').textContent=Math.round((i+1)/quiz.length*100)+'%';$('feedback').className='feedback';$('feedback').textContent='';$('hint').textContent='Remember: equilibrium means zero resultant force.';$('next').disabled=true;$('next').textContent='Next Question →';$('check').disabled=false;$('options').innerHTML='';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach(item=>{const b=document.createElement('button');b.className='option';b.textContent=item.text;b.dataset.index=item.index;b.onclick=()=>{if(checked)return;selected=item.index;[...$('options').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('options').appendChild(b)});updateProgress()}function updateProgress(){$('mastery').textContent=Math.round(correct/quiz.length*100)+'%';$('fill').style.width=(correct/quiz.length*100)+'%';$('xp').textContent=xp}function check(){if(selected<0||checked)return;checked=true;const a=quiz[i],ok=selected===a[2];[...$('options').children].forEach(b=>{const idx=Number(b.dataset.index);b.disabled=true;if(idx===a[2])b.classList.add('correct');if(idx===selected&&!ok)b.classList.add('wrong')});if(ok){correct++;xp+=10;$('feedback').className='feedback good';$('feedback').textContent='✓ Correct — '+a[3]}else{$('feedback').className='feedback bad';$('feedback').textContent='✗ Review — '+a[3]}$('next').disabled=false;$('check').disabled=true;updateProgress();if(i===quiz.length-1)$('next').textContent='Finish Skill →'}function next(){if(!checked)return;if(i<quiz.length-1){i++;render()}else{$('question').textContent='🏆 Equilibrium Complete!';$('options').innerHTML='';$('check').style.display='none';$('next').style.display='none';$('hint').textContent='';$('feedback').className='feedback good';$('feedback').textContent='Skill complete. '+xp+' XP earned.';$('result').style.display='block';$('score').textContent=correct+' / '+quiz.length+' correct • '+xp+' XP'}}$('check').onclick=check;$('next').onclick=next;$('retry').onclick=()=>{i=0;selected=-1;correct=0;xp=0;$('result').style.display='none';$('check').style.display='';$('next').style.display='';render()};$('back').onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
