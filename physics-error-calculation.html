<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>SkillUp Physics | Error Calculation</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{width:100%;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;font-size:16px;cursor:pointer}.selected{border-color:#5146a5;background:#f4f1ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.action,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;text-decoration:none}.action,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.feedback{text-align:center;font-weight:700;color:#b56d00;min-height:24px}@media(max-width:520px){.wrap{padding:12px}.card{padding:18px}}</style></head><body><div class="wrap"><div class="card"><h1>📊 Error Calculation</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div id="feedback" class="feedback"></div><button id="action" class="action hide">CHECK</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['If the measured value is 9.8 m and the true value is 10.0 m, the absolute error is:',['0.02 m','0.2 m','2 m','19.8 m'],1,'Absolute error = |9.8 − 10.0| = 0.2 m.'],['Relative error is defined as:',['Absolute error × true value','Absolute error ÷ true/reference value','True value ÷ absolute error','Absolute error + true value'],1,'Relative error is the ratio of absolute error to the true or accepted value.'],['Percentage error equals:',['Relative error × 100','Absolute error × 100 only','Relative error ÷ 100','True value × 100'],0,'Percentage error = relative error × 100%.'],['A length is measured as 20.0 ± 0.2 cm. Its percentage error is:',['0.1%','1%','2%','10%'],1,'(0.2/20.0) × 100 = 1%.'],['For repeated measurements, mean absolute error is the:',['Largest reading','Average of absolute deviations from the mean','Smallest reading','Difference between units'],1,'Mean absolute error is obtained by averaging the magnitudes of deviations from the mean.'],['Measurements are 5.0, 5.2 and 4.8 cm. Their mean is:',['4.8 cm','5.0 cm','5.2 cm','15 cm'],1,'Mean = (5.0 + 5.2 + 4.8)/3 = 5.0 cm.'],['For 5.0, 5.2 and 4.8 cm, the mean absolute error is approximately:',['0 cm','0.13 cm','0.4 cm','5 cm'],1,'Absolute deviations from 5.0 are 0, 0.2 and 0.2; their mean is about 0.13 cm.'],['If x = 4.0 ± 0.1 m, the relative error is:',['0.025','0.25','2.5','40'],0,'Relative error = 0.1/4.0 = 0.025.'],['If the relative error is 0.03, the percentage error is:',['0.03%','0.3%','3%','30%'],2,'0.03 × 100 = 3%.'],['For z = x + y, the maximum absolute error is generally:',['Δx + Δy','Δx − Δy','Δx × Δy','Zero'],0,'For addition or subtraction, maximum absolute errors add.'],['For z = xy, the maximum fractional error is:',['Δx/x + Δy/y','Δx + Δy','Δx/x − Δy/y','Always zero'],0,'For multiplication, maximum fractional (relative) errors add.'],['For z = x/y, the maximum fractional error is:',['Δx/x + Δy/y','Δx/x − Δy/y','Δx + Δy','ΔxΔy'],0,'For division, maximum fractional errors are added in magnitude.'],['If z = x², and x has 2% error, the approximate percentage error in z is:',['1%','2%','4%','8%'],2,'For z = xⁿ, fractional error is approximately |n| times the fractional error in x; hence 2 × 2% = 4%.'],['A measurement 50 ± 1 has a percentage error of:',['0.5%','1%','2%','50%'],2,'Percentage error = (1/50) × 100 = 2%.'],['Which expression correctly reports a measured quantity with uncertainty?',['x = measured value ± uncertainty','x = uncertainty only','x = measured value × 100 always','x = true value with no units'],0,'A measurement is commonly reported as measured value ± estimated uncertainty, with appropriate units.']];let i=0,xp=0,selected=-1,checked=false;const $=id=>document.getElementById(id);function render(){selected=-1;checked=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${xp}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q[1].map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(checked)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(z=>z.classList.remove('selected'));b.classList.add('selected');$('action').classList.remove('hide');$('action').textContent='CHECK'});$('feedback').textContent='';$('action').classList.add('hide')}function act(){if(selected<0)return;if(!checked){checked=true;const q=qs[i],ok=selected===q[2];document.querySelectorAll('.opt').forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});if(ok){xp++;$('feedback').textContent='✨ Correct! +1 XP'}else $('feedback').textContent='❌ Incorrect. '+q[3];$('score').textContent=`XP ${xp}`;$('fill').style.width=`${(i+1)/15*100}%`;$('action').textContent=i===14?'FINISH':'Next Question →';return}if(i<14){i++;render()}else{$('quiz').innerHTML='';$('action').classList.add('hide');$('feedback').textContent='';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${xp}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('action').onclick=act;render();</script></body></html>
