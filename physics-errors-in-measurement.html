<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Errors in Measurement</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;line-height:1.45}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{font-weight:700;color:#e08a00;text-align:center;min-height:24px;line-height:1.5}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>📏 Errors in Measurement</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['What is an error in measurement?','The difference between a measured value and the true or accepted value','The unit of measurement','The instrument scale only','The numerical value of the quantity',0,'Measurement error describes the deviation of a measured result from the true or accepted value.'],['Which statement about measurement uncertainty is correct?','Every physical measurement has some uncertainty','Only analogue instruments have uncertainty','Digital instruments give perfectly exact values','Uncertainty can always be completely eliminated',0,'Every real measurement has finite precision and therefore some uncertainty.'],['The absolute error of a measured quantity is generally expressed as:','The magnitude of the difference between the measured and accepted value','The ratio of error to measured value','The error multiplied by 100','The measured value divided by the error',0,'Absolute error is the magnitude of the difference between a measured value and the accepted or mean value.'],['Relative error is defined as:','Absolute error divided by the measured value','Absolute error multiplied by 100','Measured value divided by absolute error','True value divided by measured value',0,'Relative error = absolute error / measured value.'],['Percentage error is equal to:','Relative error × 100','Absolute error ÷ 100','Measured value × 100','Relative error ÷ 100',0,'Percentage error expresses relative error as a percentage.'],['A length is measured as 10.0 cm with an absolute error of 0.1 cm. Its relative error is:','0.01','0.1','1','10',0,'Relative error = 0.1/10.0 = 0.01.'],['For the same measurement, the percentage error is:','0.01%','0.1%','1%','10%',2,'Percentage error = 0.01 × 100 = 1%.'],['Random errors are mainly associated with:','Unpredictable variations in repeated measurements','A constant zero offset','A fixed calibration bias','A wrong unit definition',0,'Random errors vary unpredictably from one measurement to another.'],['A systematic error is best described as:','A consistent or repeatable bias in measurements','A completely unpredictable fluctuation','An error that occurs only once','A change of SI unit',0,'Systematic error produces a consistent or predictable bias.'],['Which approach can reduce the effect of random error?','Taking repeated readings and using their mean','Changing the unit of measurement','Ignoring unusual readings without analysis','Rounding every reading to one significant figure',0,'Repeated measurements and averaging reduce the influence of random fluctuations.'],['A persistent zero offset in an instrument is usually a:','Systematic error','Random error','Relative error only','Unit conversion error',0,'A fixed zero offset produces a systematic bias.'],['Parallax error while reading a scale can be reduced by:','Keeping the eye perpendicular to the scale at the reading position','Changing centimetres to metres','Taking only one reading','Increasing the scale value',0,'Correct eye alignment reduces parallax error.'],['Three measurements are 9.8 cm, 10.0 cm and 10.2 cm. Their mean is:','9.8 cm','10.0 cm','10.2 cm','30.0 cm',1,'Mean = (9.8 + 10.0 + 10.2)/3 = 10.0 cm.'],['If the mean value is 10.0 cm and one reading is 10.2 cm, its absolute error relative to the mean is:','0.02 cm','0.2 cm','2 cm','20 cm',1,'Absolute error = |10.2 − 10.0| = 0.2 cm.'],['Which statement correctly distinguishes accuracy and precision?','Accuracy concerns closeness to the accepted value, while precision concerns repeatability','Accuracy and precision always mean exactly the same thing','Precision means the measurement is always correct','Accuracy is determined only by the number of decimal places',0,'Accuracy describes closeness to the accepted value; precision describes how closely repeated measurements agree.']];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
