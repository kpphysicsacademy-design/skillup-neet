<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Errors in Measurement</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;margin:0;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.xp{font-weight:800}.card{background:#fff;border-radius:22px;padding:24px;margin-top:18px;box-shadow:0 5px 20px #00000012}.mastery{font-weight:800;margin-top:18px}.bar{height:10px;background:#e8eaf0;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#58cc02;transition:.3s}.q{font-size:1.3rem;font-weight:750;line-height:1.45}.opts{display:grid;gap:10px;margin-top:18px}.opts button{padding:15px;border:2px solid #e2e5eb;border-radius:14px;background:#fff;text-align:left;font-size:1rem;cursor:pointer}.opts button:hover{border-color:#58cc02}.opts button:disabled{cursor:default}.opts button.correct{border-color:#58cc02;background:#effbea}.opts button.wrong{border-color:#e5484d;background:#fff0f0}.feedback{font-weight:700;margin-top:16px;min-height:24px;line-height:1.5}.next,.retry{margin-top:18px;padding:13px 22px;border:0;border-radius:14px;background:#58cc02;color:#fff;font-weight:800;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:inline-block;margin-top:18px;padding:12px 18px;border:2px solid #5146a5;border-radius:14px;color:#5146a5;text-decoration:none;font-weight:800;transition:.2s}.back:hover{background:#5146a5;color:#fff;transform:translateY(-1px)}.back:active{transform:scale(.97)}.meta{font-size:.95rem;color:#4b5563}.result{text-align:center;padding-top:10px}@media(max-width:600px){.wrap{padding:20px 14px}.top h1{font-size:1.55rem}.card{padding:20px}.q{font-size:1.18rem}}</style></head><body><main class="wrap"><div class="top"><h1>📏 Errors in Measurement</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></div><p>Master absolute, relative and percentage errors, accuracy, precision and measurement uncertainty with 15 NEET-style questions.</p><div class="mastery">🎯 Skill Mastery <span id="mt">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div><section class="card"><div id="count" class="meta">Question 1 of 15</div><p id="q" class="q"></p><div id="opts" class="opts"></div><div id="fb" class="feedback"></div><button id="next" class="next" disabled>Continue →</button><div id="result" class="result" style="display:none"><h2>🏆 Skill Complete!</h2><p id="score"></p><button id="retry" class="retry">Retry Skill</button></div></section><a class="back" href="physics-home.html">← Back to Physics Path</a></main><script>const quiz=[{q:'What is an error in measurement?',o:['The difference between a measured value and the true value','The unit of measurement','The instrument scale only','The numerical value of the quantity'],a:0,e:'Measurement error is the deviation of a measured value from the true or accepted value.'},{q:'Which statement about errors is correct?',o:['Every physical measurement has some uncertainty','Errors occur only with digital instruments','Errors always make the value zero','Errors can always be removed completely'],a:0,e:'Measurements have finite precision, so some uncertainty is unavoidable.'},{q:'What is absolute error?',o:['The magnitude of the difference between a measured value and the true or mean value','Error divided by the measured value','Error expressed only in percent','The least count of an instrument'],a:0,e:'Absolute error is the magnitude of the difference between the measured value and the accepted or mean value.'},{q:'Relative error is defined as:',o:['Absolute error divided by the measured value','Absolute error multiplied by 100 only','Measured value divided by error','True value divided by measured value'],a:0,e:'Relative error compares absolute error with the measured value.'},{q:'Percentage error is:',o:['Relative error × 100','Absolute error ÷ 100','Measured value × 100','Relative error ÷ 100'],a:0,e:'Percentage error is relative error expressed as a percentage.'},{q:'If a length is measured as 10.0 cm with an absolute error of 0.1 cm, the relative error is:',o:['0.01','0.1','1','10'],a:0,e:'Relative error = 0.1/10.0 = 0.01.'},{q:'For the same measurement, the percentage error is:',o:['0.01%','0.1%','1%','10%'],a:2,e:'Percentage error = 0.01 × 100 = 1%.'},{q:'Random errors are generally caused by:',o:['Unpredictable variations in measurement conditions','A fixed zero offset only','Incorrect unit conversion only','A mathematical identity'],a:0,e:'Random errors fluctuate unpredictably between repeated measurements.'},{q:'Systematic error is characterized by:',o:['A consistent bias in one direction or according to a repeatable pattern','Completely random changes','No effect on measurements','Only human reaction time'],a:0,e:'Systematic errors tend to produce a consistent or predictable bias.'},{q:'Which method helps reduce random error?',o:['Taking repeated measurements and using their mean','Changing the unit only','Ignoring all readings','Rounding every reading to one digit'],a:0,e:'Repeated measurements and averaging can reduce random fluctuations.'},{q:'A zero error in an instrument is usually a type of:',o:['Systematic error','Random error','Percentage error','Relative uncertainty only'],a:0,e:'A persistent zero offset produces a systematic error.'},{q:'Parallax error can be reduced by:',o:['Keeping the eye perpendicular to the scale at the reading position','Changing kilograms to grams','Taking only one reading','Increasing the numerical value'],a:0,e:'Correct eye alignment with the scale reduces parallax error.'},{q:'If measured values are 9.8 cm, 10.0 cm and 10.2 cm, their mean is:',o:['9.8 cm','10.0 cm','10.2 cm','30.0 cm'],a:1,e:'Mean = (9.8 + 10.0 + 10.2)/3 = 10.0 cm.'},{q:'If the mean measured value is 10.0 cm and one reading is 10.2 cm, its absolute error relative to the mean is:',o:['0.02 cm','0.2 cm','2 cm','20 cm'],a:1,e:'Absolute error = |10.2 − 10.0| = 0.2 cm.'},{q:'Which statement is correct about accuracy and error?',o:['Smaller systematic error generally means greater accuracy','Larger error means greater accuracy','Accuracy and error are identical quantities','Random error is always zero'],a:0,e:'Reducing systematic error generally improves accuracy, while precision concerns repeatability.'}];let i=0,sel=-1,done=0,points=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;sel=-1;const a=quiz[i];$('count').textContent=`Question ${i+1} of ${quiz.length}`;$('q').textContent=a.q;$('opts').innerHTML='';$('fb').textContent='';$('fb').className='feedback';$('next').disabled=true;quiz[i].o.forEach((v,j)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+j)+'. '+v;b.onclick=()=>{if(answered)return;sel=j;[...$('opts').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('opts').appendChild(b)});$('fill').style.width=`${done/quiz.length*100}%`;$('mt').textContent=`${done} / ${quiz.length}`}function grade(){if(sel<0){$('fb').className='feedback';$('fb').textContent='Choose an answer first 👆';return}answered=true;const a=quiz[i],ok=sel===a.a;[...$('opts').children].forEach((b,j)=>{b.disabled=true;if(j===a.a)b.classList.add('correct');if(j===sel&&j!==a.a)b.classList.add('wrong')});if(ok){done++;points+=10;$('xp').textContent=points;$('fb').className='feedback';$('fb').textContent='✅ Correct! +10 XP — '+a.e}else{$('fb').className='feedback';$('fb').textContent='❌ Not quite. Correct answer: '+a.o[a.a]+' — '+a.e}$('mt').textContent=`${done} / ${quiz.length}`;$('fill').style.width=`${done/quiz.length*100}%`;$('next').disabled=false;$('next').textContent=i===quiz.length-1?'Finish →':'Continue →'}function advance(){if(i<quiz.length-1){i++;render()}else{$('fill').style.width='100%';$('mt').textContent=`${done} / ${quiz.length}`;$('q').textContent='🎉 Errors in Measurement mastered!';$('opts').innerHTML='';$('fb').textContent=`You scored ${points} XP out of ${quiz.length*10} XP.`;$('next').style.display='none';$('result').style.display='block';$('score').textContent=`${done} / ${quiz.length} correct • ${points} XP`}}$('next').onclick=advance;document.addEventListener('click',e=>{if(e.target&&e.target.id==='check')grade()});const check=document.createElement('button');check.id='check';check.className='next';check.textContent='Check Answer';$('opts').insertAdjacentElement('afterend',check);check.onclick=grade;$('retry').onclick=()=>{i=0;sel=-1;done=0;points=0;$('xp').textContent='0';$('result').style.display='none';$('next').style.display='';render()};render();</script></body></html>
