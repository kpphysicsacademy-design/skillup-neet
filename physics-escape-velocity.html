<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Escape Velocity</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f9;color:#17202a;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 16px 40px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1{font-size:26px;margin:0}.xp{font-weight:700;color:#16803c}.sub{color:#64748b;margin:8px 0 18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 14px #0000000d}.bar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#22c55e;transition:.25s}.qno{color:#64748b;font-size:14px}.question{font-size:20px;font-weight:700;line-height:1.45;margin:10px 0 16px}.opts{display:grid;gap:10px}.opts button{border:2px solid #dbe2e8;background:#fff;border-radius:12px;padding:13px;text-align:left;font-size:16px;cursor:pointer;transition:.15s}.opts button:hover{transform:translateY(-1px);border-color:#22c55e}.selected{border-color:#22c55e!important;background:#f0fdf4!important}.correct{border-color:#16a34a!important;background:#dcfce7!important}.wrong{border-color:#ef4444!important;background:#fee2e2!important}.action{width:100%;border:0;border-radius:12px;padding:14px;margin-top:16px;background:#22c55e;color:#fff;font-size:17px;font-weight:700;cursor:pointer}.feedback{min-height:24px;margin-top:14px;font-weight:700}.back{display:inline-block;text-decoration:none;color:#166534;border:2px solid #bbf7d0;padding:11px 16px;border-radius:12px;font-weight:700}.result{text-align:center}@media(max-width:520px){.head h1{font-size:22px}.question{font-size:18px}}</style></head><body><main class="wrap"><div class="head"><h1>🚀 Escape Velocity</h1><div class="xp" id="xp">+0 XP</div></div><p class="sub">Escape speed, gravitational potential, planetary mass and radius, and motion beyond a planet’s gravitational influence.</p><section class="card"><b>🎯 Skill Mastery <span id="score">0 / 15</span></b><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card" id="quiz"></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>const quiz=[['Escape velocity from the surface of a planet is the minimum speed required to:', ['reach the centre of the planet','escape its gravitational field without further propulsion','orbit the planet in a circle','stop the planet’s rotation'],1,'Escape velocity is the minimum launch speed for which the object can reach infinity with zero residual speed, neglecting atmosphere and other effects.'],['Escape velocity from a planet of mass M and radius R is:', ['√(GM/R)','√(2GM/R)','2GM/R','GM/R²'],1,'Equating initial kinetic energy to the gravitational binding energy gives vₑ=√(2GM/R).'],['Escape velocity is independent of the:', ['mass of the planet','radius of the planet','mass of the escaping object','value of G'],2,'The escaping object’s mass cancels from the energy equation.'],['For Earth, the escape velocity at the surface is approximately:', ['1.12 km/s','11.2 km/s','112 km/s','0.112 km/s'],1,'Earth’s surface escape speed is about 11.2 km/s.'],['If the radius of a planet is doubled while its mass remains unchanged, escape velocity becomes:', ['double','half','1/√2 times','√2 times'],2,'Since vₑ∝1/√R, doubling R reduces escape speed by √2.'],['If the mass of a planet is quadrupled with the radius unchanged, escape velocity becomes:', ['twice','half','four times','unchanged'],0,'Since vₑ∝√M, four times the mass gives twice the escape speed.'],['The escape velocity from a planet is related to surface gravitational acceleration g by:', ['√(gR)','gR','√(2gR)','2g/R'],2,'Using g=GM/R² gives vₑ=√(2gR).'],['An object projected with exactly escape velocity reaches infinity with speed:', ['equal to escape velocity','zero','infinite','the speed of light'],1,'In the ideal case, its kinetic energy is just enough to make total mechanical energy zero.'],['Escape velocity is greater than circular orbital velocity at the same radius by a factor of:', ['1/2','1','√2','2'],2,'vₑ=√(2GM/R), while v_orbit=√(GM/R), so the ratio is √2.'],['At a height h above Earth, the escape velocity is:', ['√(2GM/(R+h))','√(2GM/R) always','2GM(R+h)','√(GM(R+h))'],0,'The distance from Earth’s centre is R+h, so vₑ=√[2GM/(R+h)].'],['A planet has the same density as Earth but twice Earth’s radius. Its escape velocity is:', ['same as Earth','√2 times Earth','2 times Earth','4 times Earth'],2,'For equal density, M∝R³, so vₑ∝√(M/R)∝R; doubling R doubles escape velocity.'],['The total mechanical energy of an object just escaping to infinity is:', ['positive','negative','zero','infinite'],2,'At infinity both kinetic energy (for limiting escape) and potential energy are zero, so total energy is zero.'],['Which quantity determines whether a launch speed is sufficient for escape in an ideal two-body system?', ['only the object’s mass','the local escape speed','only the object’s shape','only atmospheric pressure'],1,'The launch speed must meet or exceed the escape speed at the launch point.'],['If a planet has escape velocity 10 km/s, an object launched at 5 km/s from its surface will:', ['escape','remain gravitationally bound','move at 10 km/s eventually without force','have zero gravitational potential energy at launch'],1,'A speed below escape velocity leaves the object gravitationally bound in the ideal model.'],['The escape velocity from the Moon is much smaller than Earth’s mainly because the Moon has:', ['larger radius and greater mass','smaller mass relative to its radius','no gravitational field','a faster rotation that cancels gravity'],1,'Escape speed depends on √(M/R); the Moon’s much smaller mass gives a much lower value.']];let i=0,selected=null,correct=0,checked=false;const $=id=>document.getElementById(id);function render(){checked=false;selected=null;const q=quiz[i];$('quiz').innerHTML='<div class="qno">Question '+(i+1)+' of 15</div><div class="question">'+q[0]+'</div><div class="opts" id="opts"></div><button class="action" id="action">Continue →</button><div class="feedback" id="feedback"></div>';const order=q[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((x,j)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{if(checked)return;selected=x.index;[...$('opts').children].forEach(y=>y.classList.remove('selected'));b.classList.add('selected')};$('opts').appendChild(b)});$('action').onclick=check;update()}function check(){if(selected===null){$('feedback').textContent='Choose an answer first.';return}if(!checked){checked=true;const q=quiz[i],ok=selected===q[2];if(ok)correct++;[...$('opts').children].forEach(b=>{const n=Number(b.dataset.index);b.disabled=true;if(n===q[2])b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=(ok?'🎉 Correct! +10 XP — ':'💡 Not quite. ')+q[3];$('action').textContent=i===14?'Finish Skill →':'Continue →';update();return}if(i<14){i++;render()}else finish()}function update(){$('score').textContent=correct+' / 15';$('fill').style.width=(correct/15*100)+'%';$('xp').textContent='+'+(correct*10)+' XP'}function finish(){const p=Math.round(correct/15*100);$('quiz').innerHTML='<div class="result"><h2>🏆 Skill Complete!</h2><p>You scored <strong>'+correct+' / 15</strong> ('+p+'%).</p><p>⭐ XP earned: <strong>'+correct*10+'</strong></p><button class="action" onclick="i=0;correct=0;render()">Retry Skill</button></div>';update()}$('back').onclick=function(){const s=sessionStorage.getItem('skillupLastPhysicsPath');if(s){try{const u=new URL(s,location.href);if(u.origin===location.origin){location.href=s;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();</script></body></html>
