<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SkillUp Physics | Experimental Uncertainty</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.opt.selected{border-color:#5146a5;background:#f4f1ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.opt:disabled{cursor:default}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>⚠️ Experimental Uncertainty</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="action">CHECK</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['Experimental uncertainty describes:',['The doubt or range associated with a measured value','The colour of an instrument','The exact value of a quantity','Only a calculation error'],0,'Every measurement has limited precision, so uncertainty describes the range or doubt associated with the result.'],['Random uncertainty mainly causes:',['The same shift in every reading','Scatter between repeated measurements','A change of unit','Perfect agreement'],1,'Random effects cause repeated readings to vary around a central value.'],['A systematic error tends to:',['Change randomly from reading to reading','Produce a consistent bias in one direction','Disappear by taking one reading','Change the unit'],1,'Systematic errors can shift measurements consistently and are not removed simply by averaging.'],['Taking repeated measurements can help reduce the effect of:',['Random uncertainty','All systematic errors','Incorrect units','A zero correction'],0,'Repeated measurements and averaging can reduce the effect of random variation.'],['The mean of repeated measurements is useful because it:',['Provides a representative central value','Always removes systematic error','Makes uncertainty zero','Changes the physical quantity'],0,'The mean gives a representative central value when repeated measurements vary randomly.'],['If a ruler has a smallest division of 1 mm, its resolution is:',['1 cm','1 mm','10 mm','0.1 m'],1,'The smallest readable division is 1 mm, so the instrument resolution is 1 mm.'],['For an analogue instrument, a commonly used estimate of reading uncertainty is related to:',['The smallest scale division','The colour of the scale','The number of experiments only','The mass of the instrument'],0,'The smallest scale division helps determine the precision and estimated reading uncertainty.'],['If a measurement is recorded as 5.20 cm, the final zero indicates:',['No precision information','Recorded precision to the hundredth of a centimetre','The value is exactly 5 cm','The unit is metres'],1,'5.20 cm communicates precision to 0.01 cm.'],['Percentage uncertainty is calculated as:',['Absolute uncertainty × measured value ×100','Absolute uncertainty / measured value ×100','Measured value / uncertainty','Measured value + uncertainty'],1,'Percentage uncertainty = (absolute uncertainty / measured value) × 100.'],['A measured length is 20.0 cm with an absolute uncertainty of 0.5 cm. The percentage uncertainty is:',['0.25%','2.5%','5%','25%'],1,'(0.5/20.0)×100=2.5%.'],['If x=10.0±0.2 units, the absolute uncertainty is:',['0.02 units','0.2 units','2 units','10.2 units'],1,'The ± value directly gives the absolute uncertainty: 0.2 units.'],['When adding measured quantities, absolute uncertainties are generally:',['Added','Multiplied','Divided','Ignored'],0,'For sums and differences, absolute uncertainties are generally added.'],['When multiplying or dividing measured quantities, it is commonly useful to combine:',['Percentage or fractional uncertainties','Only the units','Only the central values','Colours'],0,'For products and quotients, fractional or percentage uncertainties are commonly combined.'],['Which action can help identify a systematic zero error?',['Checking the instrument before measurement','Taking a random guess','Changing the answer after calculation','Ignoring the instrument scale'],0,'Checking an instrument for zero offset can reveal systematic zero error before measurements are taken.'],['A result should normally be reported with uncertainty so that it:',['Communicates the precision and reliability of the measurement','Looks more complicated','Eliminates all errors','Avoids using units'],0,'Reporting uncertainty communicates the precision of the measured result and the range within which the true value may reasonably lie.']];let i=0,score=0,answered=false,selected=-1;const $=x=>document.getElementById(x);function render(){answered=false;selected=-1;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q[1].map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('action').classList.remove('hide');$('action').textContent='CHECK'});$('xp').textContent='';$('action').classList.add('hide');$('action').disabled=false;}$('action').onclick=()=>{if(selected<0)return;if(!answered){answered=true;const q=qs[i],ok=selected===q[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===selected&&!ok)b.classList.add('wrong')});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[3];if(ok)score++;$('score').textContent=`XP ${score}`;$('fill').style.width=`${(i+1)/15*100}%`;$('action').textContent=i===14?'FINISH':'Next Question →';return;}if(i<14){i++;render()}else{$('quiz').innerHTML='';$('action').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}};render();</script></body></html>
