<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | External Force and Centre of Mass</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-size:1.55rem;font-weight:900}.subtitle{color:#5f6b7a;margin:0 0 18px}.xp,.card{background:#fff;border-radius:20px;box-shadow:0 6px 20px #17203312}.xp{padding:10px 15px;font-weight:850}.card{padding:20px;margin:12px 0}.ph{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:11px;background:#dfe8f1;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.25s}.qnum{font-weight:800;color:#35516f;margin-bottom:11px}.question{font-size:1.27rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#58cc02;background:#f7fff1;transform:translateY(-1px)}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;background:#2db84d;color:#fff;font-weight:850;cursor:pointer;box-shadow:0 4px 0 #21863a}.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}.feedback{margin-top:14px;padding:12px;border-radius:13px;font-weight:700;min-height:18px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:10px;padding:10px 13px;border:2px solid #d9d4f5;border-radius:13px;color:#5146a5;font-weight:800;text-decoration:none;transition:.12s}.back:hover{background:#f0edff;transform:translateX(-2px)}@media(max-width:600px){.wrap{padding:20px 14px}.title{font-size:1.35rem}.question{font-size:1.12rem}}</style></head><body><main class="wrap"><div class="top"><div class="title">🌐 External Force & Centre of Mass</div><div class="xp">⚡ <span id="xp">0</span> XP</div></div><p class="subtitle">Physics • NEET 2026 · Learn → Practice → Master</p><section class="card"><div class="ph"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><button class="btn" id="continue">Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const quiz=[['The acceleration of the centre of mass of a system is determined by:', ['net external force and total mass','internal force only','largest particle acceleration only','total internal force only'],0,'a_CM = F_ext/M. Internal forces do not determine the CM acceleration.'],['If the net external force on a system is zero, its centre of mass:', ['moves with constant velocity','must have zero velocity','must move in a circle','has increasing acceleration'],0,'Zero net external force gives zero CM acceleration.'],['The correct centre-of-mass equation is:', ['M a_CM = F_ext','M a_CM = F_int','M V_CM = F_ext','F_CM = M/V_CM'],0,'The total external force equals total mass times CM acceleration.'],['For an isolated system, internal forces:', ['cancel in the total force equation','always accelerate the CM','change total momentum','are larger than external forces'],0,'Newton’s third-law pairs cancel when the forces are summed over the complete system.'],['A 4 kg system experiences a net external force of 12 N. Its CM acceleration is:', ['3 m/s²','48 m/s²','1/3 m/s²','16 m/s²'],0,'a_CM = 12/4 = 3 m/s².'],['If the net external force is doubled while total mass remains constant, CM acceleration:', ['doubles','halves','becomes zero','is unchanged'],0,'Acceleration is directly proportional to net external force.'],['If total mass is doubled while the same external force acts, CM acceleration:', ['halves','doubles','is unchanged','becomes four times'],0,'a_CM = F_ext/M, so doubling M halves acceleration.'],['For a system of particles, the resultant external force can change:', ['the total momentum and CM velocity','only internal energies','only the shape','neither momentum nor CM velocity'],0,'External force changes total momentum and therefore CM velocity.'],['A person jumps from a boat on initially still water. Neglecting external horizontal force, the horizontal CM of the person-boat system:', ['remains at rest','moves with the person','moves with the boat','accelerates in the jump direction'],0,'No external horizontal force means horizontal CM momentum and velocity remain unchanged.'],['During an internal explosion with negligible external impulse, the total momentum:', ['remains unchanged','becomes zero always','doubles','depends on fragment masses only'],0,'Internal impulses cancel, so total momentum is conserved.'],['In a uniform gravitational field, the external force on a system of mass M is:', ['Mg downward','zero','M/g downward','g/M downward'],0,'The resultant gravitational force is Mg downward.'],['Therefore, in a uniform gravitational field, the CM acceleration is:', ['g downward','zero','M g downward','g/M downward'],0,'Since F_ext = Mg, a_CM = F_ext/M = g downward.'],['If an external impulse acts on a system, the change in CM momentum equals:', ['the external impulse','the internal impulse','zero always','the system kinetic energy'],0,'Impulse-momentum gives ΔP_total = J_ext.'],['A force acts through the centre of mass of a rigid body. Its direct effect on translation is:', ['it produces CM acceleration according to F/M','it produces no translation','it changes only internal forces','it makes mass change'],0,'The net external force determines translational acceleration of the CM.'],['Which statement best describes centre-of-mass motion?', ['It is governed by the net external force','It is governed only by internal forces','It always stays at the geometric centre','It cannot accelerate'],0,'The CM follows M a_CM = F_ext, regardless of internal interactions.']];let i=0,selected=-1,checked=false,score=0;const $=id=>document.getElementById(id),o=$("options"),b=$("continue"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;$("count").textContent='Question '+(i+1)+' of 15';$("question").textContent=a[0];o.innerHTML='';f.className='feedback';f.textContent='';b.style.display='inline-block';b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const el=document.createElement('button');el.className='option';el.textContent=String.fromCharCode(65+j)+'. '+item.text;el.dataset.index=item.index;el.onclick=()=>{selected=item.index;[...o.children].forEach(z=>z.classList.remove('selected'));el.classList.add('selected')};o.appendChild(el)})}b.onclick=()=>{if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(el=>{const n=Number(el.dataset.index);el.disabled=true;if(n===a[2])el.classList.add('correct');if(n===selected&&!ok)el.classList.add('wrong')});if(ok)score++;f.className=ok?'feedback good':'feedback bad';f.textContent=(ok?'🎯 Correct! +10 XP — ':'✗ Review — Correct answer: '+a[1][a[2]]+'. ')+a[3];$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$("question").textContent='🏆 External Force & Centre of Mass Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
