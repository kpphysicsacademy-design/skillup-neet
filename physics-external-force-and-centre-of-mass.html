<style>
:root{--green:#58cc02;--green-dark:#46a302;--blue:#1cb0f6;--ink:#243447;--muted:#64748b;--line:#dce6ef;--bg:#f3f9ff;--red:#ff4b4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.nav{max-width:720px;margin:auto;min-height:58px;padding:9px 14px;display:flex;align-items:center;gap:10px}
.back{display:grid;place-items:center;width:40px;height:40px;border:2px solid var(--line);border-radius:13px;background:#f2f9ff;color:#174a78;text-decoration:none;font-size:20px}
.brand{font-weight:950;color:#174a78}.brand small{display:block;font-size:9px;letter-spacing:.8px;color:var(--muted)}
.xp{margin-left:auto;background:#fff4cf;border:1px solid #f4df9a;border-radius:99px;padding:7px 10px;font-weight:900;font-size:13px}
main{max-width:720px;margin:auto;padding:18px 13px 48px}
.hero,.quiz,.finish{background:#fff;border:2px solid #e2edf7;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 #dce8f3}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#174a78}.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}
.progress-row{display:flex;justify-content:space-between;gap:10px;margin:16px 0 7px;font-size:12px;font-weight:900;color:var(--muted)}
.track{height:11px;border-radius:99px;background:#e2edf7;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}
.qmeta{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.4px}
.question{font-size:clamp(20px,4.5vw,26px);line-height:1.35;margin:12px 0 18px;font-weight:850}
.options{display:grid;gap:10px}.option{display:flex;gap:11px;align-items:center;width:100%;min-height:51px;padding:12px;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}
.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Mobile header refinement: keep branding, XP and streak on one balanced row */

  .nav{gap:7px;padding:9px 10px;min-height:68px}

  .brand small{font-size:8px;letter-spacing:.55px}

}

  .xp{padding:7px;font-size:11px}
  .streak{padding:7px;font-size:10px}
}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🧲 External Force and Centre of Mass</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
  {
    "q": "The net external force on a system is related to its total momentum by:",
    "o": [
      "Fext = P × t",
      "Fext = total mass",
      "Fext = centre-of-mass position",
      "Fext = dP/dt"
    ],
    "a": 3,
    "e": "The net external force equals the time rate of change of total system momentum."
  },
  {
    "q": "For a system of constant total mass M, the centre-of-mass acceleration is:",
    "o": [
      "aCM = Fext/M",
      "aCM = MFext",
      "aCM = M/Fext",
      "aCM = zero in every case"
    ],
    "a": 0,
    "e": "The centre of mass follows M aCM = Fext, using the net external force."
  },
  {
    "q": "If the net external force on a system is zero, its centre of mass moves with:",
    "o": [
      "Zero velocity in every case",
      "Constant velocity",
      "Constant acceleration of 1 m/s²",
      "Increasing speed always"
    ],
    "a": 1,
    "e": "Zero external force means total momentum and centre-of-mass velocity remain constant for constant mass."
  },
  {
    "q": "Internal forces within a system can:",
    "o": [
      "Always move the centre of mass faster",
      "Never change particle velocities",
      "Change individual motions but not the total momentum by themselves",
      "Change total momentum without external force"
    ],
    "a": 2,
    "e": "Internal forces cancel in the total system force; only external force changes total momentum."
  },
  {
    "q": "A 4 kg system experiences a net external force of 12 N. Its centre-of-mass acceleration is:",
    "o": [
      "48 m/s²",
      "8 m/s²",
      "0.33 m/s²",
      "3 m/s²"
    ],
    "a": 3,
    "e": "aCM = Fext/M = 12/4 = 3 m/s²."
  },
  {
    "q": "A 2 kg and 3 kg pair has total momentum 20 kg·m/s. Their centre-of-mass velocity is:",
    "o": [
      "4 m/s",
      "10 m/s",
      "20 m/s",
      "5 m/s"
    ],
    "a": 0,
    "e": "Vcm = Ptotal/Mtotal = 20/(2+3) = 4 m/s."
  },
  {
    "q": "A system's centre of mass is at rest. Its total momentum is:",
    "o": [
      "Equal to external force",
      "Zero",
      "Equal to total mass",
      "Always increasing"
    ],
    "a": 1,
    "e": "Ptotal = M Vcm, so Vcm = 0 gives zero total momentum."
  },
  {
    "q": "A net external force of 6 N acts on a 3 kg system for 2 s from rest. Its centre-of-mass speed after 2 s is:",
    "o": [
      "6 m/s",
      "12 m/s",
      "4 m/s",
      "2 m/s"
    ],
    "a": 2,
    "e": "aCM = 6/3 = 2 m/s²; starting from rest, vCM = at = 2×2 = 4 m/s."
  },
  {
    "q": "Which forces determine the acceleration of the centre of mass?",
    "o": [
      "Internal forces only",
      "Only the heaviest particle's forces",
      "Only gravitational forces in every situation",
      "Net external forces"
    ],
    "a": 3,
    "e": "The centre-of-mass motion is determined by the net external force on the complete system."
  },
  {
    "q": "A person walks inside a boat floating freely on still water. With negligible horizontal external force, the centre of mass of the person-boat system:",
    "o": [
      "Remains at the same horizontal position",
      "Moves with the person alone",
      "Must move in the person's direction",
      "Accelerates continuously"
    ],
    "a": 0,
    "e": "Internal walking forces redistribute positions, but the system centre of mass stays fixed horizontally without external force."
  },
  {
    "q": "A 5 kg system has external force 15 N to the right. The centre-of-mass acceleration is:",
    "o": [
      "0 m/s²",
      "3 m/s² to the right",
      "75 m/s² to the right",
      "3 m/s² to the left"
    ],
    "a": 1,
    "e": "aCM = Fext/M = 15/5 = 3 m/s² to the right."
  },
  {
    "q": "A firework explodes in mid-air. Neglecting air resistance during the brief explosion, the centre of mass follows:",
    "o": [
      "A sudden jump in velocity due to the explosion",
      "A path that must stop at the explosion point",
      "The same trajectory it would follow under gravity alone",
      "A path determined only by the fragments' internal forces"
    ],
    "a": 2,
    "e": "The explosion forces are internal; external gravity determines centre-of-mass acceleration."
  },
  {
    "q": "If the only external force on a projectile system is gravity, its centre of mass has vertical acceleration:",
    "o": [
      "Zero",
      "g upward",
      "Dependent on internal forces only",
      "g downward"
    ],
    "a": 3,
    "e": "Gravity is the net external force, so the centre of mass accelerates downward at g."
  },
  {
    "q": "A 2 kg system accelerates at 5 m/s². The net external force magnitude is:",
    "o": [
      "10 N",
      "2.5 N",
      "7 N",
      "0.4 N"
    ],
    "a": 0,
    "e": "Fext = M aCM = 2×5 = 10 N."
  },
  {
    "q": "A system's total momentum changes from 6 to 18 kg·m/s in 3 s. Its average net external force is:",
    "o": [
      "6 N",
      "4 N",
      "8 N",
      "12 N"
    ],
    "a": 1,
    "e": "Favg = ΔP/Δt = (18−6)/3 = 4 N."
  },
  {
    "q": "When a system's net external force is zero, internal explosions can make the centre of mass:",
    "o": [
      "Instantly reverse velocity",
      "Always come to rest",
      "Continue at constant velocity",
      "Accelerate due to internal forces alone"
    ],
    "a": 2,
    "e": "Internal forces cannot change total momentum, so the centre-of-mass velocity stays constant."
  },
  {
    "q": "Two particles of masses 1 kg and 3 kg have velocities +8 m/s and 0 m/s. The centre-of-mass velocity is:",
    "o": [
      "8 m/s",
      "6 m/s",
      "4 m/s",
      "2 m/s"
    ],
    "a": 3,
    "e": "Vcm = (1×8 + 3×0)/(1+3) = 2 m/s."
  },
  {
    "q": "A 2 kg particle moves right at 4 m/s and a 2 kg particle moves left at 2 m/s. The centre-of-mass velocity (right positive) is:",
    "o": [
      "1 m/s right",
      "3 m/s right",
      "1 m/s left",
      "2 m/s left"
    ],
    "a": 0,
    "e": "Vcm = [2×4 + 2×(−2)]/4 = 1 m/s right."
  },
  {
    "q": "A 10 kg system has zero net external force. If its centre of mass initially moves at 3 m/s, after 5 s its velocity is:",
    "o": [
      "5 m/s",
      "3 m/s",
      "0 m/s",
      "15 m/s"
    ],
    "a": 1,
    "e": "With no net external force, centre-of-mass velocity remains constant."
  },
  {
    "q": "Which statement about the centre of mass is correct?",
    "o": [
      "It is always at the geometric centre",
      "It depends only on the object's shape, never mass distribution",
      "Its motion depends on the net external force",
      "It always lies inside the material of an object"
    ],
    "a": 2,
    "e": "Centre-of-mass motion follows the net external force; its position depends on mass distribution."
  },
  {
    "q": "A 6 kg system is acted on by 18 N east and 6 N west. Its centre-of-mass acceleration is:",
    "o": [
      "4 m/s² east",
      "3 m/s² west",
      "0 m/s²",
      "2 m/s² east"
    ],
    "a": 3,
    "e": "Net force = 18−6 = 12 N east; aCM = 12/6 = 2 m/s² east."
  },
  {
    "q": "A system has total mass 8 kg and centre-of-mass velocity −2 m/s. Its total momentum is:",
    "o": [
      "−16 kg·m/s",
      "+16 kg·m/s",
      "−4 kg·m/s",
      "+4 kg·m/s"
    ],
    "a": 0,
    "e": "Ptotal = M Vcm = 8×(−2) = −16 kg·m/s."
  },
  {
    "q": "A 4 kg system starts from rest and experiences a constant 8 N external force for 3 s. Its centre-of-mass displacement is:",
    "o": [
      "18 m",
      "9 m",
      "6 m",
      "12 m"
    ],
    "a": 1,
    "e": "aCM = 8/4 = 2 m/s²; displacement from rest = ½at² = ½×2×9 = 9 m."
  },
  {
    "q": "If external force acts only in the horizontal direction, the vertical centre-of-mass momentum:",
    "o": [
      "Must be zero",
      "Always reverses",
      "Remains constant if net external vertical force is zero",
      "Must increase"
    ],
    "a": 2,
    "e": "Momentum components are conserved independently when the corresponding external force component is zero."
  },
  {
    "q": "A system has net external force 20 N and total mass 10 kg. If its centre of mass moves at 4 m/s initially, its acceleration is:",
    "o": [
      "4 m/s²",
      "40 m/s²",
      "0.5 m/s²",
      "2 m/s²"
    ],
    "a": 3,
    "e": "Acceleration depends on force and mass: aCM = 20/10 = 2 m/s²."
  },
  {
    "q": "During a collision with negligible external impulse, the centre-of-mass velocity of the colliding system:",
    "o": [
      "Remains constant",
      "Must become zero",
      "Must double",
      "Depends only on kinetic energy loss"
    ],
    "a": 0,
    "e": "Negligible external impulse means total momentum, and thus centre-of-mass velocity for constant mass, is conserved."
  },
  {
    "q": "A 3 kg and 1 kg system has velocities 2 m/s and 8 m/s in the same direction. Its centre-of-mass velocity is:",
    "o": [
      "2.5 m/s",
      "3.5 m/s",
      "5 m/s",
      "10 m/s"
    ],
    "a": 1,
    "e": "Vcm = (3×2 + 1×8)/(3+1) = 14/4 = 3.5 m/s."
  },
  {
    "q": "A 2 kg system has centre-of-mass acceleration 0.5 m/s² west. The net external force is:",
    "o": [
      "0.25 N west",
      "2.5 N west",
      "1 N west",
      "4 N west"
    ],
    "a": 2,
    "e": "Fext = M aCM = 2×0.5 = 1 N west."
  },
  {
    "q": "Why can the centre of mass of an exploding object follow a smooth path while fragments scatter?",
    "o": [
      "Fragments have no momentum",
      "Gravity stops acting during explosions",
      "The centre of mass is always fixed",
      "Internal forces cancel in the system total, leaving external forces to govern centre-of-mass motion"
    ],
    "a": 3,
    "e": "The explosion redistributes momentum internally; the centre-of-mass trajectory is set by net external force."
  },
  {
    "q": "For a constant-mass system, if total momentum doubles in the same direction, centre-of-mass velocity:",
    "o": [
      "Doubles in the same direction",
      "Halves",
      "Remains unchanged",
      "Must become zero"
    ],
    "a": 0,
    "e": "Since Ptotal = M Vcm and M is constant, doubling momentum doubles centre-of-mass velocity."
  }
];
let index=0,score=0,streak=0,chosen=null,locked=false;
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Nice work!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><button class="btn" id="retry">Practice again</button>';
 $('finishSlot').replaceChildren(card);$('retry').addEventListener('click',()=>{index=0;score=0;streak=0;$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
