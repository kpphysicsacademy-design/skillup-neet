<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>First Law of Thermodynamics Quiz | SkillUp Physics</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--accent:#635bff;--ok:#16a34a;--bad:#dc2626;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:850px;margin:auto;padding:18px}.hero{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 8px 30px #0000000b}.tag{display:inline-block;padding:7px 12px;border-radius:999px;background:#eeecff;color:#4b43c8;font-weight:800;font-size:13px}.hero h1{margin:14px 0 6px;font-size:clamp(28px,5vw,40px)}.hero p{color:var(--muted);line-height:1.6}.formula{text-align:center;font-size:30px;font-weight:900;padding:16px;border-radius:18px;background:#f0f4ff;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;text-align:center}.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:var(--muted)}.bar{height:10px;background:#e8edf5;border-radius:99px;overflow:hidden;margin:10px 0 18px}.fill{height:100%;width:0;background:var(--accent);transition:.25s}.q{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0}.q h2{font-size:18px;line-height:1.5;margin:0 0 15px}.options{display:grid;gap:10px}.option{border:1px solid #dfe4ec;border-radius:14px;background:#fff;color:#000;padding:14px;text-align:left;font-size:15px;font-weight:600;cursor:pointer}.option:hover{border-color:#aaa4ff;transform:translateY(-1px)}.option:disabled{color:#000;opacity:1}.option.correct{background:#ecfdf3;border-color:var(--ok);color:#000}.option.wrong{background:#fef2f2;border-color:var(--bad);color:#000}.feedback{display:none;margin-top:12px;padding:12px;border-radius:12px;background:#f8fafc;color:#475467;line-height:1.55}.q.done .feedback{display:block}.hint{margin-top:12px}.hint summary{cursor:pointer;color:#4b43c8;font-weight:700}.result{display:none;background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;text-align:center;margin-top:18px}.result h2{margin-top:0}.big{font-size:38px;font-weight:900}.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;margin-top:12px;font-weight:800;cursor:pointer}.retry{background:#111827;color:#fff}.back{background:#172033;color:#fff;text-decoration:none}.hidden{display:none}@media(max-width:600px){.wrap{padding:10px}.hero,.q,.result{padding:16px;border-radius:18px}.stats{gap:6px}.stat{padding:10px 4px}.q h2{font-size:16px}.option{padding:13px}.formula{font-size:25px}}</style></head><body><main class="wrap"><section class="hero"><span class="tag">🔥 THERMODYNAMICS → FIRST LAW</span><h1>First Law of Thermodynamics Quiz</h1><p>Master conservation of energy in thermodynamic processes, internal energy, heat, work, sign convention and applications of the first law.</p><div class="formula">ΔQ = ΔU + W</div></section><div class="stats"><div class="stat"><b id="score">0</b><span>Correct</span></div><div class="stat"><b id="xp">0</b><span>XP</span></div><div class="stat"><b id="done">0/15</b><span>Progress</span></div></div><div class="bar"><div class="fill" id="fill"></div></div><section id="quiz"></section><section class="result" id="result"><h2>🎉 Quiz Complete!</h2><div class="big" id="final">0/15</div><p id="message"></p><button class="btn retry" onclick="location.reload()">↻ Retry Quiz</button><a class="btn back" href="physics-thermodynamics.html">← Back to Thermodynamics</a></section></main><script>const qs=[
['The first law of thermodynamics is a statement of:', ['Conservation of energy','Conservation of mass only','Newton’s second law','Conservation of momentum only'],0,'The first law applies conservation of energy to thermodynamic systems.','Think about how heat, work and internal energy are related.'],
['Using the convention W is work done by the gas, the first law is:', ['ΔQ = ΔU + W','ΔQ = W − ΔU','ΔU = ΔQ + W','W = ΔQ + ΔU'],0,'With work done by the system taken as positive, heat supplied equals increase in internal energy plus work done by the gas.','Use the convention stated in the question.'],
['If no heat is exchanged with the surroundings, the process is:', ['Adiabatic','Isothermal','Isochoric','Isobaric'],0,'An adiabatic process has Q = 0.','No heat transfer means Q is zero.'],
['For an adiabatic expansion of an ideal gas, if W is positive, then:', ['ΔU = −W','ΔU = W','ΔU = 0','ΔU = 2W'],0,'For Q = 0, the first law gives 0 = ΔU + W, so ΔU = −W.','Put Q = 0 into ΔQ = ΔU + W.'],
['In an isochoric process, the work done by an ideal gas is:', ['Zero','Maximum','Negative always','Equal to ΔU'],0,'At constant volume, ΔV = 0, so boundary work W = ∫P dV is zero.','Work depends on change in volume.'],
['For a cyclic thermodynamic process, the change in internal energy is:', ['Zero','Always positive','Always negative','Equal to the work done'],0,'Internal energy is a state function, so it returns to its initial value after a complete cycle.','Compare the initial and final states of the cycle.'],
['For an ideal gas, internal energy depends primarily on:', ['Temperature','Pressure only','Volume only','Path followed'],0,'For an ideal gas, internal energy is a function of temperature only.','Internal energy is a state function; for an ideal gas, T determines it.'],
['In an isobaric expansion, the work done by the gas is:', ['P(V₂ − V₁)','V(P₂ − P₁)','P/V','Zero'],0,'At constant pressure, W = PΔV = P(V₂ − V₁).','Use the area under the P–V curve for constant pressure.'],
['If a system absorbs 500 J of heat and does 200 J of work, its change in internal energy is:', ['300 J','700 J','−300 J','−700 J'],0,'Using ΔQ = ΔU + W: ΔU = 500 − 200 = 300 J.','Rearrange the first law for ΔU.'],
['If 400 J of work is done on a system and no heat is supplied, the change in internal energy is:', ['400 J','−400 J','0 J','800 J'],0,'Work done on the system increases its internal energy by 400 J when Q = 0.','Be careful: the formula uses work done by the gas.'],
['During an isothermal process for an ideal gas, the change in internal energy is:', ['Zero','Positive','Negative','Equal to pressure'],0,'For an ideal gas, U depends only on temperature; constant temperature means ΔU = 0.','Isothermal means temperature remains constant.'],
['For an isothermal expansion of an ideal gas, the heat supplied is:', ['Equal to the work done by the gas','Zero','Equal to −work done','Always negative'],0,'Since ΔU = 0, the first law gives Q = W.','Set ΔU = 0 in the first law.'],
['The work done by a gas during expansion is represented on a P–V diagram by:', ['Area under the process curve','Slope of the curve only','Area above the curve only','Change in pressure only'],0,'For quasi-static boundary work, W = ∫P dV, the area under the P–V path.','Recall the integral of P with respect to V.'],
['Which quantity is a state function?', ['Internal energy','Heat','Work','Path length'],0,'Internal energy depends only on the state, while heat and work depend on the path.','Ask whether the quantity depends only on initial and final states.'],
['A gas is compressed adiabatically. Using work done by the gas as positive, which statement is correct?', ['W < 0 and ΔU > 0','W > 0 and ΔU < 0','W = 0 and ΔU = 0','W > 0 and ΔU > 0'],0,'During compression, work is done on the gas, so work done by the gas is negative. With Q = 0, ΔU = −W > 0.','Compression makes ΔV negative; apply the stated sign convention.']
];let score=0,xp=0,done=0;function render(){const root=document.getElementById('quiz');root.innerHTML=qs.map((q,i)=>`<article class="q" id="q${i}"><h2>${i+1}. ${q[0]}</h2><div class="options">${q[1].map((o,j)=>`<button class="option" data-i="${i}" data-j="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div><div class="feedback" id="f${i}"></div><details class="hint"><summary>💡 Hint</summary><div>${q[5]}</div></details></article>`).join('');document.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.i,+b.dataset.j,b.closest('.q'))))}function answer(i,j,box){if(box.classList.contains('done'))return;const q=qs[i],buttons=box.querySelectorAll('.option');buttons.forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===j&&j!==q[2])b.classList.add('wrong')});box.classList.add('done');done++;if(j===q[2]){score++;xp+=10}else xp+=3;document.getElementById('score').textContent=score;document.getElementById('xp').textContent=xp;document.getElementById('done').textContent=done+'/15';document.getElementById('fill').style.width=(done/15*100)+'%';document.getElementById('f'+i).innerHTML='💡 '+q[4];if(done===15){document.getElementById('result').style.display='block';document.getElementById('final').textContent=score+'/15';document.getElementById('message').textContent=score===15?'Excellent! You have mastered the First Law of Thermodynamics.':score>=12?'Strong performance! Revise the missed processes once more.':score>=8?'Good progress. Revisit sign convention and special thermodynamic processes.':'Keep practising. Review Q, ΔU, W and the first-law applications.';document.getElementById('result').scrollIntoView({behavior:'smooth'})}}render();</script></body></html>
