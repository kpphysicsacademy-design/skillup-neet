<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | First Law of Thermodynamics</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.feedback{min-height:45px;font-weight:700;margin-top:15px}.next,.retry,.back{display:block;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00}</style></head><body><div class="wrap"><div class="card"><h1>🔥 First Law of Thermodynamics</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['The first law of thermodynamics is a statement of conservation of','mass','charge','energy','momentum',2,'Energy can neither be created nor destroyed; it is transformed between forms.'],

['If no heat is supplied to a system and it does positive work, its internal energy','increases','decreases','remains zero','becomes infinite',1,'For Q=0, ΔU = −W when W is work done by the system.'],
['In an isochoric process, the work done by an ideal gas is','maximum','zero','negative always','equal to heat',1,'At constant volume, ΔV=0, so W=∫P dV=0.'],
['For an ideal gas, internal energy depends primarily on','pressure only','volume only','temperature','shape of container',2,'Internal energy of an ideal gas is a function of temperature.'],
['In an adiabatic process','Q=0','W=0','ΔU=0','T=0',0,'Adiabatic means no heat transfer: Q=0.'],
['If a gas absorbs 500 J heat and does 200 J work, its change in internal energy is','700 J','300 J','−300 J','−700 J',1,'ΔU=Q−W=500−200=300 J.'],
['A cyclic thermodynamic process has net change in internal energy','positive','negative','zero','infinite',2,'Internal energy is a state function, so it returns to its initial value.'],
['The SI unit of heat and work is','calorie','joule','watt','pascal',1,'Both heat and work are forms of energy and are measured in joules.'],
['For an ideal gas in an isothermal process, the change in internal energy is','positive','negative','zero','equal to pressure',2,'Temperature is constant, so ideal-gas internal energy does not change.'],

['Which quantity is a state function?','heat','work','internal energy','path length',2,'Internal energy depends only on the state, not the path.'],
['In a constant-pressure expansion, the gas generally','does no work','does positive work','has zero volume','must lose all heat',1,'Expansion against pressure involves positive work by the gas.'],

];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});if(ok){score++;$('xp').textContent='✨ Correct! +1 XP'}else $('xp').textContent='❌ Incorrect. '+q[6];$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{ $('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
