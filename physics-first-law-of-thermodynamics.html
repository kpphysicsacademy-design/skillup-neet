<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | First Law of Thermodynamics</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f8fc;color:#172033;font-family:Arial,sans-serif}
.wrap{max-width:680px;margin:auto;padding:22px 14px 50px}
.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 28px #00000012}
h1{text-align:center;font-size:29px;margin:20px 0 18px}
.meta{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px}
.bar{height:8px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:14px 0 22px}
.fill{height:100%;width:0;background:#8fd66b;transition:.3s}
.q{font-size:19px;font-weight:800;line-height:1.45;margin:8px 0 16px}
.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:13px 15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:13px;background:#fff;color:#172033;font-size:15px;cursor:pointer;transition:.18s}
.opt:hover{background:#f7fbff;border-color:#b9cbe0}
.opt.selected{border-color:#6f8de8;background:#f0f4ff}
.opt.correct{border-color:#49aa5d!important;background:#eaf8ee!important;color:#165d2a!important}
.opt.wrong{border-color:#df5b5b!important;background:#fff0f0!important;color:#8d2222!important}
.feedback{min-height:38px;margin-top:12px;font-weight:700;line-height:1.45}
.continue{display:block;border:0;border-radius:13px;padding:12px 20px;background:#a8e87d;color:#fff;font-weight:900;font-size:14px;cursor:pointer;margin-top:12px;box-shadow:0 3px 0 #8bca62}
.continue:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.actions{display:flex;justify-content:flex-end}
.back{display:block;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:12px;margin-top:16px;background:#172033;color:#fff;font-size:14px;font-weight:800}
.result{text-align:center;margin-top:14px}
.result h2{margin-top:0}
.score{font-size:30px;font-weight:900}
.retry{border:0;border-radius:12px;padding:12px 18px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}
@media(max-width:520px){.wrap{padding:12px 10px 40px}.card{padding:17px}h1{font-size:25px}.q{font-size:17px}.opt{font-size:14px;padding:12px 13px}}
</style>
</head>
<body>
<main class="wrap">
<section class="card">
<h1>🔥 First Law of Thermodynamics</h1>
<div class="meta"><span id="count">Question 1/15</span><span>XP <b id="score">0</b></span></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="quiz"></div>
<div class="actions"><button class="continue" id="continue" type="button" disabled>Continue →</button></div>
<div class="feedback" id="feedback"></div>
<div class="result" id="result" hidden></div>
<a class="back" href="physics-home-fast.html">← Back to Physics Path</a>
</section>
</main>
<script>
const qs=[
['The first law of thermodynamics is a statement of conservation of','mass','charge','energy','momentum',2,'Energy is conserved; it can be transferred or transformed but cannot be created or destroyed.'],
['For a closed system, using ΔQ = ΔU + W, W represents work done by the','system','surroundings on system','system on surroundings','atmosphere only',2,'With this convention, W is the work done by the system.'],
['If no heat is supplied to a system and it does positive work, its internal energy','increases','decreases','remains zero','becomes infinite',1,'For Q = 0, ΔU = −W when W is work done by the system.'],
['In an isochoric process, the work done by an ideal gas is','maximum','zero','negative always','equal to heat',1,'At constant volume, ΔV = 0, so W = ∫P dV = 0.'],
['For an ideal gas, internal energy depends primarily on','pressure only','volume only','temperature','shape of container',2,'The internal energy of an ideal gas is a function of temperature.'],
['In an adiabatic process','Q = 0','W = 0','ΔU = 0','T = 0',0,'Adiabatic means that no heat is transferred: Q = 0.'],
['If a gas absorbs 500 J heat and does 200 J work, its change in internal energy is','700 J','300 J','−300 J','−700 J',1,'ΔU = Q − W = 500 − 200 = 300 J.'],
['A cyclic thermodynamic process has net change in internal energy','positive','negative','zero','infinite',2,'Internal energy is a state function, so its net change over a complete cycle is zero.'],
['The SI unit of heat and work is','calorie','joule','watt','pascal',1,'Heat and work are forms of energy and are measured in joules.'],
['For an ideal gas in an isothermal process, the change in internal energy is','positive','negative','zero','equal to pressure',2,'Temperature is constant, so the internal energy of an ideal gas remains constant.'],
['If 100 J of work is done on a system and no heat is exchanged, its internal energy','decreases by 100 J','increases by 100 J','does not change','becomes zero',1,'Work done on the system increases its internal energy by 100 J.'],
['Which quantity is a state function?','heat','work','internal energy','path length',2,'Internal energy depends only on the state of the system, not on the path.'],
['In a constant-pressure expansion, the gas generally','does no work','does positive work','has zero volume','must lose all heat',1,'Expansion against an external pressure involves positive work done by the gas.'],
['The first law can be written as dQ =','dU + dW','dU − dW','dW − dU','dU × dW',0,'With work done by the system, dQ = dU + dW.'],
['A system returns to its initial state after a cycle. The net heat supplied equals the','net work done by the system','change in internal energy only','zero always','temperature change',0,'Over a complete cycle ΔU = 0, so net heat supplied equals net work done by the system.']
];
let i=0,score=0,selected=null,checked=false;
const $=id=>document.getElementById(id);
function render(){
 selected=null;checked=false;$('feedback').textContent='';$('continue').disabled=true;
 $('count').textContent=`Question ${i+1}/15`;$('score').textContent=score;
 $('fill').style.width=`${i/15*100}%`;
 const q=qs[i];
 $('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button type="button" class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>select(+b.dataset.n));
}
function select(n){
 if(checked)return;selected=n;$('continue').disabled=false;
 document.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected'));
 document.querySelector(`.opt[data-n="${n}"]`).classList.add('selected');
}
function next(){
 if(selected===null)return;
 const q=qs[i];
 if(!checked){
  checked=true;const ok=selected===q[5];
  if(ok)score++;
  document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q[5])b.classList.add('correct');if(k===selected&&!ok)b.classList.add('wrong')});
  $('score').textContent=score;
  $('feedback').innerHTML=(ok?'✓ Correct! +1 XP':'✕ Incorrect.')+`<div>${q[6]}</div>`;
  $('fill').style.width=`${(i+1)/15*100}%`;
  $('continue').textContent=i===14?'Finish Quiz →':'Continue →';
  return;
 }
 if(i<14){i++;render();}else finish();
}
function finish(){
 $('quiz').hidden=true;$('continue').hidden=true;$('feedback').hidden=true;
 $('count').textContent='Quiz Complete';$('fill').style.width='100%';
 $('result').hidden=false;
 const pct=Math.round(score/15*100);
 $('result').innerHTML=`<h2>🎉 Quiz Complete</h2><div class="score">${score}/15</div><p>${pct}% accuracy</p><p>🏆 ${score} XP earned</p><button class="retry" type="button" onclick="location.reload()">Retry 15 MCQs ↻</button>`;
}
$('continue').onclick=next;
render();
</script>
</body>
</html>
