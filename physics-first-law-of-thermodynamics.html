<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🌡️ First Law of Thermodynamics</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[{"q":"What does the first law of thermodynamics express?","o":["Conservation of energy","Conservation of pressure","Conservation of temperature","Conservation of volume"],"a":0,"e":"The first law is energy conservation applied to thermodynamic systems."},{"q":"Using W as work done by the system, the first law is…","o":["ΔU = Q − W","ΔU = W − Q","ΔU = Q + W always","ΔU = P/V"],"a":0,"e":"The change in internal energy equals heat added minus work done by the system."},{"q":"A system receives 600 J of heat and does 250 J of work. Its ΔU is…","o":["+850 J","+350 J","−350 J","−850 J"],"a":1,"e":"ΔU = Q − W = 600 − 250 = 350 J."},{"q":"A gas loses 100 J of heat and 40 J of work is done on it. Its ΔU is…","o":["−140 J","−60 J","+60 J","+140 J"],"a":1,"e":"Q = −100 J and W by system = −40 J, so ΔU = −100 − (−40) = −60 J."},{"q":"In an adiabatic process, heat transfer Q equals…","o":["Zero","Work done","Internal energy","Pressure"],"a":0,"e":"Adiabatic means no heat transfer: Q = 0."},{"q":"For a closed system with no volume change and only pressure-volume work possible, W equals…","o":["Q","ΔU","Zero","−Q"],"a":2,"e":"No volume change means no boundary work."},{"q":"For a complete cycle, the net change in internal energy is…","o":["Positive","Negative","Zero","Equal to net heat always"],"a":2,"e":"Internal energy is a state function, so returning to the initial state gives ΔU = 0."},{"q":"Over a complete cycle, the first law implies…","o":["Net heat added equals net work done by the system","Net heat is always zero","Net work is always zero","Temperature must be constant"],"a":0,"e":"Since ΔU over a cycle is zero, Qnet = Wnet."},{"q":"If 200 J of heat is added and 200 J of work is done by the system, ΔU is…","o":["+400 J","+200 J","0 J","−200 J"],"a":2,"e":"ΔU = Q − W = 200 − 200 = 0."},{"q":"If no heat enters and the system does 120 J of work, ΔU is…","o":["+120 J","−120 J","Zero","−240 J"],"a":1,"e":"For Q = 0, ΔU = −W = −120 J."},{"q":"If 300 J of work is done on a system and 50 J of heat leaves it, ΔU is…","o":["+350 J","+250 J","−250 J","−350 J"],"a":2,"e":"Q = −50 J and W by system = −300 J; ΔU = −50 − (−300) = +250 J."},{"q":"Which quantity is a state function in the first law?","o":["Heat","Work","Internal energy","Path length"],"a":2,"e":"Internal energy depends on the state; heat and work depend on the process path."},{"q":"Heat and work are best described as…","o":["Stored state properties","Modes of energy transfer","Always equal","Always zero in cycles"],"a":1,"e":"Heat and work are energy transfers across a system boundary."},{"q":"When a gas expands and does positive work, the work term W in ΔU = Q − W is…","o":["Positive","Negative","Zero","Undefined"],"a":0,"e":"With this sign convention, work done by the system is positive."},{"q":"Work done on a gas corresponds to W by the system being…","o":["Positive","Negative","Always zero","Equal to Q"],"a":1,"e":"Work done on the gas is opposite in sign to work done by it."},{"q":"A system receives 1,000 J heat and does 700 J work. How does internal energy change?","o":["Increases by 300 J","Increases by 1,700 J","Decreases by 300 J","Does not change"],"a":0,"e":"ΔU = 1,000 − 700 = +300 J."},{"q":"A system has ΔU = 0 and receives 400 J heat. Work done by it is…","o":["0 J","200 J","400 J","−400 J"],"a":2,"e":"From 0 = Q − W, W = Q = 400 J."},{"q":"Which process has ΔU = 0 for an ideal gas?","o":["Any isothermal process","Any adiabatic process","Any isochoric process","Any isobaric process"],"a":0,"e":"Ideal-gas internal energy depends on temperature, so constant temperature gives ΔU = 0."},{"q":"In a constant-volume process for a closed system, assuming only boundary work, the first law becomes…","o":["ΔU = Q","ΔU = −Q","ΔU = W","Q = 0 always"],"a":0,"e":"Since W = 0, the first law reduces to ΔU = Q."},{"q":"For an adiabatic expansion of an ideal gas, if it does work, what generally happens to its temperature?","o":["It falls","It rises","It stays fixed","It becomes infinite"],"a":0,"e":"The gas uses internal energy to do work, lowering its temperature."},{"q":"A device converts heat into work in a cycle. Which principle must it obey?","o":["First law of thermodynamics","Conservation of volume","Boyle's law only","Charles's law only"],"a":0,"e":"Energy conservation requires energy inputs and outputs to balance over a cycle."},{"q":"Can a system's internal energy decrease while heat is added to it?","o":["No, never","Yes, if work done by it exceeds the heat added","Only if volume is fixed","Only if pressure is zero"],"a":1,"e":"If W > Q, then ΔU = Q − W is negative even when Q is positive."},{"q":"Which sign of Q indicates heat entering the system under the usual convention?","o":["Positive","Negative","Always zero","Undefined"],"a":0,"e":"Heat supplied to the system is taken as positive."},{"q":"Which sign of Q indicates heat leaving the system?","o":["Positive","Negative","Equal to work always","Zero"],"a":1,"e":"Heat leaving the system is negative under the usual sign convention."},{"q":"A system loses 150 J of heat and has 50 J of work done by it. ΔU is…","o":["−200 J","−100 J","+100 J","+200 J"],"a":0,"e":"ΔU = −150 − 50 = −200 J."},{"q":"The first law alone does not determine…","o":["Energy conservation","The balance of heat and work","The direction of every spontaneous process","Internal-energy change"],"a":2,"e":"The second law is needed to determine restrictions on process direction and efficiency."},{"q":"A perpetual-motion machine of the first kind would violate…","o":["The first law","The zeroth law","Charles's law","Newton's third law"],"a":0,"e":"It would create energy without input, violating energy conservation."},{"q":"If a system's internal energy rises by 80 J while it does 30 J work, heat supplied is…","o":["50 J","80 J","110 J","−110 J"],"a":2,"e":"From ΔU = Q − W, Q = ΔU + W = 80 + 30 = 110 J."},{"q":"If ΔU = −40 J and Q = 10 J, work done by the system is…","o":["−50 J","−30 J","+30 J","+50 J"],"a":3,"e":"W = Q − ΔU = 10 − (−40) = 50 J."},{"q":"Which statement is the best summary of the first law?","o":["Heat added changes internal energy and/or supplies work","All heat can always be converted to work","Internal energy is always constant","Work can be created without energy"],"a":0,"e":"The first law accounts for energy transfer as heat, work, and internal-energy change."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>First Law of Thermodynamics Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
