<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Force Between Parallel Current-Carrying Conductors</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>⚡ Force Between Parallel Conductors</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['Two long parallel conductors carrying currents in the same direction','attract each other','repel each other','have no force','always rotate',0,'Parallel currents in the same direction attract each other.'],['Two long parallel conductors carrying currents in opposite directions','attract each other','repel each other','have no force','always overlap',1,'Parallel currents in opposite directions repel each other.'],['The force per unit length between two long parallel wires in vacuum is','μ₀I₁I₂/(2πd)','μ₀I₁I₂d/(2π)','μ₀d/(2πI₁I₂)','2πd/(μ₀I₁I₂)',0,'F/L=μ₀I₁I₂/(2πd), where d is the separation.'],['The force per unit length between parallel wires is directly proportional to','I₁I₂','1/I₁I₂','d','1 only',0,'For fixed separation, F/L is proportional to the product I₁I₂.'],['The force per unit length between parallel wires is inversely proportional to','I₁','I₂','separation d','I₁I₂',2,'F/L∝1/d, so increasing separation decreases the force per unit length.'],['If both currents are doubled and separation remains fixed, the force per unit length becomes','half','double','four times','unchanged',2,'Since F/L∝I₁I₂, doubling both currents gives four times the force.'],['If the separation between two parallel wires is doubled, the force per unit length','doubles','halves','quadruples','remains unchanged',1,'Because F/L∝1/d, doubling d halves the force per unit length.'],['Two wires carry 2 A and 3 A and are 0.5 m apart in vacuum. Force per metre is approximately','2.4×10⁻⁷ N/m','2.4×10⁻⁶ N/m','2.4×10⁻⁵ N/m','2.4×10⁻⁴ N/m',1,'F/L=μ₀I₁I₂/(2πd)=4π×10⁻⁷×6/(2π×0.5)=2.4×10⁻⁶ N/m.'],['If one of the two parallel currents is zero, the magnetic force between the wires is','maximum','zero','infinite','unchanged',1,'The force is proportional to I₁I₂, so if either current is zero, the force is zero.'],['The magnetic field produced by one wire causes force on the other wire because the second wire carries','mass','current','voltage only','resistance only',1,'The current in the second conductor interacts with the magnetic field produced by the first.'],['For equal currents I in two parallel wires separated by d, force per unit length is','μ₀I²/(2πd)','μ₀I/(2πd²)','μ₀I²d/(2π)','2πd/(μ₀I²)',0,'Putting I₁=I₂=I gives F/L=μ₀I²/(2πd).'],['For a given pair of currents, the attraction or repulsion depends on','wire length only','relative current directions','wire temperature only','resistance only',1,'Same current directions attract; opposite directions repel.'],['The force between parallel current-carrying wires acts along','the line joining the wires','the wire length only','the magnetic field only','a random direction',0,'The force on each long parallel conductor is directed toward or away from the other along the line joining them.'],['A force of 4×10⁻⁶ N acts on 2 m of parallel wire. The force per metre is','2×10⁻⁶ N/m','4×10⁻⁶ N/m','8×10⁻⁶ N/m','2×10⁻⁵ N/m',0,'F/L=(4×10⁻⁶)/2=2×10⁻⁶ N/m.'],['The classical SI definition of ampere was historically connected with the force between','two point charges','two parallel current-carrying conductors','two magnets only','two capacitors',1,'The historical ampere definition used the force between two parallel current-carrying conductors under specified conditions.']];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent=''}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});if(ok){score++;$('xp').textContent='✨ Correct! +1 XP'}else $('xp').textContent='❌ Incorrect. '+q[6];$('score').textContent=`XP ${score}`;$('next').classList.remove('hide')}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('next').onclick=next;render();</script></body></html>
