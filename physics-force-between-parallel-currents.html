<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Force Between Parallel Currents</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>⚡ Force Between Parallel Currents</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['The force per unit length between two long parallel current-carrying wires is','μ₀I₁I₂/(2πd)','μ₀I₁I₂d/(2π)','2πd/(μ₀I₁I₂)','μ₀d/(2πI₁I₂)',0,'For long parallel wires, F/L=μ₀I₁I₂/(2πd).'],['Two parallel wires carrying currents in the same direction','attract','repel','have no force','rotate apart',0,'Parallel currents in the same direction attract each other.'],['Two parallel wires carrying currents in opposite directions','attract','repel','have zero force','always merge',1,'Parallel currents in opposite directions repel each other.'],['If the separation between two parallel wires is doubled, the force per unit length','doubles','halves','becomes four times','is unchanged',1,'F/L is inversely proportional to separation d.'],['If both currents are doubled, the force per unit length becomes','half','double','four times','unchanged',2,'Since F/L∝I₁I₂, doubling both currents makes the force four times larger.'],['The SI unit of force per unit length is','N','N/m','N·m','T/m',1,'Force per unit length has SI unit N/m.'],['The magnetic field at distance d from a long straight wire carrying current I is','μ₀I/(2πd)','μ₀Id/(2π)','2πd/(μ₀I)','μ₀/(2πId)',0,'For a long straight wire, B=μ₀I/(2πd).'],['A second wire carrying current I₂ placed in this field experiences force per length equal to','I₂/B','I₂B','B/I₂','I₂/B²',1,'The force per unit length on a current-carrying wire is I₂B when it is perpendicular to the field produced by the first wire.'],['Two wires carry 2 A and 3 A and are separated by 0.5 m in vacuum. The force per metre is','2.4×10⁻⁷ N/m','2.4×10⁻⁶ N/m','2.4×10⁻⁵ N/m','2.4×10⁻⁴ N/m',1,'F/L=μ₀I₁I₂/(2πd)=2.4×10⁻⁶ N/m.'],['The force between parallel wires is proportional to','I₁+I₂','I₁I₂','1/(I₁I₂)','d only',1,'The force per unit length is proportional to the product I₁I₂.'],['The force between parallel wires is inversely proportional to','current','length','separation','permeability',2,'F/L∝1/d.'],['For fixed currents and separation, increasing the length of parallel wires makes the total force','decrease','increase','unchanged','zero',1,'Total force is F=(F/L)L, so it increases with interacting length.'],['The direction of force between two parallel currents can be determined using','Ampere’s law and right-hand rule','Ohm’s law only','Kirchhoff’s voltage law','Coulomb’s law only',0,'The field direction from one wire and F=IL×B determine the force direction.'],['If one current is reversed while the other remains unchanged, an attracting pair becomes','more attractive','repulsive','zero force always','unaffected',1,'Reversing one current changes the relative current directions from same to opposite, so attraction becomes repulsion.'],['The historical SI definition of ampere involved the force between','two parallel current-carrying conductors','two capacitors','two magnets only','two resistors',0,'The ampere was historically defined through the force between ideal parallel conductors; the SI definition has since been recast in terms of the elementary charge.']];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent=''}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});if(ok){score++;$('xp').textContent='✨ Correct! +1 XP'}else $('xp').textContent='❌ Incorrect. '+q[6];$('score').textContent=`XP ${score}`;$('next').classList.remove('hide')}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('next').onclick=next;render();</script></body></html>
