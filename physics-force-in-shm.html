<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Force in SHM</title><style>body{font-family:Arial,sans-serif;background:#f3f7ff;margin:0;color:#1e293b}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(30,41,59,.10);border:1px solid #e2e8f0}h1{text-align:center;color:#334155}.meta{display:flex;justify-content:space-between;font-weight:700;color:#475569}.bar{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#22c55e;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;color:#172033}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe4f0;border-radius:14px;background:#fff;color:#1e293b;font-size:16px;cursor:pointer;transition:.2s}.opt:hover{background:#eef5ff;border-color:#93c5fd;transform:translateY(-1px)}.opt:focus-visible{outline:3px solid #bfdbfe;outline-offset:2px}.correct{border-color:#16a34a!important;background:#ecfdf3!important;color:#166534!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important;color:#991b1b!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s}.next,.retry{background:#4f46e5;color:#fff}.next:hover,.retry:hover{background:#4338ca}.back{background:#334155;color:#fff}.back:hover{background:#1e293b}.hide{display:none}.xp{text-align:center;font-weight:700;color:#d97706;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>💪 Force in SHM</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['For a particle executing SHM, the restoring force is','F = +kx','F = −kx','F = kx²','F = constant','F = −kx','The restoring force in SHM is proportional to displacement and directed toward the mean position: F = −kx.'],
['The SI unit of force in SHM is','joule','newton','watt','pascal','newton','Force is measured in newtons (N).'],

['At the mean position of SHM, the restoring force is','maximum','zero','minimum but non-zero','infinite','zero','At x = 0, F = −kx = 0.'],
['The magnitude of restoring force is maximum at the','mean position','extreme positions','midpoint only','all positions equally','extreme positions','Since |F| = k|x|, the force magnitude is greatest at |x| = A.'],
['At the positive extreme x = +A, the restoring force is','+kA','−kA','zero','k/A','−kA','The force points toward equilibrium, so F = −kA.'],
['At the negative extreme x = −A, the restoring force is','−kA','+kA','zero','−k/A','+kA','For x = −A, F = −k(−A) = +kA.'],
['If the amplitude is doubled while the spring constant remains constant, maximum restoring force becomes','half','twice','four times','unchanged','twice','Maximum force is Fmax = kA, so doubling A doubles Fmax.'],
['If the spring constant k is doubled while amplitude remains constant, maximum restoring force becomes','half','twice','four times','unchanged','twice','Since Fmax = kA, doubling k doubles the maximum force.'],
['The force and displacement in SHM have a phase difference of','0','π/4','π/2','π','π','Because F = −kx, force is opposite in phase to displacement by π radians.'],
['A particle has mass 2 kg, angular frequency 3 rad/s and displacement 0.10 m. The magnitude of force is','0.6 N','1.8 N','2.0 N','18 N','1.8 N','|F| = mω²|x| = 2 × 9 × 0.10 = 1.8 N.'],
['For a spring-mass oscillator, the force constant k is related to angular frequency by','k = m/ω²','k = mω²','k = ω/m','k = mω','k = mω²','For SHM of a mass-spring system, ω² = k/m, hence k = mω².'],

];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=document.querySelectorAll('.opt')[n].textContent.slice(3)===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(b.textContent.slice(3)===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
