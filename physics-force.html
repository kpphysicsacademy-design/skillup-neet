*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:flex-end;align-items:center;margin-bottom:20px}.xp{background:#fff;padding:14px 20px;border-radius:18px;box-shadow:0 5px 18px rgba(23,32,51,.08);font-weight:800;color:#23405f;animation:pop .55s ease both}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff;border-radius:22px;padding:26px 20px;margin-bottom:12px;box-shadow:0 8px 22px rgba(18,83,157,.18);animation:slideUp .55s ease both}.hero h1{margin:10px 0 12px;font-size:1.85rem;line-height:1.15}.hero p{margin:0;font-size:.98rem}.card{background:#fff;border-radius:22px;padding:20px;margin:12px 0;box-shadow:0 6px 20px rgba(23,32,51,.07);animation:slideUp .55s ease both}.progress-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:750}.bar{height:12px;background:#dfe8f1;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;border-radius:999px;transition:width .45s cubic-bezier(.2,.8,.2,1)}.qnum{font-size:.9rem;font-weight:800;color:#35516f;margin-bottom:12px}.question{font-size:1.28rem;line-height:1.45;margin:0 0 18px;font-weight:750;animation:questionIn .35s ease both}.options{display:grid;gap:10px}.option{width:100%;padding:14px 15px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;color:#172033;cursor:pointer;transition:transform .14s ease,border-color .14s ease,background .14s ease,box-shadow .14s ease}.option:hover,.option:focus-visible{border-color:#58cc02;background:#f7fff1;transform:translateY(-2px);outline:none;box-shadow:0 5px 12px rgba(88,204,2,.14)}.option:active{transform:scale(.985)}.option.selected{border-color:#1685e8;background:#eef7ff;box-shadow:0 0 0 3px rgba(22,133,232,.10)}.option.correct{border-color:#58cc02;background:#eaffdf;animation:c </style></head><body><main class="wrap"><div class="top"><div class="xp">⚡ <span id="xp">0</span> XP</div></div><section class="hero"><small>PHYSICS • NEET 2026</small><h1>Force</h1><p>LEARN → PRACTICE → MASTER • 15 focused NEET-style MCQs</p></section><section class="card"><div class="progress-head"><span>🎯 Progress</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count">Question 1 of 15</div><h2 class="question" id="question"></h2><div id="options" class="options"></div><div class="actions"><button id="check" class="btn check">Check Answer</button><button id="next" class="btn next" disabled>Next Question →</button></div><div id="feedback" class="feedback"></div><p class="hint">💡 Choose the best answer.</p></section><a href="physics-home.html" id="back" class="back">← Back to Physics Path</a></main><script>(function(){const quiz=[
['The SI unit of force is:',['joule','newton','watt','pascal'],1,'Force is measured in newtons (N).'],

['Force is a:',['Scalar quantity','Vector quantity','Dimensionless quantity','Constant quantity'],1,'Force has both magnitude and direction, so it is a vector.'],
['The net force on a body moving with constant velocity is:',['Zero','Maximum','Increasing','Equal to its mass'],0,'Constant velocity means zero acceleration, hence zero net force.'],
['If the net force on a body is doubled while its mass remains constant, its acceleration:',['Halves','Remains the same','Doubles','Becomes zero'],2,'From a=F/m, doubling F doubles a.'],
['Two forces of 5 N and 3 N act in the same direction. Their resultant is:',['2 N','8 N','15 N','1.67 N'],1,'For parallel forces in the same direction, magnitudes add: 5+3=8 N.'],
['Two opposite forces of 10 N and 6 N act on a body. The resultant magnitude is:',['4 N','6 N','16 N','60 N'],0,'Opposite forces subtract: 10−6=4 N.'],
['Action and reaction forces described by Newton’s third law:',['Act on the same body','Act on different bodies','Always cancel on one body','Have different magnitudes'],1,'Action and reaction are equal and opposite but act on different bodies.'],
['A force of 20 N acts on a 4 kg body. Its acceleration is:',['5 m/s²','16 m/s²','24 m/s²','80 m/s²'],0,'a=F/m=20/4=5 m/s².'],
['Which force opposes relative motion between surfaces in contact?',['Gravity','Friction','Magnetic force','Buoyant force'],1,'Friction acts opposite to relative motion or its tendency.'],
['Weight of a body of mass m near Earth is:',['m/g','mg','g/m','m+g'],1,'Weight is the gravitational force W=mg.'],
['A body is in equilibrium when:',['Its speed is always zero','Net force is zero','Its mass is zero','Only one force acts'],1,'Translational equilibrium requires zero net force.'],
['If a 10 N force acts east and a 10 N force acts west, the net force is:',['20 N east','20 N west','10 N east','0 N'],3,'Equal opposite forces cancel, giving zero net force.'],
['A free-body diagram is mainly used to show:',['Only the path of motion','All external forces acting on a body','The chemical composition of a body','Only the body’s velocity'],1,'A free-body diagram isolates a body and represents the external forces acting on it.']
];let i=0,selected=-1,score=0,checked=false;const $=id=>document.getElementById(id),q=$("question"),o=$("options"),c=$("check"),n=$("next"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;q.textContent=a[0];$("count").textContent='Question '+(i+1)+' of 15';o.innerHTML='';f.className='feedback';f.textContent='';c.disabled=false;n.disabled=true;n.textContent=i===14?'Finish Skill →':'Next Question →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{selected=item.index;[...o.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)})}c.onclick=()=>{if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(b=>{const idx=Number(b.dataset.index);b.disabled=true;if(idx===a[2])b.classList.add('correct');if(idx===selected&&!ok)b.classList.add('wrong')});if(ok){score++;f.className='feedback good';f.textContent='🎯 Correct! +10 XP — '+a[3]}else{f.className='feedback bad';f.textContent='✗ Review — Correct answer: '+a[1][a[2]]+'. '+a[3]}$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';c.disabled=true;n.disabled=false};n.onclick=()=>{if(!checked)return;if(i<14){i++;render();window.scrollTo({top:0,behavior:'smooth'})}else{q.textContent='🏆 Force Complete!';o.innerHTML='';c.style.display='none';n.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
