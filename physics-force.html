<style>
:root{color-scheme:light;--bg:#f0f0e4;--panel:#e9ecdf;--card:#fff;--ink:#263544;--muted:#687565;--line:#d5ddce;--green:#58cc02;--green-dark:#46a302;--blue:#1cb0f6;--red:#e45b5b}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg);scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:10;background:#fafaf2;border-bottom:1px solid var(--line)}
.nav{width:min(100%,780px);min-height:72px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:11px}
.back{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border:2px solid var(--line);border-radius:15px;background:#f4f9ff;color:#174a78;text-decoration:none;font-size:21px;font-weight:800}
.brand{min-width:0;flex:1;font-size:20px;line-height:1.1;font-weight:950;color:#26352d}
.brand small{display:block;margin-top:4px;color:var(--muted);font-size:9px;letter-spacing:.8px}
.pills{display:flex;gap:7px;align-items:center}
.pill{padding:8px 11px;border:1px solid var(--line);border-radius:99px;background:#eeefe2;color:#53634d;font-size:12px;font-weight:900;white-space:nowrap}
.pill.streak{background:#fff0e8;border-color:#f5d7c5;color:#ad4b21}
main{width:min(100% - 28px,720px);margin:0 auto;padding:20px 0 48px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:5px;margin:0 0 15px;border:1px solid var(--line);border-radius:16px;background:#e7eadc}
.tabs a{display:flex;align-items:center;justify-content:center;min-width:0;min-height:43px;padding:9px 5px;border:1px solid transparent;border-radius:12px;color:#53634d;text-decoration:none;text-align:center;font-size:14px;font-weight:850;line-height:1.2;white-space:nowrap}
.tabs a:hover{background:#f7f8ef}
.tabs a.active{background:#fff;border-color:var(--line);color:#245b12;box-shadow:0 2px 0 rgba(83,99,77,.12)}
.progress-card{padding:18px 19px;margin-bottom:16px;border:2px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 4px 0 rgba(214,221,206,.3)}
.progress-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px;color:#667360;font-size:clamp(15px,3.6vw,20px);font-weight:950}
.track{height:11px;overflow:hidden;border-radius:99px;background:#dfe6d9}
.fill{height:100%;width:0;border-radius:99px;background:var(--green);transition:width .2s ease}
.quiz-card{padding:22px 20px 20px;border:2px solid #deebf6;border-radius:23px;background:var(--card);box-shadow:0 5px 0 #dce8f3}
.qmeta{color:#6a7667;font-size:12px;font-weight:950;letter-spacing:.5px;text-transform:uppercase}
.question{margin:17px 0 20px;color:#263544;font-size:clamp(22px,4.5vw,28px);font-weight:900;line-height:1.35;overflow-wrap:anywhere}
.options{display:grid;gap:10px}
.option{display:flex;align-items:center;gap:11px;width:100%;min-height:60px;padding:12px 15px;border:2px solid var(--line);border-bottom-width:3px;border-radius:17px;background:#fafaf2;color:#2e3b31;text-align:left;font:750 clamp(15px,3.5vw,18px)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;transition:border-color .15s,background .15s}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}
.option.selected{border-color:var(--blue);background:#e8f7ff}
.option.correct{border-color:var(--green);background:#e8ffdc;color:#245b12}
.option.wrong{border-color:#ed8585;background:#fff0f0;color:#8f2020}
.option:disabled{cursor:default;opacity:1}
.letter{display:grid;place-items:center;width:29px;height:29px;flex:0 0 29px;border:2px solid var(--line);border-radius:10px;color:#60715e;font-size:12px;font-weight:900}
.feedback{display:none;margin-top:15px;padding:14px 15px;border:2px solid transparent;border-radius:15px;font-size:14px;line-height:1.55;font-weight:700}
.feedback.show{display:block}
.feedback.good{border-color:#b8e99e;background:#efffe7;color:#245b12}
.feedback.bad{border-color:#ffc2c7;background:#fff0f0;color:#842029}
.actions{display:flex;gap:10px;margin-top:18px}
.btn{width:100%;min-height:54px;padding:13px 16px;border:0;border-radius:16px;font:900 16px system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}
.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}
.continue.show{display:block}
.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{padding:28px 20px;border:2px solid #c8f0b2;border-radius:22px;background:#f2ffeb;text-align:center}
.trophy{font-size:52px}.finish h2{margin:8px 0}.score{color:#174a78;font-size:42px;font-weight:950}
.finish p{color:var(--muted);line-height:1.5}.finish .btn{max-width:260px;margin-top:12px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}
@media(max-width:480px){.nav{min-height:66px;gap:7px;padding:9px 10px}.back{width:38px;height:38px;flex-basis:38px}.brand{font-size:17px}.brand small{font-size:8px;letter-spacing:.55px}.pill{padding:7px 8px;font-size:11px}main{width:calc(100% - 20px);padding:14px 0 34px}.tabs{gap:4px;padding:4px}.tabs a{min-height:41px;padding:8px 3px;font-size:12px}.progress-card{padding:16px;border-radius:19px}.quiz-card{padding:17px 15px;border-radius:19px}.question{font-size:22px;margin:14px 0 17px}.option{min-height:56px;padding:11px 12px;border-radius:15px;font-size:15px}.actions{margin-top:16px}}
@media(max-width:350px){.brand{font-size:15px}.pill{font-size:10px;padding:7px 6px}.tabs a{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="pills"><div class="pill">⭐ <span id="xp">0</span> XP</div><div class="pill streak">🔥 <span id="streak">0</span> streak</div></div></div></header>
<main>
<nav class="tabs" aria-label="Force topic pages">
<a href="physics-force-learn.html">📘 Learn</a>
<a href="physics-force-simulator.html">🎮 Simulate</a>
<a class="active" href="physics-force.html" aria-current="page">🧠 Practice</a>
</nav>
<section class="progress-card" aria-label="Quiz progress">
<div class="progress-top"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div>
<div class="track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="30" aria-valuenow="0" id="progressBar"><div class="fill" id="fill"></div></div>
</section>
<section class="quiz-card" id="quiz" aria-labelledby="question">
<div class="qmeta" id="qmeta">QUESTION 1</div>
<h1 class="question" id="question">What is a force?</h1>
<div class="options" id="options"></div>
<div class="feedback" id="feedback" aria-live="polite"></div>
<div class="actions"><button class="btn check" id="check" type="button" disabled>Check answer</button><button class="btn continue" id="continue" type="button">Continue →</button></div>
</section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [{"q":"What is a force?","o":["A push or pull that can change motion","A measure of temperature","The amount of space an object occupies","Energy per unit time"],"a":0,"e":"A force is an interaction that can change an object's motion or shape."},{"q":"What is the SI unit of force?","o":["Joule","Watt","Newton","Pascal"],"a":2,"e":"Force is measured in newtons (N). One newton is 1 kg·m/s²."},{"q":"Newton's second law is commonly written as:","o":["F = mv","F = ma","F = m/a","F = a/m"],"a":1,"e":"The net force on an object equals its mass multiplied by its acceleration: Fnet = ma."},{"q":"A net force of 10 N acts on a 2 kg object. Its acceleration is:","o":["2 m/s²","5 m/s²","10 m/s²","20 m/s²"],"a":1,"e":"a = F/m = 10/2 = 5 m/s²."},{"q":"If the net force on an object is zero, its acceleration is:","o":["Always positive","Always negative","Zero","Equal to its mass"],"a":2,"e":"From Fnet = ma, zero net force means zero acceleration."},{"q":"Which law explains why a book stays at rest on a table unless a net force acts?","o":["Newton's first law","Newton's second law","Newton's third law","Law of gravitation only"],"a":0,"e":"Newton's first law says an object maintains rest or uniform straight-line motion unless acted on by a net external force."},{"q":"Newton's third law states that action and reaction forces:","o":["Act on the same object","Are equal and opposite and act on different objects","Always cancel on one object","Only occur when objects are moving"],"a":1,"e":"Action–reaction forces are equal in magnitude, opposite in direction, and act on different bodies."},{"q":"A 5 kg object accelerates at 3 m/s². What is the net force?","o":["1.67 N","8 N","15 N","30 N"],"a":2,"e":"F = ma = 5 × 3 = 15 N."},{"q":"A 20 N net force acts on a 4 kg trolley. What is its acceleration?","o":["4 m/s²","5 m/s²","16 m/s²","80 m/s²"],"a":1,"e":"a = F/m = 20/4 = 5 m/s²."},{"q":"The weight of an object near Earth's surface is:","o":["Its mass in kilograms","The gravitational force on it","Always equal to its volume","Independent of gravitational acceleration"],"a":1,"e":"Weight is the gravitational force, W = mg."},{"q":"What is the approximate weight of a 2 kg object if g = 10 m/s²?","o":["0.2 N","2 N","10 N","20 N"],"a":3,"e":"W = mg = 2 × 10 = 20 N."},{"q":"Mass is different from weight because mass:","o":["Is measured in newtons","Depends directly on local gravity","Measures inertia and is measured in kilograms","Is always zero in space"],"a":2,"e":"Mass measures inertia and is measured in kg; weight is a force measured in newtons."},{"q":"Which force opposes relative sliding between surfaces in contact?","o":["Friction","Tension","Normal force","Buoyant force"],"a":0,"e":"Friction acts along the contact surface and opposes relative motion or its tendency."},{"q":"The normal force from a horizontal table on a resting object is directed:","o":["Horizontally","Vertically upward, perpendicular to the table","Vertically downward","Along the object's motion"],"a":1,"e":"The normal force acts perpendicular to the contact surface."},{"q":"For a block resting on a horizontal surface with no other vertical forces, the normal force equals:","o":["Zero","Its mass","Its weight in magnitude","The friction force always"],"a":2,"e":"With no vertical acceleration, the normal force balances the weight: N = mg."},{"q":"A 10 kg object is pulled with 30 N horizontally on a frictionless surface. Its acceleration is:","o":["0.3 m/s²","3 m/s²","10 m/s²","300 m/s²"],"a":1,"e":"a = F/m = 30/10 = 3 m/s²."},{"q":"Two horizontal forces of 12 N right and 7 N left act on a body. The net force is:","o":["19 N right","5 N right","5 N left","84 N right"],"a":1,"e":"Taking right as positive, Fnet = 12 − 7 = 5 N right."},{"q":"If the same net force acts on two objects, the object with greater mass has:","o":["Greater acceleration","Smaller acceleration","The same acceleration always","Zero acceleration"],"a":1,"e":"For fixed net force, a = F/m, so acceleration decreases as mass increases."},{"q":"A force of 18 N produces acceleration 6 m/s². What is the object's mass?","o":["2 kg","3 kg","6 kg","108 kg"],"a":1,"e":"m = F/a = 18/6 = 3 kg."},{"q":"A 4 kg object has acceleration 2 m/s². What net force acts on it?","o":["2 N","4 N","6 N","8 N"],"a":3,"e":"Fnet = ma = 4 × 2 = 8 N."},{"q":"When a swimmer pushes water backward, the water pushes the swimmer forward. This illustrates:","o":["Newton's first law","Newton's second law","Newton's third law","Conservation of mass"],"a":2,"e":"The swimmer and water exert equal and opposite forces on each other."},{"q":"Why do action and reaction forces not cancel each other on a single free-body diagram?","o":["They are not equal","They act on different objects","They act in the same direction","They exist at different times"],"a":1,"e":"They act on different bodies, so they cannot cancel on the free-body diagram of just one body."},{"q":"A 6 kg object rests on Earth. Using g = 9.8 m/s², its weight is:","o":["6 N","9.8 N","58.8 N","60 N"],"a":2,"e":"W = mg = 6 × 9.8 = 58.8 N."},{"q":"A 2 kg object is moving at constant velocity on a straight line. The net force on it is:","o":["2 N","9.8 N","Zero","Cannot be determined from its mass alone"],"a":2,"e":"Constant velocity means acceleration is zero, so the net force is zero."},{"q":"A force can change which property of an object?","o":["Only its colour","Its velocity or shape","Only its mass","Only its temperature"],"a":1,"e":"Depending on the interaction, force can change velocity, direction of motion, or shape."},{"q":"A 3 kg cart has a net force of 12 N. How long does it take to change its velocity by 8 m/s, if the force is constant?","o":["0.5 s","1 s","2 s","4 s"],"a":2,"e":"a = F/m = 12/3 = 4 m/s²; t = Δv/a = 8/4 = 2 s."},{"q":"A 2 kg object experiences a 10 N force to the right and 10 N to the left. Its acceleration is:","o":["0 m/s²","5 m/s² right","10 m/s² left","20 m/s²"],"a":0,"e":"The forces balance, so net force and acceleration are both zero."},{"q":"Which is a non-contact force?","o":["Friction","Normal force","Tension in a rope","Gravitational force"],"a":3,"e":"Gravity acts at a distance without physical contact between the interacting bodies."},{"q":"A person pushes a wall with 50 N. The wall pushes the person with:","o":["0 N","25 N","50 N in the opposite direction","100 N in the same direction"],"a":2,"e":"By Newton's third law, the wall exerts an equal 50 N force in the opposite direction on the person."},{"q":"A 10 kg object has a net force of 0 N. Which statement must be true?","o":["It must be at rest","It must be speeding up","Its acceleration is zero","Its velocity must be zero"],"a":2,"e":"Zero net force guarantees zero acceleration; the object may be at rest or moving with constant velocity."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const $=id=>document.getElementById(id);
function render(){
 const item=questions[index];chosen=null;locked=false;
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('progressBar').setAttribute('aria-valuenow',String(index));
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').hidden=false;$('check').disabled=true;
 $('continue').className='btn continue';
 $('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((choice,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  b.setAttribute('aria-pressed','false');
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=choice;b.append(letter,label);
  b.addEventListener('click',()=>{
   if(locked)return;chosen=j;
   document.querySelectorAll('.option').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-pressed','false')});
   b.classList.add('selected');b.setAttribute('aria-pressed','true');$('check').disabled=false;
  });
  $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;
 locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct')});
 const feedback=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;feedback.className='feedback show good';feedback.textContent='✨ Correct! '+item.e}
 else{streak=0;$('streak').textContent='0';buttons[chosen].classList.add('wrong');feedback.className='feedback show bad';feedback.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'}
 $('check').hidden=true;$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;
 index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return}
 $('quiz').hidden=true;$('fill').style.width='100%';$('progressBar').setAttribute('aria-valuenow',String(questions.length));$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100),card=document.createElement('section');card.className='finish';
 const trophy=document.createElement('div');trophy.className='trophy';trophy.textContent='🏆';
 const title=document.createElement('h2');title.textContent='Practice complete!';
 const result=document.createElement('div');result.className='score';result.textContent=score+' / '+questions.length;
 const detail=document.createElement('p');detail.textContent=pct+'% correct • '+(score*10)+' XP earned';
 const retry=document.createElement('button');retry.type='button';retry.className='btn';retry.textContent='Practice again';
 card.append(trophy,title,result,detail,retry);$('finishSlot').replaceChildren(card);
 retry.addEventListener('click',()=>{index=0;score=0;streak=0;$('xp').textContent='0';$('streak').textContent='0';$('quiz').hidden=false;$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'})});
});
render();
})();
</script>
