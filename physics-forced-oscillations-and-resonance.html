<script>
(function(){
'use strict';
const questions = [{"q":"Forced oscillations occur when a system is acted on by:","o":["An external periodic driving force","Only its restoring force after release","No external influence of any kind","A force that is always constant"],"a":0,"e":"A periodic external force continuously supplies energy to the oscillator."},{"q":"In steady-state forced oscillations, the oscillator's frequency is generally:","o":["The driving-force frequency","Always its undamped natural frequency","Always zero","Twice the natural frequency in every case"],"a":0,"e":"After transient motion dies away, the system responds at the frequency of the periodic driver."},{"q":"The natural frequency of a system is the frequency at which it oscillates:","o":["Freely when not driven, in the ideal undamped case","Only when driven at any arbitrary frequency","Only under critical damping","Only at zero displacement"],"a":0,"e":"Natural frequency is set by the system's physical properties for free, undamped oscillations."},{"q":"Resonance occurs when the driving frequency is:","o":["Equal or close to the system's natural frequency","Always zero","Much smaller than every possible natural frequency","Equal to the damping coefficient"],"a":0,"e":"Resonance is a strong response when the driving frequency matches or is near the natural frequency."},{"q":"For a lightly damped oscillator, resonance generally produces:","o":["A large response amplitude","Zero displacement at all times","A smaller amplitude than at every other frequency","No energy transfer"],"a":0,"e":"Near resonance, energy transfer from the driver can produce a large steady-state amplitude."},{"q":"Increasing damping generally makes the resonance peak:","o":["Lower and broader","Higher and narrower","Infinite in all cases","Completely independent of frequency"],"a":0,"e":"Greater damping dissipates energy more strongly and reduces the peak response."},{"q":"A child on a swing gains height most efficiently when pushes are timed:","o":["In step with the swing's motion at an appropriate frequency","At random intervals regardless of phase","Only when the swing is stationary forever","At a frequency infinitely greater than the swing's natural frequency"],"a":0,"e":"Well-timed pushes transfer energy effectively, illustrating driven oscillation and resonance."},{"q":"The natural angular frequency of an ideal mass–spring system is:","o":["ω₀ = √(k/m)","ω₀ = √(m/k)","ω₀ = k/m","ω₀ = 2π√(k/m)"],"a":0,"e":"For a mass m on a spring k, ω₀ = √(k/m)."},{"q":"The natural frequency f₀ of a mass–spring system is:","o":["(1/2π)√(k/m)","2π√(k/m)","(1/2π)√(m/k)","√(mk)/(2π)"],"a":0,"e":"Frequency in hertz is angular frequency divided by 2π."},{"q":"For a driven oscillator, the external force can be written as:","o":["F(t) = F₀ cos(ωt)","F(t) = −kx only","F(t) = 0 for all t","F(t) = constant mass"],"a":0,"e":"A common periodic driver is sinusoidal, F(t) = F₀ cos(ωt)."},{"q":"In F(t) = F₀ cos(ωt), ω represents the:","o":["Angular frequency of the driving force","Mass of the oscillator","Spring constant","Damping coefficient"],"a":0,"e":"The symbol ω specifies how rapidly the external force cycles in time."},{"q":"For the driven damped oscillator, mẍ + bẋ + kx = F₀ cos(ωt), b represents:","o":["The damping coefficient","The driving amplitude","The mass","The natural period"],"a":0,"e":"The term bẋ represents linear viscous damping."},{"q":"After initial transients die away, a damped driven oscillator usually reaches:","o":["A steady periodic response","An indefinitely growing transient in all cases","Permanent rest even while the driver continues","A response with no relation to the driver"],"a":0,"e":"The steady-state response is periodic at the driving frequency."},{"q":"Transient motion is the part of the response that:","o":["Typically fades as damping removes its contribution","Must persist forever with constant amplitude","Is always the only motion present","Occurs only at zero driving frequency"],"a":0,"e":"Transient components depend on initial conditions and decay in a damped system."},{"q":"At resonance, the driver supplies energy to the oscillator:","o":["Efficiently over successive cycles","Only once and never again","Only when the oscillator has no motion","Without any external force"],"a":0,"e":"When timing is favourable, repeated energy input can balance losses and sustain a large response."},{"q":"For a weakly damped driven oscillator, the amplitude is usually largest when the driving frequency is:","o":["Near the natural frequency","Exactly zero in every setup","Infinite","Equal to the mass"],"a":0,"e":"The response amplitude peaks near the natural frequency for weak damping."},{"q":"Which factor most strongly limits the amplitude at resonance in a real oscillator?","o":["Dissipation due to damping","The colour of the oscillator","The unit used for time","The name of the driver"],"a":0,"e":"Damping removes energy, preventing the unlimited growth predicted by an ideal undamped resonance model."},{"q":"An undamped oscillator driven exactly at its natural frequency in the ideal linear model may show:","o":["Amplitude that grows with time","A response that must remain zero","Instantaneous critical damping","A frequency that becomes zero"],"a":0,"e":"Ideal exact resonance without damping can produce unbounded growth in the mathematical model."},{"q":"A lightly damped resonant system generally has a sharper frequency response than a heavily damped one because:","o":["Its resonance peak is narrower","Its natural frequency is always zero","It has no restoring force","Its mass changes each cycle"],"a":0,"e":"Low damping makes the resonance curve narrower and more selective in frequency."},{"q":"Which is an example of a useful application of resonance?","o":["Tuning a radio circuit to a selected frequency","Eliminating all oscillations by friction","Keeping every building vibrating at its largest amplitude","Making a pendulum independent of gravity"],"a":0,"e":"A tuned circuit responds strongly near its selected resonant frequency."},{"q":"Resonance can be dangerous in structures when:","o":["Driving vibrations approach a structural natural frequency and response becomes large","All external forces vanish","Damping is always infinite","The structure cannot vibrate at any frequency"],"a":0,"e":"Large resonant vibrations can increase stress and damage if not adequately controlled."},{"q":"If a mass–spring system has m = 1 kg and k = 100 N/m, its natural angular frequency is:","o":["10 rad/s","100 rad/s","1 rad/s","0.1 rad/s"],"a":0,"e":"ω₀ = √(k/m) = √100 = 10 rad/s."},{"q":"For the system in the previous question, the natural frequency is closest to:","o":["1.59 Hz","10 Hz","3.18 Hz","0.10 Hz"],"a":0,"e":"f₀ = ω₀/(2π) = 10/(2π) ≈ 1.59 Hz."},{"q":"A driver oscillates at 5 Hz. In steady state, a linearly forced oscillator responds at approximately:","o":["5 Hz","Its natural frequency no matter what","10 Hz always","0 Hz"],"a":0,"e":"The steady-state forced response follows the driving frequency."},{"q":"If damping is increased while the driving frequency remains fixed near resonance, the response amplitude usually:","o":["Decreases","Increases without limit","Must remain unchanged","Becomes equal to the damping coefficient"],"a":0,"e":"Greater damping dissipates more energy and reduces the resonant response."},{"q":"For a forced oscillator, the steady-state amplitude depends on:","o":["Driving frequency, driving strength, system properties, and damping","Only the colour of the mass","Only the initial displacement in every case","Only the unit used for length"],"a":0,"e":"The response amplitude is determined by the driver and the oscillator's mass, stiffness, and damping."},{"q":"A system has natural frequency 20 Hz and is driven at 2 Hz. The driving frequency is:","o":["Far below the natural frequency","At resonance by definition","Far above the natural frequency","Equal to 20 Hz"],"a":0,"e":"2 Hz is one-tenth of 20 Hz, so it is far below the natural frequency."},{"q":"The main difference between free and forced oscillations is that forced oscillations:","o":["Are maintained by an external driving force","Never have a frequency","Cannot exchange energy with surroundings","Always have zero amplitude"],"a":0,"e":"Free oscillations follow an initial disturbance; forced oscillations are sustained by external periodic input."},{"q":"At resonance in a damped system, the energy supplied by the driver in steady state is, on average:","o":["Balanced by energy dissipated through damping","Always zero despite nonzero motion","Infinite every cycle","Converted into mass"],"a":0,"e":"Steady amplitude requires average input power to balance average dissipated power."},{"q":"Why can small periodic pushes produce a large swing amplitude when well timed?","o":["Energy is added in phase with the motion over repeated cycles","The swing's mass decreases each cycle","Gravity stops acting","Damping becomes negative automatically"],"a":0,"e":"Repeated appropriately timed input adds energy efficiently, building up the oscillation amplitude."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Forced Oscillations & Resonance Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
