<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Forced Oscillations & Resonance</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f7ff;margin:0;color:#1e293b}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(30,41,59,.10);border:1px solid #e2e8f0}h1{text-align:center;color:#334155}.meta{display:flex;justify-content:space-between;font-weight:700;color:#475569}.bar{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#22c55e;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;color:#172033}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe4f0;border-radius:14px;background:#fff;color:#1e293b;font-size:16px;cursor:pointer;transition:.2s}.opt:hover{background:#eef5ff;border-color:#93c5fd;transform:translateY(-1px)}.opt:focus-visible{outline:3px solid #bfdbfe;outline-offset:2px}.correct{border-color:#16a34a!important;background:#ecfdf3!important;color:#166534!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important;color:#991b1b!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s}.next,.retry{background:#4f46e5;color:#fff}.next:hover,.retry:hover{background:#4338ca}.back{background:#334155;color:#fff}.back:hover{background:#1e293b}.hide{display:none}.xp{text-align:center;font-weight:700;color:#d97706;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>📣 Forced Oscillations & Resonance</h1>
<div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="quiz"></div><div class="xp" id="xp"></div>
<button class="next hide" id="next">Next Question →</button>
<div id="result" class="hide"></div>
<a class="back" href="physics-home-fast.html">← Back to Physics Path</a>
</div></div>
<script>
const qs=[
['Forced oscillations occur when an oscillator is subjected to','no external influence','a periodic external driving force','only gravity','a constant displacement',1,'A periodic external force continuously supplies energy and drives the oscillator.'],
['The frequency of steady-state forced oscillations is mainly determined by the','initial displacement','driving force','mass only','amplitude only',1,'In steady state, the oscillator responds at the frequency of the external driving force.'],
['Resonance occurs when the driving frequency is','zero','far below the natural frequency','close to the natural frequency','always twice the natural frequency',2,'Resonance is the strong response that occurs when the driving frequency is close to the system’s natural frequency, especially for weak damping.'],
['At resonance, the amplitude of a lightly damped oscillator becomes','very small','maximum','zero','independent of driving frequency',1,'For a lightly damped system, the amplitude reaches a large maximum near the natural frequency.'],
['Increasing damping generally makes the resonance peak','sharper and higher','broader and lower','infinitely high','unchanged',1,'Greater damping reduces the peak amplitude and broadens the resonance response.'],
['The amplitude at resonance is strongly affected by','damping','the alphabet','only the initial phase','the color of the oscillator',0,'Damping controls energy loss and therefore strongly influences the maximum resonant amplitude.'],
['A common example of resonance is','a swing pushed periodically at its natural frequency','a stone at rest','uniform motion without a force','a thermometer measuring temperature',0,'Pushing a swing at or near its natural frequency can produce a large amplitude through resonance.'],
['In forced oscillations, the driving force mainly provides','energy to the oscillator','mass to the oscillator','gravity to the oscillator','zero work always',0,'The periodic driving force supplies energy that compensates for energy lost through damping.'],
['For a driven oscillator, when the driving frequency is much higher than the natural frequency, the amplitude generally','remains at its resonant maximum','becomes small','becomes infinite','must be exactly zero',1,'Far above resonance, the displacement amplitude generally decreases.'],
['The phase difference between displacement and driving force','is always zero','depends on driving frequency and damping','is always π','cannot change',1,'The phase difference changes with frequency; it is small at low frequency and approaches π at high frequency.'],
['At resonance in a lightly damped driven oscillator, the phase difference is approximately','0','π/2','π','2π',1,'Near resonance, displacement is approximately 90° out of phase with the driving force in the standard damped oscillator model.'],
['A system with very large damping will generally show','a very sharp resonance peak','a reduced and broad resonance response','infinite amplitude','no energy loss',1,'Large damping suppresses the resonance peak and makes the response less sharply frequency-selective.'],
['The natural angular frequency of an ideal mass-spring oscillator is','√(k/m)','k/m','m/k','2π√(m/k)',0,'For an ideal mass-spring system, the natural angular frequency is ω₀=√(k/m).'],
['If the driving frequency matches the natural frequency of a weakly damped system, the system can exhibit','resonance','free fall','static equilibrium only','zero displacement',0,'Matching the driving and natural frequencies produces resonance when damping is sufficiently small.'],
['The practical importance of resonance is that it can','always be harmless','be useful or destructive depending on the system','remove all damping','make frequency irrelevant',1,'Resonance is used in devices such as tuning circuits but can also cause excessive vibrations in structures and machines.']
];
let i=0,score=0,answered=false;const $=x=>document.getElementById(x);
function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}
function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}
function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}
$('next').onclick=next;render();
</script>
</body></html>
