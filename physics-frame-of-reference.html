<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Frame of Reference</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.xp{font-weight:800}.card{background:white;border-radius:22px;padding:24px;margin-top:18px;box-shadow:0 5px 20px #00000012}.bar{height:10px;background:#e8eaf0;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.3s}.q{font-size:1.3rem;font-weight:750;line-height:1.45}.opts{display:grid;gap:10px;margin-top:18px}.opts button{padding:15px;border:2px solid #e2e5eb;border-radius:14px;background:white;text-align:left;font-size:1rem;cursor:pointer;transition:.2s}.opts button:hover{border-color:#58cc02;transform:translateY(-1px)}.opts button.selected{border-color:#58cc02;background:#f3fff0}.opts button.correct{border-color:#58cc02;background:#eaffef}.opts button.wrong{border-color:#e5484d;background:#fff0f0}.feedback{font-weight:700;margin-top:16px;min-height:24px}.btn{margin-top:18px;padding:13px 22px;border:0;border-radius:14px;background:#58cc02;color:white;font-weight:800;cursor:pointer;transition:.2s;box-shadow:0 4px 0 #45a800}.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #45a800}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #45a800}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}.back{display:inline-flex;align-items:center;gap:7px;margin-top:20px;padding:12px 18px;border:2px solid #5146a5;border-radius:14px;background:white;color:#5146a5;font-weight:800;text-decoration:none;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,background .2s,color .2s}.back:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#eeeaff,transparent);transform:translateX(-120%);transition:transform .5s}.back:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 6px 18px #5146a533;background:#faf9ff;color:#40378d}.back:hover:before{transform:translateX(120%)}.back:active{transform:translateY(1px) scale(.99);box-shadow:0 2px 8px #5146a522}.back:focus-visible{outline:3px solid #c9c3ff;outline-offset:3px}@media(max-width:600px){.wrap{padding:18px 12px}.card{padding:18px}.q{font-size:1.15rem}.top{align-items:flex-start}.back{width:max-content}}</style></head><body><main class="wrap"><div class="top"><h1>🧭 Frame of Reference</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></div><p>Master reference frames, relative motion and coordinate systems with 15 NEET-style questions.</p><section class="card"><div style="display:flex;justify-content:space-between;gap:12px"><strong>🎯 Skill Mastery</strong><strong id="masteryText">0 / 15</strong></div><div class="bar" style="margin-top:8px"><div id="fill" class="fill"></div></div></section><section class="card"><div id="count"></div><p id="question" class="q"></p><div id="options" class="opts"></div><button id="check" class="btn" disabled>Check Answer</button><button id="next" class="btn" disabled>Continue →</button><div id="feedback" class="feedback"></div><p>💡 <span id="hint">Choose the best answer.</span></p><div id="result" style="display:none;text-align:center"><h2>🎉 Frame of Reference mastered!</h2><p id="score"></p><button id="retry" class="btn">Retry Skill</button></div></section><a class="back" href="physics-home.html" aria-label="Back to Physics Path">← <span>Back to Physics Path</span></a></main><script>const qs=[['What is a frame of reference?',['A coordinate system and clock used to describe the position and motion of objects','A physical force acting on an object','Only the SI unit of distance','A measuring instrument only'],0,'A frame of reference provides coordinates and time so motion can be described.'],['The position of an object is meaningful only when specified relative to:',['A reference frame or origin','Its mass','Its temperature','Its colour'],0,'Position is defined relative to a chosen reference point or frame.'],['An observer standing on a railway platform is approximately in which frame for a passing train?',['Ground frame','Train frame','Only an accelerating frame','No frame'],0,'The platform is approximately at rest in the ground or Earth frame.'],['A passenger sitting inside a moving train is at rest relative to:',['The train','The railway platform','A distant stationary tree','The Sun in every case'],0,'The passenger and train share the same motion, so the passenger is at rest relative to the train.'],['The same passenger is moving relative to:',['The railway platform','Another passenger sitting beside them','A seat fixed to the train','The train itself'],0,'The passenger changes position relative to the platform, so they are moving in that frame.'],['Which statement about rest and motion is correct?',['An object can be at rest in one frame and moving in another','Rest is always absolute','Motion is independent of the observer','An object must move in every frame'],0,'Rest and motion depend on the chosen reference frame.'],['A car moves at 20 m/s east relative to the road. Its velocity relative to the road frame is:',['20 m/s east','20 m/s west','0 m/s','40 m/s west'],0,'The road is the chosen reference frame, so the velocity is 20 m/s east.'],['Two cars move east at 20 m/s and 15 m/s. Velocity of the first relative to the second is:',['5 m/s east','5 m/s west','35 m/s east','0 m/s'],0,'Relative velocity v₁₂ = 20 − 15 = 5 m/s east.'],['If two objects move together with the same velocity, their relative velocity is:',['Zero','Equal to their common velocity','Twice their velocity','Infinite'],0,'Equal velocities give zero relative velocity.'],['A person walks east at 2 m/s inside a train moving east at 10 m/s relative to the ground. The person’s ground velocity is:',['12 m/s east','8 m/s east','10 m/s east','2 m/s east'],0,'For same-direction velocities, 10 + 2 = 12 m/s east.'],['If the person in the previous question walks west at 2 m/s, their ground velocity is:',['8 m/s east','12 m/s east','2 m/s west','10 m/s west'],0,'For opposite directions, 10 − 2 = 8 m/s east.'],['Which coordinate is commonly used to specify position in one-dimensional motion?',['A signed coordinate x measured from a chosen origin','Mass only','Temperature only','Force only'],0,'One-dimensional position is represented by a signed coordinate relative to an origin.'],['Changing the origin of a coordinate system changes:',['The numerical position coordinate, but not the physical motion itself','The mass of the object','The object’s actual speed automatically','The laws of physics'],0,'Coordinates depend on the chosen origin, while physical predictions remain consistent.'],['For non-relativistic motion, relative velocity of A with respect to B is:',['v_AB = v_A − v_B','v_AB = v_A + v_B always','v_AB = v_Av_B','v_AB = v_B − v_A always'],0,'Using the vector convention, v_AB = v_A − v_B.'],['Which is the best NEET statement about a frame of reference?',['Motion, position and velocity are described relative to a chosen frame','Every observer must obtain the same velocity','Reference frames are unrelated to coordinates','Only stationary objects need a reference frame'],0,'A reference frame is essential for describing position and motion consistently.']];let i=0,selected=-1,score=0,answered=0;const $=id=>document.getElementById(id);function progress(){answered=Math.max(answered,i+1);$('masteryText').textContent=answered+' / '+qs.length;$('fill').style.width=(answered*100/qs.length)+'%'}function render(){const a=qs[i];selected=-1;$('count').textContent=`Question ${i+1} of ${qs.length}`;$('question').textContent=a[0];$('options').innerHTML='';$('feedback').textContent='';$('hint').textContent='Choose the best answer.';$('check').disabled=true;$('next').disabled=true;$('next').textContent='Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const b=document.createElement('button');b.textContent=`${String.fromCharCode(65+j)}. ${item.text}`;b.dataset.index=item.index;b.onclick=()=>{selected=item.index;[...$('options').children].forEach((x,k)=>x.classList.toggle('selected',k===j));$('check').disabled=false};$('options').appendChild(b)})}function checkAnswer(){if(selected<0)return;const a=qs[i],ok=selected===a[2];[...$('options').children].forEach(b=>{const originalIndex=Number(b.dataset.index);b.disabled=true;if(originalIndex===a[2])b.classList.add('correct');if(originalIndex===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=ok?'✅ Correct! +10 XP — '+a[3]:'❌ Not quite. Correct answer: '+a[1][a[2]]+' — '+a[3];if(ok){score++;$('xp').textContent=score*10}progress();$('check').disabled=true;$('next').disabled=false;if(i===qs.length-1)$('next').textContent='Finish →'}function finish(){$('question').textContent='🎉 Skill complete!';$('options').innerHTML='';$('check').style.display='none';$('next').style.display='none';$('feedback').textContent=`You scored ${score} / ${qs.length} • ${score*10} XP`;$('hint').textContent=score===15?'Excellent! Perfect frame-of-reference mastery.':'Keep practicing and try again to improve your score.';$('result').style.display='block';$('score').textContent=`${score} / ${qs.length} correct`;answered=15;progress();$('fill').style.width='100%'}$('check').onclick=checkAnswer;$('next').onclick=()=>{if(i<qs.length-1){i++;render()}else finish()};$('retry').onclick=()=>{i=0;selected=-1;score=0;answered=0;$('xp').textContent='0';$('result').style.display='none';$('check').style.display='inline-block';$('next').style.display='inline-block';progress();render()};progress();render();</script></body></html>
