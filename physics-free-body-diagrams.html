<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp | Free-Body Diagrams</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.top h1{font-size:1.8rem;margin:0}.xp{font-weight:800;color:#5146a5}.hero{background:#5865f2;color:#fff;border-radius:22px;padding:24px;margin-bottom:18px}.hero h2{margin:0 0 8px;font-size:1.45rem}.hero p{margin:0;opacity:.95;line-height:1.5}.progress-card,.quiz-card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 6px 20px #17203312}.progress-card{margin-bottom:18px}.progress-row{display:flex;justify-content:space-between;font-weight:750;margin-bottom:10px}.track{height:12px;background:#e8e8ef;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:width .25s ease}.quiz-card{min-height:360px}.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#626b7d;font-weight:750;margin-bottom:18px}.badge{background:#eef0ff;color:#5146a5;padding:6px 10px;border-radius:999px}.question{font-size:1.3rem;font-weight:750;line-height:1.45;margin-bottom:18px}.options{display:grid;gap:11px}.option{width:100%;text-align:left;background:#fff;border:2px solid #d8dbe5;border-radius:14px;padding:15px;font:inherit;color:inherit;cursor:pointer;transition:transform .12s ease,border-color .12s ease,background .12s ease}.option:hover{border-color:#58cc02;background:#f7fff2;transform:translateY(-1px)}.option.selected{border-color:#5146a5;background:#f0edff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#ff4b4b;background:#fff0f0}.option:disabled{cursor:default}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button.action{border:0;border-radius:14px;padding:13px 18px;font:inherit;font-weight:800;cursor:pointer;transition:transform .12s ease,filter .12s ease}#check{background:#58cc02;color:#fff}#next{background:#5146a5;color:#fff}button.action:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.05)}button.action:disabled{opacity:.5;cursor:not-allowed}.feedback{margin-top:16px;min-height:28px;font-weight:750;line-height:1.5}.feedback.good{color:#2d8a00}.feedback.bad{color:#c53030}.hint{margin-top:10px;color:#687184;font-size:.95rem}.result{display:none;margin-top:18px;padding:18px;border-radius:16px;background:#f3f0ff;font-weight:800}.retry{margin-top:14px;background:#5146a5;color:#fff;border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.back{display:inline-block;margin-top:22px;color:#5146a5;font-weight:800;text-decoration:underline;padding:10px 14px;border-radius:12px;transition:transform .12s ease,background .12s ease,box-shadow .12s ease}.back:hover{background:#f0edff;transform:translateY(-1px);box-shadow:0 4px 12px #5146a522}.back:focus-visible{outline:3px solid #9b94e8;outline-offset:2px;background:#f0edff}.back:active{transform:translateY(1px);box-shadow:none}@media(max-width:600px){.wrap{padding:20px 14px 34px}.top{align-items:flex-start}.top h1{font-size:1.5rem}.hero,.progress-card,.quiz-card{padding:20px;border-radius:18px}.question{font-size:1.15rem}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><h1>Physics • Free-Body Diagrams</h1><div class="xp">⚡ <span id="xp">0</span> XP</div></div>
<section class="hero"><h2>Free-Body Diagrams</h2><p>Learn to represent all external forces acting on an object so Newton’s laws can be applied correctly.</p></section>
<section class="progress-card"><div class="progress-row"><span>Mastery</span><span id="mastery">0%</span></div><div class="track"><div id="fill" class="fill"></div></div></section>
<section class="quiz-card">
<div class="meta"><span id="count">Question 1 of 15</span><span id="pct" class="badge">7%</span></div>
<div id="question" class="question"></div><div id="options" class="options"></div>
<div class="actions"><button id="check" class="action">Check Answer</button><button id="next" class="action" disabled>Next Question →</button></div>
<div id="feedback" class="feedback"></div><div id="hint" class="hint"></div>
<div id="result" class="result"><div id="score"></div><button id="retry" class="retry">Retry Skill</button></div>
</section>
<a id="back" class="back" href="physics-home.html">← Back to Physics Path</a>
</main>
<script>
(function(){
const quiz=[
['What is the main purpose of a free-body diagram?',['To show all external forces acting on an object','To show the path of the object','To calculate only its mass','To show only internal forces'],0,'A free-body diagram isolates one object and shows the external forces acting on it.'],
['In a free-body diagram, an object is usually represented by:',['A simple point or box','A complete photograph','A graph of velocity','A circuit diagram'],0,'The object is simplified to a point or box so the forces are easy to identify.'],
['The force due to gravity on an object is represented by an arrow:',['Vertically downward','Vertically upward','Always horizontally right','Always horizontally left'],0,'Near Earth, the weight of an object acts vertically downward.'],
['The normal reaction from a horizontal surface acts:',['Perpendicular to the surface','Parallel to the surface','Always downward','Along the direction of motion'],0,'The normal force is perpendicular to the contact surface.'],
['Friction on a sliding object generally acts:',['Opposite to the relative motion or tendency of motion','In the same direction as motion','Vertically upward only','Toward the centre of Earth'],0,'Friction opposes relative sliding or the tendency for surfaces to slide.'],
['A tension force in a string acts:',['Along the string, pulling the attached object','Perpendicular to the string','Always downward','Only when the object is moving'],0,'An ideal string exerts tension along its own length and pulls the attached object.'],
['Which force should be included in the free-body diagram of a block resting on a table?',['Weight and normal reaction','Only weight','Only normal reaction','The table’s mass'],0,'For a resting block, weight acts downward and the table provides an upward normal reaction.'],
['If a block is pulled rightward by a rope and friction acts leftward, the free-body diagram should show:',['Pulling force right and friction left','Both forces right','Both forces left','Neither force'],0,'Forces must be drawn with their actual directions on the isolated object.'],
['For an object moving in a circle, the net force points:',['Toward the centre of the circular path','Away from the centre only','Always upward','Always along the tangent'],0,'The required centripetal acceleration is inward, so the net force points toward the centre.'],
['Which statement about a free-body diagram is correct?',['It shows forces acting on the chosen object, not forces exerted by it on other objects','It must show every object in the environment','It shows only balanced forces','It replaces Newton’s laws'],0,'A free-body diagram isolates one chosen object and includes forces acting on that object.'],
['A book is at rest on a table. If the book’s weight is 20 N, the normal force from the table is:',['20 N upward','10 N upward','20 N downward','0 N'],0,'With no vertical acceleration, the upward normal force balances the 20 N downward weight.'],
['A 5 kg block on a horizontal surface has a horizontal applied force of 15 N and friction of 5 N opposite it. The net horizontal force is:',['10 N in the direction of the applied force','20 N opposite the applied force','5 N in the direction of the applied force','0 N'],0,'Net force = 15 N − 5 N = 10 N in the applied-force direction.'],
['Which force is NOT normally an external force on a simple block being pushed across a floor?',['The internal molecular forces within the block','Applied push','Friction from the floor','Weight'],0,'Internal forces within the block are not drawn as external forces in its free-body diagram.'],
['If the net force on an object is zero, its free-body diagram must show:',['Forces whose vector sum is zero','No forces at all','Only one force','Only gravity'],0,'Zero net force means the vector sum of all forces is zero; forces can still be present.'],
['When drawing a free-body diagram, the safest first step is to:',['Choose and isolate the object being analysed','Immediately calculate acceleration','Draw the velocity graph','Ignore contact forces'],0,'First identify the object of interest, then list and draw every external force acting on it.']
];
const $=id=>document.getElementById(id);let i=0,selected=-1,correct=0,xp=0,checked=false;
function render(){const a=quiz[i];selected=-1;checked=false;$('question').textContent=a[0];$('count').textContent='Question '+(i+1)+' of '+quiz.length;$('pct').textContent=Math.round((i+1)/quiz.length*100)+'%';$('feedback').className='feedback';$('feedback').textContent='';$('hint').textContent='Identify the object first, then account for every external force.';$('next').disabled=true;$('next').textContent='Next Question →';$('check').disabled=false;$('options').innerHTML='';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach(item=>{const b=document.createElement('button');b.className='option';b.textContent=item.text;b.dataset.index=item.index;b.onclick=()=>{if(checked)return;selected=item.index;[...$('options').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('options').appendChild(b)});updateProgress()}
function updateProgress(){$('mastery').textContent=Math.round(correct/quiz.length*100)+'%';$('fill').style.width=(correct/quiz.length*100)+'%';$('xp').textContent=xp}
function check(){if(selected<0||checked)return;checked=true;const a=quiz[i],ok=selected===a[2];[...$('options').children].forEach(b=>{const idx=Number(b.dataset.index);b.disabled=true;if(idx===a[2])b.classList.add('correct');if(idx===selected&&!ok)b.classList.add('wrong')});if(ok){correct++;xp+=10;$('feedback').className='feedback good';$('feedback').textContent='✓ Correct — '+a[3]}else{$('feedback').className='feedback bad';$('feedback').textContent='✗ Review — '+a[3]}$('next').disabled=false;$('check').disabled=true;updateProgress();if(i===quiz.length-1)$('next').textContent='Finish Skill →'}
function next(){if(!checked)return;if(i<quiz.length-1){i++;render()}else{$('question').textContent='🏆 Free-Body Diagrams Complete!';$('options').innerHTML='';$('check').style.display='none';$('next').style.display='none';$('hint').textContent='';$('feedback').className='feedback good';$('feedback').textContent='Skill complete. '+xp+' XP earned.';$('result').style.display='block';$('score').textContent=correct+' / '+quiz.length+' correct • '+xp+' XP'}}
$('check').onclick=check;$('next').onclick=next;$('retry').onclick=()=>{i=0;selected=-1;correct=0;xp=0;$('result').style.display='none';$('check').style.display='';$('next').style.display='';render()};$('back').onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();
})();
</script>
</body>
</html>
