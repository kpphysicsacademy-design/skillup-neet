<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Free-fall Motion</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eef7ff;color:#173b62}.wrap{max-width:1050px;margin:auto;padding:20px}.hero,.mastery,.panel,.quiz{background:#fff;border-radius:20px;padding:22px;margin:12px 0;box-shadow:0 6px 18px #123b7015}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff}.hero h1{margin:12px 0 8px}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}.options{display:grid;gap:10px;margin:18px 0}.option{padding:14px;border:2px solid #dbe7f1;border-radius:15px;background:#fff;text-align:left;font-weight:700;cursor:pointer;font-size:16px}.option.selected{border-color:#1677ff;background:#eef6ff}.option.correct{border-color:#2db84d!important;background:#eaffef!important}.option.wrong{border-color:#e5484d!important;background:#fff0f0!important}.btn{padding:12px 18px;border:0;border-radius:13px;font-weight:900;cursor:pointer;margin:8px 6px 0 0}.check{background:#2db84d;color:#fff}.next{background:#dcecff;color:#145b9e}.btn:disabled{opacity:.55;cursor:not-allowed}.feedback{margin-top:14px;padding:13px;border-radius:14px;min-height:20px}.good{background:#e5f9e9}.bad{background:#fff0f0}.bar{height:13px;background:#dce8f2;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#42c95a;transition:width .25s ease}@media(max-width:750px){.layout{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><main class="wrap"><p><a href="physics-home.html">← Back to Physics Path</a></p><section class="hero"><div>PHYSICS • NEET 2026</div><h1>Free-fall motion</h1><p>LEARN → PRACTICE → MASTER • 15 focused NEET-style MCQs</p></section><section class="mastery">🎯 Skill Mastery <b id="mt">0 / 15</b><div class="bar"><div id="fill" class="fill"></div></div></section><div class="layout"><aside class="panel">
