<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Free-fall Motion</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.xp{background:#fff;border:1px solid #dfe5ee;border-radius:14px;padding:9px 14px;font-weight:800;box-shadow:0 4px 12px #17203312}.hero{background:linear-gradient(135deg,#1557a6,#198be8);color:#fff;border-radius:22px;padding:26px 20px;margin-bottom:12px}.hero h1{margin:12px 0 8px;font-size:1.8rem}.hero p{margin:0}.card{background:#fff;border-radius:22px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #17203312}.bar{height:11px;background:#dce6ef;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#58cc02;transition:width .25s ease}.quiz h2{font-size:1.3rem;line-height:1.45;margin:14px 0}.options{display:grid;gap:9px}.option{padding:14px 15px;border:2px solid #dce3eb;border-radius:14px;background:#fff;text-align:left;font-weight:700;cursor:pointer;font-size:15px}.option:hover{border-color:#58cc02;background:#f5fff0}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#2db84d;background:#eaffef}.option.wrong{border-color:#e5484d;background:#fff0f0}.actions{margin-top:12px}.btn{padding:12px 17px;border:0;border-radius:13px;font-weight:900;cursor:pointer;margin-right:7px}.check{background:#2db84d;color:#fff}.next{background:#dcecff;color:#145b9e}.btn:disabled{opacity:.5;cursor:not-allowed}.feedback{min-height:22px;margin-top:14px;font-weight:700}.good{color:#176c31}.bad{color:#a12b30}.hint{margin-top:18px}.back{display:inline-block;margin-top:8px;color:#5146a5;font-weight:700;text-decoration:none;border-radius:10px;padding:8px 10px;transition:background .15s,transform .1s,box-shadow .15s}.back:hover{background:#eeeafd;box-shadow:0 4px 10px #5146a520}.back:focus-visible{outline:3px solid #b8aef5;outline-offset:2px}.back:active{transform:translateY(1px)}@media(max-width:600px){.wrap{padding:18px 12px}.hero h1{font-size:1.5rem}.top{align-items:flex-start}}
</style></head><body><main class="wrap"><div class="top"><div></div><span class="xp">⚡ <span id="xp">0</span> XP</span></div><section class="hero"><div>PHYSICS • NEET 2026</div><h1>Free-fall motion</h1><p>LEARN → PRACTICE → MASTER • 15 focused NEET-style MCQs</p></section><section class="card"><b>🎯 Progress <span id="mt">0 / 15</span></b><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card quiz"><div><b id="count">Question 1 of 15</b></div><small id="pct">7%</small><h2 id="q"></h2><div id="opts" class="options"></div><div class="actions"><button id="check" class="btn check">Check Answer</button><button id="next" class="btn next" disabled>Next Question →</button></div><div id="fb" class="feedback">💡 Choose the best answer.</div><p class="hint">💡 Answer each question carefully and review the explanation after checking.</p></section><a class="back" href="#" onclick="return goBackToPath()">← Back to Physics Path</a></main><script>(function(){'use strict';const quiz=[['Free fall is motion under the influence of:',['Gravity alone, neglecting air resistance','Magnetic force only','Friction only','No force'],0],['Near Earth, free-fall acceleration is approximately:',['9.8 m/s² downward','9.8 m/s upward','0 m/s²','98 m/s² upward'],0],['The acceleration due to gravity is denoted by:',['g','v','s','t'],0],['For an object released from rest in free fall, initial velocity is:',['0','g','9.8 m/s','1 m/s'],0],['Ignoring air resistance, all freely falling bodies have:',['The same acceleration near Earth','The same mass','The same velocity at all times','Zero acceleration'],0],['An object is dropped from rest. Its velocity after time t is:',['v = gt','v = g/t','v = t/g','v = 0 always'],0],['Distance fallen from rest in time t is:',['s = ½gt²','s = gt','s = g/t²','s = 2gt²'],0],['For upward positive direction, acceleration during free fall near Earth is:',['−g','+g','0','+1/g'],0],['At the highest point of an object thrown vertically upward, its instantaneous velocity is:',['Zero','g','Maximum','−g'],0],['At the highest point of vertical upward motion, acceleration is:',['Downward g','Zero','Upward g','Infinite'],0],['If air resistance is neglected, the speed of a freely falling body:',['Increases uniformly with time when falling from rest','Remains zero','Decreases uniformly while falling from rest','Is always g'],0],['The velocity-time graph for free fall with constant acceleration is:',['A straight line','A circle','A parabola','A horizontal curve only'],0],['The slope of a velocity-time graph represents:',['Acceleration','Displacement','Mass','Distance'],0],['If g = 10 m/s², an object dropped from rest falls in 2 s with speed:',['20 m/s','5 m/s','10 m/s','40 m/s'],0],['Which equation is valid for vertical motion with constant acceleration g?',['v² = u² + 2gs (with consistent sign convention)','v = u + s²','s = vt² always','g = uv'],0]];let i=0,sel=-1,score=0,answered=false;const $=id=>document.getElementById(id),q=$('q'),o=$('opts'),fb=$('fb'),check=$('check'),next=$('next');function render(){const a=quiz[i];sel=-1;answered=false;q.textContent=a[0];$('count').textContent='Question '+(i+1)+' of '+quiz.length;$('pct').textContent=Math.round((i+1)/quiz.length*100)+'%';o.innerHTML='';fb.className='feedback';fb.textContent='💡 Choose the best answer.';check.disabled=false;next.disabled=true;next.textContent=i===quiz.length-1?'Finish Skill →':'Next Question →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const b=document.createElement('button');b.type='button';b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{if(answered)return;sel=item.index;Array.from(o.children).forEach((x,k)=>x.classList.toggle('selected',k===j));check.disabled=false};o.appendChild(b)})}check.onclick=()=>{if(answered)return;if(sel<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}const a=quiz[i];Array.from(o.children).forEach(b=>{const originalIndex=Number(b.dataset.index);b.disabled=true;if(originalIndex===a[2])b.classList.add('correct');if(originalIndex===sel&&sel!==a[2])b.classList.add('wrong')});answered=true;if(sel===a[2]){score++;fb.className='feedback good';fb.textContent='🎯 Correct! +10 XP'}else{fb.className='feedback bad';fb.textContent='Review. Correct answer: '+a[1][a[2]]}$('xp').textContent=score*10;$('mt').textContent=score+' / '+quiz.length;$('fill').style.width=score/quiz.length*100+'%';check.disabled=true;next.disabled=false};next.onclick=()=>{if(!answered)return;if(i<quiz.length-1){i++;render()}else{q.textContent='🏆 Free-fall Motion Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+score+' / '+quiz.length+' correct • '+score*10+' XP'}};function goBackToPath(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false}window.goBackToPath=goBackToPath;render()})();</script></body></html>
