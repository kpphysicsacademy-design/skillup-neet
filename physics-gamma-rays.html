<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Gamma Rays</title><meta name="description" content="SkillUp Physics Gamma Rays interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">☢️</span><h1>Gamma Rays</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["Gamma rays are a type of:",["Electromagnetic radiation","Mechanical waves","Sound waves","Matter waves only"],0,"Gamma rays are electromagnetic waves with extremely high frequency and very short wavelength."] ,["Compared with X-rays, gamma rays generally have:",["Higher frequency and higher photon energy","Lower frequency and lower photon energy","The same frequency always","Zero photon energy"],0,"Gamma rays occupy the highest-frequency, highest-energy region of the electromagnetic spectrum."] ,["The speed of gamma rays in vacuum is approximately:",["3×10⁸ m/s","3×10⁶ m/s","3×10⁴ m/s","3×10¹⁰ m/s"],0,"All electromagnetic waves travel at approximately 3×10⁸ m/s in vacuum."] ,["Gamma-ray photons have energy given by:",["E=hf","E=h/f","E=f/h","E=h+f"],0,"Photon energy is E=hf, so the very high frequency of gamma rays corresponds to high photon energy."] ,["A common natural source of gamma rays is:",["Radioactive nuclear decay","A vibrating tuning fork","A refrigerator motor only","A water wave"],0,"Gamma radiation is commonly emitted during transitions of unstable atomic nuclei, especially radioactive decay."] ,["Gamma rays are produced in the nucleus during many radioactive decays because:",["The nucleus releases excess energy","Electrons become sound waves","The nucleus stops moving permanently","Air molecules emit visible light"],0,"An excited daughter nucleus can release excess energy as a high-energy gamma photon."] ,["Gamma rays are classified as ionizing radiation because they can:",["Remove electrons from atoms or molecules","Travel only through air","Produce sound directly","Have no interaction with matter"],0,"Gamma photons can transfer enough energy to ionize atoms and molecules."] ,["Which property of gamma rays is generally greater than that of visible light?",["Frequency","Wavelength","Period","Speed in vacuum"],0,"Gamma rays have much higher frequency and therefore much shorter wavelength than visible light."] ,["One important medical use of gamma radiation is:",["Radiotherapy for certain cancers","Measuring room temperature","Making sound recordings","Producing ordinary radio broadcasts"],0,"Controlled gamma radiation can be used to damage cancer cells in radiotherapy."] ,["Gamma rays are useful for sterilization because they can:",["Damage microorganisms and their genetic material","Increase the size of bacteria","Turn bacteria into visible light","Prevent all chemical reactions"],0,"High-energy gamma radiation can destroy microorganisms and is used to sterilize some medical equipment and products."] ,["Which material is commonly used to shield against penetrating gamma radiation?",["Lead or thick concrete","Paper only","Thin plastic film only","Cotton cloth"],0,"Dense materials such as lead and thick concrete can attenuate gamma radiation effectively."] ,["Among radio waves, visible light, X-rays and gamma rays, which has the shortest wavelength?",["Gamma rays","X-rays","Visible light","Radio waves"],0,"Gamma rays have the shortest wavelengths among these four categories."] ,["If the frequency of a gamma ray increases, its wavelength in vacuum:",["Decreases","Increases","Remains fixed","Becomes infinite"],0,"Since c=fλ, wavelength decreases as frequency increases in vacuum."] ,["Which statement about gamma rays is correct?",["They are electromagnetic and highly penetrating ionizing radiation","They are mechanical waves requiring air","They always travel slower than sound in vacuum","They have less photon energy than radio waves"],0,"Gamma rays are electromagnetic, highly energetic, ionizing radiation and can be very penetrating."] ,["In radiation protection, unnecessary gamma-ray exposure should be reduced by:",["Minimizing time, maximizing appropriate distance and using suitable shielding","Increasing exposure time","Removing shielding","Standing closer to the source"],0,"Radiation protection follows the principles of justification and optimization, with time, distance and shielding used to reduce exposure."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
