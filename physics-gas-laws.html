.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}

.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🌡️ Gas Laws</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[{"q":"Which law states that pressure is inversely proportional to volume at constant temperature for a fixed amount of gas?","o":["Boyle's law","Charles's law","Avogadro's law","Dalton's law"],"a":0,"e":"Boyle's law gives PV = constant when temperature and amount are fixed."},{"q":"Which relationship expresses Charles's law?","o":["V/T = constant at constant pressure","P/V = constant at constant temperature","P/T = constant at constant volume","PV = constant at constant pressure"],"a":0,"e":"Charles's law states that volume is proportional to absolute temperature at constant pressure."},{"q":"At constant volume, which law states that pressure is proportional to absolute temperature?","o":["Gay-Lussac's pressure law","Boyle's law","Avogadro's law","Hooke's law"],"a":0,"e":"At fixed volume and amount, P/T remains constant."},{"q":"Avogadro's law states that, at the same temperature and pressure, gas volume is proportional to…","o":["Amount of gas in moles","Molar mass only","Density squared","Container surface area"],"a":0,"e":"At fixed temperature and pressure, V is proportional to n."},{"q":"For a fixed amount of gas, the combined gas law is…","o":["P₁V₁/T₁ = P₂V₂/T₂","P₁T₁/V₁ = P₂T₂/V₂","P₁V₁T₁ = P₂V₂T₂","P₁ + V₁ = P₂ + V₂"],"a":0,"e":"The quantity PV/T stays constant for a fixed amount of gas."},{"q":"Which temperature scale must be used in gas-law calculations?","o":["Kelvin","Celsius without conversion","Fahrenheit","Any scale"],"a":0,"e":"Gas laws use absolute temperature in kelvin."},{"q":"A gas at 100 kPa occupies 4 L. At constant temperature, it is compressed to 2 L. Its final pressure is…","o":["200 kPa","50 kPa","100 kPa","400 kPa"],"a":0,"e":"Boyle's law: P₂ = P₁V₁/V₂ = 100 × 4/2 = 200 kPa."},{"q":"A gas occupies 2 L at 300 K. At constant pressure it is heated to 450 K. Its final volume is…","o":["3 L","1.33 L","2 L","4.5 L"],"a":0,"e":"V₂ = V₁T₂/T₁ = 2 × 450/300 = 3 L."},{"q":"A gas has pressure 120 kPa at 300 K. At constant volume, its pressure at 400 K is…","o":["160 kPa","90 kPa","120 kPa","200 kPa"],"a":0,"e":"P₂ = P₁T₂/T₁ = 120 × 400/300 = 160 kPa."},{"q":"If the number of moles doubles at constant temperature and pressure, the volume…","o":["Doubles","Halves","Remains unchanged","Becomes zero"],"a":0,"e":"Avogadro's law gives V ∝ n at fixed pressure and temperature."},{"q":"A fixed amount of gas has P₁ = 100 kPa, V₁ = 3 L, T₁ = 300 K. If V₂ = 2 L and T₂ = 400 K, P₂ is…","o":["200 kPa","50 kPa","150 kPa","300 kPa"],"a":0,"e":"P₂ = P₁V₁T₂/(T₁V₂) = 100 × 3 × 400/(300 × 2) = 200 kPa."},{"q":"Which pair of variables is held constant in Boyle's law?","o":["Temperature and amount of gas","Pressure and temperature","Volume and amount of gas","Pressure and volume"],"a":0,"e":"Boyle's law applies to a fixed amount of gas at constant temperature."},{"q":"Which variables are held constant in Charles's law?","o":["Pressure and amount of gas","Volume and temperature","Pressure and volume","Temperature and amount only varies"],"a":0,"e":"Charles's law compares volume and temperature with pressure and amount fixed."},{"q":"Which variables are held constant in the pressure law?","o":["Volume and amount of gas","Pressure and temperature","Pressure and volume","Volume and temperature"],"a":0,"e":"The pressure law applies at constant volume for a fixed amount of gas."},{"q":"At constant pressure, if absolute temperature falls to half its initial value, the gas volume…","o":["Falls to half","Doubles","Remains constant","Becomes four times"],"a":0,"e":"Charles's law gives V ∝ T at constant pressure."},{"q":"At constant volume, if absolute temperature triples, pressure…","o":["Triples","Falls to one-third","Does not change","Becomes nine times"],"a":0,"e":"Gay-Lussac's law gives P ∝ T at constant volume."},{"q":"If both pressure and volume double for a fixed amount of gas, absolute temperature…","o":["Becomes four times as large","Doubles","Halves","Remains constant"],"a":0,"e":"From T ∝ PV, doubling both P and V makes T four times larger."},{"q":"The ideal gas equation is…","o":["PV = nRT","P + V = nRT","P/T = nRV","PV = nR/T"],"a":0,"e":"The equation of state for an ideal gas is PV = nRT."},{"q":"What is the SI unit of the universal gas constant R?","o":["J mol⁻¹ K⁻¹","Pa m⁻³","kg mol⁻¹","K mol J"],"a":0,"e":"R has units of joules per mole per kelvin."},{"q":"A pressure of 1.0 × 10⁵ Pa acts on a gas volume of 0.01 m³. The product PV is…","o":["1000 J","100 J","10 J","10,000 J"],"a":0,"e":"PV = 10⁵ × 0.01 = 1000 Pa·m³ = 1000 J."},{"q":"A gas is heated at constant volume. What happens to its pressure if its Kelvin temperature increases by 20%?","o":["It increases by 20%","It decreases by 20%","It doubles","It stays constant"],"a":0,"e":"At constant volume, pressure changes in direct proportion to absolute temperature."},{"q":"Which statement is true for a fixed amount of gas at constant temperature?","o":["Increasing pressure decreases volume","Increasing pressure increases volume","Pressure is independent of volume","Volume is proportional to pressure"],"a":0,"e":"Boyle's law predicts an inverse relationship between pressure and volume."},{"q":"Two containers have equal volumes of ideal gas at the same pressure and temperature. They contain…","o":["Equal numbers of molecules","Equal molecular masses in every case","No molecules","Different molecule counts necessarily"],"a":0,"e":"Equal P, V and T imply equal amount of gas by the ideal-gas equation."},{"q":"Why is gauge pressure not directly substituted into PV = nRT?","o":["The equation requires absolute pressure","Gauge pressure has units of energy","Gauge pressure is always zero","Kelvin temperature cannot be used with it"],"a":0,"e":"Convert gauge pressure to absolute pressure by adding atmospheric pressure."},{"q":"A gas at 27°C is heated to 127°C at constant pressure. If its initial volume is 2 L, the final volume is approximately…","o":["2.67 L","4 L","1.5 L","3 L"],"a":0,"e":"Convert to kelvin: 300 K and 400 K. Then V₂ = 2 × 400/300 ≈ 2.67 L."},{"q":"A gas at 27°C has pressure 90 kPa at constant volume. Its pressure at 127°C is…","o":["120 kPa","67.5 kPa","90 kPa","150 kPa"],"a":0,"e":"P₂ = 90 × 400/300 = 120 kPa."},{"q":"What does the ideal-gas model assume about intermolecular forces between collisions?","o":["They are negligible","They are always strongly attractive","They permanently bind molecules together","They increase with container volume"],"a":0,"e":"Ideal gas molecules are assumed to exert negligible intermolecular forces except during collisions."},{"q":"Which conditions make a real gas most likely to follow gas laws closely?","o":["Low pressure and high temperature","High pressure and low temperature","High density and low temperature","Near condensation"],"a":0,"e":"Low density and high thermal energy reduce the significance of molecular volume and attractions."},{"q":"If pressure and absolute temperature both remain constant while the amount of gas increases by 50%, volume…","o":["Increases by 50%","Decreases by 50%","Remains unchanged","Doubles"],"a":0,"e":"At fixed P and T, V is proportional to the number of moles."},{"q":"A gas occupies 5 L at 250 K and constant pressure. At 300 K its volume becomes…","o":["6 L","4.17 L","5 L","7.5 L"],"a":0,"e":"V₂ = 5 × 300/250 = 6 L."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Gas Laws Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
