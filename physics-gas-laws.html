const questions = [{"q":"Boyle's law relates pressure and volume at constant…","o":["Temperature and amount of gas","Pressure only","Molar mass only","Density only"],"a":0,"e":"For a fixed amount of gas at constant temperature, pressure is inversely proportional to volume."},{"q":"Which equation expresses Boyle's law for a fixed gas sample?","o":["\\(P_1V_1=P_2V_2\\)","\\(P_1/V_1=P_2/V_2\\)","\\(P_1T_1=P_2T_2\\)","\\(V_1T_1=V_2T_2\\)"],"a":0,"e":"At constant temperature, \\(PV=\\text{constant}\\)."},{"q":"Charles's law states that volume is proportional to absolute temperature at constant…","o":["Pressure","Volume","Temperature","Molar mass"],"a":0,"e":"Charles's law gives \\(V/T=\\text{constant}\\) when pressure and amount are fixed."},{"q":"Which relation represents Charles's law?","o":["\\(V_1/T_1=V_2/T_2\\)","\\(P_1V_1=P_2V_2\\)","\\(P_1/T_1=P_2/T_2\\)","\\(V_1P_1=V_2T_2\\)"],"a":0,"e":"Use absolute temperature in kelvin in Charles's law."},{"q":"Gay-Lussac's pressure law applies at constant…","o":["Volume","Pressure","Temperature","Molecular speed"],"a":0,"e":"At fixed volume and amount, pressure is directly proportional to absolute temperature."},{"q":"Which expression represents the pressure law at constant volume?","o":["\\(P_1/T_1=P_2/T_2\\)","\\(P_1V_1=P_2V_2\\)","\\(V_1/T_1=V_2/T_2\\)","\\(P_1V_2=P_2T_1\\)"],"a":0,"e":"For a fixed gas sample at constant volume, \\(P/T\\) is constant."},{"q":"What is the ideal-gas equation?","o":["\\(PV=nRT\\)","\\(P+V=nRT\\)","\\(P/V=nRT\\)","\\(PV=R/nT\\)"],"a":0,"e":"The ideal-gas law is \\(PV=nRT\\), where n is the number of moles."},{"q":"Which temperature unit should be used in gas-law calculations?","o":["Kelvin","Celsius","Fahrenheit","Any temperature scale"],"a":0,"e":"Gas laws require absolute temperature in kelvin."},{"q":"A gas at 2 atm occupies 4 L at constant temperature. If volume becomes 2 L, pressure is…","o":["4 atm","1 atm","2 atm","8 atm"],"a":0,"e":"Boyle's law: \\(P_2=P_1V_1/V_2=2\\times4/2=4\\) atm."},{"q":"A gas occupies 3 L at 300 K under constant pressure. Its volume at 600 K is…","o":["6 L","1.5 L","3 L","9 L"],"a":0,"e":"Charles's law gives \\(V_2=V_1T_2/T_1=3\\times600/300=6\\) L."},{"q":"A gas pressure is 100 kPa at 300 K. At constant volume, pressure at 450 K is…","o":["150 kPa","75 kPa","100 kPa","200 kPa"],"a":0,"e":"\\(P_2=P_1T_2/T_1=100\\times450/300=150\\) kPa."},{"q":"For a fixed amount of gas, the combined gas law is…","o":["\\(P_1V_1/T_1=P_2V_2/T_2\\)","\\(P_1T_1/V_1=P_2T_2/V_2\\)","\\(P_1V_1T_1=P_2V_2T_2\\)","\\(P_1/V_1T_1=P_2/V_2T_2\\)"],"a":0,"e":"The combined gas law combines Boyle's, Charles's, and pressure laws for a fixed amount of gas."},{"q":"Avogadro's law states that, at the same temperature and pressure, gas volume is proportional to…","o":["Number of moles","Molar mass","Pressure squared","Density only"],"a":0,"e":"Equal volumes of ideal gases at the same temperature and pressure contain equal numbers of molecules; \\(V\\propto n\\)."},{"q":"Which relation represents Avogadro's law?","o":["\\(V_1/n_1=V_2/n_2\\)","\\(P_1V_1=P_2V_2\\)","\\(T_1/V_1=T_2/V_2\\)","\\(n_1V_1=n_2/V_2\\)"],"a":0,"e":"At fixed pressure and temperature, volume per mole is constant."},{"q":"If the amount of gas doubles at constant temperature and pressure, volume…","o":["Doubles","Halves","Remains unchanged","Becomes four times"],"a":0,"e":"Avogadro's law gives \\(V\\propto n\\) at fixed T and P."},{"q":"A gas at 300 K is heated to 900 K at constant pressure. Its volume becomes…","o":["Three times","One-third","Twice","Unchanged"],"a":0,"e":"Volume is proportional to kelvin temperature at constant pressure."},{"q":"A gas is compressed isothermally to one-third of its initial volume. Its pressure becomes…","o":["Three times","One-third","Nine times","Unchanged"],"a":0,"e":"Boyle's law gives inverse proportionality between P and V."},{"q":"Which graph is a straight line through the origin for a fixed gas sample at constant pressure?","o":["Volume versus absolute temperature","Pressure versus volume at constant temperature","Pressure versus inverse temperature","Volume versus inverse temperature"],"a":0,"e":"Charles's law states \\(V\\propto T\\) at constant pressure."},{"q":"At constant volume, the graph of pressure against absolute temperature is…","o":["A straight line through the origin","A horizontal line","A parabola","A vertical line"],"a":0,"e":"The pressure law gives \\(P\\propto T\\) at fixed volume."},{"q":"Which condition is required for Boyle's law?","o":["Constant temperature and fixed amount of gas","Constant pressure only","Constant volume only","Constant molar mass and changing amount"],"a":0,"e":"Boyle's law assumes an isothermal process for a fixed amount of gas."},{"q":"A gas occupies 5 L at 100 kPa and 300 K. At 200 kPa and 300 K, its volume is…","o":["2.5 L","10 L","5 L","1.25 L"],"a":0,"e":"At constant temperature, \\(V_2=P_1V_1/P_2=100\\times5/200=2.5\\) L."},{"q":"A gas occupies 2 L at 400 K. At constant pressure, its volume at 200 K is…","o":["1 L","4 L","2 L","0.5 L"],"a":0,"e":"Charles's law gives \\(V_2=2\\times200/400=1\\) L."},{"q":"A gas at 120 kPa and 300 K is heated to 600 K at constant volume. New pressure is…","o":["240 kPa","60 kPa","120 kPa","360 kPa"],"a":0,"e":"Pressure doubles when absolute temperature doubles at fixed volume."},{"q":"In \\(PV=nRT\\), what does n represent?","o":["Amount of gas in moles","Number density per cubic metre","Molecular diameter","Pressure in newtons"],"a":0,"e":"Here n is the amount of substance measured in moles."},{"q":"What is the approximate value of the universal gas constant?","o":["\\(8.314\\,\\mathrm{J\\,mol^{-1}\\,K^{-1}}\\)","\\(1.38\\times10^{-23}\\,\\mathrm{J\\,K^{-1}}\\)","\\(6.022\\times10^{23}\\,\\mathrm{mol^{-1}}\\)","\\(9.8\\,\\mathrm{m\\,s^{-2}}\\)"],"a":0,"e":"The molar gas constant is approximately 8.314 joules per mole per kelvin."},{"q":"Which gas law says equal volumes at equal temperature and pressure contain equal numbers of molecules?","o":["Avogadro's law","Boyle's law","Charles's law","Pressure law"],"a":0,"e":"Avogadro's law connects gas volume with amount of substance at fixed T and P."},{"q":"A gas's volume and absolute temperature both double while pressure and amount stay constant. Is this consistent with Charles's law?","o":["Yes","No, volume should halve","No, volume should remain fixed","Only if pressure doubles"],"a":0,"e":"Charles's law requires V/T to remain constant, which it does if both double."},{"q":"Why must Celsius temperature not be inserted directly into the ideal-gas law?","o":["The proportionality uses absolute temperature measured from zero kelvin","Celsius is a unit of pressure","Kelvin is used only for liquids","Celsius values are always positive"],"a":0,"e":"Gas-law ratios require the absolute scale; convert using \\(T(K)=t(°C)+273.15\\)."},{"q":"A fixed gas sample has \\(P_1=100\\) kPa, \\(V_1=2\\) L, \\(T_1=300\\) K. If \\(V_2=4\\) L and \\(T_2=600\\) K, the final pressure is…","o":["100 kPa","200 kPa","50 kPa","400 kPa"],"a":0,"e":"Combined law: \\(P_2=P_1V_1T_2/(T_1V_2)=100\\times2\\times600/(300\\times4)=100\\) kPa."},{"q":"Which statement is true for an ideal gas at fixed temperature and pressure?","o":["Volume is proportional to the number of moles","Volume is inversely proportional to number of moles","Pressure is independent of amount at fixed volume and temperature","Volume is always constant"],"a":0,"e":"Avogadro's law states that \\(V\\propto n\\) at fixed pressure and temperature."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
 if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options')]).catch(function(){});}
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Gas Laws Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise([card]).catch(function(){});}
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
 window.addEventListener('load',function(){if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise().catch(function(){});}});
})();
