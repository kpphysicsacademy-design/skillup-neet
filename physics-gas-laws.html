<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Gas Laws</title><style>body{margin:0;background:#f7f7fb;color:#172033;font-family:system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 14px}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 28px #17203314}.xp{float:right;font-weight:900}.sub{color:#657080}.bar{height:10px;background:#e8ebef;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02}.q{font-size:1.2rem;font-weight:800;line-height:1.5;margin:22px 0 14px}.opts{display:grid;gap:10px}.opt{padding:14px;border:2px solid #dfe3e8;border-radius:14px;background:#fff;text-align:left;font:inherit;cursor:pointer}.correct{border-color:#58cc02;background:#efffe8}.wrong{border-color:#e5484d;background:#fff0f0}.fb{margin-top:14px;padding:12px;border-radius:12px}.good{background:#e8f9df}.bad{background:#fff0f0}.btn{width:100%;margin-top:15px;padding:13px;border:0;border-radius:13px;background:#58cc02;color:white;font-weight:900}.back{display:inline-block;margin-top:17px;color:#344054;font-weight:800}</style></head><body><main class="wrap"><section class="card"><span class="xp">⚡ <span id="xp">0</span> XP</span><h1>🌡️ Gas Laws</h1><p class="sub">15 NEET-style questions on Boyle's, Charles', Gay-Lussac's and the combined gas law.</p><b id="num">Question 1 of 15</b><div class="bar"><div id="fill" class="fill"></div></div><div id="quiz"></div><div id="fb" class="fb">Choose an answer.</div><button id="next" class="btn">Continue →</button><a class="back" href="physics-home.html">← Back to Physics Path</a></section></main><script>const qs=[['Boyle’s law at constant temperature is:', ['PV=constant','P/T=constant','V/T=constant','P+V=constant'],0,'Boyle’s law gives PV constant.'],['Charles’ law at constant pressure states V is proportional to:', ['absolute temperature','pressure','density','mass only'],0,'V/T is constant.'],['Gay-Lussac’s law at constant volume states P is proportional to:', ['absolute temperature','volume','mass only','density'],0,'P/T is constant.'],['If volume doubles at constant temperature, pressure becomes:', ['half','double','four times','unchanged'],0,'P1V1=P2V2.'],['If Kelvin temperature doubles at constant pressure, volume:', ['doubles','halves','quadruples','is unchanged'],0,'V is proportional to T.'],['If Kelvin temperature doubles at constant volume, pressure:', ['doubles','halves','becomes zero','is unchanged'],0,'P is proportional to T.'],['The combined gas law is:', ['P1V1/T1=P2V2/T2','P1/T1=P2V2','PV=T²','P+V=T'],0,'For fixed gas amount, PV/T is constant.'],['Gas-law temperature must be expressed in:', ['kelvin','celsius only','fahrenheit only','any unit'],0,'Use absolute temperature.'],['A gas at 1 atm and 2 L is compressed to 1 L at constant T. Pressure is:', ['2 atm','0.5 atm','1 atm','4 atm'],0,'Pressure doubles.'],['A gas has 3 L at 300 K. At constant pressure, volume at 600 K is:', ['6 L','1.5 L','3 L','9 L'],0,'Volume doubles.'],['A gas has 2 atm at 300 K. At constant volume, pressure at 450 K is:', ['3 atm','1.33 atm','2 atm','4.5 atm'],0,'P2=2×450/300=3 atm.'],['Ideal-gas equation is:', ['PV=nRT','PV=RT/n','P=nVRT','P=V/nRT'],0,'PV=nRT.'],['At fixed V and T, increasing amount of gas makes pressure:', ['increase','decrease','unchanged','zero'],0,'P is proportional to n.'],['V proportional to 1/P at constant T is:', ['Boyle’s law','Charles’ law','Avogadro’s law','Dalton’s law'],0,'This is Boyle’s law.'],['Real gases approach ideal behavior most closely at:', ['low pressure and high temperature','high pressure and low temperature','low temperature near liquefaction','high pressure'],0,'Intermolecular effects are least important at low P and high T.']];let i=0,s=0,a=false;const $=x=>document.getElementById(x);function render(){a=false;let q=qs[i];$('num').textContent=`Question ${i+1} of 15`;$('xp').textContent=s*10;$('fill').style.width=i/15*100+'%';$('fb').className='fb';$('fb').textContent='Choose an answer.';$('quiz').innerHTML='<div class="q">'+q[0]+'</div><div class="opts">'+q[1].map((x,n)=>`<button class="opt" onclick="ans(${n})">${String.fromCharCode(65+n)}. ${x}</button>`).join('')+'</div>';$('next').textContent=i===14?'Finish Skill →':'Continue →';$('next').onclick=next}function ans(n){if(a)return;a=true;let q=qs[i],ok=n===q[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong')});if(ok){s++;$('fb').className='fb good';$('fb').innerHTML='🎯 Correct! +10 XP<br>'+q[3]}else{$('fb').className='fb bad';$('fb').innerHTML='❌ Incorrect.<br><b>Correct:</b> '+q[1][q[2]]+'<br>'+q[3]}$('xp').textContent=s*10;$('fill').style.width=(i+1)/15*100+'%'}function next(){if(!a){$('fb').className='fb bad';$('fb').textContent='Choose an answer first 👆';return}if(i<14){i++;render()}else{$('quiz').innerHTML=`<h2>🏆 Gas Laws Complete!</h2><p>Score: ${s}/15<br>⚡ XP: ${s*10}</p>`;$('next').textContent='Retry';$('next').onclick=()=>{i=0;s=0;render()}}}render();</script></body></html>
