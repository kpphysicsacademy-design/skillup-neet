<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Gas Laws</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7fb;color:#172033;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 14px 42px}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 28px #17203314}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:1.55rem;margin:0}.xp{font-weight:900;white-space:nowrap}.sub{color:#657080;margin:8px 0 0}.num{font-weight:800;color:#68717d;margin-top:18px}.bar{height:10px;background:#e8ebef;border-radius:99px;overflow:hidden;margin:10px 0 18px}.fill{height:100%;width:0;background:#58cc02;transition:.3s}.q{font-size:1.18rem;font-weight:850;line-height:1.5;margin:12px 0 14px}.opts{display:grid;gap:10px}.opt{padding:14px;border:2px solid #dfe3e8;border-radius:14px;background:#fff;text-align:left;font:inherit;cursor:pointer}.opt:hover{border-color:#58a6ff;background:#f6fbff}.opt:disabled{cursor:default}.correct{border-color:#58cc02!important;background:#efffe8!important}.wrong{border-color:#e5484d!important;background:#fff0f0!important}.feedback{margin-top:14px;padding:12px;border-radius:13px;line-height:1.5}.good{background:#e8f9df;color:#246b16}.bad{background:#fff0f0;color:#a12b30}.btn{width:100%;margin-top:15px;padding:13px;border:0;border-radius:13px;background:#58cc02;color:#fff;font-weight:900;font-size:1rem;cursor:pointer}.back{display:inline-block;margin-top:17px;padding:10px 14px;border:2px solid #dfe3e8;border-radius:13px;color:#344054;text-decoration:none;font-weight:800}.result{text-align:center;font-size:1.15rem;font-weight:850;line-height:1.8;padding:18px}@media(max-width:600px){.wrap{padding:16px 10px}.card{padding:18px}.top{align-items:flex-start}.top h1{font-size:1.3rem}.q{font-size:1.08rem}.opt{padding:13px}}</style></head><body><main class="wrap"><section class="card"><div class="top"><h1>🌡️ Gas Laws</h1><div class="xp">⚡ <span id="xp">0</span> XP</div></div><p class="sub">Master Boyle's, Charles', Gay-Lussac's and the combined gas law with 15 NEET-style questions.</p><div class="num" id="num">Question 1 of 15</div><div class="bar"><div id="fill" class="fill"></div></div><div id="quiz"></div><div id="fb" class="feedback">Choose an answer.</div><button id="next" class="btn">Continue →</button><a class="back" href="physics-home.html">← Back to Physics Path</a></section></main><script>const qs=[['Boyle’s law for a fixed mass of gas at constant temperature is:', ['PV=constant','P/T=constant','V/T=constant','P+V=constant'],0,'At constant temperature, pressure is inversely proportional to volume.'],['Charles’ law states that at constant pressure, volume is proportional to:', ['absolute temperature','pressure','density','mass only'],0,'For a fixed mass at constant pressure, V/T is constant.'],['Gay-Lussac’s law relates pressure and absolute temperature at constant:', ['volume','pressure','mass only','density only'],0,'At constant volume, P/T is constant.'],['If the volume of a gas is doubled at constant temperature, its pressure becomes:', ['half','double','four times','unchanged'],0,'Boyle’s law: P₁V₁=P₂V₂.'],['If the absolute temperature of a gas doubles at constant pressure, its volume:', ['doubles','halves','becomes four times','does not change'],0,'Charles’ law gives V∝T at constant pressure.'],['If absolute temperature doubles at constant volume, pressure:', ['doubles','halves','becomes zero','remains unchanged'],0,'Gay-Lussac’s law gives P∝T at constant volume.'],['The combined gas law for a fixed amount of gas is:', ['P₁V₁/T₁=P₂V₂/T₂','P₁/T₁=P₂V₂','PV=T²','P+V=T'],0,'Pressure, volume and absolute temperature obey this relation for fixed amount.'],['In gas-law calculations, temperature should be expressed in:', ['kelvin','celsius only','fahrenheit only','any unit without conversion'],0,'Gas-law proportionalities use absolute temperature in kelvin.'],['A gas occupies 2 L at 1 atm. At constant temperature it is compressed to 1 L. Its pressure is:', ['2 atm','0.5 atm','1 atm','4 atm'],0,'P₁V₁=P₂V₂, so P₂=2 atm.'],['A gas has volume 3 L at 300 K. At constant pressure, its volume at 600 K is:', ['6 L','1.5 L','3 L','9 L'],0,'V₂=V₁T₂/T₁=3×600/300=6 L.'],['A gas has pressure 2 atm at 300 K. At constant volume, pressure at 450 K is:', ['3 atm','1.33 atm','2 atm','4.5 atm'],0,'P₂=P₁T₂/T₁=2×450/300=3 atm.'],['The ideal-gas equation is:', ['PV=nRT','P=nR/V²','PV=RT/n','P=V/nRT'],0,'For n moles, PV=nRT.'],['If the amount of gas is increased at constant temperature and volume, pressure:', ['increases','decreases','remains fixed','becomes zero'],0,'From PV=nRT, P is proportional to n when V and T are fixed.'],['Which law is represented by V∝1/P at constant temperature?', ['Boyle’s law','Charles’ law','Avogadro’s law','Dalton’s law'],0,'Boyle’s law describes the inverse P–V relationship.'],['Which condition makes real gases approach ideal behavior most closely?', ['low pressure and high temperature','high pressure and low temperature','high pressure and low temperature near liquefaction','very low temperature'],0,'Intermolecular effects become less important at low pressure and high temperature.']];let i=0,score=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;const a=qs[i];$('num').textContent='Question '+(i+1)+' of 15';$('xp').textContent=score*10;$('fill').style.width=(i/15*100)+'%';$('fb').className='feedback';$('fb').textContent='Choose an answer.';$('quiz').innerHTML='<div class="q">'+a[0]+'</div><div class="opts">'+a[1].map((x,n)=>'<button class="opt" data-n="'+n+'">'+String.fromCharCode(65+n)+'. '+x+'</button>').join('')+'</div>';document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').textContent=i===14?'Finish Skill →':'Continue →';$('next').onclick=next}function answer(n){if(answered)return;answered=true;const a=qs[i],ok=n===a[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===a[2])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong')});$('fb').className='feedback '+(ok?'good':'bad');$('fb').innerHTML=ok?'🎯 Correct! +10 XP<br>'+a[3]:'❌ Incorrect.<br><b>Correct answer:</b> '+a[1][a[2]]+'<br>'+a[3];if(ok)score++;$('xp').textContent=score*10;$('fill').style.width=((i+1)/15*100)+'%'}function next(){if(!answered){$('fb').className='feedback bad';$('fb').textContent='Choose an answer first 👆';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$('num').textContent='Complete!';$('fill').style.width='100%';$('quiz').innerHTML='<div class="result">🏆 Gas Laws Complete!<br>Score: '+score+'/15<br>⚡ XP earned: '+score*10+'</div>';$('next').textContent='Retry';$('next').onclick=()=>{i=0;score=0;render()}}}render();</script></body></html>
