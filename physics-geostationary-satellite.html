<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Geostationary Satellite</title><style>body{margin:0;background:#f5f7fa;font-family:Arial,sans-serif;color:#172033}.wrap{max-width:760px;margin:auto;padding:24px 16px 50px}.head{display:flex;justify-content:space-between;align-items:center}.title{font-size:28px;font-weight:800}.xp{font-weight:700;color:#168447}.sub{color:#667085;margin:8px 0 18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #0000000b}.mastery{font-weight:700}.bar{height:10px;background:#e7ebf0;border-radius:10px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#22a06b;transition:.3s}.qno{font-size:14px;color:#667085}.q{font-size:20px;font-weight:750;line-height:1.4;margin:10px 0 18px}.opt{display:block;width:100%;text-align:left;padding:14px;margin:9px 0;border:2px solid #d9dee7;background:#fff;border-radius:12px;cursor:pointer;font-size:16px;transition:.15s}.opt:hover{transform:translateY(-1px);border-color:#7b8798}.opt.sel{border-color:#3578e5;background:#eef5ff}.opt.correct{border-color:#20a464;background:#eaf8f0}.opt.wrong{border-color:#d64545;background:#fff0f0}.btn{border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:750;cursor:pointer;background:#22a06b;color:white}.btn:disabled{opacity:.5;cursor:not-allowed}.back{display:inline-block;text-decoration:none;color:#344054;border:2px solid #d9dee7;border-radius:12px;padding:12px 18px;font-weight:700;background:#fff;transition:.15s}.back:hover{transform:translateY(-2px);box-shadow:0 5px 14px #00000012}.feedback{min-height:24px;font-weight:700;margin-top:14px}.done{text-align:center;font-size:22px;font-weight:800}@media(max-width:600px){.title{font-size:23px}.q{font-size:18px}}</style></head><body><main class="wrap"><div class="head"><div class="title">🛰️ Geostationary Satellite</div><div class="xp">+10 XP</div></div><div class="sub">Conditions, orbital radius, period, speed and applications of geostationary satellites.</div><section class="card"><div class="mastery">🎯 Skill Mastery <span id="score">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card"><div class="qno" id="qno"></div><div class="q" id="q"></div><div id="opts"></div><button class="btn" id="continue" disabled>Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>const quiz=[['A geostationary satellite has a time period of:', ['24 hours','12 hours','6 hours','48 hours'],0],['A geostationary satellite must revolve around Earth from:', ['west to east','east to west','north to south','south to north'],0],['The orbit of a geostationary satellite lies in the:', ['equatorial plane','polar plane','45° inclined plane','any plane'],0],['The orbit of a geostationary satellite is ideally:', ['circular','parabolic','straight line','highly elliptical'],0],['For a geostationary satellite, the angular velocity is equal to Earth’s:', ['angular velocity of rotation','escape velocity','linear velocity','orbital radius'],0],['A geostationary satellite appears stationary because it has:', ['the same angular speed and direction as Earth','zero angular speed','no gravitational force','zero orbital speed'],0],['The orbital radius of a geostationary satellite from Earth’s centre is approximately:', ['4.2 × 10^4 km','6.4 × 10^3 km','1.0 × 10^4 km','1.5 × 10^5 km'],0],['The altitude of a geostationary satellite above Earth’s surface is approximately:', ['3.6 × 10^4 km','6.4 × 10^3 km','1.0 × 10^3 km','7.9 × 10^3 km'],0],['The orbital speed of a geostationary satellite is approximately:', ['3.1 km/s','7.9 km/s','11.2 km/s','0.3 km/s'],0],['A geostationary satellite is especially useful for:', ['communication','measuring laboratory mass','underwater propulsion','ground-level weighing'],0],[ t.add('wrong')});$('feedback').textContent=ok?'🎉 Correct! +10 XP':'💡 Review the highlighted correct answer.';$('score').textContent=`${correct} / 15`;$('fill').style.width=`${((i+1)/15)*100}%`;$('continue').textContent=i===14?'Finish Skill →':'Continue →';return}if(i<14){i++;render()}else{document.querySelector('.card:nth-of-type(2)').innerHTML=`<div class="done">🏆 Skill Complete!</div><p>You scored ${correct} / 15.</p><button class="btn" onclick="location.reload()">Retry →</button>`}};$('back').onclick=function(){const s=sessionStorage.getItem('skillupLastPhysicsPath');if(s){try{const u=new URL(s,location.href);if(u.origin===location.origin){location.href=s;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();</script></body></html>
