.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}

.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🛰️ Geostationary Satellite</h1><p class="muted">Practice the conditions, orbit, period, speed, and real-world uses of geostationary satellites.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"What is the approximate orbital period of a geostationary satellite?",o:["90 minutes","48 hours","12 hours","24 hours"],a:3,e:"It matches Earth's rotation period, approximately one sidereal day."},
{q:"In which direction does a geostationary satellite orbit Earth?",o:["East to west","North to south","West to east","South to north"],a:2,e:"It moves in the same direction as Earth's rotation."},
{q:"A geostationary satellite's orbit lies in the:",o:["any plane","polar plane","equatorial plane","45° inclined plane"],a:2,e:"Its orbital plane must coincide with Earth's equatorial plane."},
{q:"The ideal geostationary orbit is:",o:["parabolic","circular","a straight line","highly elliptical"],a:1,e:"A circular orbit keeps the satellite at a constant altitude."},
{q:"A geostationary satellite has the same angular velocity as:",o:["the Moon's orbit","a low-orbit satellite","Earth's revolution around the Sun","Earth's rotation"],a:3,e:"The satellite's angular velocity matches Earth's rotation."},
{q:"Why does a geostationary satellite appear fixed in the sky?",o:["It has no orbital motion","It matches Earth's rotation in direction and angular speed","Gravity does not act on it","It is above the North Pole"],a:1,e:"Matching direction and angular speed keeps it above the same equatorial longitude."},
{q:"The orbital radius of a geostationary satellite from Earth's centre is about:",o:["100,000 km","6,400 km","12,800 km","42,200 km"],a:3,e:"Its distance from Earth's centre is approximately 42,200 km."},
{q:"The altitude of a geostationary satellite above Earth's surface is about:",o:["6,400 km","3,600 km","42,200 km","35,800 km"],a:3,e:"Altitude is orbital radius minus Earth's radius, roughly 35,800 km."},
{q:"The orbital speed of a geostationary satellite is approximately:",o:["3.1 km/s","0.3 km/s","7.9 km/s","11.2 km/s"],a:0,e:"At a radius of about 42,200 km, its speed is about 3.1 km/s."},
{q:"A common application of geostationary satellites is:",o:["deep-sea drilling","measuring laboratory mass","communications","underground mining"],a:2,e:"They provide continuous coverage of a broad region for communication and broadcasting."},
{q:"Which condition is essential for a satellite to be geostationary?",o:["Its orbital period must be 12 hours","Its orbit must be polar","Its orbit must be equatorial","Its orbit must be retrograde"],a:2,e:"An inclined orbit would appear to move north and south in the sky."},
{q:"A satellite with a 24-hour period in an inclined orbit is generally:",o:["not geostationary","stationary relative to all observers","outside Earth's gravity","geostationary at every latitude"],a:0,e:"The period alone is not enough; the orbit must also be circular, equatorial, and prograde."},
{q:"For satellites around the same central body, the orbital period varies with radius as:",o:["T ∝ r^(3/2)","T ∝ 1/r","T ∝ r","T ∝ r²"],a:0,e:"Kepler's third law gives T² proportional to r³."},
{q:"The force that provides centripetal acceleration to a geostationary satellite is:",o:["friction","gravity","magnetic force","continuous engine thrust"],a:1,e:"Earth's gravitational attraction supplies the centripetal force."},
{q:"Relative to an ideal point on Earth's equator, a geostationary satellite remains:",o:["alternately east and west every hour","at a fixed longitude","moving across all longitudes","directly above the poles"],a:1,e:"It appears stationary above the same equatorial longitude."},
{q:"Can a geostationary satellite orbit directly above Earth's poles?",o:["No","Only at midnight","Only during an eclipse","Yes, always"],a:0,e:"A polar orbit cannot remain above one equatorial longitude."},
{q:"If central mass stays constant and orbital radius increases, orbital speed:",o:["does not change","becomes zero","increases","decreases"],a:3,e:"Circular orbital speed is v = √(GM/r)."},
{q:"The orbital radius used in satellite equations is measured from:",o:["Earth's surface","Earth's centre","the atmosphere's top","the equator along the surface"],a:1,e:"The radius in orbital equations is the distance from the central body's centre."},
{q:"If Earth's mass increased while orbital radius stayed fixed, circular orbital speed would:",o:["become zero","decrease","increase","remain the same"],a:2,e:"The relation v = √(GM/r) shows speed increases with central mass."},
{q:"One complete orbital revolution corresponds to:",o:["π radians","2π radians","4π radians","π/2 radians"],a:1,e:"One full revolution corresponds to 2π radians."},
{q:"The angular speed of a geostationary satellite is approximately:",o:["3.14 rad/s","zero rad/s","7.29 × 10⁻⁵ rad/s","1 rad/s"],a:2,e:"Angular speed is approximately 2π divided by one sidereal day."},
{q:"Why are geostationary satellites not ideal for viewing Earth's polar regions?",o:["They have no instruments","They appear low on the horizon or may be out of view","They move faster than light","They orbit inside Earth"],a:1,e:"A satellite above the equator has poor viewing geometry for high latitudes."},
{q:"The geostationary orbit is also commonly called the:",o:["transfer orbit","Clarke orbit","polar orbit","lunar orbit"],a:1,e:"The geostationary belt is commonly called the Clarke orbit."},
{q:"The gravitational acceleration at geostationary altitude is:",o:["nonzero and weaker than at Earth's surface","greater than at Earth's surface","independent of distance","exactly zero"],a:0,e:"Gravity decreases with distance but still keeps the satellite in orbit."},
{q:"If the orbit radius is fixed, does satellite mass change its orbital period?",o:["No","Only if it has solar panels","Yes, period doubles with mass","Yes, period halves with mass"],a:0,e:"For a given central body and radius, orbital period does not depend on satellite mass."},
{q:"A satellite with a 12-hour period cannot be geostationary because:",o:["its speed is always zero","its period does not match Earth's rotation","gravity is absent at 12 hours","it must be inside Earth"],a:1,e:"A geostationary satellite must have a period matching Earth's rotation."},
{q:"Which orbital direction is required for a geostationary satellite?",o:["Any direction","Retrograde, east to west","Prograde, west to east","North to south"],a:2,e:"It must travel prograde in the direction Earth rotates."},
{q:"Why is a circular orbit important for a geostationary satellite?",o:["It keeps altitude and orbital speed constant","It eliminates orbital motion","It allows a polar path","It makes gravity vanish"],a:0,e:"A circular orbit has constant radius, needed for a fixed apparent position."},
{q:"What does a geostationary satellite's ideal ground track look like?",o:["A figure eight across the globe","A spiral toward Earth","A line passing over both poles","A single point on the equator"],a:3,e:"It remains above one longitude on the equator, so its ideal ground track is a point."},
{q:"The precise period for an ideal geostationary satellite is closest to:",o:["One solar year","One lunar month","One sidereal day","One hour"],a:2,e:"The matching period is one sidereal day, about 23 h 56 min."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Geostationary Satellite Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
