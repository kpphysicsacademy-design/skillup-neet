<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Geosynchronous Satellite</title><style>body{margin:0;background:#f5f7fa;font-family:Arial,sans-serif;color:#172033}.wrap{max-width:760px;margin:auto;padding:24px 16px 50px}.head{display:flex;justify-content:space-between;align-items:center}.title{font-size:28px;font-weight:800}.xp{font-weight:700;color:#168447}.sub{color:#667085;margin:8px 0 18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #0000000b}.mastery{font-weight:700}.bar{height:10px;background:#e7ebf0;border-radius:10px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#22a06b;transition:.3s}.qno{font-size:14px;color:#667085}.q{font-size:20px;font-weight:750;line-height:1.4;margin:10px 0 18px}.opt{display:block;width:100%;text-align:left;padding:14px;margin:9px 0;border:2px solid #d9dee7;background:#fff;border-radius:12px;cursor:pointer;font-size:16px;transition:.15s}.opt:hover{transform:translateY(-1px);border-color:#7b8798}.opt.sel{border-color:#3578e5;background:#eef5ff}.opt.correct{border-color:#20a464;background:#eaf8f0}.opt.wrong{border-color:#d64545;background:#fff0f0}.btn{border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:750;cursor:pointer;background:#22a06b;color:white}.btn:disabled{opacity:.5;cursor:not-allowed}.back{display:inline-block;text-decoration:none;color:#344054;border:2px solid #d9dee7;border-radius:12px;padding:12px 18px;font-weight:700;background:#fff;transition:.15s}.back:hover{transform:translateY(-2px);box-shadow:0 5px 14px #00000012}.feedback{min-height:24px;font-weight:700;margin-top:14px}.done{text-align:center;font-size:22px;font-weight:800}@media(max-width:600px){.title{font-size:23px}.q{font-size:18px}}</style></head><body><main class="wrap"><div class="head"><div class="title">🛰️ Geosynchronous Satellite</div><div class="xp">+10 XP</div></div><div class="sub">Geosynchronous orbit, orbital period, angular speed and satellite motion.</div><section class="card"><div class="mastery">🎯 Skill Mastery <span id="score">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card"><div class="qno" id="qno"></div><div class="q" id="q"></div><div id="opts"></div><button class="btn" id="continue" disabled>Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>const quiz=[['A geosynchronous satellite has an orbital period equal to Earth’s:', ['rotation period','orbital radius','escape time','surface gravity'],0],['The period of a geosynchronous satellite is approximately:', ['24 hours','12 hours','6 hours','48 hours'],0],['A geosynchronous satellite completes one revolution in approximately:', ['one sidereal day','one solar year','one lunar month','one hour'],0],['For a circular geosynchronous orbit, the angular velocity of the satellite equals Earth’s:', ['angular velocity of rotation','linear velocity','escape velocity','surface acceleration'],0],['The orbital radius of a geosynchronous satellite is determined mainly by:', ['Earth’s mass and rotation period','satellite mass only','atmospheric pressure','satellite temperature'],0],['A geosynchronous satellite can have an orbit that is:', ['inclined to the equator','only exactly equatorial','only polar','inside the atmosphere'],0],['A geostationary satellite is a special case of a:', ['geosynchronous satellite','polar satellite','escape trajectory','suborbital vehicle'],0],['For a satellite to appear fixed above one point on Earth, its orbit must be:', ['circular, equatorial and prograde','polar and retrograde','elliptical and polar','parabolic and equatorial'],0],['The angular speed of a geosynchronous satellite is approximately:', ['2π/(24 h)','24π h','2π×24 h','1/(2π×24 h)'],0],['If a satellite has a period shorter than Earth’s rotation period, it is:', ['not geostationary','necessarily geostationary','stationary over the equator','outside Earth’s gravity'],0],['The orbital speed in a circular orbit of radius r around Earth is:', ['√(GM/r)','GM/r²','√(GMr)','GM r'],0],['For circular satellite motion, gravity supplies the:', ['centripetal force','frictional force','tangential thrust continuously','buoyant force'],0],['A geostationary satellite must move in the same sense as Earth’s rotation, called:', ['prograde','retrograde','radial','oscillatory'],0],['The main communication advantage of geostationary satellites is that they:', ['remain apparently fixed over one region','need no orbital velocity','experience zero gravity','orbit at the poles'],0],['Three ideal geostationary satellites can provide near-global coverage except near the:', ['polar regions','equator','tropics','mid-latitudes'],0]];let i=0,correct=0,selected=null,checked=false;function $(x){return document.getElementById(x)}function shuffle(a){for(let k=a.length-1;k>0;k--){let r=Math.floor(Math.random()*(k+1));[a[k],a[r]]=[a[r],a[k]]}return a}function render(){selected=null;checked=false;$('continue').disabled=true;$('continue').textContent='Continue →';$('feedback').textContent='';$('qno').textContent=`Question ${i+1} of 15`;$('q').textContent=quiz[i][0];$('opts').innerHTML='';const order=quiz[i][1].map((text,index)=>({text,index}));shuffle(order).forEach((x,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{if(checked)return;selected=x.index;document.querySelectorAll('.opt').forEach(z=>z.classList.remove('sel'));b.classList.add('sel');$('continue').disabled=false};$('opts').appendChild(b)});$('score').textContent=`${correct} / 15`;$('fill').style.width=`${(i/15)*100}%`}$('continue').onclick=()=>{if(selected===null)return;if(!checked){checked=true;const ok=selected===quiz[i][2];if(ok)correct++;document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const n=Number(b.dataset.index);if(n===quiz[i][2])b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=ok?'🎉 Correct! +10 XP':'💡 Review the highlighted correct answer.';$('score').textContent=`${correct} / 15`;$('fill').style.width=`${((i+1)/15)*100}%`;$('continue').textContent=i===14?'Finish Skill →':'Continue →';return}if(i<14){i++;render()}else{document.querySelectorAll('.card')[1].innerHTML=`<div class="done">🏆 Skill Complete!</div><p>You scored ${correct} / 15.</p><button class="btn" onclick="location.reload()">Retry →</button>`}};$('back').onclick=function(){const s=sessionStorage.getItem('skillupLastPhysicsPath');if(s){try{const u=new URL(s,location.href);if(u.origin===location.origin){location.href=s;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();</script></body></html>
