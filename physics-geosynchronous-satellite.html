<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🛰️ Geosynchronous Satellite</h1><p class="muted">Learn geosynchronous orbits, satellite periods, geostationary conditions, orbital mechanics, and applications.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"A geosynchronous satellite has an orbital period equal to approximately:",o:["one sidereal day","90 minutes","12 hours","one solar year"],a:0,e:"A geosynchronous orbit has a period matching Earth's rotation, about 23 h 56 min."},
{q:"A geosynchronous satellite is always stationary in the sky. Is this true?",o:["Yes, every geosynchronous satellite is fixed","No; only a suitable geostationary orbit appears fixed","Yes, because gravity is zero","Only at the poles"],a:1,e:"Geosynchronous means matching period; inclination or eccentricity can make the satellite appear to move."},
{q:"Which orbit makes a satellite appear fixed over one point on the equator?",o:["A retrograde inclined orbit","A polar orbit","A circular, equatorial, prograde orbit","Any elliptical orbit"],a:2,e:"These conditions define an ideal geostationary orbit."},
{q:"A geosynchronous satellite's orbit may be:",o:["inclined or elliptical","always fixed over one city","inside the atmosphere","only polar and circular"],a:0,e:"Geosynchronous describes the period; not all such orbits are circular and equatorial."},
{q:"A geosynchronous satellite's orbital period is closest to:",o:["7 days","365 days","12 hours","23 hours 56 minutes"],a:3,e:"The precise matching period is one sidereal day."},
{q:"The orbital radius of a geostationary satellite from Earth's centre is approximately:",o:["6,400 km","20,000 km","42,200 km","100,000 km"],a:2,e:"The geostationary orbital radius is about 42,200 km from Earth's centre."},
{q:"The altitude of a geostationary satellite above Earth's surface is approximately:",o:["42,200 km","3,600 km","6,400 km","35,800 km"],a:3,e:"Subtract Earth's radius from the orbital radius to get an altitude near 35,800 km."},
{q:"Which direction does an ideal geostationary satellite travel?",o:["West to east","North to south","South to north","East to west"],a:0,e:"It moves prograde in the direction of Earth's rotation."},
{q:"For a geostationary satellite, the orbital plane must be:",o:["at 45° to the equator","any plane","the polar plane","the equatorial plane"],a:3,e:"An inclined orbit would appear to move north and south relative to Earth."},
{q:"Which statement correctly compares geosynchronous and geostationary satellites?",o:["They always mean exactly the same thing","Every geostationary satellite is geosynchronous, but not every geosynchronous satellite is geostationary","A geostationary satellite has a 12-hour period","A geosynchronous satellite has no orbital motion"],a:1,e:"Geostationary is the special circular, equatorial, prograde case of geosynchronous orbit."},
{q:"A geosynchronous satellite with an inclined orbit appears to trace a path that moves:",o:["around the Moon","nowhere at all","north and south in the sky","only through Earth's interior"],a:2,e:"Inclination causes its apparent position to shift north and south."},
{q:"An eccentric geosynchronous orbit causes the satellite's apparent motion to vary because its:",o:["gravity disappears at apogee","period becomes zero","orbit stops at perigee","mass changes every hour"],a:-1,e:"In an elliptical orbit, speed and distance change along the orbit."},
{q:"The orbital speed of a satellite in a circular orbit of radius r is:",o:["GM/r","√(Gr/M)","GM/r²","√(GM/r)"],a:3,e:"Equating gravity and centripetal force gives v = √(GM/r)."},
{q:"For satellites orbiting the same central body, Kepler's third law says:",o:["T ∝ r³","T² ∝ r³","T ∝ 1/r","T² ∝ 1/r³"],a:1,e:"The square of the period is proportional to the cube of orbital radius."},
{q:"The force that keeps a geosynchronous satellite in orbit is primarily:",o:["continuous engine thrust","air resistance","magnetic attraction","Earth's gravity"],a:3,e:"Gravity supplies the centripetal acceleration."},
{q:"If the orbital radius increases while Earth's mass stays fixed, circular orbital speed:",o:["decreases","stays exactly constant","becomes zero instantly","increases"],a:0,e:"The relation v = √(GM/r) shows speed falls as radius increases."},
{q:"If the satellite mass doubles but its orbit stays the same, its orbital period:",o:["does not change","becomes one day longer","doubles","halves"],a:0,e:"Orbital period depends on central mass and orbital radius, not satellite mass."},
{q:"A geosynchronous satellite is commonly used for:",o:["measuring underground pressure only","communications and weather monitoring","underwater navigation","directly powering household appliances"],a:1,e:"A high orbit can provide broad, repeated coverage of Earth."},
{q:"Why are geosynchronous satellites useful for communication?",o:["They do not need power","They are always closer than low Earth satellites","They can provide long-duration coverage of a broad region","They have no time delay"],a:2,e:"Their high altitude supports wide coverage, though signal delay can be noticeable."},
{q:"A geostationary satellite is poorly placed for observing polar regions because it is:",o:["below Earth's surface","above the equator and far from the poles","inside the Moon's orbit only","above the North Pole"],a:1,e:"From the equatorial geostationary belt, high-latitude regions are low on the horizon or obscured."},
{q:"The angular speed of a geosynchronous satellite is approximately:",o:["7.29 × 10⁻⁵ rad/s","3.14 rad/s","zero rad/s","1 rad/s"],a:0,e:"Angular speed is about 2π divided by one sidereal day."},
{q:"One complete revolution corresponds to an angular displacement of:",o:["π/2 radians","π radians","2π radians","4π radians"],a:2,e:"A full circle is 2π radians."},
{q:"The gravitational acceleration at geosynchronous altitude is:",o:["unrelated to distance","exactly zero","nonzero but weaker than at Earth's surface","stronger than at Earth's surface"],a:2,e:"Gravity decreases with distance but still provides the orbital force."},
{q:"A geosynchronous satellite with a retrograde orbit would generally:",o:["not be geostationary","have no orbital period","escape Earth's gravity immediately","remain fixed above one equatorial point"],a:0,e:"Geostationary motion must be prograde, matching Earth's rotational direction."},
{q:"Which orbital parameter determines the period for a satellite orbiting a given central body?",o:["the number of solar panels","the radio frequency","the satellite's colour","the semi-major axis"],a:3,e:"For an ideal two-body orbit, the period is set by the semi-major axis and central mass."},
{q:"At perigee in an elliptical Earth orbit, the satellite is:",o:["farthest from Earth","closest to Earth","at zero speed","outside Earth's gravitational field"],a:1,e:"Perigee is the closest point of an Earth-centred orbit."},
{q:"At apogee in an elliptical Earth orbit, the satellite is:",o:["at zero gravitational force","closest to Earth","moving at infinite speed","farthest from Earth"],a:3,e:"Apogee is the farthest point from Earth."},
{q:"For an ideal geostationary satellite, the ground track is:",o:["a single point on the equator","a spiral across the oceans","a line crossing both poles","a figure eight across the poles"],a:0,e:"It remains above the same equatorial longitude."},
{q:"A geosynchronous satellite's period matches Earth's rotation, but its orbit does not have to be:",o:["gravitationally bound","periodic","circular and equatorial","Earth-centred"],a:2,e:"Circular and equatorial are required for geostationary status, not for geosynchronous status generally."},
{q:"Why does a geostationary satellite need a circular orbit?",o:["To eliminate Earth's gravity","To keep its orbital radius and speed constant","To make its period 12 hours","To make its orbit polar"],a:1,e:"A circular orbit maintains constant radius and supports a fixed apparent position."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Geosynchronous Satellite Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
