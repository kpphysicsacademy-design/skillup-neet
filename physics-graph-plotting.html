<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SkillUp Physics | Graph Plotting</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.opt.selected{border-color:#5146a5;background:#f4f1ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.opt:disabled{cursor:default}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>📈 Graph Plotting</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="action">CHECK</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['In a graph, the independent variable is normally plotted on the:',['Y-axis','X-axis','Origin only','Both axes equally'],1,'The independent variable is conventionally plotted on the horizontal X-axis.'],['The dependent variable is normally plotted on the:',['X-axis','Y-axis','Origin','Scale line'],1,'The dependent variable is conventionally plotted on the vertical Y-axis.'],['A graph should have axes that are:',['Unlabelled','Clearly labelled with quantities and units','Numbered randomly','Without scale'],1,'Axes should identify the physical quantity and its unit, with a clear scale.'],['The slope of a straight-line graph of y versus x is:',['Δx/Δy','Δy/Δx','x+y','xy'],1,'Slope = change in y divided by change in x: Δy/Δx.'],['For y = mx + c, m represents the:',['Intercept','Slope','Unit only','Origin'],1,'In y = mx + c, m is the slope and c is the y-intercept.'],['The y-intercept is the value of y when:',['x=0','x=1','y=0','slope=0'],0,'At x = 0, the graph intersects the y-axis, giving the y-intercept.'],['If points (1,2) and (3,6) lie on a straight line, its slope is:',['1','2','3','4'],1,'Slope = (6−2)/(3−1) = 4/2 = 2.'],['A horizontal straight-line graph has slope:',['1','-1','0','Infinite'],2,'There is no change in y as x changes, so the slope is zero.'],['A vertical line on a standard x-y graph has:',['Zero slope','Constant slope 1','Undefined slope','Negative slope'],2,'For a vertical line, Δx is zero, so Δy/Δx is undefined.'],['A best-fit line is drawn mainly to:',['Pass through every point exactly','Represent the overall trend of experimental data','Remove all measurements','Change the units'],1,'A best-fit line represents the overall relationship while accounting for experimental scatter.'],['Which scale is usually preferred?',['A clear uniform scale using the available graph area','A random scale for each point','No scale','A scale with unlabeled intervals'],0,'A clear, uniform scale makes trends and readings easier to interpret.'],['If doubling x causes y to double, the relationship may be:',['Directly proportional','Inversely proportional','Constant','Independent of x'],0,'When y increases in the same ratio as x, the relationship can be directly proportional.'],['For y ∝ 1/x, a plot of y against 1/x should be:',['A straight line through the origin if proportionality is exact','Always vertical','Always horizontal','A circle'],0,'If y = k(1/x), plotting y against 1/x gives a straight line through the origin.'],['When plotting experimental points, each point should be placed using:',['Estimated position only','The corresponding x and y values with the chosen scale','Only the y value','Only the x value'],1,'Both coordinates must be used with the selected axis scales.'],['Why is a graph useful in physics experiments?',['It hides data','It helps reveal relationships, trends and quantities such as slope','It removes the need for units','It guarantees zero error'],1,'Graphs make trends visible and allow physical quantities such as slope and intercept to be determined.']];let i=0,score=0,answered=false,selected=-1;const $=x=>document.getElementById(x);function render(){answered=false;selected=-1;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q[1].map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('action').classList.remove('hide');$('action').textContent='CHECK'});$('xp').textContent='';$('action').classList.add('hide');$('action').disabled=false;}function check(){if(selected<0)return;if(!answered){answered=true;const q=qs[i],ok=selected===q[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===selected&&!ok)b.classList.add('wrong')});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[3];if(ok)score++;$('score').textContent=`XP ${score}`;$('fill').style.width=`${(i+1)/15*100}%`;$('action').textContent=i===14?'FINISH':'Next Question →';return;}if(i<14){i++;render()}else{$('quiz').innerHTML='';$('action').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('action').onclick=check;render();</script></body></html>
