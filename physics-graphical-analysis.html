border-color:#8bcf45;color:#245b18;box-shadow:0 3px 0 #acd977}.page-tabs a:active{transform:translateY(2px);box-shadow:none}@media(max-width:380px){.page-tabs{gap:6px}.page-tabs a{min-height:66px;font-size:11px}}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;font-weight:700;margin:16px 0 7px}.track{height:11px;background:#e2edf7;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}.qmeta{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:750}.question{font-size:clamp(19px,4vw,24px);line-height:1.4;margin:12px 0 17px;font-weight:750}.options{display:grid;gap:9px}.option{display:flex;align-items:center;gap:11px;width:100%;min-height:56px;padding:12px;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;background:#fff;color:var(--ink);text-align:left;font-family:inherit;font-size:15px;font-weight:750;line-height:1.4;cursor:pointer}.option:hover:not(:disabled){border-color:#68a9d1;background:#f5fbff}.option.selected{border-color:var(--blue);background:#e8f7ff;padding:12px}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}.letter{flex:0 0 27px;height:27px;display:grid;place-items:center;border:1px solid #d6e0e8;border-radius:7px;color:#52677a;font-size:12px}.feedback{display:none;margin-top:13px;padding:13px;border-radius:10px;font-size:14px;line-height:1.55}.feedback.show{display:block}.feedback.good{background:#f0fdf4;border:1px solid #b7d9ad}.feedback.bad{background:#fff4f4;border:1px solid #efc3c3}.actions{display:flex;gap:9px;margin-top:15px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;background:#fff;color:#24527a;font-family:inherit;font-size:15px;font-weight:900;cursor:pointer}.btn.primary{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--gd)}.btn:disabled{opacity:.45;cursor:not-allowed}.continue{display:none}.continue.show{display:block}.stats{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}.finish{text-align:center}.score{font-size:40px;font-weight:850;color:#174a78;margin:8px 0}.finish .btn{max-width:240px;margin-top:15px}@media(max-width:480px){main{padding:12px 10px 30px}.page-tabs{gap:5px}.page-tabs a{font-size:11px;padding:8px 2px}.option{font-size:14px}.actions{gap:7px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<script>(function(){'use strict';const questions=[{"q":"On a position–time graph, what does the slope represent?","o":["Acceleration","Velocity","Displacement only","Force"],"a":1,"e":"The slope is change in position divided by change in time, which is velocity."},{"q":"A horizontal line on a position–time graph means the object is:","o":["At rest","Moving with constant speed","Accelerating uniformly","Moving backward"],"a":0,"e":"Position stays constant as time passes, so velocity is zero."},{"q":"A straight line with a constant positive slope on a position–time graph represents:","o":["Constant positive velocity","Increasing acceleration","Constant negative velocity","Zero velocity"],"a":0,"e":"A constant positive slope means position increases uniformly with time."},{"q":"A negative slope on a position–time graph indicates:","o":["Positive acceleration always","Negative velocity","Zero velocity","The object is at rest"],"a":1,"e":"A negative position–time slope means position decreases with time along the chosen axis."},{"q":"On a velocity–time graph, the slope represents:","o":["Displacement","Speed","Acceleration","Distance"],"a":2,"e":"Acceleration is the rate of change of velocity, so it is the slope of a v–t graph."},{"q":"On a velocity–time graph, the signed area under the curve gives:","o":["Acceleration","Displacement","Force","Instantaneous speed"],"a":1,"e":"Integrating velocity over time gives displacement; areas below the time axis count as negative."},{"q":"On a speed–time graph, the area under the curve represents:","o":["Total distance travelled","Net displacement always","Acceleration","Jerk"],"a":0,"e":"Speed is non-negative, so its area over time gives total distance travelled."},{"q":"A horizontal line at 5 m/s on a velocity–time graph indicates:","o":["Zero velocity","Constant velocity","Constant acceleration of 5 m/s²","Increasing velocity"],"a":1,"e":"Velocity remains fixed at 5 m/s, so acceleration is zero."},{"q":"Velocity increases uniformly from 0 to 10 m/s in 5 s. Acceleration is:","o":["0.5 m/s²","2 m/s²","5 m/s²","50 m/s²"],"a":1,"e":"Acceleration = Δv/Δt = (10 − 0)/5 = 2 m/s²."},{"q":"A velocity–time graph shows constant velocity 4 m/s for 3 s. Displacement is:","o":["1.33 m","7 m","12 m","24 m"],"a":2,"e":"Displacement = v × t = 4 × 3 = 12 m."},{"q":"Velocity changes from +8 m/s to +2 m/s in 3 s. Average acceleration is:","o":["+2 m/s²","−2 m/s²","−6 m/s²","+6 m/s²"],"a":1,"e":"a = (2 − 8)/3 = −2 m/s²."},{"q":"A line on a velocity–time graph slopes downward from positive velocity to zero. The object is:","o":["Speeding up in the positive direction","Slowing down to rest","Moving at constant speed","At rest for the whole interval"],"a":1,"e":"Positive velocity decreases to zero, so the object slows to a stop."},{"q":"A velocity–time graph crosses the time axis from positive to negative velocity. This indicates:","o":["A change in direction","No motion at any time","Constant positive velocity","Infinite acceleration necessarily"],"a":0,"e":"The sign of velocity changes, meaning the direction of motion reverses."},{"q":"A displacement–time graph has a curved shape with slope getting steeper. What happens to velocity?","o":["It decreases","It remains zero","Its magnitude increases","It must be negative"],"a":2,"e":"The slope of a position/displacement–time graph is velocity; a steeper slope means greater velocity magnitude."},{"q":"A straight line on a velocity–time graph has a constant positive slope. Acceleration is:","o":["Constant and positive","Constant and negative","Zero","Increasing without limit"],"a":0,"e":"A constant positive slope means velocity increases at a constant positive rate."},{"q":"The slope of a distance–time graph gives:","o":["Acceleration","Average speed over that segment","Displacement","Momentum"],"a":1,"e":"Distance divided by elapsed time gives average speed; for a curved graph, the tangent slope gives instantaneous speed."},{"q":"On an acceleration–time graph, the area under the curve gives:","o":["Change in velocity","Displacement","Position","Speed only"],"a":0,"e":"The time integral of acceleration is the change in velocity."},{"q":"An acceleration–time graph is horizontal at 0 m/s². The velocity is:","o":["Necessarily zero","Constant","Increasing linearly","Decreasing linearly"],"a":1,"e":"Zero acceleration means velocity does not change; it may be zero or nonzero."},{"q":"A body starts from rest and accelerates at 2 m/s² for 4 s. The area under its v–t graph is:","o":["4 m","8 m","16 m","32 m"],"a":2,"e":"The v–t graph is a triangle with base 4 s and height 8 m/s: area = ½ × 4 × 8 = 16 m."},{"q":"A v–t graph has velocity −3 m/s for 4 s. Displacement is:","o":["−12 m","+12 m","−7 m","+7 m"],"a":0,"e":"Signed area = v × t = −3 × 4 = −12 m."},{"q":"A v–t graph has +5 m/s for 2 s, then −5 m/s for 2 s. Net displacement is:","o":["0 m","10 m","20 m","−20 m"],"a":0,"e":"The positive area +10 m and negative area −10 m cancel."},{"q":"For a uniformly accelerated object, the velocity–time graph is:","o":["A straight line","Always a circle","Always horizontal","A vertical line"],"a":0,"e":"Constant acceleration means velocity changes linearly with time."},{"q":"If a position–time graph is a parabola opening upward, its slope generally:","o":["Decreases continuously","Increases with time","Is always zero","Cannot represent motion"],"a":1,"e":"For an upward-opening position–time parabola, the slope typically increases with time, indicating increasing velocity."},{"q":"Two position–time lines have different constant slopes. The line with the steeper absolute slope represents:","o":["Greater speed","Greater mass","Greater acceleration necessarily","Less displacement at all times"],"a":0,"e":"The absolute slope of a position–time graph is speed for straight-line motion."},{"q":"A graph's vertical axis shows velocity (m/s) and horizontal axis shows time (s). The slope unit is:","o":["m","m/s","m/s²","s/m"],"a":2,"e":"Slope units are (m/s)/s = m/s², the unit of acceleration."},{"q":"A graph's vertical axis shows position (m) and horizontal axis shows time (s). The slope unit is:","o":["m/s","m/s²","s","m²"],"a":0,"e":"Slope units are metres divided by seconds, or m/s."},{"q":"On a v–t graph, the object moves with negative velocity but positive acceleration. Its speed is:","o":["Increasing always","Decreasing at that instant","Constant always","Zero necessarily"],"a":1,"e":"Acceleration opposite to negative velocity reduces the magnitude of velocity, so speed decreases at that instant."},{"q":"The area under a v–t graph from 0 to 2 s is +6 m, and from 2 to 4 s is −2 m. Net displacement is:","o":["+8 m","+4 m","−4 m","−8 m"],"a":1,"e":"Net displacement is the signed sum of areas: +6 + (−2) = +4 m."},{"q":"A car's velocity increases from 10 m/s to 20 m/s uniformly over 5 s. Its v–t graph area over this interval is:","o":["25 m","50 m","75 m","100 m"],"a":2,"e":"Area is average velocity × time = ((10 + 20)/2) × 5 = 75 m."},{"q":"Which graph is best for finding acceleration directly from its slope?","o":["Position–time","Velocity–time","Distance–time","Mass–time"],"a":1,"e":"The slope of a velocity–time graph gives acceleration."}];// Randomize option positions once while preserving each correct answer.
questions.forEach(q=>{const pairs=q.o.map((text,i)=>({text,correct:i===q.a}));for(let i=pairs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pairs[i],pairs[j]]=[pairs[j],pairs[i]];}q.o=pairs.map(p=>p.text);q.a=pairs.findIndex(p=>p.correct);});
let index=0,score=0,chosen=null,locked=false;const $=id=>document.getElementById(id);
function render(){chosen=null;locked=false;const item=questions[index];$('progressText').textContent='Question '+(index+1)+' of '+questions.length;$('percent').textContent=Math.round(index/questions.length*100)+'%';$('fill').style.width=(index/questions.length*100)+'%';$('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;$('feedback').className='feedback';$('feedback').textContent='';$('check').style.display='block';$('check').disabled=true;$('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'View results':'Continue';$('options').replaceChildren();item.o.forEach((choice,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=choice;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});}
$('check').addEventListener('click',()=>{if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});const f=$('feedback');if(chosen===item.a){score++;$('xp').textContent='⚡ '+(score*10)+' XP';f.className='feedback show good';f.textContent='Correct. '+item.e;}else{buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}$('check').style.display='none';$('continue').className='btn continue show';});
$('continue').addEventListener('click',()=>{if(!locked)return;index++;if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}$('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Practice complete';$('percent').textContent='100%';const pct=Math.round(score/questions.length*100),card=document.createElement('section');card.className='panel finish';const heading=document.createElement('h2');heading.textContent='Practice complete';const result=document.createElement('div');result.className='score';result.textContent=score+' / '+questions.length;const summary=document.createElement('p');summary.className='muted';summary.textContent=pct+'% correct • '+(score*10)+' XP earned';const retry=document.createElement('button');retry.className='btn primary';retry.textContent='Practise again';retry.addEventListener('click',()=>{index=0;score=0;$('xp').textContent='⚡ 0 XP';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});});card.append(heading,result,summary,retry);$('finishSlot').replaceChildren(card);});render();})();</script>
