<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Graphical Analysis</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eef7ff;color:#173b62}.wrap{max-width:1050px;margin:auto;padding:20px}.hero,.mastery,.panel,.quiz{background:#fff;border-radius:20px;padding:22px;margin:12px 0;box-shadow:0 6px 18px #123b7015}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}.options{display:grid;gap:10px;margin:18px 0}.option{padding:14px;border:2px solid #dbe7f1;border-radius:15px;background:#fff;text-align:left;font-weight:700;cursor:pointer;font-size:16px}.option.selected{border-color:#1677ff;background:#eef6ff}.option.correct{border-color:#2db84d!important;background:#eaffef!important}.option.wrong{border-color:#e5484d!important;background:#fff0f0!important}.btn{padding:12px 18px;border:0;border-radius:13px;font-weight:900;cursor:pointer;margin:8px 6px 0 0}.check{background:#2db84d;color:#fff}.next{background:#dcecff;color:#145b9e}.btn:disabled{opacity:.55;cursor:not-allowed}.feedback{margin-top:14px;padding:13px;border-radius:14px;min-height:20px}.good{background:#e5f9e9}.bad{background:#fff0f0}.bar{height:13px;background:#dce8f2;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#42c95a;transition:width .25s ease}@media(max-width:750px){.layout{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><main class="wrap"><p><a href="physics-home.html">← Back to Physics Path</a></p><section class="hero"><div>PHYSICS • NEET 2026</div><h1>Graphical analysis</h1><p>LEARN → PRACTICE → MASTER • 15 focused NEET-style MCQs</p></section><section class="mastery">🎯 Skill Mastery <b id="mt">0 / 15</b><div class="bar"><div id="fill" class="fill"></div></div></section><div class="layout"><aside class="panel"><h3 id="count">Question 1 of 15</h3><div id="pct">7%</div><p>Graphical analysis</p><p>⚡ +10 XP each</p><p>🦉 Learn → Practice → Master</p></aside><section class="quiz"><b id="badge">Q1</b><h2 id="q">Loading question…</h2><div id="opts" class="options"></div><button id="check" class="btn check">Check Answer</button><button id="next" class="btn next" disabled>Next Question →</button><div id="fb" class="feedback">💡 Choose the best answer.</div></section></div></main><script>(function(){'use strict';const quiz=[
['In a position–time graph, the slope represents:',['Velocity','Acceleration','Distance','Force'],0],
['In a velocity–time graph, the slope represents:',['Acceleration','Displacement','Speed','Position'],0],
['The area under a velocity–time graph gives:',['Displacement','Acceleration','Velocity','Jerk'],0],
['The area under a speed–time graph gives:',['Distance travelled','Displacement with sign','Acceleration','Position'],0],
['A horizontal position–time graph indicates that the object is:',['At rest','Moving with constant acceleration','Moving with constant speed','Moving backward'],0],
['A straight line with constant positive slope on a position–time graph represents:',['Uniform positive velocity','Zero velocity','Uniform acceleration','Decreasing velocity'],0],
['A straight horizontal line on a velocity–time graph represents:',['Zero acceleration','Zero velocity','Increasing acceleration','Constant displacement'],0],
['A velocity–time graph is a straight line with positive slope. The motion has:',['Constant positive acceleration','Zero acceleration','Constant negative velocity','Zero displacement'],0],
['If the velocity–time graph lies below the time axis, the velocity is:',['Negative','Positive','Zero','Undefined'],0],
['For a particle whose velocity changes from 0 to 10 m/s uniformly in 5 s, acceleration from the v–t graph is:',['2 m/s²','5 m/s²','10 m/s²','50 m/s²'],0],
['A v–t graph shows constant velocity 4 m/s for 6 s. Displacement is:',['24 m','10 m','2/3 m','4 m'],0],
['For a position–time graph, a negative slope means:',['Negative velocity','Negative acceleration necessarily','Zero velocity','Positive velocity'],0],
['A curved position–time graph whose slope increases with time represents:',['Increasing velocity','Constant velocity','Zero velocity','Decreasing position'],0],
['If the net signed area under a velocity–time graph from 0 to 10 s is zero, the particle’s net displacement is:',['Zero','10 m','Cannot be zero','Equal to its distance'],0],
['Which graph is most directly used to determine acceleration from its slope?',['Velocity–time graph','Position–time graph','Distance–time graph','Mass–time graph'],0]
];let i=0,sel=-1,score=0,q=document.getElementById('q'),o=document.getElementById('opts'),fb=document.getElementById('fb'),check=document.getElementById('check'),next=document.getElementById('next');function render(){let a=quiz[i];sel=-1;q.textContent=a[0];document.getElementById('badge').textContent='Q'+(i+1);document.getElementById('count').textContent='Question '+(i+1)+' of 15';document.getElementById('pct').textContent=Math.round((i+1)/15*100)+'%';o.innerHTML='';fb.className='feedback';fb.textContent='💡 Choose the best answer.';check.disabled=false;next.disabled=true;a[1].forEach((v,j)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+v;b.onclick=()=>{sel=j;[...o.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)})}check.onclick=()=>{if(sel<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}let a=quiz[i];[...o.children].forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===sel&&j!==a[2])b.classList.add('wrong')});if(sel===a[2]){score++;fb.className='feedback good';fb.textContent='🎯 Correct! +10 XP'}else{fb.className='feedback bad';fb.textContent='Review. Correct answer: '+a[1][a[2]]}document.getElementById('mt').textContent=score+' / 15';document.getElementById('fill').style.width=score/15*100+'%';check.disabled=true;next.disabled=false;if(i===14)next.textContent='Finish Skill →'};next.onclick=()=>{if(i<14){i++;next.textContent='Next Question →';render()}else{q.textContent='🏆 Graphical Analysis Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+score+' / 15 correct • '+score*10+' XP'}};render()})();</script></body></html>
