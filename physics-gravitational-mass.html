<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>⚖️ Gravitational Mass</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"Gravitational mass describes how an object:",o:["Participates in gravitational interaction","Resists all changes in velocity only","Stores electrical charge","Measures temperature"],a:0,e:"Gravitational mass determines the strength of an object's interaction with a gravitational field."},
{q:"The SI unit of gravitational mass is:",o:["Kilogram (kg)","Newton (N)","Joule (J)","Metre per second (m/s)"],a:0,e:"Mass is measured in kilograms."},
{q:"Newton's law gives the gravitational force between two point masses as:",o:["F = Gm₁m₂/r²","F = Gm₁m₂r²","F = G(m₁+m₂)/r","F = Gm₁m₂/r"],a:0,e:"The force is proportional to the product of masses and inversely proportional to the square of their separation."},
{q:"If one mass doubles while the other mass and distance remain fixed, gravitational force:",o:["Doubles","Halves","Becomes four times","Stays the same"],a:0,e:"Force is directly proportional to each interacting mass."},
{q:"If both masses double and separation stays fixed, gravitational force:",o:["Becomes four times","Doubles","Halves","Stays the same"],a:0,e:"Doubling both masses multiplies their product by four."},
{q:"If the separation between two masses doubles, gravitational force becomes:",o:["One-fourth","One-half","Twice","Four times"],a:0,e:"The force follows an inverse-square distance relation."},
{q:"If separation is tripled, gravitational force becomes:",o:["One-ninth","One-third","Three times","Nine times"],a:0,e:"F is proportional to 1/r², so tripling r reduces force by nine."},
{q:"The gravitational force between two ordinary masses is:",o:["Attractive","Always repulsive","Always zero","Dependent on electric charge sign"],a:0,e:"Newtonian gravity between positive masses is attractive."},
{q:"The gravitational forces two bodies exert on each other have:",o:["Equal magnitude and opposite directions","Different magnitudes proportional to their masses","The same direction","Zero magnitude for unequal masses"],a:0,e:"Newton's third law gives equal and opposite interaction forces."},
{q:"The gravitational constant G is approximately:",o:["6.67 × 10⁻¹¹ N m²/kg²","9.8 m/s²","6.67 × 10¹¹ N/kg","3.0 × 10⁸ m/s"],a:0,e:"G is the universal constant in Newton's law of gravitation."},
{q:"The dimensions of G are:",o:["M⁻¹L³T⁻²","MLT⁻²","L²T⁻²","LT⁻²"],a:0,e:"From G = Fr²/(m₁m₂), dimensions are M⁻¹L³T⁻²."},
{q:"Gravitational mass is experimentally equivalent to:",o:["Inertial mass","Electric charge","Density","Weight in newtons"],a:0,e:"Experiments show gravitational mass and inertial mass are equivalent to high precision."},
{q:"Inertial mass measures an object's:",o:["Resistance to acceleration","Gravitational force only","Volume","Potential energy only"],a:0,e:"Inertial mass is the mass appearing in Newton's second law F = ma."},
{q:"Gravitational mass affects the gravitational force because:",o:["The force is proportional to the product of the masses","The force is independent of mass","Mass appears only in the distance term","Mass changes G"],a:0,e:"The masses multiply in F = Gm₁m₂/r²."},
{q:"A 2 kg and 3 kg point mass are separated by 1 m. The force is:",o:["6G N","5G N","G/6 N","6/G N"],a:0,e:"F = G(2)(3)/1² = 6G N."},
{q:"If force is F at distance r, at distance 2r it is:",o:["F/4","F/2","2F","4F"],a:0,e:"Inverse-square scaling gives F' = F(1/2)² = F/4."},
{q:"If the first mass is halved and the second is tripled, with distance fixed, force becomes:",o:["1.5 times the original","Half the original","Three times the original","Six times the original"],a:0,e:"The product of mass factors is (1/2) × 3 = 1.5."},
{q:"The gravitational force acts along the:",o:["Line joining the centres of the two masses","Tangent to their orbit in all cases","Vertical direction only","Direction of the faster object's velocity"],a:0,e:"The force is directed along the line joining the bodies' centres."},
{q:"For spherical bodies that do not overlap, the separation r in Newton's formula is measured between:",o:["Their centres","Their nearest surface points","Their farthest surface points","Any arbitrary points"],a:0,e:"For spherical bodies, use centre-to-centre separation."},
{q:"If the distance is reduced to half, gravitational force becomes:",o:["Four times","Twice","Half","One-fourth"],a:0,e:"Halving r increases 1/r² by a factor of four."},
{q:"Which statement about G is correct?",o:["It is universal in Newtonian gravitation","It changes with the object's mass","It is the same as local g","It is measured in kilograms"],a:0,e:"G is universal; local g depends on the source body and location."},
{q:"Near a planet, an object's weight is approximately:",o:["W = mg","W = m/g","W = Gm/r","W = m + g"],a:0,e:"Weight is the gravitational force on the object, commonly written W = mg near the surface."},
{q:"If a body's mass is 4 kg and local g is 3 m/s², its weight is:",o:["12 N","7 N","1.33 N","3 N"],a:0,e:"W = mg = 4 × 3 = 12 N."},
{q:"Mass and weight differ because:",o:["Mass is measured in kg; weight is a force measured in N","Both are forces measured in N","Mass changes with location but weight does not","Weight has no relation to gravity"],a:0,e:"Mass is a property of the body; weight depends on local gravitational acceleration."},
{q:"If a body is taken from Earth to the Moon, its gravitational mass:",o:["Remains the same","Becomes about one-sixth","Becomes zero","Doubles"],a:0,e:"The body's mass does not change with location, although its weight changes."},
{q:"The gravitational field strength of a point mass M at distance r is:",o:["g = GM/r²","g = GMr²","g = GM/r","g = Gr²/M"],a:0,e:"Field strength is force per unit test mass, giving GM/r²."},
{q:"If source mass M triples at fixed distance, the gravitational field strength it creates:",o:["Triples","Halves","Becomes one-ninth","Stays unchanged"],a:0,e:"Field strength is directly proportional to the source mass."},
{q:"A test mass in a gravitational field is doubled. The force on it:",o:["Doubles, while the field strength at that point is unchanged","Halves and the field doubles","Stays the same and field doubles","Becomes zero"],a:0,e:"Force on the test mass changes, but field strength is defined per unit test mass."},
{q:"A 10 kg object and a 1 kg object at the same location in a vacuum experience gravitational forces whose ratio is:",o:["10:1","1:10","1:1","100:1"],a:0,e:"The gravitational force is proportional to the object's gravitational mass, so the ratio is 10:1."},
{q:"Which equation correctly combines gravitational force and surface weight for a planet of mass M and radius R?",o:["mg = GMm/R²","mg = GMR²","m/g = GM/R²","mg = GM/R"],a:0,e:"Equating W = mg with gravitational force GMm/R² leads to g = GM/R² after cancelling m."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Gravitational Mass Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
