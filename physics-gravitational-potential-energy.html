<style>

.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>📏 Gravitational Potential Energy</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
  {
    "q": "For two point masses M and m separated by distance r, gravitational potential energy (zero at infinity) is:",
    "o": [
      "GMm/r",
      "−GMm/r",
      "−GMm/r²",
      "GMm/r²"
    ],
    "a": 1,
    "e": "With zero potential energy at infinity, U = −GMm/r for two masses attracting gravitationally."
  },
  {
    "q": "The SI unit of gravitational potential energy is:",
    "o": [
      "N/kg",
      "Joule",
      "N/kg²",
      "Watt"
    ],
    "a": 1,
    "e": "Potential energy is energy, measured in joules (J)."
  },
  {
    "q": "The gravitational potential energy of two masses is negative when the zero is chosen at:",
    "o": [
      "Earth's surface",
      "The centre of Earth",
      "Infinity",
      "Any point"
    ],
    "a": 2,
    "e": "With U = 0 at infinity, the attractive gravitational interaction gives U = −GMm/r at finite separation."
  },
  {
    "q": "If the separation between two masses doubles, their gravitational potential energy becomes:",
    "o": [
      "Twice as negative",
      "Half as negative",
      "Four times as negative",
      "Unchanged"
    ],
    "a": 1,
    "e": "U = −GMm/r, so doubling r halves the magnitude of the negative potential energy."
  },
  {
    "q": "The gravitational potential due to a point mass M at distance r, with zero at infinity, is:",
    "o": [
      "−GM/r",
      "−GM/r²",
      "GM/r²",
      "−GMr"
    ],
    "a": 0,
    "e": "Gravitational potential is potential energy per unit test mass: V = −GM/r."
  },
  {
    "q": "The SI unit of gravitational potential is:",
    "o": [
      "J",
      "J/kg",
      "N·m²/kg²",
      "kg/J"
    ],
    "a": 1,
    "e": "Potential is energy per unit mass, so its SI unit is J/kg (equivalent to m²/s²)."
  },
  {
    "q": "A mass m is moved from radius r to 2r from a planet of mass M. The change in potential energy is:",
    "o": [
      "−GMm/(2r)",
      "GMm/(2r)",
      "GMm/r",
      "Zero"
    ],
    "a": 1,
    "e": "ΔU = U₂ − U₁ = −GMm/(2r) − (−GMm/r) = GMm/(2r), a positive increase."
  },
  {
    "q": "Gravitational force between two point masses varies with distance as:",
    "o": [
      "1/r",
      "1/r²",
      "r²",
      "r"
    ],
    "a": 1,
    "e": "Newton's law gives F = GMm/r² in magnitude."
  },
  {
    "q": "Gravitational potential due to a point mass varies with distance as:",
    "o": [
      "1/r²",
      "1/r³",
      "1/r",
      "r²"
    ],
    "a": 2,
    "e": "V = −GM/r, so potential varies inversely with distance."
  },
  {
    "q": "At infinity, gravitational potential is conventionally taken as:",
    "o": [
      "+1 J/kg",
      "−1 J/kg",
      "Zero",
      "Infinite"
    ],
    "a": 2,
    "e": "For isolated gravitational systems, the standard reference sets potential to zero at infinity."
  },
  {
    "q": "A 2 kg mass is at a point where gravitational potential is −30 J/kg. Its potential energy is:",
    "o": [
      "−60 J",
      "−15 J",
      "+60 J",
      "+15 J"
    ],
    "a": 0,
    "e": "U = mV = 2 × (−30) = −60 J."
  },
  {
    "q": "If the source mass M doubles while r stays constant, the gravitational potential at that point:",
    "o": [
      "Halves in magnitude",
      "Doubles",
      "Becomes zero",
      "Changes sign"
    ],
    "a": 1,
    "e": "V = −GM/r, so potential is directly proportional to source mass."
  },
  {
    "q": "If both masses are doubled at the same separation, gravitational potential energy:",
    "o": [
      "Doubles",
      "Quadruples",
      "Halves",
      "Stays unchanged"
    ],
    "a": 1,
    "e": "U = −GMm/r; doubling both M and m makes U four times its original value."
  },
  {
    "q": "The gravitational potential energy of two separated masses becomes less negative when they are:",
    "o": [
      "Moved closer together",
      "Moved farther apart",
      "Both made stationary",
      "Rotated without changing separation"
    ],
    "a": 1,
    "e": "Increasing separation moves U = −GMm/r toward zero, making it less negative."
  },
  {
    "q": "Work done by gravity when a mass moves from r to a larger radius R is:",
    "o": [
      "Positive",
      "Negative",
      "Always zero",
      "Infinite"
    ],
    "a": 1,
    "e": "Gravity acts inward while outward displacement increases radius, so gravity does negative work."
  },
  {
    "q": "The work done by an external agent in slowly moving a mass from r to R is:",
    "o": [
      "U(r) − U(R)",
      "U(R) − U(r)",
      "Always zero",
      "−U(R)"
    ],
    "a": 1,
    "e": "For a slow move with negligible change in kinetic energy, external work equals the change in potential energy."
  },
  {
    "q": "Gravitational potential energy depends on the chosen reference level because:",
    "o": [
      "Gravity changes with reference level",
      "Only differences are physically significant",
      "Mass changes with height",
      "Energy has no units"
    ],
    "a": 1,
    "e": "Adding a constant to potential energy changes its reference value but not measurable energy differences."
  },
  {
    "q": "For a planet of mass M and radius R, the gravitational potential at its surface (outside spherical planet approximation) is:",
    "o": [
      "−GM/R",
      "−GM/R²",
      "GM/R",
      "GM R"
    ],
    "a": 0,
    "e": "Outside a spherical planet, its gravity acts as if its mass were concentrated at the centre; V = −GM/R at the surface."
  },
  {
    "q": "The gravitational potential energy of a satellite of mass m in circular orbit radius r around mass M is:",
    "o": [
      "−GMm/r",
      "−GMm/(2r)",
      "GMm/r²",
      "Zero"
    ],
    "a": 0,
    "e": "Gravitational potential energy depends on separation and remains U = −GMm/r in circular orbit."
  },
  {
    "q": "For a circular orbit, the total mechanical energy of a satellite is:",
    "o": [
      "+GMm/(2r)",
      "−GMm/(2r)",
      "−GMm/r",
      "Zero"
    ],
    "a": 1,
    "e": "For a circular orbit, K = GMm/(2r) and U = −GMm/r, so E = K + U = −GMm/(2r)."
  },
  {
    "q": "The escape speed from a spherical planet of mass M and radius R (ignoring atmosphere and rotation) is:",
    "o": [
      "√(GM/R)",
      "√(2GM/R)",
      "2GM/R",
      "GM/R²"
    ],
    "a": 1,
    "e": "Escape requires enough kinetic energy to raise total energy to zero: ½mv² = GMm/R, giving v = √(2GM/R)."
  },
  {
    "q": "At a point where gravitational potential is −20 J/kg, the potential energy of a 0.5 kg object is:",
    "o": [
      "−40 J",
      "−10 J",
      "+10 J",
      "+40 J"
    ],
    "a": 1,
    "e": "U = mV = 0.5 × (−20) = −10 J."
  },
  {
    "q": "The gravitational potential due to several point masses is found by:",
    "o": [
      "Multiplying their potentials",
      "Adding their potentials algebraically",
      "Adding only magnitudes",
      "Using the largest mass only"
    ],
    "a": 1,
    "e": "Gravitational potential is a scalar, so the individual potentials add algebraically."
  },
  {
    "q": "Two equal masses are placed symmetrically around a point. Their gravitational potentials at that point:",
    "o": [
      "Must cancel",
      "Add together",
      "Are always zero",
      "Cannot be defined"
    ],
    "a": 1,
    "e": "Potential is scalar and has the same negative sign for both positive source masses, so the contributions add."
  },
  {
    "q": "Gravitational potential at a point is defined as:",
    "o": [
      "Force per unit mass",
      "Work done per unit mass by an external agent bringing a test mass from infinity slowly",
      "Energy per unit volume",
      "Force multiplied by distance"
    ],
    "a": 1,
    "e": "Potential is the external work per unit test mass required to bring it from infinity to the point, with the usual zero at infinity."
  },
  {
    "q": "The gravitational field strength and potential are related in one dimension by:",
    "o": [
      "g = dV/dr",
      "g = −dV/dr",
      "g = V/r²",
      "g = −V r"
    ],
    "a": 1,
    "e": "The field is the negative gradient of gravitational potential; radially, g_r = −dV/dr."
  },
  {
    "q": "At a point where gravitational potential is constant throughout a small region, the gravitational field there is:",
    "o": [
      "Necessarily zero within that region",
      "Necessarily infinite",
      "Always upward",
      "Equal to the potential"
    ],
    "a": 0,
    "e": "If potential is spatially constant throughout a region, its gradient is zero, so the field is zero there."
  },
  {
    "q": "A test mass is moved along an equipotential surface. The work done by gravity is:",
    "o": [
      "Positive",
      "Negative",
      "Zero",
      "Depends only on speed"
    ],
    "a": 2,
    "e": "Potential does not change along an equipotential, so ΔU = 0 and the work by gravity is zero."
  },
  {
    "q": "A 1 kg mass moves from potential −50 J/kg to −10 J/kg. Its change in potential energy is:",
    "o": [
      "−60 J",
      "−40 J",
      "+40 J",
      "+60 J"
    ],
    "a": 2,
    "e": "ΔU = m(Vf − Vi) = 1 × [−10 − (−50)] = +40 J."
  },
  {
    "q": "Why is gravitational potential energy negative for an attractive pair when zero is set at infinity?",
    "o": [
      "Gravity repels the masses",
      "Energy must always be negative",
      "Work can be released as the masses come together from infinity",
      "The masses have negative mass"
    ],
    "a": 2,
    "e": "The attractive system loses potential energy as the masses approach from infinity, where the chosen potential energy is zero."
  }
];
let index=0,score=0,streak=0,chosen=null,locked=false;
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Nice work!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><button class="btn" id="retry">Practice again</button>';
 $('finishSlot').replaceChildren(card);$('retry').addEventListener('click',()=>{index=0;score=0;streak=0;$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
