 potential energy becomes:',['three times','nine times','one-third','unchanged'],0,'U=mgh, so U is directly proportional to h.'],['Gravitational potential energy is defined with respect to a chosen:',['reference level','speed','direction','temperature'],0,'The zero of potential energy can be chosen at a convenient reference level.'],['A body of mass 2 kg is moved from 3 m to 8 m height. With g=10 m/s², the increase in potential energy is:',['100 J','60 J','160 J','50 J'],0,'ΔU=2×10×(8−3)=100 J.'],['For a body at a fixed height near Earth, gravitational potential energy is directly proportional to:',['mass','speed','acceleration of the body','momentum'],0,'For fixed h and g, U=mgh is proportional to mass.'],['When a body falls downward without other effects, its gravitational potential energy:',['decreases','increases','remains constant','becomes negative necessarily'],0,'As height decreases, gravitational potential energy decreases.'],['A 1 kg object is lifted through 10 m. Taking g=9.8 m/s², the gain in gravitational potential energy is:',['98 J','9.8 J','100 J','19.6 J'],0,'ΔU=mgh=1×9.8×10=98 J.'],['For a point mass at a distance r from the centre of Earth, gravitational potential energy is commonly written as:',['−GMm/r','GMm/r','−GMm r','GMm/r²'],0,'Taking zero at infinity, U=−GMm/r.'],['Why is gravitational potential energy negative for a bound two-body system when zero is taken at infinity?',['The system is bound and energy is below the zero level','Gravity has no energy','Mass is negative','Distance is negative'],0,'With zero potential at infinity, a bound gravitational system has negative potential energy.'],['At the same height above a reference level, which object has greater gravitational potential energy?',['The object with greater mass','The faster object always','The object with smaller mass','Both always have zero energy'],0,'Near Earth U=mgh, so at the same h the larger mass has greater U.'],['A 4 kg body is lowered by 5 m. Taking g=10 m/s², the change in its gravitational potential energy is:',['−200 J','+200 J','−40 J','+40 J'],0,'ΔU=mgΔh=4×10×(−5)=−200 J.'],['If the reference level for gravitational potential energy is changed, the numerical value of U can:',['change by a constant while physical energy differences remain unchanged','never change','change the mass','change g'],0,'Changing the zero level shifts potential energy by a constant; differences between levels remain physical.'],['Which statement is correct for gravitational potential energy in a uniform gravitational field?',['Only changes in potential energy are physically important; U=mgh depends on the chosen zero','It is a vector','It is measured in newtons','It is independent of height'],0,'Potential energy is scalar and its absolute value depends on the reference level.']];let i=0,selected=-1,score=0,checked=false;const $=id=>document.getElementById(id),q=$("question"),o=$("options"),b=$("continue"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;q.textContent=a[0];$("count").textContent='Question '+(i+1)+' of 15';o.innerHTML='';f.className='feedback';f.textContent='';b.disabled=false;b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const x=document.createElement('button');x.className='option';x.textContent=String.fromCharCode(65+j)+'. '+item.text;x.dataset.index=item.index;x.onclick=()=>{selected=item.index;[...o.children].forEach(z=>z.classList.remove('selected'));x.classList.add('selected')};o.appendChild(x)})}b.onclick=function(){if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(x=>{const idx=Number(x.dataset.index);x.disabled=true;if(idx===a[2])x.classList.add('correct');if(idx===selected&&!ok)x.classList.add('wrong')});if(ok){score++;f.className='feedback good';f.textContent='🎯 Correct! +10 XP — '+a[3]}else{f.className='feedback bad';f.textContent='✗ Review — Correct answer: '+a[1][a[2]]+'. '+a[3]}$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';return}if(i<14){i++;render();window.scrollTo({top:0,behavior:'smooth'})}else{q.textContent='🏆 Gravitational Potential Energy Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.';localStorage.setItem('skillupPhysicsGravitationalPotentialEnergyScore',score)}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
