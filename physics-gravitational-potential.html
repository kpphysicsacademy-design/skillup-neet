<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Gravitational Potential</title><style>body{margin:0;background:#f5f7fa;font-family:Arial,sans-serif;color:#172033}.wrap{max-width:760px;margin:auto;padding:24px 16px 50px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:27px;font-weight:800}.xp{font-weight:700;color:#168447}.sub{color:#667085;margin:8px 0 18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #0000000b}.mastery{font-weight:700}.bar{height:10px;background:#e7ebf0;border-radius:10px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#22a06b;transition:.3s}.qno{font-size:14px;color:#667085}.q{font-size:20px;font-weight:750;line-height:1.4;margin:10px 0 18px}.opt{display:block;width:100%;text-align:left;padding:14px;margin:9px 0;border:2px solid #d9dee7;background:#fff;border-radius:12px;cursor:pointer;font-size:16px;transition:.15s}.opt:hover{transform:translateY(-1px);border-color:#7b8798}.opt.sel{border-color:#3578e5;background:#eef5ff}.opt.correct{border-color:#20a464;background:#eaf8f0}.opt.wrong{border-color:#d64545;background:#fff0f0}.btn{border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:750;cursor:pointer;background:#22a06b;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.back{display:inline-block;text-decoration:none;color:#344054;border:2px solid #d9dee7;border-radius:12px;padding:12px 18px;font-weight:700;background:#fff}.feedback{min-height:24px;font-weight:700;margin-top:14px}.done{text-align:center;font-size:22px;font-weight:800}</style></head><body><main class="wrap"><div class="head"><div class="title">🌍 Gravitational Potential</div><div class="xp">+10 XP</div></div><div class="sub">Work done per unit mass, potential of a point mass, reference at infinity and equipotential surfaces.</div><section class="card"><div class="mastery">🎯 Skill Mastery <span id="score">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card" id="quizCard"><div class="qno" id="qno"></div><div class="q" id="q"></div><div id="opts"></div><button class="btn" id="continue" disabled>Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>const quiz=[['Gravitational potential at a point is defined as work done per unit mass in bringing a test mass from:', ['infinity to that point','that point to the centre only','Earth to infinity only','the surface to the centre'],0],['The SI unit of gravitational potential is:', ['J kg⁻¹','N kg⁻¹','N m⁻²','kg J'],0],['Gravitational potential is a:', ['scalar quantity','vector quantity','tensor quantity','dimensionless quantity'],0],['For a point mass M, gravitational potential at distance r is:', ['−GM/r','GM/r²','−GMr','GM/r'],0],['Taking gravitational potential to be zero at infinity, the potential due to an isolated positive mass is:', ['negative','positive','zero everywhere','infinite everywhere'],0],['If distance from a point mass is doubled, the magnitude of its gravitational potential becomes:', ['half','one-fourth','double','four times'],0],['If source mass is doubled while distance remains fixed, gravitational potential:', ['doubles in magnitude','halves in magnitude','is unchanged','becomes four times'],0],['The gravitational potential difference between two points represents work done per unit mass by the:', ['gravitational field','electric field only','magnetic field','frictional force'],0],['On an equipotential surface, the work done in moving a test mass is:', ['zero','maximum','negative infinity','equal to GM/r'],0],['The gravitational field is related to potential V by:', ['g=−∇V','g=V²','g=Vr','g=V/r'],0],['Inside a uniform spherical shell, gravitational potential is:', ['constant','zero everywhere','always positive and varying linearly','infinite'],0],['At the surface of a spherical body of mass M and radius R, gravitational potential is:', ['−GM/R','−GM/R²','GM/R','GM/R²'],0],['Gravitational potential energy U of a mass m in potential V is:', ['U=mV','U=V/m','U=m/V','U=V²m'],0],['The gravitational potential at the centre of a thin uniform spherical shell is:', ['−GM/R','−GM/R²','zero','−GMR'],0],['When a mass moves freely in a gravitational field, gravitational potential energy generally:', ['decreases as kinetic energy increases','increases while kinetic energy increases','remains fixed','becomes zero immediately'],0]];let i=0,correct=0,selected=null,checked=false;function $(x){return document.getElementById(x)}function shuffle(a){for(let k=a.length-1;k>0;k--){let r=Math.floor(Math.random()*(k+1));[a[k],a[r]]=[a[r],a[k]]}return a}function render(){selected=null;checked=false;$('continue').disabled=true;$('continue').textContent='Continue →';$('feedback').textContent='';$('qno').textContent=`Question ${i+1} of 15`;$('q').textContent=quiz[i][0];$('opts').innerHTML='';const order=quiz[i][1].map((text,index)=>({text,index}));shuffle(order).forEach((x,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{selected=x.index;document.querySelectorAll('.opt').forEach(z=>z.classList.remove('sel'));b.classList.add('sel');$('continue').disabled=false};$('opts').appendChild(b)});$('score').textContent=`${correct} / 15`;$('fill').style.width=`${(i/15)*100}%`}$('continue').onclick=()=>{if(selected===null)return;if(!checked){checked=true;const ok=selected===quiz[i][2];if(ok)correct++;document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const n=Number(b.dataset.index);if(n===quiz[i][2])b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=ok?'🎉 Correct! +10 XP':'💡 Review the highlighted correct answer.';$('score').textContent=`${correct} / 15`;$('fill').style.width=`${((i+1)/15)*100}%`;$('continue').textContent=i===14?'Finish Skill →':'Continue →';return}if(i<14){i++;render()}else{$('quizCard').innerHTML=`<div class="done">🏆 Skill Complete!</div><p>You scored ${correct} / 15.</p><button class="btn" onclick="location.reload()">Retry →</button>`}};$('back').onclick=function(){const s=sessionStorage.getItem('skillupLastPhysicsPath');if(s){try{const u=new URL(s,location.href);if(u.origin===location.origin){location.href=s;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();</script></body></html>
