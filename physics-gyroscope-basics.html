<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Gyroscope Basics</title><style>body{margin:0;background:#f5f7fa;font-family:Arial,sans-serif;color:#172033}.wrap{max-width:760px;margin:auto;padding:24px 16px 50px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:27px;font-weight:800}.xp{font-weight:700;color:#168447;white-space:nowrap}.sub{color:#667085;margin:8px 0 18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #0000000b}.mastery{font-weight:700}.bar{height:10px;background:#e7ebf0;border-radius:10px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#22a06b;transition:.3s}.qno{font-size:14px;color:#667085}.q{font-size:20px;font-weight:750;line-height:1.4;margin:10px 0 18px}.opt{display:block;width:100%;text-align:left;padding:14px;margin:9px 0;border:2px solid #d9dee7;background:#fff;border-radius:12px;cursor:pointer;font-size:16px;transition:.15s}.opt:hover{transform:translateY(-1px);border-color:#7b8798}.opt.sel{border-color:#3578e5;background:#eef5ff}.opt.correct{border-color:#20a464;background:#eaf8f0}.opt.wrong{border-color:#d64545;background:#fff0f0}.btn{border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:750;cursor:pointer;background:#22a06b;color:white}.btn:disabled{opacity:.5;cursor:not-allowed}.back{display:inline-block;text-decoration:none;color:#344054;border:2px solid #d9dee7;border-radius:12px;padding:12px 18px;font-weight:700;background:#fff;transition:.15s}.back:hover{transform:translateY(-1px);border-color:#7b8798}.feedback{min-height:24px;font-weight:700;margin-top:14px}.done{text-align:center;font-size:22px;font-weight:800}@media(max-width:600px){.title{font-size:22px}.q{font-size:18px}}</style></head><body><main class="wrap"><div class="head"><div class="title">🌀 Gyroscope Basics</div><div class="xp">+10 XP</div></div><div class="sub">Gyroscopic motion, angular momentum, precession and torque.</div><section class="card"><div class="mastery">🎯 Skill Mastery <span id="score">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card" id="quizCard"><div class="qno" id="qno"></div><div class="q" id="q"></div><div id="opts"></div><button class="btn" id="continue" disabled>Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>const quiz=[['A gyroscope primarily demonstrates the dynamics of a:', ['rapidly rotating body','stationary particle','fluid at rest','non-rotating point mass'],0],['The angular momentum of a spinning rigid body about its rotation axis is:', ['L=Iω','L=I/ω','L=ω/I','L=I+ω'],0],['Gyroscopic precession refers to the motion of the:', ['rotation axis about another axis','centre of mass in a straight line only','mass away from the body','spin becoming zero'],0],['For a spinning gyroscope, a torque perpendicular to its angular momentum mainly changes the:', ['direction of angular momentum','mass of the gyroscope','moment of inertia to zero','temperature only'],0],['The angular velocity associated with precession is called:', ['precessional angular velocity','translational velocity','escape velocity','terminal velocity'],0],['For steady gyroscopic precession, the applied torque is related to angular momentum by approximately:', ['τ=Ω×L','τ=Ω+L','τ=L/Ω²','τ=Ω/L'],0],['If the spin angular momentum of a gyroscope increases while applied torque is unchanged, its precession angular speed generally:', ['decreases','increases','becomes infinite','remains necessarily zero'],0],['The SI unit of angular momentum is:', ['kg m² s⁻¹','kg m s⁻¹','N m⁻¹','J s⁻¹'],0],['A spinning bicycle wheel resists a sudden change in the direction of its axis because of:', ['angular momentum','linear displacement only','gravity being absent','zero inertia'],0],['In a simple ideal gyroscope, precession is produced when an external:', ['torque acts on the spinning rotor','mass is removed instantly','force is always parallel to the spin axis','temperature is increased'],0],['If no external torque acts on a rotating gyroscope, its angular momentum:', ['remains conserved','must become zero','doubles every second','changes direction randomly'],0],['A gyroscope spins at 20 rad/s with I=0.5 kg m². Its angular momentum magnitude is:', ['10 kg m²/s','40 kg m²/s','20.5 kg m²/s','0.025 kg m²/s'],0],['For steady precession of a rapidly spinning top, increasing its spin speed generally makes the precession:', ['slower for the same torque','faster for the same torque','independent of angular momentum','impossible'],0],['The rotational inertia of a gyroscope depends mainly on its:', ['mass distribution about the axis','colour','temperature alone','angular position only'],0],['A gyroscope is an important application of conservation of:', ['angular momentum','electric charge only','linear momentum only','mass-energy only'],0]];let i=0,correct=0,selected=null,checked=false;function $(x){return document.getElementById(x)}function shuffle(a){for(let k=a.length-1;k>0;k--){let r=Math.floor(Math.random()*(k+1));[a[k],a[r]]=[a[r],a[k]]}return a}function render(){selected=null;checked=false;$('continue').disabled=true;$('continue').textContent='Continue →';$('feedback').textContent='';$('qno').textContent=`Question ${i+1} of 15`;$('q').textContent=quiz[i][0];$('opts').innerHTML='';const order=quiz[i][1].map((text,index)=>({text,index}));shuffle(order).forEach((x,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{selected=x.index;document.querySelectorAll('.opt').forEach(z=>z.classList.remove('sel'));b.classList.add('sel');$('continue').disabled=false};$('opts').appendChild(b)});$('score').textContent=`${correct} / 15`;$('fill').style.width=`${(i/15)*100}%`}$('continue').onclick=()=>{if(selected===null)return;if(!checked){checked=true;const ok=selected===quiz[i][2];if(ok)correct++;document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const n=Number(b.dataset.index);if(n===quiz[i][2])b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=ok?'🎉 Correct! +10 XP':'💡 Review the highlighted correct answer.';$('score').textContent=`${correct} / 15`;$('fill').style.width=`${((i+1)/15)*100}%`;$('continue').textContent=i===14?'Finish Skill →':'Continue →';return}if(i<14){i++;render()}else{$('quizCard').innerHTML=`<div class="done">🏆 Skill Complete!</div><p>You scored ${correct} / 15.</p><button class="btn" onclick="location.reload()">Retry →</button>`}};$('back').onclick=function(){const s=sessionStorage.getItem('skillupLastPhysicsPath');if(s){try{const u=new URL(s,location.href);if(u.origin===location.origin){location.href=s;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();</script></body></html>
