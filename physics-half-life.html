<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Half-Life</title><meta name="description" content="SkillUp Physics Half-Life interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">⏳</span><h1>Half-Life</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["The half-life of a radioactive substance is the time required for:",["Half of the original radioactive nuclei to decay","All nuclei to decay","The activity to become zero","The atomic number to halve"],0,"After one half-life, half of the original nuclei remain undecayed, so half have decayed."] ,["The relation between half-life T₁/₂ and decay constant λ is:",["T₁/₂=ln2/λ","T₁/₂=λ/ln2","T₁/₂=2λ","T₁/₂=1/λ²"],0,"For exponential decay, T₁/₂=ln2/λ≈0.693/λ."] ,["After one half-life, the fraction of nuclei remaining is:",["1/2","1/4","1/8","1"],0,"The undecayed fraction after one half-life is 1/2."] ,["After two half-lives, the fraction of nuclei remaining is:",["1/4","1/2","1/8","1/16"],0,"Each half-life halves the remainder: (1/2)²=1/4."] ,["After three half-lives, the fraction remaining is:",["1/8","1/3","3/8","1/16"],0,"After three half-lives, the fraction is (1/2)³=1/8."] ,["A sample initially contains 8000 undecayed nuclei. How many remain after one half-life?",["4000","2000","6000","1000"],0,"One half-life leaves half the initial population: 8000/2=4000."] ,["A radioactive sample has a half-life of 5 days. After 15 days, the fraction remaining is:",["1/8","1/4","1/2","1/16"],0,"15 days corresponds to three half-lives, so the fraction is 1/8."] ,["If the initial activity is 1600 Bq, what is the activity after two half-lives?",["400 Bq","800 Bq","200 Bq","100 Bq"],0,"Activity follows the same exponential decay law: 1600/2²=400 Bq."] ,["If the decay constant λ is doubled, the half-life:",["Becomes half as large","Doubles","Does not change","Becomes zero"],0,"Since T₁/₂=ln2/λ, doubling λ halves the half-life."] ,["A nuclide has T₁/₂=10 s. Its decay constant is approximately:",["0.0693 s⁻¹","0.693 s⁻¹","10 s⁻¹","6.93 s⁻¹"],0,"λ=ln2/T₁/₂=0.693/10≈0.0693 s⁻¹."] ,["A sample is reduced to 1/32 of its original amount. How many half-lives have elapsed?",["5","4","6","10"],0,"(1/2)^5=1/32, so five half-lives have elapsed."] ,["If a sample has a half-life of 3 hours, the time for it to reduce to 1/16 is:",["12 hours","6 hours","9 hours","15 hours"],0,"1/16=(1/2)^4, so four half-lives are required: 4×3=12 hours."] ,["The mean life τ and half-life T₁/₂ are related by:",["T₁/₂=τ ln2","T₁/₂=τ/ln2","τ=T₁/₂ ln2","They are always equal"],0,"Because τ=1/λ and T₁/₂=ln2/λ, T₁/₂=τ ln2."] ,["For radioactive decay, the half-life is generally:",["Characteristic of the radionuclide under specified decay conditions","Dependent only on the amount of sample","Changed every time one nucleus decays","Equal to the atomic number"],0,"Half-life is a characteristic nuclear property and does not depend on how much sample is present."] ,["A radioactive sample starts with 64 g of a radioactive isotope. If its half-life is 2 years, how much remains after 6 years?",["8 g","16 g","32 g","4 g"],0,"Six years equals three half-lives, so 64×(1/2)^3=8 g remains."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
