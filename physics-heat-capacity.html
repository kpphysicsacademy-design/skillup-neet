<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🌡️ Heat Capacity</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[{"q":"What is the heat capacity of a body?","o":["Heat needed to raise its temperature by 1 K","Heat released per second","Mass per unit volume","Temperature at melting point"],"a":0,"e":"Heat capacity is the heat required to raise the body's temperature by one kelvin."},{"q":"Which symbol commonly represents heat capacity?","o":["C","P","V","R"],"a":0,"e":"Heat capacity is commonly denoted by C."},{"q":"What is the SI unit of heat capacity?","o":["J/K","J kg/K","K/J","W/K only"],"a":0,"e":"Heat capacity is measured in joules per kelvin (J/K)."},{"q":"Heat capacity C is related to heat Q and temperature change ΔT by…","o":["C = Q/ΔT","C = QΔT","C = ΔT/Q²","C = Q + ΔT"],"a":0,"e":"For a suitable temperature interval, C = Q/ΔT."},{"q":"A body absorbs 600 J and its temperature rises by 3 K. Its average heat capacity is…","o":["100 J/K","200 J/K","300 J/K","1,800 J/K"],"a":1,"e":"C = Q/ΔT = 600/3 = 200 J/K."},{"q":"Which factor does the heat capacity of a sample depend on?","o":["Amount and material of the sample","Temperature scale only","Shape only in all cases","Gravity only"],"a":0,"e":"For a given material, total heat capacity depends on the amount of substance and its specific heat."},{"q":"Specific heat capacity differs from heat capacity because specific heat is…","o":["Per unit mass","Per whole body","Always dimensionless","Measured in joules only"],"a":0,"e":"Specific heat capacity is heat capacity per unit mass."},{"q":"The relation between heat capacity C, mass m and specific heat c is…","o":["C = mc","C = m/c","C = c/m","C = m + c"],"a":0,"e":"For a uniform sample, C = mc."},{"q":"What is the SI unit of specific heat capacity?","o":["J kg⁻¹ K⁻¹","J/K","kg/J","W m⁻¹"],"a":0,"e":"Specific heat capacity is measured in joules per kilogram per kelvin."},{"q":"A 2 kg sample has specific heat 500 J kg⁻¹ K⁻¹. Its heat capacity is…","o":["250 J/K","500 J/K","1,000 J/K","2,500 J/K"],"a":2,"e":"C = mc = 2 × 500 = 1,000 J/K."},{"q":"For the same material, if mass doubles, heat capacity…","o":["Halves","Doubles","Stays constant","Becomes zero"],"a":1,"e":"Since C = mc, doubling mass doubles heat capacity."},{"q":"For a given body over a small temperature range, if heat capacity is constant, heat supplied is…","o":["Q = CΔT","Q = C/ΔT","Q = ΔT/C","Q = C + ΔT"],"a":0,"e":"Rearranging C = Q/ΔT gives Q = CΔT."},{"q":"A body with C = 150 J/K is warmed by 4 K. Heat supplied is…","o":["37.5 J","154 J","600 J","750 J"],"a":2,"e":"Q = CΔT = 150 × 4 = 600 J."},{"q":"If 900 J of heat raises a body's temperature by 5 K, its heat capacity is…","o":["45 J/K","180 J/K","450 J/K","4,500 J/K"],"a":1,"e":"C = 900/5 = 180 J/K."},{"q":"Heat capacity is a…","o":["State function of temperature only for every system","Property of a body or sample","Form of energy transfer itself","Unitless constant for all materials"],"a":1,"e":"Heat capacity characterizes how much heat a particular sample needs per degree of temperature change."},{"q":"Is heat capacity the same for all objects made of the same material?","o":["Yes, regardless of mass","No, it also depends on the amount of material","Only at zero kelvin","Only for gases"],"a":1,"e":"Specific heat is a material property, while total heat capacity scales with sample mass."},{"q":"Which has the greater heat capacity if made of the same material at the same conditions?","o":["A 4 kg sample","A 1 kg sample","They are equal","Cannot compare without shape"],"a":0,"e":"For the same specific heat, the larger mass has greater heat capacity."},{"q":"What does a high heat capacity mean?","o":["A small heat input causes a large temperature rise","More heat is needed for a given temperature rise","Temperature cannot ever change","The object has no internal energy"],"a":1,"e":"High heat capacity means more energy is required per kelvin of temperature increase."},{"q":"If a body cools by 2 K and has constant heat capacity 80 J/K, its change in internal thermal energy is approximately…","o":["+160 J","−160 J","+40 J","0 J"],"a":1,"e":"For cooling, ΔT is negative, so Q ≈ CΔT = 80 × (−2) = −160 J."},{"q":"When using Celsius temperature differences, ΔT is numerically equal to the difference in…","o":["Kelvin","Joules","Pascal","Kilograms"],"a":0,"e":"A temperature interval of 1 °C equals an interval of 1 K."},{"q":"Which is true about heat capacity and temperature change for fixed heat input?","o":["Higher heat capacity gives smaller temperature change","Higher heat capacity gives larger temperature change","They are always equal","Heat capacity is inversely proportional to mass and heat"],"a":0,"e":"From ΔT = Q/C, a larger C produces a smaller temperature rise for the same Q."},{"q":"A sample needs 2,400 J to rise by 6 K. Its heat capacity is…","o":["40 J/K","400 J/K","1,440 J/K","14,400 J/K"],"a":1,"e":"C = 2,400/6 = 400 J/K."},{"q":"For a given sample, heat capacity may vary with…","o":["Temperature","The unit used for mass only","Its name","The direction of gravity only"],"a":0,"e":"Heat capacity can depend on temperature, especially over a broad temperature range."},{"q":"Which quantity is not the SI unit of heat capacity?","o":["J/K","J °C⁻¹ for temperature intervals","J kg⁻¹ K⁻¹","Both A and B are units of total heat capacity"],"a":2,"e":"J kg⁻¹ K⁻¹ is the unit of specific heat capacity, not total heat capacity."},{"q":"If a body absorbs heat but its temperature does not change during a phase change, Q/ΔT cannot be used directly to find its ordinary heat capacity because…","o":["ΔT is zero","Q must be zero","Mass becomes zero","Pressure must be zero"],"a":0,"e":"During a phase change, heat can change the phase while temperature remains constant, making Q/ΔT unsuitable."},{"q":"For the same heat input, a metal block's temperature rises more than a water sample of equal mass. This suggests the metal has…","o":["Higher specific heat","Lower specific heat","Infinite heat capacity","The same specific heat necessarily"],"a":1,"e":"For equal mass and heat input, a larger temperature rise indicates lower specific heat."},{"q":"Which statement about heat capacity is correct?","o":["It is measured in J/K","It is always measured in J kg⁻¹ K⁻¹","It is the same as temperature","It is a type of pressure"],"a":0,"e":"J/K is the unit of total heat capacity."},{"q":"A body's heat capacity is 250 J/K. To raise its temperature by 10 K, required heat is…","o":["25 J","250 J","2,500 J","25,000 J"],"a":2,"e":"Q = CΔT = 250 × 10 = 2,500 J."},{"q":"Two bodies have equal heat capacity and receive equal heat with no phase change or losses. Their temperature changes are…","o":["Equal","Always opposite","Proportional to mass squared","Both zero"],"a":0,"e":"With ΔT = Q/C, equal heat and equal heat capacity give equal temperature changes."},{"q":"Why is heat capacity useful in thermodynamics?","o":["It relates heat transfer to temperature change","It gives pressure without any other data","It measures work per second","It determines volume in all processes"],"a":0,"e":"Heat capacity helps quantify the heat needed for a specified temperature change."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Heat Capacity Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
