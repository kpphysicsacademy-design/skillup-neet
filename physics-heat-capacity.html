<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Heat Capacity</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}</style></head><body><div class="wrap"><div class="card"><h1>🔥 Heat Capacity</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['Heat capacity of a body is defined as the heat required to raise its temperature by','1 K','10 K','100 K','1°C only',0,'Heat capacity C is the heat required for a unit rise in temperature: C=Q/ΔT.'],
['The SI unit of heat capacity is','J K⁻¹','J kg⁻¹ K⁻¹','W K⁻¹','cal g⁻¹',0,'Heat capacity is measured in joules per kelvin (J K⁻¹).'],
['The heat capacity C of a body is given by','QΔT','Q/ΔT','ΔT/Q','Q+ΔT',1,'By definition, C=Q/ΔT for the specified temperature change.'],
['Specific heat capacity is heat required to raise the temperature of','the whole body by 1 K','unit mass by 1 K','one mole by 1 K','unit volume by 1 K',1,'Specific heat capacity is heat capacity per unit mass: c=Q/(mΔT).'],
['The SI unit of specific heat capacity is','J K⁻¹','J kg⁻¹ K⁻¹','J mol⁻¹','kg J⁻¹',1,'Specific heat capacity is expressed as J kg⁻¹ K⁻¹.'],
['For a body of mass m and specific heat c, its heat capacity is','mc','m/c','c/m','m+c',0,'Since C=mc, heat capacity equals mass multiplied by specific heat capacity.'],
['If 500 J heat raises a body by 5 K, its heat capacity is','25 J K⁻¹','100 J K⁻¹','2500 J K⁻¹','0.01 J K⁻¹',1,'C=Q/ΔT=500/5=100 J K⁻¹.'],
['Two bodies have equal masses and equal specific heats. Their heat capacities are','equal','always different','zero','infinite',0,'For equal m and c, C=mc gives equal heat capacities.'],
['Molar heat capacity is heat required to raise the temperature of','unit mass by 1 K','one mole by 1 K','one gram by 1 K','one litre by 1 K',1,'Molar heat capacity is heat capacity per mole.'],
['For n moles of a substance with molar heat capacity Cₘ, heat capacity is','Cₘ/n','n/Cₘ','nCₘ','Cₘ+n',2,'Total heat capacity is n times the molar heat capacity.'],
['For a given body, if its mass is doubled while specific heat remains unchanged, heat capacity','halves','doubles','remains unchanged','becomes zero',1,'C=mc, so doubling m doubles C.'],
['For the same heat supplied, a body with larger heat capacity undergoes a','larger temperature rise','smaller temperature rise','negative temperature rise always','fixed 100 K rise',1,'From ΔT=Q/C, a larger C gives a smaller temperature change for the same Q.'],
['For an isolated two-body system exchanging heat, the body with higher heat capacity for a given heat transfer has','the larger temperature change','the smaller temperature change','no temperature change necessarily','infinite temperature',1,'For the same magnitude of heat transfer, ΔT=Q/C, so larger C means smaller ΔT.'],
['The dimensions of heat capacity are','ML²T⁻²Θ⁻¹','ML²T⁻³Θ⁻¹','MLT⁻²Θ⁻¹','M⁰L⁰T⁰Θ',0,'Heat capacity has dimensions of energy divided by temperature: ML²T⁻²Θ⁻¹.'],
['A 2 kg body has specific heat 400 J kg⁻¹ K⁻¹. Its heat capacity is','200 J K⁻¹','400 J K⁻¹','800 J K⁻¹','1200 J K⁻¹',2,'C=mc=2×400=800 J K⁻¹.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
