.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}

<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🌡️ Heat Engine</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[{"q":"What does a heat engine do?","o":["Converts heat into useful work in a cycle","Converts all heat into work with no rejection","Creates energy from nothing","Moves heat only from cold to hot without work"],"a":0,"e":"A heat engine absorbs heat from a hot source, produces work, and rejects some heat to a colder sink."},{"q":"A heat engine absorbs heat Qₕ and rejects heat Q꜀. Its net work output is…","o":["Qₕ + Q꜀","Qₕ − Q꜀","Q꜀ − Qₕ","Qₕ/Q꜀"],"a":1,"e":"Energy conservation over a cycle gives W = Qₕ − Q꜀."},{"q":"Thermal efficiency of a heat engine is defined as…","o":["Heat rejected divided by heat input","Work output divided by heat input","Heat input divided by work output","Work output divided by heat rejected"],"a":1,"e":"Efficiency η = Wout/Qₕ."},{"q":"Which expression gives the efficiency of a cyclic heat engine?","o":["η = Q꜀/Qₕ","η = 1 − Q꜀/Qₕ","η = Qₕ/Q꜀","η = Qₕ + Q꜀"],"a":1,"e":"Using W = Qₕ − Q꜀, η = W/Qₕ = 1 − Q꜀/Qₕ."},{"q":"Why must a conventional cyclic heat engine reject some heat?","o":["The second law forbids complete conversion of heat from a single reservoir into work","Energy is not conserved","The hot source must be colder","Work has no energy"],"a":0,"e":"The Kelvin–Planck statement of the second law rules out 100% efficiency for such a cyclic engine."},{"q":"A heat engine takes in 1,000 J and rejects 600 J each cycle. Work output is…","o":["400 J","600 J","1,000 J","1,600 J"],"a":0,"e":"W = Qₕ − Q꜀ = 1,000 − 600 = 400 J."},{"q":"For the engine in the previous example, efficiency is…","o":["20%","40%","60%","80%"],"a":1,"e":"η = W/Qₕ = 400/1,000 = 0.40 = 40%."},{"q":"A heat engine produces 300 J of work from 1,200 J heat input. Its efficiency is…","o":["15%","25%","40%","75%"],"a":1,"e":"η = 300/1,200 = 0.25 = 25%."},{"q":"Which component supplies heat to a heat engine?","o":["Cold sink","Hot reservoir or source","Condenser only in every engine","Insulation"],"a":1,"e":"The hot reservoir supplies the heat input Qₕ."},{"q":"Which component receives rejected heat from a heat engine?","o":["Hot source","Cold sink","Piston only","Work output shaft"],"a":1,"e":"The cold reservoir or sink receives rejected heat Q꜀."},{"q":"A heat engine operates between hot temperature Tₕ and cold temperature T꜀. The Carnot efficiency is…","o":["1 − T꜀/Tₕ","1 − Tₕ/T꜀","T꜀/Tₕ","Tₕ + T꜀"],"a":0,"e":"For absolute temperatures, ηCarnot = 1 − T꜀/Tₕ."},{"q":"In the Carnot efficiency formula, temperatures must be measured in…","o":["Celsius","Kelvin","Fahrenheit only","Any scale with same numbers"],"a":1,"e":"The formula uses absolute thermodynamic temperatures in kelvin."},{"q":"A Carnot engine works between 500 K and 300 K. Its maximum efficiency is…","o":["20%","40%","60%","80%"],"a":1,"e":"η = 1 − 300/500 = 0.40 = 40%."},{"q":"If the cold-sink temperature decreases while the hot-source temperature stays fixed, Carnot efficiency…","o":["Decreases","Increases","Stays the same","Becomes zero"],"a":1,"e":"Lower T꜀ makes 1 − T꜀/Tₕ larger."},{"q":"If the hot-source temperature increases while the cold-sink temperature stays fixed, Carnot efficiency…","o":["Increases","Decreases","Must be zero","Stays the same"],"a":0,"e":"Increasing Tₕ reduces the ratio T꜀/Tₕ and increases ideal efficiency."},{"q":"Can a real engine exceed the Carnot efficiency between the same two reservoirs?","o":["Yes, by using friction","No","Only if it rejects no heat","Only at constant volume"],"a":1,"e":"Carnot efficiency is the maximum possible between two given reservoir temperatures."},{"q":"Which is a typical heat engine?","o":["Steam turbine","Household refrigerator","Electric heater only","Thermos flask"],"a":0,"e":"A steam turbine converts part of supplied thermal energy into mechanical work."},{"q":"Over a complete engine cycle, the working substance returns to its initial state. Its net internal-energy change is…","o":["Positive","Negative","Zero","Equal to heat input"],"a":2,"e":"Internal energy is a state function; after a complete cycle, ΔU = 0."},{"q":"For a cyclic heat engine, the first law gives…","o":["Wout = Qₕ − Q꜀","Wout = Qₕ + Q꜀","Wout = Q꜀ − Qₕ","Wout = 0 always"],"a":0,"e":"The net work equals heat absorbed minus heat rejected."},{"q":"An engine absorbs 2,000 J and has 30% efficiency. Its work output is…","o":["300 J","600 J","1,400 J","1,700 J"],"a":1,"e":"W = ηQₕ = 0.30 × 2,000 = 600 J."},{"q":"For the previous engine, heat rejected is…","o":["600 J","1,000 J","1,400 J","2,000 J"],"a":2,"e":"Q꜀ = Qₕ − W = 2,000 − 600 = 1,400 J."},{"q":"Which statement about heat-engine efficiency is correct?","o":["It is always greater than 100%","It is the fraction of input heat converted to net work","It equals heat rejected divided by work","It has units of joules"],"a":1,"e":"Efficiency is useful work output divided by heat input and is dimensionless."},{"q":"If Q꜀ = 0 for a cyclic heat engine, its efficiency would be…","o":["Zero","100%","50% always","Undefined"],"a":1,"e":"The formula η = 1 − Q꜀/Qₕ would give 100%, which is forbidden for a conventional cyclic engine by the second law."},{"q":"Why is the Carnot engine important?","o":["It is a reversible ideal model that sets the maximum efficiency limit","It creates energy without fuel","It is always the most practical engine","It has no heat rejection at all"],"a":0,"e":"The Carnot cycle provides the upper efficiency limit between two reservoirs."},{"q":"Which change would generally improve a heat engine's ideal maximum efficiency?","o":["Make T꜀ closer to Tₕ","Increase T꜀","Increase Tₕ while keeping T꜀ fixed","Set both temperatures equal"],"a":2,"e":"A larger temperature difference with higher Tₕ at fixed T꜀ increases Carnot efficiency."},{"q":"A heat engine's efficiency is 0.2. This means…","o":["20% of heat input becomes net work","20% of heat input is always rejected","The engine produces 2 J for every 1 J input","It rejects no heat"],"a":0,"e":"η = 0.2 means work output is 20% of the heat input."},{"q":"Which law rules out a cyclic engine that absorbs heat from one reservoir and converts it all to work?","o":["First law only","Kelvin–Planck statement of the second law","Boyle's law","Newton's law"],"a":1,"e":"The Kelvin–Planck statement prohibits complete conversion from a single reservoir in a cycle."},{"q":"If Qₕ = 800 J and Q꜀ = 500 J, the engine's efficiency is…","o":["27.5%","37.5%","62.5%","80%"],"a":1,"e":"W = 300 J, so η = 300/800 = 37.5%."},{"q":"A heat engine produces 500 J work while absorbing 2,000 J. Heat rejected is…","o":["500 J","1,000 J","1,500 J","2,500 J"],"a":2,"e":"Q꜀ = Qₕ − W = 2,000 − 500 = 1,500 J."},{"q":"What is the best description of a heat engine's energy flow?","o":["Absorb heat, deliver work, reject remaining heat","Absorb work and create heat without a source","Move heat from cold to hot without work","Convert all internal energy into work each cycle"],"a":0,"e":"A cyclic engine takes heat from a hot reservoir, delivers net work, and rejects heat to a colder reservoir."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Heat Engine Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
