ock;width:max-content;margin:18px auto 0;padding:10px 15px;border:2px solid #d9e5f2;border-radius:12px;background:#fff;color:#1264d6;text-decoration:none;font-weight:900}.result{text-align:center}.score{font-size:34px;font-weight:950;color:#123b70}@media(max-width:520px){.wrap{padding:15px 10px 50px}.q{font-size:18px}button.opt{font-size:14px;padding:13px}}</style></head><body><main class="wrap"><div class="top"><div class="brand">⚛️ SkillUp Physics<br><small>NEET 2026 • 15 MCQ QUIZ</small></div><div class="xp" id="xp">XP: 0</div></div><section class="hero"><div>🔥 THERMAL PROPERTIES</div><h1>Heat Transfer</h1><p>15-question MCQ quiz. Test conduction, convection, radiation and thermal balance.</p></section><section class="card"><strong>🏆 Quiz Progress <span id="mastery">0 / 15</span></strong><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card" id="quiz"><div class="qno" id="qno"></div><div class="q" id="question"></div><div id="opts"></div><div class="actions"><button class="continue" id="continue" type="button" disabled>Check Answer →</button></div><div class="feedback" id="feedback"></div></section><section class="card result" id="result" hidden></section><a class="back" href="physics-home-fast.html">← 📚 Back to Physics Path</a></main><script>const questions=[
{q:'Heat transfer is the process of transfer of thermal energy from a body at',o:['lower temperature to higher temperature','higher temperature to lower temperature','zero temperature to any temperature','equal temperature to higher temperature'],a:1,e:'In spontaneous heat transfer, thermal energy flows from higher temperature toward lower temperature.'},
{q:'Which mode of heat transfer can occur through vacuum?',o:['conduction only','convection only','radiation','conduction and convection only'],a:2,e:'Radiation uses electromagnetic waves and does not require a material medium.'},
{q:'Heat transfer through direct molecular interaction in a stationary medium is called',o:['conduction','convection','radiation','evaporation'],a:0,e:'Conduction transfers energy through microscopic interactions without bulk motion of the material.'},

];let i=0,selected=null,checked=false,score=0;const $=id=>document.getElementById(id);function render(){selected=null;checked=false;$('feedback').textContent='';$('continue').disabled=true;$('continue').textContent=i===14?'Finish Quiz →':'Check Answer →';$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=questions[i].q;$('opts').innerHTML='';questions[i].o.forEach((text,n)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+n)+'. '+text;b.dataset.index=n;b.onclick=()=>{if(checked)return;selected=n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('continue').disabled=false};$('opts').appendChild(b)});$('mastery').textContent=`${i} / 15`;$('fill').style.width=`${i/15*100}%`;$('xp').textContent=`XP: ${score*10}`}function next(){if(selected===null)return;if(!checked){checked=true;const item=questions[i],ok=selected===item.a;if(ok)score++;document.querySelectorAll('.opt').forEach(b=>{const n=+b.dataset.index;b.disabled=true;if(n===item.a)b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+`<div class="explain">${item.e}</div>`;$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=`${(i+1)/15*100}%`;$('xp').textContent=`XP: ${score*10}`}else if(i<14){i++;render()}else finish()}function finish(){$('quiz').hidden=true;$('result').hidden=false;const pct=Math.round(score/15*100);$('result').innerHTML=`<h2>🎉 Heat Transfer Complete!</h2><div class="score">${score} / 15</div><p><strong>${pct}%</strong> accuracy</p><p>🏆 You earned <strong>${score*10} XP</strong>.</p><p>${score>=12?'🔥 Excellent NEET readiness!':score>=9?'💪 Good work. Revise and retry for mastery.':'📚 Revise heat transfer and try again.'}</p><button class="continue" type="button" onclick="location.reload()">Retry 15 MCQs</button>`}$('continue').onclick=next;render();</script></body></html>
