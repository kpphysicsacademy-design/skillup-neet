<style>
:root{--green:#58cc02;--green-dark:#46a302;--blue:#1cb0f6;--ink:#243447;--muted:#64748b;--line:#dce6ef;--bg:#f3f9ff;--red:#ff4b4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.nav{max-width:720px;margin:auto;min-height:58px;padding:9px 14px;display:flex;align-items:center;gap:10px}

main{max-width:720px;margin:auto;padding:18px 13px 48px}
.hero,.quiz,.finish{background:#fff;border:2px solid #e2edf7;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 #dce8f3}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#174a78}.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}
.progress-row{display:flex;justify-content:space-between;gap:10px;margin:16px 0 7px;font-size:12px;font-weight:900;color:var(--muted)}
.track{height:11px;border-radius:99px;background:#e2edf7;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}
.qmeta{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.4px}
.question{font-size:clamp(20px,4.5vw,26px);line-height:1.35;margin:12px 0 18px;font-weight:850}
.options{display:grid;gap:10px}.option{display:flex;gap:11px;align-items:center;width:100%;min-height:51px;padding:12px;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}
.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.nav{display:flex;align-items:center;gap:10px;min-height:72px;padding:10px 14px}

}

}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🛠️ Heat Transfer</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [{q:"Heat transfer is the movement of thermal energy due to a difference in:",o:["Mass","Temperature","Volume only","Density only"],a:1,e:"Thermal energy flows because of a temperature difference."},{q:"The three main modes of heat transfer are:",o:["Conduction, convection and radiation","Evaporation, melting and freezing","Reflection, refraction and dispersion","Work, power and momentum"],a:0,e:"Heat is transferred by conduction, convection or radiation."},{q:"Which mode transfers heat through direct microscopic interactions without bulk motion of matter?",o:["Convection","Radiation","Conduction","Evaporation"],a:2,e:"Conduction transfers energy through particle interactions and, in metals, mobile electrons."},{q:"Convection occurs mainly in:",o:["Fluids such as liquids and gases","Vacuum only","Rigid solids only","Perfectly empty space"],a:0,e:"Convection transfers heat through the bulk movement of a fluid."},{q:"Which mode of heat transfer can occur through a vacuum?",o:["Conduction only","Convection only","Conduction and convection","Radiation"],a:3,e:"Electromagnetic radiation does not need a material medium."},{q:"A metal spoon becomes hot when left in hot tea mainly by:",o:["Conduction","Convection through the spoon","Radiation only","Condensation"],a:0,e:"Heat travels along the solid spoon by conduction."},{q:"Water circulating as it heats in a pot is an example of:",o:["Radiation only","Convection","Conduction only","Reflection"],a:1,e:"Warm, less-dense water rises and cooler water sinks, creating convection currents."},{q:"Feeling warmth from a fire without touching it is mainly due to:",o:["Conduction through the air alone","Convection only","Thermal radiation","Evaporation"],a:2,e:"Radiant energy travels from the fire to your body."},{q:"Which material is generally a good conductor of heat?",o:["Copper","Wood","Foam","Still air"],a:0,e:"Copper conducts heat effectively due to its mobile electrons."},{q:"Why are woollen clothes useful in cold weather?",o:["Wool generates heat continuously","They trap air, which is a poor conductor","They increase convection through the body","They reflect all heat perfectly"],a:1,e:"Trapped air reduces heat loss by conduction and limits air movement."},{q:"A vacuum flask reduces heat transfer by radiation using:",o:["A blackened outer surface only","A thick copper wall","A silvered or reflective surface","A fan inside the flask"],a:2,e:"Reflective surfaces reduce radiative heat exchange."},{q:"A vacuum between the walls of a thermos flask reduces:",o:["Radiation only","Conduction and convection","The liquid's mass","The liquid's specific heat"],a:1,e:"With very few particles present, conduction and convection across the gap are greatly reduced."},{q:"Sea breeze during daytime occurs because:",o:["Land heats faster than sea, so air rises over land","Sea heats faster and air sinks over land","Land and sea always have equal temperatures","Radiation stops over the sea"],a:0,e:"Warm air over land rises and cooler air from the sea moves in to replace it."},{q:"Land breeze usually develops at night because:",o:["Land cools faster than the sea","The sea cools much faster than land","The Sun heats land more at night","Air cannot move over water"],a:0,e:"At night, warmer air over the relatively warmer sea rises, drawing cooler air from land."},{q:"A hot-air balloon rises because heated air inside it becomes:",o:["More dense than surrounding air","Less dense than surrounding air","Heavier without changing volume","Unable to exert pressure"],a:1,e:"Heating expands air and lowers its density, so buoyancy can lift the balloon."},{q:"Which mode of heat transfer is most important in the Sun warming Earth?",o:["Conduction","Convection through space","Radiation","Sound transmission"],a:2,e:"Solar energy crosses space as electromagnetic radiation."},{q:"Heat transfer through a stationary metal rod is predominantly:",o:["Conduction","Convection","Radiation alone","Bulk flow"],a:0,e:"Energy moves along the solid through particle interactions and electrons."},{q:"In natural convection, fluid motion is driven mainly by:",o:["An external pump","Density differences caused by temperature differences","A magnetic field in every case","A vacuum"],a:1,e:"Temperature differences change fluid density and create buoyancy-driven flow."},{q:"Forced convection uses:",o:["A fan or pump to move fluid","Only natural buoyancy","No fluid movement","Only electromagnetic waves"],a:0,e:"Fans and pumps drive fluid flow to increase convective heat transfer."},{q:"Which is an example of forced convection?",o:["Warm air naturally rising from a heater","A fan blowing air across a hot radiator","Heat crossing empty space","A spoon heating in soup"],a:1,e:"A fan forces air movement over the hot surface."},{q:"Why does a shiny surface usually lose less heat by radiation than a dull black surface?",o:["It has no temperature","It reflects more thermal radiation and emits less","It blocks conduction inside itself","It is always colder"],a:1,e:"Polished shiny surfaces generally have lower emissivity than dull black ones."},{q:"A building's roof insulation is intended mainly to:",o:["Increase heat flow through the roof","Reduce heat transfer between inside and outside","Create thermal energy","Stop all radiation from the Sun everywhere"],a:1,e:"Insulation slows heat flow, helping keep indoor temperatures more stable."},{q:"During boiling, heat reaches water in different parts of the pot largely through:",o:["Convection currents in the liquid","Only radiation through the metal","Sound waves","No energy transfer"],a:0,e:"Circulating liquid carries thermal energy through convection."},{q:"Which statement about heat and temperature is correct?",o:["They are exactly the same quantity","Heat is energy transferred because of a temperature difference","Temperature is measured in joules","Heat is a material substance stored in an object"],a:1,e:"Heat refers to energy in transit due to a temperature difference; temperature describes thermal state."},{q:"In steady conduction through a slab, increasing its thickness while other factors stay fixed will:",o:["Increase heat current","Reduce heat current","Leave heat current always unchanged","Make thermal conductivity infinite"],a:1,e:"A thicker slab offers greater thermal resistance."},{q:"Which combination best reduces heat loss from a hot drink in a cup?",o:["Thin metal walls and no lid","A good insulating cup and a lid","A black, wide-open cup in moving air","Stirring continuously with a metal rod"],a:1,e:"Insulation limits conduction and a lid reduces convection and evaporation."},{q:"A greenhouse becomes warm in sunlight because incoming shortwave sunlight enters and surfaces inside:",o:["Absorb energy and warm up","Cannot absorb radiation","Turn all heat into sound","Stop all convection instantly"],a:0,e:"Sunlight warms interior surfaces, which then transfer energy to the air and emit infrared radiation."},{q:"Why does a metal bench feel colder than a wooden bench on a cool day?",o:["Metal must be below freezing","Metal conducts heat away from the body faster","Wood has no temperature","Metal does not contain energy"],a:1,e:"Metal's higher thermal conductivity removes heat from your skin more quickly."},{q:"A cooler often uses evaporation to cool air because evaporation:",o:["Releases latent heat into the air","Absorbs energy from the surroundings","Stops all conduction","Raises the liquid's boiling point to infinity"],a:1,e:"Evaporation requires latent heat, which is taken from the water and surrounding air."},{q:"Which mode is responsible for energy transfer from a hot electric coil to a nearby object across a gap?",o:["Only conduction through the gap","Only convection in a vacuum","Thermal radiation, with convection possible if air is present","No transfer is possible"],a:2,e:"The coil emits radiation; if air is present, convection can also contribute."},{q:"Why does a ceiling fan help people feel cooler in warm weather?",o:["It lowers room temperature in every case","It increases air movement, aiding convection and evaporation from skin","It stops evaporation","It makes body heat capacity zero"],a:1,e:"Moving air improves heat loss from skin through convection and evaporation, even if room air temperature changes little."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Heat Transfer Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
