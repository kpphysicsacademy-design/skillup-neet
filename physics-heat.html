<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Heat — 15 MCQ Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#203040;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:22px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:#123b70}.xp{font-weight:950;color:#1677ff}.hero{margin-top:14px;background:linear-gradient(135deg,#123b70,#1677ff);color:#fff;border-radius:24px;padding:22px}.hero h1{margin:5px 0 7px;font-size:clamp(28px,6vw,40px)}.hero p{margin:0;line-height:1.5;font-size:13px}.card{background:#fff;border:1px solid #d9e5f2;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 7px 20px rgba(18,59,112,.07)}.master{font-weight:900}.bar{height:10px;background:#e5edf6;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;width:0;background:#1677ff;transition:.3s}.qno{font-size:12px;color:#6b7280;font-weight:900}.q{font-size:20px;font-weight:900;line-height:1.4;margin:9px 0 16px}button.opt{display:block;width:100%;text-align:left;background:#fff;color:#203040;border:2px solid #dfe8f1;border-radius:14px;padding:14px;margin:10px 0;font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}button.opt.selected{border-color:#1677ff;background:#eef6ff;color:#123b70}button.opt.correct{border-color:#16803a;background:#eaf8ef;color:#145c2e}button.opt.wrong{border-color:#d64545;background:#fff0f0;color:#8f2020}button.continue{border:0;border-radius:13px;padding:12px 20px;background:#1677ff;color:#fff;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #0d5bbf}button.continue:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}.actions{display:flex;justify-content:flex-end;margin-top:15px}.feedback{min-height:25px;margin-top:13px;font-weight:800}.explain{margin-top:6px;color:#596774;font-weight:600}.back{display:block;width:max-content;margin:18px auto 0;padding:10px 15px;border:2px solid #d9e5f2;border-radius:12px;background:#fff;color:#1264d6;text-decoration:none;font-weight:900}.result{text-align:center}.score{font-size:34px;font-weight:950;color:#123b70}@media(max-width:520px){.wrap{padding:15px 10px 50px}.q{font-size:18px}button.opt{font-size:14px;padding:13px}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div class="brand">🔥 SkillUp Physics<br><small>NEET 2026 • 15 MCQ QUIZ</small></div><div class="xp" id="xp">XP: 0</div></div>
<section class="hero"><div>🔥 NEET PRACTICE</div><h1>Heat</h1><p>15-question MCQ quiz. Select one answer, check instantly, and build mastery.</p></section>
<section class="card"><div class="master">🏆 Quiz Progress <span id="mastery">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section>
<section class="card" id="quiz"><div class="qno" id="qno"></div><div class="q" id="question"></div><div id="opts"></div><div class="actions"><button class="continue" id="continue" type="button" disabled>Check Answer →</button></div><div class="feedback" id="feedback"></div></section>
<section class="card result" id="result" hidden></section>
<a class="back" href="physics-home-fast.html">← 📚 Back to Physics Path</a>
</main>
<script>
const questions=[
{q:'Heat is best described as',o:['energy transferred because of a temperature difference','the temperature of a body','the mass of a body','the total volume of a body'],a:0,e:'Heat is energy transferred from a higher-temperature body to a lower-temperature body because of a temperature difference.'},
{q:'The SI unit of heat is',o:['calorie','joule','kelvin','watt'],a:1,e:'Heat is a form of energy, so its SI unit is the joule (J).'},
{q:'Heat flows spontaneously from',o:['lower temperature to higher temperature','higher temperature to lower temperature','higher mass to lower mass','higher volume to lower volume'],a:1,e:'In the absence of external work, thermal energy transfers spontaneously from hot to cold.'},
{q:'The amount of heat required to raise the temperature of a body depends on its',o:['mass, specific heat capacity and temperature change','mass only','volume only','density only'],a:0,e:'For sensible heating, Q = mcΔT.'},
{q:'The equation Q = mcΔT represents',o:['latent heat','sensible heat transfer','electrical power','pressure work'],a:1,e:'Q = mcΔT gives heat required for a temperature change when there is no phase change.'},
{q:'Specific heat capacity is the heat required to raise the temperature of',o:['1 kg of a substance by 1 K','1 mole by 10 K','any mass by 1 K','1 kg by 100 K'],a:0,e:'Specific heat capacity is heat required to raise the temperature of unit mass by one kelvin.'},
{q:'The SI unit of specific heat capacity is',o:['J kg⁻¹ K⁻¹','J kg K','W kg⁻¹','N m⁻¹'],a:0,e:'Specific heat capacity has SI unit J kg⁻¹ K⁻¹.'},
{q:'When ice melts at its melting point, the supplied heat mainly changes',o:['temperature only','phase without changing temperature','mass into energy','pressure only'],a:1,e:'During melting at the melting point, heat is used as latent heat of fusion while temperature remains constant.'},
{q:'The heat required to change unit mass of a solid into liquid at its melting point is called',o:['specific heat capacity','specific latent heat of fusion','specific latent heat of vaporization','thermal conductivity'],a:1,e:'Specific latent heat of fusion is the heat needed to melt unit mass at constant temperature.'},
{q:'During boiling of a pure liquid at constant pressure, its temperature',o:['increases continuously','remains constant','falls to 0 °C','becomes negative'],a:1,e:'At the boiling point, supplied heat is used for the phase change, so temperature remains constant until boiling is complete.'},
{q:'The heat required for a phase change at constant temperature is called',o:['latent heat','sensible heat','mechanical work','power'],a:0,e:'Latent heat is energy absorbed or released during a phase change without a temperature change.'},
{q:'One calorie is approximately equal to',o:['0.42 J','4.2 J','42 J','420 J'],a:1,e:'The conventional conversion used in physics is 1 cal ≈ 4.2 J.'},
{q:'If 2 kg of water is heated through 5 K, with c = 4200 J kg⁻¹ K⁻¹, the heat supplied is',o:['4.2 kJ','21 kJ','42 kJ','84 kJ'],a:2,e:'Q = mcΔT = 2 × 4200 × 5 = 42000 J = 42 kJ.'},
{q:'A material with a high specific heat capacity requires',o:['less heat for a given temperature rise','more heat for a given temperature rise','no heat','only latent heat'],a:1,e:'For the same mass and temperature rise, Q = mcΔT, so a higher c requires more heat.'},
{q:'Which process transfers heat through electromagnetic waves and does not require a material medium?',o:['conduction','convection','radiation','diffusion'],a:2,e:'Radiation transfers thermal energy by electromagnetic waves and can occur through vacuum.'}
];
let i=0,selected=null,checked=false,score=0;const $=id=>document.getElementById(id);
function render(){selected=null;checked=false;$('feedback').textContent='';$('continue').disabled=true;$('continue').textContent=i===14?'Finish Quiz →':'Check Answer →';$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=questions[i].q;$('opts').innerHTML='';questions[i].o.forEach((text,n)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+n)+'. '+text;b.dataset.index=n;b.onclick=()=>{if(checked)return;selected=n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('continue').disabled=false};$('opts').appendChild(b)});$('mastery').textContent=`${i} / 15`;$('fill').style.width=`${i/15*100}%`;$('xp').textContent=`XP: ${score*10}`}
function next(){if(selected===null)return;if(!checked){checked=true;const item=questions[i],ok=selected===item.a;if(ok)score++;document.querySelectorAll('.opt').forEach(b=>{const n=+b.dataset.index;b.disabled=true;if(n===item.a)b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+`<div class="explain">${item.e}</div>`;$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=`${(i+1)/15*100}%`;$('xp').textContent=`XP: ${score*10}`}else if(i<14){i++;render()}else finish()}
function finish(){$('quiz').hidden=true;$('result').hidden=false;const pct=Math.round(score/15*100);$('result').innerHTML=`<h2>🎉 Heat Complete!</h2><div class="score">${score} / 15</div><p><strong>${pct}%</strong> accuracy</p><p>🏆 You earned <strong>${score*10} XP</strong>.</p><p>${score>=12?'🔥 Excellent NEET readiness!':score>=9?'💪 Good work. Revise and retry for mastery.':'📚 Revise Heat and try again.'}</p><button class="continue" type="button" onclick="location.reload()">Retry 15 MCQs</button>`}
$('continue').onclick=next;render();
</script>
</body></html>
