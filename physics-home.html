<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="0;url=physics-home-fast.html?v=4">
<title>SkillUp | Physics NEET 2026</title>

<style>
/* REMOVE CHAPTER NUMBERS V1 */
.chapter-bubble .badge{display:none!important}
.chapter-bubble{padding-top:18px}

/* DUOLINGO PHYSICS PATH EFFECTS */
.chapter-card{position:relative;overflow:hidden;transform:translateZ(0);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.chapter-card:before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:linear-gradient(180deg,#58b7ff,#1677ff);border-radius:20px 0 0 20px;opacity:.8}
.chapter-card:hover{transform:translateY(-4px) scale(1.005);box-shadow:0 14px 30px rgba(18,59,112,.14);border-color:#8ebced}
.chapter-card:active{transform:translateY(-1px) scale(.995)}
.concept-svg{transition:transform .2s ease;filter:drop-shadow(0 3px 4px rgba(18,59,112,.12))}
.chapter-card:hover .concept-svg{transform:rotate(-4deg) scale(1.08)}
.go{transition:transform .18s ease,box-shadow .18s ease}
.chapter-card:hover .go{transform:translateX(3px);box-shadow:0 5px 12px rgba(22,119,255,.28)}
.path:before{background:repeating-linear-gradient(to bottom,#dbe8f5 0 12px,transparent 12px 22px)}
.node{transition:transform .18s ease,background .18s ease,border-color .18s ease;box-shadow:0 0 0 0 rgba(22,119,255,0)}
.chapter:hover .node{transform:scale(1.18);border-color:#6eaff0;box-shadow:0 0 0 5px rgba(22,119,255,.08)}
.chapter.done .node{box-shadow:0 0 0 5px rgba(22,119,255,.08)}
.chapter-card .meta .tag{transition:transform .15s ease}.chapter-card:hover .meta .tag{transform:translateY(-1px)}
@keyframes skillup-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.hero-mascot{animation:skillup-bob 2.4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
/* FINAL ALL UNIT HEADINGS REMOVED */
.unit{display:none!important}
.unit h2{display:none!important}
</style>
</head>
<body>
<script>location.replace('physics-home-fast.html?v=4');</script>
<p>Opening SkillUp Physics…</p>

<script>
/* Duolingo-style micro-interactions: progress feedback + animated SVGs */
(function(){
  document.querySelectorAll('.chapter-card').forEach(function(card){
    card.addEventListener('click',function(){
      var svg=this.querySelector('.concept-svg');
      if(svg && svg.animate) svg.animate([{transform:'scale(1) rotate(0deg)'},{transform:'scale(1.16) rotate(-5deg)'},{transform:'scale(1) rotate(0deg)'}],{duration:320,easing:'ease-out'});
    });
  });
})();
</script>
</body>
</html>
