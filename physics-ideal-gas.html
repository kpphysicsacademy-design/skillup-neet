<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Ideal Gas</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7fb;color:#172033;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 14px 42px}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 28px #17203314}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:1.55rem;margin:0}.xp{font-weight:900;white-space:nowrap}.sub{color:#657080;margin:8px 0 0}.num{font-weight:800;color:#68717d;margin-top:18px}.bar{height:10px;background:#e8ebef;border-radius:99px;overflow:hidden;margin:10px 0 18px}.fill{height:100%;width:0;background:#58cc02;transition:.3s}.q{font-size:1.18rem;font-weight:850;line-height:1.5;margin:12px 0 14px}.opts{display:grid;gap:10px}.opt{padding:14px;border:2px solid #dfe3e8;border-radius:14px;background:#fff;text-align:left;font:inherit;cursor:pointer}.opt:hover{border-color:#58a6ff;background:#f6fbff}.opt:disabled{cursor:default}.correct{border-color:#58cc02!important;background:#efffe8!important}.wrong{border-color:#e5484d!important;background:#fff0f0!important}.feedback{margin-top:14px;padding:12px;border-radius:13px;line-height:1.5}.good{background:#e8f9df;color:#246b16}.bad{background:#fff0f0;color:#a12b30}.btn{width:100%;margin-top:15px;padding:13px;border:0;border-radius:13px;background:#58cc02;color:#fff;font-weight:900;font-size:1rem;cursor:pointer}.back{display:inline-block;margin-top:17px;padding:10px 14px;border:2px solid #dfe3e8;border-radius:13px;color:#344054;text-decoration:none;font-weight:800}.result{text-align:center;font-size:1.15rem;font-weight:850;line-height:1.8;padding:18px}@media(max-width:600px){.wrap{padding:16px 10px}.card{padding:18px}.top{align-items:flex-start}.top h1{font-size:1.3rem}.q{font-size:1.08rem}.opt{padding:13px}}</style></head><body><main class="wrap"><section class="card"><div class="top"><h1>💨 Ideal Gas</h1><div class="xp">⚡ <span id="xp">0</span> XP</div></div><p class="sub">Master the ideal-gas model with 15 NEET-style questions.</p><div class="num" id="num">Question 1 of 15</div><div class="bar"><div id="fill" class="fill"></div></div><div id="quiz"></div><div id="fb" class="feedback">Choose an answer.</div><button id="next" class="btn">Continue →</button><a class="back" href="physics-home.html">← Back to Physics Path</a></section></main><script>const qs=[['The equation of state for an ideal gas is:',['PV=nRT','P=V/nRT','PV=RT/n','P=nVRT'],0,'For n moles, PV=nRT.'],['For a fixed amount of ideal gas at constant temperature, Boyle’s law gives:',['PV=constant','P/V=constant','P+V=constant','PV^2=constant'],0,'At constant T and n, pressure is inversely proportional to volume.'],['At constant pressure, Charles’ law states that volume is proportional to:',['absolute temperature','pressure','density only','molar mass only'],0,'V/T is constant at fixed pressure and amount.'],['The SI unit of pressure is:',['pascal','joule','newton','watt'],0,'The SI unit of pressure is pascal (Pa).'],['One atmosphere is approximately:',['1.013×10^5 Pa','9.8×10^2 Pa','1.013×10^3 Pa','10^7 Pa'],0,'Standard atmospheric pressure is about 1.013×10^5 Pa.'],['For an ideal gas, internal energy depends only on:',['temperature','pressure alone','volume alone','container shape'],0,'For an ideal gas, internal energy is a function of temperature.'],['At constant volume, increasing the absolute temperature of an ideal gas causes pressure to:',['increase','decrease','remain zero','become independent of temperature'],0,'From P/T=constant at fixed V and n, pressure increases with T.'],['The universal gas constant R is approximately:',['8.314 J mol^-1 K^-1','9.8 J mol^-1 K^-1','6.022 J mol^-1 K^-1','3.0×10^8 J mol^-1 K^-1'],0,'R≈8.314 J mol^-1 K^-1.'],['Absolute zero is approximately:',['0 K','273 K','100 K','-100 K'],0,'The Kelvin scale begins at absolute zero, 0 K.'],['At constant temperature, if volume is doubled for a fixed ideal gas, pressure becomes:',['half','double','four times','unchanged'],0,'Boyle’s law gives P1V1=P2V2.'],['The number of molecules in n moles is:',['nN_A','N_A/n','n+N_A','n/N_A'],0,'Number of molecules N=nN_A.'],['Mean translational kinetic energy per molecule of an ideal gas is proportional to:',['absolute temperature','pressure only','volume only','molar mass only'],0,'Average translational kinetic energy is proportional to T.'],['Which gas law combines pressure, volume and temperature for a fixed amount of gas?',['Combined gas law','Faraday law','Ohm law','Hooke law'],0,'PV/T=constant for fixed amount of gas.'],['For an ideal gas, the compressibility factor Z is:',['1','0','R','infinite'],0,'An ideal gas has Z=PV/nRT=1.'],['Real gases most closely approach ideal behavior at:',['low pressure and high temperature','high pressure and low temperature','high pressure and high density','low temperature near liquefaction'],0,'Low pressure and high temperature reduce intermolecular effects.']];let i=0,score=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;const a=qs[i];$('num').textContent='Question '+(i+1)+' of 15';$('xp').textContent=score*10;$('fill').style.width=(i/15*100)+'%';$('fb').className='feedback';$('fb').textContent='Choose an answer.';$('quiz').innerHTML='<div class="q">'+a[0]+'</div><div class="opts">'+a[1].map((x,n)=>'<button class="opt" data-n="'+n+'">'+String.fromCharCode(65+n)+'. '+x+'</button>').join('')+'</div>';document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').textContent=i===14?'Finish Skill →':'Continue →';$('next').onclick=next}function answer(n){if(answered)return;answered=true;const a=qs[i],ok=n===a[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===a[2])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong')});$('fb').className='feedback '+(ok?'good':'bad');$('fb').innerHTML=ok?'🎯 Correct! +10 XP<br>'+a[3]:'❌ Incorrect.<br><b>Correct answer:</b> '+a[1][a[2]]+'<br>'+a[3];if(ok)score++;$('xp').textContent=score*10;$('fill').style.width=((i+1)/15*100)+'%'}function next(){if(!answered){$('fb').className='feedback bad';$('fb').textContent='Choose an answer first 👆';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$('num').textContent='Complete!';$('fill').style.width='100%';$('quiz').innerHTML='<div class="result">🏆 Ideal Gas Complete!<br>Score: '+score+'/15<br>⚡ XP earned: '+score*10+'</div>';$('next').textContent='Retry';$('next').onclick=()=>{i=0;score=0;render()}}}render();</script></body></html>
