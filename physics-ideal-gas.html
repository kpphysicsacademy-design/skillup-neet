<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Ideal Gas</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7fb;color:#172033;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 14px 42px}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 28px #17203314}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:1.55rem;margin:0}.xp{font-weight:900;white-space:nowrap}.sub{color:#657080;margin:8px 0 0}.num{font-weight:800;color:#68717d;margin-top:18px}.bar{height:10px;background:#e8ebef;border-radius:99px;overflow:hidden;margin:10px 0 18px}.fill{height:100%;width:0;background:#58cc02;transition:.3s}.q{font-size:1.18rem;font-weight:850;line-height:1.5;margin:12px 0 14px}.opts{display:grid;gap:10px}.opt{padding:14px;border:2px solid #dfe3e8;border-radius:14px;background:#fff;text-align:left;font:inherit;cursor:pointer}.opt:hover{border-color:#58a6ff;background:#f6fbff}.opt:disabled{cursor:default}.correct{border-color:#58cc02!important;background:#efffe8!important}.wrong{border-color:#e5484d!important;background:#fff0f0!important}.feedback{margin-top:14px;padding:12px;border-radius:13px;line-height:1.5}.good{background:#e8f9df;color:#246b16}.bad{background:#fff0f0;color:#a12b30}.btn{width:100%;margin-top:15px;padding:13px;border:0;border-radius:13px;background:#58cc02;color:#fff;font-weight:900;font-size:1rem;cursor:pointer}.btn:active{transform:translateY(1px)}.back{display:inline-block;margin-top:17px;padding:10px 14px;border:2px solid #dfe3e8;border-radius:13px;color:#344054;text-decoration:none;font-weight:800}.result{text-align:center;font-size:1.15rem;font-weight:850;line-height:1.8;padding:18px}@media(max-width:600px){.wrap{padding:16px 10px}.card{padding:18px;border-radius:18px}.top{align-items:flex-start}.top h1{font-size:1.3rem}.q{font-size:1.08rem}.opt{padding:13px}}
</style>
</head>
<body>
<main class="wrap"><section class="card">
<div class="top"><h1>💨 Ideal Gas</h1><div class="xp">⚡ <span id="xp">0</span> XP</div></div>
<p class="sub">Master the ideal-gas model with 15 NEET-style questions.</p>
<div class="num" id="num">Question 1 of 15</div><div class="bar"><div id="fill" class="fill"></div></div>
<div id="quiz"></div><div id="fb" class="feedback">Choose an answer.</div>
<button id="next" class="btn">Continue →</button>
<a class="back" href="physics-home.html">← Back to Physics Path</a>
</section></main>
<script>
const qs=[
['An ideal gas is a gas for which:', ['molecules have zero volume and no intermolecular attraction','molecules occupy negligible volume and intermolecular forces are neglected except during collisions','molecules are stationary','pressure is always zero'],1,'The ideal-gas model assumes negligible molecular volume and negligible intermolecular forces except during collisions.'],
['The equation of state of an ideal gas is:', ['PV=nRT','P+V=nRT','P/V=nRT','PV=RT/n'],0,'The ideal-gas equation is PV=nRT.'],
['At constant temperature, pressure of a fixed mass of an ideal gas is inversely proportional to:', ['temperature','volume','number of moles','density only'],1,'Boyle’s law gives PV=constant at constant temperature.'],
['At constant pressure, volume of a fixed mass of gas is directly proportional to:', ['absolute temperature','pressure','molar mass','density'],0,'Charles’ law gives V/T=constant at constant pressure.'],
['At constant volume, pressure of an ideal gas is directly proportional to:', ['Celsius temperature','absolute temperature','molar mass only','volume'],1,'Gay-Lussac’s law gives P/T=constant at constant volume.'],
['The SI value of the universal gas constant R is approximately:', ['8.314 J mol^-1 K^-1','0.0821 J mol^-1 K^-1','1.987 J mol^-1 K^-1','9.81 J mol^-1 K^-1'],0,'R=8.314 J mol^-1 K^-1 in SI units.'],
['If the absolute temperature of an ideal gas is doubled at constant volume, its pressure becomes:', ['half','double','four times','unchanged'],1,'At constant V, P is proportional to T.'],
['If the volume of a gas is halved at constant temperature, its pressure becomes:', ['half','double','one-fourth','unchanged'],1,'At constant T, PV is constant, so halving V doubles P.'],
['One mole of an ideal gas at temperature T and pressure P occupies volume:', ['RT/P','P/RT','PT/R','RPT'],0,'From PV=nRT with n=1, V=RT/P.'],
['The average translational kinetic energy of an ideal-gas molecule depends on:', ['temperature only','pressure only','molar mass only','volume only'],0,'Average translational kinetic energy is proportional to absolute temperature.'],
['For an ideal gas, internal energy is a function of:', ['temperature only','pressure only','volume only','pressure and volume but not temperature'],0,'For an ideal gas, internal energy depends only on temperature.'],
['The number of molecules in n moles is:', ['n/N_A','nN_A','N_A/n','n+N_A'],1,'Number of molecules N=nN_A.'],
['At the same temperature, which gas has the same average translational kinetic energy per molecule?', ['only oxygen','only hydrogen','all ideal gases','only gases at the same pressure'],2,'For ideal gases, average molecular translational kinetic energy depends only on temperature.'],
['The density of an ideal gas is related to molar mass M by:', ['rho=PM/RT','rho=RT/PM','rho=P/ MRT','rho=PMT/R'],0,'Using PV=nRT and n=m/M gives rho=m/V=PM/RT.'],
['For a mixture of ideal gases, total pressure equals:', ['the smallest partial pressure','the sum of partial pressures','the product of partial pressures','the average molecular mass'],1,'Dalton’s law states that total pressure is the sum of component partial pressures.']
];
let i=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function render(){answered=false;const a=qs[i];$('num').textContent=`Question ${i+1} of 15`;$('xp').textContent=score*10;$('fill').style.width=(i/15*100)+'%';$('fb').className='feedback';$('fb').textContent='Choose an answer.';$('quiz').innerHTML='<div class="q">'+a[0]+'</div><div class="opts">'+a[1].map((x,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${x}</button>`).join('')+'</div>';document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').textContent=i===14?'Finish Skill →':'Continue →';$('next').onclick=next}
function answer(n){if(answered)return;answered=true;const a=qs[i],ok=n===a[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===a[2])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong')});if(ok){score++;$('fb').className='feedback good';$('fb').innerHTML='🎯 Correct! +10 XP<br>'+a[3]}else{$('fb').className='feedback bad';$('fb').innerHTML='❌ Incorrect.<br><b>Correct answer:</b> '+a[1][a[2]]+'<br>'+a[3]}$('xp').textContent=score*10;$('fill').style.width=((i+1)/15*100)+'%'}
function next(){if(!answered){$('fb').className='feedback bad';$('fb').textContent='Choose an answer first 👆';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$('num').textContent='Complete!';$('fill').style.width='100%';$('quiz').innerHTML=`<div class="result">🏆 Ideal Gas Complete!<br>Score: ${score}/15<br>⚡ XP earned: ${score*10}</div>`;$('next').textContent='Retry';$('next').onclick=()=>{i=0;score=0;render()}}}
render();
</script>
</body>
</html>
