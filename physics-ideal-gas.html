.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}

<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🌡️ Ideal Gas</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[{"q":"What is an ideal gas?","o":["A model whose molecules have negligible volume and negligible intermolecular forces except during collisions","A gas whose molecules never move","A gas that cannot be compressed","A gas with infinitely massive molecules"],"a":0,"e":"The ideal-gas model treats molecules as point particles moving freely between collisions."},{"q":"Which equation describes an ideal gas?","o":["PV = nRT","P + V = nRT","PV = nR/T²","PT = nRV"],"a":0,"e":"The equation of state is PV = nRT."},{"q":"In PV = nRT, P represents…","o":["Absolute pressure","Power","Particle mass","Potential energy"],"a":0,"e":"P is the gas's absolute pressure."},{"q":"In PV = nRT, V represents…","o":["Volume occupied by the gas","Molecular speed","Molar mass","Viscosity"],"a":0,"e":"V is the total volume occupied by the gas."},{"q":"In PV = nRT, n is the…","o":["Amount of gas in moles","Number density in molecules per cubic metre","Gas density","Number of collisions per second"],"a":0,"e":"n is the amount of substance measured in moles."},{"q":"The universal gas constant R is approximately…","o":["8.314 J mol⁻¹ K⁻¹","9.81 J mol⁻¹ K⁻¹","6.022 × 10²³ J","3.00 × 10⁸ J mol⁻¹"],"a":0,"e":"R is approximately 8.314 joules per mole per kelvin."},{"q":"Temperature in the ideal-gas equation must be expressed in…","o":["Kelvin","Celsius only","Fahrenheit","Any scale without conversion"],"a":0,"e":"The equation uses absolute temperature in kelvin."},{"q":"At constant temperature for a fixed amount of gas, pressure and volume obey…","o":["PV = constant","P/V = constant","P + V = constant","PT = constant"],"a":0,"e":"Boyle's law states that PV remains constant at fixed temperature."},{"q":"At constant pressure, the volume of a fixed amount of ideal gas is proportional to…","o":["Absolute temperature","Inverse absolute temperature","Molar mass only","Pressure squared"],"a":0,"e":"Charles's law gives V/T = constant at fixed pressure."},{"q":"At constant volume, pressure of a fixed amount of ideal gas is proportional to…","o":["Absolute temperature","Inverse temperature","Volume","Molecular diameter only"],"a":0,"e":"From PV = nRT, P/T is constant when volume and amount are fixed."},{"q":"A gas occupies 2 L at 100 kPa. At constant temperature, its volume is reduced to 1 L. Final pressure is…","o":["200 kPa","50 kPa","100 kPa","400 kPa"],"a":0,"e":"Boyle's law gives P₂ = P₁V₁/V₂ = 100 × 2/1 = 200 kPa."},{"q":"A gas occupies 3 L at 300 K and is heated to 600 K at constant pressure. Its final volume is…","o":["6 L","1.5 L","3 L","9 L"],"a":0,"e":"Charles's law gives V₂ = V₁T₂/T₁ = 3 × 600/300 = 6 L."},{"q":"A gas has pressure 100 kPa at 300 K. At fixed volume, its pressure at 450 K is…","o":["150 kPa","75 kPa","100 kPa","200 kPa"],"a":0,"e":"P₂ = P₁T₂/T₁ = 100 × 450/300 = 150 kPa."},{"q":"What is the SI unit of pressure?","o":["Pascal","Joule","Kelvin","Coulomb"],"a":0,"e":"Pressure is measured in pascals (Pa), equivalent to N/m²."},{"q":"One mole of an ideal gas contains approximately…","o":["6.022 × 10²³ entities","3.00 × 10⁸ entities","9.81 × 10² entities","1.60 × 10⁻¹⁹ entities"],"a":0,"e":"One mole contains Avogadro's number of specified entities."},{"q":"For a fixed amount of ideal gas, the combined gas law is…","o":["P₁V₁/T₁ = P₂V₂/T₂","P₁T₁/V₁ = P₂T₂/V₂","P₁V₁T₁ = P₂V₂T₂","P₁ + V₁ = P₂ + V₂"],"a":0,"e":"The ratio PV/T remains constant when the amount of gas is fixed."},{"q":"If the absolute temperature of an ideal gas doubles at fixed volume and amount, its pressure…","o":["Doubles","Halves","Quadruples","Stays unchanged"],"a":0,"e":"Pressure is directly proportional to kelvin temperature at constant volume."},{"q":"If both pressure and absolute temperature double for a fixed amount of gas, volume…","o":["Stays the same","Doubles","Halves","Quadruples"],"a":0,"e":"Since V ∝ T/P, doubling both T and P leaves volume unchanged."},{"q":"Which assumption is part of the ideal-gas model?","o":["Molecular collisions are elastic","Molecules are permanently stationary","Molecular volume dominates the container","Strong attractions act at all distances"],"a":0,"e":"Ideal-gas collisions are assumed elastic, conserving total kinetic energy."},{"q":"Why do real gases behave most ideally at high temperature and low pressure?","o":["Intermolecular attractions and molecular volume become less significant","Molecules stop colliding","The gas constant becomes zero","The molecules become massless"],"a":0,"e":"At low density and higher thermal energy, non-ideal effects are less important."},{"q":"For an ideal gas, internal energy depends only on…","o":["Temperature","Pressure alone","Volume alone","Container material"],"a":0,"e":"The internal energy of an ideal gas depends only on its temperature."},{"q":"The average translational kinetic energy per molecule of an ideal gas is…","o":["(3/2)kT","kT/2","RT per molecule","3PV"],"a":0,"e":"The mean translational kinetic energy per molecule is 3kT/2."},{"q":"If the number of moles doubles at fixed pressure and temperature, volume…","o":["Doubles","Halves","Stays unchanged","Becomes zero"],"a":0,"e":"Avogadro's law states V is proportional to n at fixed P and T."},{"q":"If the volume of a fixed amount of gas doubles at constant pressure, absolute temperature…","o":["Doubles","Halves","Stays unchanged","Quadruples"],"a":0,"e":"At constant pressure, V/T is constant."},{"q":"Which quantity is not directly present as a separate variable in PV = nRT?","o":["Molecular diameter","Pressure","Volume","Temperature"],"a":0,"e":"The ideal-gas equation relates macroscopic P, V, n and T; molecular diameter is not a separate term."},{"q":"A gas has P = 100 kPa, V = 0.0249 m³, n = 1 mol. Its temperature is approximately…","o":["300 K","30 K","3,000 K","100 K"],"a":0,"e":"T = PV/(nR) = 100,000 × 0.0249/8.314 ≈ 300 K."},{"q":"Why must pressure be absolute in the ideal-gas equation?","o":["The equation relates gas state to absolute pressure and temperature","Gauge pressure is always negative","Absolute pressure has no units","Gauge pressure equals temperature"],"a":0,"e":"PV = nRT uses absolute pressure; gauge pressure must be converted if needed."},{"q":"Which law describes equal volumes of gases at the same temperature and pressure containing equal numbers of molecules?","o":["Avogadro's law","Boyle's law","Hooke's law","Faraday's law"],"a":0,"e":"Avogadro's law relates gas volume to amount at fixed temperature and pressure."},{"q":"If an ideal gas is compressed isothermally, its internal energy change is…","o":["Zero","Positive","Negative","Always equal to pressure"],"a":0,"e":"For an ideal gas, internal energy depends only on temperature, which is constant in an isothermal process."},{"q":"Which statement about the ideal-gas equation is correct?","o":["It relates pressure, volume, amount and absolute temperature","It applies only to solids","It predicts that all real gases are perfectly ideal under every condition","It excludes temperature"],"a":0,"e":"PV = nRT is the equation of state for an ideal gas and an approximation for real gases."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Ideal Gas Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
