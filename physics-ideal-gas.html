const questions = [{"q":"An ideal gas is modeled as particles that…","o":["Have negligible volume and no intermolecular forces except during collisions","Attract each other strongly at all distances","Remain fixed in place","Have no kinetic energy"],"a":0,"e":"The ideal-gas model treats particles as point-like and assumes negligible intermolecular forces."},{"q":"Which equation describes an ideal gas?","o":["\\(PV=nRT\\)","\\(P+V=nRT\\)","\\(PV=nR/T\\)","\\(P/V=nRT\\)"],"a":0,"e":"The ideal-gas equation is \\(PV=nRT\\)."},{"q":"In the equation \\(PV=nRT\\), T must be measured in…","o":["Kelvin","Celsius","Fahrenheit","Any temperature scale"],"a":0,"e":"The equation uses absolute temperature in kelvin."},{"q":"What is the value of the universal gas constant R approximately?","o":["\\(8.314\\,\\mathrm{J\\,mol^{-1}\\,K^{-1}}\\)","\\(1.38\\times10^{-23}\\,\\mathrm{J\\,K^{-1}}\\)","\\(6.022\\times10^{23}\\,\\mathrm{mol^{-1}}\\)","\\(9.81\\,\\mathrm{m\\,s^{-2}}\\)"],"a":0,"e":"R is approximately 8.314 joules per mole per kelvin."},{"q":"Which microscopic constant is related to R by \\(R=N_Ak_B\\)?","o":["Boltzmann constant \\(k_B\\)","Gravitational constant","Planck length","Avogadro pressure"],"a":0,"e":"The molar gas constant is the product of Avogadro's constant and Boltzmann's constant."},{"q":"For a fixed amount of ideal gas at constant temperature, if volume doubles, pressure…","o":["Halves","Doubles","Quadruples","Remains unchanged"],"a":0,"e":"Boyle's law gives \\(P\\propto1/V\\) at fixed temperature."},{"q":"At constant pressure and fixed amount, if absolute temperature doubles, volume…","o":["Doubles","Halves","Stays constant","Becomes four times"],"a":0,"e":"Charles's law states \\(V\\propto T\\) at constant pressure."},{"q":"At constant volume, if absolute temperature triples, ideal-gas pressure…","o":["Triples","Becomes one-third","Stays constant","Becomes nine times"],"a":0,"e":"The pressure law gives \\(P\\propto T\\) for fixed volume and amount."},{"q":"How many moles are present in an ideal gas sample?","o":["\\(n=PV/(RT)\\)","\\(n=RT/(PV)\\)","\\(n=P/(VRT)\\)","\\(n=PVRT\\)"],"a":0,"e":"Rearranging \\(PV=nRT\\) gives \\(n=PV/(RT)\\)."},{"q":"Which assumption is part of the ideal-gas model?","o":["Collisions are perfectly elastic","Molecules lose kinetic energy in every collision","Molecules have large fixed volume","Intermolecular forces dominate at all times"],"a":0,"e":"Ideal-gas collisions conserve total kinetic energy; collisions are treated as perfectly elastic."},{"q":"The average translational kinetic energy per molecule of an ideal gas is…","o":["\\(\\frac32k_BT\\)","\\(k_BT\\)","\\(\\frac12k_BT\\)","\\(3k_BT\\)"],"a":0,"e":"For three translational degrees of freedom, the mean energy is \\(\\frac32 k_BT\\)."},{"q":"At the same temperature, all ideal gases have the same…","o":["Average translational kinetic energy per molecule","RMS speed","Molecular mass","Density"],"a":0,"e":"Average translational kinetic energy depends only on absolute temperature, not gas identity."},{"q":"Which gas is expected to behave most ideally under ordinary comparisons?","o":["A gas at low pressure and high temperature","A gas at very high pressure and low temperature","A gas near condensation","A gas with strong intermolecular attraction"],"a":0,"e":"Low density and weaker relative intermolecular effects make ideal behavior a better approximation."},{"q":"Why does a real gas deviate from ideal behavior?","o":["Molecules have finite size and intermolecular forces","Its molecules have no motion","Pressure has no units","Temperature cannot be measured"],"a":0,"e":"Real molecules occupy volume and interact, especially at high pressure and low temperature."},{"q":"What happens to an ideal gas's internal energy when its temperature increases?","o":["It increases","It always decreases","It stays constant","It becomes zero"],"a":0,"e":"For an ideal gas, internal energy depends only on temperature."},{"q":"A sample contains 2 mol at 300 K in a volume of 0.05 m³. Its pressure is approximately…","o":["\\(9.98\\times10^4\\,\\mathrm{Pa}\\)","\\(4.99\\times10^4\\,\\mathrm{Pa}\\)","\\(2.49\\times10^5\\,\\mathrm{Pa}\\)","\\(1.00\\times10^3\\,\\mathrm{Pa}\\)"],"a":0,"e":"\\(P=nRT/V=(2)(8.314)(300)/0.05\\approx9.98\\times10^4\\,\\mathrm{Pa}\\)."},{"q":"What is the SI unit of the ideal-gas constant R?","o":["\\(\\mathrm{J\\,mol^{-1}\\,K^{-1}}\\)","\\(\\mathrm{Pa\\,m^{-1}}\\)","\\(\\mathrm{kg\\,mol^{-1}}\\)","\\(\\mathrm{m\\,s^{-1}}\\)"],"a":0,"e":"R has units of energy per mole per kelvin."},{"q":"If the number of moles doubles at fixed pressure and temperature, volume…","o":["Doubles","Halves","Does not change","Becomes four times"],"a":0,"e":"Avogadro's law gives \\(V\\propto n\\) at constant pressure and temperature."},{"q":"Which equation uses the number of molecules N instead of moles?","o":["\\(PV=Nk_BT\\)","\\(PV=NR\\)","\\(P=NRT\\)","\\(PV=k_B/(NT)\\)"],"a":0,"e":"The molecular form of the ideal-gas equation is \\(PV=Nk_BT\\)."},{"q":"At fixed volume, pressure can be expressed using number density as…","o":["\\(P=n_dk_BT\\)","\\(P=n_dT/k_B\\)","\\(P=k_B/(n_dT)\\)","\\(P=n_dk_B/T\\)"],"a":0,"e":"Here \\(n_d=N/V\\) is number density, so \\(P=n_dk_BT\\)."},{"q":"Which statement about an ideal gas's molecules is correct?","o":["Their random motion and wall collisions produce pressure","They have no kinetic energy","They never collide with each other","They are always at rest"],"a":0,"e":"Molecular motion and momentum transfer at the walls explain gas pressure."},{"q":"A gas occupies 4 L at 100 kPa. At constant temperature it is compressed to 2 L. Final pressure is…","o":["200 kPa","50 kPa","100 kPa","400 kPa"],"a":0,"e":"Boyle's law gives \\(P_2=P_1V_1/V_2=100(4/2)=200\\) kPa."},{"q":"An ideal gas is heated from 250 K to 500 K at constant pressure. Its volume…","o":["Doubles","Halves","Remains constant","Becomes four times"],"a":0,"e":"Charles's law makes volume directly proportional to kelvin temperature at constant pressure."},{"q":"At constant volume, a gas has pressure 80 kPa at 200 K. Its pressure at 300 K is…","o":["120 kPa","53.3 kPa","80 kPa","160 kPa"],"a":0,"e":"\\(P_2=P_1T_2/T_1=80(300/200)=120\\) kPa."},{"q":"The compressibility factor Z for an ideal gas is…","o":["1","0","Always greater than 1","Always less than 0"],"a":0,"e":"The compressibility factor \\(Z=PV/(nRT)\\) equals 1 for an ideal gas."},{"q":"Which combination tends to cause the largest real-gas deviations from ideality?","o":["High pressure and low temperature","Low pressure and high temperature","Low pressure and low density","High temperature and low pressure"],"a":0,"e":"High pressure packs molecules closer, while low temperature makes attractions more significant."},{"q":"If 1 mol of an ideal gas is at 273.15 K and 1 atm, its volume is approximately…","o":["22.4 L","11.2 L","44.8 L","1.0 L"],"a":0,"e":"At 273.15 K and 1 atm, one mole occupies approximately 22.4 litres under the traditional STP convention."},{"q":"What does Avogadro's constant represent?","o":["Number of entities per mole","Energy per molecule per kelvin","Pressure per unit volume","Mass per molecule"],"a":0,"e":"Avogadro's constant is approximately \\(6.022\\times10^{23}\\,\\mathrm{mol^{-1}}\\)."},{"q":"A gas has \\(P=100\\) kPa, \\(V=0.0249\\) m³ and \\(T=300\\) K. The amount of gas is approximately…","o":["1 mol","0.1 mol","10 mol","100 mol"],"a":0,"e":"\\(n=PV/(RT)=(100000)(0.0249)/(8.314\\times300)\\approx1.0\\) mol."},{"q":"Which statement best describes an ideal gas?","o":["A useful model that obeys \\(PV=nRT\\) under all modeled conditions","A gas whose molecules are motionless","A gas made only of one chemical element","A gas that must be liquid at room temperature"],"a":0,"e":"An ideal gas is a simplified model; real gases approach ideal behavior in suitable conditions."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
 if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options')]).catch(function(){});}
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Ideal Gas Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';

 if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise([card]).catch(function(){});}

});
render();
 window.addEventListener('load',function(){if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise().catch(function(){});}});
})();
