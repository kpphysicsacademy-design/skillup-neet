<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Impedance</title><meta name="description" content="SkillUp Physics Impedance interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">⚡</span><h1>Impedance</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["In an AC circuit, impedance represents the total opposition to:",["DC only","AC current","Magnetic flux","Charge only"],1,"Impedance is the total opposition offered by an AC circuit to current."],["The SI unit of impedance is:",["Henry","Farad","Ohm","Watt"],2,"Impedance is measured in ohms (Ω)."],["For a series R-L circuit, the impedance magnitude is:",["R+X_L","√(R²+X_L²)","R-X_L","X_L/R"],1,"For series R-L, Z=√(R²+X_L²)."],["For a series R-C circuit, the impedance magnitude is:",["√(R²+X_C²)","R+X_C","R-X_C","X_C/R"],0,"For series R-C, Z=√(R²+X_C²)."],["For a series RLC circuit, the impedance magnitude is:",["R+X_L+X_C","√[R²+(X_L-X_C)²]","R(X_L-X_C)","X_LX_C/R"],1,"For series RLC, Z=√[R²+(X_L-X_C)²]."],["When a series RLC circuit is at resonance, its impedance is:",["Maximum and equal to X_L","Minimum and equal to R","Zero always","Equal to X_C only"],1,"At resonance X_L=X_C, so Z=R, the minimum series impedance."],["If R=3 Ω and X_L=4 Ω in a series RL circuit, Z is:",["1 Ω","5 Ω","7 Ω","12 Ω"],1,"Z=√(3²+4²)=5 Ω."],["If R=6 Ω and X_C=8 Ω in a series RC circuit, Z is:",["2 Ω","10 Ω","14 Ω","48 Ω"],1,"Z=√(6²+8²)=10 Ω."],["For a purely resistive AC circuit, impedance is:",["Zero","Equal to R","Equal to X_L","Infinite"],1,"For a pure resistor, Z=R."],["For a purely inductive circuit, impedance magnitude is:",["R","X_L","X_C","1/X_L"],1,"For an ideal inductor, |Z|=X_L."],["For a purely capacitive circuit, impedance magnitude is:",["R","X_L","X_C","1/X_C"],2,"For an ideal capacitor, |Z|=X_C."],["In a series RLC circuit, if X_L>X_C, the circuit is predominantly:",["Capacitive","Inductive","Purely resistive","Non-reactive"],1,"Positive net reactance X_L-X_C means inductive behavior."],["In a series RLC circuit, if X_C>X_L, the circuit is predominantly:",["Inductive","Capacitive","Purely resistive","Resonant"],1,"Negative net reactance X_L-X_C means capacitive behavior."],["The impedance of a series RLC circuit can be written in complex form as:",["Z=R+j(X_L-X_C)","Z=R(X_L-X_C)","Z=R+j(X_L+X_C)","Z=1/R"],0,"The complex impedance is Z=R+j(X_L-X_C)."],["If a series circuit has R=8 Ω and net reactance 6 Ω, its impedance magnitude is:",["2 Ω","10 Ω","14 Ω","48 Ω"],1,"Z=√(8²+6²)=10 Ω."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="✓ Correct — "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="✗ Not quite — "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;i++;if(i<qs.length)render();else{$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`;$("fill").style.width="100%"}}function restart(){i=0;score=0;xp=0;$("quiz").hidden=false;$("result").hidden=true;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
