<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Inclined Plane</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px 42px}.card{background:#fff;border-radius:22px;padding:28px;box-shadow:0 6px 20px #17203312}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.tag{font-weight:800;font-size:.9rem}.xp{font-weight:850}.bar{height:10px;background:#e8e8f1;border-radius:999px;overflow:hidden;margin:12px 0 24px}.fill{height:100%;width:0;background:#5b50c8;transition:width .25s ease}.q{font-size:1.22rem;font-weight:800;line-height:1.45;margin:20px 0}.opts{display:grid;gap:12px}.opt{width:100%;text-align:left;border:2px solid #e3e3ed;background:#fafafd;border-radius:15px;padding:14px 16px;font:inherit;cursor:pointer;transition:transform .12s,background .12s,border-color .12s,box-shadow .12s}.opt:hover{transform:translateY(-2px);border-color:#aaa4df;box-shadow:0 4px 12px #17203310}.opt:focus{outline:3px solid #c9c3ff;outline-offset:2px}.opt.selected{border-color:#5b50c8;background:#f0edff}.opt.correct{border-color:#2d9b68;background:#eaf8f1}.opt.wrong{border-color:#d45555;background:#fff0f0}.feedback{min-height:72px;margin-top:18px;padding:14px 16px;border-radius:15px;background:#f4f3fb;line-height:1.5}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:13px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer;background:#5b50c8;color:white}.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}.btn:focus{outline:3px solid #c9c3ff;outline-offset:2px}.btn:active{transform:translateY(1px)}.back{display:inline-block;margin-top:30px;color:#5146a5;font-weight:800;text-decoration:none;padding:11px 14px;border-radius:13px}.back:hover{background:#f0edff;transform:translateY(-1px)}.back:focus{outline:3px solid #c9c3ff;outline-offset:2px}.back:active{transform:translateY(1px)}.result{font-size:1.2rem;font-weight:750;line-height:1.6}
</style></head><body><main class="wrap"><section class="card"><div class="top"><div class="tag">📐 Inclined Plane</div><div class="xp" id="xp">+10 XP</div></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></section></main><script>
const qs=[
['For a block on a smooth inclined plane at angle θ, the component of its weight down the plane is:', ['mg sin θ','mg cos θ','mg tan θ','mg'],0,'Resolving mg parallel to the plane gives mg sin θ.'],
['For a block on an inclined plane, the normal reaction (with no other perpendicular force) is:', ['mg cos θ','mg sin θ','mg tan θ','mg'],0,'The perpendicular component of weight is mg cos θ.'],
['A block slides down a smooth incline of angle θ. Its acceleration is:', ['g sin θ','g cos θ','g tan θ','g'],0,'Along the plane, ma = mg sin θ, so a = g sin θ.'],
['As the angle of a smooth inclined plane increases from 0° to 90°, the acceleration down the plane:', ['increases from 0 to g','decreases from g to 0','remains g','remains zero'],0,'a = g sin θ, which increases over this range.'],
['A body is at rest on a rough incline because static friction acts:', ['up the plane, opposing the tendency to slide down','down the plane, helping it slide','perpendicular to the plane','vertically upward'],0,'The component mg sin θ tends to pull the body down, so friction acts up the plane.'],
['For a body just on the point of sliding down a rough incline, limiting friction acts:', ['up the plane','down the plane','normal to the plane','vertically downward'],0,'Limiting friction opposes the impending downward motion.'],
['For a block sliding down a rough incline, kinetic friction acts:', ['up the plane','down the plane','vertically upward','normal to the plane'],0,'Kinetic friction opposes the relative motion.'],
['For a block on an incline, increasing the incline angle generally makes the component of weight parallel to the plane:', ['increase','decrease','remain zero','remain equal to mg'],0,'The component is mg sin θ, which increases as θ increases from 0° to 90°.'],
['At θ = 0°, a smooth inclined plane becomes a horizontal surface. The acceleration due to gravity along the surface is:', ['zero','g','g/2','2g'],0,'a = g sin 0° = 0.'],
['At θ = 90° for a smooth incline, the idealized acceleration along the plane is:', ['g','zero','g/2','2g'],0,'a = g sin 90° = g.'],
['A 2 kg block rests on a smooth 30° incline. Taking g = 10 m/s², the normal reaction is:', ['10√3 N','20 N','10 N','20√3 N'],0,'N = mg cos30° = 20 × √3/2 = 10√3 N.'],
['A 2 kg block slides on a smooth 30° incline with g = 10 m/s². Its acceleration is:', ['5 m/s²','10 m/s²','5√3 m/s²','2 m/s²'],0,'a = g sin30° = 5 m/s².'],
['If a block on a rough incline is in limiting equilibrium, the angle of repose θ satisfies:', ['tan θ = μ','sin θ = μ','cos θ = μ','tan θ = 1/μ'],0,'At limiting equilibrium, mg sinθ = μmg cosθ, giving tanθ = μ.'],
['For an incline of angle θ with coefficient of kinetic friction μk, a block sliding down has acceleration:', ['g(sinθ − μk cosθ)','g(sinθ + μk cosθ)','g(cosθ − μk sinθ)','gμk sinθ'],0,'Net force down the plane is mg sinθ − μkmg cosθ.'],
['Which force is resolved into components parallel and perpendicular to an inclined plane?', ['the weight mg','the coefficient of friction','the normal reaction only','the angle itself'],0,'Resolving weight into mg sinθ and mg cosθ simplifies incline problems.']
];
let i=0,selected=null,score=0;const $=id=>document.getElementById(id);
function render(){selected=null;const a=qs[i];$('fill').style.width=(i/qs.length*100)+'%';$('quiz').innerHTML='<div class="q">'+(i+1)+'. '+a[0]+'</div><div class="opts" id="opts"></div><div class="feedback" id="feedback">Choose an answer, then check it.</div><div class="actions"><button class="btn" id="check">Check</button></div>';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{selected=item.index;[...$('opts').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('opts').appendChild(b)});$('check').onclick=check}
function check(){if(selected===null){$('feedback').textContent='Please choose an answer first.';return}const a=qs[i],ok=selected===a[2];if(ok)score++;[...$('opts').children].forEach(b=>{const oi=Number(b.dataset.index);b.disabled=true;if(oi===a[2])b.classList.add('correct');if(oi===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+'<br>'+a[3];if(i<qs.length-1){$('check').textContent='Next';$('check').onclick=()=>{i++;render()}}else{$('fill').style.width='100%';const pct=Math.round(score/qs.length*100);$('quiz').innerHTML='<div class="result">🏆 Quiz complete!<br>Score: '+score+'/15 ('+pct+'%)<br>XP earned: '+(score*10)+' XP</div><div class="actions"><button class="btn" onclick="i=0;score=0;render()">Retry</button></div>';localStorage.setItem('skillupPhysicsInclinedPlaneScore',String(score))}}
function rememberPath(){try{const ref=document.referrer;if(ref){const u=new URL(ref);if(u.origin===location.origin&&(/(?:physics|full-physics)[^/]*path[^/]*\.html$/i.test(u.pathname)||/\/physics-home\.html$/i.test(u.pathname)))sessionStorage.setItem('skillupLastPhysicsPath',u.href)}}catch(e){}}
rememberPath();$('back').onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();
</script></body></html>
