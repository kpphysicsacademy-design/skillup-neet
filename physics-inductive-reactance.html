<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Inductive Reactance</title><meta name="description" content="SkillUp Physics Inductive Reactance interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🌀</span><h1>Inductive Reactance</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["Inductive reactance is the opposition offered by an inductor to:",["DC current","AC current","Electric charge","Magnetic flux"],1,"Inductive reactance is the AC opposition of an inductor."],["The formula for inductive reactance is:",["X_L=2πfL","X_L=1/(2πfL)","X_L=L/f","X_L=f/L"],0,"X_L=ωL=2πfL."],["The SI unit of inductive reactance is:",["Henry","Farad","Ohm","Watt"],2,"Reactance is measured in ohms (Ω)."],["If frequency increases, inductive reactance:",["Decreases","Increases","Becomes zero","Remains constant"],1,"X_L is directly proportional to frequency."],["At DC, an ideal inductor has inductive reactance:",["Infinite","Zero","R","1/L"],1,"At f=0, X_L=2πfL=0."],["An inductor of 0.2 H is connected to 50 Hz AC. X_L is approximately:",["6.28 Ω","31.4 Ω","62.8 Ω","125.6 Ω"],2,"X_L=2π×50×0.2≈62.8 Ω."],["A 1 H inductor at 10 Hz has reactance approximately:",["3.14 Ω","6.28 Ω","10 Ω","62.8 Ω"],3,"X_L=2π×10×1≈62.8 Ω."],["If L is doubled at fixed frequency, X_L becomes:",["Half","Double","Four times","Unchanged"],1,"X_L is directly proportional to L."],["If frequency is doubled at fixed L, X_L becomes:",["Half","Double","Four times","Unchanged"],1,"X_L is directly proportional to f."],["For a pure inductor, current relative to voltage:",["Leads by 90°","Lags by 90°","Is in phase","Lags by 180°"],1,"Inductor current lags voltage by 90°."],["The voltage across an ideal inductor is:",["v=L(di/dt)","v=LI","v=I/L","v=IR"],0,"The inductor relation is v=L di/dt."],["For an AC frequency of 100 Hz and L=0.1 H, X_L is:",["6.28 Ω","31.4 Ω","62.8 Ω","100 Ω"],2,"X_L=2π×100×0.1≈62.8 Ω."],["If X_L=31.4 Ω at 50 Hz, the inductance is:",["0.01 H","0.05 H","0.10 H","1 H"],2,"L=X_L/(2πf)=31.4/(2π×50)≈0.10 H."],["Inductive reactance is a type of:",["Resistance due to collisions","Reactance due to energy storage in a magnetic field","Capacitance","DC emf"],1,"An inductor opposes AC through its changing magnetic field and back emf."],["The impedance magnitude of a purely inductive circuit is:",["R","X_L","1/X_L","Zero"],1,"For a pure inductor, |Z|=X_L."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="✓ Correct — "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="✗ Not quite — "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;i++;if(i<qs.length)render();else{$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`;$("fill").style.width="100%"}}function restart(){i=0;score=0;xp=0;$("quiz").hidden=false;$("result").hidden=true;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
