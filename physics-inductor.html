<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Inductor</title>
<meta name="description" content="SkillUp Physics Inductor interactive lesson with 15 MCQs.">
<style>
:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}
</style>
</head>
<body><main class="card"><header><span class="icon">🌀</span><h1>Inductor</h1></header>
<section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section>
<section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section>
<a class="back" href="full-physics-path.html">← Back to Physics Path</a></main>
<script>
const qs=[
["An inductor is a device that mainly opposes changes in:",["Voltage","Current","Resistance","Charge"],1,"An inductor opposes changes in current by producing a back emf."],
["The SI unit of inductance is:",["Weber","Tesla","Henry","Farad"],2,"Inductance is measured in henry (H)."],
["The induced emf of an ideal inductor is given by:",["e = IR","e = -L(di/dt)","e = Q/C","e = Pt"],1,"The magnitude of induced emf is L|di/dt| and its sign follows Lenz's law."],
["The energy stored in an inductor carrying current I is:",["LI","LI²","½LI²","2LI²"],2,"Magnetic energy stored is U = ½LI²."],
["For an ideal inductor in a DC circuit after steady state is reached, it behaves approximately as:",["An open circuit","A short circuit","A capacitor","A resistor of infinite resistance"],1,"After transients die out, an ideal inductor has zero voltage across it and acts like a short circuit."],
["A larger inductance means the coil produces a larger opposing emf for the same:",["Rate of change of current","Current only","Resistance","Charge"],0,"e = -L(di/dt), so larger L gives larger emf for the same di/dt."],
["Inductance of a long solenoid increases when the number of turns is:",["Decreased","Increased","Made zero","Unchanged only"],1,"For a long solenoid, L is proportional to N²."],
["Which material placed inside a coil can generally increase its inductance strongly?",["Ferromagnetic core","Vacuum only","Plastic sheet","Dry wood"],0,"A ferromagnetic core increases magnetic permeability and therefore inductance."],
["The time constant of an RL circuit is:",["R/L","L/R","LR","1/LR"],1,"For an RL circuit, τ = L/R."],
["If L = 2 H and di/dt = 3 A/s, the magnitude of induced emf is:",["1.5 V","5 V","6 V","9 V"],2,"e = L(di/dt) = 2 × 3 = 6 V."],
["The magnetic energy stored in a 4 H inductor carrying 2 A is:",["4 J","8 J","16 J","2 J"],1,"U = ½LI² = ½ × 4 × 2² = 8 J."],
["When current through an inductor increases, the induced emf acts to:",["Assist the increase","Oppose the increase","Become zero immediately","Reverse resistance"],1,"Lenz's law makes the induced emf oppose the change in current."],
["The voltage across an ideal inductor is zero when the current is:",["Constant","Increasing rapidly","Decreasing rapidly","Alternating"],0,"If current is constant, di/dt = 0, so v = L(di/dt) = 0."],
["Two identical inductors connected in series without mutual coupling have equivalent inductance:",["L/2","L","2L","L²"],2,"For uncoupled series inductors, inductances add: Leq = L + L = 2L."],
["An inductor stores energy primarily in its:",["Electric field","Magnetic field","Gravitational field","Thermal field"],1,"The energy of an inductor is stored in its magnetic field."]
];
let i=0,score=0,xp=0,answered=false;
const $=id=>document.getElementById(id);
function render(){if(i>=qs.length){$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score}/${qs.length}`;$("earned").textContent=`XP earned: ${xp}`;return}const q=qs[i];$("counter").textContent=`Question ${i+1} of ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=q[0];$("opts").innerHTML=q[1].map((x,n)=>`<button class="opt" onclick="answer(${n})">${String.fromCharCode(65+n)}. ${x}</button>`).join("");$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;answered=false}
function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...document.querySelectorAll('.opt')];buttons.forEach(b=>b.disabled=true);buttons[q[2]].classList.add('ok');if(n===q[2]){score++;xp+=10;$("feedback").textContent=`✓ Correct — ${q[3]}`;$("feedback").className="feedback oktxt"}else{buttons[n].classList.add('no');$("feedback").textContent=`✗ Not quite — ${q[3]}`;$("feedback").className="feedback notxt"}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}
function next(){if(!answered)return;i++;render()}
function restart(){i=0;score=0;xp=0;$("quiz").hidden=false;$("result").hidden=true;render()}
$("next").onclick=next;$("restart").onclick=restart;render();
</script></body></html>
