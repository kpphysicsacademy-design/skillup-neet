<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Inelastic Collision</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:flex-end;margin-bottom:20px}.xp{background:#fff;padding:12px 18px;border-radius:18px;box-shadow:0 5px 18px #17203314;font-weight:800}.hero{background:linear-gradient(135deg,#7b2cbf,#a855f7);color:#fff;border-radius:22px;padding:26px 20px;margin-bottom:12px;box-shadow:0 8px 22px #7b2cbf25}.hero h1{margin:9px 0 10px;font-size:1.9rem}.hero p{margin:0}.card{background:#fff;border-radius:22px;padding:20px;margin:12px 0;box-shadow:0 6px 20px #17203312}.progress-head{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:12px;background:#e7e0ef;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;border-radius:999px;transition:width .3s}.qnum{font-size:.9rem;font-weight:800;color:#5c4670;margin-bottom:12px}.question{font-size:1.28rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{width:100%;padding:14px 15px;border:2px solid #ddd4e6;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer}.option:hover{border-color:#a855f7;background:#faf5ff}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;font-weight:850;cursor:pointer;background:#2db84d;color:#fff;box-shadow:0 4px 0 #21863a}.feedback{margin-top:14px;padding:13px;border-radius:14px;font-weight:700}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:8px;color:#5146a5;font-weight:800;text-decoration:none;padding:9px 12px;border-radius:12px}.back:hover{background:#f0edff}</style></head><body><main class="wrap"><div class="top"><div class="xp">⚡ <span id="xp">0</span> XP</div></div><section class="hero"><h1>💥 Inelastic Collision</h1><p>LEARN → PRACTICE → MASTER • 15 NEET-style MCQs</p></section><section class="card"><div class="progress-head"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count">Question 1 of 15</div><h2 id="question" class="question"></h2><div id="options" class="options"></div><button id="continue" class="btn">Continue →</button><div id="feedback" class="feedback"></div></section><a id="back" class="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const quiz=[['In an inelastic collision, which quantity is conserved for an isolated system?',['linear momentum','kinetic energy of each body','kinetic energy of the system','neither momentum nor energy'],0],['In a perfectly inelastic collision, the colliding bodies:',['stick together after collision','bounce with unchanged speeds','always move apart with equal speeds','lose all momentum'],0],['The coefficient of restitution for a perfectly inelastic collision is:',['0','1','2','infinite'],0],['Kinetic energy in an inelastic collision is generally:',['not conserved','always conserved','created from nothing','always zero'],0],['When two bodies stick together after collision, their final velocity is found using conservation of:',['linear momentum','kinetic energy','power','acceleration'],0],['During an isolated inelastic collision, the lost kinetic energy is converted mainly into:',['heat, sound and deformation/internal energy','momentum','mass only','gravitational force'],0],['If two masses m1 and m2 stick together after collision, their common velocity is:',['(m1u1+m2u2)/(m1+m2)','m1u1+m2u2','u1+u2','(u1+u2)/2 always'],0],['A collision in which the bodies stick together is called:',['perfectly inelastic','perfectly elastic','explosive','non-collisional'],0],['If external impulse on a colliding system is negligible, total momentum:',['remains constant','becomes zero','doubles','equals kinetic energy'],0],['Which statement correctly distinguishes an inelastic collision from an elastic collision?',['Kinetic energy is not conserved in an inelastic collision','Momentum is never conserved in an inelastic collision','Mass is not conserved','Newton’s laws stop applying'],0],['A bullet embeds itself in a wooden block. This is an example of:',['perfectly inelastic collision','perfectly elastic collision','elastic scattering','no interaction'],0],['In a perfectly inelastic collision, maximum kinetic energy loss occurs for a given momentum exchange because:',['the bodies move together after impact','momentum is destroyed','mass disappears','gravity becomes zero'],0],['For a completely isolated collision, total energy including internal energy is:',['conserved','destroyed','always equal to kinetic energy','always zero'],0],['If e=0 for a collision, the relative speed of separation is:',['zero','equal to approach speed','twice approach speed','infinite'],0],['Which is correct about inelastic collisions?',['Momentum can be conserved even though kinetic energy is not','Neither momentum nor energy can be conserved','Kinetic energy must increase','The bodies must always stick together'],0]];let i=0,s=-1,score=0,checked=false;const $=x=>document.getElementById(x);function render(){let a=quiz[i];s=-1;checked=false;$('count').textContent='Question '+(i+1)+' of 15';$('question').textContent=a[0];$('options').innerHTML='';$('feedback').textContent='';$('feedback').className='feedback';$('continue').style.display='inline-block';$('continue').textContent=i===14?'Finish Skill →':'Continue →';let order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k;k--){let r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((x,j)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{s=x.index;[...$('options').children].forEach(z=>z.classList.remove('selected'));b.classList.add('selected')};$('options').appendChild(b)})}$('continue').onclick=()=>{if(!checked){if(s<0){$('feedback').className='feedback bad';$('feedback').textContent='Choose an answer first 👆';return}checked=true;let a=quiz[i],ok=s===a[2];[...$('options').children].forEach(b=>{let x=+b.dataset.index;b.disabled=true;if(x===a[2])b.classList.add('correct');if(x===s&&!ok)b.classList.add('wrong')});if(ok){score++;$('feedback').className='feedback good';$('feedback').textContent='🎯 Correct! +10 XP'}else{$('feedback').className='feedback bad';$('feedback').textContent='✗ Correct answer: '+a[1][a[2]]}$('xp').textContent=score*10;$('mastery').textContent=score+' / 15';$('fill').style.width=score/15*100+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$('question').textContent='🏆 Inelastic Collision Complete!';$('options').innerHTML='';$('continue').style.display='none';$('feedback').className='feedback good';$('feedback').textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};$('back').onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
