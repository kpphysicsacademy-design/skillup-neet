h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#174a78}.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}

.track{height:11px;border-radius:99px;background:#e2edf7;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}
.qmeta{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.4px}

.options{display:grid;gap:10px}.option{display:flex;gap:11px;align-items:center;width:100%;min-height:51px;padding:12px;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}
.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>📏 Inertia</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [{"q":"What is inertia?","o":["The ability to increase speed by itself","The tendency to resist changes in motion","The force that always slows objects","The energy stored in an object"],"a":1,"e":"Inertia is an object's tendency to resist changes to its state of rest or uniform straight-line motion."},{"q":"Which physical quantity measures an object's inertia?","o":["Speed","Acceleration","Mass","Temperature"],"a":2,"e":"Mass is a measure of inertia: more mass means greater resistance to acceleration."},{"q":"Which object has the greatest inertia?","o":["A 1 kg ball","A 2 kg book","A 5 kg bag","A 10 kg box"],"a":3,"e":"The 10 kg box has the greatest mass, and therefore the greatest inertia."},{"q":"A passenger tends to fall forward when a moving bus stops suddenly because of:","o":["Inertia of motion","Inertia of rest","Gravity disappearing","Action and reaction only"],"a":0,"e":"The passenger's body tends to keep moving forward when the bus stops."},{"q":"When a bus starts suddenly, a standing passenger may fall backward due to:","o":["Inertia of rest","Inertia of motion","Reduced mass","Zero gravity"],"a":0,"e":"The feet move with the bus, while the upper body tends to remain at rest initially."},{"q":"Dust comes out of a carpet when it is beaten because dust particles tend to:","o":["Move with the carpet instantly","Remain in their state of rest","Lose their mass","Become weightless"],"a":1,"e":"The carpet moves suddenly, but dust tends to remain at rest due to inertia and separates from it."},{"q":"A coin placed on a card above a glass falls into the glass when the card is flicked away. This demonstrates:","o":["Inertia of rest","Inertia of motion only","Magnetism","Buoyancy"],"a":0,"e":"The coin tends to remain at rest while the card moves away, then gravity pulls it into the glass."},{"q":"Why is it harder to accelerate a loaded truck than an empty truck with the same force?","o":["The loaded truck has less inertia","The loaded truck has greater inertia","Gravity is absent for the empty truck","The loaded truck has no friction"],"a":1,"e":"Greater mass means greater inertia, so the same force produces a smaller acceleration."},{"q":"For the same net force, if an object's mass doubles, its acceleration becomes:","o":["Twice as large","Half as large","Four times as large","Unchanged"],"a":1,"e":"From a = F/m, doubling mass halves acceleration when net force is fixed."},{"q":"Which statement about inertia is correct?","o":["It depends on velocity only","It is a force acting on objects","It is related to mass","It exists only for moving bodies"],"a":2,"e":"Inertia is a property of matter and is quantified by mass."},{"q":"A body at rest remains at rest unless acted upon by a net external force. This is:","o":["Newton's first law","Newton's second law","Newton's third law","The law of cooling"],"a":0,"e":"Newton's first law is also called the law of inertia."},{"q":"An object moving in a straight line at constant velocity will continue doing so if:","o":["The net external force is zero","Its mass becomes zero","Its speed must increase","Gravity is always removed"],"a":0,"e":"With zero net force, the object has no acceleration and maintains constant velocity."},{"q":"A 4 kg object and a 2 kg object experience the same net force. Compared with the 2 kg object, the 4 kg object's acceleration is:","o":["Twice as large","Four times as large","Half as large","The same"],"a":2,"e":"a = F/m, so the object with twice the mass has half the acceleration."},{"q":"Why do seat belts help protect passengers when a car stops suddenly?","o":["They remove the passenger's mass","They provide a force to slow the passenger with the car","They eliminate inertia","They increase the car's speed"],"a":1,"e":"A seat belt applies a restraining force, changing the passenger's motion with the car rather than allowing forward movement."},{"q":"A heavier shopping cart is harder to start moving than a lighter one because it has:","o":["Greater inertia","Less mass","No weight","Zero momentum at all times"],"a":0,"e":"Greater mass gives the cart greater inertia, so more force is needed for the same acceleration."},{"q":"Inertia of direction is noticed when a vehicle turns suddenly because passengers tend to:","o":["Continue along their original direction","Move instantly with the new direction","Lose all velocity","Move toward the centre with no force"],"a":0,"e":"The body tends to preserve its original direction of motion while the vehicle changes direction."},{"q":"Does inertia require an object to be moving?","o":["Yes, only moving objects have inertia","Yes, only fast objects have inertia","No, objects at rest also have inertia","Only objects in space have inertia"],"a":2,"e":"Objects at rest resist being set in motion, so inertia exists whether an object is moving or at rest."},{"q":"Which has more inertia: a stationary 8 kg object or a moving 3 kg object?","o":["The moving 3 kg object","The stationary 8 kg object","Both have equal inertia","It depends only on speed"],"a":1,"e":"Inertia depends on mass, not whether the object is moving. The 8 kg object has more."},{"q":"A force of 12 N acts on a 3 kg object. Its acceleration is:","o":["2 m/s²","3 m/s²","4 m/s²","36 m/s²"],"a":2,"e":"Using F = ma, a = 12/3 = 4 m/s²."},{"q":"Which example best illustrates inertia of rest?","o":["A moving ball slowing due to friction","A passenger leaning forward when a bus brakes","A coin remaining nearly in place as a card is pulled quickly","A stone falling under gravity"],"a":2,"e":"The coin initially tends to remain at rest as the card is pulled away."},{"q":"A moving bicycle stops when its brakes are applied. Is this a violation of inertia?","o":["Yes, inertia means it can never stop","No, braking force changes its motion","Yes, because mass disappears","No, because bicycle has no inertia"],"a":1,"e":"Inertia resists changes but does not prevent them; an external braking force slows the bicycle."},{"q":"Which change would increase the inertia of a cart?","o":["Reducing its mass","Increasing its mass","Painting it a different colour","Changing its direction without adding mass"],"a":1,"e":"Inertia increases with mass."},{"q":"If the net force on a body is zero, can it still be moving?","o":["No, zero force means it must be at rest","Yes, it can move with constant velocity","Only if its mass is zero","Only if it is falling"],"a":1,"e":"Newton's first law allows rest or constant-velocity motion when the net force is zero."},{"q":"A 6 kg object has a net force of 18 N. What is its acceleration?","o":["2 m/s²","3 m/s²","6 m/s²","108 m/s²"],"a":1,"e":"a = F/m = 18/6 = 3 m/s²."},{"q":"Why does a small stone accelerate more than a large stone when the same net force acts on each?","o":["The stone with less mass has less inertia","The stone with more mass has less inertia","Inertia is unrelated to mass","The small stone has no weight"],"a":0,"e":"The smaller mass has less inertia, so the same force gives it greater acceleration."},{"q":"A person jumps from a small boat to the shore, and the boat moves backward. Which concept most directly explains the boat's recoil?","o":["Inertia alone","Interaction forces and conservation of momentum","Inertia of rest only","Surface tension"],"a":1,"e":"The person pushes the boat backward while pushing off; the interaction and momentum transfer cause recoil."},{"q":"Inertia is best described as:","o":["A force that opposes every movement","A property that resists changes in velocity","The rate of change of velocity","The distance travelled per second"],"a":1,"e":"Inertia is resistance to a change in velocity; force is required to produce acceleration."},{"q":"A 2 kg object and a 10 kg object are at rest. Which requires more force to give an acceleration of 3 m/s²?","o":["2 kg object, 6 N","10 kg object, 30 N","Both require 6 N","Both require 30 N"],"a":1,"e":"F = ma. For 10 kg, F = 10 × 3 = 30 N, which is greater than the 2 kg object's 6 N."},{"q":"A passenger feels pushed sideways when a car turns sharply. The sensation is mainly due to:","o":["The body's inertia resisting a change in direction","A new force pulling outward from the road","A sudden increase in passenger mass","Gravity pointing sideways"],"a":0,"e":"The body tends to continue in its original straight-line direction as the car turns."},{"q":"Which statement correctly links inertia and Newton's first law?","o":["Inertia causes objects to speed up by itself","Newton's first law describes motion when net force is zero, reflecting inertia","Inertia equals acceleration","Newton's first law applies only to objects at rest"],"a":1,"e":"The first law describes the tendency to maintain rest or uniform motion when no net external force acts."}]
let index=0,score=0,streak=0,chosen=null,locked=false;
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Nice work!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><button class="btn" id="retry">Practice again</button>';
 $('finishSlot').replaceChildren(card);$('retry').addEventListener('click',()=>{index=0;score=0;streak=0;$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
