<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Inertial Mass</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f9;color:#17202a;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 16px 40px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1{font-size:26px;margin:0}.xp{font-weight:700;color:#16803c}.sub{color:#64748b;margin:8px 0 18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 14px #0000000d}.bar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#22c55e;transition:.25s}.qno{color:#64748b;font-size:14px}.question{font-size:20px;font-weight:700;line-height:1.45;margin:10px 0 16px}.opts{display:grid;gap:10px}.opts button{border:2px solid #dbe2e8;background:#fff;border-radius:12px;padding:13px;text-align:left;font-size:16px;cursor:pointer;transition:.15s}.opts button:hover{transform:translateY(-1px);border-color:#22c55e}.selected{border-color:#22c55e!important;background:#f0fdf4!important}.correct{border-color:#16a34a!important;background:#dcfce7!important}.wrong{border-color:#ef4444!important;background:#fee2e2!important}.action{width:100%;border:0;border-radius:12px;padding:14px;margin-top:16px;background:#22c55e;color:#fff;font-size:17px;font-weight:700;cursor:pointer}.feedback{min-height:24px;margin-top:14px;font-weight:700}.back{display:inline-block;text-decoration:none;color:#166534;border:2px solid #bbf7d0;padding:11px 16px;border-radius:12px;font-weight:700}.result{text-align:center}@media(max-width:520px){.head h1{font-size:22px}.question{font-size:18px}}</style></head><body><main class="wrap"><div class="head"><h1>⚙️ Inertial Mass</h1><div class="xp" id="xp">+0 XP</div></div><p class="sub">Inertial mass, resistance to acceleration, Newton’s second law and its relation to gravitational mass.</p><section class="card"><b>🎯 Skill Mastery <span id="score">0 / 15</span></b><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card" id="quiz"></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>const quiz=[['Inertial mass is a measure of a body’s:', ['gravitational attraction','resistance to acceleration','electric charge','volume'],1,'Inertial mass measures resistance to a change in velocity.'],['Newton’s second law in terms of inertial mass is:', ['F=m/a','F=ma','F=a/m','F=m+a'],1,'The net force is F=ma.'],['For the same applied force, a larger inertial mass produces:', ['larger acceleration','smaller acceleration','the same acceleration always','zero acceleration'],1,'Since a=F/m, acceleration decreases as mass increases.'],['The SI unit of inertial mass is:', ['newton','kilogram','joule','pascal'],1,'Mass is measured in kilograms (kg).'],['If force is constant and mass is doubled, acceleration becomes:', ['double','half','four times','unchanged'],1,'a=F/m, so doubling m halves a.'],['A body of mass 5 kg experiences a net force of 20 N. Its acceleration is:', ['2 m/s²','4 m/s²','10 m/s²','100 m/s²'],1,'a=F/m=20/5=4 m/s².'],['Inertial mass is associated primarily with:', ['Newton’s second law','Coulomb’s law','Ohm’s law','Archimedes’ principle'],0,'Newton’s second law defines the dynamic role of inertial mass.'],['If the net force on a body is zero, its inertial mass can be:', ['only zero','any positive value','only 1 kg','negative only'],1,'Zero net force means zero acceleration; mass need not be zero.'],['For two bodies receiving the same force, the body with greater inertial mass has:', ['greater acceleration','smaller acceleration','greater speed necessarily','zero momentum'],1,'Acceleration is inversely proportional to inertial mass for fixed force.'],['Momentum of a body of inertial mass m moving with velocity v is:', ['m/v','mv','m+v','v/m'],1,'Linear momentum p=mv.'],['Inertial mass is a:', ['vector','scalar','tensor only','dimensionless quantity'],1,'Mass has magnitude only, so it is a scalar.'],['The dimensions of inertial mass are:', ['M','MLT⁻¹','MLT⁻²','M⁻¹'],0,'Mass has the fundamental dimension M.'],['If both net force and inertial mass are doubled, acceleration is:', ['doubled','halved','unchanged','four times'],2,'a=F/m; multiplying both by 2 leaves their ratio unchanged.'],['The equivalence of inertial and gravitational mass means their ratio is:', ['zero','constant and equal to one with consistent units','always infinite','dependent on temperature'],1,'Experimentally, inertial and gravitational mass are equivalent up to the chosen unit convention.'],['A 2 kg body accelerates at 3 m/s². The net force is:', ['1.5 N','5 N','6 N','9 N'],2,'F=ma=2×3=6 N.']];let i=0,selected=null,correct=0,checked=false;const $=id=>document.getElementById(id);function render(){checked=false;selected=null;const q=quiz[i];$('quiz').innerHTML='<div class="qno">Question '+(i+1)+' of 15</div><div class="question">'+q[0]+'</div><div class="opts" id="opts"></div><button class="action" id="action">Continue →</button><div class="feedback" id="feedback"></div>';const order=q[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((x,j)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{if(checked)return;selected=x.index;[...$('opts').children].forEach(y=>y.classList.remove('selected'));b.classList.add('selected')};$('opts').appendChild(b)});$('action').onclick=check;update()}function check(){if(selected===null){$('feedback').textContent='Choose an answer first.';return}if(!checked){checked=true;const q=quiz[i],ok=selected===q[2];if(ok)correct++;[...$('opts').children].forEach(b=>{const n=Number(b.dataset.index);b.disabled=true;if(n===q[2])b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=(ok?'🎉 Correct! +10 XP — ':'💡 Not quite. ')+q[3];$('action').textContent=i===14?'Finish Skill →':'Continue →';update();return}if(i<14){i++;render()}else finish()}function update(){$('score').textContent=correct+' / 15';$('fill').style.width=(correct/15*100)+'%';$('xp').textContent='+'+(correct*10)+' XP'}function finish(){const p=Math.round(correct/15*100);$('quiz').innerHTML='<div class="result"><h2>🏆 Skill Complete!</h2><p>You scored <strong>'+correct+' / 15</strong> ('+p+'%).</p><p>⭐ XP earned: <strong>'+correct*10+'</strong></p><button class="action" onclick="i=0;correct=0;render()">Retry Skill</button></div>';update()}$('back').onclick=function(){const s=sessionStorage.getItem('skillupLastPhysicsPath');if(s){try{const u=new URL(s,location.href);if(u.origin===location.origin){location.href=s;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();</script></body></html>
