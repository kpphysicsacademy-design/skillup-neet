<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Infrared Radiation</title><meta name="description" content="SkillUp Physics Infrared Radiation interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🌡️</span><h1>Infrared Radiation</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["Infrared radiation is a type of:",["Electromagnetic radiation","Mechanical wave","Sound wave","Matter wave only"],0,"Infrared radiation is part of the electromagnetic spectrum."],["Infrared radiation lies between which two regions of the electromagnetic spectrum?",["Gamma rays and X-rays","Visible light and microwaves","Radio waves and gamma rays","X-rays and ultraviolet rays"],1,"Infrared lies beyond the red end of visible light and before microwaves in wavelength."],["Infrared radiation is invisible to the:",["Human eye","Thermal detector","Infrared camera","Photodetector"],0,"Human eyes cannot directly detect infrared radiation."],["Infrared waves are commonly called heat waves because they:",["Are readily absorbed by matter and produce heating","Have zero energy","Require a material medium","Are visible as red light"],0,"Absorption of infrared radiation can increase molecular thermal motion and produce heating."],["Infrared radiation is emitted by objects primarily because of their:",["Thermal motion","Gravitational mass only","Electric charge alone","Nuclear fission only"],0,"Objects above absolute zero emit electromagnetic radiation associated with thermal motion."],["Compared with visible light, infrared radiation generally has:",["Longer wavelength and lower frequency","Shorter wavelength and higher frequency","The same wavelength always","No frequency"],0,"Infrared has longer wavelengths and lower frequencies than visible light."],["Which device commonly detects infrared radiation for thermal imaging?",["Infrared camera","Barometer","Ammeter","Hydrometer"],0,"Thermal cameras use infrared detectors to map radiation associated with temperature."],["Infrared lamps are used in:",["Physiotherapy","Nuclear fission","Magnetic levitation only","Measuring electric charge"],0,"Infrared lamps can provide therapeutic heating in physiotherapy."],["A common household application of infrared radiation is:",["TV remote control","X-ray imaging","Radioactive decay","Ultraviolet sterilization only"],0,"Many remote controls use infrared LEDs to transmit coded signals."],["Infrared radiation plays an important role in the greenhouse effect because Earth emits:",["Long-wave infrared radiation that greenhouse gases can absorb","Gamma rays only","Radio waves only","Visible light only"],0,"Earth reradiates absorbed solar energy as infrared radiation, some of which is absorbed by greenhouse gases."],["If the frequency of infrared radiation increases in vacuum, its wavelength:",["Decreases","Increases","Remains constant","Becomes infinite"],0,"Using c=fλ, wavelength decreases when frequency increases at constant speed."],["The speed of infrared radiation in vacuum is approximately:",["3×10⁸ m/s","3×10⁶ m/s","3×10⁴ m/s","3×10¹⁰ m/s"],0,"All electromagnetic waves travel at approximately 3×10⁸ m/s in vacuum."],["Which source is a strong natural source of infrared radiation?",["Sun","Ice cube at absolute zero","Vacuum itself","Static electric field"],0,"The Sun emits substantial infrared radiation along with other electromagnetic radiation."],["Infrared detectors on satellites can be used for:",["Remote sensing and observing crop growth","Measuring only sound","Detecting only gamma rays","Producing earthquakes"],0,"Infrared sensing from satellites has applications in remote sensing, agriculture and environmental monitoring."],["Which statement about infrared radiation is correct?",["It is electromagnetic radiation and can travel through vacuum","It must have air to propagate","It is a longitudinal mechanical wave","It travels slower than sound in vacuum"],0,"Infrared is electromagnetic radiation and, like other electromagnetic waves, can propagate through vacuum."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
