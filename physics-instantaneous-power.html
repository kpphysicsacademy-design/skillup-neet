<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Instantaneous Power</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:flex-end;margin-bottom:20px}.xp{background:#fff;padding:12px 18px;border-radius:18px;box-shadow:0 5px 18px #17203314;font-weight:800}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff;border-radius:22px;padding:26px 20px;margin-bottom:12px;box-shadow:0 8px 22px #12539d25}.hero h1{margin:9px 0 10px;font-size:1.9rem}.hero p{margin:0}.card{background:#fff;border-radius:22px;padding:20px;margin:12px 0;box-shadow:0 6px 20px #17203312}.progress-head{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:12px;background:#dfe8f1;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;border-radius:999px;transition:width .3s}.qnum{font-size:.9rem;font-weight:800;color:#35516f;margin-bottom:12px}.question{font-size:1.28rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{width:100%;padding:14px 15px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#58cc02;background:#f7fff1}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;font-weight:850;cursor:pointer;background:#2db84d;color:#fff;box-shadow:0 4px 0 #21863a}.feedback{margin-top:14px;padding:13px;border-radius:14px;font-weight:700}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:8px;color:#5146a5;font-weight:800;text-decoration:none;padding:9px 12px;border-radius:12px}.back:hover{background:#f0edff}@media(max-width:600px){.wrap{padding:20px 14px 34px}.question{font-size:1.15rem}}</style></head><body><main class="wrap"><div class="top"><div class="xp">⚡ <span id="xp">0</span> XP</div></div><section class="hero"><h1>⚡ Instantaneous Power</h1><p>LEARN → PRACTICE → MASTER • 15 NEET-style MCQs</p></section><section class="card"><div class="progress-head"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count">Question 1 of 15</div><h2 id="question" class="question"></h2><div id="options" class="options"></div><button id="continue" class="btn">Continue →</button><div id="feedback" class="feedback"></div></section><a id="back" class="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const quiz=[['Instantaneous power is defined as:',['dW/dt','W×t','W/t always','d t/dW'],0],['For a force acting on a particle, instantaneous power is:',['F·v','F/v','F·a','F×t'],0],['The SI unit of power is:',['watt','joule','newton','pascal'],0],['One watt is equal to:',['1 J/s','1 N/s','1 J·s','1 N·m/s²'],0],['If force is perpendicular to instantaneous velocity, power due to that force is:',['zero','maximum','negative infinity','equal to F'],0],['A constant force of 10 N acts along velocity 3 m/s. Instantaneous power is:',['30 W','13 W','3 W','300 W'],0],['If force and velocity make angle θ, instantaneous power is:',['Fv cosθ','Fv sinθ','F/v','Fv tanθ'],0],['At θ=0°, power delivered by a force is:',['Fv','zero','F/v','F+v'],0],['At θ=90°, power delivered by a force is:',['zero','Fv','F/v','F²v'],0],['A motor exerts 500 N in the direction of motion at 4 m/s. Its instantaneous power is:',['2000 W','125 W','504 W','1000 W'],0],['If speed doubles while a constant force remains parallel to motion, instantaneous power:',['doubles','halves','becomes four times','is unchanged'],0],['For uniform circular motion, centripetal force does instantaneous power because it is:',['perpendicular to velocity','parallel to velocity','equal to velocity','zero force'],0],['The area under a power-time graph represents:',['work/energy transferred','force','momentum','acceleration'],0],['If power is constant, work done in time t is:',['Pt','P/t','P+t','t/P'],0],['Which expression correctly relates power, force and velocity?',['P=Fv cosθ','P=Fv sinθ always','P=ma/v','P=mv/F'],0]];let i=0,s=-1,score=0,checked=false;const $=x=>document.getElementById(x);function render(){let a=quiz[i];s=-1;checked=false;$('count').textContent='Question '+(i+1)+' of 15';$('question').textContent=a[0];$('options').innerHTML='';$('feedback').textContent='';$('feedback').className='feedback';$('continue').textContent=i===14?'Finish Skill →':'Continue →';let order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k;k--){let r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((x,j)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{s=x.index;[...$('options').children].forEach(z=>z.classList.remove('selected'));b.classList.add('selected')};$('options').appendChild(b)})}$('continue').onclick=()=>{if(!checked){if(s<0){$('feedback').className='feedback bad';$('feedback').textContent='Choose an answer first 👆';return}checked=true;let a=quiz[i],ok=s===a[2];[...$('options').children].forEach(b=>{let x=+b.dataset.index;b.disabled=true;if(x===a[2])b.classList.add('correct');if(x===s&&!ok)b.classList.add('wrong')});if(ok){score++;$('feedback').className='feedback good';$('feedback').textContent='🎯 Correct! +10 XP'}else{$('feedback').className='feedback bad';$('feedback').textContent='✗ Correct answer: '+a[1][a[2]]}$('xp').textContent=score*10;$('mastery').textContent=score+' / 15';$('fill').style.width=score/15*100+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$('question').textContent='🏆 Instantaneous Power Complete!';$('options').innerHTML='';$('continue').style.display='none';$('feedback').className='feedback good';$('feedback').textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};render()})();</script></body></html>
