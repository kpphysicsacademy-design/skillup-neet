<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Instantaneous Velocity</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:flex-end}.xp{background:#fff;border:1px solid #dfe3ea;border-radius:14px;padding:7px 11px;font-weight:850}.intro{margin:24px 0 18px}.intro h1{margin:0 0 8px;font-size:2rem;line-height:1.15}.intro p{margin:0;color:#596273;line-height:1.55}.progress{height:12px;background:#e4e7ed;border-radius:99px;overflow:hidden;margin:20px 0}.fill{height:100%;width:0;background:#58cc02;transition:width .25s ease}.card{background:#fff;border-radius:22px;padding:26px;box-shadow:0 8px 24px rgba(23,32,51,.08)}.meta{font-size:.95rem;font-weight:800;color:#596273;margin-bottom:12px}.q{font-size:1.3rem;font-weight:750;line-height:1.45;margin:0 0 20px}.options{display:grid;gap:10px}.option{padding:15px 16px;border:2px solid #dfe3ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;color:#172033;cursor:pointer;transition:border-color .15s,background .15s,transform .1s,box-shadow .15s}.option:hover:not(:disabled){border-color:#58cc02;background:#f5fff0;transform:translateY(-1px);box-shadow:0 3px 0 #dfe3ea}.option.selected{border-color:#5146a5;background:#f1efff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#ff4b4b;background:#fff0f0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{padding:12px 18px;border:0;border-radius:13px;font:inherit;font-weight:850;cursor:pointer}.check,.retry{background:#58cc02;color:#fff}.next{background:#5146a5;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:16px;min-height:24px;font-weight:750;line-height:1.5}.good{color:#177b2f}.bad{color:#b02a37}.hint{margin:18px 0 0;color:#596273;font-size:.95rem}.result{display:none;text-align:center;margin-top:20px;padding-top:18px;border-top:1px solid #e5e7eb}.bottom-nav{margin-top:20px;text-align:center}.back{display:inline-block;color:#5146a5;font-weight:800;text-decoration:none;padding:9px 12px;border-radius:12px;transition:transform .15s,background .15s,box-shadow .15s}.back:hover{background:#eeeaff;transform:translateX(-2px);box-shadow:0 4px 12px rgba(81,70,165,.12)}.back:focus-visible{outline:3px solid #b9b0ff;outline-offset:2px}.back:active{transform:translateX(-1px) scale(.98)}@media(max-width:600px){.wrap{padding:20px 14px}.intro h1{font-size:1.65rem}.card{padding:20px}.q{font-size:1.15rem}}</style></head><body><main class="wrap"><div class="top"><span class="xp">⚡ <span id="xp">0</span> XP</span></div><section class="intro"><h1>🎯 Instantaneous Velocity</h1><p>Master instantaneous velocity, derivatives, position-time graphs and directional motion with 15 focused NEET-style MCQs.</p></section><div class="progress" aria-label="Quiz progress"><div id="fill" class="fill"></div></div><section class="card"><div class="meta"><span id="count">Question 1 of 15</span> • <span id="pct">7%</span></div><h2 id="q" class="q"></h2><div id="opts" class="options"></div><div class="actions"><button id="check" class="btn check" type="button">Check Answer</button><button id="next" class="btn next" type="button" disabled>Next Question →</button></div><div id="fb" class="feedback" aria-live="polite"></div><p class="hint">💡 Choose the best answer.</p><div id="result" class="result"><h2>🏆 Skill Complete!</h2><p id="score"></p><button id="retry" class="btn retry" type="button">Retry Skill</button></div></section><div class="bottom-nav"><a class="back" href="#" onclick="return goBackToPhysicsPath()">← Back to Physics Path</a></div></main><script>(function(){const KEY='skillupLastPhysicsPath';function rememberPath(){try{const r=document.referrer;if(!r)return;const u=new URL(r);if(u.origin!==location.origin)return;if(/(?:physics|full-physics)[^/]*path[^/]*\.html$/i.test(u.pathname)||/\/physics-home\.html$/i.test(u.pathname))sessionStorage.setItem(KEY,u.href)}catch(e){}}function goBackToPhysicsPath(){try{const saved=sessionStorage.getItem(KEY);if(saved){const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}}catch(e){}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false}window.goBackToPhysicsPath=goBackToPhysicsPath;rememberPath();const quiz=[['Instantaneous velocity is defined as:',['Displacement divided by total time','Limit of average velocity as the time interval approaches zero','Distance divided by total time','Change in speed per unit time'],1,'Instantaneous velocity is the limiting value of average velocity as the time interval approaches zero.'],['Mathematically, instantaneous velocity is:',['dx/dt','dt/dx','x/t only','d²x/dt²'],0,'For one-dimensional motion, instantaneous velocity is the time derivative of position: v = dx/dt.'],['The magnitude of instantaneous velocity is equal to:',['Instantaneous speed','Average acceleration','Total distance','Average velocity always'],0,'Speed is the magnitude of velocity, including at an instant.'],['The direction of instantaneous velocity is along the:',['Tangent to the path','Normal to the path','Direction of displacement only','Direction of acceleration always'],0,'Instantaneous velocity is tangent to the trajectory at that instant.'],['If x(t)=4t²+2t m, the instantaneous velocity at t=3 s is:',['14 m/s','24 m/s','26 m/s','38 m/s'],2,'v = dx/dt = 8t + 2; at t = 3 s, v = 26 m/s.'],['If x(t)=10t−t² m, velocity at t=2 s is:',['6 m/s','8 m/s','10 m/s','12 m/s'],0,'v = dx/dt = 10 − 2t; at t = 2 s, v = 6 m/s.'],['At a turning point in one-dimensional motion, instantaneous velocity is:',['Maximum always','Zero','Equal to acceleration','Negative always'],1,'At a turning point the position momentarily stops changing before reversing, so velocity is zero.'],['A particle can have zero instantaneous velocity but nonzero acceleration:',['Yes, for example at a turning point','No, impossible','Only when acceleration is zero','Only during uniform motion'],0,'Yes. At a turning point, velocity can be zero while acceleration is nonzero.'],['For uniform motion in a straight line, instantaneous velocity is:',['Constant','Always zero','Continuously increasing','Continuously decreasing'],0,'Uniform straight-line motion has constant velocity at every instant.'],['If x=5t³, instantaneous velocity at t=2 s is:',['30 m/s','40 m/s','60 m/s','120 m/s'],2,'v = dx/dt = 15t²; at t = 2 s, v = 60 m/s.'],['The slope of a position-time graph at a particular instant gives:',['Instantaneous velocity','Average speed','Acceleration','Distance'],0,'The instantaneous slope dx/dt of a position-time graph gives instantaneous velocity.'],['A horizontal tangent on a position-time graph indicates:',['Zero instantaneous velocity','Infinite velocity','Maximum acceleration','Constant nonzero velocity'],0,'A horizontal tangent has zero slope, so instantaneous velocity is zero.'],['If instantaneous velocity changes direction at an instant, the velocity component along the chosen axis:',['Changes sign','Must remain positive','Must remain zero forever','Becomes equal to speed squared'],0,'A reversal of one-dimensional motion changes the sign of the velocity component.'],['For circular motion at constant speed, instantaneous velocity:',['Remains constant in magnitude and direction','Has constant magnitude but changes direction','Is always zero','Changes magnitude but not direction'],1,'In uniform circular motion, speed is constant but velocity direction continuously changes.'],['Which statement best distinguishes instantaneous and average velocity?',['Instantaneous velocity refers to an infinitesimal time interval; average velocity uses a finite interval','They are always identical','Average velocity is scalar and instantaneous velocity is scalar','Instantaneous velocity uses distance while average velocity uses displacement'],0,'Instantaneous velocity is defined at an instant; average velocity is displacement divided by elapsed time over a finite interval.']];let i=0,sel=-1,score=0,locked=false;const $=id=>document.getElementById(id),q=$('q'),o=$('opts'),fb=$('fb'),check=$('check'),next=$('next'),xp=$('xp'),fill=$('fill'),count=$('count'),pct=$('pct');function render(){const a=quiz[i];sel=-1;locked=false;q.textContent=a[0];count.textContent='Question '+(i+1)+' of '+quiz.length;pct.textContent=Math.round((i+1)/quiz.length*100)+'%';fill.style.width=(score/quiz.length*100)+'%';fb.className='feedback';fb.textContent='';check.disabled=false;next.disabled=true;next.textContent='Next Question →';o.innerHTML='';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{if(locked)return;sel=item.index;Array.from(o.children).forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)})}check.onclick=function(){if(sel<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}locked=true;const a=quiz[i],ok=sel===a[2];Array.from(o.children).forEach(b=>{const originalIndex=Number(b.dataset.index);b.disabled=true;if(originalIndex===a[2])b.classList.add('correct');if(originalIndex===sel&&!ok)b.classList.add('wrong')});if(ok){score++;fb.className='feedback good';fb.textContent='🎯 Correct! '+a[3]+' +10 XP'}else{fb.className='feedback bad';fb.textContent='Not quite. Correct answer: '+a[1][a[2]]+' — '+a[3]}xp.textContent=score*10;fill.style.width=(score/quiz.length*100)+'%';check.disabled=true;next.disabled=false;if(i===quiz.length-1)next.textContent='Finish Skill →'};next.onclick=function(){if(i<quiz.length-1){i++;render()}else{q.textContent='🏆 Instantaneous Velocity Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+score+' / '+quiz.length+' correct • '+score*10+' XP';$('result').style.display='block';$('score').textContent=score+' / '+quiz.length+' correct • '+score*10+' XP'}};$('retry').onclick=()=>{i=0;sel=-1;score=0;locked=false;xp.textContent='0';$('result').style.display='none';check.style.display='';next.style.display='';next.textContent='Next Question →';render()};render()})();</script></body></html>
