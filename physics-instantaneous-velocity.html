n></b><div class="bar"><div id="fill" class="fill"></div></div></section><div class="layout"><aside class="card"><h3 id="count">Question 1 of 15</h3><div id="pct">7%</div><div>Instantaneous Velocity</div><div>⚡ +10 XP each</div><div>🦉 Learn → Practice → Master</div></aside><section class="card"><b id="badge">Q1</b><h2 id="q"></h2><div id="opts" class="options"></div><button id="check" class="btn check">Check Answer</button><button id="next" class="btn next" disabled>Next Question →</button><div id="fb" class="feedback"></div><p>💡 Choose the best answer.</p></section></div></main><script>(function(){const quiz=[['Instantaneous velocity is defined as:',['Displacement divided by total time','Limit of average velocity as the time interval approaches zero','Distance divided by total time','Change in speed per unit time'],1],['Mathematically, instantaneous velocity is:',['dx/dt','dt/dx','x/t only','d²x/dt²'],0],['The magnitude of instantaneous velocity is equal to:',['Instantaneous speed','Average acceleration','Total distance','Average velocity always'],0],['The direction of instantaneous velocity is along the:',['Tangent to the path','Normal to the path','Direction of displacement only','Direction of acceleration always'],0],['If x(t)=4t²+2t m, the instantaneous velocity at t=3 s is:',['14 m/s','24 m/s','26 m/s','38 m/s'],2],['If x(t)=10t−t² m, velocity at t=2 s is:',['6 m/s','8 m/s','10 m/s','12 m/s'],0],['At a turning point in one-dimensional motion, instantaneous velocity is:',['Maximum always','Zero','Equal to acceleration','Negative always'],1],['A particle can have zero instantaneous velocity but nonzero acceleration:',['Yes, for example at a turning point','No, impossible','Only when acceleration is zero','Only during uniform motion'],0],['For uniform motion in a straight line, instantaneous velocity is:',['Constant','Always zero','Continuously increasing','Continuously decreasing'],0],['If x=5t³, instantaneous velocity at t=2 s is:',['30 m/s','40 m/s','60 m/s',' tContent='Choose an answer first 👆';return}let a=quiz[i];[...o.children].forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===sel&&j!==a[2])b.classList.add('wrong')});if(sel===a[2]){score++;fb.className='feedback good';fb.textContent='🎯 Correct! +10 XP'}else{fb.className='feedback bad';fb.textContent='Not quite. Correct answer: '+a[1][a[2]]}document.getElementById('xp').textContent=score*10;document.getElementById('mt').textContent=score+' / '+quiz.length;document.getElementById('fill').style.width=(score/quiz.length*100)+'%';check.disabled=true;next.disabled=false;if(i===quiz.length-1)next.textContent='Finish Skill →'};next.onclick=()=>{if(i<quiz.length-1){i++;next.textContent='Next Question →';render()}else{q.textContent='🏆 Instantaneous Velocity Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+score+' / '+quiz.length+' correct • '+score*10+' XP'}};render()})();</script></body></html>
