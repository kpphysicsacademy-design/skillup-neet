<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SkillUp Physics | Instrument Selection</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.opt.selected{border-color:#5146a5;background:#f4f1ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.opt:disabled{cursor:default}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🔧 Instrument Selection</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="action">CHECK</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['Which instrument is most suitable for measuring the diameter of a thin wire accurately?',['Metre scale','Vernier calipers','Thermometer','Stopwatch'],1,'Vernier calipers are designed for accurate measurement of small external diameters.'],['Which instrument is generally used to measure the diameter of a very thin wire with greater precision?',['Metre scale','Screw gauge','Measuring cylinder','Spring balance'],1,'A screw gauge has a small least count and is suitable for measuring thin wires.'],['Which instrument is best for measuring the internal diameter of a narrow tube?',['Vernier calipers','Beam balance','Stopwatch','Ammeter'],0,'The internal jaws of vernier calipers can measure internal diameters.'],['Which instrument is most suitable for measuring the depth of a small hole?',['Vernier calipers with a depth rod','Thermometer','Screw gauge only','Spring balance'],0,'The depth rod of a vernier caliper is designed for depth measurements.'],['Which instrument is used to measure the thickness of a thin sheet accurately?',['Screw gauge','Metre scale','Measuring cylinder','Voltmeter'],0,'A screw gauge is suitable for small thicknesses because of its fine least count.'],['Which instrument is most appropriate for measuring a length of a classroom table?',['Metre scale','Screw gauge','Vernier calipers','Stopwatch'],0,'A metre scale is convenient for ordinary lengths of this order.'],['Which instrument is used to measure the volume of an irregular solid by water displacement?',['Measuring cylinder','Screw gauge','Ammeter','Metre scale'],0,'Water displacement in a measuring cylinder can be used to determine the volume of an irregular solid.'],['Which instrument is designed to measure liquid volume directly with relatively high accuracy in a laboratory?',['Measuring cylinder','Metre scale','Vernier calipers','Spring balance'],0,'A measuring cylinder has graduations for measuring liquid volume.'],['Which instrument is used to measure the mass of an object in a school laboratory?',['Beam balance','Stopwatch','Thermometer','Voltmeter'],0,'A beam balance compares the object with standard masses to determine mass.'],['Which instrument measures the time interval of an event?',['Stopwatch','Ammeter','Screw gauge','Measuring cylinder'],0,'A stopwatch is used to measure time intervals.'],['Which instrument is used to measure temperature?',['Thermometer','Vernier calipers','Beam balance','Ammeter'],0,'A thermometer measures temperature.'],['Which instrument measures electric current in a circuit?',['Voltmeter','Ammeter','Ohmmeter','Thermometer'],1,'An ammeter is connected in series and measures electric current.'],['Which instrument measures potential difference between two points?',['Ammeter','Voltmeter','Beam balance','Stopwatch'],1,'A voltmeter measures potential difference and is connected in parallel across the points.'],['For measuring the diameter of a spherical ball to determine its volume, which instrument is most suitable?',['Vernier calipers','Measuring cylinder','Thermometer','Stopwatch'],0,'Vernier calipers can measure the external diameter of a sphere accurately.'],['When selecting a measuring instrument, which factor is most important for obtaining an appropriate measurement?',['Matching the instrument range and least count to the quantity being measured','Choosing the largest instrument available','Ignoring least count','Using the same instrument for every quantity'],0,'The instrument should have a suitable range and sufficient precision for the quantity being measured.']];let i=0,score=0,answered=false,selected=-1;const $=x=>document.getElementById(x);function render(){answered=false;selected=-1;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q[1].map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('action').classList.remove('hide');$('action').textContent='CHECK'});$('xp').textContent='';$('action').classList.add('hide');$('action').disabled=false;}function check(){if(selected<0)return;if(!answered){answered=true;const q=qs[i],ok=selected===q[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===selected&&!ok)b.classList.add('wrong')});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[3];if(ok)score++;$('score').textContent=`XP ${score}`;$('fill').style.width=`${(i+1)/15*100}%`;$('action').textContent=i===14?'FINISH':'Next Question →';return;}if(i<14){i++;render()}else{$('quiz').innerHTML='';$('action').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('action').onclick=check;render();</script></body></html>
