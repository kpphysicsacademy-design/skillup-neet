<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SkillUp Physics | Intercept Calculation</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.opt.selected{border-color:#5146a5;background:#f4f1ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.opt:disabled{cursor:default}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>📍 Intercept Calculation</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="action">CHECK</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['For a straight-line equation y=mx+c, c represents the:',['Slope','Y-intercept','X-intercept','Gradient only'],1,'In y=mx+c, c is the value of y when x=0, so it is the y-intercept.'],['For y=2x+5, the y-intercept is:',['2','5','7','−5'],1,'Putting x=0 gives y=5, so the y-intercept is 5.'],['For y=−3x+7, the y-intercept is:',['−3','3','7','−7'],2,'The constant term is the y-intercept, so c=7.'],['A line crosses the y-axis at (0,4). Its y-intercept is:',['0','4','−4','Cannot be determined'],1,'The y-intercept is the y-coordinate where the graph crosses the y-axis.'],['A line has equation y=4x−8. Its y-intercept is:',['4','8','−8','−4'],2,'At x=0, y=−8. Therefore the y-intercept is −8.'],['The x-intercept is the value of x when:',['x=0','y=0','y=1','slope=0'],1,'At the x-axis, y=0, so setting y=0 gives the x-intercept.'],['For y=2x−6, the x-intercept is:',['−3','0','3','6'],2,'Set y=0: 2x−6=0, so x=3.'],['For y=−x+5, the x-intercept is:',['−5','0','5','10'],2,'Set y=0: −x+5=0, giving x=5.'],['A line with slope 3 and y-intercept 2 has equation:',['y=2x+3','y=3x+2','y=3x−2','y=−3x+2'],1,'Using y=mx+c with m=3 and c=2 gives y=3x+2.'],['If a graph crosses the y-axis at −6, the intercept c in y=mx+c is:',['6','−6','0','m'],1,'The y-intercept is c, so c=−6.'],['The y-intercept of y=5x is:',['5','1','0','−5'],2,'There is no constant term, so at x=0 the value of y is 0.'],['For the line y=2x+4, the point where it crosses the y-axis is:',['(4,0)','(0,2)','(0,4)','(2,0)'],2,'At x=0, y=4, so the y-axis crossing is (0,4).'],['A straight-line graph has slope 2 and passes through (0,−3). Its equation is:',['y=2x+3','y=−2x+3','y=2x−3','y=−3x+2'],2,'The y-intercept is −3 and the slope is 2, so y=2x−3.'],['If the line y=3x−12 crosses the x-axis at:',['x=−4','x=0','x=4','x=12'],2,'Set y=0: 3x−12=0, hence x=4.'],['Why are intercepts useful when analysing a physics graph?',['They help locate where the graph crosses an axis and can reveal physical constants or thresholds','They eliminate measurement uncertainty','They make the slope unnecessary','They remove the need for units'],0,'Intercepts locate axis crossings and may represent meaningful quantities depending on the physical variables plotted.']];let i=0,score=0,answered=false,selected=-1;const $=x=>document.getElementById(x);function render(){answered=false;selected=-1;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q[1].map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('action').classList.remove('hide');$('action').textContent='CHECK'});$('xp').textContent='';$('action').classList.add('hide');$('action').disabled=false;}$('action').onclick=()=>{if(selected<0)return;if(!answered){answered=true;const q=qs[i],ok=selected===q[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===selected&&!ok)b.classList.add('wrong')});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[3];if(ok)score++;$('score').textContent=`XP ${score}`;$('fill').style.width=`${(i+1)/15*100}%`;$('action').textContent=i===14?'FINISH':'Next Question →';return;}if(i<14){i++;render()}else{$('quiz').innerHTML='';$('action').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}};render();</script></body></html>
