const questions = [{"q":"Wave interference occurs when…","o":["Two or more waves overlap","A wave stops permanently","Frequency becomes zero","Only one particle oscillates"],"a":0,"e":"Interference is the result of superposition when waves overlap at the same region."},{"q":"Constructive interference occurs when two coherent waves arrive…","o":["In phase","In antiphase","With a phase difference of π/2 always","At different times with no overlap"],"a":0,"e":"In-phase waves reinforce each other. For path difference, the condition is \\(\\Delta x=n\\lambda\\)."},{"q":"For two coherent waves, the condition for destructive interference is…","o":["\\(\\Delta x=n\\lambda\\)","\\(\\Delta x=(n+\\tfrac12)\\lambda\\)","\\(\\Delta x=2n\\lambda\\) only","\\(\\Delta x=0\\) only"],"a":1,"e":"Destructive interference occurs when the path difference is a half-integer multiple of wavelength: \\(\\Delta x=(n+\\tfrac12)\\lambda\\)."},{"q":"Path difference and phase difference are related by…","o":["\\(\\Delta\\phi=2\\pi\\Delta x/\\lambda\\)","\\(\\Delta\\phi=\\lambda/(2\\pi\\Delta x)\\)","\\(\\Delta\\phi=\\Delta x+\\lambda\\)","\\(\\Delta\\phi=2\\pi\\lambda\\Delta x\\)"],"a":0,"e":"A path difference of one wavelength corresponds to a phase difference of \\(2\\pi\\), so \\(\\Delta\\phi=2\\pi\\Delta x/\\lambda\\)."},{"q":"A path difference of \\(\\lambda/2\\) corresponds to a phase difference of…","o":["\\(0\\)","\\(\\pi/2\\)","\\(\\pi\\)","\\(2\\pi\\)"],"a":2,"e":"\\(\\Delta\\phi=2\\pi(\\lambda/2)/\\lambda=\\pi\\) radians, or 180°."},{"q":"A path difference of \\(\\lambda\\) produces a phase difference of…","o":["\\(\\pi/4\\)","\\(\\pi/2\\)","\\(\\pi\\)","\\(2\\pi\\)"],"a":3,"e":"\\(\\Delta\\phi=2\\pi\\lambda/\\lambda=2\\pi\\), so the waves arrive in phase."},{"q":"For stable interference fringes, two sources should be…","o":["Coherent with the same frequency and a constant phase difference","Independent with randomly changing phase","Different in frequency","Always at different amplitudes"],"a":0,"e":"Coherent sources maintain a constant phase difference and have the same frequency."},{"q":"Two equal-amplitude waves of amplitude \\(A\\) meet in phase. Their resultant amplitude is…","o":["\\(0\\)","\\(A\\)","\\(2A\\)","\\(A/2\\)"],"a":2,"e":"For in-phase waves, displacements add: \\(A_R=A+A=2A\\)."},{"q":"Two equal-amplitude waves of amplitude \\(A\\) meet in antiphase. Their resultant amplitude is…","o":["\\(0\\)","\\(A\\)","\\(2A\\)","\\(4A\\)"],"a":0,"e":"Equal amplitudes with phase difference \\(\\pi\\) cancel: \\(A_R=0\\)."},{"q":"For two coherent waves with equal amplitude \\(A\\) and phase difference \\(\\phi\\), resultant amplitude magnitude is…","o":["\\(2A|\\cos(\\phi/2)|\\)","\\(A\\sin\\phi\\)","\\(A\\phi\\)","\\(2A\\phi\\)"],"a":0,"e":"The resultant amplitude is \\(A_R=2A|\\cos(\\phi/2)|\\)."},{"q":"If the amplitude of a wave doubles, its intensity (with \\(I\\propto A^2\\)) becomes…","o":["Twice as large","Four times as large","Half as large","Unchanged"],"a":1,"e":"Since \\(I\\propto A^2\\), doubling amplitude multiplies intensity by \\(2^2=4\\)."},{"q":"For two equal-intensity coherent waves interfering constructively, the resultant intensity compared with one wave is…","o":["Half","Twice","Four times","Unchanged"],"a":2,"e":"The amplitude doubles in constructive interference; intensity is proportional to amplitude squared, so the resultant intensity is four times that of one wave."},{"q":"For two equal-intensity coherent waves interfering destructively, the intensity at a perfect minimum is…","o":["Zero","Equal to one source","Twice one source","Four times one source"],"a":0,"e":"For equal amplitudes and a phase difference of \\(\\pi\\), the resultant amplitude is zero, so ideal resultant intensity is zero."},{"q":"In Young's double-slit experiment, the fringe width is…","o":["\\(\\beta=\\lambda D/d\\)","\\(\\beta=dD/\\lambda\\)","\\(\\beta=\\lambda d/D\\)","\\(\\beta=D/(\\lambda d)\\)"],"a":0,"e":"For small angles, fringe width is \\(\\beta=\\lambda D/d\\), where D is screen distance and d is slit separation."},{"q":"In the expression \\(\\beta=\\lambda D/d\\), D denotes…","o":["Slit separation","Wavelength","Distance from slits to screen","Fringe order"],"a":2,"e":"D is the distance between the double-slit plane and the screen."},{"q":"In Young's double-slit experiment, d denotes…","o":["Screen distance","Separation between the two slits","Fringe width","Light frequency"],"a":1,"e":"The symbol d represents the separation between the two slits."},{"q":"If wavelength increases while D and d remain constant, fringe width…","o":["Increases","Decreases","Remains constant","Becomes zero"],"a":0,"e":"From \\(\\beta=\\lambda D/d\\), fringe width is directly proportional to wavelength."},{"q":"If slit separation d doubles while wavelength and screen distance stay fixed, fringe width…","o":["Doubles","Halves","Quadruples","Does not change"],"a":1,"e":"Since \\(\\beta=\\lambda D/d\\), doubling d halves the fringe width."},{"q":"For wavelength \\(600\\,\\text{nm}\\), screen distance \\(2\\,\\text{m}\\), and slit separation \\(0.5\\,\\text{mm}\\), the fringe width is…","o":["\\(0.24\\,\\text{mm}\\)","\\(2.4\\,\\text{mm}\\)","\\(24\\,\\text{mm}\\)","\\(0.024\\,\\text{mm}\\)"],"a":1,"e":"\\(\\beta=\\lambda D/d=(600\\times10^{-9}\\times2)/(0.5\\times10^{-3})=2.4\\times10^{-3}\\,\\text{m}=2.4\\,\\text{mm}\\)."},{"q":"For the m-th bright fringe in Young's experiment, the path difference is…","o":["\\((m+\\tfrac12)\\lambda\\)","\\(m\\lambda\\)","\\(\\lambda/(m+1)\\)","\\(m\\lambda/2\\) for all m"],"a":1,"e":"Bright fringes occur at constructive interference: \\(\\Delta x=m\\lambda\\), where m is an integer."},{"q":"For a dark fringe in Young's experiment, the path difference is…","o":["\\(m\\lambda\\)","\\((m+\\tfrac12)\\lambda\\)","\\(2m\\lambda\\) only","\\(0\\)"],"a":1,"e":"Dark fringes occur at destructive interference: \\(\\Delta x=(m+\\tfrac12)\\lambda\\)."},{"q":"The central fringe in Young's double-slit experiment is usually…","o":["Bright","Dark for all sources","Absent","Always red"],"a":0,"e":"At the central point, the two paths are equal, so path difference is zero and constructive interference occurs for coherent in-phase sources."},{"q":"If \\(D\\) doubles in Young's experiment with \\(\\lambda\\) and d fixed, fringe width…","o":["Halves","Doubles","Remains fixed","Becomes zero"],"a":1,"e":"Since \\(\\beta=\\lambda D/d\\), fringe width is directly proportional to D."},{"q":"The SI unit of fringe width \\(\\beta\\) is…","o":["Metre","Hertz","Radian per second","Watt"],"a":0,"e":"Fringe width is a distance between adjacent fringes, so its SI unit is metre."},{"q":"Which observation is characteristic of interference?","o":["Alternating regions of reinforcement and cancellation","Only a steady increase in frequency","No relation to phase","Waves cannot overlap"],"a":0,"e":"Depending on the phase difference, waves reinforce at some points and cancel partially or fully at others."},{"q":"Two waves have amplitudes \\(3\\,\\text{cm}\\) and \\(2\\,\\text{cm}\\), and are in phase. Their resultant amplitude is…","o":["\\(1\\,\\text{cm}\\)","\\(5\\,\\text{cm}\\)","\\(6\\,\\text{cm}\\)","\\(0\\,\\text{cm}\\)"],"a":1,"e":"In phase, the amplitudes add: \\(A_R=3+2=5\\,\\text{cm}\\)."},{"q":"Two waves have amplitudes \\(5\\,\\text{cm}\\) and \\(2\\,\\text{cm}\\), and are in antiphase. Resultant amplitude magnitude is…","o":["\\(7\\,\\text{cm}\\)","\\(3\\,\\text{cm}\\)","\\(10\\,\\text{cm}\\)","\\(0\\,\\text{cm}\\)"],"a":1,"e":"In antiphase, the resultant amplitude magnitude is the difference: \\(|5-2|=3\\,\\text{cm}\\)."},{"q":"A path difference is \\(3\\lambda/4\\). The corresponding phase difference magnitude is…","o":["\\(\\pi/4\\)","\\(\\pi/2\\)","\\(\\pi\\)","\\(3\\pi/2\\)"],"a":3,"e":"\\(\\Delta\\phi=2\\pi(3\\lambda/4)/\\lambda=3\\pi/2\\) radians."},{"q":"If the fringe width is \\(1.5\\,\\text{mm}\\), the distance across 4 fringe spacings is…","o":["\\(1.5\\,\\text{mm}\\)","\\(4.5\\,\\text{mm}\\)","\\(6.0\\,\\text{mm}\\)","\\(7.5\\,\\text{mm}\\)"],"a":2,"e":"Four adjacent fringe spacings cover \\(4\\beta=4\\times1.5=6.0\\,\\text{mm}\\)."},{"q":"The interference pattern depends strongly on the relative…","o":["Phase of the overlapping waves","Colour of the screen","Mass of the detector","Shape of the source casing only"],"a":0,"e":"The phase difference determines whether the waves reinforce or cancel at a given location."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
const wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}

});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';

 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Interference Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }

 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
