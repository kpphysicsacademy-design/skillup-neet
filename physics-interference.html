<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Interference</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f7ff;margin:0;color:#1e293b}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(30,41,59,.10);border:1px solid #e2e8f0}h1{text-align:center;color:#334155}.meta{display:flex;justify-content:space-between;font-weight:700;color:#475569}.bar{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#22c55e;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;color:#172033}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe4f0;border-radius:14px;background:#fff;color:#1e293b;font-size:16px;cursor:pointer;transition:.2s}.opt:hover{background:#eef5ff;border-color:#93c5fd;transform:translateY(-1px)}.opt:focus-visible{outline:3px solid #bfdbfe;outline-offset:2px}.correct{border-color:#16a34a!important;background:#ecfdf3!important;color:#166534!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important;color:#991b1b!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s}.next,.retry{background:#4f46e5;color:#fff}.next:hover,.retry:hover{background:#4338ca}.back{background:#334155;color:#fff}.back:hover{background:#1e293b}.hide{display:none}.xp{text-align:center;font-weight:700;color:#d97706;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>🌈 Interference</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a>
</div></div>
<script>
const qs=[
['Interference of waves is the phenomenon produced by','reflection only','superposition of two or more coherent waves','refraction only','absorption only',1,'Interference results from superposition of waves with a stable phase relationship.'],
['Constructive interference occurs when the path difference is','(2n+1)λ/2','nλ','λ/4 only','λ/3 only',1,'For constructive interference, path difference is nλ, where n is an integer.'],
['Destructive interference occurs when the path difference is','nλ','(2n+1)λ/2','2nλ','zero only',1,'For destructive interference, path difference is an odd multiple of λ/2.'],
['For two coherent waves of equal amplitude A in phase, resultant amplitude is','0','A','√2A','2A',3,'In phase waves interfere constructively, so their amplitudes add to give 2A.'],
['For two equal waves exactly out of phase, resultant amplitude is','0','A','2A','A/2',0,'A phase difference of π causes complete cancellation for equal amplitudes.'],
['The intensity of a wave is proportional to','amplitude','amplitude squared','wavelength only','phase only',1,'Wave intensity is proportional to the square of its amplitude: I∝A².'],
['Two waves have amplitudes 3 units and 4 units and are in phase. Resultant amplitude is','1 unit','5 units','7 units','12 units',2,'For constructive interference, R=3+4=7 units.'],
['Two equal-amplitude waves have phase difference π/2. Their resultant amplitude is','0','A','√2A','2A',2,'R=2A cos(π/4)=√2A.'],
['For stable interference fringes, the sources should be','incoherent','coherent with a constant phase difference','of different frequencies','random in phase',1,'Coherent sources maintain a constant phase difference and frequency.'],
['In Young’s double-slit experiment, the central fringe is','dark always','bright for equal path lengths','absent','always red',1,'At the central point the path difference is zero, producing constructive interference.'],
['The fringe width in Young’s double-slit experiment is','β=dD/λ','β=λD/d','β=λd/D','β=D/(λd)',1,'The fringe width is β=λD/d, where D is screen distance and d is slit separation.'],
['If wavelength is doubled while D and d remain constant, fringe width','halves','remains unchanged','doubles','becomes zero',2,'Since β=λD/d, doubling λ doubles β.'],
['If slit separation d is doubled while λ and D remain constant, fringe width','doubles','halves','quadruples','remains unchanged',1,'Since β is inversely proportional to d, doubling d halves the fringe width.'],
['If λ=600 nm, D=1 m and d=0.5 mm, fringe width is','0.6 mm','1.2 mm','1.8 mm','2.4 mm',1,'β=λD/d=(600×10⁻⁹×1)/(0.5×10⁻³)=1.2×10⁻³ m=1.2 mm.'],
['Which condition gives a dark fringe in Young’s experiment?','Path difference nλ','Path difference (2n+1)λ/2','Path difference 2nλ','Path difference zero',1,'Destructive interference occurs when path difference is an odd multiple of λ/2.']
];
let i=0,score=0,answered=false;const $=x=>document.getElementById(x);
function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}
function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}
function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}
$('next').onclick=next;render();
</script></body></html>
