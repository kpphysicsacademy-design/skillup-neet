<script>
(function(){
'use strict';
const questions = [{"q":"For an ideal gas, internal energy is the sum of the energies of its molecules. In the ideal-gas model, this is mainly:","o":["Intermolecular potential energy","Molecular kinetic energy","Chemical bond energy","Gravitational energy"],"a":1,"e":"Ideal-gas molecules are treated as having negligible intermolecular forces, so internal energy is their molecular kinetic energy."},{"q":"The internal energy of a fixed amount of ideal gas depends only on:","o":["Pressure only","Volume only","Absolute temperature","Container shape"],"a":2,"e":"For an ideal gas, internal energy is a function of absolute temperature only."},{"q":"For a monatomic ideal gas, internal energy is:","o":["\\(U=nRT\\)","\\(U=\\frac{3}{2}nRT\\)","\\(U=\\frac{5}{2}nRT\\)","\\(U=3nRT\\)"],"a":1,"e":"A monatomic ideal gas has three translational degrees of freedom, giving \\(U=\\frac{3}{2}nRT\\)."},{"q":"For a monatomic ideal gas, internal energy can also be written as:","o":["\\(U=\\frac{3}{2}PV\\)","\\(U=PV\\)","\\(U=\\frac{5}{2}PV\\)","\\(U=3PV\\)"],"a":0,"e":"Using \\(PV=nRT\\) in \\(U=\\frac{3}{2}nRT\\) gives \\(U=\\frac{3}{2}PV\\)."},{"q":"If the absolute temperature of a monatomic ideal gas doubles, its internal energy becomes:","o":["Half","Twice","Four times","Unchanged"],"a":1,"e":"For a fixed amount of monatomic ideal gas, \\(U\\propto T\\). Doubling temperature doubles internal energy."},{"q":"The SI unit of internal energy is:","o":["Watt","Pascal","Joule","Kelvin"],"a":2,"e":"Internal energy is energy, measured in joules (J)."},{"q":"For an ideal gas undergoing an isothermal process, the change in internal energy is:","o":["Positive","Negative","Zero","Always equal to work"],"a":2,"e":"Temperature is constant in an isothermal process. Since ideal-gas internal energy depends only on temperature, \\(\\Delta U=0\\)."},{"q":"A gas is heated at constant volume. If its temperature rises, its internal energy:","o":["Increases","Decreases","Remains unchanged","Must become zero"],"a":0,"e":"The temperature rises, so the average molecular kinetic energy and the ideal gas's internal energy increase."},{"q":"For an ideal gas, the change in internal energy is related to temperature change by:","o":["\\(\\Delta U=nC_V\\Delta T\\)","\\(\\Delta U=P/\\Delta T\\)","\\(\\Delta U=V\\Delta T\\)","\\(\\Delta U=nR/\\Delta T\\)"],"a":0,"e":"For a fixed amount of ideal gas, \\(\\Delta U=nC_V\\Delta T\\), where \\(C_V\\) is molar heat capacity at constant volume."},{"q":"For one mole of a monatomic ideal gas, the molar heat capacity at constant volume is:","o":["\\(R\\)","\\(\\frac{3}{2}R\\)","\\(\\frac{5}{2}R\\)","\\(3R\\)"],"a":1,"e":"For a monatomic ideal gas, \\(C_V=\\frac{3}{2}R\\)."},{"q":"For a diatomic ideal gas at ordinary temperatures, neglecting vibration, the internal energy is approximately:","o":["\\(\\frac{3}{2}nRT\\)","\\(\\frac{5}{2}nRT\\)","\\(\\frac{7}{2}nRT\\)","\\(\\frac{1}{2}nRT\\)"],"a":1,"e":"A diatomic gas has three translational and two rotational active degrees of freedom, so \\(U=\\frac{5}{2}nRT\\)."},{"q":"For an ideal gas, intermolecular potential energy is assumed to be:","o":["Very large","Equal to kinetic energy","Negligible","Always negative"],"a":2,"e":"The ideal-gas model neglects intermolecular interactions except during collisions."},{"q":"A gas has unchanged temperature during a process. For an ideal gas, its internal energy change is:","o":["\\(nRT\\)","\\(PV\\)","Zero","Dependent on pressure change only"],"a":2,"e":"With no temperature change, the internal energy of an ideal gas does not change."},{"q":"If a monatomic ideal gas has \\(n=2\\) mol and \\(T=300\\) K, its internal energy is:","o":["\\(300R\\)","\\(600R\\)","\\(900R\\)","\\(1800R\\)"],"a":2,"e":"\\(U=\\frac{3}{2}nRT=\\frac{3}{2}(2)R(300)=900R\\) joules."},{"q":"If an ideal gas's temperature decreases, its internal energy generally:","o":["Increases","Decreases","Stays fixed","Becomes infinite"],"a":1,"e":"For a fixed amount of ideal gas, internal energy decreases when absolute temperature decreases."},{"q":"Which statement is true for an ideal gas?","o":["Internal energy depends on pressure alone","Internal energy depends on volume alone","Internal energy depends only on temperature","Internal energy is always zero"],"a":2,"e":"The ideal-gas internal energy is determined by temperature, not independently by pressure or volume."},{"q":"During free expansion of an ideal gas into a vacuum in an insulated container, the temperature change is ideally:","o":["Always positive","Always negative","Zero","Infinite"],"a":2,"e":"For free expansion into vacuum in an insulated system, no heat or work is exchanged. Thus \\(\\Delta U=0\\); for an ideal gas this means \\(\\Delta T=0\\)."},{"q":"In the first law convention \\(\\Delta U=Q-W\\), \\(W\\) represents:","o":["Work done on the gas","Work done by the gas","Heat lost by the gas only","Internal energy per mole"],"a":1,"e":"With this convention, \\(W\\) is work done by the gas, so energy supplied as heat can increase internal energy or be used for work."},{"q":"A gas absorbs 500 J of heat and does 200 J of work. Its internal energy change is:","o":["200 J","300 J","500 J","700 J"],"a":1,"e":"Using \\(\\Delta U=Q-W\\), \\(\\Delta U=500-200=300\\) J."},{"q":"A gas loses 100 J of heat and 40 J of work is done on it. The internal energy change is:","o":["−140 J","−60 J","+60 J","+140 J"],"a":1,"e":"Here \\(Q=-100\\) J and work done by the gas is \\(W=-40\\) J. Thus \\(\\Delta U=Q-W=-100-(-40)=-60\\) J."},{"q":"For an ideal gas, the average translational kinetic energy per molecule is:","o":["\\(k_BT\\)","\\(\\frac{1}{2}k_BT\\)","\\(\\frac{3}{2}k_BT\\)","\\(3k_BT\\)"],"a":2,"e":"The mean translational kinetic energy per molecule is \\(\\frac{3}{2}k_BT\\)."},{"q":"The internal energy of an ideal gas with more molecules at the same temperature is:","o":["Smaller","Larger","Always zero","Independent of molecule number"],"a":1,"e":"For the same gas and temperature, total internal energy is proportional to the amount of gas."},{"q":"For a monatomic ideal gas, if \\(PV=400\\) J, the internal energy is:","o":["200 J","400 J","600 J","800 J"],"a":2,"e":"For a monatomic ideal gas, \\(U=\\frac{3}{2}PV=600\\) J."},{"q":"Which process keeps the internal energy of an ideal gas constant?","o":["Any isothermal process","Any isobaric process","Any isochoric process","Any adiabatic process"],"a":0,"e":"For an ideal gas, constant temperature means constant internal energy, regardless of the path."},{"q":"For a fixed amount of ideal gas, if temperature rises from \\(T\\) to \\(3T\\), internal energy:","o":["Becomes \\(U/3\\)","Remains \\(U\\)","Becomes \\(3U\\)","Becomes \\(9U\\)"],"a":2,"e":"Because \\(U\\propto T\\) for a fixed ideal gas, tripling the absolute temperature triples internal energy."},{"q":"Which factor does not directly determine the internal energy of a fixed amount of ideal gas?","o":["Absolute temperature","Number of moles","Type of gas and its active degrees of freedom","Container color"],"a":3,"e":"Container color has no role in the ideal-gas internal-energy model."},{"q":"For a rigid, insulated container holding an ideal gas, no energy crosses the boundary. The internal energy change is:","o":["Positive","Negative","Zero","Equal to pressure"],"a":2,"e":"No heat transfer and no boundary work occur, so the first law gives \\(\\Delta U=0\\)."},{"q":"For an ideal gas, internal energy is a state function. This means it depends on:","o":["The path followed only","Initial and final states","The rate of heating","Container material"],"a":1,"e":"A state function's change depends only on the initial and final states, not on the process path."},{"q":"If the internal energy of an ideal gas increases while the amount of gas stays fixed, its absolute temperature:","o":["Must increase","Must decrease","Must remain constant","Cannot be related to energy"],"a":0,"e":"For a fixed amount of ideal gas, internal energy increases with absolute temperature."},{"q":"Which expression gives the internal energy of an ideal gas with \\(f\\) active degrees of freedom?","o":["\\(U=fnRT\\)","\\(U=\\frac{f}{2}nRT\\)","\\(U=\\frac{2}{f}nRT\\)","\\(U=nR/T\\)"],"a":1,"e":"By equipartition, each active quadratic degree of freedom contributes \\(\\frac{1}{2}k_BT\\) per molecule, giving \\(U=\\frac{f}{2}nRT\\)."}];

const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';

 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);

 });
 if(window.MathJax?.typesetPromise) MathJax.typesetPromise([$('question'), $('options')].filter(Boolean)).catch(()=>{});

$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];

 const f=$('feedback');

 $('check').style.display='none';$('continue').className='btn continue show';
 if(window.MathJax?.typesetPromise) MathJax.typesetPromise([$ ('feedback')]).catch(()=>{});
});

 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';

   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }

});
