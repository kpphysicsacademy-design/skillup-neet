*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}

.hero,.quiz,.finish{background:#fff;border:2px solid #e2edf7;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 #dce8f3}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#174a78}.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}
.progress-row{display:flex;justify-content:space-between;gap:10px;margin:16px 0 7px;font-size:12px;font-weight:900;color:var(--muted)}
.track{height:11px;border-radius:99px;background:#e2edf7;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}
.qmeta{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.4px}

.options{display:grid;gap:10px}.option{display:flex;gap:11px;align-items:center;width:100%;min-height:51px;padding:12px;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}
.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🌡️ Internal Energy</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[{"q":"What does internal energy represent?","o":["Energy of the system's microscopic particles","Only the motion of the whole system","Only gravitational potential energy","Energy transferred per second"],"a":0,"e":"Internal energy is the microscopic kinetic and potential energy of the particles."},{"q":"For an ideal gas, internal energy depends primarily on…","o":["Temperature","Pressure alone","Volume alone","Container shape"],"a":0,"e":"For an ideal gas, internal energy is a function of temperature."},{"q":"Which symbol commonly represents internal energy?","o":["Q","U","P","W"],"a":1,"e":"Internal energy is commonly represented by U."},{"q":"What is the SI unit of internal energy?","o":["Pascal","Joule","Kelvin","Watt"],"a":1,"e":"Internal energy is energy, measured in joules."},{"q":"The first law of thermodynamics, when W is work done by the system, is…","o":["ΔU = Q − W","ΔU = W − Q","ΔU = QW","ΔU = P/V"],"a":0,"e":"The change in internal energy equals heat supplied minus work done by the system."},{"q":"If a system receives 500 J of heat and does 200 J of work, its internal-energy change is…","o":["+700 J","+300 J","−300 J","−700 J"],"a":1,"e":"ΔU = Q − W = 500 − 200 = +300 J."},{"q":"If a gas loses 100 J of heat and does no work, ΔU is…","o":["+100 J","−100 J","0 J","−200 J"],"a":1,"e":"Heat leaving means Q = −100 J; with W = 0, ΔU = −100 J."},{"q":"For an ideal gas in an isothermal process, the change in internal energy is…","o":["Positive","Negative","Zero","Always equal to work"],"a":2,"e":"An ideal gas's internal energy depends on temperature, which is constant in an isothermal process."},{"q":"During adiabatic expansion when a gas does work, internal energy generally…","o":["Increases","Decreases","Remains constant","Becomes infinite"],"a":1,"e":"No heat enters in an adiabatic process, so work is supplied by a decrease in internal energy."},{"q":"During adiabatic compression of an ideal gas, internal energy generally…","o":["Increases","Decreases","Remains constant always","Becomes zero"],"a":0,"e":"Work done on the gas raises its internal energy and temperature."},{"q":"Is internal energy a state function?","o":["Yes","No, it depends on the path","Only during expansion","Only at constant pressure"],"a":0,"e":"Internal energy is determined by the thermodynamic state, not the path taken."},{"q":"Are heat and work state functions?","o":["Both are state functions","Neither is a state function","Only heat is a state function","Only work is a state function"],"a":1,"e":"Heat and work describe energy transfer during a process and depend on the path."},{"q":"For a monatomic ideal gas, internal energy is…","o":["U = 3/2 nRT","U = nRT/2 only in all cases","U = PV²","U = P + V"],"a":0,"e":"For a monatomic ideal gas, U = (3/2)nRT."},{"q":"For n moles of a monatomic ideal gas, the change in internal energy is…","o":["ΔU = nRΔT","ΔU = (3/2)nRΔT","ΔU = PΔV only","ΔU = 0 always"],"a":1,"e":"For a monatomic ideal gas, ΔU = (3/2)nRΔT."},{"q":"If the temperature of an ideal gas rises, its internal energy…","o":["Rises","Falls","Must remain constant","Becomes negative"],"a":0,"e":"Higher temperature means greater average molecular kinetic energy and greater internal energy."},{"q":"At the same temperature, two samples of the same ideal gas have equal internal energy if they have the same…","o":["Amount of gas","Container shape","Pressure only","Volume only"],"a":0,"e":"For the same ideal gas, internal energy depends on temperature and amount of substance."},{"q":"In a rigid container, heat supplied to a gas with no other work causes…","o":["ΔU = Q","ΔU = −Q","ΔU = 0 always","W = Q"],"a":0,"e":"At fixed volume, boundary work is zero, so the first law gives ΔU = Q."},{"q":"Which microscopic contributions are included in internal energy?","o":["Random molecular kinetic and intermolecular potential energy","Only the system's bulk motion","Only external gravitational energy","Only electrical energy from a battery"],"a":0,"e":"Internal energy includes microscopic kinetic and potential contributions."},{"q":"A system completes a cycle and returns to its initial state. Its net change in internal energy is…","o":["Positive","Negative","Zero","Equal to total heat always"],"a":2,"e":"Internal energy is a state function, so returning to the initial state gives ΔU = 0."},{"q":"For a complete thermodynamic cycle, what relation follows from ΔU = 0?","o":["Net heat supplied equals net work done by the system","Net heat must be zero","Net work must be zero","Pressure must be constant"],"a":0,"e":"Over a cycle, the first law gives 0 = Qnet − Wnet, so Qnet = Wnet."},{"q":"If 300 J of work is done on a system and it receives 100 J of heat, ΔU is…","o":["+400 J","−200 J","+200 J","−400 J"],"a":0,"e":"Work done on the system means W by system = −300 J; ΔU = 100 − (−300) = +400 J."},{"q":"If a system absorbs 250 J of heat and 250 J of work is done by it, ΔU is…","o":["0 J","+500 J","−500 J","+250 J"],"a":0,"e":"ΔU = Q − W = 250 − 250 = 0 J."},{"q":"Which process has no change in internal energy for an ideal gas?","o":["Any isothermal process","Any isobaric process","Any adiabatic process","Any isochoric process"],"a":0,"e":"For an ideal gas, constant temperature means constant internal energy."},{"q":"Does zero change in internal energy always mean no heat transfer?","o":["Yes","No; heat and work may balance","Only in an adiabatic process","Only at constant volume"],"a":1,"e":"ΔU can be zero when heat supplied equals work done, even though both are nonzero."},{"q":"Which statement about internal energy is correct?","o":["Its absolute value is always directly measured","Its change can be found using the first law","It equals heat transferred in every process","It is always zero for ideal gases"],"a":1,"e":"The first law relates internal-energy change to heat and work."},{"q":"A gas does 80 J of work while 20 J of heat enters. Its internal energy…","o":["Increases by 100 J","Increases by 60 J","Decreases by 60 J","Does not change"],"a":2,"e":"ΔU = Q − W = 20 − 80 = −60 J."},{"q":"Which quantity is not itself a form of energy stored in the system?","o":["Internal energy","Microscopic molecular kinetic energy","Heat transferred across the boundary","Microscopic potential energy"],"a":2,"e":"Heat is energy in transit across a boundary, not a property stored in the system."},{"q":"For an ideal gas, if absolute temperature doubles at fixed amount of gas, internal energy…","o":["Doubles","Halves","Stays constant","Becomes zero"],"a":0,"e":"Ideal-gas internal energy is proportional to absolute temperature for a fixed gas sample."},{"q":"What is the meaning of ΔU?","o":["Heat transfer only","Change in internal energy between two states","Work per unit time","Pressure change"],"a":1,"e":"ΔU is the final internal energy minus the initial internal energy."},{"q":"Which statement best distinguishes internal energy from heat?","o":["Internal energy is a state property; heat is energy transferred during a process","Both are always stored properties","Heat is measured in kelvin","Internal energy depends on the path only"],"a":0,"e":"Internal energy belongs to the system's state; heat describes energy crossing its boundary."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Internal Energy Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
