<style>

:root{--green:#58cc02;--green-dark:#46a302;--blue:#1cb0f6;--ink:#243447;--muted:#64748b;--line:#dce6ef;--bg:#f3f9ff;--red:#ff4b4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}

main{max-width:720px;margin:auto;padding:18px 13px 48px}
.hero,.quiz,.finish{background:#fff;border:2px solid #e2edf7;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 #dce8f3}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#174a78}.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}
.progress-row{display:flex;justify-content:space-between;gap:10px;margin:16px 0 7px;font-size:12px;font-weight:900;color:var(--muted)}
.track{height:11px;border-radius:99px;background:#e2edf7;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}
.qmeta{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.4px}
.question{font-size:clamp(20px,4.5vw,26px);line-height:1.35;margin:12px 0 18px;font-weight:850}
.options{display:grid;gap:10px}.option{display:flex;gap:11px;align-items:center;width:100%;min-height:51px;padding:12px;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}
.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Mobile header refinement: keep branding, XP and streak on one balanced row */
.nav{display:flex;align-items:center;gap:10px;min-height:72px;padding:10px 14px}
.back{flex:0 0 42px;width:42px;height:42px}

@media(max-width:480px){
  .nav{gap:7px;padding:9px 10px;min-height:68px}
  .back{flex-basis:40px;width:40px;height:40px}
  .brand{font-size:17px}
  .brand small{font-size:8px;letter-spacing:.55px}
  .xp{padding:8px 9px;font-size:12px}
  .streak{padding:8px 9px;font-size:11px;max-width:none}
}
@media(max-width:360px){
  .nav{gap:5px;padding-inline:7px}

  .streak{padding:7px;font-size:10px}
}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🌡️ Isobaric Process</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[{"q":"What remains constant in an isobaric process?","o":["Pressure","Volume","Temperature","Internal energy"],"a":0,"e":"Isobaric means constant pressure."},{"q":"Which equation describes the ideal gas law?","o":["PV = nRT","P/V = nRT","PT = nRV","P + V = nRT"],"a":0,"e":"The ideal gas law is PV = nRT."},{"q":"On a P–V diagram, an isobaric process is represented by a…","o":["Vertical line","Horizontal line","Circle","Steep curve only"],"a":1,"e":"Pressure is the vertical axis, so constant pressure is a horizontal line."},{"q":"For constant pressure, boundary work done by a gas is…","o":["W = PΔV","W = VΔP","Always zero","W = ΔU"],"a":0,"e":"At constant pressure, W = ∫P dV = P(V₂ − V₁)."},{"q":"A gas expands at constant pressure. The work done by the gas is generally…","o":["Positive","Negative","Zero","Undefined"],"a":0,"e":"During expansion, ΔV is positive, so PΔV is positive."},{"q":"A gas is compressed at constant pressure. Work done by the gas is…","o":["Positive","Negative","Always zero","Equal to temperature"],"a":1,"e":"Compression has ΔV < 0, so work done by the gas is negative."},{"q":"Which apparatus can approximate an isobaric process?","o":["Gas in a rigid sealed vessel","Gas under a freely moving weighted piston","A sealed rigid steel tank","A fixed-volume flask"],"a":1,"e":"A freely moving piston under a fixed load can keep pressure approximately constant."},{"q":"For an ideal gas at constant pressure, volume is proportional to…","o":["Absolute temperature","Inverse temperature","Pressure squared","Internal energy only"],"a":0,"e":"Charles's law gives V/T = constant at fixed pressure for a fixed amount of gas."},{"q":"If absolute temperature doubles at constant pressure for a fixed amount of ideal gas, its volume…","o":["Halves","Doubles","Stays constant","Becomes zero"],"a":1,"e":"At constant pressure, V is proportional to absolute temperature."},{"q":"During isobaric heating of an ideal gas, its volume generally…","o":["Increases","Decreases","Must remain fixed","Becomes zero"],"a":0,"e":"Heating at fixed pressure raises temperature and therefore volume."},{"q":"During isobaric cooling of an ideal gas, its volume generally…","o":["Increases","Decreases","Must remain fixed","Becomes infinite"],"a":1,"e":"At fixed pressure, lowering temperature reduces volume."},{"q":"Which property defines an isobaric process?","o":["Constant pressure","Constant volume","Constant temperature","Zero heat transfer"],"a":0,"e":"Only pressure is specified as constant by the term isobaric."},{"q":"For a closed ideal gas system, which first-law expression applies when W is work done by the system?","o":["ΔU = Q − W","ΔU = W − Q","Q = 0 always","ΔU = P/V"],"a":0,"e":"The first law with this convention is ΔU = Q − W."},{"q":"In an isobaric expansion, some supplied heat may be used to…","o":["Do expansion work","Prevent all work","Keep volume constant","Make pressure infinite"],"a":0,"e":"Heat can raise internal energy and also provide work as the gas expands."},{"q":"For an ideal gas, internal energy primarily depends on…","o":["Temperature","Pressure alone","Volume alone","Container material"],"a":0,"e":"Ideal-gas internal energy is a function of temperature."},{"q":"At constant pressure, if gas volume increases, its absolute temperature generally…","o":["Increases","Decreases","Stays fixed","Becomes zero"],"a":0,"e":"For a fixed amount of ideal gas, T is proportional to V at constant pressure."},{"q":"What is the SI unit of pressure?","o":["Joule","Pascal","Watt","Kelvin"],"a":1,"e":"Pressure is measured in pascals (Pa), equal to N/m²."},{"q":"A gas expands by 0.02 m³ at a constant pressure of 100 kPa. Work done is…","o":["200 J","2,000 J","20,000 J","0.2 J"],"a":1,"e":"W = PΔV = 100,000 Pa × 0.02 m³ = 2,000 J."},{"q":"A gas expands at 2 × 10⁵ Pa from 0.01 m³ to 0.03 m³. Its work is…","o":["2,000 J","4,000 J","6,000 J","8,000 J"],"a":1,"e":"W = PΔV = 2 × 10⁵ × 0.02 = 4,000 J."},{"q":"Which process has zero boundary work because there is no volume change?","o":["Isobaric expansion","Isochoric process","Isothermal expansion","Free expansion with volume change"],"a":1,"e":"In an isochoric process, ΔV = 0, so boundary work is zero."},{"q":"In an isobaric process, pressure change ΔP equals…","o":["Zero","The volume change","The heat supplied","The internal energy"],"a":0,"e":"Pressure remains constant throughout the process, so ΔP = 0."},{"q":"Which law relates volume and absolute temperature at constant pressure?","o":["Boyle's law","Charles's law","Dalton's law","Hooke's law"],"a":1,"e":"Charles's law states V/T is constant at fixed pressure for a fixed amount of gas."},{"q":"A gas is heated under a movable piston with a fixed load. Why can pressure remain constant?","o":["The piston moves as volume changes","The gas cannot expand","Temperature stays fixed","No heat enters"],"a":0,"e":"The piston adjusts the volume while the external load keeps pressure approximately constant."},{"q":"Which statement comparing isobaric and isochoric processes is correct?","o":["Both keep pressure constant","Isobaric keeps pressure constant; isochoric keeps volume constant","Isobaric has no work","Isochoric always has constant temperature"],"a":1,"e":"The constant properties differ: pressure for isobaric, volume for isochoric."},{"q":"For constant pressure, which expression gives the work if pressure is measured in pascals and volume in cubic metres?","o":["PΔV in joules","P/ΔV in kelvin","ΔV/P in watts","P + ΔV in joules"],"a":0,"e":"Pa·m³ equals N/m² × m³ = N·m = J."},{"q":"If 600 J of heat enters a gas and it does 200 J of work, the internal-energy change is…","o":["+800 J","+400 J","−400 J","−800 J"],"a":1,"e":"ΔU = Q − W = 600 − 200 = +400 J."},{"q":"At constant pressure, the volume of a fixed amount of ideal gas changes from 3 L to 5 L. ΔV is…","o":["−2 L","+2 L","+8 L","0 L"],"a":1,"e":"ΔV = V₂ − V₁ = 5 − 3 = +2 L."},{"q":"Which statement about isobaric heating is true?","o":["No work is done","Volume may increase as temperature rises","Pressure must rise","Temperature must remain constant"],"a":1,"e":"A movable boundary can expand to maintain pressure while the gas warms."},{"q":"If pressure is 50 kPa and the gas expands by 0.04 m³ at constant pressure, the work is…","o":["200 J","2,000 J","20,000 J","0 J"],"a":1,"e":"W = 50,000 Pa × 0.04 m³ = 2,000 J."},{"q":"What is the safest definition of an isobaric process?","o":["A process with no heat transfer","A process at constant pressure","A process at constant volume","A process at constant temperature"],"a":1,"e":"Isobaric means pressure remains constant; temperature and volume may change."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Isobaric Process Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
