<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Isobaric Process</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#203040;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:22px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:#123b70}.xp{font-weight:950;color:#1677ff}.hero{margin-top:14px;background:linear-gradient(135deg,#123b70,#1677ff);color:#fff;border-radius:24px;padding:22px}.hero h1{margin:5px 0 7px;font-size:clamp(28px,6vw,40px)}.hero p{margin:0;line-height:1.5;font-size:13px}.card{background:#fff;border:1px solid #d9e5f2;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 7px 20px rgba(18,59,112,.07)}.bar{height:10px;background:#e5edf6;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;width:0;background:#1677ff;transition:.3s}.qno{font-size:12px;color:#6b7280;font-weight:900}.q{font-size:20px;font-weight:900;line-height:1.4;margin:9px 0 16px}button.opt{display:block;width:100%;text-align:left;background:#fff;color:#203040;border:2px solid #dfe8f1;border-radius:14px;padding:14px;margin:10px 0;font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}button.opt.selected{border-color:#1677ff;background:#eef6ff;color:#123b70}button.opt.correct{border-color:#16803a;background:#eaf8ef;color:#145c2e}button.opt.wrong{border-color:#d64545;background:#fff0f0;color:#8f2020}.actions{display:flex;justify-content:flex-end;margin-top:15px}.continue{border:0;border-radius:13px;padding:12px 20px;background:#1677ff;color:#fff;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #0d5bbf}.continue:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}.feedback{min-height:25px;margin-top:13px;font-weight:800}.explain{margin-top:6px;color:#596774;font-weight:600}.back{display:block;width:max-content;margin:18px auto 0;padding:10px 15px;border:2px solid #d9e5f2;border-radius:12px;background:#fff;color:#1264d6;text-decoration:none;font-weight:900}.result{text-align:center}.score{font-size:34px;font-weight:950;color:#123b70}@media(max-width:520px){.wrap{padding:15px 10px 50px}.q{font-size:18px}button.opt{font-size:14px;padding:13px}}</style></head><body><main class="wrap"><div class="top"><div class="brand">⚛️ SkillUp Physics<br><small>NEET 2026 • 15 MCQ QUIZ</small></div><div class="xp" id="xp">XP: 0</div></div><section class="hero"><div>🔥 THERMODYNAMICS</div><h1>Isobaric Process</h1><p>15-question MCQ quiz on constant-pressure processes, work, heat and the first law.</p></section><section class="card"><strong>🏆 Quiz Progress <span id="mastery">0 / 15</span></strong><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card" id="quiz"><div class="qno" id="qno"></div><div class="q" id="question"></div><div id="opts"></div><div class="actions"><button class="continue" id="continue" type="button" disabled>Check Answer →</button></div><div class="feedback" id="feedback"></div></section><section class="card result" id="result" hidden></section><a class="back" href="physics-home-fast.html">← 📚 Back to Physics Path</a></main><script>const questions=[
{q:'In an isobaric process, which quantity remains constant?',o:['Volume','Pressure','Temperature','Internal energy'],a:1,e:'Isobaric means constant pressure.'},
{q:'The work done by a gas in an isobaric expansion from V₁ to V₂ is',o:['P(V₂−V₁)','V₂−V₁','P/(V₂−V₁)','zero'],a:0,e:'At constant pressure, W = PΔV = P(V₂−V₁).'},

{q:'For an ideal gas undergoing isobaric heating, its volume',o:['decreases','increases','remains constant','becomes zero'],a:1,e:'At constant pressure, V is proportional to absolute temperature.'},
{q:'For an ideal gas at constant pressure, if absolute temperature doubles, volume',o:['halves','doubles','becomes four times','remains unchanged'],a:1,e:'Charles’ law: V/T is constant at fixed pressure.'},
{q:'The first law of thermodynamics is',o:['Q = W − ΔU','Q = ΔU + W','W = Q + ΔU','ΔU = Q + W'],a:1,e:'Using the convention W as work done by the gas, Q = ΔU + W.'},
{q:'For one mole of an ideal gas in an isobaric process, the work done is',o:['RΔT','CvΔT','CpΔT','zero'],a:0,e:'W = PΔV = RΔT for one mole of an ideal gas.'},
{q:'For an ideal gas, heat supplied during an isobaric process is',o:['nCvΔT','nCpΔT','nRΔT/2','zero'],a:1,e:'At constant pressure, Q = nCpΔT.'},
{q:'For an ideal gas, the relation between molar heat capacities is',o:['Cp−Cv=R','Cp+Cv=R','Cp/Cv=R','CpCv=R'],a:0,e:'Mayer’s relation: Cp − Cv = R.'},

];let i=0,selected=null,checked=false,score=0;const $=id=>document.getElementById(id);function render(){selected=null;checked=false;$('feedback').textContent='';$('continue').disabled=true;$('continue').textContent=i===14?'Finish Quiz →':'Check Answer →';$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=questions[i].q;$('opts').innerHTML='';questions[i].o.forEach((text,n)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+n)+'. '+text;b.dataset.index=n;b.onclick=()=>{if(checked)return;selected=n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('continue').disabled=false};$('opts').appendChild(b)});$('mastery').textContent=`${i} / 15`;$('fill').style.width=`${i/15*100}%`;$('xp').textContent=`XP: ${score*10}`}function next(){if(selected===null)return;if(!checked){checked=true;const item=questions[i],ok=selected===item.a;if(ok)score++;document.querySelectorAll('.opt').forEach(b=>{const n=+b.dataset.index;b.disabled=true;if(n===item.a)b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+`<div class="explain">${item.e}</div>`;$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=`${(i+1)/15*100}%`;$('xp').textContent=`XP: ${score*10}`}else if(i<14){i++;render()}else finish()}function finish(){$('quiz').hidden=true;$('result').hidden=false;const pct=Math.round(score/15*100);$('result').innerHTML=`<h2>🎉 Isobaric Process Complete!</h2><div class="score">${score} / 15</div><p><strong>${pct}%</strong> accuracy</p><p>🏆 You earned <strong>${score*10} XP</strong>.</p><p>${score>=12?'🔥 Excellent NEET readiness!':score>=9?'💪 Good work. Revise and retry for mastery.':'📚 Revise isobaric processes and try again.'}</p><button class="continue" type="button" onclick="location.reload()">Retry 15 MCQs</button>`}$('continue').onclick=next;render();</script></
