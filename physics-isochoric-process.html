.hero,.quiz,.finish{background:#fff;border:2px solid #e2edf7;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 #dce8f3}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#174a78}.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}
.progress-row{display:flex;justify-content:space-between;gap:10px;margin:16px 0 7px;font-size:12px;font-weight:900;color:var(--muted)}
.track{height:11px;border-radius:99px;background:#e2edf7;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}

.options{display:grid;gap:10px}.option{display:flex;gap:11px;align-items:center;width:100%;min-height:51px;padding:12px;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}
.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🌡️ Isochoric Process</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[{"q":"What remains constant in an isochoric process?","o":["Pressure","Volume","Temperature","Internal energy"],"a":1,"e":"Isochoric means constant volume."},{"q":"Which other name is commonly used for an isochoric process?","o":["Isobaric","Isothermal","Isovolumetric","Adiabatic"],"a":2,"e":"Isochoric processes are also called isovolumetric processes."},{"q":"In a rigid, sealed container, a gas is heated. Which process is approximated?","o":["Isochoric","Isobaric","Isothermal","Expansion at constant pressure"],"a":0,"e":"A rigid container prevents the gas volume from changing."},{"q":"For a quasi-static isochoric process, what is the boundary work done by the gas?","o":["Maximum","Zero","Equal to heat supplied","Always negative"],"a":1,"e":"Boundary work W = ∫P dV; with dV = 0, W = 0."},{"q":"Using ΔU = Q − W, what is the first-law result for an isochoric process?","o":["ΔU = Q","ΔU = −Q","ΔU = W","ΔU = 0 always"],"a":0,"e":"Since boundary work is zero, heat supplied changes internal energy: ΔU = Q."},{"q":"If heat is added to an ideal gas at constant volume, its internal energy generally…","o":["Decreases","Increases","Stays unchanged","Becomes zero"],"a":1,"e":"At constant volume, added heat raises the ideal gas's internal energy."},{"q":"For a fixed amount of ideal gas at constant volume, pressure is proportional to…","o":["Temperature in kelvin","Volume","1/temperature","Mass squared"],"a":0,"e":"At fixed volume, the ideal-gas law gives P ∝ T in kelvin."},{"q":"A gas in a rigid container is cooled. Its pressure generally…","o":["Rises","Falls","Must stay constant","Becomes infinite"],"a":1,"e":"At fixed volume, lowering temperature lowers ideal-gas pressure."},{"q":"Which equation describes the ideal gas law?","o":["PV = nRT","P/V = nRT","PT = nRV","P + V = nRT"],"a":0,"e":"The ideal gas law is PV = nRT."},{"q":"On a P–V diagram, an isochoric process is shown by a…","o":["Horizontal line","Vertical line","Curved line only","Point with no path"],"a":1,"e":"Volume is on the horizontal axis, so constant volume is a vertical line."},{"q":"In an isochoric process, the volume change ΔV equals…","o":["Positive value","Negative value","Zero","Pressure"],"a":2,"e":"The volume remains fixed, so ΔV = 0."},{"q":"For an ideal gas, what is the work W = ∫P dV in a constant-volume process?","o":["PΔV","Zero","nRT","Always positive"],"a":1,"e":"Because dV = 0 throughout, the boundary work is zero."},{"q":"If 500 J of heat is added to a gas at constant volume and no other work occurs, ΔU is…","o":["−500 J","0 J","+500 J","+1000 J"],"a":2,"e":"With W = 0, the first law gives ΔU = Q = +500 J."},{"q":"If 200 J of heat leaves a closed gas at constant volume, ΔU is…","o":["+200 J","−200 J","0 J","−400 J"],"a":1,"e":"Heat leaving means Q = −200 J; with W = 0, ΔU = −200 J."},{"q":"Which condition makes a process isochoric?","o":["A movable frictionless piston at fixed pressure","A rigid container with fixed volume","A cylinder held at fixed temperature","A thermally insulated moving piston"],"a":1,"e":"Rigid walls prevent volume change."},{"q":"Does constant volume necessarily mean constant pressure?","o":["Yes, always","No, pressure may change with temperature","Only for liquids","Only when heat is added"],"a":1,"e":"At fixed volume, pressure changes if the gas temperature changes."},{"q":"For a fixed amount of ideal gas at constant volume, which ratio remains constant?","o":["P/T","P×T","P/V","T/V only"],"a":0,"e":"From PV = nRT with fixed V and n, P/T is constant."},{"q":"During heating at constant volume, what happens to the gas's boundary work?","o":["It increases","It decreases","It remains zero","It equals the heat"],"a":2,"e":"No volume displacement occurs, so boundary work remains zero."},{"q":"Which is a practical approximation to an isochoric process?","o":["Gas expanding under a piston","Heating gas in a rigid sealed vessel","Air escaping from a balloon","Gas expanding freely into a vacuum"],"a":1,"e":"A rigid sealed vessel holds volume fixed while the gas is heated."},{"q":"For an ideal gas, internal energy is primarily a function of…","o":["Temperature","Container shape","Pressure alone","Volume alone"],"a":0,"e":"For an ideal gas, internal energy depends on temperature."},{"q":"A vertical line moving upward on a P–V diagram represents increasing pressure at…","o":["Constant pressure","Constant volume","Constant temperature necessarily","Zero temperature"],"a":1,"e":"A vertical path has the same volume while pressure rises."},{"q":"Which statement about an isochoric process is correct?","o":["No heat can be transferred","No boundary work is done","Temperature must remain constant","Pressure must remain constant"],"a":1,"e":"Constant volume eliminates boundary work, but heat transfer can occur."},{"q":"A gas is cooled at fixed volume. For an ideal gas, its temperature and pressure…","o":["Both generally fall","Both generally rise","Temperature rises, pressure falls","Both remain constant"],"a":0,"e":"At fixed volume, pressure is proportional to absolute temperature."},{"q":"A closed system undergoes a constant-volume process and receives heat. Assuming only pressure-volume work is possible, what is true?","o":["Work is positive","Work is negative","Work is zero and ΔU = Q","ΔU must be zero"],"a":2,"e":"With no volume change, boundary work is zero and the first law gives ΔU = Q."},{"q":"Which thermodynamic property is held fixed by the word 'isochoric'?","o":["Entropy","Enthalpy","Volume","Pressure"],"a":2,"e":"The prefix refers to equal or unchanged volume."},{"q":"In a rigid container, why can pressure rise when heat is supplied?","o":["The container expands","Gas molecules have greater average kinetic energy","The number of molecules must increase","The volume increases"],"a":1,"e":"Heating raises molecular kinetic energy, increasing pressure at fixed volume."},{"q":"For a fixed amount of ideal gas, if absolute temperature doubles at constant volume, pressure…","o":["Halves","Doubles","Stays the same","Quadruples"],"a":1,"e":"Since P/T is constant at fixed volume, doubling T doubles P."},{"q":"Which process has zero boundary work despite possible heat transfer?","o":["Isobaric expansion","Isochoric heating","Isothermal expansion","Adiabatic expansion"],"a":1,"e":"Isochoric heating has no volume change, so boundary work is zero."},{"q":"For an isochoric process, which statement about heat and internal energy is valid under the usual first-law sign convention?","o":["Q = ΔU when only P–V work is present","Q = −ΔU always","Q = 0 always","ΔU = W always"],"a":0,"e":"With W = 0, the first law gives ΔU = Q."},{"q":"Which pair correctly matches process and constant property?","o":["Isochoric—pressure","Isobaric—volume","Isochoric—volume","Isothermal—heat transfer"],"a":2,"e":"Isochoric means constant volume; isobaric means constant pressure and isothermal means constant temperature."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Isochoric Process Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
