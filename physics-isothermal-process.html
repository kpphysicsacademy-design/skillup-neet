.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🌡️ Isothermal Process</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[{"q":"What is an isothermal process?","o":["A process at constant temperature","A process at constant pressure","A process at constant volume","A process with no heat transfer"],"a":0,"e":"Isothermal means the temperature remains constant throughout the process."},{"q":"What does the word 'iso' mean in isothermal?","o":["Same or constant","Increasing","Decreasing","Zero"],"a":0,"e":"The prefix 'iso' means equal or constant; thermal refers to temperature."},{"q":"Which state variable stays constant in an isothermal process?","o":["Temperature","Pressure","Volume","Internal energy in every substance"],"a":0,"e":"Temperature remains constant, while pressure and volume may change."},{"q":"For a fixed amount of ideal gas, which equation applies during an isothermal change?","o":["P₁V₁ = P₂V₂","P₁/T₁ = P₂/T₂ only","V₁/T₁ = V₂/T₂ only","P + V = constant"],"a":0,"e":"From PV = nRT, with n and T constant, PV remains constant."},{"q":"On a P–V diagram, an ideal-gas isotherm is typically…","o":["A downward-curving hyperbola","A vertical line always","A horizontal line always","A circle"],"a":0,"e":"For constant temperature, P = nRT/V, so pressure decreases as volume increases."},{"q":"For an ideal gas, the internal energy change in an isothermal process is…","o":["Zero","Always positive","Always negative","Equal to pressure"],"a":0,"e":"Ideal-gas internal energy depends only on temperature; constant temperature gives ΔU = 0."},{"q":"If an ideal gas expands isothermally, its volume…","o":["Increases","Decreases","Must stay constant","Becomes zero"],"a":0,"e":"Expansion means the final volume is greater than the initial volume."},{"q":"During isothermal expansion of an ideal gas, pressure generally…","o":["Decreases","Increases","Remains constant in all cases","Becomes infinite"],"a":0,"e":"Since PV is constant, an increase in volume requires a decrease in pressure."},{"q":"Does an isothermal process necessarily have zero heat transfer?","o":["No; heat may enter or leave","Yes, always","Only for a solid","Only in a vacuum"],"a":0,"e":"Heat can flow to keep the gas temperature constant while it does work or has work done on it."},{"q":"For an ideal gas in an isothermal process, the first law implies that heat supplied equals…","o":["Work done by the gas","Change in internal energy only","Pressure times temperature","Zero in every case"],"a":0,"e":"Using ΔU = Q − W and ΔU = 0, heat supplied Q equals work done by the gas W."},{"q":"For a reversible isothermal expansion of an ideal gas, work is…","o":["W = nRT ln(V₂/V₁)","W = 0 always","W = P₁ + P₂","W = nCvΔT only"],"a":0,"e":"Integrating P = nRT/V gives W = nRT ln(V₂/V₁) for reversible expansion."},{"q":"In the expression W = nRT ln(V₂/V₁), T must be measured in…","o":["Kelvin","Celsius only","Fahrenheit only","Any scale without conversion"],"a":0,"e":"Gas-law temperature must be absolute temperature in kelvin."},{"q":"If V₂ is greater than V₁ in reversible isothermal expansion, ln(V₂/V₁) is…","o":["Positive","Negative","Zero","Undefined"],"a":0,"e":"The ratio V₂/V₁ is greater than one, so its natural logarithm is positive."},{"q":"If an ideal gas is compressed isothermally, work done by the gas is…","o":["Negative","Positive","Always zero","Always infinite"],"a":0,"e":"Compression has dV < 0, so W by gas = ∫P dV is negative."},{"q":"For an ideal gas, an isothermal process has which temperature change?","o":["ΔT = 0","ΔT > 0 always","ΔT < 0 always","ΔT = 273 K always"],"a":0,"e":"Constant temperature means the initial and final temperatures are equal."},{"q":"Which condition helps maintain an ideal gas isothermally during slow expansion?","o":["Thermal contact with a reservoir at the same temperature","Perfect insulation in every case","A rigid container only","Removing all pressure"],"a":0,"e":"Heat can flow from a reservoir to replace energy transferred as work, keeping temperature constant."},{"q":"Isothermal and adiabatic mean the same thing. True or false?","o":["False","True","Only at high pressure","Only for liquids"],"a":0,"e":"Isothermal means constant temperature; adiabatic means no heat transfer."},{"q":"Which statement about a real gas is most accurate?","o":["Its internal energy may depend on variables besides temperature","Its internal energy always depends only on temperature","Its temperature must be zero","It cannot expand isothermally"],"a":0,"e":"The internal energy of a real gas can depend on volume as well as temperature."},{"q":"For an ideal gas, which product stays constant in an isothermal process?","o":["PV","PT","VT","P + V"],"a":0,"e":"With fixed amount of gas and constant T, PV = nRT is constant."},{"q":"A gas has P₁ = 200 kPa and V₁ = 2 L. If it expands isothermally to 4 L, its final pressure is…","o":["100 kPa","200 kPa","400 kPa","50 kPa"],"a":0,"e":"P₁V₁ = P₂V₂, so P₂ = (200 × 2)/4 = 100 kPa."},{"q":"For a reversible isothermal ideal-gas process, what is true of the gas temperature at every point?","o":["It remains the same","It rises continuously","It falls continuously","It alternates between zero and infinity"],"a":0,"e":"An isothermal path has the same temperature at all points."},{"q":"During isothermal expansion, how can the gas do work without cooling if it is ideal?","o":["It absorbs heat that balances the work output","It creates energy","Its internal energy increases continuously","No work is done"],"a":0,"e":"Since ΔU = 0, heat absorbed equals work done by the gas."},{"q":"During reversible isothermal compression, heat is typically…","o":["Released by the gas","Absorbed in an amount that always increases temperature","Always zero","Converted into mass"],"a":0,"e":"Work is done on the gas; heat must leave to maintain constant temperature."},{"q":"Which law is closely associated with P₁V₁ = P₂V₂ at constant temperature?","o":["Boyle's law","Charles's law","Newton's law","Ohm's law"],"a":0,"e":"Boyle's law states that pressure is inversely proportional to volume at constant temperature for a fixed gas amount."},{"q":"If the absolute temperature of a fixed ideal-gas sample stays constant, its average translational kinetic energy…","o":["Stays constant","Always doubles","Becomes zero","Depends only on pressure"],"a":0,"e":"Average translational kinetic energy is proportional to absolute temperature."},{"q":"A gas expands isothermally from 3 L to 6 L. The volume ratio V₂/V₁ is…","o":["2","0.5","3","9"],"a":0,"e":"V₂/V₁ = 6/3 = 2."},{"q":"Which process is most directly described by T = constant?","o":["Isothermal","Isobaric","Isochoric","Adiabatic"],"a":0,"e":"T = constant is the defining condition of an isothermal process."},{"q":"Can pressure change during an isothermal process?","o":["Yes","No, pressure must be fixed","Only if volume is zero","Never for any gas"],"a":0,"e":"Pressure can change as volume changes while temperature remains constant."},{"q":"What is the best summary of an ideal-gas isothermal process?","o":["Temperature stays constant; pressure and volume can change","Pressure stays constant and temperature changes","Volume stays constant and no work occurs","No heat can ever be exchanged"],"a":0,"e":"An ideal-gas isothermal process has constant temperature; heat transfer may occur and work may be done."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Isothermal Process Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
