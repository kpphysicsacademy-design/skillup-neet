.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}

.track{height:11px;border-radius:99px;background:#e2edf7;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}

.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🪐 Kepler’s First Law</h1><p class="muted">Practice elliptical orbits, foci, eccentricity, perihelion, aphelion, and the law of orbits.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"Kepler's First Law says that a planet orbits the Sun in a(n):",o:["straight line","parabola in every case","circle with the Sun at its centre","ellipse"],a:3,e:"The Sun lies at one focus of the elliptical orbit."},
{q:"Where is the Sun located in the ideal elliptical orbit described by Kepler's First Law?",o:["At the centre in every case","At both foci","At one focus","Outside the ellipse"],a:2,e:"An ellipse has two foci, and the Sun occupies one of them."},
{q:"How many foci does an ellipse have?",o:["Four","One","Two","Three"],a:2,e:"An ellipse is defined by two foci."},
{q:"What happens to the two foci when an ellipse becomes a circle?",o:["They coincide at the centre","They disappear completely","They lie on the circumference","They move infinitely far apart"],a:0,e:"A circle is the special case of an ellipse with zero eccentricity and coincident foci."},
{q:"The point in a planet's orbit closest to the Sun is called:",o:["perigee","apogee","aphelion","perihelion"],a:3,e:"Perihelion is the closest point to the Sun."},
{q:"The point in a planet's orbit farthest from the Sun is called:",o:["perihelion","perigee","aphelion","apogee"],a:2,e:"Aphelion is the farthest point from the Sun."},
{q:"The major axis of an ellipse passes through:",o:["the planet only","only one focus","both foci","neither focus"],a:2,e:"Both foci lie on the major axis."},
{q:"Orbital eccentricity describes how:",o:["elongated an orbit is","massive the Sun is","bright a planet appears","fast a planet spins"],a:0,e:"Eccentricity indicates departure from a circular shape."},
{q:"An ellipse with eccentricity e = 0 is a:",o:["highly elongated ellipse","straight line","parabola","circle"],a:3,e:"Zero eccentricity corresponds to a circle."},
{q:"As the eccentricity of an elliptical orbit increases toward 1, the orbit becomes generally:",o:["more circular","more elongated","a smaller circle in every case","without foci"],a:1,e:"Increasing eccentricity makes an ellipse more stretched out."},
{q:"Which statement belongs to Kepler's Second Law, not the First Law?",o:["An ellipse has two foci","Planets follow ellipses","The Sun is at one focus","Equal areas are swept in equal times"],a:3,e:"Equal areas in equal times is Kepler's Second Law."},
{q:"Earth's orbit is best described as:",o:["an ellipse with low eccentricity","a straight line","a parabola","a perfect circle in the strict mathematical sense"],a:0,e:"Earth's orbit is elliptical but very close to circular."},
{q:"For any point on an ellipse, the sum of its distances from the two foci is:",o:["always equal to the distance between the foci","infinite","zero","constant"],a:3,e:"This constant-sum property defines an ellipse."},
{q:"If the semi-major axis stays fixed and eccentricity increases, the distance between the foci:",o:["decreases to zero","increases","stays zero","becomes infinite immediately"],a:1,e:"Focal separation is 2ae, so it increases with eccentricity for fixed a."},
{q:"Which is the correct statement of Kepler's First Law?",o:["A planet's speed is always constant","A planet always stays the same distance from the Sun","A planet follows an ellipse with the Sun at one focus","A planet sweeps equal areas in equal times"],a:2,e:"Kepler's First Law is the law of orbits."},
{q:"For an ellipse, the semi-major axis is:",o:["half the length of the major axis","the distance between the two foci","the shortest distance from focus to curve","the full length of the major axis"],a:0,e:"The semi-major axis a is half the major-axis length."},
{q:"The maximum possible eccentricity of a non-degenerate ellipse is:",o:["greater than 2","infinite","exactly 1","less than 1"],a:3,e:"Elliptical orbits have 0 ≤ e < 1."},
{q:"Which orbit type has eccentricity between 0 and 1?",o:["Circle only with e = 1","Ellipse","Parabola","Hyperbola"],a:1,e:"An ellipse has eccentricity from zero up to, but not including, one."},
{q:"If a planet's elliptical orbit has a small eccentricity, its path is:",o:["not closed","nearly a straight line","nearly circular","always parabolic"],a:2,e:"Small eccentricity means the ellipse is close to a circle."},
{q:"Which two points define perihelion and aphelion?",o:["The nearest and farthest points from the Sun","The two foci","The ends of the minor axis","The northernmost and southernmost points"],a:0,e:"Perihelion and aphelion are the minimum and maximum Sun-distance points."},
{q:"Kepler's First Law applies to ideal two-body gravitational orbits and states the orbit is:",o:["a straight line","always a spiral","circular with the central body at the centre only","elliptical with the central body at one focus"],a:3,e:"For a bound Keplerian orbit, the path is an ellipse with the central body at a focus."},
{q:"The minor axis of an ellipse is:",o:["parallel to the major axis","perpendicular to the major axis through the centre","the line connecting the foci","always equal to the major axis"],a:1,e:"The minor axis crosses the centre at right angles to the major axis."},
{q:"For a circle, the eccentricity is:",o:["greater than one","zero","0.5","one"],a:1,e:"A circle has coincident foci and eccentricity zero."},
{q:"The Sun's position at a focus means that, for a non-circular orbit, the Sun is generally:",o:["not at the geometric centre of the ellipse","outside the orbit","at both ends of the major axis","at the geometric centre of the ellipse"],a:0,e:"The focus and centre are distinct unless the orbit is circular."},
{q:"What is the distance from the centre of an ellipse to either focus called?",o:["Orbital period","Aphelion distance","Semi-minor axis","Linear eccentricity"],a:3,e:"The focal distance c is called linear eccentricity, with e = c/a."},
{q:"If the semi-major axis is a and eccentricity is e, the distance between the foci is:",o:["ae","2ae","a/e","2a/e"],a:1,e:"Each focus is ae from the centre, so their separation is 2ae."},
{q:"Which law explains why planets have elliptical paths around the Sun?",o:["Ohm's law","Newton's third law only","Kepler's First Law","Kepler's Second Law only"],a:2,e:"Kepler's First Law is specifically the law of orbits."},
{q:"A planet's orbit has e = 0.8. Compared with Earth's nearly circular orbit, it is generally:",o:["more elongated","not an orbit","a perfect circle","more circular"],a:0,e:"A larger eccentricity indicates a more elongated ellipse."},
{q:"In an ellipse, the two foci are located:",o:["on the minor axis endpoints","at the planet's current position always","outside the ellipse","inside the ellipse along the major axis"],a:3,e:"Both foci lie inside the ellipse on the major axis."},
{q:"Which shape is a limiting case as an ellipse's eccentricity approaches 1 from below?",o:["A perfect circle","A very elongated ellipse","A square","A spiral"],a:1,e:"As e approaches 1 from below, the ellipse becomes increasingly elongated."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Kepler’s First Law Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
