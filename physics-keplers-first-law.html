<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Kepler's First Law</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7f6;color:#18231f}.wrap{max-width:720px;margin:auto;padding:24px 16px 40px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:25px;font-weight:800}.xp{font-weight:800}.sub{margin:5px 0 18px;color:#64716c}.card{background:#fff;border:1px solid #e4e9e6;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 14px #00000008}.mastery{font-weight:750}.bar{height:10px;background:#e9eeeb;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#43a047;transition:.3s}.qno{font-size:13px;color:#6b7772;font-weight:700}.question{font-size:20px;font-weight:750;line-height:1.4;margin:10px 0 18px}.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #dce4df;border-radius:13px;padding:13px 14px;margin:9px 0;font-size:16px;cursor:pointer;transition:.15s}.opt:hover{transform:translateY(-1px);border-color:#80b68a}.opt.selected{border-color:#43a047;background:#f1faf2}.opt.correct{border-color:#43a047;background:#eaf7ec}.opt.wrong{border-color:#d9534f;background:#fff0ef}.btn{border:0;border-radius:13px;padding:13px 18px;font-size:16px;font-weight:800;cursor:pointer;background:#43a047;color:#fff;width:100%;margin-top:16px}.back{display:block;width:100%;background:#fff;color:#2f5e3b;border:2px solid #b9c8be;border-radius:13px;padding:12px;text-align:center;font-weight:800;cursor:pointer;margin-top:14px}.feedback{min-height:24px;margin-top:12px;font-weight:700}.result{text-align:center}.result h2{margin-top:4px}@media(max-width:520px){.title{font-size:21px}.question{font-size:18px}}</style></head><body><main class="wrap"><div class="head"><div class="title">🪐 Kepler's First Law</div><div class="xp">⭐ <span id="xp">0</span> XP</div></div><div class="sub">The law of orbits: planetary paths, ellipses, the Sun and orbital focus.</div><section class="card"><div class="mastery">🎯 Skill Mastery <span id="count">0</span> / 15</div><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card" id="quiz"></section><button class="back" id="back">← Back to Physics Path</button></main><script>
const quiz=[
['Kepler’s First Law states that every planet moves around the Sun in a:', ['elliptical orbit','circular orbit only','parabolic path','straight line'],0,'The orbit is an ellipse with the Sun at one focus.'],
['In Kepler’s First Law, the Sun is located at:', ['one focus of the ellipse','the centre of every orbit','both foci','one end of the major axis'],0,'The Sun occupies one focus of the planetary ellipse.'],

['The point of a planetary orbit farthest from the Sun is called:', ['aphelion','perihelion','nadir','focus'],0,'Aphelion is the farthest point from the Sun.'],
['The major axis of an ellipse passes through:', ['both foci','only one focus','neither focus','the Sun only'],0,'Both foci lie on the major axis.'],

];let i=0,score=0,selected=null,checked=false;const $=id=>document.getElementById(id);function render(){selected=null;checked=false;const a=quiz[i];$('quiz').innerHTML='<div class="qno">Question '+(i+1)+' of 15</div><div class="question">'+a[0]+'</div><div id="opts"></div><button class="btn" id="continue">Continue →</button><div class="feedback" id="feedback"></div>';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((x,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{if(!checked){selected=x.index;document.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));b.classList.add('selected')}};$('opts').appendChild(b)});$('continue').onclick=check;update()}function update(){$('xp').textContent=score*10;$('count').textContent=checked?i+1:i;$('fill').style.width=((checked?i+1:i)/15*100)+'%'}function check(){if(selected===null){$('feedback').textContent='Choose an answer first.';return}if(!checked){checked=true;const a=quiz[i],ok=selected===a[2];if(ok)score++;document.querySelectorAll('.opt').forEach(b=>{const n=Number(b.dataset.index);b.disabled=true;if(n===a[2])b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=(ok?'🎉 Correct! +10 XP — ':'💡 Review: ')+a[3];$('continue').textContent=i===14?'Finish Skill →':'Continue →';update()}else if(i<14){i++;render()}else finish()}function finish(){$('quiz').innerHTML='<div class="result"><div style="font-size:42px">🏆</div><h2>Skill Complete!</h2><p>You scored <strong>'+score+'/15</strong> and earned <strong>+'+(score*10)+' XP</strong>.</p><button class="btn" onclick="i=0;score=0;render()">Retry Skill ↻</button></div>';$('count').textContent='15';$('fill').style.width='100%'}$('back').onclick=()=>{const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return}}catch(e){}}location.href='physics-home.html'};render();</script></body></html>
