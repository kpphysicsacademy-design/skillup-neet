.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}

.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>📏 Kepler’s Second Law</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"Kepler’s second law states that the line joining a planet to the Sun sweeps out:",o:["Equal distances in equal intervals of time","Equal angles in equal intervals of time","Equal volumes in equal intervals of time","Equal areas in equal intervals of time"],a:3,e:"The radius vector from the Sun to a planet sweeps equal areas during equal time intervals."},
{q:"Kepler’s second law is also known as the law of:",o:["Areas","Orbits","Periods","Universal gravitation"],a:0,e:"It is called the law of areas because it describes equal swept areas in equal times."},
{q:"The areal velocity of a planet orbiting the Sun is:",o:["Always decreasing","Constant","Always zero","Always increasing"],a:1,e:"Equal areas swept in equal times mean the areal velocity is constant."},
{q:"A planet generally moves fastest when it is:",o:["At the centre of its orbit","At every point equally fast","Closest to the Sun","Farthest from the Sun"],a:2,e:"A planet moves fastest near perihelion, where it is closest to the Sun."},
{q:"A planet generally moves slowest when it is:",o:["Closest to the Sun","Crossing perihelion","At the Sun","Farthest from the Sun"],a:3,e:"The orbital speed is lowest near aphelion, the farthest point from the Sun."},
{q:"The point in an orbit where a planet is closest to the Sun is called:",o:["Perihelion","Aphelion","Perigee","Apogee"],a:0,e:"Perihelion is the closest point to the Sun in a solar orbit."},
{q:"The point in an orbit where a planet is farthest from the Sun is called:",o:["Zenith","Aphelion","Perihelion","Perigee"],a:1,e:"Aphelion is the farthest point from the Sun in a solar orbit."},
{q:"Kepler’s second law is a consequence of conservation of:",o:["Temperature","Volume","Angular momentum","Electric charge"],a:2,e:"The Sun’s gravitational force is central, so torque about the Sun is zero and angular momentum is conserved."},
{q:"For a planet acted on by the Sun’s gravitational force, torque about the Sun is:",o:["Always maximum","Always infinite","Always positive","Zero"],a:3,e:"The force is directed along the radius vector, giving zero torque about the Sun."},
{q:"If a planet sweeps area A in time t, its average areal velocity over that interval is:",o:["A/t","t/A","At","A + t"],a:0,e:"Areal velocity is swept area divided by elapsed time."},
{q:"The magnitude of areal velocity is expressed as:",o:["rv²","½|r × v|","|r + v|","r/v"],a:1,e:"Areal velocity is one-half the magnitude of the cross product of position and velocity."},
{q:"At perihelion, the planet’s speed is usually:",o:["Zero","Equal to its aphelion speed","Maximum","Minimum"],a:2,e:"The planet moves fastest at perihelion in an elliptical orbit."},
{q:"At aphelion, the planet’s speed is usually:",o:["Maximum","Infinite","Always zero","Minimum"],a:3,e:"The planet moves slowest at aphelion."},
{q:"A planet sweeps a certain area in 4 days. How long will it take to sweep the same area elsewhere in its orbit?",o:["4 days","2 days near perihelion","8 days near aphelion","It depends only on distance"],a:0,e:"Kepler’s second law says equal areas are swept in equal time intervals anywhere in the orbit."},
{q:"The Sun is located at which position in a planet’s elliptical orbit?",o:["An endpoint of the major axis","One focus","The centre in every case","Both foci"],a:1,e:"For a bound planetary ellipse, the Sun lies at one focus."},
{q:"If the planet’s distance from the Sun decreases, its orbital speed generally:",o:["Remains constant","Becomes negative","Increases","Decreases to zero"],a:2,e:"The planet speeds up as it approaches the Sun and slows down as it recedes."},
{q:"Which quantity remains constant for an ideal planet-Sun orbit under gravity?",o:["Orbital speed","Distance from the Sun","Direction of velocity","Angular momentum about the Sun"],a:3,e:"A central gravitational force conserves angular momentum, though speed and distance vary."},
{q:"For equal time intervals, the swept areas near perihelion and aphelion are:",o:["Equal","Always larger at perihelion","Always larger at aphelion","Both zero"],a:0,e:"Equal time intervals correspond to equal swept areas throughout the orbit."},
{q:"A planet travels through a larger arc near perihelion during the same time than near aphelion because it:",o:["Experiences no gravity near perihelion","Moves faster near perihelion","Moves slower near perihelion","Has no angular momentum near perihelion"],a:1,e:"The higher orbital speed near perihelion means a longer arc is covered in the same time."},
{q:"The area swept by the radius vector in a short time interval is related to:",o:["The planet’s mass alone","The planet’s temperature","The component of motion perpendicular to the radius vector","Only the radial component of velocity"],a:2,e:"Swept area depends on the transverse component of velocity, not radial motion alone."},
{q:"If a planet moved in a perfect circle at constant speed, its areal velocity would be:",o:["Increasing continuously","Decreasing continuously","Zero except at one point","Constant"],a:3,e:"In uniform circular motion, both radius and speed are constant, so areal velocity is constant."},
{q:"Which force characteristic is essential to the angular-momentum explanation of Kepler’s second law?",o:["Central force directed toward the Sun","Constant force in a fixed direction","Friction opposite to motion","A force perpendicular to gravity at all times"],a:0,e:"A central force has zero torque about its centre, conserving angular momentum."},
{q:"Areal velocity has dimensions of:",o:["Mass times acceleration","Area per time","Length per time","Length per time squared"],a:1,e:"Area divided by time has dimensions L²T⁻¹."},
{q:"If the areal velocity is 2 m²/s, the area swept in 5 s is:",o:["7 m²","0.4 m²","10 m²","2.5 m²"],a:2,e:"Area = areal velocity × time = 2 × 5 = 10 m²."},
{q:"A planet’s radial velocity is zero at perihelion and aphelion because at those points:",o:["Its total speed is zero","Gravity disappears","Angular momentum is zero","Its distance from the Sun is momentarily not changing"],a:3,e:"At the nearest and farthest points, the radial distance reaches an extremum, so its instantaneous radial rate is zero."},
{q:"Kepler’s second law applies to a planet orbiting the Sun because gravity is approximately:",o:["A central force","A frictional force","A constant force independent of position","A force always perpendicular to the orbit plane"],a:0,e:"The Sun’s gravitational force points along the line joining the planet and Sun."},
{q:"Which statement about speed in an elliptical orbit is correct?",o:["It is greatest at the centre of the ellipse","It changes with orbital position","It is constant everywhere","It is zero at aphelion"],a:1,e:"In an elliptical orbit, the planet’s speed varies with its distance from the Sun."},
{q:"For equal areas swept in equal times, the angle swept in a fixed time is generally:",o:["Always zero","Independent of orbital position in every orbit","Not constant in an elliptical orbit","Always constant in an elliptical orbit"],a:2,e:"The angular rate varies with distance; the area swept, not the angle, stays equal for equal times."},
{q:"A planet’s angular momentum about the Sun is conserved because gravitational torque about the Sun is:",o:["Equal to its mass","Always increasing","Equal to its speed","Zero"],a:3,e:"The gravitational force is parallel to the radius vector, so its moment arm about the Sun gives zero torque."},
{q:"Which is the best summary of Kepler’s second law?",o:["A planet sweeps equal areas in equal times","A planet has constant speed in an ellipse","All planets have the same orbital period","A planet’s orbit is always circular"],a:0,e:"The law describes the area swept by the Sun-planet radius vector over equal time intervals."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Kepler’s Second Law Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
