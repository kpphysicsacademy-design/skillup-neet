<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Kinematic Problem Solving</title><style>body{margin:0;font-family:system-ui;background:#eef7ff;color:#173b62}.wrap{max-width:1050px;margin:auto;padding:20px}.hero,.mastery,.panel,.quiz{background:#fff;border-radius:20px;padding:22px;margin:12px 0;box-shadow:0 6px 18px #123b7015}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}.options{display:grid;gap:10px;margin:18px 0}.option{padding:14px;border:2px solid #dbe7f1;border-radius:15px;background:#fff;text-align:left;font-weight:700;cursor:pointer;font-size:16px}.option.selected{border-color:#1677ff;background:#eef6ff}.option.correct{border-color:#2db84d!important;background:#eaffef!important}.option.wrong{border-color:#e5484d!important;background:#fff0f0!important}.btn{padding:12px 18px;border:0;border-radius:13px;font-weight:900;cursor:pointer;margin:8px 6px 0 0}.check{background:#2db84d;color:#fff}.next{background:#dcecff;color:#145b9e}.btn:disabled{opacity:.55;cursor:not-allowed}.feedback{margin-top:14px;padding:13px;border-radius:14px;min-height:20px}.good{background:#e5f9e9}.bad{background:#fff0f0}.bar{height:13px;background:#dce8f2;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#42c95a;transition:width .25s ease}@media(max-width:750px){.layout{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><main class="wrap"><p><a href="physics-home.html">← Back to Physics Path</a></p><section class="hero"><div>PHYSICS • NEET 2026</div><h1>Kinematic problem solving</h1><p>LEARN → PRACTICE → MASTER • 15 focused NEET-style MCQs</p></section><section class="mastery">🎯 Skill Mastery <b id="mastery">0 / 15</b><div class="bar"><div id="fill" class="fill"></div></div></section><div class="layout"><aside class="panel"><h3 id="count">Question 1 of 15</h3><div id="pct">7%</div><p>Kinematic problem solving</p><p>⚡ +10 XP each</p><p>🦉 Learn → Practice → Master</p></aside><section class="quiz"><b id="badge">Q1</b><h2 id="question">Loading question…</h2><div id="options" class="options"></div><button id="check" class="btn check">Check Answer</button><button id="next" class="btn next" disabled>Next Question →</button><div id="feedback" class="feedback">💡 Choose the best answer.</div></section></div></main><script>(function(){const quiz=[
['A car starts from rest and accelerates at 2 m/s² for 5 s. Its final speed is:',['5 m/s','10 m/s','15 m/s','20 m/s'],1,'Use v=u+at: v=0+2×5=10 m/s.'],
['A body moving at 10 m/s accelerates uniformly at 2 m/s² for 4 s. Its final velocity is:',['12 m/s','14 m/s','18 m/s','20 m/s'],2,'v=u+at=10+2×4=18 m/s.'],

['For the same ball, maximum height is:',['10 m','20 m','30 m','40 m'],1,'H=u²/(2g)=400/20=20 m.'],
['A body covers 20 m in the first 2 s and 60 m in the next 2 s under uniform acceleration. Its initial velocity is:',['0 m/s','5 m/s','10 m/s','15 m/s'],1,'First interval: 20=2u+2a. Next 60=2u+6a; solving gives u=5 m/s.'],

];let i=0,sel=-1,score=0,checked=false;const q=document.getElementById('question'),o=document.getElementById('options'),c=document.getElementById('check'),n=document.getElementById('next'),f=document.getElementById('feedback');function render(){const a=quiz[i];sel=-1;checked=false;q.textContent=a[0];document.getElementById('badge').textContent='Q'+(i+1);document.getElementById('count').textContent='Question '+(i+1)+' of 15';document.getElementById('pct').textContent=Math.round((i+1)/15*100)+'%';o.innerHTML='';f.className='feedback';f.textContent='💡 Choose the best answer.';c.disabled=false;n.disabled=true;a[1].forEach((v,j)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+v;b.onclick=()=>{if(checked)return;sel=j;[...o.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)})}c.onclick=()=>{if(sel<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i];[...o.children].forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===sel&&j!==a[2])b.classList.add('wrong')});if(sel===a[2]){score++;f.className='feedback good';f.textContent='🎯 Correct! +10 XP — '+a[3]}else{f.className='feedback bad';f.textContent='✗ Review — Correct answer: '+a[1][a[2]]+'. '+a[3]}document.getElementById('mastery').textContent=score+' / 15';document.getElementById('fill').style.width=(score/15*100)+'%';c.disabled=true;n.disabled=false;if(i===14)n.textContent='Finish Skill →'};n.onclick=()=>{if(!checked)return;if(i<14){i++;n.textContent='Next Question →';render()}else{q.textContent='🏆 Kinematic Problem Solving Complete!';o.innerHTML='';c.style.display='none';n.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};render()})();</script></body></html>
