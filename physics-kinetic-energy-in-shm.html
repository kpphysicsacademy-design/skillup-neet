<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Kinetic Energy in SHM</title><style>body{font-family:Arial,sans-serif;background:#f3f7ff;margin:0;color:#1e293b}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(30,41,59,.10);border:1px solid #e2e8f0}h1{text-align:center;color:#334155}.meta{display:flex;justify-content:space-between;font-weight:700;color:#475569}.bar{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#22c55e;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;color:#172033}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe4f0;border-radius:14px;background:#fff;color:#1e293b;font-size:16px;cursor:pointer;transition:.2s}.opt:hover{background:#eef5ff;border-color:#93c5fd;transform:translateY(-1px)}.opt:focus-visible{outline:3px solid #bfdbfe;outline-offset:2px}.correct{border-color:#16a34a!important;background:#ecfdf3!important;color:#166534!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important;color:#991b1b!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s}.next,.retry{background:#4f46e5;color:#fff}.next:hover,.retry:hover{background:#4338ca}.back{background:#334155;color:#fff}.back:hover{background:#1e293b}.hide{display:none}.xp{text-align:center;font-weight:700;color:#d97706;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>⚡ Kinetic Energy in SHM</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['The kinetic energy of a particle in SHM is','K=½kx²','K=½mv²','K=½mω²x²','K=½mω²(A²−x²)',3,'Using v²=ω²(A²−x²), K=½mv²=½mω²(A²−x²).'],['The kinetic energy of an SHM particle is maximum at the','extreme positions','mean position','quarter-amplitude position','same at all positions',1,'Speed is maximum at the mean position, so kinetic energy is maximum there.'],['At an extreme position of SHM, the kinetic energy is','maximum','zero','equal to total energy','infinite',1,'Velocity is zero at x=±A, hence K=0.'],['The maximum kinetic energy of an SHM oscillator is','½mω²A²','mω²A','½mωA²','mωA²',0,'At the mean position, Kmax=½m(ωA)²=½mω²A².'],['At the mean position x=0, the kinetic energy equals','zero','total mechanical energy','one-fourth of total energy','twice total energy',1,'At x=0, potential energy is zero, so all mechanical energy is kinetic.'],['At displacement x in SHM, kinetic energy is','½mω²x²','½mω²(A²−x²)','½mω²(A²+x²)','mω²x',1,'K=½mω²(A²−x²).'],['If total energy is E and displacement is x, the kinetic-energy fraction is','x²/A²','1−x²/A²','x/A','1+x²/A²',1,'K/E=1−U/E=1−x²/A².'],['At x=A/2, the kinetic energy is what fraction of total energy?','1/4','1/2','3/4','1',2,'K/E=1−(A/2)²/A²=3/4.'],['At x=A/√2, the kinetic energy is','zero','one-fourth of total energy','half of total energy','equal to total energy',2,'K/E=1−1/2=1/2.'],['If amplitude A is doubled while m and ω remain constant, maximum kinetic energy becomes','twice','four times','half','unchanged',1,'Kmax=½mω²A², so doubling A makes Kmax four times.'],['If angular frequency ω is doubled while m and A remain constant, maximum kinetic energy becomes','twice','four times','half','unchanged',1,'Kmax is proportional to ω², so doubling ω gives four times the maximum kinetic energy.'],['The kinetic energy and potential energy in ideal SHM satisfy','K+U=constant','K−U=constant always','K×U=constant','K/U=constant',0,'Mechanical energy E=K+U remains constant in ideal SHM.'],['A particle has m=2 kg, ω=3 rad/s and A=0.10 m. Its maximum kinetic energy is','0.03 J','0.09 J','0.18 J','0.90 J',1,'Kmax=½mω²A²=½×2×9×0.01=0.09 J.'],['For x=A/2, the ratio K:U is','1:3','3:1','1:1','2:1',1,'At x=A/2, U/E=1/4 and K/E=3/4, so K:U=3:1.'],['As an SHM particle moves from an extreme position toward the mean position, its kinetic energy','decreases','increases','remains zero','remains constant',1,'Speed increases from zero to maximum, so kinetic energy increases toward the mean position.']];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
