<script>
(function(){
'use strict';
const questions=[{"q":"For a monatomic ideal gas, the average translational kinetic energy per molecule is…","o":["(3/2)kT","kT/2","3kT","RT"],"a":0,"e":"Each molecule has three translational degrees of freedom, giving mean energy 3kT/2."},{"q":"The total translational kinetic energy of N molecules of a monatomic ideal gas is…","o":["(3/2)NkT","NkT/2","3NkT","(5/2)NkT"],"a":0,"e":"Multiply the mean energy per molecule, 3kT/2, by N."},{"q":"The total translational kinetic energy of one mole of an ideal gas is…","o":["(3/2)RT","RT/2","(5/2)RT","3R/T"],"a":0,"e":"For one mole, N = N_A and N_Ak = R, so K = 3RT/2."},{"q":"Which equation relates the pressure-volume product to total translational kinetic energy K of an ideal gas?","o":["PV = (2/3)K","PV = 3K","PV = K/3","PV = 2K"],"a":0,"e":"Kinetic theory gives PV = (2/3)K, or K = 3PV/2."},{"q":"If the absolute temperature doubles, the average translational kinetic energy per molecule…","o":["Doubles","Halves","Quadruples","Remains unchanged"],"a":0,"e":"Mean translational kinetic energy is proportional to absolute temperature."},{"q":"At the same temperature, helium and oxygen molecules have the same…","o":["Average translational kinetic energy per molecule","RMS speed","Molecular mass","Momentum magnitude for every molecule"],"a":0,"e":"The average translational kinetic energy per particle is 3kT/2 for any ideal gas."},{"q":"At the same temperature, which gas has the greater RMS speed?","o":["Hydrogen","Oxygen","Both always have equal RMS speed","RMS speed does not depend on mass"],"a":0,"e":"RMS speed varies as 1/√m at fixed temperature, so lighter hydrogen moves faster."},{"q":"The RMS speed of molecules of mass m at temperature T is…","o":["√(3kT/m)","3kT/m","√(m/3kT)","√(kT/3m)"],"a":0,"e":"The RMS speed follows from K_mean = mv_rms²/2 = 3kT/2."},{"q":"For one mole of a monatomic ideal gas, internal energy is…","o":["(3/2)RT","(5/2)RT","RT","3RT"],"a":0,"e":"A monatomic ideal gas has three translational degrees of freedom, so U = 3RT/2 per mole."},{"q":"For n moles of a monatomic ideal gas, internal energy is…","o":["(3/2)nRT","(5/2)nRT","nRT/2","3RT/n"],"a":0,"e":"For a monatomic ideal gas, U = 3nRT/2."},{"q":"A monatomic ideal gas has 2 moles at 300 K. Its translational kinetic energy is approximately…","o":["7.48 kJ","2.49 kJ","4.99 kJ","14.97 kJ"],"a":0,"e":"K = 3nRT/2 ≈ 1.5 × 2 × 8.314 × 300 = 7.48 kJ."},{"q":"The average translational kinetic energy per molecule at 300 K is approximately…","o":["6.21 × 10⁻²¹ J","4.14 × 10⁻²³ J","1.38 × 10⁻²³ J","6.02 × 10²³ J"],"a":0,"e":"Using 3kT/2 with k ≈ 1.38 × 10⁻²³ J/K gives about 6.21 × 10⁻²¹ J."},{"q":"Which constant appears in the kinetic energy expression for a single molecule?","o":["Boltzmann's constant k","Universal gas constant R only","Gravitational constant G","Planck's constant h only"],"a":0,"e":"For a single molecule, mean translational kinetic energy is 3kT/2."},{"q":"Which constant is commonly used for kinetic energy per mole?","o":["Universal gas constant R","Boltzmann's constant without conversion","Speed of light c","Elementary charge e"],"a":0,"e":"For one mole, N_Ak is replaced by R."},{"q":"At fixed volume, the pressure of an ideal gas increases because…","o":["Molecular impacts transfer more momentum per unit time as temperature rises","Molecules become heavier","The number of molecules must decrease","Molecular motion ceases"],"a":0,"e":"Higher temperature means greater typical molecular speeds and stronger momentum transfer to walls."},{"q":"The mean translational kinetic energy of an ideal-gas molecule depends on…","o":["Absolute temperature","Pressure alone","Volume alone","Molecular diameter"],"a":0,"e":"For an ideal gas the mean translational kinetic energy is 3kT/2."},{"q":"If a gas's absolute temperature changes from 200 K to 500 K, the ratio of final to initial mean kinetic energy is…","o":["2.5","0.4","5","1.5"],"a":0,"e":"The ratio is T₂/T₁ = 500/200 = 2.5."},{"q":"If the RMS speed of molecules doubles, their mean translational kinetic energy becomes…","o":["Four times as large","Twice as large","Half as large","Unchanged"],"a":0,"e":"Kinetic energy is proportional to speed squared."},{"q":"If the absolute temperature becomes four times as large, the RMS speed becomes…","o":["Twice as large","Four times as large","Half as large","Unchanged"],"a":0,"e":"RMS speed is proportional to the square root of absolute temperature."},{"q":"For a diatomic ideal gas at ordinary temperatures, the translational part of internal energy per mole is…","o":["(3/2)RT","(5/2)RT","(7/2)RT","RT/2"],"a":0,"e":"The translational contribution remains 3RT/2 per mole; rotational contributions may add to total internal energy."},{"q":"Which statement about individual molecular kinetic energies is correct?","o":["They vary across molecules even at thermal equilibrium","Every molecule has exactly the mean energy","All molecules are at rest","All molecules have the same speed"],"a":0,"e":"Molecules have a distribution of speeds and kinetic energies at a given temperature."},{"q":"The average translational kinetic energy per molecule at 0 K in the classical ideal-gas model is…","o":["Zero","3k/2","Infinite","Independent of temperature"],"a":0,"e":"The classical expression 3kT/2 tends to zero as T approaches 0 K."},{"q":"If the number of molecules doubles at the same temperature, total translational kinetic energy…","o":["Doubles","Halves","Remains constant","Quadruples"],"a":0,"e":"Total kinetic energy is N times the mean kinetic energy per molecule."},{"q":"At the same pressure and volume, two ideal gas samples have the same total translational kinetic energy if…","o":["Their PV values are equal","Their molecular masses are equal","Their colours are equal","Their molecule diameters are equal"],"a":0,"e":"K_total = 3PV/2, so equal pressure-volume products imply equal total translational kinetic energy."},{"q":"A gas has pressure 2 × 10⁵ Pa and volume 0.01 m³. Its total translational kinetic energy is…","o":["3000 J","2000 J","1000 J","6000 J"],"a":0,"e":"K = 3PV/2 = 1.5 × 2 × 10⁵ × 0.01 = 3000 J."},{"q":"For an ideal gas, what happens to internal energy during an isothermal process?","o":["It remains unchanged","It always increases","It always decreases","It becomes equal to pressure"],"a":0,"e":"Ideal-gas internal energy depends only on temperature, which is constant in an isothermal process."},{"q":"Why do lighter molecules have greater RMS speed at the same temperature?","o":["They need greater speed to have the same mean kinetic energy","They have greater average kinetic energy","Their temperature is higher","They never collide"],"a":0,"e":"At equal temperature, mean kinetic energy is equal; lower mass requires greater speed."},{"q":"For an ideal gas, the total translational kinetic energy can be written as…","o":["(3/2)nRT","(2/3)nRT","nRT/3","(5/2)nRT for all gases"],"a":0,"e":"For n moles, K_trans = 3nRT/2 regardless of molecular species."},{"q":"A monatomic ideal gas has 1 mole at 400 K. Its internal energy is approximately…","o":["4.99 kJ","3.33 kJ","9.98 kJ","1.66 kJ"],"a":0,"e":"U = 3RT/2 ≈ 1.5 × 8.314 × 400 = 4.99 kJ."},{"q":"Which relation links average translational kinetic energy per molecule and absolute temperature?","o":["K_mean = (3/2)kT","K_mean = 3T/(2k)","K_mean = k/(2T)","K_mean = PV²"],"a":0,"e":"This is the fundamental kinetic interpretation of temperature for an ideal gas."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];

function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Kinetic Energy of Gas Molecules Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
