<script>
(function(){
const quiz=[
['The kinetic energy of a body of mass m moving with speed v is:',['½mv²','mv','mv²','½mv'],0,'Kinetic energy is K=½mv².'],
['The SI unit of kinetic energy is:',['joule','newton','watt','pascal'],0,'Energy is measured in joules (J).'],
['A 2 kg body moves at 3 m/s. Its kinetic energy is:',['9 J','6 J','18 J','3 J'],0,'K=½×2×3²=9 J.'],
['A 4 kg body moves at 5 m/s. Its kinetic energy is:',['50 J','20 J','100 J','25 J'],0,'K=½×4×5²=50 J.'],
['If the speed of a body is doubled, its kinetic energy becomes:',['four times','two times','half','unchanged'],0,'Because K is proportional to v², doubling speed multiplies K by 4.'],
['If the mass of a body is doubled while its speed is unchanged, its kinetic energy becomes:',['double','four times','half','unchanged'],0,'K is directly proportional to mass when speed is fixed.'],
['A body has kinetic energy 18 J at speed 3 m/s. If its mass is 4 kg, this is:',['consistent with K=½mv²','consistent with K=mv','consistent with K=½mv','inconsistent with any kinetic-energy relation'],0,'½×4×3²=18 J, so the stated kinetic energy is consistent.'],
['A 1 kg body increases speed from 2 m/s to 4 m/s. The increase in kinetic energy is:',['6 J','4 J','8 J','12 J'],0,'ΔK=½×1×(4²−2²)=6 J.'],
['A net work of 30 J is done on a body. Its kinetic energy changes by:',['30 J','15 J','60 J','0 J'],0,'By the work-energy theorem, net work equals change in kinetic energy.'],
['A body initially at rest has kinetic energy 72 J. If its mass is 4 kg, its speed is:',['6 m/s','18 m/s','36 m/s','4 m/s'],0,'72=½×4×v² gives v²=36, so v=6 m/s.'],
['For a non-relativistic particle, kinetic energy depends on speed as:',['v²','v','1/v','1/v²'],0,'The classical expression K=½mv² contains the square of speed.'],
['Two bodies have equal kinetic energies. If their masses are equal, their speeds are:',['equal','inversely proportional','in the ratio 1:2','in the ratio 2:1'],0,'With equal mass, equal ½mv² requires equal speed magnitudes.'],
['A 500 g body moves at 4 m/s. Its kinetic energy is:',['4 J','2 J','8 J','16 J'],0,'500 g=0.5 kg; K=½×0.5×4²=4 J.'],
['If the kinetic energy of a body is reduced to one-fourth and its mass stays constant, its speed becomes:',['half','one-fourth','twice','unchanged'],0,'Since K is proportional to v², reducing K to one-fourth reduces speed to one-half.'],
['Which statement about kinetic energy is correct?',['It is a scalar quantity','It is a vector quantity','It always has a negative value','It depends only on direction of motion'],0,'Kinetic energy has magnitude only and is therefore scalar; classically it is never negative.']

let i=0,selected=-1,score=0,checked=false;const $=id=>document.getElementById(id);const q=$('question'),o=$('options'),b=$('continue'),f=$('feedback');
