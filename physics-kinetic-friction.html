<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Kinetic Friction</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:flex-end}.xp{background:#fff;border:1px solid #dfe3ea;border-radius:14px;padding:7px 11px;font-weight:850}.intro{margin:24px 0 18px}.intro h1{margin:0 0 8px;font-size:2rem}.intro p{margin:0;color:#596273;line-height:1.55}.progress{height:12px;background:#e4e7ed;border-radius:99px;overflow:hidden;margin:20px 0}.fill{height:100%;width:0;background:#58cc02;transition:width .25s}.card{background:#fff;border-radius:22px;padding:26px;box-shadow:0 8px 24px rgba(23,32,51,.08)}.meta{font-size:.95rem;font-weight:800;color:#596273;margin-bottom:12px}.q{font-size:1.3rem;line-height:1.45;margin:0 0 20px}.options{display:grid;gap:10px}.option{padding:15px 16px;border:2px solid #dfe3ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;color:#172033;cursor:pointer;transition:.15s}.option:hover:not(:disabled){border-color:#58cc02;background:#f5fff0;transform:translateY(-1px)}.option.selected{border-color:#5146a5;background:#f1efff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#ff4b4b;background:#fff0f0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{padding:12px 18px;border:0;border-radius:13px;font:inherit;font-weight:850;cursor:pointer}.check,.retry{background:#58cc02;color:#fff}.next{background:#5146a5;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:16px;min-height:24px;font-weight:750;line-height:1.5}.good{color:#177b2f}.bad{color:#b02a37}.hint{color:#596273;font-size:.95rem}.result{display:none;text-align:center;margin-top:20px;padding-top:18px;border-top:1px solid #e5e7eb}.bottom-nav{text-align:center;margin-top:20px}.back{display:inline-block;color:#5146a5;font-weight:800;text-decoration:none;padding:9px 12px;border-radius:12px;transition:transform .15s,background .15s,box-shadow .15s}.back:hover{background:#eeeaff;transform:translateY(-1px);box-shadow:0 4px 12px rgba(81,70,165,.12)}.back:focus-visible{outline:3px solid #b9b0ff;outline-offset:2px}.back:active{transform:scale(.98)}@media(max-width:600px){.wrap{padding:20px 14px}.intro h1{font-size:1.65rem}.card{padding:20px}.q{font-size:1.15rem}}</style></head><body><main class="wrap"><div class="top"><span class="xp">⚡ <span id="xp">0</span> XP</span></div><section class="intro"><h1>🧲 Kinetic Friction</h1><p>Master sliding friction, its direction, coefficient, normal reaction and NEET-level applications with 15 MCQs.</p></section><div class="progress"><div id="fill" class="fill"></div></div><section class="card"><div class="meta"><span id="count">Question 1 of 15</span> • <span id="pct">7%</span></div><h2 id="q" class="q"></h2><div id="opts" class="options"></div><div class="actions"><button id="check" class="btn check" type="button">Check Answer</button><button id="next" class="btn next" type="button" disabled>Next Question →</button></div><div id="fb" class="feedback" aria-live="polite"></div><p class="hint">💡 Choose the best answer.</p><div id="result" class="result"><h2>🏆 Skill Complete!</h2><p id="score"></p><button id="retry" class="btn retry" type="button">Retry Skill</button></div></section><div class="bottom-nav"><a class="back" href="#" onclick="return goBackToPhysicsPath()">← Back to Physics Path</a></div></main><script>(function(){'use strict';const KEY='skillupLastPhysicsPath';function rememberPath(){try{const r=document.referrer;if(!r)return;const u=new URL(r);if(u.origin!==location.origin)return;if(/(?:physics|full-physics)[^/]*path[^/]*\.html$/i.test(u.pathname)||/\/physics-home\.html$/i.test(u.pathname))sessionStorage.setItem(KEY,u.href)}catch(e){}}function goBackToPhysicsPath(){try{const saved=sessionStorage.getItem(KEY);if(saved){const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}}catch(e){}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false}window.goBackToPhysicsPath=goBackToPhysicsPath;rememberPath();const quiz=[['Kinetic friction acts when two surfaces are:',['Sliding relative to each other','At rest relative to each other with no tendency to move','Not in contact','Separated by a vacuum'],0,'Kinetic friction acts during relative sliding between contacting surfaces.'],['The direction of kinetic friction on a sliding body is:',['Opposite to its relative motion','Always along its velocity','Always vertically upward','Always toward the centre of Earth'],0,'Kinetic friction opposes the relative sliding motion between the surfaces.'],['For dry surfaces, kinetic friction is approximately given by:',['f_k=μ_kN','f_k=N/μ_k','f_k=μ_k/N','f_k=μ_k+N'],0,'For the simple Coulomb model, kinetic friction has magnitude μ_kN.'],['The coefficient of kinetic friction μ_k is:',['Dimensionless','Measured in newtons','Measured in metres','Measured in pascals'],0,'It is a ratio of frictional force to normal reaction and therefore has no dimensions.'],['For ordinary dry surfaces, μ_k is generally:',['Less than μ_s','Greater than μ_s','Always equal to μ_s','Always zero'],0,'Usually the coefficient of kinetic friction is less than the coefficient of static friction.'],['A block slides on a horizontal rough surface. If N doubles and μ_k stays constant, f_k:',['Doubles','Halves','Remains unchanged','Becomes zero'],0,'Since f_k=μ_kN, doubling the normal reaction doubles kinetic friction.'],['A block slides at constant speed on a horizontal rough surface. The net horizontal force is:',['Zero','Equal to kinetic friction','Equal to the weight','Greater than zero'],0,'Constant velocity means zero acceleration, so the net force is zero.'],['A block is pulled horizontally at constant speed on a rough horizontal floor. The pulling force is equal in magnitude to:',['Kinetic friction','Weight','Normal reaction','Mass'],0,'At constant speed, the horizontal forces balance, so the pull equals kinetic friction.'],['If the coefficient of kinetic friction is 0.2 and N=50 N, the kinetic friction is:',['10 N','25 N','50.2 N','250 N'],0,'f_k=μ_kN=0.2×50=10 N.'],['A block of mass m slides on a horizontal surface with coefficient μ_k. Its frictional force is:',['μ_kmg','μ_km/g','mg/μ_k','m/μ_k'],0,'On a horizontal surface N=mg, hence f_k=μ_kmg.'],['A block slides down a rough incline. Kinetic friction acts:',['Up the incline','Down the incline','Perpendicular to the incline','Vertically upward'],0,'Friction opposes the relative sliding, so it acts up the plane for downward sliding.'],['A block slides up a rough incline. Kinetic friction acts:',['Down the incline','Up the incline','Horizontally','Perpendicular to the plane'],0,'Friction opposes the upward sliding, so it acts down the plane.'],['If a block slides on a horizontal surface and its speed increases, kinetic friction (for constant μ_k and N):',['Remains approximately constant','Must increase with speed','Must decrease to zero','Equals the speed'],0,'In the simple dry-friction model, f_k=μ_kN and does not depend directly on speed.'],['Which statement best distinguishes kinetic from static friction?',['Kinetic friction acts during relative sliding; static friction acts without relative sliding','Kinetic friction always acts before motion begins','Static friction acts only in fluids','They are always identical'],0,'The key distinction is whether relative sliding occurs.'],['A horizontal force is applied to a sliding block but is smaller than kinetic friction. The block’s acceleration is:',['Opposite the direction of motion','Always zero','In the direction of motion','Perpendicular to motion'],0,'The net force is opposite the motion because kinetic friction exceeds the applied force.']];let i=0,sel=-1,score=0,locked=false;const $=id=>document.getElementById(id),q=$('q'),o=$('opts'),fb=$('fb'),check=$('check'),next=$('next'),xp=$('xp'),fill=$('fill'),count=$('count'),pct=$('pct');function render(){const a=quiz[i];sel=-1;locked=false;q.textContent=a[0];count.textContent='Question '+(i+1)+' of '+quiz.length;pct.textContent=Math.round((i+1)/quiz.length*100)+'%';fill.style.width=(score/quiz.length*100)+'%';fb.className='feedback';fb.textContent='';check.disabled=false;next.disabled=true;o.innerHTML='';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{if(locked)return;sel=item.index;Array.from(o.children).forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)})}check.onclick=function(){if(sel<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}locked=true;const a=quiz[i],ok=sel===a[2];Array.from(o.children).forEach(b=>{const originalIndex=Number(b.dataset.index);b.disabled=true;if(originalIndex===a[2])b.classList.add('correct');if(originalIndex===sel&&!ok)b.classList.add('wrong')});if(ok){score++;fb.className='feedback good';fb.textContent='🎯 Correct! '+a[3]+' +10 XP'}else{fb.className='feedback bad';fb.textContent='Not quite. '+a[3]+' Correct answer: '+a[1][a[2]]}xp.textContent=score*10;fill.style.width=(score/quiz.length*100)+'%';check.disabled=true;next.disabled=false;if(i===quiz.length-1)next.textContent='Finish Skill →'};next.onclick=function(){if(i<quiz.length-1){i++;render()}else{q.textContent='🏆 Kinetic Friction Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+score+' / '+quiz.length+' correct • '+score*10+' XP';$('result').style.display='block';$('score').textContent=score+' / '+quiz.length+' correct • '+score*10+' XP'}};$('retry').onclick=()=>{i=0;score=0;xp.textContent='0';fill.style.width='0%';$('result').style.display='none';check.style.display='';next.style.display='';render()};render()})();</script></body></html>
