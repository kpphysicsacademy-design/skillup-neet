<script>
const questions = [{"q":"The kinetic interpretation of temperature connects temperature with the average molecular:","o":["Translational kinetic energy","Colour","Mass only","Charge"],"a":0,"e":"For an ideal gas, absolute temperature is proportional to mean translational kinetic energy."},{"q":"Mean translational kinetic energy per ideal-gas molecule is:","o":["(1/2)kBT","(3/2)kBT","3kBT","kBT/2"],"a":1,"e":"The relation is ⟨K⟩ = 3kBT/2."},{"q":"In kinetic theory, T must be expressed in:","o":["Celsius","Fahrenheit","Kelvin","Any scale"],"a":2,"e":"Thermodynamic equations use absolute temperature in kelvin."},{"q":"If absolute temperature doubles, mean kinetic energy:","o":["Halves","Doubles","Quadruples","Stays fixed"],"a":1,"e":"Mean translational kinetic energy is directly proportional to absolute temperature."},{"q":"At the same temperature, different ideal gases have the same:","o":["RMS speed","Molecular mass","Mean kinetic energy per molecule","Volume"],"a":2,"e":"At equal T, the mean translational kinetic energy per particle is equal."},{"q":"At the same temperature, lighter molecules generally have:","o":["Higher RMS speed","Lower RMS speed","Zero speed","Equal speed in every case"],"a":0,"e":"RMS speed varies as the inverse square root of molecular mass."},{"q":"The SI unit of Boltzmann's constant is:","o":["J K⁻¹","J mol⁻¹","Pa","kg K"],"a":0,"e":"Boltzmann's constant is measured in joules per kelvin."},{"q":"Boltzmann's constant is approximately:","o":["1.38 × 10⁻²³ J K⁻¹","8.31 J K⁻¹","6.02 × 10²³ J","9.8 m s⁻²"],"a":0,"e":"kB ≈ 1.38 × 10⁻²³ J K⁻¹."},{"q":"In the classical ideal-gas model, zero mean translational kinetic energy corresponds to:","o":["0°C","0 K","273 K","100 K"],"a":1,"e":"The relation predicts zero translational kinetic energy at absolute zero."},{"q":"Heating an ideal gas from 100 K to 200 K makes its mean kinetic energy:","o":["Double","Triple","Four times","Unchanged"],"a":0,"e":"The absolute temperature doubles, so mean kinetic energy doubles."},{"q":"300 K is approximately:","o":["−300°C","0°C","27°C","100°C"],"a":2,"e":"300 K is about 27°C."},{"q":"At fixed temperature, mean translational kinetic energy per ideal-gas molecule is independent of:","o":["Temperature","Boltzmann constant","Molecular species","The 3/2 factor"],"a":2,"e":"It depends on temperature, not molecular mass or species."},{"q":"If mean kinetic energy is 6.0 × 10⁻²¹ J, T is approximately:","o":["145 K","290 K","435 K","580 K"],"a":1,"e":"T = 2⟨K⟩/(3kB), approximately 290 K."},{"q":"In kinetic theory, temperature measures average random:","o":["Translational kinetic energy","Molecular mass","Container height","Electric charge"],"a":0,"e":"Temperature reflects the average random translational kinetic energy."},{"q":"Two ideal gases in thermal equilibrium have equal mean translational kinetic energy per molecule because they have equal:","o":["Volume","Temperature","Mass","Pressure necessarily"],"a":1,"e":"Equal temperature implies equal mean translational kinetic energy per particle."},{"q":"When temperature rises, which statement is correct?","o":["Every molecule has identical speed","Average kinetic energy rises","All collisions stop","Molecular mass rises"],"a":1,"e":"Higher temperature means higher average kinetic energy; molecular speeds still vary."},{"q":"For N molecules of a monatomic ideal gas, total translational kinetic energy is:","o":["NkBT","(3/2)NkBT","(5/2)NkBT","3NkBT"],"a":1,"e":"Multiply 3kBT/2 per molecule by N."},{"q":"At fixed temperature, doubling the number of molecules doubles the total translational kinetic energy because it is proportional to:","o":["N","1/N","N²","1/T"],"a":0,"e":"Total translational energy is (3/2)NkBT."},{"q":"The mean translational kinetic energy per molecule at 0°C is closest to:","o":["0 J","5.7 × 10⁻²¹ J","1.0 × 10⁻²³ J","1.5 J"],"a":1,"e":"At 273.15 K, 3kBT/2 ≈ 5.65 × 10⁻²¹ J."},{"q":"To convert Celsius to kelvin, use:","o":["K = °C − 273.15","K = °C + 273.15","K = °C/273.15","K = 273.15 × °C"],"a":1,"e":"Add 273.15 to the Celsius value."},{"q":"When temperature rises from 27°C to 127°C, mean kinetic energy changes by:","o":["4/3 times","2 times","3 times","4 times"],"a":0,"e":"300 K to 400 K gives a ratio of 4/3."},{"q":"At equal temperature, helium and nitrogen have equal:","o":["RMS speed","Molecular mass","Mean translational kinetic energy per particle","Molecular diameter"],"a":2,"e":"Mean translational kinetic energy depends on T, not molecular mass."},{"q":"For a fixed gas, RMS speed varies with absolute temperature as:","o":["T","√T","1/T","T²"],"a":1,"e":"vRMS = √(3kBT/m), so vRMS ∝ √T."},{"q":"If absolute temperature becomes four times, RMS speed becomes:","o":["Four times","Two times","Half","One-fourth"],"a":1,"e":"RMS speed varies as √T."},{"q":"A gas at a fixed temperature has:","o":["One identical speed for all molecules","A distribution of molecular speeds","No molecular motion","Only zero-energy molecules"],"a":1,"e":"Gas molecules have a range of speeds."},{"q":"Mean translational kinetic energy at 600 K compared with 300 K is:","o":["Half","Same","Twice","Four times"],"a":2,"e":"Mean kinetic energy is proportional to absolute temperature."},{"q":"The symbol kB in kinetic theory denotes:","o":["Spring constant","Boltzmann's constant","Thermal conductivity","Wave number"],"a":1,"e":"Boltzmann's constant links microscopic energy and temperature."},{"q":"Which formula gives mean translational kinetic energy per molecule?","o":["(3/2)kBT","(3/2)RT","kBT/3","3RT/2N²"],"a":0,"e":"Per molecule use kB; per mole for a monatomic ideal gas use 3RT/2."},{"q":"An ideal gas heated at constant amount of gas has greater mean kinetic energy because:","o":["Its molecules have greater average random-motion energy","Molecules become heavier","kB increases","Molecular count must increase"],"a":0,"e":"Heating increases absolute temperature and therefore mean kinetic energy."},{"q":"The factor 3/2 in ⟨K⟩ = 3kBT/2 comes from the three:","o":["Translational degrees of freedom","Chemical bonds","Container dimensions","Types of gas"],"a":0,"e":"Each of the three translational degrees of freedom contributes kBT/2."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('count').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qnum').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').classList.remove('hidden');$('check').style.display='block';$('check').disabled=true;
 $('continue').classList.add('hidden');$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';
 const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
 const label=document.createElement('span');label.textContent=text;b.append(letter,label);
 b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
 $('options').appendChild(b);});
 if(window.MathJax?.typesetPromise)MathJax.typesetPromise([$('question'),$('options')]).catch(()=>{});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show';f.innerHTML='<strong>✨ Correct! +10 XP</strong>';f.append(document.createTextNode(item.e));}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.innerHTML='<strong>Not quite — review this concept</strong>';f.append(document.createTextNode(item.e+' Correct answer: '+item.o[item.a]+'.'));}
 $('check').classList.add('hidden');$('continue').classList.remove('hidden');
 if(window.MathJax?.typesetPromise)MathJax.typesetPromise([f]).catch(()=>{});
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quizcard').classList.add('hidden');$('fill').style.width='100%';$('count').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100),result=$('result');result.classList.remove('hidden');
 result.innerHTML='<div style="font-size:42px">🏆</div><h2>Kinetic Interpretation of Temperature Complete!</h2><div class="scorebig">'+score+' / '+questions.length+'</div><p class="small">'+pct+'% correct · '+(score*10)+' XP earned</p><div class="review" id="wrongReview"></div><button class="primary" id="retryWrong" style="display:'+(wrongAttempts.length?'block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><button class="primary" id="retryAll">Practice all questions again</button>';
 const review=$('wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.className='small';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});}
 else review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';
 function reset(onlyWrong){if(onlyWrong&&wrongAttempts.length){const missed=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...missed);}else questions.splice(0,questions.length,...originalQuestions);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quizcard').classList.remove('hidden');result.classList.add('hidden');render();window.scrollTo({top:0,behavior:'smooth'});}
 $('retryAll').addEventListener('click',()=>reset(false));
 const rw=$('retryWrong');if(rw)rw.addEventListener('click',()=>reset(true));
});
render();
</script>
