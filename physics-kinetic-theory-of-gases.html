<section class="hero"><h1>⚛️ Kinetic Theory of Gases</h1><p class="muted">Connect molecular motion with pressure, temperature, and the behaviour of ideal gases.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"What does kinetic theory explain about gases?",o:["Macroscopic gas properties using molecular motion","Only the colour of gases","Chemical bonding only","Radioactive decay"],a:0,e:"Kinetic theory links pressure, temperature and other gas properties to molecular motion."},
{q:"Gas pressure is mainly caused by molecules…",o:["Colliding with container walls","Attracting the walls continuously","Remaining motionless","Changing into liquid"],a:0,e:"Molecular collisions transfer momentum to the container walls, producing pressure."},
{q:"The average kinetic energy of ideal-gas molecules depends on…",o:["Absolute temperature","Pressure only","Container shape only","Molecular colour"],a:0,e:"Mean translational kinetic energy is proportional to absolute temperature."},
{q:"For one molecule of an ideal gas, average translational kinetic energy is…",o:["(3/2)kT","k/T","3k/T","(1/2)k/T"],a:0,e:"The average translational kinetic energy per molecule is 3kT/2."},
{q:"In the ideal-gas equation PV = nRT, n represents…",o:["Number of moles","Number of molecules per cubic metre","Gas pressure","Gas density"],a:0,e:"n is the amount of gas measured in moles."},
{q:"The Boltzmann constant k is related to gas constant R by…",o:["R = NAk","R = k/NA","R = NA/k","R = k − NA"],a:0,e:"The universal gas constant equals Avogadro's number multiplied by Boltzmann's constant."},
{q:"At the same temperature, two ideal gases have the same…",o:["Average translational kinetic energy per molecule","Average molecular speed in all cases","Molecular mass","Density"],a:0,e:"Average translational kinetic energy per molecule depends only on temperature."},
{q:"At the same temperature, lighter gas molecules generally have…",o:["Higher root-mean-square speed","Lower root-mean-square speed","Exactly the same speed as heavier molecules","Zero speed"],a:0,e:"The rms speed varies inversely with the square root of molar mass."},
{q:"The rms speed of gas molecules is given by…",o:["√(3RT/M)","√(RT/3M)","3RT/M","√(M/3RT)"],a:0,e:"For molar mass M, vrms = √(3RT/M), with M in kg mol⁻¹."},
{q:"If absolute temperature is increased fourfold, rms speed becomes…",o:["Twice as large","Four times as large","Half as large","Unchanged"],a:0,e:"Since speed is proportional to √T, quadrupling T doubles the rms speed."},
{q:"The ideal-gas model assumes molecular volume is…",o:["Negligible compared with the gas volume","Greater than the container volume","Always equal to the container volume","Infinite"],a:0,e:"Ideal-gas molecules are treated as point-like particles with negligible individual volume."},
{q:"In the ideal-gas model, intermolecular forces are assumed negligible…",o:["Except during collisions","At all times including collisions, so molecules never interact","Only at absolute zero","Only in liquids"],a:0,e:"Ideal molecules move freely between brief collisions."},
{q:"Which quantity is proportional to the mean translational kinetic energy of molecules?",o:["Absolute temperature","Celsius temperature directly in every formula","Container colour","Molar volume only"],a:0,e:"Mean translational kinetic energy is proportional to kelvin temperature."},
{q:"If the absolute temperature of an ideal gas doubles, its mean translational kinetic energy per molecule…",o:["Doubles","Halves","Quadruples","Does not change"],a:0,e:"Mean kinetic energy is directly proportional to T."},
{q:"The pressure of an ideal gas in kinetic theory is related to density ρ and rms speed by…",o:["P = ρvrms²/3","P = 3ρvrms²","P = ρ/vrms²","P = ρvrms/3"],a:0,e:"Kinetic theory gives P = ⅓ρ⟨v²⟩ = ⅓ρvrms²."},
{q:"The degrees of freedom of a molecule describe…",o:["Independent ways it can store energy","Its number of atoms only","Its pressure units","Its collision frequency only"],a:0,e:"Degrees of freedom count independent modes of motion or energy storage."},
{q:"A monatomic ideal gas at ordinary temperatures has how many translational degrees of freedom?",o:["1","2","3","6"],a:2,e:"A molecule can translate independently along x, y and z."},
{q:"The equipartition theorem assigns each quadratic degree of freedom an average energy of…",o:["(1/2)kT","kT","(3/2)kT","2kT"],a:0,e:"Each quadratic degree of freedom contributes kT/2 per molecule."},
{q:"For a monatomic ideal gas, molar internal energy is…",o:["(3/2)RT","RT","(5/2)RT","3RT"],a:0,e:"A monatomic ideal gas has three translational degrees of freedom, giving U = 3nRT/2."},
{q:"For an ideal gas, internal energy depends only on…",o:["Temperature","Pressure alone","Volume alone","Container material"],a:0,e:"Ideal-gas internal energy is a function of temperature only."},
{q:"The SI unit of Boltzmann's constant is…",o:["J K⁻¹","J mol⁻¹","Pa m⁻³","kg K"],a:0,e:"Boltzmann's constant is energy per kelvin per molecule."},
{q:"Which relation is the ideal-gas equation?",o:["PV = nRT","P = nRVT","PT = nRV","PV = nR/T²"],a:0,e:"The equation of state for an ideal gas is PV = nRT."},
{q:"At constant temperature, if the volume of a fixed amount of ideal gas is halved, pressure…",o:["Doubles","Halves","Becomes zero","Stays the same"],a:0,e:"Boyle's law gives P inversely proportional to V at constant temperature."},
{q:"At constant pressure, heating a fixed amount of ideal gas raises its volume because…",o:["Volume is proportional to absolute temperature","Volume is inversely proportional to temperature","Molecular mass increases","Molecules stop moving"],a:0,e:"Charles's law states V/T is constant at fixed pressure and amount."},
{q:"The mean free path is the…",o:["Average distance a molecule travels between successive collisions","Distance from the gas to the container","Average molecular diameter","Total path of all molecules in one second"],a:0,e:"Mean free path describes the average travel distance between collisions."},
{q:"The pressure relation from kinetic theory is:",o:["P = (1/3)ρ⟨c²⟩","P = 3ρ⟨c²⟩","P = ρ/⟨c²⟩","P = ρ⟨c⟩/3"],a:0,e:"Pressure is one-third of the gas density multiplied by the mean-square molecular speed."},
{q:"For an ideal gas, the rms speed is proportional to:",o:["√T","T","1/T","T²"],a:0,e:"The rms speed is proportional to the square root of absolute temperature for a fixed molecular mass."},
{q:"At fixed temperature, which gas molecules have the greater rms speed?",o:["The lighter molecules","The heavier molecules","Both always have zero speed","Speed is independent of molecular mass"],a:0,e:"The rms speed varies inversely with the square root of molecular mass."},
{q:"Which condition makes the ideal-gas approximation most reliable?",o:["High temperature and low pressure","Low temperature and high pressure","High pressure only","Near condensation"],a:0,e:"At high temperature and low pressure, intermolecular forces and molecular volume are less significant."},
{q:"The mean translational kinetic energy per molecule at temperature T is:",o:["(3/2)kT","kT/2","3RT/2","RT per molecule"],a:0,e:"For a monatomic ideal gas, the average translational kinetic energy per molecule is 3kT/2."}
]
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Kinetic Theory of Gases Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
