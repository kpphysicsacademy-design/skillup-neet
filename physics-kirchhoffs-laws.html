'use strict';
const questions = [{"q":"Kirchhoff’s junction rule is a consequence of conservation of","o":["Energy","Electric charge","Linear momentum","Electric potential"],"a":1,"e":"Charge is conserved at a junction, so the algebraic sum of currents there is zero."},{"q":"Kirchhoff’s loop rule expresses conservation of","o":["Charge","Energy","Mass","Magnetic flux in every circuit"],"a":1,"e":"The net potential change around a closed loop is zero, expressing energy conservation."},{"q":"At a junction, 6 A enters while 2 A and 1 A leave. The remaining outgoing current is","o":["1 A","2 A","3 A","9 A"],"a":2,"e":"KCL gives 6 = 2 + 1 + I, hence I = 3 A outward."},{"q":"Currents of 4 A and 5 A enter a junction. If 6 A leaves through one branch, the other outgoing current is","o":["1 A","3 A","9 A","15 A"],"a":1,"e":"The total incoming current is 9 A, so the remaining outgoing current is 9 − 6 = 3 A."},{"q":"If I₁ and I₂ enter a junction and I₃ and I₄ leave, which equation follows from KCL?","o":["I₁ + I₂ = I₃ + I₄","I₁I₂ = I₃I₄","I₁ + I₃ = I₂ − I₄","I₁ + I₂ + I₃ + I₄ = 0 for magnitudes"],"a":0,"e":"The sum of currents entering equals the sum leaving: I₁ + I₂ = I₃ + I₄."},{"q":"An ideal 12 V battery is connected to a 4 Ω resistor. The current magnitude is","o":["0.33 A","2 A","3 A","48 A"],"a":2,"e":"Ohm’s law gives I = V/R = 12/4 = 3 A."},{"q":"Traversing a resistor in the direction of its assumed current gives the potential change","o":["+IR","−IR","+I/R","−R/I"],"a":1,"e":"Potential drops along the conventional current direction through a resistor, so the term is −IR."},{"q":"Traversing an ideal cell from its negative terminal to its positive terminal gives","o":["−ε","+ε","−IR","Zero potential change"],"a":1,"e":"Crossing a cell from negative to positive terminal gives a potential rise +ε."},{"q":"A 10 V source drives 2 Ω and 3 Ω resistors in series. The current is","o":["1 A","2 A","5 A","10 A"],"a":1,"e":"Total resistance is 2 + 3 = 5 Ω, so I = 10/5 = 2 A."},{"q":"A loop has a 9 V source and a 3 Ω resistor. Taking the source rise as positive, the loop equation is","o":["9 + 3I = 0","9 − 3I = 0","3 − 9I = 0","9I + 3 = 0"],"a":1,"e":"The source rise balances the resistor drop: 9 − 3I = 0, giving I = 3 A."},{"q":"A solved branch current is −2 A when its reference arrow was chosen to point right. This means","o":["The circuit has no solution","The actual current is 2 A to the left","The resistance is negative","The current is 2 A to the right"],"a":1,"e":"The negative sign means the actual current flows opposite the assumed reference direction, with magnitude 2 A."},{"q":"A 12 V source drives 2 Ω and 4 Ω resistors in series. The drop across the 4 Ω resistor is","o":["2 V","4 V","8 V","12 V"],"a":2,"e":"I = 12/(2 + 4) = 2 A, so the 4 Ω drop is V = IR = 8 V."},{"q":"A closed loop contains a 15 V source and drops of 6 V and V. Find V.","o":["6 V","9 V","15 V","21 V"],"a":1,"e":"KVL gives 15 − 6 − V = 0, so V = 9 V."},{"q":"At a junction, 3 A enters and 7 A leaves through one branch. The other branch current must be","o":["4 A entering","4 A leaving","10 A entering","10 A leaving"],"a":0,"e":"To balance 7 A leaving, 3 A entering must be joined by another 4 A entering."},{"q":"Which statement correctly describes Kirchhoff’s current law?","o":["It applies only to series circuits","It expresses charge conservation at a junction","It states the sum of resistances is zero","It requires equal voltage in all branches"],"a":1,"e":"KCL states that total current entering a junction equals total current leaving it."},{"q":"Which equation states Kirchhoff’s voltage law for a closed loop?","o":["ΣΔV = 0","ΣI = 0 in every path","ΣR = 0","V = I + R"],"a":0,"e":"The signed potential rises and drops around any closed loop sum to zero."},{"q":"A 6 V cell and a 2 Ω resistor form an ideal single loop. The current magnitude is","o":["0.33 A","2 A","3 A","12 A"],"a":2,"e":"I = V/R = 6/2 = 3 A."},{"q":"Traversing a cell from its positive terminal to its negative terminal contributes","o":["+ε","−ε","+IR","Zero"],"a":1,"e":"Moving from positive to negative terminal is a potential drop, −ε."},{"q":"A 4 Ω resistor carries 2 A. Traversing it opposite to the current gives a potential change of","o":["−8 V","+8 V","−2 V","+2 V"],"a":1,"e":"Against the current direction, potential rises by IR = 2 × 4 = 8 V."},{"q":"Two currents of 2 A and 3 A enter a node. Outgoing currents are 1 A, 1 A, and I. Find I.","o":["1 A","2 A","3 A","5 A"],"a":2,"e":"KCL gives 2 + 3 = 1 + 1 + I, so I = 3 A."},{"q":"A 24 V source is connected to 4 Ω and 8 Ω resistors in series. The current is","o":["1 A","2 A","3 A","6 A"],"a":1,"e":"The total resistance is 12 Ω, so I = 24/12 = 2 A."},{"q":"For the previous circuit, the voltage drop across the 8 Ω resistor is","o":["4 V","8 V","16 V","24 V"],"a":2,"e":"The current is 2 A, so the drop across 8 Ω is V = IR = 16 V."},{"q":"An 8 A current enters a junction. Two outgoing currents are 2 A and 3 A. The third outgoing current is","o":["3 A","5 A","8 A","13 A"],"a":0,"e":"KCL gives 8 = 2 + 3 + I, hence I = 3 A."},{"q":"For a resistor traversed opposite to its assumed current, the signed voltage term is","o":["+IR","−IR","+R/I","−I/R"],"a":0,"e":"Moving against the current through a resistor gives a potential rise +IR."},{"q":"A 12 V source and a 6 V source oppose each other in a loop with total resistance 3 Ω. The current magnitude is","o":["1 A","2 A","4 A","6 A"],"a":1,"e":"The net emf is 12 − 6 = 6 V, so the current magnitude is 6/3 = 2 A."},{"q":"Two sources of 10 V and 4 V aid each other in a loop with 7 Ω total resistance. The current is","o":["0.5 A","2 A","6 A","14 A"],"a":1,"e":"The net emf is 10 + 4 = 14 V; I = 14/7 = 2 A."},{"q":"Why can one node equation be redundant in a connected circuit network?","o":["Charge is not conserved","Summing all node equations cancels each branch current","All branches have equal resistance","KVL makes KCL unnecessary"],"a":1,"e":"When all node equations are added, each branch current appears once entering and once leaving, so one equation is dependent."},{"q":"When writing a resistor term in KVL, its sign depends on","o":["Only the resistor’s value","Traversal direction relative to assumed current","The battery’s age","The physical size of the circuit"],"a":1,"e":"Along the assumed current the resistor term is −IR; opposite the current it is +IR."},{"q":"A 5 Ω resistor carries 0.6 A. The potential drop magnitude is","o":["0.12 V","3 V","5.6 V","8.3 V"],"a":1,"e":"Ohm’s law gives V = IR = 0.6 × 5 = 3 V."},{"q":"Which sequence is appropriate for analyzing a multi-loop circuit using Kirchhoff’s laws?","o":["Assume current directions, write independent junction and loop equations, then solve","Set every branch current to zero","Add every resistance regardless of connections","Ignore the polarity of each source"],"a":0,"e":"Choose reference current directions, write KCL and KVL equations with consistent signs, and solve the simultaneous equations."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function typesetMath(){if(window.MathJax?.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options'),$('feedback')].filter(Boolean)).catch(()=>{});}}

function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
 typesetMath();
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Equipotential Surfaces Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
   if(window.MathJax?.typesetPromise) window.MathJax.typesetPromise([review]).catch(()=>{});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
