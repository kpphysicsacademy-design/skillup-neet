<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Latent Heat — 15 MCQ Quiz</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#203040;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:22px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:#123b70}.xp{font-weight:950;color:#1677ff}.hero{margin-top:14px;background:linear-gradient(135deg,#123b70,#1677ff);color:#fff;border-radius:24px;padding:22px}.hero h1{margin:5px 0 7px;font-size:clamp(28px,6vw,40px)}.hero p{margin:0;line-height:1.5;font-size:13px}.card{background:#fff;border:1px solid #d9e5f2;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 7px 20px rgba(18,59,112,.07)}.master{font-weight:900}.bar{height:10px;background:#e5edf6;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;width:0;background:#1677ff;transition:.3s}.qno{font-size:12px;color:#6b7280;font-weight:900}.q{font-size:20px;font-weight:900;line-height:1.4;margin:9px 0 16px}button.opt{display:block;width:100%;text-align:left;background:#fff;color:#203040;border:2px solid #dfe8f1;border-radius:14px;padding:14px;margin:10px 0;font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}button.opt.selected{border-color:#1677ff;background:#eef6ff;color:#123b70}button.opt.correct{border-color:#16803a;background:#eaf8ef;color:#145c2e}button.opt.wrong{border-color:#d64545;background:#fff0f0;color:#8f2020}button.continue{border:0;border-radius:13px;padding:12px 20px;background:#1677ff;color:#fff;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #0d5bbf}button.continue:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}.actions{display:flex;justify-content:flex-end;margin-top:15px}.feedback{min-height:25px;margin-top:13px;font-weight:800}.explain{margin-top:6px;color:#596774;font-weight:600}.back{display:block;width:max-content;margin:18px auto 0;padding:10px 15px;border:2px solid #d9e5f2;border-radius:12px;background:#fff;color:#1264d6;text-decoration:none;font-weight:900}.result{text-align:center}.score{font-size:34px;font-weight:950;color:#123b70}@media(max-width:520px){.wrap{padding:15px 10px 50px}.q{font-size:18px}button.opt{font-size:14px;padding:13px}}</style></head><body><main class="wrap"><div class="top"><div class="brand">⚛️ SkillUp Physics<br><small>NEET 2026 • 15 MCQ QUIZ</small></div><div class="xp" id="xp">XP: 0</div></div><section class="hero"><div>🔥 NEET PRACTICE</div><h1>Latent Heat</h1><p>15-question MCQ quiz. Select one answer, check instantly, and build mastery.</p></section><section class="card"><div class="master">🏆 Quiz Progress <span id="mastery">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card" id="quiz"><div class="qno" id="qno"></div><div class="q" id="question"></div><div id="opts"></div><div class="actions"><button class="continue" id="continue" type="button" disabled>Check Answer →</button></div><div class="feedback" id="feedback"></div></section><section class="card result" id="result" hidden></section><a class="back" href="physics-home-fast.html">← 📚 Back to Physics Path</a></main><script>const questions=[
{q:'Latent heat is the heat absorbed or released during a change of',o:['temperature only','state at constant temperature','mass only','pressure only'],a:1,e:'Latent heat is associated with a phase change and, under the usual equilibrium conditions, does not change temperature.'},
{q:'The SI unit of specific latent heat is',o:['J kg⁻¹','J kg⁻¹ K⁻¹','J K⁻¹','W kg⁻¹'],a:0,e:'Specific latent heat is energy per unit mass, so its SI unit is J kg⁻¹.'},
{q:'The heat required for a phase change of mass m with specific latent heat L is',o:['Q=mL','Q=m/L','Q=L/m','Q=mL²'],a:0,e:'By definition, specific latent heat L = Q/m, hence Q = mL.'},
{q:'During melting of pure ice at its melting point, supplied heat mainly',o:['raises temperature','changes the state','reduces mass immediately','raises pressure'],a:1,e:'At the melting point, heat is used to overcome intermolecular binding and change solid to liquid while temperature remains constant.'},
{q:'During boiling of a pure liquid at its boiling point, the temperature',o:['increases continuously','decreases continuously','remains constant while phase change occurs','becomes absolute zero'],a:2,e:'At constant pressure, a pure substance boils at a fixed temperature while latent heat of vaporization is supplied.'},
{q:'Specific latent heat of vaporization is generally',o:['less than latent heat of fusion per unit mass for the same substance','greater than latent heat of fusion','always zero','equal to specific heat capacity'],a:1,e:'For common substances, vaporization requires substantially more energy per unit mass than fusion.'},
{q:'When steam condenses into water at its condensation temperature, it',o:['absorbs latent heat','releases latent heat','has no energy change','must cool below 0°C'],a:1,e:'Condensation is the reverse of vaporization, so latent heat is released to the surroundings.'},
{q:'When ice melts at 0°C, its temperature',o:['rises immediately to 100°C','remains approximately constant until melting is complete','falls to −10°C','becomes undefined'],a:1,e:'At normal pressure, pure ice-water coexist at 0°C while latent heat of fusion is absorbed.'},
{q:'If the mass undergoing a phase change is doubled while L remains constant, heat required is',o:['halved','doubled','unchanged','four times'],a:1,e:'Q=mL, so heat required is directly proportional to mass.'},
{q:'The latent heat of fusion of a substance refers to heat needed to change',o:['liquid to gas','solid to liquid','gas to liquid','solid to gas only'],a:1,e:'Fusion means melting: the phase change from solid to liquid.'},
{q:'The latent heat of vaporization refers to change from',o:['solid to liquid','liquid to gas','gas to solid','liquid to solid'],a:1,e:'Vaporization changes a liquid into vapor or gas.'},
{q:'In an ideal calorimetry problem involving melting ice, total heat balance includes',o:['only mcΔT terms','latent heat term mL when phase changes','only pressure','only density'],a:1,e:'Whenever a phase change occurs, the energy balance includes the corresponding latent heat term mL in addition to sensible heat terms if temperatures change.'},
{q:'A 0.5 kg sample has specific latent heat 200 kJ kg⁻¹. Heat needed for complete phase change is',o:['50 kJ','100 kJ','200 kJ','400 kJ'],a:1,e:'Q=mL=0.5×200 kJ=100 kJ.'},
{q:'Latent heat is called “latent” because during the phase change the supplied energy is not observed as a change in',o:['temperature','mass','state','energy'],a:0,e:'The energy is hidden in the change of phase and does not produce a temperature rise during the ideal phase transition.'},
{q:'Evaporation differs from boiling because evaporation',o:['occurs only at boiling point','can occur at the surface at temperatures below boiling point','always occurs throughout the liquid','requires no energy'],a:1,e:'Evaporation is a surface phenomenon that can occur below the boiling point; it requires latent heat.'}
];let i=0,selected=null,checked=false,score=0;const $=id=>document.getElementById(id);function render(){selected=null;checked=false;$('feedback').textContent='';$('continue').disabled=true;$('continue').textContent=i===14?'Finish Quiz →':'Check Answer →';$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=questions[i].q;$('opts').innerHTML='';questions[i].o.forEach((text,n)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+n)+'. '+text;b.dataset.index=n;b.onclick=()=>{if(checked)return;selected=n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('continue').disabled=false};$('opts').appendChild(b)});$('mastery').textContent=`${i} / 15`;$('fill').style.width=`${i/15*100}%`;$('xp').textContent=`XP: ${score*10}`}function next(){if(selected===null)return;if(!checked){checked=true;const item=questions[i],ok=selected===item.a;if(ok)score++;document.querySelectorAll('.opt').forEach(b=>{const n=+b.dataset.index;b.disabled=true;if(n===item.a)b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+`<div class="explain">${item.e}</div>`;$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=`${(i+1)/15*100}%`;$('xp').textContent=`XP: ${score*10}`}else if(i<14){i++;render()}else finish()}function finish(){$('quiz').hidden=true;$('result').hidden=false;const pct=Math.round(score/15*100);$('result').innerHTML=`<h2>🎉 Latent Heat Complete!</h2><div class="score">${score} / 15</div><p><strong>${pct}%</strong> accuracy</p><p>🏆 You earned <strong>${score*10} XP</strong>.</p><p>${score>=12?'🔥 Excellent NEET readiness!':score>=9?'💪 Good work. Revise and retry for mastery.':'📚 Revise Latent Heat and try again.'}</p><button class="continue" type="button" onclick="location.reload()">Retry 15 MCQs</button>`}$('continue').onclick=next;render();</script></body></html>
