<script>
(function(){
'use strict';
const questions = [{"q":"The law of equipartition of energy applies to:","o":["Active quadratic degrees of freedom in thermal equilibrium","Only the total mass of a gas","Only chemical bonds","Only the container volume"],"a":0,"e":"Each active quadratic degree of freedom contributes an average energy of \\(\\frac12 k_BT\\) per molecule at thermal equilibrium."},{"q":"The average energy associated with one active quadratic degree of freedom per molecule is:","o":["\\(k_BT\\)","\\(\\frac12 k_BT\\)","\\(\\frac32 k_BT\\)","\\(2k_BT\\)"],"a":1,"e":"Equipartition assigns \\(\\frac12 k_BT\\) to each active quadratic degree of freedom."},{"q":"For a monatomic ideal gas, the number of translational degrees of freedom is:","o":["1","2","3","6"],"a":2,"e":"A molecule can translate independently along the x, y, and z axes."},{"q":"The internal energy of a monatomic ideal gas is:","o":["\\(nRT\\)","\\(\\frac32 nRT\\)","\\(\\frac52 nRT\\)","\\(3nRT\\)"],"a":1,"e":"Three translational degrees of freedom give \\(U=\\frac32 nRT\\)."},{"q":"A diatomic gas at ordinary temperatures has how many active degrees of freedom when vibration is neglected?","o":["2","3","5","6"],"a":2,"e":"It has three translational and two rotational degrees of freedom, totaling five."},{"q":"For a diatomic ideal gas at ordinary temperatures, neglecting vibration, internal energy is:","o":["\\(\\frac32 nRT\\)","\\(\\frac52 nRT\\)","\\(\\frac72 nRT\\)","\\(3nRT\\)"],"a":1,"e":"Five active degrees of freedom give \\(U=\\frac52 nRT\\)."},{"q":"For an ideal gas with \\(f\\) active degrees of freedom, the internal energy is:","o":["\\(U=fnRT\\)","\\(U=\\frac f2 nRT\\)","\\(U=\\frac2f nRT\\)","\\(U=nR/T\\)"],"a":1,"e":"The total average energy per mole is \\(\\frac f2 RT\\), so for n moles \\(U=\\frac f2 nRT\\)."},{"q":"The molar heat capacity at constant volume for an ideal gas with \\(f\\) active quadratic degrees of freedom is:","o":["\\(C_V=\\frac f2R\\)","\\(C_V=fR\\)","\\(C_V=\\frac2fR\\)","\\(C_V=R/f\\)"],"a":0,"e":"Since \\(U=\\frac f2 nRT\\), differentiating with respect to temperature gives \\(C_V=\\frac f2R\\)."},{"q":"For a monatomic ideal gas, the molar heat capacity at constant volume is:","o":["\\(R\\)","\\(\\frac32R\\)","\\(\\frac52R\\)","\\(3R\\)"],"a":1,"e":"A monatomic gas has \\(f=3\\), so \\(C_V=\\frac32R\\)."},{"q":"For a diatomic ideal gas with vibration neglected, the molar heat capacity at constant volume is:","o":["\\(\\frac32R\\)","\\(2R\\)","\\(\\frac52R\\)","\\(\\frac72R\\)"],"a":2,"e":"With five active degrees of freedom, \\(C_V=\\frac52R\\)."},{"q":"For an ideal gas, Mayer's relation between molar heat capacities is:","o":["\\(C_P+C_V=R\\)","\\(C_P-C_V=R\\)","\\(C_V-C_P=R\\)","\\(C_P/C_V=R\\)"],"a":1,"e":"For an ideal gas, the difference in molar heat capacities is the gas constant: \\(C_P-C_V=R\\)."},{"q":"For a monatomic ideal gas, the ratio \\(\\gamma=C_P/C_V\\) is:","o":["\\(4/3\\)","\\(5/3\\)","\\(7/5\\)","2"],"a":1,"e":"Using \\(C_V=\\frac32R\\) and \\(C_P=\\frac52R\\), \\(\\gamma=5/3\\)."},{"q":"For a diatomic ideal gas with five active degrees of freedom, \\(\\gamma\\) is:","o":["\\(5/3\\)","\\(7/5\\)","\\(9/7\\)","2"],"a":1,"e":"Here \\(C_V=\\frac52R\\) and \\(C_P=\\frac72R\\), so \\(\\gamma=7/5\\)."},{"q":"Which of these is a translational degree of freedom?","o":["Motion along the x-axis","Rotation around a molecular axis only","Vibration only","Chemical reaction"],"a":0,"e":"Translation along each of the three spatial axes counts as a degree of freedom."},{"q":"A rigid linear diatomic molecule has how many rotational degrees of freedom at ordinary temperatures?","o":["1","2","3","5"],"a":1,"e":"Rotation about the two axes perpendicular to the bond contributes significantly; rotation about the bond axis is usually negligible."},{"q":"Vibrational motion of a molecule contributes how much average energy per active vibrational mode in the classical equipartition model?","o":["\\(\\frac12k_BT\\)","\\(k_BT\\)","\\(2k_BT\\)","\\(\\frac14k_BT\\)"],"a":1,"e":"A vibrational mode has both kinetic and potential quadratic terms, each contributing \\(\\frac12 k_BT\\), for a total of \\(k_BT\\)."},{"q":"Why may vibrational degrees of freedom be inactive at ordinary temperatures?","o":["They are quantum mechanically difficult to excite at that temperature","Vibration never occurs","Molecules have no internal structure","The gas has no kinetic energy"],"a":0,"e":"Quantized vibrational energy spacings can be large compared with thermal energy, so vibrational modes may not be appreciably excited."},{"q":"If a molecule has 6 active quadratic degrees of freedom, its average energy per molecule is:","o":["\\(k_BT\\)","\\(2k_BT\\)","\\(3k_BT\\)","\\(6k_BT\\)"],"a":2,"e":"Equipartition gives \\(E=\\frac f2k_BT=3k_BT\\) for \\(f=6\\)."},{"q":"For one mole of a gas with \\(f=3\\), the internal energy is:","o":["\\(RT\\)","\\(\\frac32RT\\)","\\(\\frac52RT\\)","\\(3RT\\)"],"a":1,"e":"For one mole, \\(U=\\frac f2RT=\\frac32RT\\)."},{"q":"As more degrees of freedom become thermally active, the molar heat capacity at constant volume generally:","o":["Increases","Decreases to zero","Always stays at R","Becomes negative"],"a":0,"e":"Each additional active quadratic degree of freedom adds \\(R/2\\) to the molar heat capacity at constant volume."},{"q":"Which statement about equipartition is correct?","o":["Every degree of freedom contributes the same energy regardless of temperature","Each active quadratic term contributes \\(\\frac12k_BT\\) on average","It applies only to solids","It says every molecule has identical energy"],"a":1,"e":"The classical equipartition theorem gives the same average contribution per active quadratic term, not identical energy for every molecule."},{"q":"A gas has \\(f=5\\) active degrees of freedom and contains 2 mol at temperature \\(T\\). Its internal energy is:","o":["\\(5RT\\)","\\(\\frac52RT\\)","\\(\\frac52(2)RT=5RT\\)","\\(10RT\\)"],"a":2,"e":"Use \\(U=\\frac f2nRT=\\frac52(2)RT=5RT\\)."},{"q":"For a monatomic ideal gas, if temperature doubles, internal energy:","o":["Doubles","Halves","Quadruples","Remains constant"],"a":0,"e":"For a fixed amount of gas, \\(U=\\frac32nRT\\), so internal energy is proportional to absolute temperature."},{"q":"Which pair of degrees of freedom is associated with a classical vibrational mode?","o":["Kinetic and potential energy terms","Two translational terms only","Two chemical bonds","Pressure and volume"],"a":0,"e":"A harmonic vibrational mode has one quadratic kinetic term and one quadratic potential term."},{"q":"The law of equipartition is most directly used to estimate:","o":["Molecular energy and heat capacities","Molecular color","Atomic number","Container shape"],"a":0,"e":"Counting active degrees of freedom lets us estimate ideal-gas internal energy and heat capacities."},{"q":"For a gas with \\(f=6\\), the molar heat capacity at constant volume is:","o":["\\(R\\)","\\(2R\\)","\\(3R\\)","\\(6R\\)"],"a":2,"e":"\\(C_V=\\frac f2R=3R\\)."},{"q":"For a classical ideal gas with \\(f\\) active degrees of freedom, the ratio of heat capacities is:","o":["\\(\\gamma=\\frac{f+2}{f}\\)","\\(\\gamma=\\frac f{f+2}\\)","\\(\\gamma=f+2\\)","\\(\\gamma=\\frac2f\\)"],"a":0,"e":"Since \\(C_V=\\frac f2R\\) and \\(C_P=C_V+R\\), \\(\\gamma=(f+2)/f\\)."},{"q":"A linear diatomic gas has \\(C_V=\\frac52R\\) in the model where vibration is inactive. Its degrees of freedom are:","o":["3","4","5","7"],"a":2,"e":"From \\(C_V=\\frac f2R\\), the value \\(C_V=\\frac52R\\) implies \\(f=5\\)."},{"q":"Which is a limitation of the classical equipartition theorem?","o":["It may fail when quantum effects make some modes inactive","It says temperature cannot be measured","It only works for vacuum","It predicts all gases have the same mass"],"a":0,"e":"At lower temperatures or for high-frequency modes, quantum effects can prevent some degrees of freedom from being thermally excited."},{"q":"For an ideal gas, adding one active quadratic degree of freedom per molecule changes molar \\(C_V\\) by:","o":["\\(R/2\\)","\\(R\\)","\\(2R\\)","No change"],"a":0,"e":"Each added active quadratic degree of freedom contributes \\(R/2\\) to molar heat capacity at constant volume."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';

 item.o.forEach((text,j)=>{

 });

 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];

 if(window.MathJax?.typesetPromise) MathJax.typesetPromise([$('feedback')]).catch(()=>{});
