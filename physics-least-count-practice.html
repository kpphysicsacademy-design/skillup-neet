<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SkillUp Physics | Least Count Practice</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.opt.selected{border-color:#5146a5;background:#f4f1ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.opt:disabled{cursor:default}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>📐 Least Count Practice</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="action">CHECK</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['The least count of an instrument is:',['The largest value it can measure','The smallest measurement it can reliably resolve','The average of all readings','The zero error'],1,'Least count is the smallest measurement an instrument can resolve or read.'],['A standard metre scale is usually graduated in millimetres. Its least count is:',['1 m','1 cm','1 mm','0.1 mm'],2,'The smallest marked division is 1 mm, so the least count is 1 mm.'],['A ruler has 10 equal divisions over 1 cm. Its least count is:',['1 cm','1 mm','0.1 mm','10 mm'],1,'1 cm = 10 mm, so each division is 1 mm.'],['A vernier calipers has a main scale division of 1 mm and 10 vernier divisions equal 9 mm. Its least count is:',['1 mm','0.9 mm','0.1 mm','0.01 mm'],2,'1 MSD = 1 mm and 1 VSD = 0.9 mm, so LC = 1 − 0.9 = 0.1 mm.'],['If 20 vernier scale divisions equal 19 mm while 1 main scale division is 1 mm, the least count is:',['1 mm','0.95 mm','0.05 mm','0.01 mm'],2,'1 VSD = 19/20 mm = 0.95 mm; LC = 1 − 0.95 = 0.05 mm.'],['A screw gauge has pitch 0.5 mm and 50 divisions on its circular scale. Its least count is:',['0.5 mm','0.05 mm','0.01 mm','0.001 mm'],2,'Least count = pitch / circular-scale divisions = 0.5/50 = 0.01 mm.'],['A screw gauge has pitch 1 mm and 100 circular scale divisions. Its least count is:',['0.1 mm','0.01 mm','0.001 mm','1 mm'],1,'Least count = 1/100 mm = 0.01 mm.'],['Which instrument generally has a smaller least count?',['Metre scale','Screw gauge','Measuring tape','Ordinary ruler'],1,'A screw gauge is designed for very small dimensions and generally has a much smaller least count.'],['If the least count of an instrument is 0.01 cm, the smallest measurable increment is:',['1 cm','0.1 cm','0.01 cm','0.001 cm'],2,'The least count itself is the smallest measurable increment: 0.01 cm.'],['An instrument has 1 mm as its least count. A reading of 12.35 mm from that instrument is:',['Consistent with the stated least count','More precise than the instrument permits','Always a zero reading','A measurement in metres'],1,'A least count of 1 mm does not justify reporting hundredths of a millimetre.'],['For a vernier calipers, least count is calculated as:',['1 MSD + 1 VSD','1 MSD − 1 VSD','1 MSD × 1 VSD','1 MSD / 1 VSD'],1,'For the common direct vernier, LC = 1 MSD − 1 VSD.'],['For a screw gauge, least count is calculated as:',['Pitch × number of divisions','Pitch ÷ number of circular-scale divisions','Pitch + number of divisions','Number of divisions ÷ pitch'],1,'Screw gauge LC = pitch divided by the number of circular-scale divisions.'],['If pitch is 2 mm and the circular scale has 100 divisions, the least count is:',['0.2 mm','0.02 mm','0.002 mm','2 mm'],1,'LC = 2/100 = 0.02 mm.'],['Which change improves the resolution of an instrument?',['Increasing its least count','Decreasing its least count','Removing its scale','Increasing its zero error'],1,'A smaller least count allows finer measurements and therefore better resolution.'],['Two instruments have least counts 0.1 mm and 0.01 mm. Which can resolve smaller differences?',['The 0.1 mm instrument','The 0.01 mm instrument','Both equally','Neither'],1,'The instrument with the smaller least count can resolve smaller differences.']];let i=0,score=0,answered=false,selected=-1;const $=x=>document.getElementById(x);function render(){answered=false;selected=-1;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q[1].map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('action').classList.remove('hide');$('action').textContent='CHECK'});$('xp').textContent='';$('action').classList.add('hide');$('action').disabled=false;}function check(){if(selected<0)return;if(!answered){answered=true;const q=qs[i],ok=selected===q[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===selected&&!ok)b.classList.add('wrong')});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[3];if(ok)score++;$('score').textContent=`XP ${score}`;$('fill').style.width=`${(i+1)/15*100}%`;$('action').textContent=i===14?'FINISH':'Next Question →';return;}if(i<14){i++;render()}else{$('quiz').innerHTML='';$('action').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('action').onclick=check;render();</script></body></html>
