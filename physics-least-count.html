<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Least Count</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f6f8fb;color:#13233b}.wrap{max-width:760px;margin:auto;padding:28px 18px 40px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #00000012}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{margin:0;font-size:28px}.xp{font-weight:800}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:99px;overflow:hidden;margin:12px 0 24px}.fill{height:100%;width:0;background:#58cc02;transition:.3s}.q{font-size:21px;font-weight:800;line-height:1.45;margin:0 0 18px}.opts{display:grid;gap:10px}.opt{display:block;width:100%;text-align:left;padding:15px 16px;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer;transition:.16s}.opt:hover{background:#f1f6ff}.opt.selected{border-color:#5146a5;background:#f4f1ff}.opt.correct{border-color:#39a852!important;background:#e9f8ed!important}.opt.wrong{border-color:#e05252!important;background:#fff0f0!important}.opt:disabled{cursor:default}.actions{display:flex;gap:10px;margin-top:18px}.btn{padding:13px 20px;border:0;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer}.check{background:#58cc02;color:#fff}.next{background:#2563eb;color:#fff}.check:disabled,.next:disabled{opacity:.45;cursor:not-allowed}.feedback{min-height:28px;margin-top:15px;font-weight:700;line-height:1.5}.explain{font-weight:500;color:#40536a}.result{display:none;text-align:center;padding:12px 0}.retry{background:#2563eb;color:#fff}.back{display:block;width:100%;text-align:center;text-decoration:none;background:#172033;color:#fff;border-radius:14px;padding:14px;margin-top:16px;font-size:16px;font-weight:800}@media(max-width:600px){.wrap{padding:20px 12px}.card{padding:20px}.top h1{font-size:24px}.q{font-size:19px}.opt{font-size:15px}.actions{flex-direction:column}.btn{width:100%}}</style></head><body><main class="wrap"><section class="card"><div class="top"><h1>📏 Least Count</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></div><div class="meta"><span id="count">Question 1/15</span><span id="mastery">Skill Mastery 0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div><div id="quiz"></div><div class="feedback" id="feedback"></div><div class="actions"><button id="check" class="btn check" disabled>Check Answer</button><button id="next" class="btn next" disabled>Next Question →</button></div><div id="result" class="result"><h2>🎉 Skill Complete!</h2><p id="resultText"></p><button id="retry" class="btn retry">Retry Quiz ↻</button></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></section></main><script>const qs=[['What is the least count of a measuring instrument?',['The largest quantity the instrument can measure','The smallest measurement that can be measured reliably by the instrument','The average of all readings','The total range of the instrument'],1,'Least count is the smallest value that an instrument can measure reliably.'],['The least count of a metre scale commonly marked in millimetres is:',['1 cm','1 mm','0.1 mm','10 mm'],1,'The smallest division is 1 mm, so the least count is 1 mm.'],['For a standard metre scale, 1 cm is divided into:',['2 equal parts','5 equal parts','10 equal parts','100 equal parts'],2,'Each centimetre is normally divided into 10 millimetres.'],['A smaller least count generally means:',['Lower measurement resolution','Greater measurement resolution','Larger zero error','No uncertainty'],1,'A smaller least count allows finer measurements.'],['The least count of a direct Vernier calipers is commonly calculated as:',['1 MSD + 1 VSD','1 MSD − 1 VSD','1 MSD × 1 VSD','1 MSD ÷ 1 VSD'],1,'For the usual direct Vernier, least count = 1 MSD − 1 VSD.'],['If 10 Vernier scale divisions equal 9 main scale divisions and 1 MSD = 1 mm, the least count is:',['0.01 mm','0.1 mm','1.0 mm','1.9 mm'],1,'1 VSD = 0.9 mm, so LC = 1.0 − 0.9 = 0.1 mm.'],['The least count of a screw gauge is calculated using:',['Pitch × number of divisions','Pitch ÷ number of circular scale divisions','Pitch + circular scale divisions','Pitch − circular scale divisions'],1,'Screw gauge least count = pitch divided by the number of circular scale divisions.'],['A screw gauge has pitch 1 mm and 100 circular scale divisions. Its least count is:',['0.1 mm','0.01 mm','1 mm','100 mm'],1,'LC = 1/100 mm = 0.01 mm.'],['If an instrument has a least count of 0.01 cm, the smallest reliable increment is:',['1 cm','0.1 cm','0.01 cm','0.001 cm'],2,'The least count represents the smallest readable increment.'],['Which provides finer length resolution?',['Metre scale with 1 mm divisions','Vernier calipers with 0.1 mm least count','Ruler with 1 cm divisions','Scale with 10 mm divisions'],1,'The smaller least count of 0.1 mm gives finer resolution.'],['Least count is mainly related to an instrument’s:',['Resolution','Mass','Colour','Temperature'],0,'Least count describes measurement resolution.'],['If the smallest division on a simple scale is 2 mm, its least count is:',['0.2 mm','1 mm','2 mm','20 mm'],2,'For a simple scale, the smallest marked division determines the least count.'],['Two instruments have least counts 0.1 mm and 0.01 mm. Which has better resolution?',['0.1 mm instrument','0.01 mm instrument','Both are identical','Cannot be compared'],1,'0.01 mm is the smaller least count, so it gives better resolution.'],['Can an instrument normally measure a value much smaller than its least count reliably?',['Yes, always','No, not reliably','Only if the unit is changed','Only for temperature'],1,'A value below the instrument’s resolution cannot normally be read reliably.'],['Which statement about least count is correct?',['It is always equal to zero error','It determines the smallest reliable increment an instrument can resolve','It is the same as percentage error','It changes the physical quantity being measured'],1,'Least count characterizes measurement resolution and does not itself change the physical quantity.']];let i=0,xp=0,correct=0,selected=-1,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;selected=-1;const a=qs[i];$('count').textContent=`Question ${i+1}/${qs.length}`;$('mastery').textContent=`Skill Mastery ${correct} / ${qs.length}`;$('xp').textContent=xp;$('quiz').innerHTML=`<div class="q">${a[0]}</div>`+a[1].map((o,j)=>`<button type="button" class="opt" data-n="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false});$('feedback').textContent='';$('check').disabled=true;$('next').disabled=true;$('next').textContent=i===qs.length-1?'Finish →':'Next Question →';$('fill').style.width=`${correct/qs.length*100}%`}function grade(){if(selected<0)return;answered=true;const a=qs[i],ok=selected===a[2];document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===selected&&!ok)b.classList.add('wrong')});if(ok){correct++;xp+=10;$('feedback').innerHTML='✨ <b>Correct!</b> +10 XP<br><span class="explain">'+a[3]+'</span>'}else{$('feedback').innerHTML='❌ <b>Incorrect.</b> Correct answer: '+a[1][a[2]]+'<br><span class="explain">'+a[3]+'</span>'}$('xp').textContent=xp;$('mastery').textContent=`Skill Mastery ${correct} / ${qs.length}`;$('fill').style.width=`${correct/qs.length*100}%`;$('check').disabled=true;$('next').disabled=false}function advance(){if(i<qs.length-1){i++;render();window.scrollTo({top:0,behavior:'smooth'})}else{finish()}}function finish(){$('fill').style.width='100%';$('count').textContent='Complete!';$('mastery').textContent=`Skill Mastery ${correct} / ${qs.length}`;$('quiz').innerHTML='';$('feedback').textContent='';$('check').style.display='none';$('next').style.display='none';$('result').style.display='block';$('resultText').textContent=`You answered ${correct} of ${qs.length} correctly and earned ${xp} XP.`}$('check').onclick=grade;$('next').onclick=advance;$('retry').onclick=()=>{i=0;xp=0;correct=0;$('check').style.display='';$('next').style.display='';$('result').style.display='none';render();window.scrollTo({top:0,behavior:'smooth'})};render();</script></body></html>
