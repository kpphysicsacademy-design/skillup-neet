<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp | Least Count</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;margin:0;color:#172033}
.wrap{max-width:850px;margin:auto;padding:28px 18px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.top h1{margin:0;font-size:1.8rem}.xp{font-weight:800}
.intro{margin:12px 0 0}
.card{background:white;border-radius:22px;padding:24px;margin-top:18px;box-shadow:0 5px 20px #00000012}
.mastery{font-weight:800;margin-top:18px}.bar{height:10px;background:#e8eaf0;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#58cc02;transition:.3s}
.q{font-size:1.3rem;font-weight:750;line-height:1.45}.meta{font-size:.95rem;color:#4b5563}
.opts{display:grid;gap:10px;margin-top:18px}.opts button{padding:15px;border:2px solid #e2e5eb;border-radius:14px;background:white;text-align:left;font-size:1rem;cursor:pointer}.opts button:hover{border-color:#58cc02}.opts button.selected{border-color:#5146a5;background:#f4f1ff}.opts button.correct{border-color:#58cc02;background:#effbea}.opts button.wrong{border-color:#e5484d;background:#fff0f0}.opts button:disabled{cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.btn{padding:13px 22px;border:0;border-radius:14px;font-weight:800;cursor:pointer}.check{background:#58cc02;color:white}.next{background:#58cc02;color:white}.next:disabled,.check:disabled{opacity:.45;cursor:not-allowed}
.feedback{font-weight:700;margin-top:16px;min-height:24px;line-height:1.5}.hint{margin-top:16px}.result{text-align:center;padding-top:10px}
.back{display:inline-block;margin-top:18px;padding:12px 18px;border:2px solid #5146a5;border-radius:14px;color:#5146a5;text-decoration:none;font-weight:800;transition:.2s}.back:hover{background:#5146a5;color:white;transform:translateY(-1px)}.back:active{transform:scale(.97)}
@media(max-width:600px){.wrap{padding:20px 14px}.top h1{font-size:1.5rem}.card{padding:20px}.q{font-size:1.18rem}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><h1>📏 Least Count</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></div>
<p class="intro">Master least count, instrument resolution, Vernier calipers and screw gauge concepts with 15 NEET-style questions.</p>
<div class="mastery">🎯 Skill Mastery <span id="mt">0 / 15</span></div>
<div class="bar"><div id="fill" class="fill"></div></div>
<section class="card">
<div id="count" class="meta">Question 1 of 15</div>
<p id="q" class="q"></p>
<div id="opts" class="opts"></div>
<div class="actions"><button id="check" class="btn check">Check Answer</button><button id="next" class="btn next" disabled>Continue →</button></div>
<div id="fb" class="feedback"></div>
<p id="hint" class="hint">💡 Read the smallest reliable division carefully.</p>
<div id="result" class="result" style="display:none"><h2>🏆 Skill Complete!</h2><p id="score"></p><button id="retry" class="btn check">Retry Skill</button></div>
</section>
<a class="back" href="physics-home.html">← Back to Physics Path</a>
</main>
<script>
const qs=[
['What is the least count of a measuring instrument?',['The largest quantity the instrument can measure','The smallest measurement that can be measured reliably by the instrument','The average of all readings','The total range of the instrument'],1,'Least count is the smallest value that an instrument can measure reliably.'],
['The least count of a metre scale commonly marked in millimetres is:',['1 cm','1 mm','0.1 mm','10 mm'],1,'The smallest division is 1 mm, so the least count is 1 mm.'],
['For a standard metre scale, 1 cm is divided into:',['2 equal parts','5 equal parts','10 equal parts','100 equal parts'],2,'Each centimetre is normally divided into 10 millimetres.'],
['A smaller least count generally means:',['Lower measurement resolution','Greater measurement resolution','Larger zero error','No uncertainty'],1,'A smaller least count allows finer measurements.'],
['The least count of a direct Vernier calipers is commonly calculated as:',['1 MSD + 1 VSD','1 MSD − 1 VSD','1 MSD × 1 VSD','1 MSD ÷ 1 VSD'],1,'For the usual direct Vernier, least count = 1 MSD − 1 VSD.'],
['If 10 Vernier scale divisions equal 9 main scale divisions and 1 MSD = 1 mm, the least count is:',['0.01 mm','0.1 mm','1.0 mm','1.9 mm'],1,'1 VSD = 0.9 mm, so LC = 1.0 − 0.9 = 0.1 mm.'],
['The least count of a screw gauge is calculated using:',['Pitch × number of divisions','Pitch ÷ number of circular scale divisions','Pitch + circular scale divisions','Pitch − circular scale divisions'],1,'Screw gauge least count = pitch divided by the number of circular scale divisions.'],
['A screw gauge has pitch 1 mm and 100 circular scale divisions. Its least count is:',['0.1 mm','0.01 mm','1 mm','100 mm'],1,'LC = 1/100 mm = 0.01 mm.'],
['If an instrument has a least count of 0.01 cm, the smallest reliable increment is:',['1 cm','0.1 cm','0.01 cm','0.001 cm'],2,'The least count represents the smallest readable increment.'],
['Which provides finer length resolution?',['Metre scale with 1 mm divisions','Vernier calipers with 0.1 mm least count','Ruler with 1 cm divisions','Scale with 10 mm divisions'],1,'The smaller least count of 0.1 mm gives finer resolution.'],
['Least count is mainly related to an instrument’s:',['Resolution','Mass','Colour','Temperature'],0,'Least count describes measurement resolution.'],
['If the smallest division on a simple scale is 2 mm, its least count is:',['0.2 mm','1 mm','2 mm','20 mm'],2,'For a simple scale, the smallest marked division determines the least count.'],
['Two instruments have least counts 0.1 mm and 0.01 mm. Which has better resolution?',['0.1 mm instrument','0.01 mm instrument','Both are identical','Cannot be compared'],1,'0.01 mm is the smaller least count, so it gives better resolution.'],
['Can an instrument normally measure a value much smaller than its least count reliably?',['Yes, always','No, not reliably','Only if the unit is changed','Only for temperature'],1,'A value below the instrument’s resolution cannot normally be read reliably.'],
['Which statement about least count is correct?',['It is always equal to zero error','It determines the smallest reliable increment an instrument can resolve','It is the same as percentage error','It changes the physical quantity being measured'],1,'Least count characterizes measurement resolution and does not itself change the physical quantity.']
];
let i=0,xp=0,correct=0,selected=-1,answered=false;
const $=id=>document.getElementById(id);
function render(){
 answered=false;selected=-1;
 const a=qs[i];
 $('count').textContent=`Question ${i+1} of ${qs.length}`;
 $('q').textContent=a[0];$('opts').innerHTML='';$('fb').textContent='';$('fb').className='feedback';
 $('hint').textContent='💡 '+a[3];$('check').disabled=false;$('next').disabled=true;$('next').textContent=i===qs.length-1?'Finish →':'Continue →';
 qs[i][1].forEach((o,j)=>{const b=document.createElement('button');b.type='button';b.textContent=String.fromCharCode(65+j)+'. '+o;b.onclick=()=>{if(answered)return;selected=j;[...$('opts').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('opts').appendChild(b)});
 $('fill').style.width=`${correct/qs.length*100}%`;$('mt').textContent=`${correct} / ${qs.length}`;
}
function grade(){
 if(selected<0){$('fb').className='feedback';$('fb').textContent='Choose an answer first 👆';return}
 answered=true;const a=qs[i],ok=selected===a[2];
 [...$('opts').children].forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===selected&&j!==a[2])b.classList.add('wrong')});
 if(ok){correct++;xp+=10;$('xp').textContent=xp;$('fb').textContent='✅ Correct! +10 XP — '+a[3]}else{$('fb').textContent='❌ Not quite. Correct answer: '+a[1][a[2]]+' — '+a[3]}
 $('fb').className='feedback';$('mt').textContent=`${correct} / ${qs.length}`;$('fill').style.width=`${correct/qs.length*100}%`;$('check').disabled=true;$('next').disabled=false;
}
$('check').onclick=grade;
$('next').onclick=()=>{if(i<qs.length-1){i++;render()}else{finish()}};
function finish(){
 $('fill').style.width='100%';$('q').textContent='🎉 Least Count mastered!';$('opts').innerHTML='';$('check').style.display='none';$('next').style.display='none';$('hint').style.display='none';$('fb').textContent=`You scored ${xp} XP out of ${qs.length*10} XP.`;$('result').style.display='block';$('score').textContent=`${correct} / ${qs.length} correct • ${xp} XP`;
}
$('retry').onclick=()=>{i=0;xp=0;correct=0;$('xp').textContent='0';$('result').style.display='none';$('check').style.display='';$('next').style.display='';$('hint').style.display='';render()};
render();
</script>
</body>
</html>
