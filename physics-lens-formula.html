<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Lens Formula</title><meta name="description" content="SkillUp Physics Lens Formula interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🔬</span><h1>Lens Formula</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["For a thin lens using the Cartesian sign convention, the lens formula is:",["1/f = 1/v - 1/u","1/f = 1/v + 1/u","1/f = u + v","1/f = v - u"],0,"The thin-lens formula with the Cartesian sign convention is 1/f = 1/v - 1/u."],["In the lens formula, u represents the:",["Object distance from the optical centre","Image height","Image distance from the optical centre","Focal power"],0,"u is the signed distance of the object from the optical centre of the lens."],["In the lens formula, v represents the:",["Object height","Signed image distance from the optical centre","Focal length only","Lens aperture"],1,"v is the signed distance of the image from the optical centre."],["In the Cartesian sign convention, distances measured in the direction of incident light are taken as:",["Positive","Negative","Zero","Infinite"],0,"The positive direction is chosen along the direction of incident light; distances measured in that direction are positive."],["For a real object placed to the left of a thin lens, the object distance u is generally:",["Negative","Positive","Zero","Infinite"],0,"For the usual setup with light travelling left to right, a real object lies on the negative side, so u is negative."],["For a convex lens forming a real image on the opposite side, the image distance v is generally:",["Positive","Negative","Zero","Infinite"],0,"A real image formed on the outgoing side has positive v under the Cartesian convention."],["For a concave lens forming a virtual image on the same side as the object, v is generally:",["Negative","Positive","Zero","Infinite"],0,"A virtual image formed on the incident side has negative image distance v."],["A convex lens has focal length 20 cm. An object is placed 30 cm to its left. Using 1/f = 1/v - 1/u, the image distance is:",["60 cm","12 cm","-60 cm","-12 cm"],0,"Here f=+20 cm and u=-30 cm. Thus 1/v=1/f+1/u=1/20-1/30=1/60, so v=+60 cm."],["A convex lens has focal length 10 cm and an object is placed 30 cm to its left. The image distance is:",["15 cm","-15 cm","7.5 cm","30 cm"],0,"With f=+10 cm and u=-30 cm, 1/v=1/10-1/30=1/15, so v=+15 cm."],["A convex lens has f=15 cm and an object is placed 30 cm to its left. The image is formed:",["At 30 cm on the other side","At 15 cm on the other side","At infinity","On the same side as the object"],0,"For u=-30 cm and f=+15 cm, the lens formula gives v=+30 cm. The object is at 2F, so the image is also at 2F."],["If an object is placed at the principal focus of a convex lens, the refracted rays emerge:",["Parallel to the principal axis","Back toward the object","At 90° to the axis","Through the optical centre only"],0,"An object at the principal focus of a converging lens produces an image at infinity, so the emergent rays are parallel."],["If the object distance and image distance are both 30 cm for a convex lens, its focal length is:",["15 cm","30 cm","60 cm","10 cm"],0,"Using 1/f=1/v-1/u with v=+30 cm and u=-30 cm gives 1/f=2/30=1/15, so f=15 cm."],["The lens formula can be used for:",["Both convex and concave thin lenses","Only convex lenses","Only concave lenses","Only plane glass plates"],0,"The thin-lens equation applies to both converging and diverging thin lenses when the appropriate sign convention is used."],["A concave lens has f=-20 cm and a real object is placed at u=-30 cm. Its image distance v is:",["-12 cm","+12 cm","-60 cm","+60 cm"],0,"1/v=1/f+1/u=-1/20-1/30=-1/12, so v=-12 cm. The image is virtual and on the object side."],["The magnification produced by a thin lens is given by:",["m = v/u","m = u/v","m = f/u","m = u+v"],0,"For a thin lens, linear magnification is m=v/u using the Cartesian sign convention."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
