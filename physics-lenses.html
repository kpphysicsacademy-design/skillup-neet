<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Lenses</title><meta name="description" content="SkillUp Physics Lenses interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🔍</span><h1>Lenses</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["A lens is a transparent optical element bounded by:",["Two refracting surfaces, at least one of which is usually curved","Only two plane mirrors","A single reflecting surface","Only one opaque surface"],0,"A lens is a transparent medium bounded by two refracting surfaces; in common thin lenses the surfaces are spherical or one may be plane."] ,["A convex lens is also called a:",["Converging lens","Diverging lens","Plane mirror","Prism only"],0,"A convex lens generally converges a parallel beam of light toward its principal focus."] ,["A concave lens is also called a:",["Diverging lens","Converging lens","Spherical mirror","Reflecting lens"],0,"A concave lens generally diverges a parallel beam of light."] ,["The principal axis of a lens is the line joining the centres of curvature of its spherical surfaces. For a symmetric thin lens it passes through the:",["Optical centre","Only the focus","Only the aperture edge","Image plane only"],0,"The principal axis passes through the optical centre and the relevant centres of curvature of the lens surfaces."] ,["A ray passing through the optical centre of a thin lens emerges:",["Approximately undeviated","Always parallel to the principal axis","Reflected backward","At 90° to the axis"],0,"A principal ray through the optical centre of a thin lens is treated as passing undeviated in the thin-lens approximation."] ,["A convex lens causes parallel rays close to the principal axis to:",["Converge at the principal focus","Diverge from the optical centre","Stop at the lens","Reflect back to the source"],0,"Paraxial parallel rays incident on a convex lens converge at its principal focus."] ,["A concave lens causes parallel rays to:",["Diverge as if coming from a virtual focus","Converge at a real focus in front of the lens","Stop completely","Reflect from the lens"],0,"A concave lens makes parallel rays diverge; their backward extensions meet at a virtual focus on the incident side."] ,["The distance from the optical centre to the principal focus is called:",["Focal length","Radius of aperture","Object height","Power only"],0,"The focal length is the distance between the optical centre and the principal focus of a lens."] ,["The lens formula using the Cartesian sign convention is:",["1/f = 1/v - 1/u","1/f = 1/v + 1/u","f = u + v","1/f = u - v"],0,"For a thin lens with the Cartesian sign convention, 1/f=1/v-1/u."] ,["For a convex lens in air, the focal length is generally:",["Positive","Negative","Zero","Infinite"],0,"A converging convex lens has a real principal focus on the outgoing side, giving positive focal length under the Cartesian convention."] ,["For a concave lens in air, the focal length is generally:",["Negative","Positive","Zero","Infinite"],0,"A diverging concave lens has a virtual focus on the incident side, giving negative focal length."] ,["A convex lens has focal length 20 cm. Its power is:",["+5 D","+0.05 D","-5 D","+20 D"],0,"20 cm=0.20 m, so P=1/f=1/0.20=+5 D."] ,["When an object is placed beyond 2F of a convex lens, the image is generally:",["Real, inverted and diminished between F and 2F","Virtual, erect and enlarged","Real and erect beyond 2F","At infinity in every case"],0,"For a convex lens, an object beyond 2F forms a real, inverted, diminished image between F and 2F."] ,["When an object is placed between F and 2F of a convex lens, the image is generally:",["Real, inverted and magnified beyond 2F","Virtual, erect and diminished","Real, erect and same size","At the optical centre"],0,"An object between F and 2F produces a real, inverted, magnified image beyond 2F."] ,["Two thin lenses of powers +3 D and -1 D are placed in contact. Their equivalent power is:",["+2 D","+4 D","-2 D","-4 D"],0,"For thin lenses in contact, powers add algebraically: P=+3+(-1)=+2 D."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
