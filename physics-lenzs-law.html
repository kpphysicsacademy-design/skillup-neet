<style>

<body><main class="card"><header class="header"><span class="icon">🧲</span><h1 class="title">Lenz's Law</h1></header><section id="quiz"><div class="status"><span id="counter">Question 1/15</span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="question"></p><div id="options" class="options"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main>
<script>
const qs=[
["Lenz's law determines the direction of induced:",["Current","Mass","Temperature","Resistance"],0,"Lenz's law determines the direction of induced current so that its magnetic effect opposes the change in flux."],
["The negative sign in Faraday's law is a mathematical expression of:",["Ohm's law","Lenz's law","Coulomb's law","Gauss's law"],1,"The negative sign represents Lenz's law."],
["According to Lenz's law, induced current opposes the:",["Magnetic field itself always","Change in magnetic flux","Resistance","Charge of electron"],1,"The induced current opposes the change in magnetic flux that produces it."],
["When a north pole of a magnet approaches a coil, the near face of the coil becomes:",["North","South","Neutral always","Alternating instantly"],0,"The coil develops a north face to oppose the approaching north pole."],
["When a north pole of a magnet moves away from a coil, the near face of the coil becomes:",["North","South","Zero field","Uncharged"],1,"The coil develops a south face, attracting the receding north pole and opposing the change."],
["Lenz's law is consistent with conservation of:",["Energy","Mass only","Charge only","Momentum only"],0,"Lenz's law ensures that electromagnetic induction does not create energy from nothing; it is consistent with conservation of energy."],
["If magnetic flux through a loop increases, the induced magnetic field acts to:",["Increase the flux further","Oppose the increase","Eliminate resistance","Stop all charges"],1,"The induced field opposes an increase in magnetic flux."],
["If magnetic flux through a loop decreases, the induced magnetic field acts to:",["Oppose the decrease","Increase resistance to infinity","Make flux zero faster","Reverse gravity"],0,"The induced field tends to maintain the original flux direction and therefore opposes the decrease."],
["A magnet falling through a conducting tube slows down mainly because of:",["Lenz's law and induced currents","Gravity disappearing","Reduced magnet mass","Constant electric charge"],0,"Changing flux induces currents whose magnetic field opposes the magnet's motion."],
["Lenz's law helps explain magnetic braking because induced currents:",["Assist motion","Oppose motion","Remove magnetic fields permanently","Increase mass"],1,"Eddy currents generate magnetic effects opposing the relative motion."],
["If the direction of motion of a magnet relative to a coil is reversed, the induced current direction:",["Reverses","Always remains the same","Becomes zero permanently","Doubles necessarily"],0,"Reversing the change in flux reverses the induced emf/current direction."],
["The force required to move a magnet toward a conducting coil is related to:",["The opposing induced magnetic effect","No electromagnetic effect","A decrease in gravity","Nuclear force"],0,"The induced magnetic effect opposes the motion, so external work is required."],
["Lenz's law is used together with Faraday's law to determine induced emf's:",["Magnitude and direction","Mass and volume","Temperature and pressure","Density and charge"],0,"Faraday's law gives magnitude through rate of flux change; Lenz's law gives direction."],
["For a closed conducting loop, if there is no change in magnetic flux, Lenz's law predicts:",["No induced emf/current","Maximum induced current","Infinite emf","A permanent current"],0,"With no changing flux, Faraday's law gives zero induced emf."],
["Which statement best describes Lenz's law?",["Induction always increases the change","Induced effects oppose the change causing them","Magnetic flux is always zero","Current cannot be induced"],1,"Lenz's law states that the induced effect opposes the change in magnetic flux responsible for induction."]
];
let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;let q=qs[i];$('counter').textContent=`Question ${i+1}/15`;$('xp').textContent=`XP ${xp}`;$('fill').style.width=`${i/15*100}%`;$('question').textContent=q[0];$('feedback').textContent='';$('feedback').className='feedback';$('next').disabled=true;$('next').textContent=i===14?'Finish':'Next';$('options').innerHTML='';q[1].forEach((o,n)=>{let b=document.createElement('button');b.className='option';b.type='button';b.textContent=`${String.fromCharCode(65+n)}. ${o}`;b.onclick=()=>answer(n);$('options').appendChild(b)})}function answer(n){if(answered)return;answered=true;let q=qs[i],bs=[...document.querySelectorAll('.option')];bs.forEach(b=>b.disabled=true);if(n===q[2]){score++;xp+=10;bs[n].classList.add('correct');$('feedback').textContent=`Correct! ${q[3]}`;$('feedback').classList.add('good')}else{bs[n].classList.add('incorrect');bs[q[2]].classList.add('correct');$('feedback').textContent=`Not quite. ${q[3]}`;$('feedback').classList.add('bad')}$('xp').textContent=`XP ${xp}`;$('next').disabled=false}function next(){if(!answered)return;if(i<14){i++;render()}else{$('fill').style.width='100%';$('quiz').hidden=true;$('result').hidden=false;$('score').textContent=`Score: ${score}/15`;$('earned').textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$('result').hidden=true;$('quiz').hidden=false;render()}$('next').onclick=next;$('restart').onclick=restart;render();
</script></body></html>
