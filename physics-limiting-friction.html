<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Limiting Friction</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:flex-end}.xp{background:#fff;border:1px solid #dfe3ea;border-radius:14px;padding:7px 11px;font-weight:850}.intro{margin:24px 0 18px}.intro h1{margin:0 0 8px;font-size:2rem}.intro p{margin:0;color:#596273;line-height:1.55}.progress{height:12px;background:#e4e7ed;border-radius:99px;overflow:hidden;margin:20px 0}.fill{height:100%;width:0;background:#58cc02;transition:width .25s}.card{background:#fff;border-radius:22px;padding:26px;box-shadow:0 8px 24px rgba(23,32,51,.08)}.meta{font-size:.95rem;font-weight:800;color:#596273;margin-bottom:12px}.q{font-size:1.3rem;line-height:1.45;margin:0 0 20px}.options{display:grid;gap:10px}.option{padding:15px 16px;border:2px solid #dfe3ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;color:#172033;cursor:pointer;transition:.15s}.option:hover:not(:disabled){border-color:#58cc02;background:#f5fff0;transform:translateY(-1px)}.option.selected{border-color:#5146a5;background:#f1efff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#ff4b4b;background:#fff0f0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{padding:12px 18px;border:0;border-radius:13px;font:inherit;font-weight:850;cursor:pointer}.check,.retry{background:#58cc02;color:#fff}.next{background:#5146a5;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:16px;min-height:24px;font-weight:750;line-height:1.5}.good{color:#177b2f}.bad{color:#b02a37}.hint{color:#596273;font-size:.95rem}.result{display:none;text-align:center;margin-top:20px;padding-top:18px;border-top:1px solid #e5e7eb}.bottom-nav{text-align:center;margin-top:20px}.back{display:inline-block;color:#5146a5;font-weight:800;text-decoration:none;padding:9px 12px;border-radius:12px;transition:transform .15s,background .15s,box-shadow .15s}.back:hover{background:#eeeaff;transform:translateY(-1px);box-shadow:0 4px 12px rgba(81,70,165,.12)}.back:focus-visible{outline:3px solid #b9b0ff;outline-offset:2px}.back:active{transform:scale(.98)}@media(max-width:600px){.wrap{padding:20px 14px}.intro h1{font-size:1.65rem}.card{padding:20px}.q{font-size:1.15rem}}</style></head><body><main class="wrap"><div class="top"><span class="xp">⚡ <span id="xp">0</span> XP</span></div><section class="intro"><h1>🧱 Limiting Friction</h1><p>Master maximum static friction, coefficient of friction, limiting equilibrium and NEET-level applications with 15 MCQs.</p></section><div class="progress"><div id="fill" class="fill"></div></div><section class="card"><div class="meta"><span id="count">Question 1 of 15</span> • <span id="pct">7%</span></div><h2 id="q" class="q"></h2><div id="opts" class="options"></div><div class="actions"><button id="check" class="btn check" type="button">Check Answer</button><button id="next" class="btn next" type="button" disabled>Next Question →</button></div><div id="fb" class="feedback" aria-live="polite"></div><p class="hint">💡 Choose the best answer.</p><div id="result" class="result"><h2>🏆 Skill Complete!</h2><p id="score"></p><button id="retry" class="btn retry" type="button">Retry Skill</button></div></section><div class="bottom-nav"><a class="back" href="#" onclick="return goBackToPhysicsPath()">← Back to Physics Path</a></div></main><script>(function(){'use strict';const KEY='skillupLastPhysicsPath';function rememberPath(){try{const r=document.referrer;if(!r)return;const u=new URL(r);if(u.origin!==location.origin)return;if(/(?:physics|full-physics)[^/]*path[^/]*\.html$/i.test(u.pathname)||/\/physics-home\.html$/i.test(u.pathname))sessionStorage.setItem(KEY,u.href)}catch(e){}}function goBackToPhysicsPath(){try{const saved=sessionStorage.getItem(KEY);if(saved){const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}}catch(e){}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false}window.goBackToPhysicsPath=goBackToPhysicsPath;rememberPath();const quiz=[['Limiting friction is the:',['Maximum value of static friction just before relative motion begins','Minimum friction possible during sliding','Friction acting when surfaces are separated','Friction that always equals the applied force'],0,'Limiting friction is the maximum static friction reached just before slipping begins.'],['For a body on a rough horizontal surface, limiting friction is:',['f_max=μ_sN','f_max=N/μ_s','f_max=μ_s/N','f_max=μ_s+N'],0,'The limiting friction is μ_sN, where μ_s is the coefficient of static friction.'],['The coefficient of static friction μ_s is the ratio of:',['Limiting friction to normal reaction','Normal reaction to limiting friction','Weight to mass','Kinetic friction to velocity'],0,'μ_s=f_max/N. It is dimensionless.'],['If the normal reaction doubles while μ_s remains constant, limiting friction:',['Doubles','Halves','Remains unchanged','Becomes zero'],0,'Because f_max=μ_sN, doubling N doubles the limiting friction.'],['A block remains at rest under an applied force smaller than limiting friction. The static friction is:',['Equal in magnitude and opposite to the applied force','Always equal to limiting friction','Always zero','Greater than the limiting friction'],0,'Static friction self-adjusts to balance the applied force until its maximum value is reached.'],['Just before a block starts sliding on a horizontal surface, static friction is:',['At its limiting value','Zero','Less than every possible applied force','Equal to the weight in all cases'],0,'At impending motion, static friction reaches its maximum value μ_sN.'],['If μ_s=0.4 and N=100 N, the limiting friction is:',['40 N','25 N','100.4 N','250 N'],0,'f_max=μ_sN=0.4×100=40 N.'],['A block of mass 5 kg rests on a horizontal rough surface with μ_s=0.2. Taking g=10 m/s², the limiting friction is:',['10 N','2 N','50 N','100 N'],0,'N=mg=50 N, so f_max=0.2×50=10 N.'],['A horizontal force is increased gradually on a resting block. Until slipping starts, friction:',['Increases with the applied force up to its limiting value','Remains zero','Always stays at μ_sN','Decreases as the applied force increases'],0,'Static friction matches the applied force in magnitude while remaining below its limiting value.'],['When an applied force exceeds the limiting friction, the block:',['Begins relative motion','Remains at rest with larger static friction','Has zero acceleration in every case','Loses its mass'],0,'Once the required friction exceeds the maximum static friction, slipping begins.'],['For a body on an inclined plane at the angle of limiting equilibrium θ, the coefficient of static friction is:',['μ_s=tan θ','μ_s=sin θ','μ_s=cos θ','μ_s=cot θ'],0,'At limiting equilibrium on a rough incline, μ_s=tan θ.'],['If the angle of repose is 30°, the coefficient of static friction is:',['1/√3','√3','1/2','2'],0,'μ_s=tan 30°=1/√3.'],['The angle of friction φ is related to μ_s by:',['tan φ=μ_s','sin φ=μ_s','cos φ=μ_s','tan φ=1/μ_s'],0,'By definition, tan φ=μ_s.'],['For ordinary dry surfaces, the coefficient of static friction is generally:',['Greater than the coefficient of kinetic friction','Less than the coefficient of kinetic friction','Always equal to it','Always zero'],0,'Usually μ_s>μ_k, so the maximum static friction exceeds kinetic friction.'],['Which statement about limiting friction is correct?',['It is the boundary between static contact and impending sliding','It acts only after a body has already been sliding','It is independent of normal reaction','It is always equal to the body weight'],0,'Limiting friction is the maximum static friction immediately before relative sliding begins.']];let i=0,sel=-1,score=0,locked=false;const $=id=>document.getElementById(id),q=$('q'),o=$('opts'),fb=$('fb'),check=$('check'),next=$('next'),xp=$('xp'),fill=$('fill'),count=$('count'),pct=$('pct');function render(){const a=quiz[i];sel=-1;locked=false;q.textContent=a[0];count.textContent='Question '+(i+1)+' of '+quiz.length;pct.textContent=Math.round((i+1)/quiz.length*100)+'%';fill.style.width=(score/quiz.length*100)+'%';fb.className='feedback';fb.textContent='';check.disabled=false;next.disabled=true;o.innerHTML='';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{if(locked)return;sel=item.index;Array.from(o.children).forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)})}check.onclick=function(){if(sel<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}locked=true;const a=quiz[i],ok=sel===a[2];Array.from(o.children).forEach(b=>{const originalIndex=Number(b.dataset.index);b.disabled=true;if(originalIndex===a[2])b.classList.add('correct');if(originalIndex===sel&&!ok)b.classList.add('wrong')});if(ok){score++;fb.className='feedback good';fb.textContent='🎯 Correct! '+a[3]+' +10 XP'}else{fb.className='feedback bad';fb.textContent='Not quite. '+a[3]+' Correct answer: '+a[1][a[2]]}xp.textContent=score*10;fill.style.width=(score/quiz.length*100)+'%';check.disabled=true;next.disabled=false;if(i===quiz.length-1)next.textContent='Finish Skill →'};next.onclick=function(){if(i<quiz.length-1){i++;render()}else{q.textContent='🏆 Limiting Friction Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+score+' / '+quiz.length+' correct • '+score*10+' XP';$('result').style.display='block';$('score').textContent=score+' / '+quiz.length+' correct • '+score*10+' XP'}};$('retry').onclick=()=>{i=0;score=0;xp.textContent='0';fill.style.width='0%';$('result').style.display='none';check.style.display='';next.style.display='';render()};render()})();</script></body></html>
