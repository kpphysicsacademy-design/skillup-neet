<style>
:root{--green:#58cc02;--green-dark:#46a302;--blue:#1cb0f6;--ink:#243447;--muted:#64748b;--line:#dce6ef;--bg:#f3f9ff;--red:#ff4b4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.nav{max-width:720px;margin:auto;min-height:58px;padding:9px 14px;display:flex;align-items:center;gap:10px}
.back{display:grid;place-items:center;width:40px;height:40px;border:2px solid var(--line);border-radius:13px;background:#f2f9ff;color:#174a78;text-decoration:none;font-size:20px}
.brand{font-weight:950;color:#174a78}.brand small{display:block;font-size:9px;letter-spacing:.8px;color:var(--muted)}

.hero,.quiz,.finish{background:#fff;border:2px solid #e2edf7;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 #dce8f3}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#174a78}.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}
.progress-row{display:flex;justify-content:space-between;gap:10px;margin:16px 0 7px;font-size:12px;font-weight:900;color:var(--muted)}
.track{height:11px;border-radius:99px;background:#e2edf7;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}
.qmeta{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.4px}
.question{font-size:clamp(20px,4.5vw,26px);line-height:1.35;margin:12px 0 18px;font-weight:850}
.options{display:grid;gap:10px}.option{display:flex;gap:11px;align-items:center;width:100%;min-height:51px;padding:12px;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}
.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

}

}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>📏 Limiting Friction</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
  {
    "q": "What is limiting friction?",
    "o": [
      "The maximum static friction just before slipping",
      "Friction after an object has slid for a long time",
      "The weight of an object",
      "The force perpendicular to a surface"
    ],
    "a": 0,
    "e": "Limiting friction is the greatest static friction available just as relative motion is about to begin."
  },
  {
    "q": "The formula for limiting friction in the basic dry-friction model is:",
    "o": [
      "fₗ = μₛN",
      "fₗ = μₖ/N",
      "fₗ = mg + N",
      "fₗ = N/μₛ"
    ],
    "a": 0,
    "e": "The limiting friction magnitude equals the coefficient of static friction times the normal reaction."
  },
  {
    "q": "In fₗ = μₛN, N stands for:",
    "o": [
      "Normal reaction",
      "Number of objects",
      "Net acceleration",
      "Newtons per second"
    ],
    "a": 0,
    "e": "N is the normal force exerted by the contact surface."
  },
  {
    "q": "Limiting friction acts at the instant just before:",
    "o": [
      "Relative sliding begins",
      "An object loses all mass",
      "Gravity stops",
      "The normal force becomes infinite"
    ],
    "a": 0,
    "e": "It is the threshold value of static friction at impending motion."
  },
  {
    "q": "A coefficient of static friction μₛ = 0.4 acts with normal force 50 N. Limiting friction is:",
    "o": [
      "20 N",
      "12.5 N",
      "50.4 N",
      "125 N"
    ],
    "a": 0,
    "e": "fₗ = 0.4 × 50 = 20 N."
  },
  {
    "q": "A 6 kg block rests on a level floor. If g = 10 m/s² and μₛ = 0.2, the limiting friction is:",
    "o": [
      "12 N",
      "30 N",
      "60 N",
      "3 N"
    ],
    "a": 0,
    "e": "N = mg = 60 N, so fₗ = 0.2 × 60 = 12 N."
  },
  {
    "q": "The coefficient of static friction is:",
    "o": [
      "Dimensionless",
      "Measured in newtons",
      "Measured in kilograms",
      "Measured in metres"
    ],
    "a": 0,
    "e": "It is a ratio of forces, so its units cancel."
  },
  {
    "q": "If the normal reaction doubles and μₛ stays constant, limiting friction:",
    "o": [
      "Doubles",
      "Halves",
      "Stays unchanged",
      "Becomes zero"
    ],
    "a": 0,
    "e": "Limiting friction is proportional to the normal reaction in the model fₗ = μₛN."
  },
  {
    "q": "If μₛ doubles while the normal force stays constant, limiting friction:",
    "o": [
      "Doubles",
      "Halves",
      "Remains the same",
      "Becomes negative"
    ],
    "a": 0,
    "e": "The limiting friction is directly proportional to μₛ."
  },
  {
    "q": "A block remains at rest while a 7 N horizontal force is applied. Its limiting friction is 12 N. The actual friction magnitude is:",
    "o": [
      "7 N",
      "12 N",
      "19 N",
      "0 N"
    ],
    "a": 0,
    "e": "Static friction self-adjusts to balance the applied force as long as it does not exceed 12 N."
  },
  {
    "q": "A block has limiting friction 15 N. A horizontal force of 18 N is applied. In the simple model, what happens?",
    "o": [
      "The block begins to slip",
      "Static friction increases to 18 N without limit",
      "The normal reaction becomes zero",
      "The block must remain at rest"
    ],
    "a": 0,
    "e": "The applied force exceeds the maximum available static friction, so slipping begins."
  },
  {
    "q": "Which statement about actual static friction is correct?",
    "o": [
      "It can be less than limiting friction",
      "It is always equal to limiting friction",
      "It is always zero",
      "It is always greater than the applied force"
    ],
    "a": 0,
    "e": "Static friction takes the value needed for equilibrium up to its limiting value."
  },
  {
    "q": "A block on a horizontal surface has mass 3 kg, g = 10 m/s² and μₛ = 0.5. Its limiting friction is:",
    "o": [
      "15 N",
      "5 N",
      "30 N",
      "1.5 N"
    ],
    "a": 0,
    "e": "N = 30 N; limiting friction = 0.5 × 30 = 15 N."
  },
  {
    "q": "A 40 N normal force acts on a surface with μₛ = 0.25. What is the limiting friction?",
    "o": [
      "10 N",
      "160 N",
      "40.25 N",
      "0.25 N"
    ],
    "a": 0,
    "e": "fₗ = 0.25 × 40 = 10 N."
  },
  {
    "q": "If no horizontal force or tendency to slide acts on a book at rest on a table, the static friction is:",
    "o": [
      "Zero",
      "Equal to the book's weight",
      "Always at its limiting value",
      "Equal to the normal reaction"
    ],
    "a": 0,
    "e": "Friction is not necessarily present at its maximum; with no tangential tendency, it can be zero."
  },
  {
    "q": "For a block at impending motion on a level surface, the applied horizontal force is balanced by:",
    "o": [
      "Limiting friction",
      "The block's weight alone",
      "The normal force alone",
      "Kinetic friction always"
    ],
    "a": 0,
    "e": "At the threshold of slipping, the applied force is balanced by maximum static friction."
  },
  {
    "q": "A block on an incline is just about to slide down. The limiting friction acts:",
    "o": [
      "Up the incline",
      "Down the incline",
      "Perpendicular to the incline",
      "Vertically downward"
    ],
    "a": 0,
    "e": "Friction opposes the impending downward motion along the plane."
  },
  {
    "q": "For a block on an incline at impending slip, the limiting friction magnitude is:",
    "o": [
      "μₛN",
      "μₛmg sin θ only",
      "mg + N",
      "N/μₛ"
    ],
    "a": 0,
    "e": "The limiting friction is μₛN, where N is the normal reaction on the incline."
  },
  {
    "q": "For an ideal block just about to slide down an incline of angle θ, which relation holds?",
    "o": [
      "tan θ = μₛ",
      "sin θ = μₛ²",
      "cos θ = μₛ",
      "θ = μₛN"
    ],
    "a": 0,
    "e": "At impending motion, mg sin θ = μₛmg cos θ, giving tan θ = μₛ."
  },
  {
    "q": "If μₛ = 1 for an ideal block on an incline, the angle of repose is:",
    "o": [
      "45°",
      "0°",
      "30°",
      "90°"
    ],
    "a": 0,
    "e": "tan θ = μₛ = 1, so θ = 45°."
  },
  {
    "q": "A block has μₛ = 0.3 and normal reaction 100 N. The maximum static friction is:",
    "o": [
      "30 N",
      "300 N",
      "3 N",
      "100.3 N"
    ],
    "a": 0,
    "e": "fₗ = 0.3 × 100 = 30 N."
  },
  {
    "q": "Which factor increases limiting friction in the basic model if all else is fixed?",
    "o": [
      "Increasing the coefficient of static friction",
      "Reducing the normal force",
      "Changing the colour of the surfaces",
      "Reducing μₛ"
    ],
    "a": 0,
    "e": "Since fₗ = μₛN, a larger μₛ increases the limiting friction."
  },
  {
    "q": "In the elementary dry-friction model, limiting friction depends primarily on:",
    "o": [
      "μₛ and the normal reaction",
      "Object colour and shape only",
      "The object's speed alone",
      "The contact surface temperature alone"
    ],
    "a": 0,
    "e": "The model represents limiting friction as the product μₛN."
  },
  {
    "q": "What is the relationship between limiting friction and kinetic friction for many dry surfaces?",
    "o": [
      "Limiting friction is often greater than kinetic friction",
      "Kinetic friction is always zero",
      "They are always exactly equal",
      "Limiting friction is always smaller"
    ],
    "a": 0,
    "e": "For many materials, μₛ > μₖ, so limiting friction often exceeds kinetic friction at the same normal force."
  },
  {
    "q": "A 2 kg block on a horizontal floor has μₛ = 0.4. Use g = 10 m/s². What horizontal force is just enough to start motion?",
    "o": [
      "8 N",
      "5 N",
      "20 N",
      "0.8 N"
    ],
    "a": 0,
    "e": "N = 20 N and fₗ = 0.4 × 20 = 8 N."
  },
  {
    "q": "A block has limiting friction 25 N. If a 10 N force is applied horizontally and the block stays still, the friction force is:",
    "o": [
      "10 N opposite the applied force",
      "25 N opposite the applied force",
      "35 N in the applied direction",
      "Zero in all cases"
    ],
    "a": 0,
    "e": "Static friction balances the 10 N force because it is below the 25 N limit."
  },
  {
    "q": "Why is limiting friction important when pushing a heavy object?",
    "o": [
      "It indicates the threshold force needed to start sliding",
      "It measures the object's temperature",
      "It is the force acting only after sliding begins",
      "It equals the object's mass"
    ],
    "a": 0,
    "e": "The limiting value tells us when static contact can no longer prevent slipping."
  },
  {
    "q": "A box is pushed right and is just about to move right. The limiting friction on the box acts:",
    "o": [
      "Left",
      "Right",
      "Up",
      "Down"
    ],
    "a": 0,
    "e": "Friction opposes the impending relative motion, so it acts left."
  },
  {
    "q": "If μₛ = 0.6 and N = 30 N, the limiting friction is:",
    "o": [
      "18 N",
      "5 N",
      "30.6 N",
      "50 N"
    ],
    "a": 0,
    "e": "fₗ = 0.6 × 30 = 18 N."
  },
  {
    "q": "Which statement best distinguishes static friction from limiting friction?",
    "o": [
      "Static friction varies up to a maximum called limiting friction",
      "Static friction is always at its maximum",
      "Limiting friction acts only after sliding begins",
      "They are unrelated forces"
    ],
    "a": 0,
    "e": "Limiting friction is the maximum possible value of static friction just before sliding."
  },
  {
    "q": "A 5 kg object is on a horizontal surface with μₛ = 0.4 and g = 10 m/s². A 15 N force is applied. If it remains at rest, actual static friction is:",
    "o": [
      "15 N",
      "20 N",
      "0 N",
      "35 N"
    ],
    "a": 0,
    "e": "The normal force is 50 N, so limiting friction is 20 N. Static friction adjusts to 15 N to keep the object at rest."
  }
];

let index=0,score=0,streak=0,chosen=null,locked=false;
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Nice work!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><button class="btn" id="retry">Practice again</button>';
 $('finishSlot').replaceChildren(card);$('retry').addEventListener('click',()=>{index=0;score=0;streak=0;$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
