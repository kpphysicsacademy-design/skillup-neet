<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Logic Gates</title><meta name="description" content="SkillUp Physics Logic Gates interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🔢</span><h1>Logic Gates</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["A logic gate is an electronic circuit that:",["Performs a logical operation on one or more inputs","Only amplifies current","Stores mechanical energy","Measures temperature"],0,"A logic gate processes binary input signals according to a defined Boolean logical operation and produces a binary output."] ,["The two binary logic levels are commonly represented by:",["0 and 1","1 and 2","A and B only","+ and − only"],0,"Digital logic uses two states, conventionally represented as logic 0 and logic 1."] ,["The output of an AND gate is 1 when:",["All inputs are 1","At least one input is 1","All inputs are 0","Exactly one input is 0"],0,"An AND gate gives output 1 only when every input is at logic 1."] ,["The output of an OR gate is 0 when:",["All inputs are 0","At least one input is 1","All inputs are 1","Exactly one input is 1"],0,"An OR gate gives 0 only when every input is 0; otherwise its output is 1."] ,["A NOT gate has:",["One input and one output","Two inputs and one output","Two outputs and one input","No input"],0,"A NOT gate is an inverter with one input and one output; it reverses the logic state."] ,["If the input to a NOT gate is 1, the output is:",["0","1","2","Undefined"],0,"NOT performs logical inversion, so NOT 1 = 0."] ,["Which gate is known as a universal gate?",["NAND","AND only","OR only","NOT only"],0,"NAND is universal because combinations of NAND gates can implement NOT, AND and OR and therefore any Boolean function."] ,["Which other gate is also a universal gate?",["NOR","AND","XOR","NOT"],0,"NOR is also universal; suitable combinations of NOR gates can implement the basic logic operations."] ,["The output of a NAND gate is the complement of:",["AND operation","OR operation","NOT operation","XOR operation"],0,"NAND means NOT-AND, so its output is the logical complement of the AND result."] ,["The output of a NOR gate is the complement of:",["OR operation","AND operation","XOR operation","NOT operation"],0,"NOR means NOT-OR, so its output is the logical complement of the OR result."] ,["An XOR gate gives output 1 when:",["The inputs are different","Both inputs are 0","Both inputs are 1","All inputs are identical"],0,"For two inputs, XOR produces 1 when the inputs differ and 0 when they are the same."] ,["For a two-input XNOR gate, the output is 1 when:",["The inputs are the same","The inputs are different","Both inputs are always 0","At least one input is 1"],0,"XNOR is the complement of XOR, so it gives 1 when the two inputs are equal."] ,["For inputs A=1 and B=0, the output of an AND gate is:",["0","1","A+B","AB+1"],0,"AND requires both inputs to be 1. Since B=0, the output is 0."] ,["For inputs A=1 and B=0, the output of an OR gate is:",["1","0","A×B","Undefined"],0,"OR gives 1 if at least one input is 1, so 1 OR 0 = 1."] ,["Which Boolean expression represents a NAND gate with inputs A and B?",["Y=̅(A·B)","Y=A+B","Y=A·B","Y=̅(A+B)"],0,"A NAND gate is the complement of AND: Y = NOT(A·B)."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
