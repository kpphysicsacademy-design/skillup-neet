<script>
(function(){
'use strict';
const questions = [{"q":"In a longitudinal wave, particles of the medium oscillate:","o":["Perpendicular to propagation","Parallel to propagation","In circles only","Without oscillation"],"a":1,"e":"Particle displacement is parallel to the direction in which a longitudinal wave travels."},{"q":"Which is a common longitudinal mechanical wave?","o":["Light in vacuum","Sound in air","Radio waves","Visible light"],"a":1,"e":"Sound in air propagates as longitudinal pressure variations."},{"q":"A region of higher pressure and density in a longitudinal wave is a:","o":["Rarefaction","Crest","Compression","Trough"],"a":2,"e":"Particles are crowded closer together in a compression, raising local pressure and density."},{"q":"A region of lower pressure and density in a longitudinal wave is a:","o":["Compression","Rarefaction","Crest","Antinode"],"a":1,"e":"Particles are farther apart in a rarefaction, lowering local pressure and density."},{"q":"The distance between two successive compressions is one:","o":["Amplitude","Wavelength","Period","Frequency"],"a":1,"e":"Successive compressions are corresponding points one wavelength apart."},{"q":"The distance between two successive rarefactions is:","o":["λ/2","λ","2λ","λ/4"],"a":1,"e":"Two adjacent rarefactions are separated by one complete wavelength."},{"q":"The SI unit of frequency is:","o":["Metre","Second","Hertz","Metre per second"],"a":2,"e":"Frequency is measured in hertz (Hz), or cycles per second."},{"q":"Frequency and period are related by:","o":["f = T","f = 1/T","f = 2T","f = T²"],"a":1,"e":"Frequency is the reciprocal of period: f = 1/T."},{"q":"A sound wave has frequency 200 Hz. Its period is:","o":["0.005 s","0.02 s","5 s","200 s"],"a":0,"e":"T = 1/f = 1/200 = 0.005 s."},{"q":"A longitudinal wave has frequency 50 Hz and wavelength 6 m. Its speed is:","o":["8.3 m/s","56 m/s","300 m/s","600 m/s"],"a":2,"e":"v = fλ = 50 × 6 = 300 m/s."},{"q":"A wave travels at 340 m/s and has frequency 170 Hz. Its wavelength is:","o":["0.5 m","2 m","170 m","510 m"],"a":1,"e":"λ = v/f = 340/170 = 2 m."},{"q":"In a sound wave, what travels through the medium from source to receiver?","o":["The same air particles permanently","Energy carried by the disturbance","The medium as a whole","Only the compression region"],"a":1,"e":"Sound transfers energy through oscillations of particles around their equilibrium positions; there is no net bulk transport of the medium."},{"q":"In a longitudinal wave, particle motion is:","o":["At right angles to propagation","Along the direction of propagation","Always circular","Always perpendicular to pressure variation"],"a":1,"e":"The defining feature of a longitudinal wave is parallel oscillation and propagation."},{"q":"Which pair of quantities is greatest at a compression in a sound wave?","o":["Pressure and density","Wavelength and period","Frequency and period","Speed and wavelength in every medium"],"a":0,"e":"A compression is a region of relatively high pressure and density."},{"q":"Which statement about rarefaction is correct?","o":["Particles are more crowded","Pressure is relatively low","It is the highest point of a string wave","It has zero wavelength"],"a":1,"e":"In a rarefaction, particles are more spread out and pressure is relatively low."},{"q":"A wave completes 120 cycles in 2 seconds. Its frequency is:","o":["60 Hz","120 Hz","240 Hz","0.0167 Hz"],"a":0,"e":"f = cycles/time = 120/2 = 60 Hz."},{"q":"If frequency doubles while wave speed stays constant, wavelength:","o":["Doubles","Halves","Remains unchanged","Becomes zero"],"a":1,"e":"From v = fλ, wavelength is inversely proportional to frequency at fixed speed."},{"q":"When sound passes from air into water, its frequency is generally:","o":["Set by the new medium and always doubles","Unchanged across the boundary","Reduced to zero","Always halved"],"a":1,"e":"The source fixes frequency; wave speed and wavelength may change when the medium changes."},{"q":"Which wave is longitudinal in the Earth's interior?","o":["Seismic P-wave","Seismic S-wave","Visible light","A wave on a stretched string"],"a":0,"e":"Seismic primary (P) waves are compressional longitudinal waves."},{"q":"Which seismic wave cannot travel through liquids because it is a shear wave?","o":["P-wave","S-wave","Sound wave","Pressure pulse"],"a":1,"e":"S-waves are transverse shear waves and do not propagate through fluids that lack shear rigidity."},{"q":"Longitudinal mechanical waves can travel through:","o":["Gases only","Solids only","Solids, liquids and gases","Vacuum only"],"a":2,"e":"Longitudinal mechanical waves can propagate in solids, liquids, and gases, provided the medium supports the disturbance."},{"q":"Sound cannot travel through a vacuum because:","o":["Its frequency becomes infinite","It requires a material medium","Vacuum absorbs all wavelengths","Its amplitude must be zero"],"a":1,"e":"Sound is a mechanical wave and requires particles to transmit pressure disturbances."},{"q":"A longitudinal wave has wavelength 0.8 m and speed 320 m/s. Its frequency is:","o":["256 Hz","400 Hz","40 Hz","0.0025 Hz"],"a":1,"e":"f = v/λ = 320/0.8 = 400 Hz."},{"q":"A wave has period 0.004 s. Its frequency is:","o":["4 Hz","25 Hz","250 Hz","4000 Hz"],"a":2,"e":"f = 1/T = 1/0.004 = 250 Hz."},{"q":"The maximum displacement of a particle from its equilibrium position is called:","o":["Amplitude","Wavelength","Compression","Frequency"],"a":0,"e":"Amplitude is the maximum displacement magnitude of the oscillating particle."},{"q":"Which is the best description of wavelength in a longitudinal wave?","o":["Distance from a compression to the nearest rarefaction","Distance between adjacent compressions","Maximum particle displacement","Time for one oscillation"],"a":1,"e":"One wavelength is the distance between consecutive compressions or consecutive rarefactions."},{"q":"If a sound wave's wavelength is 1.7 m and its frequency is 200 Hz, its speed is:","o":["117.6 m/s","201.7 m/s","340 m/s","400 m/s"],"a":2,"e":"v = fλ = 200 × 1.7 = 340 m/s."},{"q":"In a longitudinal wave, the particles of the medium generally:","o":["Travel with the wave over long distances","Oscillate about equilibrium positions","Move only in one direction","Stop moving when a compression passes"],"a":1,"e":"Particles oscillate back and forth around equilibrium while the disturbance propagates."},{"q":"A pressure-versus-position graph for a sound wave has adjacent pressure maxima separated by:","o":["Amplitude","Wavelength","Period","Frequency"],"a":1,"e":"Adjacent pressure maxima correspond to adjacent compressions, separated by one wavelength."},{"q":"Which statement comparing transverse and longitudinal waves is correct?","o":["Both always need vacuum","Longitudinal particle oscillations are parallel to propagation","Longitudinal waves have crests and troughs in the medium's displacement profile only","Only longitudinal waves carry energy"],"a":1,"e":"Longitudinal waves have particle oscillations parallel to propagation; both wave types can transfer energy."},{"q":"A longitudinal wave travels 680 m in 2 s. If its frequency is 200 Hz, its wavelength is:","o":["1.7 m","3.4 m","6.8 m","340 m"],"a":0,"e":"Speed = 680/2 = 340 m/s; λ = v/f = 340/200 = 1.7 m."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Longitudinal Waves Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
