<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Longitudinal Waves</title><style>
body{font-family:Arial,sans-serif;background:#f3f7ff;margin:0;color:#1e293b}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(30,41,59,.10);border:1px solid #e2e8f0}h1{text-align:center;color:#334155}.meta{display:flex;justify-content:space-between;font-weight:700;color:#475569}.bar{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#22c55e;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;color:#172033}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe4f0;border-radius:14px;background:#fff;color:#1e293b;font-size:16px;cursor:pointer;transition:.2s}.opt:hover{background:#eef5ff;border-color:#93c5fd;transform:translateY(-1px)}.correct{border-color:#16a34a!important;background:#ecfdf3!important;color:#166534!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important;color:#991b1b!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#4f46e5;color:#fff}.back{background:#334155;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#d97706;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>↔️ Longitudinal Waves</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>
const qs=[
['In a longitudinal wave, particles of the medium vibrate','perpendicular to propagation','parallel to propagation','in circles only','without oscillation',1,'In a longitudinal wave, particles oscillate parallel to the direction in which the wave propagates.'],
['Which is a common longitudinal mechanical wave?','Light in vacuum','Sound in air','Light in glass','Radio wave',1,'Sound in air is a mechanical longitudinal wave.'],
['The region of high pressure and density in a longitudinal wave is called','rarefaction','crest','compression','trough',2,'A compression is a region where particles are closer together, giving higher pressure and density.'],
['The region of low pressure and density in a longitudinal wave is called','compression','rarefaction','crest','node',1,'A rarefaction is a region where particles are farther apart, giving lower pressure and density.'],
['The distance between two successive compressions is','amplitude','wavelength','frequency','time period',1,'Successive compressions are one wavelength apart.'],
['In a sound wave, the amplitude is related to the maximum','particle displacement','wavelength','frequency only','wave speed only',0,'Amplitude is the maximum displacement of particles from their equilibrium positions.'],
['If frequency of a wave is 5 Hz, its time period is','5 s','0.5 s','0.2 s','25 s',2,'Using T=1/f, T=1/5=0.2 s.'],
['The relation between wave speed, frequency and wavelength is','v=fλ','v=f/λ','v=λ/f','v=f+λ',0,'The wave-speed relation is v=fλ.'],
['A longitudinal wave has frequency 4 Hz and wavelength 2 m. Its speed is','2 m/s','6 m/s','8 m/s','0.5 m/s',2,'Using v=fλ, v=4×2=8 m/s.'],
['In a longitudinal wave, particles of the medium generally','travel permanently with the wave','oscillate about their equilibrium positions','remain at rest','move only perpendicular to propagation',1,'Particles oscillate back and forth about equilibrium while the disturbance and energy propagate.'],
['Sound cannot travel through','air','water','steel','vacuum',3,'Sound is a mechanical wave and requires a material medium; it cannot propagate through vacuum.'],
['For a sinusoidal longitudinal wave, particles separated by one wavelength are','in the same phase','always opposite in phase','at different frequencies','stationary',0,'Points separated by one wavelength have the same phase.'],
['Particles separated by half a wavelength have a phase difference of','0','π/2','π','2π',2,'A separation of λ/2 corresponds to a phase difference of π radians.'],
['When a sound wave travels from air into water, its frequency is generally','changed by the medium','unchanged because it is set by the source','always doubled','always halved',1,'The source determines frequency; the medium mainly changes wave speed and wavelength.'],
['In a longitudinal wave, the distance from one compression to the next rarefaction is','λ','λ/2','2λ','λ/4',1,'A compression and the next rarefaction are separated by half a wavelength.']
];
let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
