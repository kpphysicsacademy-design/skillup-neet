er-color:var(--green-dark);background:#e5f7e6}.option.wrong{border-color:var(--red);background:#fff0ed}.option:disabled{cursor:default}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:17px;min-height:58px;padding:14px 20px;font:900 16px inherit;cursor:pointer}.primary{background:var(--green);color:white;box-shadow:0 4px 0 #379452;flex:1}.primary:disabled{background:#b9c7b7;box-shadow:none;cursor:not-allowed}.secondary{background:#f0f4e9;color:#526a61;border:2px solid var(--line)}.feedback{display:none;margin-top:17px;padding:15px 17px;border-radius:16px;background:#e8f7e8;line-height:1.5;font-weight:650}.feedback.show{display:block}.feedback.bad{background:#fff0ec}.feedback strong{display:block;margin-bottom:4px}.hidden{display:none!important}.result{text-align:center}.score{font-size:38px;font-weight:1000;margin:12px 0}.review{text-align:left;margin:24px 0}.review-item{border-top:1px solid var(--line);padding:15px 0;line-height:1.5}.review-item p{margin:7px 0;font-weight:600}.small{font-size:13px;color:var(--muted)}.mathjax{overflow-wrap:anywhere}@media(max-width:520px){.top-inner{padding:13px}.brand{font-size:17px}.pill{padding:8px 9px}.wrap{margin-top:22px}.card{padding:20px 16px}.option{font-size:15px;padding:12px}.question{font-size:22px}}

<script>
const questions=[["The Lorentz force on a charge q moving with velocity v in electric field E and magnetic field B is",["\\(\\mathbf{F}=q(\\mathbf{E}+\\mathbf{v}\\times\\mathbf{B})\\)","q(E − v × B)","qE only","\\(q(\\mathbf{v}\\times\\mathbf{B})\\) only"],0,"The total Lorentz force is F = q[E + (v × B)], combining electric and magnetic forces."],["The electric part of the Lorentz force is",["qvB","qE","\\(q(\\mathbf{v}\\times\\mathbf{B})\\)","qE × B"],1,"The electric force is Fₑ = qE."],["The magnetic part of the Lorentz force is",["qE","\\(q(\\mathbf{v}\\times\\mathbf{B})\\)","qvE","q/B"],1,"The magnetic contribution is Fᵦ = \\(q(\\mathbf{v}\\times\\mathbf{B})\\)."],["A charge at rest in a region with only a magnetic field experiences magnetic force",["qB","qE","zero","infinite"],2,"Magnetic force depends on velocity. If v = 0, \\(q(\\mathbf{v}\\times\\mathbf{B})\\) = 0."],["The magnitude of the magnetic force on a moving charge is",["\\(|q|vB\\sin\\theta\\)","|q|vB cos θ","|q|E","|q|B/v"],0,"Fᵦ = \\(|q|vB\\sin\\theta\\), with θ the angle between v and B."],["The magnetic force magnitude is maximum when v makes what angle with B?",["0°","30°","90°","180°"],2,"sin θ is maximum at 90°, so Fᵦ = |q|vB."],["The magnetic force is zero when velocity is",["perpendicular to B","parallel or antiparallel to B","at 45° to B","nonzero in every direction"],1,"When θ is 0° or 180°, sin θ = 0."],["For a positive charge, the magnetic force direction is along",["B × v","v × B","v + B","B only"],1,"For q > 0, Fᵦ = \\(q(\\mathbf{v}\\times\\mathbf{B})\\)."],["For a negative charge, the magnetic force direction is",["the same as v × B","opposite to v × B","always parallel to B","always parallel to v"],1,"A negative charge reverses the direction of v × B."],["Which statement about Lorentz force is correct?",["It includes electric and magnetic forces","It is only qE","It is only gravity","It acts only on neutral particles"],0,"The Lorentz force combines electric and magnetic contributions."],["If B = 0, the Lorentz force becomes",["\\(q(\\mathbf{v}\\times\\mathbf{B})\\)","qE","zero for every E","qvB"],1,"With no magnetic field, F = qE."],["If E = 0, the Lorentz force becomes",["qE","\\(q(\\mathbf{v}\\times\\mathbf{B})\\)","q(E + B)","zero for every moving charge"],1,"With no electric field, only the magnetic term remains."],["A 2 C charge moves at 3 m/s perpendicular to a 4 T field, with E = 0. The force magnitude is",["12 N","18 N","24 N","48 N"],2,"\\(F=|q|vB\\) = 2 × 3 × 4 = 24 N."],["A 1 C charge moves at 5 m/s at 30° to a 2 T field, with E = 0. The magnetic force magnitude is",["2.5 N","5 N","10 N","20 N"],1,"\\(F=|q|vB\\) sin 30° = 1 × 5 × 2 × 0.5 = 5 N. Correct answer: 5 N."],["The magnetic part of Lorentz force does no work because it is",["parallel to velocity","perpendicular to velocity","always zero","parallel to displacement"],1,"Since magnetic force is perpendicular to velocity, its instantaneous power F · v is zero."],["A charged particle enters a uniform magnetic field with v perpendicular to B. Its path is",["circular","straight","parabolic","stationary"],0,"The magnetic force supplies the centripetal force."],["A particle enters a uniform magnetic field at an oblique angle. Its trajectory is generally",["a straight line","a helix","a parabola","a stationary point"],1,"The perpendicular velocity component produces circular motion while the parallel component continues along the field."],["The radius of a circular path for v perpendicular to B is",["|q|B/(mv)","mv/(|q|B)","|q|v/(mB)","mB/(|q|v)"],1,"Equating |q|vB = mv²/r gives \\(r=\\frac{mv}{|q|B}\\)."],["For a non-relativistic particle in a uniform magnetic field, the cyclotron angular frequency magnitude is",["|q|B/m","mB/|q|","|q|m/B","B/(|q|m)"],0,"\\(\\omega=\\frac{|q|B}{m}\\)."],["The time period of circular motion is",["2πm/(|q|B)","2π|q|B/m","|q|B/(2πm)","2πmv/(|q|B)"],0,"\\(T=\\frac{2\\pi m}{|q|B}\\), independent of speed in the non-relativistic model."],["If particle speed doubles while m, |q|, and B remain fixed, the orbit radius",["halves","doubles","stays unchanged","quadruples"],1,"Since \\(r=\\frac{mv}{|q|B}\\), radius is proportional to speed."],["If B doubles while speed and other properties stay fixed, the orbit radius",["doubles","halves","stays unchanged","quadruples"],1,"The radius is inversely proportional to magnetic field strength."],["Which velocity component is unchanged by magnetic force in a uniform B field?",["the component parallel to B","the component perpendicular to B","both always change","neither component"],0,"The magnetic force is perpendicular to B, so the parallel velocity component is unchanged."],["A particle has m = 2 × 10⁻²⁷ kg, |q| = 1.6 × 10⁻¹⁹ C, v = 4 × 10⁶ m/s, B = 0.5 T. Its radius is",["0.01 m","0.1 m","1 m","10 m"],1,"\\(r=\\frac{mv}{|q|B}\\) = 0.1 m."],["A charge of magnitude 1.6 × 10⁻¹⁹ C moves at 3 × 10⁶ m/s perpendicular to B = 0.2 T. The force magnitude is",["9.6 × 10⁻¹⁴ N","9.6 × 10⁻¹⁷ N","3.2 × 10⁻¹³ N","zero"],0,"\\(F=|q|vB\\) = 9.6 × 10⁻¹⁴ N."],["If electric and magnetic forces on a particle are equal in magnitude and opposite in direction, the net Lorentz force is",["twice the electric force","zero","twice the magnetic force","always qE"],1,"Equal and opposite force vectors cancel, giving zero net force."],["For a positive charge moving along +x in a magnetic field along +y, the magnetic force points along",["+x","−x","+z","−z"],2,"Using the right-hand rule, x × y = +z."],["For a negative charge moving along +x in a magnetic field along +y, the magnetic force points along",["+z","−z","+y","−x"],1,"For a negative charge the direction is opposite to x × y, so it is −z."],["A particle’s momentum magnitude doubles while |q| and B remain fixed, with motion perpendicular to B. Its orbit radius",["halves","doubles","is unchanged","quadruples"],1,"\\(r=\\frac{p}{|q|B}\\), so doubling momentum doubles the radius."],["Which statement is true for a magnetic field acting alone on a charged particle?",["It changes kinetic energy continuously","It changes direction but not speed","It always stops the particle","It changes the particle's charge"],1,"Magnetic force is perpendicular to velocity and does no work, so speed and kinetic energy stay constant."]];
let index=0,chosen=null,locked=false,xp=0,streak=0,bestStreak=0,correctCount=0,wrong=[];
const $=id=>document.getElementById(id);
function typeset(){if(!window.MathJax||!MathJax.startup||!MathJax.typesetPromise)return;const nodes=[$('question'),$('options'),$('feedback')];MathJax.startup.promise.then(()=>{MathJax.typesetClear(nodes);return MathJax.typesetPromise(nodes)}).catch(()=>{});}
function render(){const q=questions[index];chosen=null;locked=false;$('count').textContent='Question '+(index+1)+' of '+questions.length;$('percent').textContent=Math.round(index/questions.length*100)+'%';$('fill').style.width=(index/questions.length*100)+'%';$('eyebrow').textContent='QUESTION '+(index+1);$('question').textContent=q[0];$('options').innerHTML='';q[1].forEach((answer,n)=>{const b=document.createElement('button');b.className='option mathjax';b.type='button';const l=document.createElement('span');l.className='letter';l.textContent=String.fromCharCode(65+n);const a=document.createElement('span');a.textContent=answer;b.append(l,a);b.addEventListener('click',()=>{if(locked)return;chosen=n;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false});$('options').appendChild(b)});$('feedback').className='feedback mathjax';$('feedback').textContent='';$('check').classList.remove('hidden');$('check').disabled=true;$('continue').classList.add('hidden');typeset();}
function check(){if(chosen===null||locked)return;locked=true;const q=questions[index],ok=chosen===q[2];document.querySelectorAll('.option').forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add('correct');if(n===chosen&&!ok)b.classList.add('wrong')});if(ok){xp+=10;streak++;bestStreak=Math.max(bestStreak,streak);correctCount++;$('feedback').className='feedback show mathjax';$('feedback').innerHTML='<strong>🌟 Correct! +10 XP</strong>'+q[3]}else{streak=0;wrong.push({index,chosen,correct:q[2]});$('feedback').className='feedback show bad mathjax';$('feedback').innerHTML='<strong>Not quite — keep learning!</strong>'+q[3]}$('xp').textContent=xp;$('streak').textContent=streak;$('check').classList.add('hidden');$('continue').classList.remove('hidden');typeset();}
function next(){if(index<questions.length-1){index++;render()}else finish()}
function finish(){ $('quizcard').classList.add('hidden');$('percent').textContent='100%';$('fill').style.width='100%';$('count').textContent='Quiz complete!';$('result').classList.remove('hidden');const review=wrong.length?'<div class="review"><h2>Review your mistakes</h2>'+wrong.map(w=>{const q=questions[w.index];return '<div class="review-item"><b>Q'+(w.index+1)+'. '+q[0]+'</b><p>Your answer: '+String.fromCharCode(65+w.chosen)+'. '+q[1][w.chosen]+'</p><p><b>Correct answer:</b> '+String.fromCharCode(65+q[2])+'. '+q[1][q[2]]+'</p><p>'+q[3]+'</p></div>'}).join('')+'</div>':'<p>Perfect run — no incorrect answers to review!</p>';$('result').innerHTML='<div class="eyebrow">LEARNING COMPLETE</div><h2>🎉 Quiz complete!</h2><div class="score">'+correctCount+' / '+questions.length+'</div><p>Correct answers</p><p>You earned <b>'+xp+' XP</b> · Best streak: <b>'+bestStreak+'</b></p>'+review+'<button class="btn primary" id="retry">Retry quiz ↻</button>';$('retry').onclick=()=>location.reload();typeset();}
$('check').addEventListener('click',check);$('continue').addEventListener('click',next);render();
window.addEventListener('load',typeset);
</script>
