<script>
const questions=[["The magnetic field at the centre of a single circular loop of radius R carrying current I is",["μ₀I/(2R)","μ₀I/(2πR)","μ₀I/R²","μ₀IR/2"],0,"Using the Biot–Savart law, integration around a full circular loop gives B = μ₀I/(2R)."],["The direction of magnetic field at the centre of a current-carrying circular loop is found using",["Right-hand grip rule","Fleming’s left-hand rule","Coulomb’s law","Lenz’s law only"],0,"Curl the fingers of your right hand in the direction of conventional current; the thumb gives the field direction."],["The magnetic field at the centre of a circular loop is directed",["In the plane of the loop","Perpendicular to the plane of the loop","Along the circumference","Radially outward in the plane"],1,"Symmetry makes the transverse components cancel, leaving a field along the loop axis."],["For a circular loop of fixed radius, the central magnetic field is directly proportional to",["Current","Radius","Radius squared","Inverse current"],0,"B = μ₀I/(2R), so B ∝ I when R is fixed."],["If the radius of a circular loop is doubled while current remains constant, its central field becomes",["Double","Half","Four times","Unchanged"],1,"The central field varies inversely with radius."],["If the current in a circular loop is tripled with its radius unchanged, the central field",["Becomes one-third","Triples","Becomes nine times","Remains unchanged"],1,"The field is directly proportional to current."],["A circular coil has N closely wound turns. Its magnetic field at the centre is",["μ₀NI/(2R)","μ₀I/(2NR)","μ₀NR/(2I)","μ₀NI/(2πR²)"],0,"The fields due to all N turns add, giving B = μ₀NI/(2R)."],["A single circular loop of radius 0.1 m carries 5 A. Its central field in vacuum is approximately",["3.14 × 10⁻⁵ T","3.14 × 10⁻⁶ T","6.28 × 10⁻⁵ T","1.00 × 10⁻⁴ T"],0,"B = μ₀I/(2R) = (4π×10⁻⁷×5)/(0.2) ≈ 3.14×10⁻⁵ T."],["A 100-turn circular coil of radius 0.2 m carries 2 A. Its central field is approximately",["6.28 × 10⁻⁴ T","6.28 × 10⁻⁵ T","1.26 × 10⁻³ T","3.14 × 10⁻⁴ T"],0,"B = μ₀NI/(2R) = (4π×10⁻⁷×100×2)/(0.4) ≈ 6.28×10⁻⁴ T."],["If both the number of turns and current are doubled, with radius fixed, the central field becomes",["Double","Four times","Half","Unchanged"],1,"B ∝ NI, so doubling both N and I multiplies the field by four."],["The magnetic field on the axis of a circular loop at distance x from its centre is",["μ₀IR²/[2(R²+x²)^(3/2)]","μ₀I/(2πx)","μ₀Ix/(2R²)","μ₀IR/[2(R+x)]"],0,"The axial field is B = μ₀IR²/[2(R²+x²)^(3/2)]."],["At the centre of a circular loop, the axial field formula reduces to the central field when",["x = R","x = 0","x = 2R","x tends to infinity"],1,"Setting x = 0 gives B = μ₀IR²/(2R³) = μ₀I/(2R)."],["Far from a circular loop along its axis (x much greater than R), its magnetic field approximately varies as",["1/x","1/x²","1/x³","x²"],2,"For x ≫ R, (R²+x²)^(3/2) ≈ x³, so B ∝ 1/x³."],["At a point on the axis of a circular loop, the net magnetic field is",["Along the axis","Perpendicular to the axis","Always radial","Always zero"],0,"By rotational symmetry, the components perpendicular to the axis cancel."],["The magnetic field at the centre due to a semicircular arc of radius R carrying current I is",["μ₀I/(4R)","μ₀I/(2R)","μ₀I/(4πR)","μ₀I/(8R)"],0,"An arc of angle π gives B = μ₀Iφ/(4πR) = μ₀I/(4R)."],["The magnetic field at the centre due to a quarter-circular arc of radius R is",["μ₀I/(8R)","μ₀I/(4R)","μ₀I/(2R)","μ₀I/(8πR)"],0,"For φ = π/2, B = μ₀Iφ/(4πR) = μ₀I/(8R)."],["The magnetic field at the centre due to a circular arc subtending angle φ (in radians) is",["μ₀Iφ/(4πR)","μ₀I/(2Rφ)","μ₀IRφ/(4π)","μ₀Iφ/(2πR²)"],0,"Integrating Biot–Savart over an arc gives B = μ₀Iφ/(4πR)."],["A radial straight wire segment connected to a circular arc produces what field at the centre of curvature?",["Zero","μ₀I/(2R)","μ₀I/(4πR)","An infinite field"],0,"For a radial segment, dl is parallel to r̂, so dl × r̂ = 0."],["Two concentric circular loops carry currents in the same sense. At their common centre, their magnetic fields",["Add","Cancel exactly","Are always zero","Are perpendicular"],0,"Both fields are along the common axis in the same direction, so their magnitudes add."],["Two concentric loops carry equal currents in opposite senses. Their radii are R and 2R. The net field at the common centre has magnitude",["μ₀I/(4R)","Zero","μ₀I/(2R)","3μ₀I/(4R)"],0,"The fields oppose: μ₀I/(2R) − μ₀I/(4R) = μ₀I/(4R)."],["A circular coil’s radius is halved and its current is doubled. Its central magnetic field becomes",["Two times","Four times","Half","Unchanged"],1,"Since B ∝ I/R, doubling I and halving R gives a factor of four."],["A 20-turn coil of radius 0.1 m carries 1 A. Its central field is approximately",["1.26 × 10⁻⁴ T","2.51 × 10⁻⁵ T","6.28 × 10⁻⁵ T","1.26 × 10⁻³ T"],0,"B = μ₀NI/(2R) = (4π×10⁻⁷×20)/(0.2) ≈ 1.26×10⁻⁴ T."],["A circular loop produces a central field B. If its current is halved and radius is doubled, the new field is",["B/4","B/2","2B","4B"],0,"B ∝ I/R, so the ratio is (1/2)/(2) = 1/4."],["At the centre of a circular loop, the magnetic field is maximum when the observation point is",["At the centre","On the circumference","Far along the axis","At any point in the plane"],0,"For a given loop, the axial field decreases as distance from the centre increases; the central value is maximum on the axis."],["Which law is used to derive the magnetic field due to a circular current loop?",["Biot–Savart law","Coulomb’s law","Gauss’s law for electricity","Ohm’s law"],0,"The Biot–Savart law gives the field contribution of each current element; integration yields the loop field."],["The magnetic field contribution from a current element is zero at an observation point lying along the element’s line because",["dl is parallel to r̂","current is zero","distance is infinite","μ₀ is zero"],0,"The Biot–Savart cross product dl × r̂ vanishes for parallel vectors."],["If the number of turns of a circular coil is reduced to one-third with current and radius fixed, its central field",["Becomes one-third","Triples","Becomes nine times","Does not change"],0,"The central field is directly proportional to the number of turns N."],["A circular coil has central field 4 mT. If its radius and current are both doubled, the new field is",["2 mT","4 mT","8 mT","16 mT"],1,"Because B ∝ I/R, doubling both current and radius leaves the field unchanged."],["At an axial point very far from a circular loop, increasing the loop radius while holding current fixed changes the dipole moment",["Increases as R²","Decreases as 1/R²","Increases as R","Does not change"],0,"The loop’s magnetic dipole moment is m = IπR², so it increases with R²."],["The magnetic dipole moment of a circular coil of N turns, current I and radius R is",["N I πR²","N I/(πR²)","μ₀NI/(2R)","2πRNI"],0,"Magnetic dipole moment equals current × area × number of turns: m = NIπR²."]];
let activeQuestions=questions.slice();
let index=0,chosen=null,locked=false,xp=0,streak=0,bestStreak=0,correctCount=0,wrong=[];
const $=id=>document.getElementById(id);
function render(){chosen=null;locked=false;$('count').textContent='Question '+(index+1)+' of '+activeQuestions.length;$('qnum').textContent='QUESTION '+(index+1);$('percent').textContent=Math.round(index/activeQuestions.length*100)+'%';$('fill').style.width=(index/activeQuestions.length*100)+'%';$('xp').textContent=xp;$('streak').textContent=streak;$('question').textContent=activeQuestions[index][0];$('options').innerHTML='';activeQuestions[index][1].forEach((value,n)=>{const b=document.createElement('button');b.type='button';b.className='option';b.innerHTML='<span class="letter">'+String.fromCharCode(65+n)+'</span><span></span>';b.lastElementChild.textContent=value;b.addEventListener('click',()=>{if(locked)return;chosen=n;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b)});$('check').classList.remove('hidden');$('check').disabled=true;$('feedback').className='feedback';$('feedback').textContent='';$('continue').classList.add('hidden');if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();}
function check(){if(chosen===null||locked)return;locked=true;const q=activeQuestions[index],ok=chosen===q[2];document.querySelectorAll('.option').forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add('correct');if(n===chosen&&!ok)b.classList.add('wrong')});if(ok){xp+=10;streak++;bestStreak=Math.max(bestStreak,streak);correctCount++;$('feedback').className='feedback show';$('feedback').innerHTML='<strong>✅ Correct! +10 XP</strong>'+q[3]}else{streak=0;wrong.push({index,chosen,correct:q[2]});$('feedback').className='feedback show bad';$('feedback').innerHTML='<strong>Not quite.</strong>'+q[3]}$('xp').textContent=xp;$('streak').textContent=streak;$('check').classList.add('hidden');$('continue').classList.remove('hidden');if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();}
function next(){if(index<activeQuestions.length-1){index++;render()}else finish()}
function resetQuiz(onlyWrong){const previous=activeQuestions.slice();activeQuestions=onlyWrong?wrong.map(w=>previous[w.index]).filter(Boolean):questions.slice();index=0;chosen=null;locked=false;xp=0;streak=0;bestStreak=0;correctCount=0;wrong=[];$('xp').textContent='0';$('streak').textContent='0';$('quizcard').classList.remove('hidden');$('result').classList.add('hidden');render();}
function finish(){$('quizcard').classList.add('hidden');$('percent').textContent='100%';$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hidden');let review=wrong.length?'<div class="review"><h3>Review your mistakes</h3>'+wrong.map(w=>{const q=activeQuestions[w.index];return '<div class="review-item"><b>Q'+(w.index+1)+'. '+q[0]+'</b><p class="small">Your answer: '+String.fromCharCode(65+w.chosen)+'. '+q[1][w.chosen]+'</p><p><b>Correct:</b> '+String.fromCharCode(65+q[2])+'. '+q[1][q[2]]+'</p><p>'+q[3]+'</p></div>'}).join('')+'</div>':'<p>Perfect run — no incorrect answers to review!</p>';$('result').innerHTML='<h2>🎉 Magnetic Field of Circular Loop Complete!</h2><p class="scorebig">'+correctCount+' / '+activeQuestions.length+' correct</p><p>You earned <b>'+xp+' XP</b> · Best streak this run: <b>'+bestStreak+'</b></p>'+review+(wrong.length?'<button class="primary" id="retryWrong">Retry wrong answers ('+wrong.length+') ↻</button>':'')+'<button class="primary" id="retry">Practice all questions again</button>';$('retry').onclick=()=>resetQuiz(false);const rw=$('retryWrong');if(rw)rw.onclick=()=>resetQuiz(true);if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();}
$('check').addEventListener('click',check);$('continue').addEventListener('click',next);render();
</script><script src="/skillup-eye-shield.js?v=20261013-eye-shield-v1"></script><script src="/shared-nav.js?v=20261013-no-bottom-nav-v1"></script></body></html>
