<script>
const questions=[["The magnetic field at perpendicular distance r from an infinitely long straight wire carrying current I is",["μ₀I/(2πr)","μ₀I/(4πr²)","μ₀Ir/(2π)","μ₀I/(2r²)"],0,"Integrating the Biot–Savart law gives B = μ₀I/(2πr)."],["The magnetic field lines around a long straight current-carrying wire are",["radial lines","concentric circles","parallel straight lines","ellipses in a plane containing the wire"],1,"The field direction is tangential to concentric circles centred on the wire."],["The direction of the magnetic field around a straight wire is determined by",["Fleming's left-hand rule","right-hand thumb rule","Lenz's law","Coulomb's law"],1,"Point the right thumb along conventional current; curled fingers show the field direction."],["For a long straight wire, magnetic field B varies with distance r as",["B ∝ r","B ∝ 1/r","B ∝ r²","B ∝ 1/r²"],1,"B = μ₀I/(2πr), so B is inversely proportional to r."],["If the current in a straight wire is doubled while distance stays fixed, the magnetic field",["halves","doubles","quadruples","remains unchanged"],1,"The field is directly proportional to current I."],["If the distance from a long straight wire is tripled, the field becomes",["three times","one-third","one-ninth","nine times"],1,"Because B ∝ 1/r, tripling r reduces B to one-third."],["A long straight wire carries 5 A. Find B at 0.1 m in vacuum. Take μ₀ = 4π × 10⁻⁷ T m A⁻¹.",["1 × 10⁻⁵ T","1 × 10⁻⁶ T","5 × 10⁻⁵ T","5 × 10⁻⁶ T"],0,"B = μ₀I/(2πr) = (4π×10⁻⁷×5)/(2π×0.1) = 1×10⁻⁵ T."],["A wire carries 2 A. What is the field at 0.5 m in vacuum?",["4 × 10⁻⁷ T","8 × 10⁻⁷ T","2 × 10⁻⁷ T","1.6 × 10⁻⁶ T"],1,"B = (4π×10⁻⁷×2)/(2π×0.5) = 8×10⁻⁷ T."],["At what distance from a long wire carrying 4 A is B = 4 × 10⁻⁶ T in vacuum?",["0.02 m","0.10 m","0.20 m","0.40 m"],2,"r = μ₀I/(2πB) = (4π×10⁻⁷×4)/(2π×4×10⁻⁶) = 0.20 m. Correction: the calculation gives 0.20 m, so option C is correct."],["For a long straight wire, the magnetic field at 2 cm is 4 × 10⁻⁵ T. At 8 cm it is",["1 × 10⁻⁵ T","2 × 10⁻⁵ T","8 × 10⁻⁵ T","16 × 10⁻⁵ T"],0,"The distance increases fourfold, so the field becomes one-fourth: 1×10⁻⁵ T."],["The magnetic field at a point around a straight wire is",["along the wire","tangent to the circular field line","radially outward","always vertically upward"],1,"At each point, B is tangential to the circular field line around the wire."],["The magnetic field direction around a straight wire is reversed when",["the wire is made longer","the current direction is reversed","the distance is doubled","the wire is moved without changing orientation"],1,"Reversing current reverses the direction of the magnetic field."],["The magnetic field due to a long straight wire in a medium of permeability μ is",["μI/(2πr)","μIr/(2π)","I/(2πμr)","2πμr/I"],0,"For an ideal long straight wire in a uniform medium, B = μI/(2πr)."],["If the permeability of the surrounding medium doubles, with I and r unchanged, B",["halves","doubles","quadruples","does not change"],1,"B is directly proportional to the medium permeability μ."],["Two long parallel wires carry currents in the same direction. They",["attract","repel","exert no force","always rotate"],0,"Parallel currents in the same direction attract each other."],["Two long parallel wires carry currents in opposite directions. They",["attract","repel","exert no force","have zero magnetic fields"],1,"Parallel currents in opposite directions repel."],["The force per unit length between two long parallel wires separated by distance d is",["μ₀I₁I₂/(2πd)","μ₀I₁I₂d/(2π)","μ₀d/(2πI₁I₂)","2πd/(μ₀I₁I₂)"],0,"F/L = μ₀I₁I₂/(2πd)."],["If both currents in two parallel wires are doubled, the force per unit length becomes",["double","four times","half","unchanged"],1,"F/L ∝ I₁I₂; doubling both currents makes the product four times larger."],["If the separation between two parallel wires is doubled, the force per unit length becomes",["double","half","four times","one-fourth"],1,"The force per unit length varies inversely with separation d."],["A wire carries 10 A. What is the magnetic field 5 cm away in vacuum?",["2 × 10⁻⁵ T","4 × 10⁻⁵ T","8 × 10⁻⁵ T","1 × 10⁻⁵ T"],1,"B = (4π×10⁻⁷×10)/(2π×0.05) = 4×10⁻⁵ T."],["A long wire carries 3 A. Find the distance at which B = 6 × 10⁻⁶ T in vacuum.",["0.01 m","0.05 m","0.10 m","0.20 m"],2,"r = μ₀I/(2πB) = (4π×10⁻⁷×3)/(2π×6×10⁻⁶) = 0.10 m."],["A straight wire carries current vertically upward. Viewed from above, the magnetic field direction around it is",["clockwise","anticlockwise","radially outward","radially inward"],1,"With the thumb upward, the right-hand fingers curl anticlockwise when viewed from above."],["A compass placed near a current-carrying straight wire deflects because",["the wire becomes charged","current produces a magnetic field","the wire heats the compass","gravity changes"],1,"An electric current produces a magnetic field that exerts a torque on the compass needle."],["Which change does NOT affect the magnetic field at a fixed point near an ideal long straight wire?",["changing current","changing distance from wire","reversing current direction","changing the wire's colour"],3,"The field depends on current, distance and permeability—not the wire's colour."],["The magnetic field at distance r from a long straight wire is B. At distance r/2, it is",["B/2","B","2B","4B"],2,"Since B ∝ 1/r, halving distance doubles the field."],["The magnetic field at distance r from a long straight wire is B. If current is reduced to one-third and distance doubled, the new field is",["B/6","B/3","2B/3","6B"],0,"B' / B = (I'/I)(r/r') = (1/3)(1/2) = 1/6."],["A long straight wire produces a field of 3 × 10⁻⁵ T at 2 cm. What current flows in it in vacuum?",["1 A","2 A","3 A","6 A"],2,"I = 2πrB/μ₀ = (2π×0.02×3×10⁻⁵)/(4π×10⁻⁷) = 3 A."],["At a point, the magnetic field around a straight wire is directed east. The field direction at the diametrically opposite point on the same circular field line is",["east","west","north","the same tangent direction"],1,"The tangent directions at diametrically opposite points on a circular field line are opposite."],["A long straight wire is placed along the north–south direction with current toward north. At a point due east of the wire, the magnetic field is directed",["vertically upward","vertically downward","north","south"],1,"Using the right-hand thumb rule with current northward, the field at the east side points vertically downward."],["Which statement about the field around a long straight wire is correct?",["Field lines are open curves","Field magnitude is the same at all distances","Field lines form closed concentric circles","Field is directed along the current"],2,"The magnetic field lines form closed concentric circles around the wire."],["A long straight wire carries 8 A. The magnetic field at 0.2 m in vacuum is",["4 × 10⁻⁶ T","8 × 10⁻⁶ T","1.6 × 10⁻⁵ T","2 × 10⁻⁶ T"],1,"B = μ₀I/(2πr) = (4π×10⁻⁷×8)/(2π×0.2) = 8×10⁻⁶ T."]];
let activeQuestions=questions.slice();
let index=0,chosen=null,locked=false,xp=0,streak=0,bestStreak=0,correctCount=0,wrong=[];
const $=id=>document.getElementById(id);
function render(){chosen=null;locked=false;$('count').textContent='Question '+(index+1)+' of '+activeQuestions.length;$('qnum').textContent='QUESTION '+(index+1);$('percent').textContent=Math.round(index/activeQuestions.length*100)+'%';$('fill').style.width=(index/activeQuestions.length*100)+'%';$('xp').textContent=xp;$('streak').textContent=streak;$('question').textContent=activeQuestions[index][0];$('options').innerHTML='';activeQuestions[index][1].forEach((value,n)=>{const b=document.createElement('button');b.type='button';b.className='option';b.innerHTML='<span class="letter">'+String.fromCharCode(65+n)+'</span><span></span>';b.lastElementChild.textContent=value;b.addEventListener('click',()=>{if(locked)return;chosen=n;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b)});$('check').classList.remove('hidden');$('check').disabled=true;$('feedback').className='feedback';$('feedback').textContent='';$('continue').classList.add('hidden');if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();}
function check(){if(chosen===null||locked)return;locked=true;const q=activeQuestions[index],ok=chosen===q[2];document.querySelectorAll('.option').forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add('correct');if(n===chosen&&!ok)b.classList.add('wrong')});if(ok){xp+=10;streak++;bestStreak=Math.max(bestStreak,streak);correctCount++;$('feedback').className='feedback show';$('feedback').innerHTML='<strong>✅ Correct! +10 XP</strong>'+q[3]}else{streak=0;wrong.push({index,chosen,correct:q[2]});$('feedback').className='feedback show bad';$('feedback').innerHTML='<strong>Not quite.</strong>'+q[3]}$('xp').textContent=xp;$('streak').textContent=streak;$('check').classList.add('hidden');$('continue').classList.remove('hidden');if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();}
function next(){if(index<activeQuestions.length-1){index++;render()}else finish()}
function resetQuiz(onlyWrong){const previous=activeQuestions.slice();activeQuestions=onlyWrong?wrong.map(w=>previous[w.index]).filter(Boolean):questions.slice();index=0;chosen=null;locked=false;xp=0;streak=0;bestStreak=0;correctCount=0;wrong=[];$('xp').textContent='0';$('streak').textContent='0';$('quizcard').classList.remove('hidden');$('result').classList.add('hidden');render();}
function finish(){$('quizcard').classList.add('hidden');$('percent').textContent='100%';$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hidden');let review=wrong.length?'<div class="review"><h3>Review your mistakes</h3>'+wrong.map(w=>{const q=activeQuestions[w.index];return '<div class="review-item"><b>Q'+(w.index+1)+'. '+q[0]+'</b><p class="small">Your answer: '+String.fromCharCode(65+w.chosen)+'. '+q[1][w.chosen]+'</p><p><b>Correct:</b> '+String.fromCharCode(65+q[2])+'. '+q[1][q[2]]+'</p><p>'+q[3]+'</p></div>'}).join('')+'</div>':'<p>Perfect run — no incorrect answers to review!</p>';$('result').innerHTML='<h2>🎉 Magnetic Field of Straight Wire Complete!</h2><p class="scorebig">'+correctCount+' / '+activeQuestions.length+' correct</p><p>You earned <b>'+xp+' XP</b> · Best streak this run: <b>'+bestStreak+'</b></p>'+review+(wrong.length?'<button class="primary" id="retryWrong">Retry wrong answers ('+wrong.length+') ↻</button>':'')+'<button class="primary" id="retry">Practice all questions again</button>';$('retry').onclick=()=>resetQuiz(false);const rw=$('retryWrong');if(rw)rw.onclick=()=>resetQuiz(true);if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();}
$('check').addEventListener('click',check);$('continue').addEventListener('click',next);render();
</script><script src="/skillup-eye-shield.js?v=20261013-eye-shield-v1"></script><script src="/shared-nav.js?v=20261013-no-bottom-nav-v1"></script></body></html>
