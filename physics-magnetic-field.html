</style></head><body><div class="wrap"><div class="card"><h1>⚡ Magnetic Field</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>
const qs=[
['The SI unit of magnetic field is','tesla','weber','henry','ampere',0,'The SI unit of magnetic field (magnetic flux density) is tesla (T).'],
['The magnetic field at a distance r from a long straight current-carrying wire is proportional to','r','1/r','r²','1/r²',1,'For a long straight wire, B=μ₀I/(2πr), so B is inversely proportional to distance r.'],
['The direction of magnetic field around a straight current-carrying conductor is given by','Fleming’s left-hand rule','right-hand thumb rule','Lenz’s law','Coulomb’s law',1,'The right-hand thumb rule gives the circular direction of magnetic field around a current-carrying straight conductor.'],
['The magnetic force on a moving charge is maximum when the angle between velocity and magnetic field is','0°','30°','90°','180°',2,'F=qvB sinθ, which is maximum when sinθ=1, i.e. θ=90°.'],
['The magnetic force on a charged particle moving parallel to a uniform magnetic field is','maximum','zero','qB','infinite',1,'F=qvB sinθ; for parallel motion θ=0°, so the force is zero.'],
['A charged particle enters a uniform magnetic field perpendicular to the field. Its path is','straight line','circular','parabolic','random',1,'For perpendicular velocity, magnetic force is always perpendicular to velocity and acts as centripetal force, producing circular motion.'],
['The force on a current-carrying conductor in a magnetic field is given by','F=BIL sinθ','F=B/I L','F=BI/L','F=B+I+L',0,'The magnetic force on a straight conductor is F=BIL sinθ.'],
['A wire of length 0.5 m carries 4 A perpendicular to a 0.2 T magnetic field. The force is','0.04 N','0.2 N','0.4 N','4 N',2,'F=BIL=0.2×4×0.5=0.4 N.'],
['The magnetic field inside an ideal long solenoid is approximately','zero','uniform and parallel to its axis','radial','inversely proportional to length only',1,'Inside an ideal long solenoid, the magnetic field is approximately uniform and directed along its axis.'],
['The magnetic field at the center of a circular loop carrying current is proportional to','current','1/current','radius² only','zero always',0,'For a single circular loop, B=μ₀I/(2R), so the field is directly proportional to current.'],

let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});if(ok){score++;$('xp').textContent='✨ Correct! +1 XP'}else $('xp').textContent='❌ Incorrect. '+q[6];$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
