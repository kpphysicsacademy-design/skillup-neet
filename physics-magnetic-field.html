<script>
const questions=[["The SI unit of magnetic field is",["tesla (T)","weber (Wb)","henry (H)","ampere (A)"],0,"The SI unit of magnetic flux density B is tesla (T)."],["The magnetic field around a long straight current-carrying wire varies with distance r as",["B ∝ r","B ∝ 1/r","B ∝ r²","B is independent of r"],1,"For a long straight wire, B = μ₀I/(2πr), so B is inversely proportional to r."],["The direction of magnetic field around a straight current-carrying wire is found using",["Fleming’s left-hand rule","Right-hand thumb rule","Lenz’s law","Coulomb’s law"],1,"Point the right thumb along conventional current; curled fingers show the magnetic-field direction."],["The magnetic force on a moving charge is maximum when the angle between v and B is",["0°","30°","90°","180°"],2,"F = |q|vB sin θ, which is maximum when θ = 90°."],["A charged particle moves parallel to a uniform magnetic field. The magnetic force is",["|q|vB","Zero","|q|B/v","Infinite"],1,"F = |q|vB sin θ; for parallel motion θ = 0°, so F = 0."],["A charged particle enters a uniform magnetic field with velocity perpendicular to B. Its path is",["Straight","Circular","Parabolic","Always stationary"],1,"The magnetic force stays perpendicular to velocity and acts as centripetal force."],["A 0.5 m wire carries 4 A perpendicular to a 0.2 T field. The force on it is",["0.04 N","0.2 N","0.4 N","4 N"],2,"F = BIL sin θ = 0.2 × 4 × 0.5 = 0.4 N."],["The magnetic field inside an ideal long solenoid is approximately",["Zero everywhere","Uniform and along its axis","Radial","Strongest only outside"],1,"For a long solenoid, the internal field is approximately uniform and parallel to its axis."],["The field at the centre of a circular coil of N turns, radius R and current I is",["μ₀NI/R","μ₀NI/(2R)","μ₀I/(2πR)","μ₀NR/(2I)"],1,"For a circular coil, B = μ₀NI/(2R) at its centre."],["Two long parallel wires carrying currents in the same direction",["Repel","Attract","Exert no force","Always rotate"],1,"Parallel currents in the same direction attract; currents in opposite directions repel."],["If current through a long straight wire is doubled, its field at the same distance",["Halves","Doubles","Quadruples","Does not change"],1,"Since B ∝ I, doubling the current doubles the magnetic field."],["A charged particle moving antiparallel to B experiences magnetic force",["Maximum","Zero","qvB always","Perpendicular to B with nonzero magnitude"],1,"For antiparallel motion θ = 180°, so sin θ = 0 and the magnetic force is zero."],["The radius of circular motion of a particle of mass m and charge magnitude q moving at speed v perpendicular to B is",["qB/(mv)","mv/(qB)","qv/(mB)","mB/(qv)"],1,"Equating qvB = mv²/r gives r = mv/(qB)."],["A magnetic field does no work on a moving point charge because magnetic force is",["Along velocity","Perpendicular to velocity","Always opposite velocity","Always zero"],1,"The magnetic force is perpendicular to instantaneous displacement, so its work is zero."],["The magnetic field at distance 2r from a long straight wire is compared with the field at r as",["Twice as large","Half as large","Four times as large","Unchanged"],1,"B ∝ 1/r, so doubling distance halves the field."],["The magnetic field at the centre of a single circular loop is 2 mT. If current doubles and radius stays the same, the field becomes",["1 mT","2 mT","4 mT","8 mT"],2,"B = μ₀I/(2R), so doubling I doubles B to 4 mT."],["In the Biot–Savart law, the contribution dB from a current element is proportional to",["I dl sin θ/r²","I dl r²","r²/(I dl)","I/r only, independent of angle"],0,"The magnitude is dB = (μ₀/4π)(I dl sin θ/r²)."],["For a long solenoid with n turns per unit length, the field inside is",["μ₀nI","μ₀I/(2πr)","μ₀I/(2R)","μ₀n/I"],0,"For an ideal long solenoid in air, B ≈ μ₀nI."],["The magnetic field outside an ideal infinitely long solenoid is approximately",["μ₀nI","Zero","Infinite","Equal to the internal field everywhere"],1,"The fields from the closely spaced turns largely cancel outside an ideal long solenoid."],["A proton and an electron enter the same uniform B with equal speed perpendicular to B. The magnitudes of their radii are",["Equal","Proton radius is smaller","Electron radius is smaller","Both are zero"],1,"r = mv/(|q|B); with equal speed and charge magnitude, the proton’s much larger mass gives a larger radius."],["The SI unit of magnetic permeability μ₀ is",["T·m/A","A·m/T","T/A","Wb·m"],0,"From B = μ₀I/(2πr), μ₀ has units T·m/A."],["A 100-turn coil of radius 0.1 m carries 2 A. Its field at the centre is approximately (μ₀ = 4π × 10⁻⁷ T·m/A)",["1.26 × 10⁻³ T","2.51 × 10⁻⁴ T","4.00 × 10⁻⁵ T","8.00 × 10⁻⁴ T"],0,"B = μ₀NI/(2R) = (4π × 10⁻⁷ × 100 × 2)/(0.2) ≈ 1.26 × 10⁻³ T."],["The magnetic force on a straight wire of length L carrying current I in field B is zero when the wire is",["Perpendicular to B","At 45° to B","Parallel to B","At 60° to B"],2,"F = BIL sin θ; it is zero when the current direction is parallel to the field."],["The force per unit length between two long parallel wires is proportional to",["I₁I₂/d","d/(I₁I₂)","I₁ + I₂ only","d²"],0,"F/L = μ₀I₁I₂/(2πd), so it is proportional to I₁I₂/d."],["A magnetic field line and another magnetic field line cannot intersect because",["Fields have no direction","The field at one point cannot have two directions","Magnetic monopoles are present","Field lines are always straight"],1,"An intersection would assign two different directions to the magnetic field at the same point."],["At the centre of a circular loop, the field direction is determined by",["Right-hand grip rule","Coulomb’s law","Lenz’s law only","Fleming’s left-hand rule only"],0,"Curl the fingers of the right hand in the current direction; the thumb indicates the field through the loop."],["If the number of turns in a circular coil doubles while I and R remain constant, the central field",["Halves","Doubles","Quadruples","Stays the same"],1,"B = μ₀NI/(2R), so the field is directly proportional to the number of turns N."],["A particle moves at 3 × 10⁶ m/s perpendicular to a 0.2 T field. For charge magnitude 1.6 × 10⁻¹⁹ C, the force magnitude is",["9.6 × 10⁻¹⁴ N","3.2 × 10⁻¹³ N","9.6 × 10⁻¹⁷ N","0 N"],0,"F = qvB = 1.6 × 10⁻¹⁹ × 3 × 10⁶ × 0.2 = 9.6 × 10⁻¹⁴ N."],["For a charged particle moving perpendicular to a uniform magnetic field, increasing speed by a factor of 3 makes the orbit radius",["One-third as large","Three times as large","Nine times as large","Unchanged"],1,"Since r = mv/(|q|B), the radius is directly proportional to speed."],["Which statement about magnetic force on a moving charge is correct?",["It changes the speed in all cases","It can change direction without changing speed in a uniform field","It always acts along B","It is independent of charge"],1,"The magnetic force is perpendicular to velocity, so it can change direction while leaving speed unchanged."]];
let index=0,chosen=null,locked=false,xp=0,streak=0,bestStreak=0,correctCount=0,wrong=[];
const $=id=>document.getElementById(id);
function render(){chosen=null;locked=false;$('count').textContent='Question '+(index+1)+' of '+questions.length;$('qnum').textContent='QUESTION '+(index+1);$('percent').textContent=Math.round(index/questions.length*100)+'%';$('fill').style.width=(index/questions.length*100)+'%';$('xp').textContent=xp;$('streak').textContent=streak;$('question').textContent=questions[index][0];$('options').innerHTML='';questions[index][1].forEach((value,n)=>{const b=document.createElement('button');b.type='button';b.className='option';b.innerHTML='<span class="letter">'+String.fromCharCode(65+n)+'</span><span></span>';b.lastElementChild.textContent=value;b.addEventListener('click',()=>{if(locked)return;chosen=n;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b)});$('check').classList.remove('hidden');$('check').disabled=true;$('feedback').className='feedback';$('feedback').textContent='';$('continue').classList.add('hidden');if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();}
function check(){if(chosen===null||locked)return;locked=true;const q=questions[index],ok=chosen===q[2];document.querySelectorAll('.option').forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add('correct');if(n===chosen&&!ok)b.classList.add('wrong')});if(ok){xp+=10;streak++;bestStreak=Math.max(bestStreak,streak);correctCount++;$('feedback').className='feedback show';$('feedback').innerHTML='<strong>✅ Correct! +10 XP</strong>'+q[3]}else{streak=0;wrong.push({index,chosen,correct:q[2]});$('feedback').className='feedback show bad';$('feedback').innerHTML='<strong>Not quite.</strong>'+q[3]}$('xp').textContent=xp;$('streak').textContent=streak;$('check').classList.add('hidden');$('continue').classList.remove('hidden');if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();}
function next(){if(index<questions.length-1){index++;render()}else finish()}
function finish(){$('quizcard').classList.add('hidden');$('percent').textContent='100%';$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hidden');let review=wrong.length?'<div class="review"><h3>Review your mistakes</h3>'+wrong.map(w=>{const q=questions[w.index];return '<div class="review-item"><b>Q'+(w.index+1)+'. '+q[0]+'</b><p class="small">Your answer: '+String.fromCharCode(65+w.chosen)+'. '+q[1][w.chosen]+'</p><p><b>Correct:</b> '+String.fromCharCode(65+q[2])+'. '+q[1][q[2]]+'</p><p>'+q[3]+'</p></div>'}).join('')+'</div>':'<p>Perfect run — no incorrect answers to review!</p>';$('result').innerHTML='<h2>🎉 Quiz complete!</h2><p class="scorebig">'+correctCount+' / '+questions.length+' correct</p><p>You earned <b>'+xp+' XP</b> · Best streak this run: <b>'+bestStreak+'</b></p>'+review+'<button class="primary" id="retry">Retry quiz ↻</button>';$('retry').onclick=()=>location.reload();if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();}
$('check').addEventListener('click',check);$('continue').addEventListener('click',next);render();
</script><script src="/skillup-eye-shield.js?v=20261013-eye-shield-v1"></script><script src="/shared-nav.js?v=20261013-no-bottom-nav-v1"></script></body></html>
