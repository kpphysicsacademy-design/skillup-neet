<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Magnetic Force on Charge</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>⚡ Magnetic Force on Charge</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>
const qs=[
['The magnetic force on a charge q moving with velocity v in magnetic field B is','F=qvB','F=qvB sinθ','F=qB/v','F=q+v+B',1,'The magnetic force magnitude is F=qvB sinθ.'],
['The magnetic force on a charged particle is maximum when v and B are at','0°','30°','90°','180°',2,'F=qvB sinθ is maximum when θ=90°.'],
['The magnetic force on a charged particle moving parallel to B is','maximum','zero','qB','qvB',1,'For θ=0°, sinθ=0, so magnetic force is zero.'],
['The direction of magnetic force on a positive charge is given by','right-hand rule for cross product v×B','Coulomb’s law','Ohm’s law','Lenz’s law only',0,'For a positive charge, F=q(v×B), so its direction follows the right-hand cross-product rule.'],
['For a negative charge, the magnetic force direction is','same as v×B','opposite to v×B','always parallel to B','always parallel to v',1,'For q<0, F=q(v×B) reverses the direction of v×B.'],
['A charge moves perpendicular to B. The magnetic force is','qvB','qv/B','qB/v','zero',0,'At 90°, sinθ=1, so F=qvB in magnitude.'],
['A 2 C charge moves at 3 m/s perpendicular to a 4 T field. The force magnitude is','6 N','12 N','24 N','48 N',2,'F=qvB=2×3×4=24 N.'],
['Magnetic force on a moving charge does','positive work always','negative work always','no work','infinite work',2,'Magnetic force is perpendicular to velocity, so F·v=0 and no work is done.'],
['A charged particle entering a uniform B perpendicular to its velocity follows a','straight path','circular path','parabolic path','stationary path',1,'The magnetic force acts as a centripetal force, producing circular motion.'],
['The centripetal force for circular motion of charge q in B is','qvB','qB/v','mv/r','qv/r',0,'For perpendicular motion, magnetic force qvB provides the centripetal force.'],
['The radius of circular motion of a charged particle is','mv/(qB)','qB/(mv)','mB/(qv)','qv/(mB)',0,'Equating qvB=mv²/r gives r=mv/(qB).'],
['The time period of circular motion of a charged particle in uniform B is','2πm/(qB)','2πq/(mB)','qB/(2πm)','2πB/(mq)',0,'T=2πr/v=2πm/(qB) for magnitude of charge q.'],
['If the speed of a charged particle is doubled while q and B remain fixed, its circular orbit radius','halves','doubles','remains unchanged','becomes four times',1,'Since r=mv/(qB), radius is directly proportional to speed.'],
['If magnetic field strength is doubled while v, m and q remain fixed, the orbit radius','doubles','halves','remains unchanged','quadruples',1,'Since r=mv/(qB), radius is inversely proportional to B.'],
['A charged particle moving at an angle to a uniform magnetic field generally follows a','circle only','straight line only','helical path','parabolic path',2,'Velocity components parallel and perpendicular to B produce helical motion.']
];
let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});if(ok){score++;$('xp').textContent='✨ Correct! +1 XP'}else $('xp').textContent='❌ Incorrect. '+q[6];$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
