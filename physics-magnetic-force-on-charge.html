const questions=[["The magnetic force on a charge q moving with velocity v in a magnetic field B is",["qvB cos θ in magnitude","|q|vB sin θ","|q|B/v","|q|v/B"],1,"The magnetic force magnitude is F = |q|vB sin θ, where θ is the angle between velocity and magnetic field."],["The magnetic force on a moving charged particle is maximum when v and B are at",["0°","30°","90°","180°"],2,"Since F = |q|vB sin θ, the force is maximum at θ = 90°."],["A charged particle moves parallel to a uniform magnetic field. The magnetic force is",["Maximum","Zero","|q|vB","Dependent only on mass"],1,"For parallel motion θ = 0°, so sin θ = 0 and F = 0."],["For a positive charge, the direction of magnetic force is given by",["The direction of v × B","The direction of B × v","The direction of v + B","The direction opposite to v in all cases"],0,"For q > 0, the Lorentz magnetic force is F = q(v × B)."],["For a negative charge, the magnetic force direction is",["The same as v × B","Opposite to v × B","Always along B","Always along velocity"],1,"A negative q reverses the direction of v × B."],["A charge of 2 C moves at 3 m/s perpendicular to a 4 T field. The force magnitude is",["6 N","12 N","24 N","48 N"],2,"F = |q|vB = 2 × 3 × 4 = 24 N."],["A particle moves at 5 m/s at 30° to a 2 T field. If |q| = 3 C, the force magnitude is",["5 N","10 N","15 N","30 N"],2,"F = |q|vB sin 30° = 3 × 5 × 2 × 0.5 = 15 N."],["Magnetic force does no work on a point charge because it is always",["Parallel to velocity","Perpendicular to velocity","Opposite to displacement","Independent of velocity"],1,"The magnetic force is perpendicular to instantaneous velocity, so its power F·v and work are zero."],["A charged particle enters a uniform magnetic field with velocity perpendicular to B. Its path is",["Straight","Circular","Parabolic","Always stationary"],1,"The magnetic force provides the centripetal force, producing circular motion."],["For circular motion perpendicular to B, the centripetal force is provided by",["Electric force","Magnetic force","Gravitational force only","Friction"],1,"The magnetic force magnitude |q|vB supplies mv²/r."],["The radius of a charged particle’s circular path in a uniform magnetic field is",["|q|B/(mv)","mv/(|q|B)","|q|v/(mB)","mB/(|q|v)"],1,"Equating |q|vB = mv²/r gives r = mv/(|q|B)."],["The time period of circular motion of a non-relativistic charged particle in a uniform magnetic field is",["2πm/(|q|B)","2π|q|/(mB)","|q|B/(2πm)","2πB/(m|q|)"],0,"T = 2πr/v = 2πm/(|q|B), independent of speed in the non-relativistic model."],["If speed doubles while mass, charge magnitude, and B remain fixed, the orbit radius",["Halves","Doubles","Stays the same","Becomes four times larger"],1,"Since r = mv/(|q|B), radius is proportional to speed."],["If magnetic field strength doubles while speed remains fixed, the orbit radius",["Doubles","Halves","Stays the same","Quadruples"],1,"The radius is inversely proportional to B."],["A particle enters a uniform magnetic field at an angle other than 0° or 90°. Its trajectory is generally",["A circle in a plane perpendicular to B","A helix","A parabola","A straight line"],1,"The perpendicular velocity component causes circular motion while the parallel component remains unchanged, giving a helix."],["The component of velocity parallel to a uniform magnetic field is",["Continuously increased","Continuously decreased","Unchanged by magnetic force","Always zero"],2,"Magnetic force has no component along B, so the parallel velocity component remains constant."],["A particle has m = 2 × 10⁻²⁷ kg, |q| = 1.6 × 10⁻¹⁹ C, v = 4 × 10⁶ m/s and B = 0.5 T. Its orbit radius is approximately",["0.01 m","0.1 m","1 m","10 m"],1,"r = mv/(|q|B) = (2 × 10⁻²⁷ × 4 × 10⁶)/(1.6 × 10⁻¹⁹ × 0.5) = 0.1 m."],["A charge of magnitude 1.6 × 10⁻¹⁹ C moves at 3 × 10⁶ m/s perpendicular to a 0.2 T field. The force magnitude is",["9.6 × 10⁻¹⁴ N","9.6 × 10⁻¹⁷ N","3.2 × 10⁻¹³ N","Zero"],0,"F = |q|vB = 1.6 × 10⁻¹⁹ × 3 × 10⁶ × 0.2 = 9.6 × 10⁻¹⁴ N."],["If a charged particle moves at an angle θ to B, the magnetic force depends on",["v cos θ","v sin θ","1/v only","Mass only"],1,"F = |q|vB sin θ, so only the velocity component perpendicular to B contributes."],["A charged particle is at rest in a magnetic field. The magnetic force is",["|q|B","Zero","Infinite","Depends on its mass"],1,"With v = 0, F = |q|vB sin θ = 0."],["An electron and a proton enter the same uniform B with equal speeds perpendicular to B. The proton’s orbit radius is",["Smaller","Larger","Equal","Zero"],1,"Since r = mv/(|q|B), equal speed and charge magnitude mean radius is proportional to mass; the proton is much more massive."],["Two particles have equal momentum magnitude and equal charge magnitude, and move perpendicular to the same B. Their orbit radii are",["Equal","Inversely proportional to mass","Proportional to mass","Always zero"],0,"Using r = p/(|q|B), equal p, |q|, and B give equal radii."],["A particle travels parallel to a magnetic field at 8 × 10⁵ m/s. The magnetic force magnitude is",["|q|B × 8 × 10⁵","|q|B/(8 × 10⁵)","Zero","Infinite"],2,"Parallel motion has θ = 0°, so the magnetic force is zero regardless of speed."],["A 4 μC charge moves at 2 × 10³ m/s perpendicular to a 0.5 T field. The force magnitude is",["0.4 mN","2 mN","4 mN","8 mN"],2,"F = 4 × 10⁻⁶ × 2 × 10³ × 0.5 = 4 × 10⁻³ N = 4 mN."],["A 4 μC charge moves at 2 × 10³ m/s perpendicular to a 0.5 T field. The force magnitude is",["0.4 mN","2 mN","4 mN","8 mN"],2,"F = 4 × 10⁻⁶ × 2 × 10³ × 0.5 = 4 × 10⁻³ N = 4 mN."],["Which change leaves the radius of circular motion unchanged?",["Double v and double B","Double v only","Double B only","Double mass only"],0,"r = mv/(|q|B); doubling both v and B leaves the ratio unchanged."],["For a charged particle in a uniform magnetic field, the angular cyclotron frequency magnitude is",["|q|B/m","mB/|q|","|q|m/B","B/(|q|m)"],0,"ω = v/r = |q|B/m in the non-relativistic case."],["A particle’s circular orbit radius is 0.2 m. If its momentum doubles with q and B unchanged, the new radius is",["0.1 m","0.2 m","0.4 m","0.8 m"],2,"r = p/(|q|B), so doubling momentum doubles the radius to 0.4 m."],["Which statement about a magnetic field acting alone on a charged particle is correct?",["It changes the particle’s kinetic energy","It changes the speed continuously","It can change direction but not the speed","It always stops the particle"],2,"The magnetic force is perpendicular to velocity, so it changes direction without changing kinetic energy."],["A particle of mass m and charge magnitude q enters perpendicular to B with speed v. If its mass doubles and all other quantities stay fixed, its radius",["Halves","Doubles","Stays the same","Becomes four times larger"],1,"From r = mv/(|q|B), doubling mass doubles the radius."]];

'quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});} $('retry').addEventListener('click',()=>reset(false));$('retryWrong').addEventListener('click',()=>reset(true));});
