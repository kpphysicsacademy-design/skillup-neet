<meta name="description" content="SkillUp Physics Magnetic Hysteresis interactive practice lesson with 15 MCQs.">
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#14213d;--muted:#5d687d;--border:#d5deeb;--track:#e5eaf2;--selected:#eef5ff;--selected-border:#c7d8ee;--button:#182238;--button-hover:#10182a;--correct:#eaf8ef;--correct-border:#8bc79d;--incorrect:#fff0f0;--incorrect-border:#e3a0a0;--radius:12px}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px}.quiz-card{width:min(650px,100%);background:var(--card);border-radius:20px;box-shadow:0 10px 28px rgba(20,33,61,.09);padding:22px 20px 20px}.lesson-header{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px}.lesson-icon{font-size:30px;line-height:1}.lesson-title{margin:0;font-size:28px;line-height:1.2;font-weight:750;letter-spacing:-.4px;text-align:center}.status-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;font-weight:750}.progress-track{width:100%;height:9px;border-radius:999px;background:var(--track);overflow:hidden;margin-bottom:22px}.progress-fill{width:0;height:100%;border-radius:999px;background:var(--text);transition:width .3s ease}.question{margin:0 0 16px;font-size:18px;line-height:1.45;font-weight:700;color:#101b31}.options{display:grid;gap:9px}.option{width:100%;min-height:45px;border:1.5px solid var(--border);border-radius:var(--radius);background:#fff;color:#1b2942;padding:11px 13px;text-align:left;font:inherit;font-size:14px;cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .08s ease}.option:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.option:active:not(:disabled){transform:scale(.995)}.option.selected{background:var(--selected);border-color:var(--selected-border)}.option.correct{background:var(--correct);border-color:var(--correct-border)}.option.incorrect{background:var(--incorrect);border-color:var(--incorrect-border)}.option:disabled{cursor:default}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.feedback.correct-text{color:#28753f}.feedback.incorrect-text{color:#a13b3b}.next-button,.restart-button,.back-button{width:100%;min-height:41px;border:0;border-radius:11px;padding:10px 14px;font:inherit;font-size:14px;font-weight:750;cursor:pointer}.next-button,.restart-button{margin-top:12px;background:var(--button);color:#fff}.next-button:hover,.restart-button:hover{background:var(--button-hover)}.next-button:disabled{opacity:.45;cursor:not-allowed}.back-button{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--button);color:#fff;text-decoration:none}.back-button:hover{background:var(--button-hover)}.result{text-align:center;padding:10px 0 2px}.result-icon{font-size:42px;margin-bottom:5px}.result h2{margin:0 0 8px;font-size:24px}.result p{margin:5px 0;color:var(--muted);font-size:14px;line-height:1.5}.score-line{font-size:18px!important;font-weight:750;color:var(--text)!important;margin-top:12px!important}@media(max-width:600px){body{padding:14px 10px}.quiz-card{padding:19px 15px 16px;border-radius:17px}.lesson-title{font-size:23px}.lesson-icon{font-size:26px}.question{font-size:17px}.option{font-size:15px;min-height:48px}}
</style>
</head>
<body>
<main class="quiz-card" aria-live="polite">
<header class="lesson-header"><span class="lesson-icon" aria-hidden="true">🧲</span><h1 class="lesson-title">Magnetic Hysteresis</h1></header>
<section id="quizView"><div class="status-row"><span id="questionCounter">Question 1/15</span><span id="xpCounter">XP 0</span></div><div class="progress-track" aria-label="Quiz progress"><div class="progress-fill" id="progressFill"></div></div><p class="question" id="questionText"></p><div class="options" id="options" role="group" aria-label="Answer choices"></div><div class="feedback" id="feedback" aria-live="assertive"></div><button class="next-button" id="nextButton" type="button" disabled>Next</button></section>
<section id="resultView" class="result" hidden><div class="result-icon" aria-hidden="true">🏆</div><h2>Lesson Complete!</h2><p class="score-line" id="scoreLine"></p><p id="xpLine"></p><button class="restart-button" id="restartButton" type="button">Practice Again</button></section>
<a class="back-button" href="full-physics-path.html">← Back to Physics Path</a>
</main>
<script>
const questions=[
{q:"Magnetic hysteresis refers to the lag of:",options:["Current behind voltage","Magnetization behind the magnetizing field","Voltage behind current","Temperature behind pressure"],answer:1,explanation:"Hysteresis is the lag of magnetization (or magnetic induction) behind the applied magnetizing field."},
{q:"The graph used to study magnetic hysteresis is commonly called the:",options:["I–V curve","B–H loop","P–V diagram","V–t graph"],answer:1,explanation:"A plot of magnetic flux density B against magnetizing field H produces the hysteresis loop."},
{q:"The area enclosed by a hysteresis loop represents:",options:["Magnetic energy stored only","Energy loss per unit volume per cycle","Electrical resistance","Magnetic permeability only"],answer:1,explanation:"The loop area equals the hysteresis energy loss per unit volume for one complete magnetization cycle."},
{q:"Retentivity is the ability of a magnetic material to:",options:["Conduct current rapidly","Retain magnetization when the magnetizing field is removed","Lose all magnetism immediately","Increase its resistance"],answer:1,explanation:"Retentivity measures how much magnetization remains after the external magnetizing field is reduced to zero."},
{q:"Coercivity is the reverse magnetizing field required to:",options:["Double the flux density","Reduce the residual magnetization to zero","Increase permeability indefinitely","Create saturation immediately"],answer:1,explanation:"Coercive field is the magnitude of reverse H needed to bring the magnetization or flux density back to zero."},
{q:"A material with a narrow hysteresis loop generally has:",options:["Large hysteresis loss","Small hysteresis loss","Zero permeability","Very high coercivity always"],answer:1,explanation:"The area of the loop is smaller, so energy loss per magnetization cycle is smaller."},
{q:"Soft magnetic materials are preferred for transformer cores mainly because they have:",options:["High coercivity and large loop area","Low coercivity and small hysteresis loss","Zero retentivity","Very low permeability"],answer:1,explanation:"Transformer cores are repeatedly magnetized, so low coercivity and a small hysteresis-loop area reduce energy loss."},
{q:"Permanent magnets generally require a material with:",options:["Low retentivity and low coercivity","High retentivity and high coercivity","Zero hysteresis","Only high electrical conductivity"],answer:1,explanation:"A permanent magnet should retain strong magnetization and resist demagnetization, requiring high retentivity and coercivity."},
{q:"The point on a hysteresis loop where magnetization approaches its maximum is associated with:",options:["Saturation","Coercivity","Remanence only","Zero field only"],answer:0,explanation:"At sufficiently large magnetizing field, the material approaches magnetic saturation."},
{q:"When H is reduced to zero after magnetizing a ferromagnetic material, the remaining magnetization is called:",options:["Coercivity","Retentivity or remanence","Saturation field","Susceptance"],answer:1,explanation:"The remaining magnetization at H = 0 is called remanent magnetization or retentivity."},
{q:"Hysteresis loss in a magnetic core is converted mainly into:",options:["Mechanical work","Heat","Electric charge","Light only"],answer:1,explanation:"The energy dissipated during cyclic magnetization appears mainly as heat in the magnetic material."},
{q:"For a material used in an electromagnet that must demagnetize easily, a desirable property is:",options:["High coercivity","Low coercivity","High hysteresis loss","Very high remanence only"],answer:1,explanation:"Low coercivity makes the material easy to magnetize and demagnetize."},
{q:"The hysteresis loop of a hard magnetic material is typically:",options:["Narrow with low coercivity","Broad with high coercivity","Absent","A straight line through the origin"],answer:1,explanation:"Hard magnetic materials resist reversal of magnetization and therefore have relatively high coercivity and a broad loop."},
{q:"Hysteresis loss can be reduced in an AC magnetic core by using a material with:",options:["A large loop area","A small loop area","Very high coercivity","No magnetic permeability"],answer:1,explanation:"A small B–H loop area corresponds to lower energy loss per cycle."},
{q:"The magnetic hysteresis phenomenon is most strongly associated with:",options:["Ferromagnetic materials","Perfect vacuum","Ideal resistors","Non-magnetic glass"],answer:0,explanation:"Pronounced hysteresis is a characteristic of ferromagnetic materials due to their magnetic domain behavior."}
];
let current=0,score=0,xp=0,answered=false;
const questionCounter=document.getElementById('questionCounter'),xpCounter=document.getElementById('xpCounter'),progressFill=document.getElementById('progressFill'),questionText=document.getElementById('questionText'),optionsEl=document.getElementById('options'),feedback=document.getElementById('feedback'),nextButton=document.getElementById('nextButton'),quizView=document.getElementById('quizView'),resultView=document.getElementById('resultView'),scoreLine=document.getElementById('scoreLine'),xpLine=document.getElementById('xpLine'),restartButton=document.getElementById('restartButton');
function renderQuestion(){answered=false;const item=questions[current];questionCounter.textContent=`Question ${current+1}/${questions.length}`;xpCounter.textContent=`XP ${xp}`;progressFill.style.width=`${current/questions.length*100}%`;questionText.textContent=item.q;optionsEl.innerHTML='';feedback.textContent='';feedback.className='feedback';nextButton.disabled=true;nextButton.textContent=current===questions.length-1?'Finish':'Next';item.options.forEach((text,index)=>{const b=document.createElement('button');b.type='button';b.className='option';b.textContent=`${String.fromCharCode(65+index)}. ${text}`;b.addEventListener('click',()=>selectAnswer(index));optionsEl.appendChild(b)})}
function selectAnswer(index){if(answered)return;answered=true;const item=questions[current],buttons=[...optionsEl.querySelectorAll('.option')];buttons.forEach(b=>b.disabled=true);buttons[index].classList.add('selected');if(index===item.answer){score++;xp+=10;buttons[index].classList.remove('selected');buttons[index].classList.add('correct');feedback.textContent=`Correct! ${item.explanation}`;feedback.classList.add('correct-text')}else{buttons[index].classList.remove('selected');buttons[index].classList.add('incorrect');buttons[item.answer].classList.add('correct');feedback.textContent=`Not quite. ${item.explanation}`;feedback.classList.add('incorrect-text')}xpCounter.textContent=`XP ${xp}`;nextButton.disabled=false}
function next(){if(!answered)return;if(current<questions.length-1){current++;renderQuestion()}else{progressFill.style.width='100%';quizView.hidden=true;resultView.hidden=false;scoreLine.textContent=`Score: ${score}/${questions.length}`;xpLine.textContent=`XP earned: ${xp}`}}
function restart(){current=0;score=0;xp=0;resultView.hidden=true;quizView.hidden=false;renderQuestion()}
nextButton.addEventListener('click',next);restartButton.addEventListener('click',restart);renderQuestion();
</script>
</body>
</html>
