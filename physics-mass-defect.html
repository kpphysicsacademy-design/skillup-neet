<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Mass Defect</title><meta name="description" content="SkillUp Physics Mass Defect interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">⚛️</span><h1>Mass Defect</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["Mass defect of a nucleus is the difference between:",["The sum of the masses of free nucleons and the actual nuclear mass","Atomic mass and electron mass only","Proton mass and neutron mass","Mass number and atomic number"],0,"Mass defect is the missing mass when free nucleons form a bound nucleus."] ,["If a nucleus contains Z protons and N neutrons, its mass defect is based on:",["Z proton masses + N neutron masses minus the nuclear mass","Only the neutron mass","Only the proton mass","The number of electrons only"],0,"The constituent nucleon masses are compared with the measured mass of the bound nucleus."] ,["The mass defect of a bound nucleus is associated with its:",["Binding energy","Atomic number only","Electron affinity","Chemical energy only"],0,"The lost mass appears as nuclear binding energy through E=Δmc²."] ,["The relation between mass defect Δm and binding energy B is:",["B=Δmc²","B=Δm/c²","B=Δmc","B=mc²/Δm"],0,"Einstein's mass-energy relation gives B=Δmc²."] ,["One atomic mass unit corresponds approximately to:",["931.5 MeV/c²","9.315 MeV/c²","0.9315 MeV/c²","9315 MeV/c²"],0,"Using the mass-energy conversion, 1 u is approximately 931.5 MeV/c²."] ,["A nucleus with a larger mass defect for the same number of nucleons generally has:",["Greater total binding energy","Zero binding energy","Lower nuclear charge","No nuclear force"],0,"For a given nucleus size, a larger mass defect corresponds to greater binding energy."] ,["Binding energy of a nucleus represents the energy required to:",["Separate the nucleus completely into free nucleons","Remove one electron from an atom","Create an ion pair","Excite an electron between atomic shells"],0,"Binding energy is the energy needed to disassemble a nucleus into its constituent free nucleons."] ,["If the mass defect is 0.010 u, the binding energy is approximately:",["9.315 MeV","0.9315 MeV","93.15 MeV","931.5 MeV"],0,"Using 1 u≈931.5 MeV/c², 0.010 u corresponds to about 9.315 MeV."] ,["Binding energy per nucleon is calculated by:",["Total binding energy divided by mass number A","Mass number divided by binding energy","Binding energy multiplied by A","Binding energy divided by atomic number only"],0,"Average binding per nucleon is B/A."] ,["A higher binding energy per nucleon generally indicates:",["Greater average nuclear stability","No nuclear interaction","A larger atomic radius","More electrons"],0,"Binding energy per nucleon measures how strongly nucleons are bound on average."] ,["The mass of a stable bound nucleus is generally:",["Less than the sum of the masses of its separated nucleons","Greater than the sum in every case","Exactly equal to the sum","Always zero"],0,"The difference is the mass defect, corresponding to the binding energy."] ,["When free nucleons combine to form a bound nucleus, the released energy is related to:",["The mass defect","The atomic number only","The electron charge","The chemical valency"],0,"Formation of the bound nucleus lowers the mass-energy by an amount equal to Δmc²."] ,["If a nucleus has mass defect 2 u, its binding energy is approximately:",["1863 MeV","931.5 MeV","93.15 MeV","18.63 MeV"],0,"2 u×931.5 MeV/u gives approximately 1863 MeV."] ,["Why is binding energy per nucleon useful when comparing nuclei of different sizes?",["It gives an average measure of nuclear binding","It gives the number of electrons","It directly gives atomic radius","It equals the mass number"],0,"Dividing total binding energy by A allows comparison of average binding strength across nuclei."] ,["The mass defect concept demonstrates that nuclear binding energy is a consequence of:",["Mass-energy equivalence","Charge conservation failure","Electron emission only","Classical gravity"],0,"Nuclear binding is connected to mass-energy equivalence through E=Δmc²."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
