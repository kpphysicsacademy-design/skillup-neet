<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Mass Distribution</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-size:1.6rem;font-weight:900}.subtitle{color:#5f6b7a;margin:0 0 18px}.xp,.card{background:#fff;border-radius:20px;box-shadow:0 6px 20px #17203312}.xp{padding:10px 15px;font-weight:850}.card{padding:20px;margin:12px 0}.ph{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:11px;background:#dfe8f1;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.25s}.qnum{font-weight:800;color:#35516f;margin-bottom:11px}.question{font-size:1.27rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#58cc02;background:#f7fff1;transform:translateY(-1px)}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;background:#2db84d;color:#fff;font-weight:850;cursor:pointer;box-shadow:0 4px 0 #21863a;transition:.12s}.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}.feedback{margin-top:14px;padding:12px;border-radius:13px;font-weight:700;min-height:18px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:10px;padding:10px 13px;border:2px solid #d9d4f5;border-radius:13px;color:#5146a5;font-weight:800;text-decoration:none}.back:hover{background:#f0edff;transform:translateX(-2px)}@media(max-width:600px){.wrap{padding:20px 14px}.title{font-size:1.4rem}.question{font-size:1.12rem}}</style></head><body><main class="wrap"><div class="top"><div class="title">⚖️ Mass Distribution</div><div class="xp">⚡ <span id="xp">0</span> XP</div></div><p class="subtitle">Physics • NEET 2026 · Learn → Practice → Master</p><section class="card"><div class="ph"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><button class="btn" id="continue">Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const quiz=[['Mass distribution describes how mass is:', ['spread through a body or system','converted into energy only','always concentrated at one point','independent of position'],0,'Mass distribution specifies where the mass of a system is located.'],['For a uniform rod, mass per unit length is:', ['constant','zero','infinite','different at every point'],0,'Uniform distribution means constant linear mass density.'],['Linear mass density is defined as:', ['dm/dx','dx/dm','m/x²','dm·dx'],0,'For a thin rod, linear density λ = dm/dx.'],['Surface mass density is defined as:', ['dm/dA','dA/dm','dm/dV','mA'],0,'Surface density σ = dm/dA.'],['Volume mass density is defined as:', ['dm/dV','dV/dm','dm/dA','mV'],0,'Volume density ρ = dm/dV.'],['A body with more mass concentrated near its right side has its centre of mass shifted:', ['toward the right','toward the left','necessarily to the midpoint','outside the body'],0,'The centre of mass shifts toward regions containing more mass.'],['For a continuous body, total mass can be written as:', ['∫dm','∫dx only','∫dA only','∫dV only'],0,'Adding all differential mass elements gives M = ∫dm.'],['For a uniform three-dimensional body, mass density is:', ['constant throughout','zero everywhere','largest at the centre necessarily','dependent only on time'],0,'Uniform volume distribution has constant density.'],['If equal masses are symmetrically distributed about an axis, the centre of mass lies:', ['on the symmetry axis','always outside the body','at the heaviest point','at a random point'],0,'Symmetry forces the mass-weighted centre onto the symmetry axis.'],['Increasing the density of one region while keeping other regions fixed generally shifts the centre of mass:', ['toward that region','away from that region always','to the origin','nowhere'],0,'Adding mass biases the mass-weighted average toward its location.'],['For a thin sheet, the appropriate density for describing mass spread over area is:', ['surface mass density','linear mass density','volume mass density','charge density only'],0,'A sheet is two-dimensional, so σ = dm/dA is appropriate.'],['For a wire, the appropriate mass density is:', ['linear mass density','surface mass density','volume mass density','area density squared'],0,'A thin wire is treated as a one-dimensional mass distribution.'],['If a uniform rod is made twice as dense everywhere without changing its shape, its centre of mass:', ['does not change','moves to an end','moves outside the rod','doubles its position coordinate'],0,'Multiplying every mass element by the same factor leaves the CM unchanged.'],['Mass distribution affects the moment of inertia because moment of inertia depends on:', ['where mass is located relative to the axis','only total mass','only volume','only the centre coordinate'],0,'Mass farther from the axis contributes more strongly to I.'],['The centre of mass of a continuous mass distribution is obtained using:', ['mass-weighted position integrals','only the geometric volume','only the maximum density','only the total length'],0,'The CM is calculated by integrating position weighted by differential mass.']];let i=0,selected=-1,checked=false,score=0;const $=id=>document.getElementById(id),o=$("options"),b=$("continue"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;$("count").textContent='Question '+(i+1)+' of 15';$("question").textContent=a[0];o.innerHTML='';f.className='feedback';f.textContent='';b.style.display='inline-block';b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const el=document.createElement('button');el.className='option';el.textContent=String.fromCharCode(65+j)+'. '+item.text;el.dataset.index=item.index;el.onclick=()=>{selected=item.index;[...o.children].forEach(z=>z.classList.remove('selected'));el.classList.add('selected')};o.appendChild(el)})}b.onclick=()=>{if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(el=>{const n=Number(el.dataset.index);el.disabled=true;if(n===a[2])el.classList.add('correct');if(n===selected&&!ok)el.classList.add('wrong')});if(ok)score++;f.className=ok?'feedback good':'feedback bad';f.textContent=(ok?'🎯 Correct! +10 XP — ':'✗ Review — Correct answer: '+a[1][a[2]]+'. ')+a[3];$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$("question").textContent='🏆 Mass Distribution Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
