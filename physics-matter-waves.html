<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Matter Waves</title><meta name="description" content="SkillUp Physics Matter Waves interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🌊</span><h1>Matter Waves</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["According to de Broglie's hypothesis, a moving particle is associated with a:",["Matter wave","Sound wave only","Stationary electromagnetic field","Gravitational wave only"],0,"de Broglie proposed that every moving material particle has an associated wave nature."],["The de Broglie wavelength of a particle with momentum p is:",["λ=h/p","λ=p/h","λ=hp","λ=h+p"],0,"The de Broglie relation is λ=h/p, where h is Planck's constant and p is particle momentum."],["For a non-relativistic particle of mass m and speed v, de Broglie wavelength is:",["λ=h/(mv)","λ=hmv","λ=mv/h","λ=h+m v"],0,"Since p=mv for non-relativistic motion, λ=h/(mv)."],["If the momentum of a particle is doubled, its de Broglie wavelength becomes:",["Half","Double","Four times","Unchanged"],0,"Because λ is inversely proportional to momentum, doubling p halves λ."],["If the speed of a non-relativistic particle is doubled, its de Broglie wavelength becomes:",["Half","Double","Four times","Unchanged"],0,"For fixed mass, λ=h/(mv), so doubling speed halves the wavelength."],["The wave nature of particles was experimentally confirmed by electron diffraction in the:",["Davisson-Germer experiment","Millikan oil-drop experiment","Rutherford scattering experiment","Michelson-Morley experiment"],0,"The Davisson-Germer experiment demonstrated electron diffraction, supporting de Broglie's matter-wave hypothesis."],["Matter waves are associated with:",["Moving material particles","Only photons","Only stationary bodies","Only sound sources"],0,"De Broglie waves are associated with material particles in motion."],["The de Broglie wavelength of a particle is inversely proportional to its:",["Momentum","Charge only","Mass density only","Temperature only"],0,"The relation λ=h/p shows inverse proportionality between wavelength and momentum."],["For a particle accelerated through a potential difference V, its non-relativistic de Broglie wavelength varies as:",["1/√V","√V","V","1/V²"],0,"For a particle of charge magnitude q, kinetic energy qV gives p∝√V, hence λ∝1/√V."],["An electron and a proton have the same momentum. Their de Broglie wavelengths are:",["Equal","Different because wavelength depends directly on mass","Zero for the proton","Infinite for the electron"],0,"Since λ=h/p, particles with the same momentum have the same de Broglie wavelength."],["An electron and a proton have the same kinetic energy, non-relativistically. Which has the longer de Broglie wavelength?",["Electron","Proton","Both are equal","Neither has a wavelength"],0,"For fixed kinetic energy, λ=h/√(2mK); the smaller electron mass gives the longer wavelength."],["The de Broglie wavelength of a macroscopic object is usually very small because its:",["Momentum is large","Charge is zero","Temperature is low","Volume is small"],0,"Macroscopic bodies generally have large momentum, making λ=h/p extremely small."],["If a particle's momentum is reduced to one-fourth, its de Broglie wavelength becomes:",["Four times","One-fourth","Half","Unchanged"],0,"Since λ∝1/p, reducing momentum to p/4 makes wavelength 4λ."],["The momentum of a photon and its wavelength are related by:",["p=h/λ","p=hλ","p=λ/h","p=mc²"],0,"For photons, p=h/λ. The same momentum-wavelength relation also motivates de Broglie's matter waves."],["Matter-wave interference and diffraction demonstrate the:",["Wave nature of matter","Charge of neutrons","Rest mass of photons","Classical nature of electrons only"],0,"Electron diffraction and interference provide experimental evidence for the wave nature of matter."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
