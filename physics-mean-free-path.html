<script>
(function(){
'use strict';
const questions = [{"q":"What is the mean free path of a gas molecule?","o":["Average distance travelled between successive collisions","Total distance travelled by all molecules","Distance across the container","Distance travelled in one second"],"a":0,"e":"Mean free path is the average distance a molecule travels between two successive collisions."},{"q":"Which symbol commonly represents mean free path?","o":["\\(\\lambda\\)","\\(\\rho\\)","\\(\\eta\\)","\\(\\gamma\\)"],"a":0,"e":"Mean free path is commonly denoted by lambda, \\(\\lambda\\)."},{"q":"What is the SI unit of mean free path?","o":["metre (m)","metre per second","pascal","joule"],"a":0,"e":"Mean free path is a length, so its SI unit is metre."},{"q":"For an ideal gas, mean free path is inversely proportional to which quantity if temperature is fixed?","o":["Pressure","Molecular mass only","Container volume only","RMS speed"],"a":0,"e":"At fixed temperature and molecular diameter, \\(\\lambda\\propto 1/P\\)."},{"q":"For hard-sphere molecules, the mean free path is given by which expression?","o":["\\(\\lambda=\\frac{1}{\\sqrt{2}\\pi d^2 n}\\)","\\(\\lambda=\\sqrt{2}\\pi d^2n\\)","\\(\\lambda=nd\\)","\\(\\lambda=P/n\\)"],"a":0,"e":"Here d is molecular diameter and n is number density."},{"q":"In the formula for mean free path, what does d represent?","o":["Molecular diameter","Molecular density","Distance between container walls","Molecular speed"],"a":0,"e":"The collision cross-section depends on the molecular diameter d."},{"q":"In \\(\\lambda=1/(\\sqrt{2}\\pi d^2n)\\), what does n represent?","o":["Number of molecules per unit volume","Number of moles","Molecular speed","Number of collisions per second"],"a":0,"e":"The number density n is the number of molecules per unit volume."},{"q":"If number density doubles while molecular diameter stays the same, mean free path becomes…","o":["Half","Double","Four times","Unchanged"],"a":0,"e":"Because \\(\\lambda\\propto1/n\\), doubling n halves the mean free path."},{"q":"If molecular diameter doubles while number density stays constant, mean free path becomes…","o":["One-fourth","Half","Double","Four times"],"a":0,"e":"The dependence is \\(\\lambda\\propto1/d^2\\); doubling d makes the mean free path one-fourth."},{"q":"At constant temperature, what happens to mean free path when gas pressure increases?","o":["It decreases","It increases","It remains constant","It first increases then decreases"],"a":0,"e":"Higher pressure means greater number density at fixed temperature, so collisions are more frequent and mean free path decreases."},{"q":"At constant pressure, if absolute temperature increases, the mean free path of an ideal gas generally…","o":["Increases","Decreases","Becomes zero","Stays exactly constant"],"a":0,"e":"Using \\(\\lambda=k_BT/(\\sqrt{2}\\pi d^2P)\\), mean free path is proportional to absolute temperature at fixed pressure."},{"q":"Which change increases mean free path, all else unchanged?","o":["Decrease in number density","Increase in molecular diameter","Increase in pressure at fixed temperature","Increase in collision cross-section"],"a":0,"e":"Lower number density reduces the frequency of encounters and increases mean free path."},{"q":"The mean free path is typically much smaller than the size of a gas container because…","o":["Molecules undergo many collisions within the container","Molecules do not move","Gas molecules have zero diameter","Pressure is always zero"],"a":0,"e":"In ordinary gases, many molecular collisions occur before a molecule crosses the container."},{"q":"Which expression relates mean free path to pressure for an ideal gas?","o":["\\(\\lambda=\\frac{k_BT}{\\sqrt{2}\\pi d^2P}\\)","\\(\\lambda=\\frac{P}{k_BT}\\)","\\(\\lambda=\\frac{d^2P}{k_BT}\\)","\\(\\lambda=\\frac{k_BP}{T}\\)"],"a":0,"e":"Substituting \\(n=P/(k_BT)\\) into the number-density formula gives this result."},{"q":"What is \\(k_B\\) in the pressure form of the mean-free-path equation?","o":["Boltzmann constant","Spring constant","Thermal conductivity","Bulk modulus"],"a":0,"e":"Boltzmann constant relates temperature to the average thermal energy per molecule."},{"q":"If pressure is doubled at constant temperature, mean free path is…","o":["Halved","Doubled","Quadrupled","Unchanged"],"a":0,"e":"At fixed temperature and molecular diameter, \\(\\lambda\\propto1/P\\)."},{"q":"Which factor appears squared in the denominator of the hard-sphere mean-free-path formula?","o":["Molecular diameter","Absolute temperature","Pressure","RMS speed"],"a":0,"e":"The collision cross-section is proportional to \\(d^2\\)."},{"q":"Mean free path is associated most directly with which microscopic process?","o":["Molecular collisions","Gravitational acceleration","Nuclear decay","Electrical conduction only"],"a":0,"e":"It measures the typical travel distance between molecular collisions."},{"q":"A gas has mean free path \\(\\lambda\\). If number density becomes three times larger, the new mean free path is…","o":["\\(\\lambda/3\\)","\\(3\\lambda\\)","\\(\\lambda/9\\)","\\(9\\lambda\\)"],"a":0,"e":"Since \\(\\lambda\\propto1/n\\), tripling number density divides the mean free path by three."},{"q":"If mean free path is 0.2 mm and pressure is doubled at constant temperature, the new mean free path is…","o":["0.1 mm","0.4 mm","0.2 mm","0.05 mm"],"a":0,"e":"Inverse proportionality to pressure gives \\(0.2/2=0.1\\) mm."},{"q":"Why does a molecule with a larger collision diameter have a shorter mean free path?","o":["Its effective collision cross-section is larger","It has no kinetic energy","Its speed must be zero","It reduces the gas pressure to zero"],"a":0,"e":"A larger cross-section makes collisions more likely per unit distance."},{"q":"The factor \\(\\sqrt{2}\\) in the mean-free-path formula accounts for…","o":["Relative motion of gas molecules","Gravity acting on molecules","The shape of the container","Conversion from metres to centimetres"],"a":0,"e":"The factor arises because molecules are moving relative to one another, not against stationary targets."},{"q":"For fixed molecular diameter and temperature, if pressure falls to one-fourth, mean free path becomes…","o":["Four times","One-fourth","Half","Unchanged"],"a":0,"e":"Because \\(\\lambda\\propto1/P\\), quartering pressure makes mean free path four times larger."},{"q":"Which statement about mean free path is correct?","o":["It is an average, so individual free-flight distances can vary","Every molecule travels exactly the same distance between collisions","It is a measure of molecular diameter","It is measured in pascals"],"a":0,"e":"Mean free path is a statistical average; individual distances are not identical."},{"q":"If \\(\\lambda\\propto T/P\\), what happens when both T and P double?","o":["Mean free path remains unchanged","It doubles","It halves","It becomes four times"],"a":0,"e":"The ratio T/P is unchanged when both quantities double, assuming molecular diameter is fixed."},{"q":"Which quantity is dimensionless?","o":["\\(\\lambda/d\\)","\\(\\lambda\\)","\\(d\\)","\\(P\\)"],"a":0,"e":"The ratio of two lengths, mean free path and molecular diameter, is dimensionless."},{"q":"A very low gas pressure generally produces a…","o":["Longer mean free path","Shorter mean free path","Zero mean free path","Mean free path equal to molecular diameter always"],"a":0,"e":"At low pressure, number density is lower and molecules travel farther between collisions."},{"q":"What happens to the mean free path if the gas is compressed isothermally?","o":["It decreases","It increases","It does not change","It becomes infinite"],"a":0,"e":"Isothermal compression increases pressure and number density, reducing mean free path."},{"q":"Which assumption is commonly used in deriving the elementary mean-free-path formula?","o":["Molecules are approximated as hard spheres","Molecules are fixed in space","Collisions never occur","Molecular diameter is infinite"],"a":0,"e":"The basic kinetic-theory result models molecules as hard spheres with an effective collision diameter."},{"q":"For the same gas at the same temperature, which sample has the longest mean free path?","o":["The sample at the lowest pressure","The sample at the highest pressure","All samples have the same mean free path","The sample with the greatest number density"],"a":0,"e":"At fixed temperature, mean free path is inversely proportional to pressure and number density."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
 if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options')]).catch(function(){});}
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Mean Free Path Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise([card]).catch(function(){});}
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
 window.addEventListener('load',function(){if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise().catch(function(){});}});
})();
</script>
