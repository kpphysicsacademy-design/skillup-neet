<section class="hero"><h1>🌡️ Mean Free Path</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>

<script>
(function(){
'use strict';
const questions=[{"q":"What is the mean free path of a gas molecule?","o":["Average distance travelled between successive collisions","The total length of the container","The diameter of the container","The distance travelled in one second"],"a":0,"e":"Mean free path is the average distance a molecule travels between collisions."},{"q":"What symbol is commonly used for mean free path?","o":["λ","ρ","η","γ"],"a":0,"e":"Mean free path is commonly represented by lambda, λ."},{"q":"The SI unit of mean free path is…","o":["metre","second","kelvin","pascal"],"a":0,"e":"Mean free path is a length, so its SI unit is the metre."},{"q":"For hard-sphere molecules, mean free path is inversely proportional to…","o":["Number density","Temperature only","Molecular speed only","Container length"],"a":0,"e":"At a given molecular diameter, a higher number density leads to more collisions and a shorter mean free path."},{"q":"A common formula for mean free path is…","o":["λ = 1/(√2 π d² n)","λ = √2 π d² n","λ = n/(πd)","λ = P/T"],"a":0,"e":"For hard-sphere diameter d and number density n, λ = 1/(√2πd²n)."},{"q":"In the mean-free-path formula, d represents…","o":["Molecular diameter","Gas density","Molecular speed","Container diameter"],"a":0,"e":"The symbol d is the effective molecular collision diameter."},{"q":"In the formula λ = 1/(√2πd²n), n is…","o":["Number of molecules per unit volume","Number of moles in the room","Molecular mass","Collision time"],"a":0,"e":"Here n is number density, measured in molecules per cubic metre."},{"q":"If number density doubles while molecular diameter remains unchanged, mean free path…","o":["Halves","Doubles","Quadruples","Stays unchanged"],"a":0,"e":"Because λ is inversely proportional to n, doubling n halves λ."},{"q":"If molecular diameter doubles at fixed number density, mean free path becomes…","o":["One-half as large","One-quarter as large","Twice as large","Four times as large"],"a":1,"e":"Mean free path is proportional to 1/d²; doubling d reduces λ to one-quarter."},{"q":"At fixed temperature for an ideal gas, increasing pressure generally makes mean free path…","o":["Shorter","Longer","Unchanged at all pressures","Infinite"],"a":0,"e":"Higher pressure at fixed temperature means greater number density, causing more frequent collisions."},{"q":"At fixed pressure, increasing absolute temperature generally makes mean free path…","o":["Longer","Shorter","Exactly zero","Unchanged for every gas"],"a":0,"e":"For an ideal gas, number density n = P/(kT); at fixed P, higher T lowers n and increases λ."},{"q":"Why do gas molecules collide more frequently when gas density increases?","o":["More molecules occupy each unit volume","Molecules become motionless","Molecular diameter becomes zero","Pressure disappears"],"a":0,"e":"Greater number density increases the chance of encountering another molecule along a path."},{"q":"Mean free path is an average because…","o":["Individual molecules travel different distances between collisions","Every collision occurs at exactly the same distance","Gas molecules never collide","All molecules have identical paths"],"a":0,"e":"Molecular positions and trajectories vary, so collision distances form a distribution."},{"q":"Which change would increase mean free path most directly?","o":["Reducing the number density","Increasing the number density","Increasing molecular diameter","Compressing the gas at fixed temperature"],"a":0,"e":"Lower number density reduces collision frequency and increases the average distance between collisions."},{"q":"Which change generally decreases mean free path?","o":["Increasing gas pressure at fixed temperature","Reducing number density","Reducing molecular diameter","Expanding the gas at fixed temperature"],"a":0,"e":"At fixed temperature, higher pressure means more molecules per unit volume."},{"q":"If λ = 2 × 10⁻⁷ m, what is λ in nanometres?","o":["20 nm","200 nm","2 nm","0.2 nm"],"a":1,"e":"One nanometre is 10⁻⁹ m, so 2 × 10⁻⁷ m = 200 nm."},{"q":"If a molecule travels an average distance of 5 μm between collisions, the mean free path is…","o":["5 × 10⁻⁶ m","5 × 10⁶ m","5 × 10⁻³ m","5 × 10⁻⁹ m"],"a":0,"e":"One micrometre is 10⁻⁶ m, so 5 μm = 5 × 10⁻⁶ m."},{"q":"Does mean free path equal the molecular diameter?","o":["Not generally; it is usually much larger in a dilute gas","Always","It is always smaller than the diameter","It is a time, not a length"],"a":0,"e":"In a dilute gas, molecules typically travel many molecular diameters between collisions."},{"q":"What is the effect of evacuating a gas container while keeping molecular size the same?","o":["Mean free path increases","Mean free path decreases","Mean free path becomes the molecular mass","No change is possible"],"a":0,"e":"Removing molecules lowers number density, increasing mean free path."},{"q":"What is the main reason a high vacuum has a long mean free path?","o":["Very low gas number density","Very large molecular diameter","Very high number density","No space between molecules"],"a":0,"e":"With very few molecules present, collisions become less frequent."},{"q":"The factor √2 in the hard-sphere mean-free-path formula accounts for…","o":["Relative motion of molecules in collisions","The molecular mass being doubled","The gas having two containers","A temperature measured in kelvin"],"a":0,"e":"The √2 factor arises when relative molecular motion is included in the collision rate."},{"q":"If the mean free path decreases, the average collision frequency at the same average speed tends to…","o":["Increase","Decrease","Become zero","Stay unchanged in every case"],"a":0,"e":"At a given average speed, shorter distance between collisions means more collisions per unit time."},{"q":"The approximate relation between mean free path λ, average molecular speed v and mean time between collisions τ is…","o":["λ ≈ vτ","λ = v/τ²","λ = τ/v","λ = v + τ"],"a":0,"e":"Distance is approximately speed multiplied by the time interval between collisions."},{"q":"If mean free path is 4 × 10⁻⁷ m and average speed is 400 m/s, the approximate mean time between collisions is…","o":["10⁻⁹ s","10⁻⁷ s","10⁻⁵ s","10⁻³ s"],"a":0,"e":"τ ≈ λ/v = (4 × 10⁻⁷)/400 = 10⁻⁹ s."},{"q":"Which statement about mean free path in a dilute gas is correct?","o":["It depends on molecular size and number density","It depends only on gas colour","It is independent of collisions","It is always equal to the container size"],"a":0,"e":"For hard spheres, λ depends mainly on effective molecular diameter and number density."},{"q":"At the same number density, a gas with larger effective molecular diameter has…","o":["Shorter mean free path","Longer mean free path","Exactly the same mean free path","No collisions"],"a":0,"e":"The collision cross-section grows with d², reducing the mean free path."},{"q":"If number density falls to one-third of its original value, mean free path becomes…","o":["Three times as large","One-third as large","Nine times as large","Unchanged"],"a":0,"e":"Mean free path is inversely proportional to number density."},{"q":"Why is mean free path important in gas transport phenomena?","o":["It helps describe diffusion, viscosity and thermal conductivity","It determines molecular colour","It prevents heat transfer","It gives the gas's chemical formula"],"a":0,"e":"The distance between collisions influences how molecules transport momentum, energy and mass."},{"q":"In a gas at equilibrium, do all molecules have the same mean free path for every flight?","o":["No; individual flight distances vary","Yes, every flight is identical","Only the slowest molecules collide","Collisions occur only at the wall"],"a":0,"e":"Mean free path is a statistical average, not a fixed distance for each molecule."},{"q":"For hard-sphere molecules, if both number density and molecular diameter increase, the mean free path…","o":["Decreases","Increases","Must remain constant","Cannot be estimated from the formula"],"a":0,"e":"Since λ is proportional to 1/(d²n), increasing either d or n reduces λ."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
 if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options')]).catch(function(){});}
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Mean Free Path Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise([card]).catch(function(){});}
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
 window.addEventListener('load',function(){if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise().catch(function(){});}});
})();
</script>
