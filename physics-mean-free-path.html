<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Mean Free Path</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🛣️ Mean Free Path</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['The mean free path of a gas molecule is the average distance travelled by a molecule between successive','collisions','oscillations','changes in temperature','changes in pressure',0,'Mean free path is the average distance a molecule travels between two successive collisions.'],
['The symbol commonly used for mean free path is','λ','μ','ν','σ',0,'Mean free path is conventionally represented by λ (lambda).'],
['For an ideal gas, mean free path is inversely proportional to','pressure','absolute temperature','molecular speed','volume',0,'For fixed molecular diameter and temperature, λ is inversely proportional to pressure.'],
['At constant temperature, if the pressure of a gas is doubled, its mean free path becomes','double','half','four times','unchanged',1,'Since λ ∝ 1/P, doubling pressure reduces the mean free path to half.'],
['For a dilute gas, the mean free path increases when the molecular diameter','increases','decreases','is doubled','is tripled',1,'Mean free path varies inversely with the square of molecular diameter, so smaller molecules have a longer mean free path.'],
['The mean free path of gas molecules is related to number density n approximately as','λ ∝ n','λ ∝ 1/n','λ ∝ n²','λ ∝ √n',1,'For a given molecular collision cross-section, λ is inversely proportional to number density.'],
['For hard-sphere molecules, a commonly used expression for mean free path is','λ=1/(√2 πd²n)','λ=√2 πd²n','λ=πd²n','λ=√2/(πd²n)',0,'For molecular diameter d and number density n, λ = 1/(√2 π d² n).'],
['At fixed pressure, increasing the absolute temperature of a dilute ideal gas generally causes the mean free path to','decrease','increase','become zero','remain exactly unchanged',1,'At fixed pressure, number density decreases as temperature rises, increasing the mean free path.'],
['If the number density of molecules is reduced to one-fourth while collision diameter is unchanged, the mean free path becomes','one-fourth','one-half','four times','eight times',2,'Because λ ∝ 1/n, reducing n to one-fourth makes λ four times larger.'],
['The mean free path is a quantity having the dimensions of','length','time','velocity','pressure',0,'Mean free path is an average distance, so its dimension is length.'],
['If the molecular diameter is doubled while number density remains constant, the mean free path becomes','twice','half','one-fourth','four times',2,'Since λ ∝ 1/d², doubling d reduces λ by a factor of four.'],
['A gas at higher pressure, with temperature and molecular diameter otherwise unchanged, has a mean free path that is','larger','smaller','zero in every case','independent of pressure',1,'Higher pressure means greater molecular number density, so collisions are more frequent and λ decreases.'],

['If the collision cross-section of molecules increases while number density is unchanged, the mean free path','increases','decreases','does not change','becomes infinite',1,'A larger collision cross-section increases collision probability and therefore decreases mean free path.'],

];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
