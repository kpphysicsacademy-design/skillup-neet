<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SkillUp Physics | Measurement Practice</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.opt.selected{border-color:#5146a5;background:#f4f1ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.opt:disabled{cursor:default}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>📏 Measurement Practice</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="action">CHECK</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['Which instrument is most suitable for measuring the diameter of a thin wire accurately?',['Metre scale','Vernier calipers','Stopwatch','Thermometer'],1,'Vernier calipers can measure small lengths and diameters with greater precision than a metre scale.'],['The least count of an instrument is:',['Its maximum range','The smallest measurement it can resolve','The average of all readings','The largest error possible'],1,'Least count is the smallest value that an instrument can measure or resolve.'],['A metre scale has a least count of:',['1 m','1 cm','1 mm','0.1 mm'],2,'A standard metre scale is commonly graduated to millimetre divisions, so its least count is 1 mm.'],['Parallax error occurs mainly when:',['The object is too heavy','The eye is not placed at the correct position while reading a scale','The unit is changed','The instrument is calibrated'],1,'Parallax occurs when the apparent position of a mark changes because the eye is viewed from an incorrect angle.'],['To reduce parallax error while reading a scale, the eye should be:',['Far above the scale','Far below the scale','At the same level as the reading mark','Closed'],2,'The eye should be perpendicular to the scale and at the same level as the reading to avoid parallax.'],['If repeated measurements are 10.2 cm, 10.3 cm and 10.1 cm, their mean is:',['10.0 cm','10.1 cm','10.2 cm','10.3 cm'],2,'Mean = (10.2 + 10.3 + 10.1)/3 = 10.2 cm.'],['Random errors can generally be reduced by:',['Taking repeated measurements and averaging','Changing the unit','Ignoring unusual readings','Using fewer observations'],0,'Repeated observations and averaging can reduce the effect of random variations.'],['A systematic error is an error that:',['Changes randomly from reading to reading','Tends to occur in a consistent direction or pattern','Is always zero','Occurs only once'],1,'Systematic errors produce a consistent bias, often due to calibration or instrument effects.'],['A zero error is present when an instrument:',['Has no scale','Shows a non-zero reading when the true quantity is zero','Has a large range','Uses SI units'],1,'Zero error is indicated when the instrument does not read zero for a true zero input.'],['If a balance reads +0.2 g when empty, the zero error is:',['+0.2 g','−0.2 g','0 g','+2 g'],0,'The instrument reading at zero input is +0.2 g, so the zero error is +0.2 g.'],['Which reading has the greatest number of significant figures?',['2.5','2.50','2.500','2'],2,'Trailing zeros after a decimal point are significant, so 2.500 has four significant figures.'],['A measurement written as 0.00450 m contains how many significant figures?',['2','3','4','5'],1,'The significant digits are 4, 5 and the trailing zero: 0.00450 has 3 significant figures.'],['A length is measured as 25.0 cm. In metres it is:',['0.0250 m','0.250 m','2.50 m','25.0 m'],1,'Since 100 cm = 1 m, 25.0 cm = 0.250 m.'],['Which statement best describes precision?',['Closeness of repeated measurements to one another','Closeness to the accepted value only','The size of the instrument','The unit used'],0,'Precision refers to the closeness of repeated measurements to each other. Accuracy refers to closeness to the accepted or true value.'],['Why should a measured result include its unit?',['A number alone may not specify the physical magnitude completely','Units always increase accuracy','Units remove all errors','Units make measurements exact'],0,'A numerical value without a unit can be ambiguous; the unit identifies the physical scale of the measurement.']];let i=0,score=0,answered=false,selected=-1;const $=x=>document.getElementById(x);function render(){answered=false;selected=-1;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q[1].map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('action').classList.remove('hide');$('action').textContent='CHECK'});$('xp').textContent='';$('action').classList.add('hide');$('action').disabled=false;}function check(){if(selected<0)return;if(!answered){answered=true;const q=qs[i],ok=selected===q[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===selected&&!ok)b.classList.add('wrong')});if(ok){score++;$('xp').textContent='✨ Correct! +1 XP'}else{$('xp').textContent='❌ Incorrect. '+q[3]}$('score').textContent=`XP ${score}`;$('fill').style.width=`${(i+1)/15*100}%`;$('action').textContent=i===14?'FINISH':'Next Question →';return;}if(i<14){i++;render()}else{$('quiz').innerHTML='';$('action').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('action').onclick=check;render();</script></body></html>
