<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Measurement Practice</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f6f8fb;color:#13233b}.wrap{max-width:760px;margin:auto;padding:28px 18px 40px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #00000012}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{margin:0;font-size:28px}.xp{font-weight:800}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:99px;overflow:hidden;margin:12px 0 24px}.fill{height:100%;width:0;background:#58cc02;transition:.3s}.q{font-size:21px;font-weight:800;line-height:1.45;margin:0 0 18px}.opts{display:grid;gap:10px}.opt{display:block;width:100%;text-align:left;padding:15px 16px;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer;transition:.16s}.opt:hover{background:#f1f6ff}.opt.selected{border-color:#5146a5;background:#f4f1ff}.opt.correct{border-color:#39a852!important;background:#e9f8ed!important}.opt.wrong{border-color:#e05252!important;background:#fff0f0!important}.opt:disabled{cursor:default}.actions{display:flex;gap:10px;margin-top:18px}.btn{padding:13px 20px;border:0;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer}.check{background:#58cc02;color:#fff}.next{background:#2563eb;color:#fff}.check:disabled,.next:disabled{opacity:.45;cursor:not-allowed}.feedback{min-height:28px;margin-top:15px;font-weight:700;line-height:1.5}.explain{font-weight:500;color:#40536a}.result{display:none;text-align:center;padding:12px 0}.retry{background:#2563eb;color:#fff}.back{display:block;width:100%;text-align:center;text-decoration:none;background:#172033;color:#fff;border-radius:14px;padding:14px;margin-top:16px;font-size:16px;font-weight:800}@media(max-width:600px){.wrap{padding:20px 12px}.card{padding:20px}.top h1{font-size:24px}.q{font-size:19px}.opt{font-size:15px}.actions{flex-direction:column}.btn{width:100%}}</style></head><body><main class="wrap"><section class="card"><div class="top"><h1>📏 Measurement Practice</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></div><div class="meta"><span id="count">Question 1/15</span><span id="mastery">Skill Mastery 0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div><div id="quiz"></div><div class="feedback" id="feedback"></div><div class="actions"><button id="check" class="btn check" disabled>Check Answer</button><button id="next" class="btn next" disabled>Next Question →</button></div><div id="result" class="result"><h2>🎉 Skill Complete!</h2><p id="resultText"></p><button id="retry" class="btn retry">Retry Quiz ↻</button></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></section></main><script>const qs=[['Which instrument is most suitable for measuring the diameter of a thin wire accurately?',['Metre scale','Vernier calipers','Stopwatch','Thermometer'],1,'Vernier calipers can measure small lengths and diameters with greater precision than a metre scale.'],['The least count of an instrument is:',['Its maximum range','The smallest measurement it can resolve','The average of all readings','The largest error possible'],1,'Least count is the smallest value that an instrument can measure or resolve.'],['A metre scale has a least count of:',['1 m','1 cm','1 mm','0.1 mm'],2,'A standard metre scale is commonly graduated to millimetre divisions, so its least count is 1 mm.'],['Parallax error occurs mainly when:',['The object is too heavy','The eye is not placed at the correct position while reading a scale','The unit is changed','The instrument is calibrated'],1,'Parallax occurs when the apparent position of a mark changes because the eye is viewed from an incorrect angle.'],['To reduce parallax error while reading a scale, the eye should be:',['Far above the scale','Far below the scale','At the same level as the reading mark','Closed'],2,'The eye should be perpendicular to the scale and at the same level as the reading to avoid parallax.'],['If repeated measurements are 10.2 cm, 10.3 cm and 10.1 cm, their mean is:',['10.0 cm','10.1 cm','10.2 cm','10.3 cm'],2,'Mean = (10.2 + 10.3 + 10.1)/3 = 10.2 cm.'],['Random errors can generally be reduced by:',['Taking repeated measurements and averaging','Changing the unit','Ignoring unusual readings','Using fewer observations'],0,'Repeated observations and averaging can reduce the effect of random variations.'],['A systematic error is an error that:',['Changes randomly from reading to reading','Tends to occur in a consistent direction or pattern','Is always zero','Occurs only once'],1,'Systematic errors produce a consistent bias, often due to calibration or instrument effects.'],['A zero error is present when an instrument:',['Has no scale','Shows a non-zero reading when the true quantity is zero','Has a large range','Uses SI units'],1,'Zero error is indicated when the instrument does not read zero for a true zero input.'],['If a balance reads +0.2 g when empty, the zero error is:',['+0.2 g','−0.2 g','0 g','+2 g'],0,'The instrument reading at zero input is +0.2 g, so the zero error is +0.2 g.'],['Which reading has the greatest number of significant figures?',['2.5','2.50','2.500','2'],2,'Trailing zeros after a decimal point are significant, so 2.500 has four significant figures.'],['A measurement written as 0.00450 m contains how many significant figures?',['2','3','4','5'],1,'The significant digits are 4, 5 and the trailing zero: 0.00450 has 3 significant figures.'],['A length is measured as 25.0 cm. In metres it is:',['0.0250 m','0.250 m','2.50 m','25.0 m'],1,'Since 100 cm = 1 m, 25.0 cm = 0.250 m.'],['Which statement best describes precision?',['Closeness of repeated measurements to one another','Closeness to the accepted value only','The size of the instrument','The unit used'],0,'Precision refers to the closeness of repeated measurements to each other. Accuracy refers to closeness to the accepted or true value.'],['Why should a measured result include its unit?',['A number alone may not specify the physical magnitude completely','Units always increase accuracy','Units remove all errors','Units make measurements exact'],0,'A numerical value without a unit can be ambiguous; the unit identifies the physical scale of the measurement.']];let i=0,xp=0,correct=0,selected=-1,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;selected=-1;const a=qs[i];$('count').textContent=`Question ${i+1}/${qs.length}`;$('mastery').textContent=`Skill Mastery ${correct} / ${qs.length}`;$('xp').textContent=xp;$('quiz').innerHTML=`<div class="q">${a[0]}</div>`+a[1].map((o,j)=>`<button type="button" class="opt" data-n="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false});$('feedback').textContent='';$('check').disabled=true;$('next').disabled=true;$('next').textContent=i===qs.length-1?'Finish →':'Next Question →';$('fill').style.width=`${i/qs.length*100}%`}function grade(){if(selected<0)return;answered=true;const a=qs[i],ok=selected===a[2];document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===selected&&!ok)b.classList.add('wrong')});if(ok){correct++;xp+=10;$('feedback').innerHTML='✨ <b>Correct!</b> +10 XP<br><span class="explain">'+a[3]+'</span>'}else{$('feedback').innerHTML='❌ <b>Incorrect.</b> Correct answer: '+a[1][a[2]]+'<br><span class="explain">'+a[3]+'</span>'}$('xp').textContent=xp;$('mastery').textContent=`Skill Mastery ${correct} / ${qs.length}`;$('fill').style.width=`${(i+1)/qs.length*100}%`;$('check').disabled=true;$('next').disabled=false}function advance(){if(i<qs.length-1){i++;render();window.scrollTo({top:0,behavior:'smooth'})}else finish()}function finish(){$('fill').style.width='100%';$('count').textContent='Complete!';$('mastery').textContent=`Skill Mastery ${correct} / ${qs.length}`;$('quiz').innerHTML='';$('feedback').textContent='';$('check').style.display='none';$('next').style.display='none';$('result').style.display='block';$('resultText').textContent=`You answered ${correct} of ${qs.length} correctly and earned ${xp} XP.`}$('check').onclick=grade;$('next').onclick=advance;$('retry').onclick=()=>{i=0;xp=0;correct=0;$('check').style.display='';$('next').style.display='';$('result').style.display='none';render();window.scrollTo({top:0,behavior:'smooth'})};render();</script></body></html>
