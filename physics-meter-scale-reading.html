<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SkillUp Physics | Meter Scale Reading Practice</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.opt.selected{border-color:#5146a5;background:#f4f1ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.opt:disabled{cursor:default}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>📏 Meter Scale Reading Practice</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="action">CHECK</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['A standard metre scale is divided into millimetres. What is its least count?',['1 m','1 cm','1 mm','0.1 mm'],2,'The smallest marked division is 1 mm, so the least count is 1 mm.'],['The length of an object starts at 2.0 cm and ends at 7.6 cm on a metre scale. Its length is:',['5.6 cm','9.6 cm','5.4 cm','7.6 cm'],0,'Length = final reading − initial reading = 7.6 − 2.0 = 5.6 cm.'],['An object starts at 3.2 cm and ends at 8.7 cm. What is its length?',['5.5 cm','11.9 cm','5.7 cm','8.7 cm'],0,'Length = 8.7 − 3.2 = 5.5 cm.'],['If the left end of an object is at 1.5 cm and the right end is at 6.8 cm, the measured length is:',['5.3 cm','8.3 cm','6.8 cm','5.2 cm'],0,'Length = 6.8 − 1.5 = 5.3 cm.'],['A scale reading is 12.4 cm. Express it in metres.',['0.124 m','1.24 m','0.0124 m','12.4 m'],0,'Since 100 cm = 1 m, 12.4 cm = 0.124 m.'],['A length of 0.075 m is equal to:',['0.75 cm','7.5 cm','75 cm','750 cm'],1,'0.075 m × 100 = 7.5 cm.'],['Which position should the eye have while reading a metre scale to reduce parallax?',['Directly above the mark','At the same level as the mark','Far to the side','Below the scale'],1,'The eye should be vertically above the reading mark, with the line of sight normal to the scale, to minimize parallax.'],['If the zero end of a scale is damaged, a length can be measured by:',['Using any two convenient scale readings and subtracting them','Guessing the length','Using only the first mark','Ignoring the scale divisions'],0,'Use two clear reference readings and subtract the initial reading from the final reading.'],['A ruler has a smallest division of 1 mm. Which reading is appropriately reported?',['12.37 cm','12.3 cm','12.37 m','123.789 cm'],1,'With 1 mm = 0.1 cm divisions, a reading such as 12.3 cm is consistent with the scale resolution.'],['A student records 4.2 cm, 4.3 cm and 4.1 cm for repeated measurements. The mean is:',['4.0 cm','4.1 cm','4.2 cm','4.3 cm'],2,'Mean = (4.2 + 4.3 + 4.1)/3 = 4.2 cm.'],['A metre scale is 100 cm long. How many millimetres long is it?',['10 mm','100 mm','1000 mm','10000 mm'],2,'1 m = 100 cm = 1000 mm.'],['Which measurement is most suitable for the thickness of a coin using an ordinary metre scale?',['About 2 mm','About 2 m','About 20 cm','About 200 m'],0,'A coin is only a few millimetres thick; a metre scale can give an approximate value, though finer instruments are preferable for accuracy.'],['The main purpose of keeping the scale straight and aligned with the object is to:',['Reduce measurement error','Increase the object mass','Change the unit','Increase temperature'],0,'Proper alignment reduces geometrical and reading errors.'],['If a measured distance is 25.0 cm, its value in millimetres is:',['2.50 mm','25.0 mm','250 mm','2500 mm'],2,'25.0 cm × 10 = 250 mm.'],['Which instrument is generally more precise than a metre scale for measuring a small diameter?',['Vernier calipers','Wall clock','Thermometer','Spring balance'],0,'Vernier calipers have a smaller least count and are better suited to small diameter measurements.']];let i=0,score=0,answered=false,selected=-1;const $=x=>document.getElementById(x);function render(){answered=false;selected=-1;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q[1].map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('action').classList.remove('hide');$('action').textContent='CHECK'});$('xp').textContent='';$('action').classList.add('hide');$('action').disabled=false;}function check(){if(selected<0)return;if(!answered){answered=true;const q=qs[i],ok=selected===q[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===selected&&!ok)b.classList.add('wrong')});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[3];if(ok)score++;$('score').textContent=`XP ${score}`;$('fill').style.width=`${(i+1)/15*100}%`;$('action').textContent=i===14?'FINISH':'Next Question →';return;}if(i<14){i++;render()}else{$('quiz').innerHTML='';$('action').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('action').onclick=check;render();</script></body></html>
