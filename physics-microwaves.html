<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Microwaves</title><meta name="description" content="SkillUp Physics Microwaves interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">📡</span><h1>Microwaves</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["Microwaves are a part of which region of the electromagnetic spectrum?",["Electromagnetic radiation","Mechanical waves","Sound waves only","Matter waves only"],0,"Microwaves are electromagnetic waves and form a portion of the electromagnetic spectrum."],["Compared with visible light, microwaves generally have:",["Longer wavelengths","Shorter wavelengths","No frequency","No electric field"],0,"Microwaves have longer wavelengths and lower frequencies than visible light."],["Microwaves can travel through:",["Vacuum","Only air","Only water","Only solids"],0,"As electromagnetic waves, microwaves can propagate through vacuum."],["The speed of microwaves in vacuum is approximately:",["3×10⁸ m/s","3×10⁶ m/s","3×10⁴ m/s","3×10¹⁰ m/s"],0,"All electromagnetic waves travel at about 3×10⁸ m/s in vacuum."],["A common source of microwaves in radar equipment is a:",["Magnetron","Thermocouple","Transformer only","Photocell"],0,"A magnetron is a device that can generate high-power microwave radiation."],["Microwave ovens heat food mainly because microwaves cause:",["Polar molecules such as water to rotate and absorb energy","Nuclei to undergo fusion","Atoms to stop moving","Gravity to increase"],0,"The alternating electric field of microwaves makes polar molecules rotate, converting electromagnetic energy into thermal energy."],["The microwave frequency commonly used in domestic microwave ovens is about:",["2.45 GHz","2.45 MHz","245 Hz","245 GHz"],0,"Domestic microwave ovens commonly operate near 2.45 GHz."],["Radar systems use microwaves mainly because they can:",["Be transmitted in narrow beams and reflected from objects","Travel only through solids","Move slower than sound","Have zero energy"],0,"Microwaves can be focused into directional beams and reflected from targets, making them useful for radar."],["For an electromagnetic wave in vacuum, the relation between speed c, frequency f and wavelength λ is:",["c=fλ","c=f/λ","c=λ/f","c=f+λ"],0,"The fundamental wave relation in vacuum is c=fλ."],["If microwave frequency increases while the wave remains in vacuum, its wavelength:",["Decreases","Increases","Remains fixed","Becomes infinite"],0,"Since λ=c/f, wavelength decreases when frequency increases at constant c."],["Microwave communication commonly uses:",["Line-of-sight propagation","Only ocean-floor propagation","Only ground waves at all frequencies","No antennas"],0,"Microwave links are often line-of-sight because high-frequency waves are strongly affected by obstacles and Earth's curvature."],["A satellite communication system uses microwaves mainly because they can:",["Pass through the atmosphere in suitable frequency bands and carry high-bandwidth signals","Travel only through cables","Be heard directly by humans","Have no electric field"],0,"Suitable microwave bands can pass through the atmosphere and support high-capacity communications."],["Which component is used to guide microwaves in many systems?",["Waveguide","Hydraulic pipe","Thermometer","Glass thermometer"],0,"A waveguide is a structure used to guide electromagnetic waves, especially microwaves."],["A microwave has frequency 10 GHz. Its wavelength in vacuum is approximately:",["0.03 m","0.3 m","3 m","30 m"],0,"λ=c/f=3×10⁸/(10×10⁹)=0.03 m, or 3 cm."],["Which statement about microwaves is correct?",["They are non-ionizing electromagnetic radiation in typical microwave applications","They are mechanical waves","They cannot carry information","They always travel slower than sound in vacuum"],0,"Microwaves are electromagnetic radiation and are generally classified as non-ionizing at ordinary microwave energies."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
