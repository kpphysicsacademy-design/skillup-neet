<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Mirror Formula</title><meta name="description" content="SkillUp Physics Mirror Formula interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🪞</span><h1>Mirror Formula</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["The mirror formula for a spherical mirror is:",["1/f = 1/v + 1/u","1/f = 1/v - 1/u","f = u + v","1/f = u + v"],0,"Using the Cartesian sign convention, the mirror formula is 1/f = 1/v + 1/u."] ,["In the mirror formula, u represents the:",["Object distance from the pole","Image distance from the pole","Radius of curvature only","Magnification"],0,"u is the signed distance of the object from the pole of the mirror."] ,["In the mirror formula, v represents the:",["Image distance from the pole","Object height","Focal length only","Radius of aperture"],0,"v is the signed distance of the image from the pole."] ,["In the mirror formula, f represents the:",["Focal length","Object height","Image height","Aperture"],0,"f is the signed focal length of the spherical mirror."] ,["For a concave mirror under the Cartesian sign convention, the focal length is generally:",["Negative","Positive","Zero","Infinite"],0,"The principal focus of a concave mirror lies in front of the mirror, so f is negative under the Cartesian convention."] ,["For a convex mirror under the Cartesian sign convention, the focal length is generally:",["Positive","Negative","Zero","Always infinite"],0,"The virtual focus of a convex mirror lies behind the mirror, so f is positive."] ,["For an object placed in front of a concave mirror, the object distance u is generally:",["Negative","Positive","Zero","Always equal to f"],0,"With the Cartesian convention, distances measured to the left of the pole are negative; a usual object in front has u<0."] ,["For a real image formed in front of a concave mirror, the image distance v is generally:",["Negative","Positive","Zero","Equal to u in every case"],0,"A real image in front of the mirror lies on the negative side of the pole, so v<0."] ,["If u = -30 cm and f = -15 cm for a concave mirror, the image distance v is:",["-30 cm","+30 cm","-15 cm","+15 cm"],0,"1/f=1/v+1/u gives -1/15=1/v-1/30, so 1/v=-1/30 and v=-30 cm."] ,["If u = -30 cm and v = -60 cm, the focal length f is:",["-20 cm","+20 cm","-90 cm","+90 cm"],0,"1/f=1/(-60)+1/(-30)=-1/20, hence f=-20 cm."] ,["The radius of curvature R of a spherical mirror and focal length f are related by:",["R = 2f","R = f/2","R = f^2","R = 1/f"],0,"For a spherical mirror in the paraxial approximation, R=2f, including the sign convention."] ,["If the radius of curvature of a concave mirror is -40 cm, its focal length is:",["-20 cm","+20 cm","-40 cm","+40 cm"],0,"Since f=R/2, f=-40/2=-20 cm."] ,["A concave mirror has f = -10 cm and an object is placed at u = -20 cm. The image is formed at:",["-20 cm","+20 cm","-10 cm","+10 cm"],0,"1/f=1/v+1/u gives -1/10=1/v-1/20, so 1/v=-1/20 and v=-20 cm."] ,["The mirror formula is applicable to:",["Spherical mirrors under the paraxial approximation","Only plane mirrors","Only convex lenses","Only prisms"],0,"The standard spherical-mirror formula is derived for paraxial rays and spherical mirrors."] ,["If an object is at the centre of curvature of a concave mirror, then using the mirror formula the image distance is:",["Equal to the object distance in magnitude and at C","Zero","Equal to the focal length","Infinite for every object"],0,"At C, u=R=2f in magnitude and the image is also formed at C, so |v|=|u|=|R|."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
