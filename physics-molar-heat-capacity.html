}}\\)"],"a":0,"e":"R is approximately 8.314 J mol⁻¹ K⁻¹."},{"q":"If one mole of a monatomic ideal gas is heated by 10 K at constant volume, the heat absorbed is approximately…","o":["\\(124.7\\,\\mathrm{J}\\)","\\(83.1\\,\\mathrm{J}\\)","\\(207.9\\,\\mathrm{J}\\)","\\(41.6\\,\\mathrm{J}\\)"],"a":0,"e":"Q = n CV ΔT = 1 × (3R/2) × 10 ≈ 124.7 J."},{"q":"If one mole of a monatomic ideal gas is heated by 10 K at constant pressure, the heat absorbed is approximately…","o":["\\(207.9\\,\\mathrm{J}\\)","\\(124.7\\,\\mathrm{J}\\)","\\(83.1\\,\\mathrm{J}\\)","\\(41.6\\,\\mathrm{J}\\)"],"a":0,"e":"Q = n CP ΔT = 1 × (5R/2) × 10 ≈ 207.9 J."},{"q":"For an ideal gas, the heat-capacity ratio is defined as…","o":["\\(\\gamma=\\frac{C_P}{C_V}\\)","\\(\\gamma=C_P-C_V\\)","\\(\\gamma=C_PC_V\\)","\\(\\gamma=R/C_P\\)"],"a":0,"e":"Gamma is the ratio CP/CV."},{"q":"Using Mayer's relation, if \\(C_V=\\frac{3}{2}R\\), then \\(C_P\\) is…","o":["\\(\\frac{5}{2}R\\)","\\(\\frac{1}{2}R\\)","\\(\\frac{3}{2}R\\)","\\(\\frac{7}{2}R\\)"],"a":0,"e":"CP = CV + R = 3R/2 + R = 5R/2."},{"q":"If a gas has \\(C_P=29\\) and \\(C_V=21\\) in \\(\\mathrm{J\\,mol^{-1}\\,K^{-1}}\\), the difference is…","o":["\\(8\\,\\mathrm{J\\,mol^{-1}\\,K^{-1}}\\)","\\(50\\,\\mathrm{J\\,mol^{-1}\\,K^{-1}}\\)","\\(0\\)","\\(21\\,\\mathrm{J\\,mol^{-1}\\,K^{-1}}\\)"],"a":0,"e":"The difference is 29 − 21 = 8 J mol⁻¹ K⁻¹, close to R."},{"q":"For a fixed amount of ideal gas, molar heat capacities are defined per…","o":["Mole of gas","Cubic metre of container only","Molecule's diameter","Unit of pressure"],"a":0,"e":"Molar heat capacity normalizes the heat capacity to one mole."},{"q":"Heat capacity and specific heat capacity differ because specific heat capacity is per…","o":["Unit mass","Mole","Container","Kelvin squared"],"a":0,"e":"Specific heat capacity is per unit mass; molar heat capacity is per mole."},{"q":"For a monatomic ideal gas, if \\(C_V=\\frac{3}{2}R\\), then \\(C_P-C_V\\) is…","o":["\\(R\\)","\\(\\frac{3}{2}R\\)","\\
