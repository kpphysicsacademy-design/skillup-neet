{q:'Molar heat capacity is the heat required to raise the temperature of',o:['one mole of a substance by one kelvin','one kilogram by one kelvin','one mole by one degree Celsius only at 0°C','any mass by one kelvin'],a:0,e:'Molar heat capacity is heat required per mole for a temperature rise of one kelvin.'},
