<main>
<section class="hero"><h1>🌡️ Molecular Nature of Matter</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[{"q":"What does the molecular nature of matter state?","o":["Matter is made of tiny particles","Matter has no microscopic structure","Only gases contain particles","All particles are motionless"],"a":0,"e":"Matter consists of microscopic particles such as atoms and molecules."},{"q":"Which observation supports the idea that particles of matter are in continuous motion?","o":["Diffusion","A stationary wall","The shape of a ruler","The colour of glass alone"],"a":0,"e":"Diffusion occurs because particles move and spread from regions of higher concentration."},{"q":"Brownian motion is the irregular motion of…","o":["Tiny suspended particles in a fluid","Planets around the Sun","A solid block fixed to a table","Light in a vacuum"],"a":0,"e":"Brownian motion results from uneven random collisions by rapidly moving fluid molecules."},{"q":"The main cause of Brownian motion is…","o":["Random collisions with surrounding fluid molecules","Gravity alone","Magnetic attraction only","A steady electric current"],"a":0,"e":"Fluid molecules collide unevenly with the suspended particle, causing its irregular motion."},{"q":"Diffusion is generally fastest in which state of matter?","o":["Gases","Liquids","Solids","All states at the same rate"],"a":0,"e":"Gas particles move freely and spread quickly, so diffusion is generally fastest in gases."},{"q":"The smell of perfume spreading through a room is an example of…","o":["Diffusion","Refraction","Reflection","Condensation only"],"a":0,"e":"Perfume molecules spread through the air due to random molecular motion."},{"q":"When the temperature of a substance increases, the average kinetic energy of its particles generally…","o":["Increases","Decreases to zero","Remains exactly unchanged","Becomes negative"],"a":0,"e":"Temperature is related to the average kinetic energy of particles."},{"q":"In a solid, particles are generally…","o":["Closely packed and vibrating about equilibrium positions","Widely separated and freely moving","Completely motionless","Separated by large empty gaps"],"a":0,"e":"Solid particles are closely packed and mainly vibrate about their mean positions."},{"q":"In a liquid, particles generally…","o":["Remain close but can move relative to one another","Are permanently fixed in a rigid lattice","Have no kinetic energy","Are infinitely far apart"],"a":0,"e":"Liquid particles remain close together but can slide and rearrange."},{"q":"Gas particles are typically…","o":["Far apart and moving randomly","Fixed in place","Unable to collide","Arranged in a rigid lattice"],"a":0,"e":"Gas particles are widely spaced and move randomly between collisions."},{"q":"Why can gases be compressed more easily than solids?","o":["Gas particles have much more space between them","Gas particles have no mass","Solid particles do not move at all","Gas particles are larger than containers"],"a":0,"e":"Much of a gas's volume is empty space between particles, allowing compression."},{"q":"Why do solids generally retain their shape?","o":["Particles are strongly bound near fixed equilibrium positions","Particles move freely throughout the container","There are no forces between particles","Solid particles are infinitely far apart"],"a":0,"e":"Strong interactions keep solid particles near fixed positions."},{"q":"Which statement about particles in matter is correct?","o":["Particles are in motion, with motion and spacing depending on state","Only gas particles move","Particles in solids have exactly zero kinetic energy","All particles are separated by equal distances"],"a":0,"e":"Particles have motion in all states, though their arrangement and mobility differ."},{"q":"One mole of a substance contains approximately…","o":["6.022 × 10²³ entities","6.022 × 10²⁰ entities","3.00 × 10⁸ entities","9.81 × 10² entities"],"a":0,"e":"One mole contains Avogadro's number of specified entities."},{"q":"The SI base unit for amount of substance is the…","o":["Mole","Gram","Litre","Kelvin"],"a":0,"e":"The mole (mol) is the SI base unit for amount of substance."},{"q":"Avogadro's constant is approximately…","o":["6.022 × 10²³ mol⁻¹","9.81 mol⁻¹","3.00 × 10⁸ mol⁻¹","1.60 × 10⁻¹⁹ mol⁻¹"],"a":0,"e":"Avogadro's constant is approximately 6.022 × 10²³ per mole."},{"q":"The mass of one mole of a substance is called its…","o":["Molar mass","Density","Volume expansion","Pressure"],"a":0,"e":"Molar mass is the mass per mole, commonly expressed in g/mol or kg/mol."},{"q":"If one mole of a substance has molar mass 18 g/mol, the mass of two moles is…","o":["36 g","18 g","9 g","2 g"],"a":0,"e":"Mass equals amount in moles multiplied by molar mass: 2 × 18 g = 36 g."},{"q":"At the same temperature, ideal-gas particles have the same average translational kinetic energy when…","o":["They are compared per molecule","They have the same mass only","They have the same speed in every collision","They are in different states only"],"a":0,"e":"For ideal gases, average translational kinetic energy per molecule depends on absolute temperature, not molecular mass."},{"q":"Why do lighter gas molecules generally move faster than heavier ones at the same temperature?","o":["Their average kinetic energies are equal, so lower mass means greater characteristic speed","They always have greater average kinetic energy","They never collide","Their temperature is higher"],"a":0,"e":"At a fixed temperature, the same mean kinetic energy corresponds to greater speed for lower mass."},{"q":"Which statement best describes temperature at the microscopic level for an ideal gas?","o":["It is proportional to average translational kinetic energy per molecule","It measures the total mass of the gas","It is the same as pressure","It is the number of molecules in a container"],"a":0,"e":"For an ideal gas, mean translational kinetic energy per molecule is 3kT/2."},{"q":"What happens to diffusion when temperature rises, under otherwise similar conditions?","o":["It generally becomes faster","It stops completely","It always becomes slower","It changes into reflection"],"a":0,"e":"Higher temperature increases typical particle speeds and generally speeds up diffusion."},{"q":"Why does a drop of ink gradually spread in still water?","o":["Particles undergo random motion and diffuse","Water molecules become motionless","Gravity acts only sideways","The ink is converted into light"],"a":0,"e":"Random molecular motion leads to the spreading of ink particles through water."},{"q":"Which statement about intermolecular forces is most accurate?","o":["Their effects differ among substances and states of matter","They are absent in every substance","They are identical in strength for all materials","They act only on objects in space"],"a":0,"e":"Intermolecular interactions help determine whether matter behaves as a solid, liquid or gas."},{"q":"In a simple ideal-gas model, intermolecular forces are treated as…","o":["Negligible between collisions","Infinitely strong at all distances","The only source of molecular motion","Equal to the gas pressure"],"a":0,"e":"The ideal-gas model neglects intermolecular forces except during collisions."},{"q":"Why does a liquid take the shape of its container but keep a nearly fixed volume?","o":["Particles can rearrange while remaining close together","Particles are fixed in a rigid lattice","Particles are extremely far apart","The liquid has no intermolecular interactions"],"a":0,"e":"Liquid particles can move past one another but remain close due to intermolecular attraction."},{"q":"Why can a gas fill its entire container?","o":["Its particles move freely and randomly through the available space","Its particles are fixed at the bottom","It has a fixed shape","Its particles cannot collide"],"a":0,"e":"Gas particles spread through the container because they move freely and randomly."},{"q":"Which observation is evidence for molecular motion even without stirring?","o":["A drop of dye spreading through water","A book remaining on a table","A metal rod keeping its shape","A sealed empty container"],"a":0,"e":"Dye spreading through water is a visible example of diffusion caused by molecular motion."},{"q":"If the amount of substance is doubled while molar mass remains the same, total mass…","o":["Doubles","Halves","Becomes zero","Stays unchanged"],"a":0,"e":"Total mass equals number of moles multiplied by molar mass."},{"q":"Which statement is true about matter at ordinary temperatures?","o":["Its microscopic particles possess thermal motion","All particles are always at rest","Only liquids have particles","Temperature has no relation to particle motion"],"a":0,"e":"Thermal motion exists in solids, liquids and gases, though the nature of motion differs."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Molecular Nature of Matter Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
