<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Molecular Nature of Matter</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;line-height:1.45}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.opt:disabled{cursor:default}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{font-weight:700;color:#e08a00;text-align:center;min-height:24px;line-height:1.5}.explanation{margin-top:14px;padding:12px 14px;border-radius:12px;background:#f1f6ff;font-size:14px;line-height:1.5}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>⚛️ Molecular Nature of Matter</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['Matter is composed of:','Continuous material with no particles','Particles such as atoms and molecules','Only electromagnetic waves','Energy only',1,'Matter has a particulate nature and is made of atoms, molecules or other microscopic particles.'],
['Which observation gives evidence for the particle nature of matter?','Diffusion','Reflection only','Formation of shadows only','Rectilinear propagation only',0,'Diffusion occurs because particles move and spread from regions of higher concentration to lower concentration.'],
['Brownian motion is:','The periodic motion of a pendulum','The random motion of microscopic particles suspended in a fluid','The motion of planets','The vibration of a rigid body only',1,'Brownian motion is the irregular motion of small suspended particles caused by collisions with rapidly moving fluid molecules.'],
['The main cause of Brownian motion is:','Gravity alone','Unequal random collisions by surrounding molecules','Magnetic attraction','Electric current',1,'Continuous random molecular collisions produce the observed irregular motion of suspended particles.'],
['Diffusion is fastest generally in:','Solids','Liquids','Gases','Vacuum',2,'Gas molecules move freely and rapidly, so diffusion is generally fastest in gases.'],
['The smell of perfume spreading through a room is an example of:','Diffusion','Refraction','Conduction only','Reflection',0,'Perfume molecules spread through air due to random molecular motion, producing diffusion.'],
['When temperature increases, the average kinetic energy of particles generally:','Decreases','Increases','Becomes zero','Remains exactly unchanged',1,'For a substance in thermal equilibrium, higher temperature corresponds to greater average translational kinetic energy of its particles.'],
['In a solid, particles are generally:','Widely separated and freely moving','Closely packed and vibrating about mean positions','Completely stationary','Separated by vacuum',1,'Particles in a solid are closely packed and mainly vibrate about fixed equilibrium positions.'],
['In a liquid, particles:','Are fixed permanently in a lattice','Can move relative to one another while remaining fairly close','Have no kinetic energy','Are infinitely far apart',1,'Liquid particles remain close together but can move and rearrange relative to one another.'],
['In an ideal gas, intermolecular forces are assumed to be:','Very large at all separations','Negligible except during collisions','Always repulsive and infinite','The same as gravitational force',1,'The ideal-gas model neglects intermolecular forces except during collisions.'],
['The SI unit of amount of substance is:','Gram','Mole','Kilogram','Litre',1,'The mole (mol) is the SI base unit for amount of substance.'],

['Avogadro constant is approximately:','6.022 × 10^23 mol^-1','9.8 mol^-1','3.0 × 10^8 mol^-1','1.6 × 10^-19 mol^-1',0,'Avogadro constant N_A is approximately 6.022 × 10^23 mol^-1.'],

];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;$('xp').textContent='';const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide')}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').innerHTML=ok?'✨ Correct! +1 XP':'❌ Incorrect';$('xp').insertAdjacentHTML('beforeend',`<div class="explanation"><b>Correct answer:</b> ${q[q[5]+1]}<br>💡 ${q[6]}</div>`);if(ok)score++;$('score').textContent=`XP ${score}`;$('fill').style.width=`${(i+1)/15*100}%`;$('next').classList.remove('hide')}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><p style="text-align:center">XP earned: <b>${score}</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('next').onclick=next;render();</script></body></html>
