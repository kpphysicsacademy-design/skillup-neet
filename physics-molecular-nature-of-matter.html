<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Molecular Nature of Matter</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7fb;color:#172033;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 18px 42px}.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 7px 24px #17203312}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.head h1{font-size:1.6rem;margin:0}.xp{font-weight:850;white-space:nowrap}.sub{color:#657080}.bar{height:10px;background:#e8ebef;border-radius:99px;overflow:hidden;margin:18px 0}.fill{height:100%;width:0;background:#58cc02;transition:.3s}.num{font-weight:800;color:#68717d}.q{font-size:1.2rem;font-weight:800;line-height:1.45;margin:14px 0}.opts{display:grid;gap:10px}.opt{padding:14px;border:2px solid #dfe3e8;border-radius:14px;background:#fff;text-align:left;font:inherit;cursor:pointer}.opt:hover{border-color:#58a6ff;background:#f6fbff}.opt.correct{border-color:#58cc02;background:#efffe8}.opt.wrong{border-color:#e5484d;background:#fff0f0}.btn{width:100%;margin-top:16px;padding:13px;border:0;border-radius:13px;background:#58cc02;color:#fff;font-weight:850;font-size:1rem;cursor:pointer}.feedback{margin-top:14px;padding:12px;border-radius:12px;line-height:1.5}.good{background:#e8f9df;color:#246b16}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:18px;padding:10px 14px;border:2px solid #dfe3e8;border-radius:13px;color:#344054;text-decoration:none;font-weight:800}.result{text-align:center;font-size:1.15rem;font-weight:850;line-height:1.7;padding:16px}@media(max-width:600px){.wrap{padding:18px 12px}.head{align-items:flex-start}.head h1{font-size:1.35rem}.q{font-size:1.08rem}}</style></head><body><main class="wrap"><section class="card"><div class="head"><h1>⚛️ Molecular Nature of Matter</h1><div class="xp">⚡ <span id="xp">0</span> XP</div></div><p class="sub">Master molecular nature of matter with 15 NEET-style questions.</p><div class="num" id="num">Question 1 of 15</div><div class="bar"><div id="fill" class="fill"></div></div><div id="quiz"></div><div id="fb" class="feedback"></div><button id="next" class="btn">Continue →</button><a class="back" href="physics-home.html">← Back to Physics Path</a></section></main><script>const qs=[['Matter is composed of:',['continuous material with no particles','particles such as atoms and molecules','only electromagnetic waves','energy only'],1,'Matter has a particulate nature.'],['Brownian motion is:',['periodic motion of a pendulum','random motion of microscopic suspended particles','motion of planets','vibration of a rigid body only'],1,'Brownian motion results from random molecular collisions.'],['The main cause of Brownian motion is:',['gravity alone','random collisions by surrounding molecules','magnetic attraction','electric current'],1,'Unequal random collisions cause the irregular motion.'],['Diffusion is generally fastest in:',['solids','liquids','gases','vacuum'],2,'Gas particles move freely and rapidly.'],['Perfume spreading through a room is an example of:',['diffusion','refraction','conduction','reflection'],0,'Perfume molecules spread through air by diffusion.'],['When temperature increases, average kinetic energy of particles generally:',['decreases','increases','becomes zero','remains unchanged'],1,'Higher temperature corresponds to greater average translational kinetic energy.'],['In a solid, particles are generally:',['widely separated and freely moving','closely packed and vibrating about mean positions','completely stationary','separated by vacuum'],1,'Solid particles vibrate about equilibrium positions.'],['In a liquid, particles:',['are fixed in a lattice','can move relative to one another while remaining fairly close','have no kinetic energy','are infinitely far apart'],1,'Liquid particles can rearrange while remaining close.'],['In an ideal gas, intermolecular forces are assumed to be:',['very large','negligible except during collisions','always infinite','equal to gravity'],1,'The ideal-gas model neglects intermolecular forces except during collisions.'],['The SI unit of amount of substance is:',['gram','mole','kilogram','litre'],1,'The mole is the SI base unit of amount of substance.'],['One mole contains approximately:',['6.022 × 10^23 entities','6.022 × 10^20 entities','9.81 × 10^23 entities','3.00 × 10^8 entities'],0,'One mole contains approximately 6.022 × 10^23 specified entities.'],['Avogadro constant is approximately:',['6.022 × 10^23 mol^-1','9.8 mol^-1','3.0 × 10^8 mol^-1','1.6 × 10^-19 mol^-1'],0,'N_A is approximately 6.022 × 10^23 mol^-1.'],['At the same temperature, ideal-gas particles have:',['different average translational kinetic energies based on mass','the same average translational kinetic energy','zero kinetic energy','kinetic energy determined only by pressure'],1,'Average translational kinetic energy depends on temperature.'],['Which state has the greatest average intermolecular separation under ordinary conditions?',['solid','liquid','gas','all are equal'],2,'Gas particles are comparatively far apart.'],['Which statement best describes molecular matter?',['particles are always motionless','matter consists of microscopic particles in continuous motion','matter has no microscopic structure','only gases contain particles'],1,'The particle model explains matter through microscopic particles, motion and interactions.']];let i=0,score=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;const a=qs[i];$('num').textContent='Question '+(i+1)+' of 15';$('xp').textContent=score*10;$('fill').style.width=(i/15*100)+'%';$('fb').className='feedback';$('fb').textContent='Choose an answer.';$('quiz').innerHTML='<div class="q">'+a[0]+'</div><div class="opts">'+a[1].map((x,n)=>'<button class="opt" data-n="'+n+'">'+String.fromCharCode(65+n)+'. '+x+'</button>').join('')+'</div>';document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').textContent=i===14?'Finish Skill →':'Continue →';$('next').onclick=next}function answer(n){if(answered)return;answered=true;const a=qs[i],ok=n===a[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===a[2])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong')});if(ok){score++;$('fb').className='feedback good';$('fb').innerHTML='🎯 Correct! +10 XP<br>'+a[3]}else{$('fb').className='feedback bad';$('fb').innerHTML='❌ Incorrect.<br><b>Correct answer:</b> '+a[1][a[2]]+'<br>'+a[3]}$('xp').textContent=score*10;$('fill').style.width=((i+1)/15*100)+'%'}function next(){if(!answered){$('fb').className='feedback bad';$('fb').textContent='Choose an answer first 👆';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$('num').textContent='Complete!';$('fill').style.width='100%';$('quiz').innerHTML='<div class="result">🏆 Molecular Nature of Matter Complete!<br>Score: '+score+'/15<br>⚡ XP earned: '+score*10+'</div>';$('next').textContent='Retry';$('next').onclick=()=>{i=0;score=0;render()}}}render();</script></body></html>
