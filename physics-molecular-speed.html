<style>

.hero,.quiz,.finish{background:#fff;border:2px solid #e2edf7;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 #dce8f3}

.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}

.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}

.nav{display:flex;align-items:center;gap:10px;min-height:72px;padding:10px 14px}
.back{flex:0 0 42px;width:42px;height:42px}

.xp{margin-left:0;padding:9px 11px;font-size:13px}
.streak{padding:9px 11px;font-size:12px}
@media(max-width:480px){
  .nav{gap:7px;padding:9px 10px;min-height:68px}
  .back{flex-basis:40px;width:40px;height:40px}
  .brand{font-size:17px}
  .brand small{font-size:8px;letter-spacing:.55px}
  .xp{padding:8px 9px;font-size:12px}
  .streak{padding:8px 9px;font-size:11px;max-width:none}
}
@media(max-width:360px){
  .nav{gap:5px;padding-inline:7px}
  .back{flex-basis:36px;width:36px;height:36px}

  .brand small{font-size:7px;letter-spacing:.3px}
  .xp{padding:7px;font-size:11px}
  .streak{padding:7px;font-size:10px}
}

<script>
(function(){
'use strict';
const questions = [{"q":"What does the root-mean-square (RMS) speed of gas molecules represent?","o":["Square root of the mean of squared molecular speeds","Arithmetic mean of all speeds","The slowest molecular speed","The speed of the container"],"a":0,"e":"RMS speed is \\(c_{rms}=\\sqrt{\\overline{c^2}}\\)."},{"q":"Which expression gives the RMS speed of an ideal gas?","o":["\\(\\sqrt{3RT/M}\\)","\\(\\sqrt{RT/3M}\\)","\\(3RT/M\\)","\\(\\sqrt{2RT/M}\\)"],"a":0,"e":"For molar mass M in kg mol⁻¹, \\(c_{rms}=\\sqrt{3RT/M}\\)."},{"q":"What is the most probable speed for Maxwell-distributed gas molecules?","o":["\\(\\sqrt{2RT/M}\\)","\\(\\sqrt{3RT/M}\\)","\\(\\sqrt{8RT/\\pi M}\\)","\\(RT/M\\)"],"a":0,"e":"The most probable speed is \\(c_{mp}=\\sqrt{2RT/M}\\)."},{"q":"What is the average speed of molecules in an ideal gas?","o":["\\(\\sqrt{8RT/\\pi M}\\)","\\(\\sqrt{2RT/M}\\)","\\(\\sqrt{3RT/M}\\)","\\(RT/M\\)"],"a":0,"e":"The Maxwell distribution gives \\(c_{avg}=\\sqrt{8RT/(\\pi M)}\\)."},{"q":"Which ordering is correct for an ideal gas at a given temperature?","o":["\\(c_{mp}<c_{avg}<c_{rms}\\)","\\(c_{rms}<c_{avg}<c_{mp}\\)","\\(c_{avg}<c_{mp}<c_{rms}\\)","All three are always equal"],"a":0,"e":"The speeds satisfy \\(c_{mp}<c_{avg}<c_{rms}\\)."},{"q":"At fixed temperature, how does RMS speed depend on molar mass?","o":["\\(c_{rms}\\propto1/\\sqrt M\\)","\\(c_{rms}\\propto M\\)","\\(c_{rms}\\propto M^2\\)","It is independent of M"],"a":0,"e":"Since \\(c_{rms}=\\sqrt{3RT/M}\\), heavier molecules move more slowly at the same temperature."},{"q":"At fixed molar mass, if absolute temperature becomes four times larger, RMS speed becomes…","o":["Twice as large","Four times as large","Half as large","Unchanged"],"a":0,"e":"RMS speed is proportional to \\(\\sqrt T\\), so quadrupling T doubles the speed."},{"q":"Which temperature scale must be used in molecular-speed formulas?","o":["Kelvin","Celsius","Fahrenheit","Any scale gives the same numerical answer"],"a":0,"e":"The formulas use absolute temperature in kelvin."},{"q":"In \\(c_{rms}=\\sqrt{3RT/M}\\), what does R represent?","o":["Universal gas constant","Gas density","Molecular radius","Boltzmann speed"],"a":0,"e":"R is the universal gas constant, approximately \\(8.314\\,\\mathrm{J\\,mol^{-1}\\,K^{-1}}\\)."},{"q":"In the molar-speed formulas, M should be expressed in…","o":["\\(\\mathrm{kg\\,mol^{-1}}\\)","\\(\\mathrm{g\\,mol^{-1}}\\) without conversion","\\(\\mathrm{mol\\,kg^{-1}}\\)","\\(\\mathrm{kg\\,m^{-3}}\\)"],"a":0,"e":"Use SI units, so molar mass is in kilograms per mole."},{"q":"If two gases are at the same temperature, which has the greater RMS speed?","o":["The gas with smaller molar mass","The gas with larger molar mass","Both always have the same RMS speed","The gas with higher density always"],"a":0,"e":"RMS speed varies inversely with the square root of molar mass."},{"q":"At the same temperature, hydrogen molecules move faster on an RMS basis than oxygen molecules because hydrogen has…","o":["Lower molar mass","Higher molar mass","Higher molecular count only","No kinetic energy"],"a":0,"e":"The lighter gas has a higher RMS speed at the same temperature."},{"q":"What is the approximate RMS speed formula using Boltzmann constant and molecular mass m?","o":["\\(\\sqrt{3k_BT/m}\\)","\\(\\sqrt{k_BT/3m}\\)","\\(3k_BT/m\\)","\\(\\sqrt{2k_BT/m}\\)"],"a":0,"e":"For a single molecule of mass m, \\(c_{rms}=\\sqrt{3k_BT/m}\\)."},{"q":"The mean translational kinetic energy per molecule is related to RMS speed by…","o":["\\(\\frac12m c_{rms}^2=\\frac32k_BT\\)","\\(m c_{rms}=k_BT\\)","\\(m c_{rms}^2=k_BT/2\\)","\\(\\frac12m c_{rms}^2=3k_BT\\)"],"a":0,"e":"Equipartition gives average translational kinetic energy \\(\\frac32 k_BT\\)."},{"q":"If the RMS speed of a gas is 300 m/s, what is the RMS speed at four times the absolute temperature?","o":["600 m/s","1200 m/s","150 m/s","300 m/s"],"a":0,"e":"Speed scales as the square root of temperature: \\(300\\sqrt4=600\\,\\mathrm{m/s}\\)."},{"q":"If molar mass increases by a factor of four at fixed temperature, RMS speed becomes…","o":["Half","Double","One-fourth","Four times"],"a":0,"e":"Since speed is proportional to \\(1/\\sqrt M\\), four times the molar mass halves the speed."},{"q":"Which speed is the peak location of the Maxwell speed distribution?","o":["Most probable speed","Average speed","RMS speed","Speed of sound"],"a":0,"e":"The most probable speed corresponds to the maximum of the Maxwell speed-distribution curve."},{"q":"Which speed is always at least as large as the average speed for a Maxwell gas?","o":["RMS speed","Most probable speed","Speed of sound","Drift speed"],"a":0,"e":"For a Maxwell distribution, RMS speed is greater than the average speed."},{"q":"For a gas at 300 K with molar mass 0.028 kg/mol, which expression calculates RMS speed?","o":["\\(\\sqrt{3(8.314)(300)/0.028}\\)","\\(\\sqrt{2(8.314)(300)/0.028}\\)","\\(8.314(300)/0.028\\)","\\(\\sqrt{0.028/(3(8.314)(300))}\\)"],"a":0,"e":"Substitute T = 300 K and M = 0.028 kg mol⁻¹ into \\(\\sqrt{3RT/M}\\)."},{"q":"If absolute temperature rises from 300 K to 1200 K, the RMS speed ratio is…","o":["2","4","1/2","1/4"],"a":0,"e":"The ratio is \\(\\sqrt{1200/300}=2\\)."},{"q":"What is the approximate relationship between average speed and RMS speed?","o":["\\(c_{avg}=\\sqrt{8/(3\\pi)}\\,c_{rms}\\)","\\(c_{avg}=\\sqrt{3\\pi/8}\\,c_{rms}\\)","\\(c_{avg}=3c_{rms}\\)","\\(c_{avg}=c_{rms}^2\\)"],"a":0,"e":"Dividing the average-speed formula by the RMS formula gives \\(c_{avg}/c_{rms}=\\sqrt{8/(3\\pi)}\\)."},{"q":"Which quantity is proportional to the square of RMS speed?","o":["Absolute temperature for a fixed gas","Molar mass at fixed temperature","Inverse temperature","Gas volume in all conditions"],"a":0,"e":"From \\(c_{rms}^2=3RT/M\\), the square of RMS speed is proportional to T for fixed M."},{"q":"What happens to RMS speed if absolute temperature is reduced to one-quarter?","o":["It becomes half","It becomes one-quarter","It doubles","It stays the same"],"a":0,"e":"Because speed is proportional to \\(\\sqrt T\\), quartering T halves the speed."},{"q":"A gas's RMS speed is 500 m/s. If its molar mass stays constant and temperature increases by 20%, the new RMS speed is approximately…","o":["\\(500\\sqrt{1.2}\\approx548\\,\\mathrm{m/s}\\)","600 m/s","400 m/s","\\(500(1.2)^2\\,\\mathrm{m/s}\\)"],"a":0,"e":"The speed is multiplied by \\(\\sqrt{1.2}\\), giving approximately 548 m/s."},{"q":"Which statement about molecular speeds is correct?","o":["Molecules in a gas have a distribution of speeds","Every molecule has exactly the same speed","All molecules are stationary at equilibrium","RMS speed is always the smallest speed"],"a":0,"e":"At thermal equilibrium, molecular speeds follow a distribution rather than a single common value."},{"q":"Why do molecular speeds increase with temperature?","o":["The average translational kinetic energy increases","Molecular mass automatically decreases","The gas constant changes","Collisions stop occurring"],"a":0,"e":"Average translational kinetic energy per molecule is proportional to absolute temperature."},{"q":"If two gases have equal RMS speeds at the same temperature, their molar masses are…","o":["Equal","Inversely proportional to temperature","Always different","Not related at all"],"a":0,"e":"At the same T, \\(c_{rms}^2=3RT/M\\); equal RMS speeds imply equal molar masses."},{"q":"For a Maxwell gas, the most probable speed is approximately what fraction of RMS speed?","o":["\\(\\sqrt{2/3}\\)","\\(\\sqrt{3/2}\\)","\\(\\sqrt{8/\\pi}\\)","\\(3/2\\)"],"a":0,"e":"The ratio \\(c_{mp}/c_{rms}=\\sqrt{2/3}\\)."},{"q":"Which statement best distinguishes average speed from RMS speed?","o":["Average speed is the arithmetic mean of speeds; RMS speed uses the mean of squared speeds","They are always identical","Average speed is always zero","RMS speed is measured in kelvin"],"a":0,"e":"Average speed is \\(\\overline c\\), while RMS speed is \\(\\sqrt{\\overline{c^2}}\\)."},{"q":"For the same ideal gas, how does RMS speed change when temperature changes from T to 9T?","o":["It becomes three times as large","It becomes nine times as large","It becomes one-third","It remains unchanged"],"a":0,"e":"Since \\(c_{rms}\\propto\\sqrt T\\), increasing temperature to 9T triples the RMS speed."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
 if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options')]).catch(function(){});}
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Molecular Speed Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise([card]).catch(function(){});}
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
 window.addEventListener('load',function(){if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise().catch(function(){});}});
})();
</script>
