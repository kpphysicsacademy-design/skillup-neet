<style>

:root{--green:#58cc02;--green-dark:#46a302;--blue:#1cb0f6;--ink:#243447;--muted:#64748b;--line:#dce6ef;--bg:#f3f9ff;--red:#ff4b4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.nav{max-width:720px;margin:auto;min-height:58px;padding:9px 14px;display:flex;align-items:center;gap:10px}

.hero,.quiz,.finish{background:#fff;border:2px solid #e2edf7;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 #dce8f3}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#174a78}.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}
.progress-row{display:flex;justify-content:space-between;gap:10px;margin:16px 0 7px;font-size:12px;font-weight:900;color:var(--muted)}
.track{height:11px;border-radius:99px;background:#e2edf7;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}
.qmeta{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.4px}
.question{font-size:clamp(20px,4.5vw,26px);line-height:1.35;margin:12px 0 18px;font-weight:850}
.options{display:grid;gap:10px}.option{display:flex;gap:11px;align-items:center;width:100%;min-height:51px;padding:12px;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}
.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Mobile header refinement: keep branding, XP and streak on one balanced row */
.nav{display:flex;align-items:center;gap:10px;min-height:72px;padding:10px 14px}
.back{flex:0 0 42px;width:42px;height:42px}
.brand{flex:1 1 auto;min-width:0;line-height:1.1;white-space:nowrap;font-size:clamp(16px,4.5vw,20px)}
.brand small{margin-top:4px;font-size:9px;line-height:1.25;letter-spacing:.7px;white-space:normal}
.xp,.streak{display:flex;align-items:center;justify-content:center;gap:4px;flex:0 0 auto;white-space:nowrap;line-height:1.15}
.xp{margin-left:0;padding:9px 11px;font-size:13px}
.streak{padding:9px 11px;font-size:12px}
@media(max-width:480px){
  .nav{gap:7px;padding:9px 10px;min-height:68px}
  .back{flex-basis:40px;width:40px;height:40px}
  .brand{font-size:17px}
  .brand small{font-size:8px;letter-spacing:.55px}
  .xp{padding:8px 9px;font-size:12px}
  .streak{padding:8px 9px;font-size:11px;max-width:none}
}
@media(max-width:360px){
  .nav{gap:5px;padding-inline:7px}
  .back{flex-basis:36px;width:36px;height:36px}
  .brand{font-size:15px}
  .brand small{font-size:7px;letter-spacing:.3px}
  .xp{padding:7px;font-size:11px}
  .streak{padding:7px;font-size:10px}
}

<section class="hero"><h1>🌡️ Molecular Speed</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>

<script>
(function(){
'use strict';
const questions=[{"q":"What does the average speed of gas molecules describe?","o":["The average of their speed magnitudes","The average direction of motion","The speed of the container","The pressure measured in metres"],"a":0,"e":"Speed is a scalar magnitude; molecular directions vary randomly."},{"q":"What is the root-mean-square (rms) speed?","o":["The square root of the mean of squared molecular speeds","The mean speed multiplied by mass","The smallest molecular speed","The average velocity vector"],"a":0,"e":"Rms speed is vrms = √⟨v²⟩."},{"q":"For an ideal gas, rms speed is given by…","o":["√(3RT/M)","3RT/M","√(RT/3M)","√(M/3RT)"],"a":0,"e":"Here R is the gas constant, T is absolute temperature and M is molar mass in kg mol⁻¹."},{"q":"In the rms speed formula, temperature should be in…","o":["Kelvin","Celsius only","Fahrenheit","Any scale"],"a":0,"e":"The kinetic theory relation uses absolute temperature."},{"q":"At the same temperature, which gas has a greater rms speed?","o":["The gas with smaller molar mass","The gas with larger molar mass","Both always have zero speed","The denser gas in every case"],"a":0,"e":"Rms speed is inversely proportional to the square root of molar mass."},{"q":"If the absolute temperature becomes four times as large, rms speed becomes…","o":["Twice as large","Four times as large","Half as large","Unchanged"],"a":0,"e":"Since vrms ∝ √T, a fourfold temperature increase doubles the speed."},{"q":"If absolute temperature is reduced to one-quarter, rms speed becomes…","o":["Half","One-quarter","Double","Four times"],"a":0,"e":"The rms speed scales as the square root of absolute temperature."},{"q":"At the same temperature, the ratio of rms speeds of gases A and B is…","o":["√(MB/MA)","MA/MB","MB/MA","√(MA/MB)"],"a":0,"e":"Using vrms ∝ 1/√M gives vA/vB = √(MB/MA)."},{"q":"The rms speed of oxygen is compared with hydrogen at the same temperature. Hydrogen molecules move rms…","o":["Four times faster","Twice as fast","Half as fast","Sixteen times faster"],"a":0,"e":"M(H₂) is about 2 and M(O₂) about 32 g mol⁻¹, so the ratio is √(32/2) = 4."},{"q":"For an ideal gas, average translational kinetic energy per molecule equals…","o":["(3/2)kT","kT/2","3RT/2","RT"],"a":0,"e":"The mean translational kinetic energy per molecule is 3kT/2."},{"q":"Does every molecule in a gas have the same speed at a fixed temperature?","o":["No, molecular speeds are distributed","Yes, all speeds are identical","Only the heaviest molecule moves","All molecules remain at rest"],"a":0,"e":"Molecules have a distribution of speeds because of random motion and collisions."},{"q":"Which speed is generally greatest for a Maxwell speed distribution?","o":["Most probable speed","Mean speed","Rms speed","All three are always equal"],"a":0,"e":"For a Maxwell distribution, most probable speed < mean speed < rms speed."},{"q":"The most probable speed of an ideal gas is…","o":["√(2RT/M)","√(3RT/M)","√(8RT/πM)","RT/M"],"a":0,"e":"The most probable speed is vp = √(2RT/M)."},{"q":"The mean speed of an ideal gas is…","o":["√(8RT/πM)","√(2RT/M)","√(3RT/M)","8RT/πM"],"a":0,"e":"The Maxwell distribution gives mean speed v̄ = √(8RT/πM)."},{"q":"Which order is correct for a Maxwell distribution?","o":["Most probable < mean < rms speed","Rms < mean < most probable speed","Mean < rms < most probable speed","All speeds are equal"],"a":0,"e":"The three characteristic speeds follow vp < v̄ < vrms."},{"q":"If molar mass is doubled at the same temperature, rms speed changes by a factor of…","o":["1/√2","2","√2","1/2"],"a":0,"e":"Because vrms ∝ 1/√M, doubling M gives vrms/√2."},{"q":"If temperature and molar mass both become four times their original values, rms speed…","o":["Stays the same","Doubles","Halves","Becomes four times"],"a":0,"e":"The ratio T/M is unchanged, so √(T/M) and rms speed stay unchanged."},{"q":"What is the approximate rms speed of a gas with M = 0.004 kg mol⁻¹ at T = 300 K? Use R = 8.31 J mol⁻¹ K⁻¹.","o":["≈ 1,367 m/s","≈ 790 m/s","≈ 79 m/s","≈ 7,900 m/s"],"a":0,"e":"vrms = √(3RT/M) = √(3×8.31×300/0.004) ≈ 1,367 m/s."},{"q":"A gas's rms speed is 500 m/s at 300 K. At 1,200 K, its rms speed is…","o":["1,000 m/s","250 m/s","500 m/s","2,000 m/s"],"a":0,"e":"Temperature increases fourfold, so rms speed doubles to 1,000 m/s."},{"q":"Why is rms speed useful in kinetic theory?","o":["It relates the mean square molecular speed to temperature and pressure","It gives every molecule's exact speed","It measures molecular diameter","It is always the slowest speed"],"a":0,"e":"Rms speed appears directly in the kinetic-theory pressure relation and energy formulas."},{"q":"The kinetic-theory pressure relation is…","o":["P = ⅓ρvrms²","P = 3ρvrms","P = ρ/vrms²","P = ρvrms/3"],"a":0,"e":"Pressure equals one-third of gas density times mean square speed."},{"q":"At the same temperature, the average translational kinetic energy of a helium molecule and a nitrogen molecule is…","o":["Equal","Greater for nitrogen in proportion to mass","Greater for helium in proportion to speed","Zero for both"],"a":0,"e":"Average translational kinetic energy per molecule depends on temperature, not molecular mass."},{"q":"At the same temperature, why does a lighter gas have greater rms speed?","o":["It needs greater speed to have the same mean kinetic energy","It has greater mean kinetic energy","It has no collisions","Its temperature is higher"],"a":0,"e":"Since mean kinetic energy is the same at a given T, lower mass corresponds to higher characteristic speed."},{"q":"Which quantity is a vector: molecular speed or molecular velocity?","o":["Velocity","Speed","Both are scalars","Neither has a direction"],"a":0,"e":"Velocity includes direction; speed is the magnitude of velocity."},{"q":"If the rms speed is 600 m/s, the mean square speed is…","o":["360,000 m²/s²","1,200 m²/s²","300 m²/s²","600 m²/s²"],"a":0,"e":"⟨v²⟩ = vrms² = 600² = 360,000 m²/s²."},{"q":"If vrms = √(3RT/M), increasing molar mass by a factor of nine at fixed T makes vrms…","o":["One-third as large","Three times as large","One-ninth as large","Nine times as large"],"a":0,"e":"Rms speed scales as 1/√M; √9 = 3."},{"q":"Which statement about molecular speed and temperature is correct for a fixed ideal gas?","o":["Characteristic molecular speeds increase with absolute temperature's square root","Speed is directly proportional to Celsius temperature","Speed is independent of temperature","All molecules acquire the same speed when heated"],"a":0,"e":"Characteristic speeds scale as √T for a fixed gas."},{"q":"What is the SI unit of rms speed?","o":["m/s","m/s²","kg/m³","J/K"],"a":0,"e":"Speed is measured in metres per second."},{"q":"If two gases have the same rms speed and the same temperature, their molar masses are…","o":["Equal","Inversely proportional to temperature","Always in a 1:4 ratio","Impossible to compare"],"a":0,"e":"For equal T, vrms² = 3RT/M; equal speeds imply equal molar masses."},{"q":"A gas has rms speed 300 m/s. If its absolute temperature rises by 21% while molar mass stays fixed, the new rms speed is approximately…","o":["330 m/s","363 m/s","321 m/s","600 m/s"],"a":0,"e":"The speed factor is √1.21 = 1.1, so the new speed is 330 m/s."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
 if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options')]).catch(function(){});}
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Molecular Speed Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise([card]).catch(function(){});}
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
 window.addEventListener('load',function(){if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise().catch(function(){});}});
})();
</script>
