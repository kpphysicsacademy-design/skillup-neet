<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Molecular Speed</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>💨 Molecular Speed</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['The root mean square speed of gas molecules is given by','v<sub>rms</sub> = √(RT/M)','v<sub>rms</sub> = √(3RT/M)','v<sub>rms</sub> = √(2RT/M)','v<sub>rms</sub> = 3RT/M',1,'For one mole of an ideal gas, v<sub>rms</sub> = √(3RT/M), where M is molar mass in kg mol⁻¹.'],
['At a fixed temperature, the rms speed of gas molecules is proportional to','√M','1/M','1/√M','M',2,'Since v<sub>rms</sub> = √(3RT/M), at fixed T the rms speed is proportional to 1/√M.'],
['For the same gas, if the absolute temperature is increased by a factor of 4, its rms speed becomes','2 times','4 times','1/2 times','8 times',0,'Molecular rms speed is proportional to √T. Therefore, increasing T fourfold doubles the rms speed.'],
['For an ideal gas, the average translational kinetic energy per molecule is','kT','3kT/2','2kT','RT/2',1,'The average translational kinetic energy of one molecule is 3kT/2.'],
['The most probable speed of gas molecules is','√(RT/M)','√(2RT/M)','√(3RT/M)','3RT/M',1,'The most probable speed is v<sub>mp</sub> = √(2RT/M).'],
['The average speed of gas molecules is','√(2RT/M)','√(8RT/πM)','√(3RT/M)','RT/M',1,'The mean or average speed is v<sub>avg</sub> = √(8RT/πM).'],
['Which relation is correct for an ideal gas at a given temperature?','v<sub>mp</sub> > v<sub>avg</sub> > v<sub>rms</sub>','v<sub>rms</sub> > v<sub>avg</sub> > v<sub>mp</sub>','v<sub>avg</sub> > v<sub>rms</sub> > v<sub>mp</sub>','v<sub>mp</sub> = v<sub>avg</sub> = v<sub>rms</sub>',1,'For a Maxwell speed distribution, v<sub>rms</sub> > v<sub>avg</sub> > v<sub>mp</sub>.'],
['At the same temperature, which gas has the highest rms speed?','O<sub>2</sub>','N<sub>2</sub>','H<sub>2</sub>','CO<sub>2</sub>',2,'At the same temperature, rms speed varies as 1/√M. Hydrogen has the smallest molar mass among these gases.'],
['The rms speed of a gas is independent of its','temperature','molar mass','nature of gas','pressure when temperature and molar mass are fixed',3,'For an ideal gas, v<sub>rms</sub> = √(3RT/M), so at fixed T and M it does not directly depend on pressure.'],
['If the temperature of an ideal gas is increased while its molar mass remains constant, the molecular kinetic energy','decreases','remains zero','increases','remains unchanged',2,'Average translational kinetic energy is proportional to absolute temperature, so it increases with T.'],
['The SI unit of the Boltzmann constant k is','J K⁻¹','J mol⁻¹','Pa K⁻¹','N m⁻¹',0,'The Boltzmann constant has SI unit joule per kelvin (J K⁻¹).'],
['For a gas molecule, the translational kinetic energy is related to speed v as','mv','mv²','mv²/2','2mv',2,'The translational kinetic energy of a molecule of mass m moving at speed v is 1/2 mv².'],
['For the same temperature, the ratio of rms speeds of H<sub>2</sub> and O<sub>2</sub> is','1:4','4:1','1:16','16:1',1,'v<sub>rms</sub> is proportional to 1/√M, so v<sub>H2</sub>/v<sub>O2</sub> = √(32/2) = 4.'],
['If the rms speed of a gas is v at temperature T, at temperature 9T it becomes','3v','9v','v/3','27v',0,'Since v<sub>rms</sub> ∝ √T, replacing T by 9T makes the rms speed 3v.'],
['The Maxwell-Boltzmann distribution of molecular speeds shows that molecules in a gas','all have the same speed','have a range of speeds','are always stationary','have infinite speed',1,'Gas molecules have a distribution of speeds; different molecules have different instantaneous speeds.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').innerHTML=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
