(()=>{'use strict';
const source=[["Moment of force is another name for:",["Torque","Angular speed","Linear momentum","Power"],0,"Moment of force describes the turning effect of a force."],["The moment of a force about a point equals force multiplied by:",["Perpendicular distance from point to its line of action","Distance along the force direction","Mass of the object","Time of application"],0,"Moment = force × perpendicular moment arm."],["The SI unit of moment of force is:",["N m","N/m","kg m/s","W"],0,"The moment of force is expressed in newton metres."],["A 5 N force acts perpendicularly 2 m from a pivot. Its moment is:",["10 N m","2.5 N m","7 N m","0.4 N m"],0,"Moment = 5 × 2 = 10 N m."],["A force passes directly through the pivot. Its moment about that pivot is:",["Zero","Maximum","Equal to the force","Infinite"],0,"The perpendicular distance from the pivot to the force line is zero."],["Moment of force depends on:",["Force, distance from pivot and angle","Mass only","Speed only","Time only"],0,"The turning effect depends on force and its perpendicular lever arm."],["For fixed force and lever arm, moment is greatest when force is:",["Perpendicular to the lever arm","Parallel to the lever arm","At 0° to the radius","Directed through the pivot"],0,"A perpendicular force has the full force as its effective component."],["A 20 N force acts at 30° to a 0.5 m lever arm. Moment magnitude?",["5 N m","10 N m","8.66 N m","20.5 N m"],0,"M = rF sin θ = 0.5 × 20 × 0.5 = 5 N m."],["The perpendicular distance used in calculating moment is called the:",["Moment arm","Angular velocity","Radius of gyration","Displacement"],0,"The moment arm is the shortest distance from pivot to force line."],["A 12 N force has a moment arm of 0.25 m. Its moment is:",["3 N m","48 N m","12.25 N m","0.03 N m"],0,"M = 12 × 0.25 = 3 N m."],["The direction of the moment vector is determined by the:",["Right-hand rule","Law of reflection","Snell's law","Fleming's left-hand rule"],0,"The right-hand rule gives the direction perpendicular to the rotation plane."],["If anticlockwise moments are positive, a clockwise moment is:",["Negative","Positive","Always zero","Undefined"],0,"The sign follows the chosen rotational convention."],["If the force doubles and the moment arm is unchanged, the moment:",["Doubles","Halves","Stays constant","Becomes zero"],0,"Moment is directly proportional to force."],["If the moment arm is tripled with force unchanged, the moment:",["Triples","Becomes one-third","Doubles","Does not change"],0,"Moment is directly proportional to perpendicular distance."],["A 30 N force produces a moment of 15 N m perpendicularly. The moment arm is:",["0.5 m","2 m","15 m","450 m"],0,"d = M/F = 15/30 = 0.5 m."],["A 1.5 m spanner is pushed with 40 N perpendicular to its length. Moment?",["60 N m","26.7 N m","41.5 N m","600 N m"],0,"M = 40 × 1.5 = 60 N m."],["Which action makes a door easiest to rotate about its hinges?",["Push at the handle perpendicular to the door","Push close to the hinge","Push along the door toward the hinge","Push directly at the hinge"],0,"A large perpendicular lever arm maximizes the moment."],["A 10 N force acts at 90° to a 0.8 m lever arm. Moment?",["8 N m","12.5 N m","10.8 N m","0.08 N m"],0,"M = 10 × 0.8 = 8 N m."],["A 10 N force acts at 60° to a 2 m lever arm. Moment magnitude?",["17.32 N m","10 N m","20 N m","5 N m"],0,"M = 2 × 10 × sin 60° ≈ 17.32 N m."],["Moment of force is a:",["Vector quantity","Dimensionless scalar","Unit of mass","Type of energy only"],0,"Moment has magnitude and an axis direction."],["The dimensional formula of moment of force is:",["ML²T⁻²","MLT⁻²","ML²T⁻¹","M⁰L⁰T⁰"],0,"Moment = force × distance, giving ML²T⁻²."],["Two equal and opposite parallel forces separated by distance d form a couple. Its moment magnitude is:",["Fd","F/d","2F/d","Zero in all cases"],0,"A couple produces a pure turning effect with magnitude Fd."],["For a body in rotational equilibrium about a fixed axis, the net moment is:",["Zero","Maximum","Equal to its mass","Always positive"],0,"Rotational equilibrium requires clockwise and anticlockwise moments to balance."],["A 6 N force at 0.4 m gives a 2.4 N m moment. What happens if force is reversed with same line of action?",["Moment changes sign","Magnitude doubles","Moment becomes infinite","Moment remains same direction"],0,"Reversing force reverses the direction of the moment."],["A 20 N force acts 0.3 m from pivot at 90°. Moment?",["6 N m","60 N m","20.3 N m","0.015 N m"],0,"M = 20 × 0.3 = 6 N m."],["A force of 50 N produces a 10 N m moment. If perpendicular, its moment arm is:",["0.2 m","5 m","40 m","500 m"],0,"d = 10/50 = 0.2 m."],["Why is the handle of a wrench long?",["It increases the moment arm","It reduces the applied force to zero","It removes friction entirely","It changes the unit of torque"],0,"A longer lever arm gives a larger moment for the same force."],["Moment is zero when the angle between position vector and force is:",["0° or 180°","90° only","45° only","60° only"],0,"M = rF sin θ, and sin θ is zero at 0° and 180°."],["A 25 N force acts at 0.4 m and 30° to the lever arm. Moment?",["5 N m","10 N m","8.66 N m","25 N m"],0,"M = 25 × 0.4 × sin 30° = 5 N m."],["A 100 N force acts perpendicularly at 0.6 m from a pivot. Moment magnitude?",["60 N m","166.7 N m","100.6 N m","0.6 N m"],0,"M = 100 × 0.6 = 60 N m."]];
let questions=source.map(q=>({q:q[0],o:q[1].map((text,i)=>({text,correct:i===q[2]})),e:q[3]}));
const original=questions.map(q=>({q:q.q,o:q.o.map(x=>({...x})),e:q.e}));
let index=0,score=0,streak=0,chosen=null,locked=false,wrong=[];
const $=id=>document.getElementById(id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function render(){chosen=null;locked=false;const item=questions[index];$('qmeta').textContent='QUESTION '+(index+1)+' OF '+questions.length;$('question').textContent=item.q;$('feedback').className='feedback';$('feedback').textContent='';$('check').style.display='block';$('check').disabled=true;$('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';$('options').replaceChildren();item.o=shuffle(item.o);item.o.forEach((op,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const l=document.createElement('span');l.className='letter';l.textContent=String.fromCharCode(65+j);const t=document.createElement('span');t.textContent=op.text;b.append(l,t);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});}
$('check').addEventListener('click',()=>{if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')],correct=item.o.findIndex(x=>x.correct);buttons.forEach((b,j)=>{b.disabled=true;if(j===correct)b.classList.add('correct');});const f=$('feedback');if(item.o[chosen].correct){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='Correct! '+item.e;}else{streak=0;$('streak').textContent=0;buttons[chosen].classList.add('wrong');wrong.push(item);f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[correct].text+'.';}$('check').style.display='none';$('continue').className='btn continue show';});
$('continue').addEventListener('click',()=>{if(!locked)return;index++;if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}$('quiz').style.display='none';const card=document.createElement('section');card.className='finish';const pct=Math.round(score/questions.length*100);card.innerHTML='<div style="font-size:48px">🏆</div><h2>Moment of Force Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+score*10+' XP earned</p><p class="muted">'+(wrong.length?'Review the concepts you missed and try again.':'Excellent work — all answers correct!')+'</p><button class="btn" id="retryWrong" style="display:'+(wrong.length?'inline-block':'none')+'">Retry wrong answers ('+wrong.length+')</button><button class="btn" id="retryAll">Practice all 30 again</button>';$('finishSlot').replaceChildren(card);function reset(list){questions=list.map(q=>({q:q.q,o:q.o.map(x=>({...x})),e:q.e}));index=0;score=0;streak=0;wrong=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});}$('retryWrong').addEventListener('click',()=>reset(wrong));$('retryAll').addEventListener('click',()=>reset(original));});
render();
})();
</script>
