<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>⚙️ Moment of Inertia</h1><p class="muted">Understand rotational inertia, standard formulas and theorems one step at a time.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{"q":"What does moment of inertia describe?","o":["Resistance to angular acceleration","Resistance to temperature change","Linear speed only","Force per unit area"],"a":0,"e":"Moment of inertia measures how strongly a body's mass distribution resists angular acceleration about an axis."},
{"q":"For a point mass m at perpendicular distance r from an axis, I equals:","o":["mr²","mr","m/r","m²r"],"a":0,"e":"For a point particle, moment of inertia is I = mr²."},
{"q":"What is the SI unit of moment of inertia?","o":["kg m²","kg m/s","N/m","J/s"],"a":0,"e":"Mass times distance squared gives the SI unit kg m²."},
{"q":"Which change increases a point mass's moment of inertia most directly?","o":["Moving it farther from the axis","Moving it closer to the axis","Reducing its distance to zero","Changing its colour"],"a":0,"e":"Moment of inertia depends on r², so increasing distance increases I."},
{"q":"Two equal masses are at distances r and 2r from an axis. The second mass has moment of inertia:","o":["Four times as large","Twice as large","Half as large","The same"],"a":0,"e":"Since I = mr², doubling r makes the moment of inertia four times larger."},
{"q":"For several particles, the total moment of inertia is:","o":["Σmr²","Σmr","Σm/r","Σm²r"],"a":0,"e":"Add each particle's mass multiplied by the square of its perpendicular distance."},
{"q":"Moment of inertia depends on the chosen:","o":["Axis of rotation","Colour of the body","Ambient sound","Name of the body"],"a":0,"e":"Changing the axis changes the distances of mass elements from it."},
{"q":"A thin ring of mass M and radius R about its central axis has I:","o":["MR²","½MR²","⅖MR²","⅓MR²"],"a":0,"e":"For a thin ring, nearly all mass is at distance R, giving I = MR²."},
{"q":"A uniform disc about its central axis perpendicular to its plane has I:","o":["½MR²","MR²","⅖MR²","⅔MR²"],"a":0,"e":"The standard result for a uniform solid disc is I = ½MR²."},
{"q":"A solid cylinder about its symmetry axis has moment of inertia:","o":["½MR²","MR²","⅔MR²","⅖MR²"],"a":0,"e":"A uniform solid cylinder has I = ½MR² about its central longitudinal axis."},
{"q":"A uniform rod of length L about its centre, perpendicular to its length, has I:","o":["ML²/12","ML²/3","ML²","ML²/2"],"a":0,"e":"For a uniform rod about its midpoint, I = ML²/12."},
{"q":"A uniform rod about one end, perpendicular to its length, has I:","o":["ML²/3","ML²/12","ML²/2","ML²"],"a":0,"e":"The end-axis result is I = ML²/3."},
{"q":"The radius of gyration k is defined by:","o":["I = Mk²","I = Mk","I = M/k","I = k²/M"],"a":0,"e":"Radius of gyration is the distance at which the whole mass could be concentrated to give the same I: I = Mk²."},
{"q":"The SI unit of radius of gyration is:","o":["metre","kg m²","second","kilogram"],"a":0,"e":"Radius of gyration is a length, so its SI unit is metre."},
{"q":"A 4 kg body has radius of gyration 0.5 m. Its I is:","o":["1 kg m²","2 kg m²","0.5 kg m²","4 kg m²"],"a":0,"e":"I = Mk² = 4 × (0.5)² = 1 kg m²."},
{"q":"A body has I = 18 kg m² and mass 2 kg. Its radius of gyration is:","o":["3 m","9 m","6 m","√18 m"],"a":0,"e":"k = √(I/M) = √(18/2) = 3 m."},
{"q":"The parallel-axis theorem states:","o":["I = Icm + Md²","I = Icm − Md²","I = Md","I = Icm/d"],"a":0,"e":"For an axis parallel to the centre-of-mass axis, I = Icm + Md²."},
{"q":"In the parallel-axis theorem, d is the distance between:","o":["The two parallel axes","The body's ends","Two particles","The centre and surface only"],"a":0,"e":"d is the perpendicular separation between the parallel axes."},
{"q":"A body's I about its centre of mass is 2 kg m². If M = 3 kg and d = 2 m, I about a parallel axis is:","o":["14 kg m²","8 kg m²","6 kg m²","5 kg m²"],"a":0,"e":"I = Icm + Md² = 2 + 3 × 4 = 14 kg m²."},
{"q":"For a plane lamina, the perpendicular-axis theorem gives:","o":["Iz = Ix + Iy","Iz = Ix − Iy","Ix = Iy + Iz","Iy = Ix − Iz"],"a":0,"e":"For mutually perpendicular axes through one point in the plane, Iz = Ix + Iy."},
{"q":"The perpendicular-axis theorem applies directly to a:","o":["Plane lamina","Spherical shell in any axis","Three-dimensional solid of any shape","Point outside the body"],"a":0,"e":"The theorem is for a plane lamina with the axes meeting at a point in its plane."},
{"q":"If all linear dimensions of a geometrically similar body double while density stays constant, its moment of inertia about a corresponding axis becomes:","o":["32 times","16 times","8 times","4 times"],"a":0,"e":"Mass scales with length cubed and squared distance with length squared, so I scales as length to the fifth power: 2⁵ = 32."},
{"q":"For geometrically similar bodies of the same mass, if all dimensions double, how does I scale?","o":["4 times","2 times","8 times","16 times"],"a":0,"e":"At fixed mass, I scales with the square of the body's linear size, so doubling size gives four times I."},
{"q":"If the same body rotates about an axis closer to most of its mass, its moment of inertia generally:","o":["Decreases","Increases","Must double","Becomes negative"],"a":0,"e":"A closer axis generally reduces the squared distances in the sum I = Σmr²."},
{"q":"Which quantity is not enough by itself to determine a body's moment of inertia?","o":["Mass alone","Mass distribution and axis","Mass and shape with axis specified","Distances of mass elements from axis"],"a":0,"e":"Two bodies with the same mass can have different moments of inertia because their mass distributions differ."},
{"q":"A hoop and a solid disc have equal mass and radius. About their central axes, which has larger I?","o":["Hoop","Solid disc","Both equal","Cannot compare at all"],"a":0,"e":"The hoop has I = MR² while the disc has I = ½MR²."},
{"q":"If a point mass is moved to three times its original distance from an axis, its I becomes:","o":["9 times","3 times","6 times","One-third"],"a":0,"e":"Because I is proportional to r², tripling r multiplies I by 3² = 9."},
{"q":"A 2 kg particle is 3 m from an axis. Its moment of inertia is:","o":["18 kg m²","6 kg m²","12 kg m²","9 kg m²"],"a":0,"e":"I = mr² = 2 × 3² = 18 kg m²."},
{"q":"Why is moment of inertia sometimes called rotational inertia?","o":["It measures resistance to changes in rotational motion","It measures only linear momentum","It is always equal to mass","It measures gravitational field strength"],"a":0,"e":"A larger moment of inertia means more torque is needed for the same angular acceleration."},
{"q":"For a rigid body, angular acceleration under a given net torque is smaller when its moment of inertia is:","o":["Larger","Smaller","Zero only","Unrelated to torque"],"a":0,"e":"From τ = Iα, for a fixed torque, α = τ/I; larger I gives smaller angular acceleration."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Moment of Inertia Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
