<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Conservation of Momentum</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-size:1.6rem;font-weight:900}.subtitle{color:#5f6b7a;margin:0 0 18px}.xp,.card{background:#fff;border-radius:20px;box-shadow:0 6px 20px #17203312}.xp{padding:10px 15px;font-weight:850}.card{padding:20px;margin:12px 0}.ph{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:11px;background:#dfe8f1;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.25s}.qnum{font-weight:800;color:#35516f;margin-bottom:11px}.question{font-size:1.27rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#58cc02;background:#f7fff1;transform:translateY(-1px)}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;background:#2db84d;color:#fff;font-weight:850;cursor:pointer;box-shadow:0 4px 0 #21863a;transition:.12s}.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #21863a}.feedback{margin-top:14px;padding:12px;border-radius:13px;font-weight:700;min-height:18px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:10px;padding:10px 13px;border:2px solid #d9d4f5;border-radius:13px;color:#5146a5;font-weight:800;text-decoration:none;transition:.12s}.back:hover{background:#f0edff;transform:translateX(-2px)}@media(max-width:600px){.wrap{padding:20px 14px}.title{font-size:1.4rem}.question{font-size:1.12rem}}</style></head><body><main class="wrap"><div class="top"><div class="title">🔄 Conservation of Momentum</div><div class="xp">⚡ <span id="xp">0</span> XP</div></div><p class="subtitle">Physics • NEET 2026 · Learn → Practice → Master</p><section class="card"><div class="ph"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><button class="btn" id="continue">Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const quiz=[['The law of conservation of linear momentum states that total momentum of an isolated system:', ['remains constant','always becomes zero','always increases','depends only on internal forces'],0,'With zero net external force, total linear momentum remains constant.'],['Linear momentum of a particle is given by:', ['p = mv','p = ma','p = m/v','p = m + v'],0,'Linear momentum is mass multiplied by velocity.'],['Momentum is conserved when the net external:', ['force is zero','mass is zero','velocity is zero','internal force is zero'],0,'Zero net external force gives conservation of total momentum.'],['Two bodies collide in an isolated system. Before and after collision, their total momentum is:', ['the same','always zero','always doubled','always smaller'],0,'Momentum is conserved in an isolated collision.'],['A 2 kg body moving at 3 m/s has momentum:', ['6 kg·m/s','1.5 kg·m/s','5 kg·m/s','9 kg·m/s'],0,'p = mv = 2 × 3 = 6 kg·m/s.'],['If the external impulse on a system is zero, its total momentum:', ['does not change','becomes zero','doubles','changes direction necessarily'],0,'Impulse equals change in momentum, so zero external impulse means no change.'],['A gun recoils when a bullet is fired because:', ['momentum of the gun-bullet system is conserved','energy is not conserved','gravity pulls the gun backward','the bullet has no momentum'],0,'The gun and bullet acquire equal and opposite momenta when external impulse is negligible.'],['In an explosion initially at rest, the vector sum of momenta of all fragments is:', ['zero','equal to the largest fragment momentum','maximum','equal to total kinetic energy'],0,'Initial momentum is zero, so final vector momentum is also zero.'],['A 1 kg ball moving at 4 m/s collides with a stationary 3 kg ball and they stick together. Their common speed is:', ['1 m/s','4 m/s','3 m/s','0.25 m/s'],0,'4 = (1+3)v, so v = 1 m/s.'],['If total mass of a system is constant and its total momentum is conserved, its centre-of-mass velocity:', ['remains constant','must be zero','increases continuously','is undefined'],0,'P = M V_CM; constant P and M imply constant V_CM.'],['Momentum conservation is a vector law, so in two dimensions it requires conservation of:', ['both x- and y-components','only speed','only kinetic energy','only the x-component'],0,'Each independent component of total momentum is conserved when the corresponding external force component is zero.'],['A force acting for a short time produces an impulse equal to:', ['change in momentum','change in mass','change in position','kinetic energy'],0,'Impulse J = Δp.'],['During a collision, internal forces may be very large, but total momentum remains conserved if:', ['external impulse is negligible','kinetic energy is zero','both bodies have equal mass','the collision is elastic only'],0,'Internal collision forces cancel in the total-system momentum balance.'],['A person jumps from a stationary boat. Neglecting external horizontal impulse, the boat moves backward because:', ['total horizontal momentum remains zero','the person has no momentum','gravity acts horizontally','the boat gains mass'],0,'The person gains forward momentum and the boat gains equal backward momentum.'],['Which quantity is conserved in every isolated collision, whether elastic or inelastic?', ['linear momentum','kinetic energy','speed of each body','mechanical energy of each body'],0,'Total linear momentum is conserved in isolated collisions; kinetic energy need not be.']];let i=0,selected=-1,checked=false,score=0;const $=id=>document.getElementById(id),o=$("options"),b=$("continue"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;$("count").textContent='Question '+(i+1)+' of 15';$("question").textContent=a[0];o.innerHTML='';f.className='feedback';f.textContent='';b.style.display='inline-block';b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const el=document.createElement('button');el.className='option';el.textContent=String.fromCharCode(65+j)+'. '+item.text;el.dataset.index=item.index;el.onclick=()=>{selected=item.index;[...o.children].forEach(z=>z.classList.remove('selected'));el.classList.add('selected')};o.appendChild(el)})}b.onclick=()=>{if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(el=>{const n=Number(el.dataset.index);el.disabled=true;if(n===a[2])el.classList.add('correct');if(n===selected&&!ok)el.classList.add('wrong')});if(ok)score++;f.className=ok?'feedback good':'feedback bad';f.textContent=(ok?'🎯 Correct! +10 XP — ':'✗ Review — Correct answer: '+a[1][a[2]]+'. ')+a[3];$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$("question").textContent='🏆 Conservation of Momentum Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
