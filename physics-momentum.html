<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp | Momentum</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.xp{font-weight:800;background:#fff;padding:9px 14px;border-radius:999px;box-shadow:0 4px 14px #17203312}.hero{background:#3b82f6;color:#fff;border-radius:22px;padding:24px;margin-bottom:18px}.hero small{font-weight:800;letter-spacing:.08em}.hero h1{margin:8px 0 6px;font-size:2rem}.hero p{margin:0;font-weight:650}.progress{background:#fff;border-radius:18px;padding:16px 18px;margin-bottom:18px;box-shadow:0 5px 16px #17203310}.progressline{height:10px;background:#e7e9ef;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;width:0;background:#58cc02}.quiz{background:#fff;border-radius:22px;padding:24px;box-shadow:0 6px 20px #17203312}.meta{display:flex;justify-content:space-between;color:#617086;font-weight:750;margin-bottom:18px}.question{font-size:1.3rem;font-weight:750;line-height:1.45;margin-bottom:18px}.options{display:grid;gap:11px}.option{width:100%;text-align:left;padding:15px;border:2px solid #dfe3ea;background:#fff;border-radius:14px;font:inherit;font-weight:650;cursor:pointer;transition:.15s}.option:hover{border-color:#58cc02;transform:translateY(-1px)}.option.selected{border-color:#5146a5;background:#f0edff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e55353;background:#ffeaea}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:13px;padding:13px 18px;font:inherit;font-weight:800;cursor:pointer}.check{background:#5146a5;color:#fff}.next{background:#58cc02;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:16px;font-weight:700;line-height:1.5}.good{color:#278400}.bad{color:#c73737}.hint{margin-top:10px;color:#617086;font-size:.94rem}.result{display:none;text-align:center;margin-top:20px}.retry{background:#5146a5;color:#fff}.back{display:inline-block;margin-top:24px;color:#5146a5;font-weight:800;text-decoration:underline;padding:10px 13px;border-radius:12px;transition:.15s}.back:hover{background:#f0edff;transform:translateY(-1px)}.back:focus{outline:3px solid #c9c2ff;outline-offset:2px}.back:active{transform:translateY(1px)}
</style>
</head>
<body><main class="wrap">
<div class="top"><strong>⚛️ SkillUp Physics</strong><span class="xp">⭐ <span id="xp">0</span> XP</span></div>
<section class="hero"><small>PHYSICS • NEET 2026</small><h1>Momentum</h1><p>LEARN → PRACTICE → MASTER • 15 focused NEET-style MCQs</p></section>
<section class="progress"><strong>Mastery: <span id="mastery">0%</span></strong><div class="progressline"><div class="fill" id="fill"></div></div></section>
<section class="quiz"><div class="meta"><span id="count">Question 1 of 15</span><span id="pct">7%</span></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="actions"><button class="btn check" id="check">Check Answer</button><button class="btn next" id="next" disabled>Next Question →</button></div><div class="feedback" id="feedback"></div><div class="hint" id="hint"></div><div class="result" id="result"><h2>🏆 Skill Complete!</h2><p id="score"></p><button class="btn retry" id="retry">Retry Skill</button></div></section>
<a class="back" id="back" href="physics-home.html">← Back to Physics Path</a>
</main>
<script>
const quiz=[
["Linear momentum of a body is defined as:",["Mass × velocity","Mass × acceleration","Force × time only","Mass ÷ velocity"],0,"Linear momentum p = mv."],
["The SI unit of linear momentum is:",["kg m/s","N/m","J/s","kg m/s²"],0,"Momentum has SI unit kg m/s, equivalent to N·s."],
["A 2 kg body moves with velocity 5 m/s. Its momentum is:",["10 kg m/s","2.5 kg m/s","7 kg m/s","25 kg m/s"],0,"p = mv = 2 × 5 = 10 kg m/s."],
["Momentum is a:",["Vector quantity","Scalar quantity","Dimensionless quantity","Constant for every body"],0,"Momentum has magnitude and direction because velocity is a vector."],
["The direction of momentum of a body is the direction of its:",["Velocity","Mass","Acceleration always","Force always"],0,"Since p = mv, momentum has the direction of velocity."],
["The impulse delivered to an object is equal to its:",["Change in momentum","Change in mass","Momentum divided by time","Kinetic energy"],0,"Impulse J = Δp, the change in linear momentum."],
["A force of 10 N acts on a body for 0.2 s. The impulse is:",["2 N·s","5 N·s","10.2 N·s","50 N·s"],0,"Impulse = FΔt = 10 × 0.2 = 2 N·s."],
["If the net external force on a system is zero, its total linear momentum:",["Remains conserved","Always becomes zero","Always doubles","Depends only on its mass"],0,"With zero net external force, total linear momentum is conserved."],
["A 1 kg ball moving at 4 m/s has momentum:",["4 kg m/s","0.25 kg m/s","5 kg m/s","1 kg m/s"],0,"p = 1 × 4 = 4 kg m/s."],
["For a given mass, if velocity is doubled, momentum:",["Doubles","Becomes half","Becomes four times","Remains unchanged"],0,"Momentum is directly proportional to velocity for constant mass."],
["For a given velocity, if mass is doubled, momentum:",["Doubles","Becomes half","Becomes four times","Becomes zero"],0,"Momentum is directly proportional to mass for constant velocity."],
["The dimensional formula of momentum is:",["[MLT⁻¹]","[MLT⁻²]","[ML²T⁻²]","[M⁰LT⁻¹]"],0,"p = mv, so dimensions are M × LT⁻¹ = MLT⁻¹."],
["A 0.5 kg object changes velocity from 2 m/s to 6 m/s in the same direction. The magnitude of change in momentum is:",["2 kg m/s","3 kg m/s","4 kg m/s","8 kg m/s"],0,"Δp = mΔv = 0.5 × (6 − 2) = 2 kg m/s."],
["A force acting on an object changes its momentum from 10 to 16 kg m/s in 3 s. The average force is:",["2 N","6 N","8 N","18 N"],0,"Average force = Δp/Δt = (16 − 10)/3 = 2 N."],
["Which statement about momentum conservation is correct?",["Total momentum of an isolated system remains constant","Momentum of every individual object is always constant","Momentum is conserved only when objects are at rest","Momentum can never change in any collision"],0,"In an isolated system, total linear momentum remains constant, although individual momenta may change."]
];
let i=0,selected=-1,correctCount=0,xp=0;const $=id=>document.getElementById(id);function shuffle(arr){for(let k=arr.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[arr[k],arr[r]]=[arr[r],arr[k]]}return arr}
function render(){const a=quiz[i];selected=-1;$('question').textContent=a[0];$('count').textContent=`Question ${i+1} of ${quiz.length}`;$('pct').textContent=Math.round((i+1)/quiz.length*100)+'%';$('fill').style.width=(correctCount/quiz.length*100)+'%';$('mastery').textContent=Math.round(correctCount/quiz.length*100)+'%';$('feedback').className='feedback';$('feedback').textContent='';$('hint').textContent='Use p = mv and remember that momentum is a vector.';$('check').disabled=false;$('next').disabled=true;$('next').textContent='Next Question →';$('options').innerHTML='';const order=shuffle(a[1].map((text,index)=>({text,index})));order.forEach((item,j)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{if($('check').disabled)return;selected=item.index;[...$('options').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('options').appendChild(b)})}
function check(){if(selected<0){$('feedback').className='feedback bad';$('feedback').textContent='Choose an answer first 👆';return}const a=quiz[i],ok=selected===a[2];[...$('options').children].forEach(b=>{const idx=Number(b.dataset.index);b.disabled=true;if(idx===a[2])b.classList.add('correct');if(idx===selected&&selected!==a[2])b.classList.add('wrong')});if(ok){correctCount++;xp+=10;$('xp').textContent=xp;$('feedback').className='feedback good';$('feedback').textContent='✓ Correct — '+a[3]}else{$('feedback').className='feedback bad';$('feedback').textContent='✗ Review — '+a[3]}$('mastery').textContent=Math.round(correctCount/quiz.length*100)+'%';$('fill').style.width=(correctCount/quiz.length*100)+'%';$('check').disabled=true;$('next').disabled=false;if(i===quiz.length-1)$('next').textContent='Finish Skill →'}
function next(){if($('next').disabled)return;if(i<quiz.length-1){i++;render()}else{$('question').textContent='🏆 Momentum Complete!';$('options').innerHTML='';$('check').style.display='none';$('next').style.display='none';$('hint').textContent='';$('feedback').className='feedback good';$('feedback').textContent='Skill complete. '+xp+' XP earned.';$('result').style.display='block';$('score').textContent=correctCount+' / '+quiz.length+' correct • '+xp+' XP'}}
$('check').onclick=check;$('next').onclick=next;$('retry').onclick=()=>{i=0;selected=-1;correctCount=0;xp=0;$('xp').textContent='0';$('mastery').textContent='0%';$('fill').style.width='0%';$('result').style.display='none';$('check').style.display='';$('next').style.display='';render()};
$('back').onclick=function(e){e.preventDefault();const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return}}catch(e){}}location.href='physics-home.html'};
render();
</script></body></html>
