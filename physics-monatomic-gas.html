.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>⚛️ Monatomic Gas</h1><p class="muted">Explore monatomic ideal-gas properties with 30 questions and concise explanations.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"A monatomic gas molecule contains",o:["one atom","two atoms","three atoms","four atoms"],a:0,e:"Monatomic means each molecule consists of a single atom."},
{q:"Which of the following is a monatomic gas?",o:["O₂","N₂","He","CO₂"],a:2,e:"Helium is a noble gas and exists as monatomic He molecules."},
{q:"A monatomic ideal gas has how many translational degrees of freedom?",o:["1","2","3","5"],a:2,e:"A monatomic particle can translate independently along x, y and z, giving three translational degrees of freedom."},
{q:"Neglecting other modes, the internal energy of n moles of a monatomic ideal gas is",o:["nRT","\\\\(\\\\frac{3}{2}nRT\\\\)","\\\\(\\\\frac{5}{2}nRT\\\\)","3nRT"],a:1,e:"For three quadratic translational degrees of freedom, U = \\\\(\\\\frac{3}{2}nRT\\\\)."},
{q:"The molar heat capacity at constant volume of a monatomic ideal gas is",o:["R/2","R","3R/2","5R/2"],a:2,e:"\\\\(C_v=\\\\frac{f}{2}R=\\\\frac{3R}{2}\\\\) for a monatomic ideal gas."},
{q:"The molar heat capacity at constant pressure of a monatomic ideal gas is",o:["3R/2","2R","5R/2","3R"],a:2,e:"Using \\\\(C_p=C_v+R\\\\), Cₚ = \\\\(\\\\frac{3R}{2}+R=\\\\frac{5R}{2}\\\\)."},
{q:"The ratio γ = \\\\(C_p/C_v\\\\) for a monatomic ideal gas is",o:["4/3","5/3","7/5","3/2"],a:1,e:"For a monatomic ideal gas, \\\\(\\\\gamma=\\\\frac{C_p}{C_v}=\\\\frac{5}{3}\\\\)."},
{q:"The average translational kinetic energy per molecule of a monatomic ideal gas at temperature T is",o:["kBT","(1/2)kBT","\\\\(\\\\frac{3}{2}k_BT\\\\)","(5/2)kBT"],a:2,e:"The three translational quadratic degrees of freedom give Ē = \\\\(\\\\frac{3}{2}k_BT\\\\)."},
{q:"At the same temperature, the average translational kinetic energy of a helium atom and a neon atom is",o:["greater for helium","greater for neon","the same","zero for both"],a:2,e:"For ideal gases, average translational kinetic energy depends only on temperature, not molecular mass."},
{q:"For a monatomic ideal gas, the relation between internal energy U and PV is",o:["\\\\(U=PV\\\\)","\\\\(U=\\\\frac{1}{2}PV\\\\)","\\\\(U=\\\\frac{3}{2}PV\\\\)","U = 3PV"],a:2,e:"Since PV = nRT and U = \\\\(\\\\frac{3}{2}nRT\\\\), \\\\(U=\\\\frac{3}{2}PV\\\\)."},
{q:"If the absolute temperature of a fixed amount of monatomic ideal gas doubles, its internal energy",o:["halves","remains unchanged","doubles","quadruples"],a:2,e:"For fixed n, U = \\\\(\\\\frac{3}{2}nRT\\\\), so U is directly proportional to T."},
{q:"During an isothermal change of a monatomic ideal gas, the change in internal energy is",o:["positive","negative","zero","infinite"],a:2,e:"An ideal gas has internal energy dependent only on temperature; constant T means \\\\(\\\\Delta U=0\\\\)."},
{q:"For a monatomic ideal gas, the change in internal energy for a temperature change ΔT is",o:["nRΔT","(3/2)nRΔT","(5/2)nRΔT","2nRΔT"],a:1,e:"For a monatomic ideal gas, \\\\(\\\\Delta U=nC_v\\\\Delta T=\\\\frac{3}{2}nR\\\\Delta T\\\\)."},
{q:"Which statement about monatomic ideal gases is correct?",o:["They have rotational degrees of freedom in the ideal point-particle model","They have three translational degrees of freedom","They always have vibrational energy at room temperature","Their γ equals 7/5"],a:1,e:"In the standard ideal-gas model, a monatomic gas has three translational degrees of freedom and \\\\(\\\\gamma=\\\\frac{5}{3}\\\\)."},
{q:"For a monatomic ideal gas, the speed distribution depends on temperature and also on",o:["molar mass","electric charge only","container color","amount of substance only"],a:0,e:"The Maxwell speed distribution depends on temperature and particle mass (or molar mass); it also describes the distribution shape for the gas."},
{q:"The mean translational kinetic energy per molecule at temperature T is proportional to",o:["T","T²","1/T","molecular mass only"],a:0,e:"For an ideal gas, the mean translational kinetic energy is \\\\(\\\\frac{3}{2}k_BT\\\\), so it is proportional to absolute temperature."},
{q:"At 300 K, the average translational kinetic energy of a monatomic molecule is",o:["\\\\(\\\\frac{3}{2}k_B(300)\\\\)","\\\\(k_B/300\\\\)","\\\\(3k_B/2(300)^2\\\\)","independent of temperature"],a:0,e:"Use \\\\(\\\\bar E=\\\\frac{3}{2}k_BT\\\\)."},
{q:"For a monatomic ideal gas, the number of active translational degrees of freedom is",o:["two","three","five","six"],a:1,e:"The three independent spatial directions give three translational degrees of freedom."},
{q:"If the temperature increases from T to 4T, the internal energy of a fixed amount of monatomic ideal gas becomes",o:["U/4","2U","4U","16U"],a:2,e:"Internal energy is directly proportional to absolute temperature for a fixed amount of ideal gas."},
{q:"Which expression gives the internal energy of N monatomic ideal-gas particles?",o:["\\\\(Nk_BT\\\\)","\\\\(\\\\frac{3}{2}Nk_BT\\\\)","\\\\(\\\\frac{5}{2}Nk_BT\\\\)","\\\\(3Nk_BT\\\\)"],a:1,e:"Each particle has average translational energy \\\\(\\\\frac{3}{2}k_BT\\\\), so multiply by N."},
{q:"The value of the universal gas constant R is approximately",o:["8.31 J mol⁻¹ K⁻¹","1.38 × 10⁻²³ J K⁻¹","6.02 × 10²³ mol⁻¹","9.81 m s⁻²"],a:0,e:"R is approximately 8.314 J mol⁻¹ K⁻¹; the first option has the correct units."},
{q:"The Boltzmann constant kB is related to R and Avogadro constant NA by",o:["\\\\(k_B=R N_A\\\\)","\\\\(k_B=R/N_A\\\\)","\\\\(k_B=N_A/R\\\\)","\\\\(k_B=R+N_A\\\\)"],a:1,e:"The relation is \\\\(R=N_Ak_B\\\\), hence \\\\(k_B=R/N_A\\\\)."},
{q:"For a monatomic ideal gas undergoing an isochoric heating process, the work done by the gas is",o:["positive","negative","zero","always equal to ΔU"],a:2,e:"At constant volume, \\\\(W=\\\\int P\\\\,dV=0\\\\)."},
{q:"For a monatomic ideal gas, Cp − Cv equals",o:["0","R","2R","3R/2"],a:1,e:"Mayer’s relation for an ideal gas is \\\\(C_p-C_v=R\\\\)."},
{q:"Which value is closest to the ratio Cp/Cv for a monatomic ideal gas?",o:["1.40","1.33","1.67","2.00"],a:2,e:"For a monatomic ideal gas, \\\\(C_p/C_v=5/3\\\\approx1.67\\\\)."},
{q:"When a monatomic ideal gas expands isothermally, its internal energy",o:["increases","decreases","does not change","becomes zero"],a:2,e:"For an ideal gas, internal energy depends only on temperature; an isothermal process has constant temperature."},
{q:"Which quantity is the same for all ideal gases at the same temperature?",o:["rms speed","momentum of each molecule","average translational kinetic energy per molecule","mass of each molecule"],a:2,e:"The average translational kinetic energy per molecule is \\\\(\\\\frac{3}{2}k_BT\\\\), independent of gas identity."},
{q:"At the same temperature, which gas has the larger rms speed?",o:["Xenon","Neon","Both must be equal","Cannot depend on mass"],a:1,e:"Rms speed varies as \\\\(1/\\\\sqrt{M}\\\\); the lighter gas has the greater rms speed."},
{q:"For one mole of a monatomic ideal gas, U is",o:["\\\\(RT\\\\)","\\\\(\\\\frac{3}{2}RT\\\\)","\\\\(\\\\frac{5}{2}RT\\\\)","\\\\(3RT\\\\)"],a:1,e:"Substitute n = 1 into \\\\(U=\\\\frac{3}{2}nRT\\\\)."},
{q:"The internal energy of a monatomic ideal gas depends on",o:["pressure only","volume only","temperature and amount of gas","container shape only"],a:2,e:"For a monatomic ideal gas, \\\\(U=\\\\frac{3}{2}nRT\\\\), so it depends on n and T."}
]
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Monatomic Gas Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
