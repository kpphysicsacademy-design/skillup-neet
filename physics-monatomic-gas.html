<script>
(function(){
'use strict';
const questions = [{"q":"A monatomic gas molecule contains how many atoms?","o":["One","Two","Three","Four"],"a":0,"e":"A monatomic gas such as helium consists of single atoms."},{"q":"At ordinary temperatures, a monatomic ideal gas has how many translational degrees of freedom?","o":["3","2","5","6"],"a":0,"e":"Translation along three independent spatial axes gives three degrees of freedom."},{"q":"The average translational kinetic energy per monatomic gas molecule is…","o":["\\(\\frac32k_BT\\)","\\(k_BT\\)","\\(\\frac12k_BT\\)","\\(3k_BT\\)"],"a":0,"e":"Three translational quadratic modes contribute \\(3k_BT/2\\)."},{"q":"The internal energy of n moles of a monatomic ideal gas is…","o":["\\(U=\\frac32nRT\\)","\\(U=\\frac52nRT\\)","\\(U=\\frac72nRT\\)","\\(U=nRT\\)"],"a":0,"e":"For three active degrees of freedom, \\(U=(3/2)nRT\\)."},{"q":"The molar heat capacity at constant volume of a monatomic ideal gas is…","o":["\\(C_V=\\frac32R\\)","\\(C_V=\\frac52R\\)","\\(C_V=R\\)","\\(C_V=\\frac72R\\)"],"a":0,"e":"\\(C_V=(f/2)R=3R/2\\) for f = 3."},{"q":"The molar heat capacity at constant pressure is…","o":["\\(C_P=\\frac52R\\)","\\(C_P=\\frac32R\\)","\\(C_P=R\\)","\\(C_P=\\frac72R\\)"],"a":0,"e":"Using Mayer's relation, \\(C_P=C_V+R=5R/2\\)."},{"q":"The heat-capacity ratio for a monatomic ideal gas is…","o":["\\(5/3\\)","\\(7/5\\)","\\(4/3\\)","\\(3/2\\)"],"a":0,"e":"\\(\\gamma=C_P/C_V=(5/2)/(3/2)=5/3\\)."},{"q":"Which is a common monatomic gas?","o":["Helium","Oxygen","Nitrogen","Hydrogen"],"a":0,"e":"Helium is a noble gas whose atoms are monatomic under ordinary conditions."},{"q":"For an ideal gas, internal energy depends only on…","o":["Absolute temperature","Pressure alone","Volume alone","Container shape"],"a":0,"e":"Ideal-gas internal energy depends only on temperature."},{"q":"Equipartition assigns how much average energy per molecule to each active quadratic degree of freedom?","o":["\\(\\frac12k_BT\\)","\\(k_BT\\)","\\(2k_BT\\)","\\(\\frac32k_BT\\)"],"a":0,"e":"Each active quadratic degree of freedom contributes \\(k_BT/2\\) on average."},{"q":"At constant volume, heat supplied to n moles of a monatomic gas for a temperature change ΔT is…","o":["\\(Q=\\frac32nR\\Delta T\\)","\\(Q=\\frac52nR\\Delta T\\)","\\(Q=nR\\Delta T\\)","\\(Q=\\frac72nR\\Delta T\\)"],"a":0,"e":"At constant volume, \\(Q=nC_V\\Delta T\\), and \\(C_V=3R/2\\)."},{"q":"At constant pressure, heat supplied for temperature change ΔT is…","o":["\\(Q=\\frac52nR\\Delta T\\)","\\(Q=\\frac32nR\\Delta T\\)","\\(Q=nR\\Delta T\\)","\\(Q=\\frac72nR\\Delta T\\)"],"a":0,"e":"At constant pressure, \\(Q=nC_P\\Delta T\\), with \\(C_P=5R/2\\)."},{"q":"What is the change in internal energy when temperature changes by ΔT?","o":["\\(\\Delta U=\\frac32nR\\Delta T\\)","\\(\\Delta U=\\frac52nR\\Delta T\\)","\\(\\Delta U=nR\\Delta T\\)","\\(\\Delta U=\\frac72nR\\Delta T\\)"],"a":0,"e":"For a monatomic ideal gas, \\(\\Delta U=nC_V\\Delta T=(3/2)nR\\Delta T\\)."},{"q":"For a monatomic gas, the relation between molar heat capacities is…","o":["\\(C_P-C_V=R\\)","\\(C_P+C_V=R\\)","\\(C_V-C_P=R\\)","\\(C_P/C_V=R\\)"],"a":0,"e":"Mayer's relation for an ideal gas is \\(C_P-C_V=R\\)."},{"q":"A monatomic gas is heated at constant volume. Its pressure rises because…","o":["Molecular average kinetic energy and speed rise","Molecular mass increases","Its volume increases","Molecules stop colliding"],"a":0,"e":"At fixed volume, higher temperature raises molecular kinetic energy and pressure."},{"q":"If absolute temperature doubles, the average translational kinetic energy per molecule…","o":["Doubles","Halves","Quadruples","Remains unchanged"],"a":0,"e":"Average translational kinetic energy is directly proportional to kelvin temperature."},{"q":"If temperature rises from T to 4T, RMS speed becomes…","o":["Twice as large","Four times as large","Half as large","Unchanged"],"a":0,"e":"RMS speed is proportional to \\(\\sqrt T\\), so it doubles."},{"q":"What is the approximate value of the universal gas constant R?","o":["\\(8.314\\,\\mathrm{J\\,mol^{-1}\\,K^{-1}}\\)","\\(1.38\\times10^{-23}\\,\\mathrm{J\\,K^{-1}}\\)","\\(6.022\\times10^{23}\\,\\mathrm{mol^{-1}}\\)","\\(9.8\\,\\mathrm{m\\,s^{-2}}\\)"],"a":0,"e":"R is approximately 8.314 joules per mole per kelvin."},{"q":"A monatomic gas has 2 mol at 300 K. Its internal energy is…","o":["\\(\\frac32(2)R(300)\\)","\\(\\frac52(2)R(300)\\)","\\(\\frac72(2)R(300)\\)","\\((2)R(300)\\)"],"a":0,"e":"Use \\(U=(3/2)nRT\\)."},{"q":"For a monatomic ideal gas, γ is approximately…","o":["1.67","1.40","1.33","1.00"],"a":0,"e":"\\(\\gamma=5/3\\approx1.67\\)."},{"q":"Which process has zero work done by the gas if the gas volume does not change?","o":["Isochoric process","Isobaric process","Isothermal expansion","Adiabatic expansion"],"a":0,"e":"Work is \\(W=\\int P\\,dV\\); if volume is constant, \\(dV=0\\) and work is zero."},{"q":"At constant pressure, if absolute temperature doubles, volume…","o":["Doubles","Halves","Stays constant","Becomes four times"],"a":0,"e":"Charles's law gives \\(V\\propto T\\) at fixed pressure."},{"q":"A monatomic gas has \\(C_V=3R/2\\). Its \\(C_P\\) equals…","o":["\\(5R/2\\)","\\(3R/2\\)","\\(R\\)","\\(7R/2\\)"],"a":0,"e":"By Mayer's relation, \\(C_P=C_V+R=5R/2\\)."},{"q":"Which type of energy is included in the simple monatomic ideal-gas internal energy?","o":["Translational kinetic energy","Molecular vibration energy","Chemical bond energy changes","Intermolecular potential energy variations"],"a":0,"e":"The simple monatomic ideal-gas model includes translational kinetic energy only."},{"q":"At the same temperature and amount, compared with a monatomic gas, a rigid diatomic gas with five active degrees of freedom has…","o":["Greater internal energy","Lower internal energy","Always equal internal energy","Zero internal energy"],"a":0,"e":"The rigid diatomic model has \\((5/2)nRT\\), greater than the monatomic value \\((3/2)nRT\\)."},{"q":"A monatomic ideal gas has pressure P. If its absolute temperature triples at fixed volume, pressure becomes…","o":["\\(3P\\)","\\(P/3\\)","\\(9P\\)","P"],"a":0,"e":"At fixed volume and amount, pressure is proportional to absolute temperature."},{"q":"Which assumption is appropriate for an ideal monatomic gas?","o":["Atoms are treated as point particles with negligible intermolecular forces","Atoms are motionless","Atoms attract strongly at all distances","Atoms have no kinetic energy"],"a":0,"e":"The ideal model neglects particle volume and intermolecular forces except during elastic collisions."},{"q":"What is the SI unit of molar heat capacity?","o":["\\(\\mathrm{J\\,mol^{-1}\\,K^{-1}}\\)","\\(\\mathrm{J\\,K^{-1}}\\)","\\(\\mathrm{Pa\\,m^{-3}}\\)","\\(\\mathrm{kg\\,mol^{-1}}\\)"],"a":0,"e":"Molar heat capacity is energy per mole per kelvin."},{"q":"A monatomic ideal gas's temperature increases by 20 K. For n moles, its internal-energy change is…","o":["\\(\\Delta U=\\frac32nR(20)\\)","\\(\\Delta U=\\frac52nR(20)\\)","\\(\\Delta U=nR(20)\\)","\\(\\Delta U=\\frac72nR(20)\\)"],"a":0,"e":"Use \\(\\Delta U=(3/2)nR\\Delta T\\) with \\(\\Delta T=20\\,\\mathrm K\\)."},{"q":"Why is γ larger for a monatomic gas than for a rigid diatomic gas at ordinary temperatures?","o":["The monatomic gas has fewer active degrees of freedom","Its gas constant is larger","Its molecules have no translational motion","Its pressure is always higher"],"a":0,"e":"For an ideal gas, \\(\\gamma=1+2/f\\); f = 3 gives 5/3, while f = 5 gives 7/5."}];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Monatomic Gas Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
