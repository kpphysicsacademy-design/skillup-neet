<section class="hero"><h1>🔥 Monatomic Gas</h1><p class="muted">Explore monatomic ideal-gas properties with 30 questions and concise explanations.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>

<script>
(function(){
'use strict';
const questions = [{"q":"A monatomic gas molecule contains how many atoms?","o":["One","Two","Three","Four"],"a":0,"e":"A monatomic gas such as helium consists of single atoms."},{"q":"At ordinary temperatures, a monatomic ideal gas has how many translational degrees of freedom?","o":["3","2","5","6"],"a":0,"e":"Translation along three independent spatial axes gives three degrees of freedom."},{"q":"The average translational kinetic energy per molecule of an ideal gas at temperature T is…","o":["(3/2)kBT","kBT","(1/2)kBT","3kBT"],"a":0,"e":"The three translational quadratic modes contribute a total average energy of (3/2)kBT."},{"q":"The internal energy of n moles of a monatomic ideal gas is…","o":["(3/2)nRT","(5/2)nRT","(7/2)nRT","nRT"],"a":0,"e":"For three active degrees of freedom, U = (3/2)nRT."},{"q":"The molar heat capacity at constant volume of a monatomic ideal gas is…","o":["(3/2)R","(5/2)R","R","(7/2)R"],"a":0,"e":"Cv = (f/2)R = (3/2)R for f = 3."},{"q":"The molar heat capacity at constant pressure of a monatomic ideal gas is…","o":["(5/2)R","(3/2)R","R","(7/2)R"],"a":0,"e":"Using Mayer's relation, Cp = Cv + R = (5/2)R."},{"q":"The heat-capacity ratio γ = Cp/Cv for a monatomic ideal gas is…","o":["5/3","7/5","4/3","3/2"],"a":0,"e":"γ = (5R/2)/(3R/2) = 5/3."},{"q":"Which of these is a common example of a monatomic gas?","o":["Helium","Oxygen","Nitrogen","Hydrogen"],"a":0,"e":"Helium is a noble gas made of single atoms under ordinary conditions."},{"q":"For a monatomic ideal gas, the number of active degrees of freedom in the usual model is…","o":["3","5","6","2"],"a":0,"e":"Only the three translational degrees are active in the usual ordinary-temperature model."},{"q":"If the temperature of a monatomic ideal gas doubles in kelvin, its average translational kinetic energy per molecule…","o":["Doubles","Halves","Becomes four times larger","Remains unchanged"],"a":0,"e":"Average translational kinetic energy is directly proportional to absolute temperature."},{"q":"The internal energy of 2 mol of a monatomic ideal gas at temperature T is…","o":["3RT","(3/2)RT","5RT","RT"],"a":0,"e":"U = (3/2)nRT = (3/2)(2)RT = 3RT."},{"q":"For 1 mol of monatomic ideal gas, the internal energy at temperature T is…","o":["(3/2)RT","(5/2)RT","(3/2)kBT","RT/2"],"a":0,"e":"For n = 1, U = (3/2)RT."},{"q":"For a monatomic ideal gas, Cp − Cv equals…","o":["R","2R","(3/2)R","(5/2)R"],"a":0,"e":"Mayer's relation gives Cp − Cv = R for an ideal gas."},{"q":"If Cv = (3/2)R, then Cp is…","o":["(5/2)R","(3/2)R","R","(7/2)R"],"a":0,"e":"Cp = Cv + R = (5/2)R."},{"q":"For a monatomic ideal gas, the ratio Cp/Cv is greater than one because…","o":["Cp = Cv + R","Cp = Cv − R","Cp = 2Cv","Cv = 0"],"a":0,"e":"At constant pressure, extra heat is needed for expansion work, so Cp exceeds Cv by R per mole."},{"q":"At the same temperature, which has the same average translational kinetic energy per molecule as helium ideal gas?","o":["Any ideal gas","Only oxygen","Only nitrogen","Only gases of equal molar mass"],"a":0,"e":"Average translational kinetic energy per molecule depends on temperature, not molar mass."},{"q":"The SI unit of molar heat capacity is…","o":["J mol⁻¹ K⁻¹","J K⁻¹","J mol⁻¹","W m⁻¹ K⁻¹"],"a":0,"e":"Molar heat capacity is energy per mole per kelvin."},{"q":"The Boltzmann constant kB relates average molecular energy to…","o":["Absolute temperature","Pressure only","Molar mass only","Volume only"],"a":0,"e":"Thermal energy per molecule scales with kB T."},{"q":"For a monatomic ideal gas, internal energy depends on which state variable in the ideal-gas model?","o":["Absolute temperature","Container colour","Gas identity only","Container shape only"],"a":0,"e":"For a fixed amount of ideal monatomic gas, U = (3/2)nRT depends only on temperature."},{"q":"A monatomic ideal gas absorbs heat at constant volume. The heat supplied changes…","o":["Internal energy","Only pressure with no energy change","Only volume","Only the number of atoms"],"a":0,"e":"At constant volume, no boundary work is done, so supplied heat changes internal energy."},{"q":"For 3 mol of monatomic ideal gas, Cv,total equals…","o":["(9/2)R","(3/2)R","(5/2)R","9R"],"a":0,"e":"Total heat capacity at constant volume is nCv,m = 3 × (3R/2) = 9R/2."},{"q":"If a monatomic ideal gas has internal energy U, its average translational kinetic energy per molecule is…","o":["(3/2)kBT","(5/2)kBT","kBT","3kBT"],"a":0,"e":"A monatomic ideal gas's internal energy is entirely translational kinetic energy in this model."},{"q":"Which statement about an ideal monatomic gas is correct?","o":["Its internal energy is translational kinetic energy","It has five translational degrees of freedom","Its Cv is (5/2)R","Its γ is 7/5"],"a":0,"e":"For a monatomic ideal gas, the model's internal energy is the sum of translational kinetic energies."},{"q":"At constant volume, 100 J of heat is added to an ideal monatomic gas. Its internal energy changes by…","o":["+100 J","−100 J","0 J","+50 J"],"a":0,"e":"At constant volume, work is zero, so ΔU = Q = +100 J."},{"q":"A monatomic ideal gas has γ = 5/3. Its degrees of freedom f in the equipartition model are…","o":["3","5","2","6"],"a":0,"e":"γ = 1 + 2/f; setting γ = 5/3 gives f = 3."},{"q":"For 1 mol of monatomic gas, the increase in internal energy when temperature rises by ΔT is…","o":["(3/2)RΔT","(5/2)RΔT","RΔT","(3/2)kBΔT"],"a":0,"e":"ΔU = nCv,mΔT = (3/2)RΔT for one mole."},{"q":"Which property does not affect the average translational kinetic energy per molecule at a fixed temperature?","o":["Molar mass","Absolute temperature","Boltzmann constant","Temperature scale in kelvin"],"a":0,"e":"At fixed temperature, average translational kinetic energy is independent of molecular mass."},{"q":"For a monatomic ideal gas undergoing an isothermal process, its internal energy change is…","o":["Zero","Positive","Negative","Equal to the work in every case"],"a":0,"e":"Ideal-gas internal energy depends only on temperature; an isothermal process has ΔT = 0."},{"q":"The average kinetic energy per molecule at 300 K compared with 150 K is…","o":["Twice as large","Half as large","Four times as large","The same"],"a":0,"e":"Average kinetic energy is proportional to absolute temperature, and 300/150 = 2."},{"q":"For a monatomic ideal gas, if Cv,m = 12.5 J mol⁻¹ K⁻¹ approximately, the gas constant is closest to…","o":["8.31 J mol⁻¹ K⁻¹","4.16 J mol⁻¹ K⁻¹","12.5 J mol⁻¹ K⁻¹","16.6 J mol⁻¹ K⁻¹"],"a":0,"e":"Cv,m = 3R/2, so R = 2Cv,m/3 ≈ 8.33 J mol⁻¹ K⁻¹."}]
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Monatomic Gas Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
