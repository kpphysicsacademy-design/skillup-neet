<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Most Probable Speed</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🏃 Most Probable Speed</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['For a Maxwell-Boltzmann distribution, the most probable speed is','√(RT/M)','√(2RT/M)','√(3RT/M)','√(8RT/πM)',1,'The most probable speed is v_mp = √(2RT/M).'],
['The most probable speed of gas molecules is the speed at which','all molecules move','the number of molecules is maximum','the average kinetic energy is zero','pressure is minimum',1,'It corresponds to the peak of the Maxwell-Boltzmann speed distribution.'],
['At constant molar mass, most probable speed is proportional to','T','1/T','√T','T²',2,'Since v_mp = √(2RT/M), v_mp is proportional to √T.'],
['At constant temperature, v_mp is proportional to','M','1/M','√M','1/√M',3,'From v_mp = √(2RT/M), the most probable speed varies as 1/√M.'],
['If the absolute temperature of a gas is increased four times, v_mp becomes','half','twice','four times','unchanged',1,'Because v_mp ∝ √T, increasing T by 4 makes v_mp twice as large.'],
['If v_mp of a gas is v at temperature T, at temperature 9T it is','v/3','v','3v','9v',2,'v_mp(9T) = √9 v = 3v.'],
['At the same temperature, which gas has the highest most probable speed?','O₂','N₂','H₂','CO₂',2,'At fixed T, v_mp ∝ 1/√M. H₂ has the smallest molar mass.'],
['For two gases at the same temperature, v_mp,1/v_mp,2 equals','√(M₁/M₂)','√(M₂/M₁)','M₁/M₂','M₂/M₁',1,'At the same T, v_mp ∝ 1/√M, so the ratio is √(M₂/M₁).'],
['The ratio of most probable speeds of H₂ and O₂ at the same temperature is approximately','1/2','1/4','4','16',2,'v_mp(H₂)/v_mp(O₂) = √(32/2) = √16 = 4.'],
['For N₂ with molar mass 28 g mol⁻¹ at temperature T, v_mp is proportional to','√(T/28)','√(28T)','28/√T','T/28',0,'With molar mass expressed consistently, v_mp = √(2RT/M), so it is proportional to √(T/M).'],
['The SI unit of most probable speed is','m','m s⁻¹','m s⁻²','J',1,'Speed is distance divided by time, so its SI unit is m s⁻¹.'],
['The three characteristic molecular speeds are related as','v_mp < v_avg < v_rms','v_avg < v_mp < v_rms','v_rms < v_avg < v_mp','v_mp = v_avg = v_rms',0,'For a Maxwell distribution, v_mp < v_avg < v_rms.'],
['Which expression represents the mean speed of gas molecules?','√(2RT/M)','√(3RT/M)','√(8RT/πM)','RT/M',2,'The average speed is v_avg = √(8RT/πM).'],
['Which expression represents the root-mean-square speed?','√(2RT/M)','√(3RT/M)','√(8RT/πM)','RT/M',1,'The RMS speed is v_rms = √(3RT/M).'],
['If the molar mass of a gas is increased four times at constant temperature, its most probable speed becomes','4v','2v','v/2','v/4',2,'Because v_mp ∝ 1/√M, four times the molar mass gives half the most probable speed.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
