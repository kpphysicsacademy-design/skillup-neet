<style>

.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}

.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🎯 Motion of Centre of Mass</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
  {
    "q": "The velocity of the centre of mass of a system is:",
    "o": [
      "Total mass divided by total momentum",
      "Total force divided by total momentum",
      "Always zero",
      "Total momentum divided by total mass"
    ],
    "a": 3,
    "e": "The relation is Vcm = Ptotal/Mtotal."
  },
  {
    "q": "If the net external force on a system is zero, its centre of mass moves with:",
    "o": [
      "Constant velocity",
      "Constant acceleration",
      "Increasing speed always",
      "Zero velocity in every frame"
    ],
    "a": 0,
    "e": "Zero net external force means total momentum stays constant, so centre-of-mass velocity is constant."
  },
  {
    "q": "A 2 kg particle moves at 3 m/s and a 1 kg particle moves at 6 m/s in the same direction. Vcm is:",
    "o": [
      "9 m/s",
      "4 m/s",
      "3 m/s",
      "5 m/s"
    ],
    "a": 1,
    "e": "Vcm = (2×3 + 1×6)/(2+1) = 12/3 = 4 m/s."
  },
  {
    "q": "A 2 kg particle moves right at 5 m/s while a 3 kg particle moves left at 2 m/s. Taking right as positive, Vcm is:",
    "o": [
      "2 m/s right",
      "3 m/s left",
      "0.8 m/s right",
      "1.4 m/s left"
    ],
    "a": 2,
    "e": "Vcm = (2×5 + 3×(−2))/5 = 4/5 = 0.8 m/s right."
  },
  {
    "q": "The acceleration of the centre of mass is equal to:",
    "o": [
      "Net internal force divided by total mass",
      "Total momentum multiplied by total mass",
      "Always gravitational acceleration",
      "Net external force divided by total mass"
    ],
    "a": 3,
    "e": "For a system, M aCM = Fexternal,net."
  },
  {
    "q": "A 6 kg system experiences a net external force of 18 N east. Its centre-of-mass acceleration is:",
    "o": [
      "3 m/s² east",
      "108 m/s² east",
      "12 m/s² east",
      "0.33 m/s² east"
    ],
    "a": 0,
    "e": "aCM = F/M = 18/6 = 3 m/s² east."
  },
  {
    "q": "A system has zero net external force and is initially at rest. Its centre of mass:",
    "o": [
      "Must move in a circle",
      "Remains at rest",
      "Starts moving due to internal forces",
      "Accelerates upward"
    ],
    "a": 1,
    "e": "With zero initial total momentum and no net external force, centre-of-mass velocity remains zero."
  },
  {
    "q": "Can particles move while the centre of mass remains at rest?",
    "o": [
      "Only if all masses are equal and stationary",
      "Only in the absence of internal forces",
      "Yes",
      "No, all particles must stop"
    ],
    "a": 2,
    "e": "Particles can move relative to one another while their total momentum remains zero."
  },
  {
    "q": "A firework explodes in mid-air. Neglecting air resistance, the centre of mass follows:",
    "o": [
      "The path of the largest fragment only",
      "A straight vertical line always",
      "A path that stops at the explosion",
      "The same parabolic trajectory as the unexploded projectile"
    ],
    "a": 3,
    "e": "Explosion forces are internal, so gravity alone determines the centre-of-mass trajectory."
  },
  {
    "q": "A person walks forward on a freely floating boat. With negligible horizontal external force, the boat moves:",
    "o": [
      "Backward",
      "Forward at the same speed always",
      "Not at all",
      "Vertically downward"
    ],
    "a": 0,
    "e": "The system's horizontal centre of mass stays fixed, so the boat shifts opposite to the person's motion."
  },
  {
    "q": "Total linear momentum of a system equals:",
    "o": [
      "Net force × total mass",
      "Total mass × centre-of-mass velocity",
      "Total mass ÷ centre-of-mass velocity",
      "Centre-of-mass position × time"
    ],
    "a": 1,
    "e": "Ptotal = Mtotal Vcm."
  },
  {
    "q": "A system has total mass 10 kg and centre-of-mass velocity 2 m/s north. Its momentum is:",
    "o": [
      "5 kg·m/s north",
      "0.2 kg·m/s north",
      "20 kg·m/s north",
      "12 kg·m/s north"
    ],
    "a": 2,
    "e": "P = MV = 10×2 = 20 kg·m/s north."
  },
  {
    "q": "If total momentum is 24 kg·m/s and total mass is 8 kg, the centre-of-mass speed is:",
    "o": [
      "16 m/s",
      "32 m/s",
      "192 m/s",
      "3 m/s"
    ],
    "a": 3,
    "e": "Vcm = P/M = 24/8 = 3 m/s."
  },
  {
    "q": "The centre-of-mass velocity of a system depends on:",
    "o": [
      "The mass-weighted average of particle velocities",
      "Only the fastest particle",
      "Only the heaviest particle's position",
      "The colour and shape of the particles"
    ],
    "a": 0,
    "e": "Vcm = Σmᵢvᵢ/Σmᵢ."
  },
  {
    "q": "Internal forces alone can change the total momentum of an isolated system.",
    "o": [
      "True if masses are equal",
      "False",
      "True for every collision",
      "True only for two particles"
    ],
    "a": 1,
    "e": "Internal forces cancel in pairs; without external force, total momentum is conserved."
  },
  {
    "q": "Two equal masses have velocities +6 m/s and −2 m/s along one line. Their centre-of-mass velocity is:",
    "o": [
      "−2 m/s",
      "0 m/s",
      "2 m/s in the positive direction",
      "4 m/s in the positive direction"
    ],
    "a": 2,
    "e": "For equal masses, Vcm is the average: (6−2)/2 = 2 m/s."
  },
  {
    "q": "A 1 kg particle moves at 8 m/s and a 3 kg particle moves at 0 m/s in the same frame. Vcm is:",
    "o": [
      "4 m/s",
      "6 m/s",
      "8 m/s",
      "2 m/s"
    ],
    "a": 3,
    "e": "Vcm = (1×8 + 3×0)/4 = 2 m/s."
  },
  {
    "q": "A 4 kg system accelerates at 2 m/s² west. The net external force is:",
    "o": [
      "8 N west",
      "2 N west",
      "6 N west",
      "0 N"
    ],
    "a": 0,
    "e": "Fexternal = M aCM = 4×2 = 8 N west."
  },
  {
    "q": "If the net external force points upward, the centre-of-mass acceleration points:",
    "o": [
      "Opposite to the external force",
      "Upward",
      "Downward",
      "Horizontally always"
    ],
    "a": 1,
    "e": "Centre-of-mass acceleration has the direction of the net external force."
  },
  {
    "q": "When every particle receives the same added velocity, the centre-of-mass velocity:",
    "o": [
      "Becomes zero always",
      "Doubles in every case",
      "Changes by that same velocity",
      "Remains unchanged"
    ],
    "a": 2,
    "e": "A mass-weighted average increases by the same vector when that vector is added to every particle velocity."
  },
  {
    "q": "A system's centre of mass moves at constant velocity. For fixed total mass, the net external force is:",
    "o": [
      "Constant and nonzero",
      "Always equal to the system's weight",
      "Infinite",
      "Zero"
    ],
    "a": 3,
    "e": "Constant centre-of-mass velocity means zero acceleration, so net external force is zero."
  },
  {
    "q": "A system's centre of mass can be outside the material occupied by the particles.",
    "o": [
      "Yes, depending on the mass distribution",
      "No, never",
      "Only when total mass is zero",
      "Only if the particles are moving"
    ],
    "a": 0,
    "e": "Centre of mass is a weighted position and need not lie within the material itself."
  },
  {
    "q": "For a system moving under gravity alone, the centre of mass accelerates:",
    "o": [
      "At a value depending only on total mass",
      "Downward at g",
      "Upward at g",
      "At zero acceleration"
    ],
    "a": 1,
    "e": "If gravity is the only external force and acts uniformly, aCM = Mg/M = g downward."
  },
  {
    "q": "A 2 kg particle at 4 m/s and a 2 kg particle at −4 m/s have centre-of-mass velocity:",
    "o": [
      "−4 m/s",
      "2 m/s",
      "0 m/s",
      "4 m/s"
    ],
    "a": 2,
    "e": "Equal and opposite momenta cancel, so total momentum and Vcm are zero."
  },
  {
    "q": "A system has total momentum 30 kg·m/s west and total mass 6 kg. Vcm is:",
    "o": [
      "180 m/s west",
      "24 m/s west",
      "0.2 m/s west",
      "5 m/s west"
    ],
    "a": 3,
    "e": "Vcm = P/M = 30/6 = 5 m/s west."
  },
  {
    "q": "Which statement about the centre of mass is correct?",
    "o": [
      "Its motion is governed by the net external force",
      "Its motion is governed only by internal forces",
      "It is always at the geometric centre",
      "It always remains stationary"
    ],
    "a": 0,
    "e": "The system equation M aCM = Fexternal,net determines its motion."
  },
  {
    "q": "A 5 kg system has a net external force of 0 N while its centre of mass moves at 7 m/s east. After 3 s, its centre of mass has moved:",
    "o": [
      "0 m",
      "21 m east",
      "10 m east",
      "7 m east"
    ],
    "a": 1,
    "e": "Velocity remains constant: displacement = vt = 7×3 = 21 m east."
  },
  {
    "q": "A system's centre of mass has velocity 4 m/s and total mass 3 kg. Its total momentum is:",
    "o": [
      "1.33 kg·m/s",
      "0.75 kg·m/s",
      "12 kg·m/s",
      "7 kg·m/s"
    ],
    "a": 2,
    "e": "P = MV = 3×4 = 12 kg·m/s."
  },
  {
    "q": "Why can an explosion change fragment velocities without changing centre-of-mass motion instantly?",
    "o": [
      "All fragments have equal masses",
      "Gravity disappears during explosion",
      "Momentum is a scalar",
      "Explosion forces are internal to the system"
    ],
    "a": 3,
    "e": "Internal explosion forces redistribute momentum among fragments but do not change total system momentum."
  },
  {
    "q": "If the net external impulse on a system is zero during an interval, its total momentum:",
    "o": [
      "Remains unchanged",
      "Must become zero",
      "Doubles",
      "Changes direction necessarily"
    ],
    "a": 0,
    "e": "Impulse equals change in momentum; zero net external impulse means no change in total momentum."
  }
];
let index=0,score=0,streak=0,chosen=null,locked=false;
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Nice work!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><button class="btn" id="retry">Practice again</button>';
 $('finishSlot').replaceChildren(card);$('retry').addEventListener('click',()=>{index=0;score=0;streak=0;$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
