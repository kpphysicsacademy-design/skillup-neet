<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Motion of Centre of Mass</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-size:1.6rem;font-weight:900}.subtitle{color:#5f6b7a;margin:0 0 18px}.xp,.card{background:#fff;border-radius:20px;box-shadow:0 6px 20px #17203312}.xp{padding:10px 15px;font-weight:850}.card{padding:20px;margin:12px 0}.ph{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:11px;background:#dfe8f1;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.25s}.qnum{font-weight:800;color:#35516f;margin-bottom:11px}.question{font-size:1.27rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#58cc02;background:#f7fff1;transform:translateY(-1px)}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;background:#2db84d;color:#fff;font-weight:850;cursor:pointer;box-shadow:0 4px 0 #21863a;transition:.12s}.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #21863a}.feedback{margin-top:14px;padding:12px;border-radius:13px;font-weight:700;min-height:18px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:10px;padding:10px 13px;border:2px solid #d9d4f5;border-radius:13px;color:#5146a5;font-weight:800;text-decoration:none;transition:.12s}.back:hover{background:#f0edff;transform:translateX(-2px)}@media(max-width:600px){.wrap{padding:20px 14px}.title{font-size:1.4rem}.question{font-size:1.12rem}}</style></head><body><main class="wrap"><div class="top"><div class="title">🎯 Motion of Centre of Mass</div><div class="xp">⚡ <span id="xp">0</span> XP</div></div><p class="subtitle">Physics • NEET 2026 · Learn → Practice → Master</p><section class="card"><div class="ph"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><button class="btn" id="continue">Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const quiz=[['The velocity of the centre of mass of a system is related to total linear momentum P by:', ['P = M V_CM','P = M/a_CM','P = V_CM/M','P = M + V_CM'],0,'Total momentum equals total mass multiplied by CM velocity.'],['If no external force acts on a system, its centre of mass moves with:', ['constant velocity','constant acceleration','increasing velocity','zero velocity necessarily'],0,'With zero net external force, V_CM remains constant.'],['The equation governing centre-of-mass motion is:', ['M a_CM = F_ext','M a_CM = F_internal','M V_CM = F_ext','a_CM = M F_ext'],0,'The total external force determines CM acceleration.'],['Internal forces between particles of an isolated system:', ['do not change the motion of the centre of mass','always accelerate the centre of mass','change total momentum','make the centre of mass stationary'],0,'Internal forces cancel pairwise in the total momentum equation.'],['A system initially has zero centre-of-mass velocity and no external force. Its centre of mass will:', ['remain at rest','move with increasing speed','move in a circle','move with acceleration g'],0,'Zero initial CM velocity plus zero external force gives zero CM velocity at all times.'],['A 5 kg system has net external force 20 N. The acceleration of its centre of mass is:', ['4 m/s²','0.25 m/s²','25 m/s²','100 m/s²'],0,'a_CM = F_ext/M = 20/5 = 4 m/s².'],['If every particle in a system receives the same velocity increment Δv, the CM velocity changes by:', ['Δv','2Δv','Δv/2','zero'],0,'The CM velocity receives the same common velocity increment.'],['During an explosion of a body in free space, with external impulse negligible, the centre of mass:', ['continues with its pre-explosion motion','stops instantly','moves toward the heaviest fragment','moves randomly'],0,'An explosion involves internal forces, so negligible external impulse leaves CM momentum unchanged.'],['The centre of mass of a two-particle system lies closer to:', ['the more massive particle','the less massive particle','the midpoint always','the origin always'],0,'The mass-weighted average places the CM closer to the larger mass.'],['Two equal masses move with velocities +v and -v along the same line. Their centre-of-mass velocity is:', ['zero','v','-v','2v'],0,'Equal and opposite momenta cancel, giving V_CM = 0.'],['A system moves under a constant external force. Its centre of mass has:', ['constant acceleration','constant velocity always','zero acceleration','acceleration depending only on internal forces'],0,'For constant total mass and constant external force, a_CM is constant.'],['For a projectile treated as a system of fragments after an internal explosion, the centre of mass follows:', ['the trajectory determined by external forces','the path of the heaviest fragment','a random path','a path with no gravity'],0,'The CM responds only to the net external force.'],['If the net external force is zero, total linear momentum and CM velocity are:', ['both conserved','both necessarily zero','both increasing','both determined by internal forces'],0,'P_total = M V_CM and remains constant when external force is zero.'],['A person walks inside a boat initially at rest on still water. Neglecting external horizontal force, the centre of mass of the person-boat system:', ['remains at rest horizontally','moves with the person','moves with the boat','accelerates toward the person'],0,'No external horizontal force means horizontal CM position remains fixed for the isolated system.'],['For a system in a uniform gravitational field, the centre of mass accelerates as if:', ['the total mass were concentrated at the CM','only the heaviest particle were present','gravity were absent','each particle had a different acceleration due to g'],0,'Uniform gravity gives F_ext = Mg, so a_CM = g.']];let i=0,selected=-1,checked=false,score=0;const $=id=>document.getElementById(id),o=$("options"),b=$("continue"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;$("count").textContent='Question '+(i+1)+' of 15';$("question").textContent=a[0];o.innerHTML='';f.className='feedback';f.textContent='';b.style.display='inline-block';b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const el=document.createElement('button');el.className='option';el.textContent=String.fromCharCode(65+j)+'. '+item.text;el.dataset.index=item.index;el.onclick=()=>{selected=item.index;[...o.children].forEach(z=>z.classList.remove('selected'));el.classList.add('selected')};o.appendChild(el)})}b.onclick=()=>{if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(el=>{const n=Number(el.dataset.index);el.disabled=true;if(n===a[2])el.classList.add('correct');if(n===selected&&!ok)el.classList.add('wrong')});if(ok)score++;f.className=ok?'feedback good':'feedback bad';f.textContent=(ok?'🎯 Correct! +10 XP — ':'✗ Review — Correct answer: '+a[1][a[2]]+'. ')+a[3];$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$("question").textContent='🏆 Motion of Centre of Mass Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
