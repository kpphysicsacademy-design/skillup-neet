<script>
const questions=[["A charged particle entering a uniform magnetic field perpendicular to B moves in a",["straight line","circle","parabola","ellipse"],1,"The magnetic force is perpendicular to velocity and acts as centripetal force, producing circular motion."],["The radius of circular motion of a charge q with speed v in magnetic field B is",["qB/(mv)","mv/(|q|B)","|q|B/(mv)","mB/(|q|v)"],1,"From |q|vB=mv²/r, r=mv/(|q|B)."],["The angular frequency of a charged particle in a uniform magnetic field is",["|q|B/m","m/(|q|B)","|q|/(mB)","mB/|q|"],0,"The cyclotron angular frequency is ω=|q|B/m."],["The time period of circular motion is",["2π|q|B/m","2πm/(|q|B)","m/(2π|q|B)","2πmv/(|q|B)"],1,"T=2π/ω=2πm/(|q|B)."],["If the speed of a particle is doubled in a uniform B perpendicular to its motion, its orbital radius",["halves","doubles","remains unchanged","quadruples"],1,"Since r=mv/(|q|B), radius is directly proportional to speed."],["If B is doubled while v, m and q remain constant, the orbital radius",["doubles","halves","remains unchanged","quadruples"],1,"Since r∝1/B, doubling B halves the radius."],["The magnetic force acting on a particle in circular motion is directed",["along velocity","toward the center of the circle","away from center","along B"],1,"The magnetic force provides centripetal force and points toward the center."],["A charged particle moves perpendicular to a 2 T field at 4 m/s. If |q|=3 C and m=2 kg, its orbit radius is",["1 m","4/3 m","2/3 m","3 m"],1,"r=mv/(qB)=2×4/(3×2)=4/3 m."],["A particle moving in a magnetic field with a velocity component parallel to B experiences",["magnetic force from the parallel component","no magnetic force from the parallel component","maximum force from the parallel component","force opposite B"],1,"Only the velocity component perpendicular to B contributes to magnetic force."],["If a charged particle has both parallel and perpendicular velocity components in uniform B, its path is",["straight","circular","helical","parabolic"],2,"The perpendicular component produces circular motion while the parallel component gives uniform axial motion."],["The pitch of the helical path is the distance traveled parallel to B in",["one second","one complete revolution","half revolution","one metre"],1,"Pitch is the distance advanced along the field during one complete revolution."],["For helical motion, the parallel component of velocity",["changes continuously due to B","remains constant","becomes zero immediately","doubles every revolution"],1,"Magnetic force has no component parallel to B, so v_parallel remains constant."],["The kinetic energy of a charged particle moving only under a uniform magnetic field",["increases","decreases","remains constant","becomes zero"],2,"Magnetic force does no work, so speed and kinetic energy remain constant."],["The frequency of revolution of a charged particle in a uniform B is independent of",["charge magnitude","mass","magnetic field","speed"],3,"For nonrelativistic circular motion, f=|q|B/(2πm), independent of speed."],["A particle enters a uniform magnetic field at an angle of 90° to B. The component of velocity parallel to B is",["v","v/2","zero","2v"],2,"At 90°, all velocity is perpendicular to B, so v_parallel=0 and the path is circular."],["A particle has v perpendicular to B. If momentum doubles while |q| and B stay fixed, the radius",["halves","doubles","quadruples","does not change"],1,"The radius is r=p/(|q|B), so doubling momentum doubles the radius."],["A proton and an alpha particle have the same speed and enter the same B perpendicular to it. Their radius ratio r_alpha/r_proton is",["1/2","1","2","4"],2,"The alpha particle has twice the proton charge and about four times its mass, so its radius ratio is (4/2)=2."],["For a negative charge moving to the right in a magnetic field directed out of the page, the magnetic force is directed",["upward","downward","into the page","out of the page"],0,"For a positive charge v×B points downward; a negative charge experiences the opposite force, upward."],["A charged particle moves parallel to a uniform magnetic field. Its magnetic force magnitude is",["|q|vB","|q|vB/2","zero","|q|B/v"],2,"The magnetic force magnitude is |q|vB sinθ; for parallel motion θ=0, so it is zero."],["A particle enters B with speed v at angle θ to the field. The radius of its helical path is",["mv/(|q|B)","mv cosθ/(|q|B)","mv sinθ/(|q|B)","|q|B/(mv sinθ)"],2,"Only the perpendicular component v sinθ produces circular motion, giving r=mv sinθ/(|q|B)."],["For a helical path, the pitch is",["2πm v_perp/(|q|B)","v_parallel × T","2πm v_parallel/(|q|B)","v_perp × T"],2,"Pitch p=v_parallel T and T=2πm/(|q|B), so p=2πm v_parallel/(|q|B)."],["A particle completes 5 revolutions in 0.2 s. Its frequency is",["1 Hz","5 Hz","25 Hz","0.04 Hz"],2,"Frequency is revolutions per second: f=5/0.2=25 Hz."],["If the mass of a particle doubles while |q| and B stay constant, its cyclotron frequency",["doubles","halves","quadruples","is unchanged"],1,"The frequency f=|q|B/(2πm) is inversely proportional to mass."],["If the magnitude of charge doubles while m and B remain fixed, the cyclotron period",["doubles","halves","is unchanged","quadruples"],1,"T=2πm/(|q|B), so doubling |q| halves the period."],["A particle in a uniform magnetic field follows a circular path because the magnetic force is",["parallel to velocity","perpendicular to velocity","opposite to B always","constant in direction"],1,"The force is perpendicular to instantaneous velocity and acts as centripetal force."],["Which quantity remains constant for nonrelativistic motion under only a static magnetic field?",["Speed","Direction of velocity","Momentum direction","Position vector"],0,"Magnetic force does no work, so speed and kinetic energy remain constant."],["A particle’s perpendicular speed doubles in the same magnetic field, with mass and charge unchanged. The cyclotron period",["doubles","halves","remains the same","becomes four times"],2,"The period depends on m, |q| and B, not on speed in the nonrelativistic model."],["A particle moves at 3 m/s perpendicular to B=0.5 T. Its charge magnitude is 2×10⁻⁶ C and mass is 3×10⁻⁶ kg. The radius is",["3 m","6 m","9 m","12 m"],2,"r=mv/(|q|B)=(3×10⁻⁶×3)/(2×10⁻⁶×0.5)=9 m."],["A particle’s path becomes a helix instead of a circle when its velocity has",["only a perpendicular component","a nonzero component parallel to B","zero magnitude","no perpendicular component"],1,"A nonzero parallel component produces uniform motion along B while the perpendicular component produces circular motion."],["In a uniform magnetic field, the time for one complete revolution depends on",["initial speed only","orbit radius only","mass, charge magnitude and field strength","pitch only"],2,"T=2πm/(|q|B); speed, radius and pitch do not appear in this expression."]];
let activeQuestions=questions.slice();
let index=0,chosen=null,locked=false,xp=0,streak=0,bestStreak=0,correctCount=0,wrong=[];
const $=id=>document.getElementById(id);
function render(){chosen=null;locked=false;$('count').textContent='Question '+(index+1)+' of '+activeQuestions.length;$('qnum').textContent='QUESTION '+(index+1);$('percent').textContent=Math.round(index/activeQuestions.length*100)+'%';$('fill').style.width=(index/activeQuestions.length*100)+'%';$('xp').textContent=xp;$('streak').textContent=streak;$('question').textContent=activeQuestions[index][0];$('options').innerHTML='';activeQuestions[index][1].forEach((value,n)=>{const b=document.createElement('button');b.type='button';b.className='option';b.innerHTML='<span class="letter">'+String.fromCharCode(65+n)+'</span><span></span>';b.lastElementChild.textContent=value;b.addEventListener('click',()=>{if(locked)return;chosen=n;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b)});$('check').classList.remove('hidden');$('check').disabled=true;$('feedback').className='feedback';$('feedback').textContent='';$('continue').classList.add('hidden');if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();}
function check(){if(chosen===null||locked)return;locked=true;const q=activeQuestions[index],ok=chosen===q[2];document.querySelectorAll('.option').forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add('correct');if(n===chosen&&!ok)b.classList.add('wrong')});if(ok){xp+=10;streak++;bestStreak=Math.max(bestStreak,streak);correctCount++;$('feedback').className='feedback show';$('feedback').innerHTML='<strong>✅ Correct! +10 XP</strong>'+q[3]}else{streak=0;wrong.push({index,chosen,correct:q[2]});$('feedback').className='feedback show bad';$('feedback').innerHTML='<strong>Not quite.</strong>'+q[3]}$('xp').textContent=xp;$('streak').textContent=streak;$('check').classList.add('hidden');$('continue').classList.remove('hidden');if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();}
function next(){if(index<activeQuestions.length-1){index++;render()}else finish()}
function resetQuiz(onlyWrong){const previous=activeQuestions.slice();activeQuestions=onlyWrong?wrong.map(w=>previous[w.index]).filter(Boolean):questions.slice();index=0;chosen=null;locked=false;xp=0;streak=0;bestStreak=0;correctCount=0;wrong=[];$('xp').textContent='0';$('streak').textContent='0';$('quizcard').classList.remove('hidden');$('result').classList.add('hidden');render();}
function finish(){$('quizcard').classList.add('hidden');$('percent').textContent='100%';$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hidden');let review=wrong.length?'<div class="review"><h3>Review your mistakes</h3>'+wrong.map(w=>{const q=activeQuestions[w.index];return '<div class="review-item"><b>Q'+(w.index+1)+'. '+q[0]+'</b><p class="small">Your answer: '+String.fromCharCode(65+w.chosen)+'. '+q[1][w.chosen]+'</p><p><b>Correct:</b> '+String.fromCharCode(65+q[2])+'. '+q[1][q[2]]+'</p><p>'+q[3]+'</p></div>'}).join('')+'</div>':'<p>Perfect run — no incorrect answers to review!</p>';$('result').innerHTML='<h2>🎉 Motion of Charge Complete!</h2><p class="scorebig">'+correctCount+' / '+activeQuestions.length+' correct</p><p>You earned <b>'+xp+' XP</b> · Best streak this run: <b>'+bestStreak+'</b></p>'+review+(wrong.length?'<button class="primary" id="retryWrong">Retry wrong answers ('+wrong.length+') ↻</button>':'')+'<button class="primary" id="retry">Practice all questions again</button>';$('retry').onclick=()=>resetQuiz(false);const rw=$('retryWrong');if(rw)rw.onclick=()=>resetQuiz(true);if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();}
$('check').addEventListener('click',check);$('continue').addEventListener('click',next);render();
</script><script src="/skillup-eye-shield.js?v=20261013-eye-shield-v1"></script><script src="/shared-nav.js?v=20261013-no-bottom-nav-v1"></script></body></html>
