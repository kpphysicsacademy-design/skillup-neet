const qs=[
['A charged particle entering a uniform magnetic field perpendicular to B moves in a','straight line','circle','parabola','ellipse',1,'The magnetic force is perpendicular to velocity and acts as centripetal force, producing circular motion.'],
['The radius of circular motion of a charge q with speed v in magnetic field B is','qB/(mv)','mv/(|q|B)','|q|B/(mv)','mB/(|q|v)',1,'From |q|vB=mv²/r, r=mv/(|q|B).'],

['The time period of circular motion is','2π|q|B/m','2πm/(|q|B)','m/(2π|q|B)','2πmv/(|q|B)',1,'T=2π/ω=2πm/(|q|B).'],

['A charged particle moves perpendicular to a 2 T field at 4 m/s. If |q|=3 C and m=2 kg, its orbit radius is','1 m','4/3 m','2/3 m','3 m',2,'r=mv/(qB)=2×4/(3×2)=4/3 m.'],
['A particle moving in a magnetic field with a velocity component parallel to B experiences','magnetic force from the parallel component','no magnetic force from the parallel component','maximum force from the parallel component','force opposite B',1,'Only the velocity component perpendicular to B contributes to magnetic force.'],

['The kinetic energy of a charged particle moving only under a uniform magnetic field','increases','decreases','remains constant','becomes zero',2,'Magnetic force does no work, so speed and kinetic energy remain constant.'],

,

['A proton and an alpha particle have the same speed and enter the same B perpendicular to it. Their radius ratio r_alpha/r_proton is','1/2','1','2','4',2,'The alpha particle has twice the proton charge and about four times its mass, so its radius ratio is (4/2)=2.'],

let index=0,chosen=null,locked=false,xp=0,streak=0,bestStreak=0,correctCount=0,wrong=[];

function next(){if(index<qs.length-1){index++;render()}else finish()}
function finish(){$('quizcard').classList.add('hidden');$('percent').textContent='100%';$('fill').style.width='100%';$('count').textContent='Quiz complete!';$('result').classList.remove('hidden');const review=wrong.length?'<div class="review"><h2>Review your mistakes</h2>'+wrong.map(w=>{const q=qs[w.index];return '<div class="review-item"><b>Q'+(w.index+1)+'. '+q[0]+'</b><p>Your answer: '+String.fromCharCode(65+w.chosen)+'. '+q[w.chosen+1]+'</p><p><b>Correct answer:</b> '+String.fromCharCode(65+q[5])+'. '+q[q[5]+1]+'</p><p>'+q[6]+'</p></div>'}).join('')+'</div>':'<p>Perfect run — no incorrect answers to review!</p>';$('result').innerHTML='<div class="eyebrow">LEARNING COMPLETE</div><h2>🎉 Quiz complete!</h2><div class="score">'+correctCount+' / '+qs.length+'</div><p style="text-align:center">Correct answers · '+xp+' XP earned · Best streak '+bestStreak+'</p>'+review+'<button class="btn primary" id="retry">Retry quiz ↻</button>';$('retry').onclick=()=>location.reload();typeset();}
