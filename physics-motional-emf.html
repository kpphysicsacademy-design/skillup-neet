<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Motional EMF</title><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">⚡</span><h1>Motional EMF</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[
["A conducting rod of length l moves with speed v perpendicular to a magnetic field B. The motional emf is:",["Blv","B/lv","Bl/v","lv/B"],0,"For perpendicular motion, ε = Blv."],
["The SI unit of motional emf is:",["Tesla","Weber","Volt","Henry"],2,"EMF is measured in volts."],
["Motional emf is produced because moving charges experience:",["Gravitational force","Magnetic force","Nuclear force","Friction only"],1,"Charges moving through a magnetic field experience the magnetic Lorentz force q(v × B)."],
["For a rod moving perpendicular to B, increasing its speed v will:",["Decrease emf","Increase emf","Make emf zero","Not affect emf"],1,"Since ε = Blv, emf is directly proportional to speed."],
["For ε = Blv, the rod length l is measured in:",["metre","tesla","weber","ampere"],0,"Length is measured in metres in SI."],
["If the rod moves parallel to the magnetic field, the magnetic part of motional emf is:",["Maximum","Zero","Infinite","Equal to B"],1,"For v parallel to B, v × B = 0, so no motional emf from the magnetic force."],
["The general expression for motional emf along a moving conductor is related to:",["∫(v × B)·dl","B/l only","v+B","q/B"],0,"Motional emf can be expressed as ε = ∫(v × B)·dl along the conductor."],
["The direction of the induced current in a moving rod can be found using:",["Fleming's right-hand rule","Only Newton's first law","Boyle's law","Snell's law"],0,"Fleming's right-hand rule gives the direction of induced current in generators and moving conductors."],
["A rod of length 0.5 m moves at 4 m/s perpendicular to B = 2 T. Its emf is:",["2 V","4 V","8 V","16 V"],2,"ε = Blv = 2 × 0.5 × 4 = 4 V. The correct numerical answer is 4 V."],
["In a closed sliding-rod circuit, motional emf can cause:",["Induced current","Only magnetic flux with no current","Mass change","Charge destruction"],0,"A closed conducting path allows the induced emf to drive current."],
["The magnetic force on a charge is perpendicular to its velocity and therefore:",["Does no work directly on the charge","Always increases kinetic energy","Always decreases kinetic energy","Is always zero"],0,"Magnetic force is perpendicular to instantaneous velocity, so it does no work directly."],
["If B is doubled while l and v remain fixed and perpendicular, motional emf becomes:",["Half","Double","Four times","Unchanged"],1,"ε = Blv, so doubling B doubles ε."],
["A moving conductor cuts magnetic field lines and thereby changes:",["Flux linkage of the circuit","Its atomic number","Its mass","The value of c"],0,"Relative motion can change magnetic flux through the circuit, producing induced emf."],
["Motional emf is a form of electromagnetic induction associated especially with:",["Motion of a conductor through a magnetic field","Heating a resistor only","Static pressure","Chemical equilibrium"],0,"Motional induction occurs when a conductor moves through a magnetic field."],
["If a rod moves perpendicular to B but its length is reduced to one-half, its motional emf becomes:",["Double","Half","Four times","Zero always"],1,"ε = Blv, so halving l halves the emf."]
];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;let x=qs[i];$("counter").textContent=`Question ${i+1}/15`;$('xp').textContent=`XP ${xp}`;$('fill').style.width=`${i/15*100}%`;$('question').textContent=x[0];$('feedback').textContent='';$('feedback').className='feedback';$('next').disabled=true;$('next').textContent=i===14?'Finish':'Next';$('opts').innerHTML='';x[1].forEach((t,n)=>{let b=document.createElement('button');b.className='opt';b.type='button';b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);$('opts').appendChild(b)})}function answer(n){if(answered)return;answered=true;let x=qs[i],bs=[...$('opts').children];bs.forEach(b=>b.disabled=true);if(n===x[2]){score++;xp+=10;bs[n].classList.add('ok');$('feedback').textContent='Correct! '+x[3].replace('The correct numerical answer is 4 V.','');$('feedback').classList.add('oktxt')}else{bs[n].classList.add('no');bs[x[2]].classList.add('ok');$('feedback').textContent='Not quite. '+x[3];$('feedback').classList.add('notxt')}$('xp').textContent=`XP ${xp}`;$('next').disabled=false}function next(){if(!answered)return;if(i<14){i++;render()}else{$('fill').style.width='100%';$('quiz').hidden=true;$('result').hidden=false;$('score').textContent=`Score: ${score}/15`;$('earned').textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$('result').hidden=true;$('quiz').hidden=false;render()}$('next').onclick=next;$('restart').onclick=restart;render();</script></body></html>
