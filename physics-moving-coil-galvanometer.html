<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Moving Coil Galvanometer</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>⚡ Moving Coil Galvanometer</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['The working principle of a moving coil galvanometer is based on','torque on a current-carrying coil in a magnetic field','electromagnetic induction only','heating effect of current','photoelectric effect',0,'A current-carrying coil placed in a magnetic field experiences a torque.'],['The deflecting torque on a moving coil galvanometer is','NIAB','NIA/B','NB/IA','IA/NB',0,'The magnetic torque is τ=NIAB for a radial magnetic field.'],['The restoring torque of a galvanometer is proportional to','deflection θ','current squared','magnetic field only','1/θ',0,'The spring provides restoring torque τr=kθ.'],['At equilibrium in a moving coil galvanometer','NIAB=kθ','NIAB=k/θ','NIA=kBθ²','θ=NIABk',0,'At equilibrium, deflecting and restoring torques are equal: NIAB=kθ.'],['The current sensitivity of a galvanometer is','θ/I=NAB/k','θ/I=k/NAB','I/θ=NAB/k','θI=NAB/k',0,'From NIAB=kθ, θ/I=NAB/k.'],['The voltage sensitivity of a galvanometer, with coil resistance G, is','θ/V=NAB/(kG)','θ/V=NABG/k','θ/V=kNABG','θ/V=Gk/NAB',0,'Since V=IG, θ/V=(θ/I)/G=NAB/(kG).'],['A galvanometer has N=100 turns, area 2×10⁻⁴ m², B=0.5 T and torsional constant k=10⁻⁷ N m/rad. Its current sensitivity θ/I is','100 rad/A','10 rad/A','1000 rad/A','0.1 rad/A',0,'θ/I=NAB/k=(100×2×10⁻⁴×0.5)/10⁻⁷=100 rad/A.'],['To increase the current sensitivity of a galvanometer, one can','increase N, A or B, or decrease k','decrease N and A','increase k only','decrease B only',0,'Current sensitivity is NAB/k, so increasing N, A, B or decreasing k increases sensitivity.'],['A radial magnetic field in a moving coil galvanometer is used so that','the coil remains in a position where sinθ=1','the torque becomes zero','the restoring torque disappears','current becomes zero',0,'The radial field keeps the coil sides effectively perpendicular to B, making torque proportional to current throughout deflection.'],['The pointer deflection of an ideal moving coil galvanometer is proportional to','current','current squared','resistance only','magnetic field inverse',0,'For constant N, A, B and k, NIAB=kθ, so θ∝I.'],['A galvanometer is converted into an ammeter by connecting','a low resistance shunt in parallel','a high resistance in series','a capacitor in parallel','a diode in series',0,'A low-resistance shunt bypasses most of the current around the galvanometer.'],['A galvanometer is converted into a voltmeter by connecting','a high resistance in series','a low resistance in parallel','a capacitor in series only','a shunt of zero resistance',0,'A high series resistance limits current when measuring potential difference.'],['For a galvanometer of resistance G and full-scale current Ig, the shunt S required to convert it into an ammeter of range I is','S=IgG/(I−Ig)','S=I G/Ig','S=(I−Ig)G','S=I/IgG',0,'The galvanometer and shunt are in parallel: IgG=(I−Ig)S.'],['For a galvanometer of resistance G and full-scale current Ig, the series resistance R required for a voltmeter of range V is','R=V/Ig−G','R=IgV−G','R=G−V/Ig','R=V G/Ig',0,'For full-scale deflection, V=Ig(G+R), hence R=V/Ig−G.'],['The figure of merit of a galvanometer is','current required per unit deflection','deflection per unit current','resistance per unit current','voltage per unit deflection only',0,'The figure of merit k_g is commonly defined as current required to produce unit deflection, i.e. I/θ.']];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent=''}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});if(ok){score++;$('xp').textContent='✨ Correct! +1 XP'}else $('xp').textContent='❌ Incorrect. '+q[6];$('score').textContent=`XP ${score}`;$('next').classList.remove('hide')}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('next').onclick=next;render();</script></body></html>
