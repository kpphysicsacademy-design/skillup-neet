<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🧲 Mutual Inductance</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:13px"><a href="physics-mutual-inductance-learn.html" style="display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 15px;border-radius:13px;background:#e8f7ff;border:2px solid #bfe6fa;color:#17618e;text-decoration:none;font-weight:900">📘 Learn this topic</a></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
["Mutual induction is the phenomenon in which a changing current in one coil induces emf in:",["The same coil only","A nearby coupled coil","An insulating plate","A stationary charge"],1,"A changing magnetic flux from one coil links the second coil and induces emf in it."],
["The SI unit of mutual inductance is:",["Weber","Tesla","Henry","Farad"],2,"Mutual inductance is measured in henry (H)."],
["The magnitude of induced emf in coil 2 is:",["M × |dI₁/dt|","M × I₁","I₁/M","M × resistance"],0,"From e₂ = −M(dI₁/dt), the magnitude is M|dI₁/dt|."],
["The negative sign in the mutual induction equation represents:",["Ohm’s law","Lenz’s law","Coulomb’s law","Joule’s law"],1,"The induced emf opposes the change in flux that produces it."],
["If M = 0.5 H and the primary current changes at 4 A s⁻¹, induced emf magnitude is:",["0.125 V","2 V","4 V","8 V"],1,"|e| = 0.5 × 4 = 2 V."],
["Mutual inductance depends on:",["Only the current value","Only wire resistance","Coil geometry, turns and magnetic coupling","Only battery emf"],2,"Turns, shape, area, orientation, separation and core permeability affect M."],
["For two coils, the relation among M, L₁, L₂ and coupling coefficient k is:",["M = k√(L₁L₂)","M = L₁ + L₂","M = kL₁L₂","M = √(L₁/L₂)"],0,"M = k√(L₁L₂), where 0 ≤ k ≤ 1."],
["If L₁ = 4 H, L₂ = 9 H and k = 0.5, M is:",["1 H","2 H","3 H","6 H"],2,"M = 0.5√(4 × 9) = 0.5 × 6 = 3 H."],
["If the current in the primary coil is steady, the induced emf in the secondary is:",["Zero","Maximum","Infinite","Equal to primary current"],0,"Steady current produces steady flux, so dI/dt = 0 and induced emf is zero."],
["One henry of mutual inductance produces 1 V when current changes at:",["1 A","1 A s⁻¹","1 C s⁻¹","1 Wb s⁻¹"],1,"By definition, 1 H gives 1 V for a current-change rate of 1 A per second."],
["If M = 0.2 H and current changes by 3 A in 0.1 s, induced emf magnitude is:",["0.6 V","3 V","6 V","60 V"],2,"Rate = 3/0.1 = 30 A s⁻¹; emf = 0.2 × 30 = 6 V."],
["The coefficient of coupling k for two coils can have values in the range:",["k < 0 only","0 to 1","1 to 2","Any value above 1"],1,"The fraction of flux linked is between zero and one."],
["For perfect magnetic coupling, the coefficient of coupling is:",["0","0.5","1","2"],2,"Perfect coupling means all relevant flux links the other coil, so k = 1."],
["If L₁ = 2 H, L₂ = 8 H and M = 2 H, the coefficient k is:",["0.25","0.5","0.75","1"],1,"k = M/√(L₁L₂) = 2/√16 = 0.5."],
["The flux linkage of coil 2 due to current I₁ in coil 1 is:",["N₂Φ₂₁","N₁I₁","I₁/N₂","Φ₂₁/I₁"],0,"Flux linkage is number of turns multiplied by flux through each turn."],
["A transformer works mainly on the principle of:",["Self-induction alone","Mutual induction","Electrostatic induction","Thermoelectric effect"],1,"Changing flux produced by the primary links the secondary and induces emf."],
["A transformer normally cannot operate on steady DC because:",["DC has no voltage","The flux does not continuously change","The core has no permeability","The secondary has no turns"],1,"After the switching transient, steady DC gives constant flux and no continuing induced emf."],
["In an ideal step-up transformer:",["Nₛ < Nₚ","Nₛ = Nₚ","Nₛ > Nₚ","Nₛ = 0"],2,"A step-up transformer has more secondary turns than primary turns."],
["For an ideal transformer, the voltage ratio is:",["Vₛ/Vₚ = Nₛ/Nₚ","Vₛ/Vₚ = Nₚ/Nₛ","VₛVₚ = Nₛ + Nₚ","Vₛ = Vₚ always"],0,"The induced voltage ratio equals the turns ratio in an ideal transformer."],
["If primary current changes from 1 A to 5 A in 2 s and M = 0.3 H, emf magnitude is:",["0.3 V","0.6 V","1.2 V","2.4 V"],1,"Rate = (5 − 1)/2 = 2 A s⁻¹; emf = 0.3 × 2 = 0.6 V."],
["Which change generally increases mutual inductance?",["Increasing magnetic coupling","Increasing coil separation greatly","Turning coils perpendicular","Removing a high-permeability core"],0,"Stronger coupling increases the flux from one coil linking the other."],
["Leakage flux is the part of magnetic flux that:",["Links both coils","Does not link the other coil","Is always zero","Exists only in vacuum"],1,"Leakage flux fails to link the coupled winding."],
["The dimensional formula of inductance is:",["[ML²T⁻²A⁻²]","[MLT⁻²A⁻¹]","[M⁰L²T⁻¹A⁻¹]","[ML²T⁻¹A⁻²]"],0,"Henry = volt-second per ampere, giving [ML²T⁻²A⁻²]."],
["If M = 1.5 H and |dI/dt| = 2 A s⁻¹, induced emf magnitude is:",["0.75 V","1.5 V","3 V","4.5 V"],2,"|e| = 1.5 × 2 = 3 V."],
["The mutual inductance of two coils is affected by their relative:",["Colour","Orientation","Insulation colour","Terminal labels only"],1,"Relative orientation changes how much magnetic flux links the second coil."],
["In M = N₂Φ₂₁/I₁, Φ₂₁ represents:",["Flux through coil 1 due to coil 2","Flux through each turn of coil 2 due to current in coil 1","Electric field in coil 2","Flux independent of current"],1,"The subscripts indicate flux in coil 2 caused by current in coil 1."],
["If the rate of change of primary current doubles while M stays constant, induced emf magnitude:",["Halves","Doubles","Becomes zero","Remains unchanged"],1,"Induced emf magnitude is directly proportional to |dI₁/dt|."],
["Two coils have L₁ = 1 H, L₂ = 16 H and k = 0.75. Their M is:",["1 H","2 H","3 H","4 H"],2,"M = 0.75√16 = 0.75 × 4 = 3 H."],
["The core of a transformer is commonly laminated mainly to reduce:",["Mutual inductance","Eddy-current losses","Number of turns","Frequency"],1,"Thin insulated laminations increase resistance to circulating eddy currents."],
["Which statement correctly compares self and mutual induction?",["Both induce emf only in a separate coil","Self induction acts in the same coil; mutual induction acts in another coupled coil","Mutual induction needs no changing flux","Self induction occurs only in transformers"],1,"Self-induced emf is in the changing-current coil; mutual-induced emf is in a coupled second coil."]
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';$('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item[0];$('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item[1].forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';
 const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
 const label=document.createElement('span');label.textContent=text;b.append(letter,label);
 b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
 $('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item[2])b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item[2]){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item[3];}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item[0],chosen:item[1][chosen],answer:item[1][item[2]],explanation:item[3]});f.className='feedback show bad';f.textContent='Not quite. '+item[3]+' Correct answer: '+item[1][item[2]]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100),card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Mutual Inductance Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='your';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='right';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});}
 else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
  if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q[0]===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}
  else questions.splice(0,questions.length,...originalQuestions);
  index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));$('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
