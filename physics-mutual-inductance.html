<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Mutual Inductance</title>
<meta name="description" content="SkillUp Physics Mutual Inductance interactive lesson with 15 MCQs.">
<style>
:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}
</style></head>
<body><main class="card"><header><span class="icon">🔄</span><h1>Mutual Inductance</h1></header>
<section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section>
<section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section>
<a class="back" href="full-physics-path.html">← Back to Physics Path</a></main>
<script>
const qs=[
["Mutual induction occurs when a changing current in one coil produces what in a nearby coil?",["An induced emf","A constant charge","Only heat","No effect"],0,"A changing magnetic flux through the second coil induces an emf."],
["The SI unit of mutual inductance is:",["Tesla","Henry","Weber/m²","Ohm"],1,"Mutual inductance is measured in henry (H)."],
["The induced emf in a secondary coil due to mutual induction is proportional to:",["The absolute current only","The rate of change of current in the primary coil","The resistance only","The charge stored"],1,"e₂ = −M(di₁/dt)."],
["For two magnetically coupled coils, M represents:",["Mutual inductance","Magnetic permeability only","Mechanical moment","Meter reading"],0,"M is the mutual inductance between the two circuits."],
["If mutual inductance is 0.5 H and primary current changes at 4 A/s, the induced emf magnitude is:",["0.125 V","2 V","4.5 V","8 V"],1,"|e| = M|di/dt| = 0.5 × 4 = 2 V."],
["The negative sign in e₂ = −M(di₁/dt) represents:",["Ohmic loss","Lenz's law","Zero resistance","Energy creation"],1,"The sign expresses opposition to the change in magnetic flux, as stated by Lenz's law."],
["Mutual inductance between two coils increases when their magnetic coupling becomes:",["Weaker","Stronger","Zero","Independent of geometry"],1,"Better magnetic coupling generally increases M."],
["For ideal coils, the coefficient of coupling k is related to mutual inductance by:",["M = k√(L₁L₂)","M = L₁ + L₂ + k","M = k/L₁L₂","M = L₁L₂/k"],0,"The standard relation is M = k√(L₁L₂), where 0 ≤ k ≤ 1."],
["If L₁ = 4 H, L₂ = 9 H and k = 0.5, M equals:",["1 H","2 H","3 H","6 H"],1,"M = 0.5√(4×9) = 0.5×6 = 3 H. Correction: the correct option is 3 H."],
["A transformer operates primarily on the principle of:",["Mutual induction","Electrostatic induction only","Thermal expansion","Photoelectric effect"],0,"A transformer transfers energy between windings through changing magnetic flux."],
["If the primary current is constant in an ideal transformer, the induced emf in the secondary due solely to mutual induction is:",["Maximum","Zero","Infinite","Equal to primary current"],1,"Constant current produces no changing flux, so no mutually induced emf is produced."],
["Increasing the number of turns in the secondary coil, while other conditions remain appropriate, generally increases the flux-linkage capability and induced emf because:",["More turns link the changing flux","Resistance becomes zero","Current cannot flow","Flux becomes impossible"],0,"Induced emf depends on the rate of change of flux linkage, N dΦ/dt."],
["Which expression gives the induced emf in the second coil due to a changing current i₁ in the first coil?",["e₂ = −M di₁/dt","e₂ = Mi₁","e₂ = M/i₁","e₂ = −i₁/M"],0,"The defining relation is e₂ = −M di₁/dt."],
["Two coils have L₁ = 2 H, L₂ = 8 H and M = 2 H. Their coefficient of coupling is:",["0.25","0.5","1","2"],1,"k = M/√(L₁L₂) = 2/√16 = 0.5."],
["Mutual inductance depends on factors such as:",["Number of turns and coil geometry","Only wire color","Only temperature","Only battery voltage"],0,"M depends on coil turns, geometry, separation, orientation, and magnetic material/coupling."]
];
let i=0,score=0,xp=0,answered=false;
const $=id=>document.getElementById(id);
function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("opts").innerHTML="";qs[i][1].forEach((text,n)=>{const b=document.createElement("button");b.className="opt";b.textContent=text;b.onclick=()=>answer(n);$("opts").appendChild(b)})}
function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...document.querySelectorAll(".opt")];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");if(n===q[2]){score++;xp+=10;buttons[n].classList.add("ok");$("feedback").textContent="✓ Correct — "+q[3];$("feedback").className="feedback oktxt"}else{buttons[n].classList.add("no");buttons[q[2]].classList.add("ok");$("feedback").textContent="Not quite — "+q[3];$("feedback").className="feedback notxt"}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}
function next(){if(!answered)return;i++;if(i<qs.length)render();else{ $("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`You earned ${xp} XP.`}}
function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}
$("next").onclick=next;$("restart").onclick=restart;render();
</script></body></html>
