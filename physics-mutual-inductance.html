<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Mutual Inductance</title><meta name="description" content="SkillUp Physics Mutual Inductance interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;margin:0}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px}h1{font-size:23px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🔄</span><h1>Mutual Inductance</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>
const qs=[
["Mutual induction occurs when a changing current in one coil produces what in a nearby coil?",["An induced emf","A constant charge","Only heat","No effect"],0,"Changing flux through the second coil induces emf."],
["The SI unit of mutual inductance is:",["Tesla","Henry","Weber/m²","Ohm"],1,"Mutual inductance is measured in henry (H)."],
["The induced emf in the secondary coil is proportional to:",["The absolute current only","The rate of change of primary current","The resistance only","The charge stored"],1,"e₂ = −M(di₁/dt)."],
["M denotes:",["Mutual inductance","Magnetic permeability only","Mechanical moment","Meter reading"],0,"M is the mutual inductance of the two circuits."],
["If M = 0.5 H and di/dt = 4 A/s, induced emf magnitude is:",["0.125 V","2 V","4.5 V","8 V"],1,"|e| = M|di/dt| = 2 V."],
["The negative sign in e₂ = −M(di₁/dt) represents:",["Ohmic loss","Lenz's law","Zero resistance","Energy creation"],1,"The sign represents opposition to the change in flux."],
["Mutual inductance generally increases when magnetic coupling becomes:",["Weaker","Stronger","Zero","Independent of geometry"],1,"Stronger magnetic coupling gives larger M."],
["For two coupled coils, the coefficient of coupling relation is:",["M = k√(L₁L₂)","M = L₁ + L₂ + k","M = k/L₁L₂","M = L₁L₂/k"],0,"M = k√(L₁L₂), with 0 ≤ k ≤ 1."],
["If L₁ = 4 H, L₂ = 9 H and k = 0.5, M equals:",["1 H","2 H","3 H","6 H"],2,"M = 0.5√(4×9) = 3 H."],
["A transformer operates primarily on:",["Mutual induction","Electrostatic induction only","Thermal expansion","Photoelectric effect"],0,"Transformers transfer energy between windings by mutual induction."],
["If primary current is constant, the mutually induced secondary emf is:",["Maximum","Zero","Infinite","Equal to primary current"],1,"Constant current gives no changing flux, so induced emf is zero."],
["Increasing secondary turns can increase induced emf because:",["More turns link the changing flux","Resistance becomes zero","Current cannot flow","Flux becomes impossible"],0,"Induced emf depends on rate of change of flux linkage."],
["The induced emf in coil 2 due to changing current i₁ is:",["e₂ = −M di₁/dt","e₂ = Mi₁","e₂ = M/i₁","e₂ = −i₁/M"],0,"This is the defining mutual-induction equation."],
["If L₁ = 2 H, L₂ = 8 H and M = 2 H, k is:",["0.25","0.5","1","2"],1,"k = M/√(L₁L₂) = 2/4 = 0.5."],
["Mutual inductance depends on:",["Turns, geometry and magnetic coupling","Only wire color","Only temperature","Only battery voltage"],0,"M depends on turns, geometry, separation, orientation and magnetic material."]
];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("opts").innerHTML="";qs[i][1].forEach((t,n)=>{let b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>answer(n);$("opts").appendChild(b)})}function answer(n){if(answered)return;answered=true;let q=qs[i],bs=[...document.querySelectorAll(".opt")];bs.forEach(b=>b.disabled=true);bs[n].classList.add("sel");if(n===q[2]){score++;xp+=10;bs[n].classList.add("ok");$("feedback").textContent="✓ Correct — "+q[3];$("feedback").className="feedback oktxt"}else{bs[n].classList.add("no");bs[q[2]].classList.add("ok");$("feedback").textContent="Not quite — "+q[3];$("feedback").className="feedback notxt"}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;i++;if(i<qs.length)render();else{$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`You earned ${xp} XP.`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
