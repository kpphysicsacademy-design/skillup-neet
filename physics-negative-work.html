<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Negative Work</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#f7f7fb,#eeedff);color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px 48px}.card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 34px #17203318;animation:cardIn .45s ease both}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.tag{font-weight:850;font-size:1rem}.xp{font-weight:900;padding:8px 12px;border-radius:999px;background:#f0edff;animation:pulse 1.8s ease-in-out infinite}.bar{height:10px;background:#e7e6f0;border-radius:999px;overflow:hidden;margin:18px 0 26px}.fill{height:100%;width:0;background:#5b50c8;border-radius:999px;transition:width .45s cubic-bezier(.2,.8,.2,1)}.q{font-size:1.25rem;font-weight:850;line-height:1.45;margin:22px 0;animation:slideIn .28s ease both}.opts{display:grid;gap:12px}.opt{width:100%;text-align:left;border:2px solid #e3e3ed;background:#fafafd;border-radius:16px;padding:14px 16px;font:inherit;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease;animation:optionIn .3s ease both}.opt:nth-child(2){animation-delay:.03s}.opt:nth-child(3){animation-delay:.06s}.opt:nth-child(4){animation-delay:.09s}.opt:hover{transform:translateY(-3px) scale(1.01);border-color:#aaa4df;box-shadow:0 7px 16px #17203312}.opt:focus{outline:3px solid #c9c3ff;outline-offset:2px}.opt.selected{border-color:#5b50c8;background:#f0edff;transform:scale(1.01)}.opt.correct{border-color:#2d9b68;background:#eaf8f1;animation:correctPop .35s ease}.opt.wrong{border-color:#d45555;background:#fff0f0;animation:shake .35s ease}.feedback{min-height:72px;margin-top:18px;padding:15px 16px;border-radius:16px;background:#f4f3fb;line-height:1.55;animation:fadeUp .25s ease}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:14px;padding:13px 18px;font:inherit;font-weight:850;cursor:pointer;background:#5b50c8;color:#fff;box-shadow:0 5px 0 #42399c;transition:transform .12s,box-shadow .12s,filter .12s}.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #42399c}.btn:focus{outline:3px solid #c9c3ff;outline-offset:2px}.back{display:inline-block;margin-top:30px;color:#5146a5;font-weight:850;text-decoration:none;padding:11px 14px;border-radius:14px;transition:transform .15s,background .15s}.back:hover{background:#f0edff;transform:translateX(-3px)}.back:focus{outline:3px solid #c9c3ff;outline-offset:2px}.back:active{transform:translateX(-1px)}.result{text-align:center;font-size:1.2rem;font-weight:800;line-height:1.7;animation:resultIn .5s ease both}@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes slideIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}@keyframes optionIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes correctPop{50%{transform:scale(1.025)}to{transform:scale(1)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}to{transform:none}}@keyframes pulse{50%{transform:scale(1.05)}}@keyframes resultIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}@media(max-width:600px){.card{padding:21px}.q{font-size:1.12rem}.opt{padding:13px}.top{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}</style></head><body><main class="wrap"><section class="card"><div class="top"><div class="tag">⚙️ Negative Work</div><div class="xp">+10 XP</div></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></section></main><script>const qs=[['Work done by a force is negative when the angle between force and displacement is:',['greater than 90° and up to 180°','less than 90°','equal to 90°','0° only'],0,'For 90°<θ≤180°, cosθ is negative, so W=Fs cosθ is negative.'],['When a force acts opposite to displacement, its work is:',['negative','positive','zero','undefined'],0,'At θ=180°, W=−Fs.'],['A frictional force usually does what kind of work on a sliding body?',['negative work','positive work','zero work','infinite work'],0,'Friction generally opposes displacement, so it does negative work.'],['A body moves 5 m while a 10 N force acts opposite to its motion. Work done by the force is:',['−50 J','+50 J','0 J','+2 J'],0,'W=Fs cos180°=10×5×(−1)=−50 J.'],['A box is pulled to the right while friction acts to the left. The work done by friction is:',['negative','positive','zero','always maximum'],0,'Friction is opposite to displacement, so its work is negative.'],['During upward motion of a body thrown vertically upward, the work done by gravity is:',['negative','positive','zero','undefined'],0,'Gravity is downward while displacement is upward.'],['A force of 20 N acts opposite to a displacement of 3 m. Work done is:',['−60 J','+60 J','−17 J','0 J'],0,'W=20×3×cos180°=−60 J.'],['If force and displacement are perpendicular, the work is:',['zero','positive','negative','maximum negative'],0,'For θ=90°, cos90°=0, so work is zero.'],['The work done by a retarding force on a moving body is generally:',['negative','positive','zero','always equal to momentum'],0,'A retarding force opposes motion and therefore removes kinetic energy.'],['A body slides down a rough inclined plane. The work done by friction is:',['negative','positive','zero','always equal to mgh'],0,'Friction acts up the plane while displacement is down the plane.'],['If the magnitude of an opposing force is doubled while displacement is unchanged, its negative work magnitude becomes:',['double','half','unchanged','zero'],0,'The magnitude |W|=Fs for opposite force, so doubling F doubles |W|.'],['If displacement is doubled while an opposing force remains unchanged, negative work magnitude becomes:',['double','half','unchanged','zero'],0,'Work magnitude is directly proportional to displacement.'],['A stone is projected vertically upward. During ascent, the work done by gravity is:',['negative','positive','zero','undefined'],0,'Gravity opposes the upward displacement during ascent.'],['Which force most directly represents a negative-work force during braking of a car?',['frictional/braking force','engine force in direction of motion','normal force on a level road','weight for horizontal motion'],0,'The braking force acts opposite the car’s displacement, so it does negative work.'],['Negative net work on a body generally causes its kinetic energy to:',['decrease','increase','remain unchanged','become infinite'],0,'By the work-energy theorem, net work equals change in kinetic energy; negative work gives ΔK<0.']];let i=0,selected=null,score=0;const $=id=>document.getElementById(id);function render(){selected=null;const a=qs[i];$('fill').style.width=(i/qs.length*100)+'%';$('quiz').innerHTML='<div class="q">'+(i+1)+'. '+a[0]+'</div><div class="opts" id="opts"></div><div class="feedback" id="feedback">Choose an answer, then check it.</div><div class="actions"><button class="btn" id="check">Check</button></div>';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{selected=item.index;[...$('opts').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('opts').appendChild(b)});$('check').onclick=check}function check(){if(selected===null){$('feedback').textContent='Please choose an answer first.';return}const a=qs[i],ok=selected===a[2];if(ok)score++;[...$('opts').children].forEach(b=>{const oi=Number(b.dataset.index);b.disabled=true;if(oi===a[2])b.classList.add('correct');if(oi===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+'<br>'+a[3];if(i<qs.length-1){$('check').textContent='Next';$('check').onclick=()=>{i++;render()}}else{$('fill').style.width='100%';const pct=Math.round(score/qs.length*100);$('quiz').innerHTML='<div class="result">🏆 Quiz complete!<br>Score: '+score+'/15 ('+pct+'%)<br>XP earned: '+(score*10)+' XP</div><div class="actions" style="justify-content:center"><button class="btn" onclick="i=0;score=0;render()">Retry</button></div>';localStorage.setItem('skillupPhysicsNegativeWorkScore',String(score))}}function rememberPath(){try{const ref=document.referrer;if(ref){const u=new URL(ref);if(u.origin===location.origin&&(/(?:physics|full-physics)[^/]*path[^/]*\.html$/i.test(u.pathname)||/\/physics-home\.html$/i.test(u.pathname)))sessionStorage.setItem('skillupLastPhysicsPath',u.href)}}catch(e){}}rememberPath();$('back').onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();</script></body></html>
