<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>📏 Newton’s First Law</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [{"q":"Newton's first law is also known as the:","o":["Law of inertia","Law of acceleration","Law of gravitation","Law of momentum conservation"],"a":0,"e":"Newton's first law is called the law of inertia because it describes an object's resistance to changes in its state of motion."},{"q":"According to Newton's first law, an object at rest remains at rest unless:","o":["Its mass changes","A net external force acts on it","Time passes","Its temperature changes"],"a":1,"e":"A change from rest requires a nonzero net external force."},{"q":"An object moving with constant velocity continues doing so when:","o":["The net external force is zero","A constant nonzero net force acts","Its mass is zero","It has no inertia"],"a":0,"e":"Zero net force means zero acceleration, so velocity remains constant."},{"q":"If the net force on an object is zero, its acceleration is:","o":["Zero","Equal to g","Increasing","Dependent only on speed"],"a":0,"e":"From Newton's laws, zero net force gives zero acceleration."},{"q":"Which quantity measures inertia?","o":["Velocity","Mass","Acceleration","Force"],"a":1,"e":"Mass is the quantitative measure of an object's inertia."},{"q":"A passenger moves forward when a bus stops suddenly because the passenger's body tends to:","o":["Remain at rest","Continue its forward motion","Move backward","Lose mass"],"a":1,"e":"Inertia of motion makes the body tend to continue moving forward."},{"q":"A passenger tends to move backward when a stationary bus starts suddenly because of:","o":["Inertia of rest","Inertia of motion only","Reduced gravity","Friction disappearing"],"a":0,"e":"The body initially tends to remain at rest while the bus moves forward."},{"q":"A book rests on a table. The net force on it is:","o":["Its weight downward only","Normal force upward only","Zero because vertical forces balance","Always equal to its mass"],"a":2,"e":"The upward normal force balances the downward weight, giving zero net force."},{"q":"A puck moves on a nearly frictionless horizontal surface. If no net force acts, it will:","o":["Slow down immediately","Move at constant velocity","Speed up continuously","Turn in a circle"],"a":1,"e":"With negligible net force, Newton's first law predicts constant velocity."},{"q":"Which is an example of balanced forces?","o":["10 N right and 10 N left","10 N right and 5 N left","5 N upward only","20 N downward only"],"a":0,"e":"Equal opposite forces have a vector sum of zero."},{"q":"Balanced forces produce:","o":["A nonzero acceleration","Zero net force","Increasing speed always","Changing mass"],"a":1,"e":"Balanced forces cancel vectorially, so the net force is zero."},{"q":"Can an object move when the net force on it is zero?","o":["No, it must be at rest","Yes, with constant velocity","Only vertically","Only if it has zero mass"],"a":1,"e":"Zero net force permits both rest and uniform straight-line motion."},{"q":"A car travels straight at constant speed. Its net force is:","o":["Forward","Backward","Zero","Equal to its weight"],"a":2,"e":"Constant velocity means zero acceleration, so the vector sum of forces is zero."},{"q":"Why does dust leave a carpet when the carpet is beaten?","o":["Dust tends to maintain its previous state due to inertia","Dust loses its weight","The carpet becomes magnetic","Gravity stops"],"a":0,"e":"The carpet moves suddenly while dust tends to remain in its previous state."},{"q":"A coin falls into a glass when the card beneath it is flicked quickly. The key idea is:","o":["Inertia of the coin","Increasing coin mass","Magnetic force","Centripetal force"],"a":0,"e":"The coin tends to remain at rest while the card is rapidly removed."},{"q":"Seat belts are important because, during sudden braking, they:","o":["Remove inertia","Provide a force that slows the passenger","Increase passenger mass","Make net force zero instantly"],"a":1,"e":"The belt applies the external force needed to reduce the passenger's forward velocity."},{"q":"Which statement best describes inertia?","o":["A force that keeps objects moving","A tendency to resist changes in velocity","The rate of change of momentum","The energy of motion"],"a":1,"e":"Inertia is a property of matter, not a force; it resists changes in motion."},{"q":"Which object has greater inertia?","o":["A 2 kg ball","A 10 kg box","Both have equal inertia","It depends only on speed"],"a":1,"e":"Greater mass means greater inertia, so the 10 kg box has more."},{"q":"Newton's first law applies in an inertial reference frame. Such a frame is one in which:","o":["The first law holds","Every object accelerates","Gravity must be zero","All objects are at rest"],"a":0,"e":"An inertial frame is defined as a frame in which a force-free object has constant velocity."},{"q":"If forces on an object are unbalanced, Newton's first law tells us its state of motion:","o":["Cannot change","Can change because the net force is nonzero","Must remain at rest","Must have zero acceleration"],"a":1,"e":"A nonzero net force changes velocity, producing acceleration."},{"q":"A ball lying on the ground does not start rolling by itself mainly because:","o":["Its inertia resists a change from rest","It has no mass","It has no gravity","Its velocity is already maximum"],"a":0,"e":"An external unbalanced force is required to change its state of rest."},{"q":"When a moving vehicle turns sharply, passengers tend to continue in the original direction because of:","o":["Inertia","Weight only","Normal force only","Loss of momentum"],"a":0,"e":"Inertia resists the change in direction of velocity."},{"q":"If two equal forces act in the same direction on an object, are they balanced?","o":["Yes, always","No, their resultant is nonzero","Yes, if the object moves","Only if mass is large"],"a":1,"e":"Forces balance only when their vector sum is zero; same-direction forces add."},{"q":"A 5 N force acts right and a 5 N force acts left. The resultant force is:","o":["10 N right","10 N left","5 N","0 N"],"a":3,"e":"Equal forces in opposite directions cancel."},{"q":"An object is moving east at 8 m/s with zero net force. After 5 s, its velocity is:","o":["0 m/s","8 m/s east","40 m/s east","8 m/s west"],"a":1,"e":"With zero net force, velocity remains unchanged at 8 m/s east."},{"q":"Which situation requires a net force?","o":["Maintaining constant velocity in a straight line","Changing the direction of motion","Remaining at rest","Moving uniformly in a straight line"],"a":1,"e":"A direction change is a change in velocity, so acceleration and a net force are required."},{"q":"A heavier object generally resists a change in motion more strongly because it has:","o":["Less inertia","Greater inertia","Less mass","Greater acceleration automatically"],"a":1,"e":"Inertia increases with mass."},{"q":"Newton's first law corrected the idea that:","o":["A continuous force is always required to maintain uniform motion","Mass measures inertia","Forces can be balanced","Objects can be at rest"],"a":0,"e":"Without resistive forces, no net force is needed to maintain constant velocity."},{"q":"If friction slows a sliding block, why does this not contradict Newton's first law?","o":["Friction is an external force producing a nonzero net force","The block has no inertia","Newton's first law applies only in space","Friction makes mass zero"],"a":0,"e":"The law predicts constant velocity only when the net external force is zero; friction provides a net force."},{"q":"Which statement summarizes Newton's first law most accurately?","o":["Every moving object must have a forward net force","An object keeps its state of rest or uniform straight-line motion unless a net external force acts","Force is equal to mass times velocity","Every force has an equal force on the same object"],"a":1,"e":"The first law states that velocity remains unchanged when the net external force is zero."}]
let index=0,score=0,streak=0,chosen=null,locked=false;
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Nice work!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><button class="btn" id="retry">Practice again</button>';
 $('finishSlot').replaceChildren(card);$('retry').addEventListener('click',()=>{index=0;score=0;streak=0;$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
