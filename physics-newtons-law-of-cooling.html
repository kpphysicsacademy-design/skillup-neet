<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🛠️ Newton's Law of Cooling</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [{q:"Newton's law of cooling describes how the temperature of a body changes when it is:",o:["In contact with a body at exactly the same temperature","Hotter or colder than its surroundings","Kept perfectly insulated","Changing phase only"],a:1,e:"The law describes cooling or warming driven by a temperature difference with the surroundings."},{q:"For small temperature differences, Newton's law of cooling states that the rate of cooling is proportional to:",o:["The temperature difference between body and surroundings","The square of the body's mass","The volume only","The reciprocal of surface area only"],a:0,e:"Under suitable conditions, the rate of temperature fall is proportional to the excess temperature over surroundings."},{q:"A common mathematical form of Newton's law of cooling is:",o:["dT/dt = k(T − Tₛ) for cooling","dT/dt = −k(T − Tₛ)","Q = mc²","P = F/A"],a:1,e:"For a body cooling toward surroundings at Tₛ, dT/dt = −k(T−Tₛ), where k is positive."},{q:"In Newton's law of cooling, Tₛ usually represents:",o:["The body's initial temperature","The surrounding temperature","The melting point","The body's mass"],a:1,e:"Tₛ is the ambient or surrounding temperature, assumed approximately constant."},{q:"A hot object cools fastest at the beginning mainly because:",o:["Its mass is greatest at the start","The temperature difference from surroundings is largest","Its surface area is zero initially","Its specific heat becomes infinite"],a:1,e:"A larger excess temperature produces a greater cooling rate under the law's assumptions."},{q:"If the excess temperature is doubled, the initial cooling rate is approximately:",o:["Halved","Doubled","Four times smaller","Unchanged"],a:1,e:"The law predicts cooling rate proportional to the excess temperature."},{q:"Newton's law of cooling is most accurate when the temperature difference from surroundings is:",o:["Very large in every situation","Small enough for heat-transfer conditions to remain approximately linear","Infinite","Exactly zero only"],a:1,e:"The simple proportional law is generally a good approximation for modest temperature differences and stable conditions."},{q:"A cup of hot tea cools toward room temperature. As it approaches room temperature, its cooling rate generally:",o:["Increases without limit","Remains constant","Decreases","Becomes negative in all cases"],a:2,e:"The excess temperature decreases, so the rate of cooling slows."},{q:"If a body's temperature equals the surrounding temperature, Newton's law predicts its instantaneous cooling rate is:",o:["Maximum","Zero","Infinite","Equal to its mass"],a:1,e:"With T−Tₛ = 0, the predicted net cooling rate is zero."},{q:"The constant k in the simple cooling equation depends on factors such as:",o:["Heat-transfer conditions and the body's heat capacity","Only the object's colour name","Only the calendar date","Only its weight unit"],a:0,e:"The effective cooling constant depends on surface heat transfer and thermal capacity."},{q:"Two similar hot objects cool in the same surroundings. The object with greater exposed surface area will often cool:",o:["More rapidly","More slowly in every case","At exactly zero rate","Only after freezing"],a:0,e:"Greater exposed area can increase heat transfer, provided other relevant factors are comparable."},{q:"Why can a blackened surface cool faster than a shiny surface in some conditions?",o:["It has no internal energy","It is generally a better emitter of thermal radiation","It prevents convection entirely","It has zero heat capacity"],a:1,e:"Dull black surfaces usually have higher emissivity and can lose more energy by radiation."},{q:"In a simple exponential cooling model, the excess temperature T−Tₛ changes with time approximately as:",o:["A straight line increasing forever","An exponential decay","A constant independent of time","A square wave"],a:1,e:"Solving the differential equation gives T−Tₛ = (T₀−Tₛ)e^(−kt)."},{q:"A body starts at 80°C in surroundings at 20°C. Its initial excess temperature is:",o:["20°C","60°C","80°C","100°C"],a:1,e:"Excess temperature is 80 − 20 = 60°C."},{q:"If the excess temperature is 40°C and k = 0.1 min⁻¹, the magnitude of the instantaneous cooling rate is:",o:["0.4°C/min","4°C/min","10°C/min","40°C/min"],a:1,e:"The rate magnitude is k(T−Tₛ) = 0.1 × 40 = 4°C/min."},{q:"In a cooling experiment, which quantity should be plotted against time to test exponential decay most directly?",o:["The logarithm of excess temperature","Mass squared","Density divided by volume","The object's colour"],a:0,e:"Taking logs gives ln(T−Tₛ) = ln(T₀−Tₛ) − kt, a straight line against time."},{q:"Which assumption is commonly made when applying Newton's law of cooling?",o:["Surrounding temperature is approximately constant","The object has no surface","The object produces no thermal energy ever","Heat capacity must be zero"],a:0,e:"The simple model assumes stable ambient conditions and an approximately constant cooling coefficient."},{q:"A thermometer is placed in cooler air. Its reading approaches air temperature because:",o:["Heat transfer stops at every temperature","The temperature difference gradually decreases","Its mass increases rapidly","The air temperature must rise to match it"],a:1,e:"The thermometer exchanges heat with air until thermal equilibrium is approached."},{q:"Which change would usually increase the cooling rate at the same excess temperature?",o:["Improve heat transfer at the surface, for example by moving air over it","Wrap the object in thick insulation","Reduce exposed area greatly","Make the surroundings hotter until temperatures match"],a:0,e:"Stronger convection or increased heat-transfer ability raises the rate of heat loss."},{q:"If the surroundings are warmer than the body, the same proportional model predicts the body will:",o:["Continue cooling forever","Warm toward the surrounding temperature","Instantly reach absolute zero","Have no energy exchange"],a:1,e:"The sign of the temperature difference reverses, so the body warms toward the ambient temperature."},{q:"Newton's law of cooling concerns the rate of change of:",o:["Temperature","Mass only","Volume only","Gravitational acceleration"],a:0,e:"The law relates the time rate of temperature change to the temperature difference."},{q:"A body cools from 90°C toward surroundings at 30°C. Its excess temperature initially is:",o:["30°C","60°C","90°C","120°C"],a:1,e:"The initial excess temperature is 90 − 30 = 60°C."},{q:"Which is NOT a standard variable in the basic Newton's law of cooling model?",o:["Body temperature","Surrounding temperature","Time","Magnetic flux density"],a:3,e:"The simple model uses temperature, ambient temperature, time and a cooling constant."},{q:"Why does a fan often help a hot object cool faster?",o:["It removes all heat capacity","It can increase convective heat transfer at the surface","It makes the room a vacuum","It prevents air from contacting the object"],a:1,e:"Moving air generally increases convection and can increase the cooling constant."},{q:"If the cooling constant k increases while excess temperature is unchanged, the cooling rate magnitude:",o:["Decreases","Increases","Becomes zero","Is unaffected by k"],a:1,e:"The rate magnitude equals k times the excess temperature."},{q:"For exponential cooling, after each equal time interval the excess temperature is multiplied by:",o:["A constant factor less than one","A constant added temperature only","An ever-increasing factor above one","Zero at every step"],a:0,e:"Exponential decay means equal time intervals multiply the excess temperature by the same factor."},{q:"A hot object cools from 70°C to 50°C in a room at 30°C. Its excess temperature changes from:",o:["70°C to 50°C","40°C to 20°C","50°C to 30°C","30°C to 20°C"],a:1,e:"Excess temperature is object temperature minus room temperature: 40°C initially and 20°C later."},{q:"Which situation can cause the simple Newton cooling model to be less accurate?",o:["The surrounding temperature changes substantially during the experiment","The ambient temperature stays constant","The excess temperature is modest","The object's cooling coefficient stays stable"],a:0,e:"A changing ambient temperature violates a key simplifying assumption."},{q:"For the same excess temperature, a body with a larger effective cooling constant has:",o:["A smaller rate magnitude","A larger rate magnitude","No heat loss","An identical rate by definition"],a:1,e:"The cooling rate magnitude is proportional to k at fixed excess temperature."},{q:"A body cools in room air. When is it closest to thermal equilibrium with the room?",o:["When its temperature difference from the room is smallest","At the moment it is hottest","When its mass is largest","When the room has no air"],a:0,e:"Thermal equilibrium is approached as the body's temperature approaches the ambient temperature."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Newton&#39;s Law of Cooling Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
