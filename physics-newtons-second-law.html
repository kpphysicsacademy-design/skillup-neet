.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}

.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>📏 Newton’s Second Law</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [{"q":"Newton's second law relates net force to:","o":["Mass and acceleration","Mass and temperature","Distance and time","Pressure and volume"],"a":0,"e":"The net force equals mass multiplied by acceleration: Fnet = ma."},{"q":"The SI unit of force is:","o":["Joule","Newton","Watt","Pascal"],"a":1,"e":"One newton is one kilogram metre per second squared."},{"q":"A net force of 12 N acts on a 3 kg object. Its acceleration is:","o":["2 m/s²","3 m/s²","4 m/s²","36 m/s²"],"a":2,"e":"a = F/m = 12/3 = 4 m/s²."},{"q":"A 5 kg object accelerates at 2 m/s². The net force is:","o":["2.5 N","7 N","10 N","25 N"],"a":2,"e":"F = ma = 5 × 2 = 10 N."},{"q":"If net force doubles while mass stays constant, acceleration:","o":["Halves","Doubles","Stays the same","Becomes zero"],"a":1,"e":"From a = F/m, acceleration is directly proportional to net force."},{"q":"If mass doubles while net force stays constant, acceleration:","o":["Doubles","Halves","Quadruples","Stays the same"],"a":1,"e":"From a = F/m, doubling mass halves acceleration."},{"q":"A 20 N force gives an object acceleration 4 m/s². Its mass is:","o":["4 kg","5 kg","16 kg","80 kg"],"a":1,"e":"m = F/a = 20/4 = 5 kg."},{"q":"A 2 kg object has net force 0 N. Its acceleration is:","o":["0 m/s²","2 m/s²","9.8 m/s²","Cannot be determined"],"a":0,"e":"Newton's second law gives a = Fnet/m = 0."},{"q":"Which force should be used in F = ma?","o":["Any one force","The net force","Only friction","Only weight"],"a":1,"e":"Acceleration is determined by the vector sum of all forces on the object."},{"q":"A 10 kg cart is pulled with 50 N on a frictionless surface. Its acceleration is:","o":["0.2 m/s²","5 m/s²","10 m/s²","500 m/s²"],"a":1,"e":"a = 50/10 = 5 m/s²."},{"q":"A 4 kg object accelerates at 3 m/s². Its net force is:","o":["7 N","12 N","1.33 N","24 N"],"a":1,"e":"F = ma = 4 × 3 = 12 N."},{"q":"A 15 N net force acts on a 5 kg body. Its acceleration is:","o":["0.33 m/s²","3 m/s²","10 m/s²","75 m/s²"],"a":1,"e":"a = 15/5 = 3 m/s²."},{"q":"A 6 kg object accelerates at 0.5 m/s². The net force is:","o":["3 N","6.5 N","12 N","0.083 N"],"a":0,"e":"F = ma = 6 × 0.5 = 3 N."},{"q":"A 10 N force right and 4 N force left act on a 2 kg block. Acceleration is:","o":["3 m/s² right","7 m/s² right","2 m/s² left","5 m/s² right"],"a":0,"e":"Net force = 10 − 4 = 6 N right; a = 6/2 = 3 m/s² right."},{"q":"A 7 N force right and 7 N force left act on a body. The net force is:","o":["14 N right","7 N left","0 N","49 N"],"a":2,"e":"Equal and opposite forces cancel."},{"q":"A 1 kg object has net force 9 N. Its acceleration is:","o":["0.11 m/s²","8 m/s²","9 m/s²","10 m/s²"],"a":2,"e":"a = 9/1 = 9 m/s²."},{"q":"A 3 kg object accelerates at 6 m/s². The force is:","o":["2 N","9 N","18 N","36 N"],"a":2,"e":"F = ma = 3 × 6 = 18 N."},{"q":"A constant net force acts on an object of constant mass. Its acceleration is:","o":["Constant","Always zero","Always increasing","Always decreasing"],"a":0,"e":"Newton's second law gives constant acceleration when net force and mass are constant."},{"q":"A 2 kg object changes velocity by 10 m/s in 5 s under a constant net force. The force magnitude is:","o":["2 N","4 N","5 N","20 N"],"a":1,"e":"a = Δv/Δt = 10/5 = 2 m/s²; F = ma = 2 × 2 = 4 N."},{"q":"A 1000 kg car accelerates at 2 m/s². Its net force is:","o":["500 N","1000 N","2000 N","20,000 N"],"a":2,"e":"F = ma = 1000 × 2 = 2000 N."},{"q":"A 1200 kg car experiences a net force of 3600 N. Its acceleration is:","o":["2 m/s²","3 m/s²","4 m/s²","4.8 m/s²"],"a":1,"e":"a = 3600/1200 = 3 m/s²."},{"q":"A 50 N net force produces 10 m/s² acceleration. The mass is:","o":["0.2 kg","5 kg","40 kg","500 kg"],"a":1,"e":"m = F/a = 50/10 = 5 kg."},{"q":"Why does a heavier trolley accelerate less than a lighter trolley under the same force?","o":["It has greater inertia","It has less mass","Its force is always zero","It has no acceleration ever"],"a":0,"e":"Greater mass means more resistance to acceleration for the same net force."},{"q":"When an object accelerates, the net force is directed:","o":["Opposite to acceleration","In the same direction as acceleration","Always upward","Always along its velocity"],"a":1,"e":"The acceleration vector points in the direction of the net force."},{"q":"Can an object move while the net force is zero?","o":["No, never","Yes, at constant velocity","Only if mass is zero","Only in a circle"],"a":1,"e":"Zero net force means zero acceleration, not necessarily zero velocity."},{"q":"A 4 kg box has 20 N right and 8 N left acting on it. Its acceleration is:","o":["2 m/s² right","3 m/s² right","5 m/s² left","7 m/s² right"],"a":1,"e":"Net force = 12 N right, so a = 12/4 = 3 m/s² right."},{"q":"A 2 kg object is pulled with 16 N right and experiences 6 N friction left. Its acceleration is:","o":["3 m/s² right","5 m/s² right","8 m/s² right","11 m/s² left"],"a":1,"e":"Net force = 16 − 6 = 10 N right; a = 10/2 = 5 m/s²."},{"q":"A 5 kg object at rest experiences a net force of 10 N. After 2 s, its speed is:","o":["2 m/s","4 m/s","5 m/s","10 m/s"],"a":1,"e":"a = F/m = 2 m/s²; from rest, v = at = 2 × 2 = 4 m/s."},{"q":"Which equation gives net force when mass and acceleration are known?","o":["F = ma","F = m/a","F = a/m","F = mv²"],"a":0,"e":"Newton's second law is Fnet = ma."},{"q":"A 2 kg object has a net force of 6 N west. Its acceleration is:","o":["3 m/s² west","3 m/s² east","12 m/s² west","0 m/s²"],"a":0,"e":"Acceleration has the same direction as net force: 6/2 = 3 m/s² west."}]
let index=0,score=0,streak=0,chosen=null,locked=false;
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Nice work!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><button class="btn" id="retry">Practice again</button>';
 $('finishSlot').replaceChildren(card);$('retry').addEventListener('click',()=>{index=0;score=0;streak=0;$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
