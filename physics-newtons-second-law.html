<script>
const quiz=[
["Newton's second law states that the net force on an object is:",["Equal to the rate of change of momentum","Equal to its velocity","Always zero","Equal to its displacement"],0,"The net external force equals the rate of change of momentum."],
["For constant mass, Newton's second law is written as:",["F = ma","F = m/a","F = a/m","F = mv"],0,"For constant mass, F = ma."],
["The SI unit of force is:",["newton (N)","joule (J)","watt (W)","pascal (Pa)"],0,"One newton is the force that gives 1 kg an acceleration of 1 m/s²."],
["A 2 kg body accelerates at 3 m/s². The net force is:",["6 N","1.5 N","5 N","9 N"],0,"F = ma = 2 × 3 = 6 N."],
["If the net force on a body is doubled while its mass remains constant, its acceleration:",["Doubles","Halves","Remains unchanged","Becomes zero"],0,"From a = F/m, acceleration is directly proportional to net force for constant mass."],
["If the mass is doubled for the same net force, acceleration becomes:",["Half","Double","Four times","Unchanged"],0,"From a = F/m, doubling mass halves acceleration."],
["The direction of acceleration of a body is the direction of its:",["Net force","Velocity always","Displacement always","Mass"],0,"Acceleration points in the direction of the net force."],
["A 5 kg body has a net force of 20 N. Its acceleration is:",["4 m/s²","100 m/s²","0.25 m/s²","25 m/s²"],0,"a = F/m = 20/5 = 4 m/s²."],
["When the net force on an object is zero, its acceleration is:",["Zero","Maximum","Equal to its velocity","Always 9.8 m/s²"],0,"Zero net force means zero acceleration."],
["Newton's second law is most directly applicable to:",["The net external force and resulting motion","Only objects at rest","Only circular motion","Only mass measurements"],0,"It relates net external force to momentum change and hence motion."],
["A force of 10 N acts on a 2 kg object. Its acceleration is:",["5 m/s²","20 m/s²","0.2 m/s²","8 m/s²"],0,"a = 10/2 = 5 m/s²."],
["If a constant force acts on a body whose mass is reduced to one-fourth, its acceleration becomes:",["Four times","One-fourth","Half","Unchanged"],0,"Since a = F/m, reducing mass to one-fourth makes acceleration four times."],
["Momentum p of a body is given by:",["p = mv","p = ma","p = m/v","p = F/a"],0,"Linear momentum is mass multiplied by velocity."],
["The more general form of Newton's second law is:",["F = dp/dt","F = p/t always","F = mv/t only","F = ma²"],0,"The net force equals the time rate of change of momentum."],
["A 1000 kg car experiences a net force of 3000 N. Its acceleration is:",["3 m/s²","0.3 m/s²","3000 m/s²","333 m/s²"],0,"a = F/m = 3000/1000 = 3 m/s²."]
];
let i=0,selected=-1,correctCount=0,xp=0;const $=id=>document.getElementById(id);function shuffle(arr){for(let k=arr.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[arr[k],arr[r]]=[arr[r],arr[k]]}return arr}
function render(){const a=quiz[i];selected=-1;$('question').textContent=a[0];$('count').textContent=`Question ${i+1} of ${quiz.length}`;$('pct').textContent=Math.round((i+1)/quiz.length*100)+'%';$('fill').style.width=(correctCount/quiz.length*100)+'%';$('mastery').textContent=Math.round(correctCount/quiz.length*100)+'%';$('feedback').className='feedback';$('feedback').textContent='';$('hint').textContent='Choose the option that best applies Newton\'s second law.';$('check').disabled=false;$('next').disabled=true;$('next').textContent='Next Question →';$('options').innerHTML='';const order=shuffle(a[1].map((text,index)=>({text,index})));order.forEach((item,j)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{if($('check').disabled)return;selected=item.index;[...$('options').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('options').appendChild(b)})}
function check(){if(selected<0)return;const a=quiz[i],ok=selected===a[2];[...$('options').children].forEach(b=>{const idx=Number(b.dataset.index);b.disabled=true;if(idx===a[2])b.classList.add('correct');if(idx===selected&&selected!==a[2])b.classList.add('wrong')});if(ok){correctCount++;xp+=10;$('xp').textContent=xp;$('feedback').className='feedback good';$('feedback').textContent='✓ Correct — '+a[3]}else{$('feedback').className='feedback bad';$('feedback').textContent='✗ Review — '+a[3]}$('mastery').textContent=Math.round(correctCount/quiz.length*100)+'%';$('fill').style.width=(correctCount/quiz.length*100)+'%';$('check').disabled=true;$('next').disabled=false;if(i===quiz.length-1)$('next').textContent='Finish Skill →'}
function next(){if($('next').disabled)return;if(i<quiz.length-1){i++;render()}else{$('question').textContent="🏆 Newton's Second Law Complete!";$('options').innerHTML='';$('check').style.display='none';$('next').style.display='none';$('hint').textContent='';$('feedback').className='feedback good';$('feedback').textContent='Skill complete. '+xp+' XP earned.';$('result').style.display='block';$('score').textContent=correctCount+' / '+quiz.length+' correct • '+xp+' XP';}}
$('check').onclick=check;$('next').onclick=next;$('retry').onclick=()=>{i=0;selected=-1;correctCount=0;xp=0;$('xp').textContent='0';$('mastery').textContent='0%';$('fill').style.width='0%';$('result').style.display='none';$('check').style.display='';$('next').style.display='';render()};
$('back').onclick=function(e){e.preventDefault();const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return}}catch(e){}}location.href='physics-home.html'};
render();
</script></body></html>
