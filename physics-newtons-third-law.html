<script>
const quiz=[
["Newton's third law states that every action has:",["An equal and opposite reaction","A larger reaction","No reaction","A reaction only when the object is moving"],0,"Forces always occur in interacting pairs that are equal in magnitude and opposite in direction."],
["The action and reaction forces in Newton's third law act on:",["The same body","Two different interacting bodies","Only bodies at rest","Only the heavier body"],1,"The action and reaction forces act on different bodies, so they do not cancel each other on one body."],
["A book rests on a table. The force exerted by the book on the table is paired with:",["The gravitational force on the book","The normal force exerted by the table on the book","The weight of the table","The friction between book and air"],1,"The book pushes the table downward, while the table pushes the book upward with an equal and opposite force."],
["When a person pushes a wall, the wall:",["Exerts no force","Exerts an equal and opposite force on the person","Always moves backward","Exerts a force only if it is weak"],1,"The wall exerts a reaction force equal in magnitude and opposite in direction to the person's push."],
["A swimmer moves forward mainly because:",["Water exerts a forward force after the swimmer pushes water backward","Water has no force on the swimmer","Gravity pushes the swimmer forward","The swimmer's mass creates forward force"],0,"The swimmer pushes water backward and the water exerts an opposite forward force on the swimmer."],
["A rocket moves forward because the rocket:",["Pushes gases backward and gases push the rocket forward","Pulls the gases forward","Has no interaction with exhaust gases","Uses only gravitational force"],0,"Rocket propulsion is an application of Newton's third law: expelled gases exert a forward reaction on the rocket."],
["A gun recoils when a bullet is fired because:",["The bullet exerts an opposite force on the gun","The gun loses all its mass instantly","Gravity reverses direction","There is no force on the gun"],0,"The gun pushes the bullet forward and the bullet exerts an equal opposite force on the gun."],
["When you walk forward, your foot pushes the ground:",["Forward, and the ground pushes the foot backward","Backward, and the ground pushes the foot forward","Upward only, with no horizontal force","With no force"],1,"The foot pushes the ground backward; static friction from the ground pushes the foot forward."],
["Why do action and reaction forces not cancel each other?",["They act on different bodies","They are always unequal","They act only at different times","They have different units"],0,"They are equal and opposite but act on different objects, so they cannot cancel on the same free-body diagram."],
["A person jumps from a boat onto a shore. The boat moves backward because:",["The person exerts a force on the boat and the boat exerts an opposite force on the person","The boat has no inertia","Gravity pushes the boat backward","The shore pulls the boat backward"],0,"The person's interaction with the boat produces an equal and opposite force, causing the boat to move backward."],
["The force pair between Earth and an apple includes:",["Earth pulling the apple and the apple pulling Earth","Only Earth's pull on the apple","Only the apple's weight","Two forces acting only on the apple"],0,"Earth attracts the apple, and the apple attracts Earth with an equal and opposite gravitational force."],
["If object A exerts 20 N on object B, object B exerts on A:",["20 N in the opposite direction","10 N in the same direction","40 N in the same direction","0 N"],0,"Newton's third law gives an equal magnitude of 20 N in the opposite direction."],
["A horse pulls a cart forward. The reaction to the horse's pull on the cart is:",["The cart pulling the horse backward","The ground pushing the horse forward","Gravity on the cart","Air resistance on the cart"],0,"The cart exerts an equal and opposite force backward on the horse."],
["Which is a correct action-reaction pair?",["Weight of a book and normal force on the same book","Earth's gravitational force on Moon and Moon's gravitational force on Earth","Applied force on a box and friction on the same box","Two forces acting on one object in equilibrium"],1,"Earth and Moon exert equal and opposite gravitational forces on each other; they act on different bodies."],
["Newton's third law is fundamentally a statement about:",["Interactions between two bodies","Only acceleration of one body","Only objects at rest","Conservation of energy alone"],0,"Newton's third law describes the paired forces that arise when two bodies interact."]

let i=0,selected=-1,correctCount=0,xp=0;const $=id=>document.getElementById(id);function shuffle(arr){for(let k=arr.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[arr[k],arr[r]]=[arr[r],arr[k]]}return arr}

function next(){if($('next').disabled)return;if(i<quiz.length-1){i++;render()}else{$('question').textContent="🏆 Newton's Third Law Complete!";$('options').innerHTML='';$('check').style.display='none';$('next').style.display='none';$('hint').textContent='';$('feedback').className='feedback good';$('feedback').textContent='Skill complete. '+xp+' XP earned.';$('result').style.display='block';$('score').textContent=correctCount+' / '+quiz.length+' correct • '+xp+' XP';}}

render();
