<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>📏 Newton's Third Law</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>

<script>
(function(){
'use strict';
const questions = [{"q":"Newton's third law states that every action has:","o":["An equal and opposite reaction","A larger reaction","No reaction","A reaction only after a delay"],"a":0,"e":"Forces occur in pairs that are equal in magnitude and opposite in direction."},{"q":"Action and reaction forces act on:","o":["The same object","Different objects","Only stationary objects","Only moving objects"],"a":1,"e":"The two forces act on different interacting bodies."},{"q":"A swimmer pushes water backward and moves forward. This illustrates:","o":["Newton's first law","Newton's second law only","Newton's third law","Conservation of temperature"],"a":2,"e":"The swimmer pushes water backward; water exerts an opposite force on the swimmer."},{"q":"When you push a wall, the wall pushes you with a force that is:","o":["Smaller than your push always","Equal and opposite to your push","In the same direction","Zero if the wall does not move"],"a":1,"e":"The wall exerts an equal and opposite force even if it remains stationary."},{"q":"A rocket moves forward because its engine:","o":["Pushes against empty space","Expels gases backward, which exert forward thrust","Removes gravity","Creates force pairs on the same object"],"a":1,"e":"The rocket pushes exhaust backward; the exhaust exerts an opposite force on the rocket."},{"q":"Why don't action and reaction forces cancel each other on one object's free-body diagram?","o":["They are never equal","They act on different objects","They point in the same direction","They occur at different times"],"a":1,"e":"Only forces acting on the object being analysed are included on its free-body diagram."},{"q":"A book pushes down on a table. The Newton's third-law partner is:","o":["Earth pulling the book downward","The table pushing up on the book","The book's weight","Friction on the table"],"a":1,"e":"The book exerts a downward contact force on the table; the table exerts an upward contact force on the book."},{"q":"Earth pulls an apple downward gravitationally. The paired force is:","o":["The apple gravitationally pulling Earth toward itself","The table pushing the apple","Air resistance on the apple","The apple's normal force"],"a":0,"e":"The apple and Earth exert equal and opposite gravitational forces on each other."},{"q":"A gun recoils when a bullet is fired because:","o":["The bullet has no momentum","The bullet and gun exert opposite forces on each other","Gravity pushes the gun backward only","The gun's mass disappears"],"a":1,"e":"The bullet is pushed forward while the gun experiences an equal opposite interaction force backward."},{"q":"A person walks forward by pushing the ground:","o":["Forward; the ground pushes backward","Backward; the ground pushes forward","Upward only","Without any interaction force"],"a":1,"e":"The foot pushes the ground backward, and static friction from the ground pushes the person forward."},{"q":"A horse pulls a cart forward. The cart pulls the horse:","o":["Forward with a greater force","Backward with an equal force","With zero force","Upward only"],"a":1,"e":"The horse-cart interaction forces are equal and opposite, acting on different bodies."},{"q":"If object A exerts 15 N on object B, object B exerts on A:","o":["0 N","7.5 N","15 N in the opposite direction","30 N in the same direction"],"a":2,"e":"Newton's third law requires equal magnitude and opposite direction."},{"q":"A swimmer pushes water with 40 N backward. The water's force on the swimmer is:","o":["20 N forward","40 N forward","40 N backward","80 N forward"],"a":1,"e":"The reaction force is 40 N forward."},{"q":"When two skaters push apart, they move in opposite directions because:","o":["Their masses are always equal","Each exerts a force on the other in opposite directions","Only the heavier skater exerts force","No forces act between them"],"a":1,"e":"The interaction forces are equal and opposite; their accelerations can differ if masses differ."},{"q":"Do action and reaction forces act simultaneously?","o":["Yes, as an interaction pair","No, action always ends first","Only if both objects move","Only in a vacuum"],"a":0,"e":"The paired forces arise together during the interaction."},{"q":"A bat hits a ball. During contact, the force of the bat on the ball is:","o":["Greater than the ball's force on the bat","Equal and opposite to the ball's force on the bat","Always zero","Unrelated to the ball's force"],"a":1,"e":"The bat and ball exert equal and opposite forces on each other."},{"q":"A large truck collides with a small car. During the collision, the truck exerts on the car a force that is:","o":["Always larger than the car's force on the truck","Equal in magnitude to the car's force on the truck","Always zero","Equal to the truck's weight"],"a":1,"e":"Newton's third law applies regardless of the vehicles' masses."},{"q":"If the forces in an action-reaction pair are equal, why can their motions differ?","o":["The objects can have different masses and other forces","The forces are not truly equal","Only one object accelerates by definition","Newton's third law fails for heavy objects"],"a":0,"e":"Equal interaction forces can produce different accelerations because masses and net forces differ."},{"q":"A person jumps from a boat onto a dock, and the boat moves backward. The boat moves because the person:","o":["Pushes the boat backward while jumping","Removes the boat's mass","Eliminates water pressure","Applies no force"],"a":0,"e":"The person pushes the boat backward, and the boat experiences the opposite interaction force."},{"q":"A bird flies by flapping its wings downward against air. The air exerts a force on the bird:","o":["Downward","Upward","Only backward","Zero"],"a":1,"e":"The wings push air downward; the air exerts an upward force on the bird."},{"q":"A rocket can accelerate in space because:","o":["It pushes against the stars","Expelled exhaust interacts with the rocket","It needs air to push against","Gravity must be zero"],"a":1,"e":"The rocket gains thrust from expelling mass; it does not need air as a support."},{"q":"Which pair is a correct action-reaction pair?","o":["Earth pulls a book down; table pushes book up","Foot pushes ground backward; ground pushes foot forward","Weight and normal force on the same book","Friction and applied force on one box"],"a":1,"e":"The foot-ground forces act on different bodies and point in opposite directions."},{"q":"A person sitting in a chair pushes downward on it. The chair's reaction force acts:","o":["Downward on the person","Upward on the person","Upward on Earth only","Horizontally on the chair"],"a":1,"e":"The chair exerts an upward normal force on the person."},{"q":"Action and reaction forces have:","o":["Equal magnitude and opposite direction","Equal direction and different magnitude","Different units","A combined net force of zero on each object"],"a":0,"e":"The pair is equal and opposite, but the forces act on different objects."},{"q":"A 2 kg object pushes a 5 kg object with 10 N. The 5 kg object pushes back with:","o":["4 N","10 N opposite","25 N opposite","0 N"],"a":1,"e":"The interaction force on the 2 kg object is 10 N in the opposite direction."},{"q":"When a person presses a spring, the spring presses the person back. This is:","o":["Newton's third law","Newton's first law only","A force with no partner","An example of mass changing"],"a":0,"e":"The spring and person exert opposite forces on each other."},{"q":"Which statement is false about action-reaction forces?","o":["They are equal in magnitude","They act on different objects","They act in opposite directions","They cancel on the same object's free-body diagram"],"a":3,"e":"They do not cancel on a single object's diagram because they act on different objects."},{"q":"A football pushes backward on a player's foot when kicked. The foot's force on the ball is:","o":["Forward, equal in magnitude","Backward, twice as large","Zero","Always smaller"],"a":0,"e":"The foot and ball exert equal and opposite forces during contact."},{"q":"A person on roller skates throws a heavy ball forward and rolls backward. This happens because:","o":["The ball pulls the person forward","The person and ball exert opposite interaction forces","Only gravity acts","The person has no inertia"],"a":1,"e":"Throwing the ball forward involves a backward force on the person, causing recoil."},{"q":"Newton's third law is most directly about:","o":["Force pairs between interacting bodies","The relation between force and acceleration on one body","The definition of speed","The conservation of temperature"],"a":0,"e":"The third law describes equal and opposite forces between two interacting objects."}]
let index=0,score=0,streak=0,chosen=null,locked=false;
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Nice work!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><button class="btn" id="retry">Practice again</button>';
 $('finishSlot').replaceChildren(card);$('retry').addEventListener('click',()=>{index=0;score=0;streak=0;$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
