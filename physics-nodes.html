<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Nodes</title><style>body{font-family:Arial,sans-serif;background:#f3f7ff;margin:0;color:#1e293b}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(30,41,59,.1);border:1px solid #e2e8f0}h1{text-align:center;color:#334155}.meta{display:flex;justify-content:space-between;font-weight:700;color:#475569}.bar{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#22c55e;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;color:#172033}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe4f0;border-radius:14px;background:#fff;color:#1e293b;font-size:16px;cursor:pointer;transition:.2s}.opt:hover{background:#eef5ff;border-color:#93c5fd;transform:translateY(-1px)}.correct{border-color:#16a34a!important;background:#ecfdf3!important;color:#166534!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important;color:#991b1b!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#4f46e5;color:#fff}.back{background:#334155;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#d97706;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>📍 Nodes in Standing Waves</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>
const qs=[
['In a standing wave, a node is a point where','displacement is always maximum','displacement is always zero','speed is always maximum','wavelength is zero',1,'At a node, the displacement remains zero at all times.'],
['The amplitude of oscillation at an ideal node is','A','2A','zero','A/2',2,'The amplitude at a node is zero.'],
['For a sinusoidal standing wave, the distance between successive nodes is','λ/4','λ/2','λ','2λ',1,'Successive nodes are separated by λ/2.'],
['The distance from a node to its nearest antinode is','λ/8','λ/4','λ/2','λ',1,'A node and the nearest antinode are separated by λ/4.'],
['The phase difference between particles in adjacent loops of a standing wave is','0','π/4','π/2','π',3,'Adjacent loops oscillate in opposite phase, so the phase difference is π radians.'],
['Particles between two successive nodes generally vibrate','in phase','with a phase difference of π with every neighboring particle','at rest','with different frequencies',0,'All particles within one loop between adjacent nodes oscillate in phase.'],
['At a node of a standing wave, the particle velocity is','always maximum','always zero','infinite','equal to wave speed',1,'Because displacement is always zero at a node, the particle remains stationary there in the ideal standing-wave model.'],
['At an antinode, the displacement amplitude is','zero','minimum but nonzero','maximum','undefined',2,'Antinodes are points of maximum displacement amplitude.'],
['For y=2A sin(kx) cos(ωt), nodes satisfy','sin(kx)=0','cos(ωt)=0 only','kx=π/4 only','x=A',0,'Nodes occur where sin(kx)=0, giving x=nλ/2.'],
['The positions of nodes in a standing wave are','continuously moving','fixed in space','random','always at the source',1,'The node pattern is stationary in space.'],
['If wavelength is 4 m, the separation between successive nodes is','0.5 m','1 m','2 m','4 m',2,'Node separation is λ/2=4/2=2 m.'],
['If wavelength is 2 m, the distance from a node to the nearest antinode is','0.25 m','0.5 m','1 m','2 m',1,'Node-to-antinode distance is λ/4=2/4=0.5 m.'],
['For a string fixed at both ends, the ends are generally','antinodes','nodes','free particles','sources',1,'A fixed end cannot move, so it is a displacement node.'],
['Which statement about nodes is correct?','Nodes have maximum displacement','Nodes are equally spaced in an ideal uniform standing wave','Nodes carry maximum energy through the string','Nodes move with the wave',1,'For a uniform standing wave, nodes occur at fixed, regularly spaced positions separated by λ/2.'],
['In an ideal standing wave, the net energy transfer across a node is','maximum','zero','infinite','equal to frequency',1,'A standing wave has no net propagation of energy along the medium; nodes remain stationary.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent=''}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide')}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('next').onclick=next;render();</script></body></html>
