<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Non-Conservative Force</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:flex-end;margin-bottom:20px}.xp{background:#fff;padding:12px 18px;border-radius:18px;box-shadow:0 5px 18px #17203314;font-weight:800}.hero{background:linear-gradient(135deg,#7a3db8,#b25de8);color:#fff;border-radius:22px;padding:26px 20px;margin-bottom:12px;box-shadow:0 8px 22px #7a3db825}.hero small{font-size:.82rem}.hero h1{margin:9px 0 10px;font-size:1.9rem}.hero p{margin:0}.card{background:#fff;border-radius:22px;padding:20px;margin:12px 0;box-shadow:0 6px 20px #17203312}.progress-head{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:12px;background:#e5ddec;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;border-radius:999px;transition:width .3s}.qnum{font-size:.9rem;font-weight:800;color:#5a3c70;margin-bottom:12px}.question{font-size:1.28rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{width:100%;padding:14px 15px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#8b4bc1;background:#fbf5ff;transform:translateY(-1px)}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.actions{margin-top:16px}.btn{padding:12px 20px;border:0;border-radius:13px;font-weight:850;cursor:pointer;background:#2db84d;color:#fff;box-shadow:0 4px 0 #21863a;transition:.12s}.btn:hover:not(:disabled){transform:translateY(-1px)}.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #21863a}.feedback{margin-top:14px;padding:13px;border-radius:14px;font-weight:700;min-height:20px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:8px;color:#5146a5;font-weight:800;text-decoration:none;padding:9px 12px;border-radius:12px}.back:hover{background:#f0edff;transform:translateX(-2px)}@media(max-width:600px){.wrap{padding:20px 14px 34px}.hero h1{font-size:1.55rem}.question{font-size:1.15rem}.card{padding:17px}}</style></head><body><main class="wrap"><div class="top"><div class="xp">⚡ <span id="xp">0</span> XP</div></div><section class="hero"><small>PHYSICS • NEET 2026</small><h1>🧩 Non-Conservative Force</h1><p>LEARN → PRACTICE → MASTER • 15 focused NEET-style MCQs</p></section><section class="card"><div class="progress-head"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count">Question 1 of 15</div><h2 class="question" id="question"></h2><div id="options" class="options"></div><div class="actions"><button id="continue" class="btn">Continue →</button></div><div id="feedback" class="feedback"></div></section><a href="physics-home.html" id="back" class="back">← Back to Physics Path</a></main><script>(function(){const quiz=[['Which is a common example of a non-conservative force?',['friction','gravity','electrostatic force between fixed charges','ideal spring force'],0,'Kinetic friction is non-conservative because its work depends on the path.'],['For a non-conservative force, work done between two points generally:',['depends on the path','depends only on endpoints','is always zero','is always positive'],0,'Path dependence is the defining feature in this context.'],['The work done by friction on a sliding body is usually:',['negative','positive','zero in every case','infinite'],0,'Friction opposes relative motion, so it removes mechanical energy.'],['Mechanical energy in the presence of friction generally:',['decreases','remains constant always','increases without limit','equals zero'],0,'Friction converts mechanical energy mainly into thermal/internal energy.'],['For a non-conservative force, the work around a closed path is generally:',['non-zero','always zero','always positive','undefined'],0,'Unlike conservative forces, the net work around a closed path need not vanish.'],['Which statement best distinguishes friction from gravity?',['Friction is generally path-dependent','Gravity is always dissipative','Friction is conservative','Gravity always converts energy to heat'],0,'Near Earth, gravity is conservative, while kinetic friction is dissipative and path-dependent.'],['A block moves on a rough horizontal surface. The mechanical energy lost due to friction appears mainly as:',['thermal energy','gravitational potential energy','rest mass','electric charge'],0,'Friction transfers mechanical energy into thermal/internal energy.'],['If friction acts while a body moves from A to B, the work done by friction depends on:',['distance/path traveled','only the initial height','only the final position','mass alone'],0,'For kinetic friction, work depends on the path length over which it acts.'],['A force whose work depends only on initial and final positions is:',['conservative','non-conservative','always frictional','always impulsive'],0,'Path independence is the hallmark of a conservative force.'],['In a system with non-conservative forces, the change in mechanical energy equals:',['work done by non-conservative forces','zero always','kinetic energy only','potential energy only'],0,'Δ(K+U)=W_non-conservative when the work-energy relation is written this way.'],['A car moving on a level road experiences air resistance. The work by air resistance is generally:',['negative','positive','zero regardless of motion','equal to its kinetic energy'],0,'Drag opposes the motion and therefore does negative work on the car.'],['Which force can add mechanical energy to a system when it does positive work?',['an external non-conservative force','kinetic friction only','a force that always opposes motion','no force can do so'],0,'Positive work by an external non-conservative force can increase mechanical energy.'],['If a rough path is longer than a smooth path between the same points, frictional energy loss is generally:',['greater on the longer rough path','the same always','zero','independent of distance'],0,'More sliding distance means more negative friction work for comparable friction force.'],['The work done by a non-conservative force can be converted into:',['thermal/internal energy or other forms','only gravitational potential energy','mass only','nothing'],0,'Non-conservative interactions can transfer mechanical energy into thermal and other forms.'],['Which example represents energy dissipation by a non-conservative force?',['a box slowing because of friction','a planet orbiting under ideal gravity','an ideal mass-spring oscillation','a frictionless projectile'],0,'Friction dissipates mechanical energy into thermal energy.']];let i=0,selected=-1,score=0,checked=false;const $=id=>document.getElementById(id),q=$("question"),o=$("options"),b=$("continue"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;q.textContent=a[0];$("count").textContent='Question '+(i+1)+' of 15';o.innerHTML='';f.className='feedback';f.textContent='';b.disabled=false;b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const x=document.createElement('button');x.className='option';x.textContent=String.fromCharCode(65+j)+'. '+item.text;x.dataset.index=item.index;x.onclick=()=>{selected=item.index;[...o.children].forEach(z=>z.classList.remove('selected'));x.classList.add('selected')};o.appendChild(x)})}b.onclick=function(){if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(x=>{const idx=Number(x.dataset.index);x.disabled=true;if(idx===a[2])x.classList.add('correct');if(idx===selected&&!ok)x.classList.add('wrong')});if(ok){score++;f.className='feedback good';f.textContent='🎯 Correct! +10 XP — '+a[3]}else{f.className='feedback bad';f.textContent='✗ Review — Correct answer: '+a[1][a[2]]+'. '+a[3]}$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';return}if(i<14){i++;render();window.scrollTo({top:0,behavior:'smooth'})}else{q.textContent='🏆 Non-Conservative Force Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.';localStorage.setItem('skillupPhysicsNonConservativeForceScore',score)}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
