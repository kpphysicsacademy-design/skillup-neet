<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Non-uniform Motion</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eef7ff;color:#173b62}.wrap{max-width:1050px;margin:auto;padding:20px}.topbar{display:flex;justify-content:space-between}.skill,.hero,.quiz,.panel,.mastery{background:#fff;border-radius:20px;padding:22px;margin:12px 0;box-shadow:0 6px 18px #123b7015}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #dbe7f1;border-radius:15px;background:#fff;text-align:left;font-weight:700;cursor:pointer}.option.selected{border-color:#1677ff;background:#eef6ff}.option.correct{border-color:#2db84d;background:#eaffef}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{padding:12px 18px;border:0;border-radius:13px;font-weight:900;cursor:pointer;margin:8px 6px 0 0}.check{background:#2db84d;color:#fff}.next{background:#dcecff;color:#145b9e}.feedback{margin-top:14px;padding:13px;border-radius:14px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.bar{height:13px;background:#dce8f2;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#42c95a}@media(max-width:750px){.layout{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="topbar"><a href="physics-home.html">← Back to Physics Path</a><span class="skill">⚡ <span id="xp">0</span> XP</span></div><section class="hero"><div>PHYSICS • NEET 2026</div><h1>Non-uniform Motion</h1><p>LEARN → PRACTICE → MASTER • 15 focused NEET-style MCQs</p></section><section class="mastery"><b>🎯 Skill Mastery <span id="mt">0 / 15</span></b><div class="bar"><div id="fill" class="fill"></div></div></section><div class="layout"><aside class="panel"><h3 id="count">Question 1 of 15</h3><div id="pct">7%</div><div>Non-uniform motion</div><div>⚡ +10 XP each</div><div>🦉 Learn → Practice → Master</div></aside><section class="quiz"><b id="badge">Q1</b><h2 id="q"></h2><div id="opts" class="options"></div><button id="check" class="btn check">Check Answer</button><button id="next" class="btn next" disabled>Next Question →</button><div id="fb" class="feedback"></div><p>💡 Choose the best answer.</p></section></div></main><script>(function(){const quiz=[['In non-uniform motion, an object covers:',['Unequal distances in equal intervals of time','Equal distances in equal intervals of time','No distance at all','Equal distances only once'],0],['Which quantity generally changes in non-uniform motion?',['Velocity','Unit of length','Mass by definition','Time interval itself'],0],['A car covers 10 m in the first second and 20 m in the next second. Its motion is:',['Non-uniform','Uniform','At rest','Impossible'],0],['A body moving in a straight line changes its speed from 5 m/s to 15 m/s. It has:',['Acceleration','Zero acceleration','Only displacement','No velocity'],0],['The slope of a velocity-time graph represents:',['Acceleration','Displacement','Speed','Position'],0],['For non-uniform motion, the velocity-time graph may have:',['A changing slope','Only a horizontal line','Only a vertical line','No points'],0],['A bus travels 20 m in 2 s and then 50 m in 5 s. Its average speed is:',['10 m/s','14 m/s','25 m/s','70 m/s'],0],['If speed changes continuously with time, the motion is:',['Non-uniform','Uniform','Always circular','Always stationary'],0],['A particle moves 5 m east, then 10 m east in the next equal time interval. Its speed is:',['Changing','Constant','Zero','Undefined'],0],['Which example best represents non-uniform motion?',['A car accelerating from a traffic signal','A train moving at constant speed on a straight track','A clock hand completing equal angular motion','A body at rest'],0],['A velocity-time graph with a positive slope indicates:',['Positive acceleration','Zero acceleration','Negative displacement only','Constant position'],0],['A car increases speed from 10 m/s to 20 m/s in 5 s. Its average acceleration is:',['2 m/s²','5 m/s²','10 m/s²','50 m/s²'],0],['For variable velocity, instantaneous velocity means velocity:',['At a particular instant','Over the whole journey only','Only at the starting point','Only at the final point'],0],['If a body has different velocities at different instants, its motion is:',['Non-uniform','Uniform','At rest','Periodic by definition'],0],['Which statement is correct?',['Non-uniform motion can have changing speed and/or changing direction','Non-uniform motion always has zero acceleration','Non-uniform motion always occurs in a circle','Non-uniform motion has constant velocity'],0]];let i=0,sel=-1,score=0,q=document.getElementById('q'),o=document.getElementById('opts'),fb=document.getElementById('fb'),check=document.getElementById('check'),next=document.getElementById('next');function render(){let a=quiz[i];sel=-1;q.textContent=a[0];document.getElementById('badge').textContent='Q'+(i+1);document.getElementById('count').textContent='Question '+(i+1)+' of '+quiz.length;document.getElementById('pct').textContent=Math.round((i+1)/quiz.length*100)+'%';o.innerHTML='';fb.textContent='';fb.className='feedback';check.disabled=false;next.disabled=true;a[1].forEach((v,j)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+v;b.onclick=()=>{sel=j;[...o.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)})}check.onclick=()=>{if(sel<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}let a=quiz[i];[...o.children].forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===sel&&j!==a[2])b.classList.add('wrong')});if(sel===a[2]){score++;fb.className='feedback good';fb.textContent='🎯 Correct! +10 XP'}else{fb.className='feedback bad';fb.textContent='Not quite. Correct answer: '+a[1][a[2]]}document.getElementById('xp').textContent=score*10;document.getElementById('mt').textContent=score+' / '+quiz.length;document.getElementById('fill').style.width=score/quiz.length*100+'%';check.disabled=true;next.disabled=false;if(i===quiz.length-1)next.textContent='Finish Skill →'};next.onclick=()=>{if(i<quiz.length-1){i++;next.textContent='Next Question →';render()}else{q.textContent='🏆 Non-uniform Motion Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+score+' / '+quiz.length+' correct • '+score*10+' XP'}};render()})();</script></body></html>
