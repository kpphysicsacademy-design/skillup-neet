<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Non-uniform Motion</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:flex-end;align-items:center}.xp{background:#fff;border:1px solid #dfe3ea;border-radius:14px;padding:7px 11px;font-weight:850;white-space:nowrap}.intro{margin:24px 0 18px}.intro h1{margin:0 0 8px;font-size:2rem;line-height:1.15}.intro p{margin:0;color:#596273;line-height:1.55}.progress{height:12px;background:#e4e7ed;border-radius:99px;overflow:hidden;margin:20px 0}.fill{height:100%;width:0;background:#58cc02;transition:width .25s ease}.card{background:#fff;border-radius:22px;padding:26px;box-shadow:0 8px 24px rgba(23,32,51,.08)}.meta{font-size:.95rem;font-weight:800;color:#596273;margin-bottom:12px}.q{font-size:1.3rem;font-weight:750;line-height:1.45;margin:0 0 20px}.options{display:grid;gap:10px}.option{padding:15px 16px;border:2px solid #dfe3ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;color:#172033;cursor:pointer;transition:border-color .15s,background .15s,transform .1s,box-shadow .15s}.option:hover:not(:disabled){border-color:#58cc02;background:#f5fff0;transform:translateY(-1px);box-shadow:0 3px 0 #dfe3ea}.option.selected{border-color:#5146a5;background:#f1efff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#ff4b4b;background:#fff0f0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{padding:12px 18px;border:0;border-radius:13px;font:inherit;font-weight:850;cursor:pointer}.check,.retry{background:#58cc02;color:#fff}.next{background:#5146a5;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:16px;min-height:24px;font-weight:750;line-height:1.5}.good{color:#177b2f}.bad{color:#b02a37}.hint{margin:18px 0 0;color:#596273;font-size:.95rem}.result{display:none;text-align:center;margin-top:20px;padding-top:18px;border-top:1px solid #e5e7eb}.result h2{margin:0 0 8px}.bottom-nav{margin-top:20px;text-align:center}.back{display:inline-block;color:#5146a5;font-weight:800;text-decoration:none;padding:9px 12px;border-radius:12px;transition:transform .15s,background .15s,box-shadow .15s}.back:hover{background:#eeeaff;transform:translateY(-1px);box-shadow:0 4px 12px rgba(81,70,165,.12)}.back:focus-visible{outline:3px solid #b9b0ff;outline-offset:2px}.back:active{transform:scale(.98)}@media(max-width:600px){.wrap{padding:20px 14px}.intro h1{font-size:1.65rem}.card{padding:20px}.q{font-size:1.15rem}}</style></head><body><main class="wrap"><div class="top"><span class="xp">⚡ <span id="xp">0</span> XP</span></div><section class="intro"><h1>🔄 Non-uniform Motion</h1><p>Master changing speed, velocity and acceleration with 15 focused NEET-style MCQs.</p></section><div class="progress" aria-label="Quiz progress"><div id="fill" class="fill"></div></div><section class="card"><div class="meta"><span id="count">Question 1 of 15</span> • <span id="pct">7%</span></div><h2 id="q" class="q"></h2><div id="opts" class="options"></div><div class="actions"><button id="check" class="btn check" type="button">Check Answer</button><button id="next" class="btn next" type="button" disabled>Next Question →</button></div><div id="fb" class="feedback" aria-live="polite"></div><p class="hint">💡 Choose the best answer.</p><div id="result" class="result"><h2>🏆 Skill Complete!</h2><p id="score"></p><button id="retry" class="btn retry" type="button">Retry Skill</button></div></section><div class="bottom-nav"><a class="back" href="#" onclick="return goBackToPhysicsPath()">← Back to Physics Path</a></div></main><script>(function(){const KEY='skillupLastPhysicsPath';function rememberPath(){try{const r=document.referrer;if(!r)return;const u=new URL(r);if(u.origin!==location.origin)return;if(/(?:physics|full-physics)[^/]*path[^/]*\.html$/i.test(u.pathname)||/\/physics-home\.html$/i.test(u.pathname))sessionStorage.setItem(KEY,u.href)}catch(e){}}function goBackToPhysicsPath(){try{const saved=sessionStorage.getItem(KEY);if(saved){const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}}catch(e){}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false}window.goBackToPhysicsPath=goBackToPhysicsPath;rememberPath();const quiz=[['In non-uniform motion, an object covers:',['Unequal distances in equal intervals of time','Equal distances in equal intervals of time','No distance at all','Equal distances only once'],0,'Non-uniform motion means the object does not cover equal distances in equal intervals of time.'],['Which quantity generally changes in non-uniform motion?',['Velocity','Unit of length','Mass by definition','Time interval itself'],0,'Velocity can change in magnitude, direction, or both.'],['A car covers 10 m in the first second and 20 m in the next second. Its motion is:',['Non-uniform','Uniform','At rest','Impossible'],0,'Unequal distances in equal time intervals indicate non-uniform motion.'],['A body moving in a straight line changes its speed from 5 m/s to 15 m/s. It has:',['Acceleration','Zero acceleration','Only displacement','No velocity'],0,'A change in velocity with time means the body has acceleration.'],['The slope of a velocity-time graph represents:',['Acceleration','Displacement','Speed','Position'],0,'Acceleration is the rate of change of velocity, equal to the slope of a velocity-time graph.'],['For non-uniform motion, the velocity-time graph may have:',['A changing slope','Only a horizontal line','Only a vertical line','No points'],0,'A changing slope indicates changing acceleration, which is possible in non-uniform motion.'],['A bus travels 20 m in 2 s and then 50 m in 5 s. Its average speed is:',['10 m/s','14 m/s','25 m/s','70 m/s'],0,'Total distance = 70 m and total time = 7 s, so average speed = 10 m/s.'],['If speed changes continuously with time, the motion is:',['Non-uniform','Uniform','Always circular','Always stationary'],0,'Changing speed means the motion is non-uniform.'],['A particle moves 5 m east, then 10 m east in the next equal time interval. Its speed is:',['Changing','Constant','Zero','Undefined'],0,'Different distances in equal time intervals imply changing speed.'],['Which example best represents non-uniform motion?',['A car accelerating from a traffic signal','A train moving at constant speed on a straight track','A clock hand completing equal angular motion','A body at rest'],0,'Acceleration from rest causes the car velocity to change with time.'],['A velocity-time graph with a positive slope indicates:',['Positive acceleration','Zero acceleration','Negative displacement only','Constant position'],0,'A positive slope on a velocity-time graph represents positive acceleration.'],['A car increases speed from 10 m/s to 20 m/s in 5 s. Its average acceleration is:',['2 m/s²','5 m/s²','10 m/s²','50 m/s²'],0,'Average acceleration = (20 − 10)/5 = 2 m/s².'],['For variable velocity, instantaneous velocity means velocity:',['At a particular instant','Over the whole journey only','Only at the starting point','Only at the final point'],0,'Instantaneous velocity is the velocity at a particular instant.'],['If a body has different velocities at different instants, its motion is:',['Non-uniform','Uniform','At rest','Periodic by definition'],0,'Different velocities at different instants indicate non-uniform motion.'],['Which statement is correct?',['Non-uniform motion can have changing speed and/or changing direction','Non-uniform motion always has zero acceleration','Non-uniform motion always occurs in a circle','Non-uniform motion has constant velocity'],0,'Non-uniform motion occurs whenever velocity changes in magnitude, direction, or both.']];let i=0,sel=-1,score=0,locked=false;const $=id=>document.getElementById(id),q=$('q'),o=$('opts'),fb=$('fb'),check=$('check'),next=$('next'),xp=$('xp'),fill=$('fill'),count=$('count'),pct=$('pct');function render(){const a=quiz[i];sel=-1;locked=false;q.textContent=a[0];count.textContent='Question '+(i+1)+' of '+quiz.length;pct.textContent=Math.round((i+1)/quiz.length*100)+'%';fill.style.width=(score/quiz.length*100)+'%';fb.className='feedback';fb.textContent='';check.disabled=false;next.disabled=true;next.textContent='Next Question →';o.innerHTML='';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{if(locked)return;sel=item.index;Array.from(o.children).forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)})}check.onclick=function(){if(sel<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}locked=true;const a=quiz[i],ok=sel===a[2];Array.from(o.children).forEach(b=>{const originalIndex=Number(b.dataset.index);b.disabled=true;if(originalIndex===a[2])b.classList.add('correct');if(originalIndex===sel&&!ok)b.classList.add('wrong')});if(ok){score++;fb.className='feedback good';fb.textContent='🎯 Correct! '+a[3]+' +10 XP'}else{fb.className='feedback bad';fb.textContent='Not quite. '+a[3]+' Correct answer: '+a[1][a[2]]}xp.textContent=score*10;fill.style.width=(score/quiz.length*100)+'%';check.disabled=true;next.disabled=false;if(i===quiz.length-1)next.textContent='Finish Skill →'};next.onclick=function(){if(i<quiz.length-1){i++;render()}else{q.textContent='🏆 Non-uniform Motion Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+score+' / '+quiz.length+' correct • '+score*10+' XP';$('result').style.display='block';$('score').textContent=score+' / '+quiz.length+' correct • '+score*10+' XP'}};$('retry').onclick=()=>{i=0;sel=-1;score=0;locked=false;xp.textContent='0';$('result').style.display='none';check.style.display='';next.style.display='';render()};render()})();</script></body></html>
