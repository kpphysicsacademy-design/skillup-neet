<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Normal Reaction</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{font-size:1.7rem;margin:0}.xp{font-weight:800}.hero{background:#5146a5;color:#fff;border-radius:22px;padding:24px;margin-bottom:18px}.hero h2{margin:0 0 6px}.progress{background:#fff;border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:0 4px 16px #17203312}.bar{height:12px;background:#e7e7ee;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02}.quiz{background:#fff;border-radius:22px;padding:24px;box-shadow:0 6px 20px #17203312}.meta{display:flex;justify-content:space-between;font-weight:750;color:#667085;margin-bottom:14px}.question{font-size:1.25rem;font-weight:750;line-height:1.45;margin-bottom:18px}.options{display:grid;gap:11px}.option{width:100%;text-align:left;background:#fff;border:2px solid #d9dbe5;border-radius:14px;padding:14px 15px;font:inherit;font-weight:650;cursor:pointer;transition:.15s}.option:hover{border-color:#5146a5;transform:translateY(-1px)}.option.selected{border-color:#5146a5;background:#f0edff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#ff4b4b;background:#ffe8e8}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:14px;padding:13px 20px;font:inherit;font-weight:800;cursor:pointer}.check{background:#58cc02;color:#fff}.next{background:#5146a5;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:16px;font-weight:700;line-height:1.5}.good{color:#16803c}.bad{color:#d92d20}.hint{margin-top:12px;color:#667085}.result{display:none;margin-top:18px;padding:20px;background:#f0edff;border-radius:16px;font-weight:750}.retry{margin-top:12px}.back{display:inline-block;margin-top:20px;color:#5146a5;font-weight:800;text-decoration:underline;padding:10px 13px;border-radius:12px;transition:.15s}.back:hover{background:#f0edff;transform:translateY(-1px)}.back:focus{outline:3px solid #c9c1ff;outline-offset:2px}.back:active{transform:translateY(1px)}@media(max-width:600px){.wrap{padding:20px 14px 34px}.quiz,.progress{padding:18px}.top h1{font-size:1.4rem}}</style></head><body><main class="wrap"><div class="top"><h1>⚖️ Normal Reaction</h1><div>⭐ <span id="xp">0</span> XP</div></div><section class="hero"><h2>Normal Reaction</h2><div>Master contact forces and how surfaces support objects.</div></section><section class="progress"><div style="display:flex;justify-content:space-between;margin-bottom:9px"><b>Mastery</b><b id="mastery">0%</b></div><div class="bar"><div class="fill" id="fill"></div></div></section><section class="quiz"><div class="meta"><span id="count">Question 1 of 15</span><span id="pct">7%</span></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="actions"><button class="btn check" id="check">Check Answer</button><button class="btn next" id="next" disabled>Next Question →</button></div><div class="feedback" id="feedback"></div><div class="hint" id="hint"></div><div class="result" id="result"><div id="score"></div><button class="btn next retry" id="retry">Retry Skill</button></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>const quiz=[['The normal reaction on an object is a force exerted by:',['The surface in contact with the object','The Earth only','The object itself','Air resistance'],0,'The normal reaction is the contact force exerted by a surface on an object.'],['The normal reaction acts in which direction?',['Parallel to the surface','Perpendicular to the surface','Always vertically downward','Always horizontally'],1,'Normal force acts perpendicular to the contact surface.'],['A book rests on a horizontal table. The normal reaction on the book is directed:',['Downward','Upward','Horizontally right','Horizontally left'],1,'The table pushes upward on the book, perpendicular to its horizontal surface.'],['For a block of mass m resting on a horizontal surface with no vertical acceleration, the normal reaction is:',['mg','m/g','g/m','0'],0,'Vertical equilibrium gives N = mg.'],['If an object is on an inclined plane at angle θ, the normal reaction is generally:',['mg sin θ','mg cos θ','mg tan θ','mg'],1,'For an object on an incline with no other perpendicular forces, N = mg cos θ.'],['The normal reaction is a:',['Non-contact force','Contact force','Nuclear force','Magnetic force'],1,'It arises from physical contact between surfaces.'],['If a person pushes down on a weighing scale, the normal reaction from the scale:',['Decreases','Increases','Becomes zero','Must equal zero'],1,'The extra downward force requires a larger upward normal reaction for vertical balance.'],['A block is accelerating upward in an elevator. Compared with its weight, the normal reaction is:',['Greater than its weight','Less than its weight','Equal to zero','Always equal to its weight'],0,'For upward acceleration, N − mg = ma, so N > mg.'],['A block is accelerating downward in an elevator but remains in contact with the floor. The normal reaction is:',['Greater than mg','Less than mg','Always zero','Infinite'],1,'For downward acceleration, N = m(g − a), so N < mg.'],['When an object is in free fall and has no contact with a surface, its normal reaction is:',['mg','Less than mg','Zero','Infinite'],2,'No contact means there is no normal reaction.'],['Which statement about normal reaction is correct?',['It always equals the weight','It depends on the contact conditions and other forces','It always acts downward','It is always zero on an incline'],1,'Normal force depends on geometry and all forces perpendicular to the surface.'],['A block rests on a horizontal surface while a force pulls it upward at an angle. The normal reaction is generally:',['Greater than mg','Less than mg','Exactly 2mg','Always zero'],1,'An upward component of the applied force reduces the required normal reaction.'],['A block is pressed against a vertical wall by a horizontal force. The normal reaction from the wall is:',['Vertical upward','Vertical downward','Horizontal, perpendicular to the wall','Zero'],2,'The wall pushes perpendicular to its surface, horizontally in this case.'],['If a horizontal surface exerts N = 50 N on an object and there is no vertical acceleration, the total downward vertical force is:',['0 N','25 N','50 N','100 N'],2,'With no vertical acceleration, upward and downward vertical forces balance.'],['Which is the best way to determine normal reaction in a force problem?',['Assume N = mg in every situation','Draw a free-body diagram and apply Newton’s laws','Ignore the contact surface','Use only the object’s speed'],1,'A free-body diagram reveals the forces and lets Newton’s laws determine N.']];let i=0,selected=-1,score=0,points=0,checked=false;const $=id=>document.getElementById(id);function shuffle(a){for(let k=a.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[a[k],a[r]]=[a[r],a[k]]}return a}function render(){const a=quiz[i];selected=-1;checked=false;$('question').textContent=a[0];$('count').textContent='Question '+(i+1)+' of '+quiz.length;$('pct').textContent=Math.round((i+1)/quiz.length*100)+'%';$('options').innerHTML='';$('feedback').textContent='';$('feedback').className='feedback';$('hint').textContent='💡 Think about the direction perpendicular to the contact surface.';$('check').disabled=false;$('next').disabled=true;$('next').textContent=i===quiz.length-1?'Finish Skill →':'Next Question →';const order=shuffle(a[1].map((text,index)=>({text,index})));order.forEach((item,j)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{if(checked)return;selected=item.index;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('options').appendChild(b)})}function check(){if(selected<0){$('feedback').className='feedback bad';$('feedback').textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];document.querySelectorAll('.option').forEach(b=>{const idx=Number(b.dataset.index);b.disabled=true;if(idx===a[2])b.classList.add('correct');if(idx===selected&&selected!==a[2])b.classList.add('wrong')});if(ok){score++;points+=10;$('feedback').className='feedback good';$('feedback').textContent='✓ Correct — '+a[3]}else{$('feedback').className='feedback bad';$('feedback').textContent='✗ Review — '+a[3]}$('xp').textContent=points;$('mastery').textContent=Math.round(score/quiz.length*100)+'%';$('fill').style.width=(score/quiz.length*100)+'%';$('check').disabled=true;$('next').disabled=false}function next(){if(!checked)return;if(i<quiz.length-1){i++;render()}else{$('question').textContent='🎉 Normal Reaction Complete!';$('options').innerHTML='';$('check').style.display='none';$('next').style.display='none';$('hint').textContent='';$('feedback').className='feedback good';$('feedback').textContent='Skill complete. '+score+' / '+quiz.length+' correct • '+points+' XP earned.';$('result').style.display='block'}}$('check').onclick=check;$('next').onclick=next;$('retry').onclick=()=>{i=0;score=0;points=0;$('xp').textContent='0';$('mastery').textContent='0%';$('fill').style.width='0%';$('result').style.display='none';$('check').style.display='';$('next').style.display='';render()};$('back').onclick=e=>{e.preventDefault();const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return}}catch(e){}}location.href='physics-home.html'};render();</script></body></html>
