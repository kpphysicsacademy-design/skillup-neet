<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Nuclear Fission</title><meta name="description" content="SkillUp Physics Nuclear Fission interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">⚛️</span><h1>Nuclear Fission</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["Nuclear fission is the process in which:",["A heavy nucleus splits into two or more lighter nuclei","Two light nuclei combine to form a heavy nucleus","An electron is removed from an atom","A nucleus emits only visible light"],0,"In fission, a heavy atomic nucleus splits into smaller nuclei, usually releasing energy and neutrons."] ,["A commonly used fissile isotope in nuclear reactors is:",["U-235","C-12","H-1","He-4"],0,"Uranium-235 is a fissile isotope capable of sustaining a neutron-induced fission chain reaction."] ,["In a typical U-235 fission event, the incoming particle is usually a:",["Slow neutron","Alpha particle","Electron","Gamma ray"],0,"A thermal (slow) neutron can induce fission in U-235."] ,["The energy released in nuclear fission mainly comes from:",["Decrease in total rest mass converted to energy","Chemical bond formation","Electron transitions only","Atmospheric pressure"],0,"The products have slightly less total rest mass than the initial system; the mass difference appears as energy according to E=mc²."] ,["The approximate energy released by one U-235 fission event is of the order of:",["200 MeV","2 eV","200 J","0.2 MeV"],0,"A typical fission event releases about 200 MeV of energy."] ,["The neutrons released during fission can cause:",["Further fission reactions","Only chemical reactions","Immediate fusion of all nuclei","No subsequent nuclear process"],0,"Released neutrons can induce fission in other fissile nuclei, producing a chain reaction."] ,["A self-sustaining sequence of fission reactions is called a:",["Chain reaction","Fusion cycle","Chemical equilibrium","Decay spectrum"],0,"A chain reaction occurs when neutrons from one fission event trigger additional fissions."] ,["In a nuclear reactor, a moderator is used mainly to:",["Slow down fast neutrons","Absorb all neutrons","Increase the temperature of fuel","Stop fission by removing protons"],0,"Moderators such as water or heavy water slow neutrons, increasing the likelihood of fission in suitable fuels such as U-235."] ,["Control rods in a nuclear reactor are used primarily to:",["Absorb neutrons and control the reaction rate","Produce neutrons","Increase fuel mass","Cool the reactor directly"],0,"Control rods absorb neutrons and regulate the chain reaction."] ,["A nuclear reactor is designed to maintain a:",["Controlled chain reaction","Runaway chain reaction","Chemical combustion reaction","Fusion-only reaction"],0,"A reactor controls the chain reaction so energy is released at a manageable rate."] ,["The critical condition in a sustained chain reaction corresponds approximately to:",["One effective neutron from each generation causing another fission on average","All neutrons escaping the core","No fissions occurring","Every neutron causing exactly ten fissions"],0,"At criticality, the effective multiplication factor is about 1, so the chain reaction is self-sustaining."] ,["In nuclear fission, the total number of nucleons is:",["Conserved in the nuclear reaction","Always doubled","Always reduced to zero","Converted entirely into electrons"],0,"Nucleon number is conserved when the fission equation includes all emitted neutrons and products."] ,["Fission fragments are generally:",["More tightly bound per nucleon than the original very heavy nucleus","Less massive than electrons","Always identical nuclei","Pure electromagnetic radiation"],0,"The binding energy per nucleon is generally higher in medium-mass nuclei than in very heavy nuclei, allowing energy release when a heavy nucleus fissions."] ,["Which statement distinguishes fission from fusion?",["Fission splits a heavy nucleus; fusion combines light nuclei","Fission combines light nuclei; fusion splits heavy nuclei","Both always split heavy nuclei","Both are chemical reactions"],0,"Fission splits heavy nuclei, whereas fusion combines light nuclei."] ,["The main useful energy output of a fission reactor is initially carried by:",["Kinetic energy of fission products and neutrons","Only visible photons","Chemical energy of fuel bonds","The rest mass of electrons alone"],0,"Most fission energy initially appears as kinetic energy of the fission fragments and emitted neutrons, which becomes thermal energy in the reactor."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
