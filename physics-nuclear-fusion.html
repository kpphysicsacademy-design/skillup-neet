<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Nuclear Fusion</title><meta name="description" content="SkillUp Physics Nuclear Fusion interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">☀️</span><h1>Nuclear Fusion</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["Nuclear fusion is the process in which:",["Two or more light nuclei combine to form a heavier nucleus","A heavy nucleus splits into smaller nuclei","An electron leaves an atom","A nucleus emits only gamma radiation"],0,"Fusion combines light nuclei to form a heavier nucleus, with energy released when the products are more tightly bound per nucleon."] ,["The energy released in nuclear fusion is primarily associated with:",["An increase in binding energy per nucleon and mass-energy conversion","Chemical bond formation","Electron motion only","Atmospheric pressure"],0,"Fusion of suitable light nuclei can move the system toward greater binding energy per nucleon; the mass difference appears as energy through E=mc²."] ,["The main source of the Sun’s energy is:",["Nuclear fusion","Nuclear fission","Chemical combustion","Radioactive decay only"],0,"The Sun generates energy mainly through nuclear fusion reactions in its hot interior."] ,["The principal nuclei involved in the proton-proton chain in the Sun are:",["Hydrogen nuclei (protons)","Uranium nuclei","Iron nuclei only","Carbon nuclei only"],0,"In the proton-proton chain, hydrogen nuclei ultimately fuse to form helium, releasing energy."] ,["A major difficulty in achieving controlled fusion on Earth is that the fuel must be:",["Heated to extremely high temperatures so nuclei can overcome electrostatic repulsion","Cooled to absolute zero","Converted into electrons","Kept at ordinary room temperature"],0,"Very high temperatures are needed to give nuclei sufficient kinetic energy and create a plasma in which fusion can occur."] ,["The electrostatic repulsion between two positively charged nuclei is called the:",["Coulomb barrier","Nuclear binding force","Gravitational barrier","Magnetic monopole"],0,"The Coulomb barrier arises because positively charged nuclei repel one another."] ,["Fusion becomes possible at very high temperature mainly because:",["Nuclei acquire enough kinetic energy for close nuclear interaction","Electrons become heavier","Gravity becomes zero","The nuclei lose all charge"],0,"High thermal energies help nuclei approach closely enough for the short-range strong nuclear interaction to become important."] ,["The state of matter produced in a very hot fusion environment is generally:",["Plasma","Solid","Molecular crystal","Superfluid water"],0,"At fusion temperatures, matter is ionised and exists largely as plasma containing nuclei and electrons."] ,["A commonly studied fusion reaction for terrestrial research uses:",["Deuterium and tritium","Uranium-235 and plutonium-239","Carbon-12 and oxygen-16","Hydrogen chloride and sodium"],0,"Deuterium-tritium fusion is widely studied because it has a relatively high fusion reaction rate at achievable experimental temperatures."] ,["In deuterium-tritium fusion, the main products are:",["Helium-4 nucleus and a neutron","Two electrons and a proton","Uranium and a neutron","Two alpha particles only"],0,"The D-T reaction produces a helium-4 nucleus (alpha particle), a neutron, and releases about 17.6 MeV."] ,["Compared with fission of heavy nuclei, fusion of suitable light nuclei can release energy because:",["The fusion products can have greater binding energy per nucleon","Fusion always decreases binding energy per nucleon","Fusion converts all mass into radiation","There are no nuclear forces"],0,"For light nuclei, fusion can increase binding energy per nucleon and lower the total rest mass, releasing energy."] ,["Which force provides the short-range attraction that binds nucleons in a nucleus?",["Strong nuclear interaction","Electrostatic repulsion","Gravitational force only","Friction"],0,"The strong nuclear interaction provides the dominant short-range attractive nuclear binding."] ,["A major engineering challenge for magnetic-confinement fusion is:",["Keeping an extremely hot plasma confined away from material walls","Keeping the fuel frozen","Preventing all ionisation","Removing all magnetic fields"],0,"Magnetic confinement aims to keep hot charged plasma away from reactor walls while maintaining conditions for fusion."] ,["In inertial-confinement fusion, fuel is compressed rapidly so that:",["Very high density and temperature can produce fusion conditions","The fuel becomes a solid crystal permanently","All neutrons are removed","The nuclei become electrically neutral"],0,"Inertial confinement rapidly compresses a small fuel target, creating extreme density and temperature for a short time."] ,["Which statement correctly compares nuclear fusion and fission?",["Fusion combines light nuclei; fission splits heavy nuclei","Fusion splits heavy nuclei; fission combines light nuclei","Both are chemical reactions","Neither can release nuclear energy"],0,"Fusion combines light nuclei, while fission splits heavy nuclei; both can release energy through changes in nuclear binding and mass."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
