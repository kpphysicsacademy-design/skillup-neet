<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Nuclear Structure</title><meta name="description" content="SkillUp Physics Nuclear Structure interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">⚛️</span><h1>Nuclear Structure</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["The nucleus of an atom contains:",["Protons and neutrons","Only electrons","Only protons","Electrons and neutrons"],0,"The atomic nucleus is made of positively charged protons and neutral neutrons."] ,["The atomic number Z of a nucleus represents its number of:",["Protons","Neutrons","Nucleons","Electrons plus neutrons"],0,"Atomic number Z is the number of protons in the nucleus."] ,["The mass number A of a nucleus is equal to:",["Number of protons + number of neutrons","Number of protons − number of neutrons","Number of electrons + protons","Number of neutrons − protons"],0,"Mass number A is the total number of nucleons: protons plus neutrons."] ,["The number of neutrons in a nucleus is:",["A−Z","A+Z","Z−A","A/Z"],0,"Since A=Z+N, the neutron number is N=A−Z."] ,["Nuclei having the same atomic number but different mass numbers are called:",["Isotopes","Isobars","Isotones","Isomers"],0,"Isotopes have the same Z but different numbers of neutrons and therefore different A."] ,["Nuclei having the same mass number but different atomic numbers are called:",["Isobars","Isotopes","Isotones","Nucleons"],0,"Isobars have the same mass number A but different atomic numbers Z."] ,["Nuclei having the same number of neutrons but different atomic numbers are called:",["Isotones","Isotopes","Isobars","Isomers"],0,"Isotones have the same neutron number N but different Z."] ,["The approximate radius of a nucleus is proportional to:",["A^(1/3)","A","A^(−1)","A²"],0,"The nuclear radius follows R=R₀A^(1/3), showing that nuclear volume is roughly proportional to A."] ,["The density of ordinary nuclear matter is approximately:",["Nearly constant for different nuclei","Proportional to A²","Zero for heavy nuclei","Dependent only on atomic number"],0,"Because nuclear volume is proportional to A, nuclear density is approximately constant across nuclei."] ,["The force responsible for holding nucleons together inside the nucleus is primarily the:",["Strong nuclear force","Gravitational force","Electrostatic force alone","Magnetic force alone"],0,"The strong nuclear interaction provides the attractive binding between nucleons at nuclear distances."] ,["Nuclear force is best described as:",["Short-range and strongly attractive at suitable nuclear separations","Long-range and purely repulsive","Only gravitational","Independent of nucleon separation"],0,"Nuclear forces act over very short distances and are strongly attractive over the relevant range."] ,["The mass of a stable bound nucleus is generally:",["Less than the sum of the masses of its separated nucleons","Greater than the sum in every case","Exactly equal in every case","Zero"],0,"The mass defect corresponds to binding energy, so a bound nucleus has less mass than its separated constituents."] ,["Mass defect is converted into nuclear binding energy according to:",["E=Δmc²","E=mc","E=Δm/c²","E=½mc² only"],0,"Einstein's relation gives the nuclear binding energy as ΔE=Δmc²."] ,["Binding energy per nucleon is useful for comparing:",["The stability of different nuclei","The atomic radius only","Electron spin only","Chemical valency only"],0,"Binding energy per nucleon indicates how strongly nucleons are bound on average and is used as a stability measure."] ,["The nucleus with the greatest binding energy per nucleon is generally among the:",["Most tightly bound and stable nuclei","Least massive particles","Most electrically charged particles","Nuclei with no neutrons"],0,"A high binding energy per nucleon corresponds to strong average nuclear binding and greater nuclear stability."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
