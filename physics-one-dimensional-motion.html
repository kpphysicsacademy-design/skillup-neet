<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | One-dimensional Motion</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eef7ff;color:#173b62}.wrap{max-width:1050px;margin:auto;padding:20px}.skill,.hero,.quiz,.panel,.mastery{background:#fff;border-radius:20px;padding:22px;margin:12px 0;box-shadow:0 6px 18px #123b7015}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #dbe7f1;border-radius:15px;background:#fff;text-align:left;font-weight:700;cursor:pointer}.option.selected{border-color:#1677ff;background:#eef6ff}.option.correct{border-color:#2db84d;background:#eaffef}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{padding:12px 18px;border:0;border-radius:13px;font-weight:900;cursor:pointer;margin:8px 6px 0 0}.check{background:#2db84d;color:#fff}.next{background:#dcecff;color:#145b9e}.feedback{margin-top:14px;padding:13px;border-radius:14px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.bar{height:13px;background:#dce8f2;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#42c95a}@media(max-width:750px){.layout{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="topbar"><a href="physics-home.html">← Back to Physics Path</a><span class="skill">⚡ <span id="xp">0</span> XP</span></div><section class="hero"><div>PHYSICS • NEET 2026</div><h1>One-dimensional motion</h1><p>LEARN → PRACTICE → MASTER • 15 focused NEET-style MCQs</p></section><section class="mastery"><b>🎯 Skill Mastery <span id="mt">0 / 15</span></b><div class="bar"><div id="fill" class="fill"></div></div></section><div class="layout"><aside class="panel"><h3 id="count">Question 1 of 15</h3><div id="pct">7%</div><div>One-dimensional motion</div><div>⚡ +10 XP each</div><div>🦉 Learn → Practice → Master</div></aside><section class="quiz"><b id="badge">Q1</b><h2 id="q"></h2><div id="opts" class="options"></div><button id="check" class="btn check">Check Answer</button><button id="next" class="btn next" disabled>Next Question →</button><div id="fb" class="feedback"></div><p>💡 Choose the best answer.</p></section></div></main><script>(function(){const quiz=[['One-dimensional motion means motion in which an object:',['Moves along a single straight-line coordinate','Must move in a circle','Has zero velocity always','Has no displacement'],0],['In one-dimensional motion, position is specified by:',['One coordinate along the chosen axis','Two independent coordinates always','Three coordinates always','Only the speed'],0],['Which example is approximately one-dimensional motion?',['A train moving along a straight track','A satellite orbiting Earth','A stone moving in a circular path','A projectile in two-dimensional space'],0],['For motion along the x-axis, displacement is:',['The change in x-coordinate','Always equal to distance','Always positive','Always zero'],0],['A particle moves from x = 2 m to x = 8 m. Its displacement is:',['6 m','10 m','4 m','16 m'],0],['If a particle moves from x = 8 m to x = 2 m, its displacement is:',['−6 m','+6 m','10 m','0 m'],0],['In one-dimensional motion, velocity can be:',['Positive, negative, or zero depending on direction','Only positive','Only negative','Never zero'],0],['The magnitude of displacement in one-dimensional motion is always:',['Less than or equal to distance travelled','Greater than distance travelled','Equal to time','Equal to speed'],0],['A particle moves 5 m east and then 3 m west along a straight line. Taking east as positive, displacement is:',['+2 m','+8 m','−2 m','−8 m'],0],['If x = x₀ + vt for constant v, the motion is:',['Uniform motion','Non-uniform motion','Circular motion','Oscillatory motion'],0],['The slope of a position-time graph in one-dimensional motion gives:',['Velocity','Acceleration','Distance','Time'],0],['The slope of a velocity-time graph gives:',['Acceleration','Position','Displacement only','Distance only'],0],['A body at rest on the x-axis has:',['Constant position and zero velocity','Constant velocity and changing position','Maximum acceleration','Negative displacement continuously'],0],['If velocity is negative along the chosen positive x-direction, the particle moves:',['In the negative x-direction','In the positive x-direction','Perpendicular to x-axis','Without motion'],0],['Which statement is correct for one-dimensional motion?',['Direction can be represented by the sign of the coordinate or velocity','Distance must always be zero','Velocity can never change sign','Displacement is always equal to distance'],0]];let i=0,sel=-1,score=0,q=document.getElementById('q'),o=document.getElementById('opts'),fb=document.getElementById('fb'),check=document.getElementById('check'),next=document.getElementById('next');function render(){let a=quiz[i];sel=-1;q.textContent=a[0];document.getElementById('badge').textContent='Q'+(i+1);document.getElementById('count').textContent='Question '+(i+1)+' of '+quiz.length;document.getElementById('pct').textContent=Math.round((i+1)/quiz.length*100)+'%';o.innerHTML='';fb.textContent='';fb.className='feedback';check.disabled=false;next.disabled=true;a[1].forEach((v,j)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+v;b.onclick=()=>{sel=j;[...o.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)})}check.onclick=()=>{if(sel<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}let a=quiz[i];[...o.children].forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===sel&&j!==a[2])b.classList.add('wrong')});if(sel===a[2]){score++;fb.className='feedback good';fb.textContent='🎯 Correct! +10 XP'}else{fb.className='feedback bad';fb.textContent='Not quite. Correct answer: '+a[1][a[2]]}document.getElementById('xp').textContent=score*10;document.getElementById('mt').textContent=score+' / '+quiz.length;document.getElementById('fill').style.width=score/quiz.length*100+'%';check.disabled=true;next.disabled=false;if(i===quiz.length-1)next.textContent='Finish Skill →'};next.onclick=()=>{if(i<quiz.length-1){i++;next.textContent='Next Question →';render()}else{q.textContent='🏆 One-dimensional Motion Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+score+' / '+quiz.length+' correct • '+score*10+' XP'}};render()})();</script></body></html>
