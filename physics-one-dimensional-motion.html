<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | One-dimensional Motion</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:flex-end;align-items:center}.xp{background:#fff;border:1px solid #dfe3ea;border-radius:14px;padding:7px 11px;font-weight:850;white-space:nowrap}.intro{margin:24px 0 18px}.intro h1{margin:0 0 8px;font-size:2rem;line-height:1.15}.intro p{margin:0;color:#596273;line-height:1.55}.progress{height:12px;background:#e4e7ed;border-radius:99px;overflow:hidden;margin:20px 0}.fill{height:100%;width:0;background:#58cc02;transition:width .25s ease}.card{background:#fff;border-radius:22px;padding:26px;box-shadow:0 8px 24px rgba(23,32,51,.08)}.meta{font-size:.95rem;font-weight:800;color:#596273;margin-bottom:12px}.q{font-size:1.3rem;font-weight:750;line-height:1.45;margin:0 0 20px}.options{display:grid;gap:10px}.option{padding:15px 16px;border:2px solid #dfe3ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;color:#172033;cursor:pointer;transition:border-color .15s,background .15s,transform .1s,box-shadow .15s}.option:hover:not(:disabled){border-color:#58cc02;background:#f5fff0;transform:translateY(-1px);box-shadow:0 3px 0 #dfe3ea}.option.selected{border-color:#5146a5;background:#f1efff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#ff4b4b;background:#fff0f0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{padding:12px 18px;border:0;border-radius:13px;font:inherit;font-weight:850;cursor:pointer}.check,.retry{background:#58cc02;color:#fff}.next{background:#5146a5;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:16px;min-height:24px;font-weight:750;line-height:1.5}.good{color:#177b2f}.bad{color:#b02a37}.hint{margin:18px 0 0;color:#596273;font-size:.95rem}.result{display:none;text-align:center;margin-top:20px;padding-top:18px;border-top:1px solid #e5e7eb}.result h2{margin:0 0 8px}.bottom-nav{margin-top:20px;text-align:center}.back{display:inline-block;color:#5146a5;font-weight:800;text-decoration:none;padding:9px 12px;border-radius:12px;transition:transform .15s,background .15s,box-shadow .15s}.back:hover{background:#eeeaff;transform:translateY(-1px);box-shadow:0 4px 12px rgba(81,70,165,.12)}.back:focus-visible{outline:3px solid #b9b0ff;outline-offset:2px}.back:active{transform:scale(.98)}@media(max-width:600px){.wrap{padding:20px 14px}.intro h1{font-size:1.65rem}.card{padding:20px}.q{font-size:1.15rem}}</style></head><body><main class="wrap"><div class="top"><span class="xp">⚡ <span id="xp">0</span> XP</span></div><section class="intro"><h1>📍 One-dimensional Motion</h1><p>Master motion along a single coordinate axis with 15 focused NEET-style MCQs.</p></section><div class="progress" aria-label="Quiz progress"><div id="fill" class="fill"></div></div><section class="card"><div class="meta"><span id="count">Question 1 of 15</span> • <span id="pct">7%</span></div><h2 id="q" class="q"></h2><div id="opts" class="options"></div><div class="actions"><button id="check" class="btn check" type="button">Check Answer</button><button id="next" class="btn next" type="button" disabled>Next Question →</button></div><div id="fb" class="feedback" aria-live="polite"></div><p class="hint">💡 Choose the best answer.</p><div id="result" class="result"><h2>🏆 Skill Complete!</h2><p id="score"></p><button id="retry" class="btn retry" type="button">Retry Skill</button></div></section><div class="bottom-nav"><a class="back" href="#" onclick="return goBackToPhysicsPath()">← Back to Physics Path</a></div></main><script>(function(){const KEY='skillupLastPhysicsPath';function rememberPath(){try{const r=document.referrer;if(!r)return;const u=new URL(r);if(u.origin!==location.origin)return;if(/(?:physics|full-physics)[^/]*path[^/]*\.html$/i.test(u.pathname)||/\/physics-home\.html$/i.test(u.pathname))sessionStorage.setItem(KEY,u.href)}catch(e){}}function goBackToPhysicsPath(){try{const saved=sessionStorage.getItem(KEY);if(saved){const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}}catch(e){}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false}window.goBackToPhysicsPath=goBackToPhysicsPath;rememberPath();const quiz=[['One-dimensional motion means motion in which an object:',['Moves along a single straight-line coordinate','Must move in a circle','Has zero velocity always','Has no displacement'],0,'One-dimensional motion is described using one spatial coordinate, such as x.'],['In one-dimensional motion, position is specified by:',['One coordinate along the chosen axis','Two independent coordinates always','Three coordinates always','Only the speed'],0,'A single coordinate along the chosen axis is sufficient to specify position.'],['Which example is approximately one-dimensional motion?',['A train moving along a straight track','A satellite orbiting Earth','A stone moving in a circular path','A projectile in two-dimensional space'],0,'Motion along a straight track can be described using one coordinate.'],['For motion along the x-axis, displacement is:',['The change in x-coordinate','Always equal to distance','Always positive','Always zero'],0,'Displacement along x is Δx = x₂ − x₁.'],['A particle moves from x = 2 m to x = 8 m. Its displacement is:',['6 m','10 m','4 m','16 m'],0,'Δx = 8 − 2 = 6 m.'],['If a particle moves from x = 8 m to x = 2 m, its displacement is:',['−6 m','+6 m','10 m','0 m'],0,'Δx = 2 − 8 = −6 m; the negative sign indicates motion toward the negative x-direction.'],['In one-dimensional motion, velocity can be:',['Positive, negative, or zero depending on direction','Only positive','Only negative','Never zero'],0,'The sign of velocity indicates direction relative to the chosen positive axis.'],['The magnitude of displacement in one-dimensional motion is always:',['Less than or equal to distance travelled','Greater than distance travelled','Equal to time','Equal to speed'],0,'Distance is the total path length, so it cannot be less than the magnitude of displacement.'],['A particle moves 5 m east and then 3 m west along a straight line. Taking east as positive, displacement is:',['+2 m','+8 m','−2 m','−8 m'],0,'Net displacement = +5 − 3 = +2 m.'],['If x = x₀ + vt for constant v, the motion is:',['Uniform motion','Non-uniform motion','Circular motion','Oscillatory motion'],0,'Constant velocity means equal displacements occur in equal time intervals: uniform motion.'],['The slope of a position-time graph in one-dimensional motion gives:',['Velocity','Acceleration','Distance','Time'],0,'Slope = Δx/Δt, which is velocity.'],['The slope of a velocity-time graph gives:',['Acceleration','Position','Displacement only','Distance only'],0,'Slope = Δv/Δt, which is acceleration.'],['A body at rest on the x-axis has:',['Constant position and zero velocity','Constant velocity and changing position','Maximum acceleration','Negative displacement continuously'],0,'At rest means position remains constant and velocity is zero.'],['If velocity is negative along the chosen positive x-direction, the particle moves:',['In the negative x-direction','In the positive x-direction','Perpendicular to x-axis','Without motion'],0,'A negative velocity means motion opposite to the chosen positive x-direction.'],['Which statement is correct for one-dimensional motion?',['Direction can be represented by the sign of the coordinate or velocity','Distance must always be zero','Velocity can never change sign','Displacement is always equal to distance'],0,'In one-dimensional motion, signs of coordinates and velocity can represent direction along the chosen axis.']];let i=0,sel=-1,score=0,locked=false;const $=id=>document.getElementById(id),q=$('q'),o=$('opts'),fb=$('fb'),check=$('check'),next=$('next'),xp=$('xp'),fill=$('fill'),count=$('count'),pct=$('pct');function render(){const a=quiz[i];sel=-1;locked=false;q.textContent=a[0];count.textContent='Question '+(i+1)+' of '+quiz.length;pct.textContent=Math.round((i+1)/quiz.length*100)+'%';fill.style.width=(score/quiz.length*100)+'%';fb.className='feedback';fb.textContent='';check.disabled=false;next.disabled=true;next.textContent='Next Question →';o.innerHTML='';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{if(locked)return;sel=item.index;Array.from(o.children).forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)})}check.onclick=function(){if(sel<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}locked=true;const a=quiz[i],ok=sel===a[2];Array.from(o.children).forEach(b=>{const originalIndex=Number(b.dataset.index);b.disabled=true;if(originalIndex===a[2])b.classList.add('correct');if(originalIndex===sel&&!ok)b.classList.add('wrong')});if(ok){score++;fb.className='feedback good';fb.textContent='🎯 Correct! '+a[3]+' +10 XP'}else{fb.className='feedback bad';fb.textContent='Not quite. '+a[3]+' Correct answer: '+a[1][a[2]]}xp.textContent=score*10;fill.style.width=(score/quiz.length*100)+'%';check.disabled=true;next.disabled=false;if(i===quiz.length-1)next.textContent='Finish Skill →'};next.onclick=function(){if(i<quiz.length-1){i++;render()}else{q.textContent='🏆 One-dimensional Motion Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+score+' / '+quiz.length+' correct • '+score*10+' XP';$('result').style.display='block';$('score').textContent=score+' / '+quiz.length+' correct • '+score*10+' XP'}};$('retry').onclick=()=>{i=0;sel=-1;score=0;locked=false;xp.textContent='0';$('result').style.display='none';check.style.display='';next.style.display='';render()};render()})();</script></body></html>
