<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Optical Instruments</title><meta name="description" content="SkillUp Physics Optical Instruments interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🔭</span><h1>Optical Instruments</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["The least distance of distinct vision for a normal human eye is approximately:",["25 cm","2.5 cm","250 m","1 m"],0,"For a normal eye, the least distance of distinct vision is conventionally taken as 25 cm."],["The far point of a normal human eye is approximately:",["Infinity","25 cm","1 m","10 cm"],0,"A normal eye can focus on distant objects with the far point effectively at infinity."],["The ability of the eye lens to change its focal length to focus objects at different distances is called:",["Accommodation","Dispersion","Diffraction","Polarisation"],0,"Accommodation is the adjustment of the eye lens focal length by the ciliary muscles."],["Myopia is commonly corrected using a:",["Concave lens","Convex lens","Cylindrical mirror","Plane glass plate"],0,"A concave lens diverges incoming rays so that the myopic eye can form the image on the retina."],["Hypermetropia is commonly corrected using a:",["Convex lens","Concave lens","Plane mirror","Prism only"],0,"A convex lens provides the required convergence so that the image forms on the retina."],["The magnifying power of a simple microscope is increased when its focal length is:",["Decreased","Increased greatly","Infinite","Zero only"],0,"For a simple microscope, magnifying power increases as focal length decreases."],["A compound microscope uses:",["An objective and an eyepiece","Two plane mirrors only","One concave mirror only","A prism without lenses"],0,"A compound microscope has a short-focal-length objective and an eyepiece that further magnifies the intermediate image."],["The objective of a compound microscope generally has:",["Short focal length and small aperture","Very long focal length only","No focal length","A plane surface only"],0,"The microscope objective has a short focal length to produce a strongly magnified real intermediate image."],["The eyepiece of a compound microscope acts essentially as a:",["Simple microscope","Plane mirror","Concave mirror","Prism only"],0,"The eyepiece magnifies the real intermediate image produced by the objective, functioning as a simple magnifier."],["An astronomical telescope is primarily used to view:",["Distant objects","Very small nearby objects only","Objects inside the eye","Only microscopic cells"],0,"An astronomical telescope provides angular magnification for distant celestial objects."],["In a normal adjustment astronomical telescope, the final image is formed at:",["Infinity","The objective lens","The near point","The focal plane of the objective only"],0,"In normal adjustment, the eyepiece is arranged so the final image is at infinity for relaxed viewing."],["The magnifying power of an astronomical telescope in normal adjustment, in magnitude, is:",["f_o/f_e","f_e/f_o","f_o+f_e","f_o-f_e"],0,"For a telescope in normal adjustment, angular magnifying power in magnitude is f_o/f_e."],["For a refracting astronomical telescope, the focal length of the objective is generally:",["Much larger than that of the eyepiece","Much smaller than that of the eyepiece","Equal to zero","Always equal to the aperture"],0,"A large objective focal length and a small eyepiece focal length provide high angular magnification."],["A reflecting telescope uses a:",["Mirror as its primary light-collecting element","Convex lens as its only primary element","Plane glass plate only","Prism as the primary objective"],0,"A reflecting telescope uses a concave primary mirror to collect and focus light."],["The resolving power of an optical instrument refers to its ability to:",["Distinguish two closely spaced objects as separate","Increase only the brightness","Change the colour of light","Measure temperature"],0,"Resolving power describes the ability to distinguish fine details or two nearby objects separately."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
