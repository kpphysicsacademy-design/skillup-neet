<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SkillUp Physics | Optics Measurement</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.opt.selected{border-color:#5146a5;background:#f4f1ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.opt:disabled{cursor:default}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🔭 Optics Measurement</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="action">CHECK</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['A metre scale is commonly used to measure:',['Mass','Length','Temperature','Electric current'],1,'A metre scale is a length-measuring instrument.'],['The least count of a standard metre scale is commonly:',['1 cm','1 mm','1 m','0.1 m'],1,'The smallest division on a typical metre scale is 1 mm.'],['A vernier caliper can measure:',['Only temperature','Length, internal/external dimensions and depth','Only electric current','Only mass'],1,'A vernier caliper is used for precise measurements of length, diameter, depth and related dimensions.'],['A screw gauge is particularly useful for measuring:',['Very small thicknesses or diameters','Room temperature','Large distances between cities','Electric voltage'],0,'A screw gauge provides high precision for small thicknesses and diameters.'],['The least count of a vernier caliper is determined from:',['The relation between main-scale and vernier-scale divisions','The colour of the instrument','The object mass','The room temperature'],0,'The least count depends on the difference between the value of one main-scale division and one vernier division.'],['A convex lens can be used in an optics experiment to determine:',['Focal length','Electric resistance','Mass density only','Current'],0,'Optical experiments with a convex lens can be used to determine its focal length.'],['The focal length of a convex lens is commonly measured in:',['Metres or centimetres','Kilograms','Amperes','Seconds only'],0,'Focal length is a length, so metres or centimetres are appropriate units.'],['A screen in a lens experiment is adjusted to obtain:',['A clear image','A current reading','A mass reading','A temperature reading'],0,'The screen position is adjusted until the image is sharp and clearly formed.'],['For measuring a small diameter accurately, which instrument is generally more precise than a metre scale?',['Screw gauge','Clock','Thermometer','Ammeter'],0,'A screw gauge is designed for precise measurement of small diameters and thicknesses.'],['Parallax error in reading an analogue scale is reduced by:',['Keeping the eye perpendicular to the scale at the reading point','Looking from far to the side','Moving the scale randomly','Closing one eye and tilting the scale'],0,'Eye alignment perpendicular to the scale helps avoid parallax when taking an analogue reading.'],['In an optical bench, the positions of components are often read using:',['A calibrated scale','A thermometer','An ammeter','A weighing balance'],0,'An optical bench uses a calibrated length scale to determine component positions.'],['If an object is 20 cm from a lens and the image forms 60 cm away, the magnitudes of u and v are:',['20 cm and 60 cm','60 cm and 20 cm','40 cm and 80 cm','20 cm and 20 cm'],0,'The object distance magnitude is 20 cm and the image distance magnitude is 60 cm.'],['The lens formula connects:',['Object distance, image distance and focal length','Mass, volume and density only','Voltage and current only','Time and temperature'],0,'The lens formula relates object distance u, image distance v and focal length f.'],['Good experimental measurement practice includes:',['Recording units, appropriate precision and repeated readings when needed','Ignoring instrument resolution','Changing units randomly','Recording only the final answer'],0,'Clear units, suitable precision and repeated observations improve the quality of experimental measurements.'],['Why should an optical measurement be repeated when practical?',['To check consistency and reduce the influence of random variation','To change the focal length','To remove all systematic errors','To avoid recording data'],0,'Repeated observations help assess consistency and reduce random variation in the reported result.']];let i=0,score=0,answered=false,selected=-1;const $=x=>document.getElementById(x);function render(){answered=false;selected=-1;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q[1].map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('action').classList.remove('hide');$('action').textContent='CHECK'});$('xp').textContent='';$('action').classList.add('hide');$('action').disabled=false;}$('action').onclick=()=>{if(selected<0)return;if(!answered){answered=true;const q=qs[i],ok=selected===q[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===selected&&!ok)b.classList.add('wrong')});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[3];if(ok)score++;$('score').textContent=`XP ${score}`;$('fill').style.width=`${(i+1)/15*100}%`;$('action').textContent=i===14?'FINISH':'Next Question →';return;}if(i<14){i++;render()}else{$('quiz').innerHTML='';$('action').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}};render();</script></body></html>
