<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Orbital Velocity</title><style>body{margin:0;background:#f5f7fa;font-family:Arial,sans-serif;color:#172033}.wrap{max-width:760px;margin:auto;padding:24px 16px 50px}.head{display:flex;justify-content:space-between;align-items:center}.title{font-size:28px;font-weight:800}.xp{font-weight:700;color:#168447}.sub{color:#667085;margin:8px 0 18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #0000000b}.mastery{font-weight:700}.bar{height:10px;background:#e7ebf0;border-radius:10px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#22a06b;transition:.3s}.qno{font-size:14px;color:#667085}.q{font-size:20px;font-weight:750;line-height:1.4;margin:10px 0 18px}.opt{display:block;width:100%;text-align:left;padding:14px;margin:9px 0;border:2px solid #d9dee7;background:#fff;border-radius:12px;cursor:pointer;font-size:16px;transition:.15s}.opt:hover{transform:translateY(-1px);border-color:#7b8798}.opt.sel{border-color:#3578e5;background:#eef5ff}.opt.correct{border-color:#20a464;background:#eaf8f0}.opt.wrong{border-color:#d64545;background:#fff0f0}.btn{border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:750;cursor:pointer;background:#22a06b;color:white}.btn:disabled{opacity:.5;cursor:not-allowed}.back{display:inline-block;text-decoration:none;color:#344054;border:2px solid #d9dee7;border-radius:12px;padding:12px 18px;font-weight:700;background:#fff;transition:.15s}.back:hover{transform:translateY(-2px);box-shadow:0 5px 14px #00000012}.feedback{min-height:24px;font-weight:700;margin-top:14px}.done{text-align:center;font-size:22px;font-weight:800}@media(max-width:600px){.title{font-size:23px}.q{font-size:18px}}</style></head><body><main class="wrap"><div class="head"><div class="title">🛰️ Orbital Velocity</div><div class="xp">+10 XP</div></div><div class="sub">Speed required for a satellite to remain in a circular orbit around a celestial body.</div><section class="card"><div class="mastery">🎯 Skill Mastery <span id="score">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card"><div class="qno" id="qno"></div><div class="q" id="q"></div><div id="opts"></div><button class="btn" id="continue" disabled>Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>const quiz=[['Orbital velocity is the speed required by a satellite to:', ['remain in a circular orbit','escape Earth completely','fall vertically','stop rotating'],0],['The orbital velocity of a satellite close to Earth is approximately:', ['7.9 km s⁻¹','3.0 km s⁻¹','11.2 km s⁻¹','15 km s⁻¹'],0],['For a circular orbit of radius r around mass M, orbital speed v is:', ['√(GM/r)','GM/r²','GM/r','√(Gr/M)'],0],['Orbital velocity is independent of the:', ['mass of the satellite','mass of the planet','orbital radius','gravitational constant'],0],['If orbital radius increases, orbital velocity:', ['decreases','increases','remains always constant','becomes zero'],0],['For a circular orbit, gravitational force provides the:', ['centripetal force','frictional force','buoyant force','magnetic force'],0],['The relation between orbital speed v and radius r is:', ['v ∝ 1/√r','v ∝ r','v ∝ r²','v ∝ 1/r²'],0],['At a greater altitude above Earth, a satellite generally has:', ['lower orbital speed','higher orbital speed','the same speed for all altitudes','zero speed'],0],['For a circular orbit, the gravitational potential energy of a satellite is:', ['−GMm/r','GMm/r','−GMm/r²','½GMm/r'],0],['The total mechanical energy of a satellite in circular orbit is:', ['−GMm/(2r)','GMm/(2r)','−GMm/r','GMm/r'],0],['The kinetic energy of a satellite in circular orbit is:', ['GMm/(2r)','−GMm/(2r)','GMm/r','2GMm/r'],0],['If Earths mass were doubled while orbital radius stayed fixed, orbital speed would become:', ['√2 times','2 times','half','unchanged'],0],['The time period T of a circular satellite orbit varies with radius as:', ['T ∝ r^(3/2)','T ∝ r','T ∝ 1/r','T ∝ r²'],0],['A geostationary satellite has orbital period equal to approximately:', ['24 h','12 h','48 h','6 h'],0],['The orbital velocity near a planet is related to escape velocity ve by:', ['v=ve/√2','v=√2ve','v=2ve','v=ve'],0]];let i=0,correct=0,selected=null,checked=false;function $(x){return document.getElementById(x)}function shuffle(a){for(let k=a.length-1;k>0;k--){let r=Math.floor(Math.random()*(k+1));[a[k],a[r]]=[a[r],a[k]]}return a}function render(){selected=null;checked=false;$('continue').disabled=true;$('continue').textContent='Continue →';$('feedback').textContent='';$('qno').textContent=`Question ${i+1} of 15`;$('q').textContent=quiz[i][0];$('opts').innerHTML='';const order=quiz[i][1].map((text,index)=>({text,index}));shuffle(order).forEach((x,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{if(checked)return;selected=x.index;document.querySelectorAll('.opt').forEach(z=>z.classList.remove('sel'));b.classList.add('sel');$('continue').disabled=false};$('opts').appendChild(b)});$('score').textContent=`${correct} / 15`;$('fill').style.width=`${(i/15)*100}%`}$('continue').onclick=()=>{if(selected===null)return;if(!checked){checked=true;const ok=selected===quiz[i][2];if(ok)correct++;document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const n=Number(b.dataset.index);if(n===quiz[i][2])b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=ok?'🎉 Correct! +10 XP':'💡 Review the highlighted correct answer.';$('score').textContent=`${correct} / 15`;$('fill').style.width=`${((i+1)/15)*100}%`;$('continue').textContent=i===14?'Finish Skill →':'Continue →';return}if(i<14){i++;render()}else{document.querySelector('.card:nth-of-type(2)').innerHTML=`<div class="done">🏆 Skill Complete!</div><p>You scored ${correct} / 15.</p><button class="btn" onclick="location.reload()">Retry →</button>`}};$('back').onclick=function(){const s=sessionStorage.getItem('skillupLastPhysicsPath');if(s){try{const u=new URL(s,location.href);if(u.origin===location.origin){location.href=s;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();</script></body></html>
