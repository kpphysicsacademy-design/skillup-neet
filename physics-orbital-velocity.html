.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}

.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🛰️ Orbital Velocity</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"The orbital speed for a circular orbit of radius r around mass M is:",o:["v = √(GM/r)","v = √(2GM/r)","v = GM/r²","v = √(GMr)"],a:0,e:"Equating gravity with centripetal force gives v = √(GM/r)."},
{q:"Near Earth's surface, circular orbital speed is approximately:",o:["7.9 km/s","11.2 km/s","1.0 km/s","30 km/s"],a:0,e:"For a low circular orbit near Earth, the speed is about 7.9 km/s."},
{q:"Orbital speed depends on the orbiting satellite's mass:",o:["No, its mass cancels","Yes, directly","Yes, inversely","Only if it is very small"],a:0,e:"The satellite mass cancels when gravitational force is equated to centripetal force."},
{q:"For a circular orbit, gravity provides the:",o:["Centripetal force","Tangential force in the direction of motion","Outward force","Propulsion force"],a:0,e:"Gravity points toward the centre and supplies the centripetal acceleration."},
{q:"If orbital radius doubles around the same central mass, orbital speed becomes:",o:["v/√2","v/2","2v","√2v"],a:0,e:"Since v ∝ 1/√r, doubling r reduces speed by √2."},
{q:"If the central mass becomes four times as large at fixed orbital radius, orbital speed:",o:["Doubles","Quadruples","Halves","Stays the same"],a:0,e:"Orbital speed varies as the square root of central mass."},
{q:"If orbital radius becomes four times as large, speed becomes:",o:["One-half","One-fourth","Twice","Four times"],a:0,e:"v' / v = √(r/4r) = 1/2."},
{q:"The radius r in the orbital-speed formula is measured from:",o:["The central body's centre","The central body's surface","The satellite's nearest edge","Sea level only"],a:0,e:"The orbital radius is centre-to-centre distance."},
{q:"At altitude h above a planet of radius R, circular orbital speed is:",o:["√[GM/(R+h)]","√[GM/h] always","√[2GM/(R+h)]","GM/(R+h)²"],a:0,e:"The orbital radius is R+h, measured from the planet's centre."},
{q:"Escape speed at the same radius compared with circular orbital speed is:",o:["√2 times","Twice","Half","Equal"],a:0,e:"Escape speed is √(2GM/r), while circular orbital speed is √(GM/r)."},
{q:"A satellite in circular orbit has centripetal acceleration:",o:["v²/r = GM/r²","v/r²","GM/r","v²r"],a:0,e:"Gravity supplies the centripetal acceleration GM/r²."},
{q:"The orbital period T and circular speed v are related by:",o:["v = 2πr/T","v = T/(2πr)","v = 2πT/r","v = rT"],a:0,e:"One orbit covers circumference 2πr in time T."},
{q:"The orbital period of a circular orbit is:",o:["T = 2π√(r³/GM)","T = √(GM/r³)","T = 2π√(GM/r)","T = GM/r²"],a:0,e:"Combine v = √(GM/r) with T = 2πr/v."},
{q:"For circular orbits around the same central mass, a larger orbit has:",o:["Lower speed and longer period","Higher speed and shorter period","Same speed and same period","Lower speed and shorter period"],a:0,e:"Larger r lowers speed and increases period according to Kepler's third law."},
{q:"If orbital radius increases by a factor of 4, period changes by:",o:["A factor of 8","A factor of 4","A factor of 2","A factor of 16"],a:0,e:"T ∝ r^(3/2), so 4^(3/2) = 8."},
{q:"A satellite at radius r has speed v. At radius 9r around the same planet, its speed is:",o:["v/3","v/9","3v","9v"],a:0,e:"Speed scales as 1/√r; √9 = 3."},
{q:"For an object in circular orbit, velocity direction is:",o:["Tangent to the orbit","Toward the centre","Away from the centre","Always vertical"],a:0,e:"Instantaneous velocity is tangent to the circular path."},
{q:"The gravitational force direction in a circular orbit is:",o:["Toward the centre","Tangent to the orbit","Away from the centre","Opposite the velocity always"],a:0,e:"Gravity is an inward central force."},
{q:"If central mass M doubles at the same orbital radius, speed changes by:",o:["A factor of √2","A factor of 2","A factor of 1/2","No change"],a:0,e:"v ∝ √M for fixed radius."},
{q:"A satellite has orbital radius 2R and another has radius R around the same planet. Their speed ratio v₂R : vR is:",o:["1:√2","2:1","1:2","√2:1"],a:0,e:"v₂R/vR = √(R/2R) = 1/√2."},
{q:"Which expression gives circular orbital speed from local gravity g at orbital radius r?",o:["v = √(gr)","v = gr²","v = √(g/r)","v = g/r"],a:0,e:"Since g = GM/r², v² = GM/r = gr."},
{q:"For a low circular orbit close to a planet's surface, using surface g and radius R, speed is approximately:",o:["√(gR)","√(2gR)","gR","g/R"],a:0,e:"Substitute GM = gR² into v = √(GM/R) to get √(gR)."},
{q:"A 1000 kg satellite and a 100 kg satellite share the same circular orbit. In the ideal model their orbital speeds are:",o:["Equal","10 times different","100 times different","Dependent on satellite mass"],a:0,e:"Orbital speed depends on central mass and orbital radius, not satellite mass."},
{q:"If the orbital radius is halved, circular orbital speed:",o:["Increases by √2","Doubles","Halves","Decreases by √2"],a:0,e:"v ∝ 1/√r, so halving r multiplies speed by √2."},
{q:"For a circular orbit, the satellite's total mechanical energy is:",o:["−GMm/(2r)","+GMm/r","Zero","−GMm/r²"],a:0,e:"Kinetic energy is GMm/(2r) and potential energy is −GMm/r, giving total −GMm/(2r)."},
{q:"In a stable circular orbit, a satellite is:",o:["In continuous free fall around the planet","Outside the influence of gravity","Held up by an outward gravitational force","At rest relative to the planet's centre"],a:0,e:"Gravity continually changes the satellite's direction, making it fall around the planet."},
{q:"If orbital speed is v at radius r, the speed at 4r is:",o:["v/2","v/4","2v","4v"],a:0,e:"Inverse square-root dependence gives v(4r) = v/2."},
{q:"The SI unit of orbital speed is:",o:["m/s","m/s²","N/kg","J"],a:0,e:"Speed is measured in metres per second."},
{q:"The dimensions of orbital speed are:",o:["LT⁻¹","LT⁻²","L²T⁻²","MLT⁻²"],a:0,e:"Velocity has dimensions length per time."},
{q:"Which assumption best matches v = √(GM/r)?",o:["A circular orbit dominated by a central mass M","A straight-line path with no gravity","A satellite at rest on the surface","A rocket with constant thrust only"],a:0,e:"The formula follows from balancing Newtonian gravity and centripetal force for a circular orbit."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Orbital Velocity Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
