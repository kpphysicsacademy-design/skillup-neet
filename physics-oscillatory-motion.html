<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Oscillatory Motion</title><style>body{font-family:Arial,sans-serif;background:#f3f7ff;margin:0;color:#1e293b}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(30,41,59,.10);border:1px solid #e2e8f0}h1{text-align:center;color:#334155}.meta{display:flex;justify-content:space-between;font-weight:700;color:#475569}.bar{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#22c55e;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;color:#172033}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe4f0;border-radius:14px;background:#fff;color:#1e293b;font-size:16px;cursor:pointer;transition:.2s}.opt:hover{background:#eef5ff;border-color:#93c5fd;transform:translateY(-1px)}.opt:focus-visible{outline:3px solid #bfdbfe;outline-offset:2px}.correct{border-color:#16a34a!important;background:#ecfdf3!important;color:#166534!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important;color:#991b1b!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s}.next,.retry{background:#4f46e5;color:#fff}.next:hover,.retry:hover{background:#4338ca}.back{background:#334155;color:#fff}.back:hover{background:#1e293b}.hide{display:none}.xp{text-align:center;font-weight:700;color:#d97706;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>↔️ Oscillatory Motion</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['Oscillatory motion is a motion that','moves only in a straight line','repeats to and fro about a mean position','always moves with constant speed','never repeats','repeats to and fro about a mean position','Oscillatory motion is generally a to-and-fro motion about a mean or equilibrium position.'],
['The position about which an oscillator moves to and fro is called the','extreme position','mean or equilibrium position','random position','initial position','mean or equilibrium position','The mean or equilibrium position is the reference position about which the body oscillates.'],
['The maximum displacement of an oscillating particle from its mean position is called','period','frequency','amplitude','phase','amplitude','Amplitude is the maximum displacement from the equilibrium position.'],
['The time taken by an oscillator to complete one full oscillation is called','frequency','period','amplitude','angular frequency','period','The period T is the time required for one complete oscillation.'],
['The frequency of an oscillator represents the','time for one oscillation','maximum displacement','number of oscillations per unit time','distance travelled in one oscillation','number of oscillations per unit time','Frequency is the number of complete oscillations per unit time.'],
['The relation between frequency ν and time period T is','ν = T','ν = 1/T','ν = 2πT','ν = T²','ν = 1/T','Frequency and period are reciprocals: ν = 1/T.'],
['A particle has a time period of 2 s. Its frequency is','0.25 Hz','0.5 Hz','2 Hz','4 Hz','0.5 Hz','ν = 1/T = 1/2 = 0.5 Hz.'],
['At the mean position of an ideal simple harmonic oscillator, the displacement is','maximum','zero','equal to amplitude','infinite','zero','The displacement is zero at the equilibrium or mean position.'],
['At an extreme position in SHM, the magnitude of displacement is','zero','A/2','A','2A','A','At either extreme, the displacement has maximum magnitude A, the amplitude.'],
['In simple harmonic motion, the restoring acceleration is','in the direction of displacement','opposite to displacement and proportional to it','always constant','zero everywhere','opposite to displacement and proportional to it','For SHM, a = −ω²x, so acceleration is directed toward equilibrium and proportional to displacement.'],
['The angular frequency ω and time period T are related by','ω = T/2π','ω = 2π/T','ω = 1/T²','ω = 2πT','ω = 2π/T','Angular frequency is ω = 2π/T = 2πν.'],
['Which of the following is an oscillatory motion?','Earth revolving around the Sun','A simple pendulum swinging about its mean position','A stone falling freely','A car travelling on a straight road','A simple pendulum swinging about its mean position','A simple pendulum executes to-and-fro motion about its equilibrium position for small oscillations.'],
['For x = A cos(ωt + φ), the quantity φ is the','amplitude','phase constant','frequency','period','phase constant','φ is the phase constant, which determines the initial phase of the oscillator.'],

];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
