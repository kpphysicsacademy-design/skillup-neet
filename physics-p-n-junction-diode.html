<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | P-N Junction Diode</title><meta name="description" content="SkillUp Physics P-N Junction Diode interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🔌</span><h1>P-N Junction Diode</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["A p-n junction is formed by joining:",["p-type and n-type semiconductor regions","Two metals only","Two insulators","Two n-type regions only"],0,"A p-n junction is formed at the boundary between p-type and n-type semiconductor regions."] ,["When p-type and n-type materials are joined, diffusion initially causes:",["Electrons and holes to move across the junction","Only protons to move","No carrier movement","Neutrons to diffuse"],0,"Majority carriers diffuse because of the concentration difference: electrons move from n to p and holes from p to n."] ,["The region around a p-n junction depleted of mobile charge carriers is called:",["Depletion region","Conduction band","Neutral region","Collector region"],0,"The depletion region contains fixed ionised donor and acceptor ions and very few mobile carriers."] ,["The electric field in the depletion region is directed approximately from:",["n-side to p-side","p-side to n-side","Positive terminal to negative terminal only","Ground to earth"],0,"Fixed positive donor ions on the n-side and negative acceptor ions on the p-side establish an electric field from n to p."] ,["The potential difference established across the depletion region is called:",["Barrier potential","Output voltage","Collector voltage","Thermal voltage only"],0,"The built-in potential across the depletion region is called the barrier potential or built-in potential."] ,["At equilibrium in an unbiased p-n junction, the diffusion current is balanced by:",["Drift current","Displacement current only","Zero current","Transformer current"],0,"The electric field causes drift of carriers opposite to diffusion, so the two currents balance at equilibrium."] ,["In forward bias, the p-side of a diode is connected to:",["Positive terminal of the battery","Negative terminal of the battery","Both terminals","No terminal"],0,"Forward bias connects p to positive and n to negative, reducing the depletion barrier."] ,["Forward bias generally makes the depletion region:",["Narrower","Wider","Unchanged for all voltages","Infinite"],0,"Forward bias lowers the junction barrier and narrows the depletion region."] ,["In reverse bias, the p-side is connected to:",["Negative terminal of the battery","Positive terminal of the battery","Both positive and negative terminals","No external circuit"],0,"Reverse bias connects p to negative and n to positive, increasing the depletion barrier."] ,["Reverse bias generally makes the depletion region:",["Wider","Narrower","Zero width","Conducting like a metal"],0,"Reverse bias strengthens the junction field and widens the depletion region."] ,["The current in a forward-biased diode is mainly due to:",["Majority carrier injection and diffusion","Neutron flow","Metallic conduction only","Radioactive decay"],0,"Forward bias allows substantial majority-carrier diffusion across the junction, producing diode current."] ,["The small current in a reverse-biased diode before breakdown is mainly due to:",["Minority carriers","Majority carriers only","Protons","Neutrons"],0,"Reverse saturation current is primarily associated with thermally generated minority carriers."] ,["The current-voltage characteristic of a diode shows that forward current rises rapidly after:",["The knee/threshold region","Zero temperature","Infinite resistance","Nuclear binding"],0,"Once the applied forward voltage approaches the practical threshold, diode current increases rapidly."] ,["Breakdown in a reverse-biased p-n junction occurs when:",["Reverse voltage becomes sufficiently high","Forward voltage becomes zero","Temperature is exactly 0 K","The diode is disconnected"],0,"At sufficiently high reverse voltage, breakdown mechanisms such as Zener or avalanche breakdown can produce a large reverse current."] ,["The main function of an ordinary semiconductor diode in a circuit is to:",["Allow current preferentially in one direction","Store nuclear energy","Amplify every signal","Convert AC directly to mechanical energy"],0,"A diode has strongly asymmetric conduction and is commonly used for rectification and switching." ]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
