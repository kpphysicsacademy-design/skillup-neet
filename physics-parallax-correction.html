<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SkillUp Physics | Parallax Correction</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.opt.selected{border-color:#5146a5;background:#f4f1ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.opt:disabled{cursor:default}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>👁️ Parallax Correction</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="action">CHECK</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['Parallax error occurs mainly because of:',['Incorrect unit conversion','Change in apparent position due to a change in viewing angle','Zero error','Instrument wear'],1,'Parallax error occurs when the observer views a scale or pointer from different angles.'],['To avoid parallax error while reading a scale, the eye should be:',['Far above the scale','Far below the scale','At the same level as the mark being read','At any convenient angle'],2,'Keeping the eye directly in line with the reading mark minimizes parallax.'],['When reading a liquid level in a measuring cylinder, the eye should be at the level of the:',['Top of the cylinder','Bottom of the table','Meniscus','Container base'],2,'The eye should be at the same height as the meniscus to avoid parallax error.'],['For water in a glass measuring cylinder, the correct level is usually read at the:',['Top of the convex meniscus','Bottom of the concave meniscus','Side wall above the liquid','Middle of the cylinder'],1,'Water forms a concave meniscus, so its bottom is read at eye level.'],['If the eye is above the scale mark while taking a reading, the observed value can be:',['Affected by parallax','Always exactly correct','Independent of viewing angle','Equal to zero'],0,'An off-axis viewing position can shift the apparent alignment and produce parallax error.'],['Which action best reduces parallax error on an analogue meter?',['Read from an angle','Place the eye perpendicular to the scale/pointer plane','Move the instrument while reading','Increase the object temperature'],1,'Viewing the pointer straight on, perpendicular to the scale plane, reduces parallax.'],['A pointer appears to align with a mark only when viewed from one side. This suggests:',['Zero correction','Parallax error','Randomization of units','A smaller least count'],1,'If alignment changes with viewing position, parallax is indicated.'],['A student reads a ruler from an oblique angle. The main problem is:',['Parallax error','Unit error','Dimensional error','Significant-figure error'],0,'An oblique viewing angle changes the apparent position of the mark relative to the scale.'],['Why is eye position important when reading a vernier scale?',['It changes the instrument pitch','It prevents apparent shifting of scale marks','It changes the least count','It changes the zero error automatically'],1,'The eye should be aligned with the relevant scale marks so their apparent positions are not shifted.'],['A measuring cylinder contains water. If the eye is below the meniscus, the reading may be:',['Free from all error','Affected by parallax','Automatically corrected','Equal to the least count'],1,'Reading from above or below the meniscus can produce an apparent shift and hence parallax error.'],['Which error is mainly associated with the observer’s viewing position?',['Parallax error','Zero error','Calibration error','Gross unit error'],0,'Parallax error depends on the relative position of the observer and scale.'],['A mirror placed behind an analogue pointer is used mainly to:',['Increase the scale range','Reduce parallax by matching the pointer with its reflection','Change the least count','Measure temperature'],1,'In a mirror scale, the pointer is read when it coincides with its reflection, indicating correct eye alignment.'],['If a pointer and its mirror image do not coincide, the observer should:',['Change the unit','Adjust the eye position until they coincide','Add the zero error twice','Ignore the reading'],1,'Moving the eye until the pointer hides its mirror image gives the correct viewing position.'],['Which statement is correct about parallax error?',['It is eliminated by changing units','It can be reduced by correct eye alignment','It is always positive','It is always equal to zero error'],1,'Correct eye alignment reduces the apparent displacement responsible for parallax error.'],['A reading changes when the observer moves the eye left and right without changing the instrument. This indicates:',['Parallax error','A constant true value with no observational effect','Only a unit conversion','A change in the object mass'],0,'If the apparent reading changes with eye position, the observation is affected by parallax.']];let i=0,score=0,answered=false,selected=-1;const $=x=>document.getElementById(x);function render(){answered=false;selected=-1;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q[1].map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('action').classList.remove('hide');$('action').textContent='CHECK'});$('xp').textContent='';$('action').classList.add('hide');$('action').disabled=false;}function check(){if(selected<0)return;if(!answered){answered=true;const q=qs[i],ok=selected===q[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===selected&&!ok)b.classList.add('wrong')});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[3];if(ok)score++;$('score').textContent=`XP ${score}`;$('fill').style.width=`${(i+1)/15*100}%`;$('action').textContent=i===14?'FINISH':'Next Question →';return;}if(i<14){i++;render()}else{$('quiz').innerHTML='';$('action').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('action').onclick=check;render();</script></body></html>
