<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>📐 Parallel Axis Theorem</h1><p class="muted">Learn the parallel-axis formula and practise shifted-axis calculations one step at a time.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{"q":"What does the parallel-axis theorem calculate?","o":["Moment of inertia about an axis parallel to a centre-of-mass axis","Angular speed from torque","Mass from density only","Linear momentum"],"a":0,"e":"It transfers a known moment of inertia from the centre-of-mass axis to a parallel axis."},
{"q":"Which formula states the parallel-axis theorem?","o":["I = Icm + Md²","I = Icm − Md²","I = Md","I = Icm + Md"],"a":0,"e":"The moment of inertia about the shifted parallel axis is Icm + Md²."},
{"q":"In I = Icm + Md², what does M represent?","o":["Total mass of the body","Moment of inertia","Distance between axes","Angular acceleration"],"a":0,"e":"M is the total mass of the body."},
{"q":"In the theorem, d is the perpendicular distance between:","o":["The two parallel axes","The body's two ends","Two particles","The axis and the surface only"],"a":0,"e":"d measures the perpendicular separation between the centre-of-mass axis and the new parallel axis."},
{"q":"The reference axis used for Icm must pass through the:","o":["Centre of mass","Outer edge","Any point outside the body","Point of maximum speed"],"a":0,"e":"The standard parallel-axis theorem starts with an axis through the body's centre of mass."},
{"q":"The two axes in the parallel-axis theorem must be:","o":["Parallel","Perpendicular","Always intersecting","At 45 degrees"],"a":0,"e":"The theorem applies to parallel axes only."},
{"q":"For a fixed body and parallel direction, which axis gives the smallest moment of inertia?","o":["The axis through the centre of mass","Any axis at the edge","The farthest axis","All axes give the same value"],"a":0,"e":"The added term Md² is non-negative, so the centre-of-mass axis has the minimum I among these parallel axes."},
{"q":"If d = 0, the parallel-axis formula gives:","o":["I = Icm","I = Icm + M","I = Md²","I = 0 always"],"a":0,"e":"When the axes coincide, Md² = 0 and I equals Icm."},
{"q":"If the distance between axes doubles, the added term Md² becomes:","o":["Four times as large","Twice as large","Half as large","Unchanged"],"a":0,"e":"The term depends on d squared, so doubling d multiplies Md² by four."},
{"q":"If the mass doubles while d stays fixed, the added term Md²:","o":["Doubles","Quadruples","Halves","Stays unchanged"],"a":0,"e":"The added term is directly proportional to mass."},
{"q":"A body has Icm = 2 kg m², M = 3 kg and d = 2 m. Find I.","o":["14 kg m²","8 kg m²","10 kg m²","6 kg m²"],"a":0,"e":"I = 2 + 3(2²) = 2 + 12 = 14 kg m²."},
{"q":"A body has Icm = 5 kg m², M = 2 kg and d = 1 m. Find I.","o":["7 kg m²","3 kg m²","10 kg m²","5.5 kg m²"],"a":0,"e":"I = 5 + 2(1²) = 7 kg m²."},
{"q":"A body has I = 20 kg m², Icm = 8 kg m² and M = 3 kg. Find d.","o":["2 m","4 m","√12 m","6 m"],"a":0,"e":"d = √((I − Icm)/M) = √(12/3) = 2 m."},
{"q":"A uniform rod has Icm = ML²/12. The distance from its centre to one end is:","o":["L/2","L","L/3","L/12"],"a":0,"e":"The rod's centre lies halfway along its length, so d = L/2."},
{"q":"Using the parallel-axis theorem, a uniform rod's I about one end is:","o":["ML²/3","ML²/12","ML²/6","ML²/2"],"a":0,"e":"I = ML²/12 + M(L/2)² = ML²/3."},
{"q":"For a uniform disc, Icm about its central perpendicular axis is:","o":["½MR²","MR²","⅖MR²","⅓MR²"],"a":0,"e":"A uniform disc has central-axis moment of inertia Icm = ½MR²."},
{"q":"For a uniform disc shifted to a parallel axis a distance d away, I is:","o":["½MR² + Md²","½MR² − Md²","MRd","½Md²"],"a":0,"e":"Add Md² to the disc's central-axis value."},
{"q":"A disc has M = 4 kg, R = 0.5 m and d = 1 m. Find I about the shifted parallel axis.","o":["4.5 kg m²","2 kg m²","1.5 kg m²","5 kg m²"],"a":0,"e":"I = ½(4)(0.5²) + 4(1²) = 0.5 + 4 = 4.5 kg m²."},
{"q":"The dimensions of moment of inertia are:","o":["[ML²]","[ML]","[MLT⁻²]","[MT⁻¹]"],"a":0,"e":"Moment of inertia is mass multiplied by distance squared."},
{"q":"The SI unit of Md² is:","o":["kg m²","kg m","N m","kg/s"],"a":0,"e":"Mass times distance squared has the unit kg m², matching moment of inertia."},
{"q":"If Icm = 10 kg m² and the shifted axis is farther from the centre of mass, then I:","o":["Is greater than 10 kg m²","Is less than 10 kg m²","Must equal zero","Must remain 10 kg m²"],"a":0,"e":"For d greater than zero and positive mass, Md² is positive, so I > Icm."},
{"q":"Can the parallel-axis theorem be applied directly between two arbitrary axes neither of which passes through the centre of mass?","o":["Not directly; use the centre-of-mass axis as the reference","Yes, for any two axes","Only if the body is a sphere","Only when mass is zero"],"a":0,"e":"The standard theorem relates an axis through the centre of mass to a parallel axis."},
{"q":"If I − Icm = 18 kg m², M = 2 kg, what is d?","o":["3 m","9 m","6 m","√18 m"],"a":0,"e":"Md² = 18, so d² = 9 and d = 3 m."},
{"q":"A body has mass 5 kg and the axes are 0.4 m apart. What is Md²?","o":["0.8 kg m²","2 kg m²","4 kg m²","0.2 kg m²"],"a":0,"e":"Md² = 5 × 0.4² = 5 × 0.16 = 0.8 kg m²."},
{"q":"For a body with Icm = 6 kg m², M = 4 kg and d = 0.5 m, I is:","o":["7 kg m²","8 kg m²","6.5 kg m²","10 kg m²"],"a":0,"e":"I = 6 + 4(0.5²) = 6 + 1 = 7 kg m²."},
{"q":"The parallel-axis theorem is useful because it:","o":["Avoids recalculating the full mass distribution for a parallel shifted axis","Finds mass without any data","Works for non-parallel axes","Gives angular velocity directly"],"a":0,"e":"If Icm is known, the theorem gives I about a parallel axis using only M and d."},
{"q":"For the same body, shifting an axis farther from the centre of mass in the same direction generally makes I:","o":["Increase","Decrease","Become negative","Stay fixed"],"a":0,"e":"The added term Md² increases as the separation grows."},
{"q":"A body has Icm = 12 kg m², M = 3 kg and d = 2 m. Find I.","o":["24 kg m²","18 kg m²","15 kg m²","36 kg m²"],"a":0,"e":"I = 12 + 3(4) = 24 kg m²."},
{"q":"A uniform rod has mass 6 kg and length 2 m. Its I about the centre is ML²/12. What is I about one end?","o":["8 kg m²","2 kg m²","4 kg m²","12 kg m²"],"a":0,"e":"Iend = ML²/3 = 6 × 4/3 = 8 kg m²."},
{"q":"Which statement about the added term Md² is correct?","o":["It is never negative for a real mass and distance","It is always negative","It depends on angular speed","It has units of kg m"],"a":0,"e":"Mass is positive and distance squared is non-negative, so Md² cannot be negative."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Parallel Axis Theorem Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
