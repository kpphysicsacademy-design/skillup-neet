<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Parallel Plate Capacitor</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}
</style></head>
<body><div class="wrap"><div class="card"><h1>⚡ Parallel Plate Capacitor</h1>
<div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a>
</div></div>
<script>
const qs=[
['The capacitance of an ideal parallel-plate capacitor in vacuum is','ε₀A/d','ε₀d/A','A/(ε₀d)','d/(ε₀A)',0,'For parallel plates, C=ε₀A/d when edge effects are neglected.'],
['In the formula C=ε₀A/d, A represents','charge on a plate','area of each plate','separation between plates','electric field',1,'A is the area of each conducting plate.'],
['If the area of the plates is doubled, capacitance','halves','doubles','becomes four times','remains unchanged',1,'Since C is directly proportional to A, doubling A doubles C.'],
['If the plate separation is doubled, capacitance','doubles','halves','becomes four times','remains unchanged',1,'Since C is inversely proportional to d, doubling d halves C.'],
['The electric field between large parallel plates carrying ±Q is approximately','Q/(ε₀A)','Qε₀A','ε₀A/Q','A/(Qε₀)',0,'For an ideal parallel-plate capacitor, E=σ/ε₀=Q/(ε₀A).'],
['The potential difference between plates is related to field by','V=E/d','V=Ed','V=E+d','V=E/d²',1,'For a uniform field, the magnitude of potential difference is V=Ed.'],
['A dielectric slab completely filling the space between plates changes capacitance from C₀ to','C₀/K','KC₀','C₀+K','C₀−K',1,'A dielectric of relative permittivity K gives C=KC₀.'],
['For an isolated charged capacitor, increasing plate separation causes the charge to','increase','decrease','remain constant','become zero',2,'If isolated from external circuits, no charge can flow, so Q remains constant.'],
['For an isolated charged parallel-plate capacitor, increasing plate separation makes the potential difference','decrease','increase','remain constant','become zero',1,'With Q constant, C decreases as d increases, so V=Q/C increases.'],
['For a battery-connected capacitor, increasing plate separation makes capacitance','increase','decrease','remain constant','become infinite',1,'With A fixed, C=ε₀A/d, so increasing d decreases capacitance.'],
['A parallel-plate capacitor has A=0.01 m² and d=1 mm in vacuum. Taking ε₀=8.85×10⁻¹² F/m, C is approximately','8.85×10⁻¹¹ F','8.85×10⁻¹⁰ F','8.85×10⁻⁸ F','8.85×10⁻⁶ F',1,'C=ε₀A/d=8.85×10⁻¹²×0.01/10⁻³=8.85×10⁻¹¹ F.'],
['If C=2 μF and V=10 V, the charge stored is','5 μC','20 μC','0.2 μC','200 μC',1,'Q=CV=(2 μF)(10 V)=20 μC.'],
['If C=4 μF and V=5 V, energy stored is','10 μJ','25 μJ','50 μJ','100 μJ',2,'U=½CV²=½(4×10⁻⁶)(25)=50 μJ.'],
['Ignoring edge effects, the electric field of a parallel-plate capacitor is approximately','uniform between the plates','zero everywhere','strongest only at the centre','randomly directed',0,'The field between large parallel plates is approximately uniform away from the edges.'],
['The capacitance of a parallel-plate capacitor increases when','plate separation increases','plate area decreases','a dielectric is inserted','both plates are removed',2,'Inserting a dielectric increases capacitance by its relative permittivity when it completely fills the gap.']
];
let i=0,score=0,answered=false;const $=x=>document.getElementById(x);
function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}
function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});if(ok){score++;$('xp').textContent='✨ Correct! +1 XP'}else $('xp').textContent='❌ Incorrect. '+q[6];$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}
function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();
</script></body></html>
