<script>
(function(){
'use strict';
let index=0, chosen=null, locked=false, score=0, streak=0;
const questions = [{"q":"The capacitance of an ideal parallel-plate capacitor in vacuum is…","o":["ε₀A/d","ε₀d/A","Ad/ε₀","d/(ε₀A)"],"a":0,"e":"For large parallel plates, C = ε₀A/d, neglecting edge effects."},{"q":"In C = ε₀A/d, A represents…","o":["Plate separation","Area of one plate","Charge on a plate","Potential difference"],"a":1,"e":"A is the overlapping area of the plates."},{"q":"In C = ε₀A/d, d represents…","o":["Plate separation","Plate thickness","Plate radius","Dielectric constant"],"a":0,"e":"d is the distance between the plates."},{"q":"If plate area doubles and separation is unchanged, capacitance…","o":["Halves","Doubles","Is unchanged","Becomes four times"],"a":1,"e":"C is directly proportional to A."},{"q":"If plate separation doubles with area unchanged, capacitance…","o":["Doubles","Halves","Is unchanged","Becomes four times"],"a":1,"e":"C is inversely proportional to d."},{"q":"A parallel-plate capacitor has A = 0.02 m² and d = 1 mm. Its capacitance is approximately… (ε₀ = 8.85 × 10⁻¹² F/m)","o":["1.77 × 10⁻¹⁰ F","1.77 × 10⁻¹¹ F","8.85 × 10⁻¹² F","4.43 × 10⁻¹⁰ F"],"a":0,"e":"C = ε₀A/d = 8.85×10⁻¹²×0.02/10⁻³ = 1.77×10⁻¹⁰ F."},{"q":"The SI unit of ε₀ is…","o":["F m⁻¹","F m","C V","N C⁻¹"],"a":0,"e":"Permittivity has SI unit farad per metre (F/m)."},{"q":"For a fixed plate area, reducing separation to one-third makes capacitance…","o":["One-third as large","Three times as large","Nine times as large","Unchanged"],"a":1,"e":"C ∝ 1/d, so reducing d to d/3 triples C."},{"q":"If the plate area is tripled and separation is doubled, capacitance becomes…","o":["3C","2C","1.5C","C/6"],"a":2,"e":"C′/C = 3/2, so the capacitance is 1.5 times the original."},{"q":"A dielectric of relative permittivity K completely fills the gap. The capacitance becomes…","o":["C₀/K","KC₀","C₀ + K","C₀ − K"],"a":1,"e":"Filling the gap gives C = Kε₀A/d = KC₀."},{"q":"A 4 μF air capacitor is completely filled with dielectric K = 3. New capacitance is…","o":["12 μF","7 μF","4/3 μF","1 μF"],"a":0,"e":"C = KC₀ = 3 × 4 μF = 12 μF."},{"q":"The electric field between large parallel plates is approximately…","o":["Non-uniform everywhere","Uniform away from edges","Zero at the centre","Always radial"],"a":1,"e":"The field is approximately uniform in the central region; edge fringing is neglected."},{"q":"For plate potential difference V and separation d, field magnitude is…","o":["Vd","V/d","d/V","ε₀V"],"a":1,"e":"For a uniform field, E = V/d."},{"q":"If the battery remains connected while plate separation increases, the potential difference…","o":["Increases","Decreases","Remains constant","Becomes zero"],"a":2,"e":"An ideal battery maintains fixed V."},{"q":"With a battery connected, increasing plate separation makes capacitance…","o":["Increase","Decrease","Stay the same","Become infinite"],"a":1,"e":"C = ε₀A/d decreases as d increases."},{"q":"With a battery connected, plate separation increases. The charge magnitude on the plates…","o":["Increases","Decreases","Stays fixed","Must become zero"],"a":1,"e":"V is fixed and C decreases, so Q = CV decreases."},{"q":"A charged capacitor is disconnected from its battery, then plate separation increases. Its charge…","o":["Increases","Decreases","Remains constant","Changes sign"],"a":2,"e":"For an isolated capacitor, no charge flows to or from the plates."},{"q":"For an isolated charged capacitor, increasing plate separation causes voltage to…","o":["Decrease","Increase","Remain constant","Become zero"],"a":1,"e":"Q is constant and C decreases, so V = Q/C increases."},{"q":"For an isolated capacitor, increasing plate separation causes stored energy to…","o":["Decrease","Increase","Remain constant in all cases","Become zero"],"a":1,"e":"With Q fixed, U = Q²/(2C); as C decreases, U increases."},{"q":"The charge on each plate of a charged capacitor has…","o":["Equal magnitudes and opposite signs","Equal signs and equal magnitudes","Unequal magnitudes always","No relation"],"a":0,"e":"The plates carry +Q and −Q."},{"q":"The charge stored is Q = …","o":["C/V","CV","V/C","C + V"],"a":1,"e":"By definition, Q = CV."},{"q":"A 6 μF capacitor is connected to 5 V. Charge magnitude is…","o":["1.2 μC","11 μC","30 μC","0.83 μC"],"a":2,"e":"Q = CV = 6 μF × 5 V = 30 μC."},{"q":"A parallel-plate capacitor has capacitance 2 nF. If the separation is reduced by half, new capacitance is…","o":["1 nF","2 nF","4 nF","8 nF"],"a":2,"e":"Halving d doubles C, giving 4 nF."},{"q":"If both plate area and separation are doubled, capacitance…","o":["Doubles","Halves","Remains unchanged","Becomes four times"],"a":2,"e":"C′ ∝ (2A)/(2d) = A/d, so C is unchanged."},{"q":"If plate area is halved and separation is doubled, capacitance becomes…","o":["C/4","C/2","2C","4C"],"a":0,"e":"C′/C = (1/2)/2 = 1/4."},{"q":"The force between oppositely charged capacitor plates is generally…","o":["Repulsive","Attractive","Always zero","Independent of charge in every situation"],"a":1,"e":"Opposite charges attract, so the plates exert attractive electrostatic forces."},{"q":"Neglecting edge effects, the electric field outside a large ideal parallel-plate capacitor is approximately…","o":["Zero","Equal to V/d everywhere","Infinite","Twice the internal field"],"a":0,"e":"The fields from the two plates largely cancel outside the idealized capacitor."},{"q":"The capacitance of a parallel-plate capacitor depends directly on…","o":["Applied voltage only","Stored charge only","Plate area and permittivity","Plate separation only"],"a":2,"e":"C = εA/d; it depends on geometry and the dielectric medium."},{"q":"A capacitor has C = 8 pF and V = 10 V. The stored charge is…","o":["0.8 pC","18 pC","80 pC","800 pC"],"a":2,"e":"Q = CV = 8 pF × 10 V = 80 pC."},{"q":"A parallel-plate capacitor's plate area is 0.01 m², separation 0.5 mm, and vacuum gap. Its capacitance is closest to… (ε₀ = 8.85 × 10⁻¹² F/m)","o":["1.77 × 10⁻¹⁰ F","1.77 × 10⁻¹¹ F","4.43 × 10⁻¹² F","8.85 × 10⁻¹⁰ F"],"a":0,"e":"C = ε₀A/d = 8.85×10⁻¹²×0.01/(5×10⁻⁴) = 1.77×10⁻¹⁰ F."}]

   } else { questions.splice(0,questions.length,...originalQuestions); }
