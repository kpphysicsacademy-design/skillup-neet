<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Parallel Resistance</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}
</style></head>
<body><div class="wrap"><div class="card"><h1>⚡ Parallel Resistance</h1>
<div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a>
</div></div>
<script>
const qs=[
['For two resistors R₁ and R₂ connected in parallel, the equivalent resistance is','R₁+R₂','R₁−R₂','R₁R₂/(R₁+R₂)','(R₁+R₂)/(R₁R₂)',2,'For two parallel resistors, 1/R_eq=1/R₁+1/R₂, hence R_eq=R₁R₂/(R₁+R₂).'],
['Three resistors 2 Ω, 3 Ω and 6 Ω are connected in parallel. Their equivalent resistance is','1 Ω','2 Ω','3 Ω','11 Ω',0,'1/R=1/2+1/3+1/6=1, so R_eq=1 Ω.'],
['In a parallel circuit, the potential difference across each branch is','the same','different in every branch','always zero','proportional to branch resistance',0,'All parallel branches are connected across the same two nodes, so they have the same potential difference.'],
['Two resistors 6 Ω and 3 Ω are connected in parallel across 12 V. The total current is','2 A','4 A','6 A','12 A',2,'R_eq=(6×3)/(6+3)=2 Ω, so total current I=12/2=6 A.'],
['For resistors connected in parallel, the total current is','less than every branch current','the sum of branch currents','equal to the largest branch current only','always zero',1,'By Kirchhoff’s current law, total current entering the junction equals the sum of currents in the parallel branches.'],
['The equivalent resistance of two positive resistors in parallel is always','greater than both','equal to the larger resistor','less than the smaller resistor','between the two resistances',2,'For two positive resistors in parallel, R_eq is smaller than the smallest individual resistance.'],
['Two identical resistors each of resistance R are connected in parallel. Their equivalent resistance is','2R','R','R/2','R²',2,'1/R_eq=1/R+1/R=2/R, so R_eq=R/2.'],
['Four identical resistors each of 8 Ω are connected in parallel. Their equivalent resistance is','32 Ω','8 Ω','4 Ω','2 Ω',3,'For n identical resistors in parallel, R_eq=R/n=8/4=2 Ω.'],
['A 4 Ω resistor and a 12 Ω resistor are connected in parallel. Their equivalent resistance is','3 Ω','4 Ω','8 Ω','16 Ω',0,'R_eq=(4×12)/(4+12)=48/16=3 Ω.'],
['A 6 Ω and 3 Ω resistor are connected in parallel across 18 V. The current through the 6 Ω resistor is','2 A','3 A','6 A','9 A',1,'Each branch has 18 V, so current through 6 Ω is I=18/6=3 A.'],
['If another positive resistor is added in parallel, the equivalent resistance','increases','decreases','becomes equal to the new resistor','remains unchanged',1,'Adding another conducting path increases total conductance and therefore decreases equivalent resistance.'],
['Two parallel resistors carry currents 2 A and 4 A. The total current is','2 A','4 A','6 A','8 A',2,'The total current is the sum of branch currents: 2+4=6 A.'],
['Two resistors 2 Ω and 6 Ω are connected in parallel. The ratio of currents through 2 Ω and 6 Ω is','1:3','2:1','3:1','6:1',2,'The same voltage is across both, and I=V/R. Thus I₂Ω:I₆Ω=1/2:1/6=3:1.'],
['In a parallel combination, the branch having the smaller resistance carries','smaller current','larger current','zero current','the same current in all cases',1,'With the same voltage across branches, I=V/R, so the smaller resistance carries the larger current.'],
['A 10 Ω resistor and an unknown resistor are in parallel. Their equivalent resistance is 4 Ω. The unknown resistance is','5 Ω','6.67 Ω','10 Ω','14 Ω',1,'1/4=1/10+1/R, so 1/R=3/20 and R=20/3≈6.67 Ω.']
];
let i=0,score=0,answered=false;const $=x=>document.getElementById(x);
function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}
function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});if(ok){score++;$('xp').textContent='✨ Correct! +1 XP'}else $('xp').textContent='❌ Incorrect. '+q[6];$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}
function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();
</script></body></html>
