<section class="hero"><h1>🔌 Parallel Resistance</h1><p class="muted">Practise equivalent resistance in parallel, branch voltage and current, current division, conductance, and circuit calculations.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>

<script>
(function(){
'use strict';
const questions = [{"q":"For two resistors R₁ and R₂ connected in parallel, the equivalent resistance is","o":["R₁+R₂","R₁−R₂","R₁R₂/(R₁+R₂)","(R₁+R₂)/(R₁R₂)"],"a":2,"e":"For two parallel resistors, 1/R_eq=1/R₁+1/R₂, hence R_eq=R₁R₂/(R₁+R₂)."},{"q":"Three resistors 2 Ω, 3 Ω and 6 Ω are connected in parallel. Their equivalent resistance is","o":["1 Ω","2 Ω","3 Ω","11 Ω"],"a":0,"e":"1/R=1/2+1/3+1/6=1, so R_eq=1 Ω."},{"q":"In a parallel circuit, the potential difference across each branch is","o":["the same","different in every branch","always zero","proportional to branch resistance"],"a":0,"e":"All parallel branches are connected across the same two nodes, so they have the same potential difference."},{"q":"Two resistors 6 Ω and 3 Ω are connected in parallel across 12 V. The total current is","o":["2 A","4 A","6 A","12 A"],"a":2,"e":"R_eq=(6×3)/(6+3)=2 Ω, so total current I=12/2=6 A."},{"q":"For resistors connected in parallel, the total current is","o":["less than every branch current","the sum of branch currents","equal to the largest branch current only","always zero"],"a":1,"e":"By Kirchhoff’s current law, total current entering the junction equals the sum of currents in the parallel branches."},{"q":"The equivalent resistance of two positive resistors in parallel is always","o":["greater than both","equal to the larger resistor","less than the smaller resistor","between the two resistances"],"a":2,"e":"For two positive resistors in parallel, R_eq is smaller than the smallest individual resistance."},{"q":"Two identical resistors each of resistance R are connected in parallel. Their equivalent resistance is","o":["2R","R","R/2","R²"],"a":2,"e":"1/R_eq=1/R+1/R=2/R, so R_eq=R/2."},{"q":"Four identical resistors each of 8 Ω are connected in parallel. Their equivalent resistance is","o":["32 Ω","8 Ω","4 Ω","2 Ω"],"a":3,"e":"For n identical resistors in parallel, R_eq=R/n=8/4=2 Ω."},{"q":"A 4 Ω resistor and a 12 Ω resistor are connected in parallel. Their equivalent resistance is","o":["3 Ω","4 Ω","8 Ω","16 Ω"],"a":0,"e":"R_eq=(4×12)/(4+12)=48/16=3 Ω."},{"q":"A 6 Ω and 3 Ω resistor are connected in parallel across 18 V. The current through the 6 Ω resistor is","o":["2 A","3 A","6 A","9 A"],"a":1,"e":"Each branch has 18 V, so current through 6 Ω is I=18/6=3 A."},{"q":"If another positive resistor is added in parallel, the equivalent resistance","o":["increases","decreases","becomes equal to the new resistor","remains unchanged"],"a":1,"e":"Adding another conducting path increases total conductance and therefore decreases equivalent resistance."},{"q":"Two parallel resistors carry currents 2 A and 4 A. The total current is","o":["2 A","4 A","6 A","8 A"],"a":2,"e":"The total current is the sum of branch currents: 2+4=6 A."},{"q":"Two resistors 2 Ω and 6 Ω are connected in parallel. The ratio of currents through 2 Ω and 6 Ω is","o":["1:3","2:1","3:1","6:1"],"a":2,"e":"The same voltage is across both, and I=V/R. Thus I₂Ω:I₆Ω=1/2:1/6=3:1."},{"q":"In a parallel combination, the branch having the smaller resistance carries","o":["smaller current","larger current","zero current","the same current in all cases"],"a":1,"e":"With the same voltage across branches, I=V/R, so the smaller resistance carries the larger current."},{"q":"A 10 Ω resistor and an unknown resistor are in parallel. Their equivalent resistance is 4 Ω. The unknown resistance is","o":["5 Ω","6.67 Ω","10 Ω","14 Ω"],"a":1,"e":"1/4=1/10+1/R, so 1/R=3/20 and R=20/3≈6.67 Ω."},{"q":"Three resistors 3 Ω, 6 Ω and 2 Ω are connected in parallel. Find the equivalent resistance.","o":["1 Ω","2 Ω","3 Ω","11 Ω"],"a":0,"e":"1/R = 1/3 + 1/6 + 1/2 = 1, so R = 1 Ω."},{"q":"A 4 Ω and 6 Ω resistor are in parallel across 12 V. What is the total current?","o":["2 A","3 A","5 A","6 A"],"a":2,"e":"R_eq = (4×6)/(4+6) = 2.4 Ω, so I = 12/2.4 = 5 A."},{"q":"Three identical resistors of 12 Ω each are connected in parallel. Their equivalent resistance is","o":["36 Ω","12 Ω","6 Ω","4 Ω"],"a":3,"e":"For n identical parallel resistors, R_eq = R/n = 12/3 = 4 Ω."},{"q":"A 5 Ω and 20 Ω resistor are connected in parallel. What is the ratio of current in 5 Ω to current in 20 Ω?","o":["1:4","2:1","4:1","5:20"],"a":2,"e":"Current is inversely proportional to resistance for the same branch voltage; ratio = 20/5 = 4:1."},{"q":"Two parallel resistors have equivalent resistance 3 Ω. One resistor is 6 Ω. Find the other.","o":["2 Ω","3 Ω","6 Ω","9 Ω"],"a":2,"e":"1/3 = 1/6 + 1/R gives 1/R = 1/6, hence R = 6 Ω."},{"q":"A 12 Ω resistor and an unknown resistor in parallel give 4 Ω. The unknown resistance is","o":["4 Ω","6 Ω","8 Ω","12 Ω"],"a":1,"e":"1/4 = 1/12 + 1/R gives 1/R = 1/6, so R = 6 Ω."},{"q":"A 2 Ω resistor and a 3 Ω resistor are in parallel across 6 V. Current through the 2 Ω branch is","o":["1 A","2 A","3 A","5 A"],"a":2,"e":"Each branch has 6 V; I = V/R = 6/2 = 3 A."},{"q":"The equivalent conductance of parallel resistors is","o":["The product of conductances","The sum of conductances","The difference of conductances","Always zero"],"a":1,"e":"Conductances add in parallel: G_eq = G₁ + G₂ + …"},{"q":"Two resistors of 8 Ω and 8 Ω are connected in parallel to a 16 V source. The current supplied by the source is","o":["1 A","2 A","4 A","8 A"],"a":2,"e":"Their equivalent resistance is 4 Ω, so total current is 16/4 = 4 A."},{"q":"A 6 Ω and 12 Ω resistor are in parallel. What fraction of the total current flows through the 6 Ω resistor?","o":["One-third","One-half","Two-thirds","Three-quarters"],"a":2,"e":"Current divides inversely with resistance; the 6 Ω branch carries twice the current of the 12 Ω branch, i.e. 2/3 of total."},{"q":"If one branch of a parallel circuit becomes open, the total resistance of the remaining circuit generally","o":["Decreases to zero","Increases","Always stays the same","Becomes negative"],"a":1,"e":"Removing a branch reduces total conductance, so equivalent resistance increases."},{"q":"Two resistors R and 2R are connected in parallel. Their equivalent resistance is","o":["3R","2R/3","R/2","R/3"],"a":1,"e":"R_eq = R(2R)/(R+2R) = 2R/3."},{"q":"Three resistors 6 Ω, 6 Ω and 3 Ω are connected in parallel. The equivalent resistance is","o":["1.5 Ω","2 Ω","3 Ω","15 Ω"],"a":0,"e":"1/R = 1/6 + 1/6 + 1/3 = 2/3, so R = 1.5 Ω."},{"q":"A 10 Ω resistor is connected in parallel with a 10 Ω resistor. If the supply is 5 V, the current in each branch is","o":["0.25 A","0.5 A","1 A","2 A"],"a":1,"e":"Each resistor has 5 V across it, so each branch current is 5/10 = 0.5 A."},{"q":"Which statement is true for ideal resistors connected in parallel to an ideal voltage source?","o":["Each branch has the same voltage","Each branch carries the same current regardless of resistance","The total current is less than every branch current","Equivalent resistance exceeds every branch resistance"],"a":0,"e":"Parallel branches share the same two nodes, so each has the source voltage."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function typesetMath(){if(window.MathJax?.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options'),$('feedback')].filter(Boolean)).catch(()=>{});}}
window.addEventListener('load',typesetMath);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
 typesetMath();
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Parallel Resistance Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
   if(window.MathJax?.typesetPromise) window.MathJax.typesetPromise([review]).catch(()=>{});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
