<script>
const questions=[["For two resistors R₁ and R₂ connected in parallel, the equivalent resistance is",["R₁+R₂","R₁−R₂","R₁R₂/(R₁+R₂)","(R₁+R₂)/(R₁R₂)"],2,"For two parallel resistors, 1/R_eq=1/R₁+1/R₂, hence R_eq=R₁R₂/(R₁+R₂)."],["Three resistors 2 Ω, 3 Ω and 6 Ω are connected in parallel. Their equivalent resistance is",["1 Ω","2 Ω","3 Ω","11 Ω"],0,"1/R=1/2+1/3+1/6=1, so R_eq=1 Ω."],["In a parallel circuit, the potential difference across each branch is",["the same","different in every branch","always zero","proportional to branch resistance"],0,"All parallel branches are connected across the same two nodes, so they have the same potential difference."],["Two resistors 6 Ω and 3 Ω are connected in parallel across 12 V. The total current is",["2 A","4 A","6 A","12 A"],2,"R_eq=(6×3)/(6+3)=2 Ω, so total current I=12/2=6 A."],["For resistors connected in parallel, the total current is",["less than every branch current","the sum of branch currents","equal to the largest branch current only","always zero"],1,"By Kirchhoff’s current law, total current entering the junction equals the sum of currents in the parallel branches."],["The equivalent resistance of two positive resistors in parallel is always",["greater than both","equal to the larger resistor","less than the smaller resistor","between the two resistances"],2,"For two positive resistors in parallel, R_eq is smaller than the smallest individual resistance."],["Two identical resistors each of resistance R are connected in parallel. Their equivalent resistance is",["2R","R","R/2","R²"],2,"1/R_eq=1/R+1/R=2/R, so R_eq=R/2."],["Four identical resistors each of 8 Ω are connected in parallel. Their equivalent resistance is",["32 Ω","8 Ω","4 Ω","2 Ω"],3,"For n identical resistors in parallel, R_eq=R/n=8/4=2 Ω."],["A 4 Ω resistor and a 12 Ω resistor are connected in parallel. Their equivalent resistance is",["3 Ω","4 Ω","8 Ω","16 Ω"],0,"R_eq=(4×12)/(4+12)=48/16=3 Ω."],["A 6 Ω and 3 Ω resistor are connected in parallel across 18 V. The current through the 6 Ω resistor is",["2 A","3 A","6 A","9 A"],1,"Each branch has 18 V, so current through 6 Ω is I=18/6=3 A."],["If another positive resistor is added in parallel, the equivalent resistance",["increases","decreases","becomes equal to the new resistor","remains unchanged"],1,"Adding another conducting path increases total conductance and therefore decreases equivalent resistance."],["Two parallel resistors carry currents 2 A and 4 A. The total current is",["2 A","4 A","6 A","8 A"],2,"The total current is the sum of branch currents: 2+4=6 A."],["Two resistors 2 Ω and 6 Ω are connected in parallel. The ratio of currents through 2 Ω and 6 Ω is",["1:3","2:1","3:1","6:1"],2,"The same voltage is across both, and I=V/R. Thus I₂Ω:I₆Ω=1/2:1/6=3:1."],["In a parallel combination, the branch having the smaller resistance carries",["smaller current","larger current","zero current","the same current in all cases"],1,"With the same voltage across branches, I=V/R, so the smaller resistance carries the larger current."],["A 10 Ω resistor and an unknown resistor are in parallel. Their equivalent resistance is 4 Ω. The unknown resistance is",["5 Ω","6.67 Ω","10 Ω","14 Ω"],1,"1/4=1/10+1/R, so 1/R=3/20 and R=20/3≈6.67 Ω."],["Three resistors 3 Ω, 6 Ω and 2 Ω are connected in parallel. Find the equivalent resistance.",["1 Ω","2 Ω","3 Ω","11 Ω"],0,"1/R = 1/3 + 1/6 + 1/2 = 1, so R = 1 Ω."],["A 4 Ω and 6 Ω resistor are in parallel across 12 V. What is the total current?",["2 A","3 A","5 A","6 A"],2,"R_eq = (4×6)/(4+6) = 2.4 Ω, so I = 12/2.4 = 5 A."],["Three identical resistors of 12 Ω each are connected in parallel. Their equivalent resistance is",["36 Ω","12 Ω","6 Ω","4 Ω"],3,"For n identical parallel resistors, R_eq = R/n = 12/3 = 4 Ω."],["A 5 Ω and 20 Ω resistor are connected in parallel. What is the ratio of current in 5 Ω to current in 20 Ω?",["1:4","2:1","4:1","5:20"],2,"Current is inversely proportional to resistance for the same branch voltage; ratio = 20/5 = 4:1."],["Two parallel resistors have equivalent resistance 3 Ω. One resistor is 6 Ω. Find the other.",["2 Ω","3 Ω","6 Ω","9 Ω"],2,"1/3 = 1/6 + 1/R gives 1/R = 1/6, hence R = 6 Ω."],["A 12 Ω resistor and an unknown resistor in parallel give 4 Ω. The unknown resistance is",["4 Ω","6 Ω","8 Ω","12 Ω"],1,"1/4 = 1/12 + 1/R gives 1/R = 1/6, so R = 6 Ω."],["A 2 Ω resistor and a 3 Ω resistor are in parallel across 6 V. Current through the 2 Ω branch is",["1 A","2 A","3 A","5 A"],2,"Each branch has 6 V; I = V/R = 6/2 = 3 A."],["The equivalent conductance of parallel resistors is",["The product of conductances","The sum of conductances","The difference of conductances","Always zero"],1,"Conductances add in parallel: G_eq = G₁ + G₂ + …"],["Two resistors of 8 Ω and 8 Ω are connected in parallel to a 16 V source. The current supplied by the source is",["1 A","2 A","4 A","8 A"],2,"Their equivalent resistance is 4 Ω, so total current is 16/4 = 4 A."],["A 6 Ω and 12 Ω resistor are in parallel. What fraction of the total current flows through the 6 Ω resistor?",["One-third","One-half","Two-thirds","Three-quarters"],2,"Current divides inversely with resistance; the 6 Ω branch carries twice the current of the 12 Ω branch, i.e. 2/3 of total."],["If one branch of a parallel circuit becomes open, the total resistance of the remaining circuit generally",["Decreases to zero","Increases","Always stays the same","Becomes negative"],1,"Removing a branch reduces total conductance, so equivalent resistance increases."],["Two resistors R and 2R are connected in parallel. Their equivalent resistance is",["3R","2R/3","R/2","R/3"],1,"R_eq = R(2R)/(R+2R) = 2R/3."],["Three resistors 6 Ω, 6 Ω and 3 Ω are connected in parallel. The equivalent resistance is",["1.5 Ω","2 Ω","3 Ω","15 Ω"],1,"1/R = 1/6 + 1/6 + 1/3 = 2/3, so R = 1.5 Ω."],["A 10 Ω resistor is connected in parallel with a 10 Ω resistor. If the supply is 5 V, the current in each branch is",["0.25 A","0.5 A","1 A","2 A"],1,"Each resistor has 5 V across it, so each branch current is 5/10 = 0.5 A."],["Which statement is true for ideal resistors connected in parallel to an ideal voltage source?",["Each branch has the same voltage","Each branch carries the same current regardless of resistance","The total current is less than every branch current","Equivalent resistance exceeds every branch resistance"],0,"Parallel branches share the same two nodes, so each has the source voltage."]];
let index=0,chosen=null,locked=false,xp=0,streak=0,correctCount=0,wrong=[];
const $=id=>document.getElementById(id);
function render(){chosen=null;locked=false;$('count').textContent='Question '+(index+1)+' of '+questions.length;$('qnum').textContent='QUESTION '+(index+1);$('percent').textContent=Math.round(index/questions.length*100)+'%';$('fill').style.width=(index/questions.length*100)+'%';$('xp').textContent=xp;$('streak').textContent=streak;$('question').textContent=questions[index][0];$('options').innerHTML='';questions[index][1].forEach((value,n)=>{const b=document.createElement('button');b.type='button';b.className='option';b.innerHTML='<span class="letter">'+String.fromCharCode(65+n)+'</span><span></span>';b.lastElementChild.textContent=value;b.addEventListener('click',()=>{if(locked)return;chosen=n;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b)});$('check').classList.remove('hidden');$('check').disabled=true;$('feedback').className='feedback';$('feedback').textContent='';$('continue').classList.add('hidden');if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();}
function check(){if(chosen===null||locked)return;locked=true;const q=questions[index],ok=chosen===q[2];document.querySelectorAll('.option').forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add('correct');if(n===chosen&&!ok)b.classList.add('wrong')});if(ok){xp+=10;streak++;correctCount++;$('feedback').className='feedback show';$('feedback').innerHTML='<strong>✅ Correct! +10 XP</strong>'+q[3]}else{streak=0;wrong.push({index,chosen,correct:q[2]});$('feedback').className='feedback show bad';$('feedback').innerHTML='<strong>Not quite.</strong>'+q[3]}$('xp').textContent=xp;$('streak').textContent=streak;$('check').classList.add('hidden');$('continue').classList.remove('hidden');if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();}
function next(){if(index<questions.length-1){index++;render()}else finish()}
function finish(){$('quizcard').classList.add('hidden');$('percent').textContent='100%';$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hidden');let review=wrong.length?'<div class="review"><h3>Review your mistakes</h3>'+wrong.map(w=>{const q=questions[w.index];return '<div class="review-item"><b>Q'+(w.index+1)+'. '+q[0]+'</b><p class="small">Your answer: '+String.fromCharCode(65+w.chosen)+'. '+q[1][w.chosen]+'</p><p><b>Correct:</b> '+String.fromCharCode(65+q[2])+'. '+q[1][q[2]]+'</p><p>'+q[3]+'</p></div>'}).join('')+'</div>':'<p>Perfect run — no incorrect answers to review!</p>';$('result').innerHTML='<h2>🎉 Quiz complete!</h2><p class="scorebig">'+correctCount+' / '+questions.length+' correct</p><p>You earned <b>'+xp+' XP</b> · Best streak this run: <b>'+streak+'</b></p>'+review+'<button class="primary" id="retry">Retry quiz ↻</button>';$('retry').onclick=()=>location.reload();if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();}
$('check').addEventListener('click',check);$('continue').addEventListener('click',next);render();
</script><script src="/skillup-eye-shield.js?v=20261013-eye-shield-v1"></script><script src="/shared-nav.js?v=20261013-no-bottom-nav-v1"></script></body></html>
