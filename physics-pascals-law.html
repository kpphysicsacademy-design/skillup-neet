<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}

.hero,.quiz,.finish{background:#fff;border:2px solid #e2edf7;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 #dce8f3}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#174a78}.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}
.progress-row{display:flex;justify-content:space-between;gap:10px;margin:16px 0 7px;font-size:12px;font-weight:900;color:var(--muted)}
.track{height:11px;border-radius:99px;background:#e2edf7;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}
.qmeta{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.4px}
.question{font-size:clamp(20px,4.5vw,26px);line-height:1.35;margin:12px 0 18px;font-weight:850}
.options{display:grid;gap:10px}.option{display:flex;gap:11px;align-items:center;width:100%;min-height:51px;padding:12px;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}
.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🛠️ Pascal's Law</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"What does Pascal's law state?",o:["Pressure applied to an enclosed fluid is transmitted equally throughout the fluid","Pressure acts only downward","Liquids cannot transmit pressure","Pressure disappears in a closed container"],a:0,e:"Pascal's law says an applied pressure change is transmitted undiminished through an enclosed fluid."},
{q:"Pascal's law is mainly used to explain:",o:["Hydraulic machines","Reflection of light","Magnetic induction","Thermal expansion only"],a:0,e:"Hydraulic systems use transmitted pressure to multiply force."},
{q:"In a hydraulic system, pressure applied to a confined liquid is transmitted:",o:["Only to the bottom","Equally in all directions","Only upward","Only near the piston"],a:1,e:"In an enclosed fluid at rest, the pressure change is transmitted throughout the fluid."},
{q:"Which device uses Pascal's law?",o:["Hydraulic lift","Mercury thermometer","Simple pendulum","Tuning fork"],a:0,e:"A hydraulic lift uses pressure transmission to raise heavy loads."},
{q:"Pressure is calculated by:",o:["Force × area","Force ÷ area","Area ÷ force","Mass × volume"],a:1,e:"Pressure equals the perpendicular force divided by the area."},
{q:"If the input piston area is 2 cm² and output area is 20 cm², the ideal force multiplication is:",o:["2 times","5 times","10 times","20 times"],a:2,e:"Force multiplication equals output area divided by input area: 20/2 = 10."},
{q:"A 50 N force acts on a 0.01 m² piston. What pressure is produced?",o:["5 Pa","50 Pa","500 Pa","5000 Pa"],a:3,e:"P = F/A = 50/0.01 = 5000 Pa."},
{q:"In an ideal hydraulic machine, if output piston area is larger, its output force is:",o:["Smaller than input force","Larger than input force","Always zero","Unrelated to area"],a:1,e:"At equal pressure, the larger piston experiences a larger force."},
{q:"The pressure at the two pistons of an ideal hydraulic press is:",o:["Equal","Always zero at output","Greater only at the small piston","Greater only in the narrow tube"],a:0,e:"Pascal's law transmits the pressure through the connected confined fluid."},
{q:"An input force of 100 N acts on an area of 5 cm². The pressure is:",o:["20 N/cm²","50 N/cm²","500 N/cm²","0.05 N/cm²"],a:0,e:"Pressure = 100/5 = 20 N/cm²."},
{q:"A hydraulic press has input area 4 cm² and output area 40 cm². If input force is 30 N, ideal output force is:",o:["3 N","30 N","300 N","1200 N"],a:2,e:"Fout/Fin = Aout/Ain = 40/4 = 10, so output force = 300 N."},
{q:"Which relation applies to an ideal hydraulic machine?",o:["F₁/A₁ = F₂/A₂","F₁A₁ = F₂/A₂","F₁/F₂ = A₂/A₁","F₁ + A₁ = F₂ + A₂"],a:0,e:"Equal pressure gives F₁/A₁ = F₂/A₂."},
{q:"If the output piston area is 5 times the input area, an ideal 10 N input force gives:",o:["2 N output","10 N output","50 N output","500 N output"],a:2,e:"The force is multiplied by the area ratio, 5 × 10 N = 50 N."},
{q:"A hydraulic brake transmits force using:",o:["Pressure in brake fluid","Sound waves in air","Magnetic attraction only","Expansion of a solid rod"],a:0,e:"Pressure applied to brake fluid is transmitted to the brake mechanisms."},
{q:"Which is a practical use of Pascal's law?",o:["Hydraulic car brakes","Solar eclipse prediction","Electric heating coil","Echo formation"],a:0,e:"Hydraulic brakes use fluid pressure transmission to apply braking force."},
{q:"Why is liquid used in most hydraulic systems?",o:["It is nearly incompressible","It is very easy to compress","It has no mass","It cannot transmit pressure"],a:0,e:"Liquids are nearly incompressible, allowing pressure to be transmitted effectively."},
{q:"If the input piston moves down a small distance, the output piston with a larger area moves:",o:["A larger distance","A smaller distance","Exactly the same distance in every case","No distance at all"],a:1,e:"For an incompressible fluid, displaced volumes match, so the larger piston moves less."},
{q:"In an ideal hydraulic system, input work compared with output work is:",o:["Less than output work","Equal to output work","Always zero","Always double output work"],a:1,e:"An ideal machine conserves work; force gain is balanced by a smaller displacement."},
{q:"A hydraulic lift supports a car using:",o:["A small force on a small piston to create a larger force on a larger piston","Only air pressure from the atmosphere","A decrease in liquid pressure to zero","A mechanical advantage unrelated to piston areas"],a:0,e:"Equal pressure on different piston areas creates different forces."},
{q:"A confined fluid has an added pressure of 2000 Pa. The pressure increase at another point is ideally:",o:["500 Pa","1000 Pa","2000 Pa","4000 Pa"],a:2,e:"The applied pressure change is transmitted undiminished throughout the enclosed fluid."},
{q:"Pascal's law applies most directly to a fluid that is:",o:["Enclosed and at rest for the pressure transmission setup","Always flowing at supersonic speed","A vacuum","A rigid solid only"],a:0,e:"Pascal's law is used for pressure transmission in a confined fluid."},
{q:"If force and piston area both double, the pressure:",o:["Doubles","Halves","Stays the same","Becomes four times larger"],a:2,e:"The ratio F/A remains unchanged when both quantities double."},
{q:"The SI unit of pressure is equivalent to:",o:["N/m²","N·m","kg·m/s² only","J/s"],a:0,e:"One pascal equals one newton per square metre."},
{q:"A hydraulic machine has equal piston areas. Ideally, the output force is:",o:["Half the input force","Equal to the input force","Ten times the input force","Always zero"],a:1,e:"Equal areas and equal pressures give equal forces."},
{q:"A 25 N force acts on a 0.005 m² input piston. Pressure equals:",o:["125 Pa","500 Pa","5000 Pa","25,000 Pa"],a:2,e:"P = 25/0.005 = 5000 Pa."},
{q:"The output piston area is 0.2 m² and pressure is 3000 Pa. Output force is:",o:["600 N","150 N","3000 N","15,000 N"],a:0,e:"F = PA = 3000 × 0.2 = 600 N."},
{q:"Which change increases the ideal output force in a hydraulic press at fixed input force?",o:["Increase the output piston area","Decrease the output piston area","Decrease input force","Make both piston areas zero"],a:0,e:"A larger output area gives a larger force at the same transmitted pressure."},
{q:"Why does a hydraulic jack help lift a heavy vehicle?",o:["It provides mechanical advantage using different piston areas","It removes the vehicle's weight","It changes liquid into a gas","It violates conservation of energy"],a:0,e:"The area ratio multiplies force while the output piston moves a shorter distance."},
{q:"In an ideal hydraulic system, a force gain of 8 means the output piston area is:",o:["One eighth of input area","Equal to input area","Eight times input area","Eighty times input area"],a:2,e:"With equal pressure, output/input force equals output/input area."},
{q:"Which statement is correct about Pascal's law?",o:["The transmitted pressure change is undiminished in an enclosed fluid","Pressure always decreases with depth","Only gases can transmit pressure","It states that force is equal to area"],a:0,e:"Pascal's law concerns undiminished transmission of an applied pressure change."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Pascal's Law Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
