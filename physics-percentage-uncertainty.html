<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Percentage Uncertainty</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.xp{font-weight:800}.card{background:white;border-radius:22px;padding:24px;margin-top:18px;box-shadow:0 5px 20px #00000012}.bar{height:10px;background:#e8eaf0;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.3s}.q{font-size:1.3rem;font-weight:750;line-height:1.45}.opts{display:grid;gap:10px;margin-top:18px}.opts button{padding:15px;border:2px solid #e2e5eb;border-radius:14px;background:white;text-align:left;font-size:1rem;cursor:pointer;transition:.2s}.opts button:hover{border-color:#58cc02;transform:translateY(-1px)}.opts button.selected{border-color:#58cc02;background:#f3fff0}.opts button.correct{border-color:#58cc02;background:#eaffef}.opts button.wrong{border-color:#e5484d;background:#fff0f0}.feedback{font-weight:700;margin-top:16px;min-height:24px}.btn{margin-top:18px;padding:13px 22px;border:0;border-radius:14px;background:#58cc02;color:white;font-weight:800;cursor:pointer;transition:.2s;box-shadow:0 4px 0 #45a800}.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #45a800}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #45a800}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}.back{display:inline-flex;align-items:center;gap:7px;margin-top:20px;padding:12px 18px;border:2px solid #5146a5;border-radius:14px;background:white;color:#5146a5;font-weight:800;text-decoration:none;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,background .2s,color .2s}.back:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#eeeaff,transparent);transform:translateX(-120%);transition:transform .5s}.back:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 6px 18px #5146a533;background:#faf9ff;color:#40378d}.back:hover:before{transform:translateX(120%)}.back:active{transform:translateY(1px) scale(.99);box-shadow:0 2px 8px #5146a522}.back:focus-visible{outline:3px solid #c9c3ff;outline-offset:3px}@media(max-width:600px){.wrap{padding:18px 12px}.card{padding:18px}.q{font-size:1.15rem}.top{align-items:flex-start}.back{width:max-content}}</style></head><body><main class="wrap"><div class="top"><h1>📈 Percentage Uncertainty</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></div><p>Master percentage uncertainty, relative uncertainty and uncertainty propagation with 15 NEET-style questions.</p><section class="card"><div style="display:flex;justify-content:space-between;gap:12px"><strong>🎯 Skill Mastery</strong><strong id="masteryText">0 / 15</strong></div><div class="bar" style="margin-top:8px"><div id="fill" class="fill"></div></div></section><section class="card"><div id="count"></div><p id="question" class="q"></p><div id="options" class="opts"></div><button id="check" class="btn" disabled>Check Answer</button><button id="next" class="btn" disabled>Continue →</button><div id="feedback" class="feedback"></div><p>💡 <span id="hint">Choose the best answer.</span></p><div id="result" style="display:none;text-align:center"><h2>🎉 Percentage Uncertainty mastered!</h2><p id="score"></p><button id="retry" class="btn">Retry Skill</button></div></section><a class="back" href="physics-home.html" aria-label="Back to Physics Path">← <span>Back to Physics Path</span></a></main><script>const qs=[['Percentage uncertainty is defined as:',['(Absolute uncertainty / measured value) × 100','Absolute uncertainty × measured value','Measured value / absolute uncertainty','True value × 100'],0,'Percentage uncertainty is relative uncertainty expressed as a percentage.'],['For a measurement x ± Δx, percentage uncertainty is:',['(Δx/x) × 100','(x/Δx) × 100','(x+Δx) × 100','(x−Δx) × 100'],0,'Use percentage uncertainty = (Δx/x) × 100.'],['Percentage uncertainty is related directly to:',['Relative uncertainty','Least count only','Dimensions of the quantity','SI unit only'],0,'Percentage uncertainty is 100 times the relative uncertainty.'],['For 10.0 ± 0.2 m, the percentage uncertainty is:',['2%','0.2%','20%','0.02%'],0,'(0.2/10.0) × 100 = 2%.'],['For 5.0 ± 0.1 cm, the percentage uncertainty is:',['2%','0.2%','5%','10%'],0,'(0.1/5.0) × 100 = 2%.'],['For 2.0 ± 0.1 s, the percentage uncertainty is:',['5%','0.5%','2%','10%'],0,'(0.1/2.0) × 100 = 5%.'],['For 50 ± 2 kg, the percentage uncertainty is:',['4%','2%','0.04%','25%'],0,'(2/50) × 100 = 4%.'],['Which measurement has the smaller percentage uncertainty?',['100 ± 1 cm','10 ± 1 cm','Both are equal','Cannot be determined'],0,'1% is smaller than 10%, so 100 ± 1 cm has the smaller percentage uncertainty.'],['If absolute uncertainty is fixed and measured value increases, percentage uncertainty generally:',['Decreases','Increases','Becomes 100%','Does not change'],0,'For fixed Δx, (Δx/x) × 100 decreases as x increases.'],['A measurement has relative uncertainty 0.03. Its percentage uncertainty is:',['3%','0.3%','30%','0.03%'],0,'0.03 × 100 = 3%.'],['A percentage uncertainty of 2.5% corresponds to relative uncertainty:',['0.025','0.25','2.5','25'],0,'2.5/100 = 0.025.'],['Which statement is correct?',['Percentage uncertainty is dimensionless and written with %','Percentage uncertainty has the same unit as the measured quantity','Percentage uncertainty is always greater than 100%','Percentage uncertainty is the true value'],0,'Percentage uncertainty is a dimensionless relative measure expressed using %.'],['For two quantities multiplied together, percentage/fractional uncertainties are combined by:',['Adding the fractional uncertainties','Subtracting them','Multiplying the measured values only','Ignoring both uncertainties'],0,'For maximum-error propagation in products, fractional uncertainties add.'],['For z = A/B, the percentage uncertainty is found from:',['(ΔA/A + ΔB/B) × 100','(ΔA−ΔB) × 100','(A/B) × 100','(ΔAΔB) × 100'],0,'For a quotient, maximum fractional uncertainties add, then multiply by 100.'],['Why is percentage uncertainty useful in NEET physics?',['It lets us compare measurement quality on a common scale','It replaces all physical equations','It gives the SI unit of a quantity','It removes experimental error completely'],0,'A percentage provides a common relative scale for comparing measurements.']];let i=0,selected=-1,score=0,answered=0;const $=id=>document.getElementById(id);function progress(){answered=Math.max(answered,i+1);$('masteryText').textContent=answered+' / '+qs.length;$('fill').style.width=(answered*100/qs.length)+'%'}function render(){const a=qs[i];selected=-1;$('count').textContent=`Question ${i+1} of ${qs.length}`;$('question').textContent=a[0];$('options').innerHTML='';$('feedback').textContent='';$('hint').textContent='Choose the best answer.';$('check').disabled=true;$('next').disabled=true;$('next').textContent='Continue →';a[1].forEach((t,j)=>{const b=document.createElement('button');b.textContent=`${String.fromCharCode(65+j)}. ${t}`;b.onclick=()=>{selected=j;[...$('options').children].forEach((x,k)=>x.classList.toggle('selected',k===j));$('check').disabled=false};$('options').appendChild(b)})}function checkAnswer(){if(selected<0)return;const a=qs[i],ok=selected===a[2];[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=ok?'✅ Correct! +10 XP — '+a[3]:'❌ Not quite. Correct answer: '+a[1][a[2]]+' — '+a[3];if(ok){score++;$('xp').textContent=score*10}progress();$('check').disabled=true;$('next').disabled=false;if(i===qs.length-1)$('next').textContent='Finish →'}function finish(){$('question').textContent='🎉 Skill complete!';$('options').innerHTML='';$('check').style.display='none';$('next').style.display='none';$('feedback').textContent=`You scored ${score} / ${qs.length} • ${score*10} XP`;$('hint').textContent=score===15?'Excellent! Perfect percentage uncertainty mastery.':'Keep practicing and try again to improve your score.';$('result').style.display='block';$('score').textContent=`${score} / ${qs.length} correct`;answered=15;progress();$('fill').style.width='100%'}$('check').onclick=checkAnswer;$('next').onclick=()=>{if(i<qs.length-1){i++;render()}else finish()};$('retry').onclick=()=>{i=0;selected=-1;score=0;answered=0;$('xp').textContent='0';$('result').style.display='none';$('check').style.display='inline-block';$('next').style.display='inline-block';progress();render()};progress();render();</script></body></html>
