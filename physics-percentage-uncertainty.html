<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Percentage Uncertainty</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;line-height:1.45}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{font-weight:700;color:#e08a00;text-align:center;min-height:24px;line-height:1.5}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>📈 Percentage Uncertainty</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['Percentage uncertainty is defined as:','(Absolute uncertainty / measured value) × 100','Absolute uncertainty × measured value','Measured value / absolute uncertainty','True value × 100',0,'Percentage uncertainty is relative uncertainty expressed as a percentage.'],['For a measurement x ± Δx, percentage uncertainty is:','(Δx/x) × 100','(x/Δx) × 100','(x+Δx) × 100','(x−Δx) × 100',0,'Use percentage uncertainty = (Δx/x) × 100.'],['Percentage uncertainty is related directly to:','Relative uncertainty','Least count only','Dimensions of the quantity','SI unit only',0,'Percentage uncertainty is 100 times the relative uncertainty.'],['For 10.0 ± 0.2 m, the percentage uncertainty is:','2%','0.2%','20%','0.02%',0,'(0.2/10.0) × 100 = 2%.'],['For 5.0 ± 0.1 cm, the percentage uncertainty is:','2%','0.2%','5%','10%',0,'(0.1/5.0) × 100 = 2%.'],['For 2.0 ± 0.1 s, the percentage uncertainty is:','5%','0.5%','2%','10%',0,'(0.1/2.0) × 100 = 5%.'],['For 50 ± 2 kg, the percentage uncertainty is:','4%','2%','0.04%','25%',0,'(2/50) × 100 = 4%.'],['Which measurement has the smaller percentage uncertainty?','100 ± 1 cm','10 ± 1 cm','Both are equal','Cannot be determined',0,'1% is smaller than 10%, so 100 ± 1 cm has the smaller percentage uncertainty.'],['If absolute uncertainty is fixed and measured value increases, percentage uncertainty generally:','Decreases','Increases','Becomes 100%','Does not change',0,'For fixed Δx, (Δx/x) × 100 decreases as x increases.'],['A measurement has relative uncertainty 0.03. Its percentage uncertainty is:','3%','0.3%','30%','0.03%',0,'0.03 × 100 = 3%.'],['A percentage uncertainty of 2.5% corresponds to relative uncertainty:','0.025','0.25','2.5','25',0,'2.5/100 = 0.025.'],['Which statement is correct?','Percentage uncertainty is dimensionless and written with %','Percentage uncertainty has the same unit as the measured quantity','Percentage uncertainty is always greater than 100%','Percentage uncertainty is the true value',0,'Percentage uncertainty is a dimensionless relative measure expressed using %.'],['For two quantities multiplied together, percentage/fractional uncertainties are combined by:','Adding the fractional uncertainties','Subtracting them','Multiplying the measured values only','Ignoring both uncertainties',0,'For maximum-error propagation in products, fractional uncertainties add.'],['For z = A/B, the percentage uncertainty is found from:','(ΔA/A + ΔB/B) × 100','(ΔA−ΔB) × 100','(A/B) × 100','(ΔAΔB) × 100',0,'For a quotient, maximum fractional uncertainties add, then multiply by 100.'],['Why is percentage uncertainty useful in NEET physics?','It lets us compare measurement quality on a common scale','It replaces all physical equations','It gives the SI unit of a quantity','It removes experimental error completely',0,'A percentage provides a common relative scale for comparing measurements.']];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
