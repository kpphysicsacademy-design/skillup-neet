<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Periodic Motion</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🔄 Periodic Motion</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['A motion that repeats itself at regular intervals of time is called','random motion','periodic motion','projectile motion','translational motion',1,'Periodic motion repeats its state after a fixed time interval.'],
['The smallest time after which a periodic motion repeats itself is called its','frequency','amplitude','period','phase',2,'The period T is the least time required for the motion to repeat.'],
['The SI unit of period is','hertz','second','radian','metre',1,'Period is a time quantity, so its SI unit is second (s).'],
['The frequency of a periodic motion is defined as','time for one cycle','number of cycles per unit time','maximum displacement','angular displacement only',1,'Frequency is the number of complete cycles or oscillations per unit time.'],
['The relation between frequency ν and period T is','ν = T','ν = 2πT','ν = 1/T','ν = T²',2,'Frequency and period are reciprocals: ν = 1/T.'],
['A periodic motion has a period of 0.25 s. Its frequency is','0.25 Hz','2 Hz','4 Hz','25 Hz',2,'ν = 1/T = 1/0.25 = 4 Hz.'],
['Which of the following is an example of periodic motion?','A stone falling once from a height','A clock hand rotating repeatedly','A car braking to rest','A projectile moving once through the air',1,'The motion of a clock hand repeats after regular intervals.'],
['Which statement correctly distinguishes oscillatory motion from periodic motion?','Every periodic motion is oscillatory','Oscillatory motion is necessarily random','Oscillatory motion is generally to-and-fro about a mean or equilibrium position','Periodic motion can never repeat',2,'Oscillatory motion is a type of repetitive to-and-fro motion about an equilibrium position.'],
['Which statement about periodic and simple harmonic motion is correct?','Every periodic motion is SHM','Every SHM is periodic','No SHM is periodic','Periodic motion cannot be described mathematically',1,'SHM is periodic, but not every periodic motion satisfies the SHM condition.'],
['For simple harmonic motion written as x = A cos(ωt + φ), A represents','frequency','period','amplitude','phase constant',2,'A is the maximum displacement from the equilibrium position and is the amplitude.'],
['For x = A cos(ωt + φ), the quantity (ωt + φ) is called','amplitude','phase','frequency','period',1,'The instantaneous phase of SHM is ωt + φ.'],
['The angular frequency of a periodic motion is related to its period by','ω = T/2π','ω = 2π/T','ω = 1/(2πT)','ω = 2πT',1,'Angular frequency is ω = 2π/T = 2πν.'],
['The SI unit of frequency is','joule','newton','hertz','watt',2,'One hertz equals one cycle per second, or s⁻¹.'],
['Which function is not periodic?','sin(ωt)','cos(ωt)','e^(−ωt)','sin(2ωt)',2,'An exponentially decaying function e^(−ωt) does not repeat its values at regular intervals.'],
['In SHM, the restoring acceleration is related to displacement by','a = +ω²x','a = −ω²x','a = x/ω²','a = constant',1,'For SHM, acceleration is proportional to displacement and directed toward equilibrium: a = −ω²x.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
