<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>📐 Perpendicular Axis Theorem</h1><p class="muted">Learn the perpendicular-axis formula, conditions and quick calculations one step at a time.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{"q":"What is the perpendicular-axis theorem for a plane lamina?","o":["Iz = Ix + Iy","Iz = Ix − Iy","Iz = IxIy","Iz = Ix/Iy"],"a":0,"e":"The moment of inertia about the perpendicular z-axis equals the sum for two perpendicular axes in the plane."},
{"q":"The perpendicular-axis theorem applies directly to:","o":["A planar lamina","Any thick 3D solid","Only a point particle","Only a sphere"],"a":0,"e":"The mass distribution must lie in a plane, or be treated as a thin lamina."},
{"q":"For the theorem, the x-, y- and z-axes must:","o":["Meet at one point and be mutually perpendicular","Be parallel","Meet at different points","All lie in the lamina plane"],"a":0,"e":"The x and y axes lie in the plane; z is perpendicular to it, and all pass through the same point."},
{"q":"If Ix = 2 kg m² and Iy = 3 kg m², then Iz is:","o":["5 kg m²","1 kg m²","6 kg m²","0.67 kg m²"],"a":0,"e":"Iz = Ix + Iy = 2 + 3 = 5 kg m²."},
{"q":"If Iz = 12 kg m² and Ix = 7 kg m², find Iy.","o":["5 kg m²","19 kg m²","84 kg m²","1.71 kg m²"],"a":0,"e":"Rearrange the theorem: Iy = Iz − Ix = 12 − 7 = 5 kg m²."},
{"q":"For a uniform circular disc, the moment of inertia about its central axis perpendicular to the disc is:","o":["½MR²","MR²","⅖MR²","⅓MR²"],"a":0,"e":"A uniform disc has Iz = ½MR² about its central perpendicular axis."},
{"q":"For a uniform disc, the moment of inertia about a diameter through its centre is:","o":["¼MR²","½MR²","MR²","⅖MR²"],"a":0,"e":"By symmetry Ix = Iy and Iz = Ix + Iy, so each diameter value is Iz/2 = ¼MR²."},
{"q":"For a thin ring, Iz about the central perpendicular axis is MR². Its moment of inertia about a diameter is:","o":["½MR²","MR²","¼MR²","2MR²"],"a":0,"e":"The two perpendicular diameters have equal I, and their sum is MR²."},
{"q":"If Ix = Iy for a planar lamina, then Iz equals:","o":["2Ix","Ix/2","Ix","Ix²"],"a":0,"e":"With Ix = Iy, Iz = Ix + Iy = 2Ix."},
{"q":"A plane lamina has Ix = 4 kg m² and Iy = 4 kg m². Find Iz.","o":["8 kg m²","4 kg m²","2 kg m²","16 kg m²"],"a":0,"e":"Iz = 4 + 4 = 8 kg m²."},
{"q":"Which axis is perpendicular to the plane of a lamina lying in the xy-plane?","o":["z-axis","x-axis","y-axis","Any axis in the xy-plane"],"a":0,"e":"The z-axis is normal to the xy-plane."},
{"q":"Why does the theorem work for a planar mass distribution?","o":["For each mass element, r² = x² + y²","Because mass is always constant","Because angular speed is zero","Because all points have the same distance from each axis"],"a":0,"e":"A mass element's squared distance from z is the sum of its squared distances from x and y."},
{"q":"A lamina has Iz = 20 kg m² and Iy = 8 kg m². What is Ix?","o":["12 kg m²","28 kg m²","160 kg m²","2.5 kg m²"],"a":0,"e":"Ix = Iz − Iy = 20 − 8 = 12 kg m²."},
{"q":"The perpendicular-axis theorem is different from the parallel-axis theorem because it:","o":["Relates axes with different orientations through a common point","Shifts an axis parallel to itself","Requires a centre-of-mass axis only","Applies only to spheres"],"a":0,"e":"The perpendicular-axis theorem changes orientation; the parallel-axis theorem shifts to a parallel axis."},
{"q":"Which statement is correct about applying the theorem to a thick solid cylinder directly?","o":["Not directly, because its mass is distributed in 3D","Always valid for any axis","Valid only if the cylinder is rotating","It gives zero moment of inertia"],"a":0,"e":"The standard theorem requires planar mass distribution, unlike a thick 3D body."},
{"q":"For a circular disc, Ix = Iy because:","o":["The disc is symmetric about any diameter through its centre","The mass is zero","The axes are parallel","The disc has no radius"],"a":0,"e":"Rotational symmetry makes the moments about central diameters equal."},
{"q":"If Ix increases by 3 kg m² while Iy stays fixed, Iz:","o":["Increases by 3 kg m²","Decreases by 3 kg m²","Does not change","Becomes zero"],"a":0,"e":"Since Iz = Ix + Iy, the same change in Ix produces the same change in Iz."},
{"q":"The SI unit of moment of inertia is:","o":["kg m²","kg m","N m","kg/s"],"a":0,"e":"Moment of inertia has dimensions mass × length squared."},
{"q":"A planar body has Ix = 0 and Iy = 6 kg m². What is Iz?","o":["6 kg m²","0","3 kg m²","Cannot be determined"],"a":0,"e":"The theorem gives Iz = 0 + 6 = 6 kg m²."},
{"q":"For a thin ring, if M = 2 kg and R = 0.5 m, Iz about its central perpendicular axis is:","o":["0.5 kg m²","1 kg m²","0.25 kg m²","2 kg m²"],"a":0,"e":"Iz = MR² = 2 × 0.25 = 0.5 kg m²."},
{"q":"For a uniform disc with M = 4 kg and R = 1 m, I about a diameter is:","o":["1 kg m²","2 kg m²","4 kg m²","0.5 kg m²"],"a":0,"e":"I diameter = ¼MR² = ¼ × 4 × 1 = 1 kg m²."},
{"q":"Which of these is an in-plane axis for a lamina in the xy-plane?","o":["x-axis","z-axis","An axis normal to the sheet","An axis above the sheet"],"a":0,"e":"The x-axis lies within the xy-plane of the lamina."},
{"q":"The perpendicular axis theorem requires the three axes to intersect:","o":["At the same point","At three different points","Only at the centre of mass","At the outer edge"],"a":0,"e":"The common intersection point is essential; it need not always be the centre of mass."},
{"q":"A planar lamina has Ix = 9 kg m² and Iz = 15 kg m². Find Iy.","o":["6 kg m²","24 kg m²","135 kg m²","1.67 kg m²"],"a":0,"e":"Iy = Iz − Ix = 15 − 9 = 6 kg m²."},
{"q":"For a symmetric planar lamina, Ix = Iy = 5 kg m². What is Iz?","o":["10 kg m²","5 kg m²","2.5 kg m²","25 kg m²"],"a":0,"e":"Iz = 5 + 5 = 10 kg m²."},
{"q":"Which object is a typical example of a planar lamina?","o":["A thin metal sheet","A thick solid sphere","A long solid cylinder","A cube"],"a":0,"e":"A thin sheet can be approximated as a planar mass distribution."},
{"q":"For a particle of mass m at coordinates (x,y) in the plane, its squared distance from the z-axis is:","o":["x² + y²","x² − y²","xy","x + y"],"a":0,"e":"The radial distance satisfies r² = x² + y²."},
{"q":"If Iz = 25 kg m² and Ix = 10 kg m², then Iy is:","o":["15 kg m²","35 kg m²","250 kg m²","2.5 kg m²"],"a":0,"e":"Iy = 25 − 10 = 15 kg m²."},
{"q":"For a thin circular ring, the two moments about perpendicular diameters through its centre are:","o":["Equal to each other","Always zero","Unequal by definition","Equal to MR² each"],"a":0,"e":"Symmetry gives equal diameter moments, and their sum is MR², so each is ½MR²."},
{"q":"What is the key restriction to remember for the perpendicular-axis theorem?","o":["Use it for a planar mass distribution with all axes meeting at one point","Use it for all 3D solids without checking","The axes must be parallel","The body must be moving"],"a":0,"e":"The theorem applies to planar laminae, with two perpendicular in-plane axes and a normal axis through their common point."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Perpendicular Axis Theorem Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
