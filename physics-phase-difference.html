<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>

<script>
(function(){
'use strict';
const questions = [{"q":"In wave motion, phase describes…","o":["The state of oscillation at a point","Only the wave's amplitude","The medium's mass","The wave's total energy only"],"a":0,"e":"Phase identifies where an oscillator is within its cycle at a specified position and time."},{"q":"The phase difference between two oscillations tells us…","o":["How far apart in cycle they are","Their masses","Their amplitudes must be equal","Their wave speeds must differ"],"a":0,"e":"Phase difference compares the relative stages of two periodic oscillations."},{"q":"One complete oscillation corresponds to a phase change of…","o":["π/2 rad","π rad","2π rad","4π rad"],"a":2,"e":"A complete cycle is 360°, equivalent to 2π radians."},{"q":"A phase difference of π radians is equivalent to…","o":["0°","90°","180°","360°"],"a":2,"e":"π radians equals 180°, half a complete cycle."},{"q":"A phase difference of π/2 radians is…","o":["45°","90°","180°","270°"],"a":1,"e":"π/2 radians equals 90°, one quarter of a cycle."},{"q":"For two points on a sinusoidal travelling wave separated by distance Δx, the spatial phase difference magnitude is…","o":["2πΔx/λ","2πλ/Δx","Δx/2πλ","λΔx"],"a":0,"e":"The spatial phase difference is Δφ = kΔx = (2π/λ)Δx."},{"q":"Two points separated by one wavelength λ have phase difference…","o":["0 rad only","π/2 rad","π rad","2π rad"],"a":3,"e":"Δφ = 2πΔx/λ = 2π for Δx = λ; this is equivalent to being in phase."},{"q":"Two points separated by half a wavelength have phase difference…","o":["0","π/2","π","2π"],"a":2,"e":"For Δx = λ/2, Δφ = 2π(λ/2)/λ = π radians."},{"q":"Two points separated by one-quarter wavelength have phase difference…","o":["π/4","π/2","π","2π"],"a":1,"e":"For Δx = λ/4, Δφ = 2π(1/4) = π/2 radians."},{"q":"Two oscillations are in phase when their phase difference is…","o":["An integer multiple of 2π","Always π","Always π/2","An odd multiple of π/2"],"a":0,"e":"Oscillations are in phase when their phase difference is 0 modulo 2π."},{"q":"Two sinusoidal oscillations are in antiphase when their phase difference is…","o":["0","π radians (modulo 2π)","π/4 radians","2π radians only"],"a":1,"e":"Antiphase means a phase difference of π radians, so their displacements are opposite at corresponding times when amplitudes match."},{"q":"If the period is T, the time-related phase difference for a time separation Δt has magnitude…","o":["2πΔt/T","T/(2πΔt)","2πT/Δt","Δt/T²"],"a":0,"e":"The phase changes by 2π per period, so |Δφ| = 2πΔt/T."},{"q":"Two oscillations have period 4 s and are observed 1 s apart in time. Their phase difference magnitude is…","o":["π/4","π/2","π","2π"],"a":1,"e":"Δφ = 2πΔt/T = 2π(1/4) = π/2 radians."},{"q":"For frequency f, the phase change during time interval Δt has magnitude…","o":["2πfΔt","f/(2πΔt)","2πΔt/f","fΔt²"],"a":0,"e":"Angular frequency is ω = 2πf, so the phase change magnitude is ωΔt = 2πfΔt."},{"q":"Two points have phase difference 3π radians. This is equivalent modulo 2π to…","o":["0","π","π/2","2π"],"a":1,"e":"Subtracting one full cycle 2π from 3π leaves π radians."},{"q":"A phase difference of 360° is equivalent to…","o":["In phase","Antiphase","A quarter cycle apart","Three-quarters of a cycle apart"],"a":0,"e":"360° is a complete cycle, equivalent to 0° phase difference."},{"q":"A phase difference of 90° corresponds to a time difference of what fraction of a period?","o":["One-half","One-quarter","Three-quarters","One full period"],"a":1,"e":"90° is one-quarter of 360°, so the time difference is T/4."},{"q":"If two points on a wave differ in phase by π/3, the phase difference in degrees is…","o":["30°","60°","90°","120°"],"a":1,"e":"π radians = 180°, so π/3 = 60°."},{"q":"A phase difference of 120° equals…","o":["π/3 rad","2π/3 rad","3π/2 rad","2π rad"],"a":1,"e":"120° × π/180° = 2π/3 radians."},{"q":"If two points are separated by 3λ/4, their spatial phase difference magnitude is…","o":["π/4","π/2","π","3π/2"],"a":3,"e":"Δφ = 2π(3λ/4)/λ = 3π/2 radians."},{"q":"Two wave points are 0.5 m apart and the wavelength is 2 m. The phase difference magnitude is…","o":["π/4","π/2","π","2π"],"a":1,"e":"Δφ = 2πΔx/λ = 2π(0.5/2) = π/2 radians."},{"q":"If the wavelength is 4 m, what separation corresponds to a phase difference of π radians?","o":["0.5 m","1 m","2 m","4 m"],"a":2,"e":"π radians corresponds to half a wavelength, so Δx = λ/2 = 2 m."},{"q":"If a wave has frequency 10 Hz, its period is…","o":["0.01 s","0.1 s","1 s","10 s"],"a":1,"e":"T = 1/f = 1/10 = 0.1 s."},{"q":"For two points in the same progressive wave, phase difference due to spatial separation depends on…","o":["Their separation relative to wavelength","Their colour","The mass of a single particle only","The amplitude alone"],"a":0,"e":"The spatial phase difference is 2πΔx/λ, so it depends on separation compared with wavelength."},{"q":"For two oscillators of the same frequency, a fixed time delay corresponds to a phase difference that is…","o":["Fixed","Always zero","Always π","Unrelated to frequency"],"a":0,"e":"For equal frequencies, a fixed time offset gives a fixed phase difference Δφ = 2πfΔt."},{"q":"If two equal-amplitude oscillations are in antiphase, their sum at every instant is…","o":["Twice the amplitude","Zero displacement","A constant maximum","A wave of double frequency"],"a":1,"e":"Equal-amplitude oscillations separated by π have opposite displacements and cancel at each instant."},{"q":"A wave has frequency 5 Hz. The phase advances in 0.05 s by…","o":["π/4 rad","π/2 rad","π rad","2π rad"],"a":1,"e":"Δφ = 2πfΔt = 2π × 5 × 0.05 = π/2 radians."},{"q":"Two points are separated by 0.25λ. Their phase difference in degrees is…","o":["45°","90°","180°","270°"],"a":1,"e":"One wavelength corresponds to 360°, so 0.25λ corresponds to 90°."},{"q":"Which phase difference represents oscillations that are opposite in phase?","o":["2π","π","π/2","0"],"a":1,"e":"A phase difference of π radians (180°) means antiphase."},{"q":"If a sinusoidal wave has phase kx − ωt, how does phase change with increasing time at fixed x?","o":["It decreases at rate ω","It increases at rate k","It remains constant","It changes at rate λ"],"a":0,"e":"At fixed x, the phase term kx − ωt decreases linearly with time at rate ω."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
const wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Phase Difference Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
