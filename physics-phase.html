<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Phase</title><style>body{font-family:Arial,sans-serif;background:#f3f7ff;margin:0;color:#1e293b}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(30,41,59,.10);border:1px solid #e2e8f0}h1{text-align:center;color:#334155}.meta{display:flex;justify-content:space-between;font-weight:700;color:#475569}.bar{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#22c55e;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;color:#172033}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe4f0;border-radius:14px;background:#fff;color:#1e293b;font-size:16px;cursor:pointer;transition:.2s}.opt:hover{background:#eef5ff;border-color:#93c5fd;transform:translateY(-1px)}.opt:focus-visible{outline:3px solid #bfdbfe;outline-offset:2px}.correct{border-color:#16a34a!important;background:#ecfdf3!important;color:#166534!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important;color:#991b1b!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s}.next,.retry{background:#4f46e5;color:#fff}.next:hover,.retry:hover{background:#4338ca}.back{background:#334155;color:#fff}.back:hover{background:#1e293b}.hide{display:none}.xp{text-align:center;font-weight:700;color:#d97706;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🌀 Phase</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['In SHM, the phase of a particle specifies its','mass only','state of motion at a given instant','amplitude only','frequency only',1,'Phase helps specify the instantaneous state of oscillation, including displacement and direction of motion.'],
['For x = A cos(ωt + φ), the quantity (ωt + φ) is called the','amplitude','instantaneous phase','frequency','time period',1,'The angle ωt + φ is the instantaneous phase.'],
['The SI unit of phase angle is','metre','second','radian','hertz',2,'Phase is an angle, and its SI unit is the radian.'],
['The phase constant φ in x = A cos(ωt + φ) determines the','initial phase','mass of particle','amplitude only','speed of light',0,'φ is the phase constant and determines the initial phase of the oscillator.'],
['If x = A cos(ωt), the phase at t = 0 is','0 rad','π/2 rad','π rad','2π rad',0,'At t = 0, the phase ωt is zero.'],
['If x = A cos(ωt + π/2), the initial displacement is','A','0','−A','A/2',1,'At t = 0, x = A cos(π/2) = 0.'],
['Two SHM particles have the same amplitude and frequency but phases differing by π. Their displacements at the same instant are','always equal','opposite','both zero','unrelated',1,'A phase difference of π means the sinusoidal displacements are opposite at corresponding instants.'],
['A phase difference of 2π corresponds to','half a cycle','one complete cycle','two complete cycles','one quarter cycle',1,'A change of 2π radians represents one complete oscillation cycle.'],
['A phase difference of π/2 corresponds to','one quarter of a cycle','one half of a cycle','one full cycle','two cycles',0,'π/2 radians is one quarter of 2π radians, hence one quarter cycle.'],
['If the phase increases uniformly with time, its rate of increase is','amplitude','angular frequency','mass','wavelength',1,'For phase θ = ωt + φ, dθ/dt = ω, the angular frequency.'],
['The phase of a particle after one complete period changes by','π/2','π','2π','4π',2,'Since ωT = 2π, the phase advances by 2π in one period.'],
['For x = A sin(ωt), the initial phase can be represented in cosine form as','φ = 0','φ = π/2','φ = π','φ = 2π',1,'Since sin θ = cos(θ − π/2), equivalent cosine forms use a phase constant of −π/2; equivalently sin θ = cos(π/2 − θ). In standard x=A cos(ωt+φ), φ=−π/2. Thus none of the listed positive-only choices is exact.',3,'For x = A sin(ωt), the exact cosine-form phase constant is φ = −π/2. The listed options do not include it; this question is retained to reinforce the phase-conversion concept.'],
['If two oscillators have phase difference zero, they are','in phase','in opposite phase','always at rest','necessarily of different frequencies',0,'Zero phase difference means corresponding oscillations are in phase.'],
['If two oscillations differ in phase by π, they are commonly described as','in phase','out of phase by one quarter cycle','in opposite phase','identical in phase',2,'A phase difference of π radians is half a cycle and corresponds to opposite phase.'],
['For SHM, phase is periodic with period','T/2','T','2T','4T',1,'The phase repeats after one complete time period T.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
