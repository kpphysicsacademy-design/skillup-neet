<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Photoelectric Effect</title><meta name="description" content="SkillUp Physics Photoelectric Effect interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">⚡</span><h1>Photoelectric Effect</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["The photoelectric effect is the emission of electrons from a metal surface when it is exposed to:",["Electromagnetic radiation of sufficiently high frequency","Only sound waves","Only magnetic fields","Any radiation regardless of frequency"],0,"Photoelectric emission occurs when incident electromagnetic radiation has frequency at or above the material's threshold frequency."],["The emitted electrons in the photoelectric effect are called:",["Photoelectrons","Protons","Neutrons","Positrons"],0,"Electrons emitted from the illuminated metal surface are called photoelectrons."],["The minimum frequency needed to produce photoelectric emission is called:",["Threshold frequency","Resonant frequency","Cyclotron frequency","Natural frequency"],0,"Threshold frequency is the minimum frequency required for photoelectric emission from a given material."],["For light with frequency below the threshold frequency, photoelectric emission occurs:",["Only if intensity is increased enough","Never, regardless of intensity","Only at night","Only with a concave lens"],1,"Below threshold frequency, increasing intensity cannot cause photoemission from an ideal clean surface."],["According to Einstein's photoelectric equation, the maximum kinetic energy of a photoelectron is:",["K_max = hν − φ","K_max = hν + φ","K_max = φ − hν always","K_max = h/ν"],0,"Einstein's equation is K_max=hν−φ, where φ is the work function."],["The work function of a metal is the minimum energy required to:",["Remove an electron from the metal surface","Heat the metal to its melting point","Move a proton inside the nucleus","Create a photon"],0,"Work function is the minimum energy needed to liberate an electron from the metal surface."],["The relation between work function φ and threshold frequency ν₀ is:",["φ = hν₀","φ = h/ν₀","φ = ν₀/h","φ = 0 for every metal"],0,"At threshold, the emitted electron has zero maximum kinetic energy, so φ=hν₀."],["If the frequency of incident light is increased above threshold, the maximum kinetic energy of photoelectrons:",["Increases","Decreases to zero","Remains fixed for all frequencies","Becomes independent of frequency"],0,"K_max=hν−φ, so maximum kinetic energy increases linearly with frequency."],["For monochromatic light above threshold, increasing light intensity primarily increases the:",["Photoelectric current","Maximum kinetic energy of each photoelectron","Threshold frequency of the metal","Work function"],0,"At fixed frequency above threshold, higher intensity means more incident photons per second and hence greater photoelectric current."],["The maximum kinetic energy of photoelectrons is primarily determined by the:",["Frequency of incident radiation","Intensity alone","Area of the metal alone","Distance of the source alone"],0,"At a fixed material, K_max depends on incident frequency, not simply on intensity."],["The stopping potential V₀ is related to maximum kinetic energy by:",["eV₀ = K_max","V₀ = eK_max","e/V₀ = K_max","V₀ = K_max²"],0,"The stopping potential satisfies eV₀=K_max for an electron of charge magnitude e."],["A metal has work function 2 eV and is illuminated by photons of energy 5 eV. The maximum kinetic energy is:",["3 eV","7 eV","2.5 eV","0 eV"],0,"K_max=E_photon−φ=5−2=3 eV."],["A photon has frequency ν and energy E. Its energy is given by:",["E=hν","E=h/ν","E=ν/h","E=mc only"],0,"Photon energy is quantised according to E=hν."],["One important observation supporting the particle nature of light is that photoemission is:",["Essentially instantaneous when frequency is above threshold","Always delayed for several hours","Independent of frequency","Possible only with sound"],0,"When the threshold condition is met, photoemission begins essentially without an observable time lag."],["In a graph of stopping potential V₀ versus frequency ν, the slope is related to:",["h/e","e/h","hν","φe"],0,"From eV₀=hν−φ, V₀=(h/e)ν−φ/e, so the slope is h/e."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
