<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Photon</title><meta name="description" content="SkillUp Physics Photon interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">💡</span><h1>Photon</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["A photon is best described as a:",["Quantum of electromagnetic radiation","Charged particle with rest mass","Sound wave packet","Stationary atom"],0,"A photon is the quantum, or discrete packet, of electromagnetic radiation."],["The energy of a photon is given by:",["E=hν","E=h/ν","E=ν/h","E=mc² only"],0,"Photon energy is quantised according to E=hν, where h is Planck's constant and ν is frequency."],["The energy of a photon can also be written as:",["E=hc/λ","E=hλ/c","E=cλ/h","E=λ/hc"],0,"Since ν=c/λ, the photon-energy relation becomes E=hc/λ."],["The momentum of a photon is:",["p=h/λ","p=hλ","p=λ/h","p=mc²"],0,"Photon momentum is p=h/λ, equivalently p=E/c."],["The rest mass of a photon is:",["Zero","Equal to electron mass","1 kg","Infinite"],0,"A photon has zero invariant rest mass, although it carries energy and momentum."],["Photons travel in vacuum with speed:",["c","Less than c/2","Greater than c","Zero"],0,"In vacuum, electromagnetic radiation propagates at c, approximately 3×10^8 m/s."],["The charge of a photon is:",["Zero","Positive","Negative","Depends on frequency"],0,"Photons are electrically neutral and have zero electric charge."],["If the frequency of a photon is doubled, its energy:",["Doubles","Becomes half","Becomes four times","Remains unchanged"],0,"Because E=hν, photon energy is directly proportional to frequency."],["If the wavelength of a photon is doubled, its energy:",["Becomes half","Doubles","Becomes four times","Remains unchanged"],0,"From E=hc/λ, photon energy is inversely proportional to wavelength."],["Which photon has the greatest energy?",["A photon of highest frequency","A photon of lowest frequency","All photons have equal energy","A photon of longest wavelength"],0,"Higher frequency means higher photon energy because E=hν."],["The number of photons emitted per second is related most directly to the:",["Intensity of radiation, for fixed photon energy","Speed of light in vacuum","Photon charge","Rest mass"],0,"For fixed photon energy, greater intensity corresponds to a greater photon flux, meaning more photons per second through a given area."],["A photon of frequency 5×10^14 Hz has energy approximately:",["3.3×10^-19 J","3.3×10^-29 J","1.0×10^-14 J","6.6×10^-48 J"],0,"Using E=hν with h≈6.63×10^-34 J·s gives E≈3.3×10^-19 J."],["The wavelength corresponding to a photon of frequency ν is:",["λ=c/ν","λ=cν","λ=ν/c","λ=hν"],0,"For electromagnetic radiation in vacuum, c=νλ, so λ=c/ν."],["Photon momentum is related to photon energy by:",["p=E/c","p=Ec","p=E/c²","p=mc²"],0,"For a photon, E=pc, hence p=E/c."],["The particle nature of electromagnetic radiation is especially demonstrated by:",["Photoelectric effect","Interference alone","Diffraction alone","Polarisation alone"],0,"The photoelectric effect provides direct evidence for quantised, particle-like energy transfer through photons."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
