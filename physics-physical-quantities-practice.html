<style>
:root{color-scheme:light;--bg:#f1f1e5;--panel:#fff;--ink:#27372e;--muted:#68766a;--line:#dce5d7;--green:#58cc02;--green-dark:#46a302;--blue:#1cb0f6;--red:#e55353}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow-x:hidden}
header{position:sticky;top:0;z-index:5;background:#fbfbf3;border-bottom:1px solid #dce1d4}.nav{width:min(100% - 24px,760px);min-height:72px;margin:auto;display:flex;align-items:center;gap:10px}.back{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;border:2px solid var(--line);border-radius:15px;background:#f2f9ff;color:#174a78;text-decoration:none;font-size:22px}.brand{flex:1;font-size:20px;font-weight:950;line-height:1.1}.brand small{display:block;margin-top:4px;color:var(--muted);font-size:9px;letter-spacing:.8px}.pill{white-space:nowrap;border-radius:99px;padding:9px 11px;font-size:12px;font-weight:900}.xp{background:#eeefe2;border:1px solid #d6ddce}.streak{background:#fff0e8;border:1px solid #f5d7c5;color:#ad4b21}
main{width:min(100% - 24px,720px);margin:24px auto 50px}.hero{padding:20px;background:#e9eddf;border:2px solid #d6ddce;border-radius:22px;margin-bottom:16px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.7px;color:#61705d}.hero h1{font-size:clamp(23px,5vw,31px);line-height:1.2;margin:7px 0;color:#254b37}.hero p{margin:0;color:#5f6f61;line-height:1.55;font-size:14px}.stage-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.stage{padding:6px 10px;border-radius:99px;background:#fff;font-size:11px;font-weight:850;color:#45634b}
.progress-card{padding:18px 20px;background:#e9eddf;border:2px solid #d6ddce;border-radius:20px;margin-bottom:14px}.progress-line{display:flex;justify-content:space-between;gap:12px;font-weight:900;color:#61705d;margin-bottom:10px}.track{height:11px;border-radius:99px;background:#dce5d7;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}
.page-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px}.page-tab{min-height:47px;display:grid;place-items:center;padding:8px 4px;border:2px solid #dce8f3;border-radius:15px;background:#fff;color:#245273;text-decoration:none;font-size:13px;font-weight:900;box-shadow:0 3px 0 #dce8f3}.page-tab.active{background:#e8f8dc;border-color:#8ed65b;color:#286c12;box-shadow:0 3px 0 #b9e69c}.page-progress{margin-bottom:14px;padding:10px;border:1px solid #d7eaf8;border-radius:12px;background:#eef8ff;color:#245273;text-align:center;font-size:12px;font-weight:850}
.quiz-card{background:#fff;border:2px solid #e2e9df;border-radius:23px;padding:clamp(17px,4vw,25px);box-shadow:0 5px 0 #dce8f3}.qmeta{font-size:12px;font-weight:900;letter-spacing:.5px;color:#6b7969}.question{display:block!important;visibility:visible!important;min-height:2em;margin:16px 0 20px;font-size:clamp(20px,4.4vw,27px);line-height:1.42;font-weight:850;color:#27372e;overflow-wrap:anywhere}.options{display:grid!important;grid-template-columns:minmax(0,1fr);gap:10px;visibility:visible!important}.option{display:flex!important;align-items:center;gap:12px;width:100%;min-height:58px;padding:12px 14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;background:#fbfcf8;color:var(--ink);text-align:left;font:750 15px/1.4 system-ui,sans-serif;cursor:pointer;visibility:visible!important}.letter{width:29px;height:29px;flex:0 0 29px;display:grid;place-items:center;border:2px solid var(--line);border-radius:9px;font-size:12px;color:#68766a}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7;color:#245b12}.option.wrong{border-color:var(--red);background:#fff0f0;color:#8f2020}.option:disabled{cursor:default;opacity:1}
.feedback{display:none;margin-top:15px;padding:14px;border-radius:15px;font-size:14px;line-height:1.55;font-weight:650}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #b8e99e;color:#245b12}.feedback.bad{background:#fff0f0;border:2px solid #ffc2c7;color:#842029}
.actions{display:flex;gap:10px;margin-top:17px}.btn{flex:1;min-height:52px;border:0;border-radius:16px;padding:12px 16px;font:900 15px system-ui,sans-serif;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{margin-top:15px;padding:24px;background:#fff;border:2px solid #dce8f3;border-radius:22px;text-align:center;box-shadow:0 5px 0 #dce8f3}.finish h2{margin:5px 0 8px}.score{font-size:42px;font-weight:950;color:#245273}.muted{color:var(--muted);font-size:14px;line-height:1.5}.review{padding:13px;margin:10px 0;border:2px solid var(--line);border-radius:14px;text-align:left}.review p{margin:6px 0;line-height:1.5}.your{color:#a12b30}.right{color:#245b12}.finish .btn{margin-top:12px;background:var(--green);color:white;box-shadow:0 4px 0 var(--green-dark)}.empty{padding:20px;text-align:center;color:var(--muted)}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
@media(max-width:440px){.nav{gap:6px}.brand{font-size:17px}.pill{padding:8px;font-size:10px}main{width:calc(100% - 20px);margin-top:14px}.hero{padding:16px}.progress-card{padding:15px}.page-tab{font-size:11px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="pill xp">⭐ <span id="xp">0</span> XP</div><div class="pill streak">🔥 <span id="streak">0</span> streak</div></div></header>
<main>

<section class="progress-card" aria-label="Quiz progress"><div class="progress-line"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<nav class="page-tabs" aria-label="Physical Quantities pages"><a class="page-tab" href="physics-physical-quantities.html">📘 Learn</a><a class="page-tab" href="physics-physical-quantities-simulator.html">🎮 Simulator</a><a class="page-tab active" href="physics-physical-quantities-practice.html" aria-current="page">🧠 Practice</a></nav>
<div class="page-progress" id="pageProgress" role="status">Progress: Practice in progress</div>
<section class="quiz-card" id="quiz" aria-live="polite"><div class="qmeta" id="qmeta">FOUNDATION · QUESTION 1</div><h2 class="question" id="question">Loading question…</h2><div class="options" id="options"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><button class="btn check" id="check" type="button" disabled>Check answer</button><button class="btn continue" id="continue" type="button">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const bank=[
["A physical quantity is a property that can be:",["Measured","Imagined only","Named only","Drawn only"],0,"A physical quantity can be measured and expressed with a number and a unit."],
["A measurement is correctly written as:",["Number only","Unit only","Number multiplied by unit","Symbol only"],2,"A measurement contains a numerical value and a unit."],
["How many SI base quantities are there?",["Five","Six","Seven","Eight"],2,"The SI system has seven base quantities."],
["The SI base unit of length is:",["Centimetre","Metre","Kilometre","Foot"],1,"Metre (m) is the SI base unit of length."],
["The SI base unit of mass is:",["Gram","Kilogram","Tonne","Pound"],1,"Kilogram (kg) is the SI base unit of mass."],
["The SI base unit of time is:",["Minute","Hour","Second","Day"],2,"Second (s) is the SI base unit of time."],
["The SI base unit of electric current is:",["Volt","Ampere","Coulomb","Ohm"],1,"Ampere (A) is the SI base unit of electric current."],
["The SI base unit of thermodynamic temperature is:",["Degree Celsius","Kelvin","Joule","Calorie"],1,"Kelvin (K) is the SI base unit."],
["The SI base unit of amount of substance is:",["Mole","Gram","Litre","Atom"],0,"Mole (mol) is the SI base unit of amount of substance."],
["The SI base unit of luminous intensity is:",["Lumen","Lux","Candela","Watt"],2,"Candela (cd) is the SI base unit of luminous intensity."],
["Which is a derived quantity?",["Length","Mass","Time","Speed"],3,"Speed is derived from length divided by time."],
["Which is a scalar quantity?",["Force","Displacement","Mass","Velocity"],2,"Mass has magnitude but no direction."],
["Which is a vector quantity?",["Distance","Speed","Temperature","Acceleration"],3,"Acceleration has magnitude and direction."],
["Which pair contains only vectors?",["Speed and distance","Force and velocity","Mass and time","Energy and power"],1,"Force and velocity are vectors."],
["The SI unit of force is:",["Joule","Newton","Pascal","Watt"],1,"Force is measured in newtons (N)."],
["One newton is equal to:",["kg m s⁻¹","kg m s⁻²","kg m² s⁻²","kg m⁻¹ s⁻²"],1,"From F = ma, N = kg m s⁻²."],
["The SI unit of energy is:",["Watt","Joule","Newton","Pascal"],1,"Energy is measured in joules (J)."],
["The SI unit of pressure is:",["Pascal","Joule","Watt","Coulomb"],0,"Pressure is measured in pascals (Pa)."],
["The SI unit of frequency is:",["Second","Hertz","Metre","Newton"],1,"Frequency is measured in hertz (Hz), equivalent to s⁻¹."],
["The SI unit of area is:",["m","m²","m³","m s⁻¹"],1,"Area is measured in square metres."],
["The SI unit of volume is:",["m","m²","m³","kg"],2,"Volume is measured in cubic metres."],
["The prefix kilo represents:",["10²","10³","10⁻²","10⁻³"],1,"Kilo (k) represents a factor of one thousand."],
["The prefix milli represents:",["10³","10⁻³","10⁻⁶","10⁻⁹"],1,"Milli (m) represents one-thousandth."],
["One kilometre equals:",["100 m","1000 m","10,000 m","10 m"],1,"1 km = 10³ m = 1000 m."],
["One metre equals:",["10 cm","100 cm","1000 cm","0.1 cm"],1,"1 m = 100 cm."],
["500 g is equal to:",["5 kg","0.5 kg","50 kg","0.05 kg"],1,"Divide grams by 1000: 500 g = 0.5 kg."],
["The dimensional formula of velocity is:",["[LT⁻¹]","[LT⁻²]","[MLT⁻²]","[ML²T⁻²]"],0,"Velocity = displacement/time, so its dimension is [LT⁻¹]."],
["The dimensional formula of acceleration is:",["[LT⁻¹]","[LT⁻²]","[MLT⁻²]","[ML⁻¹T⁻²]"],1,"Acceleration = velocity/time = [LT⁻²]."],
["The dimensional formula of force is:",["[MLT⁻²]","[ML²T⁻²]","[ML⁻¹T⁻²]","[LT⁻¹]"],0,"Force = mass × acceleration = [MLT⁻²]."],
["Which statement about SI symbols is correct?",["Symbols take plural s","A full stop is always added","Symbols are not pluralised","Symbols are written only in capitals"],2,"Unit symbols do not take a plural ending; case must follow the standard symbol."]
];
const $=id=>document.getElementById(id);
let questions=bank.map((x,i)=>({id:i+1,q:x[0],o:x[1],a:x[2],e:x[3]}));
let index=0,score=0,streak=0,selected=null,locked=false,wrong=[];
function stage(i){return i<10?'FUNDAMENTALS':i<20?'SI UNITS':'DIMENSIONS & CONVERSIONS'}
function render(){
 const item=questions[index];if(!item||item.o.length!==4)throw new Error('Question data error at '+index);
 selected=null;locked=false;
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent=stage(item.id-1)+' · QUESTION '+item.id;
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').hidden=false;$('check').disabled=true;
 $('continue').className='btn continue';$('continue').hidden=true;
 const list=$('options');list.replaceChildren();
 item.o.forEach((answer,j)=>{
  const b=document.createElement('button');b.type='button';b.className='option';
  const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
  const label=document.createElement('span');label.textContent=answer;b.append(letter,label);
  b.addEventListener('click',()=>{if(locked)return;selected=j;list.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
  list.append(b);
 });
 if(!$('question').textContent||list.children.length!==4)throw new Error('Question failed to render');
}
function updateScore(){ $('xp').textContent=score*10;$('streak').textContent=streak; }
$('check').addEventListener('click',()=>{
 if(selected===null||locked)return;locked=true;const item=questions[index],buttons=[...$('options').children];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(selected===item.a){score++;streak++;f.className='feedback show good';f.textContent='Correct! '+item.e;}
 else{streak=0;wrong.push({q:item.q,your:item.o[selected],answer:item.o[item.a],e:item.e});buttons[selected].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 updateScore();$('check').hidden=true;$('continue').hidden=false;$('continue').className='btn continue show';
});
function finish(){
 $('quiz').hidden=true;$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100),card=document.createElement('section');card.className='finish';
 const trophy=document.createElement('div');trophy.textContent='🏆';trophy.style.fontSize='54px';
 const h=document.createElement('h2');h.textContent='Physical Quantities Complete!';
 const sc=document.createElement('div');sc.className='score';sc.textContent=score+' / '+questions.length;
 const summary=document.createElement('p');summary.className='muted';summary.textContent=pct+'% correct · '+score*10+' XP earned';
 const review=document.createElement('div');review.style.textAlign='left';review.style.marginTop='18px';
 if(wrong.length){const rh=document.createElement('h3');rh.textContent='🧠 Review your mistakes';review.append(rh);wrong.forEach((w,i)=>{const a=document.createElement('article');a.className='review';[[ (i+1)+'. '+w.q,''],['Your answer: '+w.your,'your'],['Correct answer: '+w.answer,'right'],[w.e,'muted']].forEach(([t,cl])=>{const p=document.createElement('p');p.textContent=t;p.className=cl;a.append(p)});review.append(a)});}
 else{const p=document.createElement('p');p.textContent='Perfect score! No wrong answers to review.';review.append(p)}
 const retryWrong=document.createElement('button');retryWrong.className='btn';retryWrong.textContent='↻ Retry wrong answers ('+wrong.length+')';retryWrong.hidden=!wrong.length;
 const retryAll=document.createElement('button');retryAll.className='btn';retryAll.textContent='Practice all 30 questions again';
 card.append(trophy,h,sc,summary,review,retryWrong,retryAll);$('finishSlot').replaceChildren(card);
 function reset(onlyWrong){questions=onlyWrong?bank.map((x,i)=>({x,i})).filter(({x})=>wrong.some(w=>w.q===x[0])).map(({x,i})=>({id:i+1,q:x[0],o:x[1],a:x[2],e:x[3]})):bank.map((x,i)=>({id:i+1,q:x[0],o:x[1],a:x[2],e:x[3]}));index=0;score=0;streak=0;wrong=[];updateScore();$('quiz').hidden=false;$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});}
 retryWrong.addEventListener('click',()=>reset(true));retryAll.addEventListener('click',()=>reset(false));
}
$('continue').addEventListener('click',()=>{if(!locked)return;index++;if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});}else finish();});
try{if(bank.length!==30)throw new Error('Expected 30 questions');render();}catch(err){$('question').textContent='This quiz could not load. Please refresh the page.';$('options').replaceChildren();console.error(err);}
})();
</script>
<script>
(function(){const key='skillup-physics-physical-quantities-pages-v1';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')||{};}catch(e){}const el=document.getElementById('pageProgress');if(el)el.textContent='Progress: '+(['learn','sim','practice'].filter(k=>state[k]).length)+'/3 pages completed';const slot=document.getElementById('finishSlot');if(slot)new MutationObserver(()=>{if(slot.children.length){try{state.practice=true;localStorage.setItem(key,JSON.stringify(state));el.textContent='Progress: 3/3 pages completed';}catch(e){}}}).observe(slot,{childList:true});})();
</script>
