<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Physical Quantities</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f6f8fb;color:#13233b}.wrap{max-width:760px;margin:auto;padding:28px 18px 40px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #00000012}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{margin:0;font-size:28px}.xp{font-weight:800}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:99px;overflow:hidden;margin:12px 0 24px}.fill{height:100%;width:0;background:#58cc02;transition:.3s}.q{font-size:21px;font-weight:800;line-height:1.45;margin:0 0 18px}.opts{display:grid;gap:10px}.opt{display:block;width:100%;text-align:left;padding:15px 16px;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer;transition:.16s}.opt:hover{background:#f1f6ff}.opt.selected{border-color:#5146a5;background:#f4f1ff}.opt.correct{border-color:#39a852!important;background:#e9f8ed!important}.opt.wrong{border-color:#e05252!important;background:#fff0f0!important}.opt:disabled{cursor:default}.actions{display:flex;gap:10px;margin-top:18px}.btn{padding:13px 20px;border:0;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer}.check{background:#58cc02;color:#fff}.next{background:#2563eb;color:#fff}.check:disabled,.next:disabled{opacity:.45;cursor:not-allowed}.feedback{min-height:28px;margin-top:15px;font-weight:700;line-height:1.5}.explain{font-weight:500;color:#40536a}.result{display:none;text-align:center;padding:12px 0}.retry{background:#2563eb;color:#fff}.back{display:block;width:100%;text-align:center;text-decoration:none;background:#172033;color:#fff;border-radius:14px;padding:14px;margin-top:16px;font-size:16px;font-weight:800}@media(max-width:600px){.wrap{padding:20px 12px}.card{padding:20px}.top h1{font-size:24px}.q{font-size:19px}.opt{font-size:15px}.actions{flex-direction:column}.btn{width:100%}}</style></head><body><main class="wrap"><section class="card"><div class="top"><h1>📏 Physical Quantities</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></div><div class="meta"><span id="count">Question 1/15</span><span id="mastery">Skill Mastery 0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div><div id="quiz"></div><div class="feedback" id="feedback"></div><div class="actions"><button id="check" class="btn check" disabled>Check Answer</button><button id="next" class="btn next" disabled>Next Question →</button></div><div id="result" class="result"><h2>🎉 Skill Complete!</h2><p id="resultText"></p><button id="retry" class="btn retry">Retry Quiz ↻</button></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></section></main><script>const qs=[['A physical quantity is a quantity that can be',['described only by words','measured and expressed with a numerical value and unit','seen directly by the eye','always dimensionless'],1,'A physical quantity is measurable and is represented by a numerical value together with a unit.'],['Which of the following is a physical quantity?',['Beauty','Honesty','Length','Kindness'],2,'Length can be measured and expressed using a unit such as metre.'],['Which pair contains only physical quantities?',['Mass and time','Love and temperature','Beauty and length','Honesty and speed'],0,'Mass and time are both measurable physical quantities.'],['A measurement of a physical quantity normally consists of:',['A number only','A unit only','A numerical value and a unit','A symbol only'],2,'A complete measurement communicates both magnitude and unit.'],['If a length is expressed as 2 m, the numerical value is:',['2','m','2 m','1/2'],0,'In 2 m, 2 is the numerical value and m is the unit.'],['When the unit of a physical quantity is changed, its numerical value generally:',['Changes','Always becomes zero','Never changes','Becomes dimensionless'],0,'For the same physical quantity, changing the unit changes its numerical representation.'],['Which of the following is a scalar physical quantity?',['Displacement','Velocity','Force','Mass'],3,'Mass has magnitude only and is therefore a scalar quantity.'],['Which of the following is a vector physical quantity?',['Time','Temperature','Displacement','Mass'],2,'Displacement has both magnitude and direction, so it is a vector quantity.'],['Which of the following is a derived physical quantity?',['Length','Mass','Time','Speed'],3,'Speed is obtained from length divided by time, so it is a derived quantity.'],['Which set contains only SI base quantities?',['Length, mass and time','Force, work and power','Speed, velocity and acceleration','Pressure, energy and momentum'],0,'Length, mass and time are SI base quantities.'],['The SI base unit of length is:',['centimetre','metre','kilometre','inch'],1,'The metre (m) is the SI base unit of length.'],['The SI base unit of mass is:',['gram','kilogram','tonne','milligram'],1,'The kilogram (kg) is the SI base unit of mass.'],['The SI base unit of time is:',['minute','hour','second','day'],2,'The second (s) is the SI base unit of time.'],['Which of the following is dimensionless?',['Length','Mass','Plane angle','Speed'],2,'Plane angle is dimensionless because it is defined as arc length divided by radius, so the units cancel.'],['1 m and 100 cm represent:',['Different physical lengths','The same physical length','Different dimensions','Different kinds of quantities'],1,'They represent the same physical length; only the numerical value changes with the chosen unit.']];let i=0,xp=0,correct=0,selected=-1,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;selected=-1;const a=qs[i];$('count').textContent=`Question ${i+1}/${qs.length}`;$('mastery').textContent=`Skill Mastery ${correct} / ${qs.length}`;$('xp').textContent=xp;$('quiz').innerHTML=`<div class="q">${a[0]}</div>`+a[1].map((o,j)=>`<button type="button" class="opt" data-n="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false});$('feedback').textContent='';$('check').disabled=true;$('next').disabled=true;$('next').textContent=i===qs.length-1?'Finish →':'Next Question →';$('fill').style.width=`${i/qs.length*100}%`}function grade(){if(selected<0)return;answered=true;const a=qs[i],ok=selected===a[2];document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===selected&&!ok)b.classList.add('wrong')});if(ok){correct++;xp+=10;$('feedback').innerHTML='✨ <b>Correct!</b> +10 XP<br><span class="explain">'+a[3]+'</span>'}else{$('feedback').innerHTML='❌ <b>Incorrect.</b> Correct answer: '+a[1][a[2]]+'<br><span class="explain">'+a[3]+'</span>'}$('xp').textContent=xp;$('mastery').textContent=`Skill Mastery ${correct} / ${qs.length}`;$('fill').style.width=`${(i+1)/qs.length*100}%`;$('check').disabled=true;$('next').disabled=false}function advance(){if(i<qs.length-1){i++;render();window.scrollTo({top:0,behavior:'smooth'})}else finish()}function finish(){$('fill').style.width='100%';$('count').textContent='Complete!';$('mastery').textContent=`Skill Mastery ${correct} / ${qs.length}`;$('quiz').innerHTML='';$('feedback').textContent='';$('check').style.display='none';$('next').style.display='none';$('result').style.display='block';$('resultText').textContent=`You answered ${correct} of ${qs.length} correctly and earned ${xp} XP.`}$('check').onclick=grade;$('next').onclick=advance;$('retry').onclick=()=>{i=0;xp=0;correct=0;$('check').style.display='';$('next').style.display='';$('result').style.display='none';render();window.scrollTo({top:0,behavior:'smooth'})};render();</script></body></html>
