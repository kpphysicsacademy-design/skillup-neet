<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Physical Quantities</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>📏 Physical Quantities</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['A physical quantity is a quantity that can be','described only by words','measured and expressed with a numerical value and unit','seen directly by the eye','always dimensionless',1,'A physical quantity is measurable and is represented by a numerical value and a unit.'],
['Which of the following is a physical quantity?','Beauty','Honesty','Length','Kindness',2,'Length can be measured and expressed using a unit such as metre.'],
['Which pair contains only physical quantities?','Mass and time','Love and temperature','Beauty and length','Honesty and speed',0,'Mass and time are both measurable physical quantities.'],
['A measurement of a physical quantity normally consists of','a number only','a unit only','a numerical value and a unit','a symbol only',2,'A complete measurement contains both a numerical value and an appropriate unit.'],
['If a length is expressed as 2 m, the numerical value is','2','m','2 m','1/2',0,'In 2 m, 2 is the numerical value and m is the unit.'],
['When the unit of a physical quantity is changed, its numerical value generally','changes','always becomes zero','never changes','becomes dimensionless',0,'For the same physical quantity, changing the unit changes the numerical value.'],
['Which of the following is a scalar physical quantity?','Displacement','Velocity','Force','Mass',3,'Mass has magnitude only and is therefore a scalar quantity.'],
['Which of the following is a vector physical quantity?','Time','Temperature','Displacement','Mass',2,'Displacement has both magnitude and direction, so it is a vector quantity.'],
['Which of the following is a derived physical quantity?','Length','Mass','Time','Speed',3,'Speed is obtained from length divided by time, so it is a derived quantity.'],
['Which set contains only SI base quantities?','Length, mass and time','Force, work and power','Speed, velocity and acceleration','Pressure, energy and momentum',0,'Length, mass and time are SI base quantities.'],
['The SI base unit of length is','centimetre','metre','kilometre','inch',1,'The metre (m) is the SI base unit of length.'],
['The SI base unit of mass is','gram','kilogram','tonne','milligram',1,'The kilogram (kg) is the SI base unit of mass.'],
['The SI base unit of time is','minute','hour','second','day',2,'The second (s) is the SI base unit of time.'],
['Which of the following is dimensionless?','Length','Mass','Plane angle','Speed',2,'Plane angle is dimensionless because it is defined as arc length divided by radius.'],
['1 m and 100 cm represent','different physical lengths','the same physical length','different dimensions','different kinds of quantities',1,'1 m and 100 cm represent the same length; only the numerical value changes with the unit.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
