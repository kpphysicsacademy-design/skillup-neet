</style></head><body><main class="wrap"><div class="top"><h1>📏 Physical Quantities</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></div><p>Master measurable quantities, classification, units and representations with 15 NEET-style questions.</p><div class="mastery">🎯 Skill Mastery <span id="mastery">0 / 15</span><div class="bar"><div id="fill" class="fill"></div></div></div><section class="card"><div id="count"></div><p id="question" class="q"></p><div id="options" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Continue →</button><div id="result" class="result"></div></section><a class="back" href="physics-home.html">← Back to Physics Path</a></main><script>
const qs=[
['A physical quantity is a quantity that can be:',['Only described in words','Measured and expressed with a numerical value and unit','Seen directly by the eye','Always dimensionless'],1,'A physical quantity is measurable and is represented by a numerical value together with an appropriate unit.'],
['Which of the following is a physical quantity?',['Beauty','Honesty','Length','Kindness'],2,'Length can be measured and expressed with a unit such as metre, so it is a physical quantity.'],
['Which pair contains only physical quantities?',['Mass and time','Love and temperature','Beauty and length','Honesty and speed'],0,'Mass and time are both measurable physical quantities.'],
['A complete measurement of a physical quantity normally consists of:',['A number only','A unit only','A numerical value and a unit','A symbol only'],2,'For example, 5 m contains both the numerical value 5 and the unit metre.'],
['Which statement about a numerical value is correct?',['It has meaning independent of the unit','It depends on the unit chosen','It can never change','It is always dimensionless'],1,'The numerical value changes when the unit changes, while the physical quantity itself remains the same.'],
['If a length is written as 2 m, the numerical value is:',['2','m','2 m','1/2'],0,'In 2 m, 2 is the numerical value and m is the unit.'],
['Which is an example of a scalar physical quantity?',['Displacement','Velocity','Force','Mass'],3,'Mass has magnitude only, so it is a scalar quantity.'],
['Which is a vector physical quantity?',['Time','Temperature','Displacement','Mass'],2,'Displacement has magnitude and direction, so it is a vector quantity.'],
['Which of the following is a derived physical quantity?',['Length','Mass','Time','Speed'],3,'Speed is obtained from distance divided by time, so it is a derived quantity.'],
['Which set contains the SI base quantities?',['Length, mass, time','Force, work, power','Speed, velocity, acceleration','Pressure, energy, momentum'],0,'Length, mass and time are SI base quantities; force, work and speed are derived quantities.'],
['The SI unit of length is:',['centimetre','metre','kilometre','inch'],1,'The metre (m) is the SI base unit of length.'],
['The SI unit of mass is:',['gram','kilogram','tonne','milligram'],1,'The kilogram (kg) is the SI base unit of mass.'],
['The SI unit of time is:',['minute','hour','second','day'],2,'The second (s) is the SI base unit of time.'],
['Which quantity is dimensionless?',['Length','Mass','Plane angle','Speed'],2,'Plane angle is treated as dimensionless because it is a ratio of arc length to radius.'],
['Two measurements represent the same length: 1 m and 100 cm. What changes when the unit changes?',['The physical length changes','The numerical value changes','The dimension changes','The quantity becomes non-physical'],1,'1 m and 100 cm describe the same physical quantity; only the numerical value changes because the unit changes.']
];
let i=0,xp=0,answered=false,correct=0;const $=id=>document.getElementById(id);
function render(){answered=false;$('count').textContent=`Question ${i+1} of ${qs.length}`;$('question').textContent=qs[i][0];$('options').innerHTML='';$('feedback').textContent='';$('next').disabled=true;qs[i][1].forEach((o,j)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>answer(j);$('options').appendChild(b)});$('fill').style.width=`${correct/qs.length*100}%`;$('mastery').textContent=`${correct} / ${qs.length}`}
function answer(j){if(answered)return;answered=true;const ok=j===qs[i][2];if(ok){xp+=10;correct++;$('xp').textContent=xp;$('feedback').textContent='✅ Correct! +10 XP — '+qs[i][3]}else{$('feedback').textContent=`❌ Not quite. Correct answer: ${qs[i][1][qs[i][2]]} — ${qs[i][3]}`}$('options').querySelectorAll('button').forEach((b,k)=>{b.disabled=true;if(k===qs[i][2])b.classList.add('correct');if(k===j&&k!==qs[i][2])b.classList.add('wrong')});$('fill').style.width=`${correct/qs.length*100}%`;$('mastery').textContent=`${correct} / ${qs.length}`;$('next').disabled=false}
$('next').onclick=()=>{if(!answered)return;if(i<qs.length-1){i++;render()}else{$('fill').style.width='100%';$('question').textContent='🎉 Physical Quantities mastered!';$('options').innerHTML='';$('feedback').textContent=`You scored ${correct} / ${qs.length} correct and earned ${xp} XP.`;$('next').style.display='none';$('result').style.display='block';$('result').textContent='Excellent work — keep building your Physics path!'}};render();
</script></body></html>
