<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Plasticity</title><style>body{margin:0;background:#f5f7f8;font-family:Arial,sans-serif;color:#17202a}.wrap{max-width:760px;margin:auto;padding:24px 16px 40px}.head{display:flex;justify-content:space-between;align-items:center}.head h1{font-size:28px;margin:0}.xp{font-weight:700}.sub{color:#65727e;margin:8px 0 18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 14px #0000000d}.bar{height:10px;background:#e8ecef;border-radius:10px;overflow:hidden}.fill{height:100%;width:0;background:#58b86b;transition:.3s}.qno{font-size:14px;color:#697680}.q{font-size:20px;font-weight:700;line-height:1.45}.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #dfe5e8;border-radius:12px;padding:13px 15px;margin:10px 0;font-size:16px;cursor:pointer;transition:.15s}.opt:hover{transform:translateY(-1px);border-color:#58b86b}.opt.selected{border-color:#58b86b;background:#f0fbf2}.opt.correct{border-color:#58b86b;background:#e9f8eb}.opt.wrong{border-color:#e26b6b;background:#fff0f0}.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:700;font-size:16px;cursor:pointer;background:#58b86b;color:#fff}.back{display:block;width:100%;text-align:center;margin-top:18px;background:#fff;color:#35434d;border:2px solid #dfe5e8}.back:hover{border-color:#58b86b;transform:translateY(-1px)}#feedback{min-height:24px;font-weight:700}.done{text-align:center}.score{font-size:28px;font-weight:800}</style></head><body><main class="wrap"><div class="head"><h1>🧩 Plasticity</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></div><p class="sub">Permanent deformation, elastic limit, yield point, plastic behaviour and stress–strain response.</p><section class="card"><b>🎯 Skill Mastery <span id="mastery">0 / 15</span></b><div class="bar"><div id="fill" class="fill"></div></div></section><section id="quiz" class="card"><div class="qno" id="qno"></div><p class="q" id="question"></p><div id="opts"></div><button id="continue" class="btn">Continue →</button><p id="feedback"></p></section><section id="done" class="card done" hidden><div class="score" id="score"></div><p>Great work! Your Plasticity skill has been practiced.</p><button class="btn" onclick="location.reload()">Retry 🔄</button></section><button id="back" class="btn back">← Back to Physics Path</button></main><script>const quiz=[['Plasticity is the property by which a material',['returns completely to original shape','retains permanent deformation after force removal','has zero stress','cannot be deformed'],1,'A plastic material retains permanent deformation after the deforming force is removed.'],['The deformation that remains after removal of force is called',['elastic deformation','plastic deformation','thermal expansion','compression only'],1,'Plastic deformation is permanent.'],['The elastic limit is the maximum stress up to which a body',['has no mass','regains its original shape on unloading','must break','has zero strain'],1,'Below the elastic limit, the material returns to its original shape when unloaded.'],['Beyond the elastic limit, further deformation is mainly',['permanent','impossible','zero','independent of stress'],0,'Beyond the elastic limit, permanent plastic deformation develops.'],['On a typical stress-strain curve for a ductile metal, yielding indicates',['permanent deformation begins significantly','density becomes zero','stress becomes zero','temperature must fall'],0,'Yielding marks the onset of substantial plastic deformation.'],['A ductile material can undergo considerable plastic deformation before',['fracture','melting','becoming massless','losing all stress'],0,'Ductile materials deform considerably before fracture.'],['Which material behaviour is associated with permanent set?',['plasticity','perfect elasticity','zero strain','incompressibility'],0,'Permanent set is a residual deformation characteristic of plastic behaviour.'],['If a wire is loaded beyond its elastic limit and then unloaded, it will generally',['return exactly to original length','retain some extension','become dimensionless','have infinite Young modulus'],1,'Unloading after plastic deformation leaves a permanent extension.'],['A material with a very small plastic region after yielding is comparatively',['brittle','ductile','perfectly elastic','fluid'],0,'Brittle materials show little plastic deformation before fracture.'],['The point at which permanent deformation starts on a practical stress-strain curve is associated with the',['yield point','origin','zero-load point','absolute zero'],0,'The yield point marks the transition into significant plastic deformation.'],['Which statement is correct about plastic deformation?',['It is completely reversible','It is irreversible after unloading','It requires zero stress','It occurs only in gases'],1,'Plastic deformation is not fully recovered when the load is removed.'],['Cold working a metal generally increases its',['strength and hardness','mass only','volume to infinity','elastic strain at zero stress'],0,'Cold working can increase strength and hardness through strain hardening.'],['Plastic deformation is most closely related to',['permanent change in shape','change in SI unit','absence of force','zero displacement'],0,'Plasticity concerns permanent changes in shape or dimensions.'],['Which material is commonly described as highly ductile?',['Copper','Glass','Ceramic','Chalk'],0,'Copper can undergo substantial plastic deformation and is ductile.'],['After unloading from a plastic region, the stress becomes zero but the strain is generally',['zero','non-zero','infinite','negative always'],1,'Residual strain remains after unloading from plastic deformation.']];let i=0,selected=null,score=0,checked=false;const $=id=>document.getElementById(id);function render(){selected=null;checked=false;$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=quiz[i][0];$('feedback').textContent='';$('continue').textContent='Continue →';$('opts').innerHTML='';const order=quiz[i][1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((x,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{if(checked)return;selected=x.index;document.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));b.classList.add('selected')};$('opts').appendChild(b)})}function check(){if(selected===null){$('feedback').textContent='Choose an answer first.';return}checked=true;const a=quiz[i],ok=selected===a[2];if(ok){score++;$('xp').textContent=score*10}document.querySelectorAll('.opt').forEach(b=>{const n=Number(b.dataset.index);b.disabled=true;if(n===a[2])b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=(ok?'🎉 Correct! +10 XP — ':'💡 Not quite — ')+a[3];$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=((i+1)/15*100)+'%';$('continue').textContent=i===14?'Finish Skill →':'Continue →'}$('continue').onclick=()=>{if(!checked){check();return}if(i===14){$('quiz').hidden=true;$('done').hidden=false;$('score').textContent=`${score} / 15 • ${score*10} XP`}else{i++;render()}};$('back').onclick=()=>{const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html'};render();</script></body></html>
