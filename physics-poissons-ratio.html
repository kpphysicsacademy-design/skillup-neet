.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}

.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>↔️ Poisson’s Ratio</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"Poisson’s ratio compares longitudinal strain with:",o:["Lateral strain","Pressure","Shear stress","Mass"],a:0,e:"It relates lateral (transverse) strain to longitudinal strain."},
{q:"The usual symbol for Poisson’s ratio is:",o:["ν (nu)","Y","K","G"],a:0,e:"Poisson’s ratio is commonly represented by the Greek letter ν."},
{q:"Poisson’s ratio has:",o:["Unit Pa","Unit m","No unit","Unit N"],a:2,e:"It is a ratio of two strains, which are dimensionless."},
{q:"When a typical wire is stretched, its length increases and its diameter usually:",o:["Increases","Decreases","Becomes infinite","Never changes"],a:1,e:"Tensile extension usually causes lateral contraction."},
{q:"During ordinary tensile stretching, longitudinal strain is usually:",o:["Positive","Negative","Always zero","Measured in pascals"],a:0,e:"Extension is a positive change in length under the usual sign convention."},
{q:"During ordinary tensile stretching, lateral strain is usually:",o:["Positive","Negative","Always one","Equal to stress"],a:1,e:"The wire becomes thinner, so its lateral strain is negative."},
{q:"Using signed strains, Poisson’s ratio is commonly written as:",o:["− lateral strain / longitudinal strain","Longitudinal strain × lateral strain","Stress / area","Longitudinal strain / stress"],a:0,e:"The minus sign makes ν positive for the usual lateral contraction under tension."},
{q:"Longitudinal strain is 0.01 and lateral strain magnitude is 0.003. Poisson’s ratio is:",o:["3","0.3","0.003","0.013"],a:1,e:"ν = 0.003/0.01 = 0.3."},
{q:"If ν = 0.25 and longitudinal strain = 0.008, lateral strain magnitude is:",o:["0.002","0.032","0.25","0.00825"],a:0,e:"Lateral strain magnitude = ν × longitudinal strain = 0.25 × 0.008 = 0.002."},
{q:"Poisson’s ratio describes deformation in the longitudinal direction and the:",o:["Transverse direction","Direction of gravity only","Direction of current","Direction of heat flow"],a:0,e:"It connects lengthwise strain with the perpendicular, lateral strain."},
{q:"For an ideal incompressible isotropic elastic material, Poisson’s ratio approaches:",o:["0","0.25","0.5","1"],a:2,e:"The incompressible limit for an isotropic elastic material is ν = 0.5."},
{q:"If ν = 0.4, the lateral strain magnitude is what fraction of longitudinal strain?",o:["4 times","40%","60%","0.4%"],a:1,e:"A Poisson’s ratio of 0.4 means lateral strain magnitude is 0.4 times longitudinal strain."},
{q:"If longitudinal strain doubles while ν stays constant, lateral strain magnitude:",o:["Doubles","Halves","Stays constant","Becomes zero"],a:0,e:"Lateral strain magnitude equals ν times longitudinal strain."},
{q:"Poisson’s ratio is primarily a property of the:",o:["Material and its condition","Wire length alone","Applied force alone","Colour of the sample"],a:0,e:"It characterises the material’s elastic response, within a given condition and range."},
{q:"For most common stable isotropic elastic materials, Poisson’s ratio is generally between:",o:["0 and 0.5","1 and 2","−5 and −2","2 and 10"],a:0,e:"For common materials under standard assumptions, ν typically lies between 0 and 0.5."},
{q:"A rod’s length changes from 2.000 m to 2.004 m. Its longitudinal strain is:",o:["0.002","0.004","0.02","2"],a:0,e:"Strain = ΔL/L = 0.004/2 = 0.002."},
{q:"A rod has longitudinal strain 0.002 and ν = 0.3. Its lateral strain magnitude is:",o:["0.0006","0.006","0.15","0.0023"],a:0,e:"Lateral strain magnitude = 0.3 × 0.002 = 0.0006."},
{q:"A wire’s diameter is 4 mm and decreases by 0.004 mm. The magnitude of lateral strain is:",o:["0.001","0.01","0.1","1"],a:0,e:"Lateral strain magnitude = diameter change/original diameter = 0.004/4 = 0.001."},
{q:"If lateral strain magnitude is 0.001 and ν = 0.2, longitudinal strain magnitude is:",o:["0.0002","0.005","0.2","0.0012"],a:1,e:"Longitudinal strain = lateral strain magnitude/ν = 0.001/0.2 = 0.005."},
{q:"A material has ν = 0.3 and longitudinal strain 5 × 10⁻³. Lateral strain magnitude is:",o:["1.5 × 10⁻³","1.5 × 10⁻²","5 × 10⁻³","0.3"],a:0,e:"0.3 × 5 × 10⁻³ = 1.5 × 10⁻³."},
{q:"Poisson’s ratio is not directly a measure of:",o:["The relation between lateral and longitudinal strain","Elastic deformation response","Stress magnitude by itself","Lateral contraction under tension"],a:2,e:"It is a ratio of strains, not stress magnitude by itself."},
{q:"If ν = 0.5, longitudinal strain magnitude is 0.02. Lateral strain magnitude is:",o:["0.01","0.04","0.5","0.25"],a:0,e:"Lateral strain magnitude = 0.5 × 0.02 = 0.01."},
{q:"For signed strains under tension, if longitudinal strain is +0.01 and lateral strain is −0.002, ν is:",o:["−0.2","0.2","5","0.012"],a:1,e:"ν = −(−0.002)/(0.01) = 0.2."},
{q:"The term ‘lateral strain’ refers to strain measured:",o:["Perpendicular to the applied lengthwise deformation","Only along the stretched length","Only in the direction of gravity","Only in volume"],a:0,e:"Lateral strain describes the relative change in a transverse dimension."},
{q:"For a small tensile deformation, Poisson’s ratio is calculated using changes in:",o:["Length and transverse dimension","Mass and temperature","Force and time","Pressure and volume only"],a:0,e:"Use longitudinal and lateral dimensional changes divided by their original dimensions."},
{q:"If ν remains constant and longitudinal strain halves, lateral strain magnitude:",o:["Halves","Doubles","Stays unchanged","Becomes infinite"],a:0,e:"Lateral strain magnitude is proportional to longitudinal strain for fixed ν."},
{q:"A material has ν = 0.25. Its lateral strain magnitude is 0.0005. Longitudinal strain magnitude is:",o:["0.000125","0.002","0.25","0.0005"],a:1,e:"Longitudinal strain = 0.0005/0.25 = 0.002."},
{q:"Which is the correct dimensionless ratio for Poisson’s ratio?",o:["Lateral strain magnitude ÷ longitudinal strain magnitude","Stress ÷ area","Force ÷ volume","Length ÷ time"],a:0,e:"The magnitude ratio of lateral strain to longitudinal strain gives ν."},
{q:"A rod is stretched and becomes slightly thinner. This is an example of:",o:["Lateral contraction","Bulk expansion only","Shear flow","Thermal radiation"],a:0,e:"Tension commonly lengthens a rod while reducing its transverse dimensions."},
{q:"Which statement is correct?",o:["Poisson’s ratio has unit Pa","Poisson’s ratio links transverse and longitudinal strains","Poisson’s ratio equals Young’s modulus","Poisson’s ratio is measured in metres"],a:1,e:"Poisson’s ratio is a dimensionless relation between transverse and longitudinal strain."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Poisson’s Ratio Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
