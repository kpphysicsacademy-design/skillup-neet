<script>
(function(){
'use strict';
const questions = [{"q":"An electric dipole consists of…","o":["Two equal like charges separated by a distance","Two equal and opposite charges separated by a distance","Two unequal positive charges","A single point charge"],"a":1,"e":"An electric dipole has charges +q and −q separated by a small distance."},{"q":"The electric dipole moment magnitude is…","o":["q/d","qd","q/d²","2q/d"],"a":1,"e":"For charge magnitude q and separation d, p=qd."},{"q":"The SI unit of electric dipole moment is…","o":["C m","C/m","N/C","J/C"],"a":0,"e":"Dipole moment is charge multiplied by separation, so its unit is coulomb-metre."},{"q":"The direction of dipole moment is conventionally…","o":["From positive to negative charge","From negative to positive charge","Perpendicular to the dipole axis","Always upward"],"a":1,"e":"The dipole moment vector points from −q toward +q."},{"q":"The potential due to an ideal dipole at a far-field point is…","o":["\\(V=\\frac{kp\\cos\\theta}{r^2}\\)","\\(V=\\frac{kp}{r}\\)","\\(V=\\frac{kp}{r^3}\\)","\\(V=kpr^2\\)"],"a":0,"e":"For r much larger than dipole separation, V=kp cosθ/r²."},{"q":"On the axial line of a dipole far away, θ is…","o":["0°","90°","180°","45°"],"a":0,"e":"On the positive axial direction, θ=0°."},{"q":"The far-field potential on the positive axial line is…","o":["Zero","\\(kp/r^2\\)","\\(-kp/r^2\\)","\\(kp/r\\)"],"a":1,"e":"At θ=0°, cosθ=1, so V=kp/r²."},{"q":"On the equatorial plane of an ideal dipole, the potential is…","o":["Maximum positive","Maximum negative","Zero","Infinite"],"a":2,"e":"At θ=90°, cosθ=0; equal and opposite charge potentials cancel."},{"q":"At a point on the negative axial side, the dipole potential is…","o":["Positive","Negative","Zero always","Independent of direction"],"a":1,"e":"For θ=180°, cosθ=−1, giving negative potential."},{"q":"At fixed angle, if distance r doubles, dipole potential magnitude becomes…","o":["Half","One-fourth","One-eighth","Four times"],"a":1,"e":"Dipole potential varies as 1/r² in the far field."},{"q":"If dipole moment doubles at the same point, potential magnitude…","o":["Halves","Doubles","Quadruples","Does not change"],"a":1,"e":"Potential is directly proportional to p."},{"q":"The angle dependence of dipole potential is governed by…","o":["\\(\\sin\\theta\\)","\\(\\cos\\theta\\)","\\(\\tan\\theta\\)","\\(\\cos^2\\theta\\)"],"a":1,"e":"The expression contains cosθ."},{"q":"The potential due to a dipole is a…","o":["Vector","Scalar","Tensor","Dimensionless quantity"],"a":1,"e":"Electric potential is scalar; dipole orientation affects its sign and value."},{"q":"For a dipole, the potential at a point depends on…","o":["Only distance","Distance and angle relative to dipole moment","Only test charge","Only the medium’s mass"],"a":1,"e":"The far-field formula depends on r and θ, as well as dipole moment p."},{"q":"If θ=60°, the dipole potential is what fraction of its axial value at the same r?","o":["1","1/2","0","√3/2"],"a":1,"e":"Since cos60°=1/2, the potential is half the axial value."},{"q":"At θ=90°, the electric field of a dipole is generally…","o":["Zero everywhere","Nonzero even though potential is zero at that point","Always parallel to the dipole moment","Infinite"],"a":1,"e":"Zero potential at a point does not imply zero electric field; the equatorial field is nonzero."},{"q":"A dipole has p=\\(2\\times10^{-8}\\) C m. At r=2 m on its positive axis, V is… (\\(k=9\\times10^9\\))","o":["22.5 V","45 V","90 V","180 V"],"a":1,"e":"V=kp/r²=(9×10⁹)(2×10⁻⁸)/4=45 V."},{"q":"If the dipole separation doubles while charge magnitude stays fixed, p…","o":["Halves","Doubles","Quadruples","Stays fixed"],"a":1,"e":"p=qd, so doubling d doubles p."},{"q":"If both charge magnitude and separation double, dipole moment…","o":["Doubles","Quadruples","Halves","Stays fixed"],"a":1,"e":"p=qd; doubling both factors makes p four times larger."},{"q":"Far from a dipole, potential decreases with distance as…","o":["\\(1/r\\)","\\(1/r^2\\)","\\(1/r^3\\)","\\(r^2\\)"],"a":1,"e":"The dipole potential has inverse-square distance dependence."},{"q":"The electric field of a dipole far from it decreases approximately as…","o":["\\(1/r\\)","\\(1/r^2\\)","\\(1/r^3\\)","\\(r\\)"],"a":2,"e":"Dipole electric field scales as 1/r³ in the far field."},{"q":"The potential at a point on the equatorial plane is zero because…","o":["The field is zero there","The point is equidistant from +q and −q, so potentials cancel","Both charges are zero","Potential is a vector"],"a":1,"e":"Scalar contributions +kq/r and −kq/r cancel."},{"q":"If a point lies closer to +q than −q, its total potential due to the two charges is…","o":["Always zero","Generally positive","Always negative","Undefined"],"a":1,"e":"The nearer positive charge contributes a larger positive potential, assuming the point is on the relevant side."},{"q":"The potential energy of a test charge q₀ at potential V is…","o":["\\(q_0/V\\)","\\(q_0V\\)","\\(V/q_0\\)","\\(q_0V^2\\)"],"a":1,"e":"Potential energy is U=q₀V."},{"q":"A dipole in a uniform electric field experiences torque magnitude…","o":["\\(pE\\cos\\theta\\)","\\(pE\\sin\\theta\\)","\\(p/E\\)","\\(E/p\\)"],"a":1,"e":"Torque magnitude is τ=pE sinθ, where θ is between p and E."},{"q":"The torque on a dipole is zero when it is…","o":["At 90° to the field","Parallel or antiparallel to the field","Only at 45°","At every angle"],"a":1,"e":"τ=pE sinθ, which is zero at 0° and 180°."},{"q":"Potential due to multiple dipoles at a point is obtained by…","o":["Vector-adding potentials","Algebraically adding scalar potentials","Multiplying potentials","Adding only positive values"],"a":1,"e":"Electric potential follows scalar superposition."},{"q":"For an ideal dipole, the far-field potential is zero when…","o":["\\(\\theta=0^\\circ\\)","\\(\\theta=45^\\circ\\)","\\(\\theta=90^\\circ\\)","\\(\\theta=180^\\circ\\)"],"a":2,"e":"V is proportional to cosθ, which is zero at 90°."},{"q":"If the observation point moves from the axial line toward the equatorial plane at fixed r, potential on the positive side…","o":["Increases","Decreases toward zero","Stays constant","Becomes infinite"],"a":1,"e":"As θ increases from 0° to 90°, cosθ decreases to zero."},{"q":"Which statement is correct for dipole potential far away?","o":["It depends on orientation","It is always positive","It varies as 1/r","It is a vector"],"a":0,"e":"The cosθ factor means potential depends on the angle relative to the dipole axis."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function typesetMath(){if(window.MathJax?.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options'),$('feedback')].filter(Boolean)).catch(()=>{});}}
window.addEventListener('load',typesetMath);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
 typesetMath();
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Potential Due to a Dipole Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
   if(window.MathJax?.typesetPromise) window.MathJax.typesetPromise([review]).catch(()=>{});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
