<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Potential Due to a Point Charge</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>⚡ Potential Due to a Point Charge</h1>
<div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="quiz"></div><div class="xp" id="xp"></div>
<button class="next hide" id="next">Next Question →</button>
<div id="result" class="hide"></div>
<a class="back" href="physics-home-fast.html">← Back to Physics Path</a>
</div></div>
<script>
const qs=[
['The electric potential at distance r from a point charge q in vacuum is','kq/r','kq/r²','kqr','kq²/r',0,'For a point charge, V=kq/r where k=1/(4πε₀).'],
['The SI unit of electric potential is','newton','volt','coulomb','ampere',1,'Electric potential is measured in volts (V), equivalent to joule per coulomb.'],
['The electric potential due to a positive point charge is','negative','positive','zero everywhere','always infinite',1,'Taking potential at infinity as zero, V=kq/r is positive when q is positive.'],
['The electric potential due to a negative point charge is','positive','negative','zero','always infinite',1,'For q<0, V=kq/r is negative relative to zero at infinity.'],
['If the distance from a point charge is doubled, its potential becomes','four times','double','half','one-fourth',2,'Since V∝1/r, doubling r reduces the potential to one-half.'],
['If the source charge is doubled while r remains constant, the potential','becomes half','doubles','becomes four times','remains unchanged',1,'Since V∝q, doubling the charge doubles the potential.'],
['Electric potential due to a point charge is a','vector quantity','scalar quantity','tensor quantity','dimensionless quantity',1,'Potential is scalar, so potentials from several charges are added algebraically.'],
['For a point charge, the electric potential varies with distance as','1/r','1/r²','r','r²',0,'The point-charge potential follows V=kq/r.'],
['The potential at infinity due to an isolated point charge, taking the usual reference, is','infinite','one volt','zero','negative one volt',2,'The conventional reference for isolated electrostatic charges is V=0 at infinity.'],
['Two equal positive point charges are placed symmetrically about a point. Their potential at the midpoint is','zero','negative','positive','undefined',2,'Potential is scalar and both positive contributions add, giving a positive value.'],
['Two equal and opposite charges are placed symmetrically about a point. The potential at the midpoint is','positive','negative','zero','infinite',2,'Equal and opposite scalar potentials cancel at the midpoint.'],
['A charge of 2 μC is at a distance of 3 m. Taking k=9×10⁹ N·m²/C², the potential is','3×10³ V','6×10³ V','9×10³ V','18×10³ V',1,'V=kq/r=(9×10⁹)(2×10⁻⁶)/3=6×10³ V.'],
['A point charge produces a potential of 900 V at 3 m. Taking k=9×10⁹ N·m²/C², its charge is','0.3 μC','3 μC','30 μC','0.03 μC',0,'q=Vr/k=(900×3)/(9×10⁹)=3×10⁻⁷ C=0.3 μC.'],
['Two point charges produce potentials V₁ and V₂ at a point. The total potential is','V₁V₂','V₁/V₂','V₁+V₂','|V₁−V₂| only',2,'Because potential is scalar, the algebraic sum gives V=V₁+V₂.'],
['The potential energy of a charge q placed at a point having electric potential V is','q/V','qV','V/q','q+V',1,'Electric potential energy is U=qV.']
];
let i=0,score=0,answered=false;
const $=x=>document.getElementById(x);
function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}
function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}
function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}
$('next').onclick=next;render();
</script>
</body>
</html>
