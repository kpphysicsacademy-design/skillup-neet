<script>
(function(){
'use strict';
const questions = [{"q":"The electric potential due to a point charge Q at distance r in vacuum is…","o":["\\(V=\\frac{kQ}{r}\\)","\\(V=\\frac{kQ}{r^2}\\)","\\(V=kQr\\)","\\(V=\\frac{kQ}{r^3}\\)"],"a":0,"e":"For a point charge, \\(V=\\frac{1}{4\\pi\\varepsilon_0}\\frac{Q}{r}=\\frac{kQ}{r}\\), taking zero potential at infinity."},{"q":"The SI unit of electric potential is…","o":["Coulomb","Volt","Newton per coulomb","Farad"],"a":1,"e":"Potential is measured in volts, where \\(1\\,\\text{V}=1\\,\\text{J/C}\\)."},{"q":"Electric potential due to a point charge is a…","o":["Vector","Scalar","Tensor","Dimensionless number"],"a":1,"e":"Electric potential has magnitude and sign but no direction, so it is scalar."},{"q":"For a positive point charge, potential at any finite distance (with zero at infinity) is…","o":["Negative","Positive","Always zero","Infinite"],"a":1,"e":"Because \\(V=kQ/r\\) and \\(Q>0\\), the potential is positive."},{"q":"For a negative point charge, potential at any finite distance is…","o":["Positive","Negative","Always zero","Independent of charge"],"a":1,"e":"In \\(V=kQ/r\\), a negative Q gives negative potential."},{"q":"If distance from a point charge is doubled, the potential magnitude becomes…","o":["Twice","Half","One-fourth","Four times"],"a":1,"e":"Since \\(|V|\\propto 1/r\\), doubling distance halves the potential magnitude."},{"q":"If distance from a point charge is tripled, its potential becomes…","o":["\\(3V\\)","\\(V/3\\)","\\(V/9\\)","\\(9V\\)"],"a":1,"e":"Potential varies inversely with distance: \\(V' = V/3\\)."},{"q":"A point charge produces 20 V at distance r. At distance 2r, the potential is…","o":["40 V","20 V","10 V","5 V"],"a":2,"e":"\\(V\\propto1/r\\), so the new potential is \\(20/2=10\\,\\text{V}\\)."},{"q":"A charge \\(+2\\,\\mu\\text{C}\\) is at a distance of 3 m. Its potential is approximately (\\(k=9\\times10^9\\))…","o":["600 V","6000 V","\\(6\\times10^3\\) V","\\(1.5\\times10^3\\) V"],"a":1,"e":"\\(V=kQ/r=(9\\times10^9)(2\\times10^{-6})/3=6\\times10^3\\,\\text{V}\\)."},{"q":"A charge \\(-4\\,\\mu\\text{C}\\) is 2 m away. Its potential is… (\\(k=9\\times10^9\\))","o":["+18 kV","−18 kV","+9 kV","−9 kV"],"a":1,"e":"\\(V=kQ/r=(9\\times10^9)(-4\\times10^{-6})/2=-18\\,\\text{kV}\\)."},{"q":"At infinity, the potential of an isolated point charge is conventionally…","o":["\\(kQ\\)","Zero","Infinite","Equal to its electric field"],"a":1,"e":"The reference potential for an isolated charge is usually chosen as \\(V(\\infty)=0\\)."},{"q":"The electric field magnitude due to a point charge varies with distance as…","o":["\\(1/r\\)","\\(1/r^2\\)","\\(r\\)","\\(1/r^3\\)"],"a":1,"e":"For a point charge, \\(E=k|Q|/r^2\\), whereas potential varies as \\(1/r\\)."},{"q":"Compared with electric field, the potential from a point charge decreases with distance…","o":["More rapidly","Less rapidly","At exactly the same rate","It never decreases"],"a":1,"e":"Potential scales as \\(1/r\\), while field magnitude scales as \\(1/r^2\\)."},{"q":"The potential at distance r from charge Q is 12 V. What is it at 4r?","o":["48 V","12 V","3 V","0.75 V"],"a":2,"e":"\\(V(4r)=V(r)/4=3\\,\\text{V}\\)."},{"q":"If the magnitude of a point charge is doubled while r stays constant, the potential…","o":["Halves","Doubles","Quadruples","Does not change"],"a":1,"e":"Since \\(V\\propto Q\\), doubling Q doubles V, including its sign."},{"q":"If the charge is unchanged and distance is reduced to half, potential magnitude…","o":["Halves","Doubles","Quadruples","Stays unchanged"],"a":1,"e":"\\(|V|=k|Q|/r\\); halving r doubles its magnitude."},{"q":"The potential due to a point charge is zero at a finite distance only if…","o":["The charge is nonzero","The reference is at infinity","The point charge Q is zero (under the usual reference)","The distance is doubled"],"a":2,"e":"For nonzero Q and finite r, \\(V=kQ/r\\neq0\\). If Q=0, the potential is zero."},{"q":"Two point charges contribute potentials at a location. The net potential is found by…","o":["Vector addition","Algebraic scalar addition","Multiplying the two values","Adding only positive values"],"a":1,"e":"Potential obeys scalar superposition: \\(V_{net}=\\sum_i kQ_i/r_i\\)."},{"q":"A +Q charge and a −Q charge are at equal distances from a point. Their combined potential there is…","o":["\\(2kQ/r\\)","\\(kQ/r\\)","Zero","Infinite"],"a":2,"e":"Equal and opposite contributions cancel: \\(kQ/r-kQ/r=0\\)."},{"q":"The potential due to a point charge depends on…","o":["Only the test charge","Source charge and distance","Direction of observation","Mass of the test particle"],"a":1,"e":"For a point charge, \\(V=kQ/r\\), so it depends on Q and r."},{"q":"Which expression gives Coulomb’s constant in vacuum?","o":["\\(k=4\\pi\\varepsilon_0\\)","\\(k=1/(4\\pi\\varepsilon_0)\\)","\\(k=\\varepsilon_0/4\\pi\\)","\\(k=1/\\varepsilon_0^2\\)"],"a":1,"e":"\\(k=\\frac{1}{4\\pi\\varepsilon_0}\\approx9\\times10^9\\,\\text{N m}^2/\\text{C}^2\\)."},{"q":"The dimensions of electric potential are…","o":["\\([MLT^{-2}Q^{-1}]\\)","\\([ML^2T^{-2}Q^{-1}]\\)","\\([M L^2 T^{-1}]\\)","\\([Q L^{-1}]\\)"],"a":1,"e":"Potential is energy per charge: \\([V]=[ML^2T^{-2}Q^{-1}]\\)."},{"q":"A point charge is moved farther from an observation point. For a positive source charge, its potential there…","o":["Increases","Decreases toward zero","Becomes more negative","Remains constant"],"a":1,"e":"For Q>0, \\(V=kQ/r\\), so increasing r lowers V toward zero."},{"q":"For a negative source charge, increasing distance makes its potential…","o":["More negative without limit","Less negative, approaching zero","More positive without limit","Always zero immediately"],"a":1,"e":"For Q<0, \\(V=-k|Q|/r\\); as r increases, it approaches zero from below."},{"q":"A charge creates potential −30 V at distance r. At distance 3r, the potential is…","o":["−90 V","−30 V","−10 V","+10 V"],"a":2,"e":"Potential retains its sign and scales as \\(1/r\\): \\(-30/3=-10\\,\\text{V}\\)."},{"q":"The potential energy of a test charge q at potential V is…","o":["\\(U=qV\\)","\\(U=V/q\\)","\\(U=q/V\\)","\\(U=qV^2\\)"],"a":0,"e":"Electric potential energy is \\(U=qV\\). The sign depends on q and V."},{"q":"A +2 C test charge is at a point with potential 5 V. Its potential energy is…","o":["2.5 J","7 J","10 J","−10 J"],"a":2,"e":"\\(U=qV=(2)(5)=10\\,\\text{J}\\)."},{"q":"A −1 C charge is at a point with potential +8 V. Its potential energy is…","o":["+8 J","−8 J","0 J","+1/8 J"],"a":1,"e":"\\(U=qV=(-1)(8)=-8\\,\\text{J}\\)."},{"q":"Which statement about point-charge potential is correct?","o":["It is proportional to \\(1/r^2\\)","It is proportional to \\(Q/r\\)","It is always positive","It is a vector"],"a":1,"e":"The point-charge potential is \\(V=kQ/r\\), so it is proportional to Q and inversely proportional to r."},{"q":"At the same distance, the potential due to +3Q compared with +Q is…","o":["One-third","Three times","Nine times","The same"],"a":1,"e":"Potential is linear in source charge: \\(V\\propto Q\\), so it triples."}];
let index=0,score=0,streak=0,chosen=null,locked=false;

let wrongAttempts=[];
const $=id=>document.getElementById(id);
function typesetMath(){if(window.MathJax?.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options'),$('feedback')].filter(Boolean)).catch(()=>{});}}

function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';

 });
 typesetMath();

$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];

 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}

});

     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);

});
