<style>

.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}

<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🔥 Potential Energy in SHM</h1><p class="muted">Explore SHM oscillator properties with 30 questions and concise explanations.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
  {q:"The elastic potential energy of a spring at displacement x is:",o:["kx","½kx²","kx²","½kx"],a:1,e:"For an ideal spring, U = ½kx², taking equilibrium as zero potential energy."},
  {q:"Potential energy is maximum in SHM at:",o:["the mean position","either extreme position","all positions equally","the point of maximum speed"],a:1,e:"At x = ±A, U = ½kA², its maximum value."},
  {q:"At the mean position of a spring oscillator, its elastic potential energy is:",o:["zero","maximum","half of total energy","negative infinity"],a:0,e:"At equilibrium x = 0, U = ½kx² = 0."},
  {q:"For amplitude A, maximum spring potential energy is:",o:["kA","½kA²","kA²","½mA²"],a:1,e:"U_max = ½kA² at the extreme positions."},
  {q:"If displacement from equilibrium doubles, spring potential energy becomes:",o:["twice","four times","half","unchanged"],a:1,e:"Potential energy is proportional to x²."},
  {q:"If spring constant k doubles at fixed displacement, potential energy:",o:["halves","doubles","quadruples","remains unchanged"],a:1,e:"U = ½kx², so it is directly proportional to k."},
  {q:"A spring has k = 100 N/m and x = 0.1 m. Its potential energy is:",o:["0.05 J","0.5 J","5 J","10 J"],a:1,e:"U = ½ × 100 × (0.1)² = 0.5 J."},
  {q:"For k = 200 N/m and x = 0.2 m, potential energy is:",o:["2 J","4 J","8 J","40 J"],a:1,e:"U = ½ × 200 × 0.04 = 4 J."},
  {q:"The SI unit of potential energy is:",o:["newton","joule","watt","pascal"],a:1,e:"Energy is measured in joules (J)."},
  {q:"In ideal spring SHM, potential energy depends on displacement through:",o:["x","x²","1/x","√x"],a:1,e:"U = ½kx², so it depends on the square of displacement."},
  {q:"At x = A/2, spring potential energy is what fraction of total energy?",o:["1/4","1/2","3/4","1"],a:0,e:"U/E = x²/A² = (A/2)²/A² = 1/4."},
  {q:"At x = A/√2, potential energy is what fraction of total energy?",o:["1/4","1/2","3/4","1"],a:1,e:"U/E = x²/A² = 1/2."},
  {q:"At x = 0.8A, potential energy is what fraction of total energy?",o:["0.16","0.4","0.64","0.8"],a:2,e:"U/E = (0.8A)²/A² = 0.64."},
  {q:"When the particle moves from the mean position toward an extreme, its spring potential energy generally:",o:["decreases","increases","stays zero","becomes negative"],a:1,e:"As |x| increases, U = ½kx² increases."},
  {q:"The restoring force can be obtained from potential energy using:",o:["F = dU/dx","F = −dU/dx","F = Ux","F = −U/x²"],a:1,e:"In one dimension, force is the negative gradient of potential energy: F = −dU/dx."},
  {q:"For U = ½kx², the force is:",o:["+kx","−kx","½kx","−½kx²"],a:1,e:"Differentiating gives F = −dU/dx = −kx."},
  {q:"The graph of spring potential energy U versus displacement x is:",o:["a straight line","a parabola opening upward","a parabola opening downward","a horizontal line"],a:1,e:"U = ½kx² is an upward-opening parabola."},
  {q:"Potential energy at x = +A equals that at x = −A because:",o:["potential energy depends on x²","force is zero at both points","speed is maximum at both points","amplitude changes sign"],a:0,e:"Since U = ½kx², equal displacement magnitudes give equal potential energies."},
  {q:"If total energy is 10 J and potential energy is 2.5 J, kinetic energy is:",o:["2.5 J","5 J","7.5 J","12.5 J"],a:2,e:"Energy conservation gives K = E − U = 10 − 2.5 = 7.5 J."},
  {q:"For an ideal oscillator with total energy E, potential energy equals total energy when:",o:["x = 0","|x| = A","|x| = A/2","x = A/√2"],a:1,e:"At the extremes, speed is zero and all energy is potential."},
  {q:"If amplitude triples with spring constant unchanged, maximum potential energy becomes:",o:["three times","six times","nine times","unchanged"],a:2,e:"U_max = ½kA², so tripling A gives nine times the maximum potential energy."},
  {q:"For a spring oscillator, at what position is the potential energy minimum?",o:["x = ±A","x = 0","x = A/2 only","all positions equally"],a:1,e:"With the equilibrium reference U = 0, the minimum is at x = 0."},
  {q:"A spring stores 1 J at extension 0.05 m. Its spring constant is:",o:["200 N/m","400 N/m","800 N/m","40 N/m"],a:2,e:"k = 2U/x² = 2/(0.05²) = 800 N/m."},
  {q:"If the spring potential energy is 8 J at x = A, its total energy is:",o:["4 J","8 J","16 J","cannot be determined"],a:1,e:"At the extreme, all mechanical energy is spring potential energy, so E = 8 J."},
  {q:"At x = A/2, the potential energy is 2 J. The total energy is:",o:["2 J","4 J","8 J","16 J"],a:2,e:"At x = A/2, U/E = 1/4; hence E = 4U = 8 J."},
  {q:"The potential energy difference between x = 0 and x = A is:",o:["zero","½kA²","kA","kA²"],a:1,e:"U(0) = 0 and U(A) = ½kA²."},
  {q:"If displacement changes from x to −x, spring potential energy:",o:["changes sign","doubles","remains the same","becomes zero"],a:2,e:"U depends on x², so U(x) = U(−x)."},
  {q:"For a spring oscillator, if x is one-third of amplitude, U/E is:",o:["1/3","1/9","2/3","8/9"],a:1,e:"U/E = x²/A² = (A/3)²/A² = 1/9."},
  {q:"A spring of constant 50 N/m is stretched by 0.4 m. Stored potential energy is:",o:["2 J","4 J","8 J","10 J"],a:1,e:"U = ½ × 50 × 0.16 = 4 J."},
  {q:"Which statement about potential energy in ideal spring SHM is correct?",o:["It is greatest at equilibrium","It is proportional to displacement, not its square","It is maximum at the turning points and minimum at equilibrium","It remains constant throughout oscillation"],a:2,e:"U = ½kx² is maximum at |x| = A and minimum at x = 0."}
];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Potential Energy in SHM Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
