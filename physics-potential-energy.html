adow:0 2px 0 #21863a}.feedback{margin-top:14px;padding:13px;border-radius:14px;font-weight:700;min-height:20px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:8px;color:#5146a5;font-weight:800;text-decoration:none;padding:9px 12px;border-radius:12px}.back:hover{background:#f0edff;transform:translateX(-2px)}@media(max-width:600px){.wrap{padding:20px 14px 34px}.hero h1{font-size:1.55rem}.question{font-size:1.15rem}.card{padding:17px}}</style></head><body><main class="wrap"><div class="top"><div class="xp">⚡ <span id="xp">0</span> XP</div></div><section class="hero"><small>PHYSICS • NEET 2026</small><h1>⚡ Potential Energy</h1><p>LEARN → PRACTICE → MASTER • 15 focused NEET-style MCQs</p></section><section class="card"><div class="progress-head"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count">Question 1 of 15</div><h2 class="question" id="question"></h2><div id="options" class="options"></div><div class="actions"><button id="continue" class="btn">Continue →</button></div><div id="feedback" class="feedback"></div></section><a href="physics-home.html" id="back" class="back">← Back to Physics Path</a></main><script>(function(){const quiz=[['Near Earth, gravitational potential energy relative to a chosen zero level is:',['mgh','½mv²','ma','mg/h'],0,'Gravitational potential energy near Earth is mgh.'],['The SI unit of potential energy is:',['joule','newton','watt','pascal'],0,'Potential energy is a form of energy, measured in joules.'],['A 2 kg mass is raised 5 m. Taking g=10 m/s², its gain in gravitational potential energy is:',['100 J','50 J','25 J','200 J'],0,'ΔU=mgh=2×10×5=100 J.'],['If the height of a body above the reference level is doubled, its gravitational potential energy near Earth becomes:',['double','half','four times','unchanged'],0,'U=mgh, so U is directly proportional to h.'],['Gravitational potential energy depends on the choice of:',['reference level','colour of the body','shape only','temperature only'],0,'Potential energy is defined relative to a chosen zero/reference level.'],['At the same height, two bodies of different masses have gravitational potential energies proportional to their:',['masses','speeds','accelerations only','volumes'],0,'For fixed h and g, U=mgh is proportional to m.'],['When a freely falling body moves downward, its gravitational potential energy generally:',['decreases','increases','remains fixed','becomes infinite'],0,'As height decreases, mgh decreases.'],['For a conservative force, the change in potential energy is related to work done by the force as:',['ΔU=−W','ΔU=W','ΔU=0 always','ΔU=2W'],0,'Work done by a conservative force equals the negative change in potential energy.'],['A spring stores elastic potential energy when it is:',['stretched or compressed','moving at constant speed','heated only','at rest only without deformation'],0,'An ideal spring stores U=½kx² when deformed.'],['Elastic potential energy stored in an ideal spring is:',['½kx²','kx','½mv²','mgh'],0,'For a spring, U=½kx².'],['If a spring deformation is doubled, its elastic potential energy becomes:',['four times','double','half','unchanged'],0,'Since U=½kx², doubling x multiplies U by 4.'],['A 1 kg body is lifted from 2 m to 7 m with g=10 m/s². Its increase in potential energy is:',['50 J','70 J','20 J','90 J'],0,'ΔU=mgΔh=1×10×(7−2)=50 J.'],['Which statement is correct about potential energy?',['It is a scalar quantity','It is always negative','It has direction','It is measured in newtons'],0,'Potential energy is scalar and is measured in joules.'],['At the highest point of an upward-moving body, its gravitational potential energy is:',['maximum relative to lower points','zero for every reference','minimum always','equal to its mass'],0,'Height is greatest there, so mgh is greatest relative to the same reference.'],['The total mechanical energy of a system with only conservative forces is:',['constant','always increasing','always decreasing','zero'],0,'With only conservative forces, kinetic plus potential energy remains constant.']];let i=0,selected=-1,score=0,checked=false;const $=id=>document.getElementById(id),q=$("question"),o=$("options"),b=$("continue"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;q.textContent=a[0];$("count").textContent='Question '+(i+1)+' of 15';o.innerHTML='';f.className='feedback';f.textContent='';b.disabled=false;b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const x=document.createElement('button');x.className='option';x.textContent=String.fromCharCode(65+j)+'. '+item.text;x.dataset.index=item.index;x.onclick=()=>{selected=item.index;[...o.children].forEach(z=>z.classList.remove('selected'));x.classList.add('selected')};o.appendChild(x)})}b.onclick=function(){if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(x=>{const idx=Number(x.dataset.index);x.disabled=true;if(idx===a[2])x.classList.add('correct');if(idx===selected&&!ok)x.classList.add('wrong')});if(ok){score++;f.className='feedback good';f.textContent='🎯 Correct! +10 XP — '+a[3]}else{f.className='feedback bad';f.textContent='✗ Review — Correct answer: '+a[1][a[2]]+'. '+a[3]}$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';b.textContent=i===14?'Finish Skill →':'Continue →';return}if(i<14){i++;render();window.scrollTo({top:0,behavior:'smooth'})}else{q.textContent='🏆 Potential Energy Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.';localStorage.setItem('skillupPhysicsPotentialEnergyScore',score)}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
