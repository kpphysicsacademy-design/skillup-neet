<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Power of a Lens</title><meta name="description" content="SkillUp Physics Power of a Lens interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🔍</span><h1>Power of a Lens</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["The power P of a lens is defined as:",["P=1/f","P=f","P=1/R","P=R/2"],0,"The power of a lens is the reciprocal of its focal length when f is measured in metres."] ,["The SI unit of lens power is:",["Dioptre (D)","Metre","Newton","Joule"],0,"Lens power is measured in dioptres, where 1 D = 1 m⁻¹."] ,["One dioptre is equal to:",["1 m⁻¹","1 m","1 cm⁻¹","1 m²"],0,"A power of 1 D corresponds to a focal length of 1 metre, so 1 D=1 m⁻¹."] ,["A converging (convex) lens has positive power because its focal length is:",["Positive","Negative","Zero","Infinite"],0,"A convex lens has a positive focal length under the Cartesian convention and therefore positive power."] ,["A diverging (concave) lens has:",["Negative power","Positive power","Zero power always","Infinite power"],0,"A concave lens has a negative focal length, hence its power is negative."] ,["The focal length of a lens is +0.50 m. Its power is:",["+2 D","+0.5 D","-2 D","+5 D"],0,"P=1/f=1/0.50=+2 D."] ,["The focal length of a lens is -0.25 m. Its power is:",["-4 D","+4 D","-0.25 D","+0.25 D"],0,"P=1/(-0.25)=-4 D."] ,["A lens has power +5 D. Its focal length is:",["+0.20 m","+5 m","-0.20 m","+0.05 m"],0,"f=1/P=1/5=0.20 m, with positive sign for a converging lens."] ,["A lens has power -2 D. Its focal length is:",["-0.50 m","+0.50 m","-2 m","+2 m"],0,"f=1/P=1/(-2)=-0.50 m."] ,["If focal length is expressed in centimetres, it should be converted to metres before calculating power because:",["The dioptre is m⁻¹","Power has unit cm","Focal length has no unit","Only centimetres are used in optics"],0,"The dioptre is defined using focal length in metres, so centimetres must be converted to metres."] ,["A convex lens has focal length 20 cm. Its power is:",["+5 D","+0.2 D","-5 D","+20 D"],0,"20 cm=0.20 m, so P=1/0.20=+5 D."] ,["A concave lens has focal length -50 cm. Its power is:",["-2 D","+2 D","-0.5 D","+0.5 D"],0,"-50 cm=-0.50 m, so P=1/(-0.50)=-2 D."] ,["When two thin lenses are kept in contact, their equivalent power is:",["The algebraic sum of their powers","The product of their powers only","Always zero","The difference of focal lengths"],0,"For thin lenses in contact, equivalent power P=P₁+P₂ algebraically."] ,["Two lenses of powers +3 D and +2 D are in contact. Their combined power is:",["+5 D","+1 D","-5 D","+6 D"],0,"P=+3+2=+5 D."] ,["Two lenses of powers +4 D and -1 D are in contact. Their combined power is:",["+3 D","+5 D","-3 D","-5 D"],0,"P=+4+(-1)=+3 D. The signs must be retained when adding powers."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
