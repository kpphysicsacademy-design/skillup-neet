<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Power</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:flex-end;margin-bottom:18px}.xp,.card{background:#fff;border-radius:20px;box-shadow:0 6px 20px #17203312}.xp{padding:11px 17px;font-weight:800}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff;border-radius:22px;padding:25px 20px;margin-bottom:12px}.hero h1{margin:8px 0;font-size:1.9rem}.hero p{margin:0}.card{padding:20px;margin:12px 0}.ph{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:11px;background:#dfe8f1;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.25s}.qnum{font-weight:800;color:#35516f;margin-bottom:11px}.question{font-size:1.27rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#58cc02;background:#f7fff1}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;background:#2db84d;color:#fff;font-weight:850;cursor:pointer;box-shadow:0 4px 0 #21863a}.feedback{margin-top:14px;padding:12px;border-radius:13px;font-weight:700;min-height:18px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:7px;padding:9px 12px;border-radius:12px;color:#5146a5;font-weight:800;text-decoration:none}.back:hover{background:#f0edff}@media(max-width:600px){.wrap{padding:20px 14px}.question{font-size:1.12rem}}</style></head><body><main class="wrap"><div class="top"><div class="xp">⚡ <span id="xp">0</span> XP</div></div><section class="hero"><small>PHYSICS • NEET 2026</small><h1>⚡ Power</h1><p>LEARN → PRACTICE → MASTER • 15 focused NEET-style MCQs</p></section><section class="card"><div class="ph"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><button class="btn" id="continue">Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const quiz=[['Power is defined as the rate of:',['doing work','changing mass','changing momentum only','displacement'],0,'Power is the rate at which work is done.'],['The SI unit of power is:',['watt','joule','newton','pascal'],0,'The SI unit of power is watt (W).'],['One watt is equal to:',['1 J/s','1 J·s','1 N/s','1 kg/s'],0,'1 W = 1 joule per second.'],['Average power is given by:',['W/t','Wt','W+t','t/W'],0,'Average power equals work done divided by time taken.'],['If 100 J of work is done in 5 s, average power is:',['20 W','500 W','95 W','105 W'],0,'P=W/t=100/5=20 W.'],['For a constant force parallel to velocity, instantaneous power is:',['Fv','F/v','F+v','F−v'],0,'P=F·v=Fv when force and velocity are parallel.'],['The dimensional formula of power is:',['ML²T⁻³','ML²T⁻²','MLT⁻²','MLT⁻³'],0,'Power = work/time, so [P]=ML²T⁻³.'],['A machine does the same work in half the time. Its average power becomes:',['double','half','four times','unchanged'],0,'P=W/t, so halving time doubles power.'],['A 60 kg person climbs 5 m in 10 s. Taking g=10 m/s², average power is:',['300 W','30 W','600 W','120 W'],0,'P=mgh/t=60×10×5/10=300 W.'],['Mechanical power can be expressed as force multiplied by:',['velocity','acceleration','mass','displacement only'],0,'For instantaneous power, P=F·v.'],['If force is perpendicular to velocity, instantaneous power due to that force is:',['zero','maximum','negative always','infinite'],0,'P=F·v cosθ; at 90°, power is zero.'],['A motor rated 2 kW can deliver power equal to:',['2000 W','200 W','20 W','2 W'],0,'1 kW=1000 W, so 2 kW=2000 W.'],['Two machines do equal work. The more powerful machine:',['does it in less time','does it in more time','has greater mass necessarily','uses no energy'],0,'For equal work, the machine taking less time has greater power.'],['A force of 50 N acts along a velocity of 4 m/s. The power is:',['200 W','12.5 W','54 W','46 W'],0,'P=Fv=50×4=200 W.'],['Power is a scalar quantity because it is:',['the rate of scalar work','a vector force','a displacement vector','an acceleration vector'],0,'Work is scalar, and power is its scalar rate of change with time.']];let i=0,selected=-1,checked=false,score=0;const $=x=>document.getElementById(x),o=$("options"),b=$("continue"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;$("count").textContent='Question '+(i+1)+' of 15';$("question").textContent=a[0];o.innerHTML='';f.className='feedback';f.textContent='';b.style.display='inline-block';b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((x,j)=>{const el=document.createElement('button');el.className='option';el.textContent=String.fromCharCode(65+j)+'. '+x.text;el.dataset.index=x.index;el.onclick=()=>{selected=x.index;[...o.children].forEach(z=>z.classList.remove('selected'));el.classList.add('selected')};o.appendChild(el)})}b.onclick=()=>{if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(el=>{const n=Number(el.dataset.index);el.disabled=true;if(n===a[2])el.classList.add('correct');if(n===selected&&!ok)el.classList.add('wrong')});if(ok){score++;f.className='feedback good';f.textContent='🎯 Correct! +10 XP — '+a[3]}else{f.className='feedback bad';f.textContent='✗ Review — Correct answer: '+a[1][a[2]]+'. '+a[3]}$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$("question").textContent='🏆 Power Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
