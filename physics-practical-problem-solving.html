<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SkillUp Physics | Practical Problem Solving</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.opt.selected{border-color:#5146a5;background:#f4f1ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.opt:disabled{cursor:default}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🧩 Practical Problem Solving</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="action">CHECK</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['A good first step in solving a physics practical problem is to:',['Identify the known quantities, unknown quantity and conditions','Guess the final answer','Ignore the units','Choose a formula randomly'],0,'Clearly identifying knowns, unknowns and conditions helps select an appropriate method.'],['If a measured quantity has an unusual value, the first check should be:',['Units, calculation and instrument reading','Change the answer immediately','Ignore the result','Delete the measurement'],0,'Checking units, arithmetic and the original reading can reveal simple mistakes before deeper analysis.'],['A diagram is useful in practical problem solving because it can:',['Represent the physical situation and clarify relationships','Remove all uncertainty','Guarantee the final answer','Replace every measurement'],0,'A clear diagram helps identify forces, distances, directions and other relationships.'],['When a numerical answer is obtained, a useful final check is to examine its:',['Units and order of magnitude','Font size','Colour','Page number'],0,'Units and approximate magnitude can reveal many calculation or formula errors.'],['If an equation is dimensionally inconsistent, the best conclusion is that:',['The equation needs to be checked or corrected','The numerical answer must be correct','Units are irrelevant','The experiment should be ignored'],0,'Different dimensions on the two sides indicate a problem with the equation.'],['When two experimental readings differ slightly, an appropriate approach is often to:',['Consider measurement uncertainty and repeat if needed','Automatically discard both','Choose the larger value','Change the units until they match'],0,'Small differences may arise from random variation and should be assessed using appropriate uncertainty and repetition.'],['A practical problem asks for speed when distance and time are known. The relevant relation is:',['v=d/t','v=dt','v=t/d','v=d+t'],0,'Speed is distance divided by time.'],['A 12 m distance is covered in 3 s. The speed is:',['3 m/s','4 m/s','9 m/s','36 m/s'],1,'v=d/t=12/3=4 m/s.'],['If a graph is used to solve an experimental problem, the slope should be calculated from:',['Two suitable points on the graph and change in y divided by change in x','Only one point','The largest y-value alone','The graph title'],0,'Slope is Δy/Δx and should be determined using suitable points, preferably well separated.'],['If an experimental graph has scatter, a best-fit line is useful because it:',['Shows the overall trend','Must pass through every point','Removes all uncertainty','Changes the measured data'],0,'A best-fit line represents the overall trend without requiring every measured point to lie exactly on it.'],['If a practical calculation gives 2500 mm, an appropriate SI conversion is:',['2.5 m','25 m','0.25 m','250 m'],0,'Since 1000 mm=1 m, 2500 mm=2.5 m.'],['When comparing a theoretical value with an experimental value, you should consider:',['The difference and the experimental uncertainty','Only the theoretical value','Only the experimental value','The number of pages in the record'],0,'Agreement should be considered in relation to the difference and the uncertainty of the measurements.'],['A controlled experiment changes one main independent variable while keeping other relevant conditions:',['As constant as practical','Random','Unrecorded','Different for every trial'],0,'Controlling relevant variables helps isolate the effect of the independent variable.'],['If an instrument is suspected of having zero error, you should:',['Check the zero before or during measurement and apply correction when appropriate','Ignore it','Increase the object size','Change the physical law'],0,'A known zero offset can be checked and corrected according to the instrument procedure.'],['The strongest final answer to a practical physics problem should normally include:',['A result with appropriate units and, where relevant, uncertainty or reasoning','Only a number','Only a formula','No explanation or units'],0,'A clear result should include units and appropriate reasoning or uncertainty so it can be interpreted and checked.']];let i=0,score=0,answered=false,selected=-1;const $=x=>document.getElementById(x);function render(){answered=false;selected=-1;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q[1].map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('action').classList.remove('hide');$('action').textContent='CHECK'});$('xp').textContent='';$('action').classList.add('hide');$('action').disabled=false;}$('action').onclick=()=>{if(selected<0)return;if(!answered){answered=true;const q=qs[i],ok=selected===q[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===selected&&!ok)b.classList.add('wrong')});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[3];if(ok)score++;$('score').textContent=`XP ${score}`;$('fill').style.width=`${(i+1)/15*100}%`;$('action').textContent=i===14?'FINISH':'Next Question →';return;}if(i<14){i++;render()}else{$('quiz').innerHTML='';$('action').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}};render();</script></body></html>
