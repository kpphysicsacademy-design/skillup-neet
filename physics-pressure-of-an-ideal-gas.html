 to absolute temperature at fixed n."},{"q":"Which equation is the ideal-gas law for n_m moles?","o":["\\(PV=n_mRT\\)","\\(P+V=n_mRT\\)","\\(P/V=RT\\)","\\(PV=R/T\\)"],"a":0,"e":"The molar form of the ideal-gas equation is \\(PV=n_mRT\\)."},{"q":"In the ideal-gas law, R denotes…","o":["Universal gas constant","Molecular radius","Gas density","Boltzmann speed"],"a":0,"e":"R is the universal molar gas constant."},{"q":"Which quantity is equal to mass density multiplied by mean square speed?","o":["\\(\\rho\\overline{c^2}\\)","\\(\\rho/\\overline{c^2}\\)","\\(\\overline c/\\rho\\)","\\(\\rho\\overline c\\)"],"a":0,"e":"The product \\(\\rho\\overline{c^2}\\) appears in the kinetic-theory pressure relation."},{"q":"If the RMS speed of a gas doubles while density stays fixed, pressure becomes…","o":["Four times","Twice","Half","Unchanged"],"a":0,"e":"Pressure is proportional to mean square speed; doubling RMS speed quadruples its square."},{"q":"If gas density doubles and mean square speed stays constant, pressure…","o":["Doubles","Halves","Becomes four times","Does not change"],"a":0,"e":"From \\(P=\\frac13\\rho\\overline{c^2}\\), pressure is directly proportional to density at fixed mean square speed."},{"q":"Which speed is used in the pressure formula \\(P=\\frac13\\rho\\overline{c^2}\\)?","o":["RMS speed through its square","Only the slowest molecule's speed","Speed of sound only","The container wall speed"],"a":0,"e":"The mean square molecular speed is \\(\\overline{c^2}\\), equal to the square of RMS speed."},{"q":"The dimensions of pressure are…","o":["\\(ML^{-1}T^{-2}\\)","\\(MLT^{-2}\\)","\\(M L^2T^{-2}\\)","\\(M^{-1}LT^2\\)"],"a":0,"e":"Pressure is force per area, giving dimensions \\(ML^{-1}T^{-2}\\)."},{"q":"Why is the factor 1/3 present in the kinetic-theory pressure equation?","o":["Random molecular motion is equally distributed among three spatial directions","There are exactly three molecules","All molecules move at one-third the speed of light","Pressure ith the container walls."},{"q":"A gas has density \\(1.2\\,\\mathrm{kg\\,m^{-3}}\\) and RMS speed \\(500\\,\\mathrm{m\\,s^{-1}}\\). What is its pressure?","o":["\\(1.0\\times10^5\\,\\mathrm{Pa}\\)","\\(3.0\\times10^5\\,\\mathrm{Pa}\\)","\\(5.0\\times10^4\\,\\mathrm{Pa}\\)","\\(2.0\\times10^4\\,\\mathrm{Pa}\\)"],"a":0,"e":"\\(P=\\frac13\\rho c_{rms}^2=\\frac13(1.2)(500)^2=1.0\\times10^5\\,\\mathrm{Pa}\\)."},{"q":"A gas exerts a force of 20 N uniformly on an area of 0.5 m². Its pressure is…","o":["40 Pa","10 Pa","20 Pa","0.025 Pa"],"a":0,"e":"Pressure is force divided by area: \\(P=F/A=20/0.5=40\\,\\mathrm{Pa}\\)."},{"q":"For a gas at fixed temperature, compressing it into a smaller volume generally makes pressure…","o":["Increase","Decrease","Become zero","Remain fixed regardless of volume"],"a":0,"e":"For a fixed amount of gas at constant T, Boyle's law gives \\(P\\propto1/V\\)."},{"q":"What is the approximate value of the universal gas constant R?","o":["\\(8.314\\,\\mathrm{J\\,mol^{-1}\\,K^{-1}}\\)","\\(1.38\\times10^{-23}\\,\\mathrm{J\\,K^{-1}}\\)","\\(6.022\\times10^{23}\\,\\mathrm{mol^{-1}}\\)","\\(9.81\\,\\mathrm{m\\,s^{-2}}\\)"],"a":0,"e":"The universal gas constant is approximately 8.314 joules per mole per kelvin."},{"q":"Which value is approximately Boltzmann's constant?","o":["\\(1.38\\times10^{-23}\\,\\mathrm{J\\,K^{-1}}\\)","\\(8.314\\,\\mathrm{J\\,mol^{-1}\\,K^{-1}}\\)","\\(9.8\\,\\mathrm{m\\,s^{-2}}\\)","\\(6.022\\times10^{23}\\,\\mathrm{mol^{-1}}\\)"],"a":0,"e":"Boltzmann constant is approximately \\(1.38\\times10^{-23}\\,\\mathrm{J\\,K^{-1}}\\)."},{"q":"Which change does not by itself determine pressure without additional information?","o":["Changing molecular mass while leaving density and mean square speed unspecified","Doubling number density at fixed temperature","Doubling temperature at fixed number density","Doubling RMS speed at fixed density"],"a":0,"e":"The kinetic-theory relation needs density and mean square speed; molecular mass alone i
