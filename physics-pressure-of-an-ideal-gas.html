const questions=[{"q":"In kinetic theory, gas pressure is caused mainly by molecules…","o":["Colliding with the container walls","Resting against the walls","Attracting each other continuously","Losing all kinetic energy"],"a":0,"e":"Collisions transfer momentum to the walls, creating a force per unit area."},{"q":"Which expression relates ideal-gas pressure to density and rms speed?","o":["P = ⅓ρvᵣₘₛ²","P = 3ρvᵣₘₛ","P = ρ/vᵣₘₛ²","P = ρvᵣₘₛ/3"],"a":0,"e":"Kinetic theory gives P = ⅓ρ⟨v²⟩ = ⅓ρvᵣₘₛ²."},{"q":"In the pressure formula, ρ represents…","o":["Mass density of the gas","Molecular radius","Number of moles only","Gas temperature"],"a":0,"e":"ρ is mass per unit volume, measured in kg/m³."},{"q":"If gas density and rms speed are fixed, pressure is…","o":["Fixed by P = ⅓ρvᵣₘₛ²","Always zero","Independent of both quantities","Equal to density divided by speed"],"a":0,"e":"The kinetic-theory relation determines pressure from density and mean square speed."},{"q":"If rms speed doubles while density stays constant, pressure becomes…","o":["Four times as large","Twice as large","Half as large","Unchanged"],"a":0,"e":"Pressure is proportional to the square of rms speed."},{"q":"If density doubles while rms speed stays constant, pressure…","o":["Doubles","Quadruples","Halves","Does not change"],"a":0,"e":"Pressure is directly proportional to mass density when rms speed is fixed."},{"q":"For N molecules of mass m in volume V, the kinetic-theory pressure equation is…","o":["P = Nm⟨v²⟩/(3V)","P = 3NV/(m⟨v²⟩)","P = NmV/3","P = N⟨v⟩/(mV)"],"a":0,"e":"Pressure equals one-third of the mass-weighted mean-square molecular speed per unit volume."},{"q":"The quantity ⟨v²⟩ means…","o":["Mean of the squared speeds","Square of the mean speed in every case","Mean velocity vector","Speed of the fastest molecule"],"a":0,"e":"Mean square speed averages v² over the molecular population."},{"q":"How is rms speed related to mean square speed?","o":["vᵣₘₛ = √⟨v²⟩","vᵣₘₛ = ⟨v²⟩²","vᵣₘₛ = 1/⟨v²⟩","vᵣₘₛ = ⟨v⟩²"],"a":0,"e":"Rms speed is the square root of the mean square speed."},{"q":"At constant temperature, what happens to ideal-gas pressure if the volume is halved for a fixed amount of gas?","o":["It doubles","It halves","It becomes zero","It remains constant"],"a":0,"e":"Boyle's law states PV is constant at fixed temperature and amount of gas."},{"q":"At fixed volume and amount of ideal gas, doubling absolute temperature makes pressure…","o":["Double","Halve","Quadruple","Unchanged"],"a":0,"e":"From PV = nRT, pressure is proportional to kelvin temperature at constant V."},{"q":"What is the SI unit of pressure?","o":["Pascal","Joule","Kelvin","Metre per second"],"a":0,"e":"One pascal is one newton per square metre."},{"q":"One pascal is equivalent to…","o":["1 N/m²","1 J/s","1 kg·m/s","1 kg/m³"],"a":0,"e":"Pressure is force divided by area."},{"q":"Why do molecular collisions produce pressure even though molecules move randomly?","o":["Wall impacts transfer momentum and create average force","All molecules hit one wall only","Molecules permanently stick to walls","Random motion eliminates every force"],"a":0,"e":"Random impacts in aggregate produce a measurable average force on each wall."},{"q":"For an ideal gas, mean translational kinetic energy per molecule is…","o":["(3/2)kT","kT/2","3RT/2 per molecule","RT"],"a":0,"e":"The average translational kinetic energy is 3kT/2."},{"q":"Combining kinetic theory with the ideal-gas law gives the average translational kinetic energy proportional to…","o":["Absolute temperature","Pressure only","Container volume only","Molecular colour"],"a":0,"e":"Equating PV = NkT with the kinetic-theory equation yields ⟨Eₖ⟩ = 3kT/2."},{"q":"At the same temperature, two ideal gases have the same…","o":["Mean translational kinetic energy per molecule","Rms speed regardless of mass","Mass density in every container","Pressure in every container"],"a":0,"e":"Mean translational kinetic energy per molecule depends only on absolute temperature."},{"q":"If two gases have the same density but gas A has twice the rms speed of gas B, pressure in A is…","o":["Four times that in B","Twice that in B","Half that in B","Equal to that in B"],"a":0,"e":"With equal density, P ∝ vᵣₘₛ², so the pressure ratio is 2² = 4."},{"q":"A gas has density 2 kg/m³ and rms speed 300 m/s. Its pressure is…","o":["60,000 Pa","30,000 Pa","90,000 Pa","180,000 Pa"],"a":0,"e":"P = ⅓ρv² = ⅓ × 2 × 300² = 60,000 Pa."},{"q":"If P = 1.0 × 10⁵ Pa and ρ = 1.2 kg/m³, the rms speed is approximately…","o":["500 m/s","167 m/s","290 m/s","1,000 m/s"],"a":0,"e":"vᵣₘₛ = √(3P/ρ) ≈ √250,000 ≈ 500 m/s."},{"q":"Which molecular motion contributes to ideal-gas pressure in the kinetic model?","o":["The component of motion normal to the wall during collisions","Only circular motion around the container","Only molecules moving parallel to the wall","No molecular motion"],"a":0,"e":"Normal momentum changes at the wall produce the force responsible for pressure."},{"q":"Why is pressure the same in all directions for a gas at equilibrium in a uniform container?","o":["Molecular motion is statistically isotropic","Every molecule moves in the same direction","Gravity is always zero","Molecules never collide"],"a":0,"e":"In equilibrium, random molecular motion has no preferred direction, making pressure isotropic."},{"q":"What is assumed about intermolecular forces in the ideal-gas kinetic model between collisions?","o":["They are negligible","They are infinitely strong","They hold molecules fixed","They reverse all molecular motion continuously"],"a":0,"e":"Ideal-gas molecules move freely between brief collisions."},{"q":"If the number of molecules per unit volume increases at fixed temperature, pressure generally…","o":["Increases","Decreases","Becomes zero","Must stay constant"],"a":0,"e":"At fixed temperature, more molecules per volume produce greater pressure, consistent with P = nkT."},{"q":"In P = nkT, n represents…","o":["Number density of molecules","Number of moles","Mass density","Number of collisions per second"],"a":0,"e":"Here n is the number of molecules per unit volume, not the amount in moles."},{"q":"For a fixed amount of ideal gas, which relationship holds at constant temperature?","o":["PV = constant","P/V = constant","PT = constant","P + V = constant"],"a":0,"e":"Boyle's law gives PV = constant for fixed gas amount and temperature."},{"q":"If a gas's rms speed falls to half while its density stays the same, pressure becomes…","o":["One-quarter","One-half","Twice as large","Four times as large"],"a":0,"e":"Pressure is proportional to the square of rms speed: (1/2)² = 1/4."},{"q":"What is the key link between microscopic motion and macroscopic pressure?","o":["Molecular momentum transfer to the walls","The colour of molecules","The container's name","The chemical formula alone"],"a":0,"e":"The pressure measured macroscopically arises from countless microscopic wall collisions."},{"q":"For an ideal gas, if both density and rms speed are tripled, pressure becomes…","o":["27 times as large","9 times as large","6 times as large","3 times as large"],"a":0,"e":"P ∝ ρv², so the factor is 3 × 3² = 27."},{"q":"Which statement about gas pressure is correct?","o":["It depends on molecular motion and number density","It is produced only by molecular attraction","It is independent of temperature for a fixed volume","It can exist only in a liquid"],"a":0,"e":"Pressure follows from molecular collisions and is related to temperature and density."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];

function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';

 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
 if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options')]).catch(function(){});}
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Pressure of an Ideal Gas Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise([card]).catch(function(){});}
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
 window.addEventListener('load',function(){if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise().catch(function(){});}});
})();
