<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp | Principle of Homogeneity</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;margin:0;color:#172033}
.wrap{max-width:850px;margin:auto;padding:28px 18px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.xp{font-weight:800}
.card{background:white;border-radius:22px;padding:24px;margin-top:18px;box-shadow:0 5px 20px #00000012}
.mastery{font-weight:800;margin-top:18px}
.bar{height:10px;background:#e8eaf0;border-radius:99px;overflow:hidden;margin-top:10px}
.fill{height:100%;width:0;background:#58cc02;transition:.3s}
.q{font-size:1.3rem;font-weight:750;line-height:1.45}
.opts{display:grid;gap:10px;margin-top:18px}
.opts button{padding:15px;border:2px solid #e2e5eb;border-radius:14px;background:white;text-align:left;font-size:1rem;cursor:pointer;box-shadow:none}
.opts button:hover{border-color:#58cc02}
.opts button:disabled{cursor:default}
.opts button.correct{border-color:#58cc02;background:#effbea}
.opts button.wrong{border-color:#e5484d;background:#fff0f0}
.feedback{font-weight:700;margin-top:16px;min-height:24px;line-height:1.5}
.next{margin-top:18px;padding:13px 22px;border:0;border-radius:14px;background:#58cc02;color:white;font-weight:800;cursor:pointer}
.next:disabled{opacity:.45;cursor:not-allowed}
.back{display:inline-block;margin-top:18px;padding:12px 18px;border:2px solid #5146a5;border-radius:14px;color:#5146a5;text-decoration:none;font-weight:800;transition:.2s}
.back:hover{background:#5146a5;color:white;transform:translateY(-1px)}
.back:active{transform:scale(.97)}
.meta{font-size:.95rem;color:#4b5563}
@media(max-width:600px){.wrap{padding:20px 14px}.top h1{font-size:1.55rem}.card{padding:20px}.q{font-size:1.18rem}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><h1>⚖️ Principle of Homogeneity</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></div>
<p>Master dimensional homogeneity, dimensional consistency and equation checking with 15 NEET-style questions.</p>
<div class="mastery">🎯 Skill Mastery <span id="mastery">0 / 15</span></div>
<div class="bar"><div id="fill" class="fill"></div></div>
<section class="card">
<div id="count" class="meta">Question 1 of 15</div>
<p id="question" class="q"></p>
<div id="options" class="opts"></div>
<div id="feedback" class="feedback"></div>
<button id="next" class="next" disabled>Continue →</button>
</section>
<a class="back" href="physics-home.html">← Back to Physics Path</a>
</main>
<script>
const qs=[
['What is the principle of dimensional homogeneity?',['Both sides of a physical equation must have the same dimensions','Both sides must have the same numerical value only','Every quantity must be dimensionless','Only SI units may be used'],0,'A physically meaningful equation must have identical dimensions on both sides.'],
['Which equation satisfies the principle of homogeneity?',['v = u + at','v = u + a/t','v = u + at²','v = u² + at'],0,'u, v and at all have dimensions LT⁻¹.'],
['Why can the terms ut and ½at² be added in s = ut + ½at²?',['Both have dimensions of length','Both are dimensionless','Both have dimensions of velocity','They have the same numerical value'],0,'ut and at² each have dimensions L, so they can be added.'],
['The equation F = ma is dimensionally homogeneous because both sides have dimensions:',['MLT⁻²','ML²T⁻²','MLT⁻¹','MT⁻²'],0,'Force and mass × acceleration both have dimensions MLT⁻².'],
['Which equation is dimensionally invalid?',['s = ut + ½at²','v = u + at','F = ma','s = u + at²'],3,'u has dimensions LT⁻¹ whereas at² has dimensions L, so they cannot be added.'],
['If x = A + Bt and x is a length, the dimensions of A must be:',['L','LT⁻¹','T','1'],0,'Quantities added to x must have the same dimensions as x.'],
['If x = A + Bt and x is a length, the dimensions of B must be:',['L','LT⁻¹','T⁻¹','LT'],1,'Bt must have dimensions L, hence B has dimensions LT⁻¹.'],
['In y = A sin(ωt), the quantity ωt must be:',['Dimensionless','A length','A force','A velocity'],0,'The argument of sine must be dimensionless.'],
['In a physical expression log(x), the argument x must be:',['Dimensionless','A length','A time','A force'],0,'A logarithm is defined for a dimensionless argument in physical equations.'],
['If E = A + B and E is energy, then A and B must have:',['The same dimensions as energy','Different dimensions','Zero dimensions','Only the same numerical value'],0,'Only quantities with identical dimensions can be added or subtracted.'],
['Which equation is dimensionally homogeneous?',['P = ρgh','P = ρg/h','P = ρh/g','P = ρgh²'],0,'ρgh has dimensions ML⁻¹T⁻², the dimensions of pressure.'],
['For T = C l^a g^b, dimensional analysis for a pendulum gives:',['a = 1/2, b = −1/2','a = 1, b = −1','a = −1/2, b = 1/2','a = 1/2, b = 1/2'],0,'Matching T = L^a(LT⁻²)^b gives a = 1/2 and b = −1/2.'],
['Dimensional homogeneity alone cannot determine:',['A pure numerical constant such as 2 or π','Whether both sides have dimensions','Dimensions of a derived quantity','Whether added terms have compatible dimensions'],0,'Dimensionless numerical factors are not obtained from dimensional analysis.'],
['Which statement is necessary for a valid addition in a physical equation?',['The quantities must have the same dimensions','The quantities must have different dimensions','The quantities must both be dimensionless','The quantities must use different units'],0,'Same dimensions are required for addition or subtraction.'],
['Which statement best describes dimensional homogeneity?',['It is a necessary check for physical equations, but not a complete proof of correctness','It guarantees every equation is physically correct','It applies only to SI units','It replaces all experimental verification'],0,'A dimensionally correct equation may still be physically wrong, so homogeneity is necessary but not sufficient.']
];
let i=0,xp=0,answered=false;
const $=id=>document.getElementById(id);
function render(){answered=false;$('count').textContent=`Question ${i+1} of ${qs.length}`;$('question').textContent=qs[i][0];$('options').innerHTML='';$('feedback').textContent='';$('next').disabled=true;qs[i][1].forEach((o,j)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+j)+'. '+o;b.onclick=()=>answer(j);$('options').appendChild(b)});$('fill').style.width=`${i/qs.length*100}%`}
function answer(j){if(answered)return;answered=true;const a=qs[i],ok=j===a[2];if(ok){xp+=10;$('xp').textContent=xp;$('feedback').textContent='✅ Correct! +10 XP — '+a[3]}else{$('feedback').textContent='❌ Not quite. Correct answer: '+a[1][a[2]]+' — '+a[3]}[...$('options').children].forEach((b,k)=>{b.disabled=true;if(k===a[2])b.classList.add('correct');if(k===j&&k!==a[2])b.classList.add('wrong')});$('mastery').textContent=Math.round((i+(ok?1:0))/qs.length*100)+'%';$('next').disabled=false}
$('next').onclick=()=>{if(i<qs.length-1){i++;render()}else{$('fill').style.width='100%';$('mastery').textContent='100%';$('question').textContent=`🎉 Principle of Homogeneity mastered! You scored ${xp} XP out of ${qs.length*10} XP.`;$('options').innerHTML='';$('feedback').textContent='Excellent work — keep building your Physics path!';$('next').style.display='none'}};
render();
</script>
</body>
</html>
