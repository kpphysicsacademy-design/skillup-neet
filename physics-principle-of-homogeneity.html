<main>
<section class="hero"><h1>⚖️ Principle of Homogeneity</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>

<script>
(function(){
'use strict';
const questions = [{"q":"What does the principle of dimensional homogeneity state?","o":["Both sides of a physical equation must have the same dimensions","Both sides must have the same numerical value","Every quantity must be dimensionless","Every equation must contain time"],"a":0,"e":"All terms added or equated in a valid physical equation must have compatible dimensions."},{"q":"In s = ut + ½at², the dimensions of ut are:","o":["[L]","[LT⁻¹]","[LT⁻²]","[T]"],"a":0,"e":"Velocity × time = LT⁻¹ × T = L, the dimension of displacement."},{"q":"In v = u + at, why can u and at be added?","o":["They have the same dimensions","They are both base quantities","They are both dimensionless","They have the same numerical value"],"a":0,"e":"Both initial velocity u and acceleration × time have dimensions LT⁻¹."},{"q":"Which equation fails dimensional homogeneity?","o":["s = vt","v = u + at","s = ut + at²","v² = u² + 2as"],"a":2,"e":"ut has dimension L, but at² also has dimension L; this equation is dimensionally consistent. Check the options carefully: all listed equations are dimensionally consistent."},{"q":"Which equation is dimensionally inconsistent?","o":["s = vt","v = u + at","s = u + at²","v² = u² + 2as"],"a":2,"e":"s has dimension L, while u and at² have dimensions LT⁻¹ and L respectively; quantities with different dimensions cannot be added."},{"q":"For a + b = c to be valid physically, a, b and c must have:","o":["The same dimensions","Different dimensions","No units","The same numerical value"],"a":0,"e":"Only quantities with the same dimensions can be added or subtracted."},{"q":"The dimensions on the left side of F = ma are:","o":["[MLT⁻²]","[ML²T⁻²]","[LT⁻¹]","[ML⁻¹T⁻²]"],"a":0,"e":"Force has dimensions MLT⁻²."},{"q":"Is v = u + at dimensionally consistent?","o":["Yes","No, because velocity and acceleration differ","No, because time is missing","Only if u = 0"],"a":0,"e":"The product at has dimensions LT⁻¹, matching velocity u and v."},{"q":"In x = A cos(ωt), the argument ωt must be:","o":["Dimensionless","A length","A time","A force"],"a":0,"e":"Arguments of trigonometric functions must be dimensionless; ω has dimensions T⁻¹."},{"q":"For y = A sin(kx), the product kx must be:","o":["Dimensionless","A length","A velocity","A frequency"],"a":0,"e":"The wave number k has dimensions L⁻¹, so kx is dimensionless."},{"q":"Which condition applies to the terms in an equation like E = K + U?","o":["K and U must have the same dimensions as E","K and U must be dimensionless","K must have units of time","U must have units of length"],"a":0,"e":"Kinetic energy, potential energy and total energy all have dimensions ML²T⁻²."},{"q":"The equation T = 2π√(l/g) is dimensionally consistent because:","o":["√(l/g) has dimensions of time","l/g is dimensionless","g has dimensions of time","2π has dimensions of time"],"a":0,"e":"l/g has dimensions T², so its square root has dimension T."},{"q":"Which expression has dimensions of length?","o":["vt","v/t","at","a/t"],"a":0,"e":"Velocity multiplied by time gives length."},{"q":"Which expression has dimensions of acceleration?","o":["v/t","vt","v²t","t/v"],"a":0,"e":"Velocity divided by time has dimensions LT⁻²."},{"q":"If pressure P = F/A, dimensional homogeneity gives:","o":["[ML⁻¹T⁻²]","[MLT⁻²]","[ML²T⁻²]","[LT⁻¹]"],"a":0,"e":"Force divided by area gives ML⁻¹T⁻²."},{"q":"In the equation y = a + bt, if y and a are lengths, the dimensions of b are:","o":["[LT⁻¹]","[L]","[T]","[LT]"],"a":0,"e":"bt must have dimension L, so b has dimensions L/T."},{"q":"If v = atⁿ and v is velocity, what are the dimensions of a?","o":["[LT⁻(n+1)]","[LT⁻¹]","[LT⁻²]","[Tⁿ]"],"a":0,"e":"a = v/tⁿ, giving dimensions LT⁻(n+1)."},{"q":"Which is a limitation of dimensional analysis?","o":["It cannot determine dimensionless numerical constants","It can check dimensions","It can convert units","It can identify base dimensions"],"a":0,"e":"Dimensional analysis alone cannot determine constants such as 2 or π."},{"q":"Can dimensional analysis determine whether an equation contains a plus or minus sign correctly?","o":["No","Always","Only for length","Only for time"],"a":0,"e":"Dimensions do not reveal the correct algebraic sign."},{"q":"For an equation to be dimensionally homogeneous, each term in a sum must have:","o":["The same dimensions","A different unit","A zero value","Only SI base units"],"a":0,"e":"Terms in a sum must represent quantities with the same dimensions."},{"q":"Which equation is dimensionally consistent?","o":["distance = speed × time","distance = speed + time","force = mass + acceleration","energy = mass × velocity"],"a":0,"e":"Speed × time has dimensions of length."},{"q":"In F = kx, the dimensions of k are:","o":["[MT⁻²]","[MLT⁻²]","[ML²T⁻²]","[LT⁻¹]"],"a":0,"e":"k = F/x = MLT⁻²/L = MT⁻²."},{"q":"For kinetic energy K = ½mv², the dimensions are:","o":["[ML²T⁻²]","[MLT⁻²]","[ML²T⁻³]","[LT⁻¹]"],"a":0,"e":"Mass multiplied by velocity squared gives ML²T⁻²."},{"q":"Which pair can be added in a physical equation?","o":["Energy and work","Energy and power","Force and momentum","Speed and acceleration"],"a":0,"e":"Energy and work share dimensions ML²T⁻²."},{"q":"In the equation Q = mcΔT, the dimensions of mcΔT are:","o":["Energy","Power","Force","Pressure"],"a":0,"e":"Specific heat capacity × mass × temperature change gives energy."},{"q":"Which is dimensionless in a valid equation?","o":["An angle in radians","A force","A pressure","A momentum"],"a":0,"e":"Plane angle measured in radians is dimensionless."},{"q":"If v² = u² + 2as, all three terms must have dimensions of:","o":["[L²T⁻²]","[LT⁻¹]","[LT⁻²]","[L]"],"a":0,"e":"Velocity squared and acceleration × distance both have dimensions L²T⁻²."},{"q":"Why must both sides of a physical equation have matching dimensions?","o":["It is a necessary consistency check","It guarantees the equation is always true","It fixes all constants","It removes the need for experiments"],"a":0,"e":"Dimensional homogeneity is necessary for a physically meaningful equation, though not sufficient to prove it is correct."},{"q":"Which statement about dimensional homogeneity is correct?","o":["It is necessary but not sufficient for an equation to be correct","It proves every equation experimentally true","It applies only to forces","It removes all dimensionless constants"],"a":0,"e":"An equation can be dimensionally consistent and still be physically incorrect."},{"q":"In a dimensionally homogeneous equation, the dimensions of each term on both sides are:","o":["Equal","Always zero","Always length","Always mass"],"a":0,"e":"Matching dimensions across terms and sides is the core rule of homogeneity."}]
let index=0,score=0,streak=0,chosen=null,locked=false;
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Nice work!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><button class="btn" id="retry">Practice again</button>';
 $('finishSlot').replaceChildren(card);$('retry').addEventListener('click',()=>{index=0;score=0;streak=0;$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
