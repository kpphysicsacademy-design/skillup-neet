<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Principle of Homogeneity</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;line-height:1.45}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px;line-height:1.5}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>⚖️ Principle of Homogeneity</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['What is the principle of dimensional homogeneity?','Both sides of a physical equation must have the same dimensions','Both sides must have the same numerical value only','Every quantity must be dimensionless','Only SI units may be used',0,'A physically meaningful equation must have identical dimensions on both sides.'],
['Which equation satisfies the principle of homogeneity?','v = u + at','v = u + a/t','v = u + at²','v = u² + at',0,'u, v and at all have dimensions LT⁻¹.'],

['The equation F = ma is dimensionally homogeneous because both sides have dimensions:','MLT⁻²','ML²T⁻²','MLT⁻¹','MT⁻²',0,'Force and mass × acceleration both have dimensions MLT⁻².'],
['Which equation is dimensionally invalid?','s = ut + ½at²','v = u + at','F = ma','s = u + at²',3,'u has dimensions LT⁻¹ whereas at² has dimensions L, so they cannot be added.'],
['If x = A + Bt and x is a length, the dimensions of A must be:','L','LT⁻¹','T','1',0,'Quantities added to x must have the same dimensions as x.'],
['If x = A + Bt and x is a length, the dimensions of B must be:','L','LT⁻¹','T⁻¹','LT',1,'Bt must have dimensions L, hence B has dimensions LT⁻¹.'],
['In y = A sin(ωt), the quantity ωt must be:','Dimensionless','A length','A force','A velocity',0,'The argument of sine must be dimensionless.'],
['In a physical expression log(x), the argument x must be:','Dimensionless','A length','A time','A force',0,'The argument of a logarithm must be dimensionless.'],
['If E = A + B and E is energy, then A and B must have:','The same dimensions as energy','Different dimensions','Zero dimensions','Only the same numerical value',0,'Only quantities with identical dimensions can be added or subtracted.'],
['Which equation is dimensionally homogeneous?','P = ρgh','P = ρg/h','P = ρh/g','P = ρgh²',0,'ρgh has dimensions ML⁻¹T⁻², the dimensions of pressure.'],

];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
