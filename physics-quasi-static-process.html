*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#203040;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:22px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:#123b70}.xp{font-weight:950;color:#1677ff}.hero{margin-top:14px;background:linear-gradient(135deg,#123b70,#1677ff);color:#fff;border-radius:24px;padding:22px}.hero h1{margin:5px 0 7px;font-size:clamp(28px,6vw,40px)}.hero p{margin:0;line-height:1.5;font-size:13px}.card{background:#fff;border:1px solid #d9e5f2;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 7px 20px rgba(18,59,112,.07)}.bar{height:10px;background:#e5edf6;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;width:0;background:#1677ff;transition:.3s}.qno{font-size:12px;color:#6b7280;font-weight:900}.q{font-size:20px;font-weight:900;line-height:1.4;margin:9px 0 16px}button.opt{display:block;width:100%;text-align:left;background:#fff;color:#203040;border:2px solid #dfe8f1;border-radius:14px;padding:14px;margin:10px 0;font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}button.opt.selected{border-color:#1677ff;background:#eef6ff;color:#123b70}button.opt.correct{border-color:#16803a;background:#eaf8ef;color:#145c2e}button.opt.wrong{border-color:#d64545;background:#fff0f0;color:#8f2020}button.continue{border:0;border-radius:13px;padding:12px 20px;background:#1677ff;color:#fff;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #0d5bbf}button.continue:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}.actions{display:flex;justify-content:flex-end;margin-top:15px}.feedback{min-height:25px;margin-top:13px;font-weight:800}.explain{margin-top:6px;color:#596774;font-weight:600}.back{display:block;width:max-content;margin:18px auto 0;padding:10px 15px;border:2px solid #d9e5f2;border-radius:12px;background:#fff;color:#1264d6;text-decoration:none;font-weight:900}.result{text-align:center}.score{font-size:34px;font-weight:950;color:#123b70}@media(max-width:520px){.wrap{padding:15px 10px 50px}.q{font-size:18px}button.opt{font-size:14px;padding:13px}}

<body>
<main class="wrap">
<div class="top"><div class="brand">⚛️ SkillUp Physics<br><small>NEET 2026 • 15 MCQ QUIZ</small></div><div class="xp" id="xp">XP: 0</div></div>
<section class="hero"><div>🔥 THERMODYNAMICS</div><h1>Quasi-static Process</h1><p>15-question MCQ quiz on quasi-static thermodynamic processes, equilibrium states, work and P–V diagrams.</p></section>

<section class="card" id="quiz"><div class="qno" id="qno"></div><div class="q" id="question"></div><div id="opts"></div><div class="actions"><button class="continue" id="continue" type="button" disabled>Check Answer →</button></div><div class="feedback" id="feedback"></div></section>
<section class="card result" id="result" hidden></section>

</main>
<script>
const questions=[
{q:'A quasi-static process is one that proceeds',o:['instantaneously','through a continuous sequence of states very close to equilibrium','only at constant temperature','only at constant pressure'],a:1,e:'A quasi-static process changes slowly enough that the system remains arbitrarily close to thermodynamic equilibrium.'},
{q:'During a quasi-static process, the system can be assigned',o:['no pressure or temperature','well-defined state variables at each stage','only its initial state','only its final state'],a:1,e:'Because the system remains near equilibrium, pressure, volume and temperature can be defined at each intermediate state.'},
{q:'For a quasi-static process, the work done by a gas is',o:['W = ∫P dV','W = ∫V dP only','W = P/T','W = ΔT'],a:0,e:'For a quasi-static process, the boundary work is obtained from W = ∫P dV along the process path.'},
{q:'On a P–V diagram, a quasi-static process is represented by',o:['a path connecting the states','only one point','only a vertical axis','only a horizontal axis'],a:0,e:'The sequence of equilibrium states forms a definite path on the P–V diagram.'},
{q:'A quasi-static process is necessarily',o:['reversible','irreversible','adiabatic','isothermal'],a:0,e:'A truly quasi-static process alone need not be reversible; reversibility additionally requires absence of dissipative effects. In ideal thermodynamics, a quasi-static process without dissipative effects is reversible.'},
{q:'Which condition most directly helps a process remain quasi-static?',o:['Very rapid compression','Very slow change of external conditions','Large pressure difference','Strong turbulence'],a:1,e:'Changing external conditions very slowly allows the system to pass through states arbitrarily close to equilibrium.'},
{q:'In a quasi-static compression, the gas pressure is approximately',o:['unrelated to external pressure','equal to the external pressure at each stage','always zero','always atmospheric pressure'],a:1,e:'For mechanical equilibrium during a quasi-static process, the pressure difference driving the piston is infinitesimal.'},
{q:'The work in a quasi-static expansion from V₁ to V₂ depends on',o:['only V₁','only V₂','the path P(V) followed between the states','only the temperature at V₁'],a:2,e:'Work is a path function. Different quasi-static paths between the same states can give different values of ∫P dV.'},
{q:'If a quasi-static process occurs at constant pressure P, the work is',o:['P(V₂ − V₁)','V(P₂ − P₁)','zero for every process','nRT ln(V₂/V₁)'],a:0,e:'With constant pressure, W = P∫dV = P(V₂ − V₁).'},
{q:'For a quasi-static isothermal expansion of an ideal gas, pressure varies as',o:['P ∝ V','P ∝ 1/V','P ∝ V²','P = constant'],a:1,e:'At constant temperature, PV = constant, so P is inversely proportional to V.'},
{q:'Which process is closest to the ideal reversible process when dissipative effects are absent?',o:['Quasi-static process','Free expansion','Shock compression','Highly turbulent flow'],a:0,e:'A quasi-static process without friction, viscosity or other dissipative effects is reversible in the ideal limit.'},
{q:'In a quasi-static process, an infinitesimal pressure difference is used to',o:['produce uncontrolled acceleration','drive the system through successive equilibrium states','make temperature undefined','prevent any volume change'],a:1,e:'An infinitesimal driving difference lets the system evolve slowly while remaining near equilibrium.'},
{q:'For a closed system undergoing quasi-static expansion, positive work by the system occurs when',o:['dV > 0','dV < 0','dV = 0','P = 0 only'],a:0,e:'Using δW = P dV for work done by the system, expansion with dV > 0 gives positive work.'},
{q:'If the initial and final states are identical after a quasi-static cycle, the net work is represented by',o:['zero area always','the signed area enclosed by the cycle on the P–V diagram','the final pressure only','the temperature change only'],a:1,e:'For a cycle, net work equals the signed area enclosed by the path on the P–V diagram.'},
{q:'Which statement is correct?',o:['Every slow process is automatically reversible','Every quasi-static process must be adiabatic','Quasi-static describes the manner of change, while reversible also requires no dissipative losses','Quasi-static means constant volume'],a:2,e:'Quasi-static refers to a succession of near-equilibrium states; reversibility requires the additional absence of dissipative effects.'}
];
let i=0,selected=null,checked=false,score=0;const $=id=>document.getElementById(id);
function render(){selected=null;checked=false;$('feedback').textContent='';$('continue').disabled=true;$('continue').textContent=i===14?'Finish Quiz →':'Check Answer →';$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=questions[i].q;$('opts').innerHTML='';questions[i].o.forEach((text,n)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+n)+'. '+text;b.onclick=()=>{if(checked)return;selected=n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('continue').disabled=false};b.dataset.index=n;$('opts').appendChild(b)});$('mastery').textContent=`${i} / 15`;$('fill').style.width=`${i/15*100}%`;$('xp').textContent=`XP: ${score*10}`}
function next(){if(selected===null)return;if(!checked){checked=true;const item=questions[i],ok=selected===item.a;if(ok)score++;document.querySelectorAll('.opt').forEach(b=>{const n=+b.dataset.index;b.disabled=true;if(n===item.a)b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+`<div class="explain">${item.e}</div>`;$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=`${(i+1)/15*100}%`;$('xp').textContent=`XP: ${score*10}`}else if(i<14){i++;render()}else finish()}
function finish(){$('quiz').hidden=true;$('result').hidden=false;const pct=Math.round(score/15*100);$('result').innerHTML=`<h2>🎉 Quasi-static Process Complete!</h2><div class="score">${score} / 15</div><p><strong>${pct}%</strong> accuracy</p><p>🏆 You earned <strong>${score*10} XP</strong>.</p><p>${score>=12?'🔥 Excellent NEET readiness!':score>=9?'💪 Good work. Revise and retry for mastery.':'📚 Revise quasi-static processes and try again.'}</p><button class="continue" type="button" onclick="location.reload()">Retry 15 MCQs</button>`}
$('continue').onclick=next;render();
</script>
