<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🧭 Quasi-static Process</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[{"q":"What is a quasi-static process?","o":["A process that proceeds through states very close to equilibrium","A process that happens only at constant pressure","A process with no heat transfer","A process that always occurs instantly"],"a":0,"e":"It proceeds sufficiently slowly that the system remains nearly in thermodynamic equilibrium at each stage."},{"q":"The term 'quasi-static' most nearly means…","o":["Almost static or very slowly changing","Completely motionless forever","Always at constant temperature","Without any energy"],"a":0,"e":"The system changes slowly through states close to equilibrium."},{"q":"During a quasi-static process, the system passes through…","o":["A sequence of near-equilibrium states","Only non-equilibrium states","One state only","States with no pressure"],"a":0,"e":"Each intermediate state is treated as an equilibrium state to a good approximation."},{"q":"Why is a quasi-static process useful?","o":["It allows pressure and temperature to be defined at each stage","It removes all internal energy","It guarantees zero work","It means no volume change"],"a":0,"e":"Near-equilibrium conditions make thermodynamic variables well-defined throughout the process."},{"q":"A quasi-static process is ideally carried out…","o":["Infinitely slowly","Instantaneously","With a large sudden pressure difference","Only in a vacuum"],"a":0,"e":"The ideal quasi-static limit is infinitely slow, with infinitesimal changes between equilibrium states."},{"q":"Does a quasi-static process necessarily have zero heat transfer?","o":["No","Yes, always","Only for gases","Only at constant volume"],"a":0,"e":"Quasi-static describes how the process proceeds, not whether heat is transferred."},{"q":"Does a quasi-static process necessarily have zero work?","o":["No","Yes, always","Only at constant pressure","Only in a cycle"],"a":0,"e":"Work can be done during a quasi-static process, such as when a gas slowly expands."},{"q":"Which setup best approximates quasi-static expansion?","o":["A piston moving outward very slowly with tiny pressure differences","A piston suddenly removed","A gas released explosively","A container shattered open"],"a":0,"e":"Slow piston motion and tiny pressure differences help the gas remain near equilibrium."},{"q":"For quasi-static compression, the external pressure differs from gas pressure by…","o":["A very small amount in the ideal limit","An infinitely large amount","Exactly zero under all real conditions","An amount unrelated to motion"],"a":0,"e":"Quasi-static compression is approached by applying infinitesimal pressure increments."},{"q":"A quasi-static process is always reversible. Is this correct?","o":["No","Yes, in every case","Only for liquids","Only for isochoric changes"],"a":0,"e":"Friction or other dissipative effects can make a quasi-static process irreversible."},{"q":"Which additional condition is needed for reversibility?","o":["No dissipative effects and no finite gradients","Very high friction","Sudden expansion","Large temperature differences"],"a":0,"e":"Reversibility requires quasi-static progression and absence of dissipative effects."},{"q":"A gas is stirred strongly while compressed slowly. Is it necessarily reversible?","o":["No, stirring can dissipate energy","Yes, because it is slow","Yes, because volume changes","It must be isothermal"],"a":0,"e":"Friction and viscous dissipation can make a slow process irreversible."},{"q":"In a quasi-static process, pressure is generally…","o":["Well-defined at each intermediate state","Undefined at every stage","Always zero","Always atmospheric"],"a":0,"e":"Near-equilibrium states allow pressure to be assigned throughout the process."},{"q":"A quasi-static path on a P–V diagram represents…","o":["A sequence of near-equilibrium pressure-volume states","Only the initial point","Only the final temperature","A path that must be straight"],"a":0,"e":"The curve represents the succession of equilibrium-like states."},{"q":"Work for a quasi-static volume change can be calculated using…","o":["W = ∫ P dV","W = P + V","W = P/V always","W = 0 always"],"a":0,"e":"For a quasi-static volume change, work done by the gas is the integral of pressure with respect to volume."},{"q":"A real quasi-static process takes time. True or false?","o":["True; infinitely slow is an ideal limit","False; it must be instantaneous","False; it cannot occur in nature","True only at constant volume"],"a":0,"e":"Real processes can approximate quasi-static behavior; the perfectly slow limit is idealized."},{"q":"Why is rapid expansion usually not quasi-static?","o":["The gas may pass through non-equilibrium states","The gas has no molecules","Volume cannot change rapidly","Temperature must remain constant"],"a":0,"e":"Rapid changes can create gradients, preventing equilibrium at each stage."},{"q":"Between successive idealized states, the change is…","o":["Infinitesimal","Always enormous","Always a fixed 100 Pa","Unrelated to state"],"a":0,"e":"The ideal path consists of infinitesimally small changes between neighboring states."},{"q":"Which is a state variable relevant to a quasi-static gas process?","o":["Pressure","Path length only","Elapsed time only","Piston name"],"a":0,"e":"Pressure is a state variable that can be defined for each near-equilibrium state."},{"q":"Which statement is correct?","o":["Pressure and volume may change during a quasi-static process","Every variable must remain constant","The system cannot exchange energy","It must return to its initial state"],"a":0,"e":"Quasi-static describes the sequence of states; pressure, volume and temperature may change."},{"q":"A piston moves slowly but has substantial friction. The process is…","o":["Potentially quasi-static, but not reversible","Definitely reversible","Adiabatic by definition","Cyclic by definition"],"a":0,"e":"Friction dissipates energy and prevents reversibility."},{"q":"Which condition best supports quasi-static behavior?","o":["A tiny difference between driving and resisting pressures","A sudden large pressure jump","Strong turbulence","A large temperature gradient"],"a":0,"e":"An infinitesimal driving difference lets the system adjust gradually."},{"q":"Quasi-static describes…","o":["How the system progresses through states","Only the amount of heat transferred","The gas's chemical identity","Only container size"],"a":0,"e":"It refers to progression through near-equilibrium states, not directly to heat transfer."},{"q":"Can a quasi-static process be isothermal?","o":["Yes, if temperature is maintained constant","No, the terms are incompatible","Only when volume is zero","Only when pressure is zero"],"a":0,"e":"A process can be both quasi-static and isothermal."},{"q":"Can a quasi-static process be adiabatic?","o":["Yes, if no heat is exchanged","No, it must absorb heat","Only if pressure stays constant","Only during melting"],"a":0,"e":"Quasi-static and adiabatic describe different features and can apply together."},{"q":"During quasi-static expansion, work done by the gas is generally…","o":["Positive under the usual sign convention","Negative","Always zero","Always infinite"],"a":0,"e":"W = ∫P dV is positive when pressure is positive and volume increases."},{"q":"During quasi-static compression, work done by the gas is generally…","o":["Negative under the usual sign convention","Positive","Always zero","Always equal to heat"],"a":0,"e":"When dV is negative, W = ∫P dV is negative for work done by the gas."},{"q":"What distinguishes quasi-static from reversible?","o":["Quasi-static is near-equilibrium; reversible also requires no dissipative effects","They mean exactly the same thing","Reversible means very fast","Quasi-static requires zero pressure"],"a":0,"e":"Reversibility is a stronger condition than quasi-static behavior."},{"q":"Why can equilibrium be assumed at intermediate stages?","o":["The process is slow enough for the system to adjust","The system has no internal energy","The container is always insulated","Molecules stop moving"],"a":0,"e":"Slow changes let macroscopic properties remain nearly uniform."},{"q":"What is the best summary of a quasi-static process?","o":["A slow succession of near-equilibrium states","A constant-volume process only","A process with no work and no heat","A sudden change between two states"],"a":0,"e":"A quasi-static process follows a well-defined path through states close to thermodynamic equilibrium."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Quasi-static Process Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
