<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Radio Waves</title><meta name="description" content="SkillUp Physics Radio Waves interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">📻</span><h1>Radio Waves</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["Radio waves belong to which type of wave?",["Mechanical waves","Electromagnetic waves","Matter waves only","Sound waves"],1,"Radio waves are electromagnetic radiation."],["Radio waves have which characteristic compared with visible light?",["Shorter wavelength","Longer wavelength","Always higher frequency","Zero speed"],1,"Radio waves generally have much longer wavelengths than visible light."],["Radio waves can propagate through:",["Vacuum","Only water","Only solids","Only the atmosphere"],0,"Like all electromagnetic waves, radio waves can travel through vacuum."],["In vacuum, the speed of radio waves is approximately:",["3×10⁸ m/s","3×10⁶ m/s","3×10⁴ m/s","3×10¹⁰ m/s"],0,"All electromagnetic waves travel at c≈3×10⁸ m/s in vacuum."],["Radio waves are commonly generated by:",["Accelerating charges in antennas","Stationary charges only","Gravity alone","Static magnets only"],0,"Alternating or accelerating charges in antennas can produce radio-frequency electromagnetic radiation."],["Which device is designed to receive radio waves?",["Radio receiver","Thermometer","Barometer","Hydrometer"],0,"A radio receiver detects and processes radio-frequency electromagnetic signals."],["In a radio communication system, the antenna primarily:",["Radiates or receives electromagnetic waves","Creates sound directly in vacuum","Measures temperature","Blocks all frequencies"],0,"An antenna converts electrical signals to electromagnetic radiation and vice versa."],["For an electromagnetic wave, wavelength λ and frequency f are related in vacuum by:",["c=fλ","c=f/λ","c=λ/f","c=f+λ"],0,"The wave relation in vacuum is c=fλ."],["If the frequency of a radio wave increases while it remains in vacuum, its wavelength:",["Increases","Decreases","Remains the same","Becomes zero immediately"],1,"Since λ=c/f, wavelength decreases as frequency increases at constant c."],["Which modulation changes the amplitude of a carrier wave?",["AM","FM","PM only","None"],0,"AM stands for amplitude modulation, in which the carrier amplitude varies with the information signal."],["Which modulation changes the frequency of a carrier wave?",["AM","FM","DC","Rectification"],1,"FM stands for frequency modulation, in which carrier frequency varies with the information signal."],["Long-distance radio communication can use ionospheric reflection especially for:",["Certain lower-frequency radio bands","Only gamma rays","Only visible light","Only X-rays"],0,"Some lower-frequency radio waves can be refracted or reflected by the ionosphere, enabling long-distance propagation."],["Radio waves used for broadcasting generally carry information by varying a property of a:",["Carrier wave","Static charge","Magnetic pole only","Gravitational field"],0,"Information is encoded by modulating a carrier wave."],["A radio wave has frequency 100 MHz. Its wavelength in vacuum is approximately:",["3 m","30 m","0.3 m","300 m"],0,"λ=c/f=3×10⁸/(100×10⁶)=3 m."],["Which statement about radio waves is correct?",["They are electromagnetic and carry energy","They require air to travel","They are slower than light in vacuum","They have no electric field"],0,"Radio waves are electromagnetic radiation, carry energy and travel at c in vacuum."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
