<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Radioactive Decay</title><meta name="description" content="SkillUp Physics Radioactive Decay interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">☢️</span><h1>Radioactive Decay</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["Radioactive decay is best described as:",["A spontaneous transformation of an unstable nucleus","A chemical reaction of electrons","A process that occurs only when heated","A change in atomic mass caused by pressure"],0,"Radioactive decay is a spontaneous nuclear transformation of an unstable nucleus."] ,["The number of undecayed nuclei after time t is given by:",["N=N₀e^(−λt)","N=N₀e^(λt)","N=N₀−λ/t","N=λt/N₀"],0,"The radioactive decay law gives exponential decrease: N=N₀e^(−λt)."] ,["The decay constant λ represents:",["The probability of decay per unit time for an individual nucleus","The number of protons in a nucleus","The half-life itself","The mass number"],0,"λ characterises the probability rate of radioactive decay and has units of inverse time."] ,["The activity of a radioactive sample is:",["The rate of radioactive disintegrations","The total number of nucleons","The atomic number","The binding energy per nucleon"],0,"Activity is the number of nuclear decays occurring per unit time."] ,["The SI unit of radioactive activity is:",["Becquerel","Joule","Electron-volt","Tesla"],0,"One becquerel corresponds to one radioactive disintegration per second."] ,["Activity A is related to the number of undecayed nuclei N by:",["A=λN","A=N/λ","A=λ/N","A=N+λ"],0,"The decay rate is A=λN."] ,["The half-life T₁/₂ of a radioactive substance is related to λ by:",["T₁/₂=ln2/λ","T₁/₂=λ/ln2","T₁/₂=2λ","T₁/₂=1−λ"],0,"Half-life is T₁/₂=ln2/λ, approximately 0.693/λ."] ,["After one half-life, the fraction of original radioactive nuclei remaining is:",["1/2","1/4","1/8","1"],0,"After one half-life, half of the original undecayed nuclei remain."] ,["After two half-lives, the fraction of original nuclei remaining is:",["1/4","1/2","1/8","1/16"],0,"Each half-life halves the remaining amount, so after two half-lives it is (1/2)²=1/4."] ,["The mean life τ of a radioactive nucleus is:",["1/λ","λ","ln2/λ","λ/ln2"],0,"For exponential decay, mean life τ=1/λ."] ,["If λ increases, the half-life of the radionuclide:",["Decreases","Increases","Remains exactly the same","Becomes infinite"],0,"Because T₁/₂=ln2/λ, a larger decay constant gives a shorter half-life."] ,["If the initial number of nuclei is N₀ and three half-lives have passed, the remaining fraction is:",["1/8","1/3","3/4","1/6"],0,"After three half-lives, the remaining fraction is (1/2)³=1/8."] ,["Radioactive decay is called random because:",["The exact decay time of an individual nucleus cannot be predicted","All nuclei decay simultaneously","The decay constant changes randomly for every nucleus","Decay occurs only at random temperatures"],0,"For an individual nucleus, the exact decay time is unpredictable, although the statistical decay law is precise."] ,["During ordinary radioactive decay, the decay constant of a given radionuclide is generally:",["Independent of the amount of sample","Proportional to the sample mass","Equal to the number of nuclei","Changed by the number of half-lives"],0,"For a given radionuclide under ordinary conditions, λ is a characteristic constant and does not depend on sample size."] ,["If a sample has an initial activity of 800 Bq, its activity after three half-lives is:",["100 Bq","200 Bq","400 Bq","50 Bq"],0,"Activity decreases in the same exponential manner as the number of undecayed nuclei: 800/2³=100 Bq."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
