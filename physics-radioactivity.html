<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Radioactivity</title><meta name="description" content="SkillUp Physics Radioactivity interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">☢️</span><h1>Radioactivity</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["Radioactivity is the spontaneous disintegration of:",["Unstable atomic nuclei","Stable electron shells","Molecules only","Photons only"],0,"Radioactivity is the spontaneous transformation of unstable nuclei into more stable configurations."] ,["The three principal types of nuclear radiation are:",["Alpha, beta and gamma","Infrared, visible and ultraviolet","Radio, microwave and X-ray","Proton, electron and neutron only"],0,"The standard radioactive emissions are alpha particles, beta particles and gamma rays."] ,["An alpha particle is a:",["Helium nucleus","Free electron","Photon","Neutron"],0,"An alpha particle contains two protons and two neutrons, identical to a helium-4 nucleus."] ,["The charge of an alpha particle is:",["+2e","−e","0","+e"],0,"Two protons give an alpha particle a charge of +2e."] ,["A beta-minus particle is essentially a:",["High-speed electron","Helium nucleus","Photon","Proton"],0,"In beta-minus decay, a neutron changes into a proton while emitting an electron and an antineutrino."] ,["Gamma radiation consists of:",["High-energy electromagnetic photons","Helium nuclei","Electrons","Neutrons"],0,"Gamma rays are high-energy electromagnetic radiation emitted by excited nuclei."] ,["Among alpha, beta and gamma radiation, the greatest penetrating power is generally shown by:",["Gamma rays","Alpha particles","Beta particles","All are identical"],0,"Gamma radiation is highly penetrating compared with alpha and beta radiation."] ,["Among the three common nuclear radiations, the greatest ionising power is generally associated with:",["Alpha particles","Beta particles","Gamma rays","Visible light"],0,"Alpha particles produce dense ionisation along a short path because of their +2 charge and relatively large mass."] ,["In alpha decay, the mass number A of the parent nucleus decreases by:",["4","2","1","0"],0,"Emission of an alpha particle removes two protons and two neutrons, so A decreases by 4."] ,["In alpha decay, the atomic number Z of the parent nucleus decreases by:",["2","4","1","0"],0,"An alpha particle contains two protons, so Z decreases by 2."] ,["In beta-minus decay, the atomic number of the daughter nucleus:",["Increases by 1","Decreases by 1","Decreases by 2","Does not change"],0,"A neutron converts into a proton, increasing the nuclear atomic number by one while A remains unchanged."] ,["In gamma decay, the atomic number and mass number of the nucleus:",["Both remain unchanged","Both decrease by 1","Both increase by 1","A decreases by 4 and Z by 2"],0,"Gamma emission changes the excitation state of the nucleus but not A or Z."] ,["The radioactive decay law is commonly written as:",["N=N₀e^(−λt)","N=N₀e^(λt)","N=N₀+λt","N=λ/N₀"],0,"The number of undecayed nuclei falls exponentially: N=N₀e^(−λt)."] ,["The half-life of a radioactive sample is the time required for:",["Half the original nuclei to decay","All nuclei to decay","The activity to double","The mass number to halve"],0,"After one half-life, the number of undecayed nuclei is N₀/2."] ,["Activity of a radioactive sample is related to the number of undecayed nuclei by:",["A=λN","A=N/λ","A=λ/N","A=N+λ"],0,"Radioactive activity, the decay rate, is A=λN."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
