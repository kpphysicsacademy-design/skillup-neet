<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🔄 Radius of Gyration</h1><p class="muted">Learn the meaning of radius of gyration, its formulas and applications one step at a time.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{"q":"What does radius of gyration tell us?","o":["How mass is distributed about an axis","The body's temperature","Its linear speed only","Its density only"],"a":0,"e":"Radius of gyration is an effective distance that describes mass distribution about a chosen axis."},
{"q":"The relation between moment of inertia I, mass M and radius of gyration k is:","o":["I = Mk²","I = Mk","I = M/k²","I = k/M"],"a":0,"e":"By definition, I = Mk²."},
{"q":"The formula for radius of gyration is:","o":["k = √(I/M)","k = I/M","k = √(IM)","k = M/I"],"a":0,"e":"Rearranging I = Mk² gives k = √(I/M)."},
{"q":"What is the SI unit of radius of gyration?","o":["metre (m)","kg m²","kilogram (kg)","second (s)"],"a":0,"e":"Radius of gyration is a length, so its SI unit is metre."},
{"q":"The dimensional formula of radius of gyration is:","o":["[L]","[ML²]","[T]","[M]"],"a":0,"e":"It represents a distance, so its dimension is length."},
{"q":"A body has mass 4 kg and I = 16 kg m². Find k.","o":["2 m","4 m","8 m","√2 m"],"a":0,"e":"k = √(I/M) = √(16/4) = 2 m."},
{"q":"A 2 kg body has radius of gyration 3 m. Its moment of inertia is:","o":["18 kg m²","6 kg m²","12 kg m²","9 kg m²"],"a":0,"e":"I = Mk² = 2 × 3² = 18 kg m²."},
{"q":"If moment of inertia becomes four times while mass stays the same, k becomes:","o":["Twice","Four times","Half","Unchanged"],"a":0,"e":"Since k = √(I/M), multiplying I by four doubles k."},
{"q":"If mass becomes four times while I stays constant, k becomes:","o":["Half","Twice","Four times","Unchanged"],"a":0,"e":"k = √(I/M), so four times the mass makes k half as large."},
{"q":"For a thin ring about its central axis, I = MR². Its radius of gyration is:","o":["R","R/√2","R/2","2R"],"a":0,"e":"k = √(I/M) = √(MR²/M) = R."},
{"q":"For a uniform disc about its central axis, I = ½MR². Its radius of gyration is:","o":["R/√2","R","R/2","√2R"],"a":0,"e":"k = √(I/M) = √(R²/2) = R/√2."},
{"q":"For a uniform rod of length L about its centre and perpendicular to its length, I = ML²/12. Then k is:","o":["L/√12","L/3","L/2","L/√3"],"a":0,"e":"k = √(I/M) = √(L²/12) = L/√12."},
{"q":"For a uniform rod about one end, I = ML²/3. Its radius of gyration is:","o":["L/√3","L/3","L/2","L/√12"],"a":0,"e":"k = √(I/M) = L/√3."},
{"q":"For a solid sphere about a diameter, I = ⅖MR². Its radius of gyration is:","o":["R√(2/5)","R/√2","R/2","R√(5/2)"],"a":0,"e":"k = √(I/M) = R√(2/5)."},
{"q":"Two bodies have equal mass. The one with larger radius of gyration has:","o":["Larger moment of inertia about that axis","Smaller moment of inertia always","Zero moment of inertia","Same moment of inertia always"],"a":0,"e":"Since I = Mk², for the same mass a larger k means larger I."},
{"q":"Radius of gyration is measured relative to:","o":["A specified axis of rotation","Only the body's geometric centre","The North direction","The body's velocity"],"a":0,"e":"Both moment of inertia and radius of gyration depend on the selected axis."},
{"q":"If all mass were imagined concentrated at distance k from the axis, it would have:","o":["The same moment of inertia","The same shape","The same density distribution","Zero angular momentum"],"a":0,"e":"That equivalent concentration is the defining idea of radius of gyration."},
{"q":"A body's I is 50 kg m² and mass is 2 kg. Find k.","o":["5 m","25 m","10 m","√50 m"],"a":0,"e":"k = √(50/2) = √25 = 5 m."},
{"q":"A body has I = 9 kg m² and k = 1.5 m. Find its mass.","o":["4 kg","6 kg","9 kg","13.5 kg"],"a":0,"e":"M = I/k² = 9/2.25 = 4 kg."},
{"q":"The radius of gyration of a system of particles of equal masses is related to their distances rᵢ by:","o":["k = √(Σrᵢ²/n)","k = Σrᵢ/n","k = √(Σrᵢ/n)","k = n/Σrᵢ²"],"a":0,"e":"For equal masses, k is the root-mean-square distance from the axis."},
{"q":"For unequal point masses, k² is:","o":["Σmᵢrᵢ² / Σmᵢ","Σmᵢrᵢ / Σmᵢ","Σrᵢ² / Σmᵢ","Σmᵢ / Σrᵢ²"],"a":0,"e":"Using I = Σmᵢrᵢ² and k² = I/M gives the mass-weighted mean of r²."},
{"q":"A body is shifted to a parallel axis a distance d away from its centre-of-mass axis. Its radius of gyration about the new axis satisfies:","o":["k² = kcm² + d²","k² = kcm² − d²","k = kcm + d","k² = d² − kcm²"],"a":0,"e":"From the parallel-axis theorem, I = Icm + Md²; dividing by M gives k² = kcm² + d²."},
{"q":"If kcm = 3 m and the parallel axis is 4 m away, the new k is:","o":["5 m","7 m","1 m","√7 m"],"a":0,"e":"k = √(kcm² + d²) = √(9 + 16) = 5 m."},
{"q":"For a fixed body and fixed axis, radius of gyration depends on:","o":["Its mass distribution relative to the axis","Its colour","Its angular speed only","Its orientation in a photograph"],"a":0,"e":"The effective distance is determined by how the mass lies relative to that axis."},
{"q":"For a uniform disc, if its radius doubles and mass remains the same, k about its central axis:","o":["Doubles","Quadruples","Halves","Stays constant"],"a":0,"e":"For a disc k = R/√2, so k scales directly with R."},
{"q":"If both mass and moment of inertia double, radius of gyration:","o":["Stays the same","Doubles","Halves","Becomes four times"],"a":0,"e":"The ratio I/M is unchanged, so k = √(I/M) remains unchanged."},
{"q":"Which statement about radius of gyration is correct?","o":["It has dimensions of length","It has dimensions of area","It is measured in kg m²","It is always equal to the body's outer radius"],"a":0,"e":"Radius of gyration is a length and need not equal the body's physical radius."},
{"q":"A ring and disc have the same M and R. Their central-axis radii of gyration are:","o":["Ring: R; disc: R/√2","Ring: R/√2; disc: R","Both R/2","Both R"],"a":0,"e":"For a ring k = R, while for a uniform disc k = R/√2."},
{"q":"Why is radius of gyration useful?","o":["It summarizes mass distribution in one length value","It gives angular speed directly","It replaces mass in every equation","It gives the body's density directly"],"a":0,"e":"It provides a compact way to compare how spread out mass is about a chosen axis."},
{"q":"If a body has I = 12 kg m² and M = 3 kg, its radius of gyration is:","o":["2 m","4 m","6 m","√12 m"],"a":0,"e":"k = √(12/3) = √4 = 2 m."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Radius of Gyration Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
