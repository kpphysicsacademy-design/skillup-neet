<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Reactance</title><meta name="description" content="SkillUp Physics Reactance interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">⚡</span><h1>Reactance</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["Reactance is the opposition offered by an AC circuit element to:",["DC only","AC current","Electric charge","Magnetic flux"],1,"Reactance is the frequency-dependent opposition to alternating current."],["The SI unit of reactance is:",["Henry","Farad","Ohm","Watt"],2,"Reactance is measured in ohms (Ω)."],["Inductive reactance is given by:",["X_L=1/(ωL)","X_L=ωL","X_L=L/ω","X_L=ω/L"],1,"For an inductor, X_L=ωL=2πfL."],["Capacitive reactance is given by:",["X_C=ωC","X_C=C/ω","X_C=1/(ωC)","X_C=ω/C"],2,"For a capacitor, X_C=1/(ωC)=1/(2πfC)."],["As frequency increases, inductive reactance:",["Decreases","Increases","Becomes zero","Remains constant"],1,"X_L=2πfL, so inductive reactance increases with frequency."],["As frequency increases, capacitive reactance:",["Increases","Decreases","Remains constant","Becomes infinite at all frequencies"],1,"X_C=1/(2πfC), so it decreases as frequency increases."],["At zero frequency (DC), the ideal inductive reactance is:",["Zero","Infinite","1 Ω","L"],0,"X_L=2πfL, so an ideal inductor has zero reactance at DC."],["At zero frequency (DC), the ideal capacitive reactance is:",["Zero","Infinite","1 Ω","C"],1,"X_C=1/(2πfC), which tends to infinity as f approaches zero."],["An inductor of 0.1 H is connected to 50 Hz AC. Its reactance is approximately:",["3.14 Ω","31.4 Ω","314 Ω","0.314 Ω"],1,"X_L=2πfL=2π×50×0.1≈31.4 Ω."],["A capacitor of 100 μF is connected to 50 Hz AC. Its reactance is approximately:",["3.18 Ω","31.8 Ω","318 Ω","0.318 Ω"],1,"X_C=1/(2π×50×100×10⁻⁶)≈31.8 Ω."],["In a purely inductive AC circuit, current lags voltage by:",["0°","45°","90°","180°"],2,"For a pure inductor, current lags voltage by 90°."],["In a purely capacitive AC circuit, current:",["Lags voltage by 90°","Leads voltage by 90°","Is in phase with voltage","Opposes voltage by 180°"],1,"For a pure capacitor, current leads voltage by 90°."],["In an ideal resistor, reactance is:",["Zero","R","Infinite","1/R"],0,"An ideal resistor has no reactance; its impedance is purely resistive."],["If frequency is doubled while L remains constant, X_L becomes:",["Half","Double","Four times","Unchanged"],1,"X_L is directly proportional to frequency."],["If frequency is doubled while C remains constant, X_C becomes:",["Double","Four times","Half","Unchanged"],2,"X_C is inversely proportional to frequency."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="✓ Correct — "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="✗ Not quite — "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;i++;if(i<qs.length)render();else{$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`;$("fill").style.width="100%"}}function restart(){i=0;score=0;xp=0;$("quiz").hidden=false;$("result").hidden=true;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
