<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Reduced Mass</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-size:1.6rem;font-weight:900}.subtitle{color:#5f6b7a;margin:0 0 18px}.xp,.card{background:#fff;border-radius:20px;box-shadow:0 6px 20px #17203312}.xp{padding:10px 15px;font-weight:850}.card{padding:20px;margin:12px 0}.ph{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:11px;background:#dfe8f1;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.25s}.qnum{font-weight:800;color:#35516f;margin-bottom:11px}.question{font-size:1.27rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#58cc02;background:#f7fff1;transform:translateY(-1px)}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;background:#2db84d;color:#fff;font-weight:850;cursor:pointer;box-shadow:0 4px 0 #21863a;transition:.12s}.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #21863a}.feedback{margin-top:14px;padding:12px;border-radius:13px;font-weight:700;min-height:18px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:10px;padding:10px 13px;border:2px solid #d9d4f5;border-radius:13px;color:#5146a5;font-weight:800;text-decoration:none;transition:.12s}.back:hover{background:#f0edff;transform:translateX(-2px)}@media(max-width:600px){.wrap{padding:20px 14px}.title{font-size:1.4rem}.question{font-size:1.12rem}}</style></head><body><main class="wrap"><div class="top"><div class="title">⚖️ Reduced Mass</div><div class="xp">⚡ <span id="xp">0</span> XP</div></div><p class="subtitle">Physics • NEET 2026 · Learn → Practice → Master</p><section class="card"><div class="ph"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><button class="btn" id="continue">Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const quiz=[['The reduced mass of two particles m₁ and m₂ is:', ['m₁m₂/(m₁+m₂)','m₁+m₂','m₁m₂','(m₁+m₂)/(m₁m₂)'],0,'The reduced mass is μ = m₁m₂/(m₁+m₂).'],['The SI unit of reduced mass is:', ['kg','N','J','m/s'],0,'Reduced mass has the same dimension and unit as mass: kilogram.'],['If m₁ = m₂ = m, the reduced mass is:', ['m/2','m','2m','m²'],0,'μ = m²/(2m) = m/2.'],['If one mass is much larger than the other, the reduced mass is approximately:', ['the smaller mass','the larger mass','the sum of the masses','zero'],0,'When m₂ ≫ m₁, μ approaches m₁.'],['For two particles separated by relative coordinate r, the relative motion can be treated as:', ['one particle of reduced mass μ','a particle of mass m₁+m₂ only','a massless particle','two independent reduced masses'],0,'The two-body problem separates into CM motion and relative motion with reduced mass.'],['For m₁ = 2 kg and m₂ = 3 kg, the reduced mass is:', ['1.2 kg','5 kg','6 kg','0.5 kg'],0,'μ = (2×3)/(2+3) = 6/5 = 1.2 kg.'],['The reduced mass is always:', ['less than or equal to the smaller mass','greater than both masses','equal to the larger mass','equal to the sum'],0,'For positive masses, μ is smaller than the smaller mass.'],['For equal masses, the reduced mass compared with either individual mass is:', ['half','double','equal','four times'],0,'For m₁ = m₂ = m, μ = m/2.'],['The two-body kinetic energy associated with relative motion can be written as:', ['½μv_rel²','½(m₁+m₂)v_rel²','μv_rel','½μa²'],0,'Relative kinetic energy uses the reduced mass: K_rel = ½μv_rel².'],['Reduced mass is particularly useful in studying:', ['two-body relative motion','only one-dimensional uniform motion','temperature of a gas','electrical resistance'],0,'It simplifies two-body dynamics by replacing relative motion with an effective particle.'],['If m₁ is doubled while m₂ is fixed, the reduced mass:', ['changes according to μ = m₁m₂/(m₁+m₂)','always doubles','always becomes zero','remains exactly unchanged'],0,'The reduced mass depends on both masses through the defining expression.'],['For m₁ = 4 kg and m₂ = 4 kg, μ equals:', ['2 kg','4 kg','8 kg','1 kg'],0,'μ = 16/8 = 2 kg.'],['The centre-of-mass coordinate and relative coordinate in a two-body system are:', ['useful for separating the motion','always identical','both zero','independent of mass values'],0,'These coordinates separate the two-body problem into CM and relative parts.'],['For two positive masses, the reduced mass approaches the smaller mass when:', ['the other mass becomes very large','both masses become zero','the smaller mass becomes infinite','the masses become negative'],0,'Taking one mass much larger makes μ tend toward the smaller mass.'],['If m₁ = 1 kg and m₂ = 1 kg, the reduced mass is:', ['0.5 kg','1 kg','2 kg','0.25 kg'],0,'μ = 1×1/(1+1) = 0.5 kg.']];let i=0,selected=-1,checked=false,score=0;const $=id=>document.getElementById(id),o=$("options"),b=$("continue"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;$("count").textContent='Question '+(i+1)+' of 15';$("question").textContent=a[0];o.innerHTML='';f.className='feedback';f.textContent='';b.style.display='inline-block';b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const el=document.createElement('button');el.className='option';el.textContent=String.fromCharCode(65+j)+'. '+item.text;el.dataset.index=item.index;el.onclick=()=>{selected=item.index;[...o.children].forEach(z=>z.classList.remove('selected'));el.classList.add('selected')};o.appendChild(el)})}b.onclick=()=>{if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(el=>{const n=Number(el.dataset.index);el.disabled=true;if(n===a[2])el.classList.add('correct');if(n===selected&&!ok)el.classList.add('wrong')});if(ok)score++;f.className=ok?'feedback good':'feedback bad';f.textContent=(ok?'🎯 Correct! +10 XP — ':'✗ Review — Correct answer: '+a[1][a[2]]+'. ')+a[3];$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$("question").textContent='🏆 Reduced Mass Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
