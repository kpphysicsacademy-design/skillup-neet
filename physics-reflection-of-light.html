<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Reflection of Light</title><meta name="description" content="SkillUp Physics Reflection of Light interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🪞</span><h1>Reflection of Light</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["Reflection of light is the phenomenon in which light:",["Returns into the same medium after striking a surface","Changes into sound","Stops permanently at a surface","Always passes through a surface"],0,"Reflection is the return of light into the same medium after it strikes a reflecting surface."] ,["The ray that falls on a reflecting surface is called the:",["Incident ray","Reflected ray","Normal ray","Refracted ray"],0,"The incident ray is the incoming ray that strikes the reflecting surface."] ,["The ray that returns from the reflecting surface is called the:",["Reflected ray","Incident ray","Normal","Refracted ray"],0,"The reflected ray is the ray that travels away from the surface after reflection."] ,["The perpendicular drawn to the reflecting surface at the point of incidence is called the:",["Normal","Incident ray","Reflected ray","Tangent"],0,"The normal is perpendicular to the reflecting surface at the point of incidence."] ,["According to the first law of reflection:",["The incident ray, reflected ray and normal lie in the same plane","The incident ray is always parallel to the mirror","The reflected ray is always perpendicular to the incident ray","Light travels only in a straight line after reflection"],0,"The incident ray, reflected ray and normal at the point of incidence lie in one plane."] ,["According to the second law of reflection:",["Angle of incidence equals angle of reflection","Angle of incidence is always zero","Angle of reflection is always twice the incidence angle","Both angles are measured from the mirror surface"],0,"The law of reflection states that the angle of incidence equals the angle of reflection."] ,["The angle of incidence is measured between the incident ray and the:",["Normal","Mirror surface","Reflected ray","Principal axis"],0,"Angles of incidence and reflection are measured with respect to the normal, not the mirror surface."] ,["If the angle of incidence is 30°, the angle of reflection is:",["30°","60°","90°","15°"],0,"By the law of reflection, the angle of reflection equals the angle of incidence."] ,["If a ray strikes a plane mirror normally, the angle of incidence is:",["0°","30°","45°","90°"],0,"A ray along the normal makes zero angle with the normal, so its angle of incidence is 0°."] ,["For a plane mirror, the image formed is generally:",["Virtual and erect","Real and inverted","Virtual and inverted","Real and erect"],0,"A plane mirror forms a virtual, erect image of the object."] ,["In a plane mirror, the image is formed:",["At the same distance behind the mirror as the object is in front","Closer to the mirror than the object by half","At the mirror surface","At twice the object distance behind the mirror"],0,"The image distance behind a plane mirror equals the object distance in front of it."] ,["The image formed by a plane mirror has the same size as the:",["Object","Mirror only","Normal","Reflected ray"],0,"A plane mirror produces an image equal in size to the object."] ,["The left-right reversal seen in a plane mirror is called:",["Lateral inversion","Dispersion","Diffraction","Polarisation"],0,"Lateral inversion is the apparent reversal of left and right in a plane-mirror image."] ,["A smooth, polished surface produces mainly:",["Regular reflection","Diffuse reflection","No reflection","Only refraction"],0,"A smooth surface gives regular or specular reflection, with reflected rays remaining orderly."] ,["A rough surface can still obey the law of reflection, but it produces:",["Diffuse reflection","No reflection","Only total internal reflection","Only absorption"],0,"Each small portion of a rough surface obeys the reflection law, but the different surface orientations scatter reflected rays in many directions."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
