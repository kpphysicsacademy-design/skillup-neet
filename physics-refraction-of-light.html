<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Refraction of Light</title><meta name="description" content="SkillUp Physics Refraction of Light interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">💧</span><h1>Refraction of Light</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["Refraction of light is the change in direction of light when it:",["Passes obliquely from one transparent medium to another","Travels only through vacuum","Is absorbed completely","Becomes sound"],0,"Refraction occurs when light passes from one transparent medium to another and its speed changes."] ,["When light enters a denser optical medium from a rarer medium obliquely, it generally bends:",["Towards the normal","Away from the normal","Along the surface always","Without changing direction always"],0,"On entering a medium of higher refractive index, light slows down and bends towards the normal."] ,["When light travels from a denser medium to a rarer medium obliquely, it generally bends:",["Away from the normal","Towards the normal","Along the normal only","Back into the source"],0,"On entering a lower-index medium, the speed increases and the ray bends away from the normal."] ,["The refractive index of a medium is related to the speed of light by:",["n=c/v","n=v/c","n=cv","n=c+v"],0,"The absolute refractive index is n=c/v, where c is the speed of light in vacuum and v is its speed in the medium."] ,["According to Snell's law for two media:",["n₁ sin i = n₂ sin r","n₁ cos i = n₂ cos r","n₁+n₂=sin i","n₁r=n₂i"],0,"Snell's law can be written as n₁ sin i = n₂ sin r for refraction between two media."] ,["The angle of incidence in refraction is measured between the incident ray and the:",["Normal","Surface","Refracted ray","Principal axis"],0,"The angle of incidence is measured from the normal to the interface at the point of incidence."] ,["If light enters glass from air, its speed in glass is generally:",["Less than its speed in air","Greater than its speed in air","Equal to infinity","Zero in every case"],0,"Glass has a higher refractive index than air, so light travels more slowly in glass."] ,["When a ray passes normally from one transparent medium to another, its direction:",["Does not change, although its speed may change","Always changes by 90°","Reverses completely","Becomes zero"],0,"At normal incidence the ray follows the normal, so there is no angular deviation even though the speed can change."] ,["The refractive index of vacuum is:",["1","0","∞","9.8"],0,"By definition, the refractive index of vacuum is 1."] ,["If the refractive index of a medium is 1.5, the speed of light in it is approximately:",["2×10⁸ m/s","3×10⁸ m/s","4.5×10⁸ m/s","1.5×10⁸ m/s"],0,"Using v=c/n, v=(3×10⁸)/1.5=2×10⁸ m/s."] ,["When light passes from glass to air, the refracted ray bends away from the normal because:",["Its speed increases","Its speed decreases","Its frequency becomes zero","Its wavelength becomes zero"],0,"Light speeds up when it enters the lower-index air medium, causing the ray to bend away from the normal."] ,["During refraction from one transparent medium to another, the frequency of light generally:",["Remains unchanged","Becomes zero","Always doubles","Always becomes half"],0,"The frequency is fixed by the source; at a boundary the speed and wavelength change while frequency remains the same."] ,["During refraction, if the speed of light decreases while frequency remains constant, the wavelength:",["Decreases","Increases","Remains unchanged","Becomes infinite"],0,"From v=fλ, if frequency remains constant and speed decreases, wavelength also decreases."] ,["A medium with a higher refractive index is optically:",["Denser","Rarer","Empty","Perfectly reflecting"],0,"Optical density is associated with refractive index; a higher n corresponds to greater reduction in light speed."] ,["Which statement about refraction is correct?",["Light changes speed and usually changes direction at an oblique boundary","Light always stops at the boundary","Frequency must always change at the boundary","Refraction can occur only in mirrors"],0,"Refraction involves a change in propagation speed across media; at oblique incidence the direction generally changes as well."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
