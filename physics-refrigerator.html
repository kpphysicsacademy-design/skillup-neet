<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Refrigerator</title><style>
body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00}@media(max-width:600px){.wrap{padding:12px}.card{padding:18px;border-radius:18px}h1{font-size:26px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>❄️ Refrigerator</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>
const qs=[
['A refrigerator is a device that transfers heat from','a colder region to a hotter region','a hotter region to a colder region without work','vacuum to a cold region','work to mass',0,'A refrigerator uses external work to transfer heat from a low-temperature reservoir to a high-temperature reservoir.'],
['A refrigerator requires','no energy input','external work input','only gravitational energy','zero temperature',1,'External work is required to move heat from the cold reservoir to the hot reservoir.'],
['The coefficient of performance (COP) of a refrigerator is defined as','W/Qc','Qc/W','Qh/W','W/Qh',1,'For a refrigerator, COP = Qc/W, where Qc is heat removed from the cold space and W is work input.'],
['For a refrigerator, the desired effect is','heat rejected to surroundings','heat removed from the cold reservoir','work supplied to compressor','increase in entropy only',1,'The useful effect of a refrigerator is removal of heat from the low-temperature space.'],
['For a refrigerator operating cyclically, the energy relation is','Qh=Qc−W','Qh=Qc+W','Qc=Qh+W','W=Qh+Qc',1,'Energy conservation gives Qh = Qc + W.'],
['If a refrigerator removes 600 J of heat from its cold space using 200 J of work, its COP is','2','3','4','5',1,'COP = Qc/W = 600/200 = 3.'],
['If a refrigerator has COP = 4 and consumes 100 J of work, heat removed from the cold reservoir is','25 J','100 J','400 J','500 J',2,'Qc = COP × W = 4 × 100 = 400 J.'],
['For the same temperature limits, a reversible refrigerator has','the minimum possible COP','the maximum possible COP','zero COP','COP exactly equal to 1 always',1,'A reversible refrigerator provides the maximum COP possible between fixed reservoir temperatures.'],
['The COP of a Carnot refrigerator operating between Tc and Th is','Tc/(Th−Tc)','Th/(Th−Tc)','(Th−Tc)/Tc','Tc/Th',0,'For a Carnot refrigerator, COP = Tc/(Th−Tc), with absolute temperatures.'],
['A refrigerator operates between 270 K and 300 K. Its Carnot COP is','3','6','9','10',2,'COP = 270/(300−270) = 270/30 = 9.'],
['In the refrigerator COP formula, temperatures must be expressed in','Celsius','Fahrenheit','kelvin','any arbitrary scale',2,'Thermodynamic temperature in kelvin must be used in the Carnot COP expression.'],
['The compressor in a vapor-compression refrigerator primarily','supplies work and raises refrigerant pressure','removes heat from the room without work','creates cold from nothing','reduces refrigerant pressure only',0,'The compressor consumes work to compress the refrigerant and raise its pressure and temperature.'],
['The condenser of a refrigerator primarily','absorbs heat from the refrigerated space','rejects heat to the surroundings','does mechanical work','reduces entropy to zero',1,'The condenser rejects heat to the surroundings after the refrigerant releases energy.'],
['The evaporator in a refrigerator primarily','rejects heat to the room','absorbs heat from the refrigerated space','supplies all compressor work','increases room temperature directly',1,'The evaporator absorbs heat from the low-temperature refrigerated space.'],
['If the temperature difference between the hot and cold reservoirs increases, the Carnot refrigerator COP generally','increases','decreases','remains unchanged','becomes infinite',1,'COP = Tc/(Th−Tc); increasing the temperature difference increases the denominator and lowers COP.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});if(ok){score++;$('xp').textContent='✨ Correct! +1 XP'}else $('xp').textContent='❌ Incorrect. '+q[6];$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
