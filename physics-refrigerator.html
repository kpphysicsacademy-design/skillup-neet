<style>

:root{--green:#58cc02;--green-dark:#46a302;--blue:#1cb0f6;--ink:#243447;--muted:#64748b;--line:#dce6ef;--bg:#f3f9ff;--red:#ff4b4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.nav{max-width:720px;margin:auto;min-height:58px;padding:9px 14px;display:flex;align-items:center;gap:10px}
.back{display:grid;place-items:center;width:40px;height:40px;border:2px solid var(--line);border-radius:13px;background:#f2f9ff;color:#174a78;text-decoration:none;font-size:20px}
.brand{font-weight:950;color:#174a78}.brand small{display:block;font-size:9px;letter-spacing:.8px;color:var(--muted)}
.xp{margin-left:auto;background:#fff4cf;border:1px solid #f4df9a;border-radius:99px;padding:7px 10px;font-weight:900;font-size:13px}
main{max-width:720px;margin:auto;padding:18px 13px 48px}
.hero,.quiz,.finish{background:#fff;border:2px solid #e2edf7;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 #dce8f3}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#174a78}.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}
.progress-row{display:flex;justify-content:space-between;gap:10px;margin:16px 0 7px;font-size:12px;font-weight:900;color:var(--muted)}
.track{height:11px;border-radius:99px;background:#e2edf7;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}
.qmeta{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.4px}
.question{font-size:clamp(20px,4.5vw,26px);line-height:1.35;margin:12px 0 18px;font-weight:850}
.options{display:grid;gap:10px}.option{display:flex;gap:11px;align-items:center;width:100%;min-height:51px;padding:12px;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}
.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Mobile header refinement: keep branding, XP and streak on one balanced row */
.nav{display:flex;align-items:center;gap:10px;min-height:72px;padding:10px 14px}
.back{flex:0 0 42px;width:42px;height:42px}
.brand{flex:1 1 auto;min-width:0;line-height:1.1;white-space:nowrap;font-size:clamp(16px,4.5vw,20px)}
.brand small{margin-top:4px;font-size:9px;line-height:1.25;letter-spacing:.7px;white-space:normal}

.streak{padding:9px 11px;font-size:12px}
@media(max-width:480px){
  .nav{gap:7px;padding:9px 10px;min-height:68px}
  .back{flex-basis:40px;width:40px;height:40px}
  .brand{font-size:17px}
  .brand small{font-size:8px;letter-spacing:.55px}
  .xp{padding:8px 9px;font-size:12px}
  .streak{padding:8px 9px;font-size:11px;max-width:none}
}
@media(max-width:360px){
  .nav{gap:5px;padding-inline:7px}
  .back{flex-basis:36px;width:36px;height:36px}
  .brand{font-size:15px}

  .xp{padding:7px;font-size:11px}
  .streak{padding:7px;font-size:10px}
}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🌡️ Refrigerator</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[{"q":"What is the main purpose of a refrigerator?","o":["To move heat from a colder region to a warmer surrounding","To create cold without energy transfer","To convert all heat into work","To move heat spontaneously from hot to cold"],"a":0,"e":"A refrigerator removes heat from a cold space and releases it to warmer surroundings using external work."},{"q":"A refrigerator requires which energy input to transfer heat from cold to hot?","o":["External work","No energy","Only gravitational energy","A temperature difference alone"],"a":0,"e":"Work is needed to move heat against its natural direction."},{"q":"The coefficient of performance (COP) of a refrigerator is…","o":["W/Qc","Qc/W","Qh/W","W/Qh"],"a":1,"e":"Refrigerator COP = heat removed from the cold space divided by work input."},{"q":"For a refrigerator, energy conservation gives the work input as…","o":["W = Qh + Qc","W = Qh − Qc","W = Qc − Qh","W = Qh/Qc"],"a":1,"e":"The hot side receives Qh = Qc + W, so W = Qh − Qc."},{"q":"A refrigerator removes 300 J of heat and uses 100 J of work. Its COP is…","o":["0.33","3","4","300"],"a":1,"e":"COP = Qc/W = 300/100 = 3."},{"q":"If a refrigerator removes 600 J from its cold space and rejects 900 J to the room, work input is…","o":["100 J","300 J","600 J","1,500 J"],"a":1,"e":"W = Qh − Qc = 900 − 600 = 300 J."},{"q":"Which component of a refrigerator absorbs heat from the refrigerated space?","o":["Evaporator","Condenser","Compressor only","Expansion valve only"],"a":0,"e":"The refrigerant evaporates in the evaporator, absorbing heat from the cold space."},{"q":"Which component releases heat to the room?","o":["Evaporator","Condenser","Freezer compartment","Thermostat only"],"a":1,"e":"The condenser releases heat to the surrounding room."},{"q":"What does the compressor do in a typical vapor-compression refrigerator?","o":["Raises refrigerant pressure and helps circulate it","Removes all heat without work","Keeps refrigerant pressure at zero","Stops all phase changes"],"a":0,"e":"The compressor uses work to raise the refrigerant's pressure and temperature."},{"q":"Why does the back of a refrigerator feel warm during operation?","o":["It rejects heat taken from inside plus the work supplied","It creates heat without input","It absorbs heat from the room only","It has no heat exchange"],"a":0,"e":"The condenser releases Qh = Qc + W to the surroundings."},{"q":"Can a refrigerator have a COP greater than 1?","o":["Yes","No, COP is an efficiency percentage","Only if no work is used","Only if Qc is zero"],"a":0,"e":"COP is a ratio of heat moved to work input, so it can exceed one."},{"q":"Is refrigerator COP the same as thermal efficiency of a heat engine?","o":["Yes, always","No; COP measures heat moved per work input","COP is always less than zero","Efficiency has no relation to energy"],"a":1,"e":"A refrigerator's COP is useful heat removed divided by work input, not work output divided by heat input."},{"q":"The ideal Carnot refrigerator COP between cold temperature Tc and hot temperature Th is…","o":["Tc/(Th − Tc)","Th/(Th − Tc)","1 − Tc/Th","(Th − Tc)/Tc"],"a":0,"e":"For absolute temperatures, COPR = Tc/(Th − Tc)."},{"q":"In the Carnot refrigerator formula, temperatures must be in…","o":["Kelvin","Celsius only","Fahrenheit","Any scale"],"a":0,"e":"The formula requires absolute temperatures in kelvin."},{"q":"A Carnot refrigerator operates between 270 K and 300 K. Its COP is…","o":["0.9","3","9","10"],"a":2,"e":"COP = 270/(300 − 270) = 270/30 = 9."},{"q":"If the room temperature rises while the refrigerator's cold-space temperature stays fixed, ideal COP…","o":["Increases","Decreases","Stays unchanged","Becomes infinite"],"a":1,"e":"A larger temperature difference increases the denominator Th − Tc, reducing COP."},{"q":"If the refrigerated space gets closer in temperature to the room, ideal COP…","o":["Increases","Decreases","Becomes zero","Must equal one"],"a":0,"e":"As Th − Tc gets smaller, COP = Tc/(Th − Tc) increases."},{"q":"Why can a refrigerator not cool a room by leaving its door open while running?","o":["It rejects more heat to the room than it removes from the room","It removes heat and work with no output","It stops all energy transfer","It violates conservation of mass"],"a":0,"e":"The room receives the removed heat plus compressor work, so the net effect warms the room."},{"q":"What is the sign of work input for a refrigerator when expressed as energy supplied to the device?","o":["Positive input","Always negative input","Zero","Undefined"],"a":0,"e":"Work is supplied to drive the refrigerator."},{"q":"For a refrigerator operating in a cycle, the working fluid's net internal-energy change is…","o":["Zero","Positive every cycle","Negative every cycle","Equal to Qc"],"a":0,"e":"After a complete cycle, the working fluid returns to its initial state, so ΔU = 0."},{"q":"A refrigerator removes 400 J and has COP = 4. Required work is…","o":["25 J","100 J","400 J","1,600 J"],"a":1,"e":"COP = Qc/W, so W = 400/4 = 100 J."},{"q":"If work input is 200 J and COP is 2.5, heat removed is…","o":["80 J","200 J","500 J","700 J"],"a":2,"e":"Qc = COP × W = 2.5 × 200 = 500 J."},{"q":"Which statement follows from the second law?","o":["Heat cannot spontaneously flow from cold to hot without work","Heat always flows from cold to hot spontaneously","A refrigerator needs no energy","All refrigerators have 100% efficiency"],"a":0,"e":"Moving heat from a colder space to warmer surroundings requires external work."},{"q":"What is the relationship between heat rejected and heat removed in a refrigerator?","o":["Qh = Qc − W","Qh = Qc + W","Qc = Qh + W","Qh = W/Qc"],"a":1,"e":"The rejected heat equals the heat removed plus the work input."},{"q":"Which change can improve the practical performance of a refrigerator?","o":["Reducing heat leaks into the cold compartment","Increasing the temperature difference unnecessarily","Leaving the door open","Blocking condenser airflow"],"a":0,"e":"Reducing heat gain and allowing good heat rejection lowers the required cooling load."},{"q":"Why is refrigerant useful in a vapor-compression refrigerator?","o":["It can absorb and release heat as it changes phase","It permanently destroys heat","It prevents all pressure changes","It makes work input unnecessary"],"a":0,"e":"Evaporation absorbs heat and condensation releases it, supporting heat transfer."},{"q":"The evaporator is normally at a lower temperature than the condenser because…","o":["Heat is absorbed inside and rejected to warmer surroundings","The compressor removes temperature from the room","Pressure must be zero in the evaporator","No refrigerant flows through the condenser"],"a":0,"e":"The refrigerant absorbs heat at low temperature and rejects it at higher temperature."},{"q":"If Qh = 1,000 J and Qc = 700 J per cycle, the refrigerator's work input is…","o":["300 J","700 J","1,000 J","1,700 J"],"a":0,"e":"W = Qh − Qc = 1,000 − 700 = 300 J."},{"q":"If the same refrigerator removes 700 J with 300 J work input, COP is approximately…","o":["0.43","2.33","3.33","7"],"a":1,"e":"COP = 700/300 ≈ 2.33."},{"q":"Which is the best description of refrigerator COP?","o":["Heat removed from the cold space per unit work input","Work output per heat input","Heat rejected per unit temperature","Energy created per cycle"],"a":0,"e":"COPR = Qc/Win; a higher COP means more cooling for the same work input."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Refrigerator Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
