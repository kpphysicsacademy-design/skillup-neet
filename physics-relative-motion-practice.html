(function(){
const Q=[
["Relative velocity of A with respect to B is:",["vA + vB","vA − vB","vB − vA always","vA × vB"],1,"vAB = vA − vB. The observer's velocity is subtracted from the object's velocity."],
["Two cars move east at 20 and 12 m/s. Velocity of the first relative to the second:",["8 m/s east","32 m/s east","8 m/s west","0"],0,"Same direction: 20 − 12 = 8 m/s east."],
["Two runners move in opposite directions at 5 and 7 m/s. Relative speed:",["2 m/s","5 m/s","7 m/s","12 m/s"],3,"Opposite directions: add the speeds, 5 + 7 = 12 m/s."],
["A boat moves north at 4 m/s; current flows north at 2 m/s. Ground speed:",["2 m/s north","4 m/s north","6 m/s north","8 m/s north"],2,"Same direction: 4 + 2 = 6 m/s north."],
["A boat moves north at 4 m/s; current flows south at 2 m/s. Ground velocity:",["6 m/s north","2 m/s north","2 m/s south","6 m/s south"],1,"Opposing velocities subtract: 4 − 2 = 2 m/s north."],
["Two objects have identical velocity vectors. Their relative velocity is:",["Zero","Their sum","Doubled","Infinite"],0,"Equal velocity vectors have a zero vector difference."],
["A train moves east at 10 m/s. A passenger walks east at 1.5 m/s relative to train. Ground speed:",["8.5","10","11.5","15"],2,"Same direction: 10 + 1.5 = 11.5 m/s."],
["A train moves east at 10 m/s. A passenger walks west at 1.5 m/s relative to train. Ground velocity:",["11.5 east","8.5 east","8.5 west","10 west"],1,"Take east positive: 10 − 1.5 = 8.5 m/s east."],
["A and B have velocities +8 and −3 m/s. vAB equals:",["5","11","−11","−5"],1,"vAB = 8 − (−3) = 11 m/s."],
["Two cars move in the same direction at 25 and 20 m/s. Relative speed:",["5","20","25","45"],0,"Same-direction relative speed is 25 − 20 = 5 m/s."],
["Two cars approach each other at 15 and 10 m/s. Closing speed:",["5","10","15","25"],3,"Opposite directions while approaching: 15 + 10 = 25 m/s."],
["A plane flies east at 200 km/h; wind blows west at 50 km/h. Ground velocity:",["150 east","250 east","150 west","250 west"],0,"The wind opposes the plane: 200 − 50 = 150 km/h east."],
["A swimmer moves north at 3 m/s; current flows east at 4 m/s. Ground speed:",["1","4","5","7"],2,"Perpendicular components: √(3² + 4²) = 5 m/s."],
["For north 3 m/s and east 4 m/s components, direction is:",["37° north of east","37° east of north","53° north of east","Due north"],0,"tan θ = 3/4, so θ ≈ 37° north of east."],
["Rain falls vertically at 10 m/s; a person runs horizontally at 10 m/s. Apparent rain angle from vertical:",["0°","45°","90°","30°"],1,"Equal perpendicular relative components give 45°."],
["If vAB = 0, then:",["Both are at rest","Their velocity vectors are equal","They move oppositely","Both speeds are zero"],1,"Zero relative velocity means equal velocity vectors."],
["Trains move east at 30 m/s and west at 20 m/s. Relative speed:",["10","20","30","50"],3,"Opposite directions: 30 + 20 = 50 m/s."],
["A moves east at 6 m/s and B east at 2 m/s. Velocity of B relative to A:",["4 east","4 west","8 east","8 west"],1,"vBA = 2 − 6 = −4 m/s, i.e. 4 m/s west."],
["Boat speed in still water is 8 km/h; current 3 km/h. Downstream speed:",["5","8","11","24"],2,"Downstream speeds add: 8 + 3 = 11 km/h."],
["Boat speed in still water is 8 km/h; current 3 km/h. Upstream speed:",["3","5","8","11"],1,"Upstream speeds subtract: 8 − 3 = 5 km/h."],
["A person walks forward at 2 m/s inside a bus. This is velocity relative to:",["Road","Bus","Earth's centre","Another bus"],1,"The stated walking speed is relative to the bus."],
["Particles move at +9 and +4 m/s. Relative velocity of first w.r.t. second:",["13","5","−5","−13"],1,"9 − 4 = 5 m/s."],
["Objects move at +4 and −6 m/s. Relative velocity of first w.r.t. second:",["−2","2","10","−10"],2,"4 − (−6) = 10 m/s."],
["Plane airspeed is 180 km/h east; wind is 20 km/h east. Ground speed:",["160","180","200","360"],2,"Same direction: 180 + 20 = 200 km/h."],
["A person walks west at 3 m/s on a train moving west at 15 m/s. Ground speed:",["12 west","15 west","18 west","3 east"],2,"Both westward velocities add: 15 + 3 = 18 m/s west."],
["Two vehicles move in opposite directions at 12 m/s each. Relative speed:",["0","6","12","24"],3,"Opposite directions: 12 + 12 = 24 m/s."],
["A swimmer aims across a river; current carries them downstream. Path relative to shore:",["Straight across","Diagonal downstream","Upstream","Vertical"],1,"The across-river and downstream components combine into a diagonal path."],
["Relative velocity is a vector because:",["It has magnitude only","It is a difference of velocity vectors","It is always positive","It has no direction"],1,"Vector subtraction produces a vector with magnitude and direction."],
["A car at 18 m/s catches a cyclist at 6 m/s. Initial gap 60 m. Catch-up time:",["3 s","5 s","10 s","12 s"],1,"Relative speed = 12 m/s; time = 60/12 = 5 s."],
["Two cyclists 100 m apart move towards each other at 4 and 6 m/s. Meeting time:",["5 s","10 s","15 s","25 s"],1,"Closing speed = 10 m/s; time = 100/10 = 10 s."]
];

function render(){chosen=-1;locked=false;let q=Q[i];$('count').textContent='Question '+(i+1)+' of '+Q.length;$('pct').textContent=Math.round(i/Q.length*100)+'%';$('fill').style.width=(i/Q.length*100)+'%';$('number').textContent='QUESTION '+(i+1);$('score').textContent=score+' correct';$('question').textContent=q[0];$('feedback').className='feedback';$('feedback').textContent='';$('check').hidden=false;$('check').disabled=true;$('next').hidden=true;$('options').replaceChildren();q[1].forEach((o,j)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+o;b.onclick=()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;};$('options').appendChild(b);});}
$('check').onclick=()=>{if(chosen<0||locked)return;locked=true;let q=Q[i],buttons=[...document.querySelectorAll('.option')];buttons.forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');});let f=$('feedback');if(chosen===q[2]){score++;f.className='feedback show good';f.textContent='Correct! '+q[3];}else{wrong.push(i);buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Review: '+q[3]+' Correct answer: '+q[1][q[2]]+'.';}$('score').textContent=score+' correct';$('check').hidden=true;$('next').hidden=false;};
$('next').onclick=()=>{i++;if(i<Q.length){render();return;}$('quiz').hidden=true;$('fill').style.width='100%';$('pct').textContent='100%';$('count').textContent='Practice complete';let pct=Math.round(score/Q.length*100);let review=wrong.length?'<h3>Review incorrect questions</h3>'+wrong.map(n=>'<p><b>Q'+(n+1)+':</b> '+Q[n][0]+'<br><span class="muted">'+Q[n][3]+'</span></p>').join(''):'<p>Perfect run — no incorrect answers.</p>';$('finish').hidden=false;$('finish').innerHTML='<h2>🏆 Practice complete</h2><div class="score">'+score+' / '+Q.length+'</div><p>'+pct+'% correct</p>'+review+'<button class="btn" id="retry">Try again</button>';$('retry').onclick=()=>{i=0;score=0;wrong=[];$('finish').hidden=true;$('quiz').hidden=false;render();};const key='skillup-physics-relative-motion-pages-v1';let s={learn:false,sim:false,practice:true};try{s=Object.assign(s,JSON.parse(localStorage.getItem(key)||'{}'));}catch(e){}s.practice=true;try{localStorage.setItem(key,JSON.stringify(s));}catch(e){}draw();};
function draw(){let s={learn:false,sim:false,practice:false};try{s=Object.assign(s,JSON.parse(localStorage.getItem('skillup-physics-relative-motion-pages-v1')||'{}'));}catch(e){}$('pageProgress').textContent='Progress: '+['learn','sim','practice'].filter(k=>s[k]).length+'/3 pages completed';}
draw();render();
})();
