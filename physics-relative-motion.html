<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Relative Motion</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eef7ff;color:#173b62}.wrap{max-width:1050px;margin:auto;padding:20px}.topbar{display:flex;justify-content:space-between}.skill,.hero,.quiz,.panel,.mastery{background:#fff;border-radius:20px;padding:22px;margin:12px 0;box-shadow:0 6px 18px #123b7015}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #dbe7f1;border-radius:15px;background:#fff;text-align:left;font-weight:700;cursor:pointer}.option.selected{border-color:#1677ff;background:#eef6ff}.option.correct{border-color:#2db84d;background:#eaffef}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{padding:12px 18px;border:0;border-radius:13px;font-weight:900;cursor:pointer;margin:8px 6px 0 0}.check{background:#2db84d;color:#fff}.next{background:#dcecff;color:#145b9e}.feedback{margin-top:14px;padding:13px;border-radius:14px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.bar{height:13px;background:#dce8f2;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#42c95a}@media(max-width:750px){.layout{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="topbar"><a href="physics-home.html">← Back to Physics Path</a><span class="skill">⚡ <span id="xp">0</span> XP</span></div><section class="hero"><div>PHYSICS • NEET 2026</div><h1>Relative Motion</h1><p>LEARN → PRACTICE → MASTER • 15 focused NEET-style MCQs</p></section><section class="mastery"><b>🎯 Skill Mastery <span id="mt">0 / 15</span></b><div class="bar"><div id="fill" class="fill"></div></div></section><div class="layout"><aside class="panel"><h3 id="count">Question 1 of 15</h3><div id="pct">7%</div><div>Relative Motion</div><div>⚡ +10 XP each</div><div>🦉 Learn → Practice → Master</div></aside><section class="quiz"><b id="badge">Q1</b><h2 id="q"></h2><div id="opts" class="options"></div><button id="check" class="btn check">Check Answer</button><button id="next" class="btn next" disabled>Next Question →</button><div id="fb" class="feedback"></div><p>💡 Choose the best answer.</p></section></div></main><script>(function(){const quiz=[['Relative velocity of A with respect to B is',['vA + vB','vA − vB','vB − vA only','vA/vB'],1],['If two objects move in the same direction with speeds 20 m/s and 12 m/s, the relative speed of the faster object with respect to the slower one is',['8 m/s','12 m/s','20 m/s','32 m/s'],0],['If two objects move toward each other with speeds 15 m/s and 10 m/s, their relative speed is',['5 m/s','10 m/s','25 m/s','150 m/s'],2],['A passenger walks forward inside a train moving at 20 m/s. If the passenger walks at 2 m/s relative to the train, their speed relative to the ground is',['18 m/s','20 m/s','22 m/s','40 m/s'],2],['For two bodies moving with equal velocities, their relative velocity is',['Equal to their velocity','Zero','Twice their velocity','Infinite'],1],['A train moves east at 25 m/s while another train moves east at 15 m/s. Velocity of the first relative to the second is',['10 m/s east','10 m/s west','40 m/s east','40 m/s west'],0],['A car moves east at 10 m/s and another moves west at 10 m/s. Relative velocity of the first car with respect to the second is',['0','10 m/s east','20 m/s east','20 m/s west'],2],['If vAB is velocity of A relative to B, then vBA is',['vAB','−vAB','2vAB','vAB/2'],1],['A person walks at 5 m/s north relative to a boat moving at 12 m/s east. The person’s ground velocity has components',['12 m/s east and 5 m/s north','5 m/s east and 12 m/s north','17 m/s north','7 m/s east'],0],['For the situation in which two particles have perpendicular velocities 3 m/s and 4 m/s, the magnitude of their relative velocity can be',['1 m/s','5 m/s','7 m/s','12 m/s'],1],['A swimmer swims at 4 m/s relative to water. If the river current is 3 m/s in the same direction, the swimmer’s ground speed is',['1 m/s','3 m/s','4 m/s','7 m/s'],3],['If the swimmer in the previous case swims upstream at 4 m/s while current is 3 m/s downstream, the ground speed is',['1 m/s upstream','1 m/s downstream','7 m/s upstream','7 m/s downstream'],0],['Relative motion is important because motion is described with respect to',['A chosen reference frame','Only the Sun','Only the Earth','No reference frame'],0],['A person in a uniformly moving train sees a tree outside moving backward. This is explained by',['Relative motion','Newton’s third law only','Gravitation','Electrostatics'],0],['If A is at rest relative to B, then',['vAB=0','vAB is maximum','vAB is infinite','vAB equals acceleration'],0]];let i=0,sel=-1,score=0,q=document.getElementById('q'),o=document.getElementById('opts'),fb=document.getElementById('fb'),check=document.getElementById('check'),next=document.getElementById('next');function render(){let a=quiz[i];sel=-1;q.textContent=a[0];document.getElementById('badge').textContent='Q'+(i+1);document.getElementById('count').textContent='Question '+(i+1)+' of '+quiz.length;document.getElementById('pct').textContent=Math.round((i+1)/quiz.length*100)+'%';o.innerHTML='';fb.textContent='';fb.className='feedback';check.disabled=false;next.disabled=true;a[1].forEach((v,j)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+v;b.onclick=()=>{sel=j;[...o.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)})}check.onclick=()=>{if(sel<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}let a=quiz[i];[...o.children].forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===sel&&j!==a[2])b.classList.add('wrong')});if(sel===a[2]){score++;fb.className='feedback good';fb.textContent='🎯 Correct! +10 XP'}else{fb.className='feedback bad';fb.textContent='Not quite. Correct answer: '+a[1][a[2]]}document.getElementById('xp').textContent=score*10;document.getElementById('mt').textContent=score+' / '+quiz.length;document.getElementById('fill').style.width=score/quiz.length*100+'%';check.disabled=true;next.disabled=false;if(i===quiz.length-1)next.textContent='Finish Skill →'};next.onclick=()=>{if(i<quiz.length-1){i++;next.textContent='Next Question →';render()}else{q.textContent='🏆 Relative Motion Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+score+' / '+quiz.length+' correct • '+score*10+' XP'}};render()})();</script></body></html>
