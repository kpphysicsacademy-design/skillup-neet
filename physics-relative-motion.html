<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Relative Motion • NEET Physics</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:flex-end;align-items:center}.xp{background:#fff;border:1px solid #dfe3ea;border-radius:14px;padding:7px 11px;font-weight:850;white-space:nowrap}.intro{margin:24px 0 18px}.intro h1{margin:0 0 8px;font-size:2rem;line-height:1.15}.intro p{margin:0;color:#596273;line-height:1.55}.progress{height:12px;background:#e4e7ed;border-radius:99px;overflow:hidden;margin:20px 0}.fill{height:100%;width:0;background:#58cc02;transition:width .25s ease}.card{background:#fff;border-radius:22px;padding:26px;box-shadow:0 8px 24px rgba(23,32,51,.08)}.meta{font-size:.95rem;font-weight:800;color:#596273;margin-bottom:12px}.q{font-size:1.3rem;font-weight:750;line-height:1.45;margin:0 0 20px}.options{display:grid;gap:10px}.option{padding:15px 16px;border:2px solid #dfe3ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;color:#172033;cursor:pointer;transition:border-color .15s,background .15s,transform .1s,box-shadow .15s}.option:hover:not(:disabled){border-color:#58cc02;background:#f5fff0;transform:translateY(-1px);box-shadow:0 3px 0 #dfe3ea}.option.selected{border-color:#5146a5;background:#f1efff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#ff4b4b;background:#fff0f0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{padding:12px 18px;border:0;border-radius:13px;font:inherit;font-weight:850;cursor:pointer}.check,.retry{background:#58cc02;color:#fff}.next{background:#5146a5;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:16px;min-height:24px;font-weight:750;line-height:1.5}.good{color:#177b2f}.bad{color:#b02a37}.hint{margin:18px 0 0;color:#596273;font-size:.95rem}.result{display:none;text-align:center;margin-top:20px;padding-top:18px;border-top:1px solid #e5e7eb}.result h2{margin:0 0 8px}.bottom-nav{margin-top:20px;text-align:center}.back{display:inline-block;color:#5146a5;font-weight:800;text-decoration:none;padding:9px 12px;border-radius:12px;transition:transform .15s,background .15s,box-shadow .15s}.back:hover{background:#eeeaff;transform:translateX(-2px);box-shadow:0 4px 12px rgba(81,70,165,.12)}.back:focus-visible{outline:3px solid #b9b0ff;outline-offset:2px}.back:active{transform:translateX(-1px) scale(.98)}@media(max-width:600px){.wrap{padding:20px 14px}.intro h1{font-size:1.65rem}.card{padding:20px}.q{font-size:1.15rem}}</style></head><body><main class="wrap"><div class="top"><span class="xp">⚡ <span id="xp">0</span> XP</span></div><section class="intro"><h1>🔄 Relative Motion</h1><p>Master relative velocity, reference frames and motion between moving objects with 15 focused NEET-style MCQs.</p></section><div class="progress" aria-label="Quiz progress"><div id="fill" class="fill"></div></div><section class="card"><div class="meta"><span id="count">Question 1 of 15</span> • <span id="pct">7%</span></div><h2 id="q" class="q"></h2><div id="opts" class="options"></div><div class="actions"><button id="check" class="btn check" type="button">Check Answer</button><button id="next" class="btn next" type="button" disabled>Next Question →</button></div><div id="fb" class="feedback" aria-live="polite"></div><p class="hint">💡 Choose the best answer.</p><div id="result" class="result"><h2>🏆 Skill Complete!</h2><p id="score"></p><button id="retry" class="btn retry" type="button">Retry Skill</button></div></section><div class="bottom-nav"><a class="back" href="#" onclick="return goBackToPhysicsPath()">← Back to Physics Path</a></div></main><script>(function(){const KEY='skillupLastPhysicsPath';function rememberPath(){try{const r=document.referrer;if(!r)return;const u=new URL(r);if(u.origin!==location.origin)return;if(/(?:physics|full-physics)[^/]*path[^/]*\.html$/i.test(u.pathname)||/\/physics-home\.html$/i.test(u.pathname))sessionStorage.setItem(KEY,u.href)}catch(e){}}function goBackToPhysicsPath(){try{const saved=sessionStorage.getItem(KEY);if(saved){const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}}catch(e){}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false}window.goBackToPhysicsPath=goBackToPhysicsPath;rememberPath();const quiz=[['Relative velocity of A with respect to B is:',['vA + vB','vA − vB','vB − vA only','vA/vB'],1,'Relative velocity of A with respect to B is vA − vB.'],['If two objects move in the same direction with speeds 20 m/s and 12 m/s, the relative speed of the faster object with respect to the slower one is:',['8 m/s','12 m/s','20 m/s','32 m/s'],0,'For motion in the same direction, relative speed is the difference: 20 − 12 = 8 m/s.'],['If two objects move toward each other with speeds 15 m/s and 10 m/s, their relative speed is:',['5 m/s','10 m/s','25 m/s','150 m/s'],2,'For objects approaching each other, relative speed is the sum: 15 + 10 = 25 m/s.'],['A passenger walks forward inside a train moving at 20 m/s. If the passenger walks at 2 m/s relative to the train, their speed relative to the ground is:',['18 m/s','20 m/s','22 m/s','40 m/s'],2,'In the same direction, ground speed is 20 + 2 = 22 m/s.'],['For two bodies moving with equal velocities, their relative velocity is:',['Equal to their velocity','Zero','Twice their velocity','Infinite'],1,'Equal velocities give zero relative velocity.'],['A train moves east at 25 m/s while another train moves east at 15 m/s. Velocity of the first relative to the second is:',['10 m/s east','10 m/s west','40 m/s east','40 m/s west'],0,'v12 = 25 − 15 = 10 m/s east.'],['A car moves east at 10 m/s and another moves west at 10 m/s. Relative velocity of the first car with respect to the second is:',['0','10 m/s east','20 m/s east','20 m/s west'],2,'Taking east as positive, vrel = 10 − (−10) = 20 m/s east.'],['If vAB is velocity of A relative to B, then vBA is:',['vAB','−vAB','2vAB','vAB/2'],1,'Interchanging the reference objects reverses the relative velocity: vBA = −vAB.'],['A person walks at 5 m/s north relative to a boat moving at 12 m/s east. The person’s ground velocity has components:',['12 m/s east and 5 m/s north','5 m/s east and 12 m/s north','17 m/s north','7 m/s east'],0,'Velocity components add vectorially: 12 m/s east and 5 m/s north.'],['For two particles with perpendicular velocities 3 m/s and 4 m/s, the magnitude of their relative velocity can be:',['1 m/s','5 m/s','7 m/s','12 m/s'],1,'For perpendicular relative components, magnitude = √(3² + 4²) = 5 m/s.'],['A swimmer swims at 4 m/s relative to water. If the river current is 3 m/s in the same direction, the swimmer’s ground speed is:',['1 m/s','3 m/s','4 m/s','7 m/s'],3,'Same-direction velocities add: 4 + 3 = 7 m/s.'],['If the swimmer swims upstream at 4 m/s while current is 3 m/s downstream, the ground speed is:',['1 m/s upstream','1 m/s downstream','7 m/s upstream','7 m/s downstream'],0,'The upstream swimming speed exceeds the downstream current by 1 m/s, so the result is 1 m/s upstream.'],['Relative motion is important because motion is described with respect to:',['A chosen reference frame','Only the Sun','Only the Earth','No reference frame'],0,'Position and motion are described relative to a chosen reference frame.'],['A person in a uniformly moving train sees a tree outside moving backward. This is explained by:',['Relative motion','Newton’s third law only','Gravitation','Electrostatics'],0,'The tree appears to move backward because of relative motion between the train and tree.'],['If A is at rest relative to B, then:',['vAB = 0','vAB is maximum','vAB is infinite','vAB equals acceleration'],0,'If A is at rest relative to B, their relative velocity is zero.']];let i=0,sel=-1,score=0,locked=false;const $=id=>document.getElementById(id),q=$('q'),o=$('opts'),fb=$('fb'),check=$('check'),next=$('next'),xp=$('xp'),fill=$('fill'),count=$('count'),pct=$('pct');function render(){const a=quiz[i];sel=-1;locked=false;q.textContent=a[0];count.textContent='Question '+(i+1)+' of '+quiz.length;pct.textContent=Math.round((i+1)/quiz.length*100)+'%';fill.style.width=(score/quiz.length*100)+'%';fb.className='feedback';fb.textContent='';check.disabled=false;next.disabled=true;next.textContent='Next Question →';o.innerHTML='';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{if(locked)return;sel=item.index;Array.from(o.children).forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)})}check.onclick=function(){if(sel<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}locked=true;const a=quiz[i],ok=sel===a[2];Array.from(o.children).forEach(b=>{const originalIndex=Number(b.dataset.index);b.disabled=true;if(originalIndex===a[2])b.classList.add('correct');if(originalIndex===sel&&!ok)b.classList.add('wrong')});if(ok){score++;fb.className='feedback good';fb.textContent='🎯 Correct! '+a[3]+' +10 XP'}else{fb.className='feedback bad';fb.textContent='Not quite. Correct answer: '+a[1][a[2]]+' — '+a[3]}xp.textContent=score*10;fill.style.width=(score/quiz.length*100)+'%';check.disabled=true;next.disabled=false;if(i===quiz.length-1)next.textContent='Finish Skill →'};next.onclick=function(){if(i<quiz.length-1){i++;render()}else{q.textContent='🏆 Relative Motion Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+score+' / '+quiz.length+' correct • '+score*10+' XP';$('result').style.display='block';$('score').textContent=score+' / '+quiz.length+' correct • '+score*10+' XP'}};$('retry').onclick=()=>{i=0;sel=-1;score=0;locked=false;xp.textContent='0';$('result').style.display='none';check.style.display='';next.style.display='';render()};render()})();</script></body></html>
