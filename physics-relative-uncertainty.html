<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Relative Uncertainty</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.xp{font-weight:800}.card{background:white;border-radius:22px;padding:24px;margin-top:18px;box-shadow:0 5px 20px #00000012}.bar{height:10px;background:#e8eaf0;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.3s}.q{font-size:1.3rem;font-weight:750;line-height:1.45}.opts{display:grid;gap:10px;margin-top:18px}.opts button{padding:15px;border:2px solid #e2e5eb;border-radius:14px;background:white;text-align:left;font-size:1rem;cursor:pointer;transition:.2s}.opts button:hover{border-color:#58cc02;transform:translateY(-1px)}.opts button.selected{border-color:#58cc02;background:#f3fff0}.opts button.correct{border-color:#58cc02;background:#eaffef}.opts button.wrong{border-color:#e5484d;background:#fff0f0}.feedback{font-weight:700;margin-top:16px;min-height:24px}.btn{margin-top:18px;padding:13px 22px;border:0;border-radius:14px;background:#58cc02;color:white;font-weight:800;cursor:pointer;transition:.2s;box-shadow:0 4px 0 #45a800}.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #45a800}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #45a800}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}.back{display:inline-flex;align-items:center;gap:7px;margin-top:20px;padding:12px 18px;border:2px solid #5146a5;border-radius:14px;background:white;color:#5146a5;font-weight:800;text-decoration:none;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,background .2s,color .2s}.back:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#eeeaff,transparent);transform:translateX(-120%);transition:transform .5s}.back:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 6px 18px #5146a533;background:#faf9ff;color:#40378d}.back:hover:before{transform:translateX(120%)}.back:active{transform:translateY(1px) scale(.99);box-shadow:0 2px 8px #5146a522}.back:focus-visible{outline:3px solid #c9c3ff;outline-offset:3px}@media(max-width:600px){.wrap{padding:18px 12px}.card{padding:18px}.q{font-size:1.15rem}.top{align-items:flex-start}.back{width:max-content}}</style></head><body><main class="wrap"><div class="top"><h1>📊 Relative Uncertainty</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></div><p>Master relative uncertainty, percentage uncertainty and uncertainty propagation with 15 NEET-style questions.</p><section class="card"><div style="display:flex;justify-content:space-between;gap:12px"><strong>🎯 Skill Mastery</strong><strong id="masteryText">0 / 15</strong></div><div class="bar" style="margin-top:8px"><div id="fill" class="fill"></div></div></section><section class="card"><div id="count"></div><p id="question" class="q"></p><div id="options" class="opts"></div><button id="check" class="btn" disabled>Check Answer</button><button id="next" class="btn" disabled>Continue →</button><div id="feedback" class="feedback"></div><p>💡 <span id="hint">Choose the best answer.</span></p><div id="result" style="display:none;text-align:center"><h2>🎉 Relative Uncertainty mastered!</h2><p id="score"></p><button id="retry" class="btn">Retry Skill</button></div></section><a class="back" href="physics-home.html" aria-label="Back to Physics Path">← <span>Back to Physics Path</span></a></main><script>const qs=[['What is relative uncertainty?',['Absolute uncertainty divided by the measured value','The measured value plus uncertainty','The least count of an instrument','The true value of a quantity'],0,'Relative uncertainty is the ratio of absolute uncertainty to the measured value.'],['Relative uncertainty is generally:',['Dimensionless','Measured in metres','Measured in seconds','Always expressed in kilograms'],0,'It is a ratio, so the units cancel.'],['Relative uncertainty is often written as:',['Δx/x','x/Δx','x+Δx','x−Δx'],0,'For measured quantity x with absolute uncertainty Δx, relative uncertainty is Δx/x.'],['For x = 10.0 ± 0.2 m, the relative uncertainty is:',['0.02','0.2','2','20'],0,'Δx/x = 0.2/10.0 = 0.02.'],['The percentage uncertainty for 10.0 ± 0.2 m is:',['2%','0.2%','20%','0.02%'],0,'Percentage uncertainty = (0.2/10.0) × 100 = 2%.'],['For 5.0 ± 0.1 cm, the relative uncertainty is:',['0.02','0.2','2','0.05'],0,'0.1/5.0 = 0.02.'],['Which measurement has the smaller relative uncertainty?',['100 ± 1 cm','10 ± 1 cm','Both','Cannot compare'],0,'1/100 = 0.01, smaller than 1/10 = 0.1.'],['If absolute uncertainty remains the same while the measured value increases, relative uncertainty generally:',['Decreases','Increases','Becomes infinite','Becomes equal to one'],0,'For fixed Δx, the ratio Δx/x decreases as x increases.'],['If x = 2.0 ± 0.1 s, the percentage uncertainty is:',['5%','0.5%','2%','10%'],0,'(0.1/2.0) × 100 = 5%.'],['For a quantity measured as 50 ± 2, the relative uncertainty is:',['0.04','0.4','4','25'],0,'2/50 = 0.04.'],['Which statement is correct about relative uncertainty?',['It allows uncertainties of different-sized measurements to be compared','It always has the same unit as the measurement','It is always larger than absolute uncertainty','It is the true value'],0,'A dimensionless ratio makes relative uncertainty useful for comparison.'],['For z = A + B, absolute uncertainty is usually combined using:',['ΔA + ΔB','ΔA − ΔB','ΔAΔB','ΔA/ΔB'],0,'For maximum-error addition, absolute uncertainties add.'],['For z = AB, relative uncertainties are combined using:',['ΔA/A + ΔB/B','ΔA + ΔB','A/B','AB'],0,'For maximum-error products, fractional uncertainties add.'],['For z = A/B, the maximum fractional uncertainty is:',['ΔA/A + ΔB/B','ΔA/A − ΔB/B','A/B','ΔAΔB'],0,'For division, fractional uncertainties add in the maximum-error method.'],['Which statement best distinguishes absolute and relative uncertainty?',['Absolute uncertainty has the same units as the quantity; relative uncertainty is dimensionless','Both are always dimensionless','Relative uncertainty always has the same unit as the quantity','Absolute uncertainty is always a percentage'],0,'Absolute uncertainty carries units, while relative uncertainty is a dimensionless ratio.']];let i=0,selected=-1,score=0,answered=0;const $=id=>document.getElementById(id);function progress(){answered=Math.max(answered,i+1);$('masteryText').textContent=answered+' / '+qs.length;$('fill').style.width=(answered*100/qs.length)+'%'}function render(){const a=qs[i];selected=-1;$('count').textContent=`Question ${i+1} of ${qs.length}`;$('question').textContent=a[0];$('options').innerHTML='';$('feedback').textContent='';$('hint').textContent='Choose the best answer.';$('check').disabled=true;$('next').disabled=true;$('next').textContent='Continue →';a[1].forEach((t,j)=>{const b=document.createElement('button');b.textContent=`${String.fromCharCode(65+j)}. ${t}`;b.onclick=()=>{selected=j;[...$('options').children].forEach((x,k)=>x.classList.toggle('selected',k===j));$('check').disabled=false};$('options').appendChild(b)})}function checkAnswer(){if(selected<0)return;const a=qs[i],ok=selected===a[2];[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=ok?'✅ Correct! +10 XP — '+a[3]:'❌ Not quite. Correct answer: '+a[1][a[2]]+' — '+a[3];if(ok){score++;$('xp').textContent=score*10}progress();$('check').disabled=true;$('next').disabled=false;if(i===qs.length-1)$('next').textContent='Finish →'}function finish(){$('question').textContent='🎉 Skill complete!';$('options').innerHTML='';$('check').style.display='none';$('next').style.display='none';$('feedback').textContent=`You scored ${score} / ${qs.length} • ${score*10} XP`;$('hint').textContent=score===15?'Excellent! Perfect relative uncertainty mastery.':'Keep practicing and try again to improve your score.';$('result').style.display='block';$('score').textContent=`${score} / ${qs.length} correct`;answered=15;progress();$('fill').style.width='100%'}$('check').onclick=checkAnswer;$('next').onclick=()=>{if(i<qs.length-1){i++;render()}else finish()};$('retry').onclick=()=>{i=0;selected=-1;score=0;answered=0;$('xp').textContent='0';$('result').style.display='none';$('check').style.display='inline-block';$('next').style.display='inline-block';progress();render()};progress();render();</script></body></html>
