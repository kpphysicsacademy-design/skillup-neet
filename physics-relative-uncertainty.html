<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Relative Uncertainty</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;line-height:1.45}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.opt:disabled{cursor:default}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{font-weight:700;color:#e08a00;text-align:center;min-height:24px;line-height:1.5}.explanation{margin-top:14px;padding:12px 14px;border-radius:12px;background:#f1f6ff;font-size:14px;line-height:1.5}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>📊 Relative Uncertainty</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home.html">← Back to Physics Path</a></div></div><script>const qs=[['What is relative uncertainty?','Absolute uncertainty divided by the measured value','The measured value plus uncertainty','The least count of an instrument','The true value of a quantity',0,'Relative uncertainty is the ratio of absolute uncertainty to the measured value: Δx/x.'],['Relative uncertainty is generally:','Dimensionless','Measured in metres','Measured in seconds','Always expressed in kilograms',0,'It is a ratio, so the units cancel and the result is dimensionless.'],['Relative uncertainty is often written as:','Δx/x','x/Δx','x+Δx','x−Δx',0,'For measured quantity x with absolute uncertainty Δx, relative uncertainty is Δx/x.'],['For x = 10.0 ± 0.2 m, the relative uncertainty is:','0.02','0.2','2','20',0,'Δx/x = 0.2/10.0 = 0.02.'],['The percentage uncertainty for 10.0 ± 0.2 m is:','2%','0.2%','20%','0.02%',0,'Percentage uncertainty = (Δx/x) × 100 = (0.2/10.0) × 100 = 2%.'],['For 5.0 ± 0.1 cm, the relative uncertainty is:','0.02','0.2','2','0.05',0,'Relative uncertainty = 0.1/5.0 = 0.02.'],['Which measurement has the smaller relative uncertainty?','100 ± 1 cm','10 ± 1 cm','Both','Cannot compare',0,'For 100 ± 1 cm, relative uncertainty is 1/100 = 0.01; for 10 ± 1 cm it is 0.1.'],['If absolute uncertainty remains the same while the measured value increases, relative uncertainty generally:','Decreases','Increases','Becomes infinite','Becomes equal to one',0,'For fixed Δx, the ratio Δx/x decreases as x increases.'],['If x = 2.0 ± 0.1 s, the percentage uncertainty is:','5%','0.5%','2%','10%',0,'Percentage uncertainty = (0.1/2.0) × 100 = 5%.'],['For a quantity measured as 50 ± 2, the relative uncertainty is:','0.04','0.4','4','25',0,'Relative uncertainty = 2/50 = 0.04.'],['Which statement is correct about relative uncertainty?','It allows uncertainties of different-sized measurements to be compared','It always has the same unit as the measurement','It is always larger than absolute uncertainty','It is the true value',0,'Because it is dimensionless, relative uncertainty is useful for comparing measurement quality.'],['For z = A + B, absolute uncertainty is usually combined using:','ΔA + ΔB','ΔA − ΔB','ΔAΔB','ΔA/ΔB',0,'For maximum-error addition, absolute uncertainties are added: Δz = ΔA + ΔB.'],['For z = AB, relative uncertainties are combined using:','ΔA/A + ΔB/B','ΔA + ΔB','A/B','AB',0,'For maximum-error products, fractional uncertainties add.'],['For z = A/B, the maximum fractional uncertainty is:','ΔA/A + ΔB/B','ΔA/A − ΔB/B','A/B','ΔAΔB',0,'For division, fractional uncertainties add in the maximum-error method.'],['Which statement best distinguishes absolute and relative uncertainty?','Absolute uncertainty has the same units as the quantity; relative uncertainty is dimensionless','Both are always dimensionless','Relative uncertainty always has the same unit as the quantity','Absolute uncertainty is always a percentage',0,'Absolute uncertainty carries the units of the measured quantity, while relative uncertainty is a dimensionless ratio.']];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;$('xp').textContent='';const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide')}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').innerHTML=ok?'✨ Correct! +1 XP':'❌ Incorrect';$('xp').insertAdjacentHTML('beforeend',`<div class="explanation"><b>Correct answer:</b> ${q[q[5]+1]}<br>💡 ${q[6]}</div>`);if(ok)score++;$('score').textContent=`XP ${score}`;$('fill').style.width=`${(i+1)/15*100}%`;$('next').classList.remove('hide')}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><p style="text-align:center">XP earned: <b>${score}</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('next').onclick=next;render();</script></body></html>
