<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}

main{max-width:720px;margin:auto;padding:18px 13px 48px}
.hero,.quiz,.finish{background:#fff;border:2px solid #e2edf7;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 #dce8f3}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#174a78}.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}
.progress-row{display:flex;justify-content:space-between;gap:10px;margin:16px 0 7px;font-size:12px;font-weight:900;color:var(--muted)}
.track{height:11px;border-radius:99px;background:#e2edf7;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}
.qmeta{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.4px}
.question{font-size:clamp(20px,4.5vw,26px);line-height:1.35;margin:12px 0 18px;font-weight:850}
.options{display:grid;gap:10px}.option{display:flex;gap:11px;align-items:center;width:100%;min-height:51px;padding:12px;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}
.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Mobile header refinement: keep branding, XP and streak on one balanced row */
.nav{display:flex;align-items:center;gap:10px;min-height:72px;padding:10px 14px}
.back{flex:0 0 42px;width:42px;height:42px}

@media(max-width:480px){

  .brand small{font-size:8px;letter-spacing:.55px}

}
@media(max-width:360px){

}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>📏 Relative Velocity</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [{"q":"What is relative velocity?","o":["Velocity of one object measured with respect to another","The average speed of all objects","Acceleration divided by time","Distance between two objects"],"a":0,"e":"Relative velocity describes how fast and in which direction one object's position changes as seen from another."},{"q":"For objects A and B, the velocity of A relative to B is:","o":["vA + vB in all cases","vA − vB","vB − vA in all cases","vA × vB"],"a":1,"e":"Using the same reference frame, vA relative to B is vAB = vA − vB."},{"q":"Two cars move east at 20 m/s and 12 m/s. The faster car's velocity relative to the slower car is:","o":["8 m/s east","32 m/s east","8 m/s west","12 m/s east"],"a":0,"e":"Same-direction velocities subtract: 20 − 12 = 8 m/s east."},{"q":"Two cars approach each other at 15 m/s and 10 m/s. Their closing speed is:","o":["5 m/s","10 m/s","15 m/s","25 m/s"],"a":3,"e":"When moving toward each other, the separation decreases at 15 + 10 = 25 m/s."},{"q":"A train moves east at 18 m/s. A passenger walks east at 2 m/s relative to the train. Passenger velocity relative to ground is:","o":["16 m/s east","18 m/s east","20 m/s east","20 m/s west"],"a":2,"e":"Same direction: ground velocity = train velocity + walking velocity = 18 + 2 = 20 m/s east."},{"q":"A train moves east at 18 m/s. A passenger walks west at 2 m/s relative to the train. Passenger velocity relative to ground is:","o":["16 m/s east","20 m/s east","2 m/s west","18 m/s west"],"a":0,"e":"Taking east positive, v = 18 + (−2) = 16 m/s east."},{"q":"A boat moves east at 4 m/s relative to water while the current flows north at 3 m/s. Boat speed relative to ground is:","o":["1 m/s","5 m/s","7 m/s","12 m/s"],"a":1,"e":"The components are perpendicular, so speed = √(4² + 3²) = 5 m/s."},{"q":"A swimmer swims north at 3 m/s relative to water; the river flows east at 4 m/s. The ground speed is:","o":["1 m/s","3 m/s","4 m/s","5 m/s"],"a":3,"e":"The perpendicular velocities combine to give √(3² + 4²) = 5 m/s."},{"q":"Rain falls vertically at 10 m/s. A person runs horizontally at 10 m/s. Relative speed of rain to the person is:","o":["0 m/s","10 m/s","10√2 m/s","20 m/s"],"a":2,"e":"The relative velocity has perpendicular components 10 and 10 m/s, giving magnitude √200 = 10√2 m/s."},{"q":"Two runners move in the same direction at 7 m/s and 5 m/s. Their relative speed is:","o":["2 m/s","5 m/s","7 m/s","12 m/s"],"a":0,"e":"Relative speed in the same direction is the difference, 7 − 5 = 2 m/s."},{"q":"Two cyclists ride in opposite directions at 6 m/s and 4 m/s. Their relative speed is:","o":["2 m/s","4 m/s","6 m/s","10 m/s"],"a":3,"e":"For opposite directions, relative speed is the sum: 6 + 4 = 10 m/s."},{"q":"If vA = 8 m/s east and vB = 3 m/s east, vAB is:","o":["11 m/s east","5 m/s east","5 m/s west","24 m/s east"],"a":1,"e":"vAB = vA − vB = 8 − 3 = 5 m/s east."},{"q":"If vA = 4 m/s east and vB = 6 m/s east, vAB is:","o":["10 m/s east","2 m/s east","2 m/s west","24 m/s west"],"a":2,"e":"Taking east positive, vAB = 4 − 6 = −2 m/s, which is 2 m/s west."},{"q":"A person walks north at 2 m/s on a bus moving east at 10 m/s. Their speed relative to ground is:","o":["8 m/s","10 m/s","12 m/s","√104 m/s"],"a":3,"e":"The motions are perpendicular: speed = √(10² + 2²) = √104 m/s."},{"q":"Relative velocity is zero when two objects have:","o":["Equal velocities in the same reference frame","Equal speeds in opposite directions","Equal accelerations only","The same mass"],"a":0,"e":"If vA = vB, then vAB = vA − vB = 0."},{"q":"A car moves east at 25 m/s and another west at 15 m/s. Velocity of the eastbound car relative to the westbound car is:","o":["10 m/s east","40 m/s east","40 m/s west","25 m/s east"],"a":1,"e":"Taking east positive: vAB = 25 − (−15) = 40 m/s east."},{"q":"A boat's velocity relative to water is 5 m/s east, and water moves 2 m/s west relative to ground. Boat velocity relative to ground is:","o":["7 m/s east","3 m/s east","3 m/s west","7 m/s west"],"a":1,"e":"Take east positive: vBG = vBW + vWG = 5 + (−2) = 3 m/s east."},{"q":"An airplane flies north at 200 km/h relative to air; wind blows south at 50 km/h. Its ground velocity is:","o":["150 km/h north","200 km/h north","250 km/h north","150 km/h south"],"a":0,"e":"Ground velocity = 200 north + 50 south, giving 150 km/h north."},{"q":"An airplane flies east at 150 km/h relative to air while wind blows north at 200 km/h. Ground speed is:","o":["50 km/h","200 km/h","250 km/h","350 km/h"],"a":2,"e":"The perpendicular components give √(150² + 200²) = 250 km/h."},{"q":"A river flows east at 3 m/s. A swimmer aims north at 4 m/s relative to water. To an observer on the bank, the swimmer moves:","o":["North only at 4 m/s","East only at 3 m/s","Northeast at 5 m/s","Southwest at 5 m/s"],"a":2,"e":"Ground velocity has 3 m/s east and 4 m/s north components, giving 5 m/s northeast."},{"q":"If A sees B moving west at 4 m/s, then B sees A moving:","o":["West at 4 m/s","East at 4 m/s","West at 8 m/s","At rest"],"a":1,"e":"Relative velocities are equal in magnitude and opposite in direction: vBA = −vAB."},{"q":"A moving walkway travels east at 1.5 m/s. A person walks east at 1 m/s relative to it. Person speed relative to floor is:","o":["0.5 m/s east","1 m/s east","1.5 m/s east","2.5 m/s east"],"a":3,"e":"Velocities in the same direction add: 1.5 + 1 = 2.5 m/s east."},{"q":"A person walks west at 1 m/s relative to a walkway moving east at 1.5 m/s. Their velocity relative to floor is:","o":["2.5 m/s east","0.5 m/s east","0.5 m/s west","1.5 m/s west"],"a":1,"e":"Take east positive: 1.5 + (−1) = 0.5 m/s east."},{"q":"Two objects have velocities vA = (3, 4) m/s and vB = (1, 1) m/s. Relative velocity vAB is:","o":["(4, 5) m/s","(2, 3) m/s","(3, 4) m/s","(2, 5) m/s"],"a":1,"e":"Subtract components: (3 − 1, 4 − 1) = (2, 3) m/s."},{"q":"For vAB = (−3, 4) m/s, the relative speed is:","o":["1 m/s","4 m/s","5 m/s","7 m/s"],"a":2,"e":"Magnitude = √((-3)² + 4²) = 5 m/s."},{"q":"A car travels 60 km east in 2 h. A second car travels 40 km east in 2 h. Their average velocities relative to the ground are:","o":["30 and 20 km/h east","60 and 40 km/h east","30 and 20 km/h west","20 and 30 km/h east"],"a":0,"e":"Average velocity is displacement divided by time: 60/2 = 30 and 40/2 = 20 km/h east."},{"q":"A and B start together and move in the same direction at 12 m/s and 9 m/s. After 10 s, A is how far ahead of B?","o":["3 m","10 m","30 m","120 m"],"a":2,"e":"Relative speed = 12 − 9 = 3 m/s; separation after 10 s is 3 × 10 = 30 m."},{"q":"Two cars are 100 m apart and approach each other at 8 m/s and 12 m/s. Time until they meet is:","o":["2 s","5 s","8 s","10 s"],"a":1,"e":"Closing speed = 8 + 12 = 20 m/s, so time = 100/20 = 5 s."},{"q":"A boat moves at 6 m/s relative to water while the current is 2 m/s in the opposite direction. Its ground speed is:","o":["2 m/s","4 m/s","6 m/s","8 m/s"],"a":1,"e":"Opposite velocities subtract: 6 − 2 = 4 m/s in the boat's direction relative to water."},{"q":"Which relation correctly connects velocities of A, B and ground O?","o":["vAO = vAB + vBO","vAO = vAB − vBO always","vAB = vAO + vBO","vAO = vAB × vBO"],"a":0,"e":"Relative-velocity addition gives vAO = vAB + vBO when the reference chain is consistent."},{"q":"A bus moves east at 10 m/s. A passenger walks west at 2 m/s relative to the bus. Another person stands still on the road. Passenger velocity relative to the road is:","o":["12 m/s east","8 m/s east","2 m/s west","10 m/s west"],"a":1,"e":"Take east positive: passenger velocity = 10 + (−2) = 8 m/s east."}]
let index=0,score=0,streak=0,chosen=null,locked=false;
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Nice work!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><button class="btn" id="retry">Practice again</button>';
 $('finishSlot').replaceChildren(card);$('retry').addEventListener('click',()=>{index=0;score=0;streak=0;$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
