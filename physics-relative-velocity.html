.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>📏 Relative Velocity</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [{"q":"What does relative velocity describe?","o":["An object's mass compared with another","One object's velocity as measured from another object","Only the speed of a stationary object","The acceleration due to gravity"],"a":1,"e":"Relative velocity is the velocity of one object as observed from the reference frame of another."},{"q":"For objects A and B moving along one straight line, velocity of A relative to B is:","o":["vA + vB always","vA − vB","vB − vA always","vA × vB"],"a":1,"e":"Using a common signed axis, vAB = vA − vB."},{"q":"Two cars move east at 20 m/s and 12 m/s. The faster car's velocity relative to the slower car is:","o":["8 m/s east","32 m/s east","8 m/s west","12 m/s east"],"a":0,"e":"vfast relative to slow = 20 − 12 = 8 m/s east."},{"q":"Two runners move in opposite directions at 5 m/s and 7 m/s. Their relative speed is:","o":["2 m/s","5 m/s","7 m/s","12 m/s"],"a":3,"e":"Opposite directions mean the separation rate is 5 + 7 = 12 m/s."},{"q":"A train moves east at 15 m/s. A passenger walks east inside it at 2 m/s relative to the train. Passenger velocity relative to ground is:","o":["13 m/s east","15 m/s east","17 m/s east","30 m/s east"],"a":2,"e":"In the same direction, velocities add: 15 + 2 = 17 m/s east."},{"q":"A train moves east at 15 m/s. A passenger walks west at 2 m/s relative to the train. Passenger velocity relative to ground is:","o":["13 m/s east","17 m/s east","2 m/s west","15 m/s west"],"a":0,"e":"The passenger walks opposite to the train's motion, so ground velocity = 15 − 2 = 13 m/s east."},{"q":"A boat moves north at 4 m/s relative to water while the river flows east at 3 m/s. Its ground speed is:","o":["1 m/s","5 m/s","7 m/s","12 m/s"],"a":1,"e":"The velocities are perpendicular, so speed = √(4² + 3²) = 5 m/s."},{"q":"A person walks at 3 m/s north on a train moving east at 4 m/s. The person's speed relative to ground is:","o":["1 m/s","4 m/s","5 m/s","7 m/s"],"a":2,"e":"Perpendicular components give √(3² + 4²) = 5 m/s."},{"q":"A swimmer can swim at 4 m/s relative to still water. A river current is 3 m/s downstream. If they swim downstream, their ground speed is:","o":["1 m/s","3 m/s","4 m/s","7 m/s"],"a":3,"e":"When swimming downstream, swimmer and current velocities add: 4 + 3 = 7 m/s."},{"q":"A swimmer moves at 5 m/s relative to water directly upstream while the current is 2 m/s downstream. Their ground velocity is:","o":["7 m/s upstream","3 m/s upstream","3 m/s downstream","2 m/s upstream"],"a":1,"e":"The velocities oppose each other: 5 − 2 = 3 m/s upstream."},{"q":"Rain falls vertically at 10 m/s. A car moves horizontally at 10 m/s. The rain's relative speed to the car is:","o":["0 m/s","10 m/s","10√2 m/s","20 m/s"],"a":2,"e":"The relative velocity has perpendicular components 10 and 10, so its magnitude is 10√2 m/s."},{"q":"Two cars travel in the same direction at 25 m/s and 18 m/s. How fast does the gap between them change?","o":["7 m/s","18 m/s","25 m/s","43 m/s"],"a":0,"e":"For same-direction motion, relative speed is the difference: 25 − 18 = 7 m/s."},{"q":"Two cyclists approach each other at 6 m/s and 4 m/s. Their separation decreases at:","o":["2 m/s","4 m/s","6 m/s","10 m/s"],"a":3,"e":"When they approach from opposite directions, closing speed is 6 + 4 = 10 m/s."},{"q":"If object A has velocity +8 m/s and B has velocity −3 m/s on the same axis, vAB is:","o":["+5 m/s","+11 m/s","−11 m/s","−5 m/s"],"a":1,"e":"vAB = vA − vB = 8 − (−3) = +11 m/s."},{"q":"If vAB = −6 m/s, what does the negative sign mean?","o":["The relative speed is negative","A moves in the negative direction relative to B on the chosen axis","A must be at rest","B must be moving at 6 m/s"],"a":1,"e":"The sign gives direction relative to the chosen axis; the relative speed magnitude is 6 m/s."},{"q":"A car at 10 m/s passes a stationary observer. The car's velocity relative to the observer is:","o":["0 m/s","10 m/s in the car's direction","Depends only on car mass","Always 10 m/s opposite"],"a":1,"e":"For a stationary observer, vobserver = 0, so relative velocity equals the car's velocity."},{"q":"A boat's velocity relative to water is 6 m/s east, and water relative to ground is 2 m/s west. Boat velocity relative to ground is:","o":["8 m/s east","4 m/s east","4 m/s west","8 m/s west"],"a":1,"e":"Taking east positive: 6 + (−2) = 4 m/s east."},{"q":"A plane flies east at 200 km/h relative to air. Wind blows west at 50 km/h. Its ground speed is:","o":["150 km/h east","200 km/h east","250 km/h east","50 km/h west"],"a":0,"e":"Wind opposes the plane's motion, so ground velocity = 200 − 50 = 150 km/h east."},{"q":"A plane flies east at 150 km/h while wind blows north at 200 km/h. Ground speed is:","o":["50 km/h","150 km/h","200 km/h","250 km/h"],"a":3,"e":"The components are perpendicular: √(150² + 200²) = 250 km/h."},{"q":"A person walks forward at 1.5 m/s inside a bus moving at 10 m/s. Their velocity relative to ground is:","o":["8.5 m/s","10 m/s","11.5 m/s","15 m/s"],"a":2,"e":"Same-direction velocities add: 10 + 1.5 = 11.5 m/s."},{"q":"Two objects have identical velocity vectors. Their relative velocity is:","o":["Twice the velocity","Zero","The sum of their speeds","Always perpendicular"],"a":1,"e":"vAB = vA − vB; equal vectors subtract to zero."},{"q":"A boat points straight across a river at 4 m/s relative to water, and current is 3 m/s downstream. The boat's path relative to ground is:","o":["Straight across with no drift","Directly downstream","Diagonal downstream","Diagonal upstream"],"a":2,"e":"The cross-river velocity and downstream current combine into a diagonal downstream path."},{"q":"To arrive directly opposite on the far bank despite a downstream current, a swimmer should aim:","o":["Downstream","Upstream at an angle","Exactly downstream","In any direction; current has no effect"],"a":1,"e":"The swimmer must aim upstream so the upstream component cancels the current's downstream velocity."},{"q":"A swimmer moves at 5 m/s relative to water and aims upstream, while current is 3 m/s. If they aim directly upstream, their ground speed upstream is:","o":["2 m/s","3 m/s","5 m/s","8 m/s"],"a":0,"e":"The current subtracts from the swimmer's upstream velocity: 5 − 3 = 2 m/s upstream."},{"q":"A bus moves at 12 m/s east. A passenger walks at 1 m/s west relative to the bus. The passenger's ground velocity is:","o":["13 m/s east","12 m/s east","11 m/s east","1 m/s west"],"a":2,"e":"Passenger ground velocity = 12 − 1 = 11 m/s east."},{"q":"A cyclist moving east at 8 m/s sees another cyclist moving east at 5 m/s. The second cyclist's velocity relative to the first is:","o":["3 m/s east","3 m/s west","13 m/s east","5 m/s west"],"a":1,"e":"vsecond relative to first = 5 − 8 = −3 m/s, meaning 3 m/s west relative to the first."},{"q":"A car travels east at 6 m/s and another travels north at 8 m/s. The second car's velocity relative to the first has magnitude:","o":["2 m/s","10 m/s","14 m/s","48 m/s"],"a":1,"e":"Relative velocity components are (−6, 8), giving magnitude √(6² + 8²) = 10 m/s."},{"q":"Relative velocity is useful for calculating:","o":["Only an object's weight","How quickly two objects approach or separate","The density of an object","The temperature of a moving object"],"a":1,"e":"Relative velocity tells how position changes between objects, including approach and separation rates."},{"q":"If a person walks backward inside a bus at the same speed the bus moves forward, the person's ground velocity is:","o":["Twice the bus speed forward","Zero","Bus speed backward","Always forward"],"a":1,"e":"Equal speeds in opposite directions cancel, making the person's ground velocity zero."},{"q":"A car moves north at 6 m/s while another moves south at 8 m/s. The first car's velocity relative to the second is:","o":["2 m/s north","14 m/s north","14 m/s south","8 m/s north"],"a":1,"e":"Take north as positive: vAB = 6 − (−8) = 14 m/s north."}]
let index=0,score=0,streak=0,chosen=null,locked=false;
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Nice work!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><button class="btn" id="retry">Practice again</button>';
 $('finishSlot').replaceChildren(card);$('retry').addEventListener('click',()=>{index=0;score=0;streak=0;$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
