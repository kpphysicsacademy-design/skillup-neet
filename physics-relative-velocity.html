<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Relative Velocity</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:flex-end;align-items:center}.xp{background:#fff;border:1px solid #dfe3ea;border-radius:14px;padding:7px 11px;font-weight:850;white-space:nowrap}.intro{margin:24px 0 18px}.intro h1{margin:0 0 8px;font-size:2rem;line-height:1.15}.intro p{margin:0;color:#596273;line-height:1.55}.progress{height:12px;background:#e4e7ed;border-radius:99px;overflow:hidden;margin:20px 0}.fill{height:100%;width:0;background:#58cc02;transition:width .25s ease}.card{background:#fff;border-radius:22px;padding:26px;box-shadow:0 8px 24px rgba(23,32,51,.08)}.meta{font-size:.95rem;font-weight:800;color:#596273;margin-bottom:12px}.q{font-size:1.3rem;font-weight:750;line-height:1.45;margin:0 0 20px}.options{display:grid;gap:10px}.option{padding:15px 16px;border:2px solid #dfe3ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;color:#172033;cursor:pointer;transition:border-color .15s,background .15s,transform .1s,box-shadow .15s}.option:hover:not(:disabled){border-color:#58cc02;background:#f5fff0;transform:translateY(-1px);box-shadow:0 3px 0 #dfe3ea}.option.selected{border-color:#5146a5;background:#f1efff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#ff4b4b;background:#fff0f0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{padding:12px 18px;border:0;border-radius:13px;font:inherit;font-weight:850;cursor:pointer}.check,.retry{background:#58cc02;color:#fff}.next{background:#5146a5;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:16px;min-height:24px;font-weight:750;line-height:1.5}.good{color:#177b2f}.bad{color:#b02a37}.hint{margin:18px 0 0;color:#596273;font-size:.95rem}.result{display:none;text-align:center;margin-top:20px;padding-top:18px;border-top:1px solid #e5e7eb}.result h2{margin:0 0 8px}.bottom-nav{margin-top:20px;text-align:center}.back{display:inline-block;color:#5146a5;font-weight:800;text-decoration:none;padding:9px 12px;border-radius:12px;transition:transform .15s,background .15s,box-shadow .15s}.back:hover{background:#eeeaff;transform:translateY(-1px);box-shadow:0 4px 12px rgba(81,70,165,.12)}.back:focus-visible{outline:3px solid #b9b0ff;outline-offset:2px}.back:active{transform:scale(.98)}@media(max-width:600px){.wrap{padding:20px 14px}.intro h1{font-size:1.65rem}.card{padding:20px}.q{font-size:1.15rem}}</style></head><body><main class="wrap"><div class="top"><span class="xp">⚡ <span id="xp">0</span> XP</span></div><section class="intro"><h1>🔄 Relative Velocity</h1><p>Master relative velocity, reference frames and vector addition with 15 focused NEET-style MCQs.</p></section><div class="progress" aria-label="Quiz progress"><div id="fill" class="fill"></div></div><section class="card"><div class="meta"><span id="count">Question 1 of 15</span> • <span id="pct">7%</span></div><h2 id="q" class="q"></h2><div id="opts" class="options"></div><div class="actions"><button id="check" class="btn check" type="button">Check Answer</button><button id="next" class="btn next" type="button" disabled>Next Question →</button></div><div id="fb" class="feedback" aria-live="polite"></div><p class="hint">💡 Choose the best answer.</p><div id="result" class="result"><h2>🏆 Skill Complete!</h2><p id="score"></p><button id="retry" class="btn retry" type="button">Retry Skill</button></div></section><div class="bottom-nav"><a class="back" href="#" onclick="return goBackToPhysicsPath()">← Back to Physics Path</a></div></main><script>(function(){const KEY='skillupLastPhysicsPath';function rememberPath(){try{const r=document.referrer;if(!r)return;const u=new URL(r);if(u.origin!==location.origin)return;if(/(?:physics|full-physics)[^/]*path[^/]*\.html$/i.test(u.pathname)||/\/physics-home\.html$/i.test(u.pathname))sessionStorage.setItem(KEY,u.href)}catch(e){}}function goBackToPhysicsPath(){try{const saved=sessionStorage.getItem(KEY);if(saved){const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}}catch(e){}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false}window.goBackToPhysicsPath=goBackToPhysicsPath;rememberPath();const quiz=[['Relative velocity of A with respect to B is given by:',['vA − vB','vA + vB always','vA/vB','vA × vB'],0,'Relative velocity of A with respect to B is vA − vB.'],['Relative velocity is a:',['Vector quantity','Scalar quantity only','Unitless number','Mass'],0,'Velocity has magnitude and direction, so relative velocity is a vector.'],['Two cars move in the same direction at 20 m/s and 15 m/s. Speed of the first car relative to the second is:',['5 m/s','35 m/s','300 m/s','0 m/s'],0,'For the same direction, relative speed is the difference: 20 − 15 = 5 m/s.'],['Two cars move in opposite directions at 20 m/s and 15 m/s. Their relative speed is:',['35 m/s','5 m/s','20 m/s','15 m/s'],0,'For opposite directions, relative speed is the sum: 20 + 15 = 35 m/s.'],['If two objects have identical velocities, their relative velocity is:',['Zero','Maximum','Equal to g','Infinite'],0,'Subtracting identical velocity vectors gives zero relative velocity.'],['A passenger walks forward at 2 m/s inside a train moving at 10 m/s. Velocity of the passenger relative to ground is:',['12 m/s','8 m/s','20 m/s','2 m/s'],0,'In the same direction, velocities add: 10 + 2 = 12 m/s.'],['For the same passenger, velocity relative to the train is:',['2 m/s','8 m/s','10 m/s','12 m/s'],0,'The passenger moves at 2 m/s relative to the train.'],['A boat moves east at 6 m/s relative to water while river water moves east at 2 m/s. Boat velocity relative to ground is:',['8 m/s east','4 m/s east','12 m/s east','2 m/s east'],0,'Same-direction velocities add: 6 + 2 = 8 m/s east.'],['A boat moves east at 6 m/s relative to water while water flows west at 2 m/s. Boat velocity relative to ground is:',['4 m/s east','8 m/s east','2 m/s west','6 m/s west'],0,'Opposite directions give 6 − 2 = 4 m/s east.'],['If vAB is velocity of A relative to B, then vBA equals:',['−vAB','vAB','2vAB','vAB²'],0,'Reversing the reference order reverses the relative velocity vector: vBA = −vAB.'],['Two perpendicular velocities of 3 m/s and 4 m/s have relative velocity magnitude:',['5 m/s','7 m/s','1 m/s','12 m/s'],0,'For perpendicular components, magnitude = √(3² + 4²) = 5 m/s.'],['A man runs at 5 m/s north while a wind blows at 3 m/s east. His velocity relative to the ground has magnitude:',['√34 m/s','8 m/s','2 m/s','15 m/s'],0,'The perpendicular components give √(5² + 3²) = √34 m/s.'],['If A is at rest and B moves at 10 m/s east, velocity of A relative to B is:',['10 m/s west','10 m/s east','0','20 m/s east'],0,'vAB = vA − vB = 0 − 10 east = 10 m/s west.'],['For rain falling vertically at 10 m/s and a car moving horizontally at 10 m/s, rain velocity relative to car has magnitude:',['10√2 m/s','10 m/s','20 m/s','0'],0,'The relative velocity has perpendicular components of 10 m/s, giving 10√2 m/s.'],['Which principle is used when finding relative velocity between two objects?',['Subtract their velocity vectors with the chosen reference frame','Add their masses','Divide their accelerations','Ignore directions'],0,'Relative velocity is obtained by subtracting the reference-object velocity vector from the other velocity vector.']];let i=0,sel=-1,score=0,locked=false;const $=id=>document.getElementById(id),q=$('q'),o=$('opts'),fb=$('fb'),check=$('check'),next=$('next'),xp=$('xp'),fill=$('fill'),count=$('count'),pct=$('pct');function render(){const a=quiz[i];sel=-1;locked=false;q.textContent=a[0];count.textContent='Question '+(i+1)+' of '+quiz.length;pct.textContent=Math.round((i+1)/quiz.length*100)+'%';fill.style.width=(score/quiz.length*100)+'%';fb.className='feedback';fb.textContent='';check.disabled=false;next.disabled=true;next.textContent=i===quiz.length-1?'Finish Skill →':'Next Question →';o.innerHTML='';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{if(locked)return;sel=item.index;Array.from(o.children).forEach(x=>x.classList.remove('selected'));b.classList.add('selected');check.disabled=false};o.appendChild(b)})}check.onclick=function(){if(sel<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}locked=true;const a=quiz[i],ok=sel===a[2];Array.from(o.children).forEach(b=>{const originalIndex=Number(b.dataset.index);b.disabled=true;if(originalIndex===a[2])b.classList.add('correct');if(originalIndex===sel&&!ok)b.classList.add('wrong')});if(ok){score++;fb.className='feedback good';fb.textContent='🎯 Correct! '+a[3]+' +10 XP'}else{fb.className='feedback bad';fb.textContent='Not quite. '+a[3]+' Correct answer: '+a[1][a[2]]}xp.textContent=score*10;fill.style.width=(score/quiz.length*100)+'%';check.disabled=true;next.disabled=false};next.onclick=function(){if(i<quiz.length-1){i++;render()}else{q.textContent='🏆 Relative Velocity Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+score+' / '+quiz.length+' correct • '+score*10+' XP';$('result').style.display='block';$('score').textContent=score+' / '+quiz.length+' correct • '+score*10+' XP';fill.style.width=(score/quiz.length*100)+'%'}};$('retry').onclick=()=>{i=0;sel=-1;score=0;locked=false;xp.textContent='0';$('result').style.display='none';check.style.display='';next.style.display='';render()};render()})();</script></body></html>
