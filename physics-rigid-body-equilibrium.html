<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Rigid Body Equilibrium</title><style>body{margin:0;background:#f5f7fa;font-family:Arial,sans-serif;color:#172033}.wrap{max-width:760px;margin:auto;padding:24px 16px 50px}.head{display:flex;justify-content:space-between;align-items:center}.title{font-size:28px;font-weight:800}.xp{font-weight:700;color:#168447}.sub{color:#667085;margin:8px 0 18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #0000000b}.mastery{font-weight:700}.bar{height:10px;background:#e7ebf0;border-radius:10px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#22a06b;transition:.3s}.qno{font-size:14px;color:#667085}.q{font-size:20px;font-weight:750;line-height:1.4;margin:10px 0 18px}.opt{display:block;width:100%;text-align:left;padding:14px;margin:9px 0;border:2px solid #d9dee7;background:#fff;border-radius:12px;cursor:pointer;font-size:16px;transition:.15s}.opt:hover{transform:translateY(-1px);border-color:#7b8798}.opt.sel{border-color:#3578e5;background:#eef5ff}.opt.correct{border-color:#20a464;background:#eaf8f0}.opt.wrong{border-color:#d64545;background:#fff0f0}.btn{border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:750;cursor:pointer;background:#22a06b;color:white}.btn:disabled{opacity:.5;cursor:not-allowed}.back{display:inline-block;text-decoration:none;color:#344054;border:2px solid #d9dee7;border-radius:12px;padding:12px 18px;font-weight:700;background:#fff;transition:.15s}.back:hover{transform:translateY(-2px);box-shadow:0 5px 14px #00000012}.feedback{min-height:24px;font-weight:700;margin-top:14px}.done{text-align:center;font-size:22px;font-weight:800}@media(max-width:600px){.title{font-size:23px}.q{font-size:18px}}</style></head><body><main class="wrap"><div class="head"><div class="title">⚖️ Rigid Body Equilibrium</div><div class="xp">+10 XP</div></div><div class="sub">Conditions for translational and rotational equilibrium of rigid bodies.</div><section class="card"><div class="mastery">🎯 Skill Mastery <span id="score">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card" id="quizCard"><div class="qno" id="qno"></div><div class="q" id="q"></div><div id="opts"></div><button class="btn" id="continue" disabled>Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>const quiz=[['For a rigid body to be in complete equilibrium, which conditions must hold?', ['Net force = 0 and net torque = 0','Net force = 0 only','Net torque = 0 only','Velocity must be maximum'],0],['Translational equilibrium requires:', ['ΣF = 0','Στ = 0 only','ΣF = ma with a≠0','angular speed = 0 always'],0],['Rotational equilibrium requires:', ['net torque about the chosen point is zero','net force must be maximum','linear momentum must be zero','mass must be zero'],0],['A body can have zero net force but nonzero net torque. It will:', ['have rotational acceleration','remain completely at rest','have no acceleration of any kind','have zero angular velocity necessarily'],0],['If both net force and net torque are zero, a rigid body may be:', ['at rest or moving with constant velocity/angular velocity','only at rest','only accelerating','only rotating with increasing speed'],0],['For a body in equilibrium, the vector sum of all external forces is:', ['zero','equal to weight','equal to mass','infinite'],0],['For static equilibrium, the body has:', ['zero linear and angular acceleration','maximum acceleration','zero mass','constant force only'],0],['The torque of a force about a point is zero when:', ['its line of action passes through the point','the force is always large','the lever arm is maximum','mass is zero'],0],['Two equal and opposite parallel forces separated by a distance form a:', ['couple','single force','weight','centripetal force'],0],['A couple produces:', ['pure rotation tendency with zero resultant force','pure translation only','zero torque','zero force and zero torque'],0],['For equilibrium of a horizontal beam, clockwise torques must be:', ['balanced by equal counterclockwise torque','always larger','always zero','ignored'],0],['A uniform beam is supported at its centre and remains horizontal. The net torque about the support is:', ['zero','maximum','equal to MgL','negative always'],0],['If a force is doubled while its perpendicular distance from the pivot is unchanged, its torque:', ['doubles','halves','remains unchanged','becomes zero'],0],['The centre of gravity of a body in a uniform gravitational field is the point where:', ['the resultant weight may be considered to act','all mass disappears','torque is always maximum','velocity is zero'],0],['A necessary condition for a body resting without toppling is that the vertical line through its centre of gravity:', ['falls within the base of support','lies outside the base','is horizontal','passes through infinity'],0]];let i=0,correct=0,selected=null,checked=false;function $(x){return document.getElementById(x)}function shuffle(a){for(let k=a.length-1;k>0;k--){let r=Math.floor(Math.random()*(k+1));[a[k],a[r]]=[a[r],a[k]]}return a}function render(){selected=null;checked=false;$('continue').disabled=true;$('continue').textContent='Continue →';$('feedback').textContent='';$('qno').textContent=`Question ${i+1} of 15`;$('q').textContent=quiz[i][0];$('opts').innerHTML='';const order=quiz[i][1].map((text,index)=>({text,index}));shuffle(order).forEach((x,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{selected=x.index;document.querySelectorAll('.opt').forEach(z=>z.classList.remove('sel'));b.classList.add('sel');$('continue').disabled=false};$('opts').appendChild(b)});$('score').textContent=`${correct} / 15`;$('fill').style.width=`${(i/15)*100}%`}$('continue').onclick=()=>{if(selected===null)return;if(!checked){checked=true;const ok=selected===quiz[i][2];if(ok)correct++;document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const n=Number(b.dataset.index);if(n===quiz[i][2])b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=ok?'🎉 Correct! +10 XP':'💡 Review the highlighted correct answer.';$('score').textContent=`${correct} / 15`;$('fill').style.width=`${((i+1)/15)*100}%`;$('continue').textContent=i===14?'Finish Skill →':'Continue →';return}if(i<14){i++;render()}else{$('quizCard').innerHTML=`<div class="done">🏆 Skill Complete!</div><p>You scored ${correct} / 15.</p><button class="btn" onclick="location.reload()">Retry →</button>`}};$('back').onclick=function(){const s=sessionStorage.getItem('skillupLastPhysicsPath');if(s){try{const u=new URL(s,location.href);if(u.origin===location.origin){location.href=s;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();</script></body></html>
