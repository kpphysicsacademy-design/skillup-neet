.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>⚖️ Rigid Body Equilibrium</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [{"q":"A rigid body is in static equilibrium when:","o":["Net force is zero only","Net torque is zero only","Both net force and net torque are zero","Its speed is maximum"],"a":2,"e":"Static equilibrium requires translational and rotational equilibrium: ΣF = 0 and Στ = 0."},{"q":"For a rigid body in planar equilibrium, the usual independent conditions are:","o":["ΣFx=0 only","ΣFy=0 and Στ=0 only","ΣFx=0, ΣFy=0, and Στ=0","Στ=0 and speed=0 only"],"a":2,"e":"In two dimensions, force balance in x and y plus torque balance are required."},{"q":"The SI unit of torque is:","o":["J/s","N m","N/m","kg m/s"],"a":1,"e":"Torque is force multiplied by perpendicular distance, with SI unit N m."},{"q":"Torque about a point is calculated using:","o":["Force × parallel distance","Force × perpendicular lever arm","Mass × acceleration only","Power × time"],"a":1,"e":"The torque magnitude is τ = F r sinθ, equal to force times perpendicular lever arm."},{"q":"A 10 N force acts perpendicularly 0.5 m from a pivot. Its torque magnitude is:","o":["2 N m","5 N m","10 N m","20 N m"],"a":1,"e":"τ = Fr = 10 × 0.5 = 5 N m."},{"q":"A force whose line of action passes through the pivot produces:","o":["Maximum torque","Zero torque about that pivot","Infinite torque","Torque equal to its mass"],"a":1,"e":"The perpendicular distance from the pivot to the line of action is zero."},{"q":"For a body in rotational equilibrium, the algebraic sum of torques about any chosen point is:","o":["Positive","Negative","Zero","Equal to mass"],"a":2,"e":"Rotational equilibrium requires the net external torque to be zero."},{"q":"Why is the principle of moments useful for a balanced seesaw?","o":["It balances clockwise and anticlockwise torques","It makes both masses equal","It removes gravity","It requires no pivot"],"a":0,"e":"A balanced seesaw has zero net torque, so clockwise and anticlockwise moments cancel."},{"q":"A 20 N force acts 0.3 m from a pivot at right angles. Torque magnitude is:","o":["3 N m","6 N m","20 N m","60 N m"],"a":1,"e":"τ = 20 × 0.3 = 6 N m."},{"q":"A 30 N force acts at 30° to a 2 m position vector. Torque magnitude is:","o":["30 N m","60 N m","15 N m","120 N m"],"a":0,"e":"τ = rF sinθ = 2 × 30 × sin30° = 30 N m."},{"q":"A uniform metre rule is supported at its centre. Its own weight creates what torque about the support?","o":["Maximum clockwise torque","Maximum anticlockwise torque","Zero torque","Torque equal to its length"],"a":2,"e":"The rule's weight acts through its centre of mass at the support, so its lever arm is zero."},{"q":"The centre of gravity of a body is the point through which acts the resultant:","o":["Magnetic force","Gravitational force (weight)","Friction only","Centripetal force"],"a":1,"e":"The weight of a body can be represented as acting through its centre of gravity."},{"q":"A body is in translational equilibrium if:","o":["Its net force is zero","Its net torque is zero","Its angular speed is zero","Its mass is zero"],"a":0,"e":"ΣF = 0 means there is no linear acceleration of the centre of mass."},{"q":"Can a body have zero net force but nonzero net torque?","o":["No, never","Yes; a couple can produce pure rotation","Only if it has no mass","Only in free fall"],"a":1,"e":"A couple has zero resultant force but a nonzero resultant torque."},{"q":"A couple consists of:","o":["Two equal forces in the same direction at one point","Two equal and opposite parallel forces separated by a distance","Two unequal forces on the same line","One force and one mass"],"a":1,"e":"A couple produces rotation without a net translational force."},{"q":"The magnitude of the torque of a couple is:","o":["F/d","F times perpendicular separation","2F/d","Mass times distance"],"a":1,"e":"Couple torque equals either force magnitude multiplied by the perpendicular distance between their lines of action."},{"q":"A couple has forces of 8 N separated by 0.25 m. Its torque is:","o":["2 N m","8.25 N m","32 N m","0.5 N m"],"a":0,"e":"τ = Fd = 8 × 0.25 = 2 N m."},{"q":"A 40 N load is 0.5 m to the left of a pivot. What force at 1 m to the right balances its torque if both act vertically?","o":["10 N","20 N","40 N","80 N"],"a":1,"e":"Balance moments: 40 × 0.5 = F × 1, so F = 20 N."},{"q":"A 15 N load is 2 m from a pivot. A balancing force acts 3 m on the other side. Its magnitude is:","o":["5 N","10 N","15 N","22.5 N"],"a":1,"e":"15 × 2 = F × 3, so F = 10 N."},{"q":"When calculating torque, the lever arm is the:","o":["Distance along the force direction","Perpendicular distance from pivot to force line","Distance travelled by the object","Radius squared"],"a":1,"e":"The lever arm is the shortest perpendicular distance between pivot and line of action."},{"q":"Which force produces the greatest torque for a fixed magnitude and radius?","o":["Force directed along the radius","Force at 30° to radius","Force perpendicular to radius","Force directed toward pivot"],"a":2,"e":"τ = rF sinθ is greatest when θ = 90°."},{"q":"A body may be in equilibrium while moving with constant velocity because:","o":["Equilibrium always means rest","Net force and net torque can both be zero","Torque must be infinite","Mass must be zero"],"a":1,"e":"Dynamic equilibrium is possible when net external force and torque are zero."},{"q":"For an object to be in complete mechanical equilibrium, which statement is correct?","o":["No forces act on it","Only gravity acts on it","Net force and net torque are both zero","It must be a point particle"],"a":2,"e":"All external forces and torques must balance, though individual forces may be present."},{"q":"A horizontal beam is supported at both ends and carries a load. In equilibrium, the upward support forces together balance:","o":["The total downward load","The beam's length","The net torque only","The acceleration due to gravity"],"a":0,"e":"Vertical force balance means total upward reactions equal total downward weights."},{"q":"A uniform beam's weight acts at:","o":["One end","Its centre of mass","The support with the larger force always","Any arbitrary point"],"a":1,"e":"For a uniform beam, the centre of mass is at its midpoint, where its weight acts."},{"q":"Taking torques about a pivot is often helpful because:","o":["It removes all forces from the problem","Forces through the pivot have zero torque","It makes all distances zero","It guarantees equal forces"],"a":1,"e":"Unknown forces whose lines of action pass through the pivot contribute no torque about that point."},{"q":"A 12 N force acts at a perpendicular distance of 0.75 m. Its torque is:","o":["9 N m","12.75 N m","16 N m","0.0625 N m"],"a":0,"e":"τ = 12 × 0.75 = 9 N m."},{"q":"A 5 N force acts at 60° to a 4 m position vector. Torque magnitude is:","o":["10 N m","17.3 N m","20 N m","2.5 N m"],"a":1,"e":"τ = rF sinθ = 4 × 5 × sin60° ≈ 17.3 N m."},{"q":"If the perpendicular lever arm doubles while force stays constant, torque:","o":["Halves","Doubles","Quadruples","Does not change"],"a":1,"e":"Torque is directly proportional to the perpendicular lever arm."},{"q":"Which condition distinguishes rotational equilibrium from translational equilibrium?","o":["ΣF = 0","Στ = 0","Mass is constant","Weight acts downward"],"a":1,"e":"Rotational equilibrium specifically requires the net torque to be zero."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Rigid Body Equilibrium Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
