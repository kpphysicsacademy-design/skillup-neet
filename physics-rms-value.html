<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | RMS Value</title><meta name="description" content="SkillUp Physics RMS Value interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">〰️</span><h1>RMS Value</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["For a sinusoidal AC voltage v=V₀sinωt, the RMS value is:",["V₀","V₀/2","V₀/√2","√2V₀"],2,"Vᵣₘₛ=V₀/√2 for a sinusoidal waveform."],["RMS stands for:",["Root Mean Square","Rapid Mean Signal","Root Maximum Supply","Random Mean Square"],0,"RMS means Root Mean Square."],["The RMS value of AC represents the equivalent DC value for the same:",["Frequency","Heating effect in a resistor","Phase","Amplitude"],1,"The RMS value produces the same heating effect in a resistor as the equivalent DC value."],["If the peak voltage is 200 V, its RMS value is approximately:",["100 V","141.4 V","200 V","282.8 V"],1,"Vᵣₘₛ=200/√2≈141.4 V."],["If Vᵣₘₛ=220 V, the peak voltage is approximately:",["110 V","220 V","311 V","440 V"],2,"V₀=√2×220≈311 V."],["For a sinusoidal current i=I₀sinωt, its RMS current is:",["I₀","I₀/2","I₀/√2","√2I₀"],2,"Iᵣₘₛ=I₀/√2."],["The average of a pure sinusoidal AC voltage over a complete cycle is:",["V₀","V₀/√2","Zero","2V₀"],2,"Positive and negative halves cancel over one complete cycle."],["For a sinusoidal waveform, RMS value is approximately what percentage of peak value?",["50%","70.7%","100%","141.4%"],1,"1/√2≈0.707, or 70.7%."],["A 10 A peak sinusoidal current has RMS current:",["5 A","7.07 A","10 A","14.14 A"],1,"Iᵣₘₛ=10/√2≈7.07 A."],["A 5 A RMS sinusoidal current has peak current:",["2.5 A","5 A","7.07 A","10 A"],2,"I₀=√2×5≈7.07 A."],["The RMS value of a constant DC voltage V is:",["0","V","V/√2","√2V"],1,"For constant DC, the RMS value equals the DC value itself."],["The square of the RMS value of a quantity is the:",["Mean of its square","Square root of its mean","Peak value","Average value"],0,"Xᵣₘₛ² equals the mean of x² over the interval."],["A 100 V peak sinusoidal voltage is applied to a resistor. The heating-equivalent DC voltage is:",["50 V","70.7 V","100 V","141.4 V"],1,"The equivalent DC voltage is the RMS value, 100/√2≈70.7 V."],["For sinusoidal AC, if peak value doubles, RMS value:",["Halves","Doubles","Becomes four times","Does not change"],1,"RMS is directly proportional to peak value."],["The RMS value is especially useful in AC circuits because power in a resistor is calculated using:",["P=VᵣₘₛIᵣₘₛ","P=V₀I₀ only","P=V/I","P=Q/t only"],0,"For a resistor with sinusoidal voltage and current in phase, average power is P=VᵣₘₛIᵣₘₛ." ]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="✓ Correct — "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="✗ Not quite — "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;i++;if(i<qs.length)render();else{$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`;$("fill").style.width="100%"}}function restart(){i=0;score=0;xp=0;$("quiz").hidden=false;$("result").hidden=true;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
