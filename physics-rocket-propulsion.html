<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp | Rocket Propulsion</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-size:1.6rem;font-weight:900}.subtitle{color:#5f6b7a;margin:0 0 18px}.xp,.card{background:#fff;border-radius:20px;box-shadow:0 6px 20px #17203312}.xp{padding:10px 15px;font-weight:850}.card{padding:20px;margin:12px 0}.ph{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:11px;background:#dfe8f1;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.25s}.qnum{font-weight:800;color:#35516f;margin-bottom:11px}.question{font-size:1.27rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#58cc02;background:#f7fff1;transform:translateY(-1px)}.option:focus{outline:3px solid #c9c3ff;outline-offset:2px}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;background:#2db84d;color:#fff;font-weight:850;cursor:pointer;box-shadow:0 4px 0 #21863a;transition:.12s}.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #21863a}.btn:focus{outline:3px solid #bce9c7;outline-offset:2px}.feedback{margin-top:14px;padding:12px;border-radius:13px;font-weight:700;min-height:18px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:10px;padding:10px 13px;border:2px solid #d9d4f5;border-radius:13px;color:#5146a5;font-weight:800;text-decoration:none;transition:.12s}.back:hover{background:#f0edff;transform:translateX(-2px)}.back:focus{outline:3px solid #c9c3ff;outline-offset:2px}.back:active{transform:translateY(2px)}@media(max-width:600px){.wrap{padding:20px 14px}.title{font-size:1.4rem}.question{font-size:1.12rem}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div class="title">🚀 Rocket Propulsion</div><div class="xp">⚡ <span id="xp">0</span> XP</div></div>
<p class="subtitle">Physics • NEET 2026 · Learn → Practice → Master</p>
<section class="card"><div class="ph"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section>
<section class="card"><div class="qnum" id="count"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><button class="btn" id="continue">Continue →</button><div class="feedback" id="feedback"></div></section>
<a class="back" id="back" href="physics-home.html">← Back to Physics Path</a>
</main>
<script>
(function(){
const quiz=[
['A rocket moves forward mainly because of:', ['conservation of momentum','conservation of mass only','gravity acting upward','buoyancy in air'],0,'Rocket propulsion follows conservation of linear momentum: expelled gases carry momentum backward and the rocket gains forward momentum.'],
['The thrust of a rocket is primarily associated with the:', ['rate of change of momentum of expelled gases','mass of the rocket alone','gravitational force only','air pressure on the nose'],0,'Thrust is produced by the momentum carried away by the exhaust gases.'],
['A rocket can move in outer space because it:', ['does not need to push against surrounding air','pushes against the vacuum','uses atmospheric pressure','needs a solid surface to push on'],0,'A rocket accelerates by ejecting mass; it does not require air or another external medium.'],
['If a rocket ejects gas backward, the rocket receives momentum:', ['forward','backward','zero in every frame','only upward'],0,'The exhaust gains backward momentum, so the rocket gains equal and opposite forward momentum in the ideal isolated system.'],
['The SI unit of rocket thrust is:', ['newton','joule','watt','pascal'],0,'Thrust is a force, so its SI unit is the newton (N).'],
['For a rocket ejecting mass at exhaust speed u relative to the rocket, increasing the mass ejection rate generally:', ['increases thrust','makes thrust zero','always decreases thrust','changes thrust into energy'],0,'For a given exhaust speed, greater mass flow rate gives greater momentum transfer per unit time and hence greater thrust.'],
['The ideal rocket equation is commonly called the:', ['Tsiolkovsky rocket equation','Bernoulli equation','Hooke law','Coulomb law'],0,'The Tsiolkovsky equation relates ideal velocity change to exhaust velocity and the initial-to-final mass ratio.'],
['The ideal velocity change of a rocket depends on:', ['exhaust speed and mass ratio','rocket colour and shape only','gravity alone','fuel temperature alone'],0,'Ideally, Δv = u ln(m_initial/m_final), so exhaust speed and mass ratio are key quantities.'],
['If the final mass of a rocket is reduced while initial mass and exhaust speed remain fixed, the ideal Δv:', ['increases','decreases','becomes zero','is unchanged'],0,'A smaller final mass increases the mass ratio m_initial/m_final and therefore increases ideal Δv.'],
['A multistage rocket is useful mainly because it:', ['drops empty structural mass during flight','increases the rocket mass after fuel burns','eliminates conservation of momentum','requires no propellant'],0,'Staging discards spent tanks and engines, improving the remaining vehicle mass ratio.'],
['In an ideal rocket in deep space with negligible external force, the centre of mass of the rocket-plus-exhaust system:', ['moves with constant velocity','must remain fixed in space','accelerates due only to internal forces','moves randomly'],0,'Internal exhaust forces cannot accelerate the centre of mass of an isolated complete system.'],
['Specific impulse is a measure closely related to:', ['effective exhaust velocity','rocket diameter only','fuel colour','payload mass only'],0,'Specific impulse is proportional to effective exhaust velocity and is a measure of propellant efficiency.'],
['A rocket engine produces thrust by converting chemical or other stored energy mainly into:', ['high-speed exhaust flow and directed momentum','gravity','static pressure in space','mass without momentum'],0,'The engine accelerates propellant to high exhaust velocity, producing thrust through momentum transfer.'],
['For the same required Δv, a higher exhaust velocity generally allows a rocket to:', ['use a smaller propellant mass fraction','require an infinite propellant mass','have zero thrust','ignore mass ratio'],0,'From the rocket equation, higher exhaust velocity means a smaller mass ratio is needed for the same Δv.'],
['During powered flight, an external force such as gravity can:', ['change the rocket’s actual acceleration from the ideal thrust-only case','make conservation of momentum invalid for the complete isolated system','stop exhaust from carrying momentum','eliminate thrust'],0,'Gravity is an external force on the rocket, so actual motion differs from the ideal thrust-only result.']
];
let i=0,selected=-1,checked=false,score=0;
const $=id=>document.getElementById(id),o=$("options"),b=$("continue"),f=$("feedback");
function render(){const a=quiz[i];selected=-1;checked=false;$("count").textContent='Question '+(i+1)+' of 15';$("question").textContent=a[0];o.innerHTML='';f.className='feedback';f.textContent='';b.style.display='inline-block';b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const el=document.createElement('button');el.className='option';el.textContent=String.fromCharCode(65+j)+'. '+item.text;el.dataset.index=item.index;el.onclick=()=>{selected=item.index;[...o.children].forEach(z=>z.classList.remove('selected'));el.classList.add('selected')};o.appendChild(el)})}
b.onclick=()=>{if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(el=>{const n=Number(el.dataset.index);el.disabled=true;if(n===a[2])el.classList.add('correct');if(n===selected&&!ok)el.classList.add('wrong')});if(ok)score++;f.className=ok?'feedback good':'feedback bad';f.textContent=(ok?'🎯 Correct! +10 XP — ':'✗ Review — Correct answer: '+a[1][a[2]]+'. ')+a[3];$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$("question").textContent='🏆 Rocket Propulsion Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};
$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};
render();
})();
</script>
</body>
