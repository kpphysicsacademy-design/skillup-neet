<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Rolling Motion</title><style>body{margin:0;background:#f5f7fa;font-family:Arial,sans-serif;color:#172033}.wrap{max-width:760px;margin:auto;padding:24px 16px 50px}.head{display:flex;justify-content:space-between;align-items:center}.title{font-size:28px;font-weight:800}.xp{font-weight:700;color:#168447}.sub{color:#667085;margin:8px 0 18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #0000000b}.mastery{font-weight:700}.bar{height:10px;background:#e7ebf0;border-radius:10px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#22a06b;transition:.3s}.qno{font-size:14px;color:#667085}.q{font-size:20px;font-weight:750;line-height:1.4;margin:10px 0 18px}.opt{display:block;width:100%;text-align:left;padding:14px;margin:9px 0;border:2px solid #d9dee7;background:#fff;border-radius:12px;cursor:pointer;font-size:16px;transition:.15s}.opt:hover{transform:translateY(-1px);border-color:#7b8798}.opt.sel{border-color:#3578e5;background:#eef5ff}.opt.correct{border-color:#20a464;background:#eaf8f0}.opt.wrong{border-color:#d64545;background:#fff0f0}.btn{border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:750;cursor:pointer;background:#22a06b;color:white}.btn:disabled{opacity:.5;cursor:not-allowed}.back{display:inline-block;text-decoration:none;color:#344054;border:2px solid #d9dee7;border-radius:12px;padding:12px 18px;font-weight:700;background:#fff;transition:.15s}.back:hover{transform:translateY(-2px);box-shadow:0 5px 14px #00000012}.feedback{min-height:24px;font-weight:700;margin-top:14px}.done{text-align:center;font-size:22px;font-weight:800}@media(max-width:600px){.title{font-size:23px}.q{font-size:18px}}</style></head><body><main class="wrap"><div class="head"><div class="title">🛞 Rolling Motion</div><div class="xp">+10 XP</div></div><div class="sub">Combined translational and rotational motion of a rolling body.</div><section class="card"><div class="mastery">🎯 Skill Mastery <span id="score">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card" id="quizCard"><div class="qno" id="qno"></div><div class="q" id="q"></div><div id="opts"></div><button class="btn" id="continue" disabled>Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>const quiz=[['For pure rolling without slipping, the relation between centre-of-mass speed v and angular speed ω is:', ['v=Rω','v=ω/R','v=R/ω','v=ω+R'],0],['In pure rolling, the point of contact with the ground is instantaneously:', ['at rest relative to the ground','moving with speed v','moving with speed 2v','moving backward with speed v'],0],['The total kinetic energy of a rolling body is the sum of:', ['translational and rotational kinetic energies','potential and elastic energies only','heat and sound energy','linear momentum and torque'],0],['For a rolling body, translational kinetic energy of its centre of mass is:', ['1/2 Mv²','Mv²','1/2 Iω²','Mω²'],0],['Rotational kinetic energy about the centre of mass is:', ['1/2 Iω²','1/2 Mv²','Iω','Mv'],0],['If a wheel rolls without slipping, the distance travelled by its centre in one complete revolution is:', ['2πR','πR','R/2π','πR²'],0],['For rolling without slipping, the instantaneous velocity of the top point of a wheel is:', ['2v','v','0','v/2'],0],['For rolling without slipping, the instantaneous velocity of the contact point is:', ['zero','v','2v','-2v'],0],['A body rolls down an incline without slipping. Its acceleration depends on:', ['both mass distribution and incline angle','mass only','radius only','surface colour'],0],['For a solid cylinder rolling without slipping, its total kinetic energy can be written as:', ['1/2 Mv² + 1/2 Iω²','Mv² + Iω','1/2 Mv + 1/2 Iω','Mgh only'],0],['If v=5 m/s and R=0.5 m for pure rolling, angular speed is:', ['10 rad/s','2.5 rad/s','5.5 rad/s','0.1 rad/s'],0],['A rolling wheel has both:', ['translation of its centre and rotation about its centre','only translation','only rotation','only vibration'],0],['Static friction in ideal pure rolling on a fixed incline does:', ['no net work at the instantaneous contact point','always positive work','always negative work','work equal to kinetic energy'],0],['If a rolling object speeds up while maintaining pure rolling, its angular speed:', ['increases with v as ω=v/R','decreases as vR','remains zero','is unrelated to v'],0],['A body rolls without slipping with centre speed v. The speed of the point at the top relative to the ground is:', ['2v','v/2','v','0'],0]];let i=0,correct=0,selected=null,checked=false;function $(x){return document.getElementById(x)}function shuffle(a){for(let k=a.length-1;k>0;k--){let r=Math.floor(Math.random()*(k+1));[a[k],a[r]]=[a[r],a[k]]}return a}function render(){selected=null;checked=false;$('continue').disabled=true;$('continue').textContent='Continue →';$('feedback').textContent='';$('qno').textContent=`Question ${i+1} of 15`;$('q').textContent=quiz[i][0];$('opts').innerHTML='';const order=quiz[i][1].map((text,index)=>({text,index}));shuffle(order).forEach((x,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{selected=x.index;document.querySelectorAll('.opt').forEach(z=>z.classList.remove('sel'));b.classList.add('sel');$('continue').disabled=false};$('opts').appendChild(b)});$('score').textContent=`${correct} / 15`;$('fill').style.width=`${(i/15)*100}%`}$('continue').onclick=()=>{if(selected===null)return;if(!checked){checked=true;const ok=selected===quiz[i][2];if(ok)correct++;document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const n=Number(b.dataset.index);if(n===quiz[i][2])b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=ok?'🎉 Correct! +10 XP':'💡 Review the highlighted correct answer.';$('score').textContent=`${correct} / 15`;$('fill').style.width=`${((i+1)/15)*100}%`;$('continue').textContent=i===14?'Finish Skill →':'Continue →';return}if(i<14){i++;render()}else{$('quizCard').innerHTML=`<div class="done">🏆 Skill Complete!</div><p>You scored ${correct} / 15.</p><button class="btn" onclick="location.reload()">Retry →</button>`}};$('back').onclick=function(){const s=sessionStorage.getItem('skillupLastPhysicsPath');if(s){try{const u=new URL(s,location.href);if(u.origin===location.origin){location.href=s;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();</script></body></html>
