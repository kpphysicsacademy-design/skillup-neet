.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>⛰️ Rolling on an Incline</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [{"q":"A rigid body rolls down a fixed incline without slipping. Its acceleration depends on:","o":["Only its mass","Its moment of inertia relative to mR²","Only the incline length","Only the colour of the surface"],"a":1,"e":"For a body rolling without slipping, a = g sinθ / (1 + Icm/(mR²))."},{"q":"For pure rolling down an incline of angle θ, the centre-of-mass acceleration is:","o":["g sinθ","g cosθ","g sinθ / (1 + Icm/mR²)","g tanθ"],"a":2,"e":"The rotational inertia reduces the translational acceleration: a = g sinθ/[1 + Icm/(mR²)]."},{"q":"For a uniform solid sphere rolling down an incline, Icm equals:","o":["mR²","½mR²","2/5 mR²","2/3 mR²"],"a":2,"e":"A uniform solid sphere has Icm = 2mR²/5."},{"q":"The acceleration of a uniform solid sphere rolling without slipping down an incline is:","o":["(5/7)g sinθ","(2/3)g sinθ","(1/2)g sinθ","g sinθ"],"a":0,"e":"Substitute I/(mR²)=2/5 to get a = g sinθ/(1+2/5)=5g sinθ/7."},{"q":"A solid cylinder rolls down an incline without slipping. Its acceleration is:","o":["(2/3)g sinθ","(1/2)g sinθ","(5/7)g sinθ","g sinθ"],"a":0,"e":"For a solid cylinder I = ½mR², so a = g sinθ/(1+1/2) = 2g sinθ/3."},{"q":"A thin hoop rolls without slipping down an incline. Its acceleration is:","o":["g sinθ","(2/3)g sinθ","(1/2)g sinθ","(5/7)g sinθ"],"a":2,"e":"For a hoop I = mR², so a = g sinθ/(1+1) = ½g sinθ."},{"q":"Which of these reaches the bottom first on the same ideal incline from the same height, assuming pure rolling?","o":["Thin hoop","Solid cylinder","Uniform solid sphere","All always tie"],"a":2,"e":"The solid sphere has the smallest I/(mR²) among these objects, giving it the greatest acceleration."},{"q":"Why does a rolling body accelerate less than a frictionless sliding body on the same incline?","o":["Gravity is weaker for it","Some gravitational energy goes into rotation","Its mass disappears","Normal force always points downhill"],"a":1,"e":"Part of the lost gravitational potential energy becomes rotational kinetic energy."},{"q":"For a body rolling without slipping down an incline, the static friction force generally acts:","o":["Down the incline","Up the incline","Perpendicular to the incline only","Always zero"],"a":1,"e":"For a body released from rest, static friction typically acts uphill to provide the torque needed for rotation."},{"q":"In ideal rolling without slipping, static friction does what work at the instantaneous contact point on a fixed incline?","o":["Positive work always","Negative work always","Zero work","Infinite work"],"a":2,"e":"The contact point is instantaneously at rest relative to the stationary surface, so ideal static friction does no work there."},{"q":"A rolling body descends through vertical height h from rest without energy losses. Its final total kinetic energy is:","o":["mgh","½mgh","2mgh","Zero"],"a":0,"e":"Conservation of mechanical energy gives mgh = Ktrans + Krot."},{"q":"For pure rolling from rest through height h, the final speed satisfies:","o":["v² = 2gh","v² = 2gh/[1+I/(mR²)]","v² = gh[1+I/(mR²)]","v = gh"],"a":1,"e":"Using mgh = ½mv² + ½I(v²/R²) gives v² = 2gh/[1+I/(mR²)]."},{"q":"A solid sphere rolls from rest down a vertical height h. Its speed at the bottom is:","o":["√(10gh/7)","√(gh)","√(2gh)","√(7gh/10)"],"a":0,"e":"For a solid sphere, 1 + I/(mR²) = 7/5, so v² = 10gh/7."},{"q":"A solid cylinder rolls from rest down a vertical height h. Its speed at the bottom is:","o":["√(2gh)","√(4gh/3)","√(gh)","√(10gh/7)"],"a":1,"e":"For a solid cylinder, 1 + I/(mR²) = 3/2, so v² = 4gh/3."},{"q":"A hoop rolls from rest down a vertical height h. Its speed at the bottom is:","o":["√(gh)","√(2gh)","√(4gh/3)","√(10gh/7)"],"a":0,"e":"For a hoop, 1 + I/(mR²) = 2, so v² = gh."},{"q":"A solid sphere and a hoop roll from the same height without slipping. Which has greater speed at the bottom?","o":["Hoop","Solid sphere","Same speed","Depends only on mass"],"a":1,"e":"The solid sphere has a smaller rotational inertia ratio, so a larger fraction of mgh becomes translational kinetic energy."},{"q":"If the incline angle increases while the body continues to roll purely, the acceleration of its centre generally:","o":["Decreases to zero","Increases with sinθ","Stays unchanged","Becomes negative"],"a":1,"e":"For a fixed body, a is proportional to sinθ."},{"q":"For a rolling body on an incline, the normal force on a straight slope is:","o":["mg sinθ","mg cosθ","mg tanθ","Always mg"],"a":1,"e":"With no acceleration perpendicular to the plane, N = mg cosθ."},{"q":"A body rolls down an incline of angle θ. The component of gravity parallel to the slope is:","o":["mg cosθ","mg sinθ","mg/ sinθ","mg tanθ"],"a":1,"e":"Resolve the weight along the incline: the parallel component is mg sinθ."},{"q":"The component of gravity perpendicular to the incline is:","o":["mg sinθ","mg cosθ","mg tanθ","Zero for all angles"],"a":1,"e":"The perpendicular component of weight is mg cosθ."},{"q":"For a solid sphere rolling purely, its linear and angular accelerations are related by:","o":["a = α/R","a = Rα","a = Rα²","a = αR²"],"a":1,"e":"Differentiating v = Rω for fixed radius gives a = Rα along the slope."},{"q":"A solid cylinder rolls down a 30° incline without slipping. Its acceleration is (take g = 9.8 m/s²):","o":["2.45 m/s²","3.27 m/s²","4.9 m/s²","6.53 m/s²"],"a":1,"e":"a = (2/3)g sin30° = (2/3)(9.8)(0.5) ≈ 3.27 m/s²."},{"q":"A solid sphere rolls down a 30° incline with g = 9.8 m/s². Its acceleration is:","o":["2.8 m/s²","3.5 m/s²","4.9 m/s²","7.0 m/s²"],"a":1,"e":"a = (5/7)g sin30° = (5/7)(4.9) = 3.5 m/s²."},{"q":"A hoop rolls down a 30° incline with g = 9.8 m/s². Its acceleration is:","o":["2.45 m/s²","3.27 m/s²","4.9 m/s²","9.8 m/s²"],"a":0,"e":"For a hoop a = ½g sin30° = ½ × 4.9 = 2.45 m/s²."},{"q":"Which condition must hold for a body to roll without slipping on the incline?","o":["vCM = Rω","vCM = ω/R","vCM = Rα","vCM = 0"],"a":0,"e":"The no-slip kinematic condition is vCM = Rω."},{"q":"For ideal rolling down an incline, the friction is static because:","o":["The contact surfaces do not slip relative to each other","The body has no rotation","Gravity is absent","The normal force is zero"],"a":0,"e":"Static friction prevents relative motion at the contact point when pure rolling is maintained."},{"q":"If a body slides down an incline with no friction, what is its acceleration along the slope?","o":["g sinθ","g cosθ","g sinθ/(1+I/mR²)","Zero"],"a":0,"e":"With no frictional torque, the body slides with a = g sinθ and does not gain rotational speed from the slope's friction."},{"q":"For a given incline angle, which body has the smallest acceleration among a solid sphere, solid cylinder, and thin hoop when each rolls purely?","o":["Solid sphere","Solid cylinder","Thin hoop","They are equal"],"a":2,"e":"The hoop has I/(mR²)=1, the largest of these ratios, so its acceleration is smallest."},{"q":"A rolling body starts from rest and travels a distance s down a constant incline with acceleration a. Its speed satisfies:","o":["v² = 2as","v = 2as","v² = as²","v = a/s"],"a":0,"e":"For constant acceleration from rest, v² = 2as."},{"q":"The rotational kinetic energy of a rolling body about its centre is:","o":["½Icmω²","½mv² only","Iα","mgh always"],"a":0,"e":"The rotational part is Krot = ½Icmω²."},{"q":"Why is conservation of mechanical energy useful for ideal rolling down an incline?","o":["It relates height lost to both translational and rotational KE","It says the normal force does all the work","It removes the no-slip condition","It makes the moment of inertia zero"],"a":0,"e":"With no dissipative losses, mgh converts into the sum of translational and rotational kinetic energies."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Rolling on an Incline Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
