<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Rolling on an Incline</title><style>body{margin:0;background:#f5f7fa;font-family:Arial,sans-serif;color:#172033}.wrap{max-width:760px;margin:auto;padding:24px 16px 50px}.head{display:flex;justify-content:space-between;align-items:center}.title{font-size:28px;font-weight:800}.xp{font-weight:700;color:#168447}.sub{color:#667085;margin:8px 0 18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #0000000b}.mastery{font-weight:700}.bar{height:10px;background:#e7ebf0;border-radius:10px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#22a06b;transition:.3s}.qno{font-size:14px;color:#667085}.q{font-size:20px;font-weight:750;line-height:1.4;margin:10px 0 18px}.opt{display:block;width:100%;text-align:left;padding:14px;margin:9px 0;border:2px solid #d9dee7;background:#fff;border-radius:12px;cursor:pointer;font-size:16px;transition:.15s}.opt:hover{transform:translateY(-1px);border-color:#7b8798}.opt.sel{border-color:#3578e5;background:#eef5ff}.opt.correct{border-color:#20a464;background:#eaf8f0}.opt.wrong{border-color:#d64545;background:#fff0f0}.btn{border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:750;cursor:pointer;background:#22a06b;color:white}.btn:disabled{opacity:.5;cursor:not-allowed}.back{display:inline-block;text-decoration:none;color:#344054;border:2px solid #d9dee7;border-radius:12px;padding:12px 18px;font-weight:700;background:#fff;transition:.15s}.back:hover{transform:translateY(-2px);box-shadow:0 5px 14px #00000012}.feedback{min-height:24px;font-weight:700;margin-top:14px}.done{text-align:center;font-size:22px;font-weight:800}@media(max-width:600px){.title{font-size:23px}.q{font-size:18px}}</style></head><body><main class="wrap"><div class="head"><div class="title">⛰️ Rolling on an Incline</div><div class="xp">+10 XP</div></div><div class="sub">Acceleration, energy and friction for bodies rolling without slipping down an incline.</div><section class="card"><div class="mastery">🎯 Skill Mastery <span id="score">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card" id="quizCard"><div class="qno" id="qno"></div><div class="q" id="q"></div><div id="opts"></div><button class="btn" id="continue" disabled>Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>const quiz=[['For a body rolling without slipping down an incline of angle θ, its acceleration is generally:', ['g sinθ/(1+I/MR²)','g cosθ','g tanθ','g sinθ(1+I/MR²)'],0],['For a solid cylinder rolling down an incline, I about its axis is:', ['1/2 MR²','MR²','2/5 MR²','1/4 MR²'],0],['For a solid sphere rolling down an incline, I about a diameter is:', ['2/5 MR²','1/2 MR²','2/3 MR²','MR²'],0],['A hoop and a solid sphere start from rest at the same height and roll without slipping. Which reaches the bottom first?', ['solid sphere','hoop','both simultaneously','depends only on mass'],0],['For rolling without slipping down a fixed incline, static friction is responsible for:', ['providing the torque needed for rotation','always opposing motion with kinetic friction','making the body slide','eliminating gravity'],0],['The acceleration of a rolling body down an incline depends on its:', ['moment of inertia distribution','mass alone','colour','circumference alone'],0],['For pure rolling, the condition relating translational and angular acceleration is:', ['a=Rα','a=α/R','a=R/α','a=α+R'],0],['If a body rolls without slipping from height h, the loss of gravitational potential energy becomes:', ['translational plus rotational kinetic energy','rotational energy only','translational energy only','thermal energy only'],0],['For an ideal rolling body descending an incline, mechanical energy is:', ['conserved','always doubled','always zero','converted entirely to heat'],0],['A ring and a disc have equal mass and radius. Rolling down the same incline without slipping, which has greater acceleration?', ['disc','ring','same acceleration','cannot be determined'],0],['For a thin ring, I/MR² equals:', ['1','1/2','2/5','1/4'],0],['For a solid cylinder, I/MR² equals:', ['1/2','1','2/5','1/4'],0],['If the angle of an incline is increased, the rolling acceleration generally:', ['increases','decreases to zero','remains unchanged','becomes independent of g'],0],['At the same centre-of-mass speed, a rolling body has rotational kinetic energy:', ['1/2 I(v/R)²','1/2 Mv² only','MvR','I/Rv'],0],['For a rolling body released from rest on an incline, the acceleration is less than g sinθ when its rotational inertia is finite because:', ['some gravitational energy produces rotation','gravity disappears','mass becomes zero','friction is necessarily kinetic'],0]];let i=0,correct=0,selected=null,checked=false;function $(x){return document.getElementById(x)}function shuffle(a){for(let k=a.length-1;k>0;k--){let r=Math.floor(Math.random()*(k+1));[a[k],a[r]]=[a[r],a[k]]}return a}function render(){selected=null;checked=false;$('continue').disabled=true;$('continue').textContent='Continue →';$('feedback').textContent='';$('qno').textContent=`Question ${i+1} of 15`;$('q').textContent=quiz[i][0];$('opts').innerHTML='';const order=quiz[i][1].map((text,index)=>({text,index}));shuffle(order).forEach((x,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{selected=x.index;document.querySelectorAll('.opt').forEach(z=>z.classList.remove('sel'));b.classList.add('sel');$('continue').disabled=false};$('opts').appendChild(b)});$('score').textContent=`${correct} / 15`;$('fill').style.width=`${(i/15)*100}%`}$('continue').onclick=()=>{if(selected===null)return;if(!checked){checked=true;const ok=selected===quiz[i][2];if(ok)correct++;document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const n=Number(b.dataset.index);if(n===quiz[i][2])b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=ok?'🎉 Correct! +10 XP':'💡 Review the highlighted correct answer.';$('score').textContent=`${correct} / 15`;$('fill').style.width=`${((i+1)/15)*100}%`;$('continue').textContent=i===14?'Finish Skill →':'Continue →';return}if(i<14){i++;render()}else{$('quizCard').innerHTML=`<div class="done">🏆 Skill Complete!</div><p>You scored ${correct} / 15.</p><button class="btn" onclick="location.reload()">Retry →</button>`}};$('back').onclick=function(){const s=sessionStorage.getItem('skillupLastPhysicsPath');if(s){try{const u=new URL(s,location.href);if(u.origin===location.origin){location.href=s;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();</script></body></html>
