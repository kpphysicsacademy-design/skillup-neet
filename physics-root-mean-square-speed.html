<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Root Mean Square Speed</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>💨 Root Mean Square Speed</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['The root mean square speed of gas molecules is given by','v<sub>rms</sub> = √(RT/M)','v<sub>rms</sub> = √(3RT/M)','v<sub>rms</sub> = √(2RT/M)','v<sub>rms</sub> = 3RT/M',1,'For an ideal gas, v<sub>rms</sub> = √(3RT/M), where M is molar mass in kg mol⁻¹.'],
['The rms speed of gas molecules is proportional to the square root of','temperature','molar mass','pressure','density',0,'At fixed molar mass, v<sub>rms</sub> ∝ √T.'],
['At constant temperature, rms speed is proportional to','M','√M','1/√M','1/M',2,'From v<sub>rms</sub> = √(3RT/M), the rms speed is proportional to 1/√M at constant T.'],
['If the absolute temperature of a gas is increased four times, its rms speed becomes','2 times','4 times','8 times','1/2 times',0,'Because v<sub>rms</sub> ∝ √T, increasing T by a factor of 4 increases speed by a factor of 2.'],
['If the rms speed of a gas is v at temperature T, at temperature 9T it is','9v','3v','v/3','27v',1,'v<sub>rms</sub> ∝ √T, so √9 = 3 and the new speed is 3v.'],
['Which gas has the highest rms speed at the same temperature?','O<sub>2</sub>','N<sub>2</sub>','H<sub>2</sub>','CO<sub>2</sub>',2,'At the same temperature, rms speed varies inversely as √M. H₂ has the lowest molar mass here.'],
['The rms speed of an ideal gas does not directly depend on its','temperature','molar mass','pressure','molecular mass',2,'For an ideal gas, v<sub>rms</sub> = √(3RT/M), so pressure does not appear explicitly.'],
['For two gases at the same temperature, the ratio of rms speeds is','v<sub>rms,1</sub>/v<sub>rms,2</sub> = √(M₂/M₁)','√(M₁/M₂)','M₁/M₂','M₂/M₁',0,'Since v<sub>rms</sub> ∝ 1/√M, the ratio is √(M₂/M₁).'],
['The rms speed of oxygen is 500 m/s. If hydrogen is at the same temperature, its rms speed is approximately','125 m/s','250 m/s','1000 m/s','2000 m/s',3,'v<sub>H2</sub>/v<sub>O2</sub> = √(32/2) = 4, so 500 × 4 = 2000 m/s.'],
['The SI unit of rms speed is','m s⁻¹','m² s⁻²','kg m s⁻¹','J',0,'Speed is measured in metres per second (m s⁻¹) in SI.'],
['For an ideal gas, the mean translational kinetic energy per molecule can be written in terms of rms speed as','mv<sub>rms</sub>','½mv<sub>rms</sub>²','3mv<sub>rms</sub>²','mv<sub>rms</sub>²/3',1,'By definition of rms speed, average translational kinetic energy is ½m v<sub>rms</sub>².'],
['If the molar mass of a gas is doubled at constant temperature, its rms speed becomes','2v','v/2','v/√2','√2v',2,'Because v<sub>rms</sub> ∝ 1/√M, doubling M changes speed to v/√2.'],
['The rms speed is related to pressure and density of an ideal gas by','v<sub>rms</sub> = √(3P/ρ)','v<sub>rms</sub> = Pρ','v<sub>rms</sub> = √(ρ/3P)','v<sub>rms</sub> = P/ρ',0,'From kinetic theory, P = ⅓ρv<sub>rms</sub>². Therefore v<sub>rms</sub> = √(3P/ρ).'],

];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').innerHTML=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
