<script>
(function(){'use strict';
const source=[["Rotational kinematics is the study of:","Rotational motion without its causes","Torque causing rotation","Energy stored in a rotating body","Angular momentum conservation",0,"Kinematics describes motion; dynamics explains its causes."],["The rotational analogue of linear displacement is:","Angular displacement","Angular velocity","Angular acceleration","Torque",0,"Angular displacement θ corresponds to linear displacement x."],["The SI unit of angular displacement is:","Radian","Revolution per second","Newton metre","Radian per second",0,"The radian is the SI unit for plane angle."],["One complete revolution is equal to:","2π rad","π rad","π/2 rad","4π rad",0,"A full turn is 360°, which equals 2π radians."],["Average angular velocity is:","Change in angular displacement / time","Change in angular acceleration / time","Angular displacement × time","Angular acceleration × time",0,"ωavg = Δθ/Δt."],["The SI unit of angular velocity is:","rad s⁻¹","rad s⁻²","m s⁻¹","s⁻¹ m",0,"Angular velocity is measured in radians per second."],["Angular acceleration is the rate of change of:","Angular velocity","Angular displacement","Radius","Moment of inertia",0,"α = dω/dt."],["The SI unit of angular acceleration is:","rad s⁻²","rad s⁻¹","m s⁻²","N m",0,"Angular acceleration is measured in radians per second squared."],["For constant angular acceleration, final angular velocity is:","ω = ω₀ + αt","ω = ω₀ − α/t","ω = αt²","ω² = ω₀ + 2αt",0,"This is the rotational form of v = u + at."],["For constant α, angular displacement is:","Δθ = ω₀t + ½αt²","Δθ = ω₀ + αt²","Δθ = αt/2","Δθ = ω₀t²",0,"Use Δθ = ω₀t + ½αt²."],["Which equation eliminates time?","ω² = ω₀² + 2αΔθ","ω = ω₀ + αt","Δθ = ωt","α = ωt",0,"The third rotational equation relates ω, ω₀, α and Δθ."],["A wheel starts from rest with α = 3 rad s⁻² for 4 s. Final ω is:","12 rad s⁻¹","7 rad s⁻¹","24 rad s⁻¹","3 rad s⁻¹",0,"ω = 0 + 3 × 4 = 12 rad s⁻¹."],["A disc starts from rest with α = 2 rad s⁻² for 5 s. Its angular displacement is:","25 rad","10 rad","50 rad","5 rad",0,"Δθ = ½ × 2 × 5² = 25 rad."],["A rotor changes from 4 to 16 rad s⁻¹ in 3 s. Its average α is:","4 rad s⁻²","6 rad s⁻²","12 rad s⁻²","3 rad s⁻²",0,"α = (16 − 4)/3 = 4 rad s⁻²."],["A wheel slows from 20 to 8 rad s⁻¹ in 4 s. Its α is:","−3 rad s⁻²","+3 rad s⁻²","−7 rad s⁻²","+7 rad s⁻²",0,"α = (8 − 20)/4 = −3 rad s⁻²."],["If angular acceleration is zero, angular velocity is:","Constant","Always zero","Always increasing","Undefined",0,"Zero angular acceleration means angular velocity does not change."],["A wheel rotates at 6 rad s⁻¹ for 5 s. Angular displacement is:","30 rad","11 rad","1.2 rad","60 rad",0,"For constant ω, Δθ = ωt = 6 × 5 = 30 rad."],["A wheel starts at 2 rad s⁻¹ and α = 2 rad s⁻² for 3 s. Final ω is:","8 rad s⁻¹","6 rad s⁻¹","12 rad s⁻¹","4 rad s⁻¹",0,"ω = 2 + 2 × 3 = 8 rad s⁻¹."],["A body starts from rest and turns through 36 rad in 6 s. Constant α is:","2 rad s⁻²","1 rad s⁻²","3 rad s⁻²","6 rad s⁻²",0,"36 = ½α × 36, so α = 2 rad s⁻²."],["A rotor with ω₀ = 5 rad s⁻¹ and α = 2 rad s⁻² turns for 4 s. Δθ is:","36 rad","20 rad","16 rad","40 rad",0,"Δθ = 5 × 4 + ½ × 2 × 16 = 36 rad."],["A wheel at 12 rad s⁻¹ decelerates at 3 rad s⁻². Time to stop is:","4 s","3 s","9 s","36 s",0,"0 = 12 − 3t, hence t = 4 s."],["A wheel starts from rest and reaches 10 rad s⁻¹ with α = 5 rad s⁻². Δθ is:","10 rad","20 rad","5 rad","50 rad",0,"ω² = 2αΔθ, so Δθ = 100/10 = 10 rad."],["For constant angular acceleration, average angular velocity is:","(ω₀ + ω)/2","ω₀ × ω","ω − ω₀","α/2",0,"Angular velocity changes linearly, so the time average is the mean of its endpoints."],["If ω and α have the same sign, angular speed generally:","Increases","Decreases","Becomes zero immediately","Remains constant",0,"Same signs mean α increases the magnitude of ω."],["If ω and α have opposite signs, angular speed generally:","Decreases","Increases","Must remain constant","Becomes infinite",0,"Opposite signs mean angular acceleration reduces the magnitude of angular velocity."],["A point is 0.4 m from the axis and ω = 5 rad s⁻¹. Tangential speed is:","2 m s⁻¹","12.5 m s⁻¹","5.4 m s⁻¹","0.08 m s⁻¹",0,"v = rω = 0.4 × 5 = 2 m s⁻¹."],["Tangential acceleration at radius r is:","aₜ = rα","aₜ = rω²","aₜ = ω/r","aₜ = α/r",0,"Tangential acceleration is r times angular acceleration."],["Radial acceleration magnitude is:","aᵣ = rω²","aᵣ = rα","aᵣ = ω/r","aᵣ = αt",0,"Centripetal (radial) acceleration is rω²."],["For a rigid body rotating about a fixed axis, all points have the same:","Angular velocity","Tangential speed","Linear acceleration","Distance from axis",0,"Angular quantities are common to all points of a rigid body."],["The standard rotational kinematic equations apply when:","Angular acceleration is constant","Angular velocity is zero","Torque is zero","Radius changes uniformly",0,"The equations assume constant angular acceleration."]];
let questions=source.map(q=>({q:q[0],o:q.slice(1,5).map((v,i)=>({text:v,correct:i===q[5]})),e:q[6]}));
const original=questions.map(q=>({q:q.q,o:q.o.map(x=>({...x})),e:q.e}));
let index=0,score=0,chosen=null,locked=false,wrong=[];
const $=id=>document.getElementById(id);
function shuffle(items){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function render(){chosen=null;locked=false;const item=questions[index];$('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;$('feedback').className='feedback';$('feedback').textContent='';$('check').style.display='block';$('check').disabled=true;$('continue').className='btn continue show';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';$('options').replaceChildren();item.o=shuffle(item.o);item.o.forEach((option,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=option.text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});}
$('check').addEventListener('click',()=>{if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')],correct=item.o.findIndex(x=>x.correct);buttons.forEach((b,j)=>{b.disabled=true;if(j===correct)b.classList.add('correct');});const f=$('feedback');if(item.o[chosen].correct){score++;$('xp').textContent=score*10;f.className='feedback show good';f.textContent='Correct! '+item.e;}else{wrong.push(item);buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[correct].text+'.';}$('check').style.display='none';$('continue').className='btn continue show';});
$('continue').addEventListener('click',()=>{if(!locked)return;index++;if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}$('quiz').style.display='none';const card=document.createElement('section');card.className='finish';const pct=Math.round(score/questions.length*100);card.innerHTML='<div style="font-size:52px">🏆</div><h2>Practice complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+score*10+' XP earned</p><p class="muted">'+(wrong.length?'Review the concepts you missed, then try again.':'Excellent work — all answers correct!')+'</p><button class="btn" id="retryWrong" style="display:'+(wrong.length?'inline-block':'none')+'">Retry wrong answers ('+wrong.length+')</button><button class="btn" id="retryAll">Practice all 30 again</button>';$('finishSlot').replaceChildren(card);function reset(list){questions=list.map(q=>({q:q.q,o:q.o.map(x=>({...x})),e:q.e}));index=0;score=0;wrong=[];$('xp').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});}$('retryWrong').addEventListener('click',()=>reset(wrong));$('retryAll').addEventListener('click',()=>reset(original));});
render();
})();
</script>
