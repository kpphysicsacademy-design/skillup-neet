.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🔄 Rotational Kinetic Energy</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [{"q":"What is the rotational kinetic energy of a rigid body?","o":["½Iω²","½mv","Iω","½Iω"],"a":0,"e":"Rotational kinetic energy is K = ½Iω², where I is moment of inertia and ω is angular velocity."},{"q":"In K = ½Iω², what does I represent?","o":["Impulse","Moment of inertia","Angular acceleration","Torque"],"a":1,"e":"I is the moment of inertia about the chosen axis."},{"q":"What is the SI unit of rotational kinetic energy?","o":["kg m²/s","N m²","Joule (J)","kg m/s"],"a":2,"e":"Rotational kinetic energy is energy, so its SI unit is the joule."},{"q":"What is the SI unit of angular velocity?","o":["rad/s","rad/s²","m/s","N m"],"a":0,"e":"Angular velocity is measured in radians per second (rad/s)."},{"q":"If angular velocity doubles and I stays constant, rotational KE becomes:","o":["2 times","4 times","Half","Unchanged"],"a":1,"e":"K is proportional to ω², so doubling ω makes K four times larger."},{"q":"If moment of inertia doubles while ω stays constant, rotational KE becomes:","o":["Half","Four times","Double","Unchanged"],"a":2,"e":"K is directly proportional to I when angular velocity is fixed."},{"q":"A body has I = 2 kg m² and ω = 3 rad/s. Its rotational KE is:","o":["6 J","9 J","18 J","3 J"],"a":1,"e":"K = ½ × 2 × 3² = 9 J."},{"q":"For I = 4 kg m² and ω = 2 rad/s, rotational KE is:","o":["8 J","4 J","16 J","2 J"],"a":0,"e":"K = ½ × 4 × 2² = 8 J."},{"q":"A wheel has I = 0.5 kg m² and ω = 4 rad/s. Find its rotational KE.","o":["2 J","4 J","8 J","16 J"],"a":1,"e":"K = ½ × 0.5 × 16 = 4 J."},{"q":"If rotational KE is 18 J and I = 4 kg m², the angular speed is:","o":["3 rad/s","9 rad/s","√18 rad/s","6 rad/s"],"a":0,"e":"18 = ½ × 4 × ω², so ω² = 9 and ω = 3 rad/s."},{"q":"For a point mass m at distance r from the axis, its rotational KE can be written as:","o":["½mrω","½mr²ω²","mr²ω","½mω²/r"],"a":1,"e":"For a point mass I = mr², so K = ½mr²ω²."},{"q":"Why do points in a rigid body share the same angular velocity about a fixed axis?","o":["They have the same radius","The body rotates together as one rigid object","Their linear speeds are equal","Their masses are equal"],"a":1,"e":"All points of a rigid body turn through the same angle in the same time."},{"q":"Do all points of a rotating rigid body have the same linear speed?","o":["Always","Only if masses are equal","No; speed depends on distance from the axis","Only at rest"],"a":2,"e":"Tangential speed is v = rω, so points at different radii have different speeds."},{"q":"The rotational KE of a body at rest is:","o":["Maximum","Zero","Negative","Equal to I"],"a":1,"e":"At rest ω = 0, so K = ½I(0)² = 0."},{"q":"If angular speed becomes three times as large, rotational KE becomes:","o":["3 times","6 times","9 times","1/3"],"a":2,"e":"Because K ∝ ω², tripling ω increases energy by 3² = 9."},{"q":"A rotating body's moment of inertia is 6 kg m² and KE is 12 J. Its angular speed is:","o":["1 rad/s","2 rad/s","4 rad/s","6 rad/s"],"a":1,"e":"12 = ½ × 6 × ω², so ω² = 4 and ω = 2 rad/s."},{"q":"Which quantity plays the role of mass in the rotational KE formula?","o":["Torque","Angular displacement","Moment of inertia","Angular acceleration"],"a":2,"e":"Moment of inertia I is the rotational analogue of mass in this energy relation."},{"q":"Translational kinetic energy is ½mv². Its rotational analogue is:","o":["½Iω²","Iα","τθ","Iω"],"a":0,"e":"The analogous rotational expression is ½Iω²."},{"q":"For a body rolling without slipping, total kinetic energy is:","o":["Only ½mv²","Only ½Iω² about its centre","½mv² + ½Icmω²","mgh always"],"a":2,"e":"Rolling motion combines translational KE of the centre of mass and rotational KE about it."},{"q":"A rolling body has m = 2 kg and centre speed v = 3 m/s. Its translational KE is:","o":["3 J","6 J","9 J","18 J"],"a":2,"e":"Ktrans = ½mv² = ½ × 2 × 9 = 9 J."},{"q":"For pure rolling, the relation between centre speed and angular speed is:","o":["v = ω/R","v = Rω","v = R/ω","v = ω²R"],"a":1,"e":"For rolling without slipping, the centre-of-mass speed is v = Rω."},{"q":"A solid disc has I = ½MR². Its rotational KE at angular speed ω is:","o":["¼MR²ω²","½MRω²","MR²ω","½Mω²"],"a":0,"e":"Substitute I = ½MR² into K = ½Iω² to get K = ¼MR²ω²."},{"q":"A thin ring has I = MR² about its central axis. Its rotational KE is:","o":["¼MR²ω²","½MR²ω²","MR²ω²","½Mω²/R²"],"a":1,"e":"K = ½Iω² = ½MR²ω²."},{"q":"If I = 3 kg m² and ω changes from 2 to 4 rad/s, the change in KE is:","o":["6 J","12 J","18 J","24 J"],"a":2,"e":"Initial K = 6 J; final K = 24 J; change = 18 J."},{"q":"A flywheel stores rotational KE. Which change increases its energy most directly?","o":["Reducing ω","Increasing ω","Reducing I and ω","Stopping rotation"],"a":1,"e":"At fixed I, increasing angular speed increases energy quadratically."},{"q":"If a body has rotational KE 50 J and angular speed doubles with I unchanged, its new KE is:","o":["100 J","150 J","200 J","25 J"],"a":2,"e":"Doubling ω multiplies rotational KE by four: 50 × 4 = 200 J."},{"q":"The work done by a constant torque τ through angular displacement θ is:","o":["τ/θ","τθ","½τθ²","τ + θ"],"a":1,"e":"For constant torque aligned with the angular displacement, work W = τθ."},{"q":"Net work done by torque on a rigid body changes its:","o":["Mass","Moment of inertia always","Rotational kinetic energy","Angular position only"],"a":2,"e":"The rotational work-energy theorem states that net work changes rotational kinetic energy."},{"q":"If I = 8 kg m² and rotational KE = 16 J, ω equals:","o":["1 rad/s","2 rad/s","4 rad/s","8 rad/s"],"a":1,"e":"16 = ½ × 8 × ω², giving ω² = 4 and ω = 2 rad/s."},{"q":"Which statement about rotational kinetic energy is correct?","o":["It can be negative","It depends on I and ω²","It depends only on mass","It is measured in newtons"],"a":1,"e":"K = ½Iω²; for a physical body I ≥ 0 and ω² ≥ 0, so rotational KE is non-negative."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Rotational Kinetic Energy Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
