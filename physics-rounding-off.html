<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Rounding Off</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;line-height:1.45}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px;line-height:1.5}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🔄 Rounding Off</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['Round 3.746 to 3 significant figures.','3.74','3.75','3.70','3.746',1,'The first three significant digits are 3, 7 and 4. The next digit is 6, so 4 rounds to 5.'],
['Round 12.34 to 3 significant figures.','12.3','12.4','12.0','13.0',0,'The fourth significant digit is 4, so the third digit remains unchanged: 12.3.'],
['Round 0.006784 to 2 significant figures.','0.0067','0.0068','0.00678','0.0070',1,'Leading zeros are not significant. The first two significant digits are 6 and 7; the next digit 8 rounds 7 to 8.'],
['Round 58.65 to 3 significant figures.','58.6','58.7','58.65','59.0',1,'The fourth significant digit is 5, so 58.6 rounds to 58.7 using the usual half-up rule.'],
['Round 149.6 to the nearest integer.','149','150','149.6','151',1,'The tenths digit is 6, so 149 rounds up to 150.'],
['Round 2.995 to 3 significant figures.','2.99','3.00','2.995','3.01',1,'To 3 significant figures, 2.995 rounds to 3.00; the zeros shown preserve three significant figures.'],
['Round 0.9996 to 3 significant figures.','0.999','1.00','0.100','1.01',1,'0.9996 rounds upward at the fourth significant digit, giving 1.00 to three significant figures.'],
['Round 4567 to 2 significant figures.','45','4600','4500','4700',1,'The first two significant digits are 4 and 5; the next digit is 6, so 45 becomes 46, giving 4600.'],
['Round 0.04567 to 3 significant figures.','0.0456','0.0457','0.0460','0.04567',1,'The first three significant digits are 4, 5 and 6; the next digit 7 rounds 6 to 7.'],
['Round 8.2649 to 2 decimal places.','8.26','8.27','8.264','8.30',1,'The third decimal digit is 4, so the hundredths digit remains 6: 8.26.'],
['Round 15.995 to 2 decimal places.','15.99','16.00','15.10','16.01',1,'The third decimal digit is 5, so 15.99 rounds upward to 16.00.'],
['When rounding a number, the digit immediately to the right of the last retained digit is used to:','Determine whether to round up or leave unchanged','Change the unit','Remove all zeros','Determine the dimensions',0,'The next digit determines whether the retained digit is increased under the rounding rule.'],
['If the next digit is less than 5, the retained digit is generally:','Increased by 1','Left unchanged','Doubled','Made zero',1,'For the usual rounding rule, a following digit below 5 means the retained digit stays unchanged.'],
['If the next digit is greater than 5, the retained digit is generally:','Left unchanged','Decreased by 1','Increased by 1','Removed',2,'For the usual rounding rule, a following digit above 5 increases the retained digit by 1.'],
['Round 0.004995 to 2 significant figures.','0.0049','0.0050','0.0051','0.00499',1,'The first two significant digits are 4 and 9; the next digit is 9, causing a carry and giving 0.0050.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
