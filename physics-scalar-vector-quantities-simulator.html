<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scalar and Vector Quantities — Simulator</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f2f8ff;color:#20344c}main{max-width:900px;margin:auto;padding:16px}header{background:white;padding:14px}a{color:#136a9e}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}.tabs a{background:white;border:1px solid #dce6ef;border-radius:10px;padding:12px 3px;min-height:44px;text-align:center}.card{background:white;border:1px solid #dce6ef;border-radius:14px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{display:block;width:100%;min-height:44px;margin:8px 0;padding:12px;text-align:left;border:2px solid #dce6ef;border-radius:10px;background:white;cursor:pointer}.action{min-height:44px;padding:12px 16px;border:0;border-radius:10px;background:#58cc02;color:white;font-weight:bold;cursor:pointer}.choice:focus-visible,.action:focus-visible{outline:3px solid #1cb0f6}input[type=range]{width:100%}svg{width:100%;height:auto;background:#f7fbff;border-radius:12px}.muted{color:#64748b}@media(max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}}</style></head><body><header><a href="physics-home.html">← Physics</a> · SkillUp NEET</header><main><h1>Scalar and Vector Quantities</h1><p class="muted">Supplementary concept · Canonical 400-concept curriculum unchanged.</p><nav class="tabs" aria-label="Scalar and Vector pages"><a href="physics-scalar-vector-quantities-learn.html">Learn</a><a href="physics-scalar-vector-quantities-simulator.html" aria-current="page">Simulator</a><a href="physics-scalar-vector-quantities-practice.html">Practice</a></nav><section class="grid"><article class="card"><h2>Vector A</h2><label>Magnitude <output id="amv">5 N</output><input id="am" type="range" min="0" max="20" step=".5" value="5"></label><label>Angle from east <output id="aav">0°</output><input id="aa" type="range" min="-180" max="180" step="5" value="0"></label><h2>Vector B</h2><label>Magnitude <output id="bmv">5 N</output><input id="bm" type="range" min="0" max="20" step=".5" value="5"></label><label>Angle from east <output id="bav">90°</output><input id="ba" type="range" min="-180" max="180" step="5" value="90"></label><button class="action" id="reset">Reset</button></article><article class="card"><h2>Resultant: A + B</h2><p id="components" aria-live="polite"></p><p id="result" aria-live="polite"></p><p class="muted">Angles measured counterclockwise from east; components use signed coordinates.</p></article></section><section class="card"><svg viewBox="0 0 600 400" role="img" aria-label="Vector A, B and resultant drawn from a common origin"><defs><marker id="head" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="context-stroke"/></marker></defs><path d="M40 200H560M300 35V365" stroke="#9ab0c3" stroke-width="2"/><path id="av" stroke="#0284c7" stroke-width="4" marker-end="url(#head)"/><path id="bv" stroke="#f59e0b" stroke-width="4" marker-end="url(#head)"/><path id="rv" stroke="#16a34a" stroke-width="5" marker-end="url(#head)"/><text x="550" y="192">E</text><text x="310" y="30">N</text><text x="310" y="220">O</text></svg></section></main><script>(function(){'use strict';const $=id=>document.getElementById(id),ids=['am','aa','bm','ba'];function update(){const am=Number($('am').value),aa=Number($('aa').value),bm=Number($('bm').value),ba=Number($('ba').value),rad=Math.PI/180,A=[am*Math.cos(aa*rad),am*Math.sin(aa*rad)],B=[bm*Math.cos(ba*rad),bm*Math.sin(ba*rad)],R=[A[0]+B[0],A[1]+B[1]],mag=Math.hypot(...R),angle=mag<1e-9?null:Math.atan2(R[1],R[0])/rad;for(const id of ids)$(id+'v').textContent=$(id).value+(id.endsWith('a')?'°':' N');$('components').textContent='Rx = '+R[0].toFixed(2)+' N, Ry = '+R[1].toFixed(2)+' N';$('result').textContent='Magnitude = '+mag.toFixed(2)+' N; '+(angle===null?'direction undefined (zero vector)':'angle = '+angle.toFixed(1)+'° from east');const max=Math.max(1,Math.abs(A[0]),Math.abs(A[1]),Math.abs(B[0]),Math.abs(B[1]),Math.abs(R[0]),Math.abs(R[1])),scale=Math.min(245/max,155/max,14);[['av',A],['bv',B],['rv',R]].forEach(([id,v])=>$(id).setAttribute('d','M300 200 L'+(300+v[0]*scale).toFixed(2)+' '+(200-v[1]*scale).toFixed(2)))}ids.forEach(id=>$(id).addEventListener('input',update));$('reset').addEventListener('click',()=>{[['am',5],['aa',0],['bm',5],['ba',90]].forEach(([id,v])=>$(id).value=v);update()});update()})();</script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="central-config.js"></script><script src="central-auth.js"></script><script>(async function(){if(window.SkillUpAuth){await window.SkillUpAuth.requireAuth(location.href);}})();</script><script src="/skillup-eye-shield.js?v=20261013-eye-shield-v1"></script><script src="/shared-nav.js?v=20261013-no-bottom-nav-v1"></script></body></html>
