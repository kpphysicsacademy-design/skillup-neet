<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SkillUp Physics | Screw Gauge Reading Practice</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.opt.selected{border-color:#5146a5;background:#f4f1ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.opt:disabled{cursor:default}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🔩 Screw Gauge Reading Practice</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="action">CHECK</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['A screw gauge has a pitch of 1 mm and 100 divisions on its circular scale. What is its least count?',['1 mm','0.1 mm','0.01 mm','0.001 mm'],2,'Least count = pitch ÷ circular-scale divisions = 1/100 = 0.01 mm.'],['A screw gauge has pitch 0.5 mm and 50 circular-scale divisions. Its least count is:',['0.5 mm','0.05 mm','0.01 mm','0.001 mm'],2,'Least count = 0.5/50 = 0.01 mm.'],['The main scale reading is 5 mm, the circular-scale reading is 28 divisions and LC is 0.01 mm. The observed reading is:',['5.28 mm','5.02 mm','5.80 mm','33 mm'],0,'Observed reading = main scale reading + circular reading × LC = 5 + 28×0.01 = 5.28 mm.'],['The main scale reading is 7.5 mm, circular-scale reading is 35 divisions and LC is 0.01 mm. The reading is:',['7.35 mm','7.50 mm','7.85 mm','8.35 mm'],2,'Reading = 7.5 + 35×0.01 = 7.85 mm.'],['A screw gauge has pitch 0.5 mm and 50 divisions. If the circular scale reads 32 divisions and the main scale reads 3 mm, the reading is:',['3.16 mm','3.32 mm','3.50 mm','4.32 mm'],1,'LC = 0.01 mm, so reading = 3 + 32×0.01 = 3.32 mm.'],['If the pitch of a screw gauge is 2 mm and the circular scale has 100 divisions, its least count is:',['0.2 mm','0.02 mm','0.002 mm','2 mm'],1,'LC = 2/100 = 0.02 mm.'],['Which part of a screw gauge contains the circular scale?',['Sleeve/barrel','Thimble','Anvil','Spindle only'],1,'The circular scale is marked on the rotating thimble.'],['Which part of a screw gauge remains fixed while the spindle approaches the object?',['Anvil','Thimble','Ratchet only','Circular scale'],0,'The anvil is the fixed measuring face; the spindle moves toward it.'],['Which part helps apply approximately uniform pressure while taking a screw-gauge reading?',['Ratchet','Anvil','Sleeve','Lock screw'],0,'The ratchet mechanism helps prevent excessive force and provides more consistent contact pressure.'],['A screw gauge shows +0.03 mm zero error. If the observed reading is 4.56 mm, the corrected reading is:',['4.59 mm','4.56 mm','4.53 mm','4.50 mm'],2,'Corrected reading = observed reading − positive zero error = 4.56 − 0.03 = 4.53 mm.'],['A screw gauge shows −0.02 mm zero error. If the observed reading is 6.48 mm, the corrected reading is:',['6.46 mm','6.48 mm','6.50 mm','6.52 mm'],2,'Corrected reading = 6.48 − (−0.02) = 6.50 mm.'],['If the main scale reading is 2.5 mm, circular-scale reading is 42 divisions and LC is 0.01 mm, the observed reading is:',['2.42 mm','2.50 mm','2.92 mm','3.42 mm'],2,'Observed reading = 2.5 + 42×0.01 = 2.92 mm.'],['A screw gauge has MSR 8.0 mm, circular reading 24 divisions, LC 0.01 mm and zero error +0.04 mm. The corrected reading is:',['8.20 mm','8.24 mm','8.28 mm','8.00 mm'],0,'Observed = 8.0 + 24×0.01 = 8.24 mm; corrected = 8.24 − 0.04 = 8.20 mm.'],['A screw gauge has MSR 10.5 mm, circular reading 30 divisions, LC 0.01 mm and zero error −0.05 mm. The corrected reading is:',['10.75 mm','10.80 mm','10.85 mm','10.45 mm'],2,'Observed = 10.5 + 0.30 = 10.80 mm; corrected = 10.80 − (−0.05) = 10.85 mm.'],['Why is a screw gauge preferred over a metre scale for measuring the diameter of a thin wire?',['It has a smaller least count and higher resolution','It has no scale','It measures temperature','It eliminates every error'],0,'A screw gauge is designed for small dimensions and generally provides much finer resolution than a metre scale.']];let i=0,score=0,answered=false,selected=-1;const $=x=>document.getElementById(x);function render(){answered=false;selected=-1;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q[1].map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('action').classList.remove('hide');$('action').textContent='CHECK'});$('xp').textContent='';$('action').classList.add('hide');$('action').disabled=false;}function check(){if(selected<0)return;if(!answered){answered=true;const q=qs[i],ok=selected===q[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===selected&&!ok)b.classList.add('wrong')});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[3];if(ok)score++;$('score').textContent=`XP ${score}`;$('fill').style.width=`${(i+1)/15*100}%`;$('action').textContent=i===14?'FINISH':'Next Question →';return;}if(i<14){i++;render()}else{$('quiz').innerHTML='';$('action').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('action').onclick=check;render();</script></body></html>
