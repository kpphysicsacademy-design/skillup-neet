<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Second Law of Thermodynamics</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center;margin:14px 0 18px;font-size:28px}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.feedback{min-height:45px;font-weight:700;margin-top:15px;line-height:1.45}.next,.retry,.back{display:block;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#a8e77f;color:#fff}.next:disabled{opacity:.65;cursor:not-allowed}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00}@media(max-width:600px){.wrap{padding:14px}.card{padding:20px}h1{font-size:24px}}</style></head><body><div class="wrap"><div class="card"><h1>♨️ Second Law of Thermodynamics</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Continue →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['The second law of thermodynamics determines the direction of','heat flow','mass flow','electric current','momentum flow',0,'The second law determines the natural direction of thermodynamic processes.'],

['The entropy of an isolated system in a spontaneous process','always decreases','always remains zero','never decreases','becomes infinite',2,'For an isolated system, entropy never decreases.'],
['The SI unit of entropy is','joule','joule per kelvin','watt','pascal',1,'The SI unit of entropy is J K⁻¹.'],
['For a reversible process, the entropy change is','dS = δQrev/T','dS = TδQrev','dS = δW/T','dS = P/T',0,'For a reversible process, dS = δQrev/T.'],
['The efficiency of a heat engine is','work output / heat input','heat input / work output','heat rejected / work output','work input / heat rejected',0,'Thermal efficiency is η = W/QH.'],
['The maximum efficiency of a Carnot engine operating between TH and TC is','1 − TC/TH','1 − TH/TC','TC/TH','TH/TC',0,'Carnot efficiency is η = 1 − TC/TH, with temperatures in kelvin.'],
['A Carnot engine works between 600 K and 300 K. Its efficiency is','25%','40%','50%','75%',2,'η = 1 − 300/600 = 0.50 = 50%.'],
['A refrigerator transfers heat from a low-temperature reservoir to a high-temperature reservoir using','no energy','external work','gravity only','chemical equilibrium',1,'A refrigerator requires external work.'],
['The coefficient of performance of a refrigerator is','W/QC','QC/W','QH/W','W/QH',1,'For a refrigerator, COP = QC/W.'],
['In a reversible adiabatic process, the entropy of the working substance','increases','decreases','remains constant','becomes zero',2,'For a reversible adiabatic process, Qrev = 0, so ΔS = 0.'],
['Which type of process produces entropy?','Every reversible process','An irreversible process','Only isothermal reversible process','No process',1,'Irreversible processes generate entropy.'],

];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});if(ok){score++;$('xp').textContent='✨ Correct! +1 XP'}else $('xp').textContent='❌ Incorrect. '+q[6];$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
