<section class="hero"><h1>🌡️ Second Law of Thermodynamics</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>

<script>
(function(){
'use strict';
const questions=[{"q":"What is the central idea of the second law of thermodynamics?","o":["Energy is conserved only in solids","It sets a direction for natural processes and limits heat-to-work conversion","Pressure is always constant","Internal energy is always zero"],"a":1,"e":"The second law describes irreversibility and limits the conversion of heat into work."},{"q":"Which way does heat flow spontaneously when two objects at different temperatures are in contact?","o":["Cold to hot only","Hot to cold","Both ways equally with no net flow","Only if work is supplied"],"a":1,"e":"Net spontaneous heat transfer is from higher to lower temperature."},{"q":"The second law is closely associated with which quantity?","o":["Entropy","Density","Electric charge only","Volume only"],"a":0,"e":"Entropy is central to the second law."},{"q":"For an isolated system, total entropy in a natural process…","o":["Must decrease","Cannot decrease","Must always be zero","Is unrelated to the second law"],"a":1,"e":"Entropy of an isolated system remains constant for an ideal reversible process and increases for an irreversible one."},{"q":"Which statement describes the Kelvin–Planck form of the second law?","o":["A cyclic engine cannot convert all heat from a single reservoir entirely into work","Heat always flows from cold to hot spontaneously","Energy can be created from nothing","All processes are reversible"],"a":0,"e":"No cyclic heat engine can take heat from one reservoir and convert it completely into work."},{"q":"Which statement describes the Clausius form of the second law?","o":["Heat cannot spontaneously flow from a colder body to a hotter body without external work","All heat becomes work","Pressure cannot change","Internal energy is not conserved"],"a":0,"e":"Heat cannot flow from cold to hot as the sole result without external work."},{"q":"Can a heat engine operating in a cycle convert all absorbed heat into work?","o":["Yes, always","No, not if it exchanges heat with a single reservoir only","Only if its pressure is constant","Only if its volume is fixed"],"a":1,"e":"The Kelvin–Planck statement rules out 100% conversion of heat from a single reservoir into work in a cycle."},{"q":"What is the entropy change for a reversible transfer of heat Q at absolute temperature T?","o":["ΔS = QT","ΔS = Q/T","ΔS = T/Q","ΔS = Q + T"],"a":1,"e":"For a reversible isothermal transfer, ΔS = Qrev/T."},{"q":"What is the SI unit of entropy?","o":["J/K","J·K","W/K²","Pa"],"a":0,"e":"Entropy is measured in joules per kelvin."},{"q":"For a reversible adiabatic process, the entropy change of the system is…","o":["Positive","Negative","Zero","Infinite"],"a":2,"e":"Reversible adiabatic processes are isentropic: ΔS = 0."},{"q":"In an irreversible process, the total entropy of an isolated system…","o":["Decreases","Increases","Must remain constant","Becomes negative"],"a":1,"e":"Irreversible processes generate entropy, increasing the total entropy of an isolated system."},{"q":"Which process is idealized as reversible?","o":["Gas freely expanding into a vacuum","Frictional sliding","An infinitely slow process with no dissipative effects","Heat flowing across a finite temperature difference"],"a":2,"e":"A reversible process is an ideal limiting process that can be reversed without net changes to system and surroundings."},{"q":"Why is a perpetual-motion machine of the second kind impossible?","o":["It would violate the second law","It would violate conservation of mass only","It would require zero temperature","It would need a constant volume"],"a":0,"e":"It would completely convert heat from a single reservoir into work, violating the second law."},{"q":"A refrigerator transfers heat from a cold region to a warm room. What must it use?","o":["External work","No energy input","Only gravity","A decrease in room temperature only"],"a":0,"e":"A refrigerator requires work to move heat from cold to hot."},{"q":"Which statement about entropy is correct?","o":["It is a measure related to energy dispersal and the number of accessible microscopic arrangements","It is identical to temperature","It is always zero in a gas","It is a type of force"],"a":0,"e":"Entropy is a state function linked to microscopic arrangements and the direction of spontaneous change."},{"q":"For a reversible process, the entropy change of the system can be…","o":["Positive, negative, or zero depending on the process","Only positive","Only negative","Always zero"],"a":0,"e":"A reversible process may increase, decrease, or leave system entropy unchanged; total entropy change is zero."},{"q":"When heat Q enters a system reversibly at temperature T, its entropy change is…","o":["Positive Q/T","Negative Q/T","Zero always","T/Q"],"a":0,"e":"For heat entering reversibly, ΔS = Qrev/T is positive."},{"q":"When heat leaves a system reversibly at temperature T, its entropy change is…","o":["Positive","Negative","Always zero","Infinite"],"a":1,"e":"Heat leaving means Qrev is negative, so the system's entropy decreases."},{"q":"Can the entropy of a system decrease?","o":["Never","Yes, if entropy of the surroundings increases enough","Only in an isolated system","Only if energy is created"],"a":1,"e":"A system can become more ordered while transferring entropy to its surroundings; total entropy still does not decrease."},{"q":"For the universe as a whole, the second law predicts entropy change for a real irreversible process is…","o":["Negative","Positive","Always zero","Undefined"],"a":1,"e":"The total entropy of system plus surroundings increases in irreversible processes."},{"q":"Which is an example of an irreversible process?","o":["Ideal frictionless motion reversed exactly","Heat conduction across a temperature difference","A perfectly reversible adiabatic change","An ideal quasistatic limit without friction"],"a":1,"e":"Heat conduction across a finite temperature difference produces entropy and is irreversible."},{"q":"Why can no real heat engine be 100% efficient?","o":["Some heat must be rejected to a lower-temperature reservoir","Energy is not conserved","Work is not energy","The hot reservoir must be at zero kelvin"],"a":0,"e":"The second law requires rejection of some heat in a cyclic engine."},{"q":"The efficiency of a heat engine is defined as…","o":["Heat rejected divided by work","Useful work output divided by heat input","Heat input divided by work output","Work output plus heat input"],"a":1,"e":"Thermal efficiency η = Wout/Qin."},{"q":"For any engine operating between hot and cold reservoirs, maximum possible efficiency is achieved by a…","o":["Carnot engine","Frictional engine","Free expansion","Constant-volume engine only"],"a":0,"e":"A reversible Carnot engine sets the maximum efficiency between two reservoir temperatures."},{"q":"A refrigerator's coefficient of performance (COP) is…","o":["Work input / heat removed from cold space","Heat removed from cold space / work input","Heat rejected / heat removed only","Always equal to efficiency"],"a":1,"e":"COP for a refrigerator is Qcold/Win."},{"q":"The second law differs from the first law because it tells us…","o":["Energy is conserved","Which processes are possible and their direction","The unit of work","The value of the gas constant"],"a":1,"e":"The first law is energy conservation; the second law adds direction and efficiency constraints."},{"q":"If a system undergoes a spontaneous change in an isolated setting, its entropy generally…","o":["Increases","Decreases","Must be negative","Is always zero"],"a":0,"e":"Spontaneous irreversible changes increase the entropy of an isolated system."},{"q":"Can heat be converted entirely into work in a single non-cyclic process?","o":["The second law's cyclic-engine restriction does not state this as an absolute ban for every non-cyclic process","Yes, all cyclic engines can do this","No energy is needed","Only at constant pressure"],"a":0,"e":"The Kelvin–Planck statement specifically rules out complete conversion in a cyclic engine operating with a single reservoir."},{"q":"At thermal equilibrium, there is no net spontaneous heat flow because…","o":["The bodies have equal temperature","Their volumes must be equal","Their masses must be equal","Their entropies are zero"],"a":0,"e":"Equal temperatures remove the temperature difference driving net heat transfer."},{"q":"Which is the best summary of the second law?","o":["Every energy transfer is reversible","Natural processes have a preferred direction and total entropy does not decrease in an isolated system","Heat always becomes work","All engines have 100% efficiency"],"a":1,"e":"The second law establishes process direction and the entropy constraint."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Second Law of Thermodynamics Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
