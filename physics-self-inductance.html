<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Self Inductance</title>
<meta name="description" content="SkillUp Physics Self Inductance interactive lesson with 15 MCQs.">
<style>
:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}
.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}
header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}
h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}
.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}
.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}
.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}
.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}
.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}
button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}
.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}
.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}
@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}
</style>
</head>
<body>
<main class="card">
<header><span class="icon">🧲</span><h1>Self Inductance</h1></header>
<section id="quiz">
<div class="status"><span id="counter"></span><span id="xp">XP 0</span></div>
<div class="track"><div id="fill" class="fill"></div></div>
<p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div>
<button id="next" class="next" disabled>Next</button>
</section>
<section id="result" class="result" hidden>
<div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button>
</section>
<a class="back" href="full-physics-path.html">← Back to Physics Path</a>
</main>
<script>
const qs=[
["Self-inductance of a coil is the property by which the coil opposes a change in",["current through it","resistance of the wire","temperature only","mass of the coil"],0,"Self-inductance opposes changes in current by producing an induced emf."],
["The SI unit of self-inductance is",["weber","henry","tesla","coulomb"],1,"The SI unit of inductance is the henry (H)."],
["The induced emf due to self-inductance is given by",["E = IR","E = -L(di/dt)","E = L/i","E = Q/t"],1,"For self-induction, e = -L di/dt; the minus sign follows Lenz's law."],
["For a coil, self-inductance L is defined by the relation",["L = NΦ/I","L = NI/Φ","L = Φ/(NI)","L = I/(NΦ)"],0,"Flux linkage NΦ is proportional to current, so L = NΦ/I."],
["One henry is equivalent to",["1 V s A⁻¹","1 V A s⁻¹","1 Wb V⁻¹","1 C V⁻¹"],0,"Since e = L di/dt, 1 H = 1 V·s/A."],
["Self-inductance of a long solenoid is proportional to",["length only","number of turns squared","resistance only","current only"],1,"For a solenoid L = μN²A/l, so L is proportional to N²."],
["If the number of turns of a coil is doubled, with other factors unchanged, its self-inductance becomes",["L/2","2L","4L","L/4"],2,"Because L ∝ N², doubling N makes L four times larger."],
["A coil has L = 2 H and current changes at 3 A/s. The magnitude of induced emf is",["1.5 V","5 V","6 V","9 V"],2,"|e| = L|di/dt| = 2 × 3 = 6 V."],
["The energy stored in an inductor carrying current I is",["LI²","½LI²","2LI²","½L/I²"],1,"Magnetic energy stored is U = ½LI²."],
["An inductor mainly stores energy in its",["electric field only","magnetic field","gravitational field","thermal field"],1,"An inductor stores energy in the magnetic field produced by current."],
["If the current through an ideal inductor is constant, the self-induced emf is",["maximum","zero","infinite","equal to IR"],1,"For constant current, di/dt = 0, so induced emf is zero."],
["The negative sign in e = -L di/dt represents",["Ohm's law","Lenz's law","Kirchhoff's law","Coulomb's law"],1,"The negative sign indicates that the induced emf opposes the change in current."],
["For two coils, mutual induction differs from self-induction because mutual induction involves",["change of current in the same coil","effect of changing current in one coil on another coil","only direct current","no magnetic field"],1,"Mutual induction concerns induced emf in one coil due to changing current in another."],
["A larger core permeability generally makes the self-inductance of a coil",["smaller","unchanged","larger","zero"],2,"L is proportional to magnetic permeability μ, so greater μ increases L."],
["A coil of inductance 4 H carries 2 A. The energy stored is",["4 J","8 J","16 J","2 J"],1,"U = ½LI² = ½ × 4 × 2² = 8 J."]
];
let i=0,score=0,xp=0,answered=false;
const $=id=>document.getElementById(id);
function render(){
 const q=qs[i];answered=false;$('counter').textContent=`Question ${i+1} of ${qs.length}`;$('xp').textContent=`XP ${xp}`;$('fill').style.width=`${(i/qs.length)*100}%`;$('question').textContent=q[0];$('feedback').textContent='';$('feedback').className='feedback';$('next').disabled=true;
 const box=$('opts');box.innerHTML='';q[1].forEach((t,n)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>answer(n);box.appendChild(b)});
}
function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$('opts').children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add('sel');buttons[q[2]].classList.add('ok');if(n===q[2]){score++;xp+=10;$('feedback').textContent='Correct! '+q[3];$('feedback').className='feedback oktxt'}else{buttons[n].classList.add('no');$('feedback').textContent='Not quite. '+q[3];$('feedback').className='feedback notxt'}$('xp').textContent=`XP ${xp}`;$('next').disabled=false;$('fill').style.width=`${((i+1)/qs.length)*100}%`}
function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{ $('quiz').hidden=true;$('result').hidden=false;$('score').textContent=`Score: ${score}/${qs.length}`;$('earned').textContent=`You earned ${xp} XP.`}}
function restart(){i=0;score=0;xp=0;$('result').hidden=true;$('quiz').hidden=false;render()}
$('next').onclick=next;$('restart').onclick=restart;render();
</script>
</body>
</html>
