<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Semiconductors</title><meta name="description" content="SkillUp Physics Semiconductors interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🔬</span><h1>Semiconductors</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["A semiconductor has electrical conductivity that is generally:",["Between that of a conductor and an insulator","Always greater than a metal","Exactly zero at all temperatures","Equal to a perfect insulator"],0,"Semiconductors have conductivity intermediate between conductors and insulators, and it is strongly affected by temperature and doping."] ,["A pure semiconductor is called:",["Intrinsic semiconductor","Extrinsic semiconductor","Superconductor","Electrolyte"],0,"An intrinsic semiconductor is a pure semiconductor without intentional impurity doping."] ,["In an intrinsic semiconductor, the number of electrons and holes is:",["Equal","Always zero","Electrons are always much greater","Holes are always much greater"],0,"Thermal generation in an intrinsic semiconductor produces electrons and holes in equal numbers."] ,["The process of deliberately adding a small amount of impurity to a semiconductor is called:",["Doping","Ionisation","Rectification","Polarisation"],0,"Doping introduces suitable impurity atoms to increase and control semiconductor conductivity."] ,["An n-type semiconductor is formed by doping silicon or germanium with a:",["Pentavalent donor impurity","Trivalent acceptor impurity","Divalent impurity only","Noble gas"],0,"Pentavalent dopants such as phosphorus, arsenic or antimony provide extra electrons and form n-type material."] ,["The majority charge carriers in an n-type semiconductor are:",["Electrons","Holes","Protons","Neutrons"],0,"Electrons are the majority carriers in n-type semiconductors; holes are minority carriers."] ,["A p-type semiconductor is formed by doping silicon or germanium with a:",["Trivalent acceptor impurity","Pentavalent donor impurity","Noble gas","Neutron source"],0,"Trivalent dopants such as boron, aluminium or indium create holes and form p-type material."] ,["The majority charge carriers in a p-type semiconductor are:",["Holes","Electrons","Neutrons","Protons"],0,"Holes are the majority carriers in p-type semiconductors; electrons are minority carriers."] ,["Which pair correctly represents common n-type and p-type dopants respectively?",["Phosphorus and boron","Boron and phosphorus","Aluminium and arsenic only","Indium and antimony only"],0,"Phosphorus is a common pentavalent donor for n-type silicon, while boron is a common trivalent acceptor for p-type silicon."] ,["The energy gap between the valence band and conduction band is called:",["Forbidden energy gap or band gap","Ionisation current","Barrier current","Drift voltage"],0,"The band gap Eg is the energy separation between the top of the valence band and bottom of the conduction band."] ,["In a semiconductor, increasing temperature generally causes conductivity to:",["Increase","Decrease to zero","Remain exactly unchanged","Become independent of carriers"],0,"Higher temperature generates more electron-hole pairs, generally increasing semiconductor conductivity."] ,["A semiconductor diode is essentially:",["A p-n junction with metallic contacts","Two resistors in series","A capacitor only","A transformer"],0,"A semiconductor diode is a two-terminal p-n junction device with metallic contacts."] ,["In forward bias of a p-n junction diode:",["p-side is connected to positive terminal and n-side to negative terminal","p-side is connected to negative and n-side to positive","Both sides are connected to positive","No external source is used"],0,"Forward bias connects p to positive and n to negative, reducing the depletion-region barrier and allowing substantial current."] ,["In reverse bias of a p-n junction diode:",["p-side is connected to negative terminal and n-side to positive terminal","p-side is connected to positive and n-side to negative","Both sides are connected to negative","The junction is short-circuited"],0,"Reverse bias connects p to negative and n to positive, widening the depletion region and strongly suppressing diffusion current."] ,["Which statement is correct about extrinsic semiconductor charge carriers?",["n-type has electrons as majority carriers; p-type has holes as majority carriers","n-type has holes as majority; p-type has electrons as majority","Both have only electrons","Both have only holes"],0,"Doping creates majority carriers: electrons in n-type and holes in p-type semiconductors."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
