<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Series LCR Circuit</title><meta name="description" content="SkillUp Physics Series LCR Circuit interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🔄</span><h1>Series LCR Circuit</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["A series LCR circuit contains:",["Only a resistor","Only L and C","R, L and C in series","Two capacitors only"],2,"A series LCR circuit has resistance R, inductance L and capacitance C connected in series."],["The impedance magnitude of a series LCR circuit is:",["R+X_L+X_C","√[R²+(X_L−X_C)²]","X_L/X_C","R²+X_L−X_C"],1,"Z=√[R²+(X_L−X_C)²]."],["Inductive reactance is:",["2πfL","1/(2πfL)","2πfC","R/L"],0,"X_L=ωL=2πfL."],["Capacitive reactance is:",["2πfC","1/(2πfC)","L/C","2πfL"],1,"X_C=1/(ωC)=1/(2πfC)."],["At series resonance, the condition is:",["X_L>X_C","X_L<X_C","X_L=X_C","R=0"],2,"At resonance, inductive and capacitive reactances are equal."],["At resonance, the impedance of a series LCR circuit is:",["Maximum and equal to X_L","Minimum and equal to R","Zero always","Equal to X_C"],1,"When X_L=X_C, Z=R, the minimum possible impedance."],["At resonance, current in a series LCR circuit is:",["Minimum","Maximum","Zero","Independent of voltage"],1,"Minimum impedance at resonance gives maximum current for a fixed applied voltage."],["The resonant angular frequency is:",["ω₀=LC","ω₀=1/√LC","ω₀=√LC","ω₀=R/L"],1,"ω₀=1/√(LC)."],["The resonant frequency is:",["1/(2π√LC)","2π√LC","√(LC)/(2π)","R/(2πL)"],0,"f₀=1/(2π√(LC))."],["Below resonance in a series LCR circuit, the circuit is predominantly:",["Inductive","Capacitive","Purely resistive","Nonconducting"],1,"Below resonance, X_C>X_L, so the circuit behaves capacitively."],["Above resonance, the series LCR circuit is predominantly:",["Capacitive","Inductive","Purely resistive","Open circuit"],1,"Above resonance, X_L>X_C, so the circuit behaves inductively."],["The phase angle in a series LCR circuit satisfies:",["tanφ=R/(X_L−X_C)","tanφ=(X_L−X_C)/R","tanφ=R(X_L−X_C)","tanφ=LC/R"],1,"tanφ=(X_L−X_C)/R."],["If X_L=X_C and R=10 Ω, the impedance is:",["0 Ω","5 Ω","10 Ω","20 Ω"],2,"At resonance Z=R=10 Ω."],["If R=6 Ω, X_L=10 Ω and X_C=2 Ω, the impedance is:",["8 Ω","10 Ω","√100=10 Ω","18 Ω"],2,"Z=√[6²+(10−2)²]=√100=10 Ω."],["For a series LCR circuit at resonance, the power factor is:",["Zero","0.5","Unity","Infinite"],2,"At resonance the phase angle is zero, so cosφ=1."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="✓ Correct — "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="✗ Not quite — "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;i++;if(i<qs.length)render();else{$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`;$("fill").style.width="100%"}}function restart(){i=0;score=0;xp=0;$("quiz").hidden=false;$("result").hidden=true;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
