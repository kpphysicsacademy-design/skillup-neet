<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Series Resistance</title>
<style>
body{font-family:Arial,sans-serif;background:#fff9e8;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#ffffff;border:2px solid #e4efcf;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#58cc02;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f2ffe6}.correct{border-color:#58cc02!important;background:#eaffd5!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#58cc02;color:#173b08}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#58a700;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}

<body><div class="wrap"><div class="card"><h1>⚡ Series Resistance</h1>
<div class="meta"><span id="count">Question 1/30</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><div id="review" class="hide"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div>
</div></div>
<script>
const qs=[
['The equivalent resistance of resistors connected in series is','R=R₁−R₂','R=R₁+R₂+R₃+…','1/R=1/R₁+1/R₂','R=R₁R₂',1,'For resistors in series, the same current flows through each resistor and R_eq=R₁+R₂+R₃+….'],
['Three resistors 2 Ω, 3 Ω and 5 Ω are connected in series. Their equivalent resistance is','5 Ω','6 Ω','10 Ω','30 Ω',2,'For series connection, R_eq=2+3+5=10 Ω.'],
['In a series circuit, the current through each resistor is','different in every resistor','the same through all resistors','zero through the largest resistor','inversely proportional to voltage only',1,'A series circuit has only one path for charge flow, so the same current passes through every resistor.'],
['Two resistors 4 Ω and 6 Ω are connected in series across a 20 V battery. The circuit current is','1 A','2 A','5 A','10 A',1,'R_eq=4+6=10 Ω and I=V/R=20/10=2 A.'],
['For two series resistors R₁ and R₂, the voltage division relation is','V₁/V₂=R₂/R₁','V₁/V₂=R₁/R₂','V₁V₂=R₁R₂','V₁+V₂=R₁R₂',1,'Since the same current flows, V₁=IR₁ and V₂=IR₂, so V₁/V₂=R₁/R₂.'],
['The equivalent resistance of resistors connected in series is always','less than the smallest resistance','equal to the smallest resistance','greater than each individual resistance','zero',2,'For positive resistances, the series equivalent is their sum and is therefore greater than each individual resistance.'],
['A 2 Ω and a 3 Ω resistor are in series with a 10 V source. The voltage across the 3 Ω resistor is','2 V','4 V','6 V','10 V',2,'Current=10/(2+3)=2 A. Voltage across 3 Ω is V=IR=2×3=6 V.'],
['If another resistor is added in series to a circuit, the total resistance','always decreases','always increases for a positive resistance','becomes zero','remains unchanged',1,'Adding a positive resistance in series adds directly to the total resistance.'],
['Two identical resistors each of resistance R are connected in series. Their equivalent resistance is','R/2','R','2R','R²',2,'R_eq=R+R=2R.'],
['Four identical resistors each of 5 Ω are connected in series. Their equivalent resistance is','1.25 Ω','5 Ω','10 Ω','20 Ω',3,'R_eq=5+5+5+5=20 Ω.'],
['A series combination has resistors 1 Ω, 2 Ω and 3 Ω. If the current is 2 A, the total voltage is','3 V','6 V','12 V','24 V',2,'R_eq=6 Ω, so V=IR=2×6=12 V.'],
['In a series circuit, the total potential difference across the combination equals','the potential difference across the smallest resistor only','the sum of potential drops across all resistors','the current multiplied by each resistor separately only','zero',1,'Kirchhoff’s loop rule gives the source voltage as the sum of voltage drops across series resistors.'],
['A 5 Ω resistor and a 10 Ω resistor are in series. The ratio of voltage drops across them is','1:1','1:2','2:1','5:1',1,'Voltage drop is proportional to resistance because the same current flows through both: V₁:V₂=5:10=1:2.'],
['If one resistor in a simple series circuit becomes an open circuit, the current in the circuit','doubles','halves','becomes zero','becomes infinite',2,'An open circuit breaks the only current path, so the circuit current becomes zero.'],
['Two series resistors have an equivalent resistance of 15 Ω. If one resistor is 6 Ω, the other is','6 Ω','9 Ω','15 Ω','21 Ω',1,'R₂=R_eq−R₁=15−6=9 Ω.']

['A 12 Ω and an 8 Ω resistor are connected in series to a 40 V source. What is the current?','1 A','2 A','4 A','5 A',1,'The total resistance is 12+8=20 Ω, so I=40/20=2 A.'],
['Three resistors of 3 Ω each are connected in series. What is the equivalent resistance?','1 Ω','3 Ω','6 Ω','9 Ω',3,'Series resistances add: 3+3+3=9 Ω.'],
['A 4 Ω resistor carries a current of 3 A. What is the potential drop across it?','7 V','12 V','1.33 V','24 V',1,'Using V=IR, V=3×4=12 V.'],
['Resistors of 2 Ω and 7 Ω are in series. What fraction of the total voltage appears across the 7 Ω resistor?','2/9','7/9','1/2','9/7',1,'Voltage divides in proportion to resistance, so the 7 Ω resistor gets 7/(2+7)=7/9 of the total.'],
['A 6 Ω resistor is connected in series with an unknown resistor. The equivalent resistance is 14 Ω. Find the unknown resistance.','6 Ω','8 Ω','14 Ω','20 Ω',1,'R_unknown=14−6=8 Ω.'],
['A 10 Ω and a 15 Ω resistor are connected in series across 50 V. What is the voltage across the 10 Ω resistor?','10 V','20 V','30 V','50 V',1,'Current=50/(10+15)=2 A; voltage across 10 Ω is 2×10=20 V.'],
['In a series circuit with a fixed ideal voltage source, adding a positive resistor causes the current to','increase','decrease','stay the same','reverse direction',1,'Adding series resistance increases total resistance; with fixed voltage, I=V/R decreases.'],
['Two series resistors have drops of 3 V and 9 V. What is the ratio of their resistances, first to second?','1:3','3:1','1:2','2:3',0,'The same current flows through both, so their resistance ratio equals their voltage-drop ratio: 3:9=1:3.'],
['A 2 Ω, 4 Ω and 6 Ω series combination is connected to 24 V. What is the voltage across the 4 Ω resistor?','2 V','4 V','8 V','12 V',2,'R_total=12 Ω, I=24/12=2 A; V_4Ω=2×4=8 V.'],
['Which quantity is common to every resistor in an ideal series circuit?','Potential difference','Current','Resistance','Power',1,'A single path means the same current passes through every component; voltage drops can differ.'],
['A circuit contains 3 Ω and 9 Ω resistors in series. If the total current is 0.5 A, what is the source voltage?','3 V','6 V','12 V','24 V',2,'R_total=12 Ω; V=IR=0.5×12=6 V.'],
['A 20 Ω resistor and a 30 Ω resistor are in series. What is the ratio of their power dissipations, 20 Ω to 30 Ω?','2:3','3:2','4:9','9:4',0,'With the same current, P=I²R, so the power ratio is 20:30=2:3.'],
['A 4 Ω and 6 Ω series combination has a 5 A current. What is the total power dissipated?','50 W','100 W','150 W','250 W',3,'R_total=10 Ω and P=I²R=25×10=250 W.'],
['For n identical resistors, each of resistance R, connected in series, the equivalent resistance is','R/n','nR','R²/n','R²',1,'Each resistor contributes R in series, so n identical resistors have equivalent resistance nR.'],
['A 2 Ω resistor and a 3 Ω resistor are in series. If the voltage across the 2 Ω resistor is 4 V, what is the voltage across the 3 Ω resistor?','2 V','4 V','6 V','10 V',2,'The current is 4/2=2 A, so the 3 Ω resistor drop is 2×3=6 V.']
];
let i=0,score=0,answered=false,wrong=[];const $=x=>document.getElementById(x);
function render(){answered=false;$('count').textContent=`Question ${i+1}/30`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/30*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}
function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});if(ok){score++;$('xp').textContent='✨ Correct! +1 XP'}else{wrong.push({question:q[0],chosen:q[n+1],answer:q[q[5]+1],explanation:q[6]});$('xp').textContent='Answer recorded';}$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}
function next(){if(i<29){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/30</b></p><p style="text-align:center">Accuracy: <b>${Math.round(score/30*100)}%</b></p><h3>Review incorrect answers (${wrong.length})</h3>${wrong.length?wrong.map((w,j)=>`<div style="padding:14px;margin:10px 0;border-radius:12px;background:#fff4dc"><b>${j+1}. ${w.question}</b><p>Your answer: ${w.chosen}</p><p>Correct answer: ${w.answer}</p><p>${w.explanation}</p></div>`).join(''):'<p>Perfect score! No incorrect answers to review.</p>'}<button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();
</script>
