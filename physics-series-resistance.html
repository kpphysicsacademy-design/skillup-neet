<script>
const questions=[["The equivalent resistance of three resistors connected in series is",["R₁ + R₂ + R₃","1/R₁ + 1/R₂ + 1/R₃","R₁R₂R₃","The largest resistance only"],0,"In series, resistances add directly: Rₑq = R₁ + R₂ + R₃."],["Resistors of 2 Ω, 3 Ω and 5 Ω are connected in series. Find the equivalent resistance.",["5 Ω","8 Ω","10 Ω","30 Ω"],2,"Rₑq = 2 + 3 + 5 = 10 Ω."],["In an ideal series circuit, which quantity is the same through every resistor?",["Potential difference","Current","Power","Resistance"],1,"A series circuit has one path, so the same current passes through every resistor."],["A 4 Ω and a 6 Ω resistor are connected in series across 20 V. What is the current?",["1 A","2 A","5 A","10 A"],1,"Rₑq = 4 + 6 = 10 Ω; I = V/R = 20/10 = 2 A."],["Two series resistors have resistances 3 Ω and 9 Ω. What is the ratio of their voltage drops (3 Ω : 9 Ω)?",["1:3","3:1","1:1","1:9"],0,"The same current flows through both, so V₁:V₂ = R₁:R₂ = 3:9 = 1:3."],["For positive resistors connected in series, the equivalent resistance is",["Less than the smallest resistor","Equal to the smallest resistor","Greater than any individual resistor","Always zero"],2,"The series equivalent is the sum of positive resistances, so it exceeds each individual resistance."],["A 2 Ω and a 3 Ω resistor are in series across 10 V. What is the voltage across the 3 Ω resistor?",["2 V","4 V","6 V","10 V"],2,"I = 10/(2+3) = 2 A; the 3 Ω drop is V = IR = 6 V."],["A positive resistor is added in series to an existing circuit with a fixed ideal voltage source. The current",["Increases","Decreases","Stays the same","Becomes infinite"],1,"Adding resistance increases total resistance; with fixed voltage, I = V/R decreases."],["Two identical resistors, each of resistance R, are connected in series. Their equivalent resistance is",["R/2","R","2R","R²"],2,"Rₑq = R + R = 2R."],["Four 5 Ω resistors are connected in series. Their equivalent resistance is",["1.25 Ω","5 Ω","10 Ω","20 Ω"],3,"Rₑq = 5 + 5 + 5 + 5 = 20 Ω."],["A 1 Ω, 2 Ω and 3 Ω series combination carries 2 A. What is the total voltage?",["3 V","6 V","12 V","24 V"],2,"Rₑq = 6 Ω, so V = IR = 2 × 6 = 12 V."],["The source voltage across a series combination equals",["The largest resistor's voltage only","The sum of all resistor voltage drops","The current divided by total resistance","Zero for an ideal circuit"],1,"Kirchhoff's loop rule states that the source voltage equals the sum of voltage drops."],["A 5 Ω resistor and a 10 Ω resistor are connected in series. The ratio of voltage drops is",["1:1","1:2","2:1","5:1"],1,"With equal current, voltage drop is proportional to resistance: 5:10 = 1:2."],["If one resistor opens in a simple series circuit, the circuit current becomes",["Double","Half","Zero","Infinite"],2,"An open component breaks the only path for charge flow, so current is zero."],["A series combination has equivalent resistance 15 Ω. One resistor is 6 Ω. Find the other.",["6 Ω","9 Ω","15 Ω","21 Ω"],1,"R₂ = Rₑq − R₁ = 15 − 6 = 9 Ω."],["A 12 Ω and an 8 Ω resistor are in series across 40 V. Find the current.",["1 A","2 A","4 A","5 A"],1,"Rₑq = 20 Ω; I = 40/20 = 2 A."],["Three resistors of 3 Ω each are connected in series. The equivalent resistance is",["1 Ω","3 Ω","6 Ω","9 Ω"],3,"Rₑq = 3 + 3 + 3 = 9 Ω."],["A 4 Ω resistor carries 3 A. What is the voltage across it?",["7 V","12 V","1.33 V","24 V"],1,"Ohm's law gives V = IR = 3 × 4 = 12 V."],["A 2 Ω and 7 Ω resistor are in series. What fraction of the total voltage appears across the 7 Ω resistor?",["2/9","7/9","1/2","9/7"],1,"Voltage divides in proportion to resistance, so the fraction is 7/(2+7) = 7/9."],["A 6 Ω resistor is in series with an unknown resistor. The total is 14 Ω. Find the unknown resistance.",["6 Ω","8 Ω","14 Ω","20 Ω"],1,"R_unknown = 14 − 6 = 8 Ω."],["A 10 Ω and 15 Ω resistor are in series across 50 V. The voltage across the 10 Ω resistor is",["10 V","20 V","30 V","50 V"],1,"I = 50/(10+15) = 2 A; V₁ = IR₁ = 2 × 10 = 20 V."],["Two series resistors have voltage drops of 3 V and 9 V. Their resistance ratio, first to second, is",["1:3","3:1","1:2","2:3"],0,"The current is the same, so R₁:R₂ = V₁:V₂ = 3:9 = 1:3."],["A 2 Ω, 4 Ω and 6 Ω series combination is connected to 24 V. The voltage across the 4 Ω resistor is",["2 V","4 V","8 V","12 V"],2,"Rₑq = 12 Ω; I = 24/12 = 2 A; V₄Ω = 2 × 4 = 8 V."],["Which quantity is generally different for each resistor in a series circuit?",["Current","Charge passing per second","Potential drop","The path followed by current"],2,"The current is common, but voltage drops depend on each resistance."],["A 3 Ω and 9 Ω resistor are in series. If current is 0.5 A, the source voltage is",["3 V","6 V","12 V","24 V"],1,"Rₑq = 12 Ω; V = IR = 0.5 × 12 = 6 V."],["A 20 Ω and 30 Ω resistor are in series. Their power ratio (20 Ω : 30 Ω) is",["2:3","3:2","4:9","9:4"],0,"The same current flows through both; P = I²R, so the ratio is 20:30 = 2:3."],["A 4 Ω and 6 Ω series combination carries 5 A. Total power dissipated is",["50 W","100 W","150 W","250 W"],3,"Rₑq = 10 Ω; P = I²R = 25 × 10 = 250 W."],["For n identical resistors of resistance R connected in series, the equivalent resistance is",["R/n","nR","R²/n","R²"],1,"Each resistor adds R, giving Rₑq = nR."],["A 2 Ω resistor has a 4 V drop and is in series with a 3 Ω resistor. The voltage across the 3 Ω resistor is",["2 V","4 V","6 V","10 V"],2,"The current is 4/2 = 2 A; the second drop is V = 2 × 3 = 6 V."],["A 5 Ω and 15 Ω resistor are connected in series across 40 V. The power dissipated in the 15 Ω resistor is",["15 W","30 W","45 W","60 W"],3,"Rₑq = 20 Ω, I = 40/20 = 2 A; P₁₅Ω = I²R = 4 × 15 = 60 W."]];
let index=0,chosen=null,locked=false,xp=0,streak=0,correctCount=0,wrong=[];
const $=id=>document.getElementById(id);
function render(){chosen=null;locked=false;$('count').textContent='Question '+(index+1)+' of '+questions.length;$('qnum').textContent='QUESTION '+(index+1);$('percent').textContent=Math.round(index/questions.length*100)+'%';$('fill').style.width=(index/questions.length*100)+'%';$('xp').textContent=xp;$('streak').textContent=streak;$('question').textContent=questions[index][0];$('options').innerHTML='';questions[index][1].forEach((value,n)=>{const b=document.createElement('button');b.type='button';b.className='option';b.innerHTML='<span class="letter">'+String.fromCharCode(65+n)+'</span><span></span>';b.lastElementChild.textContent=value;b.addEventListener('click',()=>{if(locked)return;chosen=n;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b)});$('check').classList.remove('hidden');$('check').disabled=true;$('feedback').className='feedback';$('feedback').textContent='';$('continue').classList.add('hidden');if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();}
function check(){if(chosen===null||locked)return;locked=true;const q=questions[index],ok=chosen===q[2];document.querySelectorAll('.option').forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add('correct');if(n===chosen&&!ok)b.classList.add('wrong')});if(ok){xp+=10;streak++;correctCount++;$('feedback').className='feedback show';$('feedback').innerHTML='<strong>✅ Correct! +10 XP</strong>'+q[3]}else{streak=0;wrong.push({index,chosen,correct:q[2]});$('feedback').className='feedback show bad';$('feedback').innerHTML='<strong>Not quite.</strong>'+q[3]}$('xp').textContent=xp;$('streak').textContent=streak;$('check').classList.add('hidden');$('continue').classList.remove('hidden');if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();}
function next(){if(index<questions.length-1){index++;render()}else finish()}
function finish(){$('quizcard').classList.add('hidden');$('percent').textContent='100%';$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hidden');let review=wrong.length?'<div class="review"><h3>Review your mistakes</h3>'+wrong.map(w=>{const q=questions[w.index];return '<div class="review-item"><b>Q'+(w.index+1)+'. '+q[0]+'</b><p class="small">Your answer: '+String.fromCharCode(65+w.chosen)+'. '+q[1][w.chosen]+'</p><p><b>Correct:</b> '+String.fromCharCode(65+q[2])+'. '+q[1][q[2]]+'</p><p>'+q[3]+'</p></div>'}).join('')+'</div>':'<p>Perfect run — no incorrect answers to review!</p>';$('result').innerHTML='<h2>🎉 Quiz complete!</h2><p class="scorebig">'+correctCount+' / '+questions.length+' correct</p><p>You earned <b>'+xp+' XP</b> · Best streak this run: <b>'+streak+'</b></p>'+review+'<button class="primary" id="retry">Retry quiz ↻</button>';$('retry').onclick=()=>location.reload();if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();}
$('check').addEventListener('click',check);$('continue').addEventListener('click',next);render();
</script><script src="/skillup-eye-shield.js?v=20261013-eye-shield-v1"></script><script src="/shared-nav.js?v=20261013-no-bottom-nav-v1"></script></body></html>
