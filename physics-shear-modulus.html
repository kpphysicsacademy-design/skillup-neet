.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}

.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>↔️ Shear Modulus</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"Shear modulus is also called the:",o:["Modulus of rigidity","Bulk modulus","Young’s modulus","Compressibility"],a:0,e:"Shear modulus measures resistance to shear deformation and is also called modulus of rigidity."},
{q:"Shear modulus G is the ratio of:",o:["Shear strain to shear stress","Shear stress to shear strain","Pressure to volume","Force to length"],a:1,e:"G = shear stress ÷ shear strain."},
{q:"The SI unit of shear modulus is:",o:["Newton","Joule","Pascal","Metre"],a:2,e:"Shear modulus has the same unit as stress: pascal (Pa)."},
{q:"Shear stress is calculated as:",o:["F/A","FA","A/F","F × displacement"],a:0,e:"Shear stress is tangential force divided by the area it acts on."},
{q:"For small deformation, shear strain is approximately:",o:["L/Δx","F/A","Δx/L","A/F"],a:2,e:"Shear strain is lateral displacement divided by the original height."},
{q:"Shear strain is:",o:["Measured in pascals","Dimensionless","Measured in newtons","Measured in metres"],a:1,e:"It is a ratio of two lengths, so it has no unit."},
{q:"The dimensions of shear modulus are:",o:["[ML⁻¹T⁻²]","[MLT⁻²]","[ML²T⁻²]","[M⁻¹L³]"],a:0,e:"Shear modulus has the dimensions of stress or pressure: [ML⁻¹T⁻²]."},
{q:"A larger shear modulus means the material is:",o:["Easier to shear","More rigid against shear","More compressible necessarily","Less dense necessarily"],a:1,e:"A larger modulus means less shear strain for the same shear stress."},
{q:"Shear forces act primarily:",o:["Normal to a surface only","Parallel to a surface","Only through the centre of mass","Only upward"],a:1,e:"Shear stress comes from forces tangential or parallel to the surface."},
{q:"A block of height L shifts sideways by Δx. Its shear strain is:",o:["Δx/L","L/Δx","LΔx","1/(LΔx)"],a:0,e:"Shear strain = lateral shift divided by original height."},
{q:"If shear stress is 200 Pa and shear strain is 0.01, G equals:",o:["2 Pa","20 Pa","2000 Pa","20,000 Pa"],a:3,e:"G = 200/0.01 = 20,000 Pa."},
{q:"A force of 40 N acts tangentially over 0.02 m². Shear stress is:",o:["0.8 Pa","20 Pa","200 Pa","2000 Pa"],a:3,e:"Stress = F/A = 40/0.02 = 2000 Pa."},
{q:"Using G = FL/(AΔx), the lateral shift Δx is:",o:["FL/(AG)","FAG/L","AGL/F","G/(FAL)"],a:0,e:"Rearrange G = FL/(AΔx) to get Δx = FL/(AG)."},
{q:"If the tangential force doubles while area stays the same, shear stress:",o:["Halves","Doubles","Stays the same","Becomes zero"],a:1,e:"Shear stress = F/A, so doubling force doubles stress."},
{q:"If area doubles and tangential force stays constant, shear stress:",o:["Doubles","Halves","Stays the same","Becomes four times larger"],a:1,e:"Shear stress is inversely proportional to area when force is fixed."},
{q:"A shear modulus of 3 × 10⁹ Pa and strain of 2 × 10⁻⁴ give stress:",o:["6 × 10⁵ Pa","1.5 × 10¹³ Pa","6 × 10⁻¹³ Pa","1.5 × 10⁵ Pa"],a:0,e:"Stress = G × strain = 3 × 10⁹ × 2 × 10⁻⁴ = 6 × 10⁵ Pa."},
{q:"Shear modulus mainly describes resistance to change in:",o:["Volume only","Shape","Mass","Temperature"],a:1,e:"Shear deformation changes shape, often transforming a rectangle into a parallelogram."},
{q:"Which example best illustrates shear deformation?",o:["A rod stretched lengthwise","A cube compressed equally on all faces","The top of a block shifts sideways relative to its base","Water heated in a beaker"],a:2,e:"A sideways shift between layers changes shape and is characteristic of shear."},
{q:"Shear modulus is most directly defined for:",o:["Solid materials under elastic shear","Ideal gases only","Vacuum","Fluids at rest under shear"],a:0,e:"Solids can sustain static shear stress; ordinary fluids flow under sustained shear."},
{q:"For small elastic deformation, shear stress is proportional to shear strain when:",o:["The material remains in its linear elastic range","The material has melted","The force is zero only","The area is infinite"],a:0,e:"In the linear elastic range, stress = shear modulus × strain."},
{q:"A block has height 0.5 m and shifts 0.01 m. Shear strain is:",o:["50","0.2","0.02","0.005"],a:2,e:"Strain = 0.01/0.5 = 0.02."},
{q:"If G = 5 × 10⁸ Pa and shear stress is 1 × 10⁶ Pa, strain is:",o:["500","0.002","50","2"],a:1,e:"Strain = stress/G = 10⁶/(5 × 10⁸) = 0.002."},
{q:"A block has G = 4 × 10⁹ Pa, area 0.01 m², height 0.2 m and shift 1 mm. The force is:",o:["200 N","2000 N","200,000 N","2 N"],a:2,e:"F = GAΔx/L = 4×10⁹ × 0.01 × 0.001 / 0.2 = 200,000 N."},
{q:"What happens to shear strain for a fixed shear stress if G increases?",o:["It increases","It decreases","It becomes a unit","It is unchanged"],a:1,e:"Strain = stress/G, so greater G gives less strain at the same stress."},
{q:"Which quantity is not a unit of shear modulus?",o:["Pa","N/m²","kg m⁻¹ s⁻²","m/s"],a:3,e:"Shear modulus is stress divided by dimensionless strain, so its unit is Pa or N/m²."},
{q:"Two equal and opposite tangential forces on opposite faces can create:",o:["Shear deformation without net translation","Only acceleration in one direction","A change in mass","Only volume expansion"],a:0,e:"Opposite tangential forces can deform the body while balancing the net force."},
{q:"Which expression gives shear modulus in terms of force, area, height and shift?",o:["G = FAΔx/L","G = FL/(AΔx)","G = AΔx/(FL)","G = F/(ALΔx)"],a:1,e:"G = (F/A)/(Δx/L) = FL/(AΔx)."},
{q:"If lateral shift is halved for the same force, area and height, shear modulus calculated from the data:",o:["Halves","Doubles","Stays the same","Becomes zero"],a:1,e:"G = FL/(AΔx), so halving Δx doubles the calculated modulus for the same other values."},
{q:"Which statement about shear strain is correct?",o:["It has unit Pa","It is a ratio of lateral displacement to height","It equals force per area","It is always greater than 1"],a:1,e:"Shear strain is Δx/L and is dimensionless."},
{q:"Which statement is correct for elastic shear?",o:["G = shear strain/shear stress","G = shear stress × area","G = shear stress/shear strain","G has units of metres"],a:2,e:"Shear modulus is defined as shear stress divided by shear strain."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Shear Modulus Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
