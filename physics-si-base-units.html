</style></head><body><header class="top"><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp" aria-label="Experience points">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header><main class="wrap"><section class="hero"><h1 id="title">SI Base Units</h1><div class="progress-row"><span id="progressText">Preparing questions…</span><span id="percent">0%</span></div><div class="progress"><i id="bar"></i></div></section><div id="content"></div></main><script>(function(){'use strict';var params=new URLSearchParams(location.search),concept=params.get('concept')||'SI Base Units',micro=params.get('micro')||'si-base-units',title=document.getElementById('title'),content=document.getElementById('content'),bar=document.getElementById('bar'),progressText=document.getElementById('progressText'),percent=document.getElementById('percent'),xp=document.getElementById('xp'),streakNode=document.getElementById('streak'),items=[],i=0,score=0,streak=0;window.SKILLUP_PHYSICS_BANK=window.SKILLUP_PHYSICS_BANK||{};var BANK_VERSION='20261001-physics-loader-v2';function esc(v){return String(v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function slug(v){return String(v).toLowerCase().trim().replace(/&/g,' and ').replace(/['’]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}function isBank(v){return Array.isArray(v)&&v.length&&v.every(function(x){return x&&typeof x==='object'&&Array.isArray(x.o)&&('q'in x)&&('a'in x);});}function loadScript(src,key){return new Promise(function(resolve,reject){var raw='https://raw.githubusercontent.com/kpphysicsacademy-design/skillup-neet/main/',cdn='https://cdn.jsdelivr.net/gh/kpphysicsacademy-design/skillup-neet@main/',urls=[src,raw+src,cdn+src],n=0,timer;function inspect(){var r=window.SKILLUP_PHYSICS_BANK||{},keys=[key,slug(concept),slug(micro)];for(var j=0;j<keys.length;j++)if(isBank(r[keys[j]])){clearTimeout(timer);resolve(r[keys[j]]);return true}return false}function next(){if(n>=urls.length){reject(new Error('bank unavailable'));return}var sc=document.createElement('script'),done=false,u=urls[n++];sc.async=false;sc.src=u+'?v='+BANK_VERSION+'&cb='+Date.now();function finish(){if(done)return;done=true;clearTimeout(timer);sc.remove();if(!inspect())next()}sc.onload=finish;sc.onerror=finish;timer=setTimeout(finish,7000);document.head.appendChild(sc)}next()})}async function load(){var key=slug(micro||concept),file='physics-'+key+'-question-bank.js',bank;try{bank=await loadScript(file,key)}catch(e){}if(!bank){content.innerHTML='<section class="status"><b>Quiz unavailable</b><p class="muted">A dedicated Physics question bank is not connected for this concept yet.</p></section>';return}items=bank.slice(0,30).map(function(item){var x={q:item.q,o:item.o.slice(),a:item.a,e:item.e||''},order=x.o.map(function(_,n){return n});for(var j=order.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1)),t=order[j];order[j]=order[k];order[k]=t}var correct=x.a;x.o=order.map(function(n){return x.o[n]});x.a=order.indexOf(correct);return x});render()}function render(){if(i>=items.length){bar.style.width='100%';progressText.textContent='Quiz complete';percent.textContent='100%';content.innerHTML='<section class="result"><div style="font-size:58px;text-align:center">🏆</div><div class="score">'+score+' / '+items.length+'</div><p class="muted" style="text-align:center"><b>'+Math.round(score/items.length*100)+'% accuracy</b></p><p class="muted" style="text-align:center">'+(score*10)+' XP earned</p><button class="next show" id="retry">🔄 Try Again</button></section>';document.getElementById('retry').onclick=function(){i=0;score=0;streak=0;xp.textContent='0';streakNode.textContent='0';render();scrollTo({top:0,behavior:'smooth'})};return}var x=items[i],opts=x.o||[],ans=x.a;bar.style.width=i/items.length*100+'%';progressText.textContent='Question '+(i+1)+' of '+items.length;percent.textContent=Math.round(i/items.length*100)+'%';content.innerHTML='<section class="q"><div class="qnum">Question '+(i+1)+' of '+items.length+'</div><h2>'+esc(x.q)+'</h2><div class="options">'+opts.map(function(v,j){return'<button class="opt" data-j="'+j+'">'+String.fromCharCode(65+j)+'. '+esc(v)+'</button>'}).join('')+'</div><div id="feedback" class="feedback"></div><button id="next" class="next">Continue →</button></section>';document.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){answer(+b.dataset.j,ans,x)}});document.getElementById('next').onclick=function(){i++;render();scrollTo({top:0,behavior:'smooth'})}}function answer(choice,ans,x){var bs=[...document.querySelectorAll('.opt')],f=document.getElementById('feedback');bs.forEach(function(b){b.disabled=true});if(bs[ans])bs[ans].classList.add('correct');if(choice!==ans){streak=0;streakNode.textContent=streak;bs[choice].classList.add('wrong');f.className='feedback show no';f.innerHTML='❌ <b>Incorrect.</b> '+esc(x.e)+'<br><b>Correct answer:</b> '+esc(x.o[ans])}else{score++;streak++;xp.textContent=score*10;streakNode.textContent=streak;f.className='feedback show ok';f.innerHTML='✨ <b>Correct!</b> '+esc(x.e)}document.getElementById('next').classList.add('show')}load()})();</script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="central-config.js"></script><script src="central-auth.js"></script><script>(async function(){if(window.SkillUpAuth){await window.SkillUpAuth.requireAuth(location.href);}})();</script>
