<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp | SI Base Units</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eef7ff;color:#173b62}.wrap{max-width:1050px;margin:auto;padding:20px}.hero,.mastery,.panel,.quiz{background:#fff;border-radius:20px;padding:22px;margin:12px 0;box-shadow:0 6px 18px #123b7015}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}.options{display:grid;gap:10px;margin:18px 0}.option{padding:14px;border:2px solid #dbe7f1;border-radius:15px;background:#fff;text-align:left;font-weight:700;cursor:pointer;font-size:16px}.option.selected{border-color:#1677ff;background:#eef6ff}.option.correct{border-color:#2db84d!important;background:#eaffef!important}.option.wrong{border-color:#e5484d!important;background:#fff0f0!important}.btn{padding:12px 18px;border:0;border-radius:13px;font-weight:900;cursor:pointer;margin:8px 6px 0 0}.check{background:#2db84d;color:#fff}.next{background:#dcecff;color:#145b9e}.btn:disabled{opacity:.55;cursor:not-allowed}.feedback{margin-top:14px;padding:13px;border-radius:14px;min-height:20px}.good{background:#e5f9e9}.bad{background:#fff0f0}.bar{height:13px;background:#dce8f2;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#42c95a;transition:width .25s ease}@media(max-width:750px){.layout{grid-template-columns:1fr}.wrap{padding:12px}}
</style>
</head>
<body><main class="wrap">
<p><a href="physics-home.html">← Back to Physics Path</a></p>
<section class="hero"><div>PHYSICS • NEET 2026</div><h1>SI Base Units</h1><p>LEARN → PRACTICE → MASTER • 15 focused NEET-style MCQs</p></section>
<section class="mastery">🎯 Skill Mastery <b id="mt">0 / 15</b><div class="bar"><div id="fill" class="fill"></div></div></section>
<div class="layout"><aside class="panel"><h3 id="count">Question 1 of 15</h3><div id="pct">7%</div><p>SI base units</p><p>⚡ +10 XP each</p><p>🦉 Learn → Practice → Master</p></aside>
<section class="quiz"><b id="badge">Q1</b><h2 id="q">Loading question…</h2><div id="opts" class="options"></div><button id="check" class="btn check">Check Answer</button><button id="next" class="btn next" disabled>Next Question →</button><div id="fb" class="feedback">💡 Choose the best answer.</div></section></div></main>
<script>(function(){'use strict';const quiz=[
['How many SI base units are defined in the International System of Units?',['5','7','9','10'],1],
['Which SI base unit is used for length?',['metre (m)','centimetre (cm)','kilometre (km)','inch (in)'],0],
['Which SI base unit is used for mass?',['gram (g)','kilogram (kg)','milligram (mg)','tonne (t)'],1],
['The SI base unit of time is:',['minute (min)','hour (h)','second (s)','day (d)'],2],
['The SI base unit of electric current is:',['volt (V)','coulomb (C)','ampere (A)','ohm (Ω)'],2],
['The SI base unit of thermodynamic temperature is:',['degree Celsius (°C)','kelvin (K)','fahrenheit (°F)','joule (J)'],1],
['The SI base unit of amount of substance is:',['mole (mol)','gram (g)','candela (cd)','litre (L)'],0],
['The SI base unit of luminous intensity is:',['lux (lx)','lumen (lm)','candela (cd)','watt (W)'],2],
['Which set contains only SI base units?',['m, kg, s, A','N, J, W, Pa','V, Ω, C, F','Hz, N, J, W'],0],
['Which of the following is NOT an SI base unit?',['metre','kilogram','newton','second'],2],
['The SI base unit symbol for mass is:',['g','kg','mg','M'],1],
['Which SI base unit has the symbol K?',['kelvin','kilogram','kelvin only for Celsius','candela'],0],
['Which SI base unit has the symbol mol?',['molarity','mole','metre','millimetre'],1],
['Newton is a derived unit because it can be expressed in base units as:',['kg·m·s⁻²','kg·m²·s⁻¹','kg·s⁻²','m·s⁻¹'],0],
['Which statement about SI base units is correct?',['They are defined as independent base units from which derived units can be formed','Every SI unit is a base unit','Newton and joule are base units','Base units have no symbols'],0]
];let i=0,sel=-1,score=0,q=document.getElementById('q'),o=document.getElementById('opts'),fb=document.getElementById('fb'),check=document.getElementById('check'),next=document.getElementById('next');function render(){let a=quiz[i];sel=-1;q.textContent=a[0];document.getElementById('badge').textContent='Q'+(i+1);document.getElementById('count').textContent='Question '+(i+1)+' of 15';document.getElementById('pct').textContent=Math.round((i+1)/15*100)+'%';o.innerHTML='';fb.className='feedback';fb.textContent='💡 Choose the best answer.';check.disabled=false;next.disabled=true;a[1].forEach((v,j)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+v;b.onclick=()=>{sel=j;[...o.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)})}check.onclick=()=>{if(sel<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}let a=quiz[i];[...o.children].forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===sel&&j!==a[2])b.classList.add('wrong')});if(sel===a[2]){score++;fb.className='feedback good';fb.textContent='🎯 Correct! +10 XP'}else{fb.className='feedback bad';fb.textContent='Review. Correct answer: '+a[1][a[2]]}document.getElementById('mt').textContent=score+' / 15';document.getElementById('fill').style.width=score/15*100+'%';check.disabled=true;next.disabled=false;if(i===14)next.textContent='Finish Skill →'};next.onclick=()=>{if(i<14){i++;next.textContent='Next Question →';render()}else{q.textContent='🏆 SI Base Units Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+score+' / 15 correct • '+score*10+' XP'}};render()})();</script>
</body></html>
