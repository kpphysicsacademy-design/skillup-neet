<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | SI Prefixes</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;margin:0;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.xp{font-weight:800}.card{background:white;border-radius:22px;padding:24px;margin-top:18px;box-shadow:0 5px 20px #00000012}.bar{height:10px;background:#e8eaf0;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.3s}.q{font-size:1.3rem;font-weight:750;line-height:1.45}.opts{display:grid;gap:10px;margin-top:18px}.opts button{padding:15px;border:2px solid #e2e5eb;border-radius:14px;background:white;text-align:left;font-size:1rem;cursor:pointer}.opts button:hover{border-color:#58cc02}.feedback{font-weight:700;margin-top:16px;min-height:24px}.next{margin-top:18px;padding:13px 22px;border:0;border-radius:14px;background:#58cc02;color:white;font-weight:800;cursor:pointer}.next:disabled{opacity:.45}.back{display:inline-block;margin-top:18px;padding:12px 18px;border:2px solid #5146a5;border-radius:14px;color:#5146a5;text-decoration:none;font-weight:800;transition:.2s}.back:hover{background:#5146a5;color:white;transform:translateY(-1px)}.back:active{transform:scale(.97)}</style></head><body><main class="wrap"><div class="top"><h1>🔢 SI Prefixes</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></div><p>Master SI prefixes, powers of ten and unit conversions with 15 NEET-style questions.</p><div class="bar"><div id="fill" class="fill"></div></div><section class="card"><div id="count"></div><p id="question" class="q"></p><div id="options" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Continue →</button></section><a class="back" href="physics-home.html">← Back to Physics Path</a></main><script>const qs=[
['The SI prefix kilo (k) represents:', ['10^2','10^3','10^6','10^-3'],1],
['The SI prefix mega (M) represents:', ['10^3','10^6','10^9','10^-6'],1],
['The SI prefix giga (G) represents:', ['10^6','10^9','10^12','10^-9'],1],
['The SI prefix milli (m) represents:', ['10^-1','10^-2','10^-3','10^-6'],2],
['The SI prefix micro (µ) represents:', ['10^-3','10^-6','10^-9','10^6'],1],
['The SI prefix nano (n) represents:', ['10^-6','10^-9','10^-12','10^9'],1],
['1 kilometre is equal to:', ['10 m','100 m','1000 m','10,000 m'],2],
['1 millimetre is equal to:', ['10^-1 m','10^-2 m','10^-3 m','10^-6 m'],2],
['1 micrometre is equal to:', ['10^-3 m','10^-6 m','10^-9 m','10^6 m'],1],
['1 nanometre is equal to:', ['10^-6 m','10^-9 m','10^-12 m','10^9 m'],1],
['Which prefix corresponds to 10^-9?', ['micro','nano','pico','milli'],1],
['Which prefix corresponds to 10^-12?', ['nano','pico','femto','micro'],1],
['A wavelength of 500 nm is equal to:', ['5×10^-5 m','5×10^-7 m','5×10^-9 m','5×10^7 m'],1],
['2.5 MW is equal to:', ['2.5×10^3 W','2.5×10^6 W','2.5×10^9 W','2.5×10^-6 W'],1],
['Which statement is correct?', ['centi = 10^-2','deci = 10^-3','mega = 10^3','nano = 10^-6'],0]
];let i=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$('count').textContent=`Question ${i+1} of ${qs.length}`;$('question').textContent=qs[i][0];$('options').innerHTML='';$('feedback').textContent='';$('next').disabled=true;qs[i][1].forEach((o,j)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>answer(j);$('options').appendChild(b)});$('fill').style.width=`${i/qs.length*100}%`}function answer(j){if(answered)return;answered=true;const ok=j===qs[i][2];if(ok){xp+=10;$('xp').textContent=xp;$('feedback').textContent='✅ Correct! +10 XP'}else $('feedback').textContent=`❌ Not quite. Correct answer: ${qs[i][1][qs[i][2]]}`;[...$('options').children].forEach((b,k)=>{b.disabled=true;if(k===qs[i][2])b.style.borderColor='#58cc02'});$('next').disabled=false}$('next').onclick=()=>{if(i<qs.length-1){i++;render()}else{$('fill').style.width='100%';$('question').textContent=`🎉 SI Prefixes mastered! You scored ${xp} XP out of ${qs.length*10} XP.`;$('options').innerHTML='';$('feedback').textContent='Excellent work — keep building your Physics path!';$('next').style.display='none'}};render();</script></body></html>
