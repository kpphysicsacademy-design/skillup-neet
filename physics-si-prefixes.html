<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | SI Prefixes</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🔢 SI Prefixes</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['The SI prefix kilo (k) represents:','10^2','10^3','10^6','10^-3',1,'Kilo (k) represents a factor of 10^3.'],
['The SI prefix mega (M) represents:','10^3','10^6','10^9','10^-6',1,'Mega (M) represents a factor of 10^6.'],
['The SI prefix giga (G) represents:','10^6','10^9','10^12','10^-9',1,'Giga (G) represents a factor of 10^9.'],
['The SI prefix milli (m) represents:','10^-1','10^-2','10^-3','10^-6',2,'Milli (m) represents a factor of 10^-3.'],
['The SI prefix micro (µ) represents:','10^-3','10^-6','10^-9','10^6',1,'Micro (µ) represents a factor of 10^-6.'],
['The SI prefix nano (n) represents:','10^-6','10^-9','10^-12','10^9',1,'Nano (n) represents a factor of 10^-9.'],
['1 kilometre is equal to:','10 m','100 m','1000 m','10,000 m',2,'The prefix kilo means 10^3, so 1 km = 1000 m.'],
['1 millimetre is equal to:','10^-1 m','10^-2 m','10^-3 m','10^-6 m',2,'The prefix milli means 10^-3, so 1 mm = 10^-3 m.'],
['1 micrometre is equal to:','10^-3 m','10^-6 m','10^-9 m','10^6 m',1,'The prefix micro means 10^-6, so 1 µm = 10^-6 m.'],
['1 nanometre is equal to:','10^-6 m','10^-9 m','10^-12 m','10^9 m',1,'The prefix nano means 10^-9, so 1 nm = 10^-9 m.'],
['Which prefix corresponds to 10^-9?','micro','nano','pico','milli',1,'Nano (n) corresponds to 10^-9.'],
['Which prefix corresponds to 10^-12?','nano','pico','femto','micro',1,'Pico (p) corresponds to 10^-12.'],
['A wavelength of 500 nm is equal to:','5×10^-5 m','5×10^-7 m','5×10^-9 m','5×10^7 m',1,'500 nm = 500 × 10^-9 m = 5 × 10^-7 m.'],
['2.5 MW is equal to:','2.5×10^3 W','2.5×10^6 W','2.5×10^9 W','2.5×10^-6 W',1,'Mega means 10^6, so 2.5 MW = 2.5 × 10^6 W.'],
['Which statement is correct?','centi = 10^-2','deci = 10^-3','mega = 10^3','nano = 10^-6',0,'The SI prefix centi represents 10^-2.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
