<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SkillUp Physics | Significant Figure Practice</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.opt.selected{border-color:#5146a5;background:#f4f1ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.opt:disabled{cursor:default}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🔢 Significant Figure Practice</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="action">CHECK</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['How many significant figures are present in 0.00450?',['2','3','4','5'],1,'Leading zeros are not significant; 4, 5 and the trailing zero are significant, giving 3 significant figures.'],['How many significant figures are in 300.0?',['1','2','3','4'],3,'The decimal point makes the trailing zeroes significant, so 300.0 has 4 significant figures.'],['How many significant figures are in 0.00506?',['2','3','4','5'],1,'Leading zeros are not significant; 5, 0 between non-zero digits, and 6 are significant: 3.'],['How many significant figures are in 7000 when no decimal point is shown?',['1 only is certain','2','3','4'],0,'Without additional notation, trailing zeros in an integer such as 7000 are ambiguous; one significant figure is the only certain count.'],['Which zero is always significant?',['A leading zero','A zero between non-zero digits','A zero before the first non-zero digit','A zero used only as a placeholder before the decimal'],1,'A zero between non-zero digits is an interior zero and is significant.'],['Round 12.746 to 4 significant figures.',['12.74','12.75','12.7460','12.70'],1,'The first four significant digits are 1, 2, 7, 4; the next digit is 6, so 12.74 rounds to 12.75.'],['Round 0.004786 to 3 significant figures.',['0.00478','0.00479','0.00480','0.00470'],1,'The first three significant digits are 4, 7, 8 and the next digit is 6, so the result is 0.00479.'],['Round 58.349 to 3 significant figures.',['58.3','58.4','58.35','58.0'],1,'For 3 significant figures, 58.349 becomes 58.4 because the fourth significant digit is 4?'],1,'58.349 has 5, 8, 3 as the first three significant digits; the next digit is 4, so it rounds to 58.3.'],['When multiplying measured quantities, the final answer should generally have:',['The largest number of significant figures in the inputs','The smallest number of significant figures in the inputs','Exactly 10 significant figures','No significant figures'],1,'For multiplication and division, the result is generally reported with the same number of significant figures as the input with the fewest.'],['When adding measured quantities, the final answer should generally be rounded according to:',['The fewest decimal places','The fewest significant figures','The largest number of decimal places','The largest number of significant figures'],0,'For addition and subtraction, the result is generally limited by the least number of decimal places.'],['Calculate 2.5 × 3.42 to the appropriate significant figures.',['8.55','8.6','8.550','9'],1,'2.5 has 2 significant figures and 3.42 has 3; 8.55 rounds to 8.6 with 2 significant figures.'],['Calculate 12.11 + 0.3 to the appropriate precision.',['12.41','12.4','12.410','12'],1,'The least precise term has 1 decimal place, so 12.41 is rounded to 12.4.'],['Which notation clearly represents 5 significant figures for 50000?',['50000','5.0000 × 10^4','50,000','0.000050000'],1,'5.0000 × 10^4 explicitly contains five significant figures.'],['What is the result of 6.20 ÷ 2.0 to the appropriate significant figures?',['3.1','3.10','3.100','3'],0,'6.20 has 3 significant figures and 2.0 has 2, so the result is 3.1 with 2 significant figures.'],['Which statement is correct?',['Significant figures indicate measurement precision','All zeros are significant','More decimal places always mean greater accuracy','Exact counted numbers must always be rounded'],0,'Significant figures communicate the precision supported by a measurement.']];qs[7]=['Round 58.349 to 3 significant figures.',['58.3','58.4','58.35','58.0'],0,'The first three significant digits are 5, 8, and 3; the next digit is 4, so the result is 58.3.'];let i=0,score=0,answered=false,selected=-1;const $=x=>document.getElementById(x);function render(){answered=false;selected=-1;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q[1].map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('action').classList.remove('hide');$('action').textContent='CHECK'});$('xp').textContent='';$('action').classList.add('hide');$('action').disabled=false;}function check(){if(selected<0)return;if(!answered){answered=true;const q=qs[i],ok=selected===q[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===selected&&!ok)b.classList.add('wrong')});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[3];if(ok)score++;$('score').textContent=`XP ${score}`;$('fill').style.width=`${(i+1)/15*100}%`;$('action').textContent=i===14?'FINISH':'Next Question →';return;}if(i<14){i++;render()}else{$('quiz').innerHTML='';$('action').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('action').onclick=check;render();</script></body></html>
