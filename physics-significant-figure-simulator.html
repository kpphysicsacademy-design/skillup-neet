<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1f1e5"><title>SkillUp Physics | Significant Figures — Simulator</title><link rel="stylesheet" href="physics-duolingo-quiz.css?v=20261122-all-topics-v1"><style>body{margin:0;background:#f1f1e5;color:#27372e;font-family:system-ui,sans-serif}header{background:#fbfbf3;border-bottom:1px solid #dce1d4}.nav{width:min(100% - 24px,720px);min-height:68px;margin:auto;display:flex;align-items:center;gap:10px}.back{width:42px;height:42px;display:grid;place-items:center;border:2px solid #dce5d7;border-radius:14px;background:#f2f9ff;color:#174a78;text-decoration:none}.brand{font-weight:950}.brand small{display:block;font-size:9px;color:#68766a}main{width:min(100% - 24px,720px);margin:16px auto 40px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.tab{min-height:46px;display:grid;place-items:center;border:2px solid #dce8f3;border-radius:14px;background:#fff;color:#245273;text-decoration:none;font-size:13px;font-weight:900}.tab.active{background:#e8f8dc;border-color:#8ed65b;color:#286c12}.card{background:#fff;border:2px solid #e2e9df;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 5px 0 #dce8f3}.hero{background:#e9eddf}h1{color:#254b37}.muted{line-height:1.6;color:#5f6f61}.field{margin:17px 0}.field label{display:flex;justify-content:space-between;font-weight:850;margin-bottom:8px}.field input,.field select{width:100%;padding:12px;border:2px solid #d6ddce;border-radius:12px;background:#fbfbf3}.field input[type=range]{padding:0;accent-color:#58cc02}.result{margin:12px 0;padding:14px;border-radius:14px;background:#efffe7;border:1px solid #c8f0b2;text-align:center}.result b{display:block;font-size:20px;color:#286c12}.results{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:400px){.tab{font-size:11px}}</style></head><body><header><div class="nav"><a class="back" href="physics-home-fast.html">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div></div></header><main><nav class="tabs" aria-label="Significant Figures pages"><a class="tab" href="physics-significant-figure-learn.html">📘 Learn</a><a class="tab active" href="physics-significant-figure-simulator.html" aria-current="page">🎮 Simulator</a><a class="tab" href="physics-significant-figure-practice.html">🧠 Practice</a></nav><section class="card hero"><h1>🔢 Significant Figures Simulator</h1><p class="muted">Enter a measured number to count its significant figures and explore rounding.</p><div class="formula">Count all certain digits plus the first uncertain digit.</div></section><section class="card"><div class="field"><label for="num">Number <output id="numOut">0.004560</output></label><input id="num" type="text" value="0.004560" inputmode="decimal"></div><div class="result" id="result">Significant figures: <b id="count">4</b></div><div class="field"><label for="round">Round to significant figures <output id="roundOut">3</output></label><input id="round" type="range" min="1" max="8" value="3"></div><div class="result">Rounded value: <b id="rounded">0.00456</b></div></section></main><script>(function(){"use strict";const $=id=>document.getElementById(id);const num=$('num'),round=$('round');function count(s){s=s.trim().replace(/^[+-]/,'').replace(/[eE].*$/,'').replace(/^0+/, '').replace('.','');return s.replace(/^0+/,'').length||1;}function update(){const v=num.value.trim(),n=count(v),k=+round.value; $('numOut').textContent=v;$('count').textContent=n;$('roundOut').textContent=k;const x=Number(v);$('rounded').textContent=Number.isFinite(x)?x.toPrecision(Math.min(21,k)): 'Enter a valid number';}num.addEventListener('input',update);round.addEventListener('input',update);update();})();</script><script src="shared-nav.js?v=20261122-all-topics-v1"></script></body></html>
