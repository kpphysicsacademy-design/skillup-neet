<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Significant Figures</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;line-height:1.45}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{font-weight:700;color:#e08a00;text-align:center;min-height:24px;line-height:1.5}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🔢 Significant Figures</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['What are significant figures?','Digits that convey the precision of a measured quantity','Only digits after the decimal point','All zeros in a number','Only non-zero digits in every case',0,'Significant figures are the meaningful digits in a measured value, including certain zeros.'],
['How many significant figures are in 0.00450?','2','3','4','5',1,'Leading zeros are not significant; 4, 5 and the trailing zero are significant.'],
['How many significant figures are in 305.0?','3','4','5','2',1,'The zero between non-zero digits and the trailing decimal zero are significant.'],
['How many significant figures are in 0.00072?','2','3','5','6',0,'Leading zeros are not significant, so only 7 and 2 count.'],
['How many significant figures are in 100.0?','1','2','3','4',3,'With a decimal point shown, the trailing zeros are significant.'],
['Which zero is always significant?','A zero between two non-zero digits','A leading zero before the first non-zero digit','A zero at the far left of a decimal','An unspecified zero in an integer',0,'A zero between non-zero digits is significant.'],
['The result of 12.3 + 1.25, reported using addition rules, is:','13.55','13.6','13.5','14',1,'For addition, retain the least number of decimal places: 13.55 rounds to 13.6.'],
['The result of 2.5 × 3.42, using significant-figure rules, is:','8.55','8.6','8.50','9',1,'2.5 has 2 significant figures, so 8.55 is reported as 8.6.'],
['In multiplication and division, the final answer should generally have:','The same number of significant figures as the least precise factor','The most decimal places of any factor','Exactly four significant figures','No rounding',0,'Use the least number of significant figures among the measured factors.'],
['In addition and subtraction, the final answer should generally be rounded to:','The least number of decimal places among the terms','The least number of significant figures','The greatest number of decimal places','Two significant figures always',0,'Addition and subtraction are governed by decimal-place precision.'],
['Which value has exactly 4 significant figures?','0.004560','45.60','4500','0.045',1,'45.60 has four significant figures.'],
['How many significant figures are in 6.020 × 10³?','3','4','5','2',1,'All four digits in the coefficient are significant.'],
['The number 0.03040 contains how many significant figures?','3','4','5','2',1,'The significant digits are 3, 0, 4 and 0.'],
['Why are significant figures important in experimental physics?','They indicate the precision justified by the measurement','They make every measurement exact','They eliminate systematic errors','They replace SI units',0,'Significant figures communicate the precision supported by the measurement.'],
['A measured length is 5.20 cm. Which statement is correct?','It has 3 significant figures and implies precision to 0.01 cm','It has 2 significant figures only','It has 1 significant figure','The trailing zero is never significant',0,'5.20 contains three significant figures and the trailing zero after the decimal is significant.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
