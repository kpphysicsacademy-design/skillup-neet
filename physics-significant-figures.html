<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Significant Figures</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;margin:0;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.xp{font-weight:800}.card{background:#fff;border-radius:22px;padding:24px;margin-top:18px;box-shadow:0 5px 20px #00000012}.mastery{font-weight:800;margin-top:18px}.bar{height:10px;background:#e8eaf0;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#58cc02;transition:.3s}.q{font-size:1.3rem;font-weight:750;line-height:1.45}.opts{display:grid;gap:10px;margin-top:18px}.opts button{padding:15px;border:2px solid #e2e5eb;border-radius:14px;background:#fff;text-align:left;font-size:1rem;cursor:pointer}.opts button:hover{border-color:#58cc02}.opts button:disabled{cursor:default}.opts button.correct{border-color:#58cc02;background:#effbea}.opts button.wrong{border-color:#e5484d;background:#fff0f0}.feedback{font-weight:700;margin-top:16px;min-height:24px;line-height:1.5}.next{margin-top:18px;padding:13px 22px;border:0;border-radius:14px;background:#58cc02;color:white;font-weight:800;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:inline-block;margin-top:18px;padding:12px 18px;border:2px solid #5146a5;border-radius:14px;color:#5146a5;text-decoration:none;font-weight:800;transition:.2s}.back:hover{background:#5146a5;color:white;transform:translateY(-1px)}.back:active{transform:scale(.97)}.meta{font-size:.95rem;color:#4b5563}@media(max-width:600px){.wrap{padding:20px 14px}.top h1{font-size:1.55rem}.card{padding:20px}.q{font-size:1.18rem}}</style></head><body><main class="wrap"><div class="top"><h1>🔢 Significant Figures</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></div><p>Master significant figures, rounding rules and measurement precision with 15 NEET-style questions.</p><div class="mastery">🎯 Skill Mastery <span id="mt">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div><section class="card"><div id="count" class="meta">Question 1 of 15</div><p id="question" class="q"></p><div id="options" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Continue →</button></section><a class="back" href="physics-home.html">← Back to Physics Path</a></main><script>const qs=[['What are significant figures?',['Digits that convey the precision of a measured quantity','Only digits after the decimal point','All zeros in a number','Only non-zero digits in every case'],0,'Significant figures are the meaningful digits in a measured value, including certain zeros.'],['How many significant figures are in 0.00450?',['2','3','4','5'],1,'Leading zeros are not significant; 4, 5 and the trailing zero are significant.'],['How many significant figures are in 305.0?',['3','4','5','2'],1,'The zero between non-zero digits and the trailing decimal zero are significant.'],['How many significant figures are in 0.00072?',['2','3','5','6'],0,'Leading zeros are not significant, so only 7 and 2 count.'],['How many significant figures are in 100.0?',['1','2','3','4'],3,'With a decimal point shown, the trailing zeros are significant.'],['Which zero is always significant?',['A zero between two non-zero digits','A leading zero before the first non-zero digit','A zero at the far left of a decimal','An unspecified zero in an integer'],0,'A zero between non-zero digits is significant.'],['The result of 12.3 + 1.25, reported using addition rules, is:',['13.55','13.6','13.5','14'],1,'For addition, retain the least number of decimal places: 13.55 rounds to 13.6.'],['The result of 2.5 × 3.42, using significant-figure rules, is:',['8.55','8.6','8.50','9'],1,'2.5 has 2 significant figures, so 8.55 is reported as 8.6.'],['In multiplication and division, the final answer should generally have:',['The same number of significant figures as the least precise factor','The most decimal places of any factor','Exactly four significant figures','No rounding'],0,'Use the least number of significant figures among the measured factors.'],['In addition and subtraction, the final answer should generally be rounded to:',['The least number of decimal places among the terms','The least number of significant figures','The greatest number of decimal places','Two significant figures always'],0,'Addition and subtraction are governed by decimal-place precision.'],['Which value has exactly 4 significant figures?',['0.004560','45.60','4500','0.045'],1,'45.60 has four significant figures.'],['How many significant figures are in 6.020 × 10³?',['3','4','5','2'],1,'All four digits in the coefficient are significant.'],['The number 0.03040 contains how many significant figures?',['3','4','5','2'],1,'The significant digits are 3, 0, 4 and 0.'],['Why are significant figures important in experimental physics?',['They indicate the precision justified by the measurement','They make every measurement exact','They eliminate systematic errors','They replace SI units'],0,'Significant figures communicate the precision supported by the measurement.'],['A measured length is 5.20 cm. Which statement is correct?',['It has 3 significant figures and implies precision to 0.01 cm','It has 2 significant figures only','It has 1 significant figure','The trailing zero is never significant'],0,'5.20 contains three significant figures and the trailing zero after the decimal is significant.']];let i=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$('count').textContent=`Question ${i+1} of ${qs.length}`;$('question').textContent=qs[i][0];$('options').innerHTML='';$('feedback').textContent='';$('next').disabled=true;qs[i][1].forEach((o,j)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+j)+'. '+o;b.onclick=()=>answer(j);$('options').appendChild(b)});$('fill').style.width=`${i/qs.length*100}%`;$('mt').textContent=`${Math.round(i/qs.length*100)}%`;}function answer(j){if(answered)return;answered=true;const a=qs[i],ok=j===a[2];if(ok){xp+=10;$('xp').textContent=xp;$('feedback').textContent='✅ Correct! +10 XP — '+a[3]}else{$('feedback').textContent='❌ Not quite. Correct answer: '+a[1][a[2]]+' — '+a[3]}[...$('options').children].forEach((b,k)=>{b.disabled=true;if(k===a[2])b.classList.add('correct');if(k===j&&k!==a[2])b.classList.add('wrong')});$('mt').textContent=`${i+1} / ${qs.length}`;$('next').disabled=false}$('next').onclick=()=>{if(i<qs.length-1){i++;render()}else{$('fill').style.width='100%';$('mt').textContent='100%';$('question').textContent=`🎉 Significant Figures mastered! You scored ${xp} XP out of ${qs.length*10} XP.`;$('options').innerHTML='';$('feedback').textContent='Excellent work — keep building your Physics path!';$('next').style.display='none'}};render();</script></body></html>
