<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}

.track{height:11px;border-radius:99px;background:#e2edf7;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}

.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}

.nav{display:flex;align-items:center;gap:10px;min-height:72px;padding:10px 14px}

}

}

<section class="hero"><h1>🔥 Simple Harmonic Motion</h1><p class="muted">Explore simple harmonic properties with 30 questions and concise explanations.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>

<script>
(function(){
'use strict';
const questions = [{"q":"Simple harmonic motion (SHM) is motion in which…","o":["acceleration is constant","acceleration is proportional to displacement and directed toward equilibrium","velocity is always constant","force is always zero"],"a":1,"e":"In SHM, a = −ω²x, so acceleration is proportional to displacement and opposite in direction."},{"q":"The defining acceleration equation for SHM is…","o":["a = ωx","a = −ω²x","a = ω²/x","a = constant"],"a":1,"e":"The negative sign indicates acceleration is directed toward equilibrium."},{"q":"In x = A cos(ωt + φ), A is the…","o":["angular frequency","amplitude","phase constant","time period"],"a":1,"e":"A is the maximum displacement from equilibrium."},{"q":"The SI unit of amplitude is the same as that of…","o":["frequency","displacement","angular frequency","phase"],"a":1,"e":"Amplitude is a length, so its SI unit is metre."},{"q":"The angular frequency of SHM is related to its period T by…","o":["ω = T/2π","ω = 2π/T","ω = 1/T²","ω = 2πT²"],"a":1,"e":"One cycle corresponds to 2π radians, hence ω = 2π/T."},{"q":"The relation between angular frequency ω and frequency f is…","o":["ω = 2πf","ω = f/2π","ω = f²","ω = 1/f"],"a":0,"e":"Angular frequency is ω = 2πf."},{"q":"The time period of SHM with angular frequency ω is…","o":["2πω","ω/2π","2π/ω","1/ω²"],"a":2,"e":"T = 2π/ω."},{"q":"At the equilibrium position in SHM, displacement is…","o":["A","−A","zero","A/2"],"a":2,"e":"Displacement is measured from equilibrium and is zero at that position."},{"q":"At either extreme of SHM, the speed is…","o":["maximum","zero","ωA/2","constant and nonzero"],"a":1,"e":"The oscillator momentarily stops before reversing direction."},{"q":"The speed in ideal SHM is maximum at…","o":["x = ±A","x = 0","x = A/2 only","all positions equally"],"a":1,"e":"Kinetic energy and speed are maximum at equilibrium."},{"q":"The magnitude of acceleration in SHM is maximum at…","o":["equilibrium","the extreme positions","every point equally","x = A/2 only"],"a":1,"e":"Since |a| = ω²|x|, acceleration magnitude is greatest at |x| = A."},{"q":"The restoring force in SHM is…","o":["F = kx","F = −kx","F = k/x","F = constant"],"a":1,"e":"Hooke's-law restoring force is opposite to displacement."},{"q":"For x = A cos(ωt), the displacement at t = 0 is…","o":["zero","A","−A","A/2"],"a":1,"e":"cos 0 = 1, so x(0) = A."},{"q":"For x = A sin(ωt), the displacement at t = 0 is…","o":["A","−A","zero","2A"],"a":2,"e":"sin 0 = 0, so the initial displacement is zero."},{"q":"The phase of SHM written as x = A cos(ωt + φ) is…","o":["A","ω","ωt + φ","t/ω"],"a":2,"e":"The instantaneous phase is ωt + φ."},{"q":"The phase constant φ determines the…","o":["mass only","initial state of oscillation","amplitude only","spring constant only"],"a":1,"e":"The phase constant sets the initial phase and thus initial displacement and velocity."},{"q":"The velocity in SHM is obtained by differentiating displacement with respect to…","o":["mass","time","frequency","force"],"a":1,"e":"Velocity is v = dx/dt."},{"q":"For x = A cos(ωt), the velocity is…","o":["Aω cos(ωt)","−Aω sin(ωt)","Aω² sin(ωt)","−A sin(ωt)/ω"],"a":1,"e":"Differentiating x = A cos(ωt) gives v = −Aω sin(ωt)."},{"q":"The maximum speed in SHM is…","o":["A/ω","Aω","Aω²","ω/A"],"a":1,"e":"Maximum speed is v_max = Aω."},{"q":"The maximum acceleration magnitude in SHM is…","o":["Aω","Aω²","A/ω²","ω²/A"],"a":1,"e":"Since a = −ω²x, a_max = Aω²."},{"q":"The speed-displacement relation in SHM is…","o":["v² = ω²(A² − x²)","v² = ω²(A² + x²)","v = ωx always","v² = A² − ω²x"],"a":0,"e":"Energy conservation gives v² = ω²(A² − x²)."},{"q":"The total mechanical energy of a spring-mass oscillator is…","o":["½kA²","kA","½mv","k/A"],"a":0,"e":"For amplitude A, total energy is E = ½kA²."},{"q":"At equilibrium in ideal spring SHM, the potential energy measured from equilibrium is…","o":["maximum","zero","equal to total energy","infinite"],"a":1,"e":"For a spring, U = ½kx², which is zero at x = 0."},{"q":"At an extreme position in ideal SHM, the kinetic energy is…","o":["maximum","zero","equal to potential energy always","negative"],"a":1,"e":"At the extreme, speed is zero, so kinetic energy is zero."},{"q":"For an ideal mass-spring system, the time period is…","o":["2π√(k/m)","2π√(m/k)","√(mk)","m/k"],"a":1,"e":"T = 2π√(m/k)."},{"q":"For a simple pendulum at small angles, the time period is…","o":["2π√(g/L)","2π√(L/g)","2πL/g","√(Lg)"],"a":1,"e":"For small oscillations, T = 2π√(L/g)."},{"q":"For a simple pendulum, the time period (small-angle approximation) depends on…","o":["mass of bob","amplitude for all angles","pendulum length and gravitational acceleration","color of the bob"],"a":2,"e":"T = 2π√(L/g), independent of bob mass for small oscillations."},{"q":"If the amplitude of ideal SHM doubles while angular frequency stays fixed, maximum speed…","o":["halves","doubles","quadruples","stays fixed"],"a":1,"e":"v_max = Aω, so doubling A doubles maximum speed."},{"q":"If the angular frequency doubles and amplitude stays fixed, maximum acceleration…","o":["doubles","quadruples","halves","stays fixed"],"a":1,"e":"a_max = Aω², so doubling ω makes maximum acceleration four times larger."},{"q":"In ideal SHM, acceleration and displacement are…","o":["in phase","opposite in phase","always unrelated","both always zero"],"a":1,"e":"Acceleration a = −ω²x is 180° out of phase with displacement."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
const wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Simple Harmonic Motion Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
