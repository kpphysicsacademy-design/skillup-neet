<script>
(function(){
'use strict';
const questions = [{"q":"The time period of a simple pendulum for small oscillations is:","o":["2π√(L/g)","2π√(g/L)","√(Lg)","2πL/g"],"a":0,"e":"For small angular amplitudes, T = 2π√(L/g)."},{"q":"In the formula T = 2π√(L/g), L is measured from the pivot to the:","o":["Centre of mass of the bob","Top surface of the bob","Bottom of the bob","End of the string beyond the bob"],"a":0,"e":"The effective length reaches from the point of suspension to the bob's centre of mass."},{"q":"The SI unit of the time period is:","o":["Second (s)","Hertz (Hz)","Metre (m)","Metre per second (m/s)"],"a":0,"e":"Time period is a time interval, measured in seconds."},{"q":"For a fixed local value of g, the period T is proportional to:","o":["√L","L","1/L","L²"],"a":0,"e":"T = 2π√(L/g), so T ∝ √L."},{"q":"If the pendulum length is increased to four times its original value, its period becomes:","o":["Twice as large","Four times as large","Half as large","Unchanged"],"a":0,"e":"T ∝ √L, so multiplying L by 4 multiplies T by √4 = 2."},{"q":"If g becomes four times larger while L remains unchanged, the period becomes:","o":["Half the original period","Twice the original period","Four times the original period","Unchanged"],"a":0,"e":"T ∝ 1/√g, so a fourfold increase in g halves T."},{"q":"For small oscillations, the period of an ideal simple pendulum depends on the bob's:","o":["Length and local gravitational acceleration","Mass and colour","Mass and material","Speed at the lowest point only"],"a":0,"e":"The ideal small-angle period depends on L and g, not the bob's mass."},{"q":"A pendulum makes 20 complete oscillations in 40 s. Its period is:","o":["2 s","0.5 s","20 s","40 s"],"a":0,"e":"T = total time / number of oscillations = 40/20 = 2 s."},{"q":"A pendulum has a period of 0.5 s. Its frequency is:","o":["2 Hz","0.5 Hz","4 Hz","1 Hz"],"a":0,"e":"Frequency f = 1/T = 1/0.5 = 2 Hz."},{"q":"The relation between frequency f and period T is:","o":["f = 1/T","f = T","f = 2πT","f = T²"],"a":0,"e":"Frequency counts cycles per second, so f and T are reciprocals."},{"q":"The angular frequency of a simple pendulum in the small-angle approximation is:","o":["√(g/L)","√(L/g)","2π√(L/g)","gL"],"a":0,"e":"Since ω = 2π/T and T = 2π√(L/g), ω = √(g/L)."},{"q":"For L = 1 m and g ≈ 9.8 m/s², the pendulum period is closest to:","o":["2.0 s","1.0 s","3.14 s","9.8 s"],"a":0,"e":"T = 2π√(1/9.8) ≈ 2.01 s."},{"q":"A seconds pendulum has a complete-oscillation period of:","o":["2 seconds","1 second","0.5 seconds","4 seconds"],"a":0,"e":"A seconds pendulum takes about 2 s for one complete oscillation, or 1 s per half-swing."},{"q":"For small oscillations, increasing the amplitude slightly while keeping it small makes the period approximately:","o":["Unchanged","Twice as large","Half as large","Zero"],"a":0,"e":"The small-angle approximation makes the period independent of amplitude to first order."},{"q":"The restoring force component for a pendulum bob displaced by angle θ is proportional to:","o":["−sin θ","cos θ only","tan θ","θ² for all angles"],"a":0,"e":"The tangential restoring force is −mg sin θ, directed toward equilibrium."},{"q":"For small angles measured in radians, sin θ is approximately:","o":["θ","θ²","1/θ","θ/2"],"a":0,"e":"For θ small in radians, sin θ ≈ θ, giving the SHM approximation."},{"q":"The small-angle approximation is useful because it makes the pendulum's restoring torque approximately:","o":["Proportional to angular displacement and opposite in direction","Constant and independent of displacement","Proportional to displacement squared","Directed away from equilibrium"],"a":0,"e":"With sin θ ≈ θ, the restoring torque is approximately linear in angular displacement."},{"q":"If the period is 3 s, the frequency is:","o":["1/3 Hz","3 Hz","6π Hz","9 Hz"],"a":0,"e":"f = 1/T = 1/3 Hz."},{"q":"A pendulum's length is reduced to one-quarter of its original value. Its period becomes:","o":["Half the original period","One-quarter the original period","Twice the original period","Four times the original period"],"a":0,"e":"T ∝ √L, so Tnew/Told = √(1/4) = 1/2."},{"q":"On the Moon, where gravitational acceleration is lower than on Earth, the same pendulum has a period that is:","o":["Longer","Shorter","Exactly unchanged","Always zero"],"a":0,"e":"T ∝ 1/√g; lower gravitational acceleration gives a longer period."},{"q":"If a pendulum's length and gravitational acceleration are both multiplied by 4, its period:","o":["Remains unchanged","Doubles","Halves","Becomes four times larger"],"a":0,"e":"The ratio L/g remains unchanged, so T = 2π√(L/g) is unchanged."},{"q":"A pendulum completes 30 oscillations in 60 s. Its frequency is:","o":["0.5 Hz","2 Hz","30 Hz","60 Hz"],"a":0,"e":"f = number of oscillations / time = 30/60 = 0.5 Hz."},{"q":"For a pendulum with L = 0.25 m and g ≈ 9.8 m/s², T is closest to:","o":["1.0 s","0.5 s","2.0 s","3.0 s"],"a":0,"e":"T = 2π√(0.25/9.8) ≈ 1.00 s."},{"q":"If a pendulum's period is 2 s, its angular frequency is:","o":["π rad/s","2π rad/s","1 rad/s","4π rad/s"],"a":0,"e":"ω = 2π/T = 2π/2 = π rad/s."},{"q":"Which change will increase the period of a simple pendulum?","o":["Increase its length while keeping g fixed","Decrease its length while keeping g fixed","Increase g while keeping length fixed","Reduce the bob's mass"],"a":0,"e":"The period increases with the square root of length and decreases with the square root of g."},{"q":"The dimensions of the quantity √(L/g) are:","o":["Time","Length","Inverse time","Acceleration"],"a":0,"e":"L/g has dimensions m/(m s⁻²) = s², so its square root has dimensions of time."},{"q":"For a simple pendulum undergoing small oscillations, the equilibrium position is:","o":["The lowest vertical position","The highest point of the swing","Any point along the arc","The position where the string is horizontal"],"a":0,"e":"The bob's stable equilibrium is directly below the pivot, where its potential energy is minimum."},{"q":"At the lowest point of its swing, an ideal pendulum bob has:","o":["Maximum speed and minimum gravitational potential energy","Zero speed and maximum kinetic energy","Maximum displacement from equilibrium","Zero kinetic energy and maximum speed"],"a":0,"e":"The bob passes through equilibrium at maximum speed; gravitational potential energy is lowest there."},{"q":"At either turning point of an ideal pendulum's swing, the bob's instantaneous speed is:","o":["Zero","Maximum","Equal to g","Always equal to its average speed"],"a":0,"e":"At a turning point the bob momentarily stops before reversing direction."},{"q":"A pendulum's period is 2 s on Earth. If its effective length is made nine times larger and g is unchanged, the new period is:","o":["6 s","3 s","9 s","18 s"],"a":0,"e":"T scales as √L, so the new period is 2 × √9 = 6 s."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';

 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Simple Pendulum Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }

});
render();
})();
