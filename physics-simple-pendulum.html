<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Simple Pendulum</title><style>body{font-family:Arial,sans-serif;background:#f3f7ff;margin:0;color:#1e293b}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(30,41,59,.10);border:1px solid #e2e8f0}h1{text-align:center;color:#334155}.meta{display:flex;justify-content:space-between;font-weight:700;color:#475569}.bar{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#22c55e;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;color:#172033}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe4f0;border-radius:14px;background:#fff;color:#1e293b;font-size:16px;cursor:pointer;transition:.2s}.opt:hover{background:#eef5ff;border-color:#93c5fd;transform:translateY(-1px)}.opt:focus-visible{outline:3px solid #bfdbfe;outline-offset:2px}.correct{border-color:#16a34a!important;background:#ecfdf3!important;color:#166534!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important;color:#991b1b!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s}.next,.retry{background:#4f46e5;color:#fff}.next:hover,.retry:hover{background:#4338ca}.back{background:#334155;color:#fff}.back:hover{background:#1e293b}.hide{display:none}.xp{text-align:center;font-weight:700;color:#d97706;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🎯 Simple Pendulum</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['The time period of a simple pendulum for small oscillations is','T=2π√(g/L)','T=2π√(L/g)','T=√(L/g)','T=2πL/g',1,'For small oscillations, T=2π√(L/g).'],['The SI unit of the time period of a simple pendulum is','metre','hertz','second','radian',2,'Time period is a time interval, so its SI unit is second.'],['For small oscillations, the time period of a simple pendulum depends on','mass of bob','length and acceleration due to gravity','amplitude only','density of bob',1,'T=2π√(L/g), so mass does not appear; T depends on L and g.'],['If the length of a simple pendulum is increased four times, its time period becomes','four times','twice','half','one-fourth',1,'Since T∝√L, increasing L by 4 makes T twice.'],['If acceleration due to gravity becomes four times, the time period becomes','four times','twice','half','unchanged',2,'Since T∝1/√g, increasing g by 4 makes T half.'],['The frequency of a simple pendulum is','f=T','f=1/T','f=2πT','f=T²',1,'Frequency and time period are reciprocals: f=1/T.'],['A simple pendulum has length 1 m and g=π² m/s². Its time period is','1 s','2 s','π s','π/2 s',1,'T=2π√(1/π²)=2 s.'],['For a simple pendulum, the bob mass is doubled while L and g remain constant. The time period','doubles','becomes half','remains unchanged','becomes four times',2,'Mass does not occur in T=2π√(L/g), so the period remains unchanged.'],['The simple pendulum executes approximately SHM when','its amplitude is very large','its angular displacement is small','g is zero','the bob has no mass',1,'For small angular displacement, the restoring torque is approximately proportional to displacement, giving SHM.'],['The restoring force responsible for the oscillation of a pendulum is mainly due to','magnetic force','horizontal component of gravity','friction only','buoyant force',1,'The tangential component of gravitational force provides the restoring force.'],['For a simple pendulum of length L, angular frequency for small oscillations is','ω=2π√(L/g)','ω=√(g/L)','ω=√(L/g)','ω=g/L',1,'Using ω=2π/T and T=2π√(L/g), ω=√(g/L).'],['A pendulum completes 20 oscillations in 40 s. Its frequency is','0.5 Hz','1 Hz','2 Hz','20 Hz',1,'f=number of oscillations/time=20/40=0.5 Hz.'],['A pendulum has a time period of 4 s. Its frequency is','4 Hz','2 Hz','0.5 Hz','0.25 Hz',3,'f=1/T=1/4=0.25 Hz.'],['A seconds pendulum has a time period of','1 s','2 s','60 s','0.5 s',1,'A seconds pendulum is defined as one with T=2 s.'],['The dimensional formula of the length of a simple pendulum is','[M]','[L]','[T]','[LT⁻¹]',1,'Length has the dimensional formula [L].']];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
