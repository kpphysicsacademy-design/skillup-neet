<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SkillUp Physics | Slope Calculation</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.opt.selected{border-color:#5146a5;background:#f4f1ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.opt:disabled{cursor:default}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>📐 Slope Calculation</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="action">CHECK</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['The slope of a straight-line graph of y versus x is:',['Δx/Δy','Δy/Δx','x+y','xy'],1,'Slope is the change in y divided by the change in x: Δy/Δx.'],['For two points (x₁,y₁) and (x₂,y₂), the slope m is:',['(x₂−x₁)/(y₂−y₁)','(y₂−y₁)/(x₂−x₁)','x₁y₁+x₂y₂','y₁+y₂'],1,'The slope formula is m=(y₂−y₁)/(x₂−x₁), provided x₂≠x₁.'],['What is the slope of the line through (1,2) and (3,6)?',['1','2','3','4'],1,'m=(6−2)/(3−1)=4/2=2.'],['A graph passes through (2,5) and (6,13). Its slope is:',['1','2','3','4'],1,'m=(13−5)/(6−2)=8/4=2.'],['A horizontal straight-line graph has slope:',['0','1','−1','Infinite'],0,'There is no change in y, so Δy=0 and the slope is zero.'],['A vertical straight-line graph has:',['Zero slope','Undefined slope','Slope 1','Slope −1'],1,'For a vertical line, Δx=0, so Δy/Δx is undefined.'],['If y=3x+5, the slope is:',['3','5','8','−3'],0,'Comparing y=mx+c with y=3x+5 gives m=3.'],['If y=−2x+7, the slope is:',['7','2','−2','−7'],2,'The coefficient of x is the slope, so m=−2.'],['If a velocity-time graph has slope 4 m/s², the corresponding acceleration is:',['0.25 m/s²','2 m/s²','4 m/s²','8 m/s²'],2,'The slope of a velocity-time graph is acceleration, so a=4 m/s².'],['If a displacement-time graph has a constant slope, the object has:',['Constant velocity','Constant acceleration only','Zero displacement','Infinite speed'],0,'The slope of a displacement-time graph represents velocity; a constant slope means constant velocity.'],['A steeper straight line on the same graph scale represents:',['A smaller magnitude of slope','A larger magnitude of slope','Always zero slope','No slope'],1,'Steeper lines have a greater magnitude of Δy/Δx on the same scales.'],['If the slope of a graph is 5 and the x-axis changes by 2 units, the corresponding change in y is:',['2.5 units','5 units','7 units','10 units'],3,'Using Δy=mΔx, Δy=5×2=10 units.'],['A line has slope 0.5. If x increases by 8 units, y changes by:',['2 units','4 units','8 units','16 units'],1,'Δy=mΔx=0.5×8=4 units.'],['The slope of a graph with points (4,10) and (4,18) is:',['0','1','2','Undefined'],3,'Both points have the same x-coordinate, so Δx=0 and the slope is undefined.'],['Why is slope useful in physics graphs?',['It can represent a physical rate or relationship between variables','It removes all experimental errors','It makes units unnecessary','It always equals the intercept'],0,'Slope often represents a meaningful physical quantity, such as velocity, acceleration, or resistance, depending on the graph.']];let i=0,score=0,answered=false,selected=-1;const $=x=>document.getElementById(x);function render(){answered=false;selected=-1;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q[1].map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('action').classList.remove('hide');$('action').textContent='CHECK'});$('xp').textContent='';$('action').classList.add('hide');$('action').disabled=false;}$('action').onclick=()=>{if(selected<0)return;if(!answered){answered=true;const q=qs[i],ok=selected===q[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===selected&&!ok)b.classList.add('wrong')});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[3];if(ok)score++;$('score').textContent=`XP ${score}`;$('fill').style.width=`${(i+1)/15*100}%`;$('action').textContent=i===14?'FINISH':'Next Question →';return;}if(i<14){i++;render()}else{$('quiz').innerHTML='';$('action').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}};render();</script></body></html>
