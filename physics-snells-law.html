<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Snell's Law</title><meta name="description" content="SkillUp Physics Snell's Law interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">📐</span><h1>Snell's Law</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["Snell's law relates the angles of incidence and refraction to the:",["Refractive indices of the two media","Masses of the media","Temperatures only","Brightness of the source only"],0,"Snell's law connects the angles with the refractive indices of the two media."],["For refraction from medium 1 to medium 2, Snell's law is:",["n₁ sin i = n₂ sin r","n₁ cos i = n₂ cos r","n₁+n₂=i+r","n₁r=n₂i"],0,"The standard form is n₁ sin i = n₂ sin r."],["In Snell's law, i represents the:",["Angle of incidence","Angle of reflection","Angle of deviation only","Critical angle only"],0,"i is the angle between the incident ray and the normal."],["In Snell's law, r represents the:",["Angle of refraction","Angle of incidence","Angle between mirror and ray","Angle of polarization"],0,"r is the angle between the refracted ray and the normal."],["The angles in Snell's law are measured from the:",["Normal to the interface","Surface of the interface","Principal axis","Incident surface edge"],0,"Both incidence and refraction angles are measured with respect to the normal."],["Light travels from air into glass. If the ray is oblique, it generally bends:",["Towards the normal","Away from the normal","Exactly along the surface","Back toward the source"],0,"Glass normally has a higher refractive index than air, so the ray bends towards the normal."],["If n₁=1.0, n₂=1.5 and i=30°, then sin r equals:",["1/3","1/2","3/2","1"],0,"Using n₁ sin i=n₂ sin r gives sin r=(1×0.5)/1.5=1/3."],["If light enters a medium with a larger refractive index, its speed generally:",["Decreases","Increases","Becomes infinite","Does not exist"],0,"Since n=c/v, a larger refractive index corresponds to a lower speed of light in the medium."],["When light passes between transparent media, its frequency generally:",["Remains unchanged","Always doubles","Becomes zero","Always halves"],0,"The source fixes the frequency; speed and wavelength change at the boundary."],["If light passes from glass into air, the refracted ray generally bends:",["Away from the normal","Towards the normal","Along the normal for every incidence","Back into glass for every angle"],0,"The ray enters a lower-index medium and generally bends away from the normal."],["The absolute refractive index n of a medium is given by:",["n=c/v","n=v/c","n=cv","n=c+v"],0,"Absolute refractive index is the ratio of the speed of light in vacuum to its speed in the medium."],["If n₂ is greater than n₁, then for a non-normal ray going from medium 1 to medium 2, the refracted angle is generally:",["Smaller than the incident angle","Larger than the incident angle","Always 90°","Always zero"],0,"From Snell's law, entering the higher-index medium generally makes the ray bend towards the normal."],["For normal incidence, the angle of incidence is:",["0°","30°","45°","90°"],0,"A normally incident ray travels along the normal, so i=0°."],["A ray goes from a medium of refractive index 1.5 into air. If the incident angle increases beyond the critical angle, the phenomenon is:",["Total internal reflection","Ordinary refraction only","Dispersion only","Diffraction"],0,"When light travels from a denser to a rarer medium and the incidence angle exceeds the critical angle, total internal reflection occurs."],["Which statement correctly describes Snell's law?",["It quantitatively describes refraction at an interface between two media","It states that angle of incidence always equals angle of refraction","It applies only to plane mirrors","It says light cannot change speed"],0,"Snell's law gives the quantitative relation between incidence and refraction angles and the refractive indices of the media."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
