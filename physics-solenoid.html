<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Solenoid</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>⚡ Solenoid</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['The magnetic field inside a long ideal solenoid is','μ₀nI','μ₀I/n','μ₀n/I','nI/μ₀',0,'For a long solenoid in vacuum, B=μ₀nI, where n is turns per unit length.'],['The number of turns per unit length of a solenoid is','N/L','NL','L/N','N+L',0,'The turn density is n=N/L.'],['The magnetic field inside a long solenoid is directly proportional to','1/I','current I','radius only','1/n',1,'For a fixed turn density, B=μ₀nI, so B is proportional to I.'],['If the number of turns per unit length is doubled, the field inside a long solenoid becomes','half','double','four times','unchanged',1,'Because B=μ₀nI, doubling n doubles B.'],['A solenoid has 1000 turns over 0.5 m. Its turn density is','500 m⁻¹','1000 m⁻¹','2000 m⁻¹','5000 m⁻¹',2,'n=N/L=1000/0.5=2000 m⁻¹.'],['For n=2000 m⁻¹ and I=2 A, the field inside an air-core long solenoid is approximately','2.5×10⁻³ T','5.0×10⁻³ T','1.0×10⁻² T','2.0×10⁻² T',1,'B=μ₀nI=4π×10⁻⁷×2000×2≈5.03×10⁻³ T.'],['The magnetic field inside a long solenoid is approximately','uniform and parallel to its axis','zero everywhere','radial and non-uniform','always circular',0,'Away from the ends, field lines inside a long solenoid are nearly parallel and uniformly spaced.'],['The magnetic field outside an ideal infinitely long solenoid is','μ₀nI','zero','twice the inside field','infinite',1,'For an ideal infinitely long solenoid, the external magnetic field is zero.'],['The direction of magnetic field inside a solenoid can be found using','right-hand grip rule','Ohm’s law','Fleming’s left-hand rule only','Lenz’s law only',0,'Curl the fingers in the current direction; the thumb gives the solenoid field direction.'],['Inserting a ferromagnetic core into a solenoid generally','decreases B','increases B','makes B zero','has no effect in all cases',1,'A magnetic core increases permeability and generally increases the field for a given current.'],['With a magnetic material of relative permeability μᵣ filling a long solenoid, the field is','μ₀nI/μᵣ','μᵣμ₀nI','μ₀nI+μᵣ','μᵣ/(μ₀nI)',1,'For a linear magnetic material, B=μμ₀? More precisely B=μnI=μᵣμ₀nI.'],['The field of a long solenoid depends on its length and total turns mainly through','N/L','N+L','NL','L/N only',0,'For a long solenoid B=μ₀(N/L)I, so turn density N/L is the relevant quantity.'],['A solenoid carries current clockwise as viewed from one end. That end behaves as','north pole','south pole','both poles','no pole',1,'By the right-hand grip rule, clockwise current as viewed from an end corresponds to a south pole at that end.'],['If the current through a solenoid is reversed, its magnetic field direction','reverses','doubles','becomes zero permanently','does not change',0,'Reversing current reverses the direction of the magnetic field.'],['Ampere’s circuital law for a long solenoid gives the field inside as','B=μ₀nI','B=μ₀I/n²','B=nI/μ₀','B=2πrμ₀nI',0,'Using ∮B·dl=μ₀I_enclosed gives B=μ₀nI for an ideal long solenoid in vacuum.']];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent=''}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});if(ok){score++;$('xp').textContent='✨ Correct! +1 XP'}else $('xp').textContent='❌ Incorrect. '+q[6];$('score').textContent=`XP ${score}`;$('next').classList.remove('hide')}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('next').onclick=next;render();</script></body></html>
