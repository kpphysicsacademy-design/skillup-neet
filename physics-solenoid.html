<script>
const questions=[
["A solenoid is a coil of","Insulated wire","Plastic strips","A single battery","Iron plates",0,"A solenoid is made from many turns of insulated wire."],
["A current-carrying solenoid behaves like a","Bar magnet","Point charge","Resistor","Glass rod",0,"Its magnetic field pattern resembles that of a bar magnet."],
["The magnetic field inside a long solenoid is nearly","Uniform","Zero","Circular","Random",0,"The field is strong and almost uniform inside a long solenoid."],
["The direction of the solenoid field is found using","Right-hand grip rule","Ohm's law","Lenz's law","Coulomb's law",0,"Curl the fingers in the current direction; the thumb gives the field direction."],
["Anticlockwise current viewed at an end makes that end","North pole","South pole","Neutral","Neither pole",0,"By the right-hand grip rule, anticlockwise current gives a north pole."],
["Clockwise current viewed at an end makes that end","South pole","North pole","Neutral","Both poles",0,"Clockwise current gives a south pole at the viewed end."],
["The field inside a long air-core solenoid is","μ₀nI","μ₀I/n","nI/μ₀","μ₀n/I",0,"For a long solenoid, B=μ₀nI."],
["Turns per unit length is","N/L","N×L","L/N","N+L",0,"Turn density n is total turns divided by length."],
["The SI unit of magnetic field is","Tesla","Ampere","Weber per metre squared only","Ohm",0,"Magnetic field B is measured in tesla."],
["The SI unit of turn density n is","m⁻¹","m","A","T",0,"It is the number of turns per metre."],
["If current doubles, the field becomes","Double","Half","Four times","Unchanged",0,"B is directly proportional to current."],
["If turn density doubles, the field becomes","Double","Half","Unchanged","Four times",0,"B is directly proportional to n."],
["If both current and turn density double, field becomes","Four times","Two times","Half","Unchanged",0,"Doubling both factors multiplies B by four."],
["The value of μ₀ is","4π×10⁻⁷ T m A⁻¹","4π×10⁷ T m A⁻¹","10⁷ T m A⁻¹","Zero",0,"The permeability of free space is 4π×10⁻⁷ T m A⁻¹."],
["For N=1000 turns and L=0.5 m, n is","2000 m⁻¹","500 m⁻¹","1000 m⁻¹","5000 m⁻¹",0,"n=N/L=1000/0.5=2000 m⁻¹."],
["For n=1000 m⁻¹ and I=1 A, B is about","1.26 mT","12.6 mT","0.126 mT","126 mT",0,"B=μ₀nI≈1.26×10⁻³ T."],
["For n=2000 m⁻¹ and I=2 A, B is about","5.03 mT","2.51 mT","10.0 mT","20.0 mT",0,"B=4π×10⁻⁷×2000×2≈5.03 mT."],
["A ferromagnetic core generally","Increases the field","Makes field zero","Reverses current","Removes the field",0,"A high-permeability core generally strengthens the field."],
["With a linear magnetic core, B is","μᵣμ₀nI","μ₀nI/μᵣ","μ₀I/n","μᵣ/nI",0,"Relative permeability multiplies the vacuum result."],
["Reversing current in a solenoid","Reverses the field","Doubles the field","Does not change direction","Makes current zero",0,"The magnetic field direction reverses with the current."],
["Outside an ideal infinitely long solenoid, field is","Zero","Infinite","Equal to inside","Always stronger",0,"The ideal long-solenoid approximation has zero external field."],
["A real finite solenoid has","Some fringe field","No magnetic field","Infinite field","Only electric field",0,"The external field is small, but not exactly zero for a finite coil."],

["For n=2500 m⁻¹ and I=4 A, B is about","12.6 mT","1.26 mT","25.1 mT","0.126 mT",0,"B≈4π×10⁻⁷×2500×4=12.6 mT."],
["If N and L both double, n","Remains same","Doubles","Halves","Becomes zero",0,"N/L is unchanged when both are doubled."],

];
let index=0,score=0,locked=false;
const $=id=>document.getElementById(id);
function typesetMath(el){if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetClear([el]);MathJax.typesetPromise([el]).catch(()=>{})}}
function calc(){let I=+$("current").value,n=+$("turns").value;$("iLabel").textContent=I+" A";$("nLabel").textContent=n+" m⁻¹";$("field").innerHTML="\\(B="+(0.0012566370614*n*I).toFixed(2)+"\\;\\mathrm{mT}\\)";$("fieldHint").textContent="At "+I+" A and "+n+" turns per metre, the field is about "+(0.0012566370614*n*I).toFixed(2)+" mT.";typesetMath($("field"))}
$("current").oninput=calc;$("turns").oninput=calc;calc();
$("startQuiz").onclick=()=>{$("experiment").classList.add("hide");$("quiz").style.display="block";render();window.scrollTo(0,0)};
function render(){locked=false;let q=questions[index];$("number").textContent="Question "+(index+1)+"/"+questions.length;$("points").textContent="⭐ "+score;$("quizBar").style.width=(index/questions.length*100)+"%";$("question").innerHTML='<div class="qtext">'+q[0]+'</div>'+q.slice(1,5).map((v,n)=>'<button class="option" data-choice="'+n+'">'+String.fromCharCode(65+n)+'. '+v+'</button>').join("");$("feedback").textContent="";$("next").classList.add("hide");document.querySelectorAll(".option").forEach(b=>b.onclick=()=>choose(+b.dataset.choice));typesetMath($("question"))}
function choose(n){if(locked)return;locked=true;let q=questions[index],correct=n===q[5];document.querySelectorAll(".option").forEach((b,k)=>{b.disabled=true;if(k===q[5])b.classList.add("good");if(k===n&&!correct)b.classList.add("bad")});if(correct){score++;$("feedback").textContent="Correct! +1 point. "+q[6]}else $("feedback").textContent="Not quite. "+q[6];$("points").textContent="⭐ "+score;$("next").classList.remove("hide");$("next").textContent=index===questions.length-1?"See result →":"Next question →"}
$("next").onclick=()=>{if(index<questions.length-1){index++;render()}else{$("quizBar").style.width="100%";$("number").textContent="Quiz completed";$("question").innerHTML="";$("feedback").textContent="";$("next").classList.add("hide");$("result").classList.remove("hide");$("result").innerHTML="<h2>Well done! 🎉</h2><p>Your score</p><h1>"+score+" / "+questions.length+"</h1><button class='btn primary' onclick='location.reload()'>Try again ↻</button>"}};
