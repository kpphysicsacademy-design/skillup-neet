<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Sound Waves</title><style>body{font-family:Arial,sans-serif;background:#f3f7ff;margin:0;color:#1e293b}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(30,41,59,.1);border:1px solid #e2e8f0}h1{text-align:center;color:#334155}.meta{display:flex;justify-content:space-between;font-weight:700;color:#475569}.bar{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#22c55e;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;color:#172033}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe4f0;border-radius:14px;background:#fff;color:#1e293b;font-size:16px;cursor:pointer;transition:.2s}.opt:hover{background:#eef5ff;border-color:#93c5fd;transform:translateY(-1px)}.correct{border-color:#16a34a!important;background:#ecfdf3!important;color:#166534!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important;color:#991b1b!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#4f46e5;color:#fff}.back{background:#334155;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#d97706;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🔊 Sound Waves</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>
const qs=[
['Sound waves in air are generally','transverse electromagnetic waves','longitudinal mechanical waves','electromagnetic waves','matter particles',1,'Sound in air is a mechanical longitudinal wave and requires a material medium.'],
['Sound cannot propagate through','air','water','steel','vacuum',3,'A mechanical sound wave needs a material medium, so it cannot travel through vacuum.'],
['In a longitudinal sound wave, particles of the medium vibrate','perpendicular to propagation','parallel to propagation','in circular paths','without vibration',1,'Particles oscillate parallel to the direction in which the sound wave travels.'],
['A compression in a sound wave is a region of','low pressure and low density','high pressure and high density','zero pressure','constant displacement only',1,'Compressions correspond to higher pressure and density than the surrounding medium.'],
['A rarefaction in a sound wave is a region of','high pressure and high density','low pressure and low density','maximum temperature only','zero particle speed',1,'Rarefactions are regions of relatively low pressure and density.'],
['The speed of sound in a gas mainly depends on','only amplitude','the properties of the medium and temperature','only frequency','only wavelength',1,'For a given gas, sound speed depends on medium properties and temperature; it is not set by amplitude or frequency alone.'],
['For a wave, the relation among speed v, frequency f and wavelength λ is','v=f/λ','v=fλ','v=λ/f','v=f+λ',1,'The basic wave relation is v=fλ.'],
['If sound travels at 340 m/s with frequency 170 Hz, its wavelength is','0.5 m','2 m','170 m','510 m',1,'λ=v/f=340/170=2 m.'],
['When sound passes from air into water, its frequency generally','changes to zero','remains unchanged','doubles automatically','becomes equal to its speed',1,'The source fixes frequency, so frequency remains unchanged at a boundary; speed and wavelength can change.'],
['When a sound wave enters a different medium, the quantity that usually changes is','frequency','wave speed','source frequency','time itself',1,'Wave speed depends on the medium. With frequency fixed, wavelength changes accordingly.'],
['The intensity of a sound wave is related to','energy transferred per unit area per unit time','only its frequency','only its wavelength','only its period',0,'Intensity is power transmitted per unit area, i.e. energy transferred per unit area per unit time.'],
['The pitch of a sound is primarily determined by its','amplitude','frequency','intensity only','speed in the medium',1,'Higher frequency corresponds to higher pitch.'],
['The loudness of a sound is most closely associated with its','amplitude/intensity','frequency only','wavelength only','wave speed only',0,'Greater wave amplitude generally means greater intensity and perceived loudness, subject to hearing conditions.'],
['An audible sound for a typical healthy human has frequency approximately in the range','20 Hz to 20 kHz','0 to 20 Hz','20 kHz to 2 MHz','200 Hz to 200 kHz',0,'The commonly used approximate human audible range is 20 Hz to 20 kHz.'],
['An echo is produced mainly due to','refraction of sound','reflection of sound','absorption of sound','polarization of sound',1,'An echo results when reflected sound reaches the listener after a sufficient time delay.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent=''}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide')}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('next').onclick=next;render();</script></body></html>
