<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}

.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Mobile header refinement: keep branding, XP and streak on one balanced row */
.nav{display:flex;align-items:center;gap:10px;min-height:72px;padding:10px 14px}
.back{flex:0 0 42px;width:42px;height:42px}

<main>
<section class="hero"><h1>〰️ Sound Waves</h1><p class="muted">Practice nodes, antinodes, fixed-end strings, harmonics, frequencies, and standing-wave equations with 30 questions.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>

<script>
(function(){
'use strict';
const questions = [{"q":"Sound waves in air are generally…","o":["Transverse electromagnetic waves","Longitudinal mechanical waves","Matter waves","Standing waves only"],"a":1,"e":"Sound in air propagates as a longitudinal mechanical wave through compressions and rarefactions."},{"q":"Sound requires which of the following to propagate?","o":["A material medium","A vacuum","Only a magnetic field","No particles"],"a":0,"e":"Sound is mechanical and needs a medium; it cannot propagate through a perfect vacuum."},{"q":"In a longitudinal sound wave, air particles oscillate…","o":["Perpendicular to propagation","Parallel to propagation","In circular paths only","Not at all"],"a":1,"e":"Particle oscillations are parallel to the direction of wave propagation."},{"q":"A compression in a sound wave is a region of…","o":["Lower pressure and density","Higher pressure and density","Zero pressure","No particles"],"a":1,"e":"Compressions are regions where particles are closer together, producing higher pressure and density."},{"q":"A rarefaction is a region of…","o":["Higher pressure","Higher density","Lower pressure and density","Infinite density"],"a":2,"e":"In a rarefaction, particles are farther apart and pressure and density are lower."},{"q":"The SI unit of frequency is…","o":["Metre","Hertz","Decibel","Pascal"],"a":1,"e":"Frequency is measured in hertz (Hz), equivalent to cycles per second."},{"q":"The relation between sound speed v, frequency f and wavelength λ is…","o":["\\(v=f\\lambda\\)","\\(v=f/\\lambda\\)","\\(v=\\lambda/f\\)","\\(v=f+\\lambda\\)"],"a":0,"e":"For any periodic wave, \\(v=f\\lambda\\)."},{"q":"A sound wave has frequency 500 Hz and wavelength 0.68 m. Its speed is…","o":["170 m/s","340 m/s","500 m/s","680 m/s"],"a":1,"e":"\\(v=f\\lambda=500(0.68)=340\\,\\text{m/s}\\)."},{"q":"Sound generally travels fastest through…","o":["Gases","Liquids","Solids","Vacuum"],"a":2,"e":"Sound speed is generally highest in solids, lower in liquids, and lower still in gases; it cannot travel in vacuum."},{"q":"At ordinary temperatures, sound speed in air is approximately…","o":["34 m/s","150 m/s","343 m/s","3000 m/s"],"a":2,"e":"A typical approximate value near room temperature is 343 m/s; the exact value depends on temperature."},{"q":"If frequency doubles while sound speed stays constant, wavelength…","o":["Doubles","Halves","Quadruples","Stays the same"],"a":1,"e":"From \\(\\lambda=v/f\\), doubling frequency halves wavelength when speed is constant."},{"q":"The pitch of a sound is primarily related to its…","o":["Frequency","Amplitude","Intensity only","Speed only"],"a":0,"e":"Higher frequency is perceived as higher pitch."},{"q":"The loudness of a sound is most closely associated with its…","o":["Frequency only","Amplitude and intensity","Wavelength only","Propagation direction"],"a":1,"e":"Greater sound intensity is generally perceived as greater loudness, though perception also depends on frequency and hearing."},{"q":"Sound intensity is power transmitted per unit…","o":["Volume","Area","Time","Wavelength"],"a":1,"e":"Intensity is power crossing a unit area perpendicular to the direction of propagation."},{"q":"The SI unit of sound intensity is…","o":["\\(\\text{W/m}^2\\)","\\(\\text{W/m}\\)","\\(\\text{J/s}^2\\)","\\(\\text{Pa/m}\\)"],"a":0,"e":"Intensity is power per area, so its SI unit is watt per square metre."},{"q":"The decibel scale is commonly used to express sound…","o":["Wavelength","Level","Speed","Frequency"],"a":1,"e":"Sound level is commonly expressed in decibels (dB), a logarithmic scale."},{"q":"The approximate audible frequency range for a healthy young human is…","o":["2–200 Hz","20 Hz–20 kHz","200 Hz–200 kHz","20 kHz–2 MHz"],"a":1,"e":"The conventional approximate range is 20 Hz to 20,000 Hz, though it varies with age and individual hearing."},{"q":"Sound below about 20 Hz is called…","o":["Ultrasound","Infrasound","Supersonic sound","Echo"],"a":1,"e":"Infrasound refers to sound frequencies below the lower audible limit of about 20 Hz."},{"q":"Sound above about 20 kHz is called…","o":["Infrasound","Ultrasound","Audible sound only","Noise floor"],"a":1,"e":"Ultrasound has frequency above the conventional upper human hearing limit of about 20 kHz."},{"q":"A sound wave of frequency 1 kHz has a period of…","o":["1 s","0.1 s","0.01 s","0.001 s"],"a":3,"e":"\\(T=1/f=1/1000=0.001\\,\\text{s}\\)."},{"q":"A sound has period 2 ms. Its frequency is…","o":["50 Hz","200 Hz","500 Hz","2000 Hz"],"a":2,"e":"\\(f=1/T=1/(0.002)=500\\,\\text{Hz}\\)."},{"q":"When sound passes from air into water, its frequency (with the same source) generally…","o":["Changes to zero","Remains the same","Always doubles","Always halves"],"a":1,"e":"The source determines frequency; speed and wavelength change across the boundary."},{"q":"When sound enters a medium where it travels faster, its wavelength at unchanged frequency…","o":["Decreases","Increases","Becomes zero","Stays unchanged"],"a":1,"e":"Since \\(\\lambda=v/f\\), a higher speed at fixed frequency means a longer wavelength."},{"q":"An echo is caused by…","o":["Reflection of sound","Polarization","Only refraction","Destructive interference only"],"a":0,"e":"An echo occurs when reflected sound returns to the listener after a sufficient delay."},{"q":"For a distinct echo, the reflected sound should arrive…","o":["At exactly the same instant","After a sufficient time delay","Before the original sound","Only in a vacuum"],"a":1,"e":"A delay of roughly 0.1 s or more is commonly needed for a distinct echo."},{"q":"The speed of sound in a gas generally increases when its absolute temperature…","o":["Increases","Falls to zero","Has no effect","Becomes negative"],"a":0,"e":"For an ideal gas, sound speed is proportional to the square root of absolute temperature."},{"q":"A sound wave travels at 330 m/s and has wavelength 1.1 m. Its frequency is…","o":["30 Hz","300 Hz","363 Hz","3300 Hz"],"a":1,"e":"\\(f=v/\\lambda=330/1.1=300\\,\\text{Hz}\\)."},{"q":"Which property mainly determines whether a sound is perceived as high-pitched or low-pitched?","o":["Frequency","Amplitude","Intensity only","Distance travelled"],"a":0,"e":"Pitch depends mainly on frequency: higher frequency corresponds to higher pitch."},{"q":"In a sound wave, energy is transported by…","o":["Bulk flow of air from source to listener","Oscillations and pressure disturbances through the medium","Air particles travelling all the way from source to listener","Vacuum fluctuations only"],"a":1,"e":"Particles oscillate around equilibrium positions while the disturbance and energy propagate through the medium."},{"q":"Why can sound not travel through a vacuum?","o":["It has too high a frequency","There are no particles to transmit mechanical vibrations","Its wavelength is infinite in every case","Vacuum absorbs all sound instantly"],"a":1,"e":"Sound needs interacting particles to transmit compressions and rarefactions; a vacuum has no material medium."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function typesetMath(){if(window.MathJax?.typesetPromise){window.MathJax.typesetPromise([$('question'),$('options'),$('feedback')].filter(Boolean)).catch(()=>{});}}
window.addEventListener('load',typesetMath);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
 typesetMath();
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Sound Waves Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
