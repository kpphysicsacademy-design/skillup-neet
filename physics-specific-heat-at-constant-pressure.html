const questions=[{"q":"What does specific heat capacity at constant pressure, Cₚ, describe?","o":["Heat required per unit mass per kelvin at fixed pressure","Work done per unit volume","Heat capacity at fixed volume","Energy transferred per second"],"a":0,"e":"Cₚ is heat required per unit mass for a one-kelvin rise while pressure is constant."},{"q":"Which symbol commonly represents molar heat capacity at constant pressure?","o":["Cᵥ","Cₚ","γ","Rᵥ"],"a":1,"e":"Cₚ denotes heat capacity at constant pressure; the molar value is per mole per kelvin."},{"q":"What is the SI unit of molar heat capacity?","o":["J mol⁻¹ K⁻¹","J kg⁻¹","Pa K","W/m"],"a":0,"e":"Molar heat capacity is measured in joules per mole per kelvin."},{"q":"For a fixed amount of ideal gas heated at constant pressure, the volume generally…","o":["Increases","Decreases","Remains fixed","Becomes zero"],"a":0,"e":"Heating raises temperature, and the gas expands to maintain constant pressure."},{"q":"For an ideal gas, which molar heat capacity is greater?","o":["Cᵥ","Cₚ","They are always equal","Both are zero"],"a":1,"e":"At constant pressure, some heat also supplies expansion work, so Cₚ > Cᵥ."},{"q":"Mayer's relation for molar heat capacities of an ideal gas is…","o":["Cₚ − Cᵥ = R","Cₚ + Cᵥ = R","Cᵥ − Cₚ = R","CₚCᵥ = R"],"a":0,"e":"For an ideal gas, Cₚ − Cᵥ = R."},{"q":"For one mole of a monatomic ideal gas, Cₚ equals…","o":["R/2","3R/2","5R/2","7R/2"],"a":2,"e":"For a monatomic ideal gas, Cᵥ = 3R/2 and Cₚ = Cᵥ + R = 5R/2."},{"q":"For one mole of a diatomic ideal gas at ordinary temperatures, Cₚ is approximately…","o":["3R/2","5R/2","7R/2","R"],"a":2,"e":"For a diatomic gas with translation and rotation active, Cᵥ ≈ 5R/2 and Cₚ ≈ 7R/2."},{"q":"Which equation estimates heat supplied when molar Cₚ is constant?","o":["Qₚ = nCₚΔT","Qₚ = Cₚ/nΔT","Qₚ = PΔV only","Qₚ = nR/ΔT"],"a":0,"e":"At constant pressure with constant molar heat capacity, Qₚ = nCₚΔT."},{"q":"Two moles of gas with Cₚ = 30 J mol⁻¹ K⁻¹ warm by 4 K at constant pressure. Heat supplied is…","o":["60 J","120 J","240 J","480 J"],"a":2,"e":"Qₚ = nCₚΔT = 2 × 30 × 4 = 240 J."},{"q":"For an ideal gas at constant pressure, which relation holds for a fixed amount of gas?","o":["V/T = constant","P/T = constant","PV = constant","V × T = constant"],"a":0,"e":"Charles's law gives V/T = constant at constant pressure."},{"q":"If absolute temperature doubles at constant pressure, the ideal gas volume…","o":["Halves","Doubles","Stays constant","Quadruples"],"a":1,"e":"At constant pressure, V is proportional to absolute temperature."},{"q":"Why does Cₚ exceed Cᵥ for an ideal gas?","o":["Some heat at constant pressure does expansion work","Constant volume requires more expansion work","Cᵥ includes work only","Cₚ is dimensionless"],"a":0,"e":"At constant pressure, heat increases internal energy and supports expansion work."},{"q":"For an ideal gas, Cₚ/Cᵥ is represented by…","o":["γ","R","n","P"],"a":0,"e":"The heat-capacity ratio γ is defined as Cₚ/Cᵥ."},{"q":"For a monatomic ideal gas, γ equals…","o":["4/3","5/3","7/5","1"],"a":1,"e":"γ = (5R/2)/(3R/2) = 5/3."},{"q":"For a diatomic ideal gas at ordinary temperatures, γ is approximately…","o":["5/3","7/5","3/2","2"],"a":1,"e":"Using Cₚ ≈ 7R/2 and Cᵥ ≈ 5R/2 gives γ ≈ 7/5."},{"q":"During constant-pressure heating, what can happen to the gas's boundary work?","o":["The gas can do positive work as it expands","It must be zero","It must be negative","It always equals internal energy"],"a":0,"e":"If the gas expands at positive pressure, W = PΔV is positive."},{"q":"For a constant-pressure process, boundary work is…","o":["PΔV","VΔP","Zero always","Q − T"],"a":0,"e":"At constant pressure, work done by the gas is P times the volume change."},{"q":"A gas expands by 0.01 m³ at 100 kPa under constant pressure. Work done is…","o":["10 J","100 J","1,000 J","10,000 J"],"a":2,"e":"W = PΔV = 100,000 Pa × 0.01 m³ = 1,000 J."},{"q":"For a closed system at constant pressure, heat supplied may increase…","o":["Internal energy and expansion work","Pressure only","Volume without energy transfer","Neither energy nor work"],"a":0,"e":"Heat can increase internal energy and supply work as the gas expands."},{"q":"Which condition is required to define Cₚ?","o":["Pressure remains constant","Volume remains constant","Temperature remains constant","Heat transfer is zero"],"a":0,"e":"Cₚ is defined for heating under constant-pressure conditions."},{"q":"Which process is most directly associated with Cₚ?","o":["Heating gas beneath a freely moving piston under fixed load","Heating gas in a rigid vessel","Isothermal compression only","Free expansion into vacuum only"],"a":0,"e":"A weighted movable piston can allow heating at approximately constant pressure."},{"q":"If 1 mol of ideal gas has Cₚ = 29 J mol⁻¹ K⁻¹ and warms by 10 K, heat supplied is…","o":["29 J","290 J","2,900 J","0.29 J"],"a":1,"e":"Qₚ = nCₚΔT = 1 × 29 × 10 = 290 J."},{"q":"For a given ideal gas, if the amount of gas doubles at the same ΔT and constant pressure, heat required…","o":["Halves","Doubles","Stays constant","Becomes zero"],"a":1,"e":"Qₚ = nCₚΔT, so heat is proportional to the amount of gas."},{"q":"Which property remains fixed in an isobaric process?","o":["Pressure","Volume","Temperature","Internal energy"],"a":0,"e":"Isobaric means constant pressure."},{"q":"For a fixed amount of ideal gas, internal-energy change is determined by…","o":["Temperature change","Pressure change alone","Volume change alone","The shape of the piston"],"a":0,"e":"Ideal-gas internal energy depends on temperature, regardless of the path."},{"q":"If an ideal gas is heated at constant pressure, its temperature increases and volume expands. Which law describes V ∝ T?","o":["Boyle's law","Charles's law","Dalton's law","Newton's law"],"a":1,"e":"Charles's law relates volume and absolute temperature at constant pressure."},{"q":"If Cᵥ = 20 J mol⁻¹ K⁻¹ for an ideal gas, Cₚ equals…","o":["8.3 J mol⁻¹ K⁻¹","20 J mol⁻¹ K⁻¹","28.3 J mol⁻¹ K⁻¹","40 J mol⁻¹ K⁻¹"],"a":2,"e":"Mayer's relation gives Cₚ = Cᵥ + R ≈ 20 + 8.31 = 28.3 J mol⁻¹ K⁻¹."},{"q":"Which statement about Cₚ and Cᵥ is correct for an ideal gas?","o":["Both have units J mol⁻¹ K⁻¹ when molar","Cₚ is always smaller","Cᵥ depends only on pressure","They have no units"],"a":0,"e":"Molar Cₚ and Cᵥ are both measured in J mol⁻¹ K⁻¹."},{"q":"What is the main distinction between Cₚ and Cᵥ?","o":["The constraint is constant pressure versus constant volume","One measures mass and one measures temperature","Cₚ is unitless","They always have identical values"],"a":0,"e":"They are heat capacities measured under different thermodynamic constraints."}];

function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{

 const f=$('feedback');

 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}

 $('finishSlot').appendChild(card);

 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
