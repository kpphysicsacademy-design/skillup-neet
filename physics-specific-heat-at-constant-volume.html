<section class="hero"><h1>🌡️ Specific Heat at Constant Volume</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>

</main>
<script>
(function(){
'use strict';
const questions=[{"q":"What does specific heat capacity at constant volume, Cᵥ, describe?","o":["Heat needed per unit mass at fixed volume","Heat needed per mole at fixed pressure only","Work done at constant pressure","Heat transferred per second"],"a":0,"e":"Specific heat capacity at constant volume is heat per unit mass per kelvin when volume is fixed."},{"q":"Which symbol commonly denotes molar heat capacity at constant volume?","o":["Cᵥ","Cₚ","γ","Rᵥ"],"a":0,"e":"Cᵥ denotes heat capacity at constant volume; a molar value is often written Cᵥ,m."},{"q":"At constant volume, what is the boundary work done by a gas?","o":["PΔV","Zero","Q","nRT"],"a":1,"e":"Since volume does not change, boundary work W = ∫P dV = 0."},{"q":"For a closed system at constant volume with only pressure-volume work, the first law gives…","o":["Qᵥ = ΔU","Qᵥ = −ΔU","Qᵥ = W and W > 0","ΔU = 0 always"],"a":0,"e":"With W = 0, heat supplied equals the internal-energy change."},{"q":"For an ideal gas, molar Cᵥ is related to internal energy by…","o":["Cᵥ = (1/n)(∂U/∂T)ᵥ","Cᵥ = P/V","Cᵥ = nRT","Cᵥ = Cₚ + R"],"a":0,"e":"Molar Cᵥ measures internal-energy change per mole per kelvin at fixed volume."},{"q":"For an ideal gas, internal energy depends primarily on…","o":["Temperature","Pressure alone","Volume alone","Container shape"],"a":0,"e":"Ideal-gas internal energy is a function of temperature."},{"q":"For one mole of a monatomic ideal gas, Cᵥ equals…","o":["R/2","R","3R/2","5R/2"],"a":2,"e":"A monatomic ideal gas has three translational degrees of freedom, giving Cᵥ = 3R/2."},{"q":"For one mole of a diatomic ideal gas at ordinary temperatures, Cᵥ is approximately…","o":["R/2","3R/2","5R/2","7R/2"],"a":2,"e":"With translation and rotation active, a diatomic ideal gas has Cᵥ ≈ 5R/2."},{"q":"What is the SI unit of molar heat capacity?","o":["J mol⁻¹ K⁻¹","J kg⁻¹","J/K²","Pa m³ kg⁻¹"],"a":0,"e":"Molar heat capacity is measured in joules per mole per kelvin."},{"q":"A gas absorbs 300 J at constant volume. Assuming no other work, its internal energy changes by…","o":["+300 J","−300 J","0 J","+600 J"],"a":0,"e":"At constant volume W = 0, so ΔU = Q = +300 J."},{"q":"For a fixed amount of ideal gas, if temperature rises at constant volume, pressure generally…","o":["Rises","Falls","Stays constant","Becomes zero"],"a":0,"e":"At fixed volume, ideal-gas pressure is proportional to absolute temperature."},{"q":"Which expression gives heat for a small temperature change when molar Cᵥ is constant?","o":["Qᵥ = nCᵥΔT","Qᵥ = Cᵥ/nΔT","Qᵥ = nR/ΔT","Qᵥ = PΔV"],"a":0,"e":"For constant molar heat capacity, Qᵥ = nCᵥΔT."},{"q":"Two moles of gas with Cᵥ = 12 J mol⁻¹ K⁻¹ warm by 5 K at constant volume. Heat supplied is…","o":["24 J","60 J","120 J","240 J"],"a":2,"e":"Qᵥ = nCᵥΔT = 2 × 12 × 5 = 120 J."},{"q":"If 1 mol of gas has molar Cᵥ = 20 J mol⁻¹ K⁻¹ and warms by 10 K at constant volume, Qᵥ is…","o":["2 J","20 J","200 J","2,000 J"],"a":2,"e":"Qᵥ = nCᵥΔT = 1 × 20 × 10 = 200 J."},{"q":"For the same ideal gas, which molar heat capacity is greater?","o":["Cᵥ is always greater than Cₚ","Cₚ is greater than Cᵥ","Cₚ = Cᵥ for every gas","Neither can be compared"],"a":1,"e":"At constant pressure, heat also supports expansion work, so Cₚ > Cᵥ."},{"q":"For an ideal gas, Mayer's relation is…","o":["Cₚ − Cᵥ = R","Cₚ + Cᵥ = R","Cᵥ − Cₚ = R","CₚCᵥ = R"],"a":0,"e":"For molar heat capacities of an ideal gas, Cₚ − Cᵥ = R."},{"q":"For one mole of a monatomic ideal gas, Cₚ is…","o":["R/2","3R/2","5R/2","7R/2"],"a":2,"e":"Cₚ = Cᵥ + R = 3R/2 + R = 5R/2."},{"q":"Does heating a gas at constant volume necessarily mean its temperature is constant?","o":["Yes","No, temperature can rise","Only for ideal gases","Only if pressure is zero"],"a":1,"e":"Constant volume fixes V, not T; heat can increase temperature and pressure."},{"q":"For a reversible isochoric process, the P–V path is…","o":["Horizontal","Vertical","Circular","Always diagonal"],"a":1,"e":"Constant volume appears as a vertical line on a P–V diagram."},{"q":"If temperature of an ideal gas remains unchanged, its internal-energy change is…","o":["Positive","Negative","Zero","Always equal to Qᵥ"],"a":2,"e":"For an ideal gas, ΔU depends on temperature, so ΔT = 0 gives ΔU = 0."},{"q":"Which condition is essential when measuring Cᵥ directly for a gas?","o":["Keep volume fixed","Keep pressure fixed","Keep temperature fixed throughout","Allow free expansion"],"a":0,"e":"Cᵥ is defined for heating at constant volume."},{"q":"A rigid sealed vessel is heated. Why is boundary work zero?","o":["Its walls do not move","Pressure is zero","No heat enters","The gas has no internal energy"],"a":0,"e":"The vessel's fixed volume means there is no moving boundary and no P–V work."},{"q":"For an ideal gas, Cᵥ is related to the degrees of freedom f by…","o":["Cᵥ = fR/2 per mole","Cᵥ = R/f","Cᵥ = fP","Cᵥ = fRT"],"a":0,"e":"Equipartition gives molar Cᵥ = fR/2 when f quadratic degrees of freedom are active."},{"q":"If a gas has Cᵥ = 3R/2 and Cₚ = 5R/2, the ratio γ = Cₚ/Cᵥ is…","o":["2/3","1","5/3","7/3"],"a":2,"e":"γ = (5R/2)/(3R/2) = 5/3."},{"q":"Why does Cₚ exceed Cᵥ for an ideal gas?","o":["At constant pressure some heat goes into expansion work","Constant volume requires more work","Cᵥ includes latent heat only","Pressure is always lower"],"a":0,"e":"At constant pressure, supplied heat raises internal energy and does expansion work."},{"q":"If gas receives heat at constant volume, what is the sign of ΔU?","o":["Same sign as Q","Always opposite to Q","Always zero","Always negative"],"a":0,"e":"With W = 0, the first law gives ΔU = Q."},{"q":"Which process is most directly associated with Cᵥ?","o":["Heating a gas in a rigid container","Heating gas under a freely moving piston at constant pressure","Isothermal expansion","Free expansion only"],"a":0,"e":"A rigid container approximates constant-volume heating."},{"q":"For a constant Cᵥ, if the amount of gas doubles and the temperature rise stays the same, heat required…","o":["Halves","Doubles","Stays constant","Becomes zero"],"a":1,"e":"Qᵥ = nCᵥΔT, so heat is proportional to the amount of gas."},{"q":"For a fixed amount of ideal gas, internal-energy change at constant volume is…","o":["ΔU = nCᵥΔT","ΔU = PΔV only","ΔU = nCₚΔT in all processes","ΔU = 0 always"],"a":0,"e":"For an ideal gas, ΔU = nCᵥΔT when Cᵥ is constant."},{"q":"What is the main distinction between Cᵥ and Cₚ?","o":["The constraint: constant volume versus constant pressure","One measures temperature and one measures mass","Cᵥ has no units","They are always equal"],"a":0,"e":"Cᵥ and Cₚ refer to heat capacities measured under different constraints."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Specific Heat at Constant Volume Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
