(\\Delta T\\), the internal-energy change per mole is…","o":["\\(\\frac{3}{2}R\\Delta T\\)","\\(\\frac{5}{2}R\\Delta T\\)","\\(R\\Delta T\\)","\\(\\frac{1}{2}R\\Delta T\\)"],"a":0,"e":"For a monatomic gas, CV = 3R/2, so ΔU per mole is 3RΔT/2."},{"q":"For an ideal gas, the relation between molar heat capacities is…","o":["\\(C_P-C_V=R\\)","\\(C_P+C_V=R\\)","\\(C_V-C_P=R\\)","\\(C_P/C_V=R\\)"],"a":0,"e":"Mayer's relation states CP − CV = R."},{"q":"For a monatomic ideal gas, the ratio \\(C_P/C_V\\) is…","o":["\\(\\frac{5}{3}\\)","\\(\\frac{7}{5}\\)","\\(1\\)","\\(\\frac{4}{3}\\)"],"a":0,"e":"CP = 5R/2 and CV = 3R/2, giving the ratio 5/3."},{"q":"If a sample absorbs 900 J at constant volume and its temperature rises by 30 K, its heat capacity is…","o":["\\(30\\,\\mathrm{J\\,K^{-1}}\\)","\\(27000\\,\\mathrm{J\\,K^{-1}}\\)","\\(3\\,\\mathrm{J\\,K^{-1}}\\)","\\(0.033\\,\\mathrm{J\\,K^{-1}}\\)"],"a":0,"e":"For the sample, C = Q/ΔT = 900/30 = 30 J K⁻¹."},{"q":"If the same gas amount and temperature change are compared, why is \\(C_P>C_V\\) for an ideal gas?","o":["At constant pressure, extra heat supplies expansion work","At constant volume, the gas does more expansion work","Pressure is always zero","Internal energy is unrelated to temperature"],"a":0,"e":"At constant pressure, some supplied heat performs work as the gas expands."},{"q":"What does the subscript V in \\(C_V\\) mean?","o":["Volume remains constant during measurement","Velocity is constant","Vapour pressure is constant","The heat is measured in volts"],"a":0,"e":"The V denotes constant volume."},{"q":"For an ideal gas undergoing an isothermal change, internal-energy change is…","o":["\\(\\Delta U=0\\)","\\(\\Delta U=nC_VT\\)","\\(\\Delta U=PV\\)","Always positive"],"a":0,"e":"An ideal gas has the same internal energy at the same temperature."},{"q":"Which formula connects heat, mass, specific heat capacity and temperature change?","o":["\\(Q=mc_V\\Delta T\\)","\\(Q=m/c_V\\Delta T\\)","\\(Q=c_V/(m\\Delta T)\\)
