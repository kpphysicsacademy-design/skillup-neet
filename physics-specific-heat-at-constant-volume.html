<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Specific Heat at Constant Volume</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center;font-size:28px}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px;line-height:1.5}.explain{margin-top:10px;font-weight:500}</style></head><body><div class="wrap"><div class="card"><h1>🌡️ Specific Heat at Constant Volume (Cᵥ)</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['For one mole of an ideal gas, the heat supplied at constant volume is related to its molar heat capacity by','Q=CᵥΔT','Q=CₚΔT','Q=0','Q=RT',0,'At constant volume, Qᵥ=nCᵥΔT; for one mole, Qᵥ=CᵥΔT.'],
['For an ideal gas, the work done during a constant-volume process is','maximum','zero','negative always','equal to nRT',1,'W=∫P dV. At constant volume, dV=0, so W=0.'],

['The ratio γ for an ideal gas is defined as','Cᵥ/Cₚ','Cₚ/Cᵥ','Cₚ−Cᵥ','Cₚ+Cᵥ',1,'The adiabatic index is γ=Cₚ/Cᵥ.'],

['For n moles heated through ΔT at constant volume, heat supplied is','nCᵥΔT','nCₚΔT','CᵥΔT/n','nR/ΔT',0,'The constant-volume heat equation is Qᵥ=nCᵥΔT.'],
['The SI unit of molar heat capacity is','J mol⁻¹ K⁻¹','J kg⁻¹ K⁻¹','J K⁻¹','W mol⁻¹',0,'Molar heat capacity is energy per mole per kelvin: J mol⁻¹ K⁻¹.'],

];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});if(ok){score++;$('xp').innerHTML='✨ Correct! +1 XP';}else{$('xp').innerHTML='❌ Incorrect.<div class="explain">'+q[6]+'</div>'}$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
