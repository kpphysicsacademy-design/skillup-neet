<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Specific Heat Capacity — 15 MCQ Quiz</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#203040;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:22px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:#123b70}.xp{font-weight:950;color:#1677ff}.hero{margin-top:14px;background:linear-gradient(135deg,#123b70,#1677ff);color:#fff;border-radius:24px;padding:22px}.hero h1{margin:5px 0 7px;font-size:clamp(28px,6vw,40px)}.hero p{margin:0;line-height:1.5;font-size:13px}.card{background:#fff;border:1px solid #d9e5f2;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 7px 20px rgba(18,59,112,.07)}.master{font-weight:900}.bar{height:10px;background:#e5edf6;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;width:0;background:#1677ff;transition:.3s}.qno{font-size:12px;color:#6b7280;font-weight:900}.q{font-size:20px;font-weight:900;line-height:1.4;margin:9px 0 16px}button.opt{display:block;width:100%;text-align:left;background:#fff;color:#203040;border:2px solid #dfe8f1;border-radius:14px;padding:14px;margin:10px 0;font-size:15px;font-weight:750;line-height:1.35;cursor:pointer;appearance:none}button.opt.selected{border-color:#1677ff;background:#eef6ff;color:#123b70}button.opt.correct{border-color:#16803a;background:#eaf8ef;color:#145c2e}button.opt.wrong{border-color:#d64545;background:#fff0f0;color:#8f2020}button.continue{border:0;border-radius:13px;padding:12px 20px;background:#1677ff;color:#fff;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #0d5bbf}button.continue:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}.actions{display:flex;justify-content:flex-end;margin-top:15px}.feedback{min-height:25px;margin-top:13px;font-weight:800}.explain{margin-top:6px;color:#596774;font-weight:600}.back{display:block;width:max-content;margin:18px auto 0;padding:10px 15px;border:2px solid #d9e5f2;border-radius:12px;background:#fff;color:#1264d6;text-decoration:none;font-weight:900}.result{text-align:center}.score{font-size:34px;font-weight:950;color:#123b70}@media(max-width:520px){.wrap{padding:15px 10px 50px}.q{font-size:18px}button.opt{font-size:14px;padding:13px}}</style></head><body><main class="wrap"><div class="top"><div class="brand">⚛️ SkillUp Physics<br><small>NEET 2026 • 15 MCQ QUIZ</small></div><div class="xp" id="xp">XP: 0</div></div><section class="hero"><div>🔥 NEET PRACTICE</div><h1>Specific Heat Capacity</h1><p>15-question MCQ quiz. Select one answer, check instantly, and build mastery.</p></section><section class="card"><div class="master">🏆 Quiz Progress <span id="mastery">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card" id="quiz"><div class="qno" id="qno"></div><div class="q" id="question"></div><div id="opts"></div><div class="actions"><button class="continue" id="continue" type="button" disabled>Check Answer →</button></div><div class="feedback" id="feedback"></div></section><section class="card result" id="result" hidden></section><a class="back" href="physics-home-fast.html">← 📚 Back to Physics Path</a></main><script>const questions=[
{q:'Specific heat capacity of a substance is the heat required to raise the temperature of',o:['1 kg of the substance by 1 K','1 g by 10 K','1 kg by 100 K','any mass by 1 K'],a:0,e:'Specific heat capacity is heat required per unit mass for a temperature rise of one kelvin.'},
{q:'The SI unit of specific heat capacity is',o:['J kg⁻¹ K⁻¹','J kg K','W m⁻¹ K⁻¹','J K⁻¹'],a:0,e:'The SI unit is joule per kilogram per kelvin, J kg⁻¹ K⁻¹.'},
{q:'The dimensional formula of specific heat capacity is',o:['[L²T⁻²K⁻¹]','[ML²T⁻²K⁻¹]','[MLT⁻²]','[ML²T⁻³K⁻¹]'],a:0,e:'c = Q/(mΔT), so its dimensions are energy/(mass × temperature) = [L²T⁻²K⁻¹].'},
{q:'The heat required for a temperature change ΔT is given by',o:['Q = mcΔT','Q = m/cΔT','Q = c/mΔT','Q = mc/ΔT'],a:0,e:'For sensible heating without phase change, Q = mcΔT.'},
{q:'For equal masses receiving the same heat, the substance with larger specific heat capacity undergoes',o:['a larger temperature rise','a smaller temperature rise','the same temperature rise always','a phase change necessarily'],a:1,e:'From ΔT = Q/(mc), a larger c gives a smaller temperature rise for the same Q and m.'},
{q:'Water has a relatively high specific heat capacity. Therefore water',o:['heats and cools slowly','always boils at 100 °C','has zero thermal expansion','cannot transfer heat'],a:0,e:'High specific heat means more heat is required for a given temperature change, so water heats and cools relatively slowly.'},
{q:'If the mass of a substance is doubled while c and ΔT remain constant, heat required becomes',o:['half','double','four times','unchanged'],a:1,e:'Q = mcΔT, so Q is directly proportional to mass.'},
{q:'If the temperature change is doubled while mass and c remain constant, heat required becomes',o:['half','double','four times','unchanged'],a:1,e:'Q = mcΔT, so heat is directly proportional to temperature change.'},
{q:'Two bodies of equal mass receive equal heat. Body A has c twice that of B. The temperature rise of A is',o:['twice B','half B','equal to B','four times B'],a:1,e:'Since ΔT = Q/(mc), doubling c halves the temperature rise.'},
{q:'The specific heat capacity of a substance is related to its ability to',o:['store thermal energy per unit mass per unit temperature rise','conduct electricity','reflect light','produce sound'],a:0,e:'Specific heat capacity quantifies the thermal energy needed per unit mass for a unit temperature increase.'},
{q:'In calorimetry, when no heat is lost to surroundings, heat lost by a hot body equals',o:['heat gained by the cold body','zero','its mass','its temperature'],a:0,e:'The principle of calorimetry is conservation of energy: heat lost equals heat gained.'},
{q:'A 1 kg substance with c = 500 J kg⁻¹ K⁻¹ is heated by 10 K. Heat supplied is',o:['50 J','500 J','5000 J','50000 J'],a:2,e:'Q = mcΔT = 1 × 500 × 10 = 5000 J.'},
{q:'If no phase change occurs, the heat supplied to a body primarily changes its',o:['temperature','mass','chemical formula necessarily','gravitational acceleration'],a:0,e:'Sensible heat changes temperature when the material remains in the same phase.'},
{q:'A substance with low specific heat capacity requires, for the same mass and temperature rise',o:['more heat','less heat','infinite heat','no heat'],a:1,e:'Q = mcΔT, so a lower c requires less heat for the same m and ΔT.'},
{q:'Specific heat capacity is a',o:['material property','vector quantity','fundamental SI base quantity','unit of power'],a:0,e:'Specific heat capacity is a thermophysical property characteristic of a material under specified conditions.'}
];let i=0,selected=null,checked=false,score=0;const $=id=>document.getElementById(id);function render(){selected=null;checked=false;$('feedback').textContent='';$('continue').disabled=true;$('continue').textContent=i===14?'Finish Quiz →':'Check Answer →';$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=questions[i].q;$('opts').innerHTML='';questions[i].o.forEach((text,n)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+n)+'. '+text;b.dataset.index=n;b.onclick=()=>{if(checked)return;selected=n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('continue').disabled=false};$('opts').appendChild(b)});$('mastery').textContent=`${i} / 15`;$('fill').style.width=`${i/15*100}%`;$('xp').textContent=`XP: ${score*10}`}function next(){if(selected===null)return;if(!checked){checked=true;const item=questions[i],ok=selected===item.a;if(ok)score++;document.querySelectorAll('.opt').forEach(b=>{const n=+b.dataset.index;b.disabled=true;if(n===item.a)b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+`<div class="explain">${item.e}</div>`;$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=`${(i+1)/15*100}%`;$('xp').textContent=`XP: ${score*10}`}else if(i<14){i++;render()}else finish()}function finish(){$('quiz').hidden=true;$('result').hidden=false;const pct=Math.round(score/15*100);$('result').innerHTML=`<h2>🎉 Specific Heat Capacity Complete!</h2><div class="score">${score} / 15</div><p><strong>${pct}%</strong> accuracy</p><p>🏆 You earned <strong>${score*10} XP</strong>.</p><p>${score>=12?'🔥 Excellent NEET readiness!':score>=9?'💪 Good work. Revise and retry for mastery.':'📚 Revise Specific Heat Capacity and try again.'}</p><button class="continue" type="button" onclick="location.reload()">Retry 15 MCQs</button>`}$('continue').onclick=next;render();</script></body></html>
