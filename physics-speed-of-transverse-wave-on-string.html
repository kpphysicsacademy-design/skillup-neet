(function(){
'use strict';
const questions = [{"q":"The speed of a transverse wave on a stretched string is…","o":["\\(v=\\sqrt{T/\\mu}\\)","\\(v=\\sqrt{\\mu/T}\\)","\\(v=T\\mu\\)","\\(v=T/\\mu\\)"],"a":0,"e":"For an ideal string, \\(v=\\sqrt{T/\\mu}\\), where T is tension and μ is mass per unit length."},{"q":"In the formula \\(v=\\sqrt{T/\\mu}\\), T denotes…","o":["Temperature","Tension","Time period","Total mass"],"a":1,"e":"T is the tension in the string, measured in newtons."},{"q":"In the same formula, \\(\\mu\\) denotes…","o":["Total mass","Mass per unit length","Volume density","Momentum"],"a":1,"e":"Linear mass density is \\(\\mu=m/L\\), measured in kg m⁻¹."},{"q":"The SI unit of linear mass density is…","o":["kg","kg m⁻¹","N m⁻¹","m kg⁻¹"],"a":1,"e":"Mass per unit length has SI unit kg/m."},{"q":"The SI unit of string tension is…","o":["Joule","Watt","Newton","Pascal"],"a":2,"e":"Tension is a force, so its SI unit is the newton (N)."},{"q":"If tension is increased fourfold while μ stays constant, wave speed…","o":["Halves","Doubles","Quadruples","Stays unchanged"],"a":1,"e":"Since \\(v\\propto\\sqrt{T}\\), multiplying tension by four multiplies speed by two."},{"q":"If tension is increased ninefold, wave speed becomes…","o":["Three times","Nine times","One-third","Unchanged"],"a":0,"e":"The speed scales with the square root of tension: \\(\\sqrt{9}=3\\)."},{"q":"If linear density becomes four times larger at fixed tension, speed becomes…","o":["Four times","Twice","Half","Unchanged"],"a":2,"e":"Because \\(v\\propto1/\\sqrt{\\mu}\\), four times the density gives half the speed."},{"q":"If both tension and linear density are doubled, wave speed…","o":["Doubles","Halves","Remains unchanged","Becomes four times"],"a":2,"e":"The ratio \\(T/\\mu\\) remains unchanged, so the speed remains unchanged."},{"q":"A string has \\(T=100\\,\\text{N}\\) and \\(\\mu=0.01\\,\\text{kg/m}\\). Its wave speed is…","o":["10 m/s","50 m/s","100 m/s","1000 m/s"],"a":2,"e":"\\(v=\\sqrt{100/0.01}=\\sqrt{10000}=100\\,\\text{m/s}\\)."},{"q":"A string has \\(T=64\\,\\text{N}\\) and \\(\\mu=0.04\\,\\text{kg/m}\\). Its speed is…","o":["20 m/s","40 m/s","80 m/s","160 m/s"],"a":1,"e":"\\(v=\\sqrt{64/0.04}=\\sqrt{1600}=40\\,\\text{m/s}\\)."},{"q":"A transverse wave on a string travels at 50 m/s and has \\(\\mu=0.02\\,\\text{kg/m}\\). Tension is…","o":["25 N","50 N","100 N","250 N"],"a":1,"e":"From \\(v^2=T/\\mu\\), \\(T=\\mu v^2=0.02(50^2)=50\\,\\text{N}\\)."},{"q":"A transverse wave on a string has speed 20 m/s and tension 80 N. Its linear density is…","o":["0.02 kg/m","0.2 kg/m","2 kg/m","4 kg/m"],"a":1,"e":"Rearrange to \\(\\mu=T/v^2=80/400=0.2\\,\\text{kg/m}\\)."},{"q":"A string of mass 0.06 kg and length 3 m has linear density…","o":["0.02 kg/m","0.18 kg/m","2 kg/m","50 kg/m"],"a":0,"e":"\\(\\mu=m/L=0.06/3=0.02\\,\\text{kg/m}\\)."},{"q":"If the mass of a string is doubled while its length stays fixed, its wave speed at constant tension…","o":["Doubles","Halves","Decreases by factor \\(\\sqrt{2}\\)","Stays unchanged"],"a":2,"e":"Doubling mass at fixed length doubles μ, so speed becomes \\(v/\\sqrt{2}\\)."},{"q":"If the length of a uniform string doubles while its mass stays fixed, its linear density…","o":["Doubles","Halves","Quadruples","Stays unchanged"],"a":1,"e":"Since \\(\\mu=m/L\\), doubling length at fixed mass halves linear density."},{"q":"If linear density is halved at constant tension, wave speed…","o":["Halves","Doubles","Increases by \\(\\sqrt{2}\\)","Decreases by \\(\\sqrt{2}\\)"],"a":2,"e":"\\(v\\propto1/\\sqrt{\\mu}\\), so halving μ increases speed by \\(\\sqrt{2}\\)."},{"q":"The relation connecting wave speed, frequency and wavelength is…","o":["\\(v=f/\\lambda\\)","\\(v=f\\lambda\\)","\\(v=\\lambda/f\\)","\\(v=f+\\lambda\\)"],"a":1,"e":"For a periodic wave, \\(v=f\\lambda\\)."},{"q":"A wave travels at 120 m/s with frequency 20 Hz. Its wavelength is…","o":["3 m","6 m","20 m","2400 m"],"a":1,"e":"\\(\\lambda=v/f=120/20=6\\,\\text{m}\\)."},{"q":"A wave has wavelength 0.4 m and frequency 50 Hz. Its speed is…","o":["12.5 m/s","20 m/s","50 m/s","125 m/s"],"a":1,"e":"\\(v=f\\lambda=50(0.4)=20\\,\\text{m/s}\\)."},{"q":"A string has tension 100 N and linear density 0.025 kg/m. Wave speed is…","o":["20 m/s","40 m/s","50 m/s","Approximately 63.2 m/s"],"a":3,"e":"\\(v=\\sqrt{100/0.025}=\\sqrt{4000}\\approx63.2\\,\\text{m/s}\\)."},{"q":"A string has tension 100 N and linear density 0.04 kg/m. Wave speed is…","o":["25 m/s","40 m/s","50 m/s","100 m/s"],"a":2,"e":"\\(v=\\sqrt{100/0.04}=\\sqrt{2500}=50\\,\\text{m/s}\\)."},{"q":"A string of length 1.5 m has a mass of 0.03 kg. Its linear density is…","o":["0.02 kg/m","0.045 kg/m","0.2 kg/m","2 kg/m"],"a":0,"e":"\\(\\mu=0.03/1.5=0.02\\,\\text{kg/m}\\)."},{"q":"For a string fixed at both ends, the fundamental frequency is…","o":["\\(v/L\\)","\\(v/(2L)\\)","\\(2v/L\\)","\\(v/(4L)\\)"],"a":1,"e":"The fundamental wavelength is \\(2L\\), so \\(f_1=v/(2L)\\)."},{"q":"A fixed string of length 0.5 m has wave speed 100 m/s. Fundamental frequency is…","o":["50 Hz","100 Hz","200 Hz","400 Hz"],"a":1,"e":"\\(f_1=v/(2L)=100/(2\\times0.5)=100\\,\\text{Hz}\\)."},{"q":"If string length doubles while tension and density remain constant, fundamental frequency…","o":["Doubles","Halves","Quadruples","Remains unchanged"],"a":1,"e":"Since \\(f_1\\propto1/L\\), doubling length halves the fundamental frequency."},{"q":"If tension is increased by a factor of 16, the fundamental frequency of the same string…","o":["Doubles","Quadruples","Becomes 16 times","Halves"],"a":1,"e":"Since \\(f_1\\propto\\sqrt{T}\\), a factor of 16 in tension gives a factor of 4 in frequency."},{"q":"A wave moves from one string to another driven by the same source. Which quantity remains the same?","o":["Wave speed","Wavelength","Frequency","Linear density"],"a":2,"e":"The source fixes frequency; speed and wavelength may change in the second medium."},{"q":"Which change increases transverse-wave speed on the same string?","o":["Reducing tension","Increasing tension","Increasing amplitude only","Increasing frequency only"],"a":1,"e":"The equation \\(v=\\sqrt{T/\\mu}\\) shows that higher tension increases wave speed."},{"q":"Two strings have equal tension. String A has four times the linear density of B. The speed on A compared with B is…","o":["Four times","Twice","Half","One-quarter"],"a":2,"e":"At equal tension, \\(v\\propto1/\\sqrt{\\mu}\\); four times the density gives half the speed."}];
let index=0,score=0,streak=0,chosen=null,locked=false;

function render(){
 chosen=null;locked=false;

 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';

 item.o.forEach((text,j)=>{

 });
 typesetMath();

$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}

});

 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}

 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}

     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);

 }

 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
