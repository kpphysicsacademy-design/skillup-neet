<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp | Speed • NEET Physics</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eef7ff;color:#173b62}.wrap{max-width:1050px;margin:auto;padding:20px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.skill{background:#fff;border:2px solid #dbe7f1;border-radius:14px;padding:7px 11px;font-weight:900}.hero,.quiz,.panel,.mastery{background:#fff;border-radius:20px;padding:22px;margin:12px 0;box-shadow:0 6px 18px #123b7015}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #dbe7f1;border-radius:15px;background:#fff;text-align:left;font-weight:700;cursor:pointer}.option.selected{border-color:#1677ff;background:#eef6ff}.option.correct{border-color:#2db84d;background:#eaffef}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{padding:12px 18px;border:0;border-radius:13px;font-weight:900;cursor:pointer;margin:8px 6px 0 0}.check{background:#2db84d;color:#fff}.next{background:#dcecff;color:#145b9e}.next:disabled{opacity:.45}.feedback{margin-top:14px;padding:13px;border-radius:14px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.bar{height:13px;background:#dce8f2;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#42c95a}@media(max-width:750px){.layout{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.wrap{padding:12px}}
</style>
</head>
<body>
<main class="wrap">
<div class="topbar"><a href="physics-home.html">← Back to Physics Path</a><span class="skill">⚡ <span id="xp">0</span> XP</span></div>
<section class="hero"><div>PHYSICS • NEET 2026</div><h1>Speed</h1><p>LEARN → PRACTICE → MASTER • <span>15 focused NEET-style MCQs</span></p></section>
<section class="mastery"><b>🎯 Skill Mastery <span id="mt">0 / 15</span></b><div class="bar"><div id="fill" class="fill"></div></div></section>
<div class="layout"><aside class="panel"><h3 id="count">Question 1 of 15</h3><div id="pct">7%</div><div>Speed</div><div>⚡ +10 XP each</div><div>🦉 Learn → Practice → Master</div></aside>
<section class="quiz"><b id="badge">Q1</b><h2 id="q"></h2><div id="opts" class="options"></div><button id="check" class="btn check">Check Answer</button><button id="next" class="btn next" disabled>Next Question →</button><div id="fb" class="feedback"></div><p>💡 Choose the best answer.</p></section></div>
</main>
<script>
(function(){
const quiz=[
['Speed is defined as:', ['Distance travelled per unit time','Displacement per unit time','Change in velocity per unit time','Force per unit mass'],0,'Speed is the distance travelled per unit time: speed = distance/time.'],
['Speed is a:', ['Scalar quantity','Vector quantity','Tensor quantity','Dimensionless quantity'],0,'Speed has magnitude only, so it is a scalar quantity.'],
['The SI unit of speed is:', ['m/s','m/s²','km/s','N'],0,'The SI unit of speed is metre per second (m/s).'],
['The average speed of a body is:', ['Total distance travelled divided by total time taken','Total displacement divided by total time','Final speed minus initial speed','Distance multiplied by time'],0,'Average speed = total distance travelled / total time taken.'],
['A car travels 120 km in 2 h. Its average speed is:', ['60 km/h','30 km/h','120 km/h','240 km/h'],0,'Average speed = 120/2 = 60 km/h.'],
['A body travels equal distances at speeds v₁ and v₂. Its average speed is:', ['2v₁v₂/(v₁+v₂)','(v₁+v₂)/2','v₁v₂','v₁−v₂'],0,'For equal distances, average speed is the harmonic mean: 2v₁v₂/(v₁+v₂).'],
['If a body covers 100 m in 20 s, its average speed is:', ['5 m/s','2 m/s','20 m/s','2000 m/s'],0,'Average speed = 100/20 = 5 m/s.'],
['Can the speed of a moving body be negative?', ['No, speed is a scalar magnitude','Yes, whenever the body moves west','Yes, whenever displacement is negative','Only during acceleration'],0,'Speed is a magnitude and is therefore non-negative. Direction is represented by velocity.'],
['For uniform motion along a straight line, the speed is:', ['Constant','Always zero','Increasing continuously','Decreasing continuously'],0,'Uniform motion means equal distances are covered in equal intervals of time, so speed remains constant.'],
['The instantaneous speed of a particle is the:', ['Magnitude of its instantaneous velocity','Rate of change of displacement averaged over the whole trip','Total distance divided by total time only','Magnitude of acceleration'],0,'Instantaneous speed is the magnitude of instantaneous velocity.'],
['A runner completes one 400 m lap of a track in 80 s. The average speed is:', ['5 m/s','4 m/s','80 m/s','32000 m/s'],0,'Average speed = 400/80 = 5 m/s.'],
['A person walks 3 km east and then 4 km west in 2 h. The average speed is:', ['3.5 km/h','0.5 km/h','1 km/h','7 km/h'],0,'Total distance = 7 km; average speed = 7/2 = 3.5 km/h.'],
['A particle moves 10 m in 2 s and then 20 m in 4 s. Its average speed is:', ['5 m/s','10 m/s','15 m/s','30 m/s'],0,'Total distance = 30 m and total time = 6 s, so average speed = 5 m/s.'],
['Which statement correctly distinguishes speed from velocity?', ['Speed uses distance, while velocity uses displacement and direction','Speed has direction, while velocity has none','Both are always vectors','Both are always scalars'],0,'Speed is scalar and based on distance; velocity is vector and based on displacement with direction.'],
['A car moves at 20 m/s for 5 s and then at 10 m/s for 5 s in the same direction. Its average speed is:', ['15 m/s','10 m/s','20 m/s','30 m/s'],0,'Total distance = 100 + 50 = 150 m; total time = 10 s; average speed = 15 m/s.']
];
let i=0,sel=-1,score=0;
const q=document.getElementById('q'),o=document.getElementById('opts'),fb=document.getElementById('fb'),check=document.getElementById('check'),next=document.getElementById('next');
function render(){const a=quiz[i];sel=-1;q.textContent=a[0];document.getElementById('badge').textContent='Q'+(i+1);document.getElementById('count').textContent='Question '+(i+1)+' of '+quiz.length;document.getElementById('pct').textContent=Math.round((i+1)/quiz.length*100)+'%';o.innerHTML='';fb.textContent='';fb.className='feedback';check.disabled=false;next.disabled=true;next.textContent='Next Question →';a[1].forEach((v,j)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+v;b.onclick=function(){sel=j;Array.from(o.children).forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)})}
check.onclick=function(){if(sel<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}const a=quiz[i];Array.from(o.children).forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===sel&&j!==a[2])b.classList.add('wrong')});if(sel===a[2]){score++;fb.className='feedback good';fb.textContent='🎯 Correct! '+a[3]+' +10 XP'}else{fb.className='feedback bad';fb.textContent='Not quite. '+a[3]+' Correct answer: '+a[1][a[2]]}document.getElementById('xp').textContent=score*10;document.getElementById('mt').textContent=score+' / '+quiz.length;document.getElementById('fill').style.width=(score/quiz.length*100)+'%';check.disabled=true;next.disabled=false;if(i===quiz.length-1)next.textContent='Finish Skill →'};
next.onclick=function(){if(i<quiz.length-1){i++;render()}else{q.textContent='🏆 Speed Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+score+' / '+quiz.length+' correct • '+score*10+' XP'}};
render();
})();
</script>
</body>
</html>
