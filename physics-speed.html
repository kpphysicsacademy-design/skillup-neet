<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Speed • NEET Physics</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:flex-end;align-items:center;gap:12px}.back{color:#5146a5;font-weight:800;text-decoration:none;padding:9px 12px;border-radius:12px;transition:transform .15s,background .15s,box-shadow .15s}.back:hover{background:#eeeaff;transform:translateX(-2px)}.back:focus-visible{outline:3px solid #b9b0ff;outline-offset:2px}.back:active{transform:translateX(-1px) scale(.98)}.xp{background:#fff;border:1px solid #dfe3ea;border-radius:14px;padding:7px 11px;font-weight:850;white-space:nowrap}.intro{margin:24px 0 18px}.intro h1{margin:0 0 8px;font-size:2rem;line-height:1.15}.intro p{margin:0;color:#596273;line-height:1.55}.progress{height:12px;background:#e4e7ed;border-radius:99px;overflow:hidden;margin:20px 0}.fill{height:100%;width:0;background:#58cc02;transition:width .25s ease}.card{background:#fff;border-radius:22px;padding:26px;box-shadow:0 8px 24px rgba(23,32,51,.08)}.meta{font-size:.95rem;font-weight:800;color:#596273;margin-bottom:12px}.q{font-size:1.3rem;font-weight:750;line-height:1.45;margin:0 0 20px}.options{display:grid;gap:10px}.option{padding:15px 16px;border:2px solid #dfe3ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;color:#172033;cursor:pointer;transition:border-color .15s,background .15s,transform .1s,box-shadow .15s}.option:hover:not(:disabled){border-color:#58cc02;background:#f5fff0;transform:translateY(-1px);box-shadow:0 3px 0 #dfe3ea}.option.selected{border-color:#5146a5;background:#f1efff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#ff4b4b;background:#fff0f0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{padding:12px 18px;border:0;border-radius:13px;font:inherit;font-weight:850;cursor:pointer}.check,.retry{background:#58cc02;color:#fff}.next{background:#5146a5;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:16px;min-height:24px;font-weight:750;line-height:1.5}.good{color:#177b2f}.bad{color:#b02a37}.hint{margin:18px 0 0;color:#596273;font-size:.95rem}.result{display:none;text-align:center;margin-top:20px;padding-top:18px;border-top:1px solid #e5e7eb}.result h2{margin:0 0 8px}.bottom-nav{margin-top:20px;text-align:center}.back-bottom{display:inline-block}.back-bottom:hover{box-shadow:0 4px 12px rgba(81,70,165,.12)}@media(max-width:600px){.wrap{padding:20px 14px}.intro h1{font-size:1.65rem}.card{padding:20px}.q{font-size:1.15rem}}</style></head><body><main class="wrap"><div class="top"><span class="xp">⚡ <span id="xp">0</span> XP</span></div><section class="intro"><h1>⚡ Speed</h1><p>Master speed, average speed and instantaneous speed with 15 focused NEET-style MCQs.</p></section><div class="progress" aria-label="Quiz progress"><div id="fill" class="fill"></div></div><section class="card"><div class="meta"><span id="count">Question 1 of 15</span> • <span id="pct">7%</span></div><h2 id="q" class="q"></h2><div id="opts" class="options"></div><div class="actions"><button id="check" class="btn check" type="button">Check Answer</button><button id="next" class="btn next" type="button" disabled>Next Question →</button></div><div id="fb" class="feedback" aria-live="polite"></div><p class="hint">💡 <span id="hint">Choose the best answer.</span></p><div id="result" class="result"><h2>🏆 Skill Complete!</h2><p id="score"></p><button id="retry" class="btn retry" type="button">Retry Skill</button></div></section><div class="bottom-nav"><a class="back back-bottom" href="#" onclick="return goBackToPhysicsPath()">← Back to Physics Path</a></div></main><script>(function(){const KEY='skillupLastPhysicsPath';function rememberPath(){try{const r=document.referrer;if(!r)return;const u=new URL(r);if(u.origin!==location.origin)return;if(/(?:physics|full-physics)[^/]*path[^/]*\.html$/i.test(u.pathname)||/\/physics-home\.html$/i.test(u.pathname))sessionStorage.setItem(KEY,u.href)}catch(e){}}function goBackToPhysicsPath(){try{const saved=sessionStorage.getItem(KEY);if(saved){const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}}catch(e){}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false}window.goBackToPhysicsPath=goBackToPhysicsPath;rememberPath();const quiz=[['Speed is defined as:',['Distance travelled per unit time','Displacement per unit time','Change in velocity per unit time','Force per unit mass'],0,'Speed is the distance travelled per unit time: speed = distance/time.'],['Speed is a:',['Scalar quantity','Vector quantity','Tensor quantity','Dimensionless quantity'],0,'Speed has magnitude only, so it is a scalar quantity.'],['The SI unit of speed is:',['m/s','m/s²','km/s','N'],0,'The SI unit of speed is metre per second (m/s).'],['The average speed of a body is:',['Total distance travelled divided by total time taken','Total displacement divided by total time','Final speed minus initial speed','Distance multiplied by time'],0,'Average speed = total distance travelled / total time taken.'],['A car travels 120 km in 2 h. Its average speed is:',['60 km/h','30 km/h','120 km/h','240 km/h'],0,'Average speed = 120/2 = 60 km/h.'],['A body travels equal distances at speeds v₁ and v₂. Its average speed is:',['2v₁v₂/(v₁+v₂)','(v₁+v₂)/2','v₁v₂','v₁−v₂'],0,'For equal distances, average speed is the harmonic mean: 2v₁v₂/(v₁+v₂).'],['If a body covers 100 m in 20 s, its average speed is:',['5 m/s','2 m/s','20 m/s','2000 m/s'],0,'Average speed = 100/20 = 5 m/s.'],['Can the speed of a moving body be negative?',['No, speed is a scalar magnitude','Yes, whenever the body moves west','Yes, whenever displacement is negative','Only during acceleration'],0,'Speed is a magnitude and is therefore non-negative. Direction is represented by velocity.'],['For uniform motion along a straight line, the speed is:',['Constant','Always zero','Increasing continuously','Decreasing continuously'],0,'Uniform motion means equal distances are covered in equal intervals of time, so speed remains constant.'],['The instantaneous speed of a particle is the:',['Magnitude of its instantaneous velocity','Rate of change of displacement averaged over the whole trip','Total distance divided by total time only','Magnitude of acceleration'],0,'Instantaneous speed is the magnitude of instantaneous velocity.'],['A runner completes one 400 m lap of a track in 80 s. The average speed is:',['5 m/s','4 m/s','80 m/s','32000 m/s'],0,'Average speed = 400/80 = 5 m/s.'],['A person walks 3 km east and then 4 km west in 2 h. The average speed is:',['3.5 km/h','0.5 km/h','1 km/h','7 km/h'],0,'Total distance = 7 km; average speed = 7/2 = 3.5 km/h.'],['A particle moves 10 m in 2 s and then 20 m in 4 s. Its average speed is:',['5 m/s','10 m/s','15 m/s','30 m/s'],0,'Total distance = 30 m and total time = 6 s, so average speed = 5 m/s.'],['Which statement correctly distinguishes speed from velocity?',['Speed uses distance, while velocity uses displacement and direction','Speed has direction, while velocity has none','Both are always vectors','Both are always scalars'],0,'Speed is scalar and based on distance; velocity is vector and based on displacement with direction.'],['A car moves at 20 m/s for 5 s and then at 10 m/s for 5 s in the same direction. Its average speed is:',['15 m/s','10 m/s','20 m/s','30 m/s'],0,'Total distance = 100 + 50 = 150 m; total time = 10 s; average speed = 15 m/s.']];let i=0,sel=-1,score=0,locked=false;const $=id=>document.getElementById(id),q=$('q'),o=$('opts'),fb=$('fb'),check=$('check'),next=$('next'),xp=$('xp'),fill=$('fill'),count=$('count'),pct=$('pct');function render(){const a=quiz[i];sel=-1;locked=false;q.textContent=a[0];count.textContent='Question '+(i+1)+' of '+quiz.length;pct.textContent=Math.round((i+1)/quiz.length*100)+'%';fill.style.width=(score/quiz.length*100)+'%';fb.className='feedback';fb.textContent='';check.disabled=false;next.disabled=true;next.textContent='Next Question →';o.innerHTML='';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{if(locked)return;sel=item.index;Array.from(o.children).forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)})}check.onclick=function(){if(sel<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}locked=true;const a=quiz[i],ok=sel===a[2];Array.from(o.children).forEach(b=>{const originalIndex=Number(b.dataset.index);b.disabled=true;if(originalIndex===a[2])b.classList.add('correct');if(originalIndex===sel&&!ok)b.classList.add('wrong')});if(ok){score++;fb.className='feedback good';fb.textContent='🎯 Correct! '+a[3]+' +10 XP'}else{fb.className='feedback bad';fb.textContent='Not quite. '+a[3]+' Correct answer: '+a[1][a[2]]}xp.textContent=score*10;fill.style.width=(score/quiz.length*100)+'%';check.disabled=true;next.disabled=false;if(i===quiz.length-1)next.textContent='Finish Skill →'};next.onclick=function(){if(i<quiz.length-1){i++;render()}else{q.textContent='🏆 Speed Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+score+' / '+quiz.length+' correct • '+score*10+' XP';$('result').style.display='block';$('score').textContent=score+' / '+quiz.length+' correct • '+score*10+' XP'}};$('retry').onclick=()=>{i=0;sel=-1;score=0;locked=false;xp.textContent='0';$('result').style.display='none';check.style.display='';next.style.display='';next.textContent='Next Question →';render()};render()})();</script></body></html>
