<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Spherical Mirrors</title><meta name="description" content="SkillUp Physics Spherical Mirrors interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🪞</span><h1>Spherical Mirrors</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["A spherical mirror is a mirror whose reflecting surface is part of a:",["Sphere","Cylinder","Plane","Cone"],0,"A spherical mirror has a reflecting surface that forms part of a spherical surface."] ,["A concave mirror has its reflecting surface:",["On the inner side of the spherical surface","On the outer side of the spherical surface","Only on a plane surface","On both sides equally"],0,"A concave mirror reflects from the inner, hollow side of a spherical surface."] ,["A convex mirror has its reflecting surface:",["On the outer side of the spherical surface","On the inner side of the spherical surface","Only at the pole","Only at the centre of curvature"],0,"A convex mirror reflects from the outer bulging side of the spherical surface."] ,["The centre of the reflecting spherical surface is called the:",["Pole","Centre of curvature","Principal focus","Vertex angle"],1,"The centre of the sphere of which the mirror is a part is called the centre of curvature, C."] ,["The point where the principal axis meets the mirror surface is called the:",["Pole","Focus","Centre of curvature","Aperture"],0,"The pole P is the geometric centre of the mirror's reflecting surface."] ,["The line joining the pole and centre of curvature of a spherical mirror is the:",["Principal axis","Normal plane","Focal plane","Secondary axis"],0,"The principal axis passes through the pole and centre of curvature."] ,["For a spherical mirror of small aperture, the principal focus lies approximately:",["Midway between the pole and centre of curvature","At the centre of curvature","At the pole","Beyond the centre of curvature for every mirror"],0,"For a paraxial spherical mirror, the principal focus is approximately halfway between P and C."] ,["The relation between focal length f and radius of curvature R for a spherical mirror is:",["f = R/2","f = 2R","f = R","f = 1/R"],0,"For a spherical mirror under the paraxial approximation, the magnitude of focal length is half the radius of curvature."] ,["A concave mirror is also known as a:",["Converging mirror","Diverging mirror","Transparent mirror","Plane mirror"],0,"A concave mirror can converge parallel rays toward its real principal focus."] ,["A convex mirror is also known as a:",["Diverging mirror","Converging mirror","Focusing lens","Plane reflector"],0,"A convex mirror causes parallel rays to diverge; their backward extensions meet at a virtual focus."] ,["When parallel rays are incident on a concave mirror along the principal axis, the reflected rays:",["Converge at the principal focus","Diverge from the pole only","Travel without reflection","Converge at the centre of curvature only"],0,"Parallel rays close to the principal axis reflect through the principal focus of a concave mirror."] ,["When parallel rays are incident on a convex mirror, the reflected rays appear to come from:",["The principal focus behind the mirror","The principal focus in front of the mirror","The centre of curvature in front of the mirror","The pole only"],0,"The reflected rays diverge and their backward extensions meet at a virtual focus behind the convex mirror."] ,["For a concave mirror, an object placed at the centre of curvature forms an image that is:",["Real, inverted and of the same size","Virtual, erect and enlarged","Real, erect and diminished","Virtual, inverted and diminished"],0,"At C, a concave mirror forms a real, inverted image of the same size at C."] ,["For a concave mirror, an object placed between the pole and focus forms an image that is:",["Virtual, erect and magnified","Real, inverted and diminished","Real, erect and same size","Virtual, inverted and diminished"],0,"When the object lies between P and F, the reflected rays diverge and their extensions form a virtual, erect, magnified image behind the mirror."] ,["A major advantage of a convex mirror for vehicles is its:",["Wide field of view","Ability to form only real images","Zero reflection","Large magnification greater than one"],0,"Convex mirrors provide a wider field of view and therefore help drivers see a larger area behind them."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
