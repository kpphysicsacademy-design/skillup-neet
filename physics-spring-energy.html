<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Spring Energy</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:flex-end;margin-bottom:20px}.xp{background:#fff;padding:12px 18px;border-radius:18px;box-shadow:0 5px 18px #17203314;font-weight:800}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff;border-radius:22px;padding:26px 20px;margin-bottom:12px;box-shadow:0 8px 22px #12539d25}.hero h1{margin:9px 0 10px;font-size:1.9rem}.hero p{margin:0}.card{background:#fff;border-radius:22px;padding:20px;margin:12px 0;box-shadow:0 6px 20px #17203312}.progress-head{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:12px;background:#dfe8f1;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;border-radius:999px;transition:width .3s}.qnum{font-size:.9rem;font-weight:800;color:#35516f;margin-bottom:12px}.question{font-size:1.28rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{width:100%;padding:14px 15px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#58cc02;background:#f7fff1}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;font-weight:850;cursor:pointer;background:#2db84d;color:#fff;box-shadow:0 4px 0 #21863a}.feedback{margin-top:14px;padding:13px;border-radius:14px;font-weight:700}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:8px;color:#5146a5;font-weight:800;text-decoration:none;padding:9px 12px;border-radius:12px}.back:hover{background:#f0edff}@media(max-width:600px){.wrap{padding:20px 14px 34px}.question{font-size:1.15rem}}</style></head><body><main class="wrap"><div class="top"><div class="xp">⚡ <span id="xp">0</span> XP</div></div><section class="hero"><h1>🌀 Spring Energy</h1><p>LEARN → PRACTICE → MASTER • 15 NEET-style MCQs</p></section><section class="card"><div class="progress-head"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count">Question 1 of 15</div><h2 id="question" class="question"></h2><div id="options" class="options"></div><button id="continue" class="btn">Continue →</button><div id="feedback" class="feedback"></div></section><a id="back" class="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const quiz=[['The energy stored in an ideal spring due to deformation is called:',['elastic potential energy','kinetic energy','thermal energy','chemical energy'],0],['Elastic potential energy of an ideal spring is:',['½kx²','kx','½mv²','mgh'],0],['The spring constant is measured in:',['N/m','J/m','N·m','kg/m'],0],['For a spring obeying Hooke’s law, force magnitude is proportional to:',['extension','extension squared','inverse extension','mass only'],0],['If extension is doubled, the stored spring energy becomes:',['four times','twice','half','unchanged'],0],['A spring with k=100 N/m is stretched by 0.2 m. Energy stored is:',['2 J','4 J','10 J','20 J'],0],['If k is tripled while extension stays fixed, spring energy becomes:',['three times','nine times','one third','unchanged'],0],['The restoring force of an ideal spring acts:',['opposite to displacement','along displacement always','perpendicular to displacement','in a random direction'],0],['At zero deformation from natural length, ideal spring potential energy is:',['zero','maximum','negative','infinite'],0],['The work required to slowly stretch an ideal spring from 0 to x is:',['½kx²','kx²','kx','2kx²'],0],['When a compressed spring is released, stored elastic energy can transform into:',['kinetic energy','mass','charge','momentum only'],0],['A spring stores 8 J at extension x. At extension 2x it stores:',['32 J','16 J','8 J','4 J'],0],['The slope of a force-extension graph for an ideal spring is:',['spring constant','spring energy','mass','velocity'],0],['A stiffer spring has:',['larger spring constant','smaller spring constant','zero spring constant','no restoring force'],0],['Which statement is correct?',['Spring energy is always non-negative for an ideal spring','Spring energy is proportional to x','Spring energy is measured in newtons','Spring energy depends only on mass'],0]];let i=0,s=-1,score=0,checked=false;const $=x=>document.getElementById(x);function render(){let a=quiz[i];s=-1;checked=false;$('count').textContent='Question '+(i+1)+' of 15';$('question').textContent=a[0];$('options').innerHTML='';$('feedback').textContent='';$('feedback').className='feedback';$('continue').style.display='inline-block';$('continue').textContent=i===14?'Finish Skill →':'Continue →';let order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k;k--){let r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((x,j)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{s=x.index;[...$('options').children].forEach(z=>z.classList.remove('selected'));b.classList.add('selected')};$('options').appendChild(b)})}$('continue').onclick=()=>{if(!checked){if(s<0){$('feedback').className='feedback bad';$('feedback').textContent='Choose an answer first 👆';return}checked=true;let a=quiz[i],ok=s===a[2];[...$('options').children].forEach(b=>{let x=+b.dataset.index;b.disabled=true;if(x===a[2])b.classList.add('correct');if(x===s&&!ok)b.classList.add('wrong')});if(ok){score++;$('feedback').className='feedback good';$('feedback').textContent='🎯 Correct! +10 XP'}else{$('feedback').className='feedback bad';$('feedback').textContent='✗ Correct answer: '+a[1][a[2]]}$('xp').textContent=score*10;$('mastery').textContent=score+' / 15';$('fill').style.width=score/15*100+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$('question').textContent='🏆 Spring Energy Complete!';$('options').innerHTML='';$('continue').style.display='none';$('feedback').className='feedback good';$('feedback').textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};$('back').onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
