<script>
(function(){
'use strict';
const questions = [{"q":"For an ideal horizontal spring–mass oscillator, the restoring force is:","o":["F = −kx","F = k/x","F = mx","F = −k/x"],"a":0,"e":"Hooke's law states that the restoring force is proportional to displacement and opposite in direction."},{"q":"The time period of a mass m attached to a spring of constant k is:","o":["2π√(m/k)","2π√(k/m)","√(mk)","2πmk"],"a":0,"e":"For an ideal spring–mass oscillator, T = 2π√(m/k)."},{"q":"The angular frequency of a spring–mass system is:","o":["√(k/m)","√(m/k)","2π√(m/k)","k/m"],"a":0,"e":"From mẍ = −kx, ω² = k/m, so ω = √(k/m)."},{"q":"The SI unit of spring constant k is:","o":["N/m","N·m","kg/m","J/s"],"a":0,"e":"From F = kx, k = F/x and its SI unit is newton per metre."},{"q":"If the attached mass is quadrupled while k remains constant, the period becomes:","o":["Twice as large","Four times as large","Half as large","Unchanged"],"a":0,"e":"Since T ∝ √m, multiplying mass by four doubles the period."},{"q":"If the spring constant is multiplied by four while mass is fixed, the period becomes:","o":["Half as large","Twice as large","Four times as large","Unchanged"],"a":0,"e":"T ∝ 1/√k, so a fourfold increase in k halves T."},{"q":"The frequency of a spring–mass oscillator is:","o":["(1/2π)√(k/m)","2π√(k/m)","(1/2π)√(m/k)","√(mk)/(2π)"],"a":0,"e":"Frequency f = 1/T = (1/2π)√(k/m)."},{"q":"A 1 kg mass is attached to a spring with k = 4 N/m. Its angular frequency is:","o":["2 rad/s","4 rad/s","0.5 rad/s","π rad/s"],"a":0,"e":"ω = √(k/m) = √(4/1) = 2 rad/s."},{"q":"For m = 1 kg and k = 4 N/m, the period is:","o":["π s","2π s","1/π s","0.5 s"],"a":0,"e":"T = 2π√(1/4) = π s."},{"q":"At the equilibrium position of an ideal spring–mass oscillator, the spring force relative to equilibrium is:","o":["Zero","Maximum","Always equal to mg","Infinite"],"a":0,"e":"At equilibrium displacement x = 0, so the restoring force −kx is zero."},{"q":"At maximum displacement from equilibrium, the speed of an ideal oscillator is:","o":["Zero","Maximum","Half the maximum speed","Always equal to ωA/2"],"a":0,"e":"At each turning point, the mass momentarily stops before reversing direction."},{"q":"The speed of a spring–mass oscillator is maximum when it passes through:","o":["Equilibrium","Either turning point","A point beyond its amplitude","Every point equally"],"a":0,"e":"At equilibrium, spring potential energy is minimum and kinetic energy is maximum."},{"q":"The maximum acceleration magnitude of a spring–mass oscillator with amplitude A is:","o":["ω²A","ωA","A/ω","ω/A"],"a":0,"e":"Since a = −ω²x, the maximum magnitude occurs at |x| = A."},{"q":"The maximum speed of a spring–mass oscillator is:","o":["ωA","ω²A","A/ω","2ωA"],"a":0,"e":"For SHM, vmax = ωA."},{"q":"The total mechanical energy of an ideal spring–mass oscillator with amplitude A is:","o":["(1/2)kA²","kA²","(1/2)mA²","mωA"],"a":0,"e":"At a turning point all the energy is spring potential energy, E = ½kA²."},{"q":"If the amplitude doubles while m and k stay fixed, the total energy becomes:","o":["Four times as large","Twice as large","Half as large","Unchanged"],"a":0,"e":"Total energy is proportional to A²; doubling A multiplies energy by four."},{"q":"For an ideal horizontal spring–mass oscillator, the period is independent of:","o":["Amplitude","Mass","Spring constant","Both mass and spring constant"],"a":0,"e":"In the linear ideal model, T = 2π√(m/k) does not depend on amplitude."},{"q":"A mass makes 10 complete oscillations in 20 s. Its frequency is:","o":["0.5 Hz","2 Hz","10 Hz","20 Hz"],"a":0,"e":"f = number of oscillations/time = 10/20 = 0.5 Hz."},{"q":"If the period is 0.25 s, the frequency is:","o":["4 Hz","0.25 Hz","2 Hz","8 Hz"],"a":0,"e":"f = 1/T = 1/0.25 = 4 Hz."},{"q":"For a vertical spring at its static equilibrium, adding a mass m causes an extension x. The spring constant is:","o":["mg/x","mx/g","gx/m","m/(gx)"],"a":0,"e":"At static equilibrium, kx = mg, hence k = mg/x."},{"q":"For a vertical spring–mass oscillator, gravity changes the equilibrium position but, for an ideal linear spring, the period is:","o":["2π√(m/k)","2π√(k/m)","2π√(g/m)","2π√(m/g)"],"a":0,"e":"Gravity shifts the equilibrium extension; oscillations about that equilibrium still have ω = √(k/m)."},{"q":"A spring of k = 100 N/m holds a mass of 1 kg. Its frequency is closest to:","o":["1.59 Hz","10 Hz","3.18 Hz","0.50 Hz"],"a":0,"e":"f = (1/2π)√(100/1) = 10/(2π) ≈ 1.59 Hz."},{"q":"If the mass is reduced to one-quarter while k remains fixed, the frequency becomes:","o":["Twice as large","Half as large","One-quarter as large","Unchanged"],"a":0,"e":"f ∝ 1/√m, so reducing m to one-quarter doubles the frequency."},{"q":"A spring exerts a restoring force of 6 N when stretched 0.03 m. Its spring constant is:","o":["200 N/m","18 N/m","2 N/m","0.005 N/m"],"a":0,"e":"k = F/x = 6/0.03 = 200 N/m."},{"q":"In SHM, the acceleration of a spring–mass oscillator is related to displacement by:","o":["a = −(k/m)x","a = +(k/m)x","a = −(m/k)x","a = kx²/m"],"a":0,"e":"Newton's second law and Hooke's law give ma = −kx, hence a = −(k/m)x."},{"q":"Which condition makes the ideal spring–mass motion simple harmonic?","o":["Restoring force is linear in displacement and opposite in direction","Force is constant at every position","Friction always dominates","The mass changes continuously"],"a":0,"e":"A restoring force F = −kx produces acceleration proportional and opposite to displacement."},{"q":"At the equilibrium point, the ideal oscillator's total mechanical energy is:","o":["All kinetic energy","All spring potential energy","Zero for any nonzero amplitude","Always half kinetic and half potential"],"a":0,"e":"At equilibrium x = 0, spring potential energy is zero and speed is maximum."},{"q":"At a turning point, the ideal oscillator's energy is:","o":["All spring potential energy","All kinetic energy","Half kinetic and half potential in every case","Zero"],"a":0,"e":"At maximum displacement, speed is zero and the energy is stored in the spring."},{"q":"If both m and k are multiplied by the same factor, the period:","o":["Remains unchanged","Multiplies by that factor","Divides by that factor","Becomes zero"],"a":0,"e":"The ratio m/k remains constant, so T = 2π√(m/k) is unchanged."},{"q":"A mass–spring oscillator has T = 2 s. If k is increased to nine times its original value with m unchanged, the new period is:","o":["2/3 s","6 s","18 s","1/3 s"],"a":0,"e":"T ∝ 1/√k, so the new period is 2/√9 = 2/3 s."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Spring-Mass System Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');

   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }

});
render();
})();
