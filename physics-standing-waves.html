<section class="hero"><h1>〰️ Standing Waves</h1><p class="muted">Practice nodes, antinodes, fixed-end strings, harmonics, frequencies, and standing-wave equations with 30 questions.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>

<script>
(function(){
'use strict';
const questions = [{"q":"A standing wave is commonly formed by…","o":["Two waves of the same frequency and amplitude travelling in opposite directions","One pulse travelling in one direction only","Two waves with unrelated frequencies","A wave that has no oscillations"],"a":0,"e":"A standing wave can form when two similar waves travel in opposite directions and superpose."},{"q":"In an ideal standing wave, the pattern…","o":["Has fixed nodes and antinodes","Travels bodily along the medium at the wave speed","Has no points of zero displacement","Always increases its wavelength"],"a":0,"e":"The nodes and antinodes remain at fixed positions, unlike the travelling pattern of a progressive wave."},{"q":"A node in a standing wave is a point where the displacement amplitude is…","o":["Maximum","Zero","Half the maximum everywhere","Always increasing"],"a":1,"e":"At a node, the interfering waves cancel so the displacement remains zero in the ideal model."},{"q":"An antinode is a point where the displacement amplitude is…","o":["Zero","Maximum","Always negative","Equal to the wavelength"],"a":1,"e":"At an antinode, the two waves reinforce and the displacement amplitude is maximum."},{"q":"The distance between two adjacent nodes in a standing wave is…","o":["\\(\\lambda/4\\)","\\(\\lambda/2\\)","\\(\\lambda\\)","\\(2\\lambda\\)"],"a":1,"e":"Adjacent nodes are separated by half a wavelength: \\(d=\\lambda/2\\)."},{"q":"The distance between an adjacent node and antinode is…","o":["\\(\\lambda/4\\)","\\(\\lambda/2\\)","\\(\\lambda\\)","\\(2\\lambda\\)"],"a":0,"e":"A node and its nearest antinode are separated by one-quarter wavelength."},{"q":"The distance between two adjacent antinodes is…","o":["\\(\\lambda/4\\)","\\(\\lambda/2\\)","\\(\\lambda\\)","\\(2\\lambda\\)"],"a":1,"e":"Adjacent antinodes, like adjacent nodes, are separated by \\(\\lambda/2\\)."},{"q":"In a standing wave, particles between adjacent nodes oscillate…","o":["With the same phase","In opposite phases to their neighbours at every point","At unrelated frequencies","Without any displacement"],"a":0,"e":"All particles in one loop between adjacent nodes oscillate in phase; neighbouring loops oscillate in opposite phase."},{"q":"Particles in two neighbouring loops of a standing wave oscillate…","o":["In phase","In opposite phase","At twice the frequency","Only in one direction"],"a":1,"e":"Adjacent loops are separated by a node and oscillate in opposite phase."},{"q":"A standing wave transfers energy along the medium on average in the ideal steady pattern…","o":["With continuous net energy flow in one direction","With no net energy flow along the pattern","Only from right to left","At an infinite speed"],"a":1,"e":"A standing wave has no net average energy transfer along the medium in the ideal steady-state description."},{"q":"For a string fixed at both ends, the fundamental mode has…","o":["One loop (one antinode)","Two internal nodes and no antinodes","Two loops","Four antinodes"],"a":0,"e":"The fundamental mode has nodes at the ends and one antinode at the centre: half a wavelength fits along the string."},{"q":"For a string of length L fixed at both ends, the allowed wavelengths satisfy…","o":["\\(L=n\\lambda/2\\)","\\(L=n\\lambda\\) for all modes","\\(L=\\lambda/(2n)\\)","\\(L=2n\\lambda\\)"],"a":0,"e":"For the nth harmonic, \\(L=n\\lambda_n/2\\), so \\(\\lambda_n=2L/n\\)."},{"q":"The fundamental wavelength for a string of length L fixed at both ends is…","o":["\\(L\\)","\\(2L\\)","\\(L/2\\)","\\(4L\\)"],"a":1,"e":"For the fundamental, n = 1, so \\(\\lambda_1=2L\\)."},{"q":"The fundamental frequency of a string of length L with wave speed v and fixed ends is…","o":["\\(v/L\\)","\\(v/(2L)\\)","\\(2v/L\\)","\\(v/(4L)\\)"],"a":1,"e":"Using \\(f=v/\\lambda\\) and \\(\\lambda_1=2L\\), we get \\(f_1=v/(2L)\\)."},{"q":"The nth harmonic frequency for a string fixed at both ends is…","o":["\\(f_n=nf_1\\)","\\(f_n=f_1/n\\)","\\(f_n=n^2f_1\\)","\\(f_n=f_1\\) for all n"],"a":0,"e":"For an ideal string, \\(f_n=nv/(2L)=nf_1\\)."},{"q":"A string has fundamental frequency 100 Hz. Its third harmonic frequency is…","o":["100 Hz","200 Hz","300 Hz","600 Hz"],"a":2,"e":"\\(f_3=3f_1=3\\times100=300\\,\\text{Hz}\\)."},{"q":"For a string fixed at both ends, the second harmonic contains how many antinodes?","o":["One","Two","Three","Four"],"a":1,"e":"The nth harmonic has n antinodes, so the second harmonic has two."},{"q":"A standing wave is described by \\(y=2A\\sin(kx)\\cos(\\omega t)\\). Its amplitude at position x is…","o":["\\(2A|\\sin(kx)|\\)","\\(A\\cos(\\omega t)\\)","\\(2A\\omega\\)","\\(kx\\)"],"a":0,"e":"The time-dependent factor is \\(\\cos(\\omega t)\\); the position-dependent amplitude magnitude is \\(2A|\\sin(kx)|\\)."},{"q":"For the standing wave \\(y=2A\\sin(kx)\\cos(\\omega t)\\), nodes occur where…","o":["\\(\\sin(kx)=0\\)","\\(\\cos(\\omega t)=0\\) only","\\(\\sin(kx)=1\\)","\\(\\omega=0\\)"],"a":0,"e":"Nodes have zero amplitude at all times, so \\(\\sin(kx)=0\\), giving \\(kx=n\\pi\\)."},{"q":"For the standing wave \\(y=2A\\sin(kx)\\cos(\\omega t)\\), antinodes occur where…","o":["\\(|\\sin(kx)|=1\\)","\\(\\sin(kx)=0\\)","\\(\\cos(\\omega t)=0\\) always","\\(x=0\\) only"],"a":0,"e":"Antinodes have maximum amplitude when \\(|\\sin(kx)|=1\\)."},{"q":"Two waves each of amplitude A combine to form a standing wave. The maximum amplitude at an antinode is…","o":["\\(A\\)","\\(2A\\)","\\(A/2\\)","\\(0\\)"],"a":1,"e":"At an antinode, the two equal-amplitude waves reinforce, producing maximum amplitude \\(2A\\)."},{"q":"At every node of an ideal standing wave, the displacement is…","o":["Always zero","Always maximum","Always equal to A","Different at every instant"],"a":0,"e":"A node is a fixed point of zero displacement at all times."},{"q":"A string of length 1.2 m is fixed at both ends. Its fundamental wavelength is…","o":["0.6 m","1.2 m","2.4 m","4.8 m"],"a":2,"e":"For a fixed-fixed string, \\(\\lambda_1=2L=2.4\\,\\text{m}\\)."},{"q":"A string of length 0.8 m has wave speed 160 m/s. Its fundamental frequency is…","o":["50 Hz","100 Hz","200 Hz","400 Hz"],"a":1,"e":"\\(f_1=v/(2L)=160/(1.6)=100\\,\\text{Hz}\\)."},{"q":"The third harmonic on a string fixed at both ends has wavelength…","o":["\\(2L\\)","\\(L\\)","\\(2L/3\\)","\\(L/3\\)"],"a":2,"e":"\\(\\lambda_n=2L/n\\), so for n = 3, \\(\\lambda_3=2L/3\\)."},{"q":"At a node, the two component waves forming a standing wave have…","o":["Equal and opposite displacements","Always equal positive displacements","Different frequencies","No relationship"],"a":0,"e":"At a node, the component waves cancel at all times, giving zero resultant displacement."},{"q":"At an antinode, the component waves produce…","o":["Complete cancellation at all times","Maximum reinforcement of displacement amplitude","No oscillation","A permanent displacement only"],"a":1,"e":"At an antinode, the component waves reinforce, creating the largest possible oscillation amplitude."},{"q":"For an ideal string, if its length is doubled while wave speed remains constant, its fundamental frequency…","o":["Doubles","Halves","Quadruples","Remains the same"],"a":1,"e":"Since \\(f_1=v/(2L)\\), doubling L halves the fundamental frequency."},{"q":"If the wave speed on a fixed-length string doubles, the fundamental frequency…","o":["Halves","Doubles","Remains unchanged","Becomes four times larger"],"a":1,"e":"Since \\(f_1=v/(2L)\\), the fundamental frequency is directly proportional to wave speed."},{"q":"Which statement distinguishes a standing wave from a progressive wave?","o":["Its nodes and antinodes remain at fixed positions","It always transfers energy continuously in one direction","Its wavelength must be zero","Its particles do not oscillate"],"a":0,"e":"A standing wave has fixed nodes and antinodes and no net average energy transport along the ideal pattern."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
const wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Standing Waves Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
