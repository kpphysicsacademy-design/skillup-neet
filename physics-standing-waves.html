<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Standing Waves</title><style>body{font-family:Arial,sans-serif;background:#f3f7ff;margin:0;color:#1e293b}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(30,41,59,.1);border:1px solid #e2e8f0}h1{text-align:center;color:#334155}.meta{display:flex;justify-content:space-between;font-weight:700;color:#475569}.bar{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#22c55e;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;color:#172033}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe4f0;border-radius:14px;background:#fff;color:#1e293b;font-size:16px;cursor:pointer;transition:.2s}.opt:hover{background:#eef5ff;border-color:#93c5fd;transform:translateY(-1px)}.correct{border-color:#16a34a!important;background:#ecfdf3!important;color:#166534!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important;color:#991b1b!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#4f46e5;color:#fff}.back{background:#334155;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#d97706;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>〰️ Standing Waves</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>
const qs=[
['A standing wave is formed by','one travelling wave only','superposition of two identical waves travelling in opposite directions','two waves of different frequencies only','reflection without interference',1,'A standing wave results from superposition of two waves of the same frequency and amplitude travelling in opposite directions.'],
['In a standing wave, points of zero displacement are called','antinodes','crests','nodes','troughs',2,'Nodes are points where the displacement remains zero.'],
['Points of maximum amplitude in a standing wave are called','nodes','antinodes','equilibrium points','sources',1,'Antinodes are points of maximum displacement amplitude.'],
['The distance between two successive nodes is','λ/4','λ/2','λ','2λ',1,'Successive nodes are separated by λ/2.'],
['The distance between a node and its nearest antinode is','λ/4','λ/2','λ','2λ',0,'A node and adjacent antinode are separated by λ/4.'],
['In a standing wave, there is','continuous net energy transfer along the medium','no net energy transfer along the medium','only transverse energy transfer','energy transfer at nodes only',1,'A standing wave stores and exchanges energy locally but has no net energy transport along the medium.'],
['Particles between two adjacent nodes vibrate','with different frequencies','in phase with one another','always at rest','randomly',1,'Particles within the same loop between adjacent nodes vibrate in phase.'],
['Particles in two adjacent loops of a standing wave vibrate','in phase','with a phase difference of π','with zero amplitude','at the same position always',1,'Adjacent loops oscillate in opposite phase, giving a phase difference of π.'],
['For a string fixed at both ends, the fundamental wavelength is','L','2L','L/2','4L',1,'For the fundamental mode, L=λ/2, so λ=2L.'],
['For a string fixed at both ends, the nth harmonic frequency is','nf₁','f₁/n','n²f₁','f₁+n',0,'For an ideal stretched string fixed at both ends, fₙ=nf₁.'],
['A string of length L fixed at both ends has fundamental frequency f. Its second harmonic is','f/2','f','2f','4f',2,'The second harmonic has frequency 2f.'],
['For a pipe closed at one end, the fundamental wavelength is','L','2L','4L','L/2',2,'For the fundamental mode of a closed pipe, L=λ/4, so λ=4L.'],
['A closed pipe supports','all harmonics','only even harmonics','only odd harmonics','no harmonics',2,'An ideal pipe closed at one end supports odd harmonics: 1st, 3rd, 5th, etc.'],
['If the wavelength of a standing wave is 2 m, the distance between successive nodes is','0.25 m','0.5 m','1 m','2 m',2,'Successive nodes are λ/2 apart = 2/2 = 1 m.'],
['Which statement is correct for a standing wave?','Amplitude is maximum at nodes','All particles have the same amplitude','Nodes remain stationary while antinodes have maximum amplitude','There are no fixed nodes',2,'Nodes have zero amplitude and antinodes have maximum amplitude; the pattern remains fixed in space.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent=''}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide')}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('next').onclick=next;render();</script></body></html>
