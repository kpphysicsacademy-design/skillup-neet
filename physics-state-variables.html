<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | State Variables — 15 MCQ Quiz</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#203040;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:22px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:#123b70}.xp{font-weight:950;color:#1677ff}.hero{margin-top:14px;background:linear-gradient(135deg,#123b70,#1677ff);color:#fff;border-radius:24px;padding:22px}.hero h1{margin:5px 0 7px;font-size:clamp(28px,6vw,40px)}.hero p{margin:0;line-height:1.5;font-size:13px}.card{background:#fff;border:1px solid #d9e5f2;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 7px 20px rgba(18,59,112,.07)}.bar{height:10px;background:#e5edf6;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;width:0;background:#1677ff;transition:.3s}.qno{font-size:12px;color:#6b7280;font-weight:900}.q{font-size:20px;font-weight:900;line-height:1.4;margin:9px 0 16px}button.opt{display:block;width:100%;text-align:left;background:#fff;color:#203040;border:2px solid #dfe8f1;border-radius:14px;padding:14px;margin:10px 0;font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}button.opt.selected{border-color:#1677ff;background:#eef6ff;color:#123b70}button.opt.correct{border-color:#16803a;background:#eaf8ef;color:#145c2e}button.opt.wrong{border-color:#d64545;background:#fff0f0;color:#8f2020}button.continue{border:0;border-radius:13px;padding:12px 20px;background:#1677ff;color:#fff;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #0d5bbf}button.continue:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}.actions{display:flex;justify-content:flex-end;margin-top:15px}.feedback{min-height:25px;margin-top:13px;font-weight:800}.explain{margin-top:6px;color:#596774;font-weight:600}.back{display:block;width:max-content;margin:18px auto 0;padding:10px 15px;border:2px solid #d9e5f2;border-radius:12px;background:#fff;color:#1264d6;text-decoration:none;font-weight:900}.result{text-align:center}.score{font-size:34px;font-weight:950;color:#123b70}@media(max-width:520px){.wrap{padding:15px 10px 50px}.q{font-size:18px}button.opt{font-size:14px;padding:13px}}</style></head><body><main class="wrap"><div class="top"><div class="brand">⚛️ SkillUp Physics<br><small>NEET 2026 • 15 MCQ QUIZ</small></div><div class="xp" id="xp">XP: 0</div></div><section class="hero"><div>🔥 THERMODYNAMICS</div><h1>State Variables</h1><p>15-question MCQ quiz. Select one answer, check instantly, and build mastery.</p></section><section class="card"><strong>🏆 Quiz Progress <span id="mastery">0 / 15</span></strong><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card" id="quiz"><div class="qno" id="qno"></div><div class="q" id="question"></div><div id="opts"></div><div class="actions"><button class="continue" id="continue" type="button" disabled>Check Answer →</button></div><div class="feedback" id="feedback"></div></section><section class="card result" id="result" hidden></section><a class="back" href="physics-home-fast.html">← 📚 Back to Physics Path</a></main><script>const questions=[
{q:'Which of the following is a thermodynamic state variable?',o:['Heat supplied','Work done','Pressure','Path length'],a:2,e:'Pressure is a state variable because its value depends only on the thermodynamic state, not on the path taken.'},
{q:'Which pair contains only state functions?',o:['Heat and work','Internal energy and enthalpy','Heat and entropy transfer','Work and heat capacity along a path'],a:1,e:'Internal energy and enthalpy are state functions; their changes depend only on initial and final states.'},
{q:'A state variable is a quantity whose value depends on',o:['the path followed','only the initial state','the thermodynamic state','the time taken'],a:2,e:'A state variable is determined by the state of the system and is independent of the process path.'},
{q:'Which quantity is NOT a state function?',o:['Temperature','Pressure','Volume','Work'],a:3,e:'Work depends on the process path and is therefore not a state function.'},
{q:'For a fixed amount of ideal gas, which set can specify its equilibrium state?',o:['Pressure and temperature','Heat and work','Work and time','Path and heat'],a:0,e:'For a fixed amount of ideal gas, two independent state variables such as P and T specify the state.'},
{q:'The change in a state function between two equilibrium states is',o:['path dependent','independent of path','always zero','always positive'],a:1,e:'A state-function change depends only on the initial and final equilibrium states.'},
{q:'Which symbol commonly represents internal energy?',o:['Q','W','U','H'],a:2,e:'U is conventionally used for the internal energy of a thermodynamic system.'},
{q:'Which of the following is an intensive state variable?',o:['Mass','Volume','Temperature','Total internal energy'],a:2,e:'Temperature is intensive because it does not depend on the amount of substance.'},
{q:'Which of the following is an extensive property?',o:['Pressure','Temperature','Density','Volume'],a:3,e:'Volume scales with the amount of matter and is therefore an extensive property.'},
{q:'For a simple compressible system, pressure, volume and temperature are examples of',o:['path functions','state variables','transfer quantities','process coordinates only'],a:1,e:'P, V and T are common thermodynamic state variables.'},
{q:'If a system returns to its original state after a cycle, the net change in any state function is',o:['positive','negative','zero','infinite'],a:2,e:'A state function has the same value at the initial and final state, so its cyclic change is zero.'},
{q:'Which statement about heat is correct?',o:['Heat is a state variable','Heat is a path function','Heat is always stored in a system','Heat is independent of process'],a:1,e:'Heat is energy transferred because of a temperature difference and its amount depends on the process path.'},
{q:'Which statement about work is correct?',o:['Work is a state variable','Work is path dependent','Work is an intensive property','Work is always zero in a closed system'],a:1,e:'The work transferred during a process depends on how the system moves between states.'},
{q:'Two systems have the same temperature and pressure but different amounts of the same substance. Their volume may be different because volume is',o:['intensive','extensive','dimensionless','a path function'],a:1,e:'Volume depends on the amount of substance, so it is an extensive property.'},
{q:'A thermodynamic process is best represented as a change from',o:['one state to another state','one unit to another unit','one dimension to another','one material to another'],a:0,e:'A process describes the change of a system from an initial thermodynamic state to a final state.'}
];let i=0,selected=null,checked=false,score=0;const $=id=>document.getElementById(id);function render(){selected=null;checked=false;$('feedback').textContent='';$('continue').disabled=true;$('continue').textContent=i===14?'Finish Quiz →':'Check Answer →';$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=questions[i].q;$('opts').innerHTML='';questions[i].o.forEach((text,n)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+n)+'. '+text;b.onclick=()=>{if(checked)return;selected=n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('continue').disabled=false};b.dataset.index=n;$('opts').appendChild(b)});$('mastery').textContent=`${i} / 15`;$('fill').style.width=`${i/15*100}%`;$('xp').textContent=`XP: ${score*10}`}function next(){if(selected===null)return;if(!checked){checked=true;const item=questions[i],ok=selected===item.a;if(ok)score++;document.querySelectorAll('.opt').forEach(b=>{const n=+b.dataset.index;b.disabled=true;if(n===item.a)b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+`<div class="explain">${item.e}</div>`;$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=`${(i+1)/15*100}%`;$('xp').textContent=`XP: ${score*10}`}else if(i<14){i++;render()}else finish()}function finish(){$('quiz').hidden=true;$('result').hidden=false;const pct=Math.round(score/15*100);$('result').innerHTML=`<h2>🎉 State Variables Complete!</h2><div class="score">${score} / 15</div><p><strong>${pct}%</strong> accuracy</p><p>🏆 You earned <strong>${score*10} XP</strong>.</p><p>${score>=12?'🔥 Excellent NEET readiness!':score>=9?'💪 Good work. Revise and retry for mastery.':'📚 Revise state variables and try again.'}</p><button class="continue" type="button" onclick="location.reload()">Retry 15 MCQs</button>`}$('continue').onclick=next;render();</script></body></html>
