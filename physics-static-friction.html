<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.nav{max-width:720px;margin:auto;min-height:58px;padding:9px 14px;display:flex;align-items:center;gap:10px}

.xp{margin-left:auto;background:#fff4cf;border:1px solid #f4df9a;border-radius:99px;padding:7px 10px;font-weight:900;font-size:13px}
main{max-width:720px;margin:auto;padding:18px 13px 48px}
.hero,.quiz,.finish{background:#fff;border:2px solid #e2edf7;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 #dce8f3}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#174a78}.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}
.progress-row{display:flex;justify-content:space-between;gap:10px;margin:16px 0 7px;font-size:12px;font-weight:900;color:var(--muted)}

.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

}

}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>📏 Static Friction</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
  {
    "q": "What is static friction?",
    "o": [
      "Force opposing the tendency of surfaces to slide",
      "Force that always speeds an object up",
      "Gravity acting on an object",
      "Air pressure on a surface"
    ],
    "a": 0,
    "e": "Static friction prevents relative sliding while the surfaces remain at rest with respect to each other."
  },
  {
    "q": "A book rests on a horizontal table. Which statement about friction is correct?",
    "o": [
      "Static friction must equal the book's weight",
      "Static friction is zero if no horizontal force tends to move it",
      "Kinetic friction acts continuously",
      "Friction always acts to the right"
    ],
    "a": 1,
    "e": "With no horizontal tendency to slide, the static friction force can be zero."
  },
  {
    "q": "Static friction acts in which direction?",
    "o": [
      "Always upward",
      "Always opposite gravity",
      "Opposite the impending relative motion",
      "Always in the direction of motion"
    ],
    "a": 2,
    "e": "Static friction opposes the tendency of relative sliding between contacting surfaces."
  },
  {
    "q": "The magnitude of static friction before slipping is:",
    "o": [
      "Always equal to its maximum value",
      "Always zero",
      "Self-adjusting up to a maximum",
      "Always equal to kinetic friction"
    ],
    "a": 2,
    "e": "Static friction matches the applied tangential force as needed, up to its limiting value."
  },
  {
    "q": "The maximum value of static friction is called:",
    "o": [
      "Viscous drag",
      "Limiting friction",
      "Buoyant force",
      "Rolling resistance"
    ],
    "a": 1,
    "e": "Limiting friction is the largest static friction force just before sliding begins."
  },
  {
    "q": "The limiting static friction is given by:",
    "o": [
      "fₛ,max = μₛN",
      "fₛ,max = N/μₛ",
      "fₛ,max = mg/μₛ",
      "fₛ,max = μₛ/N"
    ],
    "a": 0,
    "e": "The maximum static friction equals the coefficient of static friction times the normal reaction."
  },
  {
    "q": "In fₛ,max = μₛN, μₛ represents:",
    "o": [
      "Coefficient of static friction",
      "Mass of the object",
      "Normal force",
      "Coefficient of restitution"
    ],
    "a": 0,
    "e": "μₛ is the coefficient of static friction and has no units."
  },
  {
    "q": "The coefficient of static friction is:",
    "o": [
      "Measured in newtons",
      "Measured in kilograms",
      "Dimensionless",
      "Measured in metres"
    ],
    "a": 2,
    "e": "It is a ratio of forces, so its units cancel."
  },
  {
    "q": "For a block on a level surface with no other vertical forces, the normal reaction is:",
    "o": [
      "Zero",
      "Equal to mg",
      "Equal to μₛmg always",
      "Less than zero"
    ],
    "a": 1,
    "e": "Vertical equilibrium gives N = mg on a horizontal surface when no other vertical forces act."
  },
  {
    "q": "A 10 N horizontal force acts on a block, but the block remains at rest. The static friction magnitude is:",
    "o": [
      "0 N",
      "5 N",
      "10 N",
      "More than 10 N"
    ],
    "a": 2,
    "e": "At rest, static friction balances the applied horizontal force, provided the limiting value is not exceeded."
  },
  {
    "q": "A block has μₛ = 0.4 and normal reaction 50 N. Its maximum static friction is:",
    "o": [
      "12.5 N",
      "20 N",
      "50.4 N",
      "125 N"
    ],
    "a": 1,
    "e": "fₛ,max = μₛN = 0.4 × 50 = 20 N."
  },
  {
    "q": "If the applied force is smaller than the limiting friction, the block on a level surface:",
    "o": [
      "Must accelerate",
      "Can remain at rest",
      "Must move at constant speed",
      "Must fall vertically"
    ],
    "a": 1,
    "e": "Static friction can balance the applied force until its maximum value is reached."
  },
  {
    "q": "When does a block begin to slide?",
    "o": [
      "When applied force exceeds the maximum static friction",
      "When applied force is exactly zero",
      "Whenever normal force exists",
      "Only when gravity disappears"
    ],
    "a": 0,
    "e": "Sliding begins when the required friction exceeds the maximum available static friction."
  },
  {
    "q": "Which change usually increases the maximum static friction if N stays the same?",
    "o": [
      "Lowering μₛ",
      "Increasing μₛ",
      "Reducing contact area alone",
      "Removing the applied force"
    ],
    "a": 1,
    "e": "Since fₛ,max = μₛN, increasing μₛ raises the limiting friction."
  },
  {
    "q": "If the normal reaction doubles and μₛ stays constant, the limiting friction:",
    "o": [
      "Halves",
      "Stays the same",
      "Doubles",
      "Becomes zero"
    ],
    "a": 2,
    "e": "The limiting friction is directly proportional to the normal reaction."
  },
  {
    "q": "A box is pushed right but does not move. Static friction on the box acts:",
    "o": [
      "To the right",
      "To the left",
      "Vertically upward",
      "Vertically downward"
    ],
    "a": 1,
    "e": "The box tends to slide right, so static friction acts left to oppose that tendency."
  },
  {
    "q": "A person walks without slipping because static friction from the ground generally acts:",
    "o": [
      "As part of the forward propulsive force",
      "Only downward",
      "Always backward regardless of gait",
      "Only when running fast"
    ],
    "a": 0,
    "e": "The ground's static friction can provide forward traction during the push-off phase of walking."
  },
  {
    "q": "Why can tyres grip a road without slipping during normal rolling?",
    "o": [
      "Static friction can provide traction",
      "There is no normal reaction",
      "Kinetic friction is always larger",
      "Gravity is absent"
    ],
    "a": 0,
    "e": "When the tyre contact patch does not slide, static friction provides traction."
  },
  {
    "q": "Which statement compares static and kinetic friction correctly for many dry surfaces?",
    "o": [
      "Static coefficient is often greater than kinetic coefficient",
      "Kinetic coefficient is always zero",
      "Static friction is always larger than any applied force",
      "They must be equal"
    ],
    "a": 0,
    "e": "For many material pairs, μₛ is greater than μₖ, though this is not a universal law."
  },
  {
    "q": "If a block is already sliding, the friction is usually modeled as:",
    "o": [
      "Static friction",
      "Kinetic friction",
      "Limiting static friction",
      "No friction"
    ],
    "a": 1,
    "e": "Relative sliding is modeled using kinetic friction rather than static friction."
  },
  {
    "q": "A 5 kg block rests on a horizontal floor. Take g = 10 m/s² and μₛ = 0.3. The limiting friction is:",
    "o": [
      "5 N",
      "15 N",
      "30 N",
      "50 N"
    ],
    "a": 1,
    "e": "N = mg = 50 N, so fₛ,max = 0.3 × 50 = 15 N."
  },
  {
    "q": "A 4 kg block rests on a horizontal surface. With g = 10 m/s² and μₛ = 0.5, what is the maximum horizontal force it can withstand before sliding?",
    "o": [
      "8 N",
      "20 N",
      "40 N",
      "2 N"
    ],
    "a": 1,
    "e": "N = 4 × 10 = 40 N; limiting friction = 0.5 × 40 = 20 N."
  },
  {
    "q": "A horizontal force of 8 N is applied to a stationary block. The limiting static friction is 12 N. The friction force is:",
    "o": [
      "12 N",
      "20 N",
      "8 N",
      "0 N"
    ],
    "a": 2,
    "e": "Static friction adjusts to 8 N, opposing the applied force, because 8 N is below the 12 N limit."
  },
  {
    "q": "A block has limiting static friction 18 N. An applied force increases from 5 N to 15 N and the block stays still. The friction magnitude at 15 N is:",
    "o": [
      "18 N",
      "15 N",
      "3 N",
      "0 N"
    ],
    "a": 1,
    "e": "Static friction balances the applied force while it remains below the 18 N limit."
  },
  {
    "q": "If μₛ = 0.25 and N = 80 N, the limiting friction is:",
    "o": [
      "20 N",
      "32 N",
      "80.25 N",
      "320 N"
    ],
    "a": 0,
    "e": "fₛ,max = 0.25 × 80 = 20 N."
  },
  {
    "q": "A block is on a rough incline and remains at rest. Static friction acts along the plane:",
    "o": [
      "Down the plane in every case",
      "Up the plane in every case",
      "Opposing the tendency to slide along the plane",
      "Perpendicular to the plane"
    ],
    "a": 2,
    "e": "Its direction depends on the tendency of the block to move; for a block tending to slide down, friction acts up the plane."
  },
  {
    "q": "For a block at rest on an incline that tends to slide down, static friction points:",
    "o": [
      "Up the incline",
      "Down the incline",
      "Normal to the surface",
      "Vertically upward"
    ],
    "a": 0,
    "e": "The component of gravity along the plane tends to pull the block downward, so friction acts upward."
  },
  {
    "q": "The angle of repose θ for a simple block on an incline satisfies:",
    "o": [
      "tan θ = μₛ",
      "sin θ = μₛ²",
      "cos θ = 1/μₛ",
      "θ = μₛN"
    ],
    "a": 0,
    "e": "At impending slip, mg sin θ = μₛmg cos θ, so tan θ = μₛ."
  },
  {
    "q": "If μₛ = 1 for an ideal block on an incline, the angle of repose is:",
    "o": [
      "0°",
      "30°",
      "45°",
      "90°"
    ],
    "a": 2,
    "e": "tan θ = 1, hence θ = 45°."
  },
  {
    "q": "Which statement about contact area and dry static friction is most accurate in the basic model?",
    "o": [
      "Limiting friction is proportional to apparent contact area",
      "Limiting friction depends mainly on μₛ and N, not apparent area",
      "Friction is always zero for large areas",
      "Friction depends only on object colour"
    ],
    "a": 1,
    "e": "The elementary dry-friction model uses fₛ,max = μₛN and does not explicitly include apparent contact area."
  }
];
let index=0,score=0,streak=0,chosen=null,locked=false;
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Nice work!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><button class="btn" id="retry">Practice again</button>';
 $('finishSlot').replaceChildren(card);$('retry').addEventListener('click',()=>{index=0;score=0;streak=0;$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
