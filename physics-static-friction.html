<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Static Friction</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:flex-end}.xp{background:#fff;border:1px solid #dfe3ea;border-radius:14px;padding:7px 11px;font-weight:850}.intro{margin:24px 0 18px}.intro h1{margin:0 0 8px;font-size:2rem}.intro p{margin:0;color:#596273;line-height:1.55}.progress{height:12px;background:#e4e7ed;border-radius:99px;overflow:hidden;margin:20px 0}.fill{height:100%;width:0;background:#58cc02;transition:width .25s ease}.card{background:#fff;border-radius:22px;padding:26px;box-shadow:0 8px 24px rgba(23,32,51,.08)}.meta{font-size:.95rem;font-weight:800;color:#596273;margin-bottom:12px}.q{font-size:1.3rem;line-height:1.45;margin:0 0 20px}.options{display:grid;gap:10px}.option{padding:15px 16px;border:2px solid #dfe3ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;color:#172033;cursor:pointer;transition:.15s}.option:hover:not(:disabled){border-color:#58cc02;background:#f5fff0;transform:translateY(-1px)}.option.selected{border-color:#5146a5;background:#f1efff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#ff4b4b;background:#fff0f0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{padding:12px 18px;border:0;border-radius:13px;font:inherit;font-weight:850;cursor:pointer}.check,.retry{background:#58cc02;color:#fff}.next{background:#5146a5;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:16px;min-height:24px;font-weight:750;line-height:1.5}.good{color:#177b2f}.bad{color:#b02a37}.hint{color:#596273;font-size:.95rem}.result{display:none;text-align:center;margin-top:20px;padding-top:18px;border-top:1px solid #e5e7eb}.bottom-nav{text-align:center;margin-top:20px}.back{display:inline-block;color:#5146a5;font-weight:800;text-decoration:none;padding:9px 12px;border-radius:12px;transition:transform .15s,background .15s,box-shadow .15s}.back:hover{background:#eeeaff;transform:translateY(-1px);box-shadow:0 4px 12px rgba(81,70,165,.12)}.back:focus-visible{outline:3px solid #b9b0ff;outline-offset:2px}.back:active{transform:scale(.98)}@media(max-width:600px){.wrap{padding:20px 14px}.intro h1{font-size:1.65rem}.card{padding:20px}.q{font-size:1.15rem}}</style></head><body><main class="wrap"><div class="top"><span class="xp">⚡ <span id="xp">0</span> XP</span></div><section class="intro"><h1>🧲 Static Friction</h1><p>Master self-adjusting friction, limiting friction and equilibrium with 15 NEET-style MCQs.</p></section><div class="progress"><div id="fill" class="fill"></div></div><section class="card"><div class="meta"><span id="count">Question 1 of 15</span> • <span id="pct">7%</span></div><h2 id="q" class="q"></h2><div id="opts" class="options"></div><div class="actions"><button id="check" class="btn check" type="button">Check Answer</button><button id="next" class="btn next" type="button" disabled>Next Question →</button></div><div id="fb" class="feedback" aria-live="polite"></div><p class="hint">💡 Static friction adjusts only as much as needed, up to its limiting value.</p><div id="result" class="result"><h2>🏆 Skill Complete!</h2><p id="score"></p><button id="retry" class="btn retry" type="button">Retry Skill</button></div></section><div class="bottom-nav"><a class="back" href="#" onclick="return goBackToPhysicsPath()">← Back to Physics Path</a></div></main><script>(function(){'use strict';const KEY='skillupLastPhysicsPath';function rememberPath(){try{const r=document.referrer;if(!r)return;const u=new URL(r);if(u.origin!==location.origin)return;if(/(?:physics|full-physics)[^/]*path[^/]*\.html$/i.test(u.pathname)||/\/physics-home\.html$/i.test(u.pathname))sessionStorage.setItem(KEY,u.href)}catch(e){}}function goBackToPhysicsPath(){try{const saved=sessionStorage.getItem(KEY);if(saved){const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}}catch(e){}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false}window.goBackToPhysicsPath=goBackToPhysicsPath;rememberPath();const quiz=[['Static friction acts when two surfaces are:',['At rest relative to each other but tending to slip','Always sliding relative to each other','Not in contact','Separated by a vacuum'],0,'Static friction acts without relative sliding, while opposing the tendency of relative motion.'],['The magnitude of static friction is generally:',['Self-adjusting up to a maximum value','Always equal to μN','Always zero','Always greater than the applied force'],0,'Static friction takes the value required for equilibrium up to its limiting value.'],['The maximum possible value of static friction is called:',['Limiting friction','Kinetic friction','Rolling friction','Viscous force'],0,'Limiting friction is the maximum static friction just before slipping begins.'],['For a body on a horizontal surface, limiting friction is:',['μ_s N','μ_s/N','N/μ_s','μ_s+N'],0,'The limiting value is f_max = μ_s N.'],['If an applied horizontal force is 3 N and limiting friction is 8 N, the friction on a stationary block is:',['3 N opposite the applied force','8 N opposite the applied force','5 N in the applied direction','0 N'],0,'Static friction adjusts to 3 N because the applied force is below the limiting value.'],['If the applied force is increased to equal the limiting friction, the block is:',['Just about to start slipping','Moving with zero acceleration','Definitely moving at constant speed','Free of friction'],0,'At limiting friction the block is at the threshold of slipping.'],['If the applied force is less than limiting friction, the block can remain:',['At rest','Only in uniform circular motion','Only accelerating','In free fall'],0,'Static friction can balance the applied force while the block remains at rest.'],['Which statement about static friction is correct?',['It can be zero when there is no tendency of relative motion','It is always μ_s N','It always acts opposite the velocity','It exists only on inclined planes'],0,'Static friction is a response force and can be zero if no frictional force is required.'],['A 10 N block rests on a horizontal surface with μ_s = 0.4. Taking g-independent normal reaction N = 10 N, limiting friction is:',['4 N','2.5 N','10.4 N','0.4 N'],0,'f_max = μ_s N = 0.4 × 10 = 4 N.'],['A block has N = 50 N and μ_s = 0.2. The greatest horizontal force that can be applied without sliding is:',['10 N','25 N','50 N','0.2 N'],0,'The maximum static friction is 0.2 × 50 = 10 N.'],['If the normal reaction is doubled while μ_s remains unchanged, limiting friction:',['Doubles','Halves','Remains zero','Becomes independent of N'],0,'Because f_max = μ_s N, it is directly proportional to N.'],['For a block on a rough incline at the angle of repose θ, the coefficient of static friction is:',['tan θ','sin θ','cos θ','1/sin θ'],0,'At the limiting condition on an incline, μ_s = tan θ.'],['The direction of static friction is:',['Opposite the tendency of relative motion','Always vertically upward','Always horizontally left','Always opposite gravity'],0,'Its direction opposes the tendency of relative sliding between the surfaces.'],['Static friction is called a self-adjusting force because:',['Its value changes to match the required equilibrium force up to a limit','It always has the same value','It disappears when the body is heavy','It is independent of applied force'],0,'Static friction varies as needed until the limiting value is reached.'],['Which relation is correct for static friction?',['0 ≤ f_s ≤ μ_s N','f_s = μ_s N always','f_s > μ_s N always','f_s = N/μ_s always'],0,'Static friction ranges from zero to its maximum μ_s N.']];let i=0,sel=-1,score=0,locked=false;const $=id=>document.getElementById(id),q=$('q'),o=$('opts'),fb=$('fb'),check=$('check'),next=$('next'),xp=$('xp'),fill=$('fill'),count=$('count'),pct=$('pct');function render(){const a=quiz[i];sel=-1;locked=false;q.textContent=a[0];count.textContent='Question '+(i+1)+' of '+quiz.length;pct.textContent=Math.round((i+1)/quiz.length*100)+'%';fill.style.width=(score/quiz.length*100)+'%';fb.className='feedback';fb.textContent='';check.disabled=false;next.disabled=true;next.textContent='Next Question →';o.innerHTML='';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{if(locked)return;sel=item.index;Array.from(o.children).forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)})}check.onclick=function(){if(sel<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}locked=true;const a=quiz[i],ok=sel===a[2];Array.from(o.children).forEach(b=>{const originalIndex=Number(b.dataset.index);b.disabled=true;if(originalIndex===a[2])b.classList.add('correct');if(originalIndex===sel&&!ok)b.classList.add('wrong')});if(ok){score++;fb.className='feedback good';fb.textContent='🎯 Correct! '+a[3]+' +10 XP'}else{fb.className='feedback bad';fb.textContent='Not quite. '+a[3]+' Correct answer: '+a[1][a[2]]}xp.textContent=score*10;fill.style.width=(score/quiz.length*100)+'%';check.disabled=true;next.disabled=false;if(i===quiz.length-1)next.textContent='Finish Skill →'};next.onclick=function(){if(i<quiz.length-1){i++;render()}else{q.textContent='🏆 Static Friction Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+score+' / '+quiz.length+' correct • '+score*10+' XP';$('result').style.display='block';$('score').textContent=score+' / '+quiz.length+' correct • '+score*10+' XP'}};$('retry').onclick=()=>{i=0;sel=-1;score=0;locked=false;xp.textContent='0';fill.style.width='0%';$('result').style.display='none';check.style.display='';next.style.display='';render()};render()})();</script></body></html>
