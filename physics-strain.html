<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Strain</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#202124;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 16px 48px}.head{display:flex;justify-content:space-between;align-items:center}h1{font-size:28px;margin:0}.xp{font-weight:800;color:#16803a}.sub{color:#687078;margin:8px 0 20px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 2px 12px rgba(0,0,0,.06)}.master{font-weight:800}.bar{height:10px;background:#e8ecef;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#22a05a;transition:.3s}.qno{font-size:14px;color:#687078;font-weight:700}.q{font-size:20px;font-weight:800;line-height:1.4;margin:10px 0 18px}.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #e1e5e8;border-radius:13px;padding:14px;margin:10px 0;font-size:16px;cursor:pointer}.opt:hover{transform:translateY(-1px);background:#fafbfc}.opt.selected{border-color:#16803a;background:#f0faf4}.opt.correct{border-color:#16803a;background:#e9f8ef}.opt.wrong{border-color:#d64545;background:#fff0f0}.actions{display:flex;justify-content:flex-end;margin-top:18px}button{border:0;border-radius:13px;padding:13px 22px;background:#16803a;color:#fff;font-size:16px;font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.feedback{min-height:24px;margin-top:14px;font-weight:700}.explain{margin-top:6px;font-weight:500;color:#58616a}.back{display:block;width:max-content;margin:18px auto 0;padding:11px 16px;border:2px solid #d9dee3;border-radius:12px;background:#fff;color:#30363b;text-decoration:none;font-weight:800}.result{text-align:center}.score{font-size:30px;font-weight:900}@media(max-width:520px){h1{font-size:24px}.q{font-size:18px}}</style></head><body><main class="wrap"><div class="head"><h1>🧱 Strain</h1><div class="xp" id="xp">XP: 0</div></div><p class="sub">Deformation produced in a body by an applied force: longitudinal, volume and shear strain.</p><section class="card"><div class="master">🎯 Skill Mastery <span id="mastery">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card" id="quiz"><div class="qno" id="qno"></div><div class="q" id="question"></div><div id="opts"></div><div class="actions"><button id="continue" disabled>Continue →</button></div><div class="feedback" id="feedback"></div></section><section class="card result" id="result" hidden></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>const q=[['Strain is defined as the ratio of','change in dimension to original dimension','original dimension to change in dimension','force to area','stress to force',0,'Strain is deformation divided by original dimension.'],['The SI unit of strain is','pascal','newton','dimensionless (no unit)','metre',2,'Strain is a ratio and is dimensionless.'],['Longitudinal strain describes change in','mass','length','temperature only','density only',1,'It is change in length divided by original length.'],['If original length is L and extension is ΔL, strain is','L/ΔL','ΔL/L','LΔL','ΔL−L',1,'Longitudinal strain = ΔL/L.'],['A 2 m wire extends by 1 mm. Its strain is','5×10⁻⁴','2×10⁻³','5×10⁻³','2×10⁻⁴',0,'0.001/2 = 5×10⁻⁴.'],['Volume strain is the ratio of change in','length to original length','area to original area','volume to original volume','mass to original mass',2,'Volume strain = ΔV/V.'],['Shear strain is mainly associated with change in','shape','mass','temperature','chemical composition',0,'Shearing changes the shape of a body.'],['Strain is a','vector quantity','scalar dimensionless quantity','quantity with unit N','quantity with unit Pa',1,'Strain has magnitude only and no dimensions.'],['A tensile force on a wire generally causes','decrease in length','increase in length','no deformation','only a change in mass',1,'Tension tends to stretch a wire.'],['A compressive force generally causes','elongation','shortening','increase in mass','zero stress',1,'Compression tends to reduce the dimension.'],['A 100 cm wire becomes 101 cm long. Tensile strain is','0.001','0.01','1.01','100',1,'ΔL/L = 1/100 = 0.01.'],['For small elastic deformation, strain is generally','very large','small and dimensionless','equal to force','equal to Young modulus',1,'Elastic strains are normally small.'],['Poisson ratio relates','stress and strain','lateral and longitudinal strain','force and area','energy and power',1,'It is based on lateral and longitudinal strains.'],['For a small shear angle θ in radians, shear strain is approximately','sin θ','θ','1/θ','θ²',1,'For small angles γ≈θ.'],['A strain of 0.002 expressed as a percentage is','0.02%','0.2%','2%','20%',1,'0.002×100 = 0.2%.']];let i=0,s=null,score=0,checked=false,$=x=>document.getElementById(x);function render(){checked=false;s=null;$('feedback').innerHTML='';$('continue').disabled=true;$('continue').textContent=i==14?'Finish Skill →':'Continue →';$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=q[i][0];$('opts').innerHTML='';let a=q[i].slice(1,5).map((text,index)=>({text,index}));for(let k=3;k;k--){let r=Math.floor(Math.random()*(k+1));[a[k],a[r]]=[a[r],a[k]]}a.forEach((x,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{if(!checked){s=x.index;document.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));b.classList.add('selected');$('continue').disabled=false}};$('opts').appendChild(b)});$('mastery').textContent=`${i} / 15`;$('fill').style.width=`${i/15*100}%`}function next(){if(s===null)return;if(!checked){let a=q[i],ok=s===a[5];checked=true;if(ok){score++;$('xp').textContent=`XP: ${score*10}`}document.querySelectorAll('.opt').forEach(b=>{let n=+b.dataset.index;b.disabled=true;if(n===a[5])b.classList.add('correct');if(n===s&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+`<div class="explain">${a[6]}</div>`;$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=`${(i+1)/15*100}%`;if(i===14)$('continue').onclick=finish}else if(i<14){i++;render()}}function finish(){$('quiz').hidden=true;$('result').hidden=false;$('result').innerHTML=`<h2>🎉 Skill Complete!</h2><div class="score">${score} / 15</div><p>🏆 You earned <strong>${score*10} XP</strong>.</p><button onclick="location.reload()">Retry Skill</button>`}$('continue').onclick=next;$('back').onclick=function(){let s=sessionStorage.getItem('skillupLastPhysicsPath');if(s){try{let u=new URL(s,location.href);if(u.origin===location.origin){location.href=s;return false}}catch(e){}}if(document.referrer){try{let u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();</script></body></html>
