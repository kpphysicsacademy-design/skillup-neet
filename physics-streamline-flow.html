<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp | Streamline Flow — 15 MCQ Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#203040;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:22px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:#123b70}.xp{font-weight:950;color:#1677ff}.hero{margin-top:14px;background:linear-gradient(135deg,#123b70,#1677ff);color:#fff;border-radius:24px;padding:22px}.hero h1{margin:5px 0 7px;font-size:clamp(28px,6vw,40px)}.hero p{margin:0;line-height:1.5;font-size:13px}.card{background:#fff;border:1px solid #d9e5f2;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 7px 20px rgba(18,59,112,.07)}.master{font-weight:900}.bar{height:10px;background:#e5edf6;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;width:0;background:#1677ff;transition:.3s}.qno{font-size:12px;color:#6b7280;font-weight:900}.q{font-size:20px;font-weight:900;line-height:1.4;margin:9px 0 16px}button.opt{display:block;width:100%;text-align:left;background:#fff;color:#203040;border:2px solid #dfe8f1;border-radius:14px;padding:14px;margin:10px 0;font-size:15px;font-weight:750;line-height:1.35;cursor:pointer;appearance:none}button.opt:hover{border-color:#9bc3ed;background:#f8fbff}button.opt.selected{border-color:#1677ff;background:#eef6ff;color:#123b70}button.opt.correct{border-color:#16803a;background:#eaf8ef;color:#145c2e}button.opt.wrong{border-color:#d64545;background:#fff0f0;color:#8f2020}button.continue{border:0;border-radius:13px;padding:12px 20px;background:#1677ff;color:#fff;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #0d5bbf}button.continue:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}.actions{display:flex;justify-content:flex-end;margin-top:15px}.feedback{min-height:25px;margin-top:13px;font-weight:800}.explain{margin-top:6px;color:#596774;font-weight:600}.back{display:block;width:max-content;margin:18px auto 0;padding:10px 15px;border:2px solid #d9e5f2;border-radius:12px;background:#fff;color:#23415f;text-decoration:none;font-weight:900}.result{text-align:center}.score{font-size:34px;font-weight:950;color:#123b70}@media(max-width:520px){.wrap{padding:15px 10px 50px}.q{font-size:18px}button.opt{font-size:14px;padding:13px}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div class="brand">⚛️ SkillUp Physics<br><small>NEET 2026 • 15 MCQ QUIZ</small></div><div class="xp" id="xp">XP: 0</div></div>
<section class="hero"><div>🌊 NEET PRACTICE</div><h1>Streamline Flow</h1><p>Master steady fluid motion with 15 NEET-style questions, instant feedback and XP.</p></section>
<section class="card"><div class="master">🏆 Quiz Progress <span id="mastery">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section>
<section class="card" id="quiz"><div class="qno" id="qno"></div><div class="q" id="question"></div><div id="opts"></div><div class="actions"><button class="continue" id="continue" type="button" disabled>Check Answer →</button></div><div class="feedback" id="feedback"></div></section>
<section class="card result" id="result" hidden></section>
<a class="back" href="physics-home-fast.html">← 📚 Back to Physics Path</a>
</main>
<script>
const questions=[
{q:'In streamline flow, the velocity of a fluid particle at a given point is',o:['randomly changing with time','constant with time at that point','always zero','always equal to the speed of sound'],a:1,e:'In steady streamline flow, the velocity at a fixed point does not change with time.'},
{q:'A streamline is a curve whose tangent at any point gives the direction of',o:['pressure','fluid velocity','density','viscosity'],a:1,e:'The tangent to a streamline gives the instantaneous direction of fluid velocity.'},
{q:'Two streamlines in a steady fluid flow',o:['can cross at one point','cannot cross each other','must be parallel everywhere','always form circles'],a:1,e:'Streamlines cannot intersect because that would give two velocity directions at the same point.'},
{q:'For ideal streamline flow, a fluid particle',o:['follows a streamline','jumps randomly between streamlines','remains at rest','moves only vertically'],a:0,e:'The path followed by a fluid particle in steady flow coincides with a streamline.'},
{q:'Streamline flow is also commonly called',o:['laminar flow','turbulent flow','random flow','rotational flow only'],a:0,e:'Smooth, orderly fluid motion in layers is called streamline or laminar flow.'},
{q:'For incompressible steady flow through a pipe, the continuity equation is',o:['Av = constant','A/v = constant','A + v = constant','Av² = constant'],a:0,e:'Conservation of mass gives Av = constant for an incompressible fluid.'},
{q:'If the cross-sectional area of a pipe is reduced to half for incompressible steady flow, the fluid speed becomes',o:['half','double','four times','unchanged'],a:1,e:'Since Av is constant, halving A requires doubling v.'},
{q:'The SI unit of volume flow rate is',o:['m³ s⁻¹','m s⁻¹','N m⁻²','kg m⁻³'],a:0,e:'Volume flow rate is volume per time, so its SI unit is m³ s⁻¹.'},
{q:'For an incompressible fluid, mass flow rate through a section is',o:['ρAv','ρA/v','Av/ρ','ρv/A'],a:0,e:'Mass flow rate equals density × volume flow rate = ρAv.'},
{q:'In a horizontal pipe carrying an ideal fluid, where the speed is higher, the pressure is generally',o:['higher','lower','always zero','unchanged by speed'],a:1,e:'Bernoulli’s equation shows that for the same height, higher speed corresponds to lower static pressure.'},
{q:'Which condition favours streamline flow in a pipe?',o:['Low Reynolds number','Very high Reynolds number','Strong random eddies','Very large turbulence'],a:0,e:'Laminar or streamline flow is associated with relatively low Reynolds number.'},
{q:'Reynolds number is a dimensionless quantity used to compare',o:['inertial and viscous effects','mass and energy only','pressure and temperature only','gravity and charge'],a:0,e:'Reynolds number represents the relative importance of inertial and viscous forces in fluid flow.'},
{q:'If a fluid flows steadily through a pipe of uniform cross-section, its average speed is',o:['constant along the pipe','necessarily increasing','necessarily decreasing','always zero'],a:0,e:'For steady incompressible flow in a uniform pipe, continuity gives constant average speed.'},
{q:'A streamline pattern is most directly represented by',o:['lines tangent to the velocity field','lines of constant pressure only','lines of constant density only','random dots'],a:0,e:'Streamlines are drawn so that their tangents indicate the local velocity direction.'},
{q:'In a narrow section of an incompressible pipe, compared with a wider section, the fluid speed is',o:['greater','smaller','always equal','zero'],a:0,e:'Continuity requires Av to remain constant, so smaller area means greater speed.'}
];
let i=0,selected=null,checked=false,score=0;const $=id=>document.getElementById(id);
function render(){selected=null;checked=false;$('feedback').textContent='';$('continue').disabled=true;$('continue').textContent=i===14?'Finish Skill →':'Check Answer →';$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=questions[i].q;$('opts').innerHTML='';const c=questions[i].o.map((text,index)=>({text,index}));for(let k=c.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[c[k],c[r]]=[c[r],c[k]]}c.forEach((x,j)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{if(checked)return;selected=x.index;document.querySelectorAll('button.opt').forEach(z=>z.classList.remove('selected'));b.classList.add('selected');$('continue').disabled=false};$('opts').appendChild(b)});$('mastery').textContent=`${i} / 15`;$('fill').style.width=`${i/15*100}%`}
function next(){if(selected===null)return;if(!checked){checked=true;const item=questions[i],ok=selected===item.a;if(ok){score++;$('xp').textContent=`XP: ${score*10}`}document.querySelectorAll('button.opt').forEach(b=>{const n=Number(b.dataset.index);b.disabled=true;if(n===item.a)b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+`<div class="explain">${item.e}</div>`;$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=`${(i+1)/15*100}%`}else if(i<14){i++;render()}else finish()}
function finish(){$('quiz').hidden=true;$('result').hidden=false;const pct=Math.round(score/15*100);$('result').innerHTML=`<h2>🎉 Streamline Flow Quiz Complete!</h2><div class="score">${score} / 15</div><p><strong>${pct}%</strong> accuracy</p><p>🏆 You earned <strong>${score*10} XP</strong>.</p><p>${score>=12?'🔥 Excellent NEET readiness!':score>=9?'💪 Good work. Revise and retry for mastery.':'📚 Revise Streamline Flow and try again.'}</p><button class="continue" type="button" onclick="location.reload()">Retry 15 MCQs</button>`}
$('continue').onclick=next;render();
</script></body></html>
