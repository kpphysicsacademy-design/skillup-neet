<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Stress</title><style>body{margin:0;background:#f5f7f8;font-family:Arial,sans-serif;color:#17202a}.wrap{max-width:760px;margin:auto;padding:24px 16px 40px}.head{display:flex;justify-content:space-between;align-items:center}.head h1{font-size:28px;margin:0}.xp{font-weight:700}.sub{color:#65727e;margin:8px 0 18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 14px #0000000d}.bar{height:10px;background:#e8ecef;border-radius:10px;overflow:hidden}.fill{height:100%;width:0;background:#58b86b;transition:.3s}.qno{font-size:14px;color:#697680}.q{font-size:20px;font-weight:700;line-height:1.45}.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #dfe5e8;border-radius:12px;padding:13px 15px;margin:10px 0;font-size:16px;cursor:pointer;transition:.15s}.opt:hover{transform:translateY(-1px);border-color:#58b86b}.opt.selected{border-color:#58b86b;background:#f0fbf2}.opt.correct{border-color:#58b86b;background:#e9f8eb}.opt.wrong{border-color:#e26b6b;background:#fff0f0}.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:700;font-size:16px;cursor:pointer;background:#58b86b;color:#fff}.back{display:block;width:100%;text-align:center;margin-top:18px;background:#fff;color:#35434d;border:2px solid #dfe5e8}.back:hover{border-color:#58b86b;transform:translateY(-1px)}#feedback{min-height:24px;font-weight:700}.done{text-align:center}.score{font-size:28px;font-weight:800}</style></head><body><main class="wrap"><div class="head"><h1>💪 Stress</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></div><p class="sub">Normal, tangential and hydrostatic stress, force per unit area and stress–strain fundamentals.</p><section class="card"><b>🎯 Skill Mastery <span id="mastery">0 / 15</span></b><div class="bar"><div id="fill" class="fill"></div></div></section><section id="quiz" class="card"><div class="qno" id="qno"></div><p class="q" id="question"></p><div id="opts"></div><button id="continue" class="btn">Continue →</button><p id="feedback"></p></section><section id="done" class="card done" hidden><div class="score" id="score"></div><p>Great work! Your Stress skill has been practiced.</p><button class="btn" onclick="location.reload()">Retry 🔄</button></section><button id="back" class="btn back">← Back to Physics Path</button></main><script>const quiz=[['Stress in a body is defined as',['force × area','force per unit area','area per unit force','mass per unit volume'],1,'Stress is the internal restoring force per unit cross-sectional area.'],['The SI unit of stress is',['newton','pascal','joule','watt'],1,'The SI unit is pascal (Pa), equal to N m⁻².'],['1 Pa is equal to',['1 N m²','1 N/m²','1 kg/m²','1 J/s'],1,'One pascal equals one newton per square metre.'],['Normal stress acts',['parallel to the surface','perpendicular to the surface','only at the centre','only in fluids'],1,'Normal stress acts perpendicular to the cross-sectional area.'],['Tangential or shear stress acts',['perpendicular to the surface','parallel to the surface','without force','only in vacuum'],1,'Shear stress acts tangentially, parallel to the surface.'],['If a force F acts normally on area A, normal stress is',['FA','F/A','A/F','F+A'],1,'Normal stress σ = F/A.'],['For the same force, if the cross-sectional area is doubled, stress becomes',['double','half','four times','unchanged'],1,'Since stress is F/A, doubling A halves the stress.'],['A tensile stress tends to',['compress a body','stretch a body','twist only','remove mass'],1,'Tensile stress pulls material apart and tends to elongate it.'],['A compressive stress tends to',['stretch a body','shorten a body','increase temperature only','produce no deformation'],1,'Compressive stress pushes inward and tends to shorten the body.'],['Hydrostatic stress is associated with pressure acting',['in one direction only','equally in all directions','only tangentially','only at the surface'],1,'Hydrostatic pressure produces normal stress equally in all directions.'],['A force of 100 N acts on an area of 0.01 m². The stress is',['100 Pa','1000 Pa','10,000 Pa','1 Pa'],2,'σ = F/A = 100/0.01 = 10,000 Pa.'],['If the area of a wire is reduced while tensile force remains constant, tensile stress',['decreases','increases','becomes zero','is unchanged'],1,'Stress is inversely proportional to area for constant force.'],['Stress is a',['scalar only with no units','physical quantity having dimensions ML⁻¹T⁻²','dimensionless quantity','quantity with dimensions ML²T⁻²'],1,'Stress has the same dimensions as pressure: ML⁻¹T⁻².'],['Which is an example of shear stress?',['Pulling a wire along its length','Pushing a block parallel to its surface','Uniform pressure on a fluid','Heating a rod'],1,'A force parallel to a surface produces tangential or shear stress.'],['The internal restoring force developed in a deformed body acts to',['increase deformation indefinitely','oppose the deformation','remove all mass','make stress dimensionless'],1,'Elastic restoring forces oppose the applied deformation.']];let i=0,selected=null,score=0,checked=false;const $=id=>document.getElementById(id);function render(){selected=null;checked=false;$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=quiz[i][0];$('feedback').textContent='';$('continue').textContent='Continue →';$('opts').innerHTML='';const order=quiz[i][1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((x,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{if(checked)return;selected=x.index;document.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));b.classList.add('selected')};$('opts').appendChild(b)})}function check(){if(selected===null){$('feedback').textContent='Choose an answer first.';return}checked=true;const a=quiz[i],ok=selected===a[2];if(ok){score++;$('xp').textContent=score*10}document.querySelectorAll('.opt').forEach(b=>{const n=Number(b.dataset.index);b.disabled=true;if(n===a[2])b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=(ok?'🎉 Correct! +10 XP — ':'💡 Not quite — ')+a[3];$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=((i+1)/15*100)+'%';$('continue').textContent=i===14?'Finish Skill →':'Continue →'}$('continue').onclick=()=>{if(!checked){check();return}if(i===14){$('quiz').hidden=true;$('done').hidden=false;$('score').textContent=`${score} / 15 • ${score*10} XP`}else{i++;render()}};$('back').onclick=()=>{const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html'};render();</script></body></html>
