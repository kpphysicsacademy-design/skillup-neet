<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | String Waves</title><style>body{font-family:Arial,sans-serif;background:#f3f7ff;margin:0;color:#1e293b}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(30,41,59,.1);border:1px solid #e2e8f0}h1{text-align:center;color:#334155}.meta{display:flex;justify-content:space-between;font-weight:700;color:#475569}.bar{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#22c55e;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;color:#172033}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe4f0;border-radius:14px;background:#fff;color:#1e293b;font-size:16px;cursor:pointer;transition:.2s}.opt:hover{background:#eef5ff;border-color:#93c5fd;transform:translateY(-1px)}.correct{border-color:#16a34a!important;background:#ecfdf3!important;color:#166534!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important;color:#991b1b!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#4f46e5;color:#fff}.back{background:#334155;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#d97706;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🧵 String Waves</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>
const qs=[
['A wave travelling along a stretched string is primarily a','mechanical wave','electromagnetic wave','matter particle','static field',0,'A string wave needs a material medium and is therefore mechanical.'],
['For a transverse wave on a stretched string, particles of the string vibrate','parallel to the direction of propagation','perpendicular to the direction of propagation','only along the string tension','without oscillating',1,'In a transverse string wave, particle vibration is perpendicular to wave propagation.'],
['The speed of a transverse wave on a stretched string is','v=√(T/μ)','v=√(μ/T)','v=Tμ','v=T/μ',0,'The wave speed is v=√(T/μ), where T is tension and μ is mass per unit length.'],
['Here μ in the string-wave equation represents','total mass','mass per unit length','linear momentum','volume density',1,'μ is the linear mass density, measured as mass per unit length.'],
['If the tension of a string is increased four times, its wave speed becomes','half','unchanged','twice','four times',2,'Since v∝√T, increasing tension by 4 makes the speed twice as large.'],
['If the linear density of a string is increased four times, its wave speed becomes','twice','half','four times','unchanged',1,'Since v∝1/√μ, increasing μ by 4 halves the wave speed.'],
['The frequency of a wave on a string is determined by the','medium only','source','string length only','amplitude only',1,'The source fixes the frequency; the medium determines wave speed.'],
['When a wave enters a different string through a boundary, the quantity that remains the same is generally','wave speed','wavelength','frequency','linear density',2,'The source frequency remains unchanged across the boundary, while speed and wavelength can change.'],
['The relation between wave speed, frequency and wavelength is','v=f/λ','v=fλ','v=λ/f','v=f+λ',1,'For a periodic wave, v=fλ.'],
['A string has wave speed 20 m/s and frequency 5 Hz. Its wavelength is','0.25 m','2 m','4 m','100 m',1,'λ=v/f=20/5=4 m.'],
['For a string fixed at both ends, the fundamental wavelength is','L','2L','L/2','4L',1,'The fundamental has nodes at both ends and an antinode at the centre, giving λ=2L.'],
['For a string fixed at both ends, the nth harmonic frequency is','f₁/n','nf₁','n²f₁','f₁+n',1,'Harmonic frequencies are integer multiples: fₙ=nf₁.'],
['The fundamental frequency of a stretched string is','f₁=(1/2L)√(T/μ)','f₁=2L√(T/μ)','f₁=(L/2)√(T/μ)','f₁=√(μ/T)',0,'For a string fixed at both ends, f₁=(1/2L)√(T/μ).'],
['If the length of a stretched string is doubled while tension and density stay constant, the fundamental frequency','doubles','becomes four times','halves','remains unchanged',2,'Since f₁∝1/L, doubling length halves the fundamental frequency.'],
['A string of length 1 m has T=100 N and μ=0.01 kg/m. Its fundamental frequency is','25 Hz','50 Hz','100 Hz','200 Hz',1,'v=√(100/0.01)=100 m/s, so f₁=v/(2L)=50 Hz.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent=''}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide')}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('next').onclick=next;render();</script></body></html>
