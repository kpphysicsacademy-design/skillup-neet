.nav{display:flex;align-items:center;gap:10px;min-height:72px;padding:10px 14px}

<script>
(function(){
'use strict';
const questions = [{"q":"A wave travelling along a stretched string is a…","o":["Mechanical wave","Electromagnetic wave","Matter wave only","Static field"],"a":0,"e":"A string wave requires a material medium, so it is a mechanical wave."},{"q":"For a transverse wave on a string, particles vibrate…","o":["Parallel to propagation","Perpendicular to propagation","Only in the direction of tension","Without oscillating"],"a":1,"e":"In a transverse wave, the string particles move perpendicular to the direction the wave travels."},{"q":"The wave speed on an ideal stretched string is…","o":["\\(v=\\sqrt{T/\\mu}\\)","\\(v=\\sqrt{\\mu/T}\\)","\\(v=T\\mu\\)","\\(v=T/\\mu\\)"],"a":0,"e":"The speed is \\(v=\\sqrt{T/\\mu}\\), where T is tension and μ is linear mass density."},{"q":"In the expression \\(v=\\sqrt{T/\\mu}\\), the symbol \\(\\mu\\) represents…","o":["Total mass","Mass per unit length","String volume","Wave frequency"],"a":1,"e":"Linear mass density is mass per unit length, measured in kg m⁻¹."},{"q":"The SI unit of linear mass density is…","o":["\\(\\text{kg}\\)","\\(\\text{kg m}^{-1}\\)","\\(\\text{N m}^{-1}\\)","\\(\\text{m s}^{-1}\\)"],"a":1,"e":"Linear mass density is mass divided by length, so its SI unit is kg m⁻¹."},{"q":"If the tension becomes four times larger, the wave speed becomes…","o":["Half","Twice","Four times","Unchanged"],"a":1,"e":"Since \\(v\\propto\\sqrt{T}\\), quadrupling tension doubles the speed."},{"q":"If the linear mass density becomes four times larger at constant tension, speed becomes…","o":["Twice","Half","Four times","Unchanged"],"a":1,"e":"Since \\(v\\propto1/\\sqrt{\\mu}\\), quadrupling μ halves the speed."},{"q":"If both tension and linear mass density are multiplied by four, the wave speed…","o":["Doubles","Halves","Remains unchanged","Becomes four times"],"a":2,"e":"The ratio T/μ stays the same, so \\(v=\\sqrt{T/\\mu}\\) is unchanged."},{"q":"The frequency of a wave on a string is primarily determined by the…","o":["Source","String density only","String tension only","Amplitude"],"a":0,"e":"The source sets the frequency; the medium properties determine the propagation speed."},{"q":"The general relationship among speed, frequency, and wavelength is…","o":["\\(v=f/\\lambda\\)","\\(v=f\\lambda\\)","\\(v=\\lambda/f\\)","\\(v=f+\\lambda\\)"],"a":1,"e":"Wave speed is frequency multiplied by wavelength: \\(v=f\\lambda\\)."},{"q":"A string wave travels at 24 m/s with frequency 6 Hz. Its wavelength is…","o":["2 m","4 m","6 m","144 m"],"a":1,"e":"\\(\\lambda=v/f=24/6=4\\,\\text{m}\\)."},{"q":"A wave has wavelength 0.5 m and frequency 40 Hz. Its speed is…","o":["20 m/s","40 m/s","80 m/s","0.0125 m/s"],"a":0,"e":"\\(v=f\\lambda=40(0.5)=20\\,\\text{m s}^{-1}\\)."},{"q":"A string has tension 100 N and linear density 0.01 kg/m. Wave speed is…","o":["10 m/s","50 m/s","100 m/s","1000 m/s"],"a":2,"e":"\\(v=\\sqrt{100/0.01}=\\sqrt{10000}=100\\,\\text{m s}^{-1}\\)."},{"q":"If tension is 64 N and linear density is 0.04 kg/m, the wave speed is…","o":["20 m/s","40 m/s","80 m/s","160 m/s"],"a":1,"e":"\\(v=\\sqrt{64/0.04}=\\sqrt{1600}=40\\,\\text{m s}^{-1}\\)."},{"q":"A string of length 2 m has mass 0.04 kg. Its linear mass density is…","o":["0.02 kg/m","0.08 kg/m","2 kg/m","50 kg/m"],"a":0,"e":"\\(\\mu=m/L=0.04/2=0.02\\,\\text{kg m}^{-1}\\)."},{"q":"For a string fixed at both ends, the fundamental wavelength is…","o":["\\(L/2\\)","\\(L\\)","\\(2L\\)","\\(4L\\)"],"a":2,"e":"The fundamental mode fits half a wavelength into the string, so \\(\\lambda_1=2L\\)."},{"q":"For a string fixed at both ends, its fundamental frequency is…","o":["\\(v/L\\)","\\(v/(2L)\\)","\\(2v/L\\)","\\(v/(4L)\\)"],"a":1,"e":"Using \\(f=v/\\lambda\\) and \\(\\lambda_1=2L\\), \\(f_1=v/(2L)\\)."},{"q":"The nth harmonic frequency of an ideal string fixed at both ends is…","o":["\\(f_n=nf_1\\)","\\(f_n=f_1/n\\)","\\(f_n=n^2f_1\\)","\\(f_n=f_1\\)"],"a":0,"e":"Harmonic frequencies are integer multiples of the fundamental: \\(f_n=nf_1\\)."},{"q":"A string has a fundamental frequency of 80 Hz. Its third harmonic is…","o":["80 Hz","160 Hz","240 Hz","320 Hz"],"a":2,"e":"\\(f_3=3f_1=3(80)=240\\,\\text{Hz}\\)."},{"q":"If the length of a string is doubled while tension and density stay constant, its fundamental frequency…","o":["Doubles","Halves","Quadruples","Stays the same"],"a":1,"e":"Because \\(f_1\\propto1/L\\), doubling the length halves the fundamental frequency."},{"q":"If the tension of a string is increased by a factor of nine, its fundamental frequency (same length and density)…","o":["Triples","Doubles","Becomes nine times","Falls to one-third"],"a":0,"e":"Since \\(f_1\\propto\\sqrt{T}\\), a ninefold tension gives a threefold frequency."},{"q":"If the linear density of a string is increased by a factor of four, with other factors fixed, its fundamental frequency…","o":["Doubles","Halves","Quadruples","Does not change"],"a":1,"e":"Since \\(f_1\\propto1/\\sqrt{\\mu}\\), quadrupling linear density halves the frequency."},{"q":"A 1 m string has wave speed 120 m/s. Its fundamental frequency is…","o":["30 Hz","60 Hz","120 Hz","240 Hz"],"a":1,"e":"\\(f_1=v/(2L)=120/(2)=60\\,\\text{Hz}\\)."},{"q":"A string of length 0.75 m has tension 36 N and linear density 0.01 kg/m. Its fundamental frequency is…","o":["20 Hz","40 Hz","60 Hz","80 Hz"],"a":1,"e":"\\(v=\\sqrt{36/0.01}=60\\,\\text{m/s}\\), then \\(f_1=60/(2\\times0.75)=40\\,\\text{Hz}\\)."},{"q":"A wave enters a second string driven by the same source. Which quantity stays the same across the boundary?","o":["Wave speed","Wavelength","Frequency","Linear density"],"a":2,"e":"The driving source fixes frequency; speed and wavelength can change with the medium."},{"q":"If wave speed is 30 m/s and wavelength is 3 m, frequency is…","o":["0.1 Hz","10 Hz","27 Hz","90 Hz"],"a":1,"e":"\\(f=v/\\lambda=30/3=10\\,\\text{Hz}\\)."},{"q":"A stretched string's wave speed depends directly on…","o":["The square root of tension","The square root of linear density","Amplitude alone","Frequency alone"],"a":0,"e":"The relation \\(v=\\sqrt{T/\\mu}\\) shows speed increases with the square root of tension."},{"q":"Two strings have the same tension. String A has four times the linear density of string B. Compared with B, the speed on A is…","o":["Four times","Twice","Half","One-quarter"],"a":2,"e":"With equal tension, \\(v\\propto1/\\sqrt{\\mu}\\); four times the density gives half the speed."},{"q":"Which change increases wave speed on the same string if its linear density is unchanged?","o":["Reducing tension","Increasing tension","Increasing frequency only","Increasing amplitude only"],"a":1,"e":"The wave speed rises with tension according to \\(v=\\sqrt{T/\\mu}\\)."},{"q":"A string wave has frequency 25 Hz and speed 50 m/s. Its wavelength is…","o":["0.5 m","2 m","25 m","1250 m"],"a":1,"e":"\\(\\lambda=v/f=50/25=2\\,\\text{m}\\)."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>String Waves Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
