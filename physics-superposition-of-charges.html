<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Superposition of Charges</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}
</style></head><body>
<div class="wrap"><div class="card"><h1>⚡ Superposition of Charges</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div>
<script>
const qs=[
['The principle of superposition of electrostatic forces states that the net force on a charge is','the largest individual force','the vector sum of all individual forces due to the other charges','the scalar sum of charge values only','always zero',1,'The net electrostatic force is the vector sum of the forces exerted by all other charges.'],
['For three point charges, the force on one charge is obtained by','ignoring the other two charges','adding the individual forces vectorially','multiplying all three forces','using only the nearest charge',1,'Each charge produces an individual Coulomb force, and the resultant is their vector sum.'],
['If two forces of 3 N and 4 N act perpendicular to each other, their resultant magnitude is','1 N','5 N','7 N','12 N',1,'For perpendicular forces, R=√(3²+4²)=5 N.'],
['Two equal forces F act on a charge in the same direction. Their resultant is','F/2','F','2F','zero',2,'For forces in the same direction, the vector sum is 2F.'],
['Two equal forces F act in exactly opposite directions on a charge. Their resultant is','2F','F','F/2','zero',3,'Equal opposite vectors cancel, giving zero resultant force.'],
['If two equal forces F make an angle of 60° with each other, the resultant is','F','√2F','√3F','2F',2,'R=√(F²+F²+2F²cos60°)=√3F.'],
['The electric field due to several charges at a point is found by','adding field vectors vectorially','adding only magnitudes','using only the largest charge','multiplying the fields',0,'Electric fields obey superposition, so individual field vectors are added vectorially.'],
['For two charges +q and +q placed symmetrically about a midpoint, the electric field at the midpoint is','maximum','zero','kq/r²','infinite',1,'The two equal fields at the midpoint have equal magnitude and opposite directions, so they cancel.'],
['For two equal and opposite charges +q and −q, the electric field at the midpoint is','zero','non-zero','always infinite','undefined',1,'The fields due to +q and −q at the midpoint point in the same direction, so they add.'],
['Three identical positive charges are placed at the vertices of an equilateral triangle. The net force on any one charge is directed','toward the triangle centre','away from the triangle centre along the angle bisector','perpendicular to the plane','randomly',1,'The two equal repulsive forces combine along the outward angle bisector through the vertex.'],
['If the force on a charge due to q₁ is F₁ and due to q₂ is F₂, the net force is','F₁+F₂ as scalars always','F₁−F₂ as scalars always','the vector sum F₁+F₂','F₁F₂',2,'Forces have direction, so the resultant must be obtained by vector addition.'],
['A charge +q is at the origin and charges +q are placed symmetrically at x=+a and x=−a. The net force on the origin charge is','zero','toward +x','toward −x','infinite',0,'The two equal repulsive forces are equal and opposite, so the resultant is zero.'],
['Two charges +2 μC and +2 μC are separated by 1 m. The force magnitude on either charge in vacuum, taking k=9×10⁹, is','0.018 N','0.036 N','0.072 N','0.09 N',1,'F=kq₁q₂/r²=9×10⁹(2×10⁻⁶)(2×10⁻⁶)=0.036 N.'],
['Two equal charges +q are located at x=−a and x=+a. The electric field at x=0 is','2kq/a²','kq/a²','zero','kq/(2a²)',2,'The two electric-field vectors at the midpoint have equal magnitude and opposite directions, so they cancel.'],
['In a system of many point charges, the superposition principle allows the force on a selected charge to be calculated by','considering all other charges independently and adding their force vectors','considering only the total charge and ignoring positions','using only charges of the same sign','assuming all forces are parallel',0,'Superposition permits each pairwise force to be calculated separately and then summed vectorially.']
];
let i=0,score=0,answered=false;const $=x=>document.getElementById(x);
function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}
function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}
function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();
</script></body></html>
