<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>⚖️ Symmetry and Centre of Mass</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
  {
    "q": "Where is the centre of mass of two equal point masses on a line?",
    "o": [
      "At the midpoint between them",
      "Outside the line always",
      "At twice the separation",
      "At either mass"
    ],
    "a": 0,
    "e": "Equal masses have their centre of mass halfway between them."
  },
  {
    "q": "A uniform circular disc has its centre of mass:",
    "o": [
      "At its geometric centre",
      "At its rim",
      "Outside the disc",
      "At the top edge"
    ],
    "a": 0,
    "e": "Uniform mass distribution and circular symmetry place the centre of mass at the centre."
  },
  {
    "q": "The centre of mass of a uniform straight rod lies:",
    "o": [
      "Outside the rod",
      "At one end",
      "At its midpoint",
      "One-quarter from an end"
    ],
    "a": 2,
    "e": "A uniform rod has equal mass distribution on both sides of its midpoint."
  },
  {
    "q": "A uniform ring's centre of mass is located:",
    "o": [
      "At any point on its circumference",
      "Outside the plane",
      "On the ring material",
      "At the centre of the circle"
    ],
    "a": 3,
    "e": "Rotational symmetry places the centre of mass at the geometric centre, even though no material is there."
  },
  {
    "q": "A uniform square lamina has its centre of mass at:",
    "o": [
      "The midpoint of one side",
      "The intersection of its diagonals",
      "Outside the square",
      "A corner"
    ],
    "a": 1,
    "e": "The diagonals intersect at the square's centre, where its symmetry balances."
  },
  {
    "q": "Why does symmetry help locate the centre of mass?",
    "o": [
      "It makes the mass infinite",
      "Symmetric parts balance each other",
      "It removes gravity",
      "It makes every object weightless"
    ],
    "a": 1,
    "e": "Matching mass distribution on opposite sides means the centre of mass lies on the symmetry axes."
  },
  {
    "q": "The centre of mass of a uniform solid sphere is:",
    "o": [
      "Outside the sphere",
      "At the centre",
      "At the surface",
      "At the north pole"
    ],
    "a": 1,
    "e": "A uniform sphere is symmetric in every direction, so its centre of mass is at its centre."
  },
  {
    "q": "For a symmetric object with two perpendicular symmetry axes, the centre of mass lies:",
    "o": [
      "Only on the outer boundary",
      "At a random point",
      "At their intersection",
      "At either end"
    ],
    "a": 2,
    "e": "The centre of mass must lie on each symmetry axis, so it is at their intersection."
  },
  {
    "q": "Two masses, 2 kg and 2 kg, are placed at x = 0 m and x = 6 m. Their centre of mass is at:",
    "o": [
      "2 m",
      "3 m",
      "6 m",
      "1 m"
    ],
    "a": 1,
    "e": "Equal masses share the midpoint: (0 + 6)/2 = 3 m."
  },
  {
    "q": "A 1 kg mass is at x = 0 m and a 3 kg mass at x = 4 m. Find the centre of mass.",
    "o": [
      "1 m",
      "2 m",
      "3 m",
      "4 m"
    ],
    "a": 2,
    "e": "xcm = (1×0 + 3×4)/(1+3) = 3 m."
  },
  {
    "q": "The centre of mass of a uniform semicircular wire lies:",
    "o": [
      "Outside its plane",
      "At the circle centre",
      "On its symmetry axis",
      "At either end only"
    ],
    "a": 2,
    "e": "The mass distribution is symmetric about the vertical axis, so the centre of mass lies on that axis."
  },
  {
    "q": "For a uniform rectangular lamina, the centre of mass is at:",
    "o": [
      "The centre of a short side",
      "Outside the rectangle",
      "The intersection of its diagonals",
      "A longer-side endpoint"
    ],
    "a": 2,
    "e": "A uniform rectangle is symmetric about both midlines; its diagonals also meet at the centre."
  },
  {
    "q": "If an object's mass distribution is symmetric about the y-axis, its centre of mass has:",
    "o": [
      "y-coordinate zero always",
      "Both coordinates infinite",
      "x-coordinate equal to its width",
      "x-coordinate zero"
    ],
    "a": 3,
    "e": "Reflection symmetry about the y-axis makes contributions at +x and −x cancel, giving xcm = 0."
  },
  {
    "q": "A uniform equilateral triangular lamina has its centre of mass at:",
    "o": [
      "A vertex",
      "The centroid",
      "The midpoint of a side",
      "The circumferential edge"
    ],
    "a": 1,
    "e": "For a uniform triangle, the centre of mass is the centroid where the medians meet."
  },
  {
    "q": "The centroid of a uniform triangular lamina lies how far from each vertex along a median?",
    "o": [
      "The full median",
      "One-third of the median",
      "Half the median",
      "Two-thirds of the median"
    ],
    "a": 3,
    "e": "The centroid divides each median in a 2:1 ratio measured from the vertex."
  },
  {
    "q": "Three equal masses are placed at the vertices of an equilateral triangle. Their centre of mass is:",
    "o": [
      "At the midpoint of a side",
      "Outside the triangle",
      "At one vertex",
      "At the triangle's centroid"
    ],
    "a": 3,
    "e": "Equal masses at the three symmetric vertices balance at the centroid."
  },
  {
    "q": "If a body has uniform density and a centre of symmetry, its centre of mass is:",
    "o": [
      "Always at the lowest point",
      "At the nearest edge",
      "Impossible to determine",
      "At the centre of symmetry"
    ],
    "a": 3,
    "e": "For a uniform body, central symmetry makes mass elements on opposite sides balance."
  },
  {
    "q": "Two equal masses lie at x = −5 cm and x = +5 cm. Their centre of mass is:",
    "o": [
      "−5 cm",
      "0 cm",
      "+5 cm",
      "+10 cm"
    ],
    "a": 1,
    "e": "Equal masses equally spaced on opposite sides of the origin have xcm = 0."
  },
  {
    "q": "A 2 kg mass is at x = 2 m and a 6 kg mass at x = 6 m. The centre of mass is:",
    "o": [
      "6 m",
      "3 m",
      "4 m",
      "5 m"
    ],
    "a": 3,
    "e": "xcm = (2×2 + 6×6)/(2+6) = 40/8 = 5 m."
  },
  {
    "q": "The centre of mass of a uniform hollow cylinder lies:",
    "o": [
      "At one circular rim",
      "Outside the cylinder",
      "On its curved surface",
      "On its central axis at the middle"
    ],
    "a": 3,
    "e": "Cylindrical symmetry places the centre of mass at the geometric centre on its axis."
  },
  {
    "q": "A body is cut into two equal halves by a plane of symmetry. What can be said about its centre of mass?",
    "o": [
      "It must be outside the body",
      "It must lie on the surface",
      "It is always at the bottom",
      "It lies in the plane of symmetry"
    ],
    "a": 3,
    "e": "The centre of mass of a symmetric mass distribution lies in its symmetry plane."
  },
  {
    "q": "For two masses on a line, the centre of mass lies closer to:",
    "o": [
      "The heavier mass",
      "The lighter mass",
      "The origin always",
      "Neither mass regardless of values"
    ],
    "a": 0,
    "e": "The centre of mass is a mass-weighted average and lies closer to the heavier mass."
  },
  {
    "q": "A uniform disc has a small circular hole drilled exactly at its centre. The remaining shape's centre of mass is:",
    "o": [
      "At an arbitrary point",
      "Still at the centre",
      "At the rim",
      "At the hole's former edge"
    ],
    "a": 1,
    "e": "A centred hole preserves rotational symmetry, so the centre of mass remains at the centre."
  },
  {
    "q": "A uniform square plate has a small hole drilled off-centre. Its centre of mass generally:",
    "o": [
      "Shifts toward the hole",
      "Must lie outside the plate",
      "Remains at the original centre",
      "Shifts away from the hole"
    ],
    "a": 3,
    "e": "Removing mass from one side shifts the centre of mass toward the remaining material, away from the hole."
  },
  {
    "q": "Which condition is sufficient to conclude the centre of mass lies on an object's mirror-symmetry plane?",
    "o": [
      "The object is moving quickly",
      "The object is hot",
      "The object is painted uniformly",
      "The mass distribution has that reflection symmetry"
    ],
    "a": 3,
    "e": "The relevant symmetry must apply to the mass distribution, not merely colour or motion."
  },
  {
    "q": "A uniform semicircular lamina has its centre of mass:",
    "o": [
      "On the symmetry axis",
      "At a point off the symmetry axis",
      "At every point on the diameter",
      "Always at the circle centre"
    ],
    "a": 0,
    "e": "The semicircular lamina is symmetric about its central axis, so its centre of mass lies on that axis."
  },
  {
    "q": "A 4 kg mass at x = 0 m and a 1 kg mass at x = 10 m have centre of mass at:",
    "o": [
      "8 m",
      "2 m",
      "4 m",
      "5 m"
    ],
    "a": 1,
    "e": "xcm = (4×0 + 1×10)/(4+1) = 2 m."
  },
  {
    "q": "A symmetric body's centre of mass need not contain any material, as shown by a:",
    "o": [
      "Uniform rod",
      "Solid sphere",
      "Uniform ring",
      "Solid cube"
    ],
    "a": 2,
    "e": "A ring's centre of mass is at its empty geometric centre."
  },
  {
    "q": "Which statement is correct about the centre of mass of a uniform sphere?",
    "o": [
      "It is at the geometric centre",
      "It is always on the surface",
      "It changes when the sphere is translated",
      "It depends on how the sphere is rotated"
    ],
    "a": 0,
    "e": "Uniform spherical symmetry fixes the centre of mass at the geometric centre."
  },
  {
    "q": "A uniform L-shaped plate is not centrally symmetric. Where is its centre of mass?",
    "o": [
      "Always at the geometric centre of its bounding square",
      "It must be calculated from the mass distribution",
      "Always at the inside corner",
      "Always outside the plate"
    ],
    "a": 1,
    "e": "Without enough symmetry, determine the centre of mass by combining the contributions of its component regions."
  }
];
let index=0,score=0,streak=0,chosen=null,locked=false;
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Nice work!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><button class="btn" id="retry">Practice again</button>';
 $('finishSlot').replaceChildren(card);$('retry').addEventListener('click',()=>{index=0;score=0;streak=0;$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
