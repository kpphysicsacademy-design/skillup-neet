<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Symmetry and Centre of Mass</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-size:1.55rem;font-weight:900}.subtitle{color:#5f6b7a;margin:0 0 18px}.xp,.card{background:#fff;border-radius:20px;box-shadow:0 6px 20px #17203312}.xp{padding:10px 15px;font-weight:850}.card{padding:20px;margin:12px 0}.ph{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:11px;background:#dfe8f1;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.25s}.qnum{font-weight:800;color:#35516f;margin-bottom:11px}.question{font-size:1.25rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#58cc02;background:#f7fff1;transform:translateY(-1px)}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;background:#2db84d;color:#fff;font-weight:850;cursor:pointer;box-shadow:0 4px 0 #21863a}.btn:hover{transform:translateY(-2px)}.feedback{margin-top:14px;padding:12px;border-radius:13px;font-weight:700;min-height:18px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:10px;padding:10px 13px;border:2px solid #d9d4f5;border-radius:13px;color:#5146a5;font-weight:800;text-decoration:none;transition:.12s}.back:hover{background:#f0edff;transform:translateX(-2px)}@media(max-width:600px){.wrap{padding:20px 14px}.title{font-size:1.35rem}.question{font-size:1.1rem}}</style></head><body><main class="wrap"><div class="top"><div class="title">⚖️ Symmetry & Centre of Mass</div><div class="xp">⚡ <span id="xp">0</span> XP</div></div><p class="subtitle">Physics • NEET 2026 · Learn → Practice → Master</p><section class="card"><div class="ph"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><button class="btn" id="continue">Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const quiz=[['A body with left-right symmetry about a vertical axis has its centre of mass:', ['on that symmetry axis','always at the top','always at the bottom','outside the body'],0,'The CM lies on every symmetry axis of a symmetric mass distribution.'],['For a uniform circular ring, the centre of mass is:', ['at the geometric centre','on the circumference','outside the ring','at any point on a diameter'],0,'Rotational symmetry places the CM at the centre.'],['For a uniform disc, the centre of mass is:', ['at its centre','at its edge','at the topmost point','outside the disc'],0,'Symmetry about perpendicular diameters places the CM at their intersection.'],['If a mass distribution is symmetric about the x-axis, then:', ['y_CM = 0','x_CM = 0 always','x_CM = y_CM','y_CM = 1'],0,'Reflection symmetry about the x-axis makes the CM lie on that axis.'],['If a body is symmetric about both x and y axes, its centre of mass is:', ['at their intersection','on the x-axis only','on the y-axis only','outside the body'],0,'The CM lies on both symmetry axes, hence at their intersection.'],['The centre of mass of a uniform square lamina is at:', ['the intersection of its diagonals','one corner','the midpoint of one side','outside the square'],0,'Square symmetry places the CM at the diagonal intersection.'],['A uniform rectangular plate has its centre of mass at:', ['the geometric centre','a corner','the midpoint of a long side','an arbitrary point'],0,'The rectangle is symmetric about its two midlines.'],['A uniform semicircular lamina has its centre of mass:', ['on its axis of symmetry','at the circle centre necessarily','at a rim end','outside its plane'],0,'Symmetry fixes the CM on the symmetry axis.'],['Two equal masses placed symmetrically about an axis have their CM:', ['on that axis','at either mass','outside the system','at the larger mass'],0,'Equal symmetric masses have cancelling perpendicular position components.'],['A hole is cut symmetrically from a uniform plate. The remaining body:', ['retains the corresponding symmetry','always loses all symmetry','has its CM at the hole','has no CM'],0,'Symmetric removal preserves that symmetry in the remaining mass distribution.'],['Adding more mass on the right side of a symmetric body shifts its CM:', ['toward the right','toward the left','nowhere','vertically only'],0,'The added mass shifts the mass-weighted average toward the right.'],['For a uniform equilateral triangle, the centre of mass is at:', ['the intersection of its medians','one vertex','the midpoint of one side only','outside the triangle'],0,'The centroid, where the medians intersect, is the CM of a uniform triangle.'],['For a uniform sphere, the centre of mass is:', ['at the centre','on its surface','at a diameter end','outside the sphere'],0,'Spherical symmetry places the CM at the geometric centre.'],['Symmetry can determine a centre-of-mass coordinate without integration because:', ['opposite contributions cancel by symmetry','mass becomes zero','gravity disappears','all positions are equal'],0,'Symmetry pairs equal masses with opposite coordinate contributions.'],['If a body has no symmetry, its centre of mass:', ['can still be found from the mass-weighted average','cannot exist','must be at the geometric centre','must lie outside the body'],0,'Symmetry is a shortcut; the general centre-of-mass definition still applies.']];let i=0,selected=-1,checked=false,score=0;const $=id=>document.getElementById(id),o=$("options"),b=$("continue"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;$("count").textContent='Question '+(i+1)+' of 15';$("question").textContent=a[0];o.innerHTML='';f.className='feedback';f.textContent='';b.style.display='inline-block';b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const el=document.createElement('button');el.className='option';el.textContent=String.fromCharCode(65+j)+'. '+item.text;el.dataset.index=item.index;el.onclick=()=>{selected=item.index;[...o.children].forEach(z=>z.classList.remove('selected'));el.classList.add('selected')};o.appendChild(el)})}b.onclick=()=>{if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(el=>{const n=Number(el.dataset.index);el.disabled=true;if(n===a[2])el.classList.add('correct');if(n===selected&&!ok)el.classList.add('wrong')});if(ok)score++;f.className=ok?'feedback good':'feedback bad';f.textContent=(ok?'🎯 Correct! +10 XP — ':'✗ Review — Correct answer: '+a[1][a[2]]+'. ')+a[3];$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$("question").textContent='🏆 Symmetry & Centre of Mass Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
