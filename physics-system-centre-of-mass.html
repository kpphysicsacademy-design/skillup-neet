<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | System Centre of Mass</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:flex-end;margin-bottom:18px}.xp,.card{background:#fff;border-radius:20px;box-shadow:0 6px 20px #17203312}.xp{padding:11px 17px;font-weight:800}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff;border-radius:22px;padding:25px 20px;margin-bottom:12px}.hero h1{margin:8px 0;font-size:1.9rem}.hero p{margin:0}.card{padding:20px;margin:12px 0}.ph{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:11px;background:#dfe8f1;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.25s}.qnum{font-weight:800;color:#35516f;margin-bottom:11px}.question{font-size:1.27rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#58cc02;background:#f7fff1}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;background:#2db84d;color:#fff;font-weight:850;cursor:pointer;box-shadow:0 4px 0 #21863a}.feedback{margin-top:14px;padding:12px;border-radius:13px;font-weight:700;min-height:18px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:7px;padding:9px 12px;border-radius:12px;color:#5146a5;font-weight:800;text-decoration:none}.back:hover{background:#f0edff}@media(max-width:600px){.wrap{padding:20px 14px}.question{font-size:1.12rem}}</style></head><body><main class="wrap"><div class="top"><div class="xp">⚡ <span id="xp">0</span> XP</div></div><section class="hero"><small>PHYSICS • NEET 2026</small><h1>⚖️ System Centre of Mass</h1><p>LEARN → PRACTICE → MASTER • 15 focused NEET-style MCQs</p></section><section class="card"><div class="ph"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><button class="btn" id="continue">Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const quiz=[['The centre of mass of a system is the point at which its entire mass may be considered concentrated for describing its:',['translational motion','temperature','shape only','rotation only'],0,'The centre of mass is especially useful for describing translational motion of a system.'],['For particles m₁ and m₂ at positions x₁ and x₂, the x-coordinate of their centre of mass is:',['(m₁x₁+m₂x₂)/(m₁+m₂)','(x₁+x₂)/2 always','m₁x₁+m₂x₂','(m₁+m₂)/(x₁+x₂)'],0,'The mass-weighted average gives x_CM.'],['For two equal masses placed symmetrically about the origin, the centre of mass is:',['at the origin','at either mass','outside the system','at infinity'],0,'Equal masses at equal opposite positions have cancelling position vectors.'],['The centre of mass of a uniform rod lies at its:',['geometrical centre','one end','quarter point','outside the rod'],0,'For a uniform rod, the centre of mass is at its midpoint.'],['If no external force acts on a system, its centre of mass:',['moves with constant velocity','must remain at rest','moves in a circle','has increasing acceleration'],0,'With zero net external force, total momentum and hence CM velocity remain constant.'],['The acceleration of the centre of mass of a system is determined by:',['net external force divided by total mass','internal forces only','largest particle mass only','total internal force divided by mass'],0,'a_CM = F_ext,total / M.'],['Internal forces in an isolated system can:',['change individual motions but not the CM motion','change the CM velocity','accelerate the whole CM without external force','change total mass necessarily'],0,'Internal forces cancel in the total momentum equation.'],['Two particles of masses 2 kg and 3 kg are at x=0 m and x=5 m. Their centre of mass is at:',['3 m','2 m','4 m','2.5 m'],0,'x_CM=(2×0+3×5)/(2+3)=3 m.'],['A system of total mass 10 kg has net external force 30 N. The acceleration of its centre of mass is:',['3 m/s²','0.3 m/s²','30 m/s²','300 m/s²'],0,'a_CM=F_ext/M=30/10=3 m/s².'],['When a firecracker explodes in mid-air with negligible external force during the explosion, the centre of mass of the fragments:',['continues along the same path it would have followed','jumps randomly','stops immediately','moves toward the largest fragment'],0,'The explosion involves internal forces, so the CM motion is unchanged by the explosion itself.'],['For a system of particles, the total linear momentum equals:',['total mass × CM velocity','total mass × CM acceleration','CM position × total force','total force × CM position'],0,'P_total = M V_CM.'],['If the origin of coordinates is shifted, the physical motion of the centre of mass:',['does not change, though its coordinate value changes','changes completely','becomes zero','depends on internal forces'],0,'Changing origin changes coordinates, not the physical location or motion.'],['The centre of mass can lie outside the material body for:',['a ring or hollow body','only a point mass','only a uniform solid sphere','no physical system'],0,'For extended systems with hollow or separated mass distributions, CM may lie in empty space.'],['If all particles of a system are given the same additional velocity V, the centre-of-mass velocity:',['also increases by V','does not change','becomes zero','increases by V²'],0,'Adding the same velocity to every particle adds that velocity to the CM velocity.'],['For a system acted on by gravity in a uniform gravitational field, the centre of mass behaves as if:',['the total mass were concentrated at the CM for translational motion','gravity acted only on the lightest particle','there were no gravitational force','each particle had a different g'],0,'In a uniform gravitational field, total gravitational force is Mg and acts equivalently through the CM.']];let i=0,selected=-1,checked=false,score=0;const $=x=>document.getElementById(x),o=$("options"),b=$("continue"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;$("count").textContent='Question '+(i+1)+' of 15';$("question").textContent=a[0];o.innerHTML='';f.className='feedback';f.textContent='';b.style.display='inline-block';b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const el=document.createElement('button');el.className='option';el.textContent=String.fromCharCode(65+j)+'. '+item.text;el.dataset.index=item.index;el.onclick=()=>{selected=item.index;[...o.children].forEach(z=>z.classList.remove('selected'));el.classList.add('selected')};o.appendChild(el)})}b.onclick=()=>{if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(el=>{const n=Number(el.dataset.index);el.disabled=true;if(n===a[2])el.classList.add('correct');if(n===selected&&!ok)el.classList.add('wrong')});if(ok){score++;f.className='feedback good';f.textContent='🎯 Correct! +10 XP — '+a[3]}else{f.className='feedback bad';f.textContent='✗ Review — Correct answer: '+a[1][a[2]]+'. '+a[3]}$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$("question").textContent='🏆 System Centre of Mass Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
