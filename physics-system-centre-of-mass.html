<style>
:root{--green:#58cc02;--green-dark:#46a302;--blue:#1cb0f6;--ink:#243447;--muted:#64748b;--line:#dce6ef;--bg:#f3f9ff;--red:#ff4b4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.nav{max-width:720px;margin:auto;min-height:58px;padding:9px 14px;display:flex;align-items:center;gap:10px}
.back{display:grid;place-items:center;width:40px;height:40px;border:2px solid var(--line);border-radius:13px;background:#f2f9ff;color:#174a78;text-decoration:none;font-size:20px}
.brand{font-weight:950;color:#174a78}.brand small{display:block;font-size:9px;letter-spacing:.8px;color:var(--muted)}
.xp{margin-left:auto;background:#fff4cf;border:1px solid #f4df9a;border-radius:99px;padding:7px 10px;font-weight:900;font-size:13px}
main{max-width:720px;margin:auto;padding:18px 13px 48px}
.hero,.quiz,.finish{background:#fff;border:2px solid #e2edf7;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 #dce8f3}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#174a78}.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}
.progress-row{display:flex;justify-content:space-between;gap:10px;margin:16px 0 7px;font-size:12px;font-weight:900;color:var(--muted)}
.track{height:11px;border-radius:99px;background:#e2edf7;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}
.qmeta{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.4px}
.question{font-size:clamp(20px,4.5vw,26px);line-height:1.35;margin:12px 0 18px;font-weight:850}
.options{display:grid;gap:10px}.option{display:flex;gap:11px;align-items:center;width:100%;min-height:51px;padding:12px;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}
.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

}

}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>⚖️ System Centre of Mass</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
  {
    "q": "The centre-of-mass position vector of a system of particles is:",
    "o": [
      "Σrᵢ / Σmᵢ",
      "Σmᵢ / Σrᵢ",
      "Σmᵢvᵢ / Σrᵢ",
      "Σmᵢrᵢ / Σmᵢ"
    ],
    "a": 3,
    "e": "The centre of mass is the mass-weighted average of all particle position vectors."
  },
  {
    "q": "For a system of total mass M, its centre-of-mass velocity is:",
    "o": [
      "Total momentum divided by M",
      "M divided by total momentum",
      "Total kinetic energy divided by M",
      "Total force multiplied by M"
    ],
    "a": 0,
    "e": "Vcm = Ptotal/M, where Ptotal is the vector sum of all particle momenta."
  },
  {
    "q": "The acceleration of the centre of mass of a system is:",
    "o": [
      "Always zero",
      "Net external force divided by total mass",
      "Net internal force divided by total mass",
      "Total momentum divided by mass squared"
    ],
    "a": 1,
    "e": "Newton's second law for a system gives M aCM = Fexternal,net."
  },
  {
    "q": "Internal forces within a system:",
    "o": [
      "Are always larger than external forces",
      "Destroy total momentum",
      "Cancel in pairs in the total-force equation",
      "Always accelerate the centre of mass"
    ],
    "a": 2,
    "e": "By Newton's third law, internal forces occur in equal and opposite pairs, so they do not change total system momentum."
  },
  {
    "q": "If the net external force on a system is zero, its centre of mass:",
    "o": [
      "Must remain at the origin",
      "Must stop immediately",
      "Always moves in a circle",
      "Moves with constant velocity"
    ],
    "a": 3,
    "e": "With no net external force, total momentum and therefore centre-of-mass velocity remain constant."
  },
  {
    "q": "A 2 kg particle at 1 m/s and a 3 kg particle at 4 m/s move in the same direction. Find Vcm.",
    "o": [
      "2.8 m/s",
      "3.0 m/s",
      "2.0 m/s",
      "5.0 m/s"
    ],
    "a": 0,
    "e": "Vcm = (2×1 + 3×4)/(2+3) = 14/5 = 2.8 m/s."
  },
  {
    "q": "A 2 kg particle moves right at 5 m/s and a 2 kg particle moves left at 1 m/s. Taking right positive, Vcm is:",
    "o": [
      "0 m/s",
      "2 m/s right",
      "3 m/s right",
      "2 m/s left"
    ],
    "a": 1,
    "e": "Vcm = (2×5 + 2×(−1))/4 = 8/4 = 2 m/s right."
  },
  {
    "q": "A 1 kg particle moves at 6 m/s and a 2 kg particle is at rest. Their centre-of-mass speed is:",
    "o": [
      "4 m/s",
      "6 m/s",
      "2 m/s",
      "3 m/s"
    ],
    "a": 2,
    "e": "Vcm = (1×6 + 2×0)/3 = 2 m/s."
  },
  {
    "q": "A 4 kg system has net external force 12 N to the right. Its centre-of-mass acceleration is:",
    "o": [
      "48 m/s² right",
      "8 m/s² right",
      "0.33 m/s² right",
      "3 m/s² right"
    ],
    "a": 3,
    "e": "aCM = F/M = 12/4 = 3 m/s² to the right."
  },
  {
    "q": "A system of mass 5 kg experiences a net external force of 0 N. Its centre-of-mass acceleration is:",
    "o": [
      "0 m/s²",
      "5 m/s²",
      "9.8 m/s²",
      "Cannot be determined"
    ],
    "a": 0,
    "e": "aCM = Fexternal/M = 0/5 = 0."
  },
  {
    "q": "For two particles, total momentum can be expressed as:",
    "o": [
      "m₁m₂Vcm",
      "(m₁+m₂)Vcm",
      "(m₁−m₂)Vcm",
      "Vcm/(m₁+m₂)"
    ],
    "a": 1,
    "e": "The total momentum of a system equals its total mass times centre-of-mass velocity."
  },
  {
    "q": "If a firework explodes in mid-air and air resistance is neglected, the centre of mass follows:",
    "o": [
      "A vertical path always",
      "A path that stops at the explosion",
      "The projectile's original trajectory",
      "The path of the lightest fragment only"
    ],
    "a": 2,
    "e": "The explosion forces are internal, so the centre-of-mass motion follows the same external gravitational force."
  },
  {
    "q": "A person walks forward on a freely floating boat. Neglecting horizontal external forces, the boat moves:",
    "o": [
      "Forward at the same speed always",
      "Not at all",
      "Straight downward",
      "Backward"
    ],
    "a": 3,
    "e": "The system's horizontal centre of mass remains fixed, so the boat shifts opposite the person's motion."
  },
  {
    "q": "A system's centre of mass can move even when its total momentum is zero.",
    "o": [
      "False, for a fixed total mass",
      "True in every situation",
      "True only if it has three particles",
      "True only under gravity"
    ],
    "a": 0,
    "e": "Vcm = Ptotal/M. If total momentum is zero, centre-of-mass velocity is zero in that frame."
  },
  {
    "q": "Which force determines the acceleration of a system's centre of mass?",
    "o": [
      "Friction between particles only",
      "Net external force",
      "Sum of internal forces only",
      "Gravitational force on one particle only in all cases"
    ],
    "a": 1,
    "e": "Only the net external force determines the acceleration of the centre of mass."
  },
  {
    "q": "A 2 kg particle at x = 0 m and a 3 kg particle at x = 5 m have centre of mass at:",
    "o": [
      "2.5 m",
      "5 m",
      "3 m",
      "2 m"
    ],
    "a": 2,
    "e": "xCM = (2×0 + 3×5)/5 = 3 m."
  },
  {
    "q": "A 1 kg particle at x = −4 m and a 3 kg particle at x = 0 m have centre of mass at:",
    "o": [
      "−2 m",
      "+1 m",
      "−3 m",
      "−1 m"
    ],
    "a": 3,
    "e": "xCM = (1×−4 + 3×0)/4 = −1 m."
  },
  {
    "q": "Three equal masses are at x = 0 m, 2 m and 7 m. Their centre of mass is:",
    "o": [
      "3 m",
      "2 m",
      "4 m",
      "7 m"
    ],
    "a": 0,
    "e": "For equal masses, xCM is the arithmetic mean: (0+2+7)/3 = 3 m."
  },
  {
    "q": "A 1 kg mass at x = 0 m, 2 kg at x = 3 m and 3 kg at x = 6 m have xCM:",
    "o": [
      "6 m",
      "4 m",
      "3 m",
      "5 m"
    ],
    "a": 1,
    "e": "xCM = (1×0 + 2×3 + 3×6)/6 = 24/6 = 4 m."
  },
  {
    "q": "For a system of particles, the centre-of-mass equation is valid:",
    "o": [
      "Only if all masses are equal",
      "Only if the system is at rest",
      "For any distribution of particles with defined total mass",
      "Only for two particles"
    ],
    "a": 2,
    "e": "The mass-weighted position, velocity, and force relations apply to systems with any number of particles."
  },
  {
    "q": "If the same constant velocity is added to every particle in a system, the centre-of-mass velocity:",
    "o": [
      "Does not change",
      "Becomes zero always",
      "Doubles regardless of the added velocity",
      "Increases by that velocity"
    ],
    "a": 3,
    "e": "Vcm is a mass-weighted average of velocities, so adding the same vector to each adds it to Vcm."
  },
  {
    "q": "A system has total mass 8 kg and centre-of-mass velocity 3 m/s east. Its total momentum is:",
    "o": [
      "24 kg·m/s east",
      "11 kg·m/s east",
      "5 kg·m/s east",
      "2.67 kg·m/s east"
    ],
    "a": 0,
    "e": "Ptotal = M Vcm = 8×3 = 24 kg·m/s east."
  },
  {
    "q": "A system's total momentum is 15 kg·m/s and its total mass is 5 kg. The centre-of-mass speed is:",
    "o": [
      "75 m/s",
      "3 m/s",
      "5 m/s",
      "10 m/s"
    ],
    "a": 1,
    "e": "Vcm = P/M = 15/5 = 3 m/s."
  },
  {
    "q": "If the net external force on a system points west, its centre-of-mass acceleration points:",
    "o": [
      "North always",
      "Opposite the total momentum always",
      "West",
      "East"
    ],
    "a": 2,
    "e": "The acceleration vector has the same direction as the net external force."
  },
  {
    "q": "The centre-of-mass motion of a system is unaffected by:",
    "o": [
      "Net external force",
      "An external impulse",
      "An external gravitational field",
      "Internal forces alone"
    ],
    "a": 3,
    "e": "Internal forces cannot change the motion of the system's centre of mass by themselves."
  },
  {
    "q": "A system of mass 10 kg accelerates at 2 m/s² north. Its net external force is:",
    "o": [
      "20 N north",
      "5 N north",
      "12 N north",
      "0 N"
    ],
    "a": 0,
    "e": "Fexternal = M aCM = 10×2 = 20 N north."
  },
  {
    "q": "Two equal masses have velocities +4 m/s and −2 m/s along one line. Their centre-of-mass velocity is:",
    "o": [
      "0 m/s",
      "1 m/s in the positive direction",
      "3 m/s in the positive direction",
      "−1 m/s"
    ],
    "a": 1,
    "e": "For equal masses, Vcm is the average: (4−2)/2 = 1 m/s."
  },
  {
    "q": "A system has constant centre-of-mass velocity. Which statement must be true?",
    "o": [
      "No internal forces act",
      "Its kinetic energy is constant",
      "Its net external force is zero",
      "All particles are at rest"
    ],
    "a": 2,
    "e": "For a fixed-mass system, constant Vcm means zero centre-of-mass acceleration and thus zero net external force."
  },
  {
    "q": "Why can internal forces change individual particle velocities without changing total momentum?",
    "o": [
      "They are always zero",
      "They act only on stationary particles",
      "Momentum is not a vector",
      "They occur in equal and opposite pairs"
    ],
    "a": 3,
    "e": "Internal force pairs exchange momentum between particles, while the total remains unchanged."
  },
  {
    "q": "The centre-of-mass position of a system is determined by:",
    "o": [
      "The masses and their positions",
      "Only the velocities",
      "Only the external force",
      "Only the total kinetic energy"
    ],
    "a": 0,
    "e": "Centre-of-mass position depends on the distribution of mass in space."
  }
];
let index=0,score=0,streak=0,chosen=null,locked=false;
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Nice work!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><button class="btn" id="retry">Practice again</button>';
 $('finishSlot').replaceChildren(card);$('retry').addEventListener('click',()=>{index=0;score=0;streak=0;$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
