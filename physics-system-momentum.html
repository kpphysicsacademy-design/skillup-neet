<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | System Momentum</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-size:1.6rem;font-weight:900}.subtitle{color:#5f6b7a;margin:0 0 18px}.xp,.card{background:#fff;border-radius:20px;box-shadow:0 6px 20px #17203312}.xp{padding:10px 15px;font-weight:850}.card{padding:20px;margin:12px 0}.ph{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:11px;background:#dfe8f1;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.25s}.qnum{font-weight:800;color:#35516f;margin-bottom:11px}.question{font-size:1.27rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#58cc02;background:#f7fff1;transform:translateY(-1px)}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;background:#2db84d;color:#fff;font-weight:850;cursor:pointer;box-shadow:0 4px 0 #21863a;transition:.12s}.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}.feedback{margin-top:14px;padding:12px;border-radius:13px;font-weight:700;min-height:18px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:10px;padding:10px 13px;border:2px solid #d9d4f5;border-radius:13px;color:#5146a5;font-weight:800;text-decoration:none;transition:.12s}.back:hover{background:#f0edff;transform:translateX(-2px)}@media(max-width:600px){.wrap{padding:20px 14px}.title{font-size:1.4rem}.question{font-size:1.12rem}}</style></head><body><main class="wrap"><div class="top"><div class="title">🧭 System Momentum</div><div class="xp">⚡ <span id="xp">0</span> XP</div></div><p class="subtitle">Physics • NEET 2026 · Learn → Practice → Master</p><section class="card"><div class="ph"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><button class="btn" id="continue">Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const quiz=[['The total linear momentum of a system is equal to:', ['vector sum of momenta of all particles','sum of particle masses only','total force only','centre-of-mass position only'],0,'System momentum is the vector sum of the momenta of all its particles.'],['For a system of total mass M moving with centre-of-mass velocity V_CM, total momentum is:', ['M V_CM','M a_CM','V_CM/M','M + V_CM'],0,'P_total = M V_CM.'],['If the net external force on a system is zero, its total linear momentum:', ['remains constant','becomes zero','always increases','depends on internal forces'],0,'Zero external force means dP/dt = 0.'],['Internal forces in an isolated system can:', ['change individual momenta but not total momentum','change total momentum','create net external impulse','always stop every particle'],0,'Internal forces occur in equal and opposite pairs, so their total contribution cancels.'],['Two particles of masses 2 kg and 3 kg have velocities 4 m/s and 2 m/s in the same direction. Their total momentum is:', ['14 kg·m/s','10 kg·m/s','8 kg·m/s','5 kg·m/s'],0,'P = 2×4 + 3×2 = 14 kg·m/s.'],['A 5 kg system has centre-of-mass velocity 6 m/s. Its total linear momentum is:', ['30 kg·m/s','11 kg·m/s','1.2 kg·m/s','36 kg·m/s'],0,'P = M V_CM = 5×6 = 30 kg·m/s.'],['If all particles in a system have their velocities reversed, the total momentum:', ['reverses direction with the same magnitude','becomes zero always','doubles','does not change'],0,'Momentum is linear in velocity, so reversing every velocity reverses total momentum.'],['The rate of change of total momentum of a system equals:', ['net external force','net internal force','total mass','centre-of-mass position'],0,'F_ext = dP/dt for a system.'],['In an isolated system during a collision, total momentum before and after collision is:', ['the same','always zero','different','equal to kinetic energy'],0,'With negligible external impulse, total momentum is conserved.'],['A gun recoils when a bullet is fired because:', ['momentum of the gun-bullet system is conserved','kinetic energy must always be conserved','gravity creates the recoil','the bullet has no momentum'],0,'The forward bullet momentum is balanced by backward gun momentum when external impulse is negligible.'],['If the centre of mass of a system is at rest, the total linear momentum is:', ['zero','maximum','equal to total mass','always negative'],0,'P_total = M V_CM, so V_CM = 0 gives P_total = 0.'],['Two equal masses move with equal speeds in opposite directions. The system momentum is:', ['zero','equal to one particle momentum','twice one particle momentum','infinite'],0,'Equal and opposite momenta cancel vectorially.'],['A net external impulse of 10 N·s acts on a system. The change in its total momentum is:', ['10 kg·m/s','1 kg·m/s','100 kg·m/s','0.1 kg·m/s'],0,'Impulse equals change in total linear momentum.'],['If no external horizontal force acts on a person-boat system, its total horizontal momentum:', ['remains constant','must become zero','increases continuously','depends on the person only'],0,'The absence of external horizontal force conserves horizontal system momentum.'],['For a closed system of constant mass, conservation of total momentum means the centre-of-mass velocity:', ['remains constant when net external force is zero','must always be zero','always increases','is unrelated to momentum'],0,'P = M V_CM, so conserved momentum gives constant V_CM for constant M.']];let i=0,selected=-1,checked=false,score=0;const $=id=>document.getElementById(id),o=$("options"),b=$("continue"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;$("count").textContent='Question '+(i+1)+' of 15';$("question").textContent=a[0];o.innerHTML='';f.className='feedback';f.textContent='';b.style.display='inline-block';b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const el=document.createElement('button');el.className='option';el.textContent=String.fromCharCode(65+j)+'. '+item.text;el.dataset.index=item.index;el.onclick=()=>{selected=item.index;[...o.children].forEach(z=>z.classList.remove('selected'));el.classList.add('selected')};o.appendChild(el)})}b.onclick=()=>{if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(el=>{const n=Number(el.dataset.index);el.disabled=true;if(n===a[2])el.classList.add('correct');if(n===selected&&!ok)el.classList.add('wrong')});if(ok)score++;f.className=ok?'feedback good':'feedback bad';f.textContent=(ok?'🎯 Correct! +10 XP — ':'✗ Review — Correct answer: '+a[1][a[2]]+'. ')+a[3];$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$("question").textContent='🏆 System Momentum Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
