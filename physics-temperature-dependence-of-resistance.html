<body><div class="wrap"><div class="card"><h1>🌡️ Temperature Dependence of Resistance</h1>
<div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a>
</div></div>
<script>
const qs=[
['For a metallic conductor over a small temperature range, resistance is approximately','R_T=R_0[1+α(T−T_0)]','R_T=R_0[1−α(T−T_0)]','R_T=R_0/T','R_T=αR_0T',0,'For a metal over a limited temperature range, R_T=R_0[1+α(T−T_0)].'],
['For most metallic conductors, the temperature coefficient of resistance is','positive','negative','zero','infinite',0,'For metals, resistance generally increases with temperature, so α is positive.'],
['The SI unit of the temperature coefficient of resistance is','K','K⁻¹','Ω/K','Ω·K',1,'The coefficient α is a fractional change in resistance per degree, so its unit is K⁻¹.'],
['If a metal wire is heated, its resistance generally','decreases','increases','becomes zero','remains exactly constant',1,'Heating a metal generally increases lattice vibrations and electron scattering, increasing resistance.'],
['For a semiconductor, the temperature coefficient of resistance is generally','positive','negative','always zero','always infinite',1,'Semiconductors generally have a negative temperature coefficient: resistance decreases as temperature rises.'],
['A resistor has R₀=10 Ω at 20°C and α=0.004 K⁻¹. Its resistance at 70°C is','10.2 Ω','12 Ω','14 Ω','30 Ω',1,'R=10[1+0.004(70−20)]=10(1.2)=12 Ω.'],
['A metal resistor is 100 Ω at 25°C. If α=0.005 K⁻¹, its resistance at 45°C is','101 Ω','105 Ω','110 Ω','125 Ω',2,'R=100[1+0.005(20)]=110 Ω.'],
['If α=0.002 K⁻¹ and temperature rises by 50 K, the fractional increase in resistance is','0.001','0.01','0.1','1',1,'For a small temperature change, ΔR/R₀=αΔT=(0.002)(50)=0.10, i.e. 10%. The option should therefore be 0.1.'],
['The graph of resistance R versus temperature T for a metal over a small range is approximately','a straight line with positive slope','a straight line with negative slope','a horizontal line always','a vertical line',0,'For a metal in the linear approximation, R increases approximately linearly with temperature.'],
['In R_T=R_0[1+α(T−T_0)], R₀ denotes the resistance at','0 K only','temperature T₀','temperature T','100°C only',1,'R₀ is the resistance measured at the reference temperature T₀.'],
['If the resistance of a metal is 20 Ω at 0°C and α=0.005 K⁻¹, its resistance at 100°C is','20 Ω','21 Ω','25 Ω','30 Ω',3,'R=20[1+0.005(100)]=20(1.5)=30 Ω.'],
['A negative temperature coefficient means that resistance','increases as temperature increases','decreases as temperature increases','is independent of temperature','must be zero',1,'A negative coefficient means dR/dT is negative: resistance decreases as temperature rises.'],
['A thermistor is commonly used for','temperature sensing or control','producing magnetic fields only','storing electric charge only','measuring mass',0,'Thermistors are temperature-sensitive resistors used for sensing and control.'],
['For a metal with positive α, if its resistance is measured at a higher temperature than T₀, the resistance is','less than R₀','greater than R₀','always zero','negative',1,'With α>0 and T>T₀, the factor 1+α(T−T₀) is greater than 1, so R>R₀.'],
['A 50 Ω metal resistor at 20°C has α=0.004 K⁻¹. Its resistance at 120°C is','50 Ω','60 Ω','70 Ω','90 Ω',2,'R=50[1+0.004(100)]=50(1.4)=70 Ω.']
];
let i=0,score=0,answered=false;const $=x=>document.getElementById(x);
function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}
function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});if(ok){score++;$('xp').textContent='✨ Correct! +1 XP'}else $('xp').textContent='❌ Incorrect. '+q[6];$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}
function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();
</script></body></html>
