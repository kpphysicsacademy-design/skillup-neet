<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Temperature — 15 MCQ Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#203040;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:22px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:#123b70}.xp{font-weight:950;color:#1677ff}.hero{margin-top:14px;background:linear-gradient(135deg,#123b70,#1677ff);color:#fff;border-radius:24px;padding:22px}.hero h1{margin:5px 0 7px;font-size:clamp(28px,6vw,40px)}.hero p{margin:0;line-height:1.5;font-size:13px}.card{background:#fff;border:1px solid #d9e5f2;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 7px 20px rgba(18,59,112,.07)}.master{font-weight:900}.bar{height:10px;background:#e5edf6;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;width:0;background:#1677ff;transition:.3s}.qno{font-size:12px;color:#6b7280;font-weight:900}.q{font-size:20px;font-weight:900;line-height:1.4;margin:9px 0 16px}button.opt{display:block;width:100%;text-align:left;background:#fff;color:#203040;border:2px solid #dfe8f1;border-radius:14px;padding:14px;margin:10px 0;font-size:15px;font-weight:750;line-height:1.35;cursor:pointer;appearance:none}button.opt:hover{border-color:#9bc3ed;background:#f8fbff}button.opt.selected{border-color:#1677ff;background:#eef6ff;color:#123b70}button.opt.correct{border-color:#16803a;background:#eaf8ef;color:#145c2e}button.opt.wrong{border-color:#d64545;background:#fff0f0;color:#8f2020}button.continue{border:0;border-radius:13px;padding:12px 20px;background:#1677ff;color:#fff;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #0d5bbf}button.continue:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}.actions{display:flex;justify-content:flex-end;margin-top:15px}.feedback{min-height:25px;margin-top:13px;font-weight:800}.explain{margin-top:6px;color:#596774;font-weight:600}.back{display:block;width:max-content;margin:18px auto 0;padding:10px 15px;border:2px solid #d9e5f2;border-radius:12px;background:#fff;color:#1264d6;text-decoration:none;font-weight:900}.result{text-align:center}.score{font-size:34px;font-weight:950;color:#123b70}@media(max-width:520px){.wrap{padding:15px 10px 50px}.q{font-size:18px}button.opt{font-size:14px;padding:13px}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div class="brand">⚛️ SkillUp Physics<br><small>NEET 2026 • 15 MCQ QUIZ</small></div><div class="xp" id="xp">XP: 0</div></div>
<section class="hero"><div>🌡️ NEET PRACTICE</div><h1>Temperature</h1><p>15-question MCQ quiz. Select one answer, get instant feedback and build mastery.</p></section>
<section class="card"><div class="master">🏆 Quiz Progress <span id="mastery">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section>
<section class="card" id="quiz"><div class="qno" id="qno"></div><div class="q" id="question"></div><div id="opts"></div><div class="actions"><button class="continue" id="continue" type="button" disabled>Check Answer →</button></div><div class="feedback" id="feedback"></div></section>
<section class="card result" id="result" hidden></section>
<a class="back" id="back" href="physics-home-fast.html">← 📚 Back to Physics Path</a>
</main>
<script>
const questions=[
{q:'Temperature is a physical quantity that indicates the degree of',o:['mass of a body','hotness or coldness of a body','volume of a body','pressure only'],a:1,e:'Temperature is a measure of how hot or cold a body is and is related to the average kinetic energy of its particles.'},
{q:'The SI base unit of thermodynamic temperature is',o:['degree Celsius','degree Fahrenheit','kelvin','joule'],a:2,e:'The kelvin (K) is the SI base unit for thermodynamic temperature.'},
{q:'At absolute zero, the temperature on the Celsius scale is approximately',o:['0 °C','−100 °C','−273.15 °C','273.15 °C'],a:2,e:'Absolute zero is 0 K, corresponding to −273.15 °C.'},
{q:'The Celsius and Kelvin scales are related by',o:['K = °C − 273.15','K = °C + 273.15','K = 273.15 − °C','K = 2°C'],a:1,e:'Kelvin temperature equals Celsius temperature plus 273.15.'},
{q:'A temperature of 27 °C is equal to approximately',o:['246 K','273 K','300 K','327 K'],a:2,e:'T(K) = 27 + 273.15 ≈ 300 K.'},
{q:'The Fahrenheit temperature corresponding to 0 °C is',o:['−32 °F','0 °F','32 °F','212 °F'],a:2,e:'The Celsius and Fahrenheit scales satisfy F = 9C/5 + 32, so 0 °C = 32 °F.'},
{q:'The temperature 100 °C corresponds to',o:['180 °F','200 °F','212 °F','273 °F'],a:2,e:'F = 9(100)/5 + 32 = 212 °F.'},
{q:'The triple point of pure water is assigned a thermodynamic temperature of approximately',o:['0 K','273.16 K','300 K','373 K'],a:1,e:'The triple point of water is 273.16 K.'},
{q:'A thermometer works by measuring a physical property that changes with',o:['time only','temperature','mass only','gravity only'],a:1,e:'A thermometric property changes predictably with temperature and can therefore be used to measure it.'},
{q:'Which is a thermometric property used in a liquid-in-glass thermometer?',o:['Length of a wire','Volume of a liquid','Electrical resistance of metal only','Mass of air'],a:1,e:'Liquid-in-glass thermometers use the thermal expansion and hence volume/length of the liquid column.'},
{q:'On a Celsius scale, the interval between the ice point and steam point at standard atmospheric pressure is',o:['50 divisions','100 divisions','180 divisions','273 divisions'],a:1,e:'The Celsius scale assigns 0 °C to the ice point and 100 °C to the steam point, giving 100 divisions.'},
{q:'If a thermometer reads 20 °C, the corresponding Fahrenheit temperature is',o:['36 °F','52 °F','68 °F','80 °F'],a:2,e:'F = 9(20)/5 + 32 = 68 °F.'},
{q:'Which temperature scale has equal-sized degree intervals to the Celsius scale?',o:['Kelvin','Fahrenheit','Both Kelvin and Celsius','Neither'],a:2,e:'A change of 1 K has the same magnitude as a change of 1 °C; the zero points differ.'},
{q:'An increase of 10 °C corresponds to a temperature increase of',o:['10 K','18 K','32 K','273 K'],a:0,e:'Temperature differences have the same numerical size in kelvin and Celsius: ΔT(K) = ΔT(°C).'},
{q:'The principle that two bodies in thermal equilibrium with a third body are in thermal equilibrium with each other is the',o:['first law of thermodynamics','second law of thermodynamics','zeroth law of thermodynamics','law of conservation of mass'],a:2,e:'This is the Zeroth Law of Thermodynamics and forms the basis of temperature measurement.'}
];
let i=0,selected=null,checked=false,score=0;
const $=id=>document.getElementById(id);
function render(){selected=null;checked=false;$('feedback').textContent='';$('continue').disabled=true;$('continue').textContent=i===14?'Finish Quiz →':'Check Answer →';$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=questions[i].q;$('opts').innerHTML='';questions[i].o.forEach((text,index)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+index)+'. '+text;b.dataset.index=index;b.onclick=()=>{if(checked)return;selected=index;document.querySelectorAll('button.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('continue').disabled=false};$('opts').appendChild(b)});$('mastery').textContent=`${i} / 15`;$('fill').style.width=`${i/15*100}%`;$('xp').textContent=`XP: ${score*10}`}
function next(){if(selected===null)return;if(!checked){checked=true;const item=questions[i],ok=selected===item.a;if(ok)score++;document.querySelectorAll('button.opt').forEach(b=>{const n=Number(b.dataset.index);b.disabled=true;if(n===item.a)b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+`<div class="explain">${item.e}</div>`;$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=`${(i+1)/15*100}%`;$('xp').textContent=`XP: ${score*10}`}else if(i<14){i++;render()}else finish()}
function finish(){$('quiz').hidden=true;$('result').hidden=false;const pct=Math.round(score/15*100);$('result').innerHTML=`<h2>🎉 Temperature Complete!</h2><div class="score">${score} / 15</div><p><strong>${pct}%</strong> accuracy</p><p>🏆 You earned <strong>${score*10} XP</strong>.</p><p>${score>=12?'🔥 Excellent NEET readiness!':score>=9?'💪 Good work. Revise and retry for mastery.':'📚 Revise temperature and try again.'}</p><button class="continue" type="button" onclick="location.reload()">Retry 15 MCQs</button>`}
$('continue').onclick=next;
$('back').onclick=function(){const s=sessionStorage.getItem('skillupLastPhysicsPath');if(s){try{const u=new URL(s,location.href);if(u.origin===location.origin){location.href=s;return false}}catch(e){}}location.href='physics-home-fast.html';return false};
render();
</script>
</body>
</html>
