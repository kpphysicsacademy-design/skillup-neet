<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1f1e5"><title>SkillUp Physics | Tension — Simulator</title><link rel="stylesheet" href="physics-duolingo-quiz.css?v=20261122-all-topics-v1"><style>body{margin:0;background:#f1f1e5;color:#27372e;font-family:system-ui,sans-serif}header{background:#fbfbf3;border-bottom:1px solid #dce1d4}.nav{width:min(100% - 24px,720px);min-height:68px;margin:auto;display:flex;align-items:center;gap:10px}.back{width:42px;height:42px;display:grid;place-items:center;border:2px solid #dce5d7;border-radius:14px;background:#f2f9ff;color:#174a78;text-decoration:none}.brand{font-weight:950}.brand small{display:block;font-size:9px;color:#68766a}main{width:min(100% - 24px,720px);margin:16px auto 40px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.tab{min-height:46px;display:grid;place-items:center;border:2px solid #dce8f3;border-radius:14px;background:#fff;color:#245273;text-decoration:none;font-size:13px;font-weight:900}.tab.active{background:#e8f8dc;border-color:#8ed65b;color:#286c12}.card{background:#fff;border:2px solid #e2e9df;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 5px 0 #dce8f3}.hero{background:#e9eddf}h1{color:#254b37}.muted{line-height:1.6;color:#5f6f61}.field{margin:17px 0}.field label{display:flex;justify-content:space-between;font-weight:850;margin-bottom:8px}.field input,.field select{width:100%;padding:12px;border:2px solid #d6ddce;border-radius:12px;background:#fbfbf3}.field input[type=range]{padding:0;accent-color:#58cc02}.result{margin:12px 0;padding:14px;border-radius:14px;background:#efffe7;border:1px solid #c8f0b2;text-align:center}.result b{display:block;font-size:20px;color:#286c12}.results{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:400px){.tab{font-size:11px}}</style></head><body><header><div class="nav"><a class="back" href="physics-home-fast.html">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div></div></header><main><nav class="tabs" aria-label="Tension pages"><a class="tab" href="physics-tension-learn.html">📘 Learn</a><a class="tab active" href="physics-tension-simulator.html" aria-current="page">🎮 Simulator</a><a class="tab" href="physics-tension-practice.html">🧠 Practice</a></nav><section class="card hero"><h1>🪢 Tension Simulator</h1><p class="muted">Explore tension in a hanging mass and in an ideal Atwood machine.</p><div class="formula">For a hanging mass at rest: T = mg</div></section><section class="card"><div class="field"><label for="mode">System</label><select id="mode"><option value="hang">Single hanging mass at rest</option><option value="atwood">Two connected masses (Atwood machine)</option></select></div><div class="field"><label for="mass1">Mass 1 (kg) <output id="mass1Out">2</output></label><input id="mass1" type="range" min="0.1" max="20" step="0.1" value="2"></div><div class="field"><label for="mass2">Mass 2 (kg) <output id="mass2Out">5</output></label><input id="mass2" type="range" min="0.1" max="20" step="0.1" value="5"></div><div class="field"><label for="g">g (m/s²) <output id="gOut">9.8</output></label><input id="g" type="range" min="1" max="15" step="0.1" value="9.8"></div><div class="results"><div class="result">Tension<b id="tension">19.6 N</b></div><div class="result">Acceleration<b id="acceleration">0 m/s²</b></div></div></section></main><script>(function(){"use strict";const $=id=>document.getElementById(id);const $=id=>document.getElementById(id),fmt=n=>Number(n.toPrecision(6)).toString();function update(){const m1=+$('mass1').value,m2=+$('mass2').value,g=+$('g').value,mode=$('mode').value;['mass1','mass2','g'].forEach(id=>$(id+'Out').textContent=$(id).value);if(mode==='hang'){$('tension').textContent=fmt(m1*g)+' N';$('acceleration').textContent='0 m/s²';$('mass2').disabled=true;}else{const a=Math.abs(m2-m1)*g/(m1+m2),t=2*m1*m2*g/(m1+m2);$('tension').textContent=fmt(t)+' N';$('acceleration').textContent=fmt(a)+' m/s²';$('mass2').disabled=false;}}['mass1','mass2','g','mode'].forEach(id=>$(id).addEventListener('input',update));update();})();</script><script src="shared-nav.js?v=20261125-unified-botany-theme-v1"></script></body></html>
