<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🛠️ Thermal Conductivity</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [{q:"What is thermal conductivity?",o:["A measure of how well a material conducts heat","The amount of heat stored by a body","The temperature at which a solid melts","The rate of fluid flow"],a:0,e:"Thermal conductivity describes a material's ability to conduct heat."},{q:"The SI unit of thermal conductivity is:",o:["J kg⁻¹ K⁻¹","W m⁻¹ K⁻¹","W m K⁻¹","J s⁻¹ K"],a:1,e:"Thermal conductivity k is measured in watts per metre per kelvin."},{q:"In steady one-dimensional conduction through a slab, heat current is proportional to:",o:["Thickness only","Temperature only, independent of area","Area and temperature difference","Thickness and inversely to area"],a:2,e:"Fourier's law gives heat current proportional to area and temperature difference."},{q:"For a uniform slab, the magnitude of heat current is:",o:["kLΔT/A","kAΔT/L","A L ΔT/k","kA L/ΔT"],a:1,e:"For steady conduction, H = kA(T₁−T₂)/L."},{q:"If the area of a slab doubles while all other factors stay constant, heat current:",o:["Doubles","Halves","Becomes four times","Stays the same"],a:0,e:"Heat current is directly proportional to the cross-sectional area."},{q:"If the thickness of a slab doubles, heat current becomes:",o:["Twice as large","Four times as large","Half as large","Unchanged"],a:2,e:"Heat current is inversely proportional to thickness."},{q:"A larger temperature difference across the same slab generally causes:",o:["A smaller heat current","A larger heat current","No heat transfer","Thermal conductivity to become zero"],a:1,e:"At fixed material, area and thickness, heat current is proportional to ΔT."},{q:"Which material generally has the highest thermal conductivity among these?",o:["Air","Wood","Copper","Rubber"],a:2,e:"Copper is a good thermal conductor, unlike air, wood and rubber."},{q:"Which is generally a good thermal insulator?",o:["Silver","Copper","Aluminium","Still air"],a:3,e:"Air has low thermal conductivity, which helps make trapped air a good insulator."},{q:"Why are saucepan handles often made of wood or plastic?",o:["They have very high thermal conductivity","They reduce heat flow to the hand","They produce cold energy","They increase the pan's temperature"],a:1,e:"Wood and many plastics conduct heat poorly, making handles safer to hold."},{q:"In Fourier's law, the negative sign indicates that heat flows:",o:["From colder to hotter regions spontaneously","Only vertically downward","From higher temperature toward lower temperature","Only through metals"],a:2,e:"The negative sign indicates heat flow opposite to the direction of increasing temperature."},{q:"The temperature gradient has SI unit:",o:["K m⁻¹","W m⁻²","J kg⁻¹","K m"],a:0,e:"Temperature gradient is temperature change per unit distance."},{q:"A wall has k = 0.5 W m⁻¹ K⁻¹, area 2 m², thickness 0.1 m and temperature difference 10 K. Heat current is:",o:["10 W","50 W","100 W","200 W"],a:2,e:"H = kAΔT/L = 0.5×2×10/0.1 = 100 W."},{q:"If k doubles with area, thickness and temperature difference fixed, heat current:",o:["Halves","Doubles","Becomes zero","Does not change"],a:1,e:"Heat current is directly proportional to thermal conductivity."},{q:"Two slabs of equal dimensions are kept across the same temperature difference. The slab with larger k transfers heat:",o:["More rapidly","Less rapidly","At exactly zero rate","Only if it is liquid"],a:0,e:"Higher thermal conductivity means a larger conduction rate for the same geometry and ΔT."},{q:"Which statement about thermal conductivity is correct?",o:["It is always the same for every material","It measures resistance to electric current","It is a material property under specified conditions","It has no units"],a:2,e:"Thermal conductivity characterizes heat conduction in a material and can depend on temperature."},{q:"A composite wall has two layers in series. At steady state, the heat current through each layer is:",o:["Different at every layer","The same, if there is no heat loss between layers","Always zero","Proportional only to each layer's mass"],a:1,e:"Energy conservation requires the same steady heat current through layers in series."},{q:"For two layers in series, total thermal resistance is:",o:["The difference of their resistances","The product only","The sum of their thermal resistances","Always zero"],a:2,e:"Thermal resistances in series add, analogous to electrical resistances in series."},{q:"For a slab, thermal resistance to conduction is:",o:["L/(kA)","kA/L","kL/A","A/(kL)"],a:0,e:"From H = ΔT/R, the slab resistance is R = L/(kA)."},{q:"If a slab's thickness is reduced to half, its thermal resistance:",o:["Doubles","Halves","Becomes four times","Is unchanged"],a:1,e:"R = L/(kA), so halving L halves thermal resistance."},{q:"Why does a metal spoon feel colder than a wooden spoon at the same room temperature?",o:["Metal is always at a lower temperature","Metal draws heat from the hand faster due to higher conductivity","Wood has no internal energy","Wood creates heat continuously"],a:1,e:"Metal conducts heat away from the skin faster, creating a colder sensation."},{q:"Which change would reduce heat loss by conduction through a wall?",o:["Increase its area","Increase its thickness","Increase its thermal conductivity","Increase the temperature difference"],a:1,e:"A thicker wall has greater thermal resistance and lower heat current."},{q:"A material's thermal conductivity is 0.2 W m⁻¹ K⁻¹. What does this unit represent?",o:["Energy per unit mass","Power conducted per metre for each kelvin of temperature gradient in the defining geometry","Temperature per second","Force per unit area"],a:1,e:"The unit expresses heat conduction rate relative to area and temperature gradient."},{q:"At a fixed heat current and area, a material with lower thermal conductivity needs:",o:["A smaller temperature gradient","No temperature difference","A larger temperature gradient","A negative thickness"],a:2,e:"For the same heat flux, lower k requires a steeper temperature gradient."},{q:"Which of the following is a common application of low thermal conductivity?",o:["Heat sink fins made of copper","Insulation in building walls","Copper electrical wires","Metal cooking pans"],a:1,e:"Building insulation reduces heat transfer through walls and roofs."},{q:"Why are cooking pans commonly made from metals such as aluminium?",o:["Metals conduct heat effectively","Metals prevent all heat transfer","Metals have zero heat capacity","Metals are always transparent"],a:0,e:"Good thermal conductivity helps spread heat from the stove to the food."},{q:"In steady conduction through a slab, if both ΔT and thickness double, while k and area stay fixed, heat current:",o:["Doubles","Halves","Stays the same","Becomes four times"],a:2,e:"H is proportional to ΔT/L; doubling both leaves their ratio unchanged."},{q:"Two identical slabs are placed side by side so the total conducting area doubles. Under the same temperature difference, heat current:",o:["Halves","Doubles","Stays the same","Becomes zero"],a:1,e:"Doubling the parallel conducting area doubles total heat current."},{q:"Which condition best describes steady-state heat conduction?",o:["Temperature at each point changes with time","The temperature profile is constant with time","No heat passes through the material","The entire slab must be at one temperature"],a:1,e:"In steady state, temperature at each position remains constant over time, although a gradient may exist."},{q:"A layer has thermal resistance 2 K/W and the temperature difference across it is 12 K. Heat current is:",o:["6 W","10 W","14 W","24 W"],a:0,e:"Heat current H = ΔT/R = 12/2 = 6 W."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Thermal Conductivity Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
