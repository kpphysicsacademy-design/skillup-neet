*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#203040;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:22px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:#123b70}.xp{font-weight:950;color:#1677ff}.hero{margin-top:14px;background:linear-gradient(135deg,#123b70,#1677ff);color:#fff;border-radius:24px;padding:22px}.hero h1{margin:5px 0 7px;font-size:clamp(27px,6vw,40px)}.hero p{margin:0;line-height:1.5;font-size:13px}.card{background:#fff;border:1px solid #d9e5f2;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 7px 20px rgba(18,59,112,.07)}.master{font-weight:900}.bar{height:10px;background:#e5edf6;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;width:0;background:#1677ff;transition:.3s}.qno{font-size:12px;color:#6b7280;font-weight:900}.q{font-size:20px;font-weight:900;line-height:1.4;margin:9px 0 16px}button.opt{display:block;width:100%;text-align:left;background:#fff;color:#203040;border:2px solid #dfe8f1;border-radius:14px;padding:14px;margin:10px 0;font-size:15px;font-weight:750;line-height:1.35;cursor:pointer;appearance:none}button.opt:hover{border-color:#9bc3ed;background:#f8fbff}button.opt.selected{border-color:#1677ff;background:#eef6ff;color:#123b70}button.opt.correct{border-color:#16803a;background:#eaf8ef;color:#145c2e}button.opt.wrong{border-color:#d64545;background:#fff0f0;color:#8f2020}button.continue{border:0;border-radius:13px;padding:12px 20px;background:#1677ff;color:#fff;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #0d5bbf}button.continue:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}.actions{display:flex;justify-content:flex-end;margin-top:15px}.feedback{min-height:25px;margin-top:13px;font-weight:800}.explain{margin-top:6px;color:#596774;font-weight:600}.back{display:block;width:max-content;margin:18px auto 0;padding:10px 15px;border:2px solid #d9e5f2;border-radius:12px;background:#fff;color:#1264d6;text-decoration:none;font-weight:900}.result{text-align:center}.score{font-size:34px;font-weight:950;color:#123b70}@media(max-width:520px){.wrap{padding:15px 10px 50px}.q{font-size:18px}button.opt{font-size:14px;padding:13px}}

<body><main class="wrap">
<div class="top"><div class="brand">⚛️ SkillUp Physics<br><small>NEET 2026 • 15 MCQ QUIZ</small></div><div class="xp" id="xp">XP: 0</div></div>
<section class="hero"><div>🔥 NEET PRACTICE</div><h1>Thermal Equilibrium</h1><p>15-question MCQ quiz. Select one answer, get instant feedback and build mastery.</p></section>
<section class="card"><div class="master">🏆 Quiz Progress <span id="mastery">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section>
<section class="card" id="quiz"><div class="qno" id="qno"></div><div class="q" id="question"></div><div id="opts"></div><div class="actions"><button class="continue" id="continue" type="button" disabled>Check Answer →</button></div><div class="feedback" id="feedback"></div></section>
<section class="card result" id="result" hidden></section>

</main>
<script>
const questions=[
{q:'Two bodies are in thermal equilibrium when they have the same',o:['mass','volume','temperature','internal energy'],a:2,e:'Thermal equilibrium means there is no net heat flow between bodies in contact; for ordinary equilibrium this corresponds to equal temperature.'},
{q:'The zeroth law of thermodynamics provides the basis for the concept of',o:['work','temperature','entropy','mechanical energy'],a:1,e:'If A is in thermal equilibrium with C and B is also in thermal equilibrium with C, A and B are in equilibrium with each other. This establishes temperature as a common property.'},
{q:'If two bodies at different temperatures are placed in thermal contact, heat flows spontaneously from',o:['cold to hot','hot to cold','lower mass to higher mass','higher volume to lower volume'],a:1,e:'Without external intervention, thermal energy transfers from the body at higher temperature to the body at lower temperature.'},
{q:'At thermal equilibrium between two bodies, the net heat transfer between them is',o:['maximum','minimum but nonzero','zero','infinite'],a:2,e:'At equilibrium, microscopic exchanges can still occur, but there is no net heat transfer.'},
{q:'A thermometer reaches thermal equilibrium with a body when its reading becomes',o:['zero','constant and equal to the body temperature','equal to the body mass','independent of time'],a:1,e:'The thermometer and body reach the same temperature, so the thermometer reading becomes steady.'},
{q:'Which statement is required by the zeroth law?',o:['Energy is always conserved','Heat always flows from cold to hot','Thermal equilibrium is transitive','Pressure is constant'],a:2,e:'The zeroth law states the transitive property of thermal equilibrium.'},
{q:'If A is in thermal equilibrium with B, and B is in thermal equilibrium with C, then A is in thermal equilibrium with',o:['only A','B only','C','neither B nor C'],a:2,e:'By the zeroth law, thermal equilibrium is transitive: A and C must have the same temperature.'},
{q:'A system in thermal equilibrium has',o:['a uniform temperature in equilibrium','zero molecular motion','zero internal energy','necessarily zero pressure'],a:0,e:'A system in thermal equilibrium has no temperature gradients driving net heat flow. Molecular motion does not stop.'},
{q:'A hot metal block is immersed in cooler water in an insulated container. Eventually, both reach',o:['different temperatures','the same temperature','0 °C','the boiling point'],a:1,e:'In an insulated container, energy is exchanged internally until the block and water reach a common equilibrium temperature.'},
{q:'The instrument used to establish whether two bodies have the same temperature is a',o:['barometer','thermometer','ammeter','calorimeter only'],a:1,e:'A thermometer measures temperature and can be used to compare the thermal states of bodies.'},
{q:'When a system reaches thermal equilibrium, the macroscopic temperature',o:['continues increasing','continues decreasing','becomes stable','must become 0 K'],a:2,e:'The equilibrium temperature remains stable in the absence of external changes.'},
{q:'If two bodies have the same temperature but are separated by an insulating wall, their thermal equilibrium is',o:['not possible','consistent with equal temperature','dependent only on mass','dependent only on volume'],a:1,e:'Equal temperature is the defining thermal condition for equilibrium; an insulating wall simply prevents heat exchange.'},
{q:'In thermal equilibrium, which quantity has no net directional transfer between two bodies?',o:['electric charge','heat','mass in every case','momentum in every case'],a:1,e:'There is no net transfer of thermal energy (heat) when two bodies are in thermal equilibrium.'},
{q:'A cup of hot tea left in a room eventually approaches the room temperature because of',o:['thermal interaction with the surroundings','increase in its mass','loss of gravity','creation of energy'],a:0,e:'The tea exchanges energy with the surroundings until it approaches the ambient equilibrium temperature.'},
{q:'Which is the most direct condition for thermal equilibrium between two systems?',o:['Equal masses','Equal volumes','Equal temperatures','Equal densities'],a:2,e:'Equal temperature is the key thermodynamic condition for thermal equilibrium and absence of net heat flow.'}
];
let i=0,selected=null,checked=false,score=0;
const $=id=>document.getElementById(id);
function render(){selected=null;checked=false;$('feedback').textContent='';$('continue').disabled=true;$('continue').textContent=i===14?'Finish Quiz →':'Check Answer →';$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=questions[i].q;$('opts').innerHTML='';questions[i].o.forEach((text,index)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+index)+'. '+text;b.dataset.index=index;b.onclick=()=>{if(checked)return;selected=index;document.querySelectorAll('button.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('continue').disabled=false};$('opts').appendChild(b)});$('mastery').textContent=`${i} / 15`;$('fill').style.width=`${i/15*100}%`;$('xp').textContent=`XP: ${score*10}`}
function next(){if(selected===null)return;if(!checked){checked=true;const item=questions[i],ok=selected===item.a;if(ok)score++;document.querySelectorAll('button.opt').forEach(b=>{const n=Number(b.dataset.index);b.disabled=true;if(n===item.a)b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+`<div class="explain">${item.e}</div>`;$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=`${(i+1)/15*100}%`;$('xp').textContent=`XP: ${score*10}`}else if(i<14){i++;render()}else finish()}
function finish(){$('quiz').hidden=true;$('result').hidden=false;const pct=Math.round(score/15*100);$('result').innerHTML=`<h2>🎉 Thermal Equilibrium Complete!</h2><div class="score">${score} / 15</div><p><strong>${pct}%</strong> accuracy</p><p>🏆 You earned <strong>${score*10} XP</strong>.</p><p>${score>=12?'🔥 Excellent NEET readiness!':score>=9?'💪 Good work. Revise and retry for mastery.':'📚 Revise thermal equilibrium and try again.'}</p><button class="continue" type="button" onclick="location.reload()">Retry 15 MCQs</button>`}
$('continue').onclick=next;
$('back').onclick=function(){location.href='physics-home-fast.html';return false};
render();
</script>
