<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🌡️ Thermal Equilibrium</h1><p class="muted">Understand temperature, heat flow, and the zeroth law one small step at a time.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{"q":"Two bodies are in thermal equilibrium when they have the same:","o":["mass","temperature","volume","internal energy"],"a":1,"e":"Equal temperature means there is no net heat flow between bodies in thermal contact."},
{"q":"The zeroth law of thermodynamics establishes the concept of:","o":["work","power","temperature","specific heat"],"a":2,"e":"The zeroth law lets us compare temperatures using a third system such as a thermometer."},
{"q":"If A is in thermal equilibrium with C, and B is also in equilibrium with C, then:","o":["A and B are in thermal equilibrium","A must be hotter than B","B must contain more energy","A and B must have equal masses"],"a":0,"e":"Thermal equilibrium is transitive, which is the central idea of the zeroth law."},
{"q":"When a hot object touches a cooler object, net heat flows initially from:","o":["cooler to hotter","the object with greater mass","the object with greater volume","hotter to cooler"],"a":3,"e":"Spontaneous heat transfer is from higher temperature to lower temperature."},
{"q":"At thermal equilibrium, the net heat transfer between two bodies in contact is:","o":["zero","always positive","always negative","equal to their masses"],"a":0,"e":"Energy may still exchange microscopically, but there is no net heat transfer."},
{"q":"A thermometer gives a stable reading after being placed in contact with an object because they:","o":["have equal masses","have equal volumes","reach thermal equilibrium","stop all molecular motion"],"a":2,"e":"The thermometer settles to the object's temperature once they reach thermal equilibrium."},
{"q":"Which statement best describes the zeroth law?","o":["Energy cannot be created or destroyed","Thermal equilibrium is a transitive relation","Pressure is the same in every fluid","Heat is measured in newtons"],"a":1,"e":"If two systems are each in thermal equilibrium with a third, they are in equilibrium with each other."},
{"q":"Two objects have the same temperature. If placed in thermal contact, the expected net heat flow is:","o":["from the heavier object","from the larger object","from the denser object","zero"],"a":3,"e":"Equal temperatures mean no net heat transfer due to a temperature difference."},
{"q":"A metal spoon is placed in hot tea. Heat initially flows:","o":["from tea to spoon","from spoon to tea","only if the spoon is heavier","only after the tea boils"],"a":0,"e":"The tea is initially hotter, so energy flows into the cooler spoon."},
{"q":"Which instrument is designed to measure temperature?","o":["barometer","thermometer","ammeter","spring balance"],"a":1,"e":"A thermometer uses a temperature-dependent property to indicate temperature."},
{"q":"A system in thermal equilibrium has no macroscopic tendency for heat flow caused by:","o":["mass difference","shape difference","temperature differences within the system","gravity alone"],"a":2,"e":"Thermal equilibrium means there are no temperature gradients driving net heat transfer."},
{"q":"Which quantity must be equal for two systems in thermal equilibrium?","o":["mass","density","internal energy","temperature"],"a":3,"e":"Thermal equilibrium is characterized by equal temperature, not equal mass or internal energy."},
{"q":"A hot cup of coffee cools in a room until it approaches room temperature. This happens because:","o":["its mass increases","energy transfers to cooler surroundings","gravity decreases","its specific heat becomes zero"],"a":1,"e":"Heat transfers from the hotter coffee to the cooler surroundings until temperatures approach equilibrium."},
{"q":"If body A and body B are each separately in equilibrium with thermometer T, then A and B have:","o":["the same temperature","the same mass","the same heat capacity","the same internal energy"],"a":0,"e":"By the zeroth law, both bodies share the thermometer's temperature and hence each other’s."},
{"q":"At thermal equilibrium, the average temperature of an isolated system is expected to:","o":["increase without limit","fall to absolute zero","remain stable macroscopically","change every second"],"a":2,"e":"In equilibrium without external changes, macroscopic thermal properties remain steady."},
{"q":"Which condition is NOT required for two objects to have equal temperatures?","o":["They have equal masses","Their temperatures are equal","They can be compared with a thermometer","They may be different materials"],"a":0,"e":"Mass does not determine temperature; objects of different masses can share the same temperature."},
{"q":"A thermometer is first cooler than a warm liquid. During measurement, heat flows mainly:","o":["from thermometer to liquid","from the room only","in neither direction at any instant","from liquid to thermometer"],"a":3,"e":"The warmer liquid transfers energy to the cooler thermometer until they equilibrate."},
{"q":"Thermal equilibrium is reached when the bodies in contact have:","o":["equal heat capacities","equal temperatures","equal volumes","equal thermal conductivities"],"a":1,"e":"Equal temperature removes the temperature difference responsible for net heat transfer."},
{"q":"Which is a correct example of thermal equilibrium?","o":["Ice melting in warm water","A hot pan cooling on a table","A thermometer's reading matching the body's steady temperature","Water boiling while continuously heated"],"a":2,"e":"A steady matching thermometer reading indicates the thermometer and body have equilibrated."},
{"q":"The zeroth law is useful because it allows us to:","o":["calculate mass from volume","measure temperature consistently","eliminate friction","convert heat directly into mass"],"a":1,"e":"It provides the logical basis for temperature measurement and comparison."},
{"q":"Two systems are separated by a diathermal wall and have different temperatures. Initially, heat flows until:","o":["their temperatures become equal","their masses become equal","both reach 0°C","their volumes become equal"],"a":0,"e":"A diathermal wall allows heat transfer, so the systems tend toward a common equilibrium temperature."},
{"q":"A perfectly insulating wall between two systems primarily:","o":["guarantees equal temperatures","increases heat flow","acts as a thermometer","prevents heat exchange through the wall"],"a":3,"e":"An insulating wall restricts heat transfer; it does not itself make temperatures equal."},
{"q":"Which statement about molecules at thermal equilibrium is correct?","o":["All molecules stop moving","All molecules have identical speeds","Molecular motion continues","The system has no internal energy"],"a":2,"e":"Thermal equilibrium does not stop microscopic motion; it means macroscopic thermal conditions are steady."},
{"q":"A thermometer should be allowed time to settle before its reading is taken so that:","o":["its mass can change","it can approach thermal equilibrium with the object","the object loses all internal energy","the room temperature becomes zero"],"a":1,"e":"A settled reading indicates the thermometer has reached the object's temperature closely."},
{"q":"Two blocks at 25°C are made of different materials. If placed in contact, the net heat flow due only to temperature difference is:","o":["from metal to wood always","from wood to metal always","proportional to the mass difference","zero"],"a":3,"e":"Equal initial temperatures mean no net heat transfer driven by a temperature difference."},
{"q":"Which pair can be in thermal equilibrium even if their internal energies differ?","o":["Two systems at the same temperature but with different masses and materials","Only systems with identical masses","Only systems made from the same material","Only systems with zero internal energy"],"a":0,"e":"Internal energy depends on factors such as mass and material; equal temperature does not require equal internal energy."},
{"q":"A body is at 80°C and another at 30°C. If they are put in thermal contact in an insulated setup, heat initially flows:","o":["from 30°C to 80°C","equally in both directions with no net flow","from 80°C to 30°C","only if their masses match"],"a":2,"e":"The higher-temperature body initially transfers net heat to the lower-temperature body."},
{"q":"Which statement is true at thermal equilibrium?","o":["There is no molecular motion","There is no net heat flow between systems at equal temperature","Every object has the same internal energy","All energy transfer everywhere stops"],"a":1,"e":"Equilibrium means no net heat flow from a temperature difference; microscopic motion continues."},
{"q":"If A is at 300 K and B is at 300 K, their temperatures are:","o":["different because Kelvin is absolute","unknown until masses are measured","equal only if volumes match","equal"],"a":3,"e":"Both temperatures are the same numerical value on the same scale, so they are equal."},
{"q":"What is the most direct sign that a thermometer has reached thermal equilibrium with an object?","o":["Its reading has become steady","It has become heavier","Its colour always changes","The object stops containing energy"],"a":0,"e":"A stable reading indicates there is no longer a significant temperature difference between thermometer and object."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Thermal Equilibrium Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
