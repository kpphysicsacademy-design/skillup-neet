<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Thermodynamic Cycles</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🔄 Thermodynamic Cycles</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['A thermodynamic cycle is a process in which the system','returns to its initial state','always remains at constant pressure','always remains at constant temperature','has zero heat transfer',0,'In a thermodynamic cycle, the system returns to its initial thermodynamic state.'],
['For a complete thermodynamic cycle, the change in internal energy is','positive','negative','zero','infinite',2,'Internal energy is a state function, so its net change over a complete cycle is zero.'],
['The net work done by a cyclic heat engine is represented by the','area under a single isotherm only','area enclosed by the cycle on a P–V diagram','slope of the P–V curve','volume at the initial state',1,'The net work in a cyclic process equals the area enclosed by the cycle on a P–V diagram.'],
['A clockwise cycle on a P–V diagram generally represents','net work done on the gas','net work done by the gas','zero work in every case','an impossible cycle',1,'For a clockwise P–V cycle, expansion occurs at higher pressure than compression, giving positive net work by the gas.'],
['An anticlockwise cycle on a P–V diagram generally represents','net work done by the gas','net work done on the gas','zero heat transfer always','an isothermal cycle',1,'An anticlockwise cycle has negative net work by the system, meaning work is done on the system.'],
['The Carnot cycle consists of','two isothermal and two adiabatic processes','two isobaric and two isochoric processes','four isothermal processes','four isobaric processes',0,'The reversible Carnot cycle contains two isothermal and two adiabatic processes.'],
['In a cyclic process, the net heat supplied to the system is equal to','the change in internal energy','the net work done by the system','zero always','the final pressure',1,'From the first law, ΔU = Q − W. For a cycle ΔU=0, hence net Q equals net W.'],
['For a reversible adiabatic process, heat exchange with the surroundings is','maximum','zero','equal to work','always negative',1,'An adiabatic process has Q=0, so no heat is exchanged with the surroundings.'],
['In an isothermal process for an ideal gas, the temperature','increases continuously','decreases continuously','remains constant','becomes zero',2,'Isothermal means constant temperature. For an ideal gas, internal energy therefore remains constant.'],
['In an isochoric process, the volume','increases','decreases','remains constant','equals pressure',2,'Isochoric means constant volume. Since dV=0, boundary work is zero.'],

];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});if(ok){score++;$('xp').textContent='✨ Correct! +1 XP'}else $('xp').textContent='❌ Incorrect. '+q[6];$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><p style="text-align:center">🏆 XP earned: <b>${score}</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
