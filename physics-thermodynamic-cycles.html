<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🌡️ Thermodynamic Cycles</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[{"q":"What is a thermodynamic cycle?","o":["A sequence of processes returning a system to its initial state","A single process with no energy transfer","A change that never ends","A process at constant temperature only"],"a":0,"e":"In a cycle, the system returns to its starting thermodynamic state."},{"q":"What is the net change in internal energy over a complete cycle?","o":["Zero","Positive","Negative","Equal to heat absorbed"],"a":0,"e":"Internal energy is a state function, so returning to the initial state gives ΔU = 0."},{"q":"For a complete cycle, the first law implies that net heat supplied is…","o":["Equal to net work done by the system","Always zero","Always negative","Twice the net work"],"a":0,"e":"Since ΔU = 0 for a cycle, net heat transfer equals net work done by the system."},{"q":"On a pressure-volume (P–V) diagram, the work done in a cycle equals…","o":["The signed area enclosed by the loop","The slope at the starting point","The pressure at the end point","The volume at the start point"],"a":0,"e":"Cyclic work is the signed area enclosed on the P–V diagram."},{"q":"A clockwise loop on a P–V diagram usually represents…","o":["Positive net work done by the gas","Negative net work done by the gas","Zero work in all cases","No heat transfer"],"a":0,"e":"For the usual P–V convention, a clockwise cycle has positive net work output."},{"q":"An anticlockwise cycle on a P–V diagram usually means…","o":["Net work is done on the gas","The gas produces net work","The pressure is always zero","The system has no internal energy"],"a":0,"e":"An anticlockwise loop corresponds to negative work by the gas, or net work input."},{"q":"Why is internal energy change zero after a complete cycle?","o":["The final state equals the initial state","Heat transfer must be zero","Work must be zero","Temperature must be zero"],"a":0,"e":"Internal energy depends on state, not on the path taken."},{"q":"Can heat transfer over a cycle be nonzero even though ΔU = 0?","o":["Yes","No","Only for an adiabatic cycle","Only if pressure is constant"],"a":0,"e":"The net heat can be nonzero and equals the net work for a complete cycle."},{"q":"A cyclic engine absorbs 800 J of net heat over a cycle. Its net work output is…","o":["0 J","400 J","800 J","1,600 J"],"a":2,"e":"For a cycle, Qnet = Wnet, so the work output is 800 J."},{"q":"If net work done by a cyclic system is 250 J, the net heat transfer to it is…","o":["−250 J","0 J","250 J","500 J"],"a":2,"e":"With the convention that heat entering and work done by the system are positive, Qnet = Wnet = 250 J."},{"q":"Which quantity is a state function?","o":["Internal energy","Work","Heat","Path length"],"a":0,"e":"Internal energy depends on the state; heat and work depend on the path."},{"q":"Which pair consists of path-dependent quantities?","o":["Heat and work","Pressure and temperature","Volume and internal energy","Mass and temperature"],"a":0,"e":"Heat and work describe energy transfer along a path."},{"q":"In a cyclic process, the working substance…","o":["Returns to its initial state","Must end at a higher temperature","Cannot do work","Cannot exchange heat"],"a":0,"e":"A cycle is defined by the return to the initial state."},{"q":"Which area represents net work on a P–V diagram?","o":["The area enclosed by the cycle, with sign set by direction","The area above the pressure axis only","The vertical height only","The horizontal width only"],"a":0,"e":"The loop's signed enclosed area gives net cyclic work."},{"q":"A rectangular cycle spans pressures 2 and 5 kPa and volumes 1 and 4 m³. The enclosed area magnitude is…","o":["3 J","9 J","12 J","15 J"],"a":2,"e":"Area = ΔPΔV = (5 − 2) kPa × (4 − 1) m³ = 9 kJ. (Because 1 kPa·m³ = 1 kJ.)"},{"q":"For a complete cycle, if net heat added is 600 J, what is net work done by the system?","o":["−600 J","0 J","300 J","600 J"],"a":3,"e":"With ΔU = 0, the net heat added equals the net work done by the system."},{"q":"Which cycle is used as the ideal model for maximum heat-engine efficiency between two reservoirs?","o":["Carnot cycle","A single isochoric process","Free expansion only","A straight-line path only"],"a":0,"e":"The reversible Carnot cycle gives the maximum possible efficiency for fixed reservoir temperatures."},{"q":"The Carnot cycle consists of…","o":["Two isothermal and two adiabatic processes","Two isobaric and two isochoric processes","Four isothermal processes","Four adiabatic processes"],"a":0,"e":"Its four reversible stages alternate isothermal and adiabatic processes."},{"q":"In a refrigerator cycle, the net work input is used to…","o":["Move heat from the cold space to warmer surroundings","Create energy from nothing","Stop all heat exchange","Make both reservoirs the same temperature instantly"],"a":0,"e":"The input work drives heat transfer from cold to hot."},{"q":"A heat engine cycle generally…","o":["Takes in heat, produces net work, and rejects some heat","Converts all heat input to work in every real case","Consumes work only and produces no output","Has no heat exchange"],"a":0,"e":"A cyclic heat engine outputs work while rejecting some absorbed heat."},{"q":"What is the net change in the system's pressure after one completed cycle?","o":["Zero","Always positive","Always negative","Equal to net work"],"a":0,"e":"All state variables return to their initial values after a complete cycle."},{"q":"What is the net change in the system's volume after one completed cycle?","o":["Zero","Always positive","Always negative","Equal to heat transfer"],"a":0,"e":"The final volume equals the initial volume for a complete cycle."},{"q":"A process path on a P–V diagram is a closed loop. What does this indicate?","o":["The system completes a thermodynamic cycle","The system has constant pressure","The system has constant volume","No work is done at any point"],"a":0,"e":"A closed loop returns to its starting state and represents a cycle."},{"q":"If a system returns to its initial state, which statement is necessarily true?","o":["Its net change in every state function is zero","Its net heat transfer must be zero","Its net work must be zero","No intermediate energy transfer occurred"],"a":0,"e":"Every state function has the same initial and final value."},{"q":"A cyclic process has 500 J of heat entering and 350 J leaving. Net work done by the system is…","o":["150 J","350 J","500 J","850 J"],"a":0,"e":"Net heat = 500 − 350 = 150 J; for a cycle, this equals net work."},{"q":"During an isochoric part of a cycle, the boundary work is…","o":["Zero","Always positive","Always negative","Equal to pressure"],"a":0,"e":"Boundary work W = ∫P dV is zero when volume does not change."},{"q":"During an isothermal expansion of an ideal gas, the gas's internal energy change is…","o":["Zero","Positive","Negative","Equal to pressure"],"a":0,"e":"For an ideal gas, internal energy depends only on temperature; constant temperature means ΔU = 0."},{"q":"Can two different paths connect the same initial and final states and give different work?","o":["Yes","No, work is a state function","Only if temperature is zero","Only for a cycle"],"a":0,"e":"Work is path-dependent, so different paths can transfer different amounts of energy as work."},{"q":"Which statement about a thermodynamic cycle is correct?","o":["The net work can be nonzero even though the net internal-energy change is zero","All heat transfer cancels to zero","The system cannot exchange energy","The temperature must remain constant"],"a":0,"e":"The system returns to its original state, but heat and work transfers over the path can have nonzero net values."},{"q":"A cycle encloses 2 m³·kPa on a P–V diagram. The work magnitude is…","o":["2 J","2 kJ","2 Pa","0 J"],"a":1,"e":"Since 1 kPa·m³ = 1 kJ, the enclosed area corresponds to 2 kJ."}];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Thermodynamic Cycles Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
