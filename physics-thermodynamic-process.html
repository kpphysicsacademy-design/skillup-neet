<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Thermodynamic Process — 15 MCQ Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#203040;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:22px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:#123b70}.xp{font-weight:950;color:#1677ff}.hero{margin-top:14px;background:linear-gradient(135deg,#123b70,#1677ff);color:#fff;border-radius:24px;padding:22px}.hero h1{margin:5px 0 7px;font-size:clamp(28px,6vw,40px)}.hero p{margin:0;line-height:1.5;font-size:13px}.card{background:#fff;border:1px solid #d9e5f2;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 7px 20px rgba(18,59,112,.07)}.bar{height:10px;background:#e5edf6;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;width:0;background:#1677ff;transition:.3s}.qno{font-size:12px;color:#6b7280;font-weight:900}.q{font-size:20px;font-weight:900;line-height:1.4;margin:9px 0 16px}button.opt{display:block;width:100%;text-align:left;background:#fff;color:#203040;border:2px solid #dfe8f1;border-radius:14px;padding:14px;margin:10px 0;font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}button.opt.selected{border-color:#1677ff;background:#eef6ff;color:#123b70}button.opt.correct{border-color:#16803a;background:#eaf8ef;color:#145c2e}button.opt.wrong{border-color:#d64545;background:#fff0f0;color:#8f2020}button.continue{border:0;border-radius:13px;padding:12px 20px;background:#1677ff;color:#fff;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #0d5bbf}button.continue:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}.actions{display:flex;justify-content:flex-end;margin-top:15px}.feedback{min-height:25px;margin-top:13px;font-weight:800}.explain{margin-top:6px;color:#596774;font-weight:600}.back{display:block;width:max-content;margin:18px auto 0;padding:10px 15px;border:2px solid #d9e5f2;border-radius:12px;background:#fff;color:#1264d6;text-decoration:none;font-weight:900}.result{text-align:center}.score{font-size:34px;font-weight:950;color:#123b70}@media(max-width:520px){.wrap{padding:15px 10px 50px}.q{font-size:18px}button.opt{font-size:14px;padding:13px}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div class="brand">⚛️ SkillUp Physics<br><small>NEET 2026 • 15 MCQ QUIZ</small></div><div class="xp" id="xp">XP: 0</div></div>
<section class="hero"><div>🔥 THERMODYNAMICS</div><h1>Thermodynamic Process</h1><p>15-question MCQ quiz. Test your understanding of isothermal, adiabatic, isobaric, isochoric and cyclic processes.</p></section>
<section class="card"><strong>🏆 Quiz Progress <span id="mastery">0 / 15</span></strong><div class="bar"><div class="fill" id="fill"></div></div></section>
<section class="card" id="quiz"><div class="qno" id="qno"></div><div class="q" id="question"></div><div id="opts"></div><div class="actions"><button class="continue" id="continue" type="button" disabled>Check Answer →</button></div><div class="feedback" id="feedback"></div></section>
<section class="card result" id="result" hidden></section>
<a class="back" href="physics-home-fast.html">← 📚 Back to Physics Path</a>
</main>
<script>
const questions=[
{q:'A thermodynamic process is',o:['a change from one equilibrium state to another','only a change in temperature','only a change in pressure','only a change in volume'],a:0,e:'A thermodynamic process describes the change of a system from one state to another.'},
{q:'In an isothermal process, which quantity remains constant?',o:['Pressure','Volume','Temperature','Internal energy for every gas'],a:2,e:'Isothermal means constant temperature. For an ideal gas, internal energy also remains constant because it depends only on temperature.'},
{q:'For an ideal gas undergoing an isothermal process, the relation is',o:['PV = constant','P/T = constant','V/T = constant','P + V = constant'],a:0,e:'At constant temperature, PV = nRT, so PV remains constant for a fixed amount of ideal gas.'},
{q:'In an adiabatic process, heat exchanged with surroundings is',o:['maximum','zero','equal to work always','equal to internal energy always'],a:1,e:'An adiabatic process has no heat transfer, so Q = 0.'},
{q:'For a reversible adiabatic process of an ideal gas, which relation is correct?',o:['PV = constant','PV^γ = constant','P/V = constant','PT = constant'],a:1,e:'For a reversible adiabatic process, PV^γ remains constant, where γ = Cp/Cv.'},
{q:'In an isobaric process, which quantity remains constant?',o:['Pressure','Volume','Temperature','Internal energy'],a:0,e:'Isobaric means constant pressure.'},
{q:'The work done by a gas during an isochoric process is',o:['positive','negative','zero','maximum'],a:2,e:'At constant volume, dV = 0, so W = ∫P dV = 0.'},
{q:'Which process occurs at constant volume?',o:['Isothermal','Isobaric','Isochoric','Adiabatic'],a:2,e:'Isochoric literally means constant volume.'},
{q:'For an ideal gas in a cyclic process, the net change in internal energy is',o:['positive','negative','zero','infinite'],a:2,e:'Internal energy is a state function. Since the system returns to its initial state, ΔU = 0.'},
{q:'For an ideal gas in a reversible isothermal expansion, the work done by the gas is',o:['zero','nRT ln(V₂/V₁)','nCvΔT only','PΔV with constant pressure'],a:1,e:'For isothermal ideal-gas expansion, W = nRT ln(V₂/V₁).'},
{q:'During free expansion of an ideal gas into vacuum, the work done by the gas is',o:['positive','negative','zero','equal to nRT'],a:2,e:'External pressure is zero in free expansion, hence W = ∫Pext dV = 0.'},
{q:'In a constant-pressure process, the work done by a gas changing volume from V₁ to V₂ is',o:['P(V₂ − V₁)','V(P₂ − P₁)','zero','nRT ln(V₂/V₁)'],a:0,e:'With pressure constant, W = P∫dV = P(V₂ − V₁).'},
{q:'For an ideal gas undergoing a reversible adiabatic expansion, its temperature generally',o:['increases','decreases','remains constant','becomes zero'],a:1,e:'The gas does work during adiabatic expansion without receiving heat, so its internal energy and temperature decrease.'},
{q:'Which process has the same temperature at the beginning and end for an ideal gas?',o:['A complete isothermal process','Every adiabatic process','Every isobaric process','Every isochoric process'],a:0,e:'An isothermal process maintains the same temperature throughout.'},
{q:'On a P–V diagram, the magnitude of work done by a gas during a quasi-static process equals',o:['area under the process curve','area above the curve only','change in pressure only','change in temperature only'],a:0,e:'For a quasi-static process, W = ∫P dV, represented by the area under the P–V curve between the two volumes.'}
];
let i=0,selected=null,checked=false,score=0;const $=id=>document.getElementById(id);
function render(){selected=null;checked=false;$('feedback').textContent='';$('continue').disabled=true;$('continue').textContent=i===14?'Finish Quiz →':'Check Answer →';$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=questions[i].q;$('opts').innerHTML='';questions[i].o.forEach((text,n)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+n)+'. '+text;b.onclick=()=>{if(checked)return;selected=n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('continue').disabled=false};b.dataset.index=n;$('opts').appendChild(b)});$('mastery').textContent=`${i} / 15`;$('fill').style.width=`${i/15*100}%`;$('xp').textContent=`XP: ${score*10}`}
function next(){if(selected===null)return;if(!checked){checked=true;const item=questions[i],ok=selected===item.a;if(ok)score++;document.querySelectorAll('.opt').forEach(b=>{const n=+b.dataset.index;b.disabled=true;if(n===item.a)b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+`<div class="explain">${item.e}</div>`;$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=`${(i+1)/15*100}%`;$('xp').textContent=`XP: ${score*10}`}else if(i<14){i++;render()}else finish()}
function finish(){$('quiz').hidden=true;$('result').hidden=false;const pct=Math.round(score/15*100);$('result').innerHTML=`<h2>🎉 Thermodynamic Process Complete!</h2><div class="score">${score} / 15</div><p><strong>${pct}%</strong> accuracy</p><p>🏆 You earned <strong>${score*10} XP</strong>.</p><p>${score>=12?'🔥 Excellent NEET readiness!':score>=9?'💪 Good work. Revise and retry for mastery.':'📚 Revise thermodynamic processes and try again.'}</p><button class="continue" type="button" onclick="location.reload()">Retry 15 MCQs</button>`}
$('continue').onclick=next;render();
</script>
</body>
</html>
