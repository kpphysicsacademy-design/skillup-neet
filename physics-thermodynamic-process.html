<title>SkillUp | Thermodynamic Process — Easy Quiz</title>
<style>
:root{--green:#58cc02;--green-dark:#46a302;--blue:#1cb0f6;--ink:#243447;--muted:#64748b;--line:#dce6ef;--bg:#f3f9ff;--red:#ff4b4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.nav{max-width:720px;margin:auto;min-height:68px;padding:9px 12px;display:flex;align-items:center;gap:8px}
.back{display:grid;place-items:center;flex:0 0 40px;width:40px;height:40px;border:2px solid var(--line);border-radius:13px;background:#f2f9ff;color:#174a78;text-decoration:none;font-size:20px}
.brand{flex:1;min-width:0;font-weight:950;color:#174a78;white-space:nowrap}.brand small{display:block;margin-top:4px;font-size:8px;letter-spacing:.7px;color:var(--muted)}
.xp{background:#fff4cf;border:1px solid #f4df9a;border-radius:99px;padding:8px 9px;font-weight:900;font-size:12px;white-space:nowrap}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:8px 9px;font-size:11px;font-weight:900;color:#b94a17;white-space:nowrap}
main{max-width:720px;margin:auto;padding:18px 13px 48px}
.hero,.quiz,.finish{background:#fff;border:2px solid #e2edf7;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 #dce8f3}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#174a78}.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}
.progress-row{display:flex;justify-content:space-between;gap:10px;margin:16px 0 7px;font-size:12px;font-weight:900;color:var(--muted)}
.track{height:11px;border-radius:99px;background:#e2edf7;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}
.qmeta{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.4px}
.question{font-size:clamp(20px,4.5vw,26px);line-height:1.35;margin:12px 0 18px;font-weight:850}
.options{display:grid;gap:10px}.option{display:flex;gap:11px;align-items:center;width:100%;min-height:56px;padding:12px;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);font-size:15px;font-weight:750;line-height:1.4;cursor:pointer}
.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5;font-weight:650}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:280px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
.review-item{text-align:left;padding:12px;margin:10px 0;border:2px solid var(--line);border-radius:14px;background:#fff}.review-item p{margin:6px 0;line-height:1.45}
.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}.nav{gap:6px;padding-inline:8px}.brand{font-size:16px}.brand small{font-size:7px}.xp,.streak{padding:7px;font-size:10px}}
@media(max-width:350px){.nav{gap:4px;padding-inline:5px}.back{flex-basis:34px;width:34px;height:34px}.brand{font-size:14px}.xp,.streak{font-size:9px;padding:6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak">🔥 <span id="streak">0</span></div></div></header>
<main>
<section class="hero"><h1>🌡️ Thermodynamic Process</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions=[
{q:"What is a thermodynamic process?",o:["A change of a system from one state to another","A type of thermometer","A unit of heat","A change in colour only"],a:0,e:"A thermodynamic process describes the path by which a system changes from an initial state to a final state."},
{q:"Which quantities can describe the state of a gas?",o:["Pressure, volume and temperature","Colour, shape and smell","Mass only","Speed only"],a:0,e:"Pressure, volume and temperature are common state variables for a gas."},
{q:"An isothermal process takes place at constant…",o:["Pressure","Volume","Temperature","Heat"],a:2,e:"Isothermal means the temperature remains constant throughout the process."},
{q:"An isobaric process takes place at constant…",o:["Pressure","Temperature","Volume","Internal energy"],a:0,e:"Isobaric means constant pressure."},
{q:"An isochoric process takes place at constant…",o:["Heat","Volume","Pressure","Temperature"],a:1,e:"Isochoric means constant volume."},
{q:"In an adiabatic process, heat exchanged with the surroundings is…",o:["Zero","Always positive","Always negative","Infinite"],a:0,e:"For an adiabatic process, no heat enters or leaves the system: Q = 0."},
{q:"Which symbol is commonly used for heat supplied to a system?",o:["Q","P","V","W"],a:0,e:"Q represents heat transferred. W commonly represents work."},
{q:"Which symbol represents pressure?",o:["T","P","V","Q"],a:1,e:"P is the standard symbol for pressure."},
{q:"Which symbol represents volume?",o:["U","W","V","T"],a:2,e:"V represents volume."},
{q:"For a fixed amount of ideal gas at constant temperature, which relation holds?",o:["PV = constant","P + V = constant","P/T = 0","V − P = constant"],a:0,e:"From PV = nRT, if n and T are constant, PV stays constant."},
{q:"During an isothermal process of an ideal gas, its internal energy change is…",o:["Zero","Always positive","Always negative","Equal to pressure"],a:0,e:"For an ideal gas, internal energy depends only on temperature. If temperature is constant, ΔU = 0."},
{q:"For an ideal gas, which relation describes a reversible adiabatic process?",o:["PV = constant","PVᵞ = constant","P + V = constant","VT = constant"],a:1,e:"A reversible adiabatic process follows PVᵞ = constant, where γ = Cp/Cv."},
{q:"Work done by a gas is related to which change?",o:["Change in volume","Change in colour","Change in mass only","Change in name"],a:0,e:"For a quasi-static process, work done by the gas is W = ∫P dV."},
{q:"Work done by a gas during a constant-volume process is…",o:["Zero","Always maximum","Always negative","Infinite"],a:0,e:"At constant volume dV = 0, so W = ∫P dV = 0."},
{q:"At constant pressure, work done by a gas is…",o:["P(V₂ − V₁)","V(P₂ − P₁)","Zero in every case","P/V"],a:0,e:"When pressure is constant, W = P(V₂ − V₁)."},
{q:"On a pressure–volume graph, work in a quasi-static process is the…",o:["Signed area under the curve","Area of the page","Final temperature","Change in mass"],a:0,e:"The integral W = ∫P dV is represented by the signed area under the P–V curve."},
{q:"When a gas expands, the change in its volume is usually…",o:["Positive","Negative","Always zero","Undefined"],a:0,e:"Expansion means final volume is greater than initial volume, so ΔV is positive."},
{q:"When a gas is compressed, its volume change ΔV is…",o:["Positive","Negative","Always zero","Always infinite"],a:1,e:"During compression, final volume is smaller than initial volume, so ΔV is negative."},
{q:"A quasi-static process proceeds through states that are…",o:["Nearly in equilibrium","Always turbulent","Impossible to measure","At absolute zero"],a:0,e:"A quasi-static process changes slowly enough that the system remains very close to equilibrium states."},
{q:"Which process has no change in volume?",o:["Isochoric","Isobaric","Isothermal","Adiabatic"],a:0,e:"Isochoric means volume remains constant."},
{q:"Which process has no change in pressure?",o:["Isobaric","Isochoric","Isothermal","Adiabatic"],a:0,e:"Isobaric means pressure remains constant."},
{q:"Which process has no change in temperature?",o:["Isothermal","Adiabatic in every case","Isochoric in every case","Isobaric in every case"],a:0,e:"An isothermal process maintains constant temperature."},
{q:"A process that returns the system to its starting state is called…",o:["A cyclic process","A one-way process","An isobaric process only","A melting process"],a:0,e:"In a cyclic process, the final state is the same as the initial state."},
{q:"For a complete cycle, the net change in internal energy is…",o:["Zero","Positive","Negative","Equal to the work in every process"],a:0,e:"Internal energy is a state function. Returning to the starting state means net ΔU = 0."},
{q:"During reversible isothermal expansion of an ideal gas, work done by the gas is…",o:["nRT ln(V₂/V₁)","Always zero","nCvΔT only","P + V"],a:0,e:"For a reversible isothermal ideal-gas process, W = nRT ln(V₂/V₁)."},
{q:"During adiabatic expansion of an ideal gas, with the gas doing work, its temperature generally…",o:["Decreases","Increases always","Remains constant always","Becomes infinite"],a:0,e:"With no heat supplied, the gas uses internal energy to do work and generally cools."},
{q:"In free expansion into a vacuum, work done against external pressure is…",o:["Zero","Always maximum","Always negative","Equal to temperature"],a:0,e:"The external pressure is zero, so work done against the surroundings is zero."},
{q:"Which statement about state variables is correct?",o:["They describe the state of the system","They depend only on the path taken","They are all units","They are always zero"],a:0,e:"State variables such as P, V, T and U describe the current thermodynamic state."},
{q:"Which of these is a path-dependent quantity?",o:["Work","Temperature","Pressure","Internal energy"],a:0,e:"Work depends on the path followed between states, unlike state variables such as pressure and temperature."},
{q:"Why is the path important in a thermodynamic process?",o:["Heat and work can depend on the path","The final state is never measurable","Pressure has no meaning","Temperature is always zero"],a:0,e:"Different paths between the same states can involve different amounts of heat transfer and work."}
];
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Thermodynamic Process Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='❌ Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='✅ Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});}else{review.innerHTML='<p>🌟 Perfect round — no wrong answers!</p>';}
 $('finishSlot').appendChild(card);
 $('retry').addEventListener('click',()=>location.reload());
 $('retryWrong').addEventListener('click',()=>{const missed=wrongAttempts.map(w=>questions.find(q=>q.q===w.q));if(!missed.length)return;questions.splice(0,questions.length,...missed);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('finishSlot').replaceChildren();$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
<script src="/skillup-eye-shield.js?v=20261013-eye-shield-v1"></script>

</body>
