*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:auto;padding:18px 14px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:950;color:#286b16}.xp{font-weight:900;color:#d97706;background:#fff7db;border-radius:20px;padding:8px 12px}.hero{margin-top:16px;background:#e9fbdc;border:2px solid #c9f0ac;border-radius:22px;padding:20px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.08em;color:#438c12}.hero h1{margin:6px 0;font-size:clamp(27px,6vw,36px);line-height:1.15}.hero p{margin:8px 0 0;color:#45613a;line-height:1.5}.card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 3px 0 #e5e7eb}.progress-head{display:flex;justify-content:space-between;gap:10px;font-weight:900;font-size:14px}.bar{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .25s}.qno{font-size:13px;font-weight:900;color:var(--muted)}.q{font-size:22px;font-weight:900;line-height:1.35;margin:12px 0 18px}.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;color:var(--ink);border:2px solid #dfe3e8;border-bottom-width:4px;border-radius:15px;padding:13px 14px;margin:10px 0;font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}.opt .letter{display:grid;place-items:center;flex:0 0 30px;height:30px;border-radius:9px;background:#f1f5f9;color:#64748b;font-weight:950}.opt.selected{border-color:var(--blue);background:#eaf8ff}.opt.selected .letter{background:var(--blue);color:white}.opt.correct{border-color:var(--green);background:#efffdf}.opt.wrong{border-color:var(--red);background:#fff0f0}.opt:disabled{cursor:default}.actions{display:flex;justify-content:flex-end;margin-top:18px}.continue{width:100%;border:0;border-radius:15px;padding:15px 18px;background:var(--green);color:#fff;font-weight:950;font-size:16px;cursor:pointer;box-shadow:0 4px 0 var(--green-dark)}.continue:disabled{background:#cbd5e1;box-shadow:0 4px 0 #aeb8c5;cursor:not-allowed}.result{text-align:center}.score{font-size:42px;font-weight:950;color:#438c12}.review-item{text-align:left;padding:13px;border:2px solid #ffd2d2;background:#fff7f7;border-radius:14px;margin:10px 0}.review-item strong{display:block;margin-bottom:6px}.review-item p{margin:5px 0;line-height:1.45}.back{display:block;width:max-content;margin:18px auto 0;padding:10px 15px;border:2px solid #e5e7eb;border-radius:12px;background:#fff;color:#286b16;text-decoration:none;font-weight:900}@media(max-width:520px){.wrap{padding:13px 10px 40px}.q{font-size:20px}.card{padding:15px}.opt{font-size:14px;padding:12px}}

<section class="hero"><div class="eyebrow">UNIT 10 OF 20 · THERMODYNAMICS</div><h1>Thermodynamic Process</h1><p>One question at a time. Learn the idea, choose an answer, and review mistakes at the end.</p></section>
<section class="card"><div class="progress-head"><span>🧠 Your progress</span><span id="mastery">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section>
<section class="card" id="quiz"><div class="qno" id="qno"></div><div class="q" id="question"></div><div id="opts"></div><div class="actions"><button class="continue" id="continue" type="button" disabled>Check answer</button></div><div id="feedback" aria-live="polite"></div></section>
<section class="card result" id="result" hidden></section>

<script>
const questions=[
{q:'What is a thermodynamic process?',o:['A change from one state to another','Only a change in colour','A fixed temperature','A type of force'],a:0,e:'A process describes how a system changes from an initial state to a final state.'},
{q:'Which quantity stays constant in an isothermal process?',o:['Pressure','Volume','Temperature','Work'],a:2,e:'Isothermal means temperature remains constant.'},
{q:'For a fixed amount of ideal gas in an isothermal process, which is constant?',o:['PV','P + V','P/V','P + T'],a:0,e:'From PV = nRT, if n and T are constant, PV is constant.'},
{q:'What is true for an adiabatic process?',o:['Temperature must stay constant','No heat is exchanged','Pressure is always constant','Volume cannot change'],a:1,e:'Adiabatic means heat transfer is zero: Q = 0.'},
{q:'For a reversible adiabatic process of an ideal gas, which relation applies?',o:['PV = constant','PVᵞ = constant','P + V = constant','P/T = constant'],a:1,e:'The relation is PVᵞ = constant, where γ = Cp/Cv.'},
{q:'Which quantity remains constant in an isobaric process?',o:['Pressure','Volume','Temperature','Internal energy'],a:0,e:'Isobaric means constant pressure.'},
{q:'Which quantity remains constant in an isochoric process?',o:['Pressure','Volume','Temperature','Heat'],a:1,e:'Isochoric means constant volume.'},
{q:'Work done by a gas in an isochoric process is…',o:['Always positive','Always negative','Zero','Infinite'],a:2,e:'W = ∫P dV. Since volume does not change, dV = 0 and W = 0.'},
{q:'A system completes a cycle and returns to its starting state. Its net change in internal energy is…',o:['Positive','Negative','Zero','Impossible to tell'],a:2,e:'Internal energy is a state function. Returning to the initial state means ΔU = 0.'},
{q:'During a reversible isothermal expansion of an ideal gas, work done by the gas is…',o:['nRT ln(V₂/V₁)','Always zero','P + V','nCvΔT only'],a:0,e:'For an ideal gas, W = nRT ln(V₂/V₁) in a reversible isothermal process.'},
{q:'In free expansion into a vacuum, work done against external pressure is…',o:['Positive','Negative','Zero','Equal to pressure'],a:2,e:'The external pressure is zero, so work against the surroundings is zero.'},
{q:'At constant pressure, work done by a gas is…',o:['P(V₂ − V₁)','V(P₂ − P₁)','Zero in every case','nRT ln(V₂/V₁) in every case'],a:0,e:'For constant pressure, W = P(V₂ − V₁).'},
{q:'An ideal gas expands adiabatically and does work. Its temperature generally…',o:['Increases','Decreases','Stays constant','Instantly becomes zero'],a:1,e:'With no heat entering, the gas uses internal energy to do work, so it cools.'},
{q:'Which process keeps temperature constant throughout?',o:['Isothermal','Adiabatic','Isobaric','Isochoric'],a:0,e:'Constant temperature is the defining condition of an isothermal process.'},
{q:'On a pressure–volume graph, work for a quasi-static process is represented by…',o:['Area under the curve','The curve’s colour','Change in temperature only','The final pressure only'],a:0,e:'Work is W = ∫P dV, the signed area under the P–V curve.'}
];
let i=0,selected=null,checked=false,score=0;const mistakes=[];const $=id=>document.getElementById(id);
function render(){selected=null;checked=false;$('feedback').innerHTML='';$('continue').disabled=true;$('continue').textContent='Check answer';$('qno').textContent='QUESTION '+(i+1)+' OF '+questions.length;$('question').textContent=questions[i].q;$('opts').innerHTML='';questions[i].o.forEach((label,n)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.innerHTML='<span class="letter">'+String.fromCharCode(65+n)+'</span><span></span>';b.lastChild.textContent=label;b.onclick=()=>{if(checked)return;selected=n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('continue').disabled=false};b.dataset.index=n;$('opts').appendChild(b)});$('mastery').textContent=i+' / '+questions.length;$('fill').style.width=(i/questions.length*100)+'%'}
function next(){if(selected===null)return;if(!checked){checked=true;const item=questions[i],ok=selected===item.a;if(ok)score++;else mistakes.push({index:i,question:item.q,chosen:item.o[selected],answer:item.o[item.a],explanation:item.e});document.querySelectorAll('.opt').forEach(b=>{const n=+b.dataset.index;b.disabled=true;if(n===item.a)b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML='<div style="margin-top:12px;font-weight:900;color:'+(ok?'#438c12':'#b42318')+'">'+(ok?'Nice work! 🌟':'Answer recorded. Keep going! 💪')+'</div>';$('continue').textContent=i===questions.length-1?'See results':'Continue';$('mastery').textContent=(i+1)+' / '+questions.length;$('fill').style.width=((i+1)/questions.length*100)+'%';$('xp').textContent='⭐ '+(score*10)+' XP'}else if(i<questions.length-1){i++;render()}else finish()}
function finish(){ $('quiz').hidden=true;$('result').hidden=false;const pct=Math.round(score/questions.length*100);let html='<h2>🎉 Practice complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p><strong>'+pct+'% accuracy</strong> · ⭐ '+(score*10)+' XP</p><p>'+(score>=12?'Amazing work! You are building strong mastery.':score>=9?'Good progress! Review the missed concepts below.':'Keep practising. Read the corrections, then try again.')+'</p>';if(mistakes.length){html+='<h3>🔁 Review your mistakes</h3><p>Only your incorrect answers are listed here.</p>';mistakes.forEach((m,k)=>{html+='<div class="review-item"><strong>'+(k+1)+'. '+m.question+'</strong><p>❌ Your answer: '+m.chosen+'</p><p>✅ Correct answer: '+m.answer+'</p><p>'+m.explanation+'</p></div>'})}else{html+='<p>🏆 Perfect round — no wrong answers!</p>'}html+='<button class="continue" type="button" id="retry">Practise again</button>'; $('result').innerHTML=html;$('retry').onclick=()=>location.reload()}
$('continue').onclick=next;render();
</script>
