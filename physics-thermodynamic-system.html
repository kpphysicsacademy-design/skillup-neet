<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}

.hero,.quiz,.finish{background:#fff;border:2px solid #e2edf7;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 #dce8f3}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,32px);line-height:1.2;color:#174a78}.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}
.progress-row{display:flex;justify-content:space-between;gap:10px;margin:16px 0 7px;font-size:12px;font-weight:900;color:var(--muted)}
.track{height:11px;border-radius:99px;background:#e2edf7;overflow:hidden}.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}
.qmeta{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.4px}
.question{font-size:clamp(20px,4.5vw,26px);line-height:1.35;margin:12px 0 18px;font-weight:850}
.options{display:grid;gap:10px}.option{display:flex;gap:11px;align-items:center;width:100%;min-height:51px;padding:12px;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:15px;color:var(--ink);font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}
.letter{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:12px;color:#60758a}
.option:hover:not(:disabled){border-color:var(--blue);background:#f0faff}.option.selected{border-color:var(--blue);background:#e8f7ff}.option.correct{border-color:var(--green);background:#efffe7}.option.wrong{border-color:var(--red);background:#fff0f0}.option:disabled{cursor:default}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}
.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🛠️ Thermodynamic System</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [{q:"What is a thermodynamic system?",o:["A specified quantity of matter or region chosen for study","Everything outside the universe","Only a thermometer","A unit used to measure pressure"],a:0,e:"A system is the part of the universe selected for thermodynamic analysis."},{q:"Everything outside the chosen thermodynamic system is called the:",o:["State variable","Surroundings","Boundary only","Internal energy"],a:1,e:"The surroundings are everything external to the selected system."},{q:"The real or imaginary surface separating a system from its surroundings is the:",o:["Reservoir","State point","Boundary","Heat engine"],a:2,e:"A boundary may be fixed or movable and may allow energy or matter to cross."},{q:"Which of the following is an open thermodynamic system?",o:["A sealed rigid gas cylinder","A tightly closed thermos flask","A sealed bottle of water","A boiling pot with steam escaping"],a:3,e:"An open system can exchange both matter and energy with its surroundings."},{q:"A sealed rigid gas cylinder is an example of a:",o:["Closed system","Open system","Isolated system in every respect","System with no internal energy"],a:0,e:"A closed system exchanges energy but not matter across its boundary."},{q:"An ideal isolated system exchanges with its surroundings:",o:["Matter only","Neither matter nor energy","Energy only","Both matter and energy"],a:1,e:"An isolated system has no matter or energy transfer across its boundary."},{q:"Which is an example of energy crossing a system boundary?",o:["The system's name","The boundary's colour","Heat entering a gas in a cylinder","The gas's molecular identity"],a:2,e:"Heat is energy transferred across a boundary because of a temperature difference."},{q:"Work crosses a thermodynamic boundary when:",o:["Energy is transferred by an organised force-displacement interaction","The system's label changes","The system is defined","No interaction occurs"],a:0,e:"Work is a mode of energy transfer associated with force acting through a displacement or other generalised interaction."},{q:"A system's state is described using quantities such as:",o:["Its owner's name","Pressure, volume and temperature","The room number only","Its colour alone"],a:1,e:"Pressure, volume and temperature are common thermodynamic state variables."},{q:"Which system can exchange matter with its surroundings?",o:["Closed system only","Isolated system only","Open system","No thermodynamic system"],a:2,e:"Matter can enter or leave an open system."},{q:"A movable piston can form part of a system boundary that:",o:["Must never move","Can change the system volume","Cannot transmit work","Always blocks all energy"],a:1,e:"A movable boundary allows expansion or compression work as the volume changes."},{q:"Which statement about a thermodynamic system is correct?",o:["Its boundary must always be a solid wall","It must contain only one particle","It cannot exchange energy","It may be a chosen quantity of matter or a region in space"],a:3,e:"Systems can be defined around matter or a region, depending on the problem."},{q:"The gas inside a sealed piston-cylinder is chosen as the system. The piston and cylinder walls are part of its:",o:["Boundary","Surroundings only in all descriptions","Temperature","Internal energy"],a:0,e:"The walls and piston define the boundary of the selected gas system."},{q:"Which of the following is most clearly a closed system?",o:["Water flowing through a turbine","Air entering a compressor and leaving it","Gas in a sealed container being heated","Steam escaping from a kettle"],a:2,e:"Heating a sealed container transfers energy but no matter through the boundary."},{q:"A system may exchange energy with surroundings as:",o:["Heat and work","Only mass","Only temperature","Only volume"],a:0,e:"For a closed system, energy transfer commonly occurs as heat and work."},{q:"In a flowing-fluid device such as a turbine, the fluid inside the device is commonly treated as:",o:["An isolated system","An open system","A system without mass","A system with no energy"],a:1,e:"Mass flows into and out of the turbine, so it is modelled as an open system."},{q:"Why define a system before solving a thermodynamics problem?",o:["To remove all forces","To make temperature constant automatically","To decide which matter and interactions are included in the analysis","To ensure no energy changes"],a:2,e:"A clear system boundary identifies relevant energy and mass transfers."},{q:"A thermos flask is often approximated as an isolated system because it:",o:["Exchanges large amounts of mass","Has no boundary","Cannot contain energy","Minimises exchanges of matter and energy"],a:3,e:"A well-insulated, sealed flask reduces heat transfer and prevents matter exchange."},{q:"A boundary that allows heat transfer but no matter transfer is consistent with a:",o:["Closed system","Open system only","System without surroundings","System that cannot do work"],a:0,e:"A closed system can transfer heat and work while retaining its matter."},{q:"A flexible balloon containing gas is heated. If gas does not escape, the gas is a:",o:["Open system because its volume changes","Closed system because its mass stays fixed","Isolated system because it expands","System with no boundary"],a:1,e:"Changing volume does not make a system open; matter transfer determines that classification."},{q:"Which statement best distinguishes a system from its surroundings?",o:["The system is always hotter","The surroundings contain no energy","The system is the chosen part; surroundings are everything external to it","The system must always be a solid"],a:2,e:"The distinction is based on what has been selected for study."},{q:"In a control volume analysis, the boundary is often:",o:["Only the surface of a solid object","A fixed or moving surface enclosing a region in space","Always invisible and impermeable","Identical to the atmosphere"],a:1,e:"A control volume is a chosen region through whose control surface mass and energy may flow."},{q:"Which example exchanges both mass and energy with its surroundings?",o:["Sealed rigid bottle","Ideal isolated flask","Closed piston-cylinder with no leakage","A running air compressor"],a:3,e:"A compressor receives and discharges air and also exchanges energy."},{q:"If no matter crosses the boundary, the system's total mass is:",o:["Constant","Always zero","Increasing continuously","Equal to its pressure"],a:0,e:"For a closed system with no mass transfer, total mass remains fixed."},{q:"Can the boundary of a thermodynamic system be imaginary?",o:["No, it must be metal","Yes, it can be an imagined surface","Only for solids","Only if temperature is zero"],a:1,e:"System boundaries are often conceptual surfaces chosen to simplify analysis."},{q:"A system boundary is described as adiabatic when it:",o:["Allows unlimited heat transfer","Always moves","Does not permit heat transfer across it","Prevents all work in every case"],a:2,e:"An adiabatic boundary has zero heat transfer across it."},{q:"A diathermal boundary allows:",o:["Matter only and no energy","No interaction of any kind","Only volume to change","Heat transfer across the boundary"],a:3,e:"A diathermal boundary permits thermal energy transfer as heat."},{q:"A gas is compressed in a sealed cylinder. Which is true of the gas system?",o:["Work can cross its boundary even though matter does not","It must be open because volume changes","It cannot receive energy","Its mass must increase"],a:0,e:"A sealed gas can receive work through a moving piston without matter crossing the boundary."},{q:"A system and surroundings together are commonly considered to make up:",o:["Only the atmosphere","The universe for the chosen analysis","Only the boundary","A state variable"],a:1,e:"In thermodynamics, the selected system plus its surroundings constitute the universe of the analysis."},{q:"Which is the best description of a thermodynamic system?",o:["A formula for heat capacity","A device that always converts heat fully into work","A defined part of the physical world used for analysis","A type of thermometer"],a:2,e:"Thermodynamic analysis begins by specifying the system and its boundary."}];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Thermodynamic System Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
