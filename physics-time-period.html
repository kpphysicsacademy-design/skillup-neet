<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Time Period</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f7ff;margin:0;color:#1e293b}
.wrap{max-width:760px;margin:auto;padding:22px}
.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(30,41,59,.10);border:1px solid #e2e8f0}
h1{text-align:center;color:#334155}.meta{display:flex;justify-content:space-between;font-weight:700;color:#475569}
.bar{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#22c55e;transition:.3s}
.q{font-size:20px;font-weight:700;margin-bottom:18px;color:#172033}
.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe4f0;border-radius:14px;background:#fff;color:#1e293b;font-size:16px;cursor:pointer;transition:.2s}
.opt:hover{background:#eef5ff;border-color:#93c5fd;transform:translateY(-1px)}.opt:focus-visible{outline:3px solid #bfdbfe;outline-offset:2px}
.correct{border-color:#16a34a!important;background:#ecfdf3!important;color:#166534!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important;color:#991b1b!important}
.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s}
.next,.retry{background:#4f46e5;color:#fff}.next:hover,.retry:hover{background:#4338ca}.back{background:#334155;color:#fff}.back:hover{background:#1e293b}
.hide{display:none}.xp{text-align:center;font-weight:700;color:#d97706;min-height:24px}
@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>⏱️ Time Period</h1>
<div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="quiz"></div><div class="xp" id="xp"></div>
<button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div>
<a class="back" href="physics-home-fast.html">← Back to Physics Path</a>
</div></div>
<script>
const qs=[
['The time period of a periodic motion is the','time taken for one complete cycle','number of cycles per second','maximum displacement','rate of phase change',0,'Time period T is the time required to complete one full cycle of periodic motion.'],
['The SI unit of time period is','hertz','second','radian','metre',1,'The SI unit of time is the second (s).'],
['The relation between time period T and frequency f is','T=f','T=1/f','T=2πf','T=f²',1,'Frequency is the number of cycles per second, so T=1/f.'],
['The relation between angular frequency ω and time period T is','ω=2πT','ω=T/2π','ω=2π/T','ω=1/T²',2,'Since one complete cycle corresponds to 2π radians, ω=2π/T.'],
['A particle completes one oscillation in 0.5 s. Its time period is','0.25 s','0.5 s','1 s','2 s',1,'The time for one complete oscillation is directly the time period: T=0.5 s.'],
['If a periodic oscillator has frequency 4 Hz, its time period is','4 s','2 s','0.25 s','0.04 s',2,'T=1/f=1/4=0.25 s.'],
['If the time period of an oscillator is doubled, its frequency becomes','double','half','four times','unchanged',1,'Because f=1/T, doubling T makes frequency half.'],
['For a 1 Hz periodic motion, the time period is','0.5 s','1 s','2 s','π s',1,'T=1/f=1/1=1 s.'],
['A clock hand makes one complete revolution in 60 s. Its time period is','1 s','30 s','60 s','120 s',2,'One complete revolution takes 60 s, so T=60 s.'],
['In uniform circular motion, the time period is the time required for','half a revolution','one complete revolution','one radian','maximum speed',1,'The period is the time for one complete revolution.'],
['For ideal SHM, the time period is the time between','two successive identical phases','maximum and minimum speed only','two arbitrary positions','two different amplitudes',0,'After one period, the oscillator returns to the same phase and state of motion.'],
['If ω=2π rad/s, the time period is','0.5 s','1 s','2 s','2π s',1,'T=2π/ω=2π/(2π)=1 s.'],
['If ω=π rad/s, the time period is','0.5 s','1 s','2 s','π s',2,'T=2π/π=2 s.'],
['The time period of an ideal simple pendulum is proportional to','√(L/g)','L/g','g/L','1/√(L/g)',0,'For small oscillations, T=2π√(L/g).'],
['For a simple pendulum at a fixed location, if its length becomes four times, its time period becomes','half','double','four times','unchanged',1,'Since T is proportional to √L, increasing L by 4 makes T twice as large.']
];
let i=0,score=0,answered=false;const $=x=>document.getElementById(x);
function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}
function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}
function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}
$('next').onclick=next;render();
</script>
</body>
</html>
