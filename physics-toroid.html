<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Toroid</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>⚡ Toroid</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['The magnetic field inside an ideal toroid at radius r is','μ₀NI/(2πr)','μ₀NIr','μ₀I/(2πNr)','2πrμ₀NI',0,'Ampere’s law gives B(2πr)=μ₀NI, hence B=μ₀NI/(2πr).'],['For a toroid with N turns carrying current I, the enclosed current in an Ampere loop is','I/N','NI','N/I','I²N',1,'An Amperian circle inside the core encloses N current-carrying turns, so enclosed current is NI.'],['The magnetic field in an ideal toroid outside the winding is approximately','zero','μ₀NI/(2πr)','maximum','infinite',0,'For an ideal toroid, symmetry and Ampere’s law give negligible field outside the core.'],['If the current in a toroid is doubled, its field at fixed radius becomes','half','double','four times','unchanged',1,'B is directly proportional to I.'],['If the number of turns is doubled at fixed I and r, B becomes','half','double','four times','zero',1,'B=μ₀NI/(2πr), so B is proportional to N.'],['For a toroid, magnetic field varies with radius inside the core as','1/r','r','r²','constant for all r',0,'From B=μ₀NI/(2πr), the field decreases inversely with radius.'],['A toroid has 500 turns, current 2 A and radius 0.10 m. Its air-core field is approximately','2.0×10⁻³ T','1.0×10⁻³ T','5.0×10⁻³ T','2.0×10⁻² T',0,'B=(4π×10⁻⁷)(500)(2)/(2π×0.10)=2.0×10⁻³ T.'],['The magnetic field inside a toroid is primarily','azimuthal around the toroid','radial outward','along the diameter','uniformly vertical',0,'The field lines inside an ideal toroid form circular paths around its central axis.'],['The purpose of a toroidal core is to','confine magnetic flux largely within the core','eliminate current','make resistance zero','produce an electric field only',0,'Toroidal geometry confines the magnetic field and reduces external flux.'],['With a magnetic material of relative permeability μᵣ filling a toroid, the field is','μ₀NI/(2πrμᵣ)','μᵣμ₀NI/(2πr)','2πrμᵣμ₀NI','μᵣ/(2πrμ₀NI)',1,'For a linear magnetic medium, B=μᵣμ₀NI/(2πr).'],['An Amperian loop used for an ideal toroid should be','a circle centered on the toroid axis','a straight radial line only','outside the laboratory','a square through the wire',0,'A circular Amperian path follows the symmetry of the toroidal field.'],['At two radii r₁ and r₂ inside the same ideal toroid, B₁/B₂ equals','r₂/r₁','r₁/r₂','1','r₁+r₂',0,'Since B∝1/r, B₁/B₂=r₂/r₁.'],['Reversing the current in a toroid','reverses the magnetic-field direction','doubles the field','makes the field permanently zero','has no effect',0,'Magnetic-field direction follows current direction, so reversing I reverses B.'],['If the toroid radius is doubled while N and I remain fixed, the field at the corresponding radius','halves','doubles','quadruples','does not change',0,'At fixed N and I, B∝1/r.'],['Ampere’s circuital law for a toroid is written as','∮B·dl=μ₀NI','∮B·dl=μ₀I/N','∮B·dl=NI/μ₀','∮B·dl=2πrNI',0,'For an Amperian loop within the toroid, ∮B·dl=μ₀I_enclosed=μ₀NI.']];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent=''}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});if(ok){score++;$('xp').textContent='✨ Correct! +1 XP'}else $('xp').textContent='❌ Incorrect. '+q[6];$('score').textContent=`XP ${score}`;$('next').classList.remove('hide')}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('next').onclick=next;render();</script></body></html>
