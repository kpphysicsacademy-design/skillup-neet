<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Torque on a Dipole</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>⚡ Torque on a Dipole</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>
const qs=[
['The magnitude of torque on an electric dipole in a uniform electric field is','pE cosθ','pE sinθ','pE tanθ','p/E',1,'The torque magnitude is τ=pE sinθ, where θ is the angle between p and E.'],
['The torque on a dipole is maximum when the angle between p and E is','0°','30°','90°','180°',2,'Since τ=pE sinθ, the maximum occurs when sinθ=1, i.e. θ=90°.'],
['The torque on a dipole is zero when the angle between p and E is','0° or 180°','45° only','90° only','60° or 120°',0,'τ=pE sinθ is zero for θ=0° and 180°.'],
['The SI unit of torque on an electric dipole is','N/C','C·m','N·m','J/C',2,'Torque is measured in newton-metre (N·m).'],
['The direction of torque on a dipole is given by','p×E','E×p','p·E','p/E',0,'The torque vector is τ=p×E.'],
['If the dipole moment is doubled while E and θ remain unchanged, the torque','becomes half','remains unchanged','doubles','becomes four times',2,'Because τ is directly proportional to p, doubling p doubles τ.'],
['If the electric field is doubled while p and θ remain unchanged, the torque','becomes half','remains unchanged','doubles','becomes four times',2,'Because τ is directly proportional to E, doubling E doubles τ.'],
['A dipole has p=4×10⁻⁶ C·m in an electric field E=5×10⁴ N/C at 30°. Its torque is','0.05 N·m','0.10 N·m','0.20 N·m','1.00 N·m',1,'τ=pE sin30°=(4×10⁻⁶)(5×10⁴)(1/2)=0.10 N·m.'],
['A dipole of moment 2×10⁻⁸ C·m is placed in E=3×10⁴ N/C at 90°. The torque is','6×10⁻⁴ N·m','6×10⁻⁵ N·m','6×10⁻⁶ N·m','6×10⁻³ N·m',0,'τ=pE=(2×10⁻⁸)(3×10⁴)=6×10⁻⁴ N·m.'],
['A dipole in a uniform electric field has zero torque when it is','only perpendicular to E','parallel or antiparallel to E','at 45° to E','at 60° to E',1,'Parallel and antiparallel orientations have θ=0° or 180°, so τ=0.'],
['For a dipole parallel to a uniform electric field, the potential energy is','+pE','−pE','0','p/E',1,'U=−pE cosθ; for θ=0°, U=−pE.'],
['For a dipole antiparallel to a uniform electric field, the potential energy is','−pE','0','+pE','p/E',2,'U=−pE cosθ; for θ=180°, U=+pE.'],
['The stable equilibrium orientation of an electric dipole in a uniform electric field is','p parallel to E','p antiparallel to E','p perpendicular to E','any orientation',0,'Minimum potential energy occurs at θ=0°, so p is parallel to E.'],
['The unstable equilibrium orientation of an electric dipole in a uniform electric field is','p parallel to E','p antiparallel to E','p at 45° to E','p at 60° to E',1,'Maximum potential energy occurs at θ=180°, corresponding to the antiparallel orientation.'],
['A dipole has p=3×10⁻⁷ C·m and is in E=2×10⁵ N/C at 60°. Its torque is','3×10⁻² N·m','5.2×10⁻² N·m','6×10⁻² N·m','1.2×10⁻¹ N·m',1,'τ=pE sin60°=(3×10⁻⁷)(2×10⁵)(√3/2)≈5.2×10⁻² N·m.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
