ged if θ is changed from…","o":["30° to 60°","0° to 90°","30° to 150°","45° to 90°"],"a":2,"e":"\\(\\sin30^\\circ=\\sin150^\\circ=1/2\\), so magnitudes match."},{"q":"The torque vector is perpendicular to…","o":["Only p","Only E","Both p and E","Neither p nor E"],"a":2,"e":"A cross product vector \\(\\vec p\\times\\vec E\\) is perpendicular to both vectors."},{"q":"A dipole moment p = \\(8\\times10^{-7}\\,\\text{C m}\\) is in E = 500 N/C at 90°. Torque is…","o":["\\(4\\times10^{-4}\\,\\text{N m}\\)","\\(4\\times10^{-5}\\,\\text{N m}\\)","\\(1.6\\times10^{-3}\\,\\text{N m}\\)","\\(4\\times10^{-6}\\,\\text{N m}\\)"],"a":0,"e":"\\(\\tau=pE=(8\\times10^{-7})(500)=4\\times10^{-4}\\,\\text{N m}\\)."},{"q":"The potential energy of a dipole in a uniform field is minimum when torque tends to align p…","o":["Antiparallel to E","Parallel to E","Perpendicular to E","At any angle"],"a":1,"e":"The torque rotates the dipole toward θ=0°, where \\(U=-pE\\) is minimum."},{"q":"If p and E are perpendicular, the torque magnitude is…","o":["Zero","\\(pE/2\\)","\\(pE\\)","\\(2pE\\)"],"a":2,"e":"At 90°, \\(\\sin90=1\\), so torque is maximum, \\(pE\\)."},{"q":"A dipole has p = \\(1.5\\times10^{-6}\\,\\text{C m}\\) in E = 400 N/C at 60°. The torque magnitude is…","o":["\\(5.2\\times10^{-4}\\,\\text{N m}\\)","\\(2.4\\times10^{-4}\\,\\text{N m}\\)","\\(3.0\\times10^{-4}\\,\\text{N m}\\)","\\(6.0\\times10^{-4}\\,\\text{N m}\\)"],"a":0,"e":"\\(\\tau=(1.5\\times10^{-6})(400)\\sin60^\\circ\\approx5.2\\times10^{-4}\\,\\text{N m}\\)."}];
