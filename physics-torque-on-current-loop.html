<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Torque on Current Loop</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>⚡ Torque on Current Loop</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['The torque on a current-carrying loop in a uniform magnetic field is','τ=BIA sinθ','τ=B/I A','τ=BI/A','τ=BA/I',0,'For a planar current loop, τ=BIA sinθ, where A is the area of the loop and θ is the angle between its area vector and B.'],['The magnetic dipole moment of a current loop is','m=I/A','m=IA','m=A/I','m=BI',1,'The magnetic dipole moment is m=IA, directed normal to the plane of the loop by the right-hand rule.'],['Torque on a current loop can be written as','τ=m×B','τ=B/m','τ=m+B','τ=m·B only',0,'Vectorially, τ=m×B, so |τ|=mB sinθ.'],['The torque on a current loop is maximum when the angle between m and B is','0°','30°','90°','180°',2,'Since τ=mB sinθ, torque is maximum at θ=90°.'],['The torque on a current loop is zero when m is','perpendicular to B','parallel or antiparallel to B','at 45° to B','always at 90°',1,'Torque vanishes when sinθ=0, i.e. when m is parallel or antiparallel to B.'],['For a rectangular coil of length l and breadth b, its area is','l+b','2(l+b)','lb','l/b',2,'The area of a rectangular loop is A=lb.'],['A coil of 20 turns, area 0.01 m² carries 2 A in a 0.5 T field. Maximum torque is','0.02 N m','0.1 N m','0.2 N m','2 N m',2,'τmax=NIAB=20×2×0.01×0.5=0.2 N m.'],['If the current in a loop is doubled, with B, A and θ fixed, its torque','halves','doubles','becomes four times','is unchanged',1,'Torque is directly proportional to current: τ∝I.'],['If the area of a loop is doubled while I, B and θ remain fixed, torque','halves','doubles','becomes four times','is zero',1,'Torque is directly proportional to area: τ∝A.'],['If a loop has N turns instead of one, its torque is','unchanged','N times the single-turn torque','1/N times','N² times',1,'For N turns, τ=NIAB sinθ, so torque is N times the single-turn value.'],['A current loop tends to rotate so that its magnetic moment becomes','perpendicular to B','parallel to B','opposite to current','zero',1,'The stable orientation is m parallel to B, corresponding to minimum potential energy.'],['The potential energy of a magnetic dipole in a magnetic field is','U=mB sinθ','U=−mB cosθ','U=mB cosθ','U=−m/B',1,'The potential energy is U=−m·B=−mB cosθ.'],['A current loop in a uniform magnetic field experiences','only net force always','only torque always','zero net force and possibly a torque','infinite force',2,'In a uniform magnetic field, opposite forces on the loop can give zero net force while producing torque.'],['A 5 A current flows through a loop of area 0.02 m². Its magnetic moment is','0.004 A m²','0.01 A m²','0.1 A m²','10 A m²',2,'m=IA=5×0.02=0.1 A m².'],['If a loop is oriented with its plane perpendicular to B, the angle between its magnetic moment and B is','0°','45°','90°','180°',0,'The magnetic moment is normal to the loop plane. If the plane is perpendicular to B, m is parallel to B, so θ=0°. Thus torque is zero.']];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent=''}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});if(ok){score++;$('xp').textContent='✨ Correct! +1 XP'}else $('xp').textContent='❌ Incorrect. '+q[6];$('score').textContent=`XP ${score}`;$('next').classList.remove('hide')}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('next').onclick=next;render();</script></body></html>
