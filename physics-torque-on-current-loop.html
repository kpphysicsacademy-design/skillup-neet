<script>
(function(){
'use strict';
const originalQuestions=[
{q:"The magnitude of torque on a current loop of N turns in a uniform magnetic field is:",o:["NIAB sin θ","NIB/A","NAB/I","BI/N"],a:0,e:"The torque is τ = NIAB sin θ, where N is turns, I is current, A is area and θ is the angle between the magnetic moment and magnetic field."},
{q:"The magnetic dipole moment of a coil having N turns, current I and area A is:",o:["NIA","NI/A","NA/I","IA/N"],a:0,e:"The magnetic dipole moment magnitude is m = NIA. Its direction is normal to the plane of the coil."},
{q:"The SI unit of magnetic dipole moment is:",o:["N m","A m²","T m","A/m"],a:1,e:"Since m = NIA, its SI unit is ampere square metre (A m²)."},
{q:"The vector relation for torque on a current loop is:",o:["τ = B × m","τ = m × B","τ = m · B","τ = m + B"],a:1,e:"Torque is the vector product τ = m × B; its magnitude is mB sin θ."},
{q:"In the torque formula, θ is the angle between:",o:["the plane of the coil and B","current and B","magnetic moment m and B","the coil axis and its plane"],a:2,e:"The magnetic moment vector is perpendicular to the plane of the coil. θ is measured between m and B."},
{q:"Torque on a current loop is maximum when the angle between m and B is:",o:["0°","30°","90°","180°"],a:2,e:"Because τ = mB sin θ, torque is maximum when sin θ = 1, at 90°."},
{q:"Torque on a current loop is zero when m is:",o:["perpendicular to B","parallel or antiparallel to B","at 45° to B","at 60° to B"],a:1,e:"Torque vanishes when sin θ = 0, i.e. θ = 0° or 180°."},
{q:"If the plane of a coil is parallel to the magnetic field, the torque is:",o:["zero","maximum","half maximum","independent of angle"],a:1,e:"The coil's magnetic moment is normal to its plane, hence perpendicular to B. Therefore torque is maximum."},
{q:"If the plane of a coil is perpendicular to B, the torque is:",o:["maximum","zero","half maximum","infinite"],a:1,e:"The magnetic moment is normal to the coil plane and therefore parallel to B. Thus τ = 0."},
{q:"A current loop tends to align its magnetic moment:",o:["perpendicular to B","parallel to B","at 45° to B","opposite to its own normal"],a:1,e:"The stable equilibrium has m parallel to B, which gives minimum potential energy."},
{q:"The potential energy of a magnetic dipole in a uniform magnetic field is:",o:["mB sin θ","−mB cos θ","mB cos θ","−mB sin θ"],a:1,e:"Magnetic potential energy is U = −m · B = −mB cos θ."},
{q:"The stable equilibrium orientation of a current loop has potential energy:",o:["maximum","minimum","zero for every field","undefined"],a:1,e:"For m parallel to B, θ = 0° and U = −mB, the minimum value."},
{q:"The unstable equilibrium orientation of a current loop has m:",o:["parallel to B","antiparallel to B","perpendicular to B","at 30° to B"],a:1,e:"At θ = 180°, m is antiparallel to B and U = +mB, the maximum potential energy."},
{q:"A 10-turn coil of area 0.02 m² carries 2 A in a 0.5 T field. Its maximum torque is:",o:["0.02 N m","0.1 N m","0.2 N m","2 N m"],a:2,e:"τmax = NIAB = 10 × 2 × 0.02 × 0.5 = 0.2 N m."},
{q:"A single-turn loop has I = 3 A and A = 0.04 m². Its magnetic moment is:",o:["0.012 A m²","0.12 A m²","1.2 A m²","12 A m²"],a:1,e:"m = IA = 3 × 0.04 = 0.12 A m²."},
{q:"A 20-turn coil carries 0.5 A and has area 10 cm². Its magnetic moment is:",o:["0.001 A m²","0.01 A m²","0.1 A m²","1 A m²"],a:1,e:"Convert area: 10 cm² = 10⁻³ m². Then m = NIA = 20 × 0.5 × 10⁻³ = 0.01 A m²."},
{q:"A loop has magnetic moment 0.4 A m² in a 2 T field at 30°. Torque is:",o:["0.2 N m","0.4 N m","0.8 N m","1.6 N m"],a:1,e:"τ = mB sin 30° = 0.4 × 2 × 0.5 = 0.4 N m."},
{q:"A coil experiences torque 0.6 N m when m = 0.5 A m² and B = 2 T. The angle θ is:",o:["30°","37° approximately","53° approximately","90°"],a:2,e:"sin θ = τ/(mB) = 0.6/(0.5 × 2) = 0.6. Thus θ ≈ 36.9° or 143.1°. Among the listed choices, the intended acute solution is about 37°."},
{q:"If current through a coil is doubled while other quantities remain fixed, torque:",o:["halves","doubles","quadruples","remains unchanged"],a:1,e:"Torque is directly proportional to current: τ ∝ I."},
{q:"If the number of turns is tripled, torque becomes:",o:["one-third","three times","six times","nine times"],a:1,e:"For fixed I, A, B and θ, torque is directly proportional to N."},
{q:"If the area of a loop is doubled, its magnetic moment:",o:["halves","doubles","quadruples","does not change"],a:1,e:"Magnetic moment m = NIA, so it is directly proportional to area."},
{q:"If magnetic field strength is doubled, torque on the same loop:",o:["halves","doubles","quadruples","is unchanged"],a:1,e:"Torque τ = mB sin θ is directly proportional to B."},
{q:"A rectangular coil has length 8 cm and breadth 5 cm. Its area is:",o:["13 cm²","26 cm²","40 cm²","80 cm²"],a:2,e:"Area = length × breadth = 8 × 5 = 40 cm²."},
{q:"A 50-turn coil of area 4 × 10⁻³ m² carries 1 A in a 0.2 T field. Maximum torque is:",o:["0.004 N m","0.02 N m","0.04 N m","0.4 N m"],a:2,e:"τmax = NIAB = 50 × 1 × 4 × 10⁻³ × 0.2 = 0.04 N m."},
{q:"A current loop in a uniform magnetic field experiences:",o:["a nonzero net force always","zero net force but may experience torque","neither force nor torque in every orientation","a force proportional to its resistance"],a:1,e:"For a closed loop in a uniform field, the net magnetic force is zero, but the couple can produce torque."},
{q:"The direction of magnetic moment of a current loop is determined by:",o:["Fleming's left-hand rule","right-hand thumb rule","Lenz's law only","Coulomb's law"],a:1,e:"Curl the fingers of the right hand in the current direction; the thumb gives the magnetic moment direction."},
{q:"For a coil with m = 0.3 A m² in B = 4 T, maximum torque is:",o:["0.075 N m","0.3 N m","1.2 N m","4.3 N m"],a:2,e:"τmax = mB = 0.3 × 4 = 1.2 N m."},
{q:"A loop has torque 0.5 N m at 90°. At 30° with the same m and B, torque is:",o:["0.125 N m","0.25 N m","0.5 N m","1 N m"],a:1,e:"Torque scales with sin θ. At 30°, τ = τmax × 1/2 = 0.25 N m."},
{q:"The work required to rotate a magnetic dipole slowly from 0° to 90° in a field is:",o:["zero","mB","−mB","2mB"],a:1,e:"U(0°) = −mB and U(90°) = 0. The increase in potential energy, and hence external work, is mB."},
{q:"For a current loop, the torque tends to:",o:["increase its magnetic potential energy in stable equilibrium","rotate m toward alignment with B","reverse the current automatically","change the magnitude of m"],a:1,e:"The magnetic torque tends to align m with B. It changes orientation, not the magnitude of the magnetic moment for a rigid loop with fixed current."},
{q:"Which change does NOT alter the magnetic moment of a rigid coil if current remains constant?",o:["increasing number of turns","increasing enclosed area","changing coil orientation in the same current","increasing current"],a:2,e:"The magnitude m = NIA depends on N, I and A, not on the coil's orientation in space."}
];
let questions=originalQuestions.slice(),index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;$('percent').textContent=Math.round(index/questions.length*100)+'%';$('fill').style.width=(index/questions.length*100)+'%';$('qmeta').textContent='QUESTION '+(index+1);$('question').textContent=item.q;$('feedback').className='feedback';$('feedback').textContent='';$('check').style.display='block';$('check').disabled=true;$('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';$('options').replaceChildren();
 item.o.forEach((text,j)=>{const b=document.createElement('button');b.type='button';b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});$('options').appendChild(b);});
}
$('check').addEventListener('click',()=>{if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});const f=$('feedback');if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}if(window.MathJax?.typesetPromise)MathJax.typesetPromise([f]).catch(()=>{});$('check').style.display='none';$('continue').className='btn continue show';});
$('continue').addEventListener('click',()=>{if(!locked)return;index++;if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}$('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';const pct=Math.round(score/questions.length*100),card=document.createElement('section');card.className='finish';card.innerHTML='<div class="trophy">🏆</div><h2>Torque on Current Loop Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';const review=card.querySelector('#wrongReview');if(wrongAttempts.length){review.innerHTML='<h3>🧠 Review your mistakes</h3>';wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.className='review-item';const q=document.createElement('p');q.style.fontWeight='850';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.className='wrong-text';yours.textContent='Your answer: '+w.chosen;const correct=document.createElement('p');correct.className='correct-text';correct.textContent='Correct answer: '+w.answer;const why=document.createElement('p');why.className='muted';why.textContent=w.explanation;item.append(q,yours,correct,why);review.appendChild(item);});}else review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';$('finishSlot').replaceChildren(card);
function reset(onlyWrong){if(onlyWrong&&wrongAttempts.length){const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);questions.splice(0,questions.length,...wrongQs);}else questions.splice(0,questions.length,...originalQuestions);index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});}
$('retry').addEventListener('click',()=>reset(false));$('retryWrong').addEventListener('click',()=>reset(true));});
render();
})();
