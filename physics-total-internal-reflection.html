<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Total Internal Reflection</title><meta name="description" content="SkillUp Physics Total Internal Reflection interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🔦</span><h1>Total Internal Reflection</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["Total internal reflection occurs when light travels:",["From a denser medium to a rarer medium and the incidence angle exceeds the critical angle","From a rarer medium to a denser medium at any angle","Only through vacuum","Only through a mirror"],0,"Total internal reflection requires propagation from an optically denser medium to a rarer medium with incidence angle greater than the critical angle."] ,["The first condition for total internal reflection is that light must travel:",["From higher refractive index to lower refractive index","From lower refractive index to higher refractive index","Only through air","Only through glass to vacuum"],0,"TIR can occur only when light travels from an optically denser, higher-index medium to a rarer, lower-index medium."] ,["The second condition for total internal reflection is that the angle of incidence must be:",["Greater than the critical angle","Less than the critical angle","Exactly 0°","Always 90°"],0,"TIR occurs when the incidence angle is greater than the critical angle for the two media."] ,["At the critical angle, the angle of refraction is:",["90°","0°","45°","180°"],0,"At the critical angle, the refracted ray travels along the interface, so the refraction angle is 90°."] ,["For light going from a denser medium of refractive index n₁ to a rarer medium n₂, the critical angle C satisfies:",["sin C = n₂/n₁","sin C = n₁/n₂","sin C = n₁n₂","sin C = n₁+n₂"],0,"For n₁>n₂, Snell's law at the critical angle gives sin C=n₂/n₁."] ,["For a glass-air interface with refractive index of glass about 1.5, the critical angle is approximately:",["42°","15°","60°","90°"],0,"For glass-air, C=sin⁻¹(1/1.5), which is about 42°."] ,["If the incidence angle is less than the critical angle, the light undergoes:",["Refraction into the rarer medium","Total internal reflection","No interaction","Only absorption"],0,"Below the critical angle, a refracted ray emerges into the rarer medium."] ,["If the incidence angle equals the critical angle, the refracted ray:",["Grazes along the interface","Returns along the incident path","Disappears","Is reflected at 90° to the normal"],0,"At C, the refracted ray makes 90° with the normal and therefore travels along the boundary."] ,["An important application of total internal reflection is:",["Optical fibres","Ordinary room mirrors only","Electric heaters","Loudspeakers"],0,"Optical fibres guide light through repeated total internal reflection inside the core."] ,["In an optical fibre, the core generally has:",["Higher refractive index than the cladding","Lower refractive index than the cladding","The same index as vacuum","Zero refractive index"],0,"For effective guiding, the fibre core has a higher refractive index than the surrounding cladding."] ,["Diamond sparkles strongly partly because diamond has:",["A high refractive index and a small critical angle","Zero refractive index","No reflection","Only diffuse reflection"],0,"Diamond's high refractive index gives it a relatively small critical angle, allowing strong internal reflection and brilliance when conditions are suitable."] ,["Total internal reflection can occur at a water-air boundary when light travels:",["From water to air at sufficiently large incidence angle","From air to water at any angle","Only from air to water above 90°","Only in vacuum"],0,"Water has a higher refractive index than air, so TIR is possible for rays traveling from water to air above the critical angle."] ,["A prism can use total internal reflection to:",["Turn or deviate light through a large angle","Make light travel faster than c in vacuum","Eliminate all reflection","Convert light into sound"],0,"Prisms can exploit TIR to reflect and deviate light efficiently without a metallic coating."] ,["Which statement about total internal reflection is correct?",["No refracted ray propagates into the rarer medium when the incidence angle is greater than the critical angle","It occurs for every incidence angle","It requires light to travel from rarer to denser medium","It can occur only with mirrors"],0,"Beyond the critical angle, the ray is totally reflected inside the denser medium and no propagating refracted ray enters the rarer medium."] ,["If the refractive index of the rarer medium decreases while the denser medium stays the same, the critical angle generally:",["Decreases","Increases","Remains exactly the same","Becomes 90°"],0,"Since sin C=n₂/n₁, lowering n₂ lowers the critical angle when n₁ is unchanged."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
