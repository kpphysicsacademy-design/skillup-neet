<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Transformer</title><meta name="description" content="SkillUp Physics Transformer interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🔌</span><h1>Transformer</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["A transformer operates on the principle of:",["Electrostatic induction","Mutual induction","Photoelectric effect","Thermionic emission"],1,"A transformer transfers AC energy by mutual electromagnetic induction."],["A transformer normally works with:",["DC only","AC","Steady DC only","Any constant voltage"],1,"A changing current is needed to produce changing magnetic flux."],["For an ideal transformer, the voltage ratio is:",["V_s/V_p=N_s/N_p","V_s/V_p=N_p/N_s","V_sV_p=N_sN_p","V_s/V_p=I_s/I_p"],0,"For an ideal transformer, V_s/V_p=N_s/N_p."],["If N_s>N_p, the transformer is:",["Step-down","Step-up","Isolation only","A rectifier"],1,"More secondary turns give a higher secondary voltage."],["If N_s<N_p, the transformer is:",["Step-up","Step-down","Oscillator","Rectifier"],1,"Fewer secondary turns give a lower secondary voltage."],["An ideal transformer approximately conserves:",["Voltage","Current","Power","Resistance"],2,"Ignoring losses, input power equals output power."],["For an ideal transformer, the current ratio is:",["I_s/I_p=N_s/N_p","I_s/I_p=N_p/N_s","I_s/I_p=N_sN_p","I_s/I_p=1 always"],1,"Current ratio is inverse to turns ratio."],["A transformer has 500 primary turns and 1000 secondary turns. If V_p=100 V, V_s is:",["50 V","100 V","200 V","500 V"],2,"V_s=100×1000/500=200 V."],["A transformer has 1000 primary turns and 200 secondary turns. If V_p=250 V, V_s is:",["25 V","50 V","125 V","500 V"],1,"V_s=250×200/1000=50 V."],["The laminated iron core of a transformer mainly reduces:",["Hysteresis only","Eddy-current loss","Copper resistance","Frequency"],1,"Lamination reduces circulating eddy currents in the core."],["Transformer windings are commonly made from copper because copper has:",["High resistivity","Low resistivity","High capacitance","Zero resistance"],1,"Low resistivity reduces I²R (copper) losses."],["A transformer cannot directly transform steady DC because:",["DC has no voltage","DC does not provide changing magnetic flux after switching","Copper cannot conduct DC","The core becomes superconducting"],1,"Steady DC produces no continuously changing flux, so no sustained secondary emf is induced."],["In a step-up transformer, ideally the secondary current is:",["Greater than primary current","Less than primary current","Equal to zero","Always equal to voltage"],1,"With approximately conserved power, higher voltage corresponds to lower current."],["The frequency of AC in an ideal transformer secondary is:",["Higher than primary","Lower than primary","The same as primary","Always zero"],2,"A transformer changes voltage/current levels, not AC frequency."],["A transformer has 200 primary turns and 1000 secondary turns. If V_p=20 V, V_s is:",["4 V","20 V","100 V","200 V"],2,"V_s=20×1000/200=100 V."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="✓ Correct — "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="✗ Not quite — "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;i++;if(i<qs.length)render();else{$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`;$("fill").style.width="100%"}}function restart(){i=0;score=0;xp=0;$("quiz").hidden=false;$("result").hidden=true;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
