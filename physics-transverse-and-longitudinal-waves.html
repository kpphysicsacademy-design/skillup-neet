(function(){
'use strict';
const questions = [{"q":"In a transverse wave, particles of the medium oscillate:","o":["Perpendicular to the direction of propagation","Parallel to the direction of propagation","Only in the direction of gravity","Without any displacement"],"a":0,"e":"Transverse oscillations are at right angles to the direction in which the wave travels."},{"q":"In a longitudinal wave, particles of the medium oscillate:","o":["Parallel to the direction of propagation","Perpendicular to the direction of propagation","Only in circles","At right angles to the wave direction"],"a":0,"e":"Longitudinal particle motion is parallel to the wave's direction of travel."},{"q":"Which is a typical example of a transverse mechanical wave?","o":["A wave on a stretched string","Sound travelling through air","A compression pulse in a slinky","A pressure wave in air"],"a":0,"e":"A stretched string can support transverse displacement as the disturbance travels along it."},{"q":"Sound travelling through air is generally:","o":["Longitudinal","Transverse","Electromagnetic","Able to travel through vacuum"],"a":0,"e":"Air transmits sound by pressure and density variations parallel to propagation."},{"q":"The crowded regions in a longitudinal wave are called:","o":["Compressions","Rarefactions","Crests","Troughs"],"a":0,"e":"In a compression, particles are closer together and pressure is typically higher."},{"q":"The spread-out regions in a longitudinal wave are called:","o":["Rarefactions","Compressions","Crests","Nodes"],"a":0,"e":"A rarefaction is a region of lower density and pressure relative to a compression."},{"q":"The highest point on a simple transverse wave profile is called a:","o":["Crest","Trough","Compression","Rarefaction"],"a":0,"e":"A crest is the maximum positive displacement in the drawn wave profile."},{"q":"The lowest point on a simple transverse wave profile is called a:","o":["Trough","Crest","Compression","Rarefaction"],"a":0,"e":"A trough is the maximum negative displacement in the drawn wave profile."},{"q":"Which feature is characteristic of an ideal longitudinal sound wave?","o":["Alternating compressions and rarefactions","Only crests and troughs","Polarisation into one transverse plane","A vacuum required for propagation"],"a":0,"e":"Sound in air propagates through successive compressions and rarefactions."},{"q":"Which type of wave can be polarised?","o":["Transverse waves","Longitudinal waves","All longitudinal sound waves","Only waves with zero amplitude"],"a":0,"e":"Polarisation selects a transverse oscillation direction, so it is a property of transverse waves."},{"q":"Why can sound propagate through air but transverse shear waves generally cannot propagate through bulk air?","o":["Air supports compression but not a sustained shear stress in the usual model","Air has no particles","Sound does not involve pressure changes","Air always has infinite rigidity"],"a":0,"e":"Fluids support compression waves but do not sustain static shear stress, unlike solids."},{"q":"Electromagnetic waves such as visible light are:","o":["Transverse","Longitudinal sound waves","Mechanical compression waves","Unable to travel through vacuum"],"a":0,"e":"The electric and magnetic fields oscillate perpendicular to the direction of propagation."},{"q":"In a wave on a horizontal rope travelling to the right, the rope is shaken up and down. The wave is:","o":["Transverse","Longitudinal","A sound wave in air only","Stationary by definition"],"a":0,"e":"The rope particles move vertically while the disturbance propagates horizontally."},{"q":"In a slinky, a push-pull disturbance along the slinky's length is an example of a:","o":["Longitudinal wave","Transverse wave","Electromagnetic wave","Light wave"],"a":0,"e":"The coils move back and forth parallel to the direction the disturbance travels."},{"q":"In a longitudinal wave, one wavelength is the distance between:","o":["Two successive compressions or two successive rarefactions","A crest and a trough in every case","A compression and the nearest rarefaction","Any two adjacent particles"],"a":0,"e":"Equivalent points in successive cycles, such as compression to compression, are one wavelength apart."},{"q":"In a transverse sinusoidal wave, one wavelength is the distance from:","o":["One crest to the next crest","A crest to the next trough","The equilibrium line to a crest","Any particle to its nearest neighbour"],"a":0,"e":"Successive crests are in the same phase and separated by one wavelength."},{"q":"A sound wave travelling through air transfers energy mainly through:","o":["Pressure and density disturbances in the air","Permanent movement of all air from source to listener","A transverse displacement of air molecules only","Electric and magnetic fields"],"a":0,"e":"Air particles oscillate locally as pressure disturbances carry energy along."},{"q":"Which statement about particle motion in a travelling wave is correct?","o":["Particles generally oscillate locally; the disturbance propagates","Every particle travels with the wave at wave speed","Particles must be carried permanently to the destination","No energy is transferred"],"a":0,"e":"Wave propagation transfers energy without bulk transport of the medium in an ordinary travelling wave."},{"q":"In a transverse wave, the direction of particle oscillation and wave propagation are:","o":["Perpendicular","Parallel","Always opposite","Always identical in magnitude"],"a":0,"e":"This perpendicular relationship defines a transverse wave."},{"q":"Seismic P-waves are primarily:","o":["Longitudinal/compressional waves","Transverse shear waves only","Electromagnetic waves","Surface light waves"],"a":0,"e":"P-waves travel by compressions and expansions of material and can pass through solids and fluids."},{"q":"Seismic S-waves are primarily:","o":["Transverse shear waves","Longitudinal pressure waves","Radio waves","Sound waves in vacuum"],"a":0,"e":"S-waves involve shear displacement perpendicular to their propagation direction."},{"q":"Which wave can travel through a vacuum?","o":["Light, an electromagnetic wave","Sound in air","A pulse on a rope","A compression wave in a slinky"],"a":0,"e":"Electromagnetic waves do not require a material medium."},{"q":"Water surface waves are best described at this level as:","o":["Often involving both transverse and longitudinal particle motion","Purely longitudinal in all circumstances","Purely transverse at every depth","Unable to carry energy"],"a":0,"e":"Surface-water particle motion can combine up-and-down and back-and-forth components."},{"q":"For an ideal longitudinal wave, the medium's density is typically:","o":["Higher in compressions and lower in rarefactions","Constant everywhere at every instant","Zero in every rarefaction","Unrelated to the wave disturbance"],"a":0,"e":"Compressions bring particles closer; rarefactions spread them farther apart."},{"q":"If a transverse wave travels horizontally and particles move vertically, the angle between these directions is:","o":["90°","0°","45°","180°"],"a":0,"e":"Vertical and horizontal directions are perpendicular, making a 90° angle."},{"q":"A longitudinal wave travels along the x-axis. The particles oscillate mainly along:","o":["The x-axis","The y-axis only","The z-axis only","A direction perpendicular to x in every case"],"a":0,"e":"Longitudinal oscillation is parallel to propagation, here the x-axis."},{"q":"Which statement correctly distinguishes a compression from a crest?","o":["Compression is a high-density region in a longitudinal wave; crest is a maximum in a transverse wave profile","They are identical terms for every wave","A compression occurs only in electromagnetic waves","A crest is a low-pressure region in air by definition"],"a":0,"e":"The terms describe different wave features: density variation versus displacement profile."},{"q":"A longitudinal wave has frequency 10 Hz and wavelength 3 m. Its propagation speed is:","o":["30 m/s","13 m/s","3.3 m/s","0.3 m/s"],"a":0,"e":"Wave speed v = fλ = 10 × 3 = 30 m/s."},{"q":"A transverse wave travels at 8 m/s and has wavelength 2 m. Its frequency is:","o":["4 Hz","16 Hz","6 Hz","0.25 Hz"],"a":0,"e":"f = v/λ = 8/2 = 4 Hz."},{"q":"Which statement is correct for sound waves in ordinary air?","o":["They are longitudinal mechanical waves and cannot travel through vacuum","They are transverse electromagnetic waves","They can travel in vacuum without a medium","They always have crests and troughs in air pressure"],"a":0,"e":"Sound requires a material medium; in air it propagates as longitudinal pressure variations."}];
let index=0,score=0,streak=0,chosen=null,locked=false;

let wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });

$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';

 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Transverse and Longitudinal Waves Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }

 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
