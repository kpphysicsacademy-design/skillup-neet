<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Transverse Waves</title><style>
body{font-family:Arial,sans-serif;background:#f3f7ff;margin:0;color:#1e293b}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(30,41,59,.10);border:1px solid #e2e8f0}h1{text-align:center;color:#334155}.meta{display:flex;justify-content:space-between;font-weight:700;color:#475569}.bar{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#22c55e;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;color:#172033}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe4f0;border-radius:14px;background:#fff;color:#1e293b;font-size:16px;cursor:pointer;transition:.2s}.opt:hover{background:#eef5ff;border-color:#93c5fd;transform:translateY(-1px)}.correct{border-color:#16a34a!important;background:#ecfdf3!important;color:#166534!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important;color:#991b1b!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#4f46e5;color:#fff}.back{background:#334155;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#d97706;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>〰️ Transverse Waves</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>
const qs=[
['In a transverse wave, particles of the medium vibrate','parallel to the direction of propagation','perpendicular to the direction of propagation','only forward','without displacement',1,'In a transverse wave, particle vibration is perpendicular to the direction in which the wave travels.'],
['Which is a transverse mechanical wave?','Sound in air','Wave on a stretched string','Sound in a gas','Pressure wave',1,'A wave on a stretched string is a common example of a transverse mechanical wave.'],
['The highest point of a transverse wave is called','trough','crest','compression','rarefaction',1,'The crest is the point of maximum positive displacement in a transverse wave.'],
['The lowest point of a transverse wave is called','crest','trough','compression','equilibrium',1,'The trough is the point of maximum negative displacement.'],
['The distance between two successive crests is','amplitude','wavelength','period','frequency',1,'The distance between successive points in the same phase, such as two crests, is the wavelength λ.'],
['The distance from the mean position to a crest represents','wavelength','amplitude','frequency','wave speed',1,'Amplitude is the maximum displacement of a particle from its equilibrium position.'],
['If the amplitude of a wave is doubled, its maximum particle displacement','halves','doubles','becomes zero','is unchanged',1,'Amplitude directly gives the maximum particle displacement.'],
['For a periodic wave, the relation between speed, frequency and wavelength is','v=fλ','v=f/λ','v=λ/f','v=f+λ',0,'The wave-speed relation is v=fλ.'],
['A wave has frequency 4 Hz and wavelength 3 m. Its speed is','0.75 m/s','7 m/s','12 m/s','16 m/s',2,'Using v=fλ, v=4×3=12 m/s.'],
['In an ideal transverse wave on a string, the disturbance can transfer','matter permanently forward','energy along the string','only mass','no energy',1,'The wave transfers energy along the string while the particles mainly oscillate about equilibrium positions.'],
['In a transverse wave, points separated by one wavelength are','in the same phase','always in opposite phase','never moving','at different frequencies',0,'Points separated by λ have the same phase in a periodic wave.'],
['Points separated by half a wavelength in a sinusoidal transverse wave differ in phase by','0','π/2','π','2π',2,'A separation of λ/2 corresponds to a phase difference of π radians.'],
['A transverse wave has wavelength 0.5 m and frequency 10 Hz. Its speed is','5 m/s','10.5 m/s','20 m/s','0.05 m/s',0,'Using v=fλ, v=10×0.5=5 m/s.'],
['Which statement about a transverse wave is correct?','Particles travel with the wave over large distances','Particle oscillation is perpendicular to wave propagation','Particles do not oscillate','Wavelength is always zero',1,'The defining feature is perpendicular particle vibration relative to propagation.'],
['When a transverse wave passes through a medium, the particles generally','remain permanently displaced','oscillate about their equilibrium positions','move with constant velocity in the wave direction','vanish after one cycle',1,'Particles undergo oscillatory motion about their mean positions as the disturbance propagates.']
];
let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
