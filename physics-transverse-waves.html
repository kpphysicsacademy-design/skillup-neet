<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>

<script>
(function(){
'use strict';
const questions = [{"q":"In a transverse wave, particles of the medium oscillate:","o":["Parallel to wave travel","Perpendicular to wave travel","Only forward","Not at all"],"a":1,"e":"In a transverse wave, particle displacement is perpendicular to the direction of propagation."},{"q":"The highest point of a transverse wave is called the:","o":["Trough","Crest","Compression","Node"],"a":1,"e":"A crest is the maximum positive displacement on a transverse wave profile."},{"q":"The lowest point of a transverse wave is called the:","o":["Crest","Rarefaction","Trough","Antinode"],"a":2,"e":"A trough is the maximum negative displacement on the wave profile."},{"q":"The maximum displacement of a particle from equilibrium is the:","o":["Wavelength","Amplitude","Period","Frequency"],"a":1,"e":"Amplitude is the maximum magnitude of oscillatory displacement."},{"q":"The distance between two successive crests is the:","o":["Amplitude","Period","Wavelength","Frequency"],"a":2,"e":"Successive crests are one wavelength apart."},{"q":"The SI unit of wavelength is:","o":["Hertz","Second","Metre","Metre per second"],"a":2,"e":"Wavelength is a length, measured in metres."},{"q":"Which is a common example of a transverse mechanical wave?","o":["Sound in air","Wave on a stretched string","Pressure wave in a gas","Sound in water"],"a":1,"e":"A wave on a taut string has particle motion transverse to the wave's travel direction."},{"q":"The relation among wave speed v, frequency f and wavelength λ is:","o":["v = fλ","v = f/λ","v = λ/f","v = f + λ"],"a":0,"e":"Wave speed equals frequency multiplied by wavelength."},{"q":"A wave has frequency 4 Hz and wavelength 3 m. Its speed is:","o":["0.75 m/s","7 m/s","12 m/s","16 m/s"],"a":2,"e":"v = fλ = 4 × 3 = 12 m/s."},{"q":"A transverse wave has wavelength 0.5 m and frequency 10 Hz. Its speed is:","o":["5 m/s","10.5 m/s","20 m/s","0.05 m/s"],"a":0,"e":"v = fλ = 10 × 0.5 = 5 m/s."},{"q":"Points separated by one wavelength in a periodic wave are:","o":["In the same phase","Always in opposite phase","Always stationary","At different frequencies"],"a":0,"e":"A separation of λ corresponds to a phase difference of 2π, so the points are in phase."},{"q":"The phase difference between points separated by half a wavelength is:","o":["0","π/2","π","2π"],"a":2,"e":"Δφ = 2π(Δx/λ); for Δx = λ/2, Δφ = π radians."},{"q":"The phase difference between points separated by one-quarter wavelength is:","o":["π/4","π/2","π","2π"],"a":1,"e":"Δφ = 2π(λ/4)/λ = π/2 radians."},{"q":"If the amplitude of a transverse wave doubles, the maximum particle displacement:","o":["Halves","Doubles","Becomes zero","Stays fixed by definition"],"a":1,"e":"Amplitude is the maximum displacement, so doubling amplitude doubles maximum displacement."},{"q":"In an ideal wave on a string, the disturbance transports:","o":["String material permanently forward","Energy along the string","Only mass","No energy"],"a":1,"e":"The wave carries energy while string elements oscillate about their equilibrium positions."},{"q":"For a sinusoidal wave, the vertical distance from crest to trough equals:","o":["A","2A","λ","λ/2"],"a":1,"e":"A crest is at +A and a trough at −A, giving a crest-to-trough displacement of 2A."},{"q":"A wave has amplitude 0.04 m. Its crest displacement from equilibrium is:","o":["0.02 m","0.04 m","0.08 m","0.4 m"],"a":1,"e":"The crest is at the maximum positive displacement, equal to amplitude A = 0.04 m."},{"q":"If the frequency is 8 Hz, the period is:","o":["8 s","0.8 s","0.125 s","16 s"],"a":2,"e":"T = 1/f = 1/8 = 0.125 s."},{"q":"A wave has period 0.2 s. Its frequency is:","o":["0.2 Hz","2 Hz","5 Hz","10 Hz"],"a":2,"e":"f = 1/T = 1/0.2 = 5 Hz."},{"q":"A wave travels at 24 m/s and has frequency 6 Hz. Its wavelength is:","o":["4 m","18 m","30 m","144 m"],"a":0,"e":"λ = v/f = 24/6 = 4 m."},{"q":"A wave travels at 15 m/s with wavelength 5 m. Its frequency is:","o":["3 Hz","5 Hz","10 Hz","75 Hz"],"a":0,"e":"f = v/λ = 15/5 = 3 Hz."},{"q":"Which statement best describes a transverse wave?","o":["Particles must move permanently with the wave","Particle oscillation is perpendicular to propagation","It can travel only in vacuum","It has no wavelength"],"a":1,"e":"The defining feature is that oscillations are perpendicular to propagation."},{"q":"Which quantity describes how many wave cycles pass a point per second?","o":["Amplitude","Wavelength","Frequency","Period"],"a":2,"e":"Frequency counts cycles per second and is measured in hertz."},{"q":"What is the period of a wave with frequency 25 Hz?","o":["25 s","4 s","0.04 s","0.4 s"],"a":2,"e":"T = 1/25 s = 0.04 s."},{"q":"Two crests are 2.4 m apart. The wavelength is:","o":["1.2 m","2.4 m","4.8 m","0.4 m"],"a":1,"e":"The distance between successive crests is one wavelength."},{"q":"The distance between a crest and the adjacent trough is:","o":["λ/4","λ/2","λ","2λ"],"a":1,"e":"Adjacent crest and trough are separated by half a wavelength."},{"q":"If wave speed remains constant and frequency doubles, wavelength:","o":["Doubles","Halves","Does not change","Becomes four times"],"a":1,"e":"Since λ = v/f, wavelength is inversely proportional to frequency at constant speed."},{"q":"When a wave passes from one medium into another, the source frequency generally:","o":["Changes to zero","Remains the same","Always doubles","Becomes equal to speed"],"a":1,"e":"The source sets the frequency; speed and wavelength can change in the new medium."},{"q":"For a sinusoidal transverse wave, the equilibrium line represents:","o":["The crest line","The trough line","Zero displacement","Maximum displacement"],"a":2,"e":"At equilibrium, displacement is zero."},{"q":"A wave has speed 12 m/s and wavelength 0.8 m. Its frequency is:","o":["9.6 Hz","15 Hz","0.067 Hz","12.8 Hz"],"a":1,"e":"f = v/λ = 12/0.8 = 15 Hz."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Transverse Waves Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
