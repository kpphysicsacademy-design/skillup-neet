<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Two Body Motion</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-size:1.6rem;font-weight:900}.subtitle{color:#5f6b7a;margin:0 0 18px}.xp,.card{background:#fff;border-radius:20px;box-shadow:0 6px 20px #17203312}.xp{padding:10px 15px;font-weight:850}.card{padding:20px;margin:12px 0}.ph{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:11px;background:#dfe8f1;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.25s}.qnum{font-weight:800;color:#35516f;margin-bottom:11px}.question{font-size:1.27rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#58cc02;background:#f7fff1;transform:translateY(-1px)}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;background:#2db84d;color:#fff;font-weight:850;cursor:pointer;box-shadow:0 4px 0 #21863a;transition:.12s}.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #21863a}.feedback{margin-top:14px;padding:12px;border-radius:13px;font-weight:700;min-height:18px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:10px;padding:10px 13px;border:2px solid #d9d4f5;border-radius:13px;color:#5146a5;font-weight:800;text-decoration:none;transition:.12s}.back:hover{background:#f0edff;transform:translateX(-2px)}@media(max-width:600px){.wrap{padding:20px 14px}.title{font-size:1.4rem}.question{font-size:1.12rem}}</style></head><body><main class="wrap"><div class="top"><div class="title">👥 Two Body Motion</div><div class="xp">⚡ <span id="xp">0</span> XP</div></div><p class="subtitle">Physics • NEET 2026 · Learn → Practice → Master</p><section class="card"><div class="ph"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><button class="btn" id="continue">Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const quiz=[['For two interacting bodies, the total linear momentum of the isolated system is:', ['conserved','always zero','always increasing','equal to the heavier body momentum'],0,'With no net external force, total momentum is conserved.'],['Two bodies of masses m1 and m2 move with velocities v1 and v2. Their total momentum is:', ['m1v1 + m2v2','m1v1 - m2v2 always','(m1+m2)/(v1+v2)','m1m2v1v2'],0,'Total momentum is the vector sum of the individual momenta.'],['The centre-of-mass velocity of two bodies is:', ['(m1v1+m2v2)/(m1+m2)','v1+v2','(v1+v2)/2 always','m1m2/(v1+v2)'],0,'The CM velocity is the mass-weighted average of velocities.'],['If two bodies exert equal and opposite internal forces on each other, the net internal force on the system is:', ['zero','twice one force','equal to the larger force','always external'],0,'Newton’s third law makes internal forces cancel in the system sum.'],['Two equal masses move in opposite directions with equal speeds. The CM is:', ['at rest','moving at speed v','moving at speed 2v','accelerating at g'],0,'Their equal and opposite momenta give zero total momentum and zero CM velocity.'],['A 2 kg body moving at 3 m/s and a 1 kg body at rest form an isolated system. The CM velocity is:', ['2 m/s','3 m/s','1 m/s','6 m/s'],0,'V_CM=(2×3+1×0)/3=2 m/s.'],['If no external force acts on a two-body system, an internal collision can:', ['change individual velocities while conserving total momentum','change total momentum','accelerate the CM','create external impulse'],0,'Internal forces redistribute momentum between bodies but do not change total momentum.'],['For two bodies connected by a light string on a frictionless surface, the acceleration of their common centre of mass is determined by:', ['net external force on the system','tension alone','the heavier mass only','the string length'],0,'Internal tension cancels in the system equation.'],['A person pushes another person while both stand on frictionless ground. Their accelerations are:', ['opposite in direction','always in the same direction','both zero','necessarily equal in magnitude'],0,'The interaction forces are opposite; accelerations depend on their masses.'],['For two bodies of unequal masses experiencing equal and opposite forces, the body with smaller mass has:', ['greater acceleration magnitude','smaller acceleration magnitude','the same acceleration always','zero acceleration'],0,'From a=F/m, the smaller mass has the larger acceleration for equal force magnitude.'],['During an isolated two-body collision, which quantity remains constant?', ['total linear momentum','each body’s kinetic energy always','each body’s velocity','kinetic energy in every collision'],0,'Total momentum is conserved in an isolated collision; kinetic energy is conserved only in elastic collisions.'],['If the net external force on a two-body system is constant, the centre of mass has:', ['constant acceleration','constant velocity always','zero acceleration','acceleration caused only by internal forces'],0,'a_CM=F_ext/M, so constant external force gives constant CM acceleration.'],['A two-body system explodes from rest with negligible external impulse. Immediately after explosion, total momentum is:', ['zero','equal to the heavier fragment momentum','infinite','non-zero necessarily'],0,'The initial total momentum is zero and remains zero when external impulse is negligible.'],['If one body in a two-body system is much heavier than the other, the centre of mass lies:', ['closer to the heavier body','closer to the lighter body','always at the midpoint','outside the system necessarily'],0,'The mass-weighted position is closer to the larger mass.'],['For an isolated two-body system, the relative motion of the bodies may change while:', ['CM motion remains governed only by external force','the total momentum changes spontaneously','internal forces become external','mass is necessarily created'],0,'Internal interactions affect relative motion, while CM motion depends on external forces.']];let i=0,selected=-1,checked=false,score=0;const $=id=>document.getElementById(id),o=$("options"),b=$("continue"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;$("count").textContent='Question '+(i+1)+' of 15';$("question").textContent=a[0];o.innerHTML='';f.className='feedback';f.textContent='';b.style.display='inline-block';b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const el=document.createElement('button');el.className='option';el.textContent=String.fromCharCode(65+j)+'. '+item.text;el.dataset.index=item.index;el.onclick=()=>{selected=item.index;[...o.children].forEach(z=>z.classList.remove('selected'));el.classList.add('selected')};o.appendChild(el)})}b.onclick=()=>{if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(el=>{const n=Number(el.dataset.index);el.disabled=true;if(n===a[2])el.classList.add('correct');if(n===selected&&!ok)el.classList.add('wrong')});if(ok)score++;f.className=ok?'feedback good':'feedback bad';f.textContent=(ok?'🎯 Correct! +10 XP — ':'✗ Review — Correct answer: '+a[1][a[2]]+'. ')+a[3];$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$("question").textContent='🏆 Two Body Motion Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
