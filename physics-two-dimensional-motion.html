<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Two-dimensional Motion</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eef7ff;color:#173b62}.wrap{max-width:1050px;margin:auto;padding:20px}.skill,.hero,.quiz,.panel,.mastery{background:#fff;border-radius:20px;padding:22px;margin:12px 0;box-shadow:0 6px 18px #123b7015}.topbar{display:flex;justify-content:space-between;align-items:center}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #dbe7f1;border-radius:15px;background:#fff;text-align:left;font-weight:700;cursor:pointer}.option.selected{border-color:#1677ff;background:#eef6ff}.option.correct{border-color:#2db84d;background:#eaffef}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{padding:12px 18px;border:0;border-radius:13px;font-weight:900;cursor:pointer;margin:8px 6px 0 0}.check{background:#2db84d;color:#fff}.next{background:#dcecff;color:#145b9e}.feedback{margin-top:14px;padding:13px;border-radius:14px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.bar{height:13px;background:#dce8f2;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#42c95a}@media(max-width:750px){.layout{grid-template-columns:1fr}.topbar{align-items:flex-start}}</style></head><body><main class="wrap"><div class="topbar"><a href="physics-home.html">← Back to Physics Path</a><span class="skill">⚡ <span id="xp">0</span> XP</span></div><section class="hero"><div>PHYSICS • NEET 2026</div><h1>Two-dimensional motion</h1><p>LEARN → PRACTICE → MASTER • 15 focused NEET-style MCQs</p></section><section class="mastery"><b>🎯 Skill Mastery <span id="mt">0 / 15</span></b><div class="bar"><div id="fill" class="fill"></div></div></section><div class="layout"><aside class="panel"><h3 id="count">Question 1 of 15</h3><div id="pct">7%</div><div>Two-dimensional motion</div><div>⚡ +10 XP each</div><div>🦉 Learn → Practice → Master</div></aside><section class="quiz"><b id="badge">Q1</b><h2 id="q"></h2><div id="opts" class="options"></div><button id="check" class="btn check">Check Answer</button><button id="next" class="btn next" disabled>Next Question →</button><div id="fb" class="feedback"></div><p>💡 Choose the best answer.</p></section></div></main><script>(function(){const quiz=[['Two-dimensional motion is motion in which position requires:',['Two independent coordinates','Only one coordinate','No coordinate','Only time'],0],['A particle moving in an x-y plane has position described by:',['x and y coordinates','Only x coordinate','Only speed','Only time'],0],['Which is an example of two-dimensional motion?',['Projectile motion in a vertical plane','A train on a straight track','A car moving on a straight road','An object at rest'],0],['In two-dimensional motion, displacement is a:',['Vector with x and y components','Scalar with no direction','Time interval only','Mass value'],0],['If displacement components are 3 m and 4 m perpendicular to each other, its magnitude is:',['5 m','7 m','1 m','12 m'],0],['The velocity vector in two-dimensional motion can be resolved into:',['x and y components','Mass and time components','Only a scalar component','No components'],0],['For projectile motion without air resistance, horizontal acceleration is:',['Zero','g downward','g upward','Variable and horizontal'],0],['For projectile motion near Earth without air resistance, vertical acceleration is:',['g downward','Zero','g upward','Horizontal only'],0],['At the highest point of an ideal projectile, its vertical velocity is:',['Zero','Maximum','Equal to g','Always negative'],0],['In ideal projectile motion, horizontal velocity is:',['Constant','Always zero','Increasing uniformly','Decreasing uniformly'],0],['The trajectory of a projectile launched obliquely is:',['A parabola','A circle','A straight vertical line','A hyperbola'],0],['If a vector A has components Ax and Ay, its magnitude is:',['√(Ax² + Ay²)','Ax + Ay only','Ax − Ay only','AxAy'],0],['The direction angle θ of a vector with components Ax and Ay satisfies:',['tan θ = Ay/Ax','tan θ = Ax/Ay only','θ = AxAy','θ = Ax + Ay'],0],['For a particle moving in a plane, acceleration may have:',['Both x and y components','Only an x component always','Only a y component always','No component'],0],['Which statement is correct for two-dimensional motion?',['Motion can be analysed independently through perpendicular components','Both components must always be equal','Velocity has no direction','Displacement is never a vector']],0]];let i=0,sel=-1,score=0,q=document.getElementById('q'),o=document.getElementById('opts'),fb=document.getElementById('fb'),check=document.getElementById('check'),next=document.getElementById('next');function render(){let a=quiz[i];sel=-1;q.textContent=a[0];document.getElementById('badge').textContent='Q'+(i+1);document.getElementById('count').textContent='Question '+(i+1)+' of '+quiz.length;document.getElementById('pct').textContent=Math.round((i+1)/quiz.length*100)+'%';o.innerHTML='';fb.textContent='';fb.className='feedback';check.disabled=false;next.disabled=true;a[1].forEach((v,j)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+v;b.onclick=()=>{sel=j;[...o.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)})}check.onclick=()=>{if(sel<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}let a=quiz[i];[...o.children].forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===sel&&j!==a[2])b.classList.add('wrong')});if(sel===a[2]){score++;fb.className='feedback good';fb.textContent='🎯 Correct! +10 XP'}else{fb.className='feedback bad';fb.textContent='Not quite. Correct answer: '+a[1][a[2]]}document.getElementById('xp').textContent=score*10;document.getElementById('mt').textContent=score+' / '+quiz.length;document.getElementById('fill').style.width=score/quiz.length*100+'%';check.disabled=true;next.disabled=false;if(i===quiz.length-1)next.textContent='Finish Skill →'};next.onclick=()=>{if(i<quiz.length-1){i++;next.textContent='Next Question →';render()}else{q.textContent='🏆 Two-dimensional Motion Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+score+' / '+quiz.length+' correct • '+score*10+' XP'}};render()})();</script></body></html>
