n class="wrap"><div class="head"><h1>⚖️ Two-Particle Centre of Mass</h1><div class="xp">⚡ <span id="xp">0</span> XP</div></div><p class="sub">Master centre of mass of a two-particle system with 15 NEET-style questions.</p><section class="card master"><div class="mh"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div id="num" class="num">Question 1 of 15</div><div id="q" class="q"></div><div id="opts" class="opts"></div><button id="continue" class="btn">Continue →</button><div id="fb" class="feedback"></div></section><a id="back" class="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const quiz=[['For two particles of masses m₁ and m₂ at positions x₁ and x₂, the x-coordinate of their centre of mass is',['(m₁x₁+m₂x₂)/(m₁+m₂)','(x₁+x₂)/2 always','m₁x₁+m₂x₂','(m₁+m₂)/(x₁+x₂)'],0],['If two equal masses are placed at x=0 and x=10 m, their centre of mass is at',['5 m','0 m','10 m','20 m'],0],['A 2 kg particle is at x=0 and a 3 kg particle at x=10 m. The centre of mass is at',['6 m','4 m','5 m','8 m'],0],['For two particles, the centre of mass lies closer to the particle having:',['larger mass','smaller mass','greater speed always','greater acceleration always'],0],['If the total external force on a two-particle system is zero, the centre of mass:',['moves with constant velocity','must remain at rest','moves in a circle','has increasing acceleration'],0],['The velocity of the centre of mass of two particles is',['(m₁v₁+m₂v₂)/(m₁+m₂)','v₁+v₂','(v₁+v₂)/2 always','m₁v₁+m₂v₂'],0],['If both particles have the same velocity, the centre of mass has:',['the same velocity','zero velocity','twice the velocity','half the velocity'],0],['If one particle is much more massive than the other, the centre of mass is located:',['very close to the massive particle','midway between them','at the lighter particle','outside the system always'],0],['For two particles separated by distance d, the distance of the centre of mass from m₁ is',['m₂d/(m₁+m₂)','m₁d/(m₁+m₂)','d/2 always','(m₁+m₂)d'],0],['Two particles of masses 1 kg and 3 kg are separated by 8 m. The centre of mass measured from the 1 kg particle is',['6 m','2 m','4 m','8 m'],0],['If a two-particle system is isolated, internal forces can:',['change individual velocities but not the centre-of-mass motion','change the centre-of-mass momentum','create net external force','change total mass'],0],['The total momentum of a two-particle system is related to centre-of-mass velocity by',['P=MvCM','P=mvCM²','P=M/vCM','P=0 always'],0],['If the centre of mass of two equal masses is at the origin, their positions along one axis satisfy:',['x₁=-x₂','x₁=x₂','x₁=2x₂','x₁=0 only'],0],['A particle at x=2 m has mass 4 kg and another at x=8 m has mass 2 kg. Their centre of mass is:',['4 m','5 m','6 m','7 m'],0],['Which statement about the centre of mass of a two-particle system is correct?',['It depends on the masses and positions of both particles','It always lies halfway between particles','It must coincide with one particle','It depends only on velocity'],0]];let i=0,sel=-1,checked=false,score=0;const $=id=>document.getElementById(id);function render(){const a=quiz[i];sel=-1;checked=false;$('num').textContent='Question '+(i+1)+' of 15';$('q').textContent=a[0];$('opts').innerHTML='';$('fb').textContent='';$('fb').className='feedback';$('continue').textContent=i===14?'Finish Skill →':'Continue →';let order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((x,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{sel=x.index;[...$('opts').children].forEach(z=>z.classList.remove('selected'));b.classList.add('selected')};$('opts').appendChild(b)})}function update(){ $('xp').textContent=score*10;$('mastery').textContent=score+' / 15';$('fill').style.width=(score/15*100)+'%'}$('continue').onclick=()=>{if(!checked){if(sel<0){$('fb').className='feedback bad';$('fb').textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=sel===a[2];[...$('opts').children].forEach(b=>{const x=+b.dataset.index;b.disabled=true;if(x===a[2])b.classList.add('correct');if(x===sel&&!ok)b.classList.add('wrong')});if(ok){score++;$('fb').className='feedback good';$('fb').textContent='🎯 Correct! +10 XP'}else{$('fb').className='feedback bad';$('fb').textContent='✗ Correct answer: '+a[1][a[2]]}update();return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$('q').textContent='🏆 Two-Particle Centre of Mass Complete!';$('opts').innerHTML='';$('continue').style.display='none';$('fb').className='feedback good';$('fb').textContent='Score: '+score+' / 15 • '+score*10+' XP earned.'}};$('back').onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
