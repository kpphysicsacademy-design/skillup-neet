<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Ultraviolet Radiation</title><meta name="description" content="SkillUp Physics Ultraviolet Radiation interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">☀️</span><h1>Ultraviolet Radiation</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["Ultraviolet radiation is a type of:",["Electromagnetic radiation","Mechanical wave","Sound wave","Matter wave only"],0,"Ultraviolet (UV) radiation is part of the electromagnetic spectrum."],["Ultraviolet radiation lies between:",["Visible light and X-rays","Radio waves and microwaves","Microwaves and infrared","Gamma rays and radio waves"],0,"UV lies beyond violet light and before X-rays in the electromagnetic spectrum."],["Compared with visible violet light, ultraviolet radiation generally has:",["Shorter wavelength and higher frequency","Longer wavelength and lower frequency","The same wavelength","Zero frequency"],0,"UV has shorter wavelengths and higher frequencies than visible light."],["The speed of ultraviolet radiation in vacuum is approximately:",["3×10⁸ m/s","3×10⁶ m/s","3×10⁴ m/s","3×10¹⁰ m/s"],0,"All electromagnetic waves travel at approximately 3×10⁸ m/s in vacuum."],["A major natural source of ultraviolet radiation reaching Earth is the:",["Sun","Moon","Earth's magnetic field","Ocean"],0,"The Sun emits ultraviolet radiation along with visible and infrared radiation."],["Excessive exposure to UV radiation can damage:",["Skin and eyes","Only bones","Only muscles","Only teeth"],0,"Excess UV exposure can damage skin and eyes and can increase the risk of skin cancer."],["Which atmospheric layer absorbs much of the Sun's harmful UV-B and UV-C radiation?",["Ozone layer","Tropospheric dust layer","Ionospheric radio layer only","Cloud layer only"],0,"Stratospheric ozone absorbs much of the Sun's UV-B and most UV-C radiation."],["UV radiation is useful for sterilization because it can:",["Damage microbial DNA and prevent reproduction","Increase microbial growth","Create sound waves","Remove gravity"],0,"UV-C can damage nucleic acids in microorganisms and is used for disinfection."],["Which type of UV is commonly associated with tanning and contributes strongly to skin aging?",["UVA","UVB only","UVC","Gamma radiation"],0,"UVA penetrates deeper into skin and contributes to tanning and photoaging."],["Which type of UV is especially associated with sunburn?",["UVB","UVA only","UVC from sunlight at ground level","Radio waves"],0,"UVB is a major cause of sunburn and contributes to skin damage."],["UV radiation can cause fluorescence because some materials:",["Absorb UV and re-emit part of the energy as visible light","Turn UV into sound only","Reflect all UV without absorption","Stop emitting light"],0,"Fluorescent materials absorb higher-energy radiation and re-emit lower-energy visible light."],["The relation between frequency f and wavelength λ of electromagnetic radiation in vacuum is:",["c=fλ","c=f/λ","c=λ/f","c=f+λ"],0,"For electromagnetic waves in vacuum, c=fλ."],["If the frequency of UV radiation increases in vacuum, its wavelength:",["Decreases","Increases","Remains constant","Becomes infinite"],0,"At constant c, wavelength is inversely proportional to frequency."],["Which is a practical application of ultraviolet radiation?",["Forensic detection and sterilization","AM radio broadcasting","Microwave cooking","MRI imaging"],0,"UV is used in sterilization, fluorescence-based detection and some forensic applications."],["Which statement about ultraviolet radiation is correct?",["It is electromagnetic radiation and can travel through vacuum","It requires air to propagate","It is a mechanical longitudinal wave","It always has less energy than visible light"],0,"UV is electromagnetic radiation, can travel through vacuum, and has higher photon energy than visible light because its frequency is higher."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
