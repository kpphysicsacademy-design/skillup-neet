<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uniform Circular Motion | SkillUp NEET</title><style>:root{font-family:system-ui,sans-serif;color:#19324c;background:#f3f8fc}*{box-sizing:border-box}body{margin:0}main{max-width:1040px;margin:auto;padding:16px}h1{font-size:clamp(1.5rem,4vw,2.2rem)}h2{font-size:1.2rem}.card{background:white;border:1px solid #dbe7f0;border-radius:16px;padding:18px;margin:12px 0;min-width:0}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tabs a{text-align:center;background:white;border:1px solid #cbdde9;border-radius:12px;padding:14px 4px;color:#174d73;text-decoration:none;font-weight:800;min-height:48px}.tabs a[aria-current=page]{background:#e4f6ff;border-color:#1cb0f6}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.two>.card{margin:0}.option,.btn{min-height:44px;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer}.option{display:block;width:100%;background:white;border:2px solid #dce6ef;text-align:left;margin:8px 0;color:#19324c}.option:disabled{cursor:default}.btn{background:#58cc02;color:white;border:0}.option:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid #1cb0f6;outline-offset:2px}.muted{color:#526a7d}table{width:100%;border-collapse:collapse}td{padding:9px 4px;border-bottom:1px solid #dbe7f0}input{width:100%;accent-color:#1cb0f6}label{display:block;font-weight:700;margin-top:12px}svg{max-width:100%;height:auto}@media(max-width:640px){.two{grid-template-columns:minmax(0,1fr)}main{padding:10px}.card{padding:14px}}</style></head><body><main><h1>🌀 Uniform Circular Motion</h1><p class="muted">Supplementary NEET physics lesson • No curriculum locks</p><nav class="tabs" aria-label="Uniform Circular Motion pages"><a href="physics-uniform-circular-motion-learn.html" >📘 Learn</a><a href="physics-uniform-circular-motion-simulator.html" >🎮 Simulator</a><a href="physics-uniform-circular-motion-practice.html" aria-current="page">🧠 Practice</a></nav><section class="card"><h2>🧠 Practice • 30 unlocked questions</h2><p class="muted">Choose an answer, check the explanation, build your streak and retry. No hearts or locks.</p><p><strong id="progress">Question 1 of 30</strong> · <strong id="xp">0 XP</strong> · <strong id="streak">0 streak</strong></p><div id="quiz"><h3 id="question"></h3><div id="options"></div><p id="feedback" role="status" aria-live="polite"></p><button id="check" type="button" class="btn" disabled>Check answer</button> <button id="next" type="button" class="btn" hidden>Continue</button></div><div id="results" aria-live="polite"></div></section><script>(function(){'use strict';const questions=[["Constant speed in a circle means the velocity is:","Constant in direction","Changing in direction","Zero at all times","Always inward",1,"Velocity is tangent to the path and changes direction continuously."],["The inward acceleration of a particle moving in a circle is:","v/r","vr","v²/r","r/v²",2,"Centripetal acceleration is v²/r."],["For v = 4 m/s and r = 2 m, centripetal acceleration is:","8 m/s²","2 m/s²","4 m/s²","16 m/s²",0,"a = 4²/2 = 8 m/s²."],["For m = 2 kg, v = 4 m/s and r = 2 m, inward force is:","8 N","16 N","32 N","4 N",1,"F = mv²/r = 2×16/2 = 16 N."],["The instantaneous velocity vector in uniform circular motion is:","Radially inward","Radially outward","Tangential","Zero",2,"Velocity is tangent to the circular path."],["The acceleration vector in uniform circular motion is:","Radially inward","Tangential","Radially outward","Zero",0,"Centripetal acceleration always points toward the centre."],["If speed doubles at fixed radius, acceleration becomes:","Twice","Half","Four times","Eight times",2,"Because a is proportional to v², doubling v multiplies a by four."],["If radius doubles at fixed speed, acceleration becomes:","Double","Half","Four times","Unchanged",1,"a = v²/r, so doubling r halves acceleration."],["One complete revolution corresponds to angular displacement:","π/2 rad","π rad","4π rad","2π rad",3,"A full turn is 2π radians."],["A body completes a revolution every 4 s. Its frequency is:","4 Hz","0.25 Hz","2 Hz","8 Hz",1,"Frequency f = 1/T = 1/4 = 0.25 Hz."],["The angular speed for period 2 s is:","π rad/s","2π rad/s","4π rad/s","0.5 rad/s",0,"ω = 2π/T = π rad/s."],["Linear speed and angular speed are related by:","v = ω/r","v = r/ω","v = ωr","v = ω²r",2,"Tangential speed v = ωr."],["Centripetal acceleration using angular speed is:","ω/r","ω²r","ωr²","r/ω²",1,"Substitute v = ωr into v²/r to obtain ω²r."],["The net work done by the centripetal force in uniform circular motion is:","Positive","Negative","Increasing","Zero",3,"Inward force is perpendicular to instantaneous tangential displacement."],["After one full revolution, displacement is:","Zero","2πr","πr","r",0,"The particle returns to its initial position."],["Distance traveled in one full revolution is:","Zero","r","2πr","πr²",2,"The path length of one circle is its circumference, 2πr."],["Average velocity over one full revolution is:","v","Zero","2v","ωr²",1,"Average velocity is net displacement divided by elapsed time; displacement is zero."],["Average speed over one revolution is:","2πr/T","Zero","r/T","πr²/T",0,"Average speed equals circumference divided by period."],["In uniform circular motion, the magnitude of velocity:","Increases","Decreases","Stays constant","Must be zero",2,"Speed stays constant while velocity direction changes."],["The source of centripetal force for a stone tied to a string is:","Gravity only","String tension","Air pressure only","No force",1,"Tension can provide the required net inward force."],["A car turning on a flat road can receive inward force from:","Static friction","Weight only","Normal force only","Air drag only",0,"Static friction can provide the lateral centripetal force."],["For an ideal satellite in a circular orbit, inward force is mainly:","Tension","Normal force","Gravity","Static friction",2,"Gravitational attraction provides the centripetal force."],["A body moving at constant angular speed has angular acceleration:","ω","ω²","rω","Zero",3,"Angular speed is constant, so its rate of change is zero."],["Centripetal acceleration has SI unit:","m/s²","m/s","rad","N",0,"Acceleration has units of metres per second squared."],["The SI unit of angular speed is:","m/s","rad/s","m/s²","N",1,"Angular speed is measured in radians per second."],["At fixed ω, doubling radius makes centripetal acceleration:","Half","Unchanged","Double","Four times",2,"a = ω²r, so at fixed ω acceleration scales linearly with r."],["At fixed ω, doubling radius makes linear speed:","Double","Half","Unchanged","Four times",0,"v = ωr, so doubling r doubles speed."],["For v = 0, centripetal acceleration is:","Infinite","v/r","r","Zero",3,"a = v²/r = 0 at rest for positive radius."],["The direction of velocity is perpendicular to acceleration in:","Straight-line speeding up","Uniform circular motion","Straight-line braking","Free fall",1,"Tangential velocity and inward acceleration are perpendicular."],["Centripetal force is best described as:","An additional universal force","Always gravity","The net inward component of real forces","Always friction",2,"Centripetal force names the resultant inward force needed for circular motion."]];const $=id=>document.getElementById(id);let i=0,score=0,streak=0,selected=-1,locked=false,wrong=[];function draw(){selected=-1;locked=false;$('progress').textContent='Question '+(i+1)+' of '+questions.length;$('question').textContent=questions[i][0];$('feedback').textContent='';$('check').disabled=true;$('check').hidden=false;$('next').hidden=true;$('options').replaceChildren();questions[i].slice(1,5).forEach((label,j)=>{const b=document.createElement('button');b.type='button';b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+label;b.addEventListener('click',()=>{if(locked)return;selected=j;$('check').disabled=false;[...$('options').children].forEach((el,k)=>{el.style.borderColor=k===j?'#1cb0f6':'#dce6ef';});});$('options').appendChild(b);});}function finish(){const box=$('results');$('quiz').hidden=true;let best=score;try{const key='skillup-uniform-circular-motion-practice-best';best=Math.max(score,Number(localStorage.getItem(key))||0);localStorage.setItem(key,String(best));}catch(e){}const title=document.createElement('h2');title.textContent='🏆 Complete: '+score+'/'+questions.length+' • Best '+best+'/'+questions.length;box.appendChild(title);if(wrong.length){const heading=document.createElement('h3');heading.textContent='Review mistakes';box.appendChild(heading);wrong.forEach(w=>{const p=document.createElement('p');p.textContent=w;box.appendChild(p);});}const retry=document.createElement('button');retry.type='button';retry.className='btn';retry.textContent='Practice again';retry.addEventListener('click',()=>{i=0;score=0;streak=0;wrong=[];$('xp').textContent='0 XP';$('streak').textContent='0 streak';box.replaceChildren();$('quiz').hidden=false;draw();});box.appendChild(retry);$('progress').textContent='Practice complete';}$('check').addEventListener('click',()=>{if(locked||selected<0)return;locked=true;const q=questions[i],correct=q[5]===selected;if(correct){score++;streak++;}else{streak=0;wrong.push(q[0]+' — Your answer: '+q[selected+1]+'. Correct: '+q[q[5]+1]+'. '+q[6]);}$('xp').textContent=(score*10)+' XP';$('streak').textContent=streak+' streak';[...$('options').children].forEach((el,j)=>{el.disabled=true;if(j===q[5]){el.style.borderColor='#58cc02';el.style.background='#efffe7';}});$('feedback').textContent=(correct?'Correct! ':'Not quite. ')+q[6];$('check').hidden=true;$('next').hidden=false;$('next').textContent=i===questions.length-1?'See results':'Continue';});$('next').addEventListener('click',()=>{if(!locked)return;i++;if(i===questions.length)finish();else draw();});draw();})();</script></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="central-config.js"></script><script src="central-auth.js"></script><script>(async function(){if(window.SkillUpAuth){await window.SkillUpAuth.requireAuth(location.href);}})();</script><script src="/skillup-eye-shield.js?v=20261013-eye-shield-v1"></script><script src="/shared-nav.js?v=20261013-no-bottom-nav-v1"></script></body></html>
