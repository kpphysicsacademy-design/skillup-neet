<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uniform Circular Motion | SkillUp NEET</title><style>:root{font-family:system-ui,sans-serif;color:#19324c;background:#f3f8fc}*{box-sizing:border-box}body{margin:0}main{max-width:1040px;margin:auto;padding:16px}h1{font-size:clamp(1.5rem,4vw,2.2rem)}h2{font-size:1.2rem}.card{background:white;border:1px solid #dbe7f0;border-radius:16px;padding:18px;margin:12px 0;min-width:0}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tabs a{text-align:center;background:white;border:1px solid #cbdde9;border-radius:12px;padding:14px 4px;color:#174d73;text-decoration:none;font-weight:800;min-height:48px}.tabs a[aria-current=page]{background:#e4f6ff;border-color:#1cb0f6}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.two>.card{margin:0}.option,.btn{min-height:44px;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer}.option{display:block;width:100%;background:white;border:2px solid #dce6ef;text-align:left;margin:8px 0;color:#19324c}.option:disabled{cursor:default}.btn{background:#58cc02;color:white;border:0}.option:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid #1cb0f6;outline-offset:2px}.muted{color:#526a7d}table{width:100%;border-collapse:collapse}td{padding:9px 4px;border-bottom:1px solid #dbe7f0}input{width:100%;accent-color:#1cb0f6}label{display:block;font-weight:700;margin-top:12px}svg{max-width:100%;height:auto}@media(max-width:640px){.two{grid-template-columns:minmax(0,1fr)}main{padding:10px}.card{padding:14px}}</style></head><body><main><h1>🌀 Uniform Circular Motion</h1><p class="muted">Supplementary NEET physics lesson • No curriculum locks</p><nav class="tabs" aria-label="Uniform Circular Motion pages"><a href="physics-uniform-circular-motion-learn.html" >📘 Learn</a><a href="physics-uniform-circular-motion-simulator.html" aria-current="page">🎮 Simulator</a><a href="physics-uniform-circular-motion-practice.html" >🧠 Practice</a></nav><section class="two"><article class="card"><h2>🎮 Interactive orbit</h2><label for="speed">Speed: <output id="speedVal">6 m/s</output></label><input id="speed" type="range" min="0" max="20" step="0.5" value="6"><label for="radius">Radius: <output id="radiusVal">3 m</output></label><input id="radius" type="range" min="1" max="10" step="0.5" value="3"><label for="mass">Mass: <output id="massVal">2 kg</output></label><input id="mass" type="range" min="0.5" max="5" step="0.5" value="2"><p><button class="btn" type="button" id="play">▶ Start orbit</button> <button class="btn" type="button" id="reset">Reset</button></p><p id="status" role="status" aria-live="polite">Ready</p></article><article class="card"><h2>Orbit & vectors</h2><svg viewBox="0 0 420 330" role="img" aria-label="Circular path with moving particle, tangential velocity and inward acceleration arrows"><circle cx="210" cy="160" r="112" fill="none" stroke="#cbdde9" stroke-width="3" stroke-dasharray="7 5"/><circle cx="210" cy="160" r="4" fill="#19324c"/><line id="velocityArrow" stroke="#1cb0f6" stroke-width="5" stroke-linecap="round"/><line id="accelArrow" stroke="#ff8b36" stroke-width="5" stroke-linecap="round"/><circle id="ball" cx="322" cy="160" r="11" fill="#58cc02"/><text x="12" y="310" font-size="14" fill="#19324c">Blue: tangential velocity • Orange: inward acceleration</text></svg><p>Angular speed: <strong id="omega">2.00 rad/s</strong></p><p>Period: <strong id="period">3.14 s</strong></p><p>Centripetal acceleration: <strong id="accel">12.00 m/s²</strong></p><p>Required net inward force: <strong id="force">24.00 N</strong></p></article></section><script>(function(){'use strict';const $=id=>document.getElementById(id),speed=$('speed'),radius=$('radius'),mass=$('mass');let playing=false,raf=0,last=null,phase=0;function render(){const v=Number(speed.value),r=Number(radius.value),m=Number(mass.value);if(![v,r,m].every(Number.isFinite)||r<=0||m<=0||v<0){$('status').textContent='Invalid speed, radius or mass.';return;}$('speedVal').textContent=v+' m/s';$('radiusVal').textContent=r+' m';$('massVal').textContent=m+' kg';const w=v/r,acc=v*v/r;$('omega').textContent=w.toFixed(2)+' rad/s';$('period').textContent=v===0?'Not defined at rest':(2*Math.PI/w).toFixed(2)+' s';$('accel').textContent=acc.toFixed(2)+' m/s²';$('force').textContent=(m*acc).toFixed(2)+' N';const x=210+112*Math.cos(phase),y=160-112*Math.sin(phase),vx=-Math.sin(phase),vy=-Math.cos(phase),ax=-Math.cos(phase),ay=Math.sin(phase);$('ball').setAttribute('cx',x);$('ball').setAttribute('cy',y);for(const [id,dx,dy] of [['velocityArrow',vx,vy],['accelArrow',ax,ay]]){const el=$(id);el.setAttribute('x1',x);el.setAttribute('y1',y);el.setAttribute('x2',x+dx*46);el.setAttribute('y2',y+dy*46);el.setAttribute('visibility',v===0?'hidden':'visible');}return w;}function tick(ts){if(!playing)return;if(last!==null)phase+=(ts-last)/1000*Number(speed.value)/Number(radius.value);last=ts;render();raf=requestAnimationFrame(tick);}function pause(){playing=false;if(raf)cancelAnimationFrame(raf);raf=0;last=null;$('play').textContent='▶ Resume orbit';$('status').textContent='Paused';}for(const el of [speed,radius,mass])el.addEventListener('input',()=>{render();$('status').textContent='Parameters updated';});$('play').addEventListener('click',()=>{if(playing){pause();return;}playing=true;last=null;$('play').textContent='Ⅱ Pause';$('status').textContent='Orbit running';raf=requestAnimationFrame(tick);});$('reset').addEventListener('click',()=>{pause();speed.value=6;radius.value=3;mass.value=2;phase=0;render();$('play').textContent='▶ Start orbit';$('status').textContent='Reset';});render();})();</script></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="central-config.js"></script><script src="central-auth.js"></script><script>(async function(){if(window.SkillUpAuth){await window.SkillUpAuth.requireAuth(location.href);}})();</script><script src="/skillup-eye-shield.js?v=20261013-eye-shield-v1"></script><script src="/shared-nav.js?v=20261013-no-bottom-nav-v1"></script></body></html>
