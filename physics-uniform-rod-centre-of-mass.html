<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Uniform Rod Centre of Mass</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-size:1.6rem;font-weight:900}.subtitle{color:#5f6b7a;margin:0 0 18px}.xp,.card{background:#fff;border-radius:20px;box-shadow:0 6px 20px #17203312}.xp{padding:10px 15px;font-weight:850}.card{padding:20px;margin:12px 0}.ph{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:11px;background:#dfe8f1;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.25s}.qnum{font-weight:800;color:#35516f;margin-bottom:11px}.question{font-size:1.27rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.12s}.option:hover{border-color:#58cc02;background:#f7fff1;transform:translateY(-1px)}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;background:#2db84d;color:#fff;font-weight:850;cursor:pointer;box-shadow:0 4px 0 #21863a;transition:.12s}.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #21863a}.feedback{margin-top:14px;padding:12px;border-radius:13px;font-weight:700;min-height:18px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:10px;padding:10px 13px;border:2px solid #d9d4f5 he CM remains at the midpoint, so its distance from the end doubles when L doubles.'],['A uniform rod has mass M and length L. Its centre of mass measured from one end is:', ['L/2','L','M/L','M/2'],0,'The CM of a uniform rod is at its midpoint.'],['If a uniform rod is rotated about its centre, the location of its centre of mass relative to the rod:', ['remains at the midpoint','moves to an end','moves outside the rod','becomes undefined'],0,'Rotation does not change the CM relative to a symmetric uniform rod.'],['A uniform rod lies along the x-axis from -L/2 to +L/2. Its centre of mass is:', ['x = 0','x = L/2','x = -L/2','x = L'],0,'Symmetry about the origin places the CM at x = 0.'],['A uniform rod is cut exactly at its midpoint into two equal rods. The centre of mass of each piece is:', ['at the midpoint of that piece','at the original rod centre for both pieces','at an end of the original rod','outside each piece'],0,'Each uniform piece has its own midpoint as its centre of mass.'],['A rod has non-uniform density increasing toward its right end. Its centre of mass lies:', ['closer to the right end','exactly at the geometric centre','closer to the left end','necessarily outside the rod'],0,'More mass toward the right shifts the CM toward the right.'],['A uniform rod of length 1 m has mass 2 kg. Its centre of mass measured from the left end is:', ['0.5 m','1 m','0.25 m','2 m'],0,'The CM is at L/2 = 0.5 m.'],['For a uniform rod, equal small elements at equal distances on opposite sides of the centre:', ['have cancelling position contributions','both shift the CM right','both shift the CM left','have no mass'],0,'Symmetric equal masses have equal and opposite position contributions.'],['If a uniform rod is suspended freely from its centre of mass, it can remain:', ['in equilibrium','only accelerating','only rotating continuously','without any gravitational force'],0,'The line of action of weight passes through the support, giving no torque about the CM.'],['A uniform rod is translated without rotation. Its centre of mass:', ['translates by the same displacement','remains fixed in space','moves twice the displacement','moves opposite to the displacement'],0,'Every point and therefore the CM undergoes the same translation.'],['For a uniform rod in a uniform gravitational field, the resultant gravitational force acts effectively through:', ['the centre of mass','either end only','the point of maximum length','a point outside the rod'],0,'For a uniform gravitational field, the total weight acts through the centre of mass.']];let i=0,selected=-1,checked=false,score=0;const $=id=>document.getElementById(id),o=$("options"),b=$("continue"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;$("count").textContent='Question '+(i+1)+' of 15';$("question").textContent=a[0];o.innerHTML='';f.className='feedback';f.textContent='';b.style.display='inline-block';b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const el=document.createElement('button');el.className='option';el.textContent=String.fromCharCode(65+j)+'. '+item.text;el.dataset.index=item.index;el.onclick=()=>{selected=item.index;[...o.children].forEach(z=>z.classList.remove('selected'));el.classList.add('selected')};o.appendChild(el)})}b.onclick=()=>{if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(el=>{const n=Number(el.dataset.index);el.disabled=true;if(n===a[2])el.classList.add('correct');if(n===selected&&!ok)el.classList.add('wrong')});if(ok)score++;f.className=ok?'feedback good':'feedback bad';f.textContent=(ok?'🎯 Correct! +10 XP — ':'✗ Review — Correct answer: '+a[1][a[2]]+'. ')+a[3];$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$("question").textContent='🏆 Uniform Rod Centre of Mass Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
