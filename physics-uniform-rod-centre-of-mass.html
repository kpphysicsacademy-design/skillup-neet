<style>

.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border-radius:99px;background:#eef8ff;color:#23618a;padding:6px 10px;font-size:11px;font-weight:850}

.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>📏 Uniform Rod Centre of Mass</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
  {
    "q": "The centre of mass of a uniform thin rod of length L lies:",
    "o": [
      "At one end",
      "At L/3 from either end",
      "Outside the rod",
      "At its midpoint, L/2 from either end"
    ],
    "a": 3,
    "e": "A uniform rod has symmetric mass distribution, so its centre of mass is at the midpoint."
  },
  {
    "q": "A uniform rod is 2 m long. Its centre of mass is how far from one end?",
    "o": [
      "1 m",
      "0.5 m",
      "1.5 m",
      "2 m"
    ],
    "a": 0,
    "e": "Distance from an end is L/2 = 2/2 = 1 m."
  },
  {
    "q": "A uniform rod has length 80 cm. Its centre of mass is:",
    "o": [
      "At an end",
      "40 cm from either end",
      "20 cm from either end",
      "60 cm from either end"
    ],
    "a": 1,
    "e": "For a uniform rod, the centre is at half its length: 80/2 = 40 cm."
  },
  {
    "q": "The midpoint is the centre of mass of a rod when its linear mass density is:",
    "o": [
      "Greatest at one end",
      "Different at every point",
      "Uniform",
      "Zero at the centre"
    ],
    "a": 2,
    "e": "Uniform linear density gives a symmetric mass distribution."
  },
  {
    "q": "A uniform rod of mass M and length L lies along the x-axis from x = 0 to x = L. Its centre of mass coordinate is:",
    "o": [
      "L/3",
      "2L/3",
      "L",
      "L/2"
    ],
    "a": 3,
    "e": "The mass distribution is uniform, so xCM = L/2."
  },
  {
    "q": "A uniform 6 m rod extends from x = −3 m to x = +3 m. Its centre of mass is at:",
    "o": [
      "0 m",
      "+3 m",
      "−3 m",
      "+1.5 m"
    ],
    "a": 0,
    "e": "The rod is symmetric about the origin, so its centre of mass is at x = 0."
  },
  {
    "q": "A uniform rod of length 1.2 m has its centre of mass:",
    "o": [
      "1.2 m from either end",
      "0.6 m from either end",
      "0.3 m from either end",
      "0.9 m from either end"
    ],
    "a": 1,
    "e": "Half of 1.2 m is 0.6 m."
  },
  {
    "q": "For a uniform rod, the centre of mass is also its:",
    "o": [
      "Point of zero mass",
      "Point where gravity vanishes",
      "Geometric centre",
      "Topmost point in all orientations"
    ],
    "a": 2,
    "e": "A uniform straight rod has its centre of mass at its geometric midpoint."
  },
  {
    "q": "A uniform 10 kg rod has length 4 m. Its centre of mass is located:",
    "o": [
      "1 m from either end",
      "3 m from either end",
      "4 m from one end",
      "2 m from either end"
    ],
    "a": 3,
    "e": "Mass does not change the midpoint location for a uniform rod; L/2 = 2 m."
  },
  {
    "q": "If a uniform rod is rotated without changing its shape or mass distribution, its centre of mass:",
    "o": [
      "Rotates with the rod, staying at its midpoint",
      "Moves to one end",
      "Always stays at the original point in space",
      "Disappears"
    ],
    "a": 0,
    "e": "The centre of mass is fixed relative to the rod at its midpoint, though its spatial position changes as the rod rotates."
  },
  {
    "q": "A uniform rod lies from x = 2 m to x = 8 m. Its centre of mass is at:",
    "o": [
      "8 m",
      "5 m",
      "3 m",
      "6 m"
    ],
    "a": 1,
    "e": "The midpoint is (2 + 8)/2 = 5 m."
  },
  {
    "q": "A uniform rod lies from x = −4 m to x = +2 m. Its centre of mass coordinate is:",
    "o": [
      "−2 m",
      "0 m",
      "−1 m",
      "+1 m"
    ],
    "a": 2,
    "e": "The midpoint is (−4 + 2)/2 = −1 m."
  },
  {
    "q": "A uniform rod of length 90 cm is balanced at its centre of mass. The balance point is:",
    "o": [
      "30 cm from either end",
      "60 cm from one end",
      "At one end",
      "45 cm from either end"
    ],
    "a": 3,
    "e": "The rod balances at its midpoint, 90/2 = 45 cm from each end."
  },
  {
    "q": "For a uniform rod, the centre of mass lies closer to which end?",
    "o": [
      "Neither; it is equally distant from both ends",
      "The left end always",
      "The right end always",
      "The end held by a person"
    ],
    "a": 0,
    "e": "Equal mass distribution makes the centre of mass equidistant from both ends."
  },
  {
    "q": "A uniform rod has length L and mass M. If its mass is doubled but its length and uniformity remain the same, its centre of mass:",
    "o": [
      "Moves to an end",
      "Stays at L/2",
      "Moves to L/4",
      "Moves to 3L/4"
    ],
    "a": 1,
    "e": "Scaling the mass uniformly does not change the centre-of-mass position."
  },
  {
    "q": "A uniform rod of length 3 m starts at x = 1 m and extends in the positive x direction. Its centre of mass is at:",
    "o": [
      "2 m",
      "3 m",
      "2.5 m",
      "1.5 m"
    ],
    "a": 2,
    "e": "Its far end is x = 4 m, so the midpoint is (1+4)/2 = 2.5 m."
  },
  {
    "q": "A uniform rod from x = −2 m to x = +6 m has centre of mass at:",
    "o": [
      "4 m",
      "0 m",
      "3 m",
      "2 m"
    ],
    "a": 3,
    "e": "The midpoint is (−2 + 6)/2 = 2 m."
  },
  {
    "q": "A uniform rod of length 50 cm is divided into two equal halves. The centre of mass of the whole rod is:",
    "o": [
      "At the boundary between the halves",
      "At the first quarter point",
      "At one end",
      "At 10 cm from one end"
    ],
    "a": 0,
    "e": "The boundary between equal halves is the rod's midpoint."
  },
  {
    "q": "The centre of mass of a uniform rod is found using:",
    "o": [
      "The rod's colour",
      "The mass-weighted average of its elements",
      "Only its total length squared",
      "Only its endpoint velocity"
    ],
    "a": 1,
    "e": "For a continuous body, the centre of mass is found by integrating position weighted by mass."
  },
  {
    "q": "For a uniform rod along the x-axis from 0 to L, its centre-of-mass integral is based on:",
    "o": [
      "xCM = ∫ dm / x",
      "xCM = L × M",
      "xCM = (1/M) ∫ x dm",
      "xCM = M ∫ x dm"
    ],
    "a": 2,
    "e": "The continuous-body formula is xCM = (1/M)∫x dm."
  },
  {
    "q": "For a uniform rod, the small mass element dm is proportional to:",
    "o": [
      "Its position x squared",
      "Its velocity",
      "The total length only",
      "Its small length element dx"
    ],
    "a": 3,
    "e": "Uniform linear density λ gives dm = λ dx."
  },
  {
    "q": "If a uniform rod's length is increased while keeping it uniform, the centre of mass remains:",
    "o": [
      "At the midpoint of the new length",
      "At the old midpoint distance from one end",
      "At one-third of the new length",
      "At the same fixed point in space always"
    ],
    "a": 0,
    "e": "For every uniform rod, the centre of mass lies halfway along its current length."
  },
  {
    "q": "A uniform 1.6 m rod lies along a table. The centre of mass is:",
    "o": [
      "1.6 m from either end",
      "0.8 m from either end",
      "0.4 m from either end",
      "1.2 m from either end"
    ],
    "a": 1,
    "e": "L/2 = 1.6/2 = 0.8 m."
  },
  {
    "q": "A uniform rod is suspended horizontally from its centre of mass. In an ideal setup, the rod's weight acts:",
    "o": [
      "Only at the right end",
      "At a point outside the rod",
      "Through the suspension point",
      "Only at the left end"
    ],
    "a": 2,
    "e": "The resultant gravitational force on a uniform rod acts through its centre of mass."
  },
  {
    "q": "A uniform rod of length 8 m has centre of mass at x = 0 m. If centred on the origin, its endpoints are:",
    "o": [
      "x = 0 m and x = 8 m",
      "x = −8 m and x = 0 m",
      "x = −2 m and x = +6 m",
      "x = −4 m and x = +4 m"
    ],
    "a": 3,
    "e": "A centred 8 m rod extends 4 m on either side of the origin."
  },
  {
    "q": "A uniform rod from x = 5 m to x = 11 m has centre of mass at:",
    "o": [
      "8 m",
      "6 m",
      "5 m",
      "11 m"
    ],
    "a": 0,
    "e": "Midpoint = (5+11)/2 = 8 m."
  },
  {
    "q": "Which change would shift the centre of mass away from the midpoint of a rod?",
    "o": [
      "Doubling the mass uniformly",
      "Making the mass distribution non-uniform",
      "Rotating the uniform rod",
      "Changing the units from metres to centimetres"
    ],
    "a": 1,
    "e": "Uneven mass distribution generally shifts the centre of mass away from the geometric midpoint."
  },
  {
    "q": "A uniform rod has centre of mass at 25 cm from one end. Its length is:",
    "o": [
      "75 cm",
      "100 cm",
      "50 cm",
      "25 cm"
    ],
    "a": 2,
    "e": "For a uniform rod, the centre is at L/2; thus L = 2×25 = 50 cm."
  },
  {
    "q": "A uniform rod of length 12 m is cut into two equal pieces. The centre of mass of each piece is located:",
    "o": [
      "At the original rod's centre for both pieces",
      "At one end of each piece",
      "Outside each piece",
      "At the midpoint of that piece"
    ],
    "a": 3,
    "e": "Each uniform piece has its own centre of mass at its midpoint."
  },
  {
    "q": "Which statement is true for a uniform straight rod?",
    "o": [
      "Its centre of mass is at the midpoint regardless of its orientation",
      "Its centre of mass is always at the lowest end",
      "Its centre of mass changes relative to the rod when rotated",
      "Its centre of mass is outside the rod"
    ],
    "a": 0,
    "e": "Uniform linear density and straight geometry place the centre of mass at the midpoint."
  }
];
let index=0,score=0,streak=0,chosen=null,locked=false;
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Nice work!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><button class="btn" id="retry">Practice again</button>';
 $('finishSlot').replaceChildren(card);$('retry').addEventListener('click',()=>{index=0;score=0;streak=0;$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
