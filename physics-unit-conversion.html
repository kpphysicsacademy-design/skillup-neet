<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Unit Conversion</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🔄 Unit Conversion</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['1 km is equal to:','10 m','100 m','1000 m','10,000 m',2,'1 kilometre = 1000 metres.'],
['1 m is equal to:','10 cm','100 cm','1000 cm','0.1 cm',1,'1 metre = 100 centimetres.'],
['1 cm is equal to:','10 mm','100 mm','0.1 mm','1000 mm',0,'1 centimetre = 10 millimetres.'],
['1 hour is equal to:','60 s','600 s','3600 s','36,000 s',2,'1 hour = 60 minutes = 3600 seconds.'],
['1 g is equal to:','0.001 kg','0.01 kg','0.1 kg','10 kg',0,'1 gram = 0.001 kilogram.'],
['1 kg is equal to:','10 g','100 g','1000 g','10,000 g',2,'1 kilogram = 1000 grams.'],
['1 newton is equal to:','10^3 dynes','10^4 dynes','10^5 dynes','10^6 dynes',2,'1 newton = 10^5 dynes.'],
['1 joule is equal to:','10^5 ergs','10^6 ergs','10^7 ergs','10^8 ergs',2,'1 joule = 10^7 ergs.'],
['72 km/h expressed in m/s is:','10 m/s','20 m/s','36 m/s','72 m/s',1,'To convert km/h to m/s, multiply by 5/18: 72 × 5/18 = 20 m/s.'],
['10 m/s expressed in km/h is:','18 km/h','36 km/h','54 km/h','72 km/h',1,'To convert m/s to km/h, multiply by 18/5: 10 × 18/5 = 36 km/h.'],
['1 litre is equal to:','10^-1 m³','10^-2 m³','10^-3 m³','10^-4 m³',2,'1 litre = 10^-3 cubic metre.'],
['1 cm³ is equal to:','10^-3 m³','10^-4 m³','10^-5 m³','10^-6 m³',3,'Since 1 cm = 10^-2 m, 1 cm³ = (10^-2)^3 m³ = 10^-6 m³.'],
['1 atmosphere is approximately:','1.013 × 10^3 Pa','1.013 × 10^4 Pa','1.013 × 10^5 Pa','1.013 × 10^6 Pa',2,'Standard atmospheric pressure is approximately 1.013 × 10^5 pascals.'],
['To convert a length from cm to m, the numerical value is multiplied by:','100','10','0.1','0.01',3,'Since 1 cm = 0.01 m, multiply the numerical value in centimetres by 0.01.'],
['A quantity is 5000 mm. Its value in metres is:','0.5 m','5 m','50 m','500 m',1,'Since 1000 mm = 1 m, 5000 mm = 5 m.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
