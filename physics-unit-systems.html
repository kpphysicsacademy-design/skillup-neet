<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Unit Systems</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>📐 Unit Systems</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[
['The system of units universally adopted in science is','CGS','FPS','SI','MKS',2,'The SI system is the internationally accepted system of units used in science.'],
['In the CGS system, the unit of length is','metre','centimetre','foot','inch',1,'CGS stands for centimetre-gram-second, so its unit of length is centimetre.'],
['In the CGS system, the unit of mass is','gram','kilogram','pound','tonne',0,'The gram is the unit of mass in the CGS system.'],
['In the CGS system, the unit of time is','second','minute','hour','day',0,'The second is the time unit in the CGS system.'],
['The FPS system uses which fundamental units for length, mass and time?','metre, kilogram, second','centimetre, gram, second','foot, pound, second','foot, kilogram, minute',2,'FPS uses foot for length, pound for mass and second for time.'],
['The MKS system is based on','metre, kilogram, second','metre, gram, second','foot, pound, second','centimetre, kilogram, second',0,'MKS stands for metre-kilogram-second.'],
['Which is an advantage of the SI system?','It has different units in every country','It is internationally coherent and decimal-based','It uses only CGS units','It has no derived units',1,'SI provides an internationally consistent and decimal-based system of measurement.'],
['The SI system is based on how many base units?','5','6','7','8',2,'The SI system has seven base units: metre, kilogram, second, ampere, kelvin, mole and candela.'],
['Which pair belongs to the CGS system?','newton and joule','dyne and erg','pascal and watt','pound and foot',1,'Dyne is the CGS unit of force and erg is the CGS unit of energy.'],
['The CGS unit of force is','newton','dyne','joule','watt',1,'The dyne is the CGS unit of force.'],
['The CGS unit of energy is','erg','dyne','pascal','newton',0,'The erg is the CGS unit of energy.'],
['One newton is equal to how many dynes?','10³','10⁴','10⁵','10⁶',2,'1 newton = 10⁵ dynes.'],
['One joule is equal to how many ergs?','10⁵','10⁶','10⁷','10⁸',2,'1 joule = 10⁷ ergs.'],
['Which system uses foot, pound and second as basic units?','SI','MKS','CGS','FPS',3,'FPS stands for foot-pound-second.'],
['Why are multiple historical unit systems less convenient than SI?','They cannot measure physical quantities','Conversion between systems can be inconvenient','They have no units for time','They contain no derived units',1,'Using different systems can require conversions, whereas SI provides an internationally consistent framework.']
];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
