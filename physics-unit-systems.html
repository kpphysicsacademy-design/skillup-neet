<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp | Unit Systems</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;margin:0;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.xp{font-weight:800}.card{background:white;border-radius:22px;padding:24px;margin-top:18px;box-shadow:0 5px 20px #00000012}.bar{height:10px;background:#e8eaf0;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.3s}.q{font-size:1.3rem;font-weight:750;line-height:1.45}.opts{display:grid;gap:10px;margin-top:18px}.opts button{padding:15px;border:2px solid #e2e5eb;border-radius:14px;background:white;text-align:left;font-size:1rem;cursor:pointer;transition:.15s}.opts button:hover{border-color:#58cc02;transform:translateY(-1px)}.feedback{font-weight:700;margin-top:16px;min-height:24px}.next{margin-top:18px;padding:13px 22px;border:0;border-radius:14px;background:#58cc02;color:white;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #46a900;transition:.15s}.next:hover:not(:disabled){transform:translateY(-1px)}.next:active:not(:disabled){transform:translateY(1px);box-shadow:none}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:inline-flex;align-items:center;gap:8px;margin-top:20px;padding:12px 18px;border-radius:14px;background:white;border:2px solid #5146a5;color:#5146a5;text-decoration:none;font-weight:800;box-shadow:0 3px 0 #5146a533;transition:.15s}.back:hover{background:#5146a5;color:white;transform:translateY(-1px)}.back:active{transform:translateY(1px);box-shadow:none}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><h1>📐 Unit Systems</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></div>
<p>Master SI, CGS, FPS and other systems of units with 15 NEET-style questions.</p>
<div class="bar"><div id="fill" class="fill"></div></div>
<section class="card"><div id="count"></div><p id="question" class="q"></p><div id="options" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Continue →</button></section>
<a class="back" href="physics-home.html" aria-label="Back to Physics Path">← Back to Physics Path</a>
</main>
<script>
const qs=[
['The system of units universally adopted in science is:',['CGS','FPS','SI','MKS'],2],
['In the CGS system, the unit of length is:',['metre','centimetre','foot','inch'],1],
['In the CGS system, the unit of mass is:',['gram','kilogram','pound','tonne'],0],
['In the CGS system, the unit of time is:',['second','minute','hour','day'],0],
['The FPS system uses which fundamental units for length, mass and time?',['metre, kilogram, second','centimetre, gram, second','foot, pound, second','foot, kilogram, minute'],2],
['The MKS system is based on:',['metre, kilogram, second','metre, gram, second','foot, pound, second','centimetre, kilogram, second'],0],
['Which is an advantage of the SI system?',['It has different units in every country','It is internationally coherent and decimal-based','It uses only CGS units','It has no derived units'],1],
['The SI system is based on how many base units?',['5','6','7','8'],2],
['Which pair belongs to the CGS system?',['newton and joule','dyne and erg','pascal and watt','pound and foot'],1],
['The CGS unit of force is:',['newton','dyne','joule','watt'],1],
['The CGS unit of energy is:',['erg','dyne','pascal','newton'],0],
['One newton is equal to how many dynes?',['10³','10⁴','10⁵','10⁶'],2],
['One joule is equal to how many ergs?',['10⁵','10⁶','10⁷','10⁸'],2],
['Which system uses foot, pound and second as basic units?',['SI','MKS','CGS','FPS'],3],
['Why are multiple historical unit systems less convenient than SI?',['They cannot measure physical quantities','Conversion between systems can be inconvenient','They have no units for time','They contain no derived units'],1]
];
let i=0,xp=0,answered=false;
const $=id=>document.getElementById(id);
function render(){answered=false;$('count').textContent=`Question ${i+1} of ${qs.length}`;$('question').textContent=qs[i][0];$('options').innerHTML='';$('feedback').textContent='';$('next').disabled=true;qs[i][1].forEach((o,j)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>answer(j);$('options').appendChild(b)});$('fill').style.width=`${i/qs.length*100}%`}
function answer(j){if(answered)return;answered=true;const ok=j===qs[i][2];if(ok){xp+=10;$('xp').textContent=xp;$('feedback').textContent='✅ Correct! +10 XP'}else{$('feedback').textContent=`❌ Not quite. Correct answer: ${qs[i][1][qs[i][2]]}`}[...$('options').children].forEach((b,k)=>{b.disabled=true;if(k===qs[i][2])b.style.borderColor='#58cc02'});$('next').disabled=false}
$('next').onclick=()=>{if(i<qs.length-1){i++;render()}else{$('fill').style.width='100%';$('question').textContent=`🎉 Unit Systems mastered! You scored ${xp} XP out of ${qs.length*10} XP.`;$('options').innerHTML='';$('feedback').textContent='Excellent work — keep building your Physics path!';$('next').style.display='none'}};
render();
</script>
</body>
</html>
