<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1f1e5"><title>SkillUp Physics | Units of Measurement — Simulator</title><link rel="stylesheet" href="physics-duolingo-quiz.css?v=20261122-all-topics-v1"><style>body{margin:0;background:#f1f1e5;color:#27372e;font-family:system-ui,sans-serif}header{background:#fbfbf3;border-bottom:1px solid #dce1d4}.nav{width:min(100% - 24px,720px);min-height:68px;margin:auto;display:flex;align-items:center;gap:10px}.back{width:42px;height:42px;display:grid;place-items:center;border:2px solid #dce5d7;border-radius:14px;background:#f2f9ff;color:#174a78;text-decoration:none}.brand{font-weight:950}.brand small{display:block;font-size:9px;color:#68766a}main{width:min(100% - 24px,720px);margin:16px auto 40px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.tab{min-height:46px;display:grid;place-items:center;border:2px solid #dce8f3;border-radius:14px;background:#fff;color:#245273;text-decoration:none;font-size:13px;font-weight:900}.tab.active{background:#e8f8dc;border-color:#8ed65b;color:#286c12}.card{background:#fff;border:2px solid #e2e9df;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 5px 0 #dce8f3}.hero{background:#e9eddf}h1{color:#254b37}.muted{line-height:1.6;color:#5f6f61}.field{margin:17px 0}.field label{display:flex;justify-content:space-between;font-weight:850;margin-bottom:8px}.field input,.field select{width:100%;padding:12px;border:2px solid #d6ddce;border-radius:12px;background:#fbfbf3}.field input[type=range]{padding:0;accent-color:#58cc02}.result{margin:12px 0;padding:14px;border-radius:14px;background:#efffe7;border:1px solid #c8f0b2;text-align:center}.result b{display:block;font-size:20px;color:#286c12}.results{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:400px){.tab{font-size:11px}}</style></head><body><header><div class="nav"><a class="back" href="physics-home-fast.html">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div></div></header><main><nav class="tabs" aria-label="Units of Measurement pages"><a class="tab" href="physics-units-measurement-learn.html">📘 Learn</a><a class="tab active" href="physics-units-measurement-simulator.html" aria-current="page">🎮 Simulator</a><a class="tab" href="physics-units-measurement-quiz.html">🧠 Practice</a></nav><section class="card hero"><h1>📏 Units of Measurement Simulator</h1><p class="muted">Choose a physical quantity and convert a value between common measurement units.</p><div class="formula">Converted value = input × source factor ÷ target factor</div></section><section class="card"><div class="field"><label for="quantity">Quantity</label><select id="quantity"><option value="length">Length</option><option value="mass">Mass</option><option value="time">Time</option><option value="temperature">Temperature</option></select></div><div class="field"><label for="value">Value</label><input id="value" type="number" value="1" step="any"></div><div class="field"><label for="from">From unit</label><select id="from"></select></div><div class="field"><label for="to">To unit</label><select id="to"></select></div><div class="result">Converted value: <b id="converted">100</b></div></section></main><script>(function(){"use strict";const $=id=>document.getElementById(id);const data={length:{m:1,cm:.01,mm:.001,km:1000},mass:{kg:1,g:.001,mg:.000001},time:{s:1,min:60,h:3600},temperature:{K:1}};const labels={length:['m','cm','mm','km'],mass:['kg','g','mg'],time:['s','min','h'],temperature:['K']};function fill(){const q=$('quantity').value,units=labels[q];$('from').innerHTML=units.map(u=>'<option>'+u+'</option>').join('');$('to').innerHTML=units.map(u=>'<option>'+u+'</option>').join('');$('to').selectedIndex=Math.min(1,units.length-1);update();}function update(){const q=$('quantity').value,v=Number($('value').value)||0,from=$('from').value,to=$('to').value;$('converted').textContent=from&&to?(v*data[q][from]/data[q][to]).toPrecision(8):'—';}['quantity'].forEach(id=>$(id).addEventListener('change',fill));['value','from','to'].forEach(id=>$(id).addEventListener('input',update));fill();})();</script><script src="shared-nav.js?v=20261125-central-design-system-v2"></script></body></html>
