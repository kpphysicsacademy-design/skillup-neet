<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SkillUp Physics | Units of Measurement</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>📏 Units of Measurement</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['The SI unit of length is:',['metre','centimetre','kilometre','foot'],0,'The metre (m) is the SI base unit of length.'],['The SI base unit of mass is:',['gram','kilogram','milligram','tonne'],1,'The kilogram (kg) is the SI base unit of mass.'],['The SI base unit of time is:',['minute','hour','second','day'],2,'The second (s) is the SI base unit of time.'],['The SI unit of electric current is:',['volt','coulomb','ampere','ohm'],2,'The ampere (A) is the SI base unit of electric current.'],['The SI unit of thermodynamic temperature is:',['degree Celsius','kelvin','fahrenheit','joule'],1,'The kelvin (K) is the SI base unit of thermodynamic temperature.'],['Which of the following is an SI base unit?',['newton','joule','candela','pascal'],2,'Candela (cd) is one of the seven SI base units.'],['Which of the following is a derived SI unit?',['metre','second','kilogram','newton'],3,'Newton (N) is a derived SI unit: 1 N = 1 kg m s⁻².'],['One kilometre is equal to:',['10 m','100 m','1000 m','10,000 m'],2,'The SI prefix kilo- represents 10³, so 1 km = 1000 m.'],['The SI unit of force is:',['joule','newton','pascal','watt'],1,'Force is measured in newtons (N), where 1 N = 1 kg m s⁻².'],['The SI unit of energy is:',['newton','watt','joule','pascal'],2,'Energy and work are measured in joules (J).'],['The SI unit of pressure is:',['pascal','joule','newton','watt'],0,'Pressure is measured in pascals (Pa), where 1 Pa = 1 N m⁻².'],['Which physical quantity has the SI unit watt?',['force','power','energy','pressure'],1,'The watt (W) is the SI derived unit of power: 1 W = 1 J s⁻¹.'],['The SI unit of frequency is:',['hertz','second','radian','metre'],0,'Frequency is measured in hertz (Hz), equivalent to s⁻¹.'],['The SI base unit of amount of substance is:',['mole','candela','kelvin','ampere'],0,'The mole (mol) is the SI base unit of amount of substance.'],['A complete measurement of a physical quantity is normally expressed as:',['a number only','a unit only','a numerical value and a unit','a symbol only'],2,'A complete measurement combines a numerical value with an appropriate unit.']];let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q[1].map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[2];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[2])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});if(ok){score++;$('xp').textContent='✨ Correct! +1 XP'}else{$('xp').textContent='❌ Incorrect. '+q[3]}$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');$('fill').style.width=`${(i+1)/15*100}%`;}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
