<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Units & Measurement Quiz</title><style>:root{--b:#1677ff;--n:#123b70;--g:#20a05a;--r:#df4d4d;--l:#d9e5f2}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7fbff,#edf4fa);font-family:system-ui,sans-serif;color:#263238}.wrap{max-width:760px;margin:auto;padding:18px 12px 60px}.back{color:var(--b);font-weight:800}.hero{margin-top:12px;padding:22px;border-radius:24px;background:linear-gradient(135deg,#123b70,#1769c2);color:white}.hero h1{margin:0;font-size:32px}.hero p{font-size:12px}.concepts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.concept{background:white;border:2px solid var(--l);border-radius:16px;padding:11px;text-align:center;font-size:11px;font-weight:800;box-shadow:0 4px 0 #dce4ec}.concept b{display:block;font-size:25px}.progress,.quiz,.result{background:white;border:2px solid var(--l);border-radius:20px;padding:16px;margin-top:12px;box-shadow:0 7px 20px #123b7014}.row{display:flex;justify-content:space-between;font-size:11px;font-weight:900}.bar{height:9px;background:#e7eef6;border-radius:99px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--b);width:0}.q{font-size:18px;font-weight:900;color:var(--n);line-height:1.4;margin:18px 0}.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #d7e4f1;border-radius:15px;padding:13px;margin:8px 0;font-weight:750;cursor:pointer}.opt:hover{transform:translateY(-2px);border-color:#8fbbea}.correct{background:#eaf8f0!important;border-color:var(--g)!important}.wrong{background:#fff0f0!important;border-color:var(--r)!important}.feed{display:none;padding:12px;border-radius:14px;margin-top:10px;font-size:11px;line-height:1.5}.show{display:block}.next,.retry{display:none;width:100%;border:0;border-radius:14px;padding:13px;background:var(--b);color:#fff;font-weight:900;margin-top:10px;cursor:pointer}.result{text-align:center}.score{font-size:44px;font-weight:950;color:var(--b)}@media(max-width:600px){.concepts{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:27px}.q{font-size:16px}}</style></head><body><main class="wrap"><a class="back" href="physics-concept.html?concept=Units%20of%20Measurement">← Back to Units & Measurement</a><section class="hero"><h1>📏 Units & Measurement</h1><p>NEET Physics • Learn the key concepts, then master them with 15 MCQs.</p></section><section class="concepts"><div class="concept"><b>📐</b>SI Units</div><div class="concept"><b>🧩</b>Dimensions</div><div class="concept"><b>🎯</b>Significant Figures</div><div class="concept"><b>⚠️</b>Errors</div><div class="concept"><b>🔬</b>Least Count</div><div class="concept"><b>🧠</b>Dimensional Analysis</div></section><section class="progress"><div class="row"><span>Physics XP</span><span id="pt">0 / 15</span></div><div class="bar"><i id="pb"></i></div></section><section class="quiz" id="quiz"><div class="row"><span id="level">🟢 EASY</span><span id="qn">1 / 15</span></div><div class="q" id="q"></div><div id="opts"></div><div class="feed" id="feed"></div><button class="next" id="next">Continue →</button></section><section class="result" id="result"><div>🏆</div><h2>Quiz Complete!</h2><div class="score" id="score"></div><p id="msg"></p><button class="retry" id="retry">Try Again</button></section></main><script>const qs=[
['EASY','Which SI base unit measures length?',['metre (m)','kilogram (kg)','second (s)','ampere (A)'],0,'The metre is the SI base unit of length.'],
['EASY','Which SI base unit measures mass?',['newton (N)','kilogram (kg)','joule (J)','watt (W)'],1,'The kilogram is the SI base unit of mass.'],
['EASY','What is the SI base unit of time?',['minute','hour','second (s)','day'],2,'The second is the SI base unit of time.'],
['EASY','Which is an SI derived unit?',['metre','second','newton','kilogram'],2,'The newton is a derived unit: kg·m·s⁻².'],
['EASY','What is the SI base unit of electric current?',['volt','coulomb','ohm','ampere'],3,'The ampere is the SI base unit of electric current.'],
['MODERATE','Which set contains only SI base quantities?',['length, mass, time','force, energy, power','velocity, force, acceleration','pressure, density, volume'],0,'Length, mass and time are SI base quantities.'],
['MODERATE','The SI base-unit form of force is:',['kg·m·s⁻²','kg·m²·s⁻²','kg·m⁻¹·s⁻²','kg·s⁻²'],0,'F = ma, so force has dimensions and SI base units kg·m·s⁻².'],
['MODERATE','Which pair has the same dimensions?',['speed and acceleration','work and torque','force and pressure','energy and power'],1,'Both work and torque have dimensions ML²T⁻².'],
['MODERATE','2.5 km is equal to:',['25 m','250 m','2500 m','25 000 m'],2,'2.5 × 1000 m = 2500 m.'],
['MODERATE','Which prefix represents 10⁻⁶?',['milli','nano','micro','kilo'],2,'The SI prefix micro represents 10⁻⁶.'],
['NEET','One pascal is equivalent to:',['N·m','N·m⁻²','N·m²','kg·m·s⁻¹'],1,'Pressure is force divided by area, so Pa = N·m⁻².'],
['NEET','The dimensions of energy are:',['MLT⁻¹','ML²T⁻²','ML⁻¹T⁻²','M⁰L²T⁻¹'],1,'Energy is work, with dimensions ML²T⁻².'],
['NEET','12.0 m ÷ 3.0 m gives a result with how many significant figures?',['1','2','3','4'],1,'Division is limited by the least number of significant figures: 2.'],
['NEET','Which quantity has SI base units kg·m²·s⁻³?',['force','energy','power','momentum'],2,'Power is energy per time: kg·m²·s⁻³.'],
['NEET','The dimensions of gravitational constant G are:',['M⁻¹L³T⁻²','ML³T⁻²','M⁻¹L²T⁻²','ML⁻²T⁻¹'],0,'From F = Gm₁m₂/r², G has dimensions M⁻¹L³T⁻².']];let i=0,score=0;const q=document.getElementById('q'),opts=document.getElementById('opts'),feed=document.getElementById('feed'),next=document.getElementById('next');function render(){const d=qs[i];document.getElementById('level').textContent=(i<5?'🟢 ':i<10?'🟡 ':'🔴 ')+d[0];document.getElementById('qn').textContent=(i+1)+' / 15';document.getElementById('pt').textContent=i+' / 15';document.getElementById('pb').style.width=(i/15*100)+'%';q.textContent=d[1];opts.innerHTML='';feed.className='feed';next.className='next';d[2].forEach((x,n)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+n)+'. '+x;b.onclick=()=>answer(n,b);opts.appendChild(b)})}function answer(n,b){const d=qs[i];document.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===d[3])x.classList.add('correct')});if(n===d[3]){score++;b.classList.add('correct');feed.textContent='🎉 '+d[4];feed.style.background='#eaf8f0'}else{b.classList.add('wrong');feed.textContent='💡 '+d[4];feed.style.background='#fff4e5'}feed.classList.add('show');next.classList.add('show');document.getElementById('pt').textContent=(i+1)+' / 15';document.getElementById('pb').style.width=((i+1)/15*100)+'%'}next.onclick=()=>{i++;if(i<15)render();else{document.getElementById('quiz').style.display='none';const r=document.getElementById('result');r.classList.add('show');document.getElementById('score').textContent=score+' / 15';document.getElementById('msg').textContent='You earned '+score*10+' XP. '+(score>=13?'Excellent NEET readiness!':score>=9?'Good progress—review the missed concepts.':'Keep practising the key concepts.');document.getElementById('retry').style.display='block'}};document.getElementById('retry').onclick=()=>{i=0;score=0;document.getElementById('result').classList.remove('show');document.getElementById('retry').style.display='none';document.getElementById('quiz').style.display='block';render()};render();</script></body></html>
