<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Universal Law of Gravitation</title><style>body{margin:0;background:#f5f7fa;font-family:Arial,sans-serif;color:#172033}.wrap{max-width:760px;margin:auto;padding:24px 16px 50px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:27px;font-weight:800}.xp{font-weight:700;color:#168447;white-space:nowrap}.sub{color:#667085;margin:8px 0 18px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 16px #0000000b}.mastery{font-weight:700}.bar{height:10px;background:#e7ebf0;border-radius:10px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#22a06b;transition:.3s}.qno{font-size:14px;color:#667085}.q{font-size:20px;font-weight:750;line-height:1.4;margin:10px 0 18px}.opt{display:block;width:100%;text-align:left;padding:14px;margin:9px 0;border:2px solid #d9dee7;background:#fff;border-radius:12px;cursor:pointer;font-size:16px}.opt:hover{transform:translateY(-1px);border-color:#7b8798}.opt.sel{border-color:#3578e5;background:#eef5ff}.opt.correct{border-color:#20a464;background:#eaf8f0}.opt.wrong{border-color:#d64545;background:#fff0f0}.btn{border:0;border-radius:12px;padding:13px 20px;font-size:16px;font-weight:750;cursor:pointer;background:#22a06b;color:white}.btn:disabled{opacity:.5;cursor:not-allowed}.back{display:inline-block;text-decoration:none;color:#344054;border:2px solid #d9dee7;border-radius:12px;padding:12px 18px;font-weight:700;background:#fff}.feedback{min-height:24px;font-weight:700;margin-top:14px}.done{text-align:center;font-size:22px;font-weight:800}</style></head><body><main class="wrap"><div class="head"><div class="title">🌍 Universal Law of Gravitation</div><div class="xp">+10 XP</div></div><div class="sub">Newton's law of gravitation, gravitational force, inverse-square dependence and applications.</div><section class="card"><div class="mastery">🎯 Skill Mastery <span id="score">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card" id="quizCard"><div class="qno" id="qno"></div><div class="q" id="q"></div><div id="opts"></div><button class="btn" id="continue" disabled>Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>const quiz=[['Newton’s universal law of gravitation states that the force between two masses is:',['F=Gm₁m₂/r²','F=Gm₁m₂r²','F=G(m₁+m₂)/r','F=G/r²'],0],['The gravitational force between two bodies acts along the:',['line joining their centres','tangent at the first body','vertical direction only','direction of velocity'],0],['If the distance between two masses is doubled, gravitational force becomes:',['one-fourth','one-half','double','four times'],0],['The SI unit of gravitational constant G is:',['N m² kg⁻²','N kg² m⁻²','kg m² N⁻¹','N m kg⁻¹'],0],['The dimensional formula of G is:',['M⁻¹L³T⁻²','ML³T⁻²','M⁻¹L²T⁻²','ML²T⁻¹'],0],['Gravitational force is always:',['attractive','repulsive','zero','alternately attractive and repulsive'],0],['If both masses are doubled while separation remains unchanged, gravitational force becomes:',['four times','twice','half','unchanged'],0],['The value of G is approximately:',['6.67×10⁻¹¹ N m² kg⁻²','9.8 N m² kg⁻²','6.67×10¹¹ N m² kg⁻²','3×10⁸ N m² kg⁻²'],0],['For a spherically symmetric body, outside the body its gravitational attraction can be treated as if its mass were concentrated at the:',['centre','surface','topmost point','nearest point only'],0],['According to Newton’s third law, the gravitational forces exerted by two bodies on each other are:',['equal in magnitude and opposite in direction','equal and in the same direction','different in magnitude and opposite','zero'],0],['Two masses 2 kg and 3 kg are separated by 1 m. Their gravitational force is:',['4.002×10⁻¹⁰ N','6.67×10⁻¹¹ N','2.001×10⁻¹⁰ N','1.334×10⁻⁹ N'],0],['If the separation between two masses is reduced to half, the gravitational force becomes:',['four times','twice','half','one-fourth'],0],['The gravitational force obeys which dependence on separation r?',['inverse square','direct square','inverse linear','independent of r'],0],['If one of two interacting masses becomes three times while all else remains unchanged, gravitational force becomes:',['three times','one-third','nine times','unchanged'],0],['The universal law of gravitation successfully explains the attraction between:',['any two masses','only planets','only objects near Earth','only electrically neutral bodies'],0]];let i=0,correct=0,selected=null,checked=false;function $(x){return document.getElementById(x)}function shuffle(a){for(let k=a.length-1;k>0;k--){let r=Math.floor(Math.random()*(k+1));[a[k],a[r]]=[a[r],a[k]]}return a}function render(){selected=null;checked=false;$('continue').disabled=true;$('continue').textContent='Continue →';$('feedback').textContent='';$('qno').textContent=`Question ${i+1} of 15`;$('q').textContent=quiz[i][0];$('opts').innerHTML='';const order=quiz[i][1].map((text,index)=>({text,index}));shuffle(order).forEach((x,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{selected=x.index;document.querySelectorAll('.opt').forEach(z=>z.classList.remove('sel'));b.classList.add('sel');$('continue').disabled=false};$('opts').appendChild(b)});$('score').textContent=`${correct} / 15`;$('fill').style.width=`${(i/15)*100}%`}$('continue').onclick=()=>{if(selected===null)return;if(!checked){checked=true;const ok=selected===quiz[i][2];if(ok)correct++;document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const n=Number(b.dataset.index);if(n===quiz[i][2])b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=ok?'🎉 Correct! +10 XP':'💡 Review the highlighted correct answer.';$('score').textContent=`${correct} / 15`;$('fill').style.width=`${((i+1)/15)*100}%`;$('continue').textContent=i===14?'Finish Skill →':'Continue →';return}if(i<14){i++;render()}else{$('quizCard').innerHTML=`<div class="done">🏆 Skill Complete!</div><p>You scored ${correct} / 15.</p><button class="btn" onclick="location.reload()">Retry →</button>`}};$('back').onclick=function(){const s=sessionStorage.getItem('skillupLastPhysicsPath');if(s){try{const u=new URL(s,location.href);if(u.origin===location.origin){location.href=s;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();</script></body></html>
