<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Variable Mass Systems</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:28px 18px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title{font-size:1.6rem;font-weight:900}.xp,.card{background:#fff;border-radius:20px;box-shadow:0 6px 20px #17203312}.xp{padding:10px 15px;font-weight:850}.subtitle{color:#5f6b7a;margin:0 0 18px}.card{padding:20px;margin:12px 0}.ph{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:11px;background:#dfe8f1;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:.25s}.qnum{font-weight:800;color:#35516f;margin-bottom:11px}.question{font-size:1.27rem;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #d9e2ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;cursor:pointer}.option:hover{border-color:#58cc02;background:#f7fff1}.option.selected{border-color:#1685e8;background:#eef7ff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#e5484d;background:#fff0f0}.btn{margin-top:16px;padding:12px 20px;border:0;border-radius:13px;background:#2db84d;color:#fff;font-weight:850;cursor:pointer}.feedback{margin-top:14px;padding:12px;border-radius:13px;font-weight:700;min-height:18px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.back{display:inline-block;margin-top:10px;padding:10px 13px;border:2px solid #d9d4f5;border-radius:13px;color:#5146a5;font-weight:800;text-decoration:none}</style></head><body><main class="wrap"><div class="top"><div class="title">🔄 Variable Mass Systems</div><div class="xp">⚡ <span id="xp">0</span> XP</div></div><p class="subtitle">Physics • NEET 2026 · Learn → Practice → Master</p><section class="card"><div class="ph"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="card"><div class="qnum" id="count"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><button class="btn" id="continue">Continue →</button><div class="feedback" id="feedback"></div></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>(function(){const quiz=[['A variable-mass system is one in which:', ['mass changes with time','velocity is always constant','force is always zero','acceleration is always zero'],0],['A rocket is a variable-mass system because it:', ['continuously ejects propellant','has a fixed colour','moves in space','has an engine'],0],['Rocket thrust is related to the rate of change of:', ['momentum of expelled mass','position only','kinetic energy only','mass density only'],0],['For ideal rocket motion, the rocket gains forward momentum when exhaust is:', ['ejected backward','ejected forward','kept inside','at rest relative to space'],0],['The SI unit of mass flow rate is:', ['kg s⁻¹','N','J','m s⁻¹'],0],['If exhaust speed is increased for the same mass flow rate, ideal thrust generally:', ['increases','decreases to zero','is unchanged','reverses'],0],['The Tsiolkovsky rocket equation is used to calculate ideal:', ['velocity change','density','pressure','temperature'],0],['In the ideal rocket equation, the logarithm contains the:', ['initial-to-final mass ratio','rocket diameter ratio','temperature ratio only','pressure difference'],0],['Discarding empty stages mainly improves rocket performance by:', ['reducing dead mass','increasing empty mass','removing thrust','stopping exhaust'],0],['A complete rocket-plus-exhaust system with no external force has:', ['constant total momentum','increasing total momentum from internal forces','zero mass','zero energy'],0],['Internal forces in an isolated variable-mass system:', ['cannot change its total centre-of-mass motion','always accelerate its centre of mass','destroy momentum','act like external forces'],0],['Specific impulse is closely related to:', ['effective exhaust velocity','rocket colour','payload shape','launch-site latitude only'],0],['A larger propellant mass fraction generally gives a rocket:', ['greater possible ideal Δv for a given exhaust velocity','zero Δv','zero thrust','less available propellant'],0],['Gravity during powered flight is:', ['an external force on the rocket','an internal exhaust force','always zero','the source of thrust'],0],['The key principle behind rocket propulsion is:', ['conservation of momentum','conservation of charge','Archimedes principle','Ohm law'],0]];let i=0,selected=-1,checked=false,score=0;const $=id=>document.getElementById(id),o=$("options"),b=$("continue"),f=$("feedback");function render(){const a=quiz[i];selected=-1;checked=false;$("count").textContent='Question '+(i+1)+' of 15';$("question").textContent=a[0];o.innerHTML='';f.className='feedback';f.textContent='';b.style.display='inline-block';b.textContent=i===14?'Finish Skill →':'Continue →';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const el=document.createElement('button');el.className='option';el.textContent=String.fromCharCode(65+j)+'. '+item.text;el.dataset.index=item.index;el.onclick=()=>{selected=item.index;[...o.children].forEach(z=>z.classList.remove('selected'));el.classList.add('selected')};o.appendChild(el)})}b.onclick=()=>{if(!checked){if(selected<0){f.className='feedback bad';f.textContent='Choose an answer first 👆';return}checked=true;const a=quiz[i],ok=selected===a[2];[...o.children].forEach(el=>{const n=Number(el.dataset.index);el.disabled=true;if(n===a[2])el.classList.add('correct');if(n===selected&&!ok)el.classList.add('wrong')});if(ok)score++;f.className=ok?'feedback good':'feedback bad';f.textContent=ok?'🎯 Correct! +10 XP':'✗ Review — correct answer: '+a[1][a[2]];$("xp").textContent=score*10;$("mastery").textContent=score+' / 15';$("fill").style.width=(score/15*100)+'%';return}if(i<14){i++;render();scrollTo({top:0,behavior:'smooth'})}else{$("question").textContent='🏆 Variable Mass Systems Complete!';o.innerHTML='';b.style.display='none';f.className='feedback good';f.textContent='Skill complete: '+score+' / 15 correct • '+score*10+' XP earned.'}};$("back").onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render()})();</script></body></html>
