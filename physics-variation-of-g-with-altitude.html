<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🛰️ Variation of g with Altitude</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"At altitude h above Earth, acceleration due to gravity is:",o:["gₕ = GM/(R+h)²","gₕ = GM/(R−h)²","gₕ = GM/(R+h)","gₕ = G(R+h)²/M"],a:0,e:"The distance from Earth's centre at altitude h is R+h, so gₕ = GM/(R+h)²."},
{q:"In terms of surface gravity g, the exact altitude formula is:",o:["gₕ = g[R/(R+h)]²","gₕ = g(1−h/R) exactly","gₕ = g(R+h)²/R²","gₕ = gR/(R+h)²"],a:0,e:"Divide gₕ = GM/(R+h)² by surface g = GM/R²."},
{q:"As altitude increases, gravitational acceleration generally:",o:["Decreases","Increases","Stays constant","Immediately becomes zero"],a:0,e:"The distance from Earth's centre increases, reducing the inverse-square field."},
{q:"At altitude h = R, gravity is:",o:["g/4","g/2","2g","g"],a:0,e:"The distance from Earth's centre becomes 2R, so gravity is g/2² = g/4."},
{q:"At altitude h = R, if surface g = 9.8 m/s², the value of gₕ is:",o:["2.45 m/s²","4.9 m/s²","9.8 m/s²","39.2 m/s²"],a:0,e:"gₕ = 9.8/4 = 2.45 m/s²."},
{q:"For h much smaller than Earth's radius R, g at altitude h is approximately:",o:["g(1−2h/R)","g(1−h/R)","g(1+2h/R)","gR/h"],a:0,e:"The binomial approximation gives (1+h/R)⁻² ≈ 1−2h/R."},
{q:"The small-altitude approximation gₕ ≈ g(1−2h/R) is valid when:",o:["h ≪ R","h = R","h ≫ R","h is negative only"],a:0,e:"It neglects higher powers of h/R, so h must be small compared with R."},
{q:"For small altitude h, the approximate fractional decrease in gravity is:",o:["2h/R","h/R","R/(2h)","(h/R)²"],a:0,e:"From gₕ ≈ g(1−2h/R), the fractional decrease is approximately 2h/R."},
{q:"For small altitude h, the percentage decrease in g is approximately:",o:["(2h/R) × 100%","(h/R) × 100%","(R/2h) × 100%","(h/R)² × 100%"],a:0,e:"Multiply the fractional decrease 2h/R by 100%."},
{q:"Earth's radius is R and altitude is h = R/2. The exact ratio gₕ/g is:",o:["4/9","1/2","1/4","2/3"],a:0,e:"gₕ/g = [R/(R+R/2)]² = (2/3)² = 4/9."},
{q:"At altitude h = R, the ratio of gravity to surface gravity is:",o:["1/4","1/2","1/3","1/9"],a:0,e:"gₕ/g = [R/(2R)]² = 1/4."},
{q:"At altitude h = 3R, gravity is:",o:["g/16","g/9","g/4","g/8"],a:0,e:"Distance from the centre is 4R, so gₕ/g = R²/(4R)² = 1/16."},
{q:"If altitude changes from h to 2h, gravity:",o:["Must be calculated from R/(R+h); it does not simply halve","Always halves","Always doubles","Becomes zero"],a:0,e:"The exact relation depends on the ratio of altitude to Earth's radius."},
{q:"If h ≪ R, and h = R/100, approximate gₕ is:",o:["0.98g","0.5g","0.9g","1.02g"],a:0,e:"gₕ ≈ g(1−2/100) = 0.98g."},
{q:"If Earth's mass stays constant but its radius doubled, surface gravity would:",o:["Become one-fourth","Double","Become half","Stay unchanged"],a:0,e:"Surface gravity varies inversely as the square of radius for fixed mass."},
{q:"Which quantity remains unchanged when moving to a high altitude (ignoring mass-energy effects)?",o:["The body's mass","Its weight","Local g","Gravitational force on it"],a:0,e:"Mass is intrinsic; weight and gravitational force depend on local gravity."},
{q:"A 2 kg object at altitude has local g = 7 m/s². Its weight there is:",o:["14 N","9 N","3.5 N","7 N"],a:0,e:"Weight W = mg = 2 × 7 = 14 N."},
{q:"The SI unit of acceleration due to gravity is:",o:["m/s²","N m","J/kg","kg/m³"],a:0,e:"Acceleration has unit metres per second squared."},
{q:"The dimensions of g are:",o:["LT⁻²","L²T⁻²","MLT⁻²","M⁻¹L³T⁻²"],a:0,e:"Acceleration has dimensions length per time squared."},
{q:"The universal gravitational constant G is approximately:",o:["6.67 × 10⁻¹¹ N m²/kg²","9.8 m/s²","6.67 × 10¹¹ N/kg","3.0 × 10⁸ m/s"],a:0,e:"G is the universal constant in Newton's law of gravitation."},
{q:"At altitude h, distance from Earth's centre is:",o:["R+h","R−h","h−R","R/h"],a:0,e:"Altitude is measured from the surface, so centre distance is R+h."},
{q:"If h = 0, the altitude formula gives:",o:["gₕ = g","gₕ = 0","gₕ = 4g","gₕ = g/4"],a:0,e:"At the surface, h = 0 and [R/(R+h)]² = 1."},
{q:"If h = R, the distance from Earth's centre is:",o:["2R","R","R/2","4R"],a:0,e:"Adding an altitude equal to R gives centre distance R+R = 2R."},
{q:"For very large altitude h ≫ R, the exact expression predicts gravity approximately:",o:["GM/h²","GM/R²","GM/h","Zero at every finite h"],a:0,e:"When h is much larger than R, R+h ≈ h, so gₕ ≈ GM/h²."},
{q:"Which statement about the approximation gₕ ≈ g(1−2h/R) is correct?",o:["It is not exact for large h","It is exact at all altitudes","It predicts gravity increases with h","It is valid only at Earth's centre"],a:0,e:"The approximation is a first-order expansion for h/R ≪ 1."},
{q:"At altitude h = R/3, exact gₕ/g equals:",o:["9/16","3/4","1/3","4/9"],a:0,e:"gₕ/g = [R/(R+R/3)]² = (3/4)² = 9/16."},
{q:"If gravity at an altitude is 1/9 of surface gravity, the distance from Earth's centre is:",o:["3R","2R","9R","R/3"],a:0,e:"Inverse-square dependence gives (R/r)² = 1/9, so r = 3R and h = 2R."},
{q:"For a fixed altitude, gₕ depends on Earth's:",o:["Mass and radius","The falling body's mass only","The body's colour","The object's speed only"],a:0,e:"The expression uses Earth's mass M, radius R and altitude h."},
{q:"A satellite moves from radius 2R to radius 3R from Earth's centre. The ratio of new gravity to old gravity is:",o:["4/9","9/4","2/3","1/3"],a:0,e:"Gravity is inverse-square in centre distance: (2R/3R)² = 4/9."},
{q:"Which formula should be used when altitude is not small compared with Earth's radius?",o:["gₕ = g[R/(R+h)]²","gₕ ≈ g(1−2h/R) only","gₕ = g(1−h/R)","gₕ = g(1+h/R)"],a:0,e:"Use the exact inverse-square expression when h is not much smaller than R."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Variation of g with Altitude Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
