</style></head><body><main class="wrap"><div class="head"><h1>🌍 Variation of g with Altitude</h1><div class="xp" id="xp">+0 XP</div></div><p class="sub">How acceleration due to gravity changes above Earth's surface.</p><section class="card"><div class="master">🎯 Skill Mastery <span id="score">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card" id="quiz"></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>
const quiz=[
['At a height h above Earth, where h is much smaller than R, g is approximately:', ['g(1-h/R)','g(1-2h/R)','g(1+h/R)','g(1- R/h)'],1,'For h≪R, g_h≈g(1−2h/R).'],
['The exact expression for g at height h above Earth is:', ['gR/(R+h)','gR²/(R+h)²','g(R+h)²/R²','g(1+h/R)²'],1,'Since g=GM/r² and r=R+h, g_h=gR²/(R+h)².'],
['If the altitude above Earth increases, acceleration due to gravity:', ['increases','decreases','remains constant','first increases then decreases'],1,'Distance from Earth’s centre increases, so g decreases.'],
['At height h=R above Earth’s surface, the value of g is:', ['g','g/2','g/4','2g'],2,'The distance from Earth’s centre is 2R, so g_h=g(R/2R)²=g/4.'],
['The fractional decrease in g for a small height h is approximately:', ['h/R','2h/R','h/2R','R/2h'],1,'From g_h≈g(1−2h/R), fractional decrease is 2h/R.'],
['If Earth’s radius is R and g at surface is g, at altitude 0.5R the value is:', ['4g/9','2g/3','g/2','g/4'],0,'r=1.5R, so g_h=g/(1.5)²=4g/9.'],
['Which quantity remains unchanged when moving a small distance upward from Earth?', ['distance from Earth’s centre','acceleration due to gravity','mass of the body','weight of the body'],2,'Mass is intrinsic and does not depend on altitude.'],
['A body taken to a greater altitude has weight that:', ['increases','decreases','becomes zero immediately','remains exactly same'],1,'Weight W=mg and g decreases with altitude.'],
['For a body at altitude h, its distance from Earth’s centre is:', ['h','R-h','R+h','R/h'],2,'Earth’s radius is R, so the radial distance is R+h.'],
['If g_h/g=1/4, the altitude h above Earth is:', ['R/2','R','2R','3R'],1,'(R/(R+h))²=1/4 gives R+h=2R, hence h=R.'],
['For small altitude h, the percentage decrease in g is approximately:', ['h/R ×100','2h/R ×100','R/h ×100','h²/R² ×100'],1,'The fractional decrease is approximately 2h/R.'],
['The dependence of g on altitude is obtained from:', ['g∝r','g∝r²','g∝1/r','g∝1/r²'],3,'Gravitational acceleration follows the inverse-square law.'],
['At Earth’s surface r=R. At altitude h, the ratio g_h/g is:', ['(R+h)/R','R/(R+h)','[R/(R+h)]²','[(R+h)/R]²'],2,'Taking the ratio of GM/(R+h)² to GM/R² gives [R/(R+h)]².'],
['If altitude is doubled from a small value h to 2h, the approximate decrease in g becomes:', ['half','double','four times','unchanged'],1,'For small heights, fractional decrease is proportional to h.'],
['The decrease of g with altitude is primarily due to:', ['increase in Earth’s mass','increase in distance from Earth’s centre','decrease in body mass','change in universal gravitational constant'],1,'Greater radial distance reduces gravitational acceleration by the inverse-square law.']
];
let i=0,selected=null,correct=0,checked=false;const $=id=>document.getElementById(id);
function render(){checked=false;selected=null;const q=quiz[i];$('quiz').innerHTML='<div class="qno">Question '+(i+1)+' of 15</div><div class="question">'+q[0]+'</div><div class="opts" id="opts"></div><button class="action" id="action">Continue →</button><div class="feedback" id="feedback"></div>';const order=q[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((x,j)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{if(checked)return;selected=x.index;[...$('opts').children].forEach(y=>y.classList.remove('selected'));b.classList.add('selected')};$('opts').appendChild(b)});$('action').onclick=check;update()}
function check(){if(selected===null){$('feedback').textContent='Choose an answer first.';return}if(!checked){checked=true;const q=quiz[i],ok=selected===q[2];if(ok)correct++;[...$('opts').children].forEach(b=>{const n=Number(b.dataset.index);b.disabled=true;if(n===q[2])b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').textContent=(ok?'🎉 Correct! +10 XP — ':'💡 Not quite. ')+q[3];$('action').textContent=i===14?'Finish Skill →':'Continue →';update();return}if(i<14){i++;render()}else finish()}
function update(){$('score').textContent=correct+' / 15';$('fill').style.width=(correct/15*100)+'%';$('xp').textContent='+'+(correct*10)+' XP'}
function finish(){const pct=Math.round(correct/15*100);$('quiz').innerHTML='<div class="result"><h2>🏆 Skill Complete!</h2><p>You scored <strong>'+correct+' / 15</strong> ('+pct+'%).</p><p>⭐ XP earned: <strong>'+correct*10+'</strong></p><button class="action" onclick="i=0;correct=0;render()">Retry Skill</button></div>';update()}
$('back').onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();
