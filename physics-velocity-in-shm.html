<section class="hero"><h1>🔥 Velocity in SHM</h1><p class="muted">Explore SHM oscillator properties with 30 questions and concise explanations.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>

<script>
(function(){
'use strict';
const questions = [
  {q:"For SHM with displacement x = A cos(ωt), the velocity is:",o:["Aω sin(ωt)","−Aω sin(ωt)","Aω cos(ωt)","−Aω² cos(ωt)"],a:1,e:"Differentiate x = A cos(ωt): v = dx/dt = −Aω sin(ωt)."},
  {q:"The maximum speed in SHM is:",o:["A/ω","Aω","Aω²","ω/A"],a:1,e:"The maximum speed is v_max = Aω."},
  {q:"At the mean position of an ideal SHM oscillator, the speed is:",o:["zero","maximum","half the maximum","always negative"],a:1,e:"At x = 0, kinetic energy and speed are maximum."},
  {q:"At either extreme position in SHM, the instantaneous velocity is:",o:["maximum","zero","ωA","ω²A"],a:1,e:"At x = ±A, the particle momentarily changes direction, so v = 0."},
  {q:"The speed at displacement x in SHM has magnitude:",o:["ω(A − x)","ω√(A² − x²)","ω²x","Aω²x"],a:1,e:"Using energy or the SHM equation, |v| = ω√(A² − x²)."},
  {q:"An oscillator has amplitude 0.2 m and angular frequency 5 rad/s. Its maximum speed is:",o:["0.04 m/s","1 m/s","2.5 m/s","25 m/s"],a:1,e:"v_max = Aω = 0.2 × 5 = 1 m/s."},
  {q:"For amplitude A = 0.1 m and ω = 10 rad/s, the speed at x = 0 is:",o:["0 m/s","0.1 m/s","1 m/s","10 m/s"],a:2,e:"At the mean position, speed is maximum: v_max = Aω = 1 m/s."},
  {q:"For A = 0.5 m, ω = 4 rad/s and x = 0.3 m, the speed magnitude is:",o:["0.8 m/s","1.6 m/s","2.0 m/s","0.4 m/s"],a:1,e:"|v| = 4√(0.25 − 0.09) = 4(0.4) = 1.6 m/s."},
  {q:"If the amplitude doubles while angular frequency stays constant, maximum speed:",o:["halves","doubles","quadruples","does not change"],a:1,e:"v_max = Aω, so doubling A doubles the maximum speed."},
  {q:"If angular frequency doubles at fixed amplitude, maximum speed:",o:["halves","doubles","quadruples","does not change"],a:1,e:"v_max = Aω, so it doubles when ω doubles."},
  {q:"The SI unit of velocity is:",o:["m/s","m/s²","rad/s","hertz"],a:0,e:"Velocity is displacement per time and is measured in metres per second."},
  {q:"In x = A sin(ωt), the velocity is:",o:["Aω sin(ωt)","Aω cos(ωt)","−Aω cos(ωt)","−Aω² sin(ωt)"],a:1,e:"Differentiating A sin(ωt) gives v = Aω cos(ωt)."},
  {q:"For x = A sin(ωt), at t = 0 the particle is at the mean position and its velocity is:",o:["zero","+Aω","−Aω²","A"],a:1,e:"At t = 0, x = 0 and v = Aω cos 0 = Aω."},
  {q:"For x = A cos(ωt), at t = 0 the particle is at:",o:["mean position with maximum speed","positive extreme with zero velocity","negative extreme with maximum speed","mean position with zero acceleration"],a:1,e:"At t = 0, x = A and v = −Aω sin 0 = 0."},
  {q:"Velocity and displacement in SHM differ in phase by:",o:["0°","45°","90°","180°"],a:2,e:"Velocity is a quarter-cycle out of phase with displacement."},
  {q:"When displacement is x = A/2, the speed magnitude is:",o:["Aω/2","(√3/2)Aω","Aω","zero"],a:1,e:"|v| = ω√(A² − A²/4) = (√3/2)Aω."},
  {q:"When displacement is x = A/√2, the speed magnitude is:",o:["Aω/√2","Aω","Aω/2","√2 Aω"],a:0,e:"|v| = ω√(A² − A²/2) = Aω/√2."},
  {q:"If a particle is at x = ±A, its speed is:",o:["Aω","Aω²","zero","ω/A"],a:2,e:"The turning points are the extreme positions where instantaneous speed is zero."},
  {q:"The velocity of an SHM particle is zero at:",o:["only the mean position","both extreme positions","every position","positions x = ±A/2 only"],a:1,e:"Velocity vanishes at both turning points x = +A and x = −A."},
  {q:"The maximum speed of an SHM particle is 6 m/s and ω = 12 rad/s. The amplitude is:",o:["0.5 m","2 m","18 m","72 m"],a:0,e:"A = v_max/ω = 6/12 = 0.5 m."},
  {q:"An oscillator has A = 0.08 m and f = 5 Hz. Its maximum speed is closest to:",o:["0.4 m/s","1.26 m/s","2.51 m/s","5 m/s"],a:2,e:"ω = 2πf = 10π; v_max = Aω = 0.8π ≈ 2.51 m/s."},
  {q:"If the period is T, the maximum speed can be written as:",o:["2πA/T","AT/2π","A/T²","2πT/A"],a:0,e:"Since ω = 2π/T, v_max = Aω = 2πA/T."},
  {q:"At the mean position, the acceleration in SHM is zero. The velocity there is:",o:["also zero","maximum in magnitude","always negative","equal to ω²A"],a:1,e:"At x = 0 acceleration is zero while speed is maximum."},
  {q:"At the extreme position, acceleration magnitude is maximum and velocity is:",o:["maximum","zero","equal to Aω²","constant nonzero"],a:1,e:"At the turning point v = 0, while |a| = ω²A."},
  {q:"For a given amplitude and angular frequency, speed magnitude at x = +0.4A equals speed magnitude at:",o:["x = 0","x = −0.4A","x = +A","x = +0.8A"],a:1,e:"The speed formula depends on x², so equal positive and negative displacements give equal speed magnitudes."},
  {q:"A particle has A = 0.1 m and ω = 20 rad/s. Its maximum speed is:",o:["0.2 m/s","2 m/s","20 m/s","200 m/s"],a:1,e:"v_max = Aω = 0.1 × 20 = 2 m/s."},
  {q:"A particle is at x = 0.6A. Its speed magnitude as a fraction of maximum speed is:",o:["0.6","0.8","0.36","0.4"],a:1,e:"|v|/v_max = √(1 − x²/A²) = √(1 − 0.36) = 0.8."},
  {q:"In SHM, instantaneous velocity can be positive or negative because:",o:["the amplitude changes sign","the particle moves in opposite directions during its cycle","frequency changes every half-cycle","speed is always negative"],a:1,e:"Velocity includes direction; its sign changes as the particle reverses direction."},
  {q:"Which expression gives instantaneous velocity if x = A cos(ωt + φ)?",o:["Aω cos(ωt + φ)","−Aω sin(ωt + φ)","−Aω² cos(ωt + φ)","ω²x"],a:1,e:"Differentiation gives v = −Aω sin(ωt + φ)."},
  {q:"For ideal SHM, the maximum speed occurs where:",o:["displacement magnitude is maximum","displacement is zero","acceleration magnitude is maximum","potential energy is maximum"],a:1,e:"Speed is greatest at equilibrium, where displacement and restoring acceleration are zero."}
];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Velocity in SHM Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
