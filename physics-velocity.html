<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Velocity • NEET Physics</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:flex-end;align-items:center;gap:12px}.back{color:#5146a5;font-weight:800;text-decoration:none;padding:9px 12px;border-radius:12px;transition:transform .15s,background .15s,box-shadow .15s}.back:hover{background:#eeeaff;transform:translateX(-2px)}.back:focus-visible{outline:3px solid #b9b0ff;outline-offset:2px}.back:active{transform:translateX(-1px) scale(.98)}.xp{background:#fff;border:1px solid #dfe3ea;border-radius:14px;padding:7px 11px;font-weight:850;white-space:nowrap}.intro{margin:24px 0 18px}.intro h1{margin:0 0 8px;font-size:2rem;line-height:1.15}.intro p{margin:0;color:#596273;line-height:1.55}.progress{height:12px;background:#e4e7ed;border-radius:99px;overflow:hidden;margin:20px 0}.fill{height:100%;width:0;background:#58cc02;transition:width .25s ease}.card{background:#fff;border-radius:22px;padding:26px;box-shadow:0 8px 24px rgba(23,32,51,.08)}.meta{font-size:.95rem;font-weight:800;color:#596273;margin-bottom:12px}.q{font-size:1.3rem;font-weight:750;line-height:1.45;margin:0 0 20px}.options{display:grid;gap:10px}.option{padding:15px 16px;border:2px solid #dfe3ea;border-radius:14px;background:#fff;text-align:left;font:inherit;font-weight:700;color:#172033;cursor:pointer;transition:border-color .15s,background .15s,transform .1s,box-shadow .15s}.option:hover:not(:disabled){border-color:#58cc02;background:#f5fff0;transform:translateY(-1px);box-shadow:0 3px 0 #dfe3ea}.option.selected{border-color:#5146a5;background:#f1efff}.option.correct{border-color:#58cc02;background:#eaffdf}.option.wrong{border-color:#ff4b4b;background:#fff0f0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn nst r=document.referrer;if(!r)return;const u=new URL(r);if(u.origin!==location.origin)return;if(/(?:physics|full-physics)[^/]*path[^/]*\.html$/i.test(u.pathname)||/\/physics-home\.html$/i.test(u.pathname))sessionStorage.setItem(KEY,u.href)}catch(e){}}function goBackToPhysicsPath(){try{const saved=sessionStorage.getItem(KEY);if(saved){const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}}catch(e){}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false}window.goBackToPhysicsPath=goBackToPhysicsPath;rememberPath();const quiz=[['Velocity is defined as:',['Rate of change of displacement','Rate of change of distance','Distance travelled per unit time only','Change in speed per unit time'],0,'Velocity is the rate of change of displacement with time.'],['Velocity is a:',['Scalar quantity','Vector quantity','Dimensionless quantity','Constant quantity'],1,'Velocity has both magnitude and direction, so it is a vector quantity.'],['The SI unit of velocity is:',['m','m/s','m/s²','km'],1,'The SI unit of velocity is metre per second (m/s).'],['The direction of instantaneous velocity is along the:',['Tangent to the path','Normal to the path','Radius only','Direction of acceleration always'],0,'Instantaneous velocity is directed along the tangent to the path.'],['A body moves 20 m east in 4 s. Its average velocity is:',['5 m/s east','80 m/s east','0.2 m/s east','16 m/s east'],0,'Average velocity = displacement/time = 20/4 = 5 m/s east.'],['A particle returns to its starting point after motion. Its average velocity for the complete journey is:',['Maximum','Equal to average speed','Zero','Negative always'],2,'Net displacement is zero, so average velocity for the complete journey is zero.'],['If displacement is 30 m north in 5 s, average velocity is:',['6 m/s north','150 m/s north','25 m/s north','0.17 m/s north'],0,'Average velocity = 30/5 = 6 m/s north.'],['Can velocity be negative in one-dimensional motion?',['No, velocity is always positive','Yes, if motion is opposite to the chosen positive direction','Only when acceleration is zero','Only for circular motion'],1,'A negative velocity indicates motion opposite to the chosen positive direction.'],['For uniform velocity, which statement is correct?',['Magnitude and direction remain constant','Only speed changes','Direction changes continuously','Acceleration must be nonzero'],0,'Uniform velocity means both magnitude and direction remain constant.'],['The magnitude of instantaneous velocity is equal to:',['Instantaneous speed','Average acceleration','Displacement always','Distance always'],0,'Speed is the magnitude of velocity.'],['A car travels 10 m east and then 10 m west in 4 s. Its average velocity is:',['5 m/s east','5 m/s west','0 m/s','20 m/s'],2,'Net displacement is zero, so average velocity = 0/4 = 0 m/s.'],['A body has constant speed but changing velocity. This can occur when:',['It moves in a circle','It remains at rest','It moves in a straight line with constant direction','Its displacement is zero at every instant'],0,'In circular motion, speed may remain constant while velocity changes direction.'],['If the position of a particle is x = 5t² m, its velocity at time t is:',['5t m/s','10t m/s','25t m/s','10 m/s'],1,'Velocity v = dx/dt = d(5t²)/dt = 10t m/s.'],['Which relation is correct for average velocity?',['Total distance / total time','Total displacement / total time','Change in speed / time','Acceleration × time only'],1,'Average velocity = total displacement divided by total time.'],['For one-dimensional motion, a negative velocity indicates:',['The object is slowing down','The object moves in the negative coordinate direction','The object has negative speed','The object has zero displacement'],1,'The sign of velocity indicates direction relative to the chosen coordinate axis.']];let i=0,sel=-1,score=0,locked=false;const $=id=>document.getElementById(id),q=$('q'),o=$('opts'),fb=$('fb'),check=$('check'),next=$('next'),xp=$('xp'),fill=$('fill'),count=$('count'),pct=$('pct');function render(){const a=quiz[i];sel=-1;locked=false;q.textContent=a[0];count.textContent='Question '+(i+1)+' of '+quiz.length;pct.textContent=Math.round((i+1)/quiz.length*100)+'%';fill.style.width=(score/quiz.length*100)+'%';fb.className='feedback';fb.textContent='';check.disabled=false;next.disabled=true;next.textContent='Next Question →';o.innerHTML='';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((item,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{if(locked)return;sel=item.index;Array.from(o.children).forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)})}check.onclick=function(){if(sel<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}locked=true;const a=quiz[i],ok=sel===a[2];Array.from(o.children).forEach(b=>{const originalIndex=Number(b.dataset.index);b.disabled=true;if(originalIndex===a[2])b.classList.add('correct');if(originalIndex===sel&&!ok)b.classList.add('wrong')});if(ok){score++;fb.className='feedback good';fb.textContent='🎯 Correct! '+a[3]+' +10 XP'}else{fb.className='feedback bad';fb.textContent='Not quite. '+a[3]+' Correct answer: '+a[1][a[2]]}xp.textContent=score*10;fill.style.width=(score/quiz.length*100)+'%';check.disabled=true;next.disabled=false;if(i===quiz.length-1)next.textContent='Finish Skill →'};next.onclick=function(){if(i<quiz.length-1){i++;render()}else{q.textContent='🏆 Velocity Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+score+' / '+quiz.length+' correct • '+score*10+' XP';$('result').style.display='block';$('score').textContent=score+' / '+quiz.length+' correct • '+score*10+' XP'}};$('retry').onclick=()=>{i=0;sel=-1;score=0;locked=false;xp.textContent='0';$('result').style.display='none';check.style.display='';next.style.display='';next.textContent='Next Question →';render()};render()})();</script></body></html>
