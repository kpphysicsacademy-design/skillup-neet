<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Velocity</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eef7ff;color:#173b62}.wrap{max-width:1050px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.skill,.card{background:#fff;border-radius:20px;padding:22px;margin:12px 0;box-shadow:0 6px 18px #123b7015}.skill{padding:8px 12px;border:2px solid #dbe7f1;border-radius:14px;font-weight:900}.hero{background:linear-gradient(135deg,#12539d,#1685e8);color:#fff;border-radius:20px;padding:22px;margin:12px 0}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px}.options{display:grid;gap:10px}.option{padding:14px;border:2px solid #dbe7f1;border-radius:15px;background:#fff;text-align:left;font-weight:700;cursor:pointer}.selected{border-color:#1677ff;background:#eef6ff}.correct{border-color:#2db84d;background:#eaffef}.wrong{border-color:#e5484d;background:#fff0f0}.btn{padding:12px 18px;border:0;border-radius:13px;font-weight:900;cursor:pointer;margin:8px 6px 0 0}.check{background:#2db84d;color:#fff}.next{background:#dcecff;color:#145b9e}.next:disabled{opacity:.45}.feedback{margin-top:14px;padding:13px;border-radius:14px}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.bar{height:13px;background:#dce8f2;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#42c95a}@media(max-width:750px){.layout{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><a href="physics-home.html">← Back to Physics Path</a><span class="skill">⚡ <span id="xp">0</span> XP</span></div><section class="hero"><div>PHYSICS • NEET 2026</div><h1>Velocity</h1><p>LEARN → PRACTICE → MASTER • <span id="label">15 focused NEET-style MCQs</span></p></section><section class="card"><b>🎯 Skill Mastery <span id="mt">0 / 15</span></b><div class="bar"><div id="fill" class="fill"></div></div></section><div class="layout"><aside class="card"><h3 id="count">Question 1 of 15</h3><div id="pct">7%</div><div>Velocity</div><div>⚡ +10 XP each</div><div>🦉 Learn → Practice → Master</div></aside><section class="card"><b id="badge">Q1</b><h2 id="q"></h2><div id="opts" class="options"></div><button id="check" class="btn check">Check Answer</button><button id="next" class="btn next" disabled>Next Question →</button><div id="fb" class="feedback"></div><p>💡 Choose the best answer.</p></section></div></main><script>(function(){const quiz=[['Velocity is defined as:',['Rate of change of displacement','Rate of change of distance','Distance travelled per unit time only','Change in speed per unit time'],0],['Velocity is a:',['Scalar quantity','Vector quantity','Dimensionless quantity','Constant quantity'],1],['The SI unit of velocity is:',['m','m/s','m/s²','km'],1],['The direction of instantaneous velocity is along the:',['Tangent to the path','Normal to the path','Radius only','Direction of acceleration always'],0],['A body moves 20 m east in 4 s. Its average velocity is:',['5 m/s east','80 m/s east','0.2 m/s east','16 m/s east'],0],['A particle returns to its starting point after motion. Its average velocity for the complete journey is:',['Maximum','Equal to average speed','Zero','Negative always'],2],['If displacement is 30 m north in 5 s, average velocity is:',['6 m/s north','150 m/s north','25 m/s north','0.17 m/s north'],0],['Can velocity be negative in one-dimensional motion?',['No, velocity is always positive','Yes, if motion is opposite to the chosen positive direction','Only when acceleration is zero','Only for circular motion'],1],['For uniform velocity, which statement is correct?',['Magnitude and direction remain constant','Only speed changes','Direction changes continuously','Acceleration must be nonzero'],0],['The magnitude of instantaneous velocity is equal to:',['Instantaneous speed','Average acceleration','Displacement always','Distance always'],0],['A car travels 10 m east and then 10 m west in 4 s. Its average velocity is:',['5 m/s east','5 m/s west','0 m/s','20 m/s'],2],['A body has constant speed but changing velocity. This can occur when:',['It moves in a circle','It remains at rest','It moves in a straight line with constant direction','Its displacement is zero at every instant'],0],['If the position of a particle is x = 5t² m, its velocity at time t is:',['5t m/s','10t m/s','25t m/s','10 m/s'],1],['Which relation is correct for average velocity?',['Total distance / total time','Total displacement / total time','Change in speed / time','Acceleration × time only'],1],['For one-dimensional motion, a negative velocity indicates:',['The object is slowing down','The object moves in the negative coordinate direction','The object has negative speed','The object has zero displacement'],1]];let i=0,sel=-1,score=0,q=document.getElementById('q'),o=document.getElementById('opts'),fb=document.getElementById('fb'),check=document.getElementById('check'),next=document.getElementById('next');function render(){let a=quiz[i];sel=-1;q.textContent=a[0];document.getElementById('badge').textContent='Q'+(i+1);document.getElementById('count').textContent='Question '+(i+1)+' of '+quiz.length;document.getElementById('pct').textContent=Math.round((i+1)/quiz.length*100)+'%';o.innerHTML='';fb.textContent='';fb.className='feedback';check.disabled=false;next.disabled=true;a[1].forEach((v,j)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+v;b.onclick=()=>{sel=j;[...o.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};o.appendChild(b)})}check.onclick=()=>{if(sel<0){fb.className='feedback bad';fb.textContent='Choose an answer first 👆';return}let a=quiz[i];[...o.children].forEach((b,j)=>{b.disabled=true;if(j===a[2])b.classList.add('correct');if(j===sel&&j!==a[2])b.classList.add('wrong')});if(sel===a[2]){score++;fb.className='feedback good';fb.textContent='🎯 Correct! +10 XP'}else{fb.className='feedback bad';fb.textContent='Not quite. Correct answer: '+a[1][a[2]]}document.getElementById('xp').textContent=score*10;document.getElementById('mt').textContent=score+' / '+quiz.length;document.getElementById('fill').style.width=(score/quiz.length*100)+'%';check.disabled=true;next.disabled=false;if(i===quiz.length-1)next.textContent='Finish Skill →'};next.onclick=()=>{if(i<quiz.length-1){i++;next.textContent='Next Question →';render()}else{q.textContent='🏆 Velocity Complete!';o.innerHTML='';check.style.display='none';next.style.display='none';fb.className='feedback good';fb.textContent='Skill complete. '+score+' / '+quiz.length+' correct • '+score*10+' XP'}};render()})();</script></body></html>
