<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SkillUp Physics | Vernier Reading Practice</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.opt.selected{border-color:#5146a5;background:#f4f1ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.opt:disabled{cursor:default}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>📏 Vernier Reading Practice</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="action">CHECK</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['A vernier calipers has 1 main scale division = 1 mm and 10 vernier divisions = 9 mm. What is its least count?',['1 mm','0.9 mm','0.1 mm','0.01 mm'],2,'LC = 1 MSD − 1 VSD = 1 − 0.9 = 0.1 mm.'],['If the main scale reading is 2.3 cm and the 6th vernier division coincides, with LC = 0.01 cm, the reading is:',['2.30 cm','2.36 cm','2.06 cm','2.60 cm'],1,'Reading = MSR + (coinciding division × LC) = 2.3 + 6×0.01 = 2.36 cm.'],['A vernier calipers has LC = 0.01 cm. Main scale reading is 4.2 cm and the 7th vernier division coincides. The reading is:',['4.27 cm','4.20 cm','4.70 cm','4.07 cm'],0,'Reading = 4.2 + 7×0.01 = 4.27 cm.'],['A vernier calipers has LC = 0.1 mm. Main scale reading is 15 mm and the 4th vernier division coincides. The reading is:',['15.04 mm','15.4 mm','15.40 mm','19 mm'],1,'Reading = 15 + 4×0.1 = 15.4 mm.'],['If the 8th vernier division coincides with a main scale mark and LC is 0.01 cm, the vernier contribution is:',['0.008 cm','0.08 cm','0.8 cm','8 cm'],1,'Vernier contribution = 8 × 0.01 = 0.08 cm.'],['The main scale reading is 3.5 cm, the 5th vernier division coincides, and LC is 0.01 cm. The observed reading is:',['3.05 cm','3.50 cm','3.55 cm','4.00 cm'],2,'Observed reading = 3.5 + 5×0.01 = 3.55 cm.'],['A positive zero error means that when the jaws are closed, the instrument reads:',['Zero','A positive value','A negative value only','The maximum value'],1,'A positive zero error occurs when the instrument shows a positive reading for zero length.'],['If the zero error is +0.02 cm and the observed reading is 5.36 cm, the corrected reading is:',['5.38 cm','5.36 cm','5.34 cm','5.32 cm'],2,'Corrected reading = observed reading − positive zero error = 5.36 − 0.02 = 5.34 cm.'],['If the zero error is −0.03 cm and the observed reading is 2.47 cm, the corrected reading is:',['2.44 cm','2.47 cm','2.50 cm','2.53 cm'],2,'Corrected reading = observed reading − (−0.03) = 2.50 cm.'],['A vernier calipers has 20 vernier divisions equal to 19 main scale divisions, each 1 mm. Its least count is:',['1 mm','0.95 mm','0.05 mm','0.5 mm'],2,'1 VSD = 19/20 mm = 0.95 mm; LC = 1 − 0.95 = 0.05 mm.'],['Which part of a vernier calipers is used to measure internal diameter?',['External jaws','Internal jaws','Depth rod','Main scale only'],1,'The smaller upper jaws are used for internal diameter measurements.'],['Which part of a vernier calipers is used to measure depth?',['Internal jaws','External jaws','Depth rod','Vernier scale only'],2,'The depth rod extends from the end of the calipers and is used for depth measurements.'],['For an external diameter measurement, the object should be held between the:',['Internal jaws','External jaws','Depth rod','Lock screw'],1,'The larger lower jaws, called external jaws, measure external dimensions.'],['A reading has MSR = 12 mm, vernier coincidence = 3, LC = 0.1 mm, and zero error = 0.2 mm. The corrected reading is:',['12.1 mm','12.3 mm','11.9 mm','12.5 mm'],0,'Observed reading = 12 + 3×0.1 = 12.3 mm. Corrected = 12.3 − 0.2 = 12.1 mm.'],['A reading has MSR = 20 mm, vernier coincidence = 5, LC = 0.1 mm, and zero error = −0.2 mm. The corrected reading is:',['20.3 mm','20.5 mm','20.7 mm','19.8 mm'],2,'Observed reading = 20 + 5×0.1 = 20.5 mm. Corrected = 20.5 − (−0.2) = 20.7 mm.']];let i=0,score=0,answered=false,selected=-1;const $=x=>document.getElementById(x);function render(){answered=false;selected=-1;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q[1].map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('action').classList.remove('hide');$('action').textContent='CHECK'});$('xp').textContent='';$('action').classList.add('hide');$('action').disabled=false;}function check(){if(selected<0)return;if(!answered){answered=true;const q=qs[i],ok=selected===q[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===selected&&!ok)b.classList.add('wrong')});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[3];if(ok)score++;$('score').textContent=`XP ${score}`;$('fill').style.width=`${(i+1)/15*100}%`;$('action').textContent=i===14?'FINISH':'Next Question →';return;}if(i<14){i++;render()}else{$('quiz').innerHTML='';$('action').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('action').onclick=check;render();</script></body></html>
