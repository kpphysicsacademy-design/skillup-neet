<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Visible Light</title><meta name="description" content="SkillUp Physics Visible Light interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🌈</span><h1>Visible Light</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["Visible light is a type of:",["Electromagnetic radiation","Mechanical wave","Sound wave","Matter wave only"],0,"Visible light is electromagnetic radiation that can be detected by the human eye."],["The approximate wavelength range of visible light is:",["400–700 nm","1–10 m","10–100 μm","0.001–0.01 nm"],0,"Visible light is commonly taken as roughly 400 to 700 nanometres, with exact limits depending on convention."],["Which colour of visible light has the longest wavelength?",["Violet","Blue","Green","Red"],3,"Red light has the longest wavelength in the visible range."],["Which colour has the highest frequency among visible colours?",["Red","Yellow","Green","Violet"],3,"Frequency increases as wavelength decreases, so violet has the highest frequency in the visible range."],["In vacuum, all visible colours travel at approximately:",["3×10⁸ m/s","3×10⁶ m/s","3×10⁴ m/s","3×10¹⁰ m/s"],0,"All electromagnetic waves travel at approximately 3×10⁸ m/s in vacuum."],["The relation between speed c, frequency f and wavelength λ for light in vacuum is:",["c=fλ","c=f/λ","c=λ/f","c=f+λ"],0,"The wave relation is c=fλ."],["White light can be dispersed into colours by a prism because different colours have different:",["Wavelengths and refractive indices in the material","Masses only","Electric charges","Speeds in vacuum"],0,"Different wavelengths generally experience different refractive indices in a dispersive material, producing separation of colours."],["A rainbow is primarily produced by:",["Dispersion, refraction and internal reflection of sunlight in water droplets","Only diffraction by clouds","Nuclear reactions in air","Magnetic fields from Earth"],0,"Rainbows involve refraction, dispersion and internal reflection of sunlight in raindrops."],["Which visible colour is scattered most strongly by small atmospheric molecules?",["Red","Orange","Green","Violet/blue region","Yellow"],3,"Shorter wavelengths in the blue-violet region are scattered more strongly than longer wavelengths by small atmospheric molecules."],["The apparent colour of an opaque object mainly depends on the light it:",["Reflects toward the observer","Absorbs completely","Emits as sound","Converts into gravity"],0,"An object appears coloured according to wavelengths of visible light that reach the eye from it, often by reflection."],["When white light passes from air into glass, its speed generally:",["Decreases","Increases above c","Becomes zero","Remains exactly unchanged"],0,"Light travels more slowly in glass than in vacuum because glass has refractive index greater than one."],["When light enters glass from air, its frequency:",["Remains unchanged","Always doubles","Becomes zero","Changes randomly"],0,"The frequency of light is determined by its source and remains unchanged at a boundary; wavelength and speed change."],["A convex lens can form a real image because it:",["Converges light rays","Always blocks light","Produces sound waves","Reflects every ray backward"],0,"A converging convex lens can bring rays to a focus and form a real image for suitable object positions."],["Which phenomenon demonstrates the wave nature of visible light through superposition of coherent waves?",["Interference","Radioactivity","Evaporation","Nuclear fusion"],0,"Interference is a wave phenomenon resulting from superposition of coherent light waves."],["Which statement about visible light is correct?",["It is electromagnetic radiation and can travel through vacuum","It requires air to propagate","It is a mechanical longitudinal wave","It travels slower than sound in vacuum"],0,"Visible light is electromagnetic radiation and can propagate through vacuum at the speed of light."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
