<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillUp Physics | Voltmeter</title>
  <meta name="description" content="SkillUp Physics Voltmeter interactive practice lesson with 15 MCQs.">
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --text:#14213d;
      --muted:#5d687d;
      --border:#d5deeb;
      --track:#e5eaf2;
      --selected:#eef5ff;
      --selected-border:#c7d8ee;
      --button:#182238;
      --button-hover:#10182a;
      --correct:#eaf8ef;
      --correct-border:#8bc79d;
      --incorrect:#fff0f0;
      --incorrect-border:#e3a0a0;
      --radius:12px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding:32px 16px;
    }

    .quiz-card{
      width:min(650px,100%);
      background:var(--card);
      border-radius:20px;
      box-shadow:0 10px 28px rgba(20,33,61,.09);
      padding:22px 20px 20px;
    }

    .lesson-header{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      margin-bottom:18px;
    }
    .lesson-icon{font-size:30px;line-height:1}
    .lesson-title{
      margin:0;
      font-size:28px;
      line-height:1.2;
      font-weight:750;
      letter-spacing:-.4px;
      text-align:center;
    }

    .status-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
      font-size:14px;
      font-weight:750;
    }

    .progress-track{
      width:100%;
      height:9px;
      border-radius:999px;
      background:var(--track);
      overflow:hidden;
      margin-bottom:22px;
    }
    .progress-fill{
      width:0%;
      height:100%;
      border-radius:999px;
      background:var(--text);
      transition:width .3s ease;
    }

    .question{
      margin:0 0 16px;
      font-size:18px;
      line-height:1.45;
      font-weight:700;
      color:#101b31;
    }

    .options{
      display:grid;
      gap:9px;
    }
    .option{
      width:100%;
      min-height:45px;
      border:1.5px solid var(--border);
      border-radius:var(--radius);
      background:#fff;
      color:#1b2942;
      padding:11px 13px;
      text-align:left;
      font:inherit;
      font-size:14px;
      cursor:pointer;
      transition:background .15s ease,border-color .15s ease,transform .08s ease;
    }
    .option:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}
    .option:active:not(:disabled){transform:scale(.995)}
    .option.selected{background:var(--selected);border-color:var(--selected-border)}
    .option.correct{background:var(--correct);border-color:var(--correct-border)}
    .option.incorrect{background:var(--incorrect);border-color:var(--incorrect-border)}
    .option:disabled{cursor:default}

    .feedback{
      min-height:22px;
      margin:11px 2px 0;
      font-size:13px;
      font-weight:700;
    }
    .feedback.correct-text{color:#28753f}
    .feedback.incorrect-text{color:#a13b3b}

    .next-button,.restart-button,.back-button{
      width:100%;
      min-height:41px;
      border:0;
      border-radius:11px;
      padding:10px 14px;
      font:inherit;
      font-size:14px;
      font-weight:750;
      cursor:pointer;
    }
    .next-button,.restart-button{
      margin-top:12px;
      background:var(--button);
      color:#fff;
    }
    .next-button:hover,.restart-button:hover{background:var(--button-hover)}
    .next-button:disabled{opacity:.45;cursor:not-allowed}

    .back-button{
      display:flex;
      justify-content:center;
      align-items:center;
      margin-top:16px;
      background:var(--button);
      color:#fff;
      text-decoration:none;
    }
    .back-button:hover{background:var(--button-hover)}

    .result{text-align:center;padding:10px 0 2px}
    .result-icon{font-size:42px;margin-bottom:5px}
    .result h2{margin:0 0 8px;font-size:24px}
    .result p{margin:5px 0;color:var(--muted);font-size:14px;line-height:1.5}
    .score-line{font-size:18px!important;font-weight:750;color:var(--text)!important;margin-top:12px!important}

    @media (max-width:600px){
      body{padding:14px 10px}
      .quiz-card{padding:19px 15px 16px;border-radius:17px}
      .lesson-title{font-size:23px}
      .lesson-icon{font-size:26px}
      .question{font-size:17px}
      .option{font-size:15px;min-height:48px}
    }
  </style>
</head>
<body>
  <main class="quiz-card" aria-live="polite">
    <header class="lesson-header">
      <span class="lesson-icon" aria-hidden="true">⚡</span>
      <h1 class="lesson-title">Voltmeter</h1>
    </header>

    <section id="quizView">
      <div class="status-row">
        <span id="questionCounter">Question 1/15</span>
        <span id="xpCounter">XP 0</span>
      </div>

      <div class="progress-track" aria-label="Quiz progress">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <p class="question" id="questionText"></p>
      <div class="options" id="options" role="group" aria-label="Answer choices"></div>
      <div class="feedback" id="feedback" aria-live="assertive"></div>
      <button class="next-button" id="nextButton" type="button" disabled>Next</button>
    </section>

    <section id="resultView" class="result" hidden>
      <div class="result-icon" aria-hidden="true">🏆</div>
      <h2>Lesson Complete!</h2>
      <p class="score-line" id="scoreLine"></p>
      <p id="xpLine"></p>
      <button class="restart-button" id="restartButton" type="button">Practice Again</button>
    </section>

    <a class="back-button" href="full-physics-path.html">← Back to Physics Path</a>
  </main>

  <script>
    const questions = [
      {
        q:"A voltmeter is used to measure:",
        options:["Electric current","Potential difference","Electrical resistance only","Electric power"],
        answer:1,
        explanation:"A voltmeter measures the potential difference (voltage) between two points."
      },
      {
        q:"A voltmeter is connected in a circuit:",
        options:["In series","In parallel","Only across the battery terminal internally","In any way"],
        answer:1,
        explanation:"It is connected in parallel across the two points whose potential difference is required."
      },
      {
        q:"An ideal voltmeter has:",
        options:["Zero resistance","Very low resistance","Infinite resistance","Resistance equal to the load"],
        answer:2,
        explanation:"An ideal voltmeter has infinite resistance so it draws no current from the circuit."
      },
      {
        q:"A practical voltmeter should have resistance that is:",
        options:["Very high","Very low","Zero","Exactly 1 Ω"],
        answer:0,
        explanation:"High resistance minimizes the current drawn by the measuring instrument."
      },
      {
        q:"A voltmeter connected in series with a circuit will generally:",
        options:["Measure voltage accurately","Act like a short circuit","Greatly reduce the circuit current","Increase current to infinity"],
        answer:2,
        explanation:"Its high resistance in series can greatly reduce the circuit current, so this is not the normal connection."
      },
      {
        q:"The SI unit measured by a voltmeter is:",
        options:["Ampere","Ohm","Volt","Coulomb"],
        answer:2,
        explanation:"Potential difference is measured in volts (V)."
      },
      {
        q:"To measure the potential difference across a resistor, the voltmeter should be connected:",
        options:["Across the resistor","In series before the resistor","Only to the positive terminal","Across the switch only"],
        answer:0,
        explanation:"The voltmeter terminals are placed across the component."
      },
      {
        q:"For a moving-coil voltmeter, a high resistance is usually added in series to:",
        options:["Increase current through the coil","Limit current through the meter movement","Make the meter a short circuit","Remove the magnetic field"],
        answer:1,
        explanation:"A series multiplier resistance limits the current through the sensitive meter movement."
      },
      {
        q:"If a voltmeter has a very low resistance, connecting it across a source can cause:",
        options:["Almost no current","A large current draw","Infinite voltage","No change in the circuit"],
        answer:1,
        explanation:"Low resistance across a voltage source can draw a large current and disturb the circuit."
      },
      {
        q:"The positive terminal of a DC voltmeter is normally connected to the point at:",
        options:["Lower potential","Higher potential","Zero potential only","Any random potential"],
        answer:1,
        explanation:"For a positive reading, the positive meter terminal is connected to the higher-potential point."
      },
      {
        q:"A digital voltmeter generally has input resistance that is:",
        options:["Very high","Exactly zero","Always 1 Ω","Lower than a copper wire"],
        answer:0,
        explanation:"Digital voltmeters commonly have high input impedance, reducing loading of the circuit."
      },
      {
        q:"A voltmeter of range 0–10 V is connected to a 6 V source. The expected reading is closest to:",
        options:["0 V","3 V","6 V","10 V"],
        answer:2,
        explanation:"A correctly connected meter on the 0–10 V range reads approximately 6 V."
      },
      {
        q:"A voltmeter should ideally draw:",
        options:["No current","Maximum current","The same current as the load","Exactly 1 A"],
        answer:0,
        explanation:"Infinite input resistance in the ideal case means zero current through the voltmeter."
      },
      {
        q:"The loading effect of a voltmeter is reduced when its internal resistance is:",
        options:["Decreased","Increased","Made zero","Made equal to zero voltage"],
        answer:1,
        explanation:"Higher input resistance draws less current and therefore causes less loading."
      },
      {
        q:"A voltmeter measures potential difference between:",
        options:["Two points","One point only","Three batteries only","Only a resistor and ground"],
        answer:0,
        explanation:"Voltage is a difference in electric potential between two points."
      }
    ];

    let current=0;
    let score=0;
    let xp=0;
    let answered=false;

    const questionCounter=document.getElementById('questionCounter');
    const xpCounter=document.getElementById('xpCounter');
    const progressFill=document.getElementById('progressFill');
    const questionText=document.getElementById('questionText');
    const optionsEl=document.getElementById('options');
    const feedback=document.getElementById('feedback');
    const nextButton=document.getElementById('nextButton');
    const quizView=document.getElementById('quizView');
    const resultView=document.getElementById('resultView');
    const scoreLine=document.getElementById('scoreLine');
    const xpLine=document.getElementById('xpLine');
    const restartButton=document.getElementById('restartButton');

    function renderQuestion(){
      answered=false;
      const item=questions[current];
      questionCounter.textContent=`Question ${current+1}/${questions.length}`;
      xpCounter.textContent=`XP ${xp}`;
      progressFill.style.width=`${(current/questions.length)*100}%`;
      questionText.textContent=item.q;
      optionsEl.innerHTML='';
      feedback.textContent='';
      feedback.className='feedback';
      nextButton.disabled=true;
      nextButton.textContent=current===questions.length-1?'Finish':'Next';

      item.options.forEach((text,index)=>{
        const button=document.createElement('button');
        button.type='button';
        button.className='option';
        button.textContent=`${String.fromCharCode(65+index)}. ${text}`;
        button.addEventListener('click',()=>selectAnswer(index));
        optionsEl.appendChild(button);
      });
    }

    function selectAnswer(index){
      if(answered) return;
      answered=true;
      const item=questions[current];
      const buttons=[...optionsEl.querySelectorAll('.option')];
      buttons.forEach(button=>button.disabled=true);
      buttons[index].classList.add('selected');

      if(index===item.answer){
        score++;
        xp+=10;
        buttons[index].classList.remove('selected');
        buttons[index].classList.add('correct');
        feedback.textContent=`Correct! ${item.explanation}`;
        feedback.classList.add('correct-text');
      }else{
        buttons[index].classList.remove('selected');
        buttons[index].classList.add('incorrect');
        buttons[item.answer].classList.add('correct');
        feedback.textContent=`Not quite. ${item.explanation}`;
        feedback.classList.add('incorrect-text');
      }
      xpCounter.textContent=`XP ${xp}`;
      nextButton.disabled=false;
    }

    function next(){
      if(!answered) return;
      if(current<questions.length-1){
        current++;
        renderQuestion();
      }else{
        progressFill.style.width='100%';
        quizView.hidden=true;
        resultView.hidden=false;
        scoreLine.textContent=`Score: ${score}/${questions.length}`;
        xpLine.textContent=`XP earned: ${xp}`;
      }
    }

    function restart(){
      current=0;
      score=0;
      xp=0;
      resultView.hidden=true;
      quizView.hidden=false;
      renderQuestion();
    }

    nextButton.addEventListener('click',next);
    restartButton.addEventListener('click',restart);
    renderQuestion();
  </script>
</body>
</html>
