<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>

<script>
(function(){
'use strict';
const questions = [{"q":"A general sinusoidal progressive wave travelling in the +x direction can be written as…","o":["y = A sin(kx + ωt + φ)","y = A sin(kx − ωt + φ)","y = A sin(x + t) only","y = A sin(kω)"],"a":1,"e":"For a wave travelling in the +x direction, the standard phase is kx − ωt + φ."},{"q":"In y = A sin(kx − ωt + φ), the symbol y denotes…","o":["Particle displacement","Wave speed","Frequency","Wavelength"],"a":0,"e":"y is the instantaneous displacement of a particle at position x and time t."},{"q":"In the equation y = A sin(kx − ωt + φ), A represents…","o":["Wave number","Amplitude","Angular frequency","Phase difference"],"a":1,"e":"A is the maximum magnitude of the displacement from equilibrium."},{"q":"In a wave equation, the wave number k equals…","o":["2π/λ","λ/2π","2πf","1/T"],"a":0,"e":"The phase changes by 2π over one wavelength, so k = 2π/λ."},{"q":"The angular frequency ω is equal to…","o":["2π/T","T/2π","2πλ","kλ"],"a":0,"e":"Angular frequency is ω = 2π/T = 2πf."},{"q":"For y = A sin(kx − ωt), the wave travels in which direction?","o":["Negative x direction","Positive x direction","Both directions equally","It does not travel"],"a":1,"e":"The constant-phase condition kx − ωt = constant moves toward increasing x as time increases."},{"q":"For y = A sin(kx + ωt), the wave travels in which direction?","o":["Positive x direction","Negative x direction","Only vertically","No direction"],"a":1,"e":"The constant-phase condition kx + ωt = constant moves toward decreasing x as time increases."},{"q":"The wave speed expressed using ω and k is…","o":["ωk","ω/k","k/ω","ω + k"],"a":1,"e":"Wave speed v = ω/k because ω = 2πf and k = 2π/λ."},{"q":"A wave has wavelength 2 m. Its wave number is…","o":["π rad/m","2π rad/m","4π rad/m","π/2 rad/m"],"a":0,"e":"k = 2π/λ = 2π/2 = π rad/m."},{"q":"A wave has frequency 5 Hz. Its angular frequency is…","o":["5π rad/s","10π rad/s","π/5 rad/s","2.5 rad/s"],"a":1,"e":"ω = 2πf = 2π × 5 = 10π rad/s."},{"q":"A wave equation is y = 0.03 sin(4x − 20t), using SI units. The amplitude is…","o":["0.03 m","4 m","20 m","5 m"],"a":0,"e":"The coefficient of the sine function is the amplitude, 0.03 m."},{"q":"For y = 0.03 sin(4x − 20t), the wave number is…","o":["0.03 rad/m","4 rad/m","20 rad/s","5 rad/m"],"a":1,"e":"The coefficient of x in the phase is k = 4 rad/m."},{"q":"For y = 0.03 sin(4x − 20t), the angular frequency is…","o":["4 rad/s","20 rad/s","0.03 rad/s","5 rad/s"],"a":1,"e":"The coefficient of t in the phase has magnitude ω = 20 rad/s."},{"q":"For y = 0.03 sin(4x − 20t), the wave speed is…","o":["0.2 m/s","5 m/s","16 m/s","80 m/s"],"a":1,"e":"v = ω/k = 20/4 = 5 m/s."},{"q":"For a sinusoidal wave, the wavelength can be calculated from k using…","o":["λ = 2πk","λ = k/2π","λ = 2π/k","λ = 1/k²"],"a":2,"e":"Rearranging k = 2π/λ gives λ = 2π/k."},{"q":"For a sinusoidal wave, the frequency can be calculated from ω using…","o":["f = 2πω","f = ω/(2π)","f = 1/ω²","f = ωT"],"a":1,"e":"Since ω = 2πf, frequency is f = ω/(2π)."},{"q":"At a fixed position x, the wave equation y = A sin(kx − ωt) describes…","o":["Sinusoidal oscillation with time","A fixed displacement for all time","Motion only along x","A wave with zero frequency"],"a":0,"e":"At fixed x, kx is constant and displacement varies sinusoidally with time."},{"q":"At a fixed instant t, the wave equation describes how displacement varies with…","o":["Position x","Only mass","Only temperature","The number of particles"],"a":0,"e":"Holding time constant makes y a sinusoidal function of position x."},{"q":"In y = A sin(kx − ωt + φ), φ is the…","o":["Initial phase constant","Wave speed","Wavelength","Particle mass"],"a":0,"e":"φ is a phase offset that sets the wave's phase at the chosen origin and reference time."},{"q":"Two points separated by distance Δx in a sinusoidal wave have spatial phase difference magnitude…","o":["kΔx","ωΔx","Δx/k","ω/k"],"a":0,"e":"The spatial phase difference is Δφ = kΔx = 2πΔx/λ."},{"q":"Two points one wavelength apart have phase difference…","o":["π/2","π","2π","0.5π"],"a":2,"e":"Δφ = kλ = (2π/λ)λ = 2π radians, equivalent to being in phase."},{"q":"A wave equation has phase 6x − 12t. What is the wave speed?","o":["0.5 m/s","2 m/s","6 m/s","72 m/s"],"a":1,"e":"Here k = 6 rad/m and ω = 12 rad/s, so v = ω/k = 12/6 = 2 m/s."},{"q":"A wave travels at 15 m/s and has frequency 3 Hz. Its wavelength is…","o":["5 m","12 m","18 m","45 m"],"a":0,"e":"λ = v/f = 15/3 = 5 m."},{"q":"A wave has a period of 0.25 s. Its angular frequency is…","o":["2π rad/s","4π rad/s","8π rad/s","π/4 rad/s"],"a":2,"e":"ω = 2π/T = 2π/0.25 = 8π rad/s."},{"q":"If y = A sin(kx − ωt), the dimensions of k are…","o":["m","s","rad/m","m/s"],"a":2,"e":"The product kx must be dimensionless (phase in radians), so k has units rad/m."},{"q":"The SI unit of angular frequency ω is…","o":["metre","radian per second","hertz per metre","metre per second"],"a":1,"e":"Angular frequency is measured in radians per second (rad/s)."},{"q":"The SI unit of wave number k is…","o":["m/s","s⁻¹","m⁻¹ (often rad/m)","kg/m"],"a":2,"e":"Wave number is phase per unit length, so its unit is m⁻¹ or rad/m."},{"q":"If the amplitude A doubles but k and ω remain unchanged, the wave speed…","o":["Doubles","Halves","Remains unchanged","Becomes zero"],"a":2,"e":"Wave speed v = ω/k depends on frequency and wavelength, not on amplitude in the usual linear-wave model."},{"q":"If both ω and k double, the ratio ω/k and therefore wave speed…","o":["Doubles","Halves","Remains unchanged","Becomes four times larger"],"a":2,"e":"The new ratio is 2ω/2k = ω/k, so the speed remains the same."},{"q":"Which expression relates wave speed, frequency, and wavelength?","o":["v = fλ","v = f/λ","v = λ/f²","v = f + λ"],"a":0,"e":"A wave advances one wavelength in one period, giving v = λf."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
const wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Wave Equation Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
