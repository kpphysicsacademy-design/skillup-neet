.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}

<main>
<section class="hero"><h1>〰️ Wave Frequency</h1><p class="muted">Master frequency, period, angular frequency, and numerical wave problems with 30 questions and explanations.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>

<script>
(function(){
'use strict';
const questions = [{"q":"Wave frequency is the number of complete cycles passing a point per:","o":["Metre","Second","Wavelength","Wave speed"],"a":1,"e":"Frequency is the number of cycles per second."},{"q":"The SI unit of frequency is:","o":["Second","Metre","Hertz","Metre per second"],"a":2,"e":"One hertz equals one cycle per second."},{"q":"Frequency is commonly represented by:","o":["λ","T","f","A"],"a":2,"e":"The symbol f is commonly used for frequency."},{"q":"The relationship between frequency f and period T is:","o":["f = T","f = 1/T","f = 2T","f = T²"],"a":1,"e":"Frequency and period are reciprocals: f = 1/T."},{"q":"A wave has a period of 0.5 s. Its frequency is:","o":["0.5 Hz","1 Hz","2 Hz","5 Hz"],"a":2,"e":"f = 1/T = 1/0.5 = 2 Hz."},{"q":"A wave has frequency 40 Hz. Its period is:","o":["40 s","4 s","0.025 s","0.25 s"],"a":2,"e":"T = 1/f = 1/40 = 0.025 s."},{"q":"A source produces 120 oscillations in 4 seconds. Its frequency is:","o":["30 Hz","120 Hz","480 Hz","0.033 Hz"],"a":0,"e":"f = number of oscillations/time = 120/4 = 30 Hz."},{"q":"A wave has frequency 8 Hz. How many cycles pass a point in 5 seconds?","o":["13","40","8","0.625"],"a":1,"e":"Number of cycles = f × time = 8 × 5 = 40."},{"q":"If the frequency of a wave doubles while its speed stays constant, its wavelength:","o":["Doubles","Halves","Remains unchanged","Becomes zero"],"a":1,"e":"From v = fλ, wavelength is inversely proportional to frequency at fixed speed."},{"q":"If a wave's frequency remains fixed but its speed doubles, wavelength:","o":["Halves","Doubles","Remains unchanged","Becomes four times smaller"],"a":1,"e":"Since λ = v/f, wavelength doubles when speed doubles at fixed frequency."},{"q":"A wave has speed 300 m/s and wavelength 6 m. Its frequency is:","o":["50 Hz","1800 Hz","306 Hz","0.02 Hz"],"a":0,"e":"f = v/λ = 300/6 = 50 Hz."},{"q":"A wave has frequency 25 Hz and wavelength 4 m. Its speed is:","o":["6.25 m/s","29 m/s","100 m/s","200 m/s"],"a":2,"e":"v = fλ = 25 × 4 = 100 m/s."},{"q":"The angular frequency ω is related to ordinary frequency by:","o":["ω = f/2π","ω = 2πf","ω = 1/f","ω = 2f"],"a":1,"e":"One cycle corresponds to 2π radians, so ω = 2πf."},{"q":"If frequency is 5 Hz, the angular frequency is:","o":["5π rad/s","10π rad/s","2.5π rad/s","π/5 rad/s"],"a":1,"e":"ω = 2πf = 2π × 5 = 10π rad/s."},{"q":"A wave has angular frequency 20π rad/s. Its frequency is:","o":["10 Hz","20 Hz","40 Hz","20π Hz"],"a":0,"e":"f = ω/(2π) = 20π/(2π) = 10 Hz."},{"q":"Which factor determines the frequency of a steady wave emitted by a source?","o":["The source's oscillation rate","Amplitude alone","Wavelength alone","The observer's distance only"],"a":0,"e":"The source oscillation rate sets the emitted frequency."},{"q":"When a wave enters another medium, its frequency generally:","o":["Changes randomly","Remains the same","Always doubles","Becomes zero"],"a":1,"e":"The source fixes frequency across a boundary; speed and wavelength can change."},{"q":"A wave has period 4 milliseconds. Its frequency is:","o":["4 Hz","40 Hz","250 Hz","4000 Hz"],"a":2,"e":"4 ms = 0.004 s, so f = 1/0.004 = 250 Hz."},{"q":"A pendulum completes 15 oscillations in 30 seconds. Its frequency is:","o":["0.5 Hz","2 Hz","15 Hz","450 Hz"],"a":0,"e":"f = 15/30 = 0.5 Hz."},{"q":"A periodic motion has frequency 0.2 Hz. Its period is:","o":["0.2 s","2 s","5 s","10 s"],"a":2,"e":"T = 1/f = 1/0.2 = 5 s."},{"q":"Which statement is correct?","o":["Higher frequency means a longer period","Frequency and period are inversely related","Frequency is measured in metres","Period is measured in hertz"],"a":1,"e":"Since f = 1/T, increasing frequency decreases period."},{"q":"Two waves travel at the same speed. Wave A has frequency 10 Hz and wave B has frequency 20 Hz. Compared with A, wave B has:","o":["Twice the wavelength","Half the wavelength","The same wavelength","Four times the wavelength"],"a":1,"e":"At fixed speed, λ = v/f, so doubling frequency halves wavelength."},{"q":"A wave completes 90 cycles in 3 seconds. Its frequency is:","o":["30 Hz","90 Hz","270 Hz","0.033 Hz"],"a":0,"e":"f = 90/3 = 30 Hz."},{"q":"A wave has frequency 60 Hz. The number of cycles in 0.25 s is:","o":["15","60","240","0.0042"],"a":0,"e":"Cycles = f × time = 60 × 0.25 = 15."},{"q":"Which quantity is measured in radians per second?","o":["Frequency f","Period T","Angular frequency ω","Wavelength λ"],"a":2,"e":"Angular frequency has SI unit rad/s."},{"q":"A wave has angular frequency 8π rad/s. Its period is:","o":["4 s","0.25 s","0.5 s","8π s"],"a":1,"e":"ω = 2π/T, so T = 2π/(8π) = 0.25 s."},{"q":"A sound source vibrates at 500 Hz. In 2 ms, how many cycles occur?","o":["0.5","1","2","250"],"a":1,"e":"2 ms = 0.002 s; cycles = 500 × 0.002 = 1."},{"q":"If a source doubles its oscillation frequency in the same medium, sound wavelength generally:","o":["Doubles","Halves","Remains unchanged","Becomes infinite"],"a":1,"e":"Sound speed is approximately fixed by the medium, so λ = v/f halves when frequency doubles."},{"q":"Frequency describes the rate of:","o":["Energy loss only","Complete oscillations","Spatial distance only","Maximum displacement"],"a":1,"e":"Frequency counts complete oscillations or cycles per unit time."},{"q":"A wave has frequency 12 Hz and speed 36 m/s. Its wavelength is:","o":["3 m","24 m","48 m","432 m"],"a":0,"e":"λ = v/f = 36/12 = 3 m."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Wave Frequency Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
