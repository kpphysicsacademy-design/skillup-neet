.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}

<section class="hero"><h1>🔥 Wave Motion</h1><p class="muted">Explore wave propagation, wave properties, and numerical problems with 30 questions and concise explanations.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>

<script>
(function(){
'use strict';
const questions = [{"q":"Wave motion primarily transfers:","o":["Energy from one place to another","Matter permanently from source to destination","Rest mass at the wave speed","The medium as a whole over long distances"],"a":0,"e":"A wave transfers energy and information; particles of the medium generally oscillate around equilibrium."},{"q":"In a mechanical wave, the medium's particles usually:","o":["Oscillate about equilibrium positions","Travel with the wave over long distances","Remain permanently displaced","Move only in circles in every wave"],"a":0,"e":"Mechanical-wave particles oscillate locally as the disturbance propagates."},{"q":"Which type of wave requires a material medium?","o":["Mechanical wave","Electromagnetic wave","Light in vacuum","Radio wave in vacuum"],"a":0,"e":"Mechanical waves need a medium whose particles or fields provide the restoring interactions."},{"q":"Sound in air is generally a:","o":["Longitudinal mechanical wave","Transverse electromagnetic wave","Longitudinal electromagnetic wave","Wave that travels in vacuum"],"a":0,"e":"Sound in air propagates through compressions and rarefactions parallel to the direction of travel."},{"q":"A transverse wave has particle oscillations that are:","o":["Perpendicular to the direction of propagation","Parallel to the direction of propagation only","Always circular","Absent everywhere"],"a":0,"e":"In a transverse wave, the oscillation direction is perpendicular to the wave's travel direction."},{"q":"A longitudinal wave has particle oscillations that are:","o":["Parallel to the direction of propagation","Perpendicular to the direction of propagation","Always vertical","Unrelated to wave travel"],"a":0,"e":"Longitudinal waves involve compressions and rarefactions along the propagation direction."},{"q":"The distance between two successive crests of a periodic transverse wave is its:","o":["Wavelength","Amplitude","Period","Frequency"],"a":0,"e":"Wavelength is the distance between nearest points in the same phase, such as crest to crest."},{"q":"The number of complete oscillations per second is called:","o":["Frequency","Wavelength","Amplitude","Wave speed"],"a":0,"e":"Frequency is measured in hertz and counts cycles per second."},{"q":"The SI unit of frequency is:","o":["Hertz (Hz)","Metre (m)","Second (s)","Metre per second (m/s)"],"a":0,"e":"One hertz equals one cycle per second."},{"q":"The relation among wave speed v, frequency f and wavelength λ is:","o":["v = fλ","v = f/λ","v = λ/f","v = f + λ"],"a":0,"e":"During one period, a wave advances one wavelength, giving v = λ/T = fλ."},{"q":"A wave has frequency 5 Hz and wavelength 2 m. Its speed is:","o":["10 m/s","2.5 m/s","7 m/s","0.4 m/s"],"a":0,"e":"v = fλ = 5 × 2 = 10 m/s."},{"q":"A wave travels at 12 m/s with frequency 4 Hz. Its wavelength is:","o":["3 m","48 m","8 m","0.33 m"],"a":0,"e":"λ = v/f = 12/4 = 3 m."},{"q":"If the period of a wave is 0.02 s, its frequency is:","o":["50 Hz","0.02 Hz","2 Hz","20 Hz"],"a":0,"e":"f = 1/T = 1/0.02 = 50 Hz."},{"q":"The time taken for one complete oscillation is the:","o":["Period","Wavelength","Amplitude","Wave number"],"a":0,"e":"Period T is the time for one full cycle; T = 1/f."},{"q":"The maximum displacement of a particle from its equilibrium position is the:","o":["Amplitude","Wavelength","Frequency","Wave speed"],"a":0,"e":"Amplitude measures the maximum local displacement of the oscillating particle."},{"q":"For a wave moving in the same medium with unchanged properties, if frequency doubles, its wavelength:","o":["Halves","Doubles","Remains unchanged","Becomes four times larger"],"a":0,"e":"With wave speed fixed, λ = v/f; doubling f halves λ."},{"q":"When a wave enters another medium, which quantity is usually fixed by the source across the boundary?","o":["Frequency","Wavelength","Wave speed","Amplitude in all circumstances"],"a":0,"e":"The oscillation frequency remains set by the source; speed and wavelength can change with medium."},{"q":"A wave's amplitude is doubled while frequency and medium stay unchanged. Its speed:","o":["Remains unchanged in the linear-wave model","Doubles","Halves","Becomes zero"],"a":0,"e":"Wave speed is set by medium properties, not by amplitude for ordinary linear waves."},{"q":"A wave travels 24 m in 3 s. Its speed is:","o":["8 m/s","72 m/s","21 m/s","0.125 m/s"],"a":0,"e":"Speed = distance/time = 24/3 = 8 m/s."},{"q":"A wave has wavelength 0.5 m and speed 20 m/s. Its frequency is:","o":["40 Hz","10 Hz","0.025 Hz","20.5 Hz"],"a":0,"e":"f = v/λ = 20/0.5 = 40 Hz."},{"q":"In a sound wave, a compression is a region of:","o":["Higher-than-average pressure and density","Zero pressure","Lower-than-average density only","No particle motion anywhere"],"a":0,"e":"Compressions are regions where particles are closer together, raising pressure and density."},{"q":"In a sound wave, a rarefaction is a region of:","o":["Lower-than-average pressure and density","Maximum pressure and density","Permanent vacuum in every case","Maximum particle displacement at all times"],"a":0,"e":"Rarefactions are regions where particles are farther apart and pressure is lower."},{"q":"Which statement about wave speed and particle speed is correct?","o":["They are different concepts; particles oscillate while the disturbance propagates","They must always be equal","Particle speed is always zero","Wave speed must be zero in a medium"],"a":0,"e":"Wave speed describes propagation of the disturbance; particle velocity describes local oscillation."},{"q":"A periodic wave has frequency 25 Hz. Its period is:","o":["0.04 s","25 s","0.25 s","4 s"],"a":0,"e":"T = 1/f = 1/25 = 0.04 s."},{"q":"The wavelength of a wave is 6 m and its period is 2 s. Its speed is:","o":["3 m/s","12 m/s","8 m/s","0.33 m/s"],"a":0,"e":"v = λ/T = 6/2 = 3 m/s."},{"q":"Which is an example of an electromagnetic wave?","o":["Visible light","Sound in air","A compression pulse in a slinky","A water wave"],"a":0,"e":"Visible light is electromagnetic and can propagate through vacuum."},{"q":"Which wave can propagate through vacuum?","o":["Electromagnetic wave","Sound wave in air","Wave on a stretched string","Water surface wave"],"a":0,"e":"Electromagnetic waves do not require a material medium."},{"q":"A wave pulse reaches a point 15 m away in 5 s. The propagation speed is:","o":["3 m/s","75 m/s","10 m/s","0.33 m/s"],"a":0,"e":"v = distance/time = 15/5 = 3 m/s."},{"q":"For a sinusoidal travelling wave, points separated by one full wavelength have a phase difference of:","o":["2π radians","π/2 radians","π radians","Zero displacement difference only at all times but no phase relation"],"a":0,"e":"A full wavelength corresponds to one complete cycle, or 2π radians of phase."},{"q":"For a sinusoidal travelling wave, points separated by half a wavelength have a phase difference of:","o":["π radians","2π radians","π/4 radians","Zero radians"],"a":0,"e":"A half wavelength corresponds to half a cycle, giving a phase difference of π radians."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Wave Motion Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
