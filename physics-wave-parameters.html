<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Wave Parameters</title><style>
body{font-family:Arial,sans-serif;background:#f3f7ff;margin:0;color:#1e293b}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(30,41,59,.10);border:1px solid #e2e8f0}h1{text-align:center;color:#334155}.meta{display:flex;justify-content:space-between;font-weight:700;color:#475569}.bar{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#22c55e;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;color:#172033}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe4f0;border-radius:14px;background:#fff;color:#1e293b;font-size:16px;cursor:pointer;transition:.2s}.opt:hover{background:#eef5ff;border-color:#93c5fd;transform:translateY(-1px)}.correct{border-color:#16a34a!important;background:#ecfdf3!important;color:#166534!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important;color:#991b1b!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#4f46e5;color:#fff}.back{background:#334155;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#d97706;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🌊 Wave Parameters</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>
const qs=[
['Which quantity describes the maximum displacement of a particle from its equilibrium position?','Wavelength','Amplitude','Frequency','Period',1,'Amplitude A is the maximum displacement from the equilibrium position.'],
['The wavelength of a periodic wave is the distance between two successive points that are','at different frequencies','in the same phase','always at rest','at maximum speed',1,'Wavelength is the spatial distance between successive points having the same phase, such as crest to crest.'],
['The SI unit of frequency is','second','metre','hertz','radian',2,'Frequency is measured in hertz (Hz), equivalent to cycles per second.'],
['The SI unit of wavelength is','metre','hertz','second','m/s',0,'Wavelength is a length, so its SI unit is metre (m).'],
['The relation between frequency f and time period T is','f=T','f=1/T','f=T²','f=T/2',1,'Frequency is the reciprocal of time period: f=1/T.'],
['The wave-speed relation is','v=fλ','v=f/λ','v=λ/f','v=f+λ',0,'For a periodic wave, wave speed is v=fλ.'],
['A wave has frequency 5 Hz and wavelength 2 m. Its speed is','2.5 m/s','7 m/s','10 m/s','25 m/s',2,'Using v=fλ, v=5×2=10 m/s.'],
['If the frequency of a wave is doubled while its speed remains constant, its wavelength','doubles','halves','remains unchanged','becomes four times',1,'Since λ=v/f, doubling f at constant v makes λ half.'],
['If wavelength is doubled while frequency remains constant, wave speed','halves','doubles','remains unchanged','becomes zero',1,'From v=fλ, doubling λ at fixed f doubles the wave speed.'],
['The angular frequency ω is related to frequency f by','ω=f/2π','ω=2πf','ω=π/f','ω=f+2π',1,'Angular frequency is ω=2πf rad/s.'],
['The wave number k is related to wavelength by','k=λ/2π','k=2π/λ','k=fλ','k=1/f',1,'Wave number is k=2π/λ.'],
['A wave has time period 0.25 s. Its frequency is','0.25 Hz','2 Hz','4 Hz','25 Hz',2,'Using f=1/T, f=1/0.25=4 Hz.'],
['A wave has wavelength 0.5 m and frequency 20 Hz. Its speed is','10 m/s','20 m/s','40 m/s','0.025 m/s',0,'Using v=fλ, v=20×0.5=10 m/s.'],
['Which parameter is determined by the source of a wave and normally remains unchanged when the wave enters another medium?','Frequency','Wavelength','Wave speed','Amplitude only',0,'The source fixes the frequency. On entering another medium, speed and wavelength can change while frequency remains the same.'],
['For a sinusoidal wave, the phase difference between two points separated by one wavelength is','0','π/2','π','2π',3,'One wavelength corresponds to one complete cycle, so the phase difference is 2π radians (equivalent to 0 modulo 2π).']
];
let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
