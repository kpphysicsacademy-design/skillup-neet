.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:14px;line-height:1.5}.feedback.show{display:block}.feedback.good{background:#efffe7;border:2px solid #c8f0b2}.feedback.bad{background:#fff0f0;border:2px solid #ffcaca}
.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;min-height:48px;border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:900;cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}.continue{display:none;background:var(--blue);color:#fff;box-shadow:0 4px 0 #1596d0}.continue.show{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
@media(max-width:480px){main{padding:12px 10px 34px}.hero,.quiz,.finish{padding:15px;border-radius:18px}.option{font-size:14px;padding:11px}.question{font-size:21px}}

<section class="hero"><h1>🌊 Wave Speed</h1><p class="muted">Practice wave speed formulas, numerical problems, medium dependence, and transverse waves on strings with 30 questions and explanations.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>

<script>
(function(){
'use strict';
const questions = [{"q":"Wave speed is the distance travelled by a wave per unit:","o":["Mass","Time","Frequency","Amplitude"],"a":1,"e":"Speed is distance divided by elapsed time."},{"q":"The SI unit of wave speed is:","o":["m/s","m","Hz","s"],"a":0,"e":"Wave speed is a distance per time, measured in metres per second."},{"q":"The relation among wave speed v, frequency f and wavelength λ is:","o":["v = fλ","v = f/λ","v = λ/f","v = f + λ"],"a":0,"e":"A wave travels one wavelength during each period, giving v = fλ."},{"q":"A wave has frequency 5 Hz and wavelength 2 m. Its speed is:","o":["2.5 m/s","7 m/s","10 m/s","0.4 m/s"],"a":2,"e":"v = fλ = 5 × 2 = 10 m/s."},{"q":"A wave travels at 24 m/s with frequency 8 Hz. Its wavelength is:","o":["3 m","16 m","32 m","192 m"],"a":0,"e":"λ = v/f = 24/8 = 3 m."},{"q":"A wave travels at 15 m/s and has wavelength 5 m. Its frequency is:","o":["3 Hz","5 Hz","10 Hz","75 Hz"],"a":0,"e":"f = v/λ = 15/5 = 3 Hz."},{"q":"A wave covers 100 m in 4 s. Its speed is:","o":["25 m/s","96 m/s","104 m/s","400 m/s"],"a":0,"e":"v = distance/time = 100/4 = 25 m/s."},{"q":"In a uniform medium, wave speed is mainly determined by:","o":["The properties of the medium","Amplitude alone","The observer's height","The number of crests drawn"],"a":0,"e":"Wave speed depends on the medium's physical properties and the type of wave."},{"q":"If frequency doubles in the same medium and wave speed remains constant, wavelength:","o":["Doubles","Halves","Remains unchanged","Becomes zero"],"a":1,"e":"From λ = v/f, wavelength halves when frequency doubles at fixed speed."},{"q":"If wavelength doubles in the same medium, frequency (with speed fixed):","o":["Doubles","Halves","Stays the same","Becomes four times"],"a":1,"e":"Since f = v/λ, doubling wavelength halves frequency at fixed speed."},{"q":"A sound wave travels at 340 m/s and has frequency 170 Hz. Its wavelength is:","o":["0.5 m","2 m","170 m","510 m"],"a":1,"e":"λ = v/f = 340/170 = 2 m."},{"q":"A wave has wavelength 0.8 m and frequency 25 Hz. Its speed is:","o":["20 m/s","31.25 m/s","0.032 m/s","25.8 m/s"],"a":0,"e":"v = fλ = 25 × 0.8 = 20 m/s."},{"q":"A wave has period 0.25 s and wavelength 3 m. Its speed is:","o":["0.75 m/s","3 m/s","12 m/s","1.33 m/s"],"a":2,"e":"f = 1/T = 4 Hz; v = fλ = 4 × 3 = 12 m/s."},{"q":"A wave has speed 12 m/s and period 0.5 s. Its wavelength is:","o":["6 m","12 m","24 m","0.5 m"],"a":0,"e":"λ = vT = 12 × 0.5 = 6 m."},{"q":"When a wave enters a new medium, which property generally stays the same?","o":["Frequency","Wave speed","Wavelength","Amplitude in every case"],"a":0,"e":"The source sets the frequency; speed and wavelength may change in the new medium."},{"q":"Which statement about wave speed and amplitude is generally true for a linear wave?","o":["Speed doubles if amplitude doubles","Speed is independent of amplitude","Speed equals amplitude per second","Speed must be zero at maximum amplitude"],"a":1,"e":"In the linear-wave model, speed is set by medium properties rather than amplitude."},{"q":"The speed of a wave on a stretched string is given by:","o":["v = √(T/μ)","v = Tμ","v = μ/T","v = T/μ"],"a":0,"e":"For an ideal stretched string, v = √(T/μ), where T is tension and μ is mass per unit length."},{"q":"For a string with fixed linear density, if tension becomes four times larger, wave speed becomes:","o":["Half as large","Twice as large","Four times as large","Unchanged"],"a":1,"e":"Since v = √(T/μ), quadrupling tension doubles speed."},{"q":"For fixed tension, if the string's linear mass density becomes four times larger, speed becomes:","o":["Four times larger","Twice as large","Half as large","Unchanged"],"a":2,"e":"Since v = √(T/μ), quadrupling μ halves the speed."},{"q":"A string has tension 100 N and linear density 0.01 kg/m. Wave speed is:","o":["10 m/s","100 m/s","1000 m/s","1 m/s"],"a":1,"e":"v = √(T/μ) = √(100/0.01) = √10000 = 100 m/s."},{"q":"A wave travels at 60 m/s and has frequency 12 Hz. Its wavelength is:","o":["5 m","48 m","72 m","0.2 m"],"a":0,"e":"λ = v/f = 60/12 = 5 m."},{"q":"A wave has wavelength 2.5 m and speed 50 m/s. Its frequency is:","o":["20 Hz","125 Hz","47.5 Hz","0.05 Hz"],"a":0,"e":"f = v/λ = 50/2.5 = 20 Hz."},{"q":"A wave travels 360 m in 12 s. How far does it travel in 5 s at the same speed?","o":["30 m","150 m","180 m","72 m"],"a":1,"e":"Speed = 360/12 = 30 m/s; distance in 5 s = 30 × 5 = 150 m."},{"q":"For a periodic wave, wave speed can also be written as:","o":["λ/T","T/λ","λ + T","1/(λT)"],"a":0,"e":"Because f = 1/T, v = fλ = λ/T."},{"q":"A wave has speed 18 m/s and frequency 3 Hz. Its wavelength is:","o":["6 m","15 m","21 m","54 m"],"a":0,"e":"λ = v/f = 18/3 = 6 m."},{"q":"Which is a correct conversion for 72 km/h?","o":["10 m/s","20 m/s","25 m/s","72 m/s"],"a":1,"e":"72 km/h × (1000 m/3600 s) = 20 m/s."},{"q":"Which factor increases wave speed on an ideal stretched string?","o":["Increasing tension","Increasing linear density only","Reducing tension","Increasing wavelength only"],"a":0,"e":"The string-wave speed v = √(T/μ) rises with tension."},{"q":"Two waves have the same frequency but different wavelengths in different media. Which has the greater speed?","o":["The one with longer wavelength","The one with shorter wavelength","Both must have equal speed","Cannot compare without amplitude"],"a":0,"e":"At equal frequency, v = fλ, so the longer-wavelength wave has greater speed."},{"q":"A wave travels at 300 m/s with wavelength 0.75 m. Its frequency is:","o":["225 Hz","400 Hz","300.75 Hz","0.0025 Hz"],"a":1,"e":"f = v/λ = 300/0.75 = 400 Hz."},{"q":"A wave has frequency 50 Hz and period 0.02 s. If its speed is 10 m/s, its wavelength is:","o":["0.2 m","2 m","5 m","500 m"],"a":0,"e":"λ = v/f = 10/50 = 0.2 m."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Wave Speed Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
