<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp Physics | Wave Speed</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f7ff;margin:0;color:#1e293b}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(30,41,59,.10);border:1px solid #e2e8f0}h1{text-align:center;color:#334155}.meta{display:flex;justify-content:space-between;font-weight:700;color:#475569}.bar{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#22c55e;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;color:#172033}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe4f0;border-radius:14px;background:#fff;color:#1e293b;font-size:16px;cursor:pointer;transition:.2s}.opt:hover{background:#eef5ff;border-color:#93c5fd;transform:translateY(-1px)}.opt:focus-visible{outline:3px solid #bfdbfe;outline-offset:2px}.correct{border-color:#16a34a!important;background:#ecfdf3!important;color:#166534!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important;color:#991b1b!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s}.next,.retry{background:#4f46e5;color:#fff}.next:hover,.retry:hover{background:#4338ca}.back{background:#334155;color:#fff}.back:hover{background:#1e293b}.hide{display:none}.xp{text-align:center;font-weight:700;color:#d97706;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>🌊 Wave Speed</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a>
</div></div>
<script>
const qs=[
['The basic relation for wave speed is','v=f/λ','v=fλ','v=λ/f','v=f+λ',1,'Wave speed is the product of frequency and wavelength: v=fλ.'],
['The SI unit of wave speed is','m','m/s','Hz','s',1,'Speed is distance divided by time, so its SI unit is metre per second (m/s).'],
['A wave has frequency 5 Hz and wavelength 2 m. Its speed is','2.5 m/s','7 m/s','10 m/s','25 m/s',2,'v=fλ=5×2=10 m/s.'],
['A wave travels at 20 m/s with wavelength 4 m. Its frequency is','4 Hz','5 Hz','16 Hz','80 Hz',1,'f=v/λ=20/4=5 Hz.'],
['A wave travels at 12 m/s with frequency 3 Hz. Its wavelength is','0.25 m','3 m','4 m','36 m',2,'λ=v/f=12/3=4 m.'],
['If frequency is doubled while wavelength remains constant, wave speed','becomes half','doubles','becomes four times','is unchanged',1,'From v=fλ, if λ is constant, doubling f doubles v.'],
['If wavelength is doubled while frequency remains constant, wave speed','becomes half','doubles','becomes four times','is unchanged',1,'From v=fλ, if f is constant, doubling λ doubles v.'],
['For a wave travelling in a fixed medium, if frequency doubles, wavelength generally','doubles','halves','remains the same','becomes four times',1,'For a fixed medium the wave speed is approximately fixed, so λ=v/f; doubling f halves λ.'],
['When a wave enters a different medium, which quantity is normally fixed by the source?','speed','wavelength','frequency','amplitude',2,'The source determines frequency. Speed and wavelength may change in the new medium.'],
['A wave has time period 0.25 s and wavelength 3 m. Its speed is','0.75 m/s','3 m/s','12 m/s','75 m/s',2,'f=1/T=4 Hz, so v=fλ=4×3=12 m/s.'],
['A wave has angular frequency 10π rad/s and wavelength 0.4 m. Its speed is','1 m/s','2 m/s','4 m/s','20 m/s',1,'f=ω/(2π)=5 Hz, so v=fλ=5×0.4=2 m/s.'],
['A wave travels at 30 m/s and has frequency 10 Hz. Its wavelength is','0.3 m','3 m','20 m','300 m',1,'λ=v/f=30/10=3 m.'],
['For a wave with constant speed, if wavelength becomes one-fourth, frequency becomes','one-fourth','one-half','four times','unchanged',2,'Since f=v/λ at constant speed, reducing λ to one-fourth makes f four times larger.'],
['Which pair has the same physical dimensions?','wave speed and frequency','wave speed and wavelength','wave speed and velocity','frequency and time period',2,'Wave speed and velocity both have dimensions of length per time.'],
['Which statement is correct for a periodic wave?','v=fλ','v=f/λ in every case','frequency is always equal to speed','wavelength has unit hertz',0,'The fundamental wave relation connecting speed, frequency and wavelength is v=fλ.']
];
let i=0,score=0,answered=false;const $=x=>document.getElementById(x);
function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}
function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}
function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}
$('next').onclick=next;render();
</script></body></html>
