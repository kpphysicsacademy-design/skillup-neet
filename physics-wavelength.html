<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Wavelength</title><style>
body{font-family:Arial,sans-serif;background:#f3f7ff;margin:0;color:#1e293b}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(30,41,59,.10);border:1px solid #e2e8f0}h1{text-align:center;color:#334155}.meta{display:flex;justify-content:space-between;font-weight:700;color:#475569}.bar{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#22c55e;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px;color:#172033}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe4f0;border-radius:14px;background:#fff;color:#1e293b;font-size:16px;cursor:pointer;transition:.2s}.opt:hover{background:#eef5ff;border-color:#93c5fd;transform:translateY(-1px)}.correct{border-color:#16a34a!important;background:#ecfdf3!important;color:#166534!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important;color:#991b1b!important}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#4f46e5;color:#fff}.back{background:#334155;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#d97706;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>〰️ Wavelength</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="next">Next Question →</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>
const qs=[
['Wavelength is the distance between two successive points of a wave that are','at different frequencies','in the same phase','always at rest','moving at maximum speed',1,'Wavelength λ is the distance between successive points in the same phase, such as crest to crest.'],
['The SI unit of wavelength is','second','hertz','metre','m/s',2,'Wavelength is a length, so its SI unit is metre (m).'],
['The symbol commonly used for wavelength is','λ','ν','ω','T',0,'The Greek letter lambda (λ) is used for wavelength.'],
['The distance between two successive crests of a sinusoidal wave is','amplitude','wavelength','frequency','time period',1,'Successive crests are separated by one wavelength.'],
['The distance between two successive compressions in a longitudinal wave is','λ/2','λ','2λ','λ/4',1,'Successive compressions are one wavelength apart.'],
['The relation between wave speed v, frequency f and wavelength λ is','v=f/λ','v=λ/f','v=fλ','v=f+λ',2,'The fundamental wave relation is v=fλ.'],
['A wave has frequency 5 Hz and wavelength 2 m. Its speed is','2.5 m/s','7 m/s','10 m/s','25 m/s',2,'Using v=fλ, v=5×2=10 m/s.'],
['If wave speed remains constant and frequency is doubled, wavelength','doubles','halves','remains unchanged','becomes four times',1,'Since λ=v/f, doubling frequency at constant speed halves the wavelength.'],
['If wave speed remains constant and wavelength is doubled, frequency','doubles','halves','remains unchanged','becomes four times',1,'From f=v/λ, doubling wavelength at fixed speed halves the frequency.'],
['A wave has time period 0.25 s and speed 4 m/s. Its wavelength is','0.25 m','1 m','4 m','16 m',1,'Using λ=vT, λ=4×0.25=1 m.'],
['A phase difference of 2π radians corresponds to a spatial separation of','λ/4','λ/2','λ','2λ',2,'One complete cycle has a phase change of 2π and corresponds to one wavelength.'],
['A phase difference of π radians in a sinusoidal wave corresponds to a separation of','λ/4','λ/2','λ','2λ',1,'A phase difference of π corresponds to half a wavelength.'],
['A wave has frequency 20 Hz and wavelength 0.5 m. Its speed is','5 m/s','10 m/s','20 m/s','40 m/s',1,'Using v=fλ, v=20×0.5=10 m/s.'],
['When a wave enters another medium, its frequency is generally','changed by the medium','unchanged because it is fixed by the source','always doubled','always halved',1,'The source determines frequency; speed and wavelength may change when the medium changes.'],
['If the frequency of a wave is 10 Hz and its speed is 30 m/s, its wavelength is','0.3 m','3 m','10 m','300 m',1,'Using λ=v/f, λ=30/10=3 m.']
];
let i=0,score=0,answered=false;const $=x=>document.getElementById(x);function render(){answered=false;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q.slice(1,5).map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.n));$('next').classList.add('hide');$('xp').textContent='';}function answer(n){if(answered)return;answered=true;const q=qs[i],ok=n===q[5];document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q[5])b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong');b.disabled=true});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[6];if(ok)score++;$('score').textContent=`XP ${score}`;$('next').classList.remove('hide');}function next(){if(i<14){i++;render()}else{$('quiz').innerHTML='';$('next').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`;}}$('next').onclick=next;render();</script></body></html>
