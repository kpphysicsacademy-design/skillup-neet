<script>
(function(){
'use strict';
const questions = [{"q":"Wavelength is the distance between two nearest points that are:","o":["Always stationary","In the same phase","At maximum displacement only","Moving in opposite directions"],"a":1,"e":"One wavelength is the spatial distance for one complete cycle, between corresponding points such as crest to crest."},{"q":"The usual symbol for wavelength is:","o":["f","T","λ","ω"],"a":2,"e":"The Greek letter lambda (λ) commonly denotes wavelength."},{"q":"The SI unit of wavelength is:","o":["Hertz","Second","Metre","Metre per second"],"a":2,"e":"Wavelength is a length and is measured in metres."},{"q":"The distance between two consecutive crests is:","o":["Amplitude","Wavelength","Period","Frequency"],"a":1,"e":"Successive crests are one wavelength apart."},{"q":"The distance between two adjacent troughs is:","o":["λ/2","λ","2λ","λ/4"],"a":1,"e":"Adjacent troughs are corresponding points one wavelength apart."},{"q":"In a longitudinal wave, the distance between two successive compressions is:","o":["Amplitude","Wavelength","Period","Wave height"],"a":1,"e":"Successive compressions are separated by one wavelength."},{"q":"The distance from a crest to the adjacent trough in a sinusoidal wave is:","o":["λ/4","λ/2","λ","2λ"],"a":1,"e":"A crest and its nearest trough are half a wavelength apart."},{"q":"Wave speed, frequency and wavelength are related by:","o":["v = fλ","v = f/λ","v = λ/f","v = f + λ"],"a":0,"e":"Wave speed equals frequency multiplied by wavelength."},{"q":"A wave has frequency 5 Hz and wavelength 2 m. Its speed is:","o":["2.5 m/s","7 m/s","10 m/s","0.4 m/s"],"a":2,"e":"v = fλ = 5 × 2 = 10 m/s."},{"q":"A wave travels at 24 m/s and has frequency 8 Hz. Its wavelength is:","o":["3 m","16 m","32 m","192 m"],"a":0,"e":"λ = v/f = 24/8 = 3 m."},{"q":"A wave travels at 15 m/s and has wavelength 5 m. Its frequency is:","o":["3 Hz","5 Hz","10 Hz","75 Hz"],"a":0,"e":"f = v/λ = 15/5 = 3 Hz."},{"q":"If wave speed remains constant and frequency doubles, wavelength:","o":["Doubles","Halves","Stays the same","Becomes four times"],"a":1,"e":"Since λ = v/f, wavelength is inversely proportional to frequency at constant speed."},{"q":"If frequency remains constant and wave speed doubles, wavelength:","o":["Halves","Doubles","Stays the same","Becomes zero"],"a":1,"e":"From λ = v/f, doubling speed at fixed frequency doubles wavelength."},{"q":"A wave has period 0.2 s and speed 10 m/s. Its wavelength is:","o":["2 m","5 m","10.2 m","50 m"],"a":0,"e":"λ = vT = 10 × 0.2 = 2 m."},{"q":"Which statement about wavelength is correct?","o":["It is the maximum particle displacement","It is the distance for one complete spatial cycle","It is cycles per second","It is time for one oscillation"],"a":1,"e":"Wavelength measures spatial periodicity, not displacement amplitude or time."},{"q":"The wavenumber magnitude k is defined as:","o":["k = 2π/λ","k = λ/2π","k = 2πf","k = 1/T"],"a":0,"e":"Angular wavenumber is k = 2π/λ and has units rad/m."},{"q":"If wavelength is 2 m, the wavenumber k is:","o":["π rad/m","2π rad/m","4π rad/m","π/2 rad/m"],"a":0,"e":"k = 2π/λ = 2π/2 = π rad/m."},{"q":"A wavelength of 0.5 m corresponds to a wavenumber:","o":["π rad/m","2π rad/m","4π rad/m","0.5π rad/m"],"a":2,"e":"k = 2π/0.5 = 4π rad/m."},{"q":"Two points separated by one wavelength in a travelling periodic wave have phase difference:","o":["0 rad modulo 2π","π/2","π","π/4"],"a":0,"e":"A separation λ corresponds to 2π radians, so the points are in phase."},{"q":"Two points separated by λ/4 have phase difference:","o":["π/4","π/2","π","2π"],"a":1,"e":"Δφ = 2πΔx/λ = 2π(1/4) = π/2."},{"q":"A wave has wavelength 4 m. The distance covering three complete wavelengths is:","o":["4 m","8 m","12 m","16 m"],"a":2,"e":"Three wavelengths span 3 × 4 = 12 m."},{"q":"A periodic wave has 10 crests passing a fixed point over 2 seconds. If each crest corresponds to one cycle, frequency is:","o":["5 Hz","10 Hz","20 Hz","0.2 Hz"],"a":0,"e":"Frequency = cycles/time = 10/2 = 5 Hz."},{"q":"When a wave enters another medium, its frequency stays fixed. If its speed decreases, its wavelength:","o":["Increases","Decreases","Does not change","Becomes infinite"],"a":1,"e":"Because λ = v/f and frequency remains fixed, lower speed means shorter wavelength."},{"q":"A sound wave in air has speed 340 m/s and frequency 170 Hz. Its wavelength is:","o":["0.5 m","2 m","170 m","510 m"],"a":1,"e":"λ = v/f = 340/170 = 2 m."},{"q":"A wave has wavelength 0.8 m and frequency 25 Hz. Its speed is:","o":["20 m/s","31.25 m/s","0.032 m/s","25.8 m/s"],"a":0,"e":"v = fλ = 25 × 0.8 = 20 m/s."},{"q":"Which change alone does not necessarily change wavelength if the medium and source frequency stay the same?","o":["Increasing wave amplitude","Changing frequency","Changing medium","Changing wave speed"],"a":0,"e":"In the linear-wave model, amplitude changes do not set wavelength; speed and frequency do."},{"q":"The wavelength of a sinusoidal wave is related to its spatial phase change by:","o":["2π radians per wavelength","π radians per wavelength","1 radian per wavelength","4π radians per wavelength"],"a":0,"e":"One complete spatial cycle corresponds to a phase change of 2π radians."},{"q":"A wave travels 90 m in 3 s and has frequency 6 Hz. Its wavelength is:","o":["2 m","5 m","15 m","30 m"],"a":1,"e":"Speed = 90/3 = 30 m/s; λ = v/f = 30/6 = 5 m."},{"q":"A wave has speed 12 m/s and period 0.25 s. Its wavelength is:","o":["3 m","12 m","48 m","0.25 m"],"a":0,"e":"λ = vT = 12 × 0.25 = 3 m."},{"q":"Which quantity has the same physical dimension as wavelength?","o":["Amplitude","Frequency","Period","Wave speed"],"a":0,"e":"Both wavelength and amplitude are lengths, measured in metres."}];
let index=0,score=0,streak=0,chosen=null,locked=false;
const originalQuestions=questions.slice();
let wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.'; if(window.MathJax?.typesetPromise) MathJax.typesetPromise([f]).catch(()=>{});}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Wavelength Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
