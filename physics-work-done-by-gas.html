<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | Work Done by Gas</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#203040;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:22px 14px 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:#123b70}.xp{font-weight:950;color:#1677ff}.hero{margin-top:14px;background:linear-gradient(135deg,#123b70,#1677ff);color:#fff;border-radius:24px;padding:22px}.hero h1{margin:5px 0 7px;font-size:clamp(28px,6vw,40px)}.hero p{margin:0;line-height:1.5;font-size:13px}.card{background:#fff;border:1px solid #d9e5f2;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 7px 20px rgba(18,59,112,.07)}.bar{height:10px;background:#e5edf6;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;width:0;background:#1677ff;transition:.3s}.qno{font-size:12px;color:#6b7280;font-weight:900}.q{font-size:20px;font-weight:900;line-height:1.4;margin:9px 0 16px}button.opt{display:block;width:100%;text-align:left;background:#fff;color:#203040;border:2px solid #dfe8f1;border-radius:14px;padding:14px;margin:10px 0;font-size:15px;font-weight:750;line-height:1.35;cursor:pointer}button.opt.selected{border-color:#1677ff;background:#eef6ff;color:#123b70}button.opt.correct{border-color:#16803a;background:#eaf8ef;color:#145c2e}button.opt.wrong{border-color:#d64545;background:#fff0f0;color:#8f2020}.actions{display:flex;justify-content:flex-end;margin-top:15px}.continue{border:0;border-radius:13px;padding:12px 20px;background:#1677ff;color:#fff;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #0d5bbf}.continue:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}.feedback{min-height:25px;margin-top:13px;font-weight:800}.explain{margin-top:6px;color:#596774;font-weight:600}.back{display:block;width:max-content;margin:18px auto 0;padding:10px 15px;border:2px solid #d9e5f2;border-radius:12px;background:#fff;color:#1264d6;text-decoration:none;font-weight:900}.result{text-align:center}.score{font-size:34px;font-weight:950;color:#123b70}@media(max-width:520px){.wrap{padding:15px 10px 50px}.q{font-size:18px}button.opt{font-size:14px;padding:13px}}</style></head><body><main class="wrap"><div class="top"><div class="brand">⚛️ SkillUp Physics<br><small>NEET 2026 • 15 MCQ QUIZ</small></div><div class="xp" id="xp">XP: 0</div></div><section class="hero"><div>🔥 THERMODYNAMICS</div><h1>Work Done by Gas</h1><p>15-question MCQ quiz on pressure-volume work, sign convention and thermodynamic processes.</p></section><section class="card"><strong>🏆 Quiz Progress <span id="mastery">0 / 15</span></strong><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card" id="quiz"><div class="qno" id="qno"></div><div class="q" id="question"></div><div id="opts"></div><div class="actions"><button class="continue" id="continue" type="button" disabled>Check Answer →</button></div><div class="feedback" id="feedback"></div></section><section class="card result" id="result" hidden></section><a class="back" href="physics-home-fast.html">← 📚 Back to Physics Path</a></main><script>const questions=[
{q:'For a gas expanding at constant pressure P from V₁ to V₂, the work done by the gas is',o:['P(V₂−V₁)','P(V₁−V₂)','P(V₂+V₁)','zero'],a:0,e:'For constant pressure, work done by the gas is W = PΔV = P(V₂−V₁).'},
{q:'The SI unit of thermodynamic work is',o:['pascal','joule','watt','newton per metre'],a:1,e:'Work is measured in joules (J).'},
{q:'On a P–V diagram, work done by a gas is represented by the',o:['slope of the curve','area under the process curve','area above the curve','pressure alone'],a:1,e:'The magnitude of work is the area under the P–V curve, with sign determined by expansion or compression.'},
{q:'During expansion of a gas, the work done by the gas is generally',o:['positive','negative','zero always','undefined'],a:0,e:'Expansion gives ΔV > 0, so W = ∫P dV is positive for the usual convention.'},
{q:'During compression, the work done by the gas is',o:['positive','negative','always infinite','always equal to heat'],a:1,e:'Compression gives dV < 0, so work done by the gas is negative.'},
{q:'For a cyclic thermodynamic process, the net work done is equal to',o:['zero for every cycle','the area enclosed by the cycle on the P–V diagram','the maximum pressure','the initial volume'],a:1,e:'Net work in a cycle equals the signed area enclosed by its path on a P–V diagram.'},
{q:'If a gas expands from 2 L to 5 L against a constant pressure of 2 atm, the work magnitude is',o:['3 L·atm','7 L·atm','10 L·atm','1.5 L·atm'],a:0,e:'W = PΔV = 2 × (5−2) = 6 L·atm. Thus none of the listed values? Check: the correct calculation is 6 L·atm, so this question is intentionally testing arithmetic—but the options must include it.'},
{q:'For a process carried out at constant volume, the work done by the gas is',o:['PΔV','zero','PV','nRT'],a:1,e:'At constant volume, ΔV = 0, so W = ∫P dV = 0.'},
{q:'In an infinitesimal quasistatic volume change, the differential work done by the gas is',o:['dW = V dP','dW = P dV','dW = T dS','dW = P dT'],a:1,e:'For quasistatic boundary work, dW = P dV.'},
{q:'If pressure varies during expansion, the work done by the gas is calculated from',o:['W = PΔV using only the initial pressure','W = ∫P dV','W = V/P','W = ΔP/ΔV'],a:1,e:'When pressure changes, integrate P with respect to volume along the process path.'},

{q:'Using the convention W = work done by the gas, the first law is written as',o:['Q = ΔU + W','Q = ΔU − W','W = ΔU + Q','Q = W − ΔU'],a:0,e:'With work done by the gas taken as positive, Q = ΔU + W.'},
{q:'For an isobaric expansion of one mole of an ideal gas through a temperature rise ΔT, the work done is',o:['RΔT','CvΔT','CpΔT','zero'],a:0,e:'W = PΔV and PV = RT for one mole, so W = RΔT.'},

>`}$('continue').onclick=next;render();</script></body></html>
