<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Work-Energy Theorem</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:820px;margin:auto;padding:28px 18px 48px}.hero,.card{background:#fff;border-radius:22px;padding:24px;margin:12px 0;box-shadow:0 7px 22px #17203312}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:1.65rem;font-weight:900}.xp{font-weight:900;background:#eef7ff;padding:9px 13px;border-radius:999px}.sub{margin:8px 0 0;color:#52657a}.head{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}.bar{height:11px;background:#e4e9ef;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#58cc02;transition:width .3s}.qnum{font-weight:800;color:#52657a}.q{font-size:1.25rem;font-weight:850;line-height:1.45;margin:15px 0}.opts{display:grid;gap:11px}.opt{border:2px solid #d9e2ea;background:#fff;border-radius:14px;padding:14px;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.15s}.opt:hover{transform:translateY(-2px);border-color:#58cc02}.opt.selected{border-color:#1685e8;background:#eef7ff}.opt.correct{border-color:#58cc02;background:#eaffdf}.opt.wrong{border-color:#e5484d;background:#fff0f0}.feedback{min-height:48px;margin-top:14px;padding:13px;border-radius:14px;line-height:1.5}.good{background:#e5f9e9;color:#176c31}.bad{background:#fff0f0;color:#a12b30}.btn{margin-top:14px;border:0;border-radius:13px;padding:13px 20px;font:inherit;font-weight:850;cursor:pointer;background:#58cc02;color:#fff;box-shadow:0 4px 0 #46a900}.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #46a900}.back{display:inline-block;margin-top:10px;padding:10px 13px;border-radius:12px;color:#5146a5;font-weight:800;text-decoration:none}.back:hover{background:#f0edff;transform:translateX(-2px)}.result{text-align:center;font-size:1.2rem;font-weight:850;line-height:1.7}@media(max-width:600px){.wrap{padding:20px 14px}.hero,.card{padding:18px}.q{font-size:1.12rem}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="wrap"><section class="hero"><div class="top"><div class="title">⚡ Work-Energy Theorem</div><div class="xp"><span id="xp">0</span> XP</div></div><p class="sub">Master the work-energy theorem with 15 NEET-style questions.</p></section><section class="card"><div class="head"><span>🎯 Skill Mastery</span><span id="mastery">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card"><div class="qnum" id="count">Question 1 of 15</div><div class="q" id="question"></div><div class="opts" id="opts"></div><div class="feedback" id="feedback">Choose an answer, then continue.</div><button class="btn" id="continue">Continue →</button></section><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></main><script>const qs=[['The work-energy theorem states that net work done on a body equals its change in:',['kinetic energy','potential energy','momentum','power'],0,'Wnet = ΔK.'],['The SI unit of kinetic energy is:',['joule','watt','newton','pascal'],0,'Kinetic energy is measured in joules.'],['The kinetic energy of a mass m moving at speed v is:',['½mv²','mv','mv²','½mv'],0,'K = ½mv².'],['If net work on a body is positive, its kinetic energy:',['increases','decreases','becomes zero','becomes negative'],0,'Positive net work increases kinetic energy.'],['If net work on a body is negative, its kinetic energy:',['decreases','increases','doubles','is unchanged'],0,'Negative net work reduces kinetic energy.'],['A 2 kg body changes speed from 3 m/s to 5 m/s. The change in kinetic energy is:',['16 J','8 J','25 J','34 J'],0,'ΔK = ½(2)(25−9) = 16 J.'],['A net force does 20 J of work on a body. Its change in kinetic energy is:',['20 J','10 J','40 J','0 J'],0,'By the theorem, ΔK = Wnet = 20 J.'],['If net work on a body is zero, its kinetic energy:',['does not change','must be zero','doubles','becomes negative'],0,'Zero net work means ΔK = 0.'],['In uniform circular motion, the work done by the centripetal force is:',['zero','positive','negative','maximum'],0,'Centripetal force is perpendicular to instantaneous displacement.'],['The work-energy theorem relates the change in kinetic energy to:',['net work of all forces','gravity only','friction only','conservative forces only'],0,'The theorem uses total net work.'],['A body initially at rest receives 50 J net work. Its final kinetic energy is:',['50 J','25 J','100 J','0 J'],0,'Initial kinetic energy is zero, so final kinetic energy is 50 J.'],['If kinetic energy doubles, the speed changes by a factor of:',['√2','2','4','1/2'],0,'Because K is proportional to v², speed changes by √2.'],['The signed area under a force-displacement graph represents:',['work','power','momentum','acceleration'],0,'The area under an F-x graph gives work.'],['Kinetic friction on a sliding body generally does:',['negative work','positive work','zero work always','infinite work'],0,'Kinetic friction opposes sliding motion and removes kinetic energy.'],['The work-energy theorem is especially useful for finding speed changes without explicitly solving for:',['time','mass','density','charge'],0,'It connects force and displacement directly to kinetic-energy change.']];let i=0,selected=null,score=0,checked=false;const $=id=>document.getElementById(id);function render(){selected=null;checked=false;const a=qs[i];$('count').textContent='Question '+(i+1)+' of 15';$('question').textContent=a[0];$('feedback').className='feedback';$('feedback').textContent='Choose an answer, then continue.';$('continue').textContent='Continue →';$('fill').style.width=(i/15*100)+'%';$('opts').innerHTML='';const order=a[1].map((text,index)=>({text,index}));for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}order.forEach((x,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{selected=x.index;[...$('opts').children].forEach(z=>z.classList.remove('selected'));b.classList.add('selected')};$('opts').appendChild(b)})}function check(){if(selected===null){$('feedback').className='feedback bad';$('feedback').textContent='Choose an answer first 👆';return}if(checked){i++;if(i<15)render();else finish();return}checked=true;const a=qs[i],ok=selected===a[2];if(ok)score++;[...$('opts').children].forEach(b=>{const x=Number(b.dataset.index);b.disabled=true;if(x===a[2])b.classList.add('correct');if(x===selected&&!ok)b.classList.add('wrong')});$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').innerHTML=(ok?'🎯 Correct! +10 XP':'✗ Not quite.')+'<br>'+a[3];$('xp').textContent=score*10;$('mastery').textContent=score+' / 15';$('fill').style.width=((i+1)/15*100)+'%';$('continue').textContent=i===14?'Finish Skill →':'Continue →'}function finish(){$('question').textContent='🏆 Work-Energy Theorem Complete!';$('opts').innerHTML='';$('feedback').className='feedback good';$('feedback').textContent='Score: '+score+' / 15 • XP earned: '+score*10+' XP';$('continue').textContent='Retry Skill';$('continue').onclick=()=>{i=0;score=0;render();$('continue').onclick=check}}$('continue').onclick=check;$('back').onclick=function(){const s=sessionStorage.getItem('skillupLastPhysicsPath');if(s){try{const u=new URL(s,location.href);if(u.origin===location.origin){location.href=s;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();</script></body></html>
