<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp | Work-Energy Theorem</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:28px 18px 48px}.head{display:flex;justify-content:space-between;align-items:center;gap:14px}.title{font-size:1.45rem;font-weight:900}.xp{font-weight:900;background:#eaf7ef;color:#197044;border-radius:999px;padding:8px 12px}.sub{margin:7px 0 20px;color:#626b7d}.mastery{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 6px 22px #17203312;margin-bottom:16px}.masteryrow{display:flex;justify-content:space-between;font-weight:850;margin-bottom:10px}.track{height:10px;background:#e8eaf0;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:#35a66f;transition:width .3s}.qcard{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 28px #17203312}.count{font-size:.9rem;font-weight:800;color:#687286}.question{font-size:1.18rem;font-weight:850;line-height:1.5;margin:12px 0 18px}.opts{display:grid;gap:11px}.opt{width:100%;text-align:left;border:2px solid #dfe3ea;background:#fff;border-radius:15px;padding:14px 15px;font:inherit;cursor:pointer;transition:.15s}.opt:hover{transform:translateY(-2px);border-color:#8f96a6;box-shadow:0 5px 12px #17203312}.opt.selected{border-color:#35a66f;background:#f0fbf5}.opt.correct{border-color:#2d9b68;background:#eaf8f1}.opt.wrong{border-color:#d45555;background:#fff0f0;animation:shake .25s}.feedback{min-height:52px;margin-top:16px;padding:13px 14px;border-radius:14px;background:#f4f5f8;line-height:1.5}.btn{margin-top:16px;border:0;border-radius:14px;padding:13px 19px;font:inherit;font-weight:900;cursor:pointer;background:#35a66f;color:#fff;box-shadow:0 4px 0 #23794f;transition:.12s}.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #23794f}.back{display:inline-block;margin-top:20px;color:#4d596d;font-weight:850;text-decoration:none;padding:10px 12px;border-radius:12px;transition:.15s}.back:hover{background:#e9edf3;transform:translateX(-3px)}.result{text-align:center;font-size:1.15rem;font-weight:850;line-height:1.7;padding:12px 0;animation:in .35s}.hint{margin-top:12px;color:#697386;font-size:.92rem}@keyframes in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@media(max-width:600px){.wrap{padding:20px 14px 38px}.qcard{padding:18px}.question{font-size:1.08rem}}
</style>
</head>
<body>
<main class="wrap">
<div class="head"><div class="title">⚡ Work-Energy Theorem</div><div class="xp" id="xp">0 XP</div></div>
<div class="sub">Master the work-energy theorem with 15 NEET-style questions.</div>
<section class="mastery"><div class="masteryrow"><span>🎯 Skill Mastery</span><span><span id="mastery">0</span> / 15</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="qcard"><div id="quiz"></div></section>
<a class="back" id="back" href="physics-home.html">← Back to Physics Path</a>
</main>
<script>
const qs=[
['According to the work-energy theorem, the net work done on a particle equals the change in its:', ['kinetic energy','potential energy','linear momentum','mechanical power'],0,'The theorem gives Wnet = ΔK.'],
['A 4 kg object moves at 3 m/s. Its kinetic energy is:', ['18 J','12 J','36 J','6 J'],0,'K = ½mv² = ½×4×3² = 18 J.'],
['A 2 kg body speeds up from 4 m/s to 6 m/s. The net work done is:', ['20 J','12 J','28 J','10 J'],0,'Wnet = ΔK = ½×2×(36−16) = 20 J.'],
['A 5 kg body initially at rest receives 90 J of net work. Its final speed is:', ['6 m/s','3 m/s','9 m/s','18 m/s'],0,'90 = ½×5×v², so v² = 36 and v = 6 m/s.'],
['A net work of −30 J is done on a body whose initial kinetic energy is 80 J. Its final kinetic energy is:', ['50 J','110 J','30 J','−50 J'],0,'Kf = Ki + Wnet = 80 − 30 = 50 J.'],
['A force-displacement graph has a constant force of 12 N over a displacement of 5 m in the force direction. The work done is:', ['60 J','17 J','2.4 J','30 J'],0,'W = Fs cos0° = 12×5 = 60 J.'],
['A 10 N force acts perpendicular to a displacement of 4 m. The work done by this force is:', ['0 J','40 J','10 J','2.5 J'],0,'W = Fs cos90° = 0.'],
['In uniform circular motion, the work done by the centripetal force over any instantaneous displacement is:', ['zero','positive','negative','equal to the kinetic energy'],0,'Centripetal force is perpendicular to instantaneous displacement, so its work is zero.'],
['A 1 kg object has kinetic energy 32 J. Its speed is:', ['8 m/s','4 m/s','16 m/s','32 m/s'],0,'32 = ½v², giving v² = 64 and v = 8 m/s.'],
['If the speed of a particle is doubled while its mass remains constant, its kinetic energy becomes:', ['four times','two times','half','unchanged'],0,'Because K is proportional to v², doubling speed multiplies K by 4.'],
['A 3 kg body moving at 2 m/s has kinetic energy. If 6 J of net work is added, its final kinetic energy is:', ['12 J','6 J','18 J','24 J'],0,'Initial K = ½×3×2² = 6 J; final K = 6 + 6 = 12 J.'],
['A body is moving at constant speed along a straight horizontal path. The net work done on it is:', ['zero','positive','negative','equal to its kinetic energy'],0,'Constant speed means constant kinetic energy, so ΔK and net work are zero.'],
['A 2 kg block starts from rest and a net work of 16 J is done on it. Its final speed is:', ['4 m/s','2 m/s','8 m/s','16 m/s'],0,'16 = ½×2×v², so v² = 16 and v = 4 m/s.'],
['A 6 kg object changes speed from 5 m/s to 3 m/s. The net work done is:', ['−48 J','48 J','−18 J','18 J'],0,'Wnet = ½×6×(9−25) = −48 J.'],
['The work-energy theorem is especially useful for finding a change in speed when the known information directly gives:', ['net work and initial kinetic energy','only the elapsed time','only the final position','only the object density'],0,'Knowing net work and initial kinetic energy gives the final kinetic energy and hence speed.']
];
let i=0,selected=null,score=0,answered=false;
const $=id=>document.getElementById(id);
function render(){
 selected=null;answered=false;const a=qs[i];
 $('mastery').textContent=score;$('fill').style.width=(score/15*100)+'%';$('xp').textContent=(score*10)+' XP';
 $('quiz').innerHTML='<div class="count">Question '+(i+1)+' of 15</div><div class="question">'+a[0]+'</div><div class="opts" id="opts"></div><div class="feedback" id="feedback">Choose an answer, then continue.</div><button class="btn" id="continue">Continue →</button><div class="hint">💡 Hint: Identify what the question asks and compare each option against the stated conditions.</div>';
 const order=a[1].map((text,index)=>({text,index}));
 for(let k=order.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[order[k],order[r]]=[order[r],order[k]]}
 order.forEach((item,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{if(answered)return;selected=item.index;[...$('opts').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('opts').appendChild(b)});
 $('continue').onclick=check;
}
function check(){
 if(answered){i++;if(i<qs.length)render();else finish();return}
 if(selected===null){$('feedback').textContent='Please choose an answer first.';return}
 answered=true;const a=qs[i],ok=selected===a[2];if(ok)score++;
 [...$('opts').children].forEach(b=>{const x=Number(b.dataset.index);b.disabled=true;if(x===a[2])b.classList.add('correct');if(x===selected&&!ok)b.classList.add('wrong')});
 $('mastery').textContent=score;$('fill').style.width=(score/15*100)+'%';$('xp').textContent=(score*10)+' XP';$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+'<br>'+a[3];
 $('continue').textContent=i<qs.length-1?'Continue →':'Finish Skill →';
}
function finish(){
 $('fill').style.width='100%';$('mastery').textContent=score;$('xp').textContent=(score*10)+' XP';$('quiz').innerHTML='<div class="result">🏆 Skill complete!<br>Score: '+score+'/15 ('+Math.round(score/15*100)+'%)<br>XP earned: '+score*10+' XP</div><button class="btn" onclick="i=0;score=0;render()">Retry Skill</button>';
 localStorage.setItem('skillupPhysicsWorkEnergyTheoremScore',score);
}
function rememberPath(){try{const r=document.referrer;if(r){const u=new URL(r);if(u.origin===location.origin&&(/(?:physics|full-physics)[^/]*path[^/]*\.html$/i.test(u.pathname)||/\/physics-home\.html$/i.test(u.pathname)))sessionStorage.setItem('skillupLastPhysicsPath',u.href)}}catch(e){}}
rememberPath();
$('back').onclick=function(){const s=sessionStorage.getItem('skillupLastPhysicsPath');if(s){try{const u=new URL(s,location.href);if(u.origin===location.origin){location.href=s;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};
render();
</script>
</body>
</html>
