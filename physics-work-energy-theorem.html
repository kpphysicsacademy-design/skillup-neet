.finish{text-align:center;padding:26px 18px}.trophy{font-size:58px}.score{font-size:42px;font-weight:950;color:#174a78}.finish h2{margin:6px 0 10px}.finish .btn{margin-top:16px;max-width:260px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}

.streak{background:#fff0e8;border:1px solid #ffd4bd;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900;color:#b94a17;white-space:nowrap}\n.option:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid #1cb0f6;outline-offset:3px}\n.option{min-height:56px;line-height:1.4}\n.feedback{font-weight:650}\n@media(max-width:480px){.nav{gap:7px}.xp,.streak{padding:6px 8px;font-size:11px}.streak{max-width:100px}}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>⚡ Work-Energy Theorem</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
  {
    "q": "The work–energy theorem states that the net work done on an object equals its change in:",
    "o": [
      "Kinetic energy",
      "Potential energy only",
      "Momentum",
      "Power"
    ],
    "a": 0,
    "e": "Wnet = ΔK, so net work equals final kinetic energy minus initial kinetic energy."
  },
  {
    "q": "What is the formula for kinetic energy of a body of mass m moving at speed v?",
    "o": [
      "mv²",
      "½mv²",
      "mv",
      "½mv"
    ],
    "a": 1,
    "e": "K = ½mv²."
  },
  {
    "q": "A 2 kg object speeds up from 3 m/s to 5 m/s. What is its change in kinetic energy?",
    "o": [
      "8 J",
      "16 J",
      "25 J",
      "34 J"
    ],
    "a": 1,
    "e": "ΔK = ½m(v² − u²) = ½ × 2 × (25 − 9) = 16 J."
  },
  {
    "q": "A net force does 12 J of work on an object. Its kinetic energy changes by:",
    "o": [
      "6 J",
      "12 J",
      "24 J",
      "0 J"
    ],
    "a": 1,
    "e": "By the work–energy theorem, ΔK = Wnet = 12 J."
  },
  {
    "q": "If the net work on an object is negative, its kinetic energy:",
    "o": [
      "Increases",
      "Decreases",
      "Must be zero",
      "Cannot change"
    ],
    "a": 1,
    "e": "Negative net work means ΔK is negative, so kinetic energy decreases."
  },
  {
    "q": "If the net work on an object is zero, its kinetic energy:",
    "o": [
      "Must be zero",
      "Does not change",
      "Doubles",
      "Becomes negative"
    ],
    "a": 1,
    "e": "Zero net work gives ΔK = 0; the kinetic energy remains unchanged."
  },
  {
    "q": "A 4 kg body starts from rest and receives 72 J of net work. Its final speed is:",
    "o": [
      "3 m/s",
      "6 m/s",
      "9 m/s",
      "12 m/s"
    ],
    "a": 1,
    "e": "½mv² = 72, so 2v² = 72, v² = 36 and v = 6 m/s."
  },
  {
    "q": "A 1 kg object has its speed increased from 2 m/s to 6 m/s. Net work done is:",
    "o": [
      "8 J",
      "16 J",
      "18 J",
      "32 J"
    ],
    "a": 1,
    "e": "Wnet = ΔK = ½ × 1 × (36 − 4) = 16 J."
  },
  {
    "q": "A 3 kg object moving at 4 m/s is brought to rest. The net work done is:",
    "o": [
      "+24 J",
      "−24 J",
      "+12 J",
      "−12 J"
    ],
    "a": 1,
    "e": "ΔK = 0 − ½ × 3 × 16 = −24 J."
  },
  {
    "q": "A 5 N force acts in the direction of motion over 4 m. If it is the only force doing work, the work is:",
    "o": [
      "9 J",
      "20 J",
      "1.25 J",
      "0 J"
    ],
    "a": 1,
    "e": "W = Fs = 5 × 4 = 20 J."
  },
  {
    "q": "A 10 N force acts opposite to displacement over 3 m. Its work is:",
    "o": [
      "+30 J",
      "−30 J",
      "+13 J",
      "0 J"
    ],
    "a": 1,
    "e": "W = Fs cos180° = −10 × 3 = −30 J."
  },
  {
    "q": "Which quantity must be used in the work–energy theorem?",
    "o": [
      "Work by the net force",
      "Work by gravity only",
      "Work by friction only",
      "Work by the largest force only"
    ],
    "a": 0,
    "e": "The theorem relates the change in kinetic energy to the total net work of all forces."
  },
  {
    "q": "A 2 kg body moves at 10 m/s. Its kinetic energy is:",
    "o": [
      "20 J",
      "50 J",
      "100 J",
      "200 J"
    ],
    "a": 2,
    "e": "K = ½ × 2 × 10² = 100 J."
  },
  {
    "q": "If the speed of a body doubles, its kinetic energy becomes:",
    "o": [
      "Twice as large",
      "Four times as large",
      "Half as large",
      "Unchanged"
    ],
    "a": 1,
    "e": "K is proportional to v², so doubling speed multiplies kinetic energy by four."
  },
  {
    "q": "If kinetic energy becomes four times larger while mass stays the same, speed becomes:",
    "o": [
      "Twice as large",
      "Four times as large",
      "Half as large",
      "Unchanged"
    ],
    "a": 0,
    "e": "Since K ∝ v², a fourfold increase in K means speed doubles."
  },
  {
    "q": "In uniform circular motion, the work done by the centripetal force is:",
    "o": [
      "Positive",
      "Negative",
      "Zero",
      "Always equal to kinetic energy"
    ],
    "a": 2,
    "e": "Centripetal force is perpendicular to the instantaneous displacement, so its work is zero."
  },
  {
    "q": "The signed area under a force–displacement graph represents:",
    "o": [
      "Power",
      "Work",
      "Momentum",
      "Acceleration"
    ],
    "a": 1,
    "e": "Work is the integral of force with respect to displacement, represented by signed area under an F–x graph."
  },
  {
    "q": "A body gains 40 J of kinetic energy. The net work done on it is:",
    "o": [
      "−40 J",
      "20 J",
      "40 J",
      "80 J"
    ],
    "a": 2,
    "e": "The work–energy theorem gives Wnet = ΔK = +40 J."
  },
  {
    "q": "A body loses 15 J of kinetic energy. The net work done on it is:",
    "o": [
      "+15 J",
      "−15 J",
      "0 J",
      "−30 J"
    ],
    "a": 1,
    "e": "A loss of 15 J means ΔK = −15 J, so net work is −15 J."
  },
  {
    "q": "A 2 kg object moving at 4 m/s receives 12 J of net work. Its final speed is:",
    "o": [
      "2 m/s",
      "4 m/s",
      "√28 m/s",
      "√40 m/s"
    ],
    "a": 2,
    "e": "Initial K = ½ × 2 × 16 = 16 J; final K = 28 J, so ½ × 2 × v² = 28 and v = √28 m/s."
  },
  {
    "q": "A 1 kg body starts at rest and reaches 8 m/s. Net work done is:",
    "o": [
      "8 J",
      "16 J",
      "32 J",
      "64 J"
    ],
    "a": 2,
    "e": "Wnet = ΔK = ½ × 1 × 8² = 32 J."
  },
  {
    "q": "A 6 kg object slows from 5 m/s to 3 m/s. Net work done is:",
    "o": [
      "+48 J",
      "−48 J",
      "−24 J",
      "+24 J"
    ],
    "a": 1,
    "e": "ΔK = ½ × 6 × (9 − 25) = 3 × (−16) = −48 J."
  },
  {
    "q": "A 1000 kg car increases speed from 10 m/s to 20 m/s. Net work done is:",
    "o": [
      "50,000 J",
      "100,000 J",
      "150,000 J",
      "200,000 J"
    ],
    "a": 2,
    "e": "ΔK = ½ × 1000 × (400 − 100) = 150,000 J."
  },
  {
    "q": "If friction does negative work on a sliding block, the block's kinetic energy due to that work contribution:",
    "o": [
      "Increases",
      "Decreases",
      "Must stay constant",
      "Becomes negative"
    ],
    "a": 1,
    "e": "Friction opposes sliding and removes mechanical energy from the block's motion."
  },
  {
    "q": "The work–energy theorem can help calculate speed without directly finding:",
    "o": [
      "Displacement",
      "Time taken",
      "Net work",
      "Kinetic energy"
    ],
    "a": 1,
    "e": "The theorem relates work and kinetic energy directly, often avoiding the need to solve for time."
  },
  {
    "q": "A 0.5 kg ball speeds up from 4 m/s to 8 m/s. Its change in kinetic energy is:",
    "o": [
      "6 J",
      "12 J",
      "16 J",
      "24 J"
    ],
    "a": 1,
    "e": "ΔK = ½ × 0.5 × (64 − 16) = 0.25 × 48 = 12 J."
  },
  {
    "q": "A body has initial kinetic energy 25 J and net work of −10 J is done. Final kinetic energy is:",
    "o": [
      "15 J",
      "35 J",
      "−15 J",
      "10 J"
    ],
    "a": 0,
    "e": "Kf = Ki + Wnet = 25 − 10 = 15 J."
  },
  {
    "q": "A body of mass 2 kg has kinetic energy 36 J. Its speed is:",
    "o": [
      "3 m/s",
      "6 m/s",
      "9 m/s",
      "18 m/s"
    ],
    "a": 1,
    "e": "36 = ½ × 2 × v², so v² = 36 and v = 6 m/s."
  },
  {
    "q": "A constant force of 4 N acts along displacement for 5 m. The kinetic energy change due to this net force is:",
    "o": [
      "−20 J",
      "+20 J",
      "+9 J",
      "0 J"
    ],
    "a": 1,
    "e": "If this is the net force, Wnet = Fs = 4 × 5 = 20 J, so ΔK = +20 J."
  },
  {
    "q": "Which statement is correct about the work–energy theorem?",
    "o": [
      "It applies only when speed is constant",
      "Net work equals change in kinetic energy",
      "Net work always equals potential energy",
      "It applies only to gravity"
    ],
    "a": 1,
    "e": "The theorem applies generally: total net work equals the change in kinetic energy."
  }
];
let index=0,score=0,streak=0,chosen=null,locked=false;
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Nice work!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><button class="btn" id="retry">Practice again</button>';
 $('finishSlot').replaceChildren(card);$('retry').addEventListener('click',()=>{index=0;score=0;streak=0;$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});});
});
render();
})();
</script>
