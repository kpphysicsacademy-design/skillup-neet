<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Work-Energy Theorem</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#f7f7fb,#eeedff);color:#172033}.wrap{max-width:850px;margin:auto;padding:28px 18px 48px}.card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 34px #17203318;animation:in .45s ease}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{font-weight:850}.xp{font-weight:900;padding:8px 12px;border-radius:999px;background:#f0edff}.bar{height:10px;background:#e7e6f0;border-radius:999px;overflow:hidden;margin:18px 0 26px}.fill{height:100%;width:0;background:#5b50c8;transition:width .4s}.q{font-size:1.25rem;font-weight:850;line-height:1.45;margin:22px 0;animation:in .25s}.opts{display:grid;gap:12px}.opt{width:100%;text-align:left;border:2px solid #e3e3ed;background:#fafafd;border-radius:16px;padding:14px 16px;font:inherit;cursor:pointer;transition:.16s;animation:up .25s}.opt:hover{transform:translateY(-3px);box-shadow:0 7px 16px #17203312}.opt.selected{border-color:#5b50c8;background:#f0edff}.opt.correct{border-color:#2d9b68;background:#eaf8f1}.opt.wrong{border-color:#d45555;background:#fff0f0;animation:shake .3s}.feedback{min-height:72px;margin-top:18px;padding:15px;border-radius:16px;background:#f4f3fb;line-height:1.55}.btn{margin-top:18px;border:0;border-radius:14px;padding:13px 18px;font:inherit;font-weight:850;cursor:pointer;background:#5b50c8;color:#fff;box-shadow:0 5px 0 #42399c;transition:.12s}.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #42399c}.back{display:inline-block;margin-top:30px;color:#5146a5;font-weight:850;text-decoration:none;padding:11px 14px;border-radius:14px}.back:hover{background:#f0edff;transform:translateX(-3px)}.result{text-align:center;font-size:1.2rem;font-weight:800;line-height:1.7;animation:in .4s}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes up{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@media(max-width:600px){.card{padding:21px}.q{font-size:1.12rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}</style></head><body><main class="wrap"><section class="card"><div class="top"><div class="tag">⚡ Work-Energy Theorem</div><div class="xp">+10 XP</div></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></section></main><script>const qs=[['The work-energy theorem states that net work done on a body equals its change in:',['kinetic energy','potential energy','momentum only','power'],0,'Wnet=ΔK.'],['The SI unit of kinetic energy is:',['joule','watt','newton','pascal'],0,'Kinetic energy is measured in joules.'],['Kinetic energy of a body of mass m moving with speed v is:',['½mv²','mv','mv²','½mv'],0,'K=½mv².'],['If net work on a body is positive, its kinetic energy:',['increases','decreases','remains zero','must become negative'],0,'Positive net work increases kinetic energy.'],['If net work is negative, kinetic energy:',['decreases','increases','is always zero','is unchanged'],0,'Negative net work reduces kinetic energy.'],['A 2 kg body changes speed from 3 m/s to 5 m/s. Change in kinetic energy is:',['16 J','8 J','25 J','34 J'],0,'ΔK=½(2)(25−9)=16 J.'],['A constant net force does 20 J of work on a body. The change in kinetic energy is:',['20 J','10 J','40 J','0 J'],0,'By the theorem, ΔK=Wnet=20 J.'],['If the net work on a body is zero, its kinetic energy:',['does not change','must be zero','doubles','becomes negative'],0,'Zero net work means ΔK=0.'],['For uniform circular motion, the work done by the centripetal force is:',['zero','positive','negative','maximum'],0,'Centripetal force is perpendicular to instantaneous displacement.'],['Work-energy theorem applies to:',['net work of all forces','only gravity','only friction','only conservative forces'],0,'It relates total/net work to kinetic-energy change.'],['A body initially at rest receives 50 J net work. Its final kinetic energy is:',['50 J','25 J','100 J','0 J'],0,'Initial K is zero, so final K=50 J.'],['If kinetic energy doubles, speed changes by a factor of:',['√2','2','4','1/2'],0,'Since K∝v², v changes by √2.'],['The area under a force-displacement graph represents:',['work','power','momentum','acceleration'],0,'Signed area under F-x gives work.'],['Friction generally does what kind of work on a sliding body?',['negative','positive','always zero','infinite'],0,'Kinetic friction opposes motion and removes kinetic energy.'],['The work-energy theorem is useful because it connects force and displacement directly with:',['speed/kinetic energy','time only','mass only','density'],0,'It can determine speed changes without explicitly solving time evolution.']];let i=0,sel=null,score=0;const $=x=>document.getElementById(x);function render(){sel=null;let a=qs[i];$('fill').style.width=i/qs.length*100+'%';$('quiz').innerHTML='<div class="q">'+(i+1)+'. '+a[0]+'</div><div class="opts" id="opts"></div><div class="feedback" id="feedback">Choose an answer, then check it.</div><button class="btn" id="check">Check</button>';let o=a[1].map((text,index)=>({text,index}));for(let k=o.length-1;k;k--){let r=Math.floor(Math.random()*(k+1));[o[k],o[r]]=[o[r],o[k]]}o.forEach((x,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+x.text;b.dataset.index=x.index;b.onclick=()=>{sel=x.index;[...$('opts').children].forEach(z=>z.classList.remove('selected'));b.classList.add('selected')};$('opts').appendChild(b)});$('check').onclick=check}function check(){if(sel===null){$('feedback').textContent='Please choose an answer first.';return}let a=qs[i],ok=sel===a[2];if(ok)score++;[...$('opts').children].forEach(b=>{let x=+b.dataset.index;b.disabled=true;if(x===a[2])b.classList.add('correct');if(x===sel&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+'<br>'+a[3];if(i<qs.length-1){$('check').textContent='Next';$('check').onclick=()=>{i++;render()}}else{$('fill').style.width='100%';$('quiz').innerHTML='<div class="result">🏆 Quiz complete!<br>Score: '+score+'/15 ('+Math.round(score/15*100)+'%)<br>XP earned: '+score*10+' XP</div><button class="btn" onclick="i=0;score=0;render()">Retry</button>';localStorage.setItem('skillupPhysicsWorkEnergyTheoremScore',score)}}function rememberPath(){try{let r=document.referrer;if(r){let u=new URL(r);if(u.origin===location.origin&&(/(?:physics|full-physics)[^/]*path[^/]*\.html$/i.test(u.pathname)||/\/physics-home\.html$/i.test(u.pathname)))sessionStorage.setItem('skillupLastPhysicsPath',u.href)}}catch(e){}}rememberPath();$('back').onclick=function(){let s=sessionStorage.getItem('skillupLastPhysicsPath');if(s){try{let u=new URL(s,location.href);if(u.origin===location.origin){location.href=s;return false}}catch(e){}}if(document.referrer){try{let u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();</script></body></html>
