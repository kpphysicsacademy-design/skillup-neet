<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp | Work</title>
<style>
*{box-sizing:border-box}html{min-height:100%;background:#f7f7fb}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033;overflow-x:hidden}.wrap{width:100%;min-height:100vh;max-width:850px;margin:0 auto;padding:28px 18px 34px;display:flex;flex-direction:column;justify-content:flex-start}.card{background:#fff;border-radius:22px;padding:28px 24px 26px;box-shadow:0 7px 24px rgba(23,32,51,.08);animation:cardIn .45s ease both}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.tag{font-weight:850}.xp{background:#f0edff;border-radius:999px;padding:9px 14px;font-weight:900;animation:pulse 1.8s ease-in-out infinite}.bar{height:10px;background:#e4e8ef;border-radius:999px;overflow:hidden;margin:18px 0 28px}.fill{height:100%;width:0;background:#5b50c8;border-radius:999px;transition:width .4s ease}.qnum{font-size:.88rem;font-weight:800;color:#51647a;margin-bottom:10px}.q{font-size:1.2rem;font-weight:850;line-height:1.45;margin:0 0 18px;animation:slideIn .28s ease both}.opts{display:grid;gap:10px}.opt{width:100%;text-align:left;border:2px solid #dfe3eb;background:#fff;border-radius:14px;padding:13px 15px;font:inherit;font-weight:700;color:#172033;cursor:pointer;transition:transform .14s ease,border-color .14s ease,background .14s ease,box-shadow .14s ease;animation:optionIn .3s ease both}.opt:hover,.opt:focus-visible{transform:translateY(-2px);border-color:#aaa4df;background:#faf9ff;box-shadow:0 5px 12px rgba(23,32,51,.08);outline:none}.opt:active{transform:scale(.99)}.opt.selected{border-color:#5b50c8;background:#f0edff}.opt.correct{border-color:#2d9b68;background:#eaf8f1;animation:correctPop .35s ease}.opt.wrong{border-color:#d45555;background:#fff0f0;animation:shake .35s ease}.feedback{min-height:62px;margin-top:16px;padding:13px 14px;border-radius:14px;background:#f4f3fb;color:#4d5870;line-height:1.5;animation:fadeUp .25s ease}.actions{display:flex;gap:10px;margin-top:16px}.btn{border:0;border-radius:13px;padding:12px 18px;font:inherit;font-weight:850;cursor:pointer;background:#5b50c8;color:#fff;box-shadow:0 4px 0 #42399c;transition:transform .12s,box-shadow .12s,filter .12s}.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.05)}.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #42399c}.btn:disabled{opacity:.5;cursor:not-allowed}.back{display:inline-block;margin-top:28px;color:#5146a5;font-weight:850;text-decoration:none;padding:9px 12px;border-radius:12px;transition:transform .14s,background .14s}.back:hover,.back:focus-visible{background:#f0edff;transform:translateX(-3px);outline:none}.result{text-align:center;font-size:1.15rem;font-weight:800;line-height:1.7;padding:16px;animation:cardIn .4s ease}@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes slideIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}@keyframes optionIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes correctPop{50%{transform:scale(1.02)}to{transform:scale(1)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}to{transform:none}}@keyframes pulse{50%{transform:scale(1.04)}}@media(max-width:600px){.wrap{padding:20px 14px 30px}.card{padding:21px 17px}.q{font-size:1.1rem}.top{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body><main class="wrap"><section class="card">
<div class="top"><div class="tag">⚙️ Work</div><div class="xp">+<span id="xp">0</span> XP</div></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="quiz"></div>
<a class="back" id="back" href="physics-home.html">← Back to Physics Path</a>
</section></main><script>
const qs=[
['Work done by a constant force F when displacement s makes angle θ with the force is:',['Fs cosθ','Fs sinθ','F/s','F+s'],0,'Work is W = Fs cosθ.'],
['The SI unit of work is:',['joule','watt','newton','pascal'],0,'The SI unit of work is the joule (J).'],
['One joule is equal to:',['one newton metre','one newton per metre','one watt per metre','one kilogram metre'],0,'1 J = 1 N m.'],
['Work done by a force is zero when the force is:',['perpendicular to displacement','parallel to displacement','in the same direction as displacement','opposite to displacement'],0,'For θ = 90°, cosθ = 0, so work is zero.'],
['If force and displacement are in the same direction, work done is:',['positive','zero','negative','always infinite'],0,'For θ = 0°, W = Fs, which is positive.'],
['If a force acts opposite to displacement, its work is:',['negative','positive','zero','undefined'],0,'For θ = 180°, W = −Fs.'],
['The work done by centripetal force in uniform circular motion is:',['zero','positive','negative','maximum'],0,'Centripetal force is perpendicular to instantaneous displacement.'],
['A force of 10 N moves a body through 5 m in its direction. Work done is:',['50 J','2 J','15 J','0.5 J'],0,'W = Fs = 10×5 = 50 J.'],
['A body is lifted vertically upward at constant speed. The work done by gravity is:',['negative','positive','zero','always equal to kinetic energy'],0,'Gravity is downward while displacement is upward.'],
['The work-energy theorem states that net work done on a body equals:',['change in kinetic energy','change in momentum','change in force','change in displacement'],0,'Net work equals the change in kinetic energy.'],
['A force of 20 N acts at 60° to a displacement of 4 m. Work done is:',['40 J','80 J','20 J','160 J'],0,'W = 20×4×cos60° = 40 J.'],
['A person carries a bag horizontally at constant height. Work done by gravity is:',['zero','positive','negative','maximum'],0,'Gravity is vertical while displacement is horizontal.'],
['If displacement is zero, the work done by any constant force is:',['zero','equal to force','equal to energy','infinite'],0,'W = F·s, so zero displacement gives zero work.'],
['The dimensional formula of work is:',['[ML²T⁻²]','[MLT⁻²]','[ML²T⁻¹]','[M²LT⁻²]'],0,'Work = force × displacement, giving [ML²T⁻²].'],
['A force does positive work on a body when it has a component:',['along the displacement','perpendicular to displacement only','opposite to displacement','with zero displacement'],0,'The component along displacement produces positive work.']
];
let i=0,selected=null,score=0,checked=false;const $=id=>document.getElementById(id);
function shuffle(a){const x=a.slice();for(let k=x.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[x[k],x[r]]=[x[r],x[k]]}return x}
function render(){selected=null;checked=false;const a=qs[i];$('fill').style.width=(i/qs.length*100)+'%';$('quiz').innerHTML='<div class="qnum">Question '+(i+1)+' of 15</div><div class="q">'+a[0]+'</div><div class="opts" id="opts"></div><div class="feedback" id="feedback">Choose an answer, then check it.</div><div class="actions"><button class="btn" id="check">Check</button></div>';const order=shuffle(a[1].map((text,index)=>({text,index})));order.forEach((item,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{selected=item.index;[...$('opts').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('opts').appendChild(b)});$('check').onclick=check}
function check(){if(selected===null){$('feedback').textContent='Choose an answer first 👆';return}checked=true;const a=qs[i],ok=selected===a[2];if(ok)score++;[...$('opts').children].forEach(b=>{const oi=Number(b.dataset.index);b.disabled=true;if(oi===a[2])b.classList.add('correct');if(oi===selected&&!ok)b.classList.add('wrong')});$('xp').textContent=score*10;$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+'<br>'+a[3];const btn=$('check');if(i<qs.length-1){btn.textContent='Next Question →';btn.onclick=()=>{i++;render();window.scrollTo({top:0,behavior:'smooth'})}}else{btn.textContent='Finish Skill →';btn.onclick=finish}$('fill').style.width=((i+1)/qs.length*100)+'%'}
function finish(){$('quiz').innerHTML='<div class="result">🏆 Work Complete!<br>Score: '+score+'/15 ('+Math.round(score/15*100)+'%)<br>⚡ XP earned: '+score*10+'</div><div class="actions" style="justify-content:center"><button class="btn" onclick="i=0;score=0;render()">Retry</button></div>';$('fill').style.width='100%';localStorage.setItem('skillupPhysicsWorkScore',String(score))}
function rememberPath(){try{const ref=document.referrer;if(ref){const u=new URL(ref);if(u.origin===location.origin&&(/(?:physics|full-physics)[^/]*path[^/]*\.html$/i.test(u.pathname)||/\/physics-home\.html$/i.test(u.pathname)))sessionStorage.setItem('skillupLastPhysicsPath',u.href)}}catch(e){}}
rememberPath();$('back').onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();
</script></body></html>
