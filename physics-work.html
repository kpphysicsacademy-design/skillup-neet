<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Work</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:42px 18px 48px}.hero{margin-bottom:22px}.heroRow{display:flex;justify-content:space-between;align-items:center;gap:18px}.title{font-size:1.65rem;font-weight:900;letter-spacing:-.02em}.xp{font-weight:900;white-space:nowrap}.subtitle{margin:22px 0 0;color:#31425b;line-height:1.5}.mastery{background:#fff;border-radius:20px;padding:18px 22px;margin:20px 0 16px;box-shadow:0 6px 22px rgba(23,32,51,.07)}.masteryTop{font-weight:850;margin-bottom:10px}.bar{height:9px;background:#e5e9f0;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:#5b50c8;border-radius:999px;transition:width .4s ease}.card{background:#fff;border-radius:22px;padding:26px 22px 28px;box-shadow:0 7px 24px rgba(23,32,51,.08);animation:cardIn .4s ease both}.qnum{font-size:.9rem;margin-bottom:18px}.q{font-size:1.18rem;font-weight:850;line-height:1.48;margin-bottom:18px;animation:slideIn .25s ease both}.opts{display:grid;gap:10px}.opt{width:100%;text-align:left;border:2px solid #dfe3eb;background:#fff;border-radius:14px;padding:13px 14px;font:inherit;cursor:pointer;transition:transform .14s,border-color .14s,background .14s;animation:optionIn .25s ease both}.opt:hover{transform:translateY(-2px);border-color:#b8b2e7}.opt.selected{border-color:#5b50c8;background:#f0edff}.opt.correct{border-color:#42c900;background:#f1ffe9}.opt.wrong{border-color:#d45555;background:#fff0f0;animation:shake .3s ease}.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:12px 18px;font:inherit;font-weight:850;cursor:pointer;background:#55c900;color:#fff;box-shadow:0 4px 0 #39a500;transition:transform .12s,filter .12s,opacity .12s}.btn:hover:not(:disabled){filter:brightness(1.04);transform:translateY(-1px)}.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #39a500}.btn.secondary{background:#a9e987;color:#fff;box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}.feedback{min-height:54px;margin-top:16px;padding:12px 6px;color:#263852;line-height:1.5}.back{display:inline-block;margin-top:18px;border:2px solid #5b50c8;border-radius:13px;padding:10px 15px;color:#5146a5;font-weight:850;text-decoration:none;transition:transform .14s,background .14s}.back:hover{background:#f0edff;transform:translateX(-2px)}.result{text-align:center;font-size:1.15rem;font-weight:850;line-height:1.7;padding:14px;animation:cardIn .4s ease}@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes slideIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}@keyframes optionIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}to{transform:none}}@media(max-width:600px){.wrap{padding:25px 14px 38px}.title{font-size:1.4rem}.card{padding:22px 17px}.heroRow{align-items:flex-start}.q{font-size:1.08rem}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition:none!important}}
</style></head><body><main class="wrap"><header class="hero"><div class="heroRow"><div class="title">⚙️ Work</div><div class="xp">⭐ <span id="xp">0</span> XP</div></div><p class="subtitle">Master the physics of work with 15 NEET-style questions.</p></header><section class="mastery"><div class="masteryTop">🎯 Skill Mastery <span id="mastery">0</span> / 15</div><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card"><div id="quiz"></div><a class="back" id="back" href="physics-home.html">← Back to Physics Path</a></section></main><script>
const qs=[['Work done by a constant force F when displacement s makes angle θ with the force is:',['Fs cosθ','Fs sinθ','F/s','F+s'],0,'Work is W = Fs cosθ.'],['The SI unit of work is:',['joule','watt','newton','pascal'],0,'The SI unit of work is the joule (J).'],['One joule is equal to:',['one newton metre','one newton per metre','one watt per metre','one kilogram metre'],0,'1 J = 1 N m.'],['Work done by a force is zero when the force is:',['perpendicular to displacement','parallel to displacement','in the same direction as displacement','opposite to displacement'],0,'For θ = 90°, cosθ = 0, so work is zero.'],['If force and displacement are in the same direction, work done is:',['positive','zero','negative','always infinite'],0,'For θ = 0°, W = Fs, which is positive.'],['If a force acts opposite to displacement, its work is:',['negative','positive','zero','undefined'],0,'For θ = 180°, W = −Fs.'],['The work done by centripetal force in uniform circular motion is:',['zero','positive','negative','maximum'],0,'Centripetal force is perpendicular to instantaneous displacement.'],['A force of 10 N moves a body through 5 m in its direction. Work done is:',['50 J','2 J','15 J','0.5 J'],0,'W = Fs = 10×5 = 50 J.'],['A body is lifted vertically upward at constant speed. The work done by gravity is:',['negative','positive','zero','always equal to kinetic energy'],0,'Gravity is downward while displacement is upward.'],['The work-energy theorem states that net work done on a body equals:',['change in kinetic energy','change in momentum','change in force','change in displacement'],0,'Net work equals the change in kinetic energy.'],['A force of 20 N acts at 60° to a displacement of 4 m. Work done is:',['40 J','80 J','20 J','160 J'],0,'W = 20×4×cos60° = 40 J.'],['A person carries a bag horizontally at constant height. Work done by gravity is:',['zero','positive','negative','maximum'],0,'Gravity is vertical while displacement is horizontal.'],['If displacement is zero, the work done by any constant force is:',['zero','equal to force','equal to energy','infinite'],0,'W = F·s, so zero displacement gives zero work.'],['The dimensional formula of work is:',['[ML²T⁻²]','[MLT⁻²]','[ML²T⁻¹]','[M²LT⁻²]'],0,'Work = force × displacement, giving [ML²T⁻²].'],['A force does positive work on a body when it has a component:',['along the displacement','perpendicular to displacement only','opposite to displacement','with zero displacement'],0,'The component along displacement produces positive work.']];
let i=0,selected=null,score=0;const $=id=>document.getElementById(id);function shuffle(a){const x=a.slice();for(let k=x.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[x[k],x[r]]=[x[r],x[k]]}return x}function render(){selected=null;const a=qs[i];$('mastery').textContent=i;$('fill').style.width=(i/15*100)+'%';$('quiz').innerHTML='<div class="qnum">Question '+(i+1)+' of 15</div><div class="q">'+a[0]+'</div><div class="opts" id="opts"></div><div class="feedback" id="feedback">💡 Choose the best answer.</div><div class="actions"><button class="btn" id="check">Check Answer</button><button class="btn secondary" id="next" disabled>Continue →</button></div>';const order=shuffle(a[1].map((text,index)=>({text,index})));order.forEach((item,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+item.text;b.dataset.index=item.index;b.onclick=()=>{selected=item.index;[...$('opts').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('opts').appendChild(b)});$('check').onclick=check;$('next').onclick=()=>{if(i<14){i++;render();window.scrollTo({top:0,behavior:'smooth'})}else finish()}}function check(){if(selected===null){$('feedback').textContent='💡 Please choose the best answer first.';return}const a=qs[i],ok=selected===a[2];if(ok)score++;$('xp').textContent=score*10;$('mastery').textContent=i+1;[...$('opts').children].forEach(b=>{const oi=Number(b.dataset.index);b.disabled=true;if(oi===a[2])b.classList.add('correct');if(oi===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+'<br>'+a[3];$('check').disabled=true;$('next').disabled=false;$('fill').style.width=((i+1)/15*100)+'%';if(i===14)$('next').textContent='Finish Skill →'}function finish(){$('quiz').innerHTML='<div class="result">🏆 Work Complete!<br>Score: '+score+'/15 ('+Math.round(score/15*100)+'%)<br>⚡ XP earned: '+score*10+'</div><div class="actions" style="justify-content:center"><button class="btn" onclick="i=0;score=0;$(\'xp\').textContent=0;render()">Retry</button></div>';$('fill').style.width='100%';$('mastery').textContent='15';localStorage.setItem('skillupPhysicsWorkScore',String(score))}function rememberPath(){try{const ref=document.referrer;if(ref){const u=new URL(ref);if(u.origin===location.origin&&(/(?:physics|full-physics)[^/]*path[^/]*\.html$/i.test(u.pathname)||/\/physics-home\.html$/i.test(u.pathname)))sessionStorage.setItem('skillupLastPhysicsPath',u.href)}}catch(e){}}rememberPath();$('back').onclick=function(){const saved=sessionStorage.getItem('skillupLastPhysicsPath');if(saved){try{const u=new URL(saved,location.href);if(u.origin===location.origin){location.href=saved;return false}}catch(e){}}if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin){history.back();return false}}catch(e){}}location.href='physics-home.html';return false};render();
</script></body></html>
