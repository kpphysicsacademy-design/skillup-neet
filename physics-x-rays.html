<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Physics | X-Rays</title><meta name="description" content="SkillUp Physics X-Rays interactive lesson with 15 MCQs."><style>:root{--bg:#f5f7fb;--text:#14213d;--border:#d5deeb;--track:#e5eaf2;--sel:#eef5ff;--green:#eaf8ef;--red:#fff0f0;--navy:#182238}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:32px 16px}.card{width:min(650px,100%);background:#fff;border-radius:20px;padding:22px 20px 20px;box-shadow:0 10px 28px rgba(20,33,61,.09)}header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:28px;line-height:1.2;margin:0;font-weight:750}.icon{font-size:30px}.status{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:10px}.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:22px}.fill{height:100%;width:0;background:var(--text);transition:.25s}.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 16px}.opts{display:grid;gap:9px}.opt{width:100%;min-height:45px;padding:11px 13px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}.opt:hover:not(:disabled){background:#fafcff;border-color:#bdcadd}.opt.sel{background:var(--sel)}.opt.ok{background:var(--green);border-color:#8bc79d}.opt.no{background:var(--red);border-color:#e3a0a0}.feedback{min-height:22px;margin:11px 2px 0;font-size:13px;font-weight:700}.oktxt{color:#28753f}.notxt{color:#a13b3b}button.next,.restart,.back{width:100%;min-height:41px;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:750}.next,.restart{margin-top:12px;background:var(--navy);color:#fff;cursor:pointer}.next:disabled{opacity:.45;cursor:not-allowed}.back{display:flex;justify-content:center;align-items:center;margin-top:16px;background:var(--navy);color:#fff;text-decoration:none}.result{text-align:center;padding:10px 0}.result .trophy{font-size:42px}.result h2{margin:5px 0 8px;font-size:24px}.result p{margin:5px;color:#5d687d;font-size:14px}.score{font-size:18px!important;font-weight:750;color:var(--text)!important}@media(max-width:600px){body{padding:14px 10px}.card{padding:19px 15px 16px;border-radius:17px}h1{font-size:23px}.icon{font-size:26px}.q{font-size:17px}.opt{min-height:48px;font-size:15px}}</style></head><body><main class="card"><header><span class="icon">🩻</span><h1>X-Rays</h1></header><section id="quiz"><div class="status"><span id="counter"></span><span id="xp">XP 0</span></div><div class="track"><div id="fill" class="fill"></div></div><p id="question" class="q"></p><div id="opts" class="opts"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Next</button></section><section id="result" class="result" hidden><div class="trophy">🏆</div><h2>Lesson Complete!</h2><p id="score" class="score"></p><p id="earned"></p><button id="restart" class="restart">Practice Again</button></section><a class="back" href="full-physics-path.html">← Back to Physics Path</a></main><script>const qs=[["X-rays are a type of:",["Electromagnetic radiation","Mechanical waves","Sound waves","Matter waves only"],0,"X-rays are electromagnetic radiation in the high-frequency, short-wavelength part of the spectrum."] ,["Compared with ultraviolet radiation, X-rays generally have:",["Shorter wavelength and higher frequency","Longer wavelength and lower frequency","The same wavelength","Zero frequency"],0,"X-rays have shorter wavelengths and higher frequencies than ultraviolet radiation."] ,["X-rays can travel through:",["Vacuum","Only air","Only water","Only solids"],0,"As electromagnetic waves, X-rays can propagate through vacuum."] ,["The speed of X-rays in vacuum is approximately:",["3×10⁸ m/s","3×10⁶ m/s","3×10⁴ m/s","3×10¹⁰ m/s"],0,"All electromagnetic waves travel at approximately 3×10⁸ m/s in vacuum."] ,["X-rays are commonly produced in an X-ray tube when high-speed electrons:",["Strike a metal target and undergo rapid deceleration","Move through a loudspeaker","Pass through a prism only","Are cooled to absolute zero"],0,"Bremsstrahlung and characteristic X-rays are produced when energetic electrons interact with a metal target."] ,["The continuous X-ray spectrum produced by rapid electron deceleration is called:",["Bremsstrahlung radiation","Blackbody sound","Fluorescence only","Radioactivity"],0,"Bremsstrahlung means braking radiation and produces a continuous X-ray spectrum."] ,["A major medical use of X-rays is:",["Imaging bones and internal structures","Measuring room humidity","Generating radio broadcasts","Detecting only visible light"],0,"X-ray radiography uses differential absorption to create images of internal structures, especially bones."] ,["X-rays are useful for medical imaging because different tissues:",["Absorb X-rays to different extents","All absorb X-rays equally","Do not interact with radiation","Have identical densities"],0,"Different materials and tissues attenuate X-rays differently, creating image contrast."] ,["X-rays are classified as ionizing radiation because they can:",["Remove electrons from atoms or molecules","Travel only in air","Produce sound directly","Have zero photon energy"],0,"High-energy X-ray photons can ionize atoms and molecules."] ,["Which material is commonly used as a target in an X-ray tube?",["Tungsten","Rubber","Wood","Plastic"],0,"Tungsten is commonly used because it has a high atomic number and high melting point."] ,["X-rays are also used in industry for:",["Non-destructive testing and detecting internal defects","Making food taste sweet","Measuring wind speed only","Producing magnetic fields only"],0,"Industrial radiography can reveal internal cracks, voids and defects without destroying a component."] ,["In the electromagnetic spectrum, photon energy is related to frequency by:",["E=hf","E=h/f","E=f/h","E=h+f"],0,"The photon-energy relation is E=hf, so higher-frequency X-rays have higher photon energy."] ,["If the frequency of an X-ray increases, its wavelength in vacuum:",["Decreases","Increases","Remains fixed","Becomes infinite"],0,"Since c=fλ, wavelength decreases as frequency increases in vacuum."] ,["Which practice helps reduce unnecessary X-ray exposure?",["Using shielding and keeping exposure as low as reasonably achievable","Increasing exposure time without need","Removing all shielding","Standing closer to the source"],0,"Radiation protection uses justification, optimization and measures such as shielding and minimizing unnecessary exposure."] ,["Which statement about X-rays is correct?",["They are electromagnetic, ionizing radiation and have many imaging applications","They are mechanical waves","They require air to travel","They always have less energy than visible light"],0,"X-rays are high-frequency electromagnetic radiation, are ionizing, and are widely used in medical and industrial imaging."]];let i=0,score=0,xp=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;$("counter").textContent=`Question ${i+1} / ${qs.length}`;$("xp").textContent=`XP ${xp}`;$("fill").style.width=`${i/qs.length*100}%`;$("question").textContent=qs[i][0];const o=$("opts");o.innerHTML="";qs[i][1].forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.type="button";b.textContent=String.fromCharCode(65+n)+'. '+t;b.onclick=()=>answer(n);o.appendChild(b)});$("feedback").textContent="";$("feedback").className="feedback";$("next").disabled=true;$("next").textContent=i===qs.length-1?'Finish':'Next'}function answer(n){if(answered)return;answered=true;const q=qs[i],buttons=[...$("opts").children];buttons.forEach(b=>b.disabled=true);buttons[n].classList.add("sel");buttons[q[2]].classList.add("ok");if(n===q[2]){score++;xp+=10;$("feedback").textContent="Correct! "+q[3];$("feedback").className="feedback oktxt"}else{$("feedback").textContent="Not quite. "+q[3];$("feedback").className="feedback notxt";buttons[n].classList.add("no")}$("xp").textContent=`XP ${xp}`;$("next").disabled=false}function next(){if(!answered)return;if(i<qs.length-1){i++;render()}else{$("fill").style.width="100%";$("quiz").hidden=true;$("result").hidden=false;$("score").textContent=`Score: ${score} / ${qs.length}`;$("earned").textContent=`XP earned: ${xp}`}}function restart(){i=0;score=0;xp=0;$("result").hidden=true;$("quiz").hidden=false;render()}$("next").onclick=next;$("restart").onclick=restart;render();</script></body></html>
