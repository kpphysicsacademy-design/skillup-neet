<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp | Young’s Modulus — 15 MCQ Quiz</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f9ff;color:#203040;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:780px;margin:auto;padding:22px 14px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:950;color:#123b70}.xp{font-weight:950;color:#1677ff;white-space:nowrap}
.hero{margin-top:14px;background:linear-gradient(135deg,#123b70,#1677ff);color:#fff;border-radius:24px;padding:22px}
.hero h1{margin:4px 0 7px;font-size:clamp(26px,6vw,40px)}.hero p{margin:0;line-height:1.5;font-size:13px}
.card{background:#fff;border:1px solid #d9e5f2;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 7px 20px rgba(18,59,112,.07)}
.master{font-weight:900}.bar{height:10px;background:#e5edf6;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;width:0;background:#1677ff;transition:.3s}
.qno{font-size:12px;color:#6b7280;font-weight:900}.q{font-size:20px;font-weight:900;line-height:1.4;margin:9px 0 16px}
button.opt{display:block;width:100%;text-align:left;background:#fff;color:#203040;border:2px solid #dfe8f1;border-radius:14px;padding:14px;margin:10px 0;font-size:15px;font-weight:750;line-height:1.35;cursor:pointer;transition:.15s;appearance:none;-webkit-appearance:none}
button.opt:hover{transform:translateY(-1px);border-color:#9bc3ed;background:#f8fbff}
button.opt.selected{border-color:#1677ff;background:#eef6ff;color:#123b70}
button.opt.correct{border-color:#16803a;background:#eaf8ef;color:#145c2e}
button.opt.wrong{border-color:#d64545;background:#fff0f0;color:#8f2020}
button.continue{border:0;border-radius:13px;padding:12px 20px;background:#1677ff;color:#fff;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #0d5bbf}
button.continue:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.actions{display:flex;justify-content:flex-end;margin-top:15px}.feedback{min-height:25px;margin-top:13px;font-weight:800}.explain{margin-top:6px;color:#596774;font-weight:600}
.back{display:block;width:max-content;margin:18px auto 0;padding:10px 15px;border:2px solid #d9e5f2;border-radius:12px;background:#fff;color:#23415f;text-decoration:none;font-weight:900}
.result{text-align:center}.score{font-size:34px;font-weight:950;color:#123b70}
@media(max-width:520px){.wrap{padding:15px 10px 50px}.q{font-size:18px}button.opt{font-size:14px;padding:13px}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div class="brand">⚛️ SkillUp Physics<br><small>NEET 2026 • 15 MCQ QUIZ</small></div><div class="xp" id="xp">XP: 0</div></div>
<section class="hero"><div>🎯 NEET PRACTICE</div><h1>Young’s Modulus</h1><p>15-question MCQ quiz. Select one answer, check your result, and build mastery.</p></section>
<section class="card"><div class="master">🏆 Quiz Progress <span id="mastery">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section>
<section class="card" id="quiz">
<div class="qno" id="qno"></div>
<div class="q" id="question"></div>
<div id="opts"></div>
<div class="actions"><button class="continue" id="continue" type="button" disabled>Check Answer →</button></div>
<div class="feedback" id="feedback"></div>
</section>
<section class="card result" id="result" hidden></section>
<a class="back" id="back" href="physics-home.html">← Back to Physics Path</a>
</main>
<script>
const questions=[
{q:'Young’s modulus is defined as the ratio of',o:['longitudinal stress to longitudinal strain','strain to stress','force to extension only','pressure to density'],a:0,e:'Young’s modulus Y equals longitudinal stress divided by longitudinal strain.'},
{q:'The SI unit of Young’s modulus is',o:['N','J','Pa','N m'],a:2,e:'Young’s modulus has the same SI unit as stress: pascal (Pa), equivalent to N m⁻².'},
{q:'The formula for Young’s modulus is',o:['Y = AΔL/(FL)','Y = FL/(AΔL)','Y = FΔL/(AL)','Y = FA/(LΔL)'],a:1,e:'Using σ = F/A and ε = ΔL/L gives Y = FL/(AΔL).'},
{q:'Longitudinal strain is',o:['F/A','ΔL/L','FL/A','A/ΔL'],a:1,e:'Longitudinal strain is the change in length divided by the original length.'},
{q:'For the same material, force and cross-sectional area, increasing wire length will',o:['decrease extension','increase extension','not affect extension','make extension zero'],a:1,e:'From ΔL = FL/(AY), extension is directly proportional to the original length.'},
{q:'If the cross-sectional area of a wire is doubled while other quantities remain the same, its extension becomes',o:['double','four times','half','unchanged'],a:2,e:'From ΔL = FL/(AY), extension is inversely proportional to cross-sectional area.'},
{q:'A material with a larger Young’s modulus is generally',o:['more stiff','more dense necessarily','more massive','always more elastic in every sense'],a:0,e:'A larger Young’s modulus means greater resistance to longitudinal deformation.'},
{q:'Strain has',o:['unit Pa','unit N','no unit','unit J'],a:2,e:'Strain is a ratio of two lengths, so it is dimensionless and has no SI unit.'},
{q:'For a wire, longitudinal stress is given by',o:['F/A','A/F','FL/A','FΔL'],a:0,e:'Stress is force divided by the cross-sectional area perpendicular to the force.'},
{q:'In the linear elastic region, the slope of a stress–strain graph represents',o:['density','Young’s modulus','power','momentum'],a:1,e:'The slope is stress/strain, which is Young’s modulus in the linear elastic region.'},
{q:'A wire of length 2 m extends by 1 mm. Its longitudinal strain is',o:['5 × 10⁻⁴','2 × 10⁻³','5 × 10⁻³','2 × 10⁻⁴'],a:0,e:'ε = ΔL/L = 0.001/2 = 5 × 10⁻⁴.'},
{q:'If stress is 2 × 10⁸ Pa and strain is 10⁻³, Young’s modulus is',o:['2 × 10⁵ Pa','2 × 10⁶ Pa','2 × 10¹¹ Pa','2 × 10¹⁴ Pa'],a:2,e:'Y = σ/ε = (2 × 10⁸)/(10⁻³) = 2 × 10¹¹ Pa.'},
{q:'For the same material and dimensions, doubling the applied force within the elastic limit causes extension to',o:['halve','double','remain unchanged','become zero'],a:1,e:'Within the elastic limit, extension is directly proportional to the applied force.'},
{q:'Young’s modulus is primarily a property of the',o:['material','mass of the sample','shape only','applied force only'],a:0,e:'Young’s modulus characterises the material; sample geometry affects extension but not the modulus itself.'},
{q:'The Young’s modulus relation is determined from behaviour in the',o:['plastic region only','linear elastic region','breaking region only','post-fracture region'],a:1,e:'Young’s modulus is the slope of the stress–strain curve in the linear elastic region.'}
];
let i=0,selected=null,checked=false,score=0;
const $=id=>document.getElementById(id);
function render(){
 selected=null;checked=false;$('feedback').textContent='';$('continue').disabled=true;
 $('continue').textContent=i===questions.length-1?'Finish Skill →':'Check Answer →';
 $('qno').textContent=`Question ${i+1} of ${questions.length}`;$('question').textContent=questions[i].q;$('opts').innerHTML='';
 const choices=questions[i].o.map((text,index)=>({text,index}));
 for(let k=choices.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[choices[k],choices[r]]=[choices[r],choices[k]];}
 choices.forEach((choice,j)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+choice.text;b.dataset.index=choice.index;b.onclick=()=>{if(checked)return;selected=choice.index;document.querySelectorAll('button.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('continue').disabled=false;};$('opts').appendChild(b);});
 $('mastery').textContent=`${i} / ${questions.length}`;$('fill').style.width=`${i/questions.length*100}%`;
}
function next(){
 if(selected===null)return;
 if(!checked){
  checked=true;const item=questions[i],ok=selected===item.a;if(ok){score++;$('xp').textContent=`XP: ${score*10}`;}
  document.querySelectorAll('button.opt').forEach(b=>{const n=Number(b.dataset.index);b.disabled=true;if(n===item.a)b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong');});
  $('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+`<div class="explain">${item.e}</div>`;
  $('mastery').textContent=`${i+1} / ${questions.length}`;$('fill').style.width=`${(i+1)/questions.length*100}%`;
 }else if(i<questions.length-1){i++;render();}else{finish();}
}
function finish(){
 $('quiz').hidden=true;$('result').hidden=false;
 const pct=Math.round(score/questions.length*100);
 $('result').innerHTML=`<h2>🎉 Quiz Complete!</h2><div class="score">${score} / ${questions.length}</div><p><strong>${pct}%</strong> accuracy</p><p>🏆 You earned <strong>${score*10} XP</strong>.</p><p>${score>=12?'🔥 Excellent NEET readiness!':score>=9?'💪 Good work. Revise and retry for mastery.':'📚 Revise Young’s modulus and try again.'}</p><button class="continue" type="button" onclick="location.reload()">Retry 15 MCQs</button>`;
}
$('continue').onclick=next;
$('back').onclick=function(){const s=sessionStorage.getItem('skillupLastPhysicsPath');if(s){try{const u=new URL(s,location.href);if(u.origin===location.origin){location.href=s;return false;}}catch(e){}}location.href='physics-home.html';return false;};
render();
</script>
</body>
</html>
