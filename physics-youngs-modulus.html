<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>📏 Young’s Modulus</h1><p class="muted">Learn one small step at a time. Choose an answer, check it, and keep going.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{q:"Young’s modulus is defined as the ratio of longitudinal stress to:",o:["Lateral strain only","Applied force","Cross-sectional area","Longitudinal strain"],a:3,e:"Young’s modulus Y = longitudinal stress / longitudinal strain in the linear elastic region."},
{q:"The SI unit of Young’s modulus is:",o:["Pascal (Pa)","Newton","Metre","Joule"],a:0,e:"Strain is dimensionless, so Young’s modulus has the same unit as stress: Pa."},
{q:"Young’s modulus measures a material’s resistance to change in:",o:["Electric charge","Length","Mass","Temperature"],a:1,e:"Young’s modulus describes stiffness under longitudinal tension or compression."},
{q:"For a wire under tension, Young’s modulus can be written as:",o:["Y = ΔL/(FL)","Y = AΔL/(FL)","Y = FL/(AΔL)","Y = F A/L"],a:2,e:"Stress = F/A and strain = ΔL/L, so Y = (F/A)/(ΔL/L) = FL/(AΔL)."},
{q:"A material with a larger Young’s modulus is generally:",o:["More easily stretched under the same stress","Always less dense","Always more ductile","Stiffer"],a:3,e:"A larger modulus means a smaller strain for the same applied stress."},
{q:"Young’s modulus has dimensions:",o:["[M L⁻¹ T⁻²]","[M L T⁻²]","[M L² T⁻²]","[L T⁻¹]"],a:0,e:"Young’s modulus has the dimensions of stress, force divided by area."},
{q:"Within the proportional limit, stress is proportional to strain. This is:",o:["Boyle’s law","Hooke’s law","Kepler’s law","Snell’s law"],a:1,e:"Hooke’s law describes the linear relation between stress and strain for small elastic deformations."},
{q:"If stress is 2 × 10⁸ Pa and strain is 0.001, Young’s modulus is:",o:["2 × 10⁸ Pa","2 × 10⁻¹¹ Pa","2 × 10¹¹ Pa","2 × 10⁵ Pa"],a:2,e:"Y = stress/strain = 2 × 10⁸ / 10⁻³ = 2 × 10¹¹ Pa."},
{q:"A 2 m wire extends by 1 mm under a load. Its strain is:",o:["2 × 10³","0.5","2 × 10⁻³","5 × 10⁻⁴"],a:3,e:"Strain = 0.001 m / 2 m = 5 × 10⁻⁴."},
{q:"A wire of length L, area A and Young’s modulus Y extends by ΔL under force F. The extension is:",o:["ΔL = FL/(AY)","ΔL = AY/(FL)","ΔL = FAY/L","ΔL = L/(FAY)"],a:0,e:"Rearranging Y = FL/(AΔL) gives ΔL = FL/(AY)."},
{q:"For the same material, force, and length, increasing the wire’s cross-sectional area makes its extension:",o:["Infinite","Smaller","Larger","Unchanged"],a:1,e:"Extension is inversely proportional to area: ΔL = FL/(AY)."},
{q:"For the same force, area and material, doubling the wire’s length makes extension:",o:["Four times","Unchanged","Double","Half"],a:2,e:"Extension is directly proportional to original length."},
{q:"For the same wire and force, if Young’s modulus doubles, the extension:",o:["Doubles","Remains the same","Becomes four times","Halves"],a:3,e:"Extension is inversely proportional to Young’s modulus."},
{q:"A force of 100 N acts on a wire of area 2 × 10⁻⁶ m². Its stress is:",o:["5 × 10⁷ Pa","2 × 10⁻⁴ Pa","2 × 10⁸ Pa","50 Pa"],a:0,e:"Stress = F/A = 100/(2 × 10⁻⁶) = 5 × 10⁷ Pa."},
{q:"A 1 m wire extends by 0.5 mm. Its strain is:",o:["2000","5 × 10⁻⁴","5 × 10⁻³","0.5"],a:1,e:"0.5 mm = 0.0005 m; strain = 0.0005/1 = 5 × 10⁻⁴."},
{q:"If stress is 100 MPa and Young’s modulus is 200 GPa, the strain is:",o:["0.5","2","5 × 10⁻⁴","2 × 10³"],a:2,e:"Strain = stress/Y = 100 × 10⁶ / (200 × 10⁹) = 5 × 10⁻⁴."},
{q:"Which material is generally stiffer based on Young’s modulus?",o:["Rubber rather than steel","Both always have equal modulus","The material that stretches most","Steel rather than rubber"],a:3,e:"Steel typically has a much larger Young’s modulus than rubber, indicating greater stiffness."},
{q:"Young’s modulus is calculated from the slope of which graph in its linear region?",o:["Stress versus longitudinal strain","Mass versus volume","Force versus temperature","Distance versus time"],a:0,e:"The slope of the stress–longitudinal-strain graph is Young’s modulus."},
{q:"The elastic modulus is measured while the material is behaving:",o:["With no applied stress","Elastically, within the relevant range","Only after it has fractured","Only during melting"],a:1,e:"The standard modulus describes the elastic response, usually in the linear elastic region."},
{q:"If a wire’s area doubles and all other factors stay the same, its extension becomes:",o:["Four times as large","Unchanged","Half as large","Twice as large"],a:2,e:"From ΔL = FL/(AY), doubling A halves the extension."},
{q:"If a wire’s length and area both double under the same force and material, extension:",o:["Doubles","Halves","Becomes four times","Remains the same"],a:3,e:"Since ΔL ∝ L/A, doubling both L and A leaves extension unchanged."},
{q:"A wire has stress 6 × 10⁷ Pa and strain 3 × 10⁻⁴. Its Young’s modulus is:",o:["2 × 10¹¹ Pa","2 × 10³ Pa","1.8 × 10⁴ Pa","2 × 10⁻¹¹ Pa"],a:0,e:"Y = 6 × 10⁷ / (3 × 10⁻⁴) = 2 × 10¹¹ Pa."},
{q:"A 4 m wire with area 1 × 10⁻⁶ m² and Y = 2 × 10¹¹ Pa is pulled by 50 N. Its extension is:",o:["1 m","0.001 m","0.01 m","0.1 m"],a:1,e:"ΔL = FL/(AY) = 50×4/(10⁻⁶×2×10¹¹) = 0.001 m."},
{q:"Young’s modulus is independent of which factor for a given material under fixed conditions?",o:["Temperature, in general","Material composition","The dimensions of the specimen","The material’s elastic properties"],a:2,e:"For a given material and conditions, Young’s modulus is a material property, not a function of specimen dimensions."},
{q:"Which statement about Young’s modulus is correct?",o:["It is strain divided by stress","It is always equal to the applied force","It has no unit because strain has no unit","It is stress divided by strain in the linear elastic region"],a:3,e:"Young’s modulus is the ratio of stress to strain and therefore has units of pressure."},
{q:"A material experiences strain 0.002 under stress 4 × 10⁸ Pa. Young’s modulus is:",o:["2 × 10¹¹ Pa","8 × 10⁵ Pa","2 × 10⁶ Pa","2 × 10⁻¹¹ Pa"],a:0,e:"Y = 4 × 10⁸ / 0.002 = 2 × 10¹¹ Pa."},
{q:"For equal stress, which material experiences less longitudinal strain?",o:["The material with greater length only","The material with greater Young’s modulus","The material with lower Young’s modulus","Both must have equal strain"],a:1,e:"Strain = stress/Y, so greater Y means smaller strain for equal stress."},
{q:"The formula ΔL = FL/(AY) assumes the wire is:",o:["Plastic at every point","A liquid at rest","Uniform and within its elastic range","Already broken"],a:2,e:"The formula follows from linear elastic behaviour for a uniform wire under axial load."},
{q:"A wire’s extension is 2 mm under a certain load. If the load is reduced to half within the linear elastic region, extension becomes:",o:["4 mm","2 mm","0 mm","1 mm"],a:3,e:"Within Hooke’s law region, extension is directly proportional to the applied force."},
{q:"Why is Young’s modulus useful when choosing construction materials?",o:["It indicates stiffness under longitudinal loading","It gives colour and transparency","It directly gives the material’s mass","It guarantees no failure under any load"],a:0,e:"Young’s modulus helps compare how much materials deform under a given longitudinal stress."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Young’s Modulus Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
