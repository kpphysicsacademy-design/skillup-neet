<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SkillUp Physics | Zero Correction</title><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0001}h1{text-align:center}.meta{display:flex;justify-content:space-between;font-weight:700}.bar{height:10px;background:#e5e9f0;border-radius:10px;overflow:hidden;margin:15px 0 24px}.fill{height:100%;width:0;background:#4caf50;transition:.3s}.q{font-size:20px;font-weight:700;margin-bottom:18px}.opt{display:block;width:100%;box-sizing:border-box;text-align:left;padding:15px;margin:10px 0;border:2px solid #dbe1ea;border-radius:14px;background:#fff;color:#172033;font-size:16px;cursor:pointer}.opt:hover{background:#f1f6ff}.opt.selected{border-color:#5146a5;background:#f4f1ff}.correct{border-color:#39a852!important;background:#e9f8ed!important}.wrong{border-color:#e05252!important;background:#fff0f0!important}.opt:disabled{cursor:default}.next,.retry,.back{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}.next,.retry{background:#2563eb;color:#fff}.back{background:#172033;color:#fff}.hide{display:none}.xp{text-align:center;font-weight:700;color:#e08a00;min-height:24px}@media(max-width:520px){.wrap{padding:14px 10px}.card{padding:18px}.q{font-size:18px}.opt{font-size:15px}}</style></head><body><div class="wrap"><div class="card"><h1>🎯 Zero Correction</h1><div class="meta"><span id="count">Question 1/15</span><span id="score">XP 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="quiz"></div><div class="xp" id="xp"></div><button class="next hide" id="action">CHECK</button><div id="result" class="hide"></div><a class="back" href="physics-home-fast.html">← Back to Physics Path</a></div></div><script>const qs=[['What is zero error in a measuring instrument?',['An error caused by reading too quickly','A non-zero reading when the true measured quantity is zero','The maximum range of the instrument','The least count of the instrument'],1,'Zero error is present when an instrument shows a non-zero reading even when the true quantity being measured is zero.'],['If a vernier calipers reads +0.02 cm when its jaws are fully closed, the zero error is:',['+0.02 cm','-0.02 cm','0 cm','+2 cm'],0,'The instrument reads +0.02 cm at zero, so its zero error is +0.02 cm.'],['If the zero error is positive, the zero correction is:',['Equal to the positive zero error','Equal to the negative of the zero error','Always zero','Equal to the least count'],1,'Zero correction is the algebraic negative of zero error: zero correction = − zero error.'],['A screw gauge has a positive zero error of +0.03 mm. Its zero correction is:',['+0.03 mm','-0.03 mm','+0.30 mm','0 mm'],1,'For positive zero error +0.03 mm, the required zero correction is −0.03 mm.'],['A screw gauge has a negative zero error of -0.02 mm. Its zero correction is:',['-0.02 mm','+0.02 mm','+0.20 mm','0 mm'],1,'For negative zero error, the zero correction is positive and equal in magnitude.'],['An instrument gives a reading of 5.24 cm and has a zero error of +0.04 cm. The corrected reading is:',['5.28 cm','5.24 cm','5.20 cm','5.00 cm'],2,'Corrected reading = observed reading + zero correction = 5.24 + (-0.04) = 5.20 cm.'],['A meter scale has no offset when its zero mark coincides with the reference point. Its zero error is:',['Positive','Negative','Zero','Infinite'],2,'When the zero mark is correctly aligned at zero, there is no zero error.'],['Which statement about zero correction is correct?',['It has the same sign as zero error','It is always positive','It is the negative of zero error','It is always equal to least count'],2,'Zero correction is defined as the negative of the zero error.'],['A balance shows 0.8 g when no object is placed on it. This is a:',['Positive zero error','Negative zero error','Random error only','Parallax error'],0,'A positive reading at true zero indicates positive zero error.'],['A balance shows -0.5 g when empty. The zero correction is:',['-0.5 g','+0.5 g','0 g','+5 g'],1,'Zero correction = −(−0.5 g) = +0.5 g.'],['A vernier calipers has zero error +0.1 mm. An object reading is 25.6 mm. The corrected reading is:',['25.7 mm','25.6 mm','25.5 mm','24.6 mm'],2,'Corrected reading = 25.6 − 0.1 = 25.5 mm.'],['A screw gauge has zero error -0.04 mm and observed reading 2.36 mm. The corrected reading is:',['2.32 mm','2.36 mm','2.40 mm','2.76 mm'],2,'Zero correction is +0.04 mm, so corrected reading = 2.36 + 0.04 = 2.40 mm.'],['Why should zero error be checked before measuring?',['To increase the instrument range','To account for a systematic offset in the reading','To reduce the object size','To change the least count'],1,'Zero error introduces a systematic offset, so it must be accounted for to obtain a corrected measurement.'],['If an instrument has zero error +2 divisions and least count 0.01 cm, the zero correction is:',['+0.02 cm','-0.02 cm','+0.01 cm','-0.01 cm'],1,'Two divisions correspond to 2 × 0.01 = 0.02 cm; the correction is −0.02 cm.'],['If the observed reading is R and zero error is e, the corrected reading is:',['R + e','R − e','R × e','R/e'],1,'Since zero correction = −e, corrected reading = R + (−e) = R − e.']];let i=0,score=0,answered=false,selected=-1;const $=x=>document.getElementById(x);function render(){answered=false;selected=-1;$('count').textContent=`Question ${i+1}/15`;$('score').textContent=`XP ${score}`;$('fill').style.width=`${i/15*100}%`;const q=qs[i];$('quiz').innerHTML=`<div class="q">${q[0]}</div>`+q[1].map((o,n)=>`<button class="opt" data-n="${n}">${String.fromCharCode(65+n)}. ${o}</button>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.n;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('action').classList.remove('hide');$('action').textContent='CHECK'});$('xp').textContent='';$('action').classList.add('hide');$('action').disabled=false;}function check(){if(selected<0)return;if(!answered){answered=true;const q=qs[i],ok=selected===q[2];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');if(k===selected&&!ok)b.classList.add('wrong')});$('xp').textContent=ok?'✨ Correct! +1 XP':'❌ Incorrect. '+q[3];if(ok)score++;$('score').textContent=`XP ${score}`;$('fill').style.width=`${(i+1)/15*100}%`;$('action').textContent=i===14?'FINISH':'Next Question →';return;}if(i<14){i++;render()}else{$('quiz').innerHTML='';$('action').classList.add('hide');$('fill').style.width='100%';$('count').textContent='Complete!';$('result').classList.remove('hide');$('result').innerHTML=`<h2 style="text-align:center">🎉 Quiz Complete</h2><p style="text-align:center;font-size:20px">Score: <b>${score}/15</b></p><button class="retry" onclick="location.reload()">Retry Quiz ↻</button>`}}$('action').onclick=check;render();</script></body></html>
