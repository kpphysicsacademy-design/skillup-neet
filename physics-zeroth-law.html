s:12px;background:#fff;color:#1264d6;text-decoration:none;font-weight:900}.result{text-align:center}.score{font-size:34px;font-weight:950;color:#123b70}@media(max-width:520px){.wrap{padding:15px 10px 50px}.q{font-size:18px}button.opt{font-size:14px;padding:13px}}

<body><main class="wrap">

<section class="hero"><div>🌡️ NEET PRACTICE</div><h1>Zeroth Law of Thermodynamics</h1><p>15-question MCQ quiz. Select one answer, get instant feedback and build mastery.</p></section>
<section class="card"><div class="master">🏆 Quiz Progress <span id="mastery">0 / 15</span></div><div class="bar"><div class="fill" id="fill"></div></div></section>
<section class="card" id="quiz"><div class="qno" id="qno"></div><div class="q" id="question"></div><div id="opts"></div><div class="actions"><button class="continue" id="continue" type="button" disabled>Check Answer →</button></div><div class="feedback" id="feedback"></div></section>
<section class="card result" id="result" hidden></section>

</main>
<script>
const questions=[
{q:'The Zeroth Law of Thermodynamics establishes the concept of',o:['work','temperature','entropy','internal energy'],a:1,e:'The Zeroth Law provides the basis for defining temperature through thermal equilibrium.'},
{q:'If body A is in thermal equilibrium with body B, and B with C, then A is in thermal equilibrium with C. This is the',o:['First Law','Second Law','Zeroth Law','Third Law'],a:2,e:'The transitive property of thermal equilibrium is the Zeroth Law of Thermodynamics.'},
{q:'Two bodies are in thermal equilibrium when there is no net transfer of',o:['mass','charge','heat','momentum'],a:2,e:'At thermal equilibrium there is no net heat transfer between bodies in contact.'},
{q:'The Zeroth Law is important because it provides the basis for',o:['measuring temperature','calculating work only','conservation of mass','measuring electric current'],a:0,e:'It makes temperature measurement with a thermometer physically meaningful.'},
{q:'A thermometer is in thermal equilibrium with a body when both have the same',o:['mass','volume','temperature','density'],a:2,e:'Thermal equilibrium means equal temperature and no net heat exchange.'},
{q:'If a thermometer reads the same temperature before and after being placed in a body, the thermometer and body are in',o:['mechanical equilibrium only','thermal equilibrium','chemical equilibrium only','unstable equilibrium'],a:1,e:'A stable unchanged reading indicates the thermometer has reached thermal equilibrium with the body.'},
{q:'Which statement follows directly from the Zeroth Law?',o:['Heat can never flow','Temperature is transitive in thermal equilibrium','Energy is always destroyed','Pressure is always constant'],a:1,e:'The law states that thermal equilibrium has a transitive property, allowing temperature to be assigned consistently.'},
{q:'Suppose A and B have equal temperatures and are brought into thermal contact. The net heat flow is',o:['from A to B','from B to A','zero','infinite'],a:2,e:'Equal temperatures imply thermal equilibrium, so there is no net heat flow.'},
{q:'A third body used to compare the thermal states of two bodies is commonly called a',o:['thermometer','barometer','calorimeter','manometer'],a:0,e:'A thermometer acts as the third system that can establish and compare thermal equilibrium.'},
{q:'The Zeroth Law does NOT directly state a law of conservation of',o:['thermal equilibrium','temperature measurement','energy','none of these'],a:2,e:'Energy conservation is expressed by the First Law, not the Zeroth Law.'},
{q:'If A is in equilibrium with B and A is in equilibrium with C, then B and C are',o:['necessarily at different temperatures','in thermal equilibrium with each other','always at different pressures','isolated from each other'],a:1,e:'The Zeroth Law allows B and C to be assigned the same temperature and hence to be in thermal equilibrium.'},
{q:'The physical quantity that has the same value for systems in mutual thermal equilibrium is',o:['temperature','heat','work','entropy only'],a:0,e:'Temperature is the state variable equalized in thermal equilibrium.'},
{q:'Which device relies fundamentally on the Zeroth Law for temperature measurement?',o:['thermometer','spring balance','ammeter','stopwatch'],a:0,e:'A thermometer reaches equilibrium with the object and uses a measurable thermometric property to indicate temperature.'},
{q:'Thermal equilibrium between two systems means that their temperatures are',o:['equal','always zero','opposite','unrelated'],a:0,e:'For systems capable of exchanging heat, thermal equilibrium corresponds to equal temperature.'},
{q:'The Zeroth Law was named “zeroth” because it is logically more fundamental to temperature than the laws that were historically numbered',o:['only after the Third Law','First and Second Laws','none of the laws','laws of motion'],a:1,e:'It was formulated after the First and Second Laws but recognized as more fundamental for the concept of temperature, so it was called the Zeroth Law.'}
];
let i=0,selected=null,checked=false,score=0;
const $=id=>document.getElementById(id);
function render(){selected=null;checked=false;$('feedback').textContent='';$('continue').disabled=true;$('continue').textContent=i===14?'Finish Quiz →':'Check Answer →';$('qno').textContent=`Question ${i+1} of 15`;$('question').textContent=questions[i].q;$('opts').innerHTML='';questions[i].o.forEach((text,index)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=String.fromCharCode(65+index)+'. '+text;b.dataset.index=index;b.onclick=()=>{if(checked)return;selected=index;document.querySelectorAll('button.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('continue').disabled=false};$('opts').appendChild(b)});$('mastery').textContent=`${i} / 15`;$('fill').style.width=`${i/15*100}%`;$('xp').textContent=`XP: ${score*10}`}
function next(){if(selected===null)return;if(!checked){checked=true;const item=questions[i],ok=selected===item.a;if(ok)score++;document.querySelectorAll('button.opt').forEach(b=>{const n=Number(b.dataset.index);b.disabled=true;if(n===item.a)b.classList.add('correct');if(n===selected&&!ok)b.classList.add('wrong')});$('feedback').innerHTML=(ok?'✅ Correct! +10 XP':'❌ Not quite.')+`<div class="explain">${item.e}</div>`;$('mastery').textContent=`${i+1} / 15`;$('fill').style.width=`${(i+1)/15*100}%`;$('xp').textContent=`XP: ${score*10}`}else if(i<14){i++;render()}else finish()}
function finish(){$('quiz').hidden=true;$('result').hidden=false;const pct=Math.round(score/15*100);$('result').innerHTML=`<h2>🎉 Zeroth Law Complete!</h2><div class="score">${score} / 15</div><p><strong>${pct}%</strong> accuracy</p><p>🏆 You earned <strong>${score*10} XP</strong>.</p><p>${score>=12?'🔥 Excellent NEET readiness!':score>=9?'💪 Good work. Revise and retry for mastery.':'📚 Revise the Zeroth Law and try again.'}</p><button class="continue" type="button" onclick="location.reload()">Retry 15 MCQs</button>`}
$('continue').onclick=next;
$('back').onclick=function(){const s=sessionStorage.getItem('skillupLastPhysicsPath');if(s){try{const u=new URL(s,location.href);if(u.origin===location.origin){location.href=s;return false}}catch(e){}}location.href='physics-home-fast.html';return false};
render();
</script>
