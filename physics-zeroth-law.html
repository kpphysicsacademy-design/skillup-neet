<body>
<header><div class="nav"><a class="back" href="physics-home-fast.html" aria-label="Back to Physics Path">←</a><div class="brand">SkillUp<small>PHYSICS • EASY MODE</small></div><div class="xp">⭐ <span id="xp">0</span> XP</div><div class="streak" aria-live="polite">🔥 <span id="streak">0</span> streak</div></div></header>
<main>
<section class="hero"><h1>🌡️ Zeroth Law of Thermodynamics</h1><p class="muted">Explore thermal equilibrium, temperature comparison, and the zeroth law one step at a time.</p><div class="tags"><span class="tag">🌱 Easy Mode</span><span class="tag">🧠 30 questions</span><span class="tag">✨ Short explanations</span></div><div class="progress-row"><span id="progressText">Question 1 of 30</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="quiz" id="quiz"><div class="qmeta" id="qmeta">QUESTION 1</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn check" id="check" disabled>Check answer</button><button class="btn continue" id="continue">Continue →</button></div></section>
<div id="finishSlot"></div>
</main>
<script>
(function(){
'use strict';
const questions = [
{"q":"The zeroth law of thermodynamics is primarily about:","o":["Conservation of momentum","Thermal equilibrium and temperature","Conversion of heat into work","Entropy of an ideal gas"],"a":1,"e":"The zeroth law establishes the transitive nature of thermal equilibrium and underpins temperature measurement."},
{"q":"If system A is in thermal equilibrium with C, and B is also in thermal equilibrium with C, then:","o":["A must be larger than B","A and B must contain equal internal energy","A and B are in thermal equilibrium with each other","A must be hotter than B"],"a":2,"e":"The zeroth law says that if two systems each share a thermal equilibrium with a third, they share the same temperature."},
{"q":"The zeroth law provides the basis for defining a common property called:","o":["Temperature","Density","Momentum","Specific volume"],"a":0,"e":"Temperature is the property used to determine whether systems are in thermal equilibrium."},
{"q":"Which instrument works on the principle enabled by the zeroth law?","o":["Barometer","Ammeter","Spring balance","Thermometer"],"a":3,"e":"A thermometer reaches thermal equilibrium with a body, allowing its temperature to be measured."},
{"q":"Thermal equilibrium between two systems means there is no net heat flow when they are:","o":["at equal temperature and in thermal contact","at equal mass","at equal volume","at equal pressure in all cases"],"a":0,"e":"Equal temperature removes the temperature difference that drives net heat transfer."},
{"q":"The word 'zeroth' was used for this law because it:","o":["applies only at zero kelvin","was considered more fundamental than the first law but named later","states that all energy is zero","was the first law ever discovered"],"a":1,"e":"It was named after the first and second laws had already been established, despite being logically more basic."},
{"q":"If thermometer T is in thermal equilibrium with object A, the thermometer can be used to determine A's:","o":["mass","volume","temperature","chemical composition"],"a":2,"e":"At equilibrium, the thermometer and object share the same temperature."},
{"q":"Two objects have the same temperature but different masses. According to the zeroth law, they can be:","o":["in thermal equilibrium","at different temperatures necessarily","unable to exchange any energy microscopically","equal in internal energy only"],"a":0,"e":"Thermal equilibrium depends on temperature, not on equal masses."},
{"q":"Which statement expresses the transitive property of thermal equilibrium?","o":["A is hotter than B if A is heavier","Heat always flows from cold to hot","Equal masses have equal temperatures","If A ~ C and B ~ C, then A ~ B"],"a":3,"e":"The zeroth law makes thermal equilibrium a transitive relation."},
{"q":"A thermometer should be left in contact with a body until its reading becomes steady because:","o":["the body's mass must decrease","the thermometer approaches thermal equilibrium with the body","the body must cool to zero degrees","the thermometer must stop all molecular motion"],"a":1,"e":"A steady reading indicates the thermometer has approached the body's temperature."},
{"q":"If A and B are each in thermal equilibrium with thermometer T, then A and B have:","o":["equal volumes","equal masses","the same temperature","equal heat capacities"],"a":2,"e":"By the zeroth law, A and B are each at the temperature indicated by T."},
{"q":"Which condition is not required for two systems to be in thermal equilibrium?","o":["Equal temperature","No net heat flow due to temperature difference","Equal masses","A consistent temperature comparison"],"a":2,"e":"Systems of different masses can be at the same temperature and in thermal equilibrium."},
{"q":"The zeroth law is important in experimental science because it makes temperature:","o":["dependent only on mass","impossible to compare","identical to heat","measurable using a standard thermometer"],"a":3,"e":"It supports reproducible temperature measurement by comparing systems through a thermometer."},
{"q":"A hot metal block and a cooler block are placed in contact. Before equilibrium, net heat flows from:","o":["the hotter block to the cooler block","the cooler block to the hotter block","the heavier block to the lighter block","the larger block to the smaller block"],"a":0,"e":"Heat flows spontaneously from higher to lower temperature until thermal equilibrium is approached."},
{"q":"Which statement is true about the zeroth law?","o":["It says internal energy is always zero","It allows comparison of temperatures through thermal equilibrium","It states that pressure is conserved","It says all bodies have equal heat capacity"],"a":1,"e":"The law gives the logical foundation for comparing temperatures."},
{"q":"Two systems are separately in equilibrium with the same thermometer. What can be concluded?","o":["They have identical chemical composition","They have equal masses","They have equal temperatures","They have equal internal energies"],"a":2,"e":"Both systems share the thermometer's temperature, so their temperatures are equal."},
{"q":"Which is the best example of applying the zeroth law?","o":["Using a thermometer to compare body temperatures","Measuring force with a spring balance","Measuring current with an ammeter","Finding mass using a beam balance"],"a":0,"e":"A thermometer is the practical application of the zeroth law's thermal-equilibrium principle."},
{"q":"If A is in thermal equilibrium with B, what is necessarily true in the usual thermodynamic sense?","o":["A and B have equal mass","A and B have equal internal energy","A and B have identical material","A and B have equal temperature"],"a":3,"e":"Thermal equilibrium implies equality of temperature, not necessarily other properties."},
{"q":"Which pair may be in thermal equilibrium?","o":["Two systems with different temperatures and a heat-conducting connection","Two systems at the same temperature","A hot system and a cold system exchanging net heat","Two systems with temperatures changing rapidly due to contact"],"a":1,"e":"Systems at the same temperature can be in thermal equilibrium even if their other properties differ."},
{"q":"A thermometer has not yet settled when placed in warm water. At that moment:","o":["its temperature must already equal the water temperature","the zeroth law is false","it may not yet be in thermal equilibrium with the water","the water has no internal energy"],"a":2,"e":"Before the reading stabilizes, a temperature difference may remain and energy can still flow."},
{"q":"The zeroth law does NOT imply that systems in thermal equilibrium have equal:","o":["temperature","thermal-equilibrium status","measured temperature on the same scale","internal energy"],"a":3,"e":"Internal energy can differ due to differences in mass, material, and state even at equal temperature."},
{"q":"Two bodies are at 20°C and 20°C. Assuming the same temperature scale, their temperatures are:","o":["equal","unequal if masses differ","equal only if made of metal","unknown until their volumes are measured"],"a":0,"e":"Both bodies have the same temperature reading, so they are at the same temperature."},
{"q":"Why can a thermometer compare the temperature of different materials?","o":["All materials have equal density","A thermometer's reading is related to its own temperature after equilibrium","All objects have equal heat capacity","Temperature depends only on colour"],"a":1,"e":"When thermal equilibrium is reached, the thermometer's temperature matches that of the object."},
{"q":"Which law is most directly associated with the transitivity of thermal equilibrium?","o":["Newton's law of cooling","First law of thermodynamics","Zeroth law of thermodynamics","Boyle's law"],"a":2,"e":"The transitivity of thermal equilibrium is the defining statement of the zeroth law."},
{"q":"A thermometer reads 37°C after settling against a body. In thermal equilibrium, the body's temperature is approximately:","o":["0°C","100°C","310°C","37°C"],"a":3,"e":"At equilibrium, the thermometer and body have the same temperature, approximately 37°C."},
{"q":"Two objects at equal temperature are put into thermal contact. What is the expected net heat transfer due only to their temperature difference?","o":["Zero","From the larger object to the smaller","From the heavier object to the lighter","From the denser object to the less dense"],"a":0,"e":"Equal temperature means no net heat flow caused by a temperature difference."},
{"q":"Which property is most directly measured by a clinical thermometer?","o":["Internal energy","Temperature","Heat capacity","Total heat content"],"a":1,"e":"A clinical thermometer measures temperature, not total internal energy or heat capacity."},
{"q":"The zeroth law allows temperature scales to be established because:","o":["temperature is determined by mass alone","heat is always conserved in each body separately","thermal equilibrium gives a consistent basis for comparing systems","all substances expand identically"],"a":2,"e":"A thermometer can be calibrated because thermal equilibrium establishes reproducible temperature comparisons."},
{"q":"Which statement is correct?","o":["Thermal equilibrium requires equal internal energy","The zeroth law applies only to solids","Temperature cannot be compared between different materials","If two systems are each in thermal equilibrium with a third, they are in equilibrium with each other"],"a":3,"e":"This is the zeroth law's transitive statement and its central thermodynamic meaning."},
{"q":"At equilibrium, what does a stable thermometer reading most directly indicate?","o":["The thermometer and body have reached the same temperature","The body has no internal energy","The thermometer has gained the body's mass","All heat transfer everywhere has stopped"],"a":0,"e":"A stable reading indicates thermal equilibrium between thermometer and body, not the end of all microscopic energy exchange."}
];
const originalQuestions=questions.slice();
let index=0,score=0,streak=0,chosen=null,locked=false,wrongAttempts=[];
const $=id=>document.getElementById(id);
function render(){
 chosen=null;locked=false;
 const item=questions[index];
 $('progressText').textContent='Question '+(index+1)+' of '+questions.length;
 $('percent').textContent=Math.round(index/questions.length*100)+'%';
 $('fill').style.width=(index/questions.length*100)+'%';
 $('qmeta').textContent='QUESTION '+(index+1);
 $('question').textContent=item.q;
 $('feedback').className='feedback';$('feedback').textContent='';
 $('check').style.display='block';$('check').disabled=true;
 $('continue').className='btn continue';$('continue').textContent=index===questions.length-1?'See results →':'Continue →';
 $('options').replaceChildren();
 item.o.forEach((text,j)=>{
   const b=document.createElement('button');b.type='button';b.className='option';
   const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+j);
   const label=document.createElement('span');label.textContent=text;b.append(letter,label);
   b.addEventListener('click',()=>{if(locked)return;chosen=j;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('check').disabled=false;});
   $('options').appendChild(b);
 });
}
$('check').addEventListener('click',()=>{
 if(chosen===null||locked)return;locked=true;const item=questions[index],buttons=[...document.querySelectorAll('.option')];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add('correct');});
 const f=$('feedback');
 if(chosen===item.a){score++;streak++;$('xp').textContent=score*10;$('streak').textContent=streak;f.className='feedback show good';f.textContent='✨ Correct! '+item.e;}
 else{streak=0;$('streak').textContent=streak;buttons[chosen].classList.add('wrong');wrongAttempts.push({q:item.q,chosen:item.o[chosen],answer:item.o[item.a],explanation:item.e});f.className='feedback show bad';f.textContent='Not quite. '+item.e+' Correct answer: '+item.o[item.a]+'.';}
 $('check').style.display='none';$('continue').className='btn continue show';
});
$('continue').addEventListener('click',()=>{
 if(!locked)return;index++;
 if(index<questions.length){render();window.scrollTo({top:0,behavior:'smooth'});return;}
 $('quiz').style.display='none';$('fill').style.width='100%';$('progressText').textContent='Quiz complete';$('percent').textContent='100%';
 const pct=Math.round(score/questions.length*100);
 const card=document.createElement('section');card.className='finish';
 card.innerHTML='<div class="trophy">🏆</div><h2>Zeroth Law Complete!</h2><div class="score">'+score+' / '+questions.length+'</div><p class="muted">'+pct+'% correct • '+(score*10)+' XP earned</p><div id="wrongReview" style="text-align:left;margin-top:18px"></div><button class="btn" id="retryWrong" style="display:'+(wrongAttempts.length?'inline-block':'none')+'">↻ Retry wrong answers ('+wrongAttempts.length+')</button><br><button class="btn" id="retry" style="margin-top:12px">Practice all questions again</button>';
 const review=card.querySelector('#wrongReview');
 if(wrongAttempts.length){
   review.innerHTML='<h3>🧠 Review your mistakes</h3>';
   wrongAttempts.forEach((w,n)=>{const item=document.createElement('article');item.style.cssText='padding:12px;margin:10px 0;border:2px solid #dce6ef;border-radius:14px;background:#fff';const q=document.createElement('p');q.style.fontWeight='800';q.textContent=(n+1)+'. '+w.q;const yours=document.createElement('p');yours.textContent='Your answer: '+w.chosen;yours.style.color='#a12b30';const correct=document.createElement('p');correct.textContent='Correct answer: '+w.answer;correct.style.color='#245b12';const why=document.createElement('p');why.textContent=w.explanation;why.className='muted';item.append(q,yours,correct,why);review.appendChild(item);});
 }else{review.innerHTML='<p>🌟 Perfect score! No wrong answers to review.</p>';}
 $('finishSlot').replaceChildren(card);
 function resetQuiz(onlyWrong){
   if(onlyWrong && wrongAttempts.length){
     const wrongQs=wrongAttempts.map(w=>originalQuestions.find(q=>q.q===w.q)).filter(Boolean);
     questions.splice(0,questions.length,...wrongQs);
   } else { questions.splice(0,questions.length,...originalQuestions); }
   index=0;score=0;streak=0;wrongAttempts=[];$('xp').textContent='0';$('streak').textContent='0';$('quiz').style.display='block';$('finishSlot').replaceChildren();render();window.scrollTo({top:0,behavior:'smooth'});
 }
 $('retry').addEventListener('click',()=>resetQuiz(false));
 $('retryWrong').addEventListener('click',()=>resetQuiz(true));
});
render();
})();
</script>
