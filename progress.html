<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#315efb"><link rel="icon" href="skillup-logo-exact.webp"><title>SkillUp | Progress</title><style>body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.page{max-width:680px;margin:auto;padding:20px 12px 90px}.hero{background:linear-gradient(125deg,#071a31,#315efb);color:white;border-radius:22px;padding:24px;margin-bottom:14px}.hero h1{margin:0;font-size:28px}.hero p{margin:6px 0 0;color:#dce7f6;font-size:13px}.card{background:white;border:1px solid #e7ebf2;border-radius:19px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{border:1px solid #e7ebf2;border-radius:14px;padding:15px;background:#fbfcff}.stat b{display:block;color:#315efb;font-size:24px}.stat span{font-size:11px;color:#667085;font-weight:700}.bar{height:10px;background:#e9eef7;border-radius:99px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#315efb,#6d4aff)}@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><main class="page"><section class="hero"><h1>📊 My Progress</h1><p>See what you have learned, practiced and completed on SkillUp.</p></section><section class="card"><div class="grid"><div class="stat"><b id="records">0</b><span>Learning records</span></div><div class="stat"><b id="topics">0</b><span>Topics practiced</span></div><div class="stat"><b id="subjects">0</b><span>Subjects</span></div><div class="stat"><b id="last">—</b><span>Last activity</span></div></div></section><section class="card"><b>Learning activity</b><p id="message" style="color:#667085;font-size:13px">Loading your progress…</p><div class="bar"><i id="bar"></i></div></section></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="central-config.js"></script><script src="central-auth.js"></script><script>(async()=>{const A=window.SkillUpAuth;if(!A||!A.configured)return;const s=await A.requireAuth(location.href);if(!s)return;try{const snap=await A.db.collection('skillup_progress').where('user_id','==',s.user.uid).get();const rows=snap.docs.map(d=>d.data());const topics=new Set(rows.map(r=>String(r.topic||'').trim()).filter(Boolean));const subjects=new Set(rows.map(r=>String(r.subject||'').trim()).filter(Boolean));document.getElementById('records').textContent=rows.length;document.getElementById('topics').textContent=topics.size;document.getElementById('subjects').textContent=subjects.size;const ts=rows.map(r=>new Date(r.updated_at||r.completed_at||r.created_at).getTime()).filter(Number.isFinite);if(ts.length)document.getElementById('last').textContent=new Date(Math.max(...ts)).toLocaleDateString(undefined,{day:'2-digit',month:'short'});document.getElementById('message').textContent=rows.length?'Keep practicing to build your learning streak.':'Start a practice session to see your progress here.';document.getElementById('bar').style.width=Math.min(100,rows.length/100*100)+'%'}catch(e){document.getElementById('message').textContent='Progress is temporarily unavailable.'}})()</script><script src="shared-nav.js"></script></body></html>
