<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp | Advanced Python Programming</title><style>:root{--navy:#183b63;--green:#58cc02;--muted:#718096;--line:#dfe7ee;--bg:#f7fafc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#263238}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0}.nav{height:58px;display:flex;align-items:center;justify-content:center;font-weight:950;color:var(--navy)}.wrap{max-width:900px;margin:auto;padding:22px 14px 80px}.hero{background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px;text-align:center;box-shadow:0 6px 20px #183b6310}.hero h1{margin:0;color:var(--navy);font-size:clamp(28px,5vw,42px)}.hero p{color:var(--muted);margin:10px auto 0}.level{margin:20px 0}.level h2{font-size:18px;color:var(--navy)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.concept{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;font-weight:800;display:flex;gap:10px;align-items:center;text-decoration:none;color:#263238}.num{width:30px;height:30px;border-radius:10px;background:#effbe9;color:#338700;display:grid;place-items:center;flex:0 0 auto}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><nav class="nav">🐍 Advanced Python Programming</nav></header><main class="wrap"><section class="hero"><h1>Advanced Python Programming</h1><p>Learn deeply, practise progressively, and build production-ready Python skills.</p></section><div id="path"></div></main><script src="python-path-curriculum.js"></script><script>const root=document.getElementById('path');SKILLUP_PYTHON_PATH.levels.forEach(l=>{const s=document.createElement('section');s.className='level';s.innerHTML='<h2>Level '+l.level+' · '+l.title+'</h2><div class="grid">'+l.concepts.map((c,i)=>'<a class="concep
