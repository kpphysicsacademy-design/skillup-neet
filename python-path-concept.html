<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp Python Concept</title><style>:root{--green:#58cc02;--green-dark:#46a302;--navy:#183b63;--ink:#263238;--line:#dfe7ee;--bg:#f7fafc;--red:#ff4b4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0}.nav{height:58px;display:flex;align-items:center;justify-content:center;font-weight:950;color:var(--navy)}.wrap{max-width:780px;margin:auto;padding:18px 14px 80px}.quiz{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px}.quizhead{display:flex;justify-content:space-between;color:#718096;font-size:11px;font-weight:950}.qtext{font-size:22px;font-weight:900;line-height:1.4;margin:24px 0 18px}.answers{display:grid;gap:11px}.ans{position:relative;min-height:56px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:13px 16px 13px 50px;text-align:left;font-size:16px;font-weight:800;cursor:pointer}.ans:before{content:attr(data-letter);position:absolute;left:14px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:2px solid #cbd7e0;border-radius:8px;display:grid;place-items:center}.ans.correct{border-color:var(--green);background:#effbe9}.ans.wrong{border-color:var(--red);background:#fff0f0}.ans:disabled{cursor:default}.actions{display:flex;justify-content:flex-end;margin-top:16px}.continue{display:none;border:0;border-radius:14px;background:var(--green);box-shadow:0 4px 0 var(--green-dark);color:#fff;padding:13px 22px;font-weight:950;cursor:pointer}</style></head><body><header class="top"><nav class="nav" id="title">Python</nav></header><main class="wrap"><section class="quiz"><div class="quizhead"><span>🎯 PRACTICE</span><span id="qnum"></span></div><div id="question" class="qtext"></div><div id="answers" class="answers"></div><div class="actions"><button id="continue" class="continue">Continue →</button></div></section></main><script src="python-question-bank.js"></script><script>const concept=new URLSearchParams(location.search).get('concept')||'Python execution model';document.getElementById('title').textContent=concept;const fallback=[['Practice: '+concept,['Core concept','Advanced concept','Applied concept','None'],0]];const questions=window.SKILLUP_PYTHON_QUIZ_BANK[concept]||fallback;let i=0,answered=false;const qEl=document.getElementById('question'),aEl=document.getElementById('answers'),cont=document.getElementById('continue'),qnum=document.getElementById('qnum');function render(){answered=false;cont.style.display='none';cont.disabled=false;cont.textContent='Continue →';qnum.textContent=(i+1)+' / '+questions.length;const q=questions[i];qEl.textContent=q[0];aEl.innerHTML='';q[1].slice(0,4).forEach((x,n)=>{const b=document.createElement('button');b.className='ans';b.dataset.letter=String.fromCharCode(65+n);b.textContent=x;b.onclick=()=>answer(n,b);aEl.appendChild(b)})}function answer(n,button){if(answered)return;answered=true;const q=questions[i];[...aEl.children].forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct')});if(n!==q[2])button.classList.add('wrong');cont.textContent=i===questions.length-1?'Done ✓':'Continue →';cont.style.display='inline-block'}cont.onclick=()=>{if(i<questions.length-1){i++;render()}else{cont.disabled=true}};render();</script></body></html>
