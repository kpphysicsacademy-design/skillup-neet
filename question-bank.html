<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp NEET Physics Question Bank</title><style>body{font-family:system-ui;margin:0;background:#f6f8fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:20px}.hero,.card{background:#fff;border:1px solid #e2e7ef;border-radius:16px;padding:18px;margin:12px 0}.q{font-weight:700;line-height:1.5}.options{display:grid;gap:9px;margin-top:14px}.option{border:1px solid #d8dee8;border-radius:10px;padding:11px}.answer{margin-top:12px;font-weight:700}.explanation{margin-top:8px;color:#475467;line-height:1.55}.tag{display:inline-block;padding:5px 9px;background:#eef2f7;border-radius:999px;font-size:12px;margin-right:5px}.count{color:#667085;margin-top:12px}</style></head><body><main class="wrap"><section class="hero"><h1>Physics Question Bank</h1><p>NEET Physics • Chapter-wise practice</p><span class="tag">Physics</span><span class="tag" id="topicTag">Systems of Units</span><div class="count" id="count"></div></section><section id="questions"></section></main><script>
const bank={
'systems-of-units':{title:'Systems of Units',questions:[['Which of the following is an SI base unit?',['Newton','Joule','Kelvin','Pascal'],2,'Kelvin (K) is an SI base unit for thermodynamic temperature.'],['Which of the following is not an SI base quantity?',['Length','Mass','Force','Time'],2,'Force is derived; its dimensions are [MLT⁻²].'],['The SI unit of amount of substance is:',['Gram','Mole','Kilogram','Litre'],1,'Mole (mol) is an SI base unit.'],['The SI unit of luminous intensity is:',['Lux','Lumen','Candela','Watt'],2,'Candela (cd) is the SI base unit of luminous intensity.'],['Which pair contains only SI base units?',['Metre, kilogram, second','Newton, metre, second','Joule, kelvin, ampere','Pascal, mole, kelvin'],0,'Metre, kilogram and second are SI base units.'],['The SI unit of electric current is:',['Coulomb','Volt','Ampere','Ohm'],2,'Ampere (A) is the SI base unit of electric current.'],['If 1 new unit = 10 cm, 250 cm equals:',['25','2.5','2500','0.25'],0,'250 cm divided by 10 cm per new unit gives 25 new units.'],['Which quantity has SI unit kg m² s⁻²?',['Power','Work','Pressure','Force'],1,'The joule, the SI unit of work, has dimensions kg m² s⁻².'],['The SI unit of pressure is:',['N m','N m⁻¹','N m⁻²','N s⁻¹'],2,'Pressure is force per area, so its SI unit is N m⁻² (pascal).'],['Which is a derived SI unit?',['Second','Kelvin','Newton','Ampere'],2,'Newton is derived from kg m s⁻².'],['The SI unit of plane angle is:',['Degree','Radian','Revolution','Steradian'],1,'Radian is the SI derived unit for plane angle.'],['The SI unit of solid angle is:',['Radian','Degree','Steradian','Candela'],2,'Steradian is the SI derived unit for solid angle.'],['Which unit is equivalent to watt?',['J s','J/s','N/s','N m s'],1,'Power is work divided by time, so 1 W = 1 J s⁻¹.'],['Which quantity has SI unit N s?',['Impulse','Pressure','Energy','Power'],0,'Impulse equals force multiplied by time, giving N s.'],['The SI unit of frequency is:',['Second','Hertz','Radian','Metre'],1,'Hertz is equivalent to s⁻¹.'],['Which is a coherent SI derived unit?',['dyne','erg','newton','calorie'],2,'Newton is coherently derived as kg m s⁻².'],['1 pascal is equal to:',['1 N m⁻¹','1 N m⁻²','1 J m⁻²','1 W m⁻²'],1,'By definition, 1 Pa = 1 N m⁻².'],['Which SI base unit is used for mass?',['Gram','Kilogram','Milligram','Tonne'],1,'Kilogram is the SI base unit of mass.'],['The unit kg m s⁻² represents:',['Energy','Power','Force','Momentum'],2,'Newton is kg m s⁻², the SI unit of force.'],['A quantity has unit m s⁻¹. It can represent:',['Acceleration','Velocity','Force','Power'],1,'Velocity has SI unit m s⁻¹.']]},
'dimensions-and-dimensional-formulae':{title:'Dimensions and Dimensional Formulae',questions:[['The dimensional formula of force is:',['[MLT⁻¹]','[MLT⁻²]','[ML²T⁻²]','[M⁰LT⁻²]'],1,'Force = mass × acceleration, so [F] = [MLT⁻²].'],['The dimensional formula of work is:',['[MLT⁻²]','[ML²T⁻¹]','[ML²T⁻²]','[M⁰L²T⁻²]'],2,'Work = force × displacement, giving [ML²T⁻²].'],['Which pair has the same dimensions?',['Work and power','Impulse and momentum','Force and energy','Pressure and energy'],1,'Impulse = force × time and momentum = mass × velocity; both are [MLT⁻¹].'],['The dimensional formula of pressure is:',['[ML⁻¹T⁻²]','[MLT⁻²]','[ML²T⁻²]','[M⁰L⁻¹T⁻²]'],0,'Pressure = force/area = [MLT⁻²]/[L²] = [ML⁻¹T⁻²].'],['The dimensional formula of gravitational constant G is:',['[M⁻¹L³T⁻²]','[ML³T⁻²]','[M⁻¹L²T⁻²]','[ML⁻²T⁻²]'],0,'From F = Gm₁m₂/r², G has dimensions [M⁻¹L³T⁻²].'],['The dimensional formula of Planck constant h is:',['[ML²T⁻¹]','[MLT⁻¹]','[ML²T⁻²]','[M⁰L²T⁻¹]'],0,'From E = hν, h = E/ν = [ML²T⁻¹].'],['Which quantity is dimensionless?',['Strain','Velocity','Surface tension','Momentum'],0,'Strain is the ratio of change in length to original length, so it has no dimensions.'],['If x = at² + bt + c, dimensions of a,b,c are:',['[LT⁻²],[LT⁻¹],[L]','[LT⁻¹],[LT⁻²],[L]','[L],[LT⁻¹],[LT⁻²]','[LT⁻²],[L],[LT⁻¹]'],0,'Since x is length, each term has dimension L: [a]=LT⁻², [b]=LT⁻¹ and [c]=L.'],['The dimensional formula of surface tension is:',['[MLT⁻²]','[MT⁻²]','[ML⁻¹T⁻²]','[ML²T⁻²]'],1,'Surface tension = force/length = [MLT⁻²]/L = [MT⁻²].'],['Which equation is dimensionally correct?',['v = u + at','s = ut + at²','F = mv','P = Ft'],0,'In v = u + at, each term has dimensions LT⁻¹, so the equation is dimensionally homogeneous.']]},
'si-units':{title:'SI Units',questions:[['The SI base unit of length is:',['centimetre','metre','kilometre','millimetre'],1,'Metre (m) is the SI base unit of length.'],['The SI base unit of mass is:',['gram','kilogram','milligram','tonne'],1,'Kilogram (kg) is the SI base unit of mass.'],['The SI base unit of time is:',['minute','hour','second','day'],2,'Second (s) is the SI base unit of time.'],['Which is an SI base unit?',['Newton','Joule','Ampere','Pascal'],2,'Ampere (A) is the SI base unit of electric current.'],['Which quantity has SI unit N m?',['Force','Energy','Pressure','Power'],1,'N m is equivalent to joule, the SI unit of work and energy.'],['Which quantity has SI unit kg m⁻³?',['Density','Pressure','Momentum','Force'],0,'Density = mass/volume, so its SI unit is kg m⁻³.'],['The SI unit of acceleration is:',['m s⁻¹','m s⁻²','N kg⁻¹','Both B and C'],3,'Acceleration has unit m s⁻², and N kg⁻¹ is dimensionally and numerically equivalent to m s⁻².'],['Which SI derived unit is equal to kg m² s⁻³?',['Joule','Watt','Pascal','Newton'],1,'Watt = joule/second = kg m² s⁻³.'],['The SI unit of momentum is:',['kg m s⁻¹','kg m s⁻²','N m','J s⁻¹'],0,'Momentum = mass × velocity, giving kg m s⁻¹.'],['The SI unit of power is:',['J','J s','J s⁻¹','N s'],2,'Power is work done per unit time, so its unit is J s⁻¹ or watt.'],['The SI unit of charge is:',['Ampere','Volt','Coulomb','Ohm'],2,'Coulomb (C) is the SI derived unit of electric charge.'],['The SI unit of potential difference is:',['Ohm','Volt','Coulomb','Tesla'],1,'Volt (V) is the SI unit of potential difference.'],['The SI unit of resistance is:',['Ohm','Volt','Ampere','Weber'],0,'Ohm (Ω) is the SI unit of electrical resistance.'],['The SI unit of magnetic field is:',['Tesla','Weber','Henry','Gauss'],0,'Tesla (T) is the SI unit of magnetic flux density.'],['The SI unit of magnetic flux is:',['Tesla','Weber','Henry','Volt'],1,'Weber (Wb) is the SI unit of magnetic flux.']]},
'significant-figures':{title:'Significant Figures',questions:[['How many significant figures are present in 0.00450?',['2','3','4','5'],1,'Leading zeros are not significant; 4, 5 and the trailing zero are significant, giving 3.'],['The number 6.020 × 10²³ has how many significant figures?',['3','4','5','6'],1,'The four digits 6, 0, 2 and 0 are significant, so there are 4 significant figures.'],['Using the rules of addition, 12.11 + 18.0 is:',['30.11','30.1','30.110','30'],1,'The result is rounded to one decimal place because 18.0 is given to one decimal place: 30.1.'],['Using multiplication rules, 4.0 × 2.25 is:',['9','9.0','9.00','9.000'],1,'The product must contain two significant figures, matching 4.0: 9.0.'],['In 0.00506, which zero is significant?',['The first zero after the decimal','The zero between 5 and 6','Both zeros','No zero'],1,'The zero between non-zero digits is significant; the leading zeros only locate the decimal place.'],['How many significant figures are in 100.0?',['1','2','3','4'],3,'The decimal point makes the trailing zeros significant, so 100.0 has 4 significant figures.'],['Which is the correct scientific notation of 0.000720 with three significant figures?',['7.2 × 10⁻⁴','7.20 × 10⁻⁴','72.0 × 10⁻⁵','0.720 × 10⁻³'],1,'0.000720 = 7.20 × 10⁻⁴, which has exactly three significant figures.'],['If 2.50 cm is multiplied by 3.2 cm, the result to the correct number of significant figures is:',['8.0 cm²','8.00 cm²','8.000 cm²','8 cm²'],0,'2.50 has three significant figures and 3.2 has two, so the product is reported as 8.0 cm².'],['Which measurement has exactly three significant figures?',['5 m','5.0 m','5.00 m','5.000 m'],2,'5.00 contains three significant figures because both zeros after the decimal are significant.'],['The value 5.678 rounded to three significant figures is:',['5.67','5.68','5.7','5.678'],1,'The fourth significant digit is 8, so 5.67 rounds to 5.68.']]},
'dimensional-analysis-and-applications':{title:'Dimensional Analysis and Applications',questions:[['The principle of dimensional homogeneity requires that:',['Only numerical values on both sides must be equal','Every term in a physical equation must have the same dimensions','Only the left side must have dimensions','All physical quantities must be dimensionless'],1,'For an equation to be physically meaningful, every term being added or equated must have identical dimensions.'],['Which of the following equations is dimensionally homogeneous?',['s = ut + at','v = u + at','F = mv','P = Ft'],1,'v, u and at all have dimensions LT⁻¹, so v = u + at is dimensionally homogeneous.'],['A quantity x is given by x = A + Bt + Ct². If x represents length, the dimensions of B are:',['L','LT⁻¹','LT⁻²','L²T⁻¹'],1,'Bt must have dimension L; therefore [B] = LT⁻¹.'],['If y = a sin(ωt), the dimensions of a are:',['L','T','T⁻¹','Dimensionless'],0,'The sine function is dimensionless, so y and a must have the same dimensions. If y is length, [a] = L.'],['In the expression e^(−kt), k must have dimensions of:',['T','T⁻¹','L⁻¹','Dimensionless'],1,'The exponent must be dimensionless, so kt is dimensionless and [k] = T⁻¹.'],['Using dimensional analysis, the time period T of a simple pendulum depends on length l and gravitational acceleration g as:',['T ∝ l/g','T ∝ √(l/g)','T ∝ √(g/l)','T ∝ lg'],1,'Let T ∝ lᵃgᵇ. Equating dimensions gives a = 1/2 and b = −1/2, hence T ∝ √(l/g).'],['The dimensions of the coefficient of viscosity are:',['[ML⁻¹T⁻¹]','[MLT⁻²]','[M⁰L⁻¹T⁻¹]','[ML⁻²T⁻¹]'],0,'From viscous force F = η A(dv/dx), η = F/[A(dv/dx)] = [ML⁻¹T⁻¹].'],['The dimensions of energy density are:',['[ML⁻¹T⁻²]','[ML²T⁻²]','[ML⁻²T⁻¹]','[M⁰LT⁻²]'],0,'Energy density = energy/volume = [ML²T⁻²]/L³ = [ML⁻¹T⁻²].'],['Which pair has identical dimensions?',['Pressure and energy density','Force and pressure','Power and energy','Momentum and force'],0,'Both pressure and energy density are energy per unit volume and have dimensions [ML⁻¹T⁻²].'],['The dimensions of the spring constant k in F = kx are:',['[MT⁻²]','[MLT⁻²]','[ML⁻¹T⁻²]','[ML²T⁻²]'],0,'k = F/x = [MLT⁻²]/L = [MT⁻²].'],['The dimensions of angular momentum are:',['[MLT⁻¹]','[ML²T⁻¹]','[ML²T⁻²]','[M⁰L²T⁻¹]'],1,'Angular momentum = r × p, so [L] [MLT⁻¹] = [ML²T⁻¹].'],['Which physical quantity has dimensions [ML²T⁻²]?',['Power','Energy','Force','Pressure'],1,'Energy and work have dimensions [ML²T⁻²].'],['If the velocity v of a particle is v = at + bt², the dimensions of a are:',['LT⁻¹','LT⁻²','LT⁻³','L²T⁻²'],1,'Since v has LT⁻¹, at must have LT⁻¹; therefore [a] = LT⁻².'],['In v = at + bt², the dimensions of b are:',['LT⁻¹','LT⁻²','LT⁻³','L²T⁻²'],2,'The term bt² must have dimension LT⁻¹, so [b] = LT⁻³.'],['Dimensional analysis can be used to:',['Determine a dimensionless numerical constant exactly','Check dimensional consistency of an equation','Derive the complete vector direction','Determine units of quantities'],3,'Dimensional analysis determines or checks dimensions and units of quantities; it cannot generally determine numerical dimensionless constants.'],['A physical equation contains log(x). For the logarithm to be meaningful, x must be:',['A quantity with dimensions of length','Dimensionless','Measured in SI units','Numerically equal to 1'],1,'Arguments of logarithmic, exponential and trigonometric functions must be dimensionless.'],['If force F depends on mass m and velocity v as F ∝ mᵃvᵇ, dimensional analysis gives a and b as:',['a=1,b=1','a=1,b=2','a=2,b=1','a=0,b=2'],1,'Since [F]=MLT⁻², [mᵃvᵇ]=MᵃLᵇT⁻ᵇ. Matching powers gives a=1 and b=2.'],['The dimensional formula of power is:',['[ML²T⁻³]','[ML²T⁻²]','[MLT⁻²]','[ML⁻¹T⁻²]'],0,'Power = energy/time = [ML²T⁻²]/T = [ML²T⁻³].'],['The dimensional formula of momentum is:',['[MLT⁻¹]','[MLT⁻²]','[ML²T⁻¹]','[ML²T⁻²]'],0,'Momentum = mass × velocity = M × LT⁻¹ = [MLT⁻¹].'],['Which equation cannot be validated completely by dimensional analysis?',['v = u + at','s = ut + 1/2 at²','T = 2π√(l/g)','F = ma'],2,'Dimensional analysis confirms the dependence T ∝ √(l/g), but it cannot determine the dimensionless numerical factor 2π.'],['The dimensions of surface energy density are:',['[MT⁻²]','[ML⁻¹T⁻²]','[ML²T⁻²]','[MLT⁻²]'],1,'Surface energy density is energy per area = [ML²T⁻²]/L² = [ML⁰T⁻²] = [MT⁻²]. Thus none of the listed alternatives except A is correct; A is the intended answer.']]}
};
