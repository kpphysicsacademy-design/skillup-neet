cted)return;selected=true;const ok=j===x.a;opts.querySelectorAll('button').forEach((v,k)=>{v.disabled=true;if(k===x.a)v.classList.add('correctOpt')});const f=document.createElement('div');f.className='feedback '+(ok?'correct':'wrong');f.textContent=ok?'✓ Correct! +10 XP':'✗ Not quite — review the explanation';card.appendChild(f);const e=document.createElement('div');e.className='explanation';e.innerHTML='<b>Explanation:</b> '+x.e;card.appendChild(e);if(ok){correct++;xp+=10}else hearts=Math.max(0,hearts-1);answered++;update();const next=document.createElement('button');next.className='nextBtn';next.textContent=current===questions.length-1?'See Results →':'Continue →';next.onclick=()=>{current++;show()};card.appendChild(next)};opts.appendChild(b)});card.appendChild(opts);root.appendChild(card);update()}show()}
