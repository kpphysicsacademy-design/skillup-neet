{q:"On dilution, the degree of ionization of a weak electrolyte generally:",o:["Decreases","Increases","Becomes zero","Always remains 100%"],a:1,e:"Dilution favors ionization of weak electrolytes, so their degree of ionization increases."},
{q:"For a weak electrolyte AB ⇌ A+ + B−, if the initial concentration is C and degree of ionization is α, the equilibrium concentration of AB is:",o:["Cα","C(1−α)","C/α","C+α"],a:1,e:"The fraction α ionizes, leaving C(1−α) of the original electrolyte unionized."},
{q:"For AB ⇌ A+ + B− with initial concentration C and degree of ionization α, the equilibrium concentration of A+ is:",o:["C(1−α)","Cα","C/α","α/C"],a:1,e:"Each ionized AB unit produces one A+ ion, so [A+] = Cα."},
{q:"For AB ⇌ A+ + B− with initial concentration C and degree of ionization α, the equilibrium concentration of B− is:",o:["Cα","C(1−α)","C/α","C+α"],a:0,e:"Each ionized AB unit produces one B− ion, so [B−] = Cα."},
{q:"For a weak 1:1 electrolyte AB ⇌ A+ + B−, its dissociation constant can be written as:",o:["K = C(1−α)/α²","K = Cα²/(1−α)","K = Cα/(1−α)","K = α²/C"],a:1,e:"K = [A+][B−]/[AB] = (Cα)(Cα)/[C(1−α)] = Cα²/(1−α)."},
{q:"When α is very small for a weak electrolyte, the expression K = Cα²/(1−α) can be approximated as:",o:["K ≈ Cα","K ≈ Cα²","K ≈ α/C","K ≈ C/α²"],a:1,e:"For α ≪ 1, 1−α ≈ 1, giving K ≈ Cα²."},
{q:"For a weak electrolyte under the small-ionization approximation, α is proportional to:",o:["√(K/C)","K/C","C/K","√(C/K)"],a:0,e:"From K ≈ Cα², α ≈ √(K/C)."},
{q:"At the same concentration, a stronger weak electrolyte generally has:",o:["Smaller degree of ionization","Larger degree of ionization","Zero degree of ionization","Exactly 100% ionization"],a:1,e:"A larger dissociation constant indicates greater ionization at the same concentration."},
{q:"If the degree of ionization of a weak electrolyte is 0.05, its percentage ionization is:",o:["0.05%","0.5%","5%","50%"],a:2,e:"Percentage ionization = α × 100 = 0.05 × 100 = 5%."},
{q:"If 5% of a weak electrolyte is ionized, its degree of ionization α is:",o:["5","0.5","0.05","0.005"],a:2,e:"α is the fraction ionized, so 5% = 5/100 = 0.05."},
{q:"Which change generally increases the degree of ionization of a weak electrolyte?",o:["Increasing concentration","Dilution with solvent","Adding more common ion","Decreasing volume"],a:1,e:"Dilution shifts the ionization equilibrium toward ions and increases α for a weak electrolyte."}
];</script><script>window.SkillUpKwQuestions=window.SkillUpKwQuestions||[
{q:"The ionic product of water is represented by:",o:["Ka","Kb","Kw","Ksp"],a:2,e:"Kw is the equilibrium constant associated with the self-ionization of water."},
{q:"At 25 °C, the value of Kw is approximately:",o:["1.0 × 10−7","1.0 × 10−14","1.0 × 10−1","1.0 × 10^14"],a:1,e:"At 25 °C, Kw = [H+][OH−] ≈ 1.0 × 10−14."},
{q:"The expression for the ionic product of water is:",o:["Kw = [H+]/[OH−]","Kw = [H+][OH−]","Kw = [H+]+[OH−]","Kw = [H2O]/([H+][OH−])"],a:1,e:"For water, Kw = [H+][OH−]."},
{q:"In pure water at 25 °C, the concentrations of H+ and OH− are:",o:["Both 1.0 × 10−7 M","Both 1.0 × 10−14 M","H+ = 1.0 M and OH− = 10−14 M","Both zero"],a:0,e:"In neutral pure water at 25 °C, [H+] = [OH−] = 1.0 × 10−7 M."},
{q:"If [H+] = 1.0 × 10−3 M at 25 °C, [OH−] is:",o:["1.0 × 10−11 M","1.0 × 10−17 M","1.0 × 10−3 M","1.0 × 10−7 M"],a:0,e:"[OH−] = Kw/[H+] = 10−14/10−3 = 10−11 M."},
{q:"If [OH−] = 1.0 × 10−5 M at 25 °C, [H+] is:",o:["1.0 × 10−9 M","1.0 × 10−19 M","1.0 × 10−5 M","1.0 × 10−14 M"],a:0,e:"[H+] = Kw/[OH−] = 10−14/10−5 = 10−9 M."},
{q:"If [H+] = 1.0 × 10−7 M at 25 °C, the solution is:",o:["Acidic","Basic","Neutral","Strongly alkaline"],a:2,e:"At 25 °C, [H+] = 10−7 M corresponds to neutral water."},
{q:"If [H+] is greater than [OH−] at a given temperature, the solution is:",o:["Acidic","Basic","Neutral","Always saturated"],a:0,e:"A higher hydrogen-ion concentration than hydroxide-ion concentration indicates an acidic solution."},
{q:"If [OH−] is greater than [H+] at a given temperature, the solution is:",o:["Acidic","Basic","Neutral","Always a buffer"],a:1,e:"A higher hydroxide-ion concentration indicates a basic solution."},
{q:"For a conjugate acid-base pair at a fixed temperature, the relationship is:",o:["KaKb = Kw","Ka + Kb = Kw","Ka/Kb = 1","Ka = Kb = Kw"],a:0,e:"For conjugate acid-base pairs, Ka × Kb = Kw."},
{q:"At 25 °C, pKw is equal to:",o:["7","14","1","−14"],a:1,e:"pKw = −log Kw = 14 when Kw = 10−14."},
{q:"If the ionic product of water at a certain temperature is 1.0 × 10−13, pKw is:",o:["13","−13","1.0 × 10−13","14"],a:0,e:"pKw = −log(10−13) = 13."},
{q:"The value of Kw primarily changes with:",o:["Pressure only","Temperature","Concentration of solute only","Catalyst"],a:1,e:"The ionization equilibrium constant of water depends on temperature."},
{q:"If temperature increases and Kw increases, the neutral pH at that temperature:",o:["Must remain exactly 7","Is less than 7","Is greater than 7","Cannot be related to Kw"],a:1,e:"For neutral water [H+] = √Kw; a larger Kw gives a larger [H+] and therefore a lower neutral pH."},
{q:"Which statement about Kw is correct?",o:["Kw is always exactly 10−14 at every temperature","Kw equals [H+][OH−] at equilibrium","Kw is independent of temperature","Kw applies only to acidic solutions"],a:1,e:"Kw is the equilibrium constant for water ionization and its numerical value varies with temperature."}
];</script><script>window.SkillUpPhPOHQuestions=window.SkillUpPhPOHQuestions||[
{q:"The pH of a solution is defined as:",o:["log[H+]","−log[H+]","−log[OH−]","[H+]×[OH−]"],a:1,e:"pH = −log[H+], where the hydrogen-ion concentration is expressed in mol L−1."},
{q:"The pOH of a solution is defined as:",o:["−log[OH−]","log[OH−]","−log[H+]","[OH−]²"],a:0,e:"pOH = −log[OH−]."},
{q:"At 25 °C, the relationship between pH and pOH is:",o:["pH + pOH = 7","pH + pOH = 14","pH − pOH = 14","pH × pOH = 14"],a:1,e:"At 25 °C, pKw = 14, so pH + pOH = 14."},

{q:"At 25 °C, pure neutral water has pH approximately:",o:["0","7","14","1"],a:1,e:"For neutral water at 25 °C, [H+] = 10−7 M, giving pH 7."},
{q:"A solution with pH less than 7 at 25 °C is generally:",o:["Acidic","Basic","Neutral","Always a buffer"],a:0,e:"At 25 °C, pH below 7 corresponds to [H+] greater than [OH−], so the solution is acidic."},

{q:"If [H+] = 1.0 × 10−9 M at 25 °C, the pH is:",o:["9","5","−9","14"],a:0,e:"pH = −log(10−9) = 9."},

{q:"A tenfold increase in [H+] causes pH to:",o:["Increase by 1","Decrease by 1","Increase by 10","Remain unchanged"],a:1,e:"Because pH is logarithmic, a tenfold increase in [H+] lowers pH by one unit."},
{q:"If pH changes from 3 to 5, the [H+] changes by a factor of:",o:["100-fold decrease","100-fold increase","10-fold decrease","No change"],a:0,e:"[H+] changes from 10−3 to 10−5 M, which is a 100-fold decrease."},
{q:"Which statement is correct at 25 °C?",o:["pH 7 is always neutral at every temperature","pH + pOH = 14","pH = pOH for every solution","Lower pH means lower [H+]"],a:1,e:"At 25 °C, pH + pOH = 14 because pKw = 14."}
];</script><script>window.SkillUpPolyproticAcidsQuestions=window.SkillUpPolyproticAcidsQuestions||[
{q:"A polyprotic acid is an acid that can donate:",o:["Only one proton","More than one proton per molecule","Only hydroxide ions","Only electron pairs"],a:1,e:"A polyprotic acid has two or more ionizable protons that can be donated stepwise."},
{q:"Which of the following is a diprotic acid?",o:["HCl","HNO3","H2SO4","CH3COOH"],a:2,e:"H2SO4 can donate two protons and is classified as diprotic."},
{q:"Which of the following is a triprotic acid?",o:["HCl","H2CO3","H3PO4","HNO3"],a:2,e:"H3PO4 has three ionizable protons and is triprotic."},
{q:"The first ionization of a polyprotic acid is generally:",o:["Less favorable than the second","More favorable than subsequent ionizations","Impossible in water","Independent of proton removal"],a:1,e:"After the first proton is removed, the species becomes more negatively charged, making further proton removal generally less favorable."},
{q:"For a diprotic acid H2A, the first ionization can be represented as:",o:["H2A ⇌ H+ + HA−","H2A ⇌ 2H+ + A2− only","HA− ⇌ H+ + A2−","H2A ⇌ OH− + HA+"],a:0,e:"The first step removes one proton: H2A ⇌ H+ + HA−."},
{q:"For H2A ⇌ H+ + HA−, the first dissociation constant Ka1 is:",o:["[H2A]/([H+][HA−])","[H+][HA−]/[H2A]","[HA−]/[H2A]","[H+]/[HA−]"],a:1,e:"Ka1 = [H+][HA−]/[H2A]."},
{q:"The second ionization of a diprotic acid H2A is:",o:["H2A ⇌ H+ + HA−","HA− ⇌ H+ + A2−","A2− ⇌ H+ + A3−","H2O ⇌ H+ + OH−"],a:1,e:"The second proton is removed from HA−: HA− ⇌ H+ + A2−."},
{q:"For a typical diprotic acid, the relationship between Ka1 and Ka2 is:",o:["Ka1 < Ka2","Ka1 > Ka2","Ka1 = 0","Ka1 and Ka2 must always be equal"],a:1,e:"The second ionization is generally less favorable, so Ka1 is greater than Ka2."},
{q:"For a triprotic acid H3A, the ionization occurs:",o:["In one compulsory step only","In three successive proton-loss steps","Only after complete neutralization","Only in basic solution"],a:1,e:"A triprotic acid can lose three protons successively, with Ka1, Ka2 and Ka3."},
{q:"Which statement about Ka values of a polyprotic acid is generally correct?",o:["Ka1 < Ka2 < Ka3","Ka1 > Ka2 > Ka3","All Ka values are always equal","Only Ka3 exists"],a:1,e:"Each successive proton is generally harder to remove, so Ka values decrease stepwise."},
{q:"For carbonic acid, H2CO3, the first ionization produces:",o:["H+ and CO3^2−","H+ and HCO3−","2H+ and CO3^2− directly","OH− and HCO3−"],a:1,e:"H2CO3 ⇌ H+ + HCO3− is the first ionization step."},
{q:"In the second ionization of carbonic acid, HCO3− acts as a:",o:["Proton donor","Proton acceptor only","Non-electrolyte","Lewis acid only"],a:0,e:"HCO3− can donate its remaining acidic proton to form CO3^2−."},
{q:"For H3PO4, the species formed after loss of two protons is:",o:["H2PO4−","HPO4^2−","PO4^3−","H3PO4"],a:1,e:"H3PO4 loses two protons stepwise to form HPO4^2−."},
{q:"In a solution of a weak diprotic acid where Ka1 is much larger than Ka2, the H+ concentration is often dominated by:",o:["The second ionization","The first ionization","Only water","The third ionization"],a:1,e:"When Ka1 ≫ Ka2, the first dissociation contributes the major amount of H+."},
{q:"Which statement about neutralization of a polyprotic acid is correct?",o:["It can consume more than one mole of OH− per mole of acid when all acidic protons are neutralized","It always consumes exactly one mole of OH− per mole","It cannot react with OH−","Only the last proton reacts with OH−"],a:0,e:"A polyprotic acid can neutralize one OH− for each acidic proton when complete neutralization occurs."}
];</script><script>window.SkillUpCommonIonEffectQuestions=window.SkillUpCommonIonEffectQuestions||[
{q:"The common ion effect refers to the suppression of the ionization of a weak electrolyte by adding:",o:["A common solvent","A common ion","An inert gas","A catalyst"],a:1,e:"Addition of an ion already present in the equilibrium suppresses ionization of a weak electrolyte."},
{q:"The common ion effect is explained using:",o:["Le Chatelier's principle","Boyle's law only","Raoult's law only","Hess's law only"],a:0,e:"Adding a common ion disturbs the equilibrium, and the system shifts to oppose the change."},
{q:"The ionization of CH3COOH is suppressed by adding:",o:["HCl","CH3COONa","NaOH only","Glucose"],a:1,e:"CH3COONa provides CH3COO−, a common ion with the CH3COOH ionization equilibrium."},
{q:"For CH3COOH ⇌ H+ + CH3COO−, addition of sodium acetate causes the equilibrium to shift:",o:["To the right","To the left","No shift","Only toward H+"],a:1,e:"Added CH3COO− shifts the equilibrium left, suppressing acetic acid ionization."},
{q:"For NH4OH ⇌ NH4+ + OH−, addition of NH4Cl suppresses ionization because NH4Cl provides:",o:["OH−","NH4+","H+","Cl− only"],a:1,e:"NH4Cl supplies NH4+, a common ion with the weak-base equilibrium."},
{q:"The solubility of a sparingly soluble salt generally decreases when a soluble salt containing a common ion is added because:",o:["Ksp increases","The dissolution equilibrium shifts toward the solid","The solvent disappears","Temperature must increase"],a:1,e:"The added common ion shifts the dissolution equilibrium toward the undissolved salt."},
{q:"For AgCl(s) ⇌ Ag+ + Cl−, adding NaCl generally:",o:["Increases AgCl solubility","Decreases AgCl solubility","Does not affect solubility","Makes Ksp larger"],a:1,e:"Cl− is a common ion, so adding NaCl shifts the equilibrium toward solid AgCl."},
{q:"The common ion effect does NOT change the value of the equilibrium constant at a fixed temperature. For a weak acid, it mainly changes:",o:["Ka","The equilibrium concentrations","Temperature","Molar mass"],a:1,e:"At fixed temperature Ka remains constant, while the equilibrium composition changes."},
{q:"If a common ion is added to a weak electrolyte solution, its degree of ionization generally:",o:["Increases","Decreases","Becomes exactly 100%","Cannot change"],a:1,e:"The common ion suppresses ionization, decreasing the degree of ionization."},
{q:"Which pair demonstrates the common ion effect on a weak acid?",o:["CH3COOH and CH3COONa","HCl and NaCl","H2O and NaCl","Glucose and urea"],a:0,e:"Acetic acid and acetate ion form the classic weak-acid common-ion system."},
{q:"Which pair demonstrates the common ion effect on a weak base?",o:["NH4OH and NH4Cl","NaOH and NaCl","HCl and KCl","H2SO4 and Na2SO4"],a:0,e:"NH4Cl supplies NH4+, which is common to the NH4OH ionization equilibrium."},
{q:"For a weak electrolyte, adding a common ion generally causes the equilibrium concentration of the unionized electrolyte to:",o:["Increase","Decrease","Become zero","Remain necessarily unchanged"],a:0,e:"Suppressed ionization shifts equilibrium toward the unionized form."},
{q:"In the equilibrium HA ⇌ H+ + A−, addition of A− causes [H+] at equilibrium to generally:",o:["Increase","Decrease","Become zero","Remain necessarily unchanged"],a:1,e:"The equilibrium shifts left, consuming H+ and reducing its equilibrium concentration."},
{q:"Which statement is correct about the common ion effect?",o:["It increases ionization of weak electrolytes","It suppresses ionization and can decrease the solubility of sparingly soluble salts","It changes Ka at constant temperature","It always increases solubility"],a:1,e:"A common ion suppresses weak-electrolyte ionization and can reduce salt solubility by shifting dissolution equilibria toward the solid."},
{q:"For Ag2CrO4(s) ⇌ 2Ag+ + CrO4^2−, adding AgNO3 generally:",o:["Increases Ag2CrO4 solubility","Decreases Ag2CrO4 solubility","Changes Ksp","Has no effect on equilibrium"],a:1,e:"Ag+ is a common ion, so adding AgNO3 shifts the dissolution equilibrium toward solid Ag2CrO4 and decreases its solubility."}
];</script><script>window.SkillUpSaltHydrolysisQuestions=window.SkillUpSaltHydrolysisQuestions||[
{q:"Salt hydrolysis is the reaction of salt ions with:",o:["Only acid","Only base","Water","An inert gas"],a:2,e:"Salt hydrolysis involves reaction of ions derived from a salt with water, often producing H+ or OH−."},
{q:"A salt formed from a strong acid and a strong base generally undergoes:",o:["Complete hydrolysis","Partial hydrolysis","Negligible hydrolysis","Only cation hydrolysis"],a:2,e:"Ions of strong acids and strong bases have negligible reaction with water, so such salts generally do not hydrolyze appreciably."},
{q:"Which salt gives an approximately neutral aqueous solution?",o:["CH3COONa","NH4Cl","NaCl","Na2CO3"],a:2,e:"NaCl is formed from strong acid HCl and strong base NaOH, so its aqueous solution is approximately neutral at 25 °C."},
{q:"Sodium acetate solution is basic because:",o:["Na+ hydrolyzes strongly","CH3COO− reacts with water to produce OH−","NaCl is formed","Acetic acid is a strong acid"],a:1,e:"CH3COO− is the conjugate base of a weak acid and hydrolyzes: CH3COO− + H2O ⇌ CH3COOH + OH−."},
{q:"A salt of a weak base and strong acid generally gives an aqueous solution that is:",o:["Acidic","Basic","Neutral","Always saturated"],a:0,e:"The cation from the weak base hydrolyzes to produce H+, making the solution acidic."},
{q:"Which ion undergoes hydrolysis in an aqueous solution of NH4Cl?",o:["Cl−","NH4+","Na+","NO3−"],a:1,e:"NH4+ is the conjugate acid of the weak base NH3 and reacts with water to produce H3O+."},
{q:"For acetate ion hydrolysis, the equilibrium is:",o:["CH3COO− + H2O ⇌ CH3COOH + OH−","CH3COOH ⇌ H+ + CH3COO−","Na+ + H2O ⇌ NaOH + H+","CH3COO− ⇌ CH3COOH + H+"],a:0,e:"Acetate accepts a proton from water, producing acetic acid and OH−."},
{q:"The hydrolysis constant Kh for acetate ion is related to Ka of acetic acid by:",o:["Kh = Ka/Kw","Kh = Kw/Ka","Kh = KaKw","Kh = Ka + Kw"],a:1,e:"For the conjugate base of a weak acid, Kh = Kw/Ka."},
{q:"For the conjugate acid of a weak base, the hydrolysis constant is related to Kb by:",o:["Kh = Kw/Kb","Kh = Kb/Kw","Kh = KbKw","Kh = Kb + Kw"],a:0,e:"For a conjugate acid, Kh = Kw/Kb."},
{q:"Hydrolysis of a salt of a weak acid and strong base generally makes the solution:",o:["Acidic","Basic","Neutral","Always pH 7"],a:1,e:"The anion of the weak acid hydrolyzes and generates OH−, making the solution basic."},
{q:"Hydrolysis of a salt of a weak base and strong acid generally makes the solution:",o:["Acidic","Basic","Neutral","Always pOH 7"],a:0,e:"The cation of the weak base hydrolyzes and generates H3O+, making the solution acidic."},
{q:"A salt formed from a weak acid and weak base can have its solution pH determined by the relative values of:",o:["Ka and Kb","Only Kw","Only molar mass","Only temperature"],a:0,e:"For salts of weak acids and weak bases, the relative acid and base strengths determine the solution's acidic/basic character."},
{q:"Which salt undergoes hydrolysis mainly through its anion?",o:["NH4Cl","CH3COONa","NaCl","KNO3"],a:1,e:"CH3COO− is the conjugate base of weak CH3COOH and undergoes anion hydrolysis."},
{q:"Which salt undergoes hydrolysis mainly through its cation?",o:["NaCl","KNO3","NH4Cl","CH3COONa"],a:2,e:"NH4+ is the conjugate acid of weak NH3 and undergoes cation hydrolysis."},
{q:"Which statement about salt hydrolysis is correct?",o:["Every salt hydrolyzes completely","Hydrolysis can alter the pH of a salt solution","Hydrolysis always makes a solution neutral","Hydrolysis changes the value of Ka at fixed temperature"],a:1,e:"Hydrolysis of appropriate salt ions can produce H3O+ or OH− and thereby change solution pH."}
];</script><script>window.SkillUpHydrolysisConstantQuestions=window.SkillUpHydrolysisConstantQuestions||[
{q:"The hydrolysis constant of a salt is represented by:",o:["Ka","Kb","Kh","Kw"],a:2,e:"Kh denotes the equilibrium constant for the hydrolysis reaction of a salt ion with water."},

{q:"Solubility equilibrium is established when:",o:["A solid completely disappears","The rates of dissolution and precipitation become equal","No ions are present","Temperature becomes zero"],a:1,e:"At equilibrium, dissolution and precipitation occur at equal rates, so the concentrations remain constant."},
{q:"The equilibrium constant for the dissolution of a sparingly soluble salt is called:",o:["Ka","Kb","Ksp","Kw"],a:2,e:"Ksp is the solubility product constant for a sparingly soluble ionic solid."},

{q:"For CaF2(s) ⇌ Ca2+ + 2F−, Ksp is:",o:["[Ca2+][F−]","[Ca2+][F−]^2","[Ca2+]^2[F−]","[CaF2]"],a:1,e:"Stoichiometric coefficients become powers: Ksp = [Ca2+][F−]^2."},
{q:"If the ionic product Qsp is less than Ksp, the solution is:",o:["Unsaturated","Saturated and precipitating","Supersaturated","At equilibrium necessarily"],a:0,e:"Qsp < Ksp means more solid can dissolve, so the solution is unsaturated."},
{q:"If Qsp is greater than Ksp, the solution tends to:",o:["Dissolve more solid","Precipitate","Remain unchanged","Increase Ksp"],a:1,e:"Qsp > Ksp indicates supersaturation and the system tends to form precipitate until equilibrium is reached."},
{q:"If Qsp equals Ksp, the solution is:",o:["Unsaturated","Supersaturated","At solubility equilibrium","Unable to contain ions"],a:2,e:"Qsp = Ksp is the condition for equilibrium between the solid and dissolved ions."},
{q:"The molar solubility of AgCl is s mol L−1. Its Ksp is:",o:["s","s^2","2s","4s^2"],a:1,e:"AgCl gives Ag+ and Cl− each at concentration s, so Ksp = s × s = s^2."},
{q:"For Ag2CrO4(s) ⇌ 2Ag+ + CrO4^2−, if molar solubility is s, Ksp equals:",o:["s^2","2s^2","4s^3","s^3"],a:2,e:"[Ag+] = 2s and [CrO4^2−] = s, so Ksp = (2s)^2(s) = 4s^3."},
{q:"For a sparingly soluble salt, a smaller Ksp generally indicates:",o:["Greater solubility in the same type of equilibrium","Lower solubility","No dissolution","A larger equilibrium constant"],a:1,e:"For comparable salt stoichiometry, a smaller Ksp generally corresponds to lower molar solubility."},
{q:"Adding a common ion to a saturated solution of a sparingly soluble salt generally:",o:["Increases solubility","Decreases solubility","Changes Ksp at fixed temperature","Eliminates equilibrium"],a:1,e:"The common ion shifts the dissolution equilibrium toward the solid, decreasing solubility."},
{q:"Which condition favors precipitation of a sparingly soluble salt?",o:["Qsp < Ksp","Qsp = Ksp","Qsp > Ksp","Ksp = 0 only"],a:2,e:"Precipitation is favored when the ionic product exceeds Ksp."},
{q:"In a Ksp expression, the concentration of the pure solid is:",o:["Included as 1 M","Included as its mass concentration","Omitted","Always zero"],a:2,e:"Pure solids have unit activity and are omitted from equilibrium-constant expressions."},

{q:"Which statement is correct about solubility equilibrium?",o:["Ksp changes whenever ion concentrations change","Ksp is constant at a fixed temperature for a given equilibrium","All sparingly soluble salts have the same Ksp","Precipitation occurs whenever Qsp < Ksp"],a:1,e:"At a fixed temperature, Ksp is a constant for the particular dissolution equilibrium."}
];</script><script>window.SkillUpKspQuestions=window.SkillUpKspQuestions||[
{q:"Ksp is the equilibrium constant for:",o:["Acid ionization","Base ionization","Dissolution of a sparingly soluble salt","Water ionization only"],a:2,e:"Ksp, or solubility product constant, describes the equilibrium between a sparingly soluble ionic solid and its dissolved ions."},
{q:"For AgCl(s) ⇌ Ag+ + Cl−, Ksp is:",o:["[AgCl]","[Ag+][Cl−]","[Ag+]+[Cl−]","[Ag+]/[Cl−]"],a:1,e:"The pure solid is omitted, giving Ksp = [Ag+][Cl−]."},
{q:"For BaSO4(s) ⇌ Ba2+ + SO4^2−, the Ksp expression is:",o:["[Ba2+][SO4^2−]","[BaSO4]","[Ba2+]^2[SO4^2−]","[Ba2+]+[SO4^2−]"],a:0,e:"The dissolved ions appear with powers based on their stoichiometric coefficients."},
{q:"For CaF2(s) ⇌ Ca2+ + 2F−, Ksp equals:",o:["[Ca2+][F−]","[Ca2+][F−]^2","[Ca2+]^2[F−]","[F−]^2/[Ca2+]"],a:1,e:"Ksp = [Ca2+][F−]^2 because two fluoride ions are produced per formula unit."},

{q:"If Qsp < Ksp, the solution is:",o:["Unsaturated","Saturated","Supersaturated","Precipitating immediately"],a:0,e:"Qsp below Ksp means the ion concentrations are below equilibrium saturation and more solid can dissolve."},
{q:"If Qsp > Ksp, precipitation is:",o:["Favored","Impossible","Never observed","Required to increase Ksp"],a:0,e:"An ionic product above Ksp indicates supersaturation, so precipitation is thermodynamically favored."},
{q:"If Qsp = Ksp, the solution is:",o:["Unsaturated","At equilibrium with the solid","Always acidic","Always basic"],a:1,e:"Equality between Qsp and Ksp indicates solubility equilibrium."},

{q:"Adding a common ion to a saturated solution generally:",o:["Increases solubility","Decreases solubility","Changes Ksp at fixed temperature","Removes the solid instantly"],a:1,e:"The common ion shifts the dissolution equilibrium toward the solid, reducing solubility."},
{q:"Ksp of a given salt at a fixed temperature is:",o:["Dependent on the amount of solid present","A constant characteristic of that dissolution equilibrium","Always equal to 1","Equal to the molar solubility"],a:1,e:"At a fixed temperature, Ksp has a fixed value for a particular salt and dissolution reaction."},
{q:"Which statement is correct?",o:["A smaller Ksp always means every salt is less soluble regardless of formula","Ksp comparisons should consider salt stoichiometry when relating Ksp to molar solubility","Ksp is changed by adding a common ion","Pure solids must always appear in Ksp"],a:1,e:"Ksp values cannot be directly interpreted as molar solubility without considering the dissolution stoichiometry."}

{q:"Precipitation occurs when the ionic product Qsp is:",o:["Less than Ksp","Equal to Ksp","Greater than Ksp","Always zero"],a:2,e:"When Qsp exceeds Ksp, the solution is supersaturated and precipitation is thermodynamically favored."},

{q:"At Qsp = Ksp, the system is:",o:["Precipitating rapidly","At solubility equilibrium","Completely insoluble","Always acidic"],a:1,e:"Equality of Qsp and Ksp indicates equilibrium between dissolved ions and the solid phase."},

{q:"If Qsp becomes greater than Ksp after mixing two solutions, the immediate tendency is to:",o:["Form precipitate","Dissolve more solid","Increase Ksp","Prevent ion collisions"],a:0,e:"The system moves toward lower ion product by forming solid until equilibrium is approached."},
{q:"A precipitate is expected to form when:",o:["The solution is undersaturated","The solution is supersaturated with respect to the salt","No ions are present","Ksp is undefined"],a:1,e:"Supersaturation means Qsp > Ksp, which provides the thermodynamic driving force for precipitation."},
{q:"Adding a common ion to a saturated solution of a sparingly soluble salt generally:",o:["Favors dissolution","Favors precipitation and lowers solubility","Changes Ksp at fixed temperature","Removes the common ion"],a:1,e:"The added common ion increases Qsp and shifts the dissolution equilibrium toward the solid."},

{q:"The Ksp of a sparingly soluble salt at a fixed temperature:",o:["Changes whenever precipitation occurs","Remains constant for that equilibrium","Becomes zero after precipitation","Equals Qsp at all times"],a:1,e:"Ksp is an equilibrium constant and remains fixed at a given temperature; Qsp changes with composition."},

{q:"According to Le Chatelier's principle, when a system at equilibrium is disturbed, it shifts in the direction that:",o:["Increases the disturbance","Opposes the disturbance","Stops the reaction completely","Always favors products"],a:1,e:"An equilibrium system responds to an imposed change by shifting in a direction that tends to oppose that change."},
{q:"For N2(g) + 3H2(g) ⇌ 2NH3(g), increasing the pressure shifts equilibrium toward:",o:["Reactants","Products","Neither side","Both sides equally"],a:1,e:"Higher pressure favors the side with fewer gaseous moles, so ammonia formation is favored."},
{q:"For N2(g) + 3H2(g) ⇌ 2NH3(g), decreasing the pressure shifts equilibrium toward:",o:["Products","Reactants","Neither side","NH3 only"],a:1,e:"Lower pressure favors the side with more gaseous moles, which is the reactant side."},
{q:"For an exothermic forward reaction, increasing temperature generally shifts equilibrium toward:",o:["Products","Reactants","No change","The side with fewer moles"],a:1,e:"Heat behaves like a product in an exothermic forward reaction, so adding heat favors reactants."},
{q:"For an endothermic forward reaction, increasing temperature shifts equilibrium toward:",o:["Reactants","Products","Neither side","The side with fewer gas moles"],a:1,e:"Heat behaves like a reactant in an endothermic forward reaction, so increasing temperature favors products."},
{q:"What is the effect of adding a reactant to a system at equilibrium?",o:["Equilibrium shifts toward products","Equilibrium shifts toward reactants","K becomes zero","Reaction stops"],a:0,e:"The system shifts toward products to consume some of the added reactant."},

{q:"A catalyst added to a system already at equilibrium:",o:["Shifts equilibrium toward products","Shifts equilibrium toward reactants","Does not change equilibrium position but speeds both directions","Changes K"],a:2,e:"A catalyst speeds both forward and reverse reactions but does not change equilibrium position or K."},
{q:"For CaCO3(s) ⇌ CaO(s) + CO2(g), adding an inert gas at constant volume causes:",o:["Shift toward CaCO3","Shift toward CaO and CO2","No equilibrium shift","K to increase"],a:2,e:"At constant volume, the partial pressure of CO2 is unchanged, so equilibrium does not shift."},

{q:"For 2SO2(g) + O2(g) ⇌ 2SO3(g) + heat, increasing temperature favors:",o:["SO3 formation","SO2 and O2 formation","Neither side","Only O2"],a:1,e:"The forward reaction is exothermic, so increasing temperature favors the endothermic reverse direction."},

{q:"If Q < K at a given temperature, the reaction proceeds toward:",o:["Products","Reactants","Neither","Both equally"],a:0,e:"When Q is less than K, the reaction proceeds forward until Q equals K."},
{q:"Which statement correctly describes Le Chatelier's principle?",o:["Equilibrium always moves toward products","A system at equilibrium responds to a disturbance by partially counteracting it","A catalyst changes K","Pressure always changes every gas equilibrium"],a:1,e:"The principle describes the qualitative response of an equilibrium system to changes in concentration, pressure, or temperature."}
];</script><script>window.SkillUpEffectConcentrationPressureTemperatureQuestions=window.SkillUpEffectConcentrationPressureTemperatureQuestions||[

{q:"When the concentration of a product is increased, equilibrium shifts:",o:["Toward products","Toward reactants","In neither direction","Only at high pressure"],a:1,e:"The system tends to consume some of the added product, so equilibrium shifts toward reactants."},
{q:"Removal of a reactant from an equilibrium mixture causes the equilibrium to shift:",o:["Toward reactants","Toward products","No change","Only for solids"],a:0,e:"The system tends to replace the removed reactant, so the equilibrium shifts toward reactants."},
{q:"Removal of a product from an equilibrium mixture causes equilibrium to shift:",o:["Toward reactants","Toward products","No change","Toward the side with more solids"],a:1,e:"The system tends to replace the removed product, so equilibrium shifts toward products."},
{q:"For N2(g) + 3H2(g) ⇌ 2NH3(g), increasing pressure shifts equilibrium:",o:["Toward N2 and H2","Toward NH3","No shift","Only toward H2"],a:1,e:"The product side has fewer gaseous moles, so higher pressure favors NH3 formation."},
{q:"For N2(g) + 3H2(g) ⇌ 2NH3(g), decreasing pressure shifts equilibrium:",o:["Toward NH3","Toward N2 and H2","No shift","Toward neither side"],a:1,e:"Lower pressure favors the side with more gaseous moles, the reactant side."},

{q:"For an exothermic forward reaction, increasing temperature shifts equilibrium:",o:["Toward products","Toward reactants","Only if pressure is also increased","It has no effect"],a:1,e:"Increasing temperature favors the endothermic reverse direction for an exothermic forward reaction."},
{q:"For an endothermic forward reaction, increasing temperature shifts equilibrium:",o:["Toward reactants","Toward products","Toward the side with fewer gas moles","It never changes"],a:1,e:"Heat acts like a reactant in an endothermic forward reaction, so increasing temperature favors products."},

];</script><script>window.SkillUpEffectCatalystQuestions=window.SkillUpEffectCatalystQuestions||[

{q:"A catalyst affects the equilibrium composition by:",o:["Increasing products only","Increasing reactants only","Not changing equilibrium composition","Making products equal to reactants"],a:2,e:"Both forward and reverse rates are accelerated, so the equilibrium composition remains unchanged."},
