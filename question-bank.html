<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp NEET Question Bank</title><style>body{font-family:system-ui;margin:0;background:#f6f8fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:20px}.hero,.card{background:#fff;border:1px solid #e2e7ef;border-radius:16px;padding:18px;margin:12px 0}.q{font-weight:700;line-height:1.5}.options{display:grid;gap:9px;margin-top:14px}.option{border:1px solid #d8dee8;border-radius:10px;padding:11px;cursor:pointer;background:#fff;text-align:left;width:100%}.option:disabled{cursor:default}.explanation{margin-top:8px;color:#475467;line-height:1.55}.tag{display:inline-block;padding:5px 9px;background:#eef2f7;border-radius:999px;font-size:12px;margin-right:5px}.count{color:#667085;margin-top:12px}.error{background:#fff1f1;border:1px solid #f3b3b3;border-radius:16px;padding:18px;margin:12px 0}.progress{height:8px;background:#e9edf3;border-radius:99px;overflow:hidden;margin-top:12px}.progress>i{display:block;height:100%;background:#315efb;width:0;transition:.2s}.feedback{margin-top:10px;padding:10px;border-radius:10px;font-weight:700}.correct{background:#ecfdf3;color:#067647}.wrong{background:#fff1f2;color:#b42318}.account{float:right;border:0;background:#eef2ff;color:#315efb;padding:7px 10px;border-radius:9px;font-weight:800;cursor:pointer}</style><script src="matter-and-its-nature-question-bank.js?v=20260909"></script><script src="laws-of-chemical-combination-question-bank.js?v=20260909"></script><script src="what-is-living-question-bank.js?v=20260909"></script><script src="least-count-question-bank.js?v=20260909c"></script><script src="dimensional-analysis-and-applications-question-bank.js?v=20260909e"></script><script src="central-config.js?v=20260909"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="central-auth.js?v=20260909"></script></head><body><main class="wrap"><section class="hero"><button class="account" id="account" type="button">Account</button><h1 id="title">SkillUp NEET Question Bank</h1><p id="subtitle">Chapter-wise NEET practice • Build 2026-09-09</p><span class="tag" id="subjectTag"></span><span class="tag" id="topicTag"></span><div class="count" id="count"></div><div class="progress"><i id="progressBar"></i></div></section><section id="questions"></section></main><script>(async()=>{const p=new URLSearchParams(location.search),raw=(p.get('topic')||p.get('chapter')||'').trim(),norm=raw.toLowerCase().replace(/[–—]/g,'-').replace(/&/g,'and').replace(/[\s_]+/g,'-').replace(/[^a-z0-9-]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,''),next=location.href;const session=await window.SkillUpAuth.requireAuth(next);if(!session)return;document.getElementById('account').onclick=async()=>{if(confirm('Sign out of SkillUp?')){await window.SkillUpAuth.signOut();location.href='central-login.html?next='+encodeURIComponent(next)}};const chemistryMatterAliases=['matter-and-its-nature','matter-its-nature','nature-of-matter','matter'];const lawsAliases=['laws-of-chemical-combination','laws-of-chemical-combination-and-stoichiometry','chemical-combination-laws','laws-of-chemical-combination-neet'];const vectorAliases=['vector-addition-and-subtraction','vector-addition-subtraction','vector-addition-and-subtraction-neet','vector'];const livingAliases=['what-is-living','what-is-living-neet','what-is-living-zoology','living'];const leastCountAliases=['least-count','leastcount','least-count-of-measuring-instruments'];const dimensionalAnalysisAliases=['dimensional-analysis-and-applications','dimensional-analysis','dimensional-analysis-applications'];function renderQuestions(questions,title,subtitle,subject,topic){document.title=title;document.getElementById('title').textContent=title;document.getElementById('subtitle').textContent=subtitle;document.getElementById('subjectTag').textContent=subject;document.getElementById('topicTag').textContent=topic;document.getElementById('count').textContent=questions.length+' MCQs • NEET-oriented • Duolingo-style practice';const root=document.getElementById('questions');root.innerHTML='';if(!Array.isArray(questions)||questions.length!==30){root.innerHTML='<div class="error"><h3>Bank validation failed.</h3><p>Expected exactly 30 MCQs. Loaded: '+(Array.isArray(questions)?questions.length:0)+'</p></div>';return}let answered=0,correctCount=0;questions.forEach((x,i)=>{const card=document.createElement('article');card.className='card';const q=document.createElement('div');q.className='q';q.textContent=(i+1)+'. '+x.q;card.appendChild(q);const opts=document.createElement('div');opts.className='options';const feedback=document.createElement('div');x.o.forEach((o,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=String.fromCharCode(65+j)+'. '+o;b.onclick=async()=>{if(b.disabled)return;const isCorrect=j===x.a;opts.querySelectorAll('button').forEach(v=>v.disabled=true);feedback.className='feedback '+(isCorrect?'correct':'wrong');feedback.textContent=isCorrect?'✓ Correct! +1 XP':'✗ Not quite — review the explanation';const e=document.createElement('div');e.className='explanation';e.innerHTML='<b>Explanation:</b> '+x.e;card.appendChild(feedback);card.appendChild(e);answered++;if(isCorrect)correctCount++;document.getElementById('progressBar').style.width=Math.round(answered/questions.length*100)+'%';try{await window.SkillUpAuth.saveProgress({subject,topic,answered,correct:correctCount,xp:correctCount});}catch(err){console.warn('Progress sync pending:',err.message||err)}};opts.appendChild(b)});card.appendChild(opts);root.appendChild(card)})}if(vectorAliases.includes(norm)){location.replace('vector-addition-and-subtraction-question-bank.html');}else if(livingAliases.includes(norm)){renderQuestions(window.skillUpWhatIsLivingQuestions||[],'🌱 What is Living? — Zoology Question Bank','NEET Zoology • Duolingo-style concept practice','Zoology','🌱 What is Living?');}else if(chemistryMatterAliases.includes(norm)){renderQuestions(window.skillUpMatterNatureQuestions||[],'Matter and Its Nature — Chemistry Question Bank','NEET Chemistry • Chapter-wise practice','Chemistry','Matter and Its Nature');}else if(lawsAliases.includes(norm)){renderQuestions(window.skillUpLawsChemicalCombinationQuestions||[],'Laws of Chemical Combination — Chemistry Question Bank','NEET Chemistry • Chapter-wise practice','Chemistry','Laws of Chemical Combination');}else if(leastCountAliases.includes(norm)){location.replace('/least-count.html?v=20260909c');}else if(dimensionalAnalysisAliases.includes(norm)){location.replace('/dimensional-analysis-and-applications.html?v=20260909e');}else{document.getElementById('subjectTag').textContent=p.get('subject')||'NEET';document.getElementById('topicTag').textContent=raw||'Topic';document.getElementById('questions').innerHTML='<div class="error"><h3>Question set not assigned</h3><p>This concept is not yet mapped in the local practice bank.</p></div>';}})();</script></body></html>
