<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="cache-control" content="no-cache,no-store,must-revalidate">
<meta name="x-skillup-build" content="20260910-quiz-direct">
<title>SkillUp NEET Question Bank</title>
<style>
body{font-family:system-ui;margin:0;background:#f6f8fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:20px}.hero,.card{background:#fff;border:1px solid #e2e7ef;border-radius:16px;padding:18px;margin:12px 0}.q{font-weight:700;line-height:1.5}.options{display:grid;gap:9px;margin-top:14px}.option{border:1px solid #d8dee8;border-radius:10px;padding:11px;cursor:pointer;background:#fff;text-align:left;width:100%}.option:disabled{cursor:default}.explanation{margin-top:8px;color:#475467;line-height:1.55}.tag{display:inline-block;padding:5px 9px;background:#eef2f7;border-radius:999px;font-size:12px;margin-right:5px}.count{color:#667085;margin-top:12px}.error{background:#fff1f1;border:1px solid #f3b3b3;border-radius:16px;padding:18px;margin:12px 0}.progress{height:8px;background:#e9edf3;border-radius:99px;overflow:hidden;margin-top:12px}.progress>i{display:block;height:100%;background:#315efb;width:0;transition:.2s}.feedback{margin-top:10px;padding:10px;border-radius:10px;font-weight:700}.correct{background:#ecfdf3;color:#067647}.wrong{background:#fff1f2;color:#b42318}.build{font-size:11px;color:#98a2b3;margin-top:8px}
</style>
<script src="matter-and-its-nature-question-bank.js?v=20260909"></script>
<script src="laws-of-chemical-combination-question-bank.js?v=20260909"></script>
<script src="what-is-living-question-bank.js?v=20260909lw2"></script>
<script src="least-count-neet-question-bank.js?v=20260909new"></script>
<script src="dimensional-analysis-and-applications-question-bank.js?v=20260909e"></script>
<script src="physics-neet-question-banks.js?v=20260910physicsbanks1"></script>
</head>
<body>
<main class="wrap"><section class="hero"><h1 id="title">SkillUp NEET Question Bank</h1><p id="subtitle">Chapter-wise NEET practice</p><span class="tag" id="subjectTag"></span><span class="tag" id="topicTag"></span><div class="count" id="count"></div><div class="progress"><i id="progressBar"></i></div><div class="build">Build fingerprint: 20260910-quiz-direct</div></section><section id="questions"></section></main>
<script>
(()=>{
const p=new URLSearchParams(location.search),raw=(p.get('topic')||p.get('chapter')||'').trim();
const norm=raw.toLowerCase().replace(/[–—]/g,'-').replace(/&/g,'and').replace(/[\s_]+/g,'-').replace(/[^a-z0-9-]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
const chemistryMatterAliases=['matter-and-its-nature','matter-its-nature','nature-of-matter','matter'];
const lawsAliases=['laws-of-chemical-combination','laws-of-chemical-combination-and-stoichiometry','chemical-combination-laws','laws-of-chemical-combination-neet'];
const livingAliases=['the-living-world','the-living-world-neet','what-is-living','what-is-living-neet','what-is-living-zoology','what-is-living-botany','living'];
const leastCountAliases=['least-count','leastcount','least-count-of-measuring-instruments'];
const dimensionalAnalysisAliases=['dimensional-analysis-and-applications','dimensional-analysis','dimensional-analysis-applications'];
function renderQuestions(questions,title,subtitle,subject,topic){document.title=title;document.getElementById('title').textContent=title;document.getElementById('subtitle').textContent=subtitle;document.getElementById('subjectTag').textContent=subject;document.getElementById('topicTag').textContent=topic;document.getElementById('count').textContent=(Array.isArray(questions)?questions.length:0)+' MCQs • NEET-oriented • Direct quiz';const root=document.getElementById('questions');root.innerHTML='';if(!Array.isArray(questions)||questions.length!==30){root.innerHTML='<div class="error"><h3>Bank validation failed.</h3><p>Expected exactly 30 MCQs. Loaded: '+(Array.isArray(questions)?questions.length:0)+'</p></div>';return}let answered=0,correctCount=0;questions.forEach((x,i)=>{const card=document.createElement('article');card.className='card';const q=document.createElement('div');q.className='q';q.textContent=(i+1)+'. '+x.q;card.appendChild(q);const opts=document.createElement('div');opts.className='options';const feedback=document.createElement('div');x.o.forEach((o,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=String.fromCharCode(65+j)+'. '+o;b.onclick=()=>{if(b.disabled)return;const ok=j===x.a;opts.querySelectorAll('button').forEach(v=>v.disabled=true);feedback.className='feedback '+(ok?'correct':'wrong');feedback.textContent=ok?'✓ Correct! +1 XP':'✗ Not quite — review the explanation';const e=document.createElement('div');e.className='explanation';e.innerHTML='<b>Explanation:</b> '+x.e;card.appendChild(feedback);card.appendChild(e);answered++;if(ok)correctCount++;document.getElementById('progressBar').style.width=Math.round(answered/questions.length*100)+'%'};opts.appendChild(b)});card.appendChild(opts);root.appendChild(card)})}
if(livingAliases.includes(norm))renderQuestions(window.skillUpWhatIsLivingQuestions||[],'🌱 The Living World — Biology Question Bank','NEET Biology • Direct quiz','Biology','The Living World');
else if(chemistryMatterAliases.includes(norm))renderQuestions(window.skillUpMatterNatureQuestions||[],'Matter and Its Nature — Chemistry Question Bank','NEET Chemistry • Direct quiz','Chemistry','Matter and Its Nature');
else if(lawsAliases.includes(norm))renderQuestions(window.skillUpLawsChemicalCombinationQuestions||[],'Laws of Chemical Combination — Chemistry Question Bank','NEET Chemistry • Direct quiz','Chemistry','Laws of Chemical Combination');
else if(leastCountAliases.includes(norm))renderQuestions(window.SkillUpMCQBanks&&window.SkillUpMCQBanks['least count']||[],'Least Count — Physics Question Bank','NEET Physics • Direct quiz','Physics','Least Count');
else if(dimensionalAnalysisAliases.includes(norm))location.replace('/dimensional-analysis-and-applications.html?v=20260909e');
else if(p.get('subject')?.toLowerCase()==='physics'&&window.SkillUpPhysicsBanks){const key=window.SkillUpPhysicsBanks.resolve(raw),bank=key?window.SkillUpPhysicsBanks[key]:null;if(bank)renderQuestions(bank,'⚡ '+key+' — Physics Question Bank','NEET Physics • 30 MCQs • Direct chapter quiz','Physics',key);else document.getElementById('questions').innerHTML='<div class="error"><h3>Physics chapter bank not mapped</h3><p>Choose a chapter from the Physics Full Path.</p></div>'}
else document.getElementById('questions').innerHTML='<div class="error"><h3>No quiz selected</h3><p>Open a chapter quiz from a learning path.</p></div>';
})();
</script></body></html>
