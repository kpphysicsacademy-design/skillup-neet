<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp NEET Question Bank</title><style>body{font-family:system-ui;margin:0;background:#f6f8fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:20px}.hero,.card{background:#fff;border:1px solid #e2e7ef;border-radius:16px;padding:18px;margin:12px 0}.q{font-weight:700;line-height:1.5}.options{display:grid;gap:9px;margin-top:14px}.option{border:1px solid #d8dee8;border-radius:10px;padding:11px;cursor:pointer;background:#fff;text-align:left;width:100%}.option:disabled{cursor:default}.answer{margin-top:12px;font-weight:700}.explanation{margin-top:8px;color:#475467;line-height:1.55}.tag{display:inline-block;padding:5px 9px;background:#eef2f7;border-radius:999px;font-size:12px;margin-right:5px}.count{color:#667085;margin-top:12px}.error{background:#fff1f1;border:1px solid #f3b3b3;border-radius:16px;padding:18px;margin:12px 0}</style><script src="matter-and-its-nature-question-bank.js"></script><script src="laws-of-chemical-combination-question-bank.js"></script></head><body><main class="wrap"><section class="hero"><h1 id="title">SkillUp NEET Question Bank</h1><p id="subtitle">Chapter-wise NEET practice</p><span class="tag" id="subjectTag"></span><span class="tag" id="topicTag"></span><div class="count" id="count"></div></section><section id="questions"></section></main><script>
const p=new URLSearchParams(location.search);const raw=(p.get('topic')||p.get('chapter')||'').trim();const norm=raw.toLowerCase().replace(/[–—]/g,'-').replace(/&/g,'and').replace(/[\s_]+/g,'-').replace(/[^a-z0-9-]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
const chemistryMatterAliases=['matter-and-its-nature','matter-its-nature','nature-of-matter','matter'];
const lawsAliases=['laws-of-chemical-combination','laws-of-chemical-combination-and-stoichiometry','chemical-combination-laws','laws-of-chemical-combination-neet'];
const vectorAliases=['vector-addition-and-subtraction','vector-addition-subtraction','vector-addition-and-subtraction-neet','vector'];
function renderQuestions(questions,title,subtitle,subject,topic){document.title=title;document.getElementById('title').textContent=title;document.getElementById('subtitle').textContent=subtitle;document.getElementById('subjectTag').textContent=subject;document.getElementById('topicTag').textContent=topic;document.getElementById('count').textContent=questions.length+' MCQs • NEET-oriented concept set';const root=document.getElementById('questions');questions.forEach((x,i)=>{const card=document.createElement('article');card.className='card';const q=document.createElement('div');q.className='q';q.textContent=(i+1)+'. '+x.q;card.appendChild(q);const opts=document.createElement('div');opts.className='options';x.o.forEach((o,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=String.fromCharCode(65+j)+'. '+o;b.onclick=()=>{opts.querySelectorAll('button').forEach(v=>v.disabled=true);const a=document.createElement('div');a.className='answer';a.textContent='Correct Answer: '+String.fromCharCode(65+x.a)+'. '+x.o[x.a];const e=document.createElement('div');e.className='explanation';e.innerHTML='<b>Explanation:</b> '+x.e;card.appendChild(a);card.appendChild(e)};opts.appendChild(b)});card.appendChild(opts);root.appendChild(card)})}
if(vectorAliases.includes(norm)){location.replace('vector-addition-and-subtraction-question-bank.html');}else if(chemistryMatterAliases.includes(norm)){renderQuestions(window.skillUpMatterNatureQuestions||[],'Matter and Its Nature — Chemistry Question Bank','NEET Chemistry • Chapter-wise practice','Chemistry','Matter and Its Nature');}else if(lawsAliases.includes(norm)){renderQuestions(window.skillUpLawsChemicalCombinationQuestions||[],'Laws of Chemical Combination — Chemistry Question Bank','NEET Chemistry • Chapter-wise practice','Chemistry','Laws of Chemical Combination');}else{document.getElementById('subjectTag').textContent=p.get('subject')||'NEET';document.getElementById('topicTag').textContent=raw||'Topic';document.getElementById('questions').innerHTML='<div class="error"><h3>Question set not assigned</h3><p>This concept is not yet mapped in the local practice bank.</p></div>';}
</script></body></html>
