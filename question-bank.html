'systems-of-units':{title:'Systems of Units',questions:[['Which of the following is an SI base unit?',['Newton','Joule','Kelvin','Pascal'],2,'Kelvin (K) is an SI base unit for thermodynamic temperature.'],['Which of the following is not an SI base quantity?',['Length','Mass','Force','Time'],2,'Force is derived; its dimensions are [MLT⁻²].'],['The SI unit of amount of substance is:',['Gram','Mole','Kilogram','Litre'],1,'Mole (mol) is an SI base unit.'],['The SI unit of luminous intensity is:',['Lux','Lumen','Candela','Watt'],2,'Candela (cd) is the SI base unit of luminous intensity.'],['Which pair contains only SI base units?',['Metre, kilogram, second','Newton, metre, second','Joule, kelvin, ampere','Pascal, mole, kelvin'],0,'Metre, kilogram and second are SI base units.'],['The SI unit of electric current is:',['Coulomb','Volt','Ampere','Ohm'],2,'Ampere (A) is the SI base unit of electric current.'],['If 1 new unit = 10 cm, 250 cm equals:',['25','2.5','2500','0.25'],0,'250/10 = 25 new units.'],['Which quantity has SI unit kg m² s⁻²?',['Power','Work','Pressure','Force'],1,'Joule, the SI unit of work, equals kg m² s⁻².'],['The SI unit of pressure is:',['N m','N m⁻¹','N m⁻²','N s⁻¹'],2,'Pressure = force/area, so Pa = N m⁻².'],['Which is a derived SI unit?',['Second','Kelvin','Newton','Ampere'],2,'Newton = kg m s⁻².'],['The SI unit of plane angle is:',['Degree','Radian','Revolution','Steradian'],1,'Radian is the SI derived unit for plane angle.'],['The SI unit of solid angle is:',['Radian','Degree','Steradian','Candela'],2,'Steradian is the SI derived unit for solid angle.'],['Which unit is equivalent to watt?',['J s','J/s','N/s','N m s'],1,'Power = work/time, so 1 W = 1 J/s.'],['Which quantity has SI unit N s?',['Impulse','Pressure','Energy','Power'],0,'Impulse = force × time, hence N s.'],['The SI unit of frequency is:',['Second','Hertz','Radian','Metre'],1,'Hertz is s⁻¹.'],['Which is a coherent SI derived unit?',['dyne','erg','newton','calorie'],2,'Newton is derived coherently as kg m s⁻².'],['1 pascal is equal to:',['1 N m⁻¹','1 N m⁻²','1 J m⁻²','1 W m⁻²'],1,'1 Pa = 1 N m⁻².'],['Which SI base unit is used for mass?',['Gram','Kilogram','Milligram','Tonne'],1,'Kilogram is the SI base unit of mass.'],['The unit kg m s⁻² represents:',['Energy','Power','Force','Momentum'],2,'F = ma, so force has unit kg m s⁻².'],['A quantity has unit m s⁻¹. It can represent:',['Acceleration','Velocity','Force','Power'],1,'m s⁻¹ is the SI unit of speed or velocity.']]},
