ansition:width .4s}.card{padding:28px;margin-top:18px}.q{font-size:22px;line-height:1.45;margin-bottom:22px}.options{display:grid;gap:12px}.option{width:100%;border:1px solid #cbd5e1;border-radius:14px;padding:16px 18px;text-align:left;background:#fff;color:#172033;font:400 17px/1.4 Arial,Helvetica,sans-serif;cursor:pointer}.option.correctOpt{border-color:var(--green);background:#effaf5}.feedback,.explanation{margin-top:12px;padding:14px 16px;border-radius:12px;font-size:15px;line-height:1.55}.correct{background:#effaf5;color:#12633f}.wrong{background:#fff3f3;color:#9d2929}.explanation{background:#f6f8fb;color:#475467}.nextBtn,.restart{margin-top:15px;border:0;border-radius:13px;padding:14px 20px;background:linear-gradient(135deg,#1769e0,#2d79eb);color:#fff;font:400 16px Arial,sans-serif;cursor:pointer}.nextBtn{width:100%}.tip{margin-top:16px;padding:12px 14px;background:#eef6ff;border:1px solid #d5e6ff;border-radius:11px;color:#29466f;font-size:14px;line-height:1.5}.result{text-align:center}.big{font-size:44px;font-weight:500;color:var(--blue)}.error{background:#fff3f3;border:1px solid #efb1b1;border-radius:14px;padding:18px}.footer{text-align:center;margin-top:22px;color:#5572a5;font-size:13px;letter-spacing:.12em}@media(max-width:650px){.wrap{padding:18px 12px 30px}.topin{padding:12px}.hero,.card{padding:19px}.heroRow{align-items:flex-start;flex-direction:column}.hero h1{font-size:26px}.q{font-size:19px}.option{font-size:16px;padding:15px}}</style><script src="systems-of-units-question-bank.js"></script><script src="si-units-question-bank.js"></script><script src="fundamental-units-question-bank.js"></script><script src="matter-and-its-nature-question-bank.js"></script><script src="laws-of-chemical-combination-question-bank.js"></script><script src="what-is-living-question-bank.js"></script><script src="least-count-neet-question-bank.js"></script><script src="significant-figures-question-bank.js"></script><script src="errors-in-measurements-question-bank.js"></script><script src="dimensions-of-physical-quantities-question-bank.js"></script><script src="dimensional-analysis-and-applications-question-bank.js"></script><script src="physics-and-measurement-question-bank.js"></script><script src="physics-neet-question-banks.js"></script></head><body><header class="top"><div class="topin"><div class="brand">✦ SKILLUP</div><div class="stats"><span class="pill">🔥 1</span><span class="pill">⭐ <b id="xp">0</b> XP</span><span class="pill">❤️ <b id="hearts">5</b></span></div></div></header><main class="wrap"><section class="hero"><div class="crumb">NEET <span id="crumbSubject">Physics</span> &nbsp;›&nbsp; <span id="crumbTopic">Least Count</span></div><div class="heroRow"><div><h1 id="title">Least Count</h1><p>NEET practice • One question at a time</p></div><div class="count">Question <span id="questionNo">1</span> of <span id="total">30</span></div></div><div class="tags"><span class="tag" id="subjectTag">Physics</span><span class="tag" id="topicTag">Least Count</span></div><div class="progressTop"><span id="progressLabel">0 / 30 answered</span><span id="percent">0%</span></div><div class="progress"><i id="progressBar"></i></div></section><section id="questions"></section><div class="footer">SKILLUPEDU.IN</div></main><script>(()=>{const p=new URLSearchParams(location.search),raw=(p.get('topic')||p.get('chapter')||'').trim(),n=raw.toLowerCase().replace(/[–—]/g,'-').replace(/&/g,'and').replace(/[\s_]+/g,'-').replace(/[^a-z0-9-]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,''),subject=(p.get('subject')||'').toLowerCase(),root=document.getElementById('questions');function fmt(s){return String(s).replace(/\^2/g,'²').replace(/\^3/g,'³').replace(/\^-1/g,'⁻¹').replace(/\^-2/g,'⁻²').replace(/\^-3/g,'⁻³')}function render(bank,title,sub,topic){if(!Array.isArray(bank)||bank.length<30){root.innerHTML='<div class="error"><b>Question bank loading error</b><p>Expected at least 30 MCQs but loaded '+(Array.isArray(bank)?bank.length:0)+'.</p></div>';return}bank=bank.slice(0,30);document.title=title;document.getElementById('title').textContent=topic;document.getElementById('crumbTopic').textContent=topic;document.getElementById('crumbSubject').textContent=sub;document.getElementById('subjectTag').textContent=sub;document.getElementById('topicTag').textContent=topic;let i=0,answered=0,correct=0,xp=0,hearts=5;const bar=document.getElementById('progressBar');function update(){document.getElementById('questionNo').textContent=Math.min(i+1,30);document.getElementById('progressLabel').textContent=answered+' / 30 answered';document.getElementById('percent').textContent=Math.round(answered/30*100)+'%';bar.style.width=Math.round(answered/30*100)+'%';document.getElementById('xp').textContent=xp;document.getElementById('hearts').textContent=hearts}function show(){if(i>=30){bar.style.width='100%';root.innerHTML='<section class="card result"><div class="big">'+Math.round(correct/30*100)+'%</div><h2>Lesson complete</h2><p>'+correct+' / 30 correct • '+xp+' XP earned</p><button class="restart">Practice Again</button></section>';root.querySelector('.restart').onclick=()=>{i=answered=correct=xp=0;hearts=5;show();update()};return}const z=bank[i],card=document.createElement('article');root.innerHTML='';card.className='card';card.innerHTML='<div class="q">'+(i+1)+'. '+fmt(z.q)+'</div>';const opts=document.createElement('div');opts.className='options';let done=false;(z.o||[]).forEach((v,j)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+fmt(v);b.onclick=()=>{if(done)return;done=true;const ok=j===z.a;opts.querySelectorAll('button').forEach((w,k)=>{w.disabled=true;if(k===z.a)w.classList.add('correctOpt')});const f=document.createElement('div');f.className='feedback '+(ok?'correct':'wrong');f.textContent=ok?'Correct! +10 XP':'Review the explanation';card.appendChild(f);const e=document.createElement('div');e.className='explanation';e.textContent='Explanation: '+fmt(z.e||'Review the
