<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillUp NEET Physics Question Bank</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#172033;background:#f6f8fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:20px}.hero{background:#fff;border:1px solid #e2e7ef;border-radius:18px;padding:22px;margin-bottom:16px}.hero h1{margin:0 0 8px;font-size:clamp(24px,5vw,34px)}.muted{color:#667085}.card{background:#fff;border:1px solid #e2e7ef;border-radius:16px;padding:18px;margin:12px 0}.q{font-weight:700;line-height:1.5}.options{display:grid;gap:9px;margin-top:14px}.option{border:1px solid #d8dee8;border-radius:10px;padding:11px}.answer{margin-top:12px;font-weight:700}.explanation{margin-top:8px;color:#475467;line-height:1.55}.tag{display:inline-block;border-radius:999px;padding:5px 9px;background:#eef2f7;font-size:12px;margin:3px 4px 0 0}.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.nav a{text-decoration:none}.btn{display:inline-block;border:1px solid #d8dee8;border-radius:10px;padding:9px 12px;color:inherit;background:#fff}.status{font-size:13px;margin-top:12px}
</style></head>
<body><main class="wrap">
<section class="hero"><h1>Physics Question Bank</h1><p class="muted">NEET Physics • Chapter-wise practice</p><span class="tag">Physics</span><span class="tag" id="topicTag">Physics &amp; Measurement</span><div class="nav"><a class="btn" href="full-physics-path.html">Physics Path</a><a class="btn" href="question-bank.html?subject=physics&amp;topic=physics-and-measurement">Physics &amp; Measurement</a></div></section>
<section id="questions"></section>
</main>
<script>
const bank={
'physics-and-measurement':{title:'Physics & Measurement',questions:[
{q:'The dimensional formula of force is:',o:['[MLT⁻¹]','[MLT⁻²]','[ML²T⁻²]','[M⁰LT⁻²]'],a:1,e:'Force equals mass × acceleration. Mass has dimensions [M] and acceleration has dimensions [LT⁻²], so force is [MLT⁻²].'},
{q:'Which of the following is a dimensionless quantity?',o:['Velocity','Force','Strain','Momentum'],a:2,e:'Strain is the ratio of change in length to original length, so its dimensions cancel and it is dimensionless.'},
{q:'If x = a + bt, the dimensions of a are the same as:',o:['b','bt','t','b/t'],a:1,e:'Terms added in a physical equation must have identical dimensions. Therefore a and bt have the same dimensions.'},
{q:'The SI unit of electric current is:',o:['Volt','Coulomb','Ampere','Ohm'],a:2,e:'Electric current is an SI base quantity and its SI base unit is the ampere (A).'},
{q:'The number of significant figures in 0.00450 is:',o:['2','3','4','5'],a:1,e:'Leading zeros are not significant. The digits 4, 5 and the trailing zero are significant, giving three significant figures.'}
]}
};
const params=new URLSearchParams(location.search);const topic=params.get('topic')||'physics-and-measurement';const data=bank[topic]||bank['physics-and-measurement'];
document.getElementById('topicTag').textContent=data.title;const root=document.getElementById('questions');
data.questions.forEach((x,i)=>{const c=document.createElement('article');c.className='card';c.innerHTML=`<div class="q">${i+1}. ${x.q}</div><div class="options">${x.o.map((v,j)=>`<div class="option"><strong>${String.fromCharCode(65+j)}.</strong> ${v}</div>`).join('')}</div><div class="answer">Correct Answer: ${String.fromCharCode(65+x.a)}. ${x.o[x.a]}</div><div class="explanation"><strong>Explanation:</strong> ${x.e}</div>`;root.appendChild(c)});
</script></body></html>
