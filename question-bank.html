<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="cache-control" content="no-cache,no-store,must-revalidate">
<meta name="x-skillup-build" content="20260910-duolingo-quiz-v1">
<title>SkillUp NEET Question Bank</title>
<style>
:root{--navy:#102a43;--blue:#315efb;--green:#20a464;--red:#e5484d;--gold:#f4b740;--bg:#f7f9fc;--ink:#172033;--muted:#667085;--line:#dfe5ee}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#eef5ff 0,#f8fafc 260px);color:var(--ink)}
.wrap{max-width:760px;margin:auto;padding:0 16px 36px}.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.topin{max-width:760px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:8px;font-weight:900;color:var(--navy);letter-spacing:.2px}.brand svg{width:28px;height:28px}.stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:13px;font-weight:800;box-shadow:0 2px 8px rgba(16,42,67,.05)}
.hero{padding:22px 4px 12px}.eyebrow{font-size:12px;font-weight:900;color:var(--blue);text-transform:uppercase;letter-spacing:.08em}.hero h1{font-size:28px;line-height:1.15;margin:6px 0}.hero p{margin:6px 0;color:var(--muted)}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{padding:6px 10px;border-radius:999px;background:#eaf0ff;color:#2347bd;font-size:12px;font-weight:800}.progressWrap{margin:16px 0 4px}.progressTop{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:7px}.progress{height:12px;background:#e6ebf2;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#315efb,#6f8cff);border-radius:999px;transition:width .35s ease}
.quiz{min-height:420px}.card{background:#fff;border:2px solid #e4e9f0;border-radius:24px;padding:22px;margin:14px 0;box-shadow:0 8px 24px rgba(16,42,67,.07)}.q{font-size:20px;font-weight:850;line-height:1.45;margin-bottom:18px}.options{display:grid;gap:10px}.option{position:relative;border:2px solid #dfe5ee;border-radius:15px;padding:15px 14px;cursor:pointer;background:#fff;text-align:left;width:100%;font:inherit;font-weight:700;color:var(--ink);transition:.15s;min-height:54px}.option:hover:not(:disabled){border-color:#9eb2ff;background:#f7f9ff;transform:translateY(-1px)}.option:disabled{cursor:default}.option.correctOpt{border-color:var(--green);background:#ecfdf3}.option.wrongOpt{border-color:var(--red);background:#fff1f2}.feedback{margin-top:16px;padding:14px;border-radius:15px;font-weight:850}.correct{background:#ecfdf3;color:#067647}.wrong{background:#fff1f2;color:#b42318}.explanation{margin-top:10px;padding:13px 14px;background:#f7f9fc;border-radius:13px;color:#475467;line-height:1.55}.nextBtn{display:block;width:100%;margin-top:14px;border:0;border-radius:15px;padding:15px;background:var(--blue);color:#fff;font-weight:900;font-size:16px;cursor:pointer}.nextBtn:hover{filter:brightness(.96)}.hidden{display:none}.error{background:#fff1f1;border:1px solid #f3b3b3;border-radius:18px;padding:18px;margin:16px 0}.result{text-align:center;background:#fff;border:2px solid #dfe5ee;border-radius:24px;padding:28px 20px;box-shadow:0 8px 24px rgba(16,42,67,.07)}.result .big{font-size:46px;font-weight:950;color:var(--blue)}.result h2{margin:4px 0 8px}.result p{color:var(--muted);line-height:1.5}.restart{border:0;border-radius:15px;padding:14px 22px;background:var(--blue);color:white;font-weight:900;cursor:pointer}.build{font-size:10px;color:#98a2b3;text-align:center;margin-top:16px}
@media(max-width:560px){.wrap{padding:0 12px 28px}.hero h1{font-size:24px}.q{font-size:18px}.card{padding:17px;border-radius:20px}.stats{gap:4px}.pill{font-size:12px;padding:6px 8px}}
</style>
<script src="matter-and-its-nature-question-bank.js?v=20260909"></script>
<script src="laws-of-chemical-combination-question-bank.js?v=20260909"></script>
<script src="what-is-living-question-bank.js?v=20260909lw2"></script>
<script src="least-count-neet-question-bank.js?v=20260909new"></script>
<script src="dimensional-analysis-and-applications-question-bank.js?v=20260909e"></script>
<script src="physics-neet-question-banks.js?v=20260910physicsbanks1"></script>
</head>
<body>
<header class="top"><div class="topin"><div class="brand"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#315efb" d="M7 27c8-2 14-8 18-17l4 7 8-1-5 7 7 4-10 2-4 9-4-7-10 1z"/><circle cx="18" cy="27" r="3" fill="#fff"/></svg>SKILLUP</div><div class="stats"><span class="pill">🔥 <b id="streak">1</b></span><span class="pill">⭐ <b id="xp">0</b> XP</span><span class="pill">❤️ <b id="hearts">5</b></span></div></div></header>
<main class="wrap"><section class="hero"><div class="eyebrow">NEET (UG)-2026 • Physics</div><h1 id="title">Units of Measurement</h1><p id="subtitle">Chapter-wise NEET practice</p><div class="tags"><span class="tag" id="subjectTag">Physics</span><span class="tag" id="topicTag">Units of Measurement</span></div><div class="progressWrap"><div class="progressTop"><span id="count">30 MCQs</span><span id="progressText">0 / 30</span></div><div class="progress"><i id="progressBar"></i></div></div></section><section id="questions" class="quiz"></section><div class="build">SkillUp • Duolingo-style one-question quiz • 20260910-duolingo-quiz-v1</div></main>
<script>
(()=>{
const p=new URLSearchParams(location.search),raw=(p.get('topic')||p.get('chapter')||'').trim();
const norm=raw.toLowerCase().replace(/[–—]/g,'-').replace(/&/g,'and').replace(/[\s_]+/g,'-').replace(/[^a-z0-9-]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
const chemistryMatterAliases=['matter-and-its-nature','matter-its-nature','nature-of-matter','matter'];
const lawsAliases=['laws-of-chemical-combination','laws-of-chemical-combination-and-stoichiometry','chemical-combination-laws','laws-of-chemical-combination-neet'];
const livingAliases=['the-living-world','the-living-world-neet','what-is-living','what-is-living-neet','what-is-living-zoology','what-is-living-botany','living'];
const leastCountAliases=['least-count','leastcount','least-count-of-measuring-instruments'];
const dimensionalAnalysisAliases=['dimensional-analysis-and-applications','dimensional-analysis','dimensional-analysis-applications'];
function renderQuestions(questions,title,subtitle,subject,topic){
 document.title=title;document.getElementById('title').textContent=title.replace(/^[^ ]+ /,'');document.getElementById('subtitle').textContent=subtitle;document.getElementById('subjectTag').textContent=subject;document.getElementById('topicTag').textContent=topic;
 const root=document.getElementById('questions');root.innerHTML='';
 if(!Array.isArray(questions)||questions.length!==30){root.innerHTML='<div class="error"><h3>Bank validation failed.</h3><p>Expected exactly 30 MCQs. Loaded: '+(Array.isArray(questions)?questions.length:0)+'</p></div>';return}
 let current=0,answered=0,correctCount=0,hearts=5,xp=0;
 const count=document.getElementById('count'),bar=document.getElementById('progressBar'),pt=document.getElementById('progressText');
 function update(){pt.textContent=answered+' / '+questions.length;bar.style.width=Math.round(answered/questions.length*100)+'%';document.getElementById('xp').textContent=xp;document.getElementById('hearts').textContent=hearts}
 function showQuestion(){
   if(current>=questions.length){showResult();return}
   const x=questions[current];root.innerHTML='';
   const card=document.createElement('article');card.className='card';
   const q=document.createElement('div');q.className='q';q.textContent=(current+1)+'. '+x.q;card.appendChild(q);
   const opts=document.createElement('div');opts.className='options';let selected=false;
   x.o.forEach((o,j)=>{const b=document.createElement('button');b.className='option';b.type='button';b.textContent=String.fromCharCode(65+j)+'. '+o;b.onclick=()=>{
     if(selected)return;selected=true;const ok=j===x.a;
     opts.querySelectorAll('button').forEach((v,k)=>{v.disabled=true;if(k===x.a)v.classList.add('correctOpt');});
     const feedback=document.createElement('div');feedback.className='feedback '+(ok?'correct':'wrong');feedback.textContent=ok?'✓ Correct! +10 XP':'✗ Not quite — review the explanation';card.appendChild(feedback);
     const e=document.createElement('div');e.className='explanation';e.innerHTML='<b>Explanation:</b> '+x.e;card.appendChild(e);
     if(ok){correctCount++;xp+=10}else{hearts=Math.max(0,hearts-1)}answered++;update();
     const next=document.createElement('button');next.className='nextBtn';next.type='button';next.textContent=current===questions.length-1?'See Results →':'Continue →';next.onclick=()=>{current++;showQuestion()};card.appendChild(next);
   };opts.appendChild(b)});
   card.appendChild(opts);root.appendChild(card);count.textContent='30 MCQs • NEET-oriented';update();
 }
 function showResult(){
   const pct=Math.round(correctCount/questions.length*100);bar.style.width='100%';pt.textContent=questions.length+' / '+questions.length;
   root.innerHTML='<section class="result"><div class="big">'+pct+'%</div><h2>Lesson complete! 🎉</h2><p>You answered <b>'+correctCount+' / '+questions.length+'</b> correctly and earned <b>'+xp XP</b>.</p><p>'+ (hearts>0?'Great work — keep your streak going!':'Review the explanations and try again to master this chapter.')+'</p><button class="restart" type="button">Practice Again</button></section>';
   root.querySelector('.restart').onclick=()=>{current=0;answered=0;correctCount=0;hearts=5;xp=0;showQuestion()};
 }
 showQuestion();
}
if(livingAliases.includes(norm))renderQuestions(window.skillUpWhatIsLivingQuestions||[],'🌱 The Living World — Biology Question Bank','NEET Biology • Direct quiz','Biology','The Living World');
else if(chemistryMatterAliases.includes(norm))renderQuestions(window.skillUpMatterNatureQuestions||[],'Matter and Its Nature — Chemistry Question Bank','NEET Chemistry • Direct quiz','Chemistry','Matter and Its Nature');
else if(lawsAliases.includes(norm))renderQuestions(window.skillUpLawsChemicalCombinationQuestions||[],'Laws of Chemical Combination — Chemistry Question Bank','NEET Chemistry • Direct quiz','Chemistry','Laws of Chemical Combination');
else if(leastCountAliases.includes(norm))renderQuestions(window.SkillUpMCQBanks&&window.SkillUpMCQBanks['least count']||[],'Least Count — Physics Question Bank','NEET Physics • Direct quiz','Physics','Least Count');
else if(dimensionalAnalysisAliases.includes(norm))location.replace('/dimensional-analysis-and-applications.html?v=20260909e');
else if(p.get('subject')?.toLowerCase()==='physics'&&window.SkillUpPhysicsBanks){const key=window.SkillUpPhysicsBanks.resolve(raw),bank=key?window.SkillUpPhysicsBanks[key]:null;if(bank)renderQuestions(bank,'⚡ '+key+' — Physics Question Bank','NEET Physics • 30 MCQs • Direct chapter quiz','Physics',key);else document.getElementById('questions').innerHTML='<div class="error"><h3>Physics chapter bank not mapped</h3><p>Choose a chapter from the Physics Full Path.</p></div>'}
else document.getElementById('questions').innerHTML='<div class="error"><h3>No quiz selected</h3><p>Open a chapter quiz from a learning path.</p></div>';
})();
</script></body></html>
