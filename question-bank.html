{q:'Which of the following is an SI base unit?',o:['Newton','Joule','Kelvin','Pascal'],a:2,e:'Kelvin (K) is an SI base unit for thermodynamic temperature. Newton, joule and pascal are derived SI units.'},
{q:'Which of the following is not an SI base quantity?',o:['Length','Mass','Force','Time'],a:2,e:'Force is a derived quantity, with dimensions [MLT⁻²]. Length, mass and time are SI base quantities.'},
{q:'The SI unit of amount of substance is:',o:['Gram','Mole','Kilogram','Litre'],a:1,e:'The mole (mol) is the SI base unit of amount of substance.'},

{q:'The SI unit of electric current is:',o:['Coulomb','Volt','Ampere','Ohm'],a:2,e:'Ampere (A) is the SI base unit of electric current. Coulomb, volt and ohm are derived units.'},
{q:'A new unit of length is defined as 1 new unit = 10 cm. The numerical value of a length measured as 250 cm in the new unit is:',o:['25','2.5','2500','0.25'],a:0,e:'Since 1 new unit = 10 cm, 250 cm = 250/10 = 25 new units.'},
{q:'Which quantity has the SI unit kg m² s⁻²?',o:['Power','Work','Pressure','Force'],a:1,e:'Work has unit joule, J = kg m² s⁻².'},
{q:'The SI unit of pressure is equivalent to:',o:['N m','N m⁻¹','N m⁻²','N s⁻¹'],a:2,e:'Pressure = force/area, so its SI unit is N/m², called pascal (Pa).'},
{q:'Which of the following is a derived SI unit?',o:['Second','Kelvin','Newton','Ampere'],a:2,e:'Newton is derived from the base units kilogram, metre and second: 1 N = 1 kg m s⁻².'},
{q:'The unit of plane angle in the SI is:',o:['Degree','Radian','Revolution','Steradian'],a:1,e:'The SI derived unit for plane angle is radian (rad). Steradian is used for solid angle.'},
{q:'The SI unit of solid angle is:',o:['Radian','Degree','Steradian','Candela'],a:2,e:'Steradian (sr) is the SI derived unit for solid angle.'},
{q:'Which of the following units is equivalent to watt?',o:['J s','J/s','N/s','N m s'],a:1,e:'Power is work done per unit time, so 1 W = 1 J/s.'},
{q:'Which physical quantity has the SI unit N s?',o:['Impulse','Pressure','Energy','Power'],a:0,e:'Impulse = force × time, so its SI unit is N s. It has the same dimensions as momentum.'},
{q:'The SI unit of frequency is:',o:['Second','Hertz','Radian','Metre'],a:1,e:'Frequency is the number of cycles per second. Its SI unit is hertz (Hz), equivalent to s⁻¹.'},
{q:'Which of the following is a coherent SI derived unit?',o:['dyne','erg','newton','calorie'],a:2,e:'Newton is a coherent SI derived unit, defined directly from SI base units as kg m s⁻².'},
