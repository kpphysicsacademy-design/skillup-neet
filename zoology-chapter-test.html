<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#172033;--muted:#667085;--brand:#315efb;--border:#e5e7eb;--ok:#067647}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.5}.wrap{max-width:900px;margin:auto;padding:24px 16px 50px}header{background:linear-gradient(135deg,#eef3ff,#fff);padding:28px 16px;text-align:center}h1{margin:0 0 6px;font-size:clamp(26px,6vw,42px)}.muted{color:var(--muted)}.q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin:14px 0}.q h2{font-size:17px;margin:0 0 12px}.opt{padding:8px 0}.answer{margin-top:12px;color:var(--ok);font-weight:700}.explain{margin-top:6px;color:var(--text)}.back{display:inline-block;margin-top:18px;color:var(--brand);text-decoration:none;font-weight:650}
</style></head>
<body><header><h1 id="title">Zoology Chapter Test</h1><div class="muted">NEET-focused MCQs with specific explanations</div></header>
<main class="wrap"><div id="content"></div><a class="back" href="zoology-full-path.html">← Back to Zoology path</a></main>
<script>
const tests={
'What is Living':[
{q:'Which characteristic is considered a defining property of living organisms at the cellular level?',o:['Growth','Metabolism','Increase in body mass','Movement'],a:'Metabolism',e:'Metabolism comprises the sum of all enzymatic biochemical reactions occurring within a living organism. It is a defining feature of living systems, whereas growth and movement can also occur in non-living systems.'},
{q:'Which process represents anabolism?',o:['Breakdown of glucose during cellular respiration','Hydrolysis of glycogen','Synthesis of proteins from amino acids','Breakdown of fats into fatty acids'],a:'Synthesis of proteins from amino acids',e:'Anabolism consists of constructive reactions that build complex molecules from simpler molecules. Protein synthesis joins amino acids to form polypeptide chains.'},
{q:'A characteristic feature that distinguishes living organisms from non-living objects is the ability to:',o:['Increase in size only','Undergo metabolism','Change position only','Form crystals'],a:'Undergo metabolism',e:'Living organisms continuously perform coordinated metabolic reactions for energy production, synthesis, maintenance and regulation. Non-living objects do not carry out metabolism.'},
{q:'Which statement about growth is correct in the biological sense?',o:['Growth is an increase in mass or number of cells in living organisms','Growth is an exclusive property of living organisms','Growth always occurs by cell division','Crystals cannot show growth'],a:'Growth is an increase in mass or number of cells in living organisms',e:'Biological growth generally involves an increase in cell number or cell mass. Growth alone is not a defining criterion because non-living objects such as crystals can also increase in size by external accretion.'},
{q:'Which property is exhibited by a unicellular organism as a complete living unit?',o:['Cell division only','Cellular organisation and metabolism','Tissue formation','Organ formation'],a:'Cellular organisation and metabolism',e:'A unicellular organism performs all essential life processes within a single cell, including metabolism, growth, response and reproduction.'},
{q:'The ability of an organism to sense and respond to changes in its surroundings is called:',o:['Consciousness','Catabolism','Assimilation','Excretion'],a:'Consciousness',e:'Consciousness, expressed as the ability to sense environmental changes and respond appropriately, is a defining characteristic of living organisms.'},
{q:'Which statement about reproduction is most accurate?',o:['It is essential for survival of every individual','It is required for continuity of a species','It occurs only in multicellular organisms','It is the defining property of all living organisms'],a:'It is required for continuity of a species',e:'Reproduction produces new individuals and ensures continuity of a species. It is not essential for survival of an individual, and some living organisms or individuals may be sterile.'},
{q:'Which level of organisation is characteristic of all living organisms?',o:['Organ system','Tissue','Cellular organisation','Organ'],a:'Cellular organisation',e:'All living organisms are composed of one or more cells and exhibit cellular organisation. Tissues, organs and organ systems occur only in organisms with appropriate multicellular organisation.'},
{q:'Which of the following is an example of catabolism?',o:['DNA replication','Photosynthetic carbon fixation','Cellular respiration of glucose','Protein synthesis'],a:'Cellular respiration of glucose',e:'Catabolism involves breakdown of complex molecules into simpler molecules, generally releasing usable energy. Cellular respiration breaks down glucose and captures energy in ATP.'},
{q:'Why is reproduction not regarded as an all-inclusive defining property of living organisms?',o:['Reproduction needs sunlight','Some living organisms are sterile','Only animals reproduce','Reproduction occurs only sexually'],a:'Some living organisms are sterile',e:'Individual organisms may be sterile, such as mules and certain worker bees. Therefore reproduction is important for species continuity but is not an obligatory property of every individual organism.'}
]};
const params=new URLSearchParams(location.search);const chapter=params.get('chapter')||'What is Living';const data=tests[chapter]||tests['What is Living'];document.getElementById('title').textContent=chapter+' — Chapter Test';document.getElementById('content').innerHTML=data.map((x,i)=>`<section class="q"><h2>Q${i+1}. ${x.q}</h2>${x.o.map((v,j)=>`<div class="opt"><strong>${String.fromCharCode(65+j)}.</strong> ${v}</div>`).join('')}<div class="answer">Correct Answer: ${x.a}</div><div class="explain">${x.e}</div></section>`).join('');
</script></body></html>
