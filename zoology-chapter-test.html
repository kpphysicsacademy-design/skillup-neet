const tests={
'What is Living?':[{q:'Which characteristic is considered a defining property of living organisms?',o:['Growth','Metabolism','Movement','Increase in body mass'],a:'Metabolism',e:'Metabolism is the sum of all enzymatic biochemical reactions occurring in a living organism and is a defining feature of living systems.'},{q:'Which process represents anabolism?',o:['Breakdown of glucose','Hydrolysis of glycogen','Synthesis of proteins from amino acids','Breakdown of fats'],a:'Synthesis of proteins from amino acids',e:'Anabolism builds complex molecules from simpler molecules; protein synthesis forms polypeptides from amino acids.'},{q:'Which feature most directly distinguishes living organisms from non-living objects?',o:['Increase in size','Undergoing metabolism','Change in position','Formation of crystals'],a:'Undergoing metabolism',e:'Living organisms continuously perform coordinated metabolic reactions, whereas non-living objects do not carry out metabolism.'},{q:'Which statement about biological growth is correct?',o:['It is always exclusive to living organisms','It involves increase in cell number or cell mass','It always occurs only by cell division','Crystals cannot grow'],a:'It involves increase in cell number or cell mass',e:'Biological growth involves an increase in cell number or cell mass. Non-living crystals can also increase in size by accretion.'},{q:'Which property allows a unicellular organism to function as a complete living unit?',o:['Tissue formation','Cellular organisation and metabolism','Organ formation','Organ-system formation'],a:'Cellular organisation and metabolism',e:'A unicellular organism performs essential life processes within its single cell, including metabolism, growth and reproduction.'},{q:'The ability to sense and respond to environmental changes is described as:',o:['Consciousness','Catabolism','Assimilation','Excretion'],a:'Consciousness',e:'Living organisms can sense environmental changes and respond appropriately; this property is described as consciousness in NCERT biology.'},{q:'Reproduction is most accurately described as a process required for:',o:['Survival of every individual','Continuity of a species','Movement of an organism','Metabolism of every cell'],a:'Continuity of a species',e:'Reproduction produces new individuals and maintains continuity of a species, although it is not essential for survival of every individual.'},{q:'Which level of organisation is common to all living organisms?',o:['Organ system','Tissue','Cellular organisation','Organ'],a:'Cellular organisation',e:'All living organisms consist of one or more cells and therefore possess cellular organisation.'},{q:'Which is an example of catabolism?',o:['DNA replication','Protein synthesis','Cellular respiration of glucose','Photosynthetic carbon fixation'],a:'Cellular respiration of glucose',e:'Catabolism breaks down complex molecules and generally releases usable energy; cellular respiration breaks down glucose.'},{q:'Why is reproduction not an all-inclusive defining property of living organisms?',o:['It requires sunlight','Some living organisms are sterile','Only animals reproduce','It occurs only sexually'],a:'Some living organisms are sterile',e:'Some individuals, such as mules and worker bees, are sterile. Thus reproduction is important for species continuity but is not obligatory for every individual.'},{"q":"Which statement best describes metabolism?","o":["Only digestion of food","The sum total of all chemical reactions in an organism","Only energy production","Only breakdown reactions"],"a":"The sum total of all chemical reactions in an organism","e":"Metabolism includes both constructive (anabolic) and degradative (catabolic) biochemical reactions occurring in living organisms."},{"q":"Which of the following is an anabolic process?","o":["Cellular respiration","Digestion of proteins","Synthesis of glycogen from glucose","Breakdown of fatty acids"],"a":"Synthesis of glycogen from glucose","e":"Anabolism involves synthesis of complex molecules from simpler ones, usually requiring energy."},{"q":"Which process is primarily catabolic?","o":["Protein synthesis","DNA replication","Cellular respiration","Photosynthetic synthesis of glucose"],"a":"Cellular respiration","e":"Cellular respiration breaks down organic substrates and releases energy that can be captured as ATP."},{"q":"Growth in living organisms generally occurs due to:","o":["Only accumulation of external material","Increase in cell number and/or cell mass","Crystallisation","Only water absorption"],"a":"Increase in cell number and/or cell mass","e":"Biological growth occurs through cell division and enlargement. It is internal and is therefore different from growth by external accretion seen in crystals."},{"q":"Why is growth not considered an exclusive defining property of living organisms?","o":["Living organisms never grow","Non-living objects such as crystals can also increase in size","Growth occurs only in plants","Growth requires reproduction"],"a":"Non-living objects such as crystals can also increase in size","e":"Crystals may grow by deposition of material on their surfaces, so increase in size alone cannot define life."},{"q":"Which property enables organisms to maintain their internal chemical activities despite environmental changes?","o":["Metabolism","Homeostasis","Reproduction","Locomotion"],"a":"Homeostasis","e":"Homeostasis refers to maintaining relatively stable internal conditions through regulatory mechanisms."},{"q":"Which characteristic is especially useful for distinguishing living organisms from machines?","o":["Ability to move","Self-regulation and metabolism","Ability to occupy space","Presence of mass"],"a":"Self-regulation and metabolism","e":"Living systems have organised metabolic pathways and regulatory mechanisms that maintain life processes."},{"q":"A mule is an example used to show that reproduction:","o":["Is absent in all animals","Is not an obligatory property of every individual organism","Never occurs in living organisms","Is the same as growth"],"a":"Is not an obligatory property of every individual organism","e":"Mules are generally sterile. Thus reproduction is important for continuity of species but is not essential for survival of every individual."},{"q":"Which response is an example of consciousness in a plant?","o":["A stone falling","A plant bending toward light","A crystal increasing in size","Water evaporating"],"a":"A plant bending toward light","e":"Plants perceive environmental stimuli and respond to them. Response to stimuli is a characteristic feature of living organisms."},{"q":"The term 'consciousness' in biology most directly refers to the ability to:","o":["Produce oxygen","Sense and respond to environmental stimuli","Make food only","Reproduce sexually"],"a":"Sense and respond to environmental stimuli","e":"NCERT describes consciousness as the ability of living organisms to sense their surroundings and respond to stimuli."},{"q":"Which of the following is NOT a universal characteristic of individual living organisms?","o":["Metabolism","Cellular organisation","Consciousness","Reproduction"],"a":"Reproduction","e":"Reproduction is not an obligatory property of every individual because some organisms or individuals are sterile."},{"q":"Which statement about viruses supports their placement at the borderline of living and non-living?","o":["They have cellular organisation outside a host","They show metabolic activity independently outside a host","They reproduce only inside living host cells","They contain tissues"],"a":"They reproduce only inside living host cells","e":"Viruses are acellular and inactive outside host cells but multiply using the machinery of living cells."},{"q":"Which feature is shared by both unicellular and multicellular organisms?","o":["Presence of organs","Cellular organisation","Presence of tissues","Organ-system organisation"],"a":"Cellular organisation","e":"All living organisms are made of cells. Unicellular organisms perform all essential functions within one cell."},{"q":"Which statement about reproduction is correct?","o":["It is necessary for survival of every individual","It ensures continuity of the species","It occurs only in multicellular organisms","It is identical to growth"],"a":"It ensures continuity of the species","e":"Reproduction generates new individuals and maintains the continuity of a species across generations."},{"q":"Which of the following represents biological organisation at the cellular level?","o":["Amoeba carrying out all life processes in one cell","A crystal increasing in size","A machine using electricity","A cloud changing shape"],"a":"Amoeba carrying out all life processes in one cell","e":"Amoeba is unicellular and its single cell performs nutrition, respiration, excretion, growth and reproduction."},{"q":"Which pair correctly represents the two broad types of metabolic reactions?","o":["Growth and reproduction","Anabolism and catabolism","Digestion and absorption","Movement and response"],"a":"Anabolism and catabolism","e":"Metabolism consists broadly of anabolic reactions that build molecules and catabolic reactions that break molecules down."},{"q":"Which statement correctly compares anabolism and catabolism?","o":["Both always break down molecules","Anabolism builds complex molecules whereas catabolism breaks them down","Anabolism is unrelated to metabolism","Catabolism always consumes more energy than anabolism"],"a":"Anabolism builds complex molecules whereas catabolism breaks them down","e":"Anabolic pathways generally require energy to synthesise complex molecules, while catabolic pathways release energy during breakdown."},{"q":"A seed germinating into a plant demonstrates that living growth is associated with:","o":["Only accumulation of dust","Increase in cell number and cellular activity","Crystal formation","Loss of metabolism"],"a":"Increase in cell number and cellular activity","e":"Germination involves active metabolism, cell division and cell enlargement, demonstrating biological growth."},{"q":"Which observation most strongly indicates that an organism is alive?","o":["It has a fixed shape","It undergoes coordinated metabolism and responds to stimuli","It has a large mass","It occupies space"],"a":"It undergoes coordinated metabolism and responds to stimuli","e":"Metabolism and responsiveness are fundamental properties of living systems and together provide strong evidence of life."},{"q":"Which statement is most appropriate for NEET questions about defining properties of life?","o":["Growth alone defines life","Reproduction alone defines life","Metabolism and cellular organisation are fundamental features, while reproduction is not obligatory for every individual","Movement alone defines life"],"a":"Metabolism and cellular organisation are fundamental features, while reproduction is not obligatory for every individual","e":"NCERT emphasises cellular organisation, metabolism and consciousness as key properties; reproduction is important for species continuity but is not universal to every individual."},{"q":"Which statement best describes metabolism?","o":["Only digestion of food","The sum total of all chemical reactions in an organism","Only energy production","Only breakdown reactions"],"a":"The sum total of all chemical reactions in an organism","e":"Metabolism includes both constructive (anabolic) and degradative (catabolic) biochemical reactions occurring in living organisms."},{"q":"Which of the following is an anabolic process?","o":["Cellular respiration","Digestion of proteins","Synthesis of glycogen from glucose","Breakdown of fatty acids"],"a":"Synthesis of glycogen from glucose","e":"Anabolism involves synthesis of complex molecules from simpler ones, usually requiring energy."},{"q":"Which process is primarily catabolic?","o":["Protein synthesis","DNA replication","Cellular respiration","Photosynthetic synthesis of glucose"],"a":"Cellular respiration","e":"Cellular respiration breaks down organic substrates and releases energy that can be captured as ATP."},{"q":"Growth in living organisms generally occurs due to:","o":["Only accumulation of external material","Increase in cell number and/or cell mass","Crystallisation","Only water absorption"],"a":"Increase in cell number and/or cell mass","e":"Biological growth occurs through cell division and enlargement and differs from growth by external accretion seen in crystals."},{"q":"Why is growth not considered an exclusive defining property of living organisms?","o":["Living organisms never grow","Non-living objects such as crystals can also increase in size","Growth occurs only in plants","Growth requires reproduction"],"a":"Non-living objects such as crystals can also increase in size","e":"Crystals may grow by deposition of material on their surfaces, so increase in size alone cannot define life."},{"q":"Which property enables organisms to maintain relatively stable internal conditions?","o":["Homeostasis","Reproduction","Locomotion","Crystallisation"],"a":"Homeostasis","e":"Homeostasis is the maintenance of relatively stable internal conditions through regulatory mechanisms."},{"q":"Which characteristic is especially useful for distinguishing living organisms from non-living machines?","o":["Ability to move","Self-regulation and metabolism","Ability to occupy space","Presence of mass"],"a":"Self-regulation and metabolism","e":"Living systems have organised metabolic pathways and regulatory mechanisms that maintain life processes."},{"q":"A mule is an example used to show that reproduction:","o":["Is absent in all animals","Is not an obligatory property of every individual organism","Never occurs in living organisms","Is the same as growth"],"a":"Is not an obligatory property of every individual organism","e":"Mules are generally sterile, showing that reproduction is important for species continuity but is not essential for every individual."},{"q":"Which response is an example of consciousness in a plant?","o":["A stone falling","A plant bending toward light","A crystal increasing in size","Water evaporating"],"a":"A plant bending toward light","e":"Plants perceive environmental stimuli and respond to them, demonstrating a characteristic feature of living organisms."},{"q":"The term 'consciousness' in biology most directly refers to the ability to:","o":["Produce oxygen","Sense and respond to environmental stimuli","Make food only","Reproduce sexually"],"a":"Sense and respond to environmental stimuli","e":"Living organisms sense their surroundings and respond to internal and external stimuli."},{"q":"Which of the following is NOT a universal characteristic of individual living organisms?","o":["Metabolism","Cellular organisation","Consciousness","Reproduction"],"a":"Reproduction","e":"Reproduction is not obligatory for every individual because some organisms or individuals are sterile."},{"q":"Which statement about viruses supports their position at the borderline of living and non-living?","o":["They have cellular organisation outside a host","They show independent metabolism outside a host","They reproduce only inside living host cells","They contain tissues"],"a":"They reproduce only inside living host cells","e":"Viruses are acellular and inactive outside host cells but multiply using the machinery of living cells."},{"q":"Which feature is shared by both unicellular and multicellular organisms?","o":["Presence of organs","Cellular organisation","Presence of tissues","Organ-system organisation"],"a":"Cellular organisation","e":"All living organisms are made of cells; unicellular organisms perform essential life functions within one cell."},{"q":"Which statement about reproduction is correct?","o":["It is necessary for survival of every individual","It ensures continuity of the species","It occurs only in multicellular organisms","It is identical to growth"],"a":"It ensures continuity of the species","e":"Reproduction generates new individuals and maintains species continuity across generations."},{"q":"Which example represents biological organisation at the cellular level?","o":["Amoeba carrying out all life processes in one cell","A crystal increasing in size","A machine using electricity","A cloud changing shape"],"a":"Amoeba carrying out all life processes in one cell","e":"Amoeba is unicellular and its single cell performs nutrition, respiration, excretion, growth and reproduction."},{"q":"Which pair correctly represents the two broad types of metabolic reactions?","o":["Growth and reproduction","Anabolism and catabolism","Digestion and absorption","Movement and response"],"a":"Anabolism and catabolism","e":"Metabolism includes anabolic reactions that build molecules and catabolic reactions that break molecules down."},{"q":"Which statement correctly compares anabolism and catabolism?","o":["Both always break down molecules","Anabolism builds complex molecules whereas catabolism breaks them down","Anabolism is unrelated to metabolism","Catabolism always consumes more energy"],"a":"Anabolism builds complex molecules whereas catabolism breaks them down","e":"Anabolic pathways generally synthesise complex molecules, while catabolic pathways break molecules down and release usable energy."},{"q":"A seed germinating into a plant demonstrates that living growth is associated with:","o":["Only accumulation of dust","Increase in cell number and cellular activity","Crystal formation","Loss of metabolism"],"a":"Increase in cell number and cellular activity","e":"Germination involves active metabolism, cell division and cell enlargement."},{"q":"Which observation most strongly indicates that an organism is alive?","o":["It has a fixed shape","It undergoes coordinated metabolism and responds to stimuli","It has a large mass","It occupies space"],"a":"It undergoes coordinated metabolism and responds to stimuli","e":"Metabolism and responsiveness are fundamental properties of living systems."},{"q":"Which statement is most appropriate for NEET questions about defining properties of life?","o":["Growth alone defines life","Reproduction alone defines life","Metabolism and cellular organisation are fundamental features, while reproduction is not obligatory for every individual","Movement alone defines life"],"a":"Metabolism and cellular organisation are fundamental features, while reproduction is not obligatory for every individual","e":"NCERT emphasises cellular organisation, metabolism and consciousness as key properties; reproduction is important for species continuity but is not universal to every individual."},{"q":"Which statement correctly describes living organisms as open systems?","o":["They never exchange matter with the environment","They exchange matter and energy with the environment","They cannot release waste","They remain chemically isolated"],"a":"They exchange matter and energy with the environment","e":"Living organisms continuously exchange matter and energy with their surroundings to maintain metabolism and life processes."},{"q":"Which process directly requires enzymes in living cells?","o":["A biochemical metabolic reaction","Crystal formation","Simple evaporation","Mechanical movement of a stone"],"a":"A biochemical metabolic reaction","e":"Enzymes catalyse and regulate biochemical reactions that form the basis of cellular metabolism."},{"q":"Which pair is correctly matched?","o":["Anabolism \u2014 breakdown of complex molecules","Catabolism \u2014 synthesis of proteins","Metabolism \u2014 sum of biochemical reactions","Growth \u2014 only external deposition"],"a":"Metabolism \u2014 sum of biochemical reactions","e":"Metabolism includes the complete set of biochemical reactions occurring in an organism, including anabolism and catabolism."},{"q":"Which feature shows that living organisms are highly organised systems?","o":["Random chemical reactions only","Coordinated cellular and biochemical activities","Absence of regulation","Permanent chemical inactivity"],"a":"Coordinated cellular and biochemical activities","e":"Life depends on highly coordinated structural, biochemical and regulatory processes operating together."},{"q":"A living cell maintains its internal conditions mainly through:","o":["Regulation and homeostasis","Crystal deposition","Complete isolation","Stopping metabolism"],"a":"Regulation and homeostasis","e":"Regulatory mechanisms help living cells maintain suitable internal conditions despite changes in the environment."},{"q":"Which statement about metabolism is correct?","o":["It occurs only in animals","It is present in living cells and includes anabolic and catabolic reactions","It is limited to digestion","It occurs only during reproduction"],"a":"It is present in living cells and includes anabolic and catabolic reactions","e":"Metabolism is a universal feature of living cells and includes both synthesis and breakdown reactions."},{"q":"Which example best demonstrates response to an external stimulus?","o":["A stone remaining stationary","A shoot bending toward light","A crystal growing by deposition","Water freezing"],"a":"A shoot bending toward light","e":"Directional growth of a shoot toward light is a response to an environmental stimulus."},{"q":"Why can a non-living crystal increase in size without being considered alive?","o":["It performs metabolism","It accumulates material on its surface without cellular metabolism","It reproduces","It maintains homeostasis"],"a":"It accumulates material on its surface without cellular metabolism","e":"Crystal growth occurs by external deposition and does not involve cellular organisation or metabolism."},{"q":"Which property is most closely associated with cellular organisation?","o":["Presence of membrane-bound or organised cellular structures","Ability of a rock to fracture","Increase in crystal size","Evaporation"],"a":"Presence of membrane-bound or organised cellular structures","e":"Living organisms possess cellular organisation, with cells providing the basic structural and functional unit of life."},{"q":"Which statement about unicellular organisms is correct?","o":["They cannot reproduce","Their single cell performs all essential life processes","They always have tissues","They always have organ systems"],"a":"Their single cell performs all essential life processes","e":"In unicellular organisms, one cell carries out nutrition, respiration, excretion, growth and reproduction."},{"q":"Which life process provides energy for many cellular activities?","o":["Catabolic metabolism","Crystal growth","External deposition","Passive shape change"],"a":"Catabolic metabolism","e":"Catabolic reactions break down molecules and release energy that can be captured for cellular work."},{"q":"Which statement about anabolic reactions is correct?","o":["They generally build complex molecules from simpler ones","They always destroy cellular structures","They are unrelated to metabolism","They occur only outside cells"],"a":"They generally build complex molecules from simpler ones","e":"Anabolic pathways synthesise complex cellular molecules and generally require an input of energy."},{"q":"Which observation supports the presence of metabolism in a living organism?","o":["A coordinated series of enzyme-catalysed chemical reactions","A crystal becoming larger","A rock changing position after being pushed","Water changing state"],"a":"A coordinated series of enzyme-catalysed chemical reactions","e":"Metabolism consists of enzyme-regulated biochemical reactions that sustain cellular activities."},{"q":"Which statement best explains why consciousness is considered a characteristic of living organisms?","o":["Living organisms can sense and respond to stimuli","All organisms are always aware like humans","Only animals respond to stimuli","Consciousness means reproduction"],"a":"Living organisms can sense and respond to stimuli","e":"In NCERT biology, consciousness refers broadly to the ability to sense the environment and respond to stimuli."},{"q":"Which of the following is an example of a catabolic pathway?","o":["Synthesis of a protein","Formation of glycogen","Breakdown of glucose during respiration","DNA replication"],"a":"Breakdown of glucose during respiration","e":"Cellular respiration involves breakdown of glucose and other substrates with release of usable energy."},{"q":"Which of the following is an example of an anabolic pathway?","o":["Protein synthesis from amino acids","Glucose oxidation","Fatty acid breakdown","Digestion of starch"],"a":"Protein synthesis from amino acids","e":"Protein synthesis builds a complex macromolecule from simpler amino acid units."},{"q":"Which statement best distinguishes biological growth from crystal growth?","o":["Biological growth involves cellular activity and metabolism","Both require cells","Crystal growth requires reproduction","Biological growth occurs only by surface deposition"],"a":"Biological growth involves cellular activity and metabolism","e":"Biological growth is associated with cellular processes, whereas crystals increase in size by deposition of material."},{"q":"Which property allows living organisms to maintain organised functioning despite continuous internal reactions?","o":["Regulation","Randomness","Inactivity","Crystallisation"],"a":"Regulation","e":"Regulatory mechanisms coordinate metabolic and physiological activities and help maintain stable internal conditions."},{"q":"Which statement is most accurate about reproduction in biology?","o":["Every individual must reproduce to remain alive","Reproduction is important for continuity of species but is not obligatory for every individual","Only sexually reproducing organisms are living","Reproduction is identical to metabolism"],"a":"Reproduction is important for continuity of species but is not obligatory for every individual","e":"NCERT uses sterile individuals such as mules to show that reproduction is not an obligatory property of every living individual."},{"q":"Which combination contains fundamental characteristics used to recognise life?","o":["Cellular organisation, metabolism and responsiveness","Mass, colour and shape","Crystal growth, evaporation and movement","Size, weight and temperature"],"a":"Cellular organisation, metabolism and responsiveness","e":"Living systems show cellular organisation, metabolic activity and the ability to sense and respond to their surroundings."}],
'Biological Classification':[{q:'Who proposed the five-kingdom classification system?',o:['R.H. Whittaker','Carolus Linnaeus','Robert Hooke','Ernst Haeckel'],a:'R.H. Whittaker',e:'R.H. Whittaker proposed the five-kingdom classification in 1969: Monera, Protista, Fungi, Plantae and Animalia.'},{q:'Which criterion was central to Whittaker’s five-kingdom classification?',o:['Cell structure and organisation','Body colour','Habitat alone','Geographical distribution'],a:'Cell structure and organisation',e:'Whittaker considered cell structure, body organisation, mode of nutrition, reproduction and phylogenetic relationships.'},{q:'Organisms of kingdom Monera are:',o:['Prokaryotic','Always multicellular','Eukaryotic','Acellular'],a:'Prokaryotic',e:'Monerans are prokaryotes lacking a true nucleus and membrane-bound organelles.'},{q:'Which kingdom primarily contains unicellular eukaryotes?',o:['Monera','Protista','Plantae','Animalia'],a:'Protista',e:'Protista includes many unicellular eukaryotes such as Amoeba, Paramecium and Euglena.'},{q:'The cell wall of fungi is mainly made of:',o:['Cellulose','Chitin','Peptidoglycan','Silica'],a:'Chitin',e:'Fungal cell walls contain chitin, unlike the cellulose-rich cell walls of plants.'},{q:'Which organism belongs to kingdom Fungi?',o:['Amoeba','Saccharomyces','Nostoc','Paramecium'],a:'Saccharomyces',e:'Saccharomyces is a yeast and belongs to Fungi; Nostoc is a cyanobacterium and Amoeba and Paramecium are protists.'},{q:'Cyanobacteria are placed in Monera because they are:',o:['Prokaryotic photosynthetic organisms','Multicellular fungi','Unicellular animals','Eukaryotic algae'],a:'Prokaryotic photosynthetic organisms',e:'Cyanobacteria perform photosynthesis but have prokaryotic cellular organisation.'},{q:'Which mode of nutrition is characteristic of fungi?',o:['Absorptive heterotrophic nutrition','Holozoic nutrition only','Photoautotrophy only','Ingestion followed by internal digestion'],a:'Absorptive heterotrophic nutrition',e:'Fungi secrete digestive enzymes externally and absorb the resulting soluble nutrients.'},{q:'Which statement about viruses is correct?',o:['They are cellular prokaryotes','They are acellular infectious agents','They belong to Monera','They have independent metabolism outside hosts'],a:'They are acellular infectious agents',e:'Viruses are acellular infectious entities containing nucleic acid and a protein coat and depend on host cells for replication.'},{q:'Lichens represent an association between:',o:['Algae and fungi','Bacteria and viruses','Fungi and protozoans','Plants and animals'],a:'Algae and fungi',e:'A lichen consists of a photosynthetic partner, usually an alga or cyanobacterium, living in close association with a fungus.'},{"q":"Who proposed the five-kingdom classification system?","o":["R.H. Whittaker","Carolus Linnaeus","Ernst Haeckel","Robert Hooke"],"a":"R.H. Whittaker","e":"R.H. Whittaker proposed the five-kingdom classification in 1969 using criteria including cell structure, body organisation, mode of nutrition and reproduction."},{"q":"Which kingdom contains organisms that are fundamentally prokaryotic?","o":["Monera","Protista","Fungi","Animalia"],"a":"Monera","e":"Members of Monera are prokaryotic and lack a true nucleus and membrane-bound organelles."},{"q":"Which of the following is a characteristic feature of archaebacteria?","o":["They have unusual cell wall and membrane features","They always possess chloroplasts","They are multicellular animals","They lack DNA"],"a":"They have unusual cell wall and membrane features","e":"Archaebacteria have distinctive cell wall and membrane compositions that allow many species to survive extreme habitats."},{"q":"Methanogens are commonly found in the rumen of cattle and are important in production of:","o":["Oxygen","Biogas","Starch","Lactic acid"],"a":"Biogas","e":"Methanogenic archaebacteria produce methane during anaerobic decomposition and contribute to biogas formation."},{"q":"Cyanobacteria are also commonly called:","o":["Blue-green algae","Red algae","Brown algae","Golden algae"],"a":"Blue-green algae","e":"Cyanobacteria are photosynthetic prokaryotes historically called blue-green algae, although they are bacteria rather than true algae."},{"q":"Which cyanobacterium is commonly associated with nitrogen fixation?","o":["Nostoc","Amoeba","Paramecium","Saccharomyces"],"a":"Nostoc","e":"Nostoc contains specialised cells called heterocysts that can carry out nitrogen fixation."},{"q":"Which kingdom includes unicellular eukaryotic organisms such as Amoeba and Paramecium?","o":["Protista","Monera","Plantae","Animalia"],"a":"Protista","e":"Protista includes predominantly unicellular eukaryotes such as Amoeba, Paramecium and Euglena."},{"q":"Euglena is unusual because it can show both:","o":["Autotrophic and heterotrophic nutrition","Prokaryotic and viral organisation","Sexual and asexual reproduction only","Plant and animal tissues"],"a":"Autotrophic and heterotrophic nutrition","e":"Euglena can photosynthesise in light and obtain food heterotrophically under suitable conditions."},{"q":"Which group includes diatoms?","o":["Chrysophytes","Dinoflagellates","Slime moulds","Protozoans"],"a":"Chrysophytes","e":"Diatoms are photosynthetic protists placed under chrysophytes in the NCERT classification."},{"q":"The cell walls of diatoms are mainly composed of:","o":["Silica","Chitin","Peptidoglycan","Cellulose only"],"a":"Silica","e":"Diatom cell walls are impregnated with silica, making them resistant and durable."},{"q":"Red tides are commonly caused by blooms of:","o":["Dinoflagellates","Mosses","Fungi","Cyanophages"],"a":"Dinoflagellates","e":"Rapid multiplication of red-pigmented dinoflagellates can colour seawater reddish and produce red tides."},{"q":"Slime moulds are best described as:","o":["Saprophytic protists","Photosynthetic bacteria","Multicellular fungi only","Infectious viruses"],"a":"Saprophytic protists","e":"Slime moulds are saprophytic protists that feed on decaying organic matter and may form an aggregation during favourable conditions."},{"q":"The cell wall of fungi is primarily made of:","o":["Chitin","Cellulose","Peptidoglycan","Silica"],"a":"Chitin","e":"Fungal cell walls contain chitin, a structural polysaccharide distinct from plant cellulose."},{"q":"Fungi obtain nutrition mainly by:","o":["Absorption after extracellular digestion","Ingestion of solid food","Photosynthesis","Chemosynthesis only"],"a":"Absorption after extracellular digestion","e":"Fungi secrete enzymes onto the substrate and absorb the soluble products of digestion."},{"q":"Which fungal group includes Rhizopus and Mucor in the traditional NCERT classification?","o":["Phycomycetes","Ascomycetes","Basidiomycetes","Deuteromycetes"],"a":"Phycomycetes","e":"Rhizopus and Mucor are examples traditionally placed in Phycomycetes in NCERT's five-kingdom discussion."},{"q":"Yeast belongs to which fungal group in the traditional NCERT classification?","o":["Ascomycetes","Phycomycetes","Basidiomycetes","Deuteromycetes only"],"a":"Ascomycetes","e":"Saccharomyces, the common yeast, is an example of Ascomycetes and reproduces commonly by budding."},{"q":"Which statement about viruses is correct?","o":["They are acellular and replicate inside host cells","They are independent cellular organisms","They always possess cytoplasm","They carry out independent metabolism outside hosts"],"a":"They are acellular and replicate inside host cells","e":"Viruses are acellular infectious agents and depend on host cellular machinery for replication."},{"q":"The genetic material of a virus may be:","o":["DNA or RNA","Only DNA","Only RNA","Always both DNA and RNA"],"a":"DNA or RNA","e":"A virus contains either DNA or RNA as its genetic material, enclosed by a protein coat and sometimes an envelope."},{"q":"Lichens represent a symbiotic association between:","o":["Alga or cyanobacterium and fungus","Virus and bacterium","Protozoan and animal","Plant and insect"],"a":"Alga or cyanobacterium and fungus","e":"The photosynthetic partner supplies carbohydrates while the fungal partner provides shelter, water and minerals."},{"q":"Which statement is most appropriate for NEET questions on biological classification?","o":["Classification is based on a single character","Modern classification considers multiple characteristics and evolutionary relationships","All microorganisms are placed in Monera","Viruses are cellular organisms"],"a":"Modern classification considers multiple characteristics and evolutionary relationships","e":"Classification systems use combinations of cellular, structural, nutritional, reproductive and evolutionary characteristics rather than a single feature."}],
'Animal Kingdom':[{q:'Which feature is characteristic of members of kingdom Animalia?',o:['Cell walls','Multicellularity and heterotrophic nutrition','Chlorophyll in all cells','Prokaryotic organisation'],a:'Multicellularity and heterotrophic nutrition',e:'Animals are multicellular eukaryotes that obtain nutrition heterotrophically by ingestion; their cells lack cell walls.'},{q:'Animals with radial symmetry can be divided into similar halves through:',o:['Only one longitudinal plane','Any plane passing through the central axis','Only a transverse plane','No plane'],a:'Any plane passing through the central axis',e:'In radial symmetry, similar halves can be obtained by any plane passing through the central oral-aboral axis.'},{q:'Which phylum is characterised by a water canal system?',o:['Porifera','Annelida','Arthropoda','Chordata'],a:'Porifera',e:'Sponges possess a characteristic water canal system through which water enters via ostia and exits through the osculum.'},{q:'Cnidoblasts or stinging cells are characteristic of:',o:['Porifera','Cnidaria','Platyhelminthes','Mollusca'],a:'Cnidaria',e:'Cnidarians possess specialised stinging cells called cnidoblasts or cnidocytes, used for defence and capturing prey.'},{q:'Which phylum includes organisms that are dorsoventrally flattened and commonly called flatworms?',o:['Platyhelminthes','Aschelminthes','Annelida','Echinodermata'],a:'Platyhelminthes',e:'Platyhelminthes are bilaterally symmetrical, triploblastic and dorsoventrally flattened animals.'},{q:'Pseudocoelom is characteristic of:',o:['Platyhelminthes','Aschelminthes','Annelida','Chordata'],a:'Aschelminthes',e:'Aschelminthes (roundworms) possess a pseudocoel, a body cavity not completely lined by mesoderm.'},{q:'True metameric segmentation is well developed in:',o:['Annelida','Porifera','Cnidaria','Mollusca'],a:'Annelida',e:'Annelids show true metamerism, in which the body is externally and internally divided into repeated segments.'},{q:'Which phylum is the largest in the animal kingdom?',o:['Mollusca','Arthropoda','Annelida','Chordata'],a:'Arthropoda',e:'Arthropoda is the largest animal phylum and includes insects, crustaceans, arachnids and myriapods.'},{q:'Water vascular system is a characteristic feature of:',o:['Mollusca','Echinodermata','Arthropoda','Hemichordata'],a:'Echinodermata',e:'Echinoderms possess a water vascular system involved in locomotion, feeding and respiration.'},{q:'Which feature distinguishes chordates from non-chordates?',o:['Presence of a notochord at least during development','Presence of a digestive tract','Multicellularity','Heterotrophic nutrition'],a:'Presence of a notochord at least during development',e:'Chordates are defined by features including a notochord, dorsal hollow nerve cord, pharyngeal slits and post-anal tail at some stage.'}],
'Structural Organisation in Animals':[{q:'Which tissue primarily covers body surfaces and lines internal organs?',o:['Connective tissue','Epithelial tissue','Muscular tissue','Nervous tissue'],a:'Epithelial tissue',e:'Epithelial tissue forms protective coverings and linings, including the skin surface and the lining of many internal organs and cavities.'},{q:'Which epithelial tissue is best suited for diffusion, such as in alveoli?',o:['Simple squamous epithelium','Stratified squamous epithelium','Cuboidal epithelium','Columnar epithelium'],a:'Simple squamous epithelium',e:'Simple squamous epithelium is a single thin layer of cells that permits rapid diffusion and filtration; it lines alveoli and blood vessels.'},{q:'The main function of ciliated epithelium in the respiratory tract is to:',o:['Secrete digestive enzymes','Move mucus and trapped particles','Store fat','Contract the intestine'],a:'Move mucus and trapped particles',e:'Ciliated epithelial cells beat their cilia to move mucus and trapped foreign particles toward the pharynx.'},{q:'Which connective tissue stores fat and acts as an energy reserve?',o:['Areolar tissue','Adipose tissue','Cartilage','Bone'],a:'Adipose tissue',e:'Adipose tissue contains adipocytes filled with lipid and serves as an energy reserve, insulation and cushioning tissue.'},{q:'Which tissue connects muscle to bone?',o:['Ligament','Tendon','Cartilage','Areolar tissue'],a:'Tendon',e:'Tendons are strong fibrous connective tissues that attach skeletal muscles to bones.'},{q:'Which connective tissue connects bone to bone?',o:['Tendon','Ligament','Adipose tissue','Blood'],a:'Ligament',e:'Ligaments are elastic connective tissue bands that connect bones at joints and help stabilise them.'},{q:'Intercalated discs are characteristic of:',o:['Skeletal muscle','Smooth muscle','Cardiac muscle','Nervous tissue'],a:'Cardiac muscle',e:'Cardiac muscle cells are joined by intercalated discs, which facilitate coordinated contraction of the heart.'},{q:'Which muscle tissue is involuntary and non-striated?',o:['Skeletal muscle','Smooth muscle','Cardiac muscle','Voluntary muscle'],a:'Smooth muscle',e:'Smooth muscle lacks visible striations and contracts involuntarily; it occurs in the walls of organs such as the intestine and blood vessels.'},{q:'Which part of a neuron receives impulses from other neurons?',o:['Axon','Dendrite','Myelin sheath','Axon terminal only'],a:'Dendrite',e:'Dendrites are branched neuronal processes specialised mainly for receiving signals and conducting them toward the cell body.'},{q:'Which tissue is responsible for conduction of nerve impulses?',o:['Epithelial tissue','Connective tissue','Muscular tissue','Nervous tissue'],a:'Nervous tissue',e:'Nervous tissue contains neurons specialised to receive stimuli and transmit electrical signals, with supporting neuroglial cells.'}],
'Cell: The Unit of Life':[{q:'Which organelle is known as the powerhouse of the cell?',o:['Golgi apparatus','Mitochondrion','Lysosome','Ribosome'],a:'Mitochondrion',e:'Mitochondria generate ATP through aerobic respiration and are therefore commonly called the powerhouse of the cell.'},{q:'The fluid mosaic model describes the structure of the:',o:['Cell wall','Plasma membrane','Nucleus','Ribosome'],a:'Plasma membrane',e:'The plasma membrane is a dynamic phospholipid bilayer with embedded proteins, described by the fluid mosaic model.'},{q:'Which organelle is directly associated with protein synthesis?',o:['Ribosome','Lysosome','Vacuole','Centrosome'],a:'Ribosome',e:'Ribosomes translate messenger RNA and assemble amino acids into polypeptide chains.'},{q:'The nucleolus is primarily involved in the formation of:',o:['Lipids','Ribosomal subunits','ATP','Lysosomes'],a:'Ribosomal subunits',e:'The nucleolus synthesises rRNA and assembles ribosomal subunits.'},{q:'Which organelle contains hydrolytic enzymes for intracellular digestion?',o:['Lysosome','Peroxisome','Ribosome','Centrosome'],a:'Lysosome',e:'Lysosomes contain hydrolytic enzymes that digest macromolecules and worn-out cellular components.'},{q:'Which cell organelle is bounded by a double membrane and contains its own DNA?',o:['Mitochondrion','Golgi apparatus','Lysosome','Endoplasmic reticulum'],a:'Mitochondrion',e:'Mitochondria are double-membrane organelles containing circular DNA and ribosomes.'},{q:'Rough endoplasmic reticulum is distinguished by the presence of:',o:['Chlorophyll','Ribosomes','Centrioles','Cellulose'],a:'Ribosomes',e:'Rough ER has ribosomes attached to its cytosolic surface and is important in synthesis of secretory and membrane proteins.'},{q:'Which structure is present in plant cells but absent in typical animal cells?',o:['Mitochondrion','Plasma membrane','Cell wall','Ribosome'],a:'Cell wall',e:'Plant cells possess a cellulose-rich cell wall outside the plasma membrane; typical animal cells do not.'},{q:'The Golgi apparatus is mainly involved in:',o:['Modification and packaging of biomolecules','DNA replication','ATP synthesis','Chromosome movement'],a:'Modification and packaging of biomolecules',e:'The Golgi apparatus modifies, sorts and packages proteins and lipids for transport or secretion.'},{q:'Centrioles are typically present in:',o:['Animal cells','Mature sieve tubes only','Bacterial cells','All plant cells'],a:'Animal cells',e:'Centrioles occur in the centrosome of most animal cells and participate in spindle organisation during cell division.'}],
'Biomolecules':[{q:'The monomers of proteins are:',o:['Monosaccharides','Amino acids','Nucleotides','Fatty acids'],a:'Amino acids',e:'Proteins are polymers of amino acids linked by peptide bonds.'},{q:'Which carbohydrate is a storage polysaccharide in animals?',o:['Cellulose','Glycogen','Chitin','Sucrose'],a:'Glycogen',e:'Animals store excess glucose mainly as glycogen, particularly in liver and skeletal muscles.'},{q:'A nucleotide is composed of:',o:['Sugar, phosphate and nitrogenous base','Amino acid and phosphate','Glycerol and fatty acids','Only a nitrogenous base'],a:'Sugar, phosphate and nitrogenous base',e:'A nucleotide contains a pentose sugar, phosphate group and nitrogenous base.'},{q:'The bond linking two amino acids is called:',o:['Glycosidic bond','Peptide bond','Phosphodiester bond','Hydrogen bond'],a:'Peptide bond',e:'A peptide bond forms between the carboxyl group of one amino acid and amino group of another.'},{q:'Which biomolecule is generally insoluble in water and includes fats and oils?',o:['Lipid','Protein','Nucleic acid','Polysaccharide'],a:'Lipid',e:'Lipids are largely hydrophobic biomolecules that include fats, oils, phospholipids and steroids.'},{q:'Which nitrogenous base is found in RNA but not DNA?',o:['Thymine','Uracil','Cytosine','Guanine'],a:'Uracil',e:'RNA contains uracil in place of the thymine found in DNA.'},{q:'Enzymes are mostly:',o:['Proteins','Lipids','Carbohydrates','Mineral salts'],a:'Proteins',e:'Most enzymes are proteins, although a small number of catalytic RNA molecules called ribozymes also exist.'},{q:'Which polysaccharide forms the structural component of plant cell walls?',o:['Glycogen','Cellulose','Starch','Sucrose'],a:'Cellulose',e:'Cellulose is a structural polysaccharide composed of β-glucose units and forms plant cell walls.'},{q:'The secondary structure of proteins is stabilised mainly by:',o:['Peptide bonds only','Hydrogen bonds','Glycosidic bonds','Phosphodiester bonds'],a:'Hydrogen bonds',e:'α-helices and β-pleated sheets are stabilised mainly by hydrogen bonding between peptide backbone groups.'},{q:'DNA and RNA are classified as:',o:['Nucleic acids','Lipids','Proteins','Polysaccharides'],a:'Nucleic acids',e:'DNA and RNA are polymers of nucleotides and are collectively called nucleic acids.'}],
'Cell Cycle and Cell Division':[{q:'During which phase does DNA replication occur?',o:['G1 phase','S phase','G2 phase','M phase'],a:'S phase',e:'DNA synthesis occurs during the S or synthesis phase of interphase.'},{q:'Chromosomes are aligned at the equatorial plate during:',o:['Prophase','Metaphase','Anaphase','Telophase'],a:'Metaphase',e:'In metaphase, chromosomes are arranged at the equatorial plate before sister chromatids separate.'},{q:'Separation of sister chromatids occurs during:',o:['Prophase','Metaphase','Anaphase','Interphase'],a:'Anaphase',e:'Centromeres split during anaphase and sister chromatids move toward opposite poles.'},{q:'Meiosis results in the formation of cells with:',o:['The same chromosome number','Half the chromosome number','Double the chromosome number','No chromosomes'],a:'Half the chromosome number',e:'Meiosis is a reduction division that produces haploid cells from a diploid parent cell.'},{q:'Crossing over occurs during:',o:['Prophase I of meiosis','Metaphase II','Anaphase II','Telophase I'],a:'Prophase I of meiosis',e:'Crossing over between homologous chromosomes occurs during pachytene of prophase I.'},{q:'The longest phase of the cell cycle is generally:',o:['Interphase','Metaphase','Anaphase','Telophase'],a:'Interphase',e:'Interphase occupies most of the cell cycle and includes G1, S and G2 phases.'},{q:'Cytokinesis in animal cells occurs by formation of a:',o:['Cell plate','Cleavage furrow','Phragmoplast','Middle lamella'],a:'Cleavage furrow',e:'Animal cells divide their cytoplasm by constriction of a cleavage furrow.'},{q:'The major significance of mitosis is:',o:['Reduction of chromosome number','Growth and maintenance with genetic continuity','Formation of gametes only','Crossing over'],a:'Growth and maintenance with genetic continuity',e:'Mitosis produces genetically similar daughter cells and supports growth, repair and replacement.'},{q:'Synapsis of homologous chromosomes occurs during:',o:['Prophase I','Metaphase I','Prophase II','Telophase II'],a:'Prophase I',e:'Homologous chromosomes pair by synapsis during zygotene of prophase I.'},{q:'Which event directly produces genetic recombination during meiosis?',o:['Crossing over','Cytokinesis','DNA replication only','Spindle formation'],a:'Crossing over',e:'Exchange of DNA segments between homologous chromosomes during crossing over creates new allele combinations.'}],
'Digestion and Absorption':[{q:'Which enzyme begins protein digestion in the stomach?',o:['Trypsin','Pepsin','Amylase','Lipase'],a:'Pepsin',e:'Pepsin is activated from pepsinogen in the acidic stomach and begins protein digestion.'},{q:'Bile is produced by the:',o:['Pancreas','Liver','Gall bladder','Small intestine'],a:'Liver',e:'The liver produces bile, which is stored and concentrated in the gall bladder.'},{q:'Most absorption of digested nutrients occurs in the:',o:['Stomach','Small intestine','Large intestine','Oesophagus'],a:'Small intestine',e:'The small intestine has villi and microvilli that provide a large surface area for absorption.'},{q:'The enzyme that digests starch in saliva is:',o:['Pepsin','Salivary amylase','Trypsin','Nuclease'],a:'Salivary amylase',e:'Salivary amylase, also called ptyalin, begins starch digestion in the mouth.'},{q:'Trypsinogen is activated into trypsin by:',o:['Pepsin','Enterokinase (enteropeptidase)','Bile salts','Amylase'],a:'Enterokinase (enteropeptidase)',e:'Enteropeptidase of the intestinal mucosa activates trypsinogen to trypsin.'},{q:'Which structure increases the absorptive surface area of the small intestine?',o:['Villi','Alveoli','Nephrons','Glomeruli'],a:'Villi',e:'Numerous intestinal villi, along with microvilli on enterocytes, greatly increase the surface area for absorption.'},{q:'Emulsification of fats is mainly performed by:',o:['Pepsin','Bile salts','Trypsin','Amylase'],a:'Bile salts',e:'Bile salts break large fat globules into smaller droplets, increasing the surface area available to lipase.'},{q:'The final products of carbohydrate digestion are mainly:',o:['Amino acids','Monosaccharides','Fatty acids only','Nucleotides'],a:'Monosaccharides',e:'Carbohydrates are ultimately digested to monosaccharides such as glucose, fructose and galactose.'},{q:'The end products of protein digestion are mainly:',o:['Amino acids','Glycerol','Monosaccharides','Nucleotides only'],a:'Amino acids',e:'Proteins are hydrolysed into amino acids, which are absorbed through the intestinal mucosa.'},{q:'Which hormone stimulates pancreatic bicarbonate secretion and helps neutralise acidic chyme?',o:['Secretin','Insulin','Thyroxine','Adrenaline'],a:'Secretin',e:'Secretin released from the duodenum stimulates pancreatic bicarbonate secretion to neutralise acidic chyme.'}]
};
const params=new URLSearchParams(location.search);const raw=params.get('chapter')||'What is Living';const chapter=raw==='What is Living?'?'What is Living?':raw;const data=tests[chapter]||tests['What is Living?'];document.getElementById('title').textContent=chapter+' — Chapter Test';document.getElementById('content').innerHTML=data.map((x,i)=>`<section class="q"><h2>Q${i+1}. ${x.q}</h2>${x.o.map((v,j)=>`<div class="opt"><strong>${String.fromCharCode(65+j)}.</strong> ${v}</div>`).join('')}<div class="answer">Correct Answer: ${x.a}</div><div class="explain">${x.e}</div></section>`).join('');</script></body></html>
