<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillUp NEET Zoology — Chapter Test</title><style>
:root{--bg:#f7f7f7;--card:#fff;--text:#18212f;--muted:#687385;--brand:#58cc02;--brand2:#46a302;--blue:#1cb0f6;--danger:#ff4b4b;--border:#e5e7eb;--shadow:0 3px 0 #d9dde3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.45}.wrap{max-width:720px;margin:auto;padding:18px 14px 42px}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--border);padding:12px 14px}.top{max-width:720px;margin:auto;display:flex;align-items:center;gap:10px}.mascot{width:42px;height:42px;flex:none}.headcopy{flex:1}h1{font-size:clamp(20px,5vw,30px);margin:0;font-weight:850}.muted{color:var(--muted);font-size:13px}.stats{display:flex;gap:7px;font-size:13px;font-weight:800;white-space:nowrap}.pill{background:#f1f3f5;border-radius:999px;padding:6px 8px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:12px auto 0;max-width:720px}.progress>i{display:block;height:100%;width:0;background:var(--brand);border-radius:999px;transition:width .25s ease}
.lesson{display:flex;align-items:center;gap:12px;margin:12px 0 16px}.lesson svg{width:74px;height:74px;flex:none}.q{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px 16px;margin:14px 0;box-shadow:0 2px 8px rgba(0,0,0,.04)}.q h2{font-size:20px;line-height:1.35;margin:0 0 18px}.qnum{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}.options{display:grid;gap:11px}.opt{position:relative;border:2px solid #dfe3e8;border-bottom-width:4px;border-radius:14px;padding:13px 14px;background:#fff;cursor:pointer;font-weight:700;transition:transform .08s,border-color .12s,background .12s}.opt:hover{border-color:#b8c0ca}.opt:active{transform:translateY(2px);border-bottom-width:2px}.opt.correct{border-color:var(--brand);background:#eaffd9}.opt.wrong{border-color:var(--danger);background:#ffe5e5}.letter{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;border-radius:9px;background:#f1f3f5;margin-right:8px;font-weight:900}.feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-weight:650}.feedback.show{display:block}.feedback.ok{background:#eaffd9;border:1px solid #b7e892}.feedback.no{background:#ffe5e5;border:1px solid #ffb3b3}.explain{margin-top:7px;color:#3c4655;font-weight:500}.next{display:none;width:100%;border:0;border-radius:14px;padding:14px;margin-top:12px;background:var(--brand);color:#fff;font-size:16px;font-weight:850;box-shadow:0 4px 0 var(--brand2);cursor:pointer}.next.show{display:block}.next:active{transform:translateY(2px);box-shadow:0 2px 0 var(--brand2)}.result{display:none;text-align:center;background:#fff;border:1px solid var(--border);border-radius:20px;padding:26px 18px;box-shadow:0 4px 12px rgba(0,0,0,.05)}.result.show{display:block}.score{font-size:42px;font-weight:900;margin:4px}.xp{color:#d99b00;font-weight:900}.back{display:inline-block;margin-top:18px;color:#315efb;text-decoration:none;font-weight:750}.hidden{display:none!important}@media(max-width:480px){.stats{font-size:12px}.pill{padding:5px 6px}.q{padding:18px 13px}.q h2{font-size:18px}.lesson svg{width:60px;height:60px}}
</style><style id="duo-css">body{background:#f7f7f7!important}.wrap{max-width:720px!important}.duo-head{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 14px}.duo-top{max-width:720px;margin:auto;display:flex;align-items:center;gap:10px}.duo-logo{width:42px;height:42px}.duo-copy{flex:1}#title{font-weight:850}.duo-stats{display:flex;gap:7px;font-size:13px;font-weight:800}.duo-pill{background:#f1f3f5;border-radius:999px;padding:6px 8px}.duo-progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;max-width:720px;margin:10px auto 0}.duo-progress i{display:block;height:100%;width:0;background:#58cc02;border-radius:999px;transition:width .25s}.duo-q{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px 16px;margin:18px 0;box-shadow:0 2px 8px rgba(0,0,0,.04)}.duo-num{font-size:12px;color:#687385;font-weight:800;text-transform:uppercase;margin-bottom:8px}.duo-q h2{font-size:20px;line-height:1.35}.duo-options{display:grid;gap:11px}.duo-opt{width:100%;text-align:left;border:2px solid #dfe3e8;border-bottom:4px solid #cfd4da;border-radius:14px;padding:13px;background:#fff;cursor:pointer;font-weight:700;font-size:15px}.duo-opt.correct{border-color:#58cc02;background:#eaffd9}.duo-opt.wrong{border-color:#ff4b4b;background:#ffe5e5}.duo-letter{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;border-radius:9px;background:#f1f3f5;margin-right:8px}.duo-feedback{display:none;margin-top:14px;padding:13px;border-radius:14px;font-weight:650}.duo-feedback.show{display:block}.duo-ok{background:#eaffd9;border:1px solid #b7e892}.duo-no{background:#ffe5e5;border:1px solid #ffb3b3}.duo-next{display:none;width:100%;border:0;border-radius:14px;padding:14px;margin-top:12px;background:#58cc02;color:#fff;font-size:16px;font-weight:850;box-shadow:0 4px 0 #46a302}.duo-next.show{display:block}.duo-result{text-align:center;background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:28px 18px;margin-top:18px}.duo-score{font-size:44px;font-weight:900}.duo-xp{color:#b77900;font-weight:900}</style></head><body><header><div class="top"><svg class="mascot" viewBox="0 0 64 64" aria-label="SkillUp mascot"><circle cx="32" cy="32" r="30" fill="#58cc02"/><circle cx="22" cy="27" r="5" fill="#fff"/><circle cx="42" cy="27" r="5" fill="#fff"/><circle cx="22" cy="27" r="2"/><circle cx="42" cy="27" r="2"/><path d="M24 40q8 7 16 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg><div class="headcopy"><h1 id="title">Zoology Chapter Test</h1><div class="muted">Learn • Practice • Master</div></div><div class="stats"><span class="pill">⭐ <b id="xp">0</b></span><span class="pill">🔥 <b id="streak">0</b></span></div></div><div class="progress"><i id="bar"></i></div></header><main class="wrap"><div id="content"></div></main><script>const tests={
'What is Living?':[{q:'Which property is most fundamental for recognising an organism as living?',o:['Metabolism','Colour','Shape','Size'],a:'Metabolism',e:'Metabolism is a defining characteristic of living organisms and occurs in all living cells.'},{q:'The sum total of all chemical reactions occurring in a living organism is called:',o:['Metabolism','Growth','Reproduction','Excretion'],a:'Metabolism',e:'Metabolism includes all anabolic and catabolic reactions taking place in a living system.'},{q:'Which process builds complex molecules from simpler molecules and generally requires energy?',o:['Anabolism','Catabolism','Diffusion','Excretion'],a:'Anabolism',e:'Anabolism is constructive metabolism in which simpler substances are converted into more complex molecules.'},{q:'Which process breaks complex molecules into simpler molecules and generally releases energy?',o:['Catabolism','Anabolism','Growth','Reproduction'],a:'Catabolism',e:'Catabolic reactions degrade complex molecules and commonly release usable energy.'},{q:'Which characteristic allows an organism to detect and respond to changes in its surroundings?',o:['Consciousness','Metabolism','Growth','Nutrition'],a:'Consciousness',e:'Consciousness in biology includes the ability to sense and respond to environmental stimuli.'},{q:'Which of the following is a defining feature of living organisms according to NCERT?',o:['Cellular organisation','Ability to move from place to place','Large body size','Green colour'],a:'Cellular organisation',e:'All living organisms show cellular organisation, although movement from place to place is not universal.'},{q:'Which statement about growth in living organisms is correct?',o:['It can occur through increase in cell number or cell size','It always occurs only by external addition','It occurs only in animals','It is absent in plants'],a:'It can occur through increase in cell number or cell size',e:'Living organisms commonly grow by internal increase in cell number and/or cell size.'},{q:'Growth in non-living objects such as crystals generally occurs by:',o:['External accumulation of material','Cell division','Metabolism','Reproduction'],a:'External accumulation of material',e:'Non-living objects can increase in size by accumulation of material on their surface, unlike biological growth.'},{q:'Why is reproduction not considered an all-inclusive defining property of living organisms?',o:['Some living organisms are sterile','Only plants reproduce','Reproduction occurs in crystals','Reproduction is never cellular'],a:'Some living organisms are sterile',e:'Individual organisms such as mules and some sterile worker bees do not reproduce, although they are living.'},{q:'Which statement best describes reproduction in living organisms?',o:['It produces new individuals and may be sexual or asexual','It is always sexual','It occurs only in multicellular organisms','It is a form of respiration'],a:'It produces new individuals and may be sexual or asexual',e:'Living organisms reproduce by sexual or asexual methods, depending on the organism.'},{q:'Which pair represents two major types of reproduction?',o:['Asexual and sexual','Anabolic and catabolic','Aerobic and anaerobic','Autotrophic and absorptive'],a:'Asexual and sexual',e:'Reproduction is broadly classified as asexual and sexual reproduction.'},{q:'Which statement about metabolism is correct?',o:['It is a defining feature of living systems','It occurs only during reproduction','It occurs only in plants','It is absent in microorganisms'],a:'It is a defining feature of living systems',e:'All living organisms carry out metabolic reactions, making metabolism a key defining feature of life.'},{q:'A set of isolated metabolic reactions outside a living cell is best described as:',o:['Not by itself a living system','A complete organism','A new species','A tissue'],a:'Not by itself a living system',e:'Metabolic reactions alone do not establish complete living organisation; living systems show integrated cellular processes.'},{q:'Which feature enables organisms to maintain internal coordination while interacting with their environment?',o:['Response to stimuli','Crystal formation','External accumulation','Rusting'],a:'Response to stimuli',e:'Living organisms detect stimuli and coordinate appropriate responses through their cellular systems.'},{q:'Which example best demonstrates response to a stimulus?',o:['A plant bending toward light','A crystal becoming larger','Iron rusting','Salt dissolving'],a:'A plant bending toward light',e:'Phototropic movement demonstrates a living organism responding to an environmental stimulus.'},{q:'Which statement about movement as a characteristic of life is correct?',o:['Movement may occur internally even when an organism does not locomote','All living organisms must locomote','Only animals move','Movement is unrelated to life'],a:'Movement may occur internally even when an organism does not locomote',e:'Plants show movements such as growth movements even though they are generally non-locomotory.'},{q:'Which of the following is an example of cellular organisation?',o:['Cells forming tissues and organs','A crystal growing layer by layer','A stone increasing in mass','A machine gaining fuel'],a:'Cells forming tissues and organs',e:'Living organisms are organised from cells, with higher organisms showing tissues, organs and organ systems.'},{q:'The basic structural and functional unit of life is the:',o:['Cell','Tissue','Organ','Organ system'],a:'Cell',e:'The cell is the basic structural and functional unit of living organisms.'},{q:'Which statement correctly distinguishes living growth from non-living growth?',o:['Living growth is generally internal and cellular','Living growth always occurs by surface deposition','Non-living growth requires mitosis','Non-living objects have metabolism'],a:'Living growth is generally internal and cellular',e:'Biological growth is associated with cellular processes, whereas non-living growth commonly results from external deposition.'},{q:'Which is an example of an organism that is living but normally sterile?',o:['Mule','Bacterium','Amoeba','Yeast'],a:'Mule',e:'A mule is a living organism but is generally sterile, illustrating why reproduction is not an essential property for every individual.'},{q:'Which characteristic is shared by bacteria and multicellular animals?',o:['Metabolism','Organ systems','Locomotion','Tissue organisation'],a:'Metabolism',e:'Both bacteria and animals are living organisms and perform metabolism, despite major differences in organisation.'},{q:'Which statement about consciousness in living organisms is most accurate?',o:['It includes the ability to sense and respond to environmental stimuli','It means only human self-awareness','It occurs only in animals','It is identical to reproduction'],a:'It includes the ability to sense and respond to environmental stimuli',e:'Biological consciousness includes awareness of and response to environmental changes and stimuli.'},{q:'Which of the following is not a universal characteristic of individual living organisms?',o:['Reproduction','Metabolism','Cellular organisation','Response to stimuli'],a:'Reproduction',e:'Some individual living organisms are sterile, so reproduction is not universal at the individual level.'},{q:'Which process is directly associated with obtaining and using energy in living cells?',o:['Metabolism','Taxonomy','Nomenclature','Classification'],a:'Metabolism',e:'Metabolic reactions transform matter and energy and support cellular activities.'},{q:'An organism maintaining coordinated internal activities in response to environmental changes demonstrates:',o:['Sensitivity and response','Crystal growth','External deposition','Non-cellular growth'],a:'Sensitivity and response',e:'Living organisms sense environmental changes and produce coordinated responses.'},{q:'Which example represents asexual reproduction?',o:['Binary fission in Amoeba','Fusion of gametes','Fertilisation','Meiosis followed by fertilisation'],a:'Binary fission in Amoeba',e:'Amoeba commonly reproduces asexually by binary fission, producing daughter individuals without gamete fusion.'},{q:'Which example represents sexual reproduction?',o:['Fusion of male and female gametes','Binary fission','Budding only','Fragmentation only'],a:'Fusion of male and female gametes',e:'Sexual reproduction involves formation and fusion of gametes, producing genetic variation.'},{q:'Which statement about living organisms is correct?',o:['They show organised, coordinated chemical reactions','They never exchange matter with surroundings','They are always capable of locomotion','They must all be multicellular'],a:'They show organised, coordinated chemical reactions',e:'Living systems maintain organisation through coordinated biochemical reactions and exchange matter and energy with their surroundings.'},{q:'Why is metabolism considered a defining feature of life?',o:['Living cells continuously perform integrated biochemical reactions','It occurs only outside cells','It is found only in crystals','It requires reproduction in every case'],a:'Living cells continuously perform integrated biochemical reactions',e:'Metabolism is a coordinated network of biochemical reactions essential for maintenance and functioning of living cells.'},{q:'Which observation most strongly supports that a seed is living even when it appears inactive?',o:['It resumes metabolic activity and germinates under suitable conditions','It increases by surface deposition','It has no cellular organisation','It cannot respond to any condition'],a:'It resumes metabolic activity and germinates under suitable conditions',e:'A dormant seed remains living and can resume metabolism, growth and development when suitable conditions are provided.'}],
'Biological Classification':[{q:'Who proposed the five-kingdom classification system?',o:['R.H. Whittaker','Carolus Linnaeus','Robert Hooke','Ernst Haeckel'],a:'R.H. Whittaker',e:'R.H. Whittaker proposed the five-kingdom classification in 1969: Monera, Protista, Fungi, Plantae and Animalia.'},{q:'Which criterion was central to Whittaker’s five-kingdom classification?',o:['Cell structure and organisation','Body colour','Habitat alone','Geographical distribution'],a:'Cell structure and organisation',e:'Whittaker considered cell structure, body organisation, mode of nutrition, reproduction and phylogenetic relationships.'},{q:'Organisms of kingdom Monera are:',o:['Prokaryotic','Always multicellular','Eukaryotic','Acellular'],a:'Prokaryotic',e:'Monerans are prokaryotes lacking a true nucleus and membrane-bound organelles.'},{q:'Which kingdom primarily contains unicellular eukaryotes?',o:['Monera','Protista','Plantae','Animalia'],a:'Protista',e:'Protista includes many unicellular eukaryotes such as Amoeba, Paramecium and Euglena.'},{q:'The cell wall of fungi is mainly made of:',o:['Cellulose','Chitin','Peptidoglycan','Silica'],a:'Chitin',e:'Fungal cell walls contain chitin, unlike the cellulose-rich cell walls of plants.'},{q:'Which organism belongs to kingdom Fungi?',o:['Amoeba','Saccharomyces','Nostoc','Paramecium'],a:'Saccharomyces',e:'Saccharomyces is a yeast and belongs to Fungi; Nostoc is a cyanobacterium and Amoeba and Paramecium are protists.'},{q:'Cyanobacteria are placed in Monera because they are:',o:['Prokaryotic photosynthetic organisms','Multicellular fungi','Unicellular animals','Eukaryotic algae'],a:'Prokaryotic photosynthetic organisms',e:'Cyanobacteria perform photosynthesis but have prokaryotic cellular organisation.'},{q:'Which mode of nutrition is characteristic of fungi?',o:['Absorptive heterotrophic nutrition','Holozoic nutrition only','Photoautotrophy only','Ingestion followed by internal digestion'],a:'Absorptive heterotrophic nutrition',e:'Fungi secrete digestive enzymes externally and absorb the resulting soluble nutrients.'},{q:'Which statement about viruses is correct?',o:['They are cellular prokaryotes','They are acellular infectious agents','They belong to Monera','They have independent metabolism outside hosts'],a:'They are acellular infectious agents',e:'Viruses are acellular infectious entities containing nucleic acid and a protein coat and depend on host cells for replication.'},{q:'Lichens represent an association between:',o:['Algae and fungi','Bacteria and viruses','Fungi and protozoans','Plants and animals'],a:'Algae and fungi',e:'A lichen consists of a photosynthetic partner, usually an alga or cyanobacterium, living in close association with a fungus.'},{"q":"Who proposed the five-kingdom classification system?","o":["R.H. Whittaker","Carolus Linnaeus","Ernst Haeckel","Robert Hooke"],"a":"R.H. Whittaker","e":"R.H. Whittaker proposed the five-kingdom classification in 1969 using criteria including cell structure, body organisation, mode of nutrition and reproduction."},{"q":"Which kingdom contains organisms that are fundamentally prokaryotic?","o":["Monera","Protista","Fungi","Animalia"],"a":"Monera","e":"Members of Monera are prokaryotic and lack a true nucleus and membrane-bound organelles."},{"q":"Which of the following is a characteristic feature of archaebacteria?","o":["They have unusual cell wall and membrane features","They always possess chloroplasts","They are multicellular animals","They lack DNA"],"a":"They have unusual cell wall and membrane features","e":"Archaebacteria have distinctive cell wall and membrane compositions that allow many species to survive extreme habitats."},{"q":"Methanogens are commonly found in the rumen of cattle and are important in production of:","o":["Oxygen","Biogas","Starch","Lactic acid"],"a":"Biogas","e":"Methanogenic archaebacteria produce methane during anaerobic decomposition and contribute to biogas formation."},{"q":"Cyanobacteria are also commonly called:","o":["Blue-green algae","Red algae","Brown algae","Golden algae"],"a":"Blue-green algae","e":"Cyanobacteria are photosynthetic prokaryotes historically called blue-green algae, although they are bacteria rather than true algae."},{"q":"Which cyanobacterium is commonly associated with nitrogen fixation?","o":["Nostoc","Amoeba","Paramecium","Saccharomyces"],"a":"Nostoc","e":"Nostoc contains specialised cells called heterocysts that can carry out nitrogen fixation."},{"q":"Which kingdom includes unicellular eukaryotic organisms such as Amoeba and Paramecium?","o":["Protista","Monera","Plantae","Animalia"],"a":"Protista","e":"Protista includes predominantly unicellular eukaryotes such as Amoeba, Paramecium and Euglena."},{"q":"Euglena is unusual because it can show both:","o":["Autotrophic and heterotrophic nutrition","Prokaryotic and viral organisation","Sexual and asexual reproduction only","Plant and animal tissues"],"a":"Autotrophic and heterotrophic nutrition","e":"Euglena can photosynthesise in light and obtain food heterotrophically under suitable conditions."},{"q":"Which group includes diatoms?","o":["Chrysophytes","Dinoflagellates","Slime moulds","Protozoans"],"a":"Chrysophytes","e":"Diatoms are photosynthetic protists placed under chrysophytes in the NCERT classification."},{"q":"The cell walls of diatoms are mainly composed of:","o":["Silica","Chitin","Peptidoglycan","Cellulose only"],"a":"Silica","e":"Diatom cell walls are impregnated with silica, making them resistant and durable."},{"q":"Red tides are commonly caused by blooms of:","o":["Dinoflagellates","Mosses","Fungi","Cyanophages"],"a":"Dinoflagellates","e":"Rapid multiplication of red-pigmented dinoflagellates can colour seawater reddish and produce red tides."},{"q":"Slime moulds are best described as:","o":["Saprophytic protists","Photosynthetic bacteria","Multicellular fungi only","Infectious viruses"],"a":"Saprophytic protists","e":"Slime moulds are saprophytic protists that feed on decaying organic matter and may form an aggregation during favourable conditions."},{"q":"The cell wall of fungi is primarily made of:","o":["Chitin","Cellulose","Peptidoglycan","Silica"],"a":"Chitin","e":"Fungal cell walls contain chitin, a structural polysaccharide distinct from plant cellulose."},{"q":"Fungi obtain nutrition mainly by:","o":["Absorption after extracellular digestion","Ingestion of solid food","Photosynthesis","Chemosynthesis only"],"a":"Absorption after extracellular digestion","e":"Fungi secrete enzymes onto the substrate and absorb the soluble products of digestion."},{"q":"Which fungal group includes Rhizopus and Mucor in the traditional NCERT classification?","o":["Phycomycetes","Ascomycetes","Basidiomycetes","Deuteromycetes"],"a":"Phycomycetes","e":"Rhizopus and Mucor are examples traditionally placed in Phycomycetes in NCERT's five-kingdom discussion."},{"q":"Yeast belongs to which fungal group in the traditional NCERT classification?","o":["Ascomycetes","Phycomycetes","Basidiomycetes","Deuteromycetes only"],"a":"Ascomycetes","e":"Saccharomyces, the common yeast, is an example of Ascomycetes and reproduces commonly by budding."},{"q":"Which statement about viruses is correct?","o":["They are acellular and replicate inside host cells","They are independent cellular organisms","They always possess cytoplasm","They carry out independent metabolism outside hosts"],"a":"They are acellular and replicate inside host cells","e":"Viruses are acellular infectious agents and depend on host cellular machinery for replication."},{"q":"The genetic material of a virus may be:","o":["DNA or RNA","Only DNA","Only RNA","Always both DNA and RNA"],"a":"DNA or RNA","e":"A virus contains either DNA or RNA as its genetic material, enclosed by a protein coat and sometimes an envelope."},{"q":"Lichens represent a symbiotic association between:","o":["Alga or cyanobacterium and fungus","Virus and bacterium","Protozoan and animal","Plant and insect"],"a":"Alga or cyanobacterium and fungus","e":"The photosynthetic partner supplies carbohydrates while the fungal partner provides shelter, water and minerals."},{"q":"Which statement is most appropriate for NEET questions on biological classification?","o":["Classification is based on a single character","Modern classification considers multiple characteristics and evolutionary relationships","All microorganisms are placed in Monera","Viruses are cellular organisms"],"a":"Modern classification considers multiple characteristics and evolutionary relationships","e":"Classification systems use combinations of cellular, structural, nutritional, reproductive and evolutionary characteristics rather than a single feature."},{"q":"In Whittaker's five-kingdom classification, which criterion is primarily used to distinguish Monera from Protista?","o":["Cell type","Mode of locomotion","Body colour","Habitat only"],"a":"Cell type","e":"Monera consists of prokaryotic organisms, whereas Protista consists mainly of unicellular eukaryotes."},{"q":"Which organism is correctly matched with its kingdom?","o":["Nostoc — Monera","Amoeba — Fungi","Yeast — Monera","Paramecium — Plantae"],"a":"Nostoc — Monera","e":"Nostoc is a cyanobacterium and therefore a prokaryote placed in Monera in the five-kingdom system."},{"q":"Which group of organisms lacks a membrane-bound nucleus?","o":["Monerans","Protists","Fungi","Plants"],"a":"Monerans","e":"Monerans are prokaryotic and lack a true membrane-bound nucleus."},{"q":"Halophiles, thermoacidophiles and methanogens are examples of:","o":["Archaebacteria","Cyanobacteria","Protozoans","Fungi"],"a":"Archaebacteria","e":"These groups of archaebacteria possess specialised adaptations that allow survival in extreme environments."},{"q":"Methanogens in the rumen of cattle mainly help in the formation of:","o":["Biogas rich in methane","Oxygen","Protein crystals","Silica"],"a":"Biogas rich in methane","e":"Methanogens produce methane under anaerobic conditions and are important in biogas production."},{"q":"Which structure in many cyanobacteria is associated with nitrogen fixation?","o":["Heterocyst","Capsule only","Contractile vacuole","Basidium"],"a":"Heterocyst","e":"Specialised heterocysts provide a suitable environment for nitrogen fixation in cyanobacteria such as Nostoc and Anabaena."},{"q":"Which statement about Protista is correct?","o":["It contains predominantly unicellular eukaryotes","All members are prokaryotic","All members are multicellular animals","It contains only fungi"],"a":"It contains predominantly unicellular eukaryotes","e":"Protista includes unicellular eukaryotes such as Amoeba, Paramecium, Euglena and many algae-like forms."},{"q":"Which protist is known for both photosynthetic and heterotrophic nutrition?","o":["Euglena","Amoeba","Plasmodium","Paramecium"],"a":"Euglena","e":"Euglena can photosynthesise in light and can obtain organic nutrients heterotrophically when required."},{"q":"Diatoms are important primary producers mainly found in:","o":["Aquatic environments","Deserts only","Dry rocks only","Animal tissues"],"a":"Aquatic environments","e":"Diatoms are photosynthetic organisms and form an important component of aquatic phytoplankton."},{"q":"Diatomaceous earth is formed largely from the accumulated remains of:","o":["Diatoms","Mosses","Mammals","Viruses"],"a":"Diatoms","e":"The silica-rich walls of dead diatoms accumulate over long periods to form diatomaceous earth."},{"q":"Which protist group is associated with red tides?","o":["Dinoflagellates","Diatoms","Slime moulds","Protozoan ciliates"],"a":"Dinoflagellates","e":"Blooms of certain red-pigmented dinoflagellates can produce red tides in marine waters."},{"q":"Which characteristic is typical of slime moulds?","o":["They feed on decaying organic matter","They possess chloroplasts in every stage","They are prokaryotic","They are viruses"],"a":"They feed on decaying organic matter","e":"Slime moulds are saprophytic protists that obtain nutrients from decaying organic material."},{"q":"Which combination is correctly associated with fungi?","o":["Chitinous cell wall and absorptive nutrition","Cellulose wall and photosynthesis","Peptidoglycan wall and chemosynthesis","Silica wall and ingestion"],"a":"Chitinous cell wall and absorptive nutrition","e":"Fungal walls contain chitin and fungi generally digest food extracellularly before absorbing soluble nutrients."},{"q":"Which fungal structure primarily increases the surface area for nutrient absorption?","o":["Hyphae","Flagella","Cilia","Capsid"],"a":"Hyphae","e":"The network of fungal hyphae forms mycelium, providing extensive surface area for absorption from the substrate."},{"q":"Budding is a common method of asexual reproduction in:","o":["Yeast","Diatoms","Viruses","Methanogens"],"a":"Yeast","e":"Yeast such as Saccharomyces commonly reproduces asexually by budding."},{"q":"Which fungal group traditionally includes mushrooms such as Agaricus?","o":["Basidiomycetes","Phycomycetes","Ascomycetes","Monera"],"a":"Basidiomycetes","e":"Mushrooms such as Agaricus are traditionally classified under Basidiomycetes, which produce basidiospores on basidia."},{"q":"A virus is considered acellular because it lacks:","o":["Cellular organisation","Genetic material","A protein coat","Specific host interactions"],"a":"Cellular organisation","e":"Viruses consist of genetic material surrounded by a protein coat, with some having an envelope, but they do not have cellular organisation."},{"q":"Which statement correctly compares viruses and bacteria?","o":["Viruses require host cells for replication, whereas bacteria are cellular organisms","Both are always acellular","Both possess membrane-bound nuclei","Viruses independently carry out cellular respiration"],"a":"Viruses require host cells for replication, whereas bacteria are cellular organisms","e":"Viruses depend on host machinery for replication, while bacteria are living cellular organisms capable of independent metabolism."},{"q":"In lichens, the photosynthetic partner mainly provides:","o":["Organic food","Only mechanical support","A viral capsid","Chitin"],"a":"Organic food","e":"The algal or cyanobacterial partner performs photosynthesis and provides organic nutrients to the association."},{"q":"Which sequence correctly represents increasing cellular complexity?","o":["Monera → Protista → multicellular eukaryotes","Protista → Monera → viruses","Fungi → Monera → viruses","Viruses → Monera → non-living crystals"],"a":"Monera → Protista → multicellular eukaryotes","e":"Monera are prokaryotic; Protista are mainly unicellular eukaryotes; Plantae, Fungi and Animalia contain multicellular eukaryotic forms."}],
'Animal Kingdom':[{q:'Which feature is characteristic of members of kingdom Animalia?',o:['Cell walls','Multicellularity and heterotrophic nutrition','Chlorophyll in all cells','Prokaryotic organisation'],a:'Multicellularity and heterotrophic nutrition',e:'Animals are multicellular eukaryotes that obtain nutrition heterotrophically by ingestion; their cells lack cell walls.'},{q:'Animals with radial symmetry can be divided into similar halves through:',o:['Only one longitudinal plane','Any plane passing through the central axis','Only a transverse plane','No plane'],a:'Any plane passing through the central axis',e:'In radial symmetry, similar halves can be obtained by any plane passing through the central oral-aboral axis.'},{q:'Which phylum is characterised by a water canal system?',o:['Porifera','Annelida','Arthropoda','Chordata'],a:'Porifera',e:'Sponges possess a characteristic water canal system through which water enters via ostia and exits through the osculum.'},{q:'Cnidoblasts or stinging cells are characteristic of:',o:['Porifera','Cnidaria','Platyhelminthes','Mollusca'],a:'Cnidaria',e:'Cnidarians possess specialised stinging cells called cnidoblasts or cnidocytes, used for defence and capturing prey.'},{q:'Which phylum includes organisms that are dorsoventrally flattened and commonly called flatworms?',o:['Platyhelminthes','Aschelminthes','Annelida','Echinodermata'],a:'Platyhelminthes',e:'Platyhelminthes are bilaterally symmetrical, triploblastic and dorsoventrally flattened animals.'},{q:'Pseudocoelom is characteristic of:',o:['Platyhelminthes','Aschelminthes','Annelida','Chordata'],a:'Aschelminthes',e:'Aschelminthes (roundworms) possess a pseudocoel, a body cavity not completely lined by mesoderm.'},{q:'True metameric segmentation is well developed in:',o:['Annelida','Porifera','Cnidaria','Mollusca'],a:'Annelida',e:'Annelids show true metamerism, in which the body is externally and internally divided into repeated segments.'},{q:'Which phylum is the largest in the animal kingdom?',o:['Mollusca','Arthropoda','Annelida','Chordata'],a:'Arthropoda',e:'Arthropoda is the largest animal phylum and includes insects, crustaceans, arachnids and myriapods.'},{q:'Water vascular system is a characteristic feature of:',o:['Mollusca','Echinodermata','Arthropoda','Hemichordata'],a:'Echinodermata',e:'Echinoderms possess a water vascular system involved in locomotion, feeding and respiration.'},{q:'Which feature distinguishes chordates from non-chordates?',o:['Presence of a notochord at least during development','Presence of a digestive tract','Multicellularity','Heterotrophic nutrition'],a:'Presence of a notochord at least during development',e:'Chordates are defined by features including a notochord, dorsal hollow nerve cord, pharyngeal slits and post-anal tail at some stage.'}],
'Structural Organisation in Animals':[{q:'Which tissue primarily covers body surfaces and lines internal organs?',o:['Connective tissue','Epithelial tissue','Muscular tissue','Nervous tissue'],a:'Epithelial tissue',e:'Epithelial tissue forms protective coverings and linings, including the skin surface and the lining of many internal organs and cavities.'},{q:'Which epithelial tissue is best suited for diffusion, such as in alveoli?',o:['Simple squamous epithelium','Stratified squamous epithelium','Cuboidal epithelium','Columnar epithelium'],a:'Simple squamous epithelium',e:'Simple squamous epithelium is a single thin layer of cells that permits rapid diffusion and filtration; it lines alveoli and blood vessels.'},{q:'The main function of ciliated epithelium in the respiratory tract is to:',o:['Secrete digestive enzymes','Move mucus and trapped particles','Store fat','Contract the intestine'],a:'Move mucus and trapped particles',e:'Ciliated epithelial cells beat their cilia to move mucus and trapped foreign particles toward the pharynx.'},{q:'Which connective tissue stores fat and acts as an energy reserve?',o:['Areolar tissue','Adipose tissue','Cartilage','Bone'],a:'Adipose tissue',e:'Adipose tissue contains adipocytes filled with lipid and serves as an energy reserve, insulation and cushioning tissue.'},{q:'Which tissue connects muscle to bone?',o:['Ligament','Tendon','Cartilage','Areolar tissue'],a:'Tendon',e:'Tendons are strong fibrous connective tissues that attach skeletal muscles to bones.'},{q:'Which connective tissue connects bone to bone?',o:['Tendon','Ligament','Adipose tissue','Blood'],a:'Ligament',e:'Ligaments are elastic connective tissue bands that connect bones at joints and help stabilise them.'},{q:'Intercalated discs are characteristic of:',o:['Skeletal muscle','Smooth muscle','Cardiac muscle','Nervous tissue'],a:'Cardiac muscle',e:'Cardiac muscle cells are joined by intercalated discs, which facilitate coordinated contraction of the heart.'},{q:'Which muscle tissue is involuntary and non-striated?',o:['Skeletal muscle','Smooth muscle','Cardiac muscle','Voluntary muscle'],a:'Smooth muscle',e:'Smooth muscle lacks visible striations and contracts involuntarily; it occurs in the walls of organs such as the intestine and blood vessels.'},{q:'Which part of a neuron receives impulses from other neurons?',o:['Axon','Dendrite','Myelin sheath','Axon terminal only'],a:'Dendrite',e:'Dendrites are branched neuronal processes specialised mainly for receiving signals and conducting them toward the cell body.'},{q:'Which tissue is responsible for conduction of nerve impulses?',o:['Epithelial tissue','Connective tissue','Muscular tissue','Nervous tissue'],a:'Nervous tissue',e:'Nervous tissue contains neurons specialised to receive stimuli and transmit electrical signals, with supporting neuroglial cells.'}],
'Cell: The Unit of Life':[{q:'Which organelle is known as the powerhouse of the cell?',o:['Golgi apparatus','Mitochondrion','Lysosome','Ribosome'],a:'Mitochondrion',e:'Mitochondria generate ATP through aerobic respiration and are therefore commonly called the powerhouse of the cell.'},{q:'The fluid mosaic model describes the structure of the:',o:['Cell wall','Plasma membrane','Nucleus','Ribosome'],a:'Plasma membrane',e:'The plasma membrane is a dynamic phospholipid bilayer with embedded proteins, described by the fluid mosaic model.'},{q:'Which organelle is directly associated with protein synthesis?',o:['Ribosome','Lysosome','Vacuole','Centrosome'],a:'Ribosome',e:'Ribosomes translate messenger RNA and assemble amino acids into polypeptide chains.'},{q:'The nucleolus is primarily involved in the formation of:',o:['Lipids','Ribosomal subunits','ATP','Lysosomes'],a:'Ribosomal subunits',e:'The nucleolus synthesises rRNA and assembles ribosomal subunits.'},{q:'Which organelle contains hydrolytic enzymes for intracellular digestion?',o:['Lysosome','Peroxisome','Ribosome','Centrosome'],a:'Lysosome',e:'Lysosomes contain hydrolytic enzymes that digest macromolecules and worn-out cellular components.'},{q:'Which cell organelle is bounded by a double membrane and contains its own DNA?',o:['Mitochondrion','Golgi apparatus','Lysosome','Endoplasmic reticulum'],a:'Mitochondrion',e:'Mitochondria are double-membrane organelles containing circular DNA and ribosomes.'},{q:'Rough endoplasmic reticulum is distinguished by the presence of:',o:['Chlorophyll','Ribosomes','Centrioles','Cellulose'],a:'Ribosomes',e:'Rough ER has ribosomes attached to its cytosolic surface and is important in synthesis of secretory and membrane proteins.'},{q:'Which structure is present in plant cells but absent in typical animal cells?',o:['Mitochondrion','Plasma membrane','Cell wall','Ribosome'],a:'Cell wall',e:'Plant cells possess a cellulose-rich cell wall outside the plasma membrane; typical animal cells do not.'},{q:'The Golgi apparatus is mainly involved in:',o:['Modification and packaging of biomolecules','DNA replication','ATP synthesis','Chromosome movement'],a:'Modification and packaging of biomolecules',e:'The Golgi apparatus modifies, sorts and packages proteins and lipids for transport or secretion.'},{q:'Centrioles are typically present in:',o:['Animal cells','Mature sieve tubes only','Bacterial cells','All plant cells'],a:'Animal cells',e:'Centrioles occur in the centrosome of most animal cells and participate in spindle organisation during cell division.'}],
'Biomolecules':[{q:'The monomers of proteins are:',o:['Monosaccharides','Amino acids','Nucleotides','Fatty acids'],a:'Amino acids',e:'Proteins are polymers of amino acids linked by peptide bonds.'},{q:'Which carbohydrate is a storage polysaccharide in animals?',o:['Cellulose','Glycogen','Chitin','Sucrose'],a:'Glycogen',e:'Animals store excess glucose mainly as glycogen, particularly in liver and skeletal muscles.'},{q:'A nucleotide is composed of:',o:['Sugar, phosphate and nitrogenous base','Amino acid and phosphate','Glycerol and fatty acids','Only a nitrogenous base'],a:'Sugar, phosphate and nitrogenous base',e:'A nucleotide contains a pentose sugar, phosphate group and nitrogenous base.'},{q:'The bond linking two amino acids is called:',o:['Glycosidic bond','Peptide bond','Phosphodiester bond','Hydrogen bond'],a:'Peptide bond',e:'A peptide bond forms between the carboxyl group of one amino acid and amino group of another.'},{q:'Which biomolecule is generally insoluble in water and includes fats and oils?',o:['Lipid','Protein','Nucleic acid','Polysaccharide'],a:'Lipid',e:'Lipids are largely hydrophobic biomolecules that include fats, oils, phospholipids and steroids.'},{q:'Which nitrogenous base is found in RNA but not DNA?',o:['Thymine','Uracil','Cytosine','Guanine'],a:'Uracil',e:'RNA contains uracil in place of the thymine found in DNA.'},{q:'Enzymes are mostly:',o:['Proteins','Lipids','Carbohydrates','Mineral salts'],a:'Proteins',e:'Most enzymes are proteins, although a small number of catalytic RNA molecules called ribozymes also exist.'},{q:'Which polysaccharide forms the structural component of plant cell walls?',o:['Glycogen','Cellulose','Starch','Sucrose'],a:'Cellulose',e:'Cellulose is a structural polysaccharide composed of β-glucose units and forms plant cell walls.'},{q:'The secondary structure of proteins is stabilised mainly by:',o:['Peptide bonds only','Hydrogen bonds','Glycosidic bonds','Phosphodiester bonds'],a:'Hydrogen bonds',e:'α-helices and β-pleated sheets are stabilised mainly by hydrogen bonding between peptide backbone groups.'},{q:'DNA and RNA are classified as:',o:['Nucleic acids','Lipids','Proteins','Polysaccharides'],a:'Nucleic acids',e:'DNA and RNA are polymers of nucleotides and are collectively called nucleic acids.'}],
'Cell Cycle and Cell Division':[{q:'During which phase does DNA replication occur?',o:['G1 phase','S phase','G2 phase','M phase'],a:'S phase',e:'DNA synthesis occurs during the S or synthesis phase of interphase.'},{q:'Chromosomes are aligned at the equatorial plate during:',o:['Prophase','Metaphase','Anaphase','Telophase'],a:'Metaphase',e:'In metaphase, chromosomes are arranged at the equatorial plate before sister chromatids separate.'},{q:'Separation of sister chromatids occurs during:',o:['Prophase','Metaphase','Anaphase','Interphase'],a:'Anaphase',e:'Centromeres split during anaphase and sister chromatids move toward opposite poles.'},{q:'Meiosis results in the formation of cells with:',o:['The same chromosome number','Half the chromosome number','Double the chromosome number','No chromosomes'],a:'Half the chromosome number',e:'Meiosis is a reduction division that produces haploid cells from a diploid parent cell.'},{q:'Crossing over occurs during:',o:['Prophase I of meiosis','Metaphase II','Anaphase II','Telophase I'],a:'Prophase I of meiosis',e:'Crossing over between homologous chromosomes occurs during pachytene of prophase I.'},{q:'The longest phase of the cell cycle is generally:',o:['Interphase','Metaphase','Anaphase','Telophase'],a:'Interphase',e:'Interphase occupies most of the cell cycle and includes G1, S and G2 phases.'},{q:'Cytokinesis in animal cells occurs by formation of a:',o:['Cell plate','Cleavage furrow','Phragmoplast','Middle lamella'],a:'Cleavage furrow',e:'Animal cells divide their cytoplasm by constriction of a cleavage furrow.'},{q:'The major significance of mitosis is:',o:['Reduction of chromosome number','Growth and maintenance with genetic continuity','Formation of gametes only','Crossing over'],a:'Growth and maintenance with genetic continuity',e:'Mitosis produces genetically similar daughter cells and supports growth, repair and replacement.'},{q:'Synapsis of homologous chromosomes occurs during:',o:['Prophase I','Metaphase I','Prophase II','Telophase II'],a:'Prophase I',e:'Homologous chromosomes pair by synapsis during zygotene of prophase I.'},{q:'Which event directly produces genetic recombination during meiosis?',o:['Crossing over','Cytokinesis','DNA replication only','Spindle formation'],a:'Crossing over',e:'Exchange of DNA segments between homologous chromosomes during crossing over creates new allele combinations.'}],
'Digestion and Absorption':[{q:'Which enzyme begins protein digestion in the stomach?',o:['Trypsin','Pepsin','Amylase','Lipase'],a:'Pepsin',e:'Pepsin is activated from pepsinogen in the acidic stomach and begins protein digestion.'},{q:'Bile is produced by the:',o:['Pancreas','Liver','Gall bladder','Small intestine'],a:'Liver',e:'The liver produces bile, which is stored and concentrated in the gall bladder.'},{q:'Most absorption of digested nutrients occurs in the:',o:['Stomach','Small intestine','Large intestine','Oesophagus'],a:'Small intestine',e:'The small intestine has villi and microvilli that provide a large surface area for absorption.'},{q:'The enzyme that digests starch in saliva is:',o:['Pepsin','Salivary amylase','Trypsin','Nuclease'],a:'Salivary amylase',e:'Salivary amylase, also called ptyalin, begins starch digestion in the mouth.'},{q:'Trypsinogen is activated into trypsin by:',o:['Pepsin','Enterokinase (enteropeptidase)','Bile salts','Amylase'],a:'Enterokinase (enteropeptidase)',e:'Enteropeptidase of the intestinal mucosa activates trypsinogen to trypsin.'},{q:'Which structure increases the absorptive surface area of the small intestine?',o:['Villi','Alveoli','Nephrons','Glomeruli'],a:'Villi',e:'Numerous intestinal villi, along with microvilli on enterocytes, greatly increase the surface area for absorption.'},{q:'Emulsification of fats is mainly performed by:',o:['Pepsin','Bile salts','Trypsin','Amylase'],a:'Bile salts',e:'Bile salts break large fat globules into smaller droplets, increasing the surface area available to lipase.'},{q:'The final products of carbohydrate digestion are mainly:',o:['Amino acids','Monosaccharides','Fatty acids only','Nucleotides'],a:'Monosaccharides',e:'Carbohydrates are ultimately digested to monosaccharides such as glucose, fructose and galactose.'},{q:'The end products of protein digestion are mainly:',o:['Amino acids','Glycerol','Monosaccharides','Nucleotides only'],a:'Amino acids',e:'Proteins are hydrolysed into amino acids, which are absorbed through the intestinal mucosa.'},{q:'Which hormone stimulates pancreatic bicarbonate secretion and helps neutralise acidic chyme?',o:['Secretin','Insulin','Thyroxine','Adrenaline'],a:'Secretin',e:'Secretin released from the duodenum stimulates pancreatic bicarbonate secretion to neutralise acidic chyme.'}]\n'Animal Morphology & Anatomy':[{q:'The body of a cockroach is divided into:',o:['Head, thorax and abdomen','Head and abdomen only','Cephalothorax and abdomen','Thorax and tail'],a:'Head, thorax and abdomen',e:'Cockroach shows distinct head, thorax and abdomen. The thorax bears the legs and wings, while the abdomen contains most visceral organs.'},{q:'How many pairs of walking legs are present in a cockroach?',o:['Two','Three','Four','Five'],a:'Three',e:'Each of the three thoracic segments bears one pair of walking legs, giving the cockroach three pairs of legs.'},{q:'The head of a cockroach is formed by the fusion of:',o:['Six segments','Three segments','Two segments','Ten segments'],a:'Six segments',e:'The cockroach head is formed by fusion of six segments and bears antennae, compound eyes and mouthparts.'},{q:'The compound eyes of a cockroach are located on the:',o:['Thorax','Abdomen','Head','Legs'],a:'Head',e:'A pair of large sessile compound eyes is present on the head. Each eye contains numerous ommatidia.'},{q:'The thorax of a cockroach consists of:',o:['Prothorax, mesothorax and metathorax','Head, prothorax and abdomen','Mesothorax and abdomen only','Three abdominal segments'],a:'Prothorax, mesothorax and metathorax',e:'The thorax has three segments. Each bears a pair of legs; mesothorax and metathorax also bear wings.'},{q:'Which thoracic segment bears the first pair of wings in a cockroach?',o:['Prothorax','Mesothorax','Metathorax','Abdomen'],a:'Mesothorax',e:'The leathery forewings or tegmina arise from the mesothorax. The membranous hindwings arise from the metathorax.'},{q:'The second pair of wings in cockroach is mainly used for:',o:['Protection of the abdomen','Flight','Digestion','Sensing chemicals'],a:'Flight',e:'The hindwings are membranous and are the principal wings used during flight. The forewings mainly protect them.'},{q:'The respiratory organs of a cockroach are:',o:['Gills','Lungs','Tracheae','Nephridia'],a:'Tracheae',e:'Cockroaches respire through a tracheal system. Air enters and leaves through paired spiracles on the thorax and abdomen.'},{q:'The excretory structures of cockroach are:',o:['Nephridia','Malpighian tubules','Flame cells','Green glands'],a:'Malpighian tubules',e:'Malpighian tubules remove nitrogenous wastes from haemolymph and open into the alimentary canal at the junction of midgut and hindgut.'},{q:'The circulatory system of cockroach is:',o:['Closed and double','Open','Closed and single','Absent'],a:'Open',e:'Cockroach has an open circulatory system. Haemolymph flows through the haemocoel and is not confined to blood vessels throughout its circulation.'},{q:'Which type of blood pigment is present in cockroach haemolymph?',o:['Haemoglobin','Haemocyanin','No respiratory pigment','Chlorocruorin'],a:'No respiratory pigment',e:'Cockroach haemolymph generally lacks a respiratory pigment because oxygen is delivered directly to tissues through the tracheal system.'},{q:'The alimentary canal of cockroach is divided into:',o:['Foregut, midgut and hindgut','Mouth, stomach and intestine only','Crop and rectum only','Pharynx, gizzard and cloaca only'],a:'Foregut, midgut and hindgut',e:'The cockroach alimentary canal has foregut, midgut and hindgut regions with specialised parts for ingestion, digestion, absorption and faecal elimination.'},{q:'The crop in cockroach primarily functions in:',o:['Storage of food','Absorption of oxygen','Formation of urine','Blood circulation'],a:'Storage of food',e:'The crop is a dilated part of the foregut that temporarily stores food.'},{q:'The gizzard of cockroach mainly helps in:',o:['Mechanical grinding of food','Gas exchange','Urine storage','Blood pumping'],a:'Mechanical grinding of food',e:'The gizzard or proventriculus has a thick muscular wall and chitinous teeth that help grind food.'},{q:'Which part of the cockroach gut is mainly responsible for enzymatic digestion and absorption?',o:['Foregut','Midgut','Rectum','Anal styles'],a:'Midgut',e:'The midgut is the major site of enzymatic digestion and absorption. Gastric caeca contribute digestive secretions and increase absorptive surface.'},{q:'Cockroach has how many pairs of spiracles?',o:['Five','Eight','Ten','Twelve'],a:'Ten',e:'Cockroach has ten pairs of spiracles: two pairs are thoracic and eight pairs are abdominal.'},{q:'The nervous system of cockroach includes:',o:['A brain and a ventral nerve cord with ganglia','Only a dorsal brain','Only a spinal cord','A diffuse nerve net only'],a:'A brain and a ventral nerve cord with ganglia',e:'The nervous system consists of a supra-oesophageal ganglion or brain, sub-oesophageal ganglion and a double ventral nerve cord with segmental ganglia.'},{q:'The antennae of cockroach primarily function as:',o:['Sensory organs','Digestive organs','Excretory organs','Respiratory organs'],a:'Sensory organs',e:'Cockroach antennae are highly sensitive and detect touch, odour and other environmental cues.'},{q:'Cockroach is described as dioecious because:',o:['Male and female sexes occur in separate individuals','It reproduces only asexually','It changes sex during life','Both sexes occur in one individual'],a:'Male and female sexes occur in separate individuals',e:'Cockroach is dioecious, meaning male and female reproductive organs occur in separate individuals.'},{q:'The male reproductive system of cockroach includes a pair of:',o:['Testes','Ovaries','Spermathecae','Uterine glands'],a:'Testes',e:'The male cockroach has a pair of testes located in the fourth to sixth abdominal segments, along with ducts and accessory structures.'},{q:'The female cockroach possesses how many ovaries?',o:['One','Two','Three','Four'],a:'Two',e:'A female cockroach has a pair of ovaries. Each ovary consists of a group of ovarioles.'},{q:'The female reproductive structure that stores sperm after mating is the:',o:['Spermatheca','Seminal vesicle','Testis','Malpighian tubule'],a:'Spermatheca',e:'Spermathecae store sperm received during copulation and allow fertilisation of eggs later.'},{q:'The egg case of cockroach is called:',o:['Ootheca','Cocoon','Pupa','Spermatophore'],a:'Ootheca',e:'Eggs are enclosed in a capsule called an ootheca. It protects the eggs during development.'},{q:'Which appendages are attached to the thorax of cockroach?',o:['Three pairs of legs and two pairs of wings','Two pairs of legs only','One pair of wings only','Four pairs of legs'],a:'Three pairs of legs and two pairs of wings',e:'The thorax bears three pairs of walking legs and two pairs of wings, with wings attached to the mesothorax and metathorax.'},{q:'The body cavity of cockroach is a:',o:['True coelom','Haemocoel','Pseudocoel','Gastrovascular cavity'],a:'Haemocoel',e:'Cockroach has an open circulatory system and a haemocoel in which the internal organs are bathed by haemolymph.'},{q:'Which statement best describes cockroach development?',o:['It is direct with no nymphal stage','It is paurometabolous with egg, nymph and adult stages','It includes a larva and pupa','It occurs only by budding'],a:'It is paurometabolous with egg, nymph and adult stages',e:'Cockroach shows incomplete metamorphosis. The nymph resembles the adult but lacks fully developed wings and reproductive organs.'}]\n
