<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="SkillUp NEET Zoology — complete chapter path with chapter tests.">
<title>SkillUp NEET Zoology — Full Zoology Path</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#172033;--muted:#667085;--brand:#315efb;--border:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.5}
header{padding:32px 18px;text-align:center;background:linear-gradient(135deg,#eef3ff,#fff)}h1{margin:0 0 8px;font-size:clamp(28px,6vw,46px)}header p{margin:0;color:var(--muted)}
main{max-width:1050px;margin:auto;padding:22px 16px 48px}.section{margin:24px 0}.section h2{font-size:24px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.chapter{display:block;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;text-decoration:none;color:inherit;transition:.15s}.chapter:hover{transform:translateY(-2px);border-color:var(--brand);box-shadow:0 6px 20px #0000000d}.num{font-size:12px;color:var(--brand);font-weight:700;text-transform:uppercase}.title{font-weight:750;margin-top:4px}.test{display:inline-block;margin-top:10px;color:var(--brand);font-size:14px;font-weight:650}.note{padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--muted)}
</style>
</head>
<body>
<header><h1>NEET Zoology</h1><p>Complete Zoology chapter path • Chapter-wise tests</p></header>
<main>
<div class="note">Choose a chapter to open its dedicated test page. Tests use the SkillUp Question → Options → Correct Answer → Specific Explanation format.</div>
<section class="section"><h2>Class 11 Biology — Zoology</h2><div class="grid" id="class11"></div></section>
<section class="section"><h2>Class 12 Biology — Zoology</h2><div class="grid" id="class12"></div></section>
</main>
<script>
const class11=[
['01','What is Living'],['02','Biological Classification'],['03','Animal Kingdom'],['04','Structural Organisation in Animals'],['05','Cell: The Unit of Life'],['06','Biomolecules'],['07','Cell Cycle and Cell Division'],['08','Digestion and Absorption'],['09','Breathing and Exchange of Gases'],['10','Body Fluids and Circulation'],['11','Excretory Products and their Elimination'],['12','Locomotion and Movement'],['13','Neural Control and Coordination'],['14','Chemical Coordination and Integration']
];
const class12=[
['01','Human Reproduction'],['02','Reproductive Health'],['03','Principles of Inheritance and Variation'],['04','Molecular Basis of Inheritance'],['05','Evolution'],['06','Human Health and Disease'],['07','Strategies for Enhancement in Food Production'],['08','Microbes in Human Welfare']
];
function render(id,items){document.getElementById(id).innerHTML=items.map(([n,t])=>`<a class="chapter" href="zoology-chapter-test.html?chapter=${encodeURIComponent(t)}"><div class="num">Chapter ${n}</div><div class="title">${t}</div><span class="test">Open chapter test →</span></a>`).join('')}
render('class11',class11);render('class12',class12);
</script>
</body>
</html>
