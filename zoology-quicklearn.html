<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7fbff">
<meta name="description" content="Topic-wise Zoology questions, answers and explanations.">
<title>Zoology Quick Learn | SkillUp</title>
<style>
:root{--ink:#19365b;--muted:#526782;--line:#dce6f2;--blue:#1cb0f6;--blue-dark:#148ac3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f5f9ff;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid #e6ebf2}
.nav{width:min(100% - 24px,720px);min-height:55px;margin:auto;display:flex;align-items:center;gap:10px}
.back{width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;border:2px solid #dce8f5;border-radius:12px;background:#f2f7ff;color:#315a9b;text-decoration:none;font-size:20px;font-weight:900}
.brand{font-size:17px;font-weight:950;color:#19365b}.brand span{color:#2376c9}
.page-switch{flex:0 0 auto;padding:8px 11px;border:1px solid #c8e1ec;border-radius:10px;background:#eaf8ff;color:#17698c;text-decoration:none;font-size:12px;font-weight:900;white-space:nowrap}
.page-switch:focus-visible{outline:2px solid #1cb0f6;outline-offset:2px}
main{width:min(100% - 24px,720px);margin:auto;padding:18px 0 32px}
.topic{margin:0 0 14px;padding:15px 17px;border:2px solid #dbe8fa;border-bottom:5px solid #cdddf4;border-radius:18px;background:linear-gradient(120deg,#fff,#eaf6ff)}
.eyebrow{font-size:10px;font-weight:950;letter-spacing:.8px;color:#3865a4;text-transform:uppercase}
h1{margin:4px 0 0;font-size:clamp(21px,4vw,27px);line-height:1.25}
.card{padding:19px;border:2px solid #e3e8ef;border-bottom:5px solid #d9e0e9;border-radius:20px;background:#fff}
.card-label{margin:0 0 12px;color:#7954d8;font-size:11px;font-weight:950;letter-spacing:.6px;text-transform:uppercase}
.question{margin:0;font-size:clamp(20px,4vw,26px);line-height:1.35;letter-spacing:-.25px;color:#1c3658}
.reveal{width:100%;min-height:45px;margin-top:18px;padding:9px 12px;border:2px solid #dce4ed;border-bottom:4px solid #cbd6e2;border-radius:12px;background:#fff;color:#000;font-size:14px;font-weight:900;cursor:pointer}
.reveal:active{transform:translateY(2px)}
.explanation{display:none;margin-top:13px;padding:14px;border:2px solid #cde5f5;border-radius:13px;background:#f0f9ff;color:#19365b;font-size:14px;line-height:1.6}
.explanation.show{display:block}
.answer{margin:0 0 8px;font-weight:900;color:#174d79}
.explanation-text{margin:0}
.controls{display:flex;gap:9px;margin-top:15px}
.controls button{flex:1;min-height:36px;padding:6px 9px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-size:12px;font-weight:900;box-shadow:0 3px 0 var(--blue-dark);cursor:pointer}
.controls button:disabled{background:#e5e5e5;color:#a6a6a6;box-shadow:0 3px 0 #d0d0d0;cursor:not-allowed}
.status{padding:13px;border:2px solid #f1d5a7;border-radius:12px;background:#fff8e9;color:#795b2d;font-size:13px;line-height:1.5}
@media(max-width:520px){main{padding:13px 0 26px}.topic{padding:13px 14px}.card{padding:16px 14px;border-radius:17px}.question{font-size:20px}.reveal{min-height:43px;font-size:13px}.explanation{font-size:13px}.controls button{min-height:34px;font-size:11px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="nav"><a class="back" id="backQuiz" href="zoology-mcq.html" aria-label="Back to Zoology quiz">←</a><div class="brand">SkillUp <span>Zoology</span></div><a class="page-switch" id="quizNavLink" href="zoology-mcq.html" aria-label="Open Quiz Simulator">🎯 Quiz</a></div></header>
<main>
<section class="topic"><div class="eyebrow">Quick Learn</div><h1 id="topicTitle">Zoology Quick Learn</h1></section>
<section class="card" id="learnCard">
<p class="card-label" id="cardLabel">QUESTION 1</p>
<h2 class="question" id="question">Loading question…</h2>
<button class="reveal" id="reveal" type="button">👀 Reveal answer &amp; explanation</button>
<div class="explanation" id="explanation" aria-live="polite"><p class="answer" id="answerText"></p><p class="explanation-text" id="explanationText"></p></div>
<div class="controls"><button id="previous" type="button" disabled>← Previous</button><button id="next" type="button">Next →</button></div>
</section>
</main>
<script>
(function(){
'use strict';
const params=new URLSearchParams(location.search),topic=(params.get('concept')||'').trim(),conceptId=params.get('conceptId')||'';
const conceptUrl=encodeURIComponent(topic)+(conceptId?'&conceptId='+encodeURIComponent(conceptId):'');
const slug=s=>String(s||'').toLowerCase().replace(/&/g,' and ').replace(/[’']/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const norm=s=>String(s||'').replace(/([a-z])([A-Z])/g,'$1 $2').toLowerCase().replace(/\band\b/g,'').replace(/[^a-z0-9]/g,'');
function bankFileForTopic(value,id){
 const s=slug(value);
 if(s==='enzymes')return 'zoology-enzymes-question-bank.js';
 if(s==='biodiversity'&&id==='zoo-'+encodeURIComponent('Ecology and Environment')+'--'+encodeURIComponent('Biodiversity'))return 'biodiversity-patterns-question-bank.js';
 if(s==='biodiversity')return 'biodiversity-question-bank.js';
 if(s==='taxonomy-and-systematics')return 'taxonomy-and-systematics-question-bank.js';
 if(s==='darwins-natural-selection')return 'darwin-natural-selection-question-bank.js';
 return s+'-question-bank.js';
}
const BANK_GLOBALS={
 'dna-and-rna-question-bank.js':'skillUpDNAandRNAQuestions',
 'diploblastic-and-triploblastic-organisation-question-bank.js':'skillUpDiploblasticTriploblasticQuestions',
 'zoology-enzymes-question-bank.js':'skillUpZoologyEnzymesQuestions',
 'biodiversity-question-bank.js':'skillUpBiodiversityQuestions',
 'biodiversity-patterns-question-bank.js':'skillUpBiodiversityPatternsQuestions',
 'taxonomy-and-systematics-question-bank.js':'skillUpTaxonomySystematicsQuestions',
 'darwin-natural-selection-question-bank.js':'skillUpDarwinsNaturalSelectionQuestions'
};
function findBank(file,scope){
 const expected=BANK_GLOBALS[file];
 if(expected)return Array.isArray(scope[expected])&&scope[expected].length?scope[expected]:null;
 const token=norm(file.replace(/-question-bank\.js$/i,''));
 const name=Object.keys(scope).find(key=>/^skillUp.*Questions$/.test(key)&&norm(key.replace(/^skillUp/,'').replace(/Questions$/,'')).includes(token));
 const value=name?scope[name]:null;
 return Array.isArray(value)&&value.length?value:null;
}
function answerIndex(item){
 const opts=Array.isArray(item.o)?item.o:[];
 let idx=typeof item.a==='number'?item.a:opts.indexOf(item.a);
 if(!Number.isInteger(idx)||idx<0||idx>=opts.length){
  const raw=String(item.a??'').trim();
  if(/^[A-D]$/i.test(raw))idx=raw.toUpperCase().charCodeAt(0)-65;
  else idx=opts.findIndex(option=>String(option).trim().toLowerCase()===raw.toLowerCase());
 }
 return Number.isInteger(idx)&&idx>=0&&idx<opts.length?idx:-1;
}
document.getElementById('topicTitle').textContent=topic||'Zoology Quick Learn';
document.title=(topic||'Zoology')+' | Quick Learn | SkillUp';
document.getElementById('backQuiz').href='zoology-mcq.html?concept='+conceptUrl;
document.getElementById('quizNavLink').href='zoology-mcq.html?concept='+conceptUrl;
let bank=null,index=0;
const $=id=>document.getElementById(id);
function render(){
 const item=bank[index],opts=Array.isArray(item.o)?item.o:[],correct=answerIndex(item);
 $('cardLabel').textContent='QUESTION '+(index+1)+' OF '+bank.length;
 $('question').textContent=item.q||'Question unavailable';
 $('answerText').textContent=correct>=0?'Correct answer: '+opts[correct]:'Answer unavailable';
 $('explanationText').textContent=item.e||'No explanation is available for this question.';
 $('explanation').classList.remove('show');
 $('reveal').textContent='👀 Reveal answer & explanation';
 $('previous').disabled=index===0;
 $('next').textContent=index===bank.length-1?'Finish':'Next →';
}
$('reveal').addEventListener('click',()=>{
 const open=$('explanation').classList.toggle('show');
 $('reveal').textContent=open?'🙈 Hide explanation':'👀 Reveal answer & explanation';
});
$('previous').addEventListener('click',()=>{if(index>0){index--;render();}});
$('next').addEventListener('click',()=>{if(index<bank.length-1){index++;render();}else{index=0;render();$('cardLabel').textContent='REVIEW COMPLETE · START AGAIN';}});
if(!topic){$('learnCard').innerHTML='<div class="status">Select a Zoology concept from the Zoology path or open Quick Learn from a topic quiz.</div>';return;}
const file=bankFileForTopic(topic,conceptId),script=document.createElement('script');
script.src='/question-banks/'+file+'?v=20261126-quicklearn-question-explanation-v1';
script.onload=()=>{bank=findBank(file,window);if(bank){bank=bank.slice(0,30);render();}else{$('learnCard').innerHTML='<div class="status">The selected topic bank could not be matched. Return to the quiz and try again.</div>'; $('cardLabel').textContent='CONTENT UNAVAILABLE';}};
script.onerror=()=>{$('learnCard').innerHTML='<div class="status">The question bank for this concept is not available yet.</div>'; $('cardLabel').textContent='CONTENT UNAVAILABLE';};
document.head.appendChild(script);
})();
</script>
<script src="/shared-nav.js?v=20261125-central-design-system-v2"></script>
</body></html>
